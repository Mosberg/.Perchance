<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>moss-code-assistent — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<div id="app" style="font-family: Arial, sans-serif; max-width: 1200px; margin: 0 auto; padding: 20px;">
  <!-- Header Section -->
  <header style="text-align: center; margin-bottom: 30px;">
    <h1 style="font-size: 2.5em; margin-bottom: 10px;">AI Coding Assistant Generator</h1>
    <p style="color: #666;">Create custom AI coding assistants with plugins and advanced features</p>
  </header>

  <!-- Main Control Panel -->
  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px;">
    <!-- Assistant Configuration -->
    <div style="background: #f8f9fa; padding: 20px; border-radius: 8px; border: 1px solid #ddd;">
      <h2 style="margin-top: 0;">Assistant Configuration</h2>
      
      <div style="margin-bottom: 15px;">
        <label style="display: block; margin-bottom: 5px;">Assistant Name</label>
        <input type="text" id="assistantNameEl" placeholder="My Coding Assistant" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
      </div>
      
      <div style="margin-bottom: 15px;">
        <label style="display: block; margin-bottom: 5px;">Programming Language</label>
        <select id="languageSelectEl" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
          <option value="python">Python</option>
          <option value="javascript">JavaScript</option>
          <option value="java">Java</option>
          <option value="csharp">C#</option>
          <option value="cpp">C++</option>
          <option value="rust">Rust</option>
          <option value="go">Go</option>
          <option value="typescript">TypeScript</option>
        </select>
      </div>
      
      <div style="margin-bottom: 15px;">
        <label style="display: block; margin-bottom: 5px;">Expertise Level</label>
        <select id="expertiseLevelEl" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
          <option value="beginner">Beginner</option>
          <option value="intermediate">Intermediate</option>
          <option value="advanced">Advanced</option>
          <option value="expert">Expert</option>
        </select>
      </div>
      
      <div style="margin-bottom: 15px;">
        <label style="display: block; margin-bottom: 5px;">Assistant Personality</label>
        <textarea id="personalityEl" placeholder="Describe the assistant's personality..." style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; min-height: 80px;"></textarea>
      </div>
    </div>

    <!-- Plugin Management -->
    <div style="background: #f8f9fa; padding: 20px; border-radius: 8px; border: 1px solid #ddd;">
      <h2 style="margin-top: 0;">Plugin Management</h2>
      
      <div id="pluginListEl" style="margin-bottom: 15px; max-height: 250px; overflow-y: auto;">
        <!-- Plugins will be dynamically added here -->
      </div>
      
      <button onclick="addNewPlugin()" style="background: #4285f4; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; width: 100%;">
        + Add New Plugin
      </button>
    </div>
  </div>

  <!-- Advanced Settings -->
  <div style="background: #f0f4f8; padding: 20px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 30px;">
    <h2 style="margin-top: 0;">Advanced Settings</h2>
    
    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px;">
      <div>
        <label style="display: block; margin-bottom: 5px;">Code Completion</label>
        <select id="codeCompletionEl" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
          <option value="aggressive">Aggressive</option>
          <option value="balanced">Balanced</option>
          <option value="conservative">Conservative</option>
        </select>
      </div>
      
      <div>
        <label style="display: block; margin-bottom: 5px;">Explanation Detail</label>
        <select id="explanationDetailEl" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
          <option value="basic">Basic</option>
          <option value="detailed">Detailed</option>
          <option value="comprehensive">Comprehensive</option>
        </select>
      </div>
      
      <div>
        <label style="display: block; margin-bottom: 5px;">Error Handling</label>
        <select id="errorHandlingEl" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
          <option value="strict">Strict</option>
          <option value="moderate">Moderate</option>
          <option value="lenient">Lenient</option>
        </select>
      </div>
    </div>
    
    <div style="margin-top: 15px;">
      <label style="display: block; margin-bottom: 5px;">Custom Instructions</label>
      <textarea id="customInstructionsEl" placeholder="Enter any custom instructions for the AI..." style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; min-height: 80px;"></textarea>
    </div>
  </div>

  <!-- Action Buttons -->
  <div style="text-align: center; margin-bottom: 30px;">
    <button onclick="generateAssistant()" style="background: #34a853; color: white; border: none; padding: 12px 25px; border-radius: 4px; cursor: pointer; font-size: 16px; margin-right: 10px;">
      Generate Assistant
    </button>
    <button onclick="previewAssistant()" style="background: #4285f4; color: white; border: none; padding: 12px 25px; border-radius: 4px; cursor: pointer; font-size: 16px; margin-right: 10px;">
      Preview Configuration
    </button>
    <button onclick="exportConfiguration()" style="background: #fbbc05; color: white; border: none; padding: 12px 25px; border-radius: 4px; cursor: pointer; font-size: 16px;">
      Export Configuration
    </button>
  </div>

  <!-- Output Area -->
  <div id="outputSectionEl" style="background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 20px; margin-bottom: 30px; display: none;">
    <h2>Generated Assistant</h2>
    <div id="assistantOutputEl" style="padding: 15px; background: #f8f9fa; border-radius: 6px; min-height: 150px; white-space: pre-wrap;"></div>
  </div>

  <!-- Preview Modal -->
  <div id="previewModalEl" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000;">
    <div style="position: relative; background: white; width: 80%; max-width: 800px; margin: 50px auto; padding: 30px; border-radius: 10px; max-height: 80vh; overflow-y: auto;">
      <span onclick="closePreview()" style="position: absolute; top: 10px; right: 15px; font-size: 24px; cursor: pointer;">&times;</span>
      <h2>Assistant Preview</h2>
      <div id="previewContentEl"></div>
    </div>
  </div>

  <!-- Plugin Modal -->
  <div id="pluginModalEl" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000;">
    <div style="position: relative; background: white; width: 80%; max-width: 600px; margin: 50px auto; padding: 30px; border-radius: 10px;">
      <span onclick="closePluginModal()" style="position: absolute; top: 10px; right: 15px; font-size: 24px; cursor: pointer;">&times;</span>
      <h2>Add New Plugin</h2>
      
      <div style="margin-bottom: 15px;">
        <label style="display: block; margin-bottom: 5px;">Plugin Name</label>
        <input type="text" id="pluginNameEl" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
      </div>
      
      <div style="margin-bottom: 15px;">
        <label style="display: block; margin-bottom: 5px;">Plugin Description</label>
        <textarea id="pluginDescriptionEl" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; min-height: 80px;"></textarea>
      </div>
      
      <div style="margin-bottom: 15px;">
        <label style="display: block; margin-bottom: 5px;">Plugin Function</label>
        <select id="pluginFunctionEl" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
          <option value="codeGeneration">Code Generation</option>
          <option value="codeOptimization">Code Optimization</option>
          <option value="bugDetection">Bug Detection</option>
          <option value="documentation">Documentation</option>
          <option value="testing">Testing</option>
          <option value="custom">Custom Function</option>
        </select>
      </div>
      
      <button onclick="savePlugin()" style="background: #34a853; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; width: 100%;">
        Save Plugin
      </button>
    </div>
  </div>

  <script type="module">
    // Access global functions through root object in module scripts
    const generateText = root.generateText;
    
    // Available plugins
    let availablePlugins = [
      { id: 1, name: "Code Explainer", description: "Explains code functionality", function: "documentation", enabled: true },
      { id: 2, name: "Bug Finder", description: "Detects potential bugs", function: "bugDetection", enabled: true },
      { id: 3, name: "Performance Optimizer", description: "Optimizes code performance", function: "codeOptimization", enabled: false },
      { id: 4, name: "Test Case Generator", description: "Generates test cases", function: "testing", enabled: true },
      { id: 5, name: "Code Refactorer", description: "Refactors code for better structure", function: "codeOptimization", enabled: false }
    ];

    // Initialize the app
    function init() {
      renderPlugins();
    }

    // Render available plugins
    function renderPlugins() {
      const pluginList = document.getElementById('pluginListEl');
      pluginList.innerHTML = '';
      
      availablePlugins.forEach(plugin => {
        const pluginDiv = document.createElement('div');
        pluginDiv.style.marginBottom = '10px';
        pluginDiv.innerHTML = `
          <div style="display: flex; align-items: center; justify-content: space-between; background: white; padding: 10px; border-radius: 6px; border: 1px solid #eee;">
            <div>
              <strong>${plugin.name}</strong>
              <div style="font-size: 0.9em; color: #666;">${plugin.description}</div>
            </div>
            <div>
              <label style="display: inline-flex; align-items: center;">
                <input type="checkbox" ${plugin.enabled ? 'checked' : ''} onchange="togglePlugin(${plugin.id})" style="margin-right: 5px;">
                Enabled
              </label>
              <button onclick="removePlugin(${plugin.id})" style="background: #ea4335; color: white; border: none; padding: 5px 8px; border-radius: 4px; cursor: pointer; margin-left: 10px;">Remove</button>
            </div>
          </div>
        `;
        pluginList.appendChild(pluginDiv);
      });
    }

    // Toggle plugin enabled state
    function togglePlugin(pluginId) {
      const plugin = availablePlugins.find(p => p.id === pluginId);
      if (plugin) {
        plugin.enabled = !plugin.enabled;
      }
    }

    // Remove plugin
    function removePlugin(pluginId) {
      availablePlugins = availablePlugins.filter(p => p.id !== pluginId);
      renderPlugins();
    }

    // Add new plugin
    function addNewPlugin() {
      document.getElementById('pluginModalEl').style.display = 'block';
    }

    // Close plugin modal
    function closePluginModal() {
      document.getElementById('pluginModalEl').style.display = 'none';
    }

    // Save plugin
    function savePlugin() {
      const name = document.getElementById('pluginNameEl').value;
      const description = document.getElementById('pluginDescriptionEl').value;
      const func = document.getElementById('pluginFunctionEl').value;
      
      if (name && description) {
        const newPlugin = {
          id: Date.now(),
          name: name,
          description: description,
          function: func,
          enabled: true
        };
        
        availablePlugins.push(newPlugin);
        renderPlugins();
        closePluginModal();
        
        // Clear form
        document.getElementById('pluginNameEl').value = '';
        document.getElementById('pluginDescriptionEl').value = '';
        document.getElementById('pluginFunctionEl').selectedIndex = 0;
      } else {
        alert('Please fill in all fields');
      }
    }

    // Generate assistant
    async function generateAssistant() {
      const name = document.getElementById('assistantNameEl').value || 'AI Coding Assistant';
      const language = document.getElementById('languageSelectEl').value;
      const expertise = document.getElementById('expertiseLevelEl').value;
      const personality = document.getElementById('personalityEl').value;
      const codeCompletion = document.getElementById('codeCompletionEl').value;
      const explanationDetail = document.getElementById('explanationDetailEl').value;
      const errorHandling = document.getElementById('errorHandlingEl').value;
      const customInstructions = document.getElementById('customInstructionsEl').value;
      
      const enabledPlugins = availablePlugins.filter(p => p.enabled);
      
      // Create configuration object
      const config = {
        name,
        language,
        expertise,
        personality,
        codeCompletion,
        explanationDetail,
        errorHandling,
        customInstructions,
        plugins: enabledPlugins
      };
      
      // Generate prompt for AI
      let prompt = `Create a detailed description of an AI coding assistant with the following configuration:\n\n`;
      prompt += `Name: ${name}\n`;
      prompt += `Primary Language: ${language}\n`;
      prompt += `Expertise Level: ${expertise}\n`;
      prompt += `Personality: ${personality || "Helpful and knowledgeable"}\n`;
      prompt += `Code Completion Style: ${codeCompletion}\n`;
      prompt += `Explanation Detail: ${explanationDetail}\n`;
      prompt += `Error Handling Approach: ${errorHandling}\n\n`;
      
      if (customInstructions) {
        prompt += `Custom Instructions: ${customInstructions}\n\n`;
      }
      
      prompt += `Enabled Plugins:\n`;
      enabledPlugins.forEach(plugin => {
        prompt += `- ${plugin.name}: ${plugin.description}\n`;
      });
      
      prompt += `\n\nProvide a comprehensive description of this AI coding assistant, including its capabilities, how it interacts with users, and how the plugins enhance its functionality.`;
      
      // Show loading
      const outputSection = document.getElementById('outputSectionEl');
      const assistantOutput = document.getElementById('assistantOutputEl');
      outputSection.style.display = 'block';
      assistantOutput.textContent = 'Generating your AI coding assistant...';
      
      // Generate text
      assistantOutput.innerHTML = generateText(prompt);
    }

    // Preview configuration
    function previewAssistant() {
      const name = document.getElementById('assistantNameEl').value || 'AI Coding Assistant';
      const language = document.getElementById('languageSelectEl').value;
      const expertise = document.getElementById('expertiseLevelEl').value;
      const enabledPlugins = availablePlugins.filter(p => p.enabled);
      
      let previewContent = `
        <div style="margin-bottom: 20px;">
          <h3>${name}</h3>
          <p><strong>Language:</strong> ${language.charAt(0).toUpperCase() + language.slice(1)}</p>
          <p><strong>Expertise Level:</strong> ${expertise.charAt(0).toUpperCase() + expertise.slice(1)}</p>
        </div>
        
        <div style="margin-bottom: 20px;">
          <h4>Enabled Plugins (${enabledPlugins.length})</h4>
          <ul>
      `;
      
      enabledPlugins.forEach(plugin => {
        previewContent += `<li><strong>${plugin.name}:</strong> ${plugin.description}</li>`;
      });
      
      previewContent += `
          </ul>
        </div>
        
        <div>
          <h4>Configuration Summary</h4>
          <p>Your AI coding assistant is ready to help with ${language} programming tasks at the ${expertise} level.</p>
          <p>It includes ${enabledPlugins.length} specialized plugins to enhance its capabilities.</p>
        </div>
      `;
      
      document.getElementById('previewContentEl').innerHTML = previewContent;
      document.getElementById('previewModalEl').style.display = 'block';
    }

    // Close preview modal
    function closePreview() {
      document.getElementById('previewModalEl').style.display = 'none';
    }

    // Export configuration
    function exportConfiguration() {
      const name = document.getElementById('assistantNameEl').value || 'AI Coding Assistant';
      const language = document.getElementById('languageSelectEl').value;
      const expertise = document.getElementById('expertiseLevelEl').value;
      const personality = document.getElementById('personalityEl').value;
      const codeCompletion = document.getElementById('codeCompletionEl').value;
      const explanationDetail = document.getElementById('explanationDetailEl').value;
      const errorHandling = document.getElementById('errorHandlingEl').value;
      const customInstructions = document.getElementById('customInstructionsEl').value;
      const enabledPlugins = availablePlugins.filter(p => p.enabled);
      
      const config = {
        name,
        language,
        expertise,
        personality,
        codeCompletion,
        explanationDetail,
        errorHandling,
        customInstructions,
        plugins: enabledPlugins,
        createdAt: new Date().toISOString()
      };
      
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(config, null, 2));
      const downloadAnchorNode = document.createElement('a');
      downloadAnchorNode.setAttribute("href", dataStr);
      downloadAnchorNode.setAttribute("download", `${name.replace(/\s+/g, '_')}_config.json`);
      document.body.appendChild(downloadAnchorNode);
      downloadAnchorNode.click();
      downloadAnchorNode.remove();
    }

    // Export functions to window so they can be called from HTML
    window.addNewPlugin = addNewPlugin;
    window.closePluginModal = closePluginModal;
    window.savePlugin = savePlugin;
    window.generateAssistant = generateAssistant;
    window.previewAssistant = previewAssistant;
    window.closePreview = closePreview;
    window.exportConfiguration = exportConfiguration;
    window.togglePlugin = togglePlugin;
    window.removePlugin = removePlugin;

    // Initialize on load
    init();
  </script>
</div>
</body>
</html>
