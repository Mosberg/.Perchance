<style>

  .chat-controls { display: flex; gap: 8px; margin-bottom: 12px; }
  .chat-controls input {
    flex: 1;
    background: rgba(8,10,20,0.8);

    border: 1px solid var(--border-rune);
    padding: 11px 13px;

  .btn-send {

    border: 1px solid #4a7a3a;

    border-radius: 5px;
    cursor: pointer;
    font-family: 'Cinzel', serif;
    letter-spacing: 1px; font-size: 13px;

  .btn-draw {

  }
  .auto-toggle {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; color: var(--text-dim);

  .modal {

    background: linear-gradient(180deg, #1c2236, #121624);

  .modal-content .btn-save { background: linear-gradient(180deg, #2a2418, #181208); color: var(--gold); border-color: var(--gold-soft); }
  .modal-content .btn-close { background: linear-gradient(180deg, #3a1a1a, #2a1010); color: #f0a0a0; border-color: #6a2a2a; }

  .rune-divider {
    text-align: center; color: var(--gold-soft);
    letter-spacing: 10px; margin: 16px 0;
    opacity: 0.5; font-size: 15px;
  }
</style>

<h2><span class="crest">⚔</span> หอเวทย์แห่งตำนาน</h2>

<div id="userCard" class="user-card">
  <div class="user-card-head">
    <span class="user-avatar">🧙</span>
    <div>
      <div class="user-name-row"><input id="userName" class="user-input name" value="ผู้กล้านิรนาม" placeholder="ชื่อคุณ"></div>
      <div class="user-sub">ตัวตนของคุณ — AI จะใช้ข้อมูลนี้คิดบทพูดแทนคุณ</div>
    </div>
  </div>
  <input id="userBio" class="user-input" placeholder="ประวัติ / นิสัยของคุณ" value="นักเดินทางผู้สงสัยในตำนาน ชอบถามคำถาม เปิดใจง่าย มีความอยากรู้อยากเห็นสูง">
  <input id="userPrompt" class="user-input" placeholder="คำบรรยายภาพตัวคุณ (อังกฤษ)" value="A curious hooded traveler, worn cloak, glowing amulet, fantasy portrait">
</div>

<button class="btn-primary" onclick="openModal()">➕ อัญเชิญวิญญาณใหม่</button>

<div id="charButtons"></div>
<div class="rune-divider">✦ ✦ ✦</div>
<div id="charDetailsContainer"></div>

<script>
(() => {
  const fields = ['name', 'bio', 'prompt'];
  const list = [
    { name: "ศิลา", bio: "นักดาบพเนจรผู้สูญเสียความทรงจำ ดาบของเขาหักครึ่งแต่ยังคมกริบ ส่วนใหญ่เงียบขรึม แต่จู่ๆ ก็พึมพำกับตัวเอง", prompt: "A brooding samurai with a broken katana, dramatic moonlight, dark fantasy illustration" },
    { name: "รินทร์", bio: "จอมเวทย์ฝึกหัดจากสถาบันมนตรา คทาของเธอเรืองแสงสีฟ้า ขี้สงสัย ชอบทดลองเวทมนตร์ใหม่ๆ จนเกินตัว", prompt: "A young mage with a glowing blue staff, arcane runes, fantasy concept art" },
    { name: "เอลาร่า", bio: "เอลฟ์พรานป่าสีผมเงินยาวถึงเอว ตาสองสีเขียวมรกต-ทอง มองเห็นในความมืด ปากแข็งแต่หัวใจอ่อน แอบกลัวไฟ มีนกเค้าแมวเวทย์ชื่อ 'มูน' เป็นเพื่อนคู่ใจ เกลียดการถูกสัมผัส", prompt: "A beautiful silver-haired elf ranger with heterochromia green-gold eyes, holding a moonwood bow, mystical owl companion, enchanted forest, detailed fantasy portrait" },
    { name: "เซเรนา", bio: "นักฆ่ารับจ้างวัย 22 ผมสั้นดำปิดตาซ้าย แผลเป็นเป็นเส้นตรงบนแก้ม สวมเกราะหนังดำ ใช้มีดคู่คม เย็นชา พูดน้อย แต่ลึกๆ ห่วงคนอื่นเสมอ แอบชอบของหวานทุกชนิด", prompt: "A deadly female assassin with short black hair covering one eye, facial scar, black leather armor, twin daggers, brooding beauty, moonlit rooftop, dark fantasy portrait" },
    { name: "ลีนา", bio: "นักเล่นแร่แปรธาตุผมแดงเป็นลอนสะท้อนแสง ตาอำพันสุกใส เต็มไปด้วยความมั่นใจและรอยยิ้มซน กระเป๋าเต็มขวดแก้วระเบิดสีสันต่างๆ ชอบคำนวณทุกอย่างเป็นตัวเลข พูดเร็ว หัวเราะง่าย มีแมวเหมียวส้มชื่อ 'ฟลักซ์'", prompt: "A cheerful red-haired alchemist with amber eyes, leather apron full of glowing potion bottles, mischievous smile, orange cat companion, cozy cluttered workshop, warm fantasy illustration" },
    { name: "อายาเมะ", bio: "นักบวชหญิงแห่งวิหารแสงจันทร์ ผมขาวยาวถักเปีย ตาม่วงอ่อน สวมชุดขาวทอเงิน มีรอยสักรูปดวงจันทร์ครึ่งซีกบนหน้าผาก รักสันติ แต่สาปแช่งได้รุนแรงเมื่อโกรธ แอบชอบร้องเพลงเก่าๆ ตอนไม่มีใคร", prompt: "A serene moon priestess with long white braided hair, soft violet eyes, white and silver robes, crescent moon forehead tattoo, glowing lunar magic, temple of moonlight, ethereal fantasy portrait" },
    { name: "คาสซานดรา", bio: "อัศวินหญิงผมทองถักเปีย ตาฟ้าคม สูง 175 ซม. รูปร่างกำยำ สวมเกราะเงินมีตรามังกร เก่งดาบยาว ตรงไปตรงมา จริงใจเกินไปจนดูซื่อ เคยแพ้การประลองครั้งเดียวในชีวิตและยังนึกถึงมันอยู่", prompt: "A noble female knight with golden braided hair, sharp blue eyes, silver dragon-crest armor, tall athletic build, longsword, noble posture, castle courtyard, heroic fantasy portrait" }
  ];

  const busy = {};
  const logs = {};
  const IDLE_MIN = 15000, IDLE_MAX = 25000;
  let activeIndex = null;
  let idleTimer = null;
  const autoTimers = {};

  const clearAuto = (index) => {
    if (autoTimers[index]) { clearTimeout(autoTimers[index]); autoTimers[index] = null; }
  };
  const scheduleAuto = (index) => {
    clearAuto(index);
    const delay = IDLE_MIN + Math.random() * (IDLE_MAX - IDLE_MIN);
    autoTimers[index] = setTimeout(() => onAutoTick(index), delay);
  };
  const onAutoToggle = (index) => {
    const checked = document.getElementById(`auto-${index}`).checked;
    if (checked) {
      scheduleAuto(index);
    } else {
      clearAuto(index);
    }
  };
  window.onAutoToggle = onAutoToggle;

  const onAutoTick = async (index) => {
    autoTimers[index] = null;
    const cb = document.getElementById(`auto-${index}`);
    if (!cb || !cb.checked) return;
    if (busy[index]) { scheduleAuto(index); return; }
    await autoPlayerTurn(index);
    if (cb.checked) scheduleAuto(index);
  };

  const getUserProfile = () => ({
    name: (document.getElementById('userName')?.value || '').trim() || 'ผู้กล้า',
    bio: (document.getElementById('userBio')?.value || '').trim(),
    prompt: (document.getElementById('userPrompt')?.value || '').trim()
  });

  const autoPlayerTurn = async (index) => {
    const char = list[index];
    const user = getUserProfile();
    const history = logText(index);
    busy[index] = true;
    setStatus(index, `กำลังคิดบทพูดของ ${user.name}...`);
    let playerText = "";
    try {
      const res = await root.generateText({
        instruction:
          `คุณกำลังเล่นเกมโรลเพลย์แฟนตาซี\n` +
          `ผู้เล่น (ฝั่งคุณ): "${user.name}" — ${user.bio || 'ผู้กล้านิรนาม'}\n` +
          `ตัวละครคู่สนทนา: "${char.name}" — ${char.bio}\n` +
          `บทสนทนาจนถึงตอนนี้:\n${history}\n\n` +
          `เขียน "หนึ่งประโยคพูด" ของ ${user.name} ที่จะพูดกับ ${char.name} ในขณะนั้น ` +
          `เป็นคำพูดโดยตรง (ใส่ในเครื่องหมายคำพูด " ") สั้น เป็นธรรมชาติ สอดคล้องนิสัย ${user.name} ` +
          `เช่น ถามคำถาม ทักทาย แซว หรือเอ่ยประเด็นใหม่ — ห้ามบรรยายฉาก ห้ามพูดแทน ${char.name}:`,
        startWith: `"`,
        stopSequences: ['"']
      });
      playerText = (res?.text || res?.generatedText || String(res)).trim();
      if (playerText && !playerText.startsWith('"')) playerText = '"' + playerText;
      if (playerText && !playerText.endsWith('"')) playerText = playerText + '"';
    } catch (e) {
      setStatus(index, ""); busy[index] = false; return;
    }
    if (!playerText) { setStatus(index, ""); busy[index] = false; return; }

    ensureLog(index).push({ type: 'player', text: `${user.name}: ${playerText}` });
    const narrationEntry = { type: 'text', text: "" };
    ensureLog(index).push(narrationEntry);
    renderChat(index);
    setStatus(index, `${char.name} กำลังพิมพ์...`);

    const newHistory = logText(index);
    const instruction =
      `คุณกำลังเล่นเป็นตัวละคร "${char.name}" ในเกมโรลเพลย์แฟนตาซี\n` +
      `ประวัติ/นิสัย: ${char.bio}\n` +
      `ผู้เล่นที่กำลังคุยด้วย: "${user.name}" — ${user.bio || 'ผู้กล้านิรนาม'}\n` +
      `บทสนทนาจนถึงตอนนี้:\n${newHistory}\n\n` +
      `${user.name} พูดว่า: ${playerText}\n\n` +
      `ให้ "${char.name}" ตอบกลับเป็น "คำพูด" โดยตรง (ใส่ในเครื่องหมายคำพูด " ") สั้นกระชับ 1-3 ประโยค ` +
      `สะท้อนนิสัยของ ${char.name} — ห้ามบรรยายฉากยาวๆ ห้ามพูดแทน ${user.name}:`;

    try {
      await root.generateText({
        instruction,
        startWith: `"`,
        onChunk: (data) => {
          narrationEntry.text += data.textChunk;
          renderChat(index);
        }
      });
      if (!narrationEntry.text.startsWith('"')) narrationEntry.text = '"' + narrationEntry.text;
      setStatus(index, "");
    } catch (e) {
      setStatus(index, "⚠ " + (e?.message || e), true);
    } finally {
      busy[index] = false;
    }
  };

  const ensureLog = (i) => { if (!logs[i]) logs[i] = []; return logs[i]; };
  const escapeHtml = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  const renderChat = (index) => {
    const screenEl = document.getElementById(`screen-${index}`);
    if (!screenEl) return;
    const log = ensureLog(index);
    let html = "";
    for (const entry of log) {
      if (entry.type === 'player') {
        html += `<div class="msg-player">▸ ${escapeHtml(entry.text)}</div>`;
      } else if (entry.type === 'text') {
        html += `<div class="msg-narration">${escapeHtml(entry.text)}</div>`;
      } else if (entry.type === 'img') {
        html += `<div class="msg-img-wrap"><img src="${escapeHtml(entry.dataUrl)}"></div>`;
      }
    }
    screenEl.innerHTML = html;
    screenEl.scrollTop = screenEl.scrollHeight;
  };

  const logText = (index) => {
    return ensureLog(index)
      .filter(e => e.type === 'text' || e.type === 'player')
      .map(e => e.type === 'player' ? `> ${e.text}` : e.text)
      .join("\n");
  };

  const setStatus = (index, text, isError) => {
    const el = document.getElementById(`status-${index}`);
    if (el) { el.textContent = text || ""; el.classList.toggle('error', !!isError); }
  };

  // ===== idle / proactive AI (character initiates) =====
  const clearIdle = () => { if (idleTimer) { clearTimeout(idleTimer); idleTimer = null; } };
  const isInitOn = (index) => {
    const cb = document.getElementById(`init-${index}`);
    return !cb || cb.checked;
  };
  const resetIdle = () => {
    clearIdle();
    if (activeIndex === null) return;
    if (!isInitOn(activeIndex)) return;
    const delay = IDLE_MIN + Math.random() * (IDLE_MAX - IDLE_MIN);
    idleTimer = setTimeout(() => onIdle(activeIndex), delay);
  };
  const onInitToggle = (index) => {
    if (activeIndex === index) resetIdle();
  };
  window.onInitToggle = onInitToggle;

  const onIdle = async (index) => {
    if (busy[index]) { resetIdle(); return; }
    if (activeIndex !== index) return;
    // เลือกสุ่ม: เขียนข้อความเอง ~65%, วาดภาพเอง ~35%
    if (Math.random() < 0.65) {
      await idleMessage(index);
    } else {
      await idleDraw(index);
    }
    resetIdle();
  };

  const idleMessage = async (index) => {
    const char = list[index];
    const user = getUserProfile();
    const history = logText(index);
    busy[index] = true;
    setStatus(index, `${char.name} กำลังพิมพ์...`);
    const entry = { type: 'text', text: "" };
    ensureLog(index).push(entry);
    renderChat(index);

    const instruction =
      `คุณกำลังเล่นเป็นตัวละคร "${char.name}" ในเกมโรลเพลย์แฟนตาซี\n` +
      `ประวัติ/นิสัย: ${char.bio}\n` +
      `ผู้เล่นที่อยู่ตรงหน้า: "${user.name}" — ${user.bio || 'ผู้กล้านิรนาม'}\n` +
      `บทสนทนาจนถึงตอนนี้:\n${history}\n\n` +
      `${user.name} เงียบไปพักใหญ่ ให้ "${char.name}" ริเริ่มพูดกับ ${user.name} ` +
      `เป็น "คำพูด" โดยตรง (ใส่ในเครื่องหมายคำพูด " ") สั้น 1-3 ประโยค ` +
      `สะท้อนนิสัย ${char.name} — เช่น ถาม ทัก คึกคัก หรือบ่น — ห้ามบรรยายฉาก ห้ามพูดแทน ${user.name}:`;

    try {
      await root.generateText({
        instruction,
        startWith: `"`,
        onChunk: (data) => { entry.text += data.textChunk; renderChat(index); }
      });
      if (!entry.text.startsWith('"')) entry.text = '"' + entry.text;
      setStatus(index, "");
    } catch (e) {
      setStatus(index, "⚠ " + (e?.message || e), true);
    } finally {
      busy[index] = false;
    }
  };

  const buildScenePrompt = async (index) => {
    const char = list[index];
    const user = getUserProfile();
    const story = logText(index) || char.bio;
    let sceneDesc = "";
    try {
      const res = await root.generateText({
        instruction:
          `จากข้อมูล ตัวละคร${char}เนื้อเรื่องล่าสุด:${story.slice(-400)}.จงบรรยายฉากเป็นprompt **don't use symbols and comment ***`,
        stopSequences: ["\n"]
      });
      sceneDesc = (res?.text || res?.generatedText || String(res)).trim();
    } catch (e) {
      sceneDesc = "";
    }
    if (!sceneDesc) sceneDesc = `A fantasy scene: ${char.name} and ${user.name} interacting`;
    return `${char.prompt}. Scene: ${sceneDesc}. Wide cinematic shot, full scene composition, environmental storytelling, atmospheric, highly detailed fantasy illustration`;
  };

  const idleDraw = async (index) => {
    const char = list[index];
    busy[index] = true;
    setStatus(index, `${char.name} กำลังร่ายมนตร์วาดภาพ...`);
    try {
      const fullPrompt = await buildScenePrompt(index);
      const result = await root.generateImage(fullPrompt, { resolution: "768x512" });
      ensureLog(index).push({ type: 'img', dataUrl: result.dataUrl });
      renderChat(index);
      setStatus(index, "");
    } catch (e) {
      setStatus(index, "⚠ ร่ายภาพล้มเหลว: " + (e?.message || e), true);
    } finally {
      busy[index] = false;
    }
  };

  // ===== user-driven chat =====
  const sendChatMessage = async (index) => {
    if (busy[index]) return;
    const inputEl = document.getElementById(`input-${index}`);
    const sendBtn = document.getElementById(`send-${index}`);
    const userText = inputEl.value.trim();
    if (!userText) return;

    busy[index] = true;
    sendBtn.disabled = true;
    inputEl.value = "";

    const char = list[index];
    const user = getUserProfile();
    const history = logText(index) || `เริ่มต้นเนื้อเรื่องของ ${char.name}`;

    ensureLog(index).push({ type: 'player', text: `${user.name}: ${userText}` });
    const narrationEntry = { type: 'text', text: "" };
    ensureLog(index).push(narrationEntry);
    renderChat(index);
    setStatus(index, `${char.name} กำลังพิมพ์...`);
    resetIdle();

    const instruction =
      `คุณกำลังเล่นเป็นตัวละคร "${char.name}" ในเกมโรลเพลย์แฟนตาซี\n` +
      `ประวัติ/นิสัย: ${char.bio}\n` +
      `ผู้เล่นที่กำลังคุยด้วย: "${user.name}" — ${user.bio || 'ผู้กล้านิรนาม'}\n` +
      `บทสนทนาจนถึงตอนนี้:\n${history}\n\n` +
      `${user.name} พูดว่า: ${userText}\n\n` +
      `ให้ "${char.name}" ตอบกลับเป็น "คำพูด" โดยตรง (ใส่ในเครื่องหมายคำพูด " ") สั้นกระชับ 1-3 ประโยค ` +
      `สะท้อนนิสัย ${char.name} — ห้ามบรรยายฉากยาวๆ ห้ามพูดแทน ${user.name}:`;

    try {
      await root.generateText({
        instruction,
        startWith: `"`,
        onChunk: (data) => { narrationEntry.text += data.textChunk; renderChat(index); }
      });
      if (!narrationEntry.text.startsWith('"')) narrationEntry.text = '"' + narrationEntry.text;
      setStatus(index, "");
    } catch (e) {
      setStatus(index, "⚠ เวทมนตร์ล้มเหลว: " + (e?.message || e), true);
    } finally {
      busy[index] = false;
      sendBtn.disabled = false;
      resetIdle();
    }
  };
  window.sendChatMessage = sendChatMessage;

  const drawScene = async (index) => {
    if (busy[index]) return;
    const drawBtn = document.getElementById(`draw-${index}`);

    busy[index] = true;
    drawBtn.disabled = true;
    setStatus(index, `${list[index].name} กำลังร่ายมนตร์วาดภาพ...`);
    resetIdle();

    try {
      const fullPrompt = await buildScenePrompt(index);
      const result = await root.generateImage(fullPrompt, { resolution: "768x512" });
      ensureLog(index).push({ type: 'img', dataUrl: result.dataUrl });
      renderChat(index);
      setStatus(index, "");
    } catch (e) {
      setStatus(index, "⚠ ร่ายมนตร์ภาพล้มเหลว: " + (e?.message || e), true);
    } finally {
      busy[index] = false;
      drawBtn.disabled = false;
      resetIdle();
    }
  };
  window.drawScene = drawScene;

  const showDetail = (index) => {
    document.querySelectorAll('.char-detail').forEach(div => div.style.display = 'none');
    document.querySelectorAll('.char-tab').forEach(b => b.classList.remove('active'));
    const el = document.getElementById(`detail-${index}`);
    if (el) el.style.display = 'block';
    const tab = document.querySelector(`.char-tab[data-i="${index}"]`);
    if (tab) tab.classList.add('active');
    activeIndex = index;
    resetIdle();
  };
  window.showDetail = showDetail;

  const onInputActivity = () => { if (activeIndex !== null) resetIdle(); };
  window.onInputActivity = onInputActivity;

  // ===== modal =====
  const initModal = () => {
    if (document.getElementById('charModal')) return;
    const modalDiv = document.createElement('div');
    modalDiv.id = 'charModal'; modalDiv.className = 'modal';
    modalDiv.innerHTML = `
      <div class="modal-content">
        <h3>✦ อัญเชิญวิญญาณ ✦</h3>
        <input id="f-name" placeholder="ชื่อตัวละคร">
        <input id="f-bio" placeholder="ประวัติ / นิสัย">
        <input id="f-prompt" placeholder="คำบรรยายภาพ (อังกฤษ)">
        <button class="btn-save" onclick="addChar()">💾 บันทึก</button>
        <button class="btn-close" onclick="closeModal()">❌ ปิด</button>
      </div>`;
    document.body.appendChild(modalDiv);
  };
  const openModal = () => { initModal(); document.getElementById('charModal').style.display = 'flex'; };
  const closeModal = () => document.getElementById('charModal').style.display = 'none';
  window.openModal = openModal; window.closeModal = closeModal;

  const render = () => {
    document.getElementById('count').innerText = list.length;

    document.getElementById('charButtons').innerHTML = list.map((c, i) =>
      `<button class="char-tab" data-i="${i}" onclick="showDetail(${i})"><span class="alive-dot"></span>${escapeHtml(c.name)}</button>`
    ).join('');

    document.getElementById('charDetailsContainer').innerHTML = list.map((c, i) => `
      <div id="detail-${i}" class="char-detail">
        <h3>✦ ${escapeHtml(c.name)} ✦</h3>
        <div class="bio-line">📜 ${escapeHtml(c.bio)}</div>
        <div id="screen-${i}" class="chat-box"></div>
        <div id="status-${i}" class="status"></div>
        <div class="chat-controls">
          <input id="input-${i}" placeholder="สั่ง ${escapeHtml(c.name)} ให้ทำสิ่งใด..." onkeydown="if(event.key==='Enter'){sendChatMessage(${i});} onInputActivity();" oninput="onInputActivity()" onfocus="onInputActivity()">
          <button class="btn-send" id="send-${i}" onclick="sendChatMessage(${i})">⚡ ส่ง</button>
        </div>
        <button class="btn-draw" id="draw-${i}" onclick="drawScene(${i})">🎨 ร่ายมนตร์วาดภาพฉาก</button>
        <div class="toggle-row">
          <label class="auto-toggle"><input type="checkbox" id="init-${i}" checked onchange="onInitToggle(${i})"> 💬 ตัวละครเริ่มเอง — พูดหาเราเมื่อเงียบ</label>
          <label class="auto-toggle"><input type="checkbox" id="auto-${i}" onchange="onAutoToggle(${i})"> 🤖 โหมดอัตโนมัติ — AI คิดบทเรา ทุก 15-25 วิ</label>
        </div>
      </div>
    `).join('');

    list.forEach((c, i) => {
      if (!logs[i]) logs[i] = [{ type: 'text', text: `เริ่มต้นเนื้อเรื่องของ ${c.name}` }];
      renderChat(i);
    });
  };

  const addChar = () => {
    const name = document.getElementById('f-name').value.trim();
    if (!name) return alert("กรุณาใส่ชื่อตัวละคร");
    list.push({
      name,
      bio: document.getElementById('f-bio').value.trim() || "ผู้กล้านิรนาม",
      prompt: document.getElementById('f-prompt').value.trim() || `portrait of ${name}, fantasy character art`
    });
    fields.forEach(id => { const el = document.getElementById('f-' + id); if (el) el.value = ''; });
    closeModal();
    render();
    showDetail(list.length - 1);
  };
  window.addChar = addChar;

  render();
})();
</script>

</body>
</html>
