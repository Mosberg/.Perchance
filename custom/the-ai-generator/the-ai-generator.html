<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>the-ai-generator — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<style>
:root{--bg:#0b0b10;--panel:#151520;--text:#ddd;--muted:#888;--accent:#7b68ee;--border:#2a2a35}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,Segoe UI,sans-serif;text-align:left}
#appCtn{display:flex;flex-direction:column;height:100vh}
header{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--border)}
.tabBtn{background:transparent;border:1px solid #444;color:var(--text);padding:5px 12px;border-radius:5px;cursor:pointer;font-size:13px}
.tabBtn.active{background:var(--accent);border-color:var(--accent);color:#fff}
#mainCtn{flex:1;display:flex;overflow:hidden}
#controlPanel{width:340px;min-width:280px;background:var(--panel);border-right:1px solid var(--border);padding:14px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
#outputPanel{flex:1;padding:16px;overflow-y:auto;display:flex;flex-direction:column;position:relative}
input,textarea,select{background:#0f0f14;color:var(--text);border:1px solid #333;border-radius:5px;padding:7px;width:100%;box-sizing:border-box;font-family:inherit;font-size:13px}
textarea{resize:vertical}
.groupLabel{font-size:10px;text-transform:uppercase;color:var(--muted);letter-spacing:0.6px;margin:6px 0 4px;font-weight:600}
button{cursor:pointer;border:none;border-radius:5px;padding:7px 12px;background:var(--accent);color:#fff;font-size:13px}
button:disabled{opacity:0.4;cursor:not-allowed}
.styleBtn{border:1px solid var(--border);background:#0f0f14;transition:.1s}
.styleBtn:hover{border-color:var(--accent)}
.styleBtn.selected{border-color:var(--accent);background:#252535}
.galleryGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.galItem{position:relative;border-radius:7px;overflow:hidden;border:1px solid #333;aspect-ratio:1;background:#111;cursor:pointer}
.galItem img{width:100%;height:100%;object-fit:cover}
.galOverlay{position:absolute;inset:0;background:rgba(0,0,0,0.55);opacity:0;transition:opacity .15s;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;gap:4px}
.galItem:hover .galOverlay{opacity:1}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:50;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:20px;gap:10px}
.lightbox img{max-width:90vw;max-height:70vh;border-radius:6px}
.hidden{display:none !important}
.loader{border:3px solid #333;border-top-color:var(--accent);border-radius:50%;width:22px;height:22px;animation:spin .9s linear infinite;margin:auto}
@keyframes spin{to{transform:rotate(360deg)}}
.noteItem{padding:8px;border-radius:5px;border:1px solid var(--border);cursor:pointer;font-size:13px}
.noteItem:hover{border-color:var(--accent)}
.noteItem.active{background:#252535;border-color:var(--accent)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#333;border-radius:4px}
</style>

<div id="appCtn">
  <header>
    <div style="font-weight:700;font-size:16px;">🜂 The AI Generator</div>
    <div style="flex:1"></div>
    <button id="tabGenBtn" class="tabBtn active" onclick="switchTab('gen')">Generator</button>
    <button id="tabGalBtn" class="tabBtn" onclick="switchTab('gallery')">Gallery</button>
    <button id="tabNoteBtn" class="tabBtn" onclick="switchTab('notebook')">Notebook</button>
    <button id="tabSetBtn" class="tabBtn" onclick="switchTab('settings')">Settings</button>
  </header>

  <div id="genCtn" style="display:flex;flex:1;overflow:hidden;">
    <div id="controlPanel">
      <div style="display:flex;gap:6px;margin-bottom:6px;">
        <button id="modeImageBtn" class="tabBtn active" style="flex:1;" onclick="setMode('image')">Image</button>
        <button id="modeTextBtn" class="tabBtn" style="flex:1;" onclick="setMode('text')">Text</button>
      </div>

      <div id="imgControls">
        <div class="groupLabel">Description</div>
        <textarea id="descInput" rows="3" oninput="S.desc=this.value;saveUI();updatePreview()" placeholder="Describe the scene..."></textarea>
        <div class="groupLabel">Negative Prompt</div>
        <textarea id="negInput" rows="2" oninput="S.neg=this.value;saveUI();updatePreview()" placeholder="What to exclude..."></textarea>

        <div style="display:flex;gap:8px;">
          <div style="flex:1;">
            <div class="groupLabel">Resolution</div>
            <select id="resSelect" onchange="S.res=this.value;saveUI()">
              <option>512x512</option><option>512x768</option><option>768x512</option><option selected>768x768</option>
            </select>
          </div>
          <div style="flex:1;">
            <div class="groupLabel">Variation</div>
            <button onclick="randomizeAll()" style="width:100%;background:#333;">🎲 Surprise Me</button>
          </div>
        </div>

        <div id="pokemonTypeWrap" hidden>
          <div class="groupLabel">Pokemon Type</div>
          <select id="pokemonTypeSelect" onchange="updatePreview()">
            <option value="">-- None --</option>
            <option>Fire</option><option>Water</option><option>Grass</option><option>Electric</option><option>Psychic</option><option>Dark</option><option>Dragon</option><option>Ice</option><option>Fairy</option><option>Ghost</option>
          </select>
        </div>

        <div class="groupLabel">Art Style</div>
        <input id="styleFilter" placeholder="Search styles or tags..." oninput="renderStyles()" style="margin-bottom:4px;">
        <div id="styleListCtn" style="max-height:200px;overflow-y:auto;padding-right:4px;"></div>

        <div id="modifiersCtn"></div>

        <div class="groupLabel">Resolved Prompt</div>
        <textarea id="promptPreview" readonly rows="3" style="font-size:12px;opacity:0.8;"></textarea>
        <textarea id="negPreview" readonly rows="2" style="font-size:12px;opacity:0.8;"></textarea>

        <button id="genImgBtn" onclick="generateImageGen()" style="width:100%;margin-top:8px;padding:12px;font-weight:700;">Generate Image</button>
        <div id="imgLoader" class="loader" hidden></div>
      </div>

      <div id="textControls" hidden>
        <div class="groupLabel">Instruction</div>
        <textarea id="textInstrInput" rows="4" placeholder="Ask the AI to write, summarize, brainstorm..."></textarea>
        <button id="genTextBtn" onclick="generateTextGen()" style="width:100%;margin-top:8px;padding:12px;font-weight:700;">Generate Text</button>
        <div id="textLoader" class="loader" hidden></div>
        <div class="groupLabel">Output</div>
        <div id="textOutput" style="white-space:pre-wrap;background:#0f0f14;border:1px solid #333;border-radius:5px;padding:12px;min-height:120px;"></div>
        <button onclick="saveTextToNotebook()" style="width:100%;margin-top:8px;background:#2a2a35;">Save to Notebook</button>
      </div>
    </div>

    <div id="outputPanel">
      <div id="welcomeState" style="color:var(--muted);margin:auto;text-align:center;">
        <div style="font-size:40px;margin-bottom:10px;">🜂</div>
        <div>Set a style, write a prompt, and create.</div>
      </div>
      <div id="imgOutputWrap" hidden style="display:flex;flex-direction:column;align-items:center;gap:12px;">
        <img id="generatedImg" style="max-width:100%;max-height:68vh;border-radius:8px;border:1px solid #444;">
        <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;">
          <button onclick="downloadCurrentImage()" style="background:#2a2a35;">Download</button>
          <button onclick="saveCurrentToGallery()" style="background:#2a2a35;">Save to Gallery</button>
          <button onclick="sendImgToNotebook()" style="background:#2a2a35;">Send to Notebook</button>
        </div>
      </div>
    </div>
  </div>

  <div id="galleryCtn" hidden style="flex:1;overflow-y:auto;padding:16px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <div style="font-weight:700;font-size:18px;">Image Gallery</div>
      <button onclick="clearGallery()" style="background:#522;">Clear All</button>
    </div>
    <div id="galleryGrid" class="galleryGrid"></div>
    <div id="galleryEmpty" style="color:var(--muted);text-align:center;margin-top:40px;">No saved images yet.</div>
  </div>

  <div id="notebookCtn" hidden style="flex:1;overflow-y:auto;padding:16px;display:flex;gap:16px;">
    <div style="width:220px;display:flex;flex-direction:column;gap:8px;flex-shrink:0;">
      <div style="font-weight:700;">Notes</div>
      <button onclick="newNote()" style="background:var(--accent);">+ New Note</button>
      <div id="noteList" style="display:flex;flex-direction:column;gap:4px;overflow-y:auto;"></div>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;gap:8px;min-width:0;">
      <input id="noteTitle" placeholder="Note Title">
      <textarea id="noteBody" placeholder="Prompts, ideas, outputs..." style="flex:1;min-height:200px;"></textarea>
      <div style="display:flex;gap:8px;">
        <button onclick="saveNote()" style="flex:1;">Save Note</button>
        <button onclick="deleteNote()" style="flex:1;background:#522;">Delete</button>
      </div>
    </div>
  </div>

  <div id="settingsCtn" hidden style="flex:1;overflow-y:auto;padding:16px;max-width:700px;margin:0 auto;width:100%;box-sizing:border-box;">
    <div style="font-weight:700;font-size:18px;margin-bottom:12px;">Settings & Dependencies</div>
    <label style="display:flex;align-items:center;gap:8px;margin:8px 0;"><input type="checkbox" id="rememberCheck" checked onchange="localStorage.aiGen_remember=this.checked"> Remember inputs & selections</label>
    <label style="display:flex;align-items:center;gap:8px;margin:8px 0;"><input type="checkbox" id="autoSaveCheck" checked onchange="S.settings.autoSave=this.checked;saveSet()"> Auto-save generations to Gallery</label>
    <label style="display:flex;align-items:center;gap:8px;margin:8px 0;"><input type="checkbox" id="streamCheck" checked onchange="S.settings.stream=this.checked;saveSet()"> Stream text generation</label>
    <div class="groupLabel">Import Styles (JSON)</div>
    <textarea id="importStylesArea" placeholder='Paste JSON array of style group objects. Example: \{"group":"My Styles","color":"#f0f","styles":\[\{"id":"x","label":"X","prompt":"..."\}\]\}' style="min-height:100px;"></textarea>
    <button onclick="importStyles()" style="margin-top:6px;">Import Styles</button>
    <div class="groupLabel">Full Data Import / Export</div>
    <textarea id="importDataArea" placeholder="Paste full exported JSON here..." style="min-height:100px;"></textarea>
    <div style="display:flex;gap:8px;margin-top:6px;">
      <button onclick="importFullData()">Import Data</button>
      <button onclick="exportFullData()">Export Data</button>
      <button onclick="resetAllData()" style="background:#522;">Reset All</button>
    </div>
  </div>
</div>

<div id="lightbox" class="lightbox hidden" onclick="if(event.target===this)closeLightbox()">
  <img id="lightboxImg">
  <div id="lightboxMeta" style="max-width:800px;width:100%;background:var(--panel);padding:12px;border-radius:6px;font-size:13px;border:1px solid var(--border);"></div>
</div>

<script>
/* ===== DATA ===== */
let styleGroups=[{g:"Custom Styles",c:"#f6c344",s:[{i:"noStyle",l:"No style",p:"[input.description].",n:"[input.negative]"},{i:"mtgCard",l:"MTG Card",p:"[input.description], magic the gathering card",n:"[input.negative], low-quality, deformed, blurry, bad art"},{i:"tcgCard",l:"TCG Card",p:"[input.description], pokemon trading card game",n:"[input.negative], low-quality, deformed, blurry, bad art",t:{pokemon:10,tcg:3}},{i:"pixelArt",l:"Pixel Art",p:"[input.description], pixel art",n:"[input.negative], low-quality, deformed, blurry, bad art",t:{pokemon:10,pixel:3}},{i:"cartoon",l:"Cartoon",p:"[input.description], cartoon",n:"[input.negative], low-quality, deformed, blurry, bad art"},{i:"anime",l:"Anime",p:"[input.description], anime",n:"[input.negative], low-quality, deformed, blurry, bad art"},{i:"pokemon",l:"Pokemon",p:"[input.description], pokemon pixel art",n:"[input.negative], low-quality, deformed, blurry, bad art",t:{pokemon:10,pixel:3}}]},{g:"Moss Default Styles",c:"#00ff00",s:[{i:"paintedAnime",l:"Painted Anime",p:`[input.description], art by atey ghailan, painterly anime style at pixiv, art by kantoku, in art style of redjuice/necömi/rella/tiv pixiv collab, your name anime art style, masterpiece digital painting, exquisite lighting and composition, inspired by wlop art style, 8k, sharp, very detailed, high resolution, illustration.`,n:"",t:{anime:100,painting:100,paintedAnime:100,drawing:55,cartoon:50},m:"animeModifiers"},{i:"casualPhoto",l:"Casual Photo",p:`A casual photo of [input.description]. It's a casual photo.`,n:"",t:{photo:98,casualPhoto:100,portrait:80},m:"photoModifiers"},{i:"cinematic",l:"Cinematic",p:`[input.description], cinematic shot, dynamic lighting, 75mm, Technicolor, Panavision, cinemascope, sharp focus, fine details, 8k, HDR, realism, realistic, key visual, film still, cinematic color grading, depth of field.`,n:"",t:{photo:100,portrait:85,render:70,cinematic:100},m:"photoModifiers"},{i:"digitalPainting",l:"Digital Painting",p:`[input.description], breathtaking digital art, trending on artstation, by atey ghailan, by greg rutkowski, by greg tocchini, by james gilleard, 8k, high resolution, best quality.`,n:"",t:{painting:90,landscape:70,digitalPainting:100,drawing:60}},{i:"conceptArt",l:"Concept Art",p:`[input.description], concept art, digital art, illustration, inspired by wlop style, 8k, fine details, sharp, very detailed, high resolution, world-class masterpiece.`,n:"",t:{painting:50,landscape:70},m:"conceptModifiers"},{i:"3dDisney",l:"3D Disney Character",p:`3D cartoon Disney character portrait render. [input.description], bokeh, 4k, highly detailed, Pixar render, CGI Animation, Disney, cute big circular reflective eyes, dof, cinematic film, Disney realism, subtle details, breathtaking Pixar short, fine details, close up, sharp focus, HDR, Disney-style octane render, incredible composition, superb lighting and detail, [input.description].`,n:"",t:{disney:95,render:80,portrait:75,cartoon:90}},{i:"2dDisney",l:"2D Disney Character",p:`2D cartoon Disney character digital art of [input.description]. superb linework, classic 2D Disney style art, inspired by the art styles of Glen Keane and Aaron Blaise, Disney-style character concept with a Disney-style face, trending on artstation, Disney-style version of [input.description].`,n:"",t:{disney:90,portrait:75,cartoon:100,comic:80,drawing:75}},{i:"disneySketch",l:"Disney Sketch",p:`Glen Keane character concept art black and white pencil sketch of [input.description]. rough pencil sketch by Glen Keane, rough pencil sketch, close up, loose Disney-style character concept art sketch, nice sketchy pencil strokes, Disney character design sketch, pencil texture, a concept art pencil sketch of [input.description], by Glen Keane.`,n:"",t:{disney:90,cartoon:85,sketch:80,comic:80,drawing:70}},{i:"conceptSketch",l:"Concept Sketch",p:`black and white technical drawing showcasing {a} [input.description], annotation details, world-class masterpiece black and white, pencil strokes, annotated technical concept art sketch, pencil texture.`,n:"",t:{sketch:75,comic:50,drawing:75}},{i:"painterly",l:"Painterly",p:`painterly digital painting, [input.description], digital painting by Ilya Kuvshinov with painterly brush strokes, by Ilya Kuvshinov, world-class painterly masterpiece.`,n:"",t:{painting:85,landscape:65,digitalPainting:95,drawing:45}},{i:"oilPainting",l:"Oil Painting",p:`breathtaking alla prima oil painting, [input.description], close up, alla prima style, oil on linen, painterly oil on canvas, painterly style, exquisite composition and lighting, modern painterly masterpiece, by alexi zaitsev, award-winning painterly alla prima oil painting.`,n:"",t:{painting:87,oilPainting:100,landscape:60,portrait:65,drawing:40}},{i:"oilRealism",l:"Oil Painting - Realism",p:`breathtaking oil painting, [input.description], photorealistic oil painting, by charlie bowater, fine details, by wlop, trending on artstation, very detailed.`,n:"",t:{painting:87,oilPainting:95,landscape:60,portrait:70,drawing:40}},{i:"oilOld",l:"Oil Painting - Old",p:`[input.description], Oil painting by Jean-François Millet and Gustave Courbet and Jules Breton`,n:"",t:{painting:85,oilPainting:90,vintage:40,landscape:55,portrait:65,drawing:35}},{i:"oil70sPulp",l:"Oil Painting - 70s Pulp",p:`1970s vintage pulp art, ultra realistic, fully restored, exquisite lighting and composition, polished, masterpiece, vintage pulp art, by Earle K. Bergey, by Kelly Freas, by Alex Schomburg, by H. J. Ward, glossy pulp art, Amazing Stories, Weird Tales, 8k, high resolution, best quality, hyper-realistic, Mattias Adolfsson style, detailed stylization, [input.description], ultra realistic, wlop-style, exquisite lighting and composition, polished, world-class masterpiece, digitally enhanced, breathtaking shot, subtle details, superb quality, art by Kuvshinov, Kuvshinov style, detailed stylization.`,n:"[input.negative], scratches, faded, washed out, grainy, dirty",t:{painting:80,oilPainting:85,vintage:50,landscape:20,portrait:60,drawing:35}},{i:"proPhoto",l:"Professional Photo",p:`[input.description], {sharp|soft} focus, depth of field, 8k photo, HDR, professional lighting, taken with Canon EOS R5, DSLR, 75mm lens`,n:"",t:{photo:95,portrait:60},m:"photoModifiers"},{i:"animeDef",l:"Anime",p:`anime art of [input.description], world-class masterpiece, 4k, best quality, anime art.`,n:"",t:{basicAnime:100,anime:60,drawing:50,cartoon:30},m:"animeModifiers"},{i:"drawnAnime",l:"Drawn Anime",p:`anime-style illustration with perfect clean lines, illustration of [input.description], anime drawing/art, bold linework, illustration, cel shaded, anime-style digital illustration. It's an anime-inspired 2D-style anime illustration. Aesthetic high-skill, professional anime illustration, which looks like a screencap from an anime series. It has clean line work and a pleasant, appealing drawn aesthetic style. Overall, it's a world-class illustration with flawless line work, perfect composition, and impeccable attention to detail.`,n:"",t:{anime:60,drawing:85,drawnAnime:100,cartoon:40},m:"animeModifiers"},{i:"animeScreen",l:"Anime Screencap",p:`Anime screencap, [input.description]. It's an anime screencap from a popular anime. Beautiful visual quality, remastered, extremely high quality, very aesthetic, high production value, high-skill masterpiece. The image shows impeccable and beautiful composition and contrast. It's an exquisite anime screencap style image.`,n:"[input.negative], faded, washed out, low quality",t:{anime:65,drawing:80,cartoon:45},m:"animeModifiers"},{i:"cuteAnime",l:"Cute Anime",p:`adorable, cute, kawaii, [input.description], cute moe anime character portrait, adorable, featured on pixiv, kawaii moé masterpiece, cuteness overload, very detailed, sooooo adorable.`,n:"",t:{anime:55,drawing:50,cuteAnime:100,cartoon:30},m:"animeModifiers"},{i:"softAnime",l:"Soft Anime",p:`[input.description], anime masterpiece with soft lighting, gentle intricate style, h   mode:localStorage.aiGen_mode||'image',

};

/* ===== UTILS ===== */
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function randOpt(m){return m.replace(/\{([^}]+)\}/g,(_,o)=>{let a=o.split('|');return a[Math.floor(Math.random()*a.length)]})}
function resolveTpl(str,ctx){
  if(!str)return '';
  return randOpt(str).replace(/\[([^\]]+)\]/g,(_,ex)=>{
    try{return new Function('input','return ('+ex+')')(ctx)}catch(e){return ''}
  });
}
function findStyle(id){for(let g of styleGroups)for(let s of g.s)if(s.i===id)return s;return null}
function allStyles(){let a=[];for(let g of styleGroups)a.push(...g.s);return a}

function saveUI(){
  if(!rememberCheck.checked)return;
  localStorage.aiGen_mode=S.mode;
  localStorage.aiGen_desc=descInput.value;
  localStorage.aiGen_neg=negInput.value;
  localStorage.aiGen_style=S.style;
  localStorage.aiGen_res=resSelect.value;
  localStorage.aiGen_mods=JSON.stringify(S.mods);
}
function saveSet(){localStorage.aiGen_settings=JSON.stringify(S.settings)}

function updatePreview(){
  let st=findStyle(S.style);
  pokemonTypeWrap.hidden=!st||!/(pokemonType)/.test(st.p);
  let ctx={description:descInput.value||'',negative:negInput.value||'',pokemonType:pokemonTypeSelect?pokemonTypeSelect.value:'',input:{description:descInput.value||'',negative:negInput.value||'',pokemonType:pokemonTypeSelect?pokemonTypeSelect.value:''}};
  let p=st?resolveTpl(st.p,ctx):ctx.description;
  let n=st&&st.n?resolveTpl(st.n,ctx):ctx.negative;
  if(st&&st.m&&modLibs[st.m]){
    let lib=modLibs[st.m];
    for(let cat in S.mods){
      let v=S.mods[cat]; if(!v)continue;
      p+=v;
    }
  }
  promptPreview.value=p; negPreview.value=n;
}

/* ===== UI RENDER ===== */
function renderStyles(){
  let f=styleFilter.value.toLowerCase();
  let h='';
  for(let grp of styleGroups){
    let items=grp.s.filter(st=>{
      if(!f)return true;
      if(st.l.toLowerCase().includes(f))return true;
      if(st.t&&Object.keys(st.t).some(k=>k.includes(f)))return true;
      return false;
    });
    if(!items.length)continue;
    h+=`<div style="color:${esc(grp.c||'#aaa')};font-size:11px;font-weight:700;text-transform:uppercase;margin:8px 0 4px;">${esc(grp.g)}</div>`;
    for(let st of items){
      let sel=st.i===S.style?'border-color:#7b68ee;background:#252535;':'border-color:#2a2a35;background:#111;';
      h+=`<button class="styleBtn" style="${sel}width:100%;text-align:left;color:#e0e0e0;padding:5px 8px;margin-bottom:3px;border-radius:5px;cursor:pointer;font-size:13px;" onclick="pickStyle('${st.i}')">${esc(st.l)}</button>`;
    }
  }
  styleListCtn.innerHTML=h;
}
window.pickStyle=function(id){
  S.style=id; S.mods={}; renderStyles(); renderModifiers(); updatePreview(); saveUI();
};
function renderModifiers(){
  let st=findStyle(S.style), h='';
  if(st&&st.m&&modLibs[st.m]){
    let lib=modLibs[st.m];
    for(let cat in lib){
      let opts=lib[cat], cur=S.mods[cat]||'';
      h+=`<div class="groupLabel">${esc(cat)}</div><select style="width:100%;margin-bottom:6px;" onchange="S.mods[this.dataset.cat]=this.value;saveUI();updatePreview()" data-cat="${esc(cat)}"><option value="">-- none --</option>`+
        opts.map(o=>`<option value="${esc(o.v)}" ${o.v===cur?'selected':''}>${esc(o.l)}</option>`).join('')+'</select>';
    }
  }
  modifiersCtn.innerHTML=h;
}

/* ===== GENERATION ===== */
async function generateImageGen(){
  let {prompt,negative}=buildFinal();
  if(!prompt.trim())return;
  genImgBtn.disabled=true; imgLoader.hidden=false;
  try{
    let url=await generateImage(prompt+(negative?'. Negative: '+negative:''),{resolution:S.res});
    generatedImg.src=url; imgOutputWrap.hidden=false; welcomeState.hidden=true;
    if(S.settings.autoSave) await saveGallery(url,prompt,negative,findStyle(S.style)?.l);
    addHistory(prompt,'img');
  }catch(e){console.error(e)}
  genImgBtn.disabled=false; imgLoader.hidden=true;
}
function buildFinal(){
  let st=findStyle(S.style);
  let ctx={description:descInput.value||'',negative:negInput.value||'',pokemonType:pokemonTypeSelect.value||'',input:{description:descInput.value||'',negative:negInput.value||'',pokemonType:pokemonTypeSelect.value||''}};
  let p=st?resolveTpl(st.p,ctx):ctx.description;
  let n=st&&st.n?resolveTpl(st.n,ctx):ctx.negative;
  if(st&&st.m&&modLibs[st.m]){for(let c in S.mods){let v=S.mods[c];if(v)p+=v;}}
  return {prompt:p,negative:n};
}

async function generateTextGen(){
  let instr=textInstrInput.value.trim(); if(!instr)return;
  genTextBtn.disabled=true; textLoader.hidden=false; textOutput.textContent='';
  try{
    if(S.settings.stream){
      await generateText({instruction:instr,onChunk:d=>textOutput.textContent+=d.textChunk});
    }else{
      textOutput.textContent=await generateText(instr);
    }
    addHistory(instr,'txt');
  }catch(e){console.error(e)}
  genTextBtn.disabled=false; textLoader.hidden=true;
}

function randomizeAll(){
  let a=allStyles();
  let st=a[Math.floor(Math.random()*a.length)];
  pickStyle(st.i);
  let topics=['a cyberpunk samurai','an ancient floating castle','a neon dragon over Tokyo','a wizard cat in a library','a bioluminescent forest','a steampunk airship battle','a mysterious portal in the woods','a robot with a flowering藤蔓'];
  descInput.value=topics[Math.floor(Math.random()*topics.length)];
  S.desc=descInput.value; updatePreview(); saveUI();
}

/* ===== TABS & MODE ===== */
window.switchTab=function(t){
  ['genCtn','galleryCtn','notebookCtn','settingsCtn'].forEach(id=>document.getElementById(id).hidden=(id!==t+'Ctn'));
  ['tabGenBtn','tabGalBtn','tabNoteBtn','tabSetBtn'].forEach(id=>document.getElementById(id).classList.toggle('active',id==='tab'+(t==='gen'?'Gen':t==='gallery'?'Gal':t==='notebook'?'Note':'Set')+'Btn'));
  if(t==='gallery') renderGallery();
  if(t==='notebook') renderNoteList();
};
window.setMode=function(m){
  S.mode=m;
  if(m==='image'){
    imgControls.hidden=false; textControls.hidden=false;
    modeImageBtn.classList.add('active'); modeTextBtn.classList.remove('active');
    if(generatedImg.src && generatedImg.src!=='') imgOutputWrap.hidden=false;
  } else {
    imgControls.hidden=true; textControls.hidden=false;
    modeImageBtn.classList.remove('active'); modeTextBtn.classList.add('active');
    imgOutputWrap.hidden=true;
  }
  saveUI();
};

/* ===== GALLERY ===== */
async function getGal(){return await kv.aig.get('gallery')||[]}
async function setGal(arr){await kv.aig.set('gallery',arr)}
async function saveGallery(url,prompt,neg,styleLabel){
  let arr=await getGal();
  arr.unshift({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),url,prompt,negative:neg,styleLabel,created:Date.now()});
  await setGal(arr);
}
window.delGal=async function(id){
  let arr=(await getGal()).filter(x=>x.id!==id); await setGal(arr); renderGallery();
};
window.downloadImg=async function(id){
  let it=(await getGal()).find(x=>x.id===id); if(!it)return;
  let a=document.createElement('a'); a.href=it.url; a.download='generated.png'; a.click();
};
function downloadCurrentImage(){let a=document.createElement('a');a.href=generatedImg.src;a.download='generated.png';a.click();}
async function saveCurrentToGallery(){let {prompt,negative}=buildFinal();await saveGallery(generatedImg.src,prompt,negative,findStyle(S.style)?.l);renderGallery();}
window.openLightbox=async function(id){
  let it=(await getGal()).find(x=>x.id===id); if(!it)return;
  lightboxImg.src=it.url;
  lightboxMeta.innerHTML=`<b>Style:</b> ${esc(it.styleLabel||'None')}<br><b>Prompt:</b> ${esc(it.prompt)}<br><b>Negative:</b> ${esc(it.negative||'—')}<br><small>${new Date(it.created).toLocaleString()}</small>`;
  lightbox.hidden=false;
};
window.closeLightbox=function(){lightbox.hidden=true;};
async function renderGallery(){
  let items=await getGal();
  galleryEmpty.hidden=items.length>0;
  galleryGrid.innerHTML=items.map(it=>`
    <div class="galItem">
      <img src="${it.url}" onclick="openLightbox('${it.id}')">
      <div class="galOverlay">
        <div style="font-size:11px;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(it.styleLabel||'')}</div>
        <div style="display:flex;gap:4px;">
          <button onclick="event.stopPropagation();downloadImg('${it.id}')" style="padding:2px 6px;font-size:11px;">DL</button>
          <button onclick="event.stopPropagation();delGal('${it.id}')" style="padding:2px 6px;font-size:11px;background:#522;">X</button>
        </div>
      </div>
    </div>`).join('');
}
async function clearGallery(){if(!confirm('Delete all gallery images?'))return;await kv.aig.delete('gallery');renderGallery();}

/* ===== NOTEBOOK ===== */
function getNotes(){return JSON.parse(localStorage.aiGen_notes||'[]')}
function saveNotes(n){localStorage.aiGen_notes=JSON.stringify(n)}
function renderNoteList(){
  let n=getNotes();
  noteList.innerHTML=n.map(x=>`<div class="noteItem ${x.id===currentNoteId?'active':''}" onclick="loadNote('${x.id}')">${esc(x.title||'Untitled')}</div>`).join('');
}
window.newNote=function(){currentNoteId=null;noteTitle.value='';noteBody.value='';renderNoteList();};
window.loadNote=function(id){
  let n=getNotes().find(x=>x.id===id); if(!n)return;
  currentNoteId=id; noteTitle.value=n.title; noteBody.value=n.body; renderNoteList();
};
window.saveNote=function(){
  let n=getNotes(), item={id:currentNoteId||Date.now().toString(36),title:noteTitle.value||'Untitled',body:noteBody.value,updated:Date.now()};
  if(currentNoteId){let i=n.findIndex(x=>x.id===currentNoteId);if(i>-1)n[i]=item;else n.push(item);}else{n.push(item);currentNoteId=item.id;}
  saveNotes(n); renderNoteList();
};
window.deleteNote=function(){
  if(!currentNoteId)return; let n=getNotes().filter(x=>x.id!==currentNoteId); saveNotes(n); newNote(); renderNoteList();
};
window.saveTextToNotebook=function(){noteTitle.value='Generated Text';noteBody.value=textOutput.textContent;saveNote();switchTab('notebook');};
window.sendImgToNotebook=function(){let {prompt,negative}=buildFinal();noteTitle.value=findStyle(S.style)?.l||'Image Prompt';noteBody.value='Prompt:\n'+prompt+'\n\nNegative:\n'+negative;saveNote();switchTab('notebook');};

/* ===== IMPORT / EXPORT / SETTINGS ===== */
function importStyles(){
  let raw=importStylesArea.value.trim(); if(!raw)return;
  if(raw.startsWith('t2i-styles-')||raw.startsWith('{import:')){alert('Simulated dependency import for "'+raw+'" – defaults already loaded.');return;}
  try{
    let data=JSON.parse(raw);
    if(!Array.isArray(data)) data=[data];
    for(let entry of data){
      let g=entry.group||'Imported',c=entry.color||'#aaa';
      let target=styleGroups.find(x=>x.g===g);
      if(!target){target={g,c,s:[]};styleGroups.push(target)}
      target.s.push(...(entry.styles||[]).map(s=>({i:s.id||s.i,l:s.label||s.l,p:s.prompt||s.p,n:s.negative||s.n||'',t:s.tags||s.t||{},m:s.modifiersRef||s.m||''})));
    }
    alert('Imported '+(data.length)+' groups.'); renderStyles();
  }catch(e){alert('Invalid JSON')}
}
async function exportFullData(){
  let notes=getNotes(), gallery=await getGal();
  let blob=new Blob([JSON.stringify({version:1,settings:S,notes,gallery},null,2)],{type:'application/json'});
  let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='ai-generator-data.json';a.click();
}
function importFullData(){
  let raw=importDataArea.value.trim(); if(!raw)return;
  try{
    let d=JSON.parse(raw);
    if(d.settings){S=d.settings;saveSet();saveUI();}
    if(Array.isArray(d.notes)) saveNotes(d.notes);
    if(Array.isArray(d.gallery)) setGal(d.gallery);
    alert('Data restored. Reloading.'); location.reload();
  }catch(e){alert('Invalid import JSON')}
}
window.resetAllData=function(){
  if(!confirm('Wipe ALL local data?'))return;
  localStorage.clear(); kv.aig.delete('gallery'); location.reload();
};

/* ===== HISTORY (simple) ===== */
function addHistory(entry,type){/* could expand into a visible history list */}

/* ===== INIT ===== */
function init(){
  descInput.value=S.desc; negInput.value=S.neg; resSelect.value=S.res;
  rememberCheck.checked=JSON.parse(localStorage.aiGen_remember||'true');
  autoSaveCheck.checked=S.settings.autoSave; streamCheck.checked=S.settings.stream;
  renderStyles(); renderModifiers(); updatePreview(); setMode(S.mode);
  setTimeout(()=>{let el=[...styleListCtn.querySelectorAll('button')].find(b=>b.textContent===findStyle(S.style)?.l);if(el)el.classList.add('selected');},0);
}
init();
</script>
