<body>
<style>
  :root{
    --bg:#0e1117; --panel:#161b22; --panel2:#1c2330; --border:#30363d;
    --txt:#c9d1d9; --dim:#8b949e; --acc:#58a6ff; --good:#3fb950; --bad:#f85149; --warn:#d29922;
    --type-normal:#9099a1; --type-fire:#ff9d55; --type-water:#5090d6; --type-grass:#63bc5a;
    --type-electric:#f4d23c; --type-ice:#73cec0; --type-fighting:#ce4069; --type-poison:#ab6ac8;
    --type-ground:#d97746; --type-flying:#8fa8dd; --type-psychic:#f97176; --type-bug:#90c12c;
    --type-rock:#c5b78c; --type-ghost:#5269ac; --type-dragon:#0b6dc3; --type-dark:#5a5366; --type-steel:#5a8ea1; --type-fairy:#ec8fe6;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;text-align:left}
  h1,h2,h3{margin:0 0 8px;font-weight:600}
  button{font:inherit;cursor:pointer;background:var(--panel2);color:var(--txt);border:1px solid var(--border);border-radius:6px;padding:6px 12px;transition:.15s}
  button:hover{border-color:var(--acc);color:#fff}
  button.primary{background:var(--acc);color:#000;border-color:var(--acc);font-weight:600}
  button.primary:hover{filter:brightness(1.1)}
  button.danger{border-color:var(--bad);color:var(--bad)}
  button.danger:hover{background:var(--bad);color:#fff}
  button.small{padding:3px 8px;font-size:12px}
  input,select,textarea{font:inherit;background:var(--bg);color:var(--txt);border:1px solid var(--border);border-radius:6px;padding:6px 10px;width:100%}
  textarea{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;resize:vertical}
  label{color:var(--dim);font-size:12px;display:block;margin-bottom:3px}
  .row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
  .row>*{flex:1;min-width:0}
  .row .shrink{flex:0 0 auto}
  header.app{background:linear-gradient(180deg,#161b22,#0e1117);border-bottom:1px solid var(--border);padding:12px 16px;position:sticky;top:0;z-index:10}
  header.app h1{font-size:18px;display:flex;align-items:center;gap:10px}
  header.app h1 .logo{font-size:22px}
  header.app .sub{color:var(--dim);font-size:12px;margin-top:2px}
  nav.tabs{display:flex;gap:2px;flex-wrap:wrap;margin-top:10px}
  nav.tabs button{background:transparent;border:none;border-bottom:2px solid transparent;border-radius:0;padding:6px 12px;color:var(--dim)}
  nav.tabs button.active{color:#fff;border-bottom-color:var(--acc)}
  nav.tabs button:hover{color:#fff}
  main{padding:16px;max-width:1400px;margin:0 auto}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:16px}
  .panel h2{font-size:15px;margin-bottom:12px;color:#fff;display:flex;align-items:center;gap:8px}
  .panel h2 .cnt{color:var(--dim);font-size:12px;font-weight:400}
  .grid{display:grid;gap:12px}
  .grid.cols-2{grid-template-columns:1fr 1fr}
  .grid.cols-3{grid-template-columns:1fr 1fr 1fr}
  @media(max-width:860px){.grid.cols-2,.grid.cols-3{grid-template-columns:1fr}}
  .card{background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:10px}
  .badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
  .badge.type{color:#fff}
  .badge.gen{background:#21262d;color:var(--dim)}
  .statbar{display:flex;align-items:center;gap:6px;margin:2px 0}
  .statbar .n{width:42px;color:var(--dim);font-size:11px}
  .statbar .bar{flex:1;height:8px;background:#21262d;border-radius:4px;overflow:hidden}
  .statbar .bar > div{height:100%;background:var(--acc)}
  .statbar .v{width:32px;text-align:right;font-size:12px;font-variant-numeric:tabular-nums}
  .poke-row{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:6px;cursor:pointer;border:1px solid transparent}
  .poke-row:hover{background:var(--panel2);border-color:var(--border)}
  .poke-row.selected{background:var(--panel2);border-color:var(--acc)}
  .poke-row img{width:40px;height:40px;image-rendering:pixelated}
  .poke-row .nm{font-weight:600}
  .poke-row .dx{color:var(--dim);font-size:11px}
  .toast{position:fixed;bottom:16px;right:16px;z-index:50;display:flex;flex-direction:column;gap:6px}
  .toast .t{background:var(--panel2);border:1px solid var(--border);border-left:3px solid var(--acc);padding:8px 12px;border-radius:6px;font-size:13px;box-shadow:0 4px 12px rgba(0,0,0,.4);max-width:380px}
  .toast .t.good{border-left-color:var(--good)}
  .toast .t.bad{border-left-color:var(--bad)}
  .toast .t.warn{border-left-color:var(--warn)}
  .loader{display:inline-block;width:14px;height:14px;border:2px solid var(--dim);border-top-color:var(--acc);border-radius:50%;animation:spin 1s linear infinite;vertical-align:-2px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
  pre.out{background:#0a0d12;border:1px solid var(--border);border-radius:6px;padding:12px;overflow:auto;max-height:560px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.5;white-space:pre;color:#c9d1d9}
  .pill{display:inline-block;padding:1px 7px;border-radius:8px;font-size:11px;background:#21262d;color:var(--dim);margin:1px}
  .pill.flag{background:#2a1f1f;color:var(--warn)}
  details summary{cursor:pointer;color:var(--acc);padding:4px 0}
  .field-grid{display:grid;grid-template-columns:120px 1fr;gap:6px 10px;align-items:center}
  .field-grid label{margin:0}
  .hidden-tab{display:none}
  .empty{color:var(--dim);text-align:center;padding:30px;font-style:italic}
</style>

<header class="app">
  <h1><span class="logo">⚡</span> PokéEmerald Data Engine <span class="pill">pokeemerald-expansion</span></h1>

<main id="main"></main>
<div class="toast" id="toast"></div>

<script type="module">
"use strict";
/* ============================================================
   PokéEmerald Data Engine  —  full client app
   ============================================================ */

const POKEAPI = "https://pokeapi.co/api/v2";
const KVFOLDER = "pokemon"; // matches `kvFolder` in main.pjs

// ---- mapping packs (from main.pjs globals, fallback to inline) ----
const MAP = {
  type:       new Map([["normal","TYPE_NORMAL"],["fire","TYPE_FIRE"],["water","TYPE_WATER"],["grass","TYPE_GRASS"],["electric","TYPE_ELECTRIC"],["ice","TYPE_ICE"],["fighting","TYPE_FIGHTING"],["poison","TYPE_POISON"],["ground","TYPE_GROUND"],["flying","TYPE_FLYING"],["psychic","TYPE_PSYCHIC"],["bug","TYPE_BUG"],["rock","TYPE_ROCK"],["ghost","TYPE_GHOST"],["dragon","TYPE_DRAGON"],["dark","TYPE_DARK"],["steel","TYPE_STEEL"],["fairy","TYPE_FAIRY"]]),
  region:     new Map([["kanto","REGION_KANTO"],["johto","REGION_JOHTO"],["hoenn","REGION_HOENN"],["sinnoh","REGION_SINNOH"],["unova","REGION_UNOVA"],["kalos","REGION_KALOS"],["alola","REGION_ALOLA"],["galar","REGION_GALAR"],["paldea","REGION_PALDEA"]]),
  generation: new Map([["generation-i","GEN_I"],["generation-ii","GEN_II"],["generation-iii","GEN_III"],["generation-iv","GEN_IV"],["generation-v","GEN_V"],["generation-vi","GEN_VI"],["generation-vii","GEN_VII"],["generation-viii","GEN_VIII"],["generation-ix","GEN_IX"]]),
  nature:     new Map([["hardy","NATURE_HARDY"],["lonely","NATURE_LONELY"],["brave","NATURE_BRAVE"],["adamant","NATURE_ADAMANT"],["naughty","NATURE_NAUGHTY"],["bold","NATURE_BOLD"],["docile","NATURE_DOCILE"],["relaxed","NATURE_RELAXED"],["impish","NATURE_IMPISH"],["lax","NATURE_LAX"],["timid","NATURE_TIMID"],["hasty","NATURE_HASTY"],["serious","NATURE_SERIOUS"],["jolly","NATURE_JOLLY"],["naive","NATURE_NAIVE"],["modest","NATURE_MODEST"],["mild","NATURE_MILD"],["quiet","NATURE_QUIET"],["bashful","NATURE_BASHFUL"],["rash","NATURE_RASH"],["calm","NATURE_CALM"],["gentle","NATURE_GENTLE"],["sassy","NATURE_SASSY"],["careful","NATURE_CAREFUL"],["quirky","NATURE_QUIRKY"]]),
  species:    new Map([["bulbasaur","SPECIES_BULBASAUR"],["ivysaur","SPECIES_IVYSAUR"],["venusaur","SPECIES_VENUSAUR"],["charmander","SPECIES_CHARMANDER"],["charmeleon","SPECIES_CHARMELEON"],["charizard","SPECIES_CHARIZARD"],["squirtle","SPECIES_SQUIRTLE"],["wartortle","SPECIES_WARTORTLE"],["blastoise","SPECIES_BLASTOISE"]]),
  move:       new Map([["tackle","MOVE_TACKLE"],["ember","MOVE_EMBER"],["growl","MOVE_GROWL"],["vine-whip","MOVE_VINE_WHIP"],["razor-leaf","MOVE_RAZOR_LEAF"],["scratch","MOVE_SCRATCH"],["pound","MOVE_POUND"],["water-gun","MOVE_WATER_GUN"]]),
  ability:    new Map([["overgrow","ABILITY_OVERGROW"],["blaze","ABILITY_BLAZE"],["torrent","ABILITY_TORRENT"],["chlorophyll","ABILITY_CHLOROPHYLL"],["solar-power","ABILITY_SOLAR_POWER"],["intimidate","ABILITY_INTIMIDATE"],["levitate","ABILITY_LEVITATE"]]),
  item:       new Map([["oran-berry","ITEM_ORAN_BERRY"],["sitrus-berry","ITEM_SITRUS_BERRY"],["leftovers","ITEM_LEFTOVERS"],["choice-band","ITEM_CHOICE_BAND"]]),
  moveFlags:  new Map([["tackle",["FLAG_CONTACT","FLAG_PROTECT_AFFECTED"]],["ember",["FLAG_PROTECT_AFFECTED","FLAG_MAGIC_COAT_AFFECTED"]],["growl",["FLAG_SOUND","FLAG_PROTECT_AFFECTED"]]]),
  abilityFlags: new Map([["intimidate",["ABILITY_FLAG_FIELD","ABILITY_FLAG_ON_SWITCH_IN"]],["levitate",["ABILITY_FLAG_FIELD"]]]),
};
const PREFIX = {
  species:"SPECIES", move:"MOVE", ability:"ABILITY", item:"ITEM",
  type:"TYPE", region:"REGION", generation:"GEN", nature:"NATURE",
};
function emId(kind, slug){
  if(slug==null) return null;
  const m = MAP[kind];
  if(m.has(slug)) return m.get(slug);
  const auto = PREFIX[kind]+"_"+String(slug).toUpperCase().replace(/[^A-Z0-9]+/g,"_").replace(/^_|_$/g,"");
  m.set(slug, auto); // cache for session
  return auto;
}
function snake(s){ return String(s||"").toUpperCase().replace(/[^A-Z0-9]+/g,"_").replace(/^_|_$/g,""); }

// ---- kv helpers ----
async function kvAll(){
  const entries = await root.kv[KVFOLDER].entries();
  const out = [];
  for(const [k,v] of entries) out.push(v);
  out.sort((a,b)=>(a.dexNumber||0)-(b.dexNumber||0));
  return out;
}
async function kvGet(name){ try{ return await root.kv[KVFOLDER].get(name); }catch{ return null; } }
async function kvPut(p){ await root.kv[KVFOLDER].set(p.name, p); }
async function kvDel(name){ await root.kv[KVFOLDER].delete(name); }

// ---- toast / status ----
function toast(msg, kind=""){
  const el = document.createElement("div");
  el.className = "t "+kind;
  el.textContent = msg;
  toastEl.appendChild(el);
  setTimeout(()=>{ el.style.opacity="0"; el.style.transition="opacity .4s"; setTimeout(()=>el.remove(),400); }, 3500);
}

// ============================================================
//  TRANSFORMER:  raw PokeAPI  →  emerald-compatible schema
// ============================================================
function transformPokemon(pkmn, species){
  const name = pkmn.name;
  const dex  = pkmn.id;

  // types
  const types = (pkmn.types||[]).map(t=>({
    name: t.type.name,
    slot: t.slot,
    emeraldId: emId("type", t.type.name),
  })).sort((a,b)=>a.slot-b.slot);

  // abilities
  const abilities = (pkmn.abilities||[]).map(a=>({
    name: a.ability.name,
    isHidden: !!a.is_hidden,
    slot: a.slot,
    emeraldId: emId("ability", a.ability.name),
    flags: MAP.abilityFlags.get(a.ability.name) || [],
  })).sort((a,b)=>a.slot-b.slot);

  // base stats
  const bs = {};
  (pkmn.stats||[]).forEach(s=>{
    const map = {hp:"hp",attack:"attack",defense:"defense","special-attack":"spAttack","special-defense":"spDefense",speed:"speed"};
    if(map[s.stat.name]) bs[map[s.stat.name]] = s.base_stat;
  });
  const baseStats = {hp:0,attack:0,defense:0,spAttack:0,spDefense:0,speed:0,...bs};
  const evYield = {hp:0,attack:0,defense:0,spAttack:0,spDefense:0,speed:0};
  (pkmn.stats||[]).forEach(s=>{
    const map = {hp:"hp",attack:"attack",defense:"defense","special-attack":"spAttack","special-defense":"spDefense",speed:"speed"};
    if(map[s.stat.name]) evYield[map[s.stat.name]] = s.effort||0;
  });

  // sprites
  const sp = pkmn.sprites||{};
  const sprites = {
    frontDefault:    sp.front_default || null,
    frontShiny:      sp.front_shiny || null,
    backDefault:     sp.back_default || null,
    backShiny:       sp.back_shiny || null,
    officialArtwork: (sp.other&&sp.other["official-artwork"]&&sp.other["official-artwork"].front_default) || null,
  };

  // moves — filter to emerald/ruby/sapphire/fr/lg version group for learnset relevance
  const EMERALD_VGS = new Set(["ruby-sapphire","emerald","firered-leafgreen"]);
  const moves = [];
  for(const m of (pkmn.moves||[])){
    const groups = m.version_group_details||[];
    let picked = null;
    // prefer emerald vg, else earliest
    for(const vg of groups){
      if(EMERALD_VGS.has(vg.version_group.name)){ picked = vg; break; }
    }
    if(!picked && groups.length) picked = groups[0];
    if(!picked) continue;
    const lvl = picked.level_learned_at ?? 0;
    const method = (picked.move_learn_method?.name) || "level-up";
    if(method==="level-up" && lvl===0 && groups.length>1) continue; // skip duplicate egg/machine lvl0
    moves.push({
      name: m.move.name,
      emeraldId: emId("move", m.move.name),
      method,
      level: lvl,
      versionGroup: picked.version_group.name,
      // category/power/accuracy filled below from a move cache when available
      category: null, categoryEmerald: null,
      power: null, accuracy: null, pp: null,
      flags: MAP.moveFlags.get(m.move.name) || [],
    });
  }
  // dedupe by (name, method, level)
  const seen = new Set();
  const movesDedup = moves.filter(m=>{
    const k = m.name+"|"+m.method+"|"+m.level;
    if(seen.has(k)) return false; seen.add(k); return true;
  }).sort((a,b)=> a.method!==b.method ? a.method.localeCompare(b.method) : a.level-b.level);

  // held items
  const items = [];
  for(const it of (pkmn.held_items||[])){
    for(const v of (it.version_details||[])){
      if(EMERALD_VGS.has(v.version.name) || v.version.name==="emerald"){
        items.push({
          name: it.item.name,
          emeraldId: emId("item", it.item.name),
          rarity: v.rarity,
          version: v.version.name,
        });
      }
    }
  }
  // dedupe items keeping highest rarity
  const itemMap = new Map();
  for(const it of items){
    const ex = itemMap.get(it.name);
    if(!ex || it.rarity>ex.rarity) itemMap.set(it.name, it);
  }
  const itemsDedup = [...itemMap.values()];

  // evolution chain (fetched separately, attached by caller via species.evolution_chain)
  const evolution = {
    chainId: species?.evolution_chain?.id || null,
    evolvesFrom: species?.evolves_from_species?.name || null,
    evolvesFromEmeraldId: species?.evolves_from_species ? emId("species", species.evolves_from_species.name) : null,
    evolvesTo: [], // filled by fetchEvolution()
  };

  // flavor text (emerald preferred)
  const flavorText = [];
  for(const ft of (species?.flavor_text_entries||[])){
    if(ft.language?.name==="en"){
      const version = ft.version?.name;
      const text = (ft.flavor_text||"").replace(/[\f\n\r\t]/g," ").replace(/\u00ad/g,"").trim();
      // dedupe by version
      if(!flavorText.find(f=>f.version===version)) flavorText.push({version, text});
    }
  }
  // put emerald first
  flavorText.sort((a,b)=> (a.version==="emerald"?0:1)-(b.version==="emerald"?0:1));

  // generation / region
  const gen = species?.generation?.name || "generation-i";
  const regionGuess = ({"generation-i":"kanto","generation-ii":"johto","generation-iii":"hoenn","generation-iv":"sinnoh","generation-v":"unova","generation-vi":"kalos","generation-vii":"alola","generation-viii":"galar","generation-ix":"paldea"})[gen] || "kanto";

  // growth rate, egg groups, gender, hatch
  const growthRate = species?.growth_rate?.name || null;
  const eggGroups = (species?.egg_groups||[]).map(g=>g.name);
  const genderRate = species?.gender_rate ?? -1;
  const hatchCounter = species?.hatch_counter ?? 0;

  return {
    dexNumber: dex,
    name,
    speciesEmeraldId: emId("species", name),
    classification: species?.genera?.find(g=>g.language?.name==="en")?.genus || null,
    generation: gen,
    generationEmeraldId: emId("generation", gen),
    region: regionGuess,
    regionEmeraldId: emId("region", regionGuess),
    types, abilities, baseStats, evYield,
    catchRate: species?.capture_rate ?? 0,
    baseExp: pkmn.base_experience ?? 0,
    growthRate, eggGroups, genderRate, hatchCounter,
    heightDecimeters: pkmn.height ?? 0,
    weightHectograms: pkmn.weight ?? 0,
    color: species?.color?.name || null,
    shape: species?.shape?.name || null,
    habitat: species?.habitat?.name || null,
    isBaby: !!species?.is_baby,
    isLegendary: !!species?.is_legendary,
    isMythical: !!species?.is_mythical,
    sprites,
    moves: movesDedup,
    items: itemsDedup,
    evolution,
    flavorText,
    cries: {
      latest: pkmn.cries?.latest || null,
      legacy: pkmn.cries?.legacy || null,
    },
    meta: {
      source:"pokeapi",
      lastUpdated: new Date().toISOString(),
    },
  };
}

// fetch evolution chain, populate evolvesTo
async function fetchEvolution(chainUrl){
  const data = await root.superFetch(chainUrl).then(r=>r.json());
  const out = [];
  function walk(node){
    for(const e of (node.evolves_to||[])){
      out.push({
        species: e.species?.name || null,
        speciesEmeraldId: e.species ? emId("species", e.species.name) : null,
        trigger: e.evolution_details?.[0]?.trigger?.name || null,
        minLevel: e.evolution_details?.[0]?.min_level ?? null,
        item: e.evolution_details?.[0]?.item?.name || null,
        itemEmeraldId: e.evolution_details?.[0]?.item ? emId("item", e.evolution_details?.[0]?.item.name) : null,
        timeOfDay: e.evolution_details?.[0]?.time_of_day || null,
        location: e.evolution_details?.[0]?.location?.name || null,
        knownMove: e.evolution_details?.[0]?.known_move?.name || null,
        knownMoveEmeraldId: e.evolution_details?.[0]?.known_move ? emId("move", e.evolution_details?.[0]?.known_move.name) : null,
        minHappiness: e.evolution_details?.[0]?.min_happiness ?? null,
        minBeauty: e.evolution_details?.[0]?.min_beauty ?? null,
        minAffection: e.evolution_details?.[0]?.min_affection ?? null,
      });
      walk(e);
    }
  }
  walk(data.chain);
  return out;
}

// fetch full move metadata (power/accuracy/pp/category) — batched lazily
const moveCache = new Map();
async function fetchMoveMeta(moveName){
  if(moveCache.has(moveName)) return moveCache.get(moveName);
  try{
    const m = await root.superFetch(`${POKEAPI}/move/${moveName}`).then(r=>r.json());
    const cat = m.damage_class?.name || null;
    const catMap = {physical:"CATEGORY_PHYSICAL",special:"CATEGORY_SPECIAL",status:"CATEGORY_STATUS"};
    const meta = {
      category: cat, categoryEmerald: catMap[cat]||null,
      power: m.power, accuracy: m.accuracy, pp: m.pp,
    };
    moveCache.set(moveName, meta);
    return meta;
  }catch{ return {category:null,categoryEmerald:null,power:null,accuracy:null,pp:null}; }
}

// ============================================================
//  CORE: fetch a pokemon by id/name from PokeAPI
// ============================================================
async function fetchPokemon(input, opts={}){
  input = String(input).trim().toLowerCase();
  const pkmn = await root.superFetch(`${POKEAPI}/pokemon/${input}`).then(r=>{
    if(!r.ok) throw new Error(`HTTP ${r.status}`); return r.json();
  });
  const species = await root.superFetch(pkmn.species.url).then(r=>r.json());
  const rec = transformPokemon(pkmn, species);
  if(species.evolution_chain?.url){
    try{ rec.evolution.evolvesTo = await fetchEvolution(species.evolution_chain.url); }catch{}
  }
  if(opts.moveMeta){
    // fill move metadata (slow, one fetch per move)
    for(const mv of rec.moves){
      const mm = await fetchMoveMeta(mv.name);
      Object.assign(mv, mm);
    }
  }
  return rec;
}

// fetch a range (e.g. 1-9 or 1,4,7)
async function fetchRange(spec, onProgress){
  const ids = parseRange(spec);
  const out = [];
  for(let i=0;i<ids.length;i++){
    onProgress && onProgress(i, ids.length, ids[i]);
    try{ out.push(await fetchPokemon(ids[i])); }catch(e){ toast(`#${ids[i]} failed: ${e.message}`,"bad"); }
  }
  return out;
}
function parseRange(spec){
  spec = String(spec).trim();
  if(/^\d+-\d+$/.test(spec)){
    const [a,b]=spec.split("-").map(Number); const out=[];
    for(let i=a;i<=b;i++) out.push(i); return out;
  }
  return spec.split(/[,\s]+/).map(s=>s.trim()).filter(Boolean);
}

const TABS = [
  ["fetch","Fetch"],["editor","Editor"],["creator","Creator"],["generator","Generator"],
  ["randomizer","Randomizer"],["enchanter","Enchanter"],["deleter","Deleter"],
  ["import","Import"],["output","Output"],["inject","Inject"],["test","Test"],["write","Write"],
];
let activeTab = "fetch";
let store = [];       // in-memory mirror of kv
let selectedName = null;

const mainEl = document.getElementById("main");
const toastEl = document.getElementById("toast");
const tabsEl = document.getElementById("tabs");

function renderTabs(){
  tabsEl.innerHTML = "";
  for(const [id,label] of TABS){
    const b = document.createElement("button");
    b.textContent = label;
    b.className = activeTab===id?"active":"";
    b.onclick = ()=>{ activeTab=id; renderTabs(); render(); };
    tabsEl.appendChild(b);
  }
}

async function refreshStore(){
  store = await kvAll();
  if(selectedName && !store.find(p=>p.name===selectedName)) selectedName = null;
}

async function render(){
  await refreshStore();
  mainEl.innerHTML = "";
  const fn = RENDER[activeTab];
  if(fn) fn();
  else mainEl.innerHTML = `<div class="empty">Unknown tab</div>`;
}

// ---------- shared widgets ----------
function typeBadge(name){
  const c = getComputedStyle(document.documentElement).getPropertyValue(`--type-${name}`).trim();
  return `<span class="badge type" style="background:${c||"#666"}">${name}</span>`;
}
function statsBars(bs){
  const order=["hp","attack","defense","spAttack","spDefense","speed"];
  const labels={hp:"HP",attack:"ATK",defense:"DEF",spAttack:"SpA",spDefense:"SpD",speed:"SPE"};
  return order.map(k=>{
    const v=bs[k]||0; const pct=Math.min(100, v);
    return `<div class="statbar"><span class="n">${labels[k]}</span><span class="bar"><div style="width:${pct}%"></div></span><span class="v">${v}</span></div>`;
  }).join("");
}
function pokeCard(p, onClick){
  const img = p.sprites?.frontDefault || p.sprites?.officialArtwork || "";
  return `<div class="poke-row" data-name="${p.name}">
    ${img?`<img src="${img}" alt="">`:""}
    <div style="flex:1">
      <div class="nm">${p.name} <span class="pill">${p.speciesEmeraldId||""}</span></div>
      <div class="dx">#${p.dexNumber} · ${p.generation||"?"} · ${(p.types||[]).map(t=>typeBadge(t.name)).join(" ")}</div>
    </div>
  </div>`;
}
function storeList(onClick){
  if(!store.length) return `<div class="empty">No Pokémon stored. Use the Fetch tab.</div>`;
  return store.map(p=>pokeCard(p)).join("");
}
function bindPokeRows(container, onClick){
  container.querySelectorAll(".poke-row").forEach(r=>{
    r.onclick = ()=>onClick(r.dataset.name);
  });
}

const RENDER = {};
RENDER.fetch = function(){
  mainEl.innerHTML = `
    <div class="panel">
      <h2>🌐 Fetch from PokéAPI</h2>
      <p style="color:var(--dim);margin:0 0 12px">Pull a Pokémon (or range) from PokeAPI and transform it into the emerald-compatible schema. Stored in <code>kv.pokemon</code>.</p>
      <div class="row">
        <div><label>Input — id, name, range (1-9) or list (1,4,7)</label>
          <input id="fInput" placeholder="e.g. bulbasaur  or  1-9  or  1,4,7,25"></div>
        <div class="shrink" style="width:170px"><label>Options</label>
          <select id="fOpts"><option value="">Standard (fast)</option><option value="moveMeta">+ Move metadata (slow)</option></select></div>
        <div class="shrink"><button class="primary" id="fBtn">Fetch</button></div>
      </div>
      <div id="fProg" style="margin-top:10px;color:var(--dim);font-size:12px"></div>
    </div>
    <div class="panel">
      <h2>Recently Fetched <span class="cnt">${store.length} stored</span></h2>
      <div id="fList" class="grid cols-3"></div>
    </div>`;
  const list = mainEl.querySelector("#fList");
  list.innerHTML = store.slice(-12).map(p=>pokeCard(p)).join("");
  bindPokeRows(list, name=>{ selectedName=name; switchTab("editor"); });
  mainEl.querySelector("#fBtn").onclick = doFetch;
  mainEl.querySelector("#fInput").addEventListener("keydown", e=>{ if(e.key==="Enter") doFetch(); });

  async function doFetch(){
    const inp = mainEl.querySelector("#fInput").value.trim();
    if(!inp){ toast("Enter an id/name/range","warn"); return; }
    const opts = { moveMeta: mainEl.querySelector("#fOpts").value==="moveMeta" };
    const btn = mainEl.querySelector("#fBtn");
    const prog = mainEl.querySelector("#fProg");
    btn.disabled = true; btn.innerHTML = `<span class="loader"></span> Fetching`;
    try{
      const ids = parseRange(inp);
      if(ids.length===1){
        prog.textContent = `Fetching ${ids[0]}…`;
        const p = await fetchPokemon(ids[0], opts);
        await kvPut(p);
        toast(`Fetched ${p.name} (#${p.dexNumber})`,"good");
      } else {
        const recs = await fetchRange(inp, (i,n,id)=>{
          prog.textContent = `Fetching ${id}  (${i+1}/${n})`;
        });
        for(const p of recs) await kvPut(p);
        toast(`Fetched ${recs.length} Pokémon`,"good");
      }
      await render();
    }catch(e){ toast(`Fetch failed: ${e.message}`,"bad"); }
    btn.disabled=false; btn.textContent="Fetch"; prog.textContent="";
  }
};

        <label>Classification</label><input data-k="classification" value="${p.classification||""}">
        <label>Generation</label><input data-k="generation" value="${p.generation||""}">
        <label>Region</label><input data-k="region" value="${p.region||""}">
        <label>Catch rate</label><input data-k="catchRate" type="number" value="${p.catchRate||0}">
        <label>Base exp</label><input data-k="baseExp" type="number" value="${p.baseExp||0}">

        <label>Growth rate</label><input data-k="growthRate" value="${p.growthRate||""}">

        <label>Hatch counter</label><input data-k="hatchCounter" type="number" value="${p.hatchCounter||0}">
        <label>Color</label><input data-k="color" value="${p.color||""}">
        <label>Shape</label><input data-k="shape" value="${p.shape||""}">

        <label>isLegendary</label><input data-k="isLegendary" type="checkbox" ${p.isLegendary?"checked":""}>

      <button class="small" id="addAbility">+ add ability</button>

      <details><summary>show moves</summary>

      // types
      const types=[]; d.querySelectorAll("[data-ti]").forEach(inp=>{
        const [i,k]=inp.dataset.ti.split(".");

      });
      p.types = types.filter(Boolean).map((t,i)=>({...t, slot:t.slot??i+1}));
      // abilities

        else abilities[i][k]=inp.type==="number"?Number(inp.value):inp.value;
      });
      p.abilities = abilities.filter(Boolean).map((a,i)=>({...a, slot:a.slot??i+1, flags:a.flags||[], emeraldId:a.emeraldId||emId("ability",a.name)}));

      const moves=[]; d.querySelectorAll("[data-mi]").forEach(inp=>{

      await kvPut(copy); selectedName=copy.name;
      toast(`Duplicated → ${copy.name}`,"good"); await render();
    };
    d.querySelector("#delBtn").onclick = async ()=>{
      if(!confirm(`Delete ${p.name}?`)) return;
      await kvDel(p.name); selectedName=null;

    d.querySelector("#addAbility").onclick = ()=>{ p.abilities.push({name:"none",isHidden:false,slot:p.abilities.length+1,emeraldId:"ABILITY_NONE",flags:[]}); paintDetail(); };

    d.querySelectorAll("[data-arm]").forEach(b=>b.onclick=()=>{ p.abilities.splice(Number(b.dataset.arm),1); paintDetail(); });
  }
};

    <div class="panel">
      <h2>🔀 Randomizer</h2>
      <p style="color:var(--dim);margin:0 0 12px">Take a stored Pokémon and shuffle its types, abilities, stats, or moves — keeping the emerald schema intact.</p>
      <div class="row">
        <div><label>Pokémon</label><select id="rSel">${storeSelOptions()}</select></div>
        <div class="shrink" style="width:160px"><label>Mode</label>
          <select id="rMode"><option value="types">types</option><option value="abilities">abilities</option><option value="stats">base stats</option><option value="moves">moves</option><option value="all">everything</option></select></div>
        <div class="shrink"><button class="primary" id="rBtn">Randomize</button></div>
      </div>
    </div>
    <div class="panel"><div id="rOut"><div class="empty">Pick a Pokémon and run.</div></div></div>`;
  mainEl.querySelector("#rBtn").onclick = async ()=>{
    const name = mainEl.querySelector("#rSel").value;
    if(!name){ toast("Pick a Pokémon","warn"); return; }
    const p = await kvGet(name); if(!p) return;
    const mode = mainEl.querySelector("#rMode").value;
    const allTypes = [...MAP.type.keys()];
    const allAbil = [...MAP.ability.keys()];
    function randTypes(){
      const n = 1+Math.floor(Math.random()*2);
      const ts = []; while(ts.length<n){ const t=allTypes[Math.floor(Math.random()*allTypes.length)]; if(!ts.includes(t)) ts.push(t); }
      p.types = ts.map((t,i)=>({name:t,slot:i+1,emeraldId:emId("type",t)}));
    }
    function randAbil(){
      const a1 = allAbil[Math.floor(Math.random()*allAbil.length)];
      p.abilities = [{name:a1,isHidden:false,slot:1,emeraldId:emId("ability",a1),flags:MAP.abilityFlags.get(a1)||[]}];
      if(Math.random()<0.5){ const a2=allAbil[Math.floor(Math.random()*allAbil.length)]; p.abilities.push({name:a2,isHidden:true,slot:3,emeraldId:emId("ability",a2),flags:MAP.abilityFlags.get(a2)||[]}); }
    }
    function randStats(){
      const keys=["hp","attack","defense","spAttack","spDefense","speed"];
      const total = 430 + Math.floor(Math.random()*120);
      const vals = keys.map(()=>Math.random());
      const sum = vals.reduce((a,b)=>a+b,0);
      keys.forEach((k,i)=>p.baseStats[k]=Math.max(5,Math.round(total*vals[i]/sum)));
    }
    function randMoves(){
      const allMoves = [...MAP.move.keys()];
      const n = 4; const picks=[];
      while(picks.length<n && allMoves.length){ const m=allMoves.splice(Math.floor(Math.random()*allMoves.length),1)[0]; picks.push(m); }
      p.moves = picks.map((m,i)=>({name:m,emeraldId:emId("move",m),method:"level-up",level:i*5+1,versionGroup:"emerald",category:null,categoryEmerald:null,power:null,accuracy:null,pp:null,flags:MAP.moveFlags.get(m)||[]}));
    }
    if(mode==="types"||mode==="all") randTypes();
    if(mode==="abilities"||mode==="all") randAbil();
    if(mode==="stats"||mode==="all") randStats();
    if(mode==="moves"||mode==="all") randMoves();
    p.meta = {...(p.meta||{}), lastUpdated:new Date().toISOString(), randomized:true};
    await kvPut(p);
    const out = mainEl.querySelector("#rOut");
    out.innerHTML = `<h2>${p.name} (randomized: ${mode})</h2>
      <div style="margin-bottom:8px">${(p.types||[]).map(t=>typeBadge(t.name)).join(" ")} ${(p.abilities||[]).map(a=>`<span class="pill">${a.name}${a.isHidden?" ★":""}</span>`).join(" ")}</div>
      <div id="rStats">${statsBars(p.baseStats)}</div>
      <details><summary>moves</summary><div>${(p.moves||[]).map(m=>`<div class="mono">${m.emeraldId} — L${m.level}</div>`).join("")}</div></details>
      <button class="primary" id="rAgain" style="margin-top:10px">🎲 Again</button>`;
    out.querySelector("#rAgain").onclick = ()=>mainEl.querySelector("#rBtn").click();
    toast(`Randomized ${p.name} (${mode})`,"good");
    await refreshStore();
  };
};
function storeSelOptions(){
  if(!store.length) return `<option value="">(none stored)</option>`;
  return store.map(p=>`<option value="${p.name}">#${p.dexNumber} ${p.name}</option>`).join("");
}

RENDER.enchanter = function(){
  mainEl.innerHTML = `

      <div class="row">
        <div><label>Pokémon</label><select id="eSel">${storeSelOptions()}</select></div>
        <div class="shrink" style="width:120px"><label>Stat ×</label><input id="eMult" type="number" value="1.3" step="0.1"></div>
        <div class="shrink" style="width:160px"><label>Extra ability</label><input id="eAbil" value="intimidate"></div>
        <div class="shrink"><button class="primary" id="eBtn">Enchant</button></div>
      </div>
      <div class="row" style="margin-top:8px">
        <label style="flex:0"><input type="checkbox" id="ePrefix" checked> prefix name</label>
        <label style="flex:0"><input type="checkbox" id="eSuffix"> suffix name</label>

      </div>
    </div>
    <div class="panel"><div id="eOut"><div class="empty">Pick a Pokémon to enchant.</div></div></div>`;
  mainEl.querySelector("#eBtn").onclick = async ()=>{
    const name = mainEl.querySelector("#eSel").value;
    if(!name){ toast("Pick a Pokémon","warn"); return; }
    const orig = await kvGet(name); if(!orig) return;
    const p = JSON.parse(JSON.stringify(orig));
    const mult = Number(mainEl.querySelector("#eMult").value)||1;
    const extraAbil = mainEl.querySelector("#eAbil").value.trim().toLowerCase();
    const prefix = mainEl.querySelector("#ePrefix").checked;
    const suffix = mainEl.querySelector("#eSuffix").checked;
    const leg = mainEl.querySelector("#eLeg").checked;
    // scale stats
    ["hp","attack","defense","spAttack","spDefense","speed"].forEach(k=>{
      p.baseStats[k] = Math.min(255, Math.round((p.baseStats[k]||0)*mult));
    });
    // extra ability
    if(extraAbil){
      p.abilities = p.abilities.filter(a=>a.name!==extraAbil);
      p.abilities.push({name:extraAbil, isHidden:true, slot:p.abilities.length+1, emeraldId:emId("ability",extraAbil), flags:MAP.abilityFlags.get(extraAbil)||[]});
    }
    // name
    const pre = prefix ? (root.enchantPrefixes?.selectOne?.evaluateItem || "Ancient") : "";
    const suf = suffix ? (root.enchantSuffixes?.selectOne?.evaluateItem || "") : "";
    const newName = (pre?pre.toLowerCase()+"-":"")+p.name+(suf?"-"+suf.toLowerCase().replace(/\s+/g,"-"):"");
    p.name = newName; p.speciesEmeraldId = emId("species", newName);
    if(leg) p.isLegendary = true;
    p.meta = {...(p.meta||{}), source:"enchanted", lastUpdated:new Date().toISOString(), enchantedFrom:orig.name};
    await kvPut(p);
    const out = mainEl.querySelector("#eOut");
    out.innerHTML = `<h2>${p.name} <span class="pill">enchanted</span></h2>
      <div style="margin-bottom:8px">${(p.types||[]).map(t=>typeBadge(t.name)).join(" ")} ${(p.abilities||[]).map(a=>`<span class="pill">${a.name}${a.isHidden?" ★":""}</span>`).join(" ")}</div>
      <div>${statsBars(p.baseStats)}</div>
      <div class="mono" style="margin-top:8px;color:var(--dim)">from: ${orig.name}</div>`;
    toast(`Enchanted → ${p.name}`,"good");
    await refreshStore();
  };
};

      items:[], evolution:{chainId:null,evolvesFrom:null,evolvesFromEmeraldId:null,evolvesTo:[]},
      flavorText:[{version:"custom",text:"A fiery lynx that ignites its fur when threatened."}],

};

      <div class="row">
        <div class="shrink" style="width:200px"><label>Format</label>

  mainEl.querySelector("#oBtn").onclick = ()=>generate();

    const t = mainEl.querySelector("#oOut").textContent;
    navigator.clipboard?.writeText(t).then(()=>toast("Copied","good"));
  };
  mainEl.querySelector("#oDownload").onclick = ()=>{
    const fmt = mainEl.querySelector("#oFmt").value;
    const ext = fmt.startsWith("c-")?"c":(fmt==="csv"?"csv":(fmt==="jsonl"?"jsonl":"json"));
    const blob = new Blob([mainEl.querySelector("#oOut").textContent], {type:"text/plain"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = `pokemon_${fmt}.${ext}`; a.click();
    URL.revokeObjectURL(a.href);
    toast("Downloaded","good");
  };
  function generate(){
    const fmt = mainEl.querySelector("#oFmt").value;

    let pool = store.slice();
    if(gen) pool = pool.filter(p=>p.generation===gen);
    const out = mainEl.querySelector("#oOut");
    out.textContent = formatOutput(fmt, pool);

  function formatOutput(fmt, pool){
    switch(fmt){
      case "json": return JSON.stringify(pool);
      case "json-pretty": return JSON.stringify(pool, null, 2);
      case "jsonl": return pool.map(p=>JSON.stringify(p)).join("\n");
      case "csv": return toCSV(pool);
      case "c-species": return cSpeciesTable(pool);
      case "c-types": return cTypeTables(pool);
      case "c-abilities": return cAbilityTables(pool);
      case "c-moves": return cLearnsetTables(pool);
      case "c-stats": return cStatsTable(pool);
      case "schema": return JSON.stringify(PARQUET_SCHEMA, null, 2);
      case "mappings": return JSON.stringify(exportMappings(), null, 2);
      default: return "?";
    }
  }
};
function toCSV(pool){
  if(!pool.length) return "";
  const cols = ["dexNumber","name","speciesEmeraldId","classification","generation","region","catchRate","baseExp","heightDecimeters","weightHectograms","color","shape","habitat","isBaby","isLegendary","isMythical","hp","attack","defense","spAttack","spDefense","speed","types","abilities"];
  const rows = [cols.join(",")];
  for(const p of pool){
    const vals = cols.map(c=>{
      let v;
      if(["hp","attack","defense","spAttack","spDefense","speed"].includes(c)) v=p.baseStats?.[c];
      else if(c==="types") v=(p.types||[]).map(t=>t.name).join("|");
      else if(c==="abilities") v=(p.abilities||[]).map(a=>a.name).join("|");
      else v=p[c];
      v = v==null?"":String(v);
      if(v.includes(",")||v.includes('"')) v='"'+v.replace(/"/g,'""')+'"';
      return v;
    });
    rows.push(vals.join(","));
  }
  return rows.join("\n");
}
function cSpeciesTable(pool){
  let s = "// ============================================================\n//  src/data/pokemon/species_info.h  (generated)\n// ============================================================\n\n";
  s += "const struct SpeciesInfo gSpeciesInfo[NUM_SPECIES] =\n{\n";
  // index 0 = none
  s += `    [SPECIES_NONE] =\n    {\n        .dexNumber = 0,\n        .baseHp = 0,\n    },\n`;
  for(const p of pool){
    const id = p.speciesEmeraldId||("SPECIES_"+snake(p.name));
    s += `    [${id}] =\n    {\n`;
    s += `        .dexNumber = ${p.dexNumber},\n`;
    s += `        .baseHp = ${p.baseStats.hp}, .baseAttack = ${p.baseStats.attack}, .baseDefense = ${p.baseStats.defense},\n`;
    s += `        .baseSpAttack = ${p.baseStats.spAttack}, .baseSpDefense = ${p.baseStats.spDefense}, .baseSpeed = ${p.baseStats.speed},\n`;
    s += `        .types = { ${(p.types||[]).map(t=>t.emeraldId).join(", ")} },\n`;
    s += `        .abilities = { ${(p.abilities||[]).map(a=>a.emeraldId).join(", ")} },\n`;
    s += `        .catchRate = ${p.catchRate},\n`;
    s += `        .height = ${p.heightDecimeters}, .weight = ${p.weightHectograms},\n`;
    if(p.isLegendary) s += `        .isLegendary = TRUE,\n`;
    if(p.isMythical) s += `        .isMythical = TRUE,\n`;
    s += `    },\n`;
  }
  s += "};\n";
  return s;
}
function cTypeTables(pool){
  let s = "// src/data/pokemon/species_types.h (generated)\n\n";
  s += "const u8 gSpeciesTypes[NUM_SPECIES] =\n{\n";
  s += "    [SPECIES_NONE] = TYPE_MYSTERY,\n";
  for(const p of pool){
    s += `    [${p.speciesEmeraldId}] = ${p.types?.[0]?.emeraldId||"TYPE_MYSTERY"},\n`;
  }
  s += "};\n\n";
  s += "const u8 gSpeciesSecondaryTypes[NUM_SPECIES] =\n{\n";
  s += "    [SPECIES_NONE] = TYPE_MYSTERY,\n";
  for(const p of pool){
    s += `    [${p.speciesEmeraldId}] = ${p.types?.[1]?.emeraldId||"TYPE_MYSTERY"},\n`;
  }
  s += "};\n";
  return s;
}
function cAbilityTables(pool){
  let s = "// src/data/pokemon/abilities.h (generated)\n\n";
  for(const idx of [0,1,2]){
    s += `const u16 gSpeciesAbilities${idx?idx:""}[NUM_SPECIES] =\n{\n    [SPECIES_NONE] = ABILITY_NONE,\n`;
    for(const p of pool){
      const a = p.abilities?.[idx];
      s += `    [${p.speciesEmeraldId}] = ${a?.emeraldId||"ABILITY_NONE"},\n`;
    }
    s += "};\n\n";
  }
  return s;
}
function cLearnsetTables(pool){
  let s = "// src/data/pokemon/level_up_learnsets.h (generated)\n\n";
  for(const p of pool){
    s += `static const struct LearnsetMove s${snake(p.name)}LevelUpLearnset[] =\n{\n`;
    for(const m of (p.moves||[])){
      if(m.method!=="level-up") continue;
      s += `    LEVEL_UP_MOVE(${m.level}, ${m.emeraldId}),\n`;
    }
    s += `    LEVEL_UP_MOVE_END\n};\n\n`;
  }
  s += "const struct LearnsetMove *const gLevelUpLearnsets[NUM_SPECIES] =\n{\n";
  s += "    [SPECIES_NONE] = NULL,\n";
  for(const p of pool){
    s += `    [${p.speciesEmeraldId}] = s${snake(p.name)}LevelUpLearnset,\n`;
  }
  s += "};\n";
  return s;
}
function cStatsTable(pool){
  let s = "// src/data/pokemon/base_stats.h (generated)\n\n";
  s += "const struct SpeciesBaseStats gSpeciesBaseStats[NUM_SPECIES] =\n{\n";
  s += "    [SPECIES_NONE] = {0},\n";
  for(const p of pool){
    s += `    [${p.speciesEmeraldId}] =\n    {\n`;
    s += `        .baseHp = ${p.baseStats.hp},\n        .baseAttack = ${p.baseStats.attack},\n`;
    s += `        .baseDefense = ${p.baseStats.defense},\n        .baseSpAttack = ${p.baseStats.spAttack},\n`;
    s += `        .baseSpDefense = ${p.baseStats.spDefense},\n        .baseSpeed = ${p.baseStats.speed},\n`;
    s += `        .catchRate = ${p.catchRate},\n        .expYield = ${p.baseExp},\n`;
    s += `    },\n`;
  }
  s += "};\n";
  return s;
}
const PARQUET_SCHEMA = {
  schema:{
    dexNumber:"INT32", name:"STRING", speciesEmeraldId:"STRING",
    classification:"STRING", generation:"STRING", generationEmeraldId:"STRING", region:"STRING", regionEmeraldId:"STRING",
    types:{type:"LIST",element:{type:"STRUCT",fields:{name:"STRING",slot:"INT32",emeraldId:"STRING"}}},
    abilities:{type:"LIST",element:{type:"STRUCT",fields:{name:"STRING",isHidden:"BOOLEAN",slot:"INT32",emeraldId:"STRING",flags:{type:"LIST",element:"STRING"}}}},
    baseStats:{type:"STRUCT",fields:{hp:"INT32",attack:"INT32",defense:"INT32",spAttack:"INT32",spDefense:"INT32",speed:"INT32"}},
    evYield:{type:"STRUCT",fields:{hp:"INT32",attack:"INT32",defense:"INT32",spAttack:"INT32",spDefense:"INT32",speed:"INT32"}},
    catchRate:"INT32", baseExp:"INT32", growthRate:"STRING",
    eggGroups:{type:"LIST",element:"STRING"}, genderRate:"INT32", hatchCounter:"INT32",
    heightDecimeters:"INT32", weightHectograms:"INT32",
    color:"STRING", shape:"STRING", habitat:"STRING",
    isBaby:"BOOLEAN", isLegendary:"BOOLEAN", isMythical:"BOOLEAN",
    sprites:{type:"STRUCT",fields:{frontDefault:"STRING",frontShiny:"STRING",backDefault:"STRING",backShiny:"STRING",officialArtwork:"STRING"}},
    moves:{type:"LIST",element:{type:"STRUCT",fields:{name:"STRING",emeraldId:"STRING",method:"STRING",level:"INT32",versionGroup:"STRING",category:"STRING",categoryEmerald:"STRING",power:"INT32",accuracy:"INT32",pp:"INT32",flags:{type:"LIST",element:"STRING"}}}},
    items:{type:"LIST",element:{type:"STRUCT",fields:{name:"STRING",emeraldId:"STRING",rarity:"INT32",version:"STRING"}}},
    evolution:{type:"STRUCT",fields:{chainId:"INT32",evolvesFrom:"STRING",evolvesFromEmeraldId:"STRING",evolvesTo:{type:"LIST",element:{type:"STRUCT",fields:{species:"STRING",speciesEmeraldId:"STRING",trigger:"STRING",minLevel:"INT32",item:"STRING",itemEmeraldId:"STRING",timeOfDay:"STRING",location:"STRING",knownMove:"STRING",knownMoveEmeraldId:"STRING",minHappiness:"INT32",minBeauty:"INT32",minAffection:"INT32"}}}}},
    flavorText:{type:"LIST",element:{type:"STRUCT",fields:{version:"STRING",text:"STRING"}}},
    cries:{type:"STRUCT",fields:{latest:"STRING",legacy:"STRING"}},
    meta:{type:"STRUCT",fields:{source:"STRING",lastUpdated:"TIMESTAMP_MICROS"}}
  },
  compression:"ZSTD", encoding:"RLE_DICTIONARY", rowGroupSizeMB:128, fileSizeMB:512, partitionKeys:["generation","region"]
};
function exportMappings(){
  const out = {};
  for(const k of Object.keys(MAP)){
    out[k+"_map"] = Object.fromEntries(MAP[k]);
  }
  return out;
}

// ============================================================
//  TAB: INJECT  (paste C header → patch)
// ============================================================
RENDER.inject = function(){
  mainEl.innerHTML = `
    <div class="panel">
      <h2>💉 Inject</h2>
      <p style="color:var(--dim);margin:0 0 12px">Generate pokeemerald-expansion C headers from your stored data, and inject them into an existing header file (paste below). New entries are merged; existing ones are overwritten.</p>
      <div class="row">
        <div class="shrink" style="width:180px"><label>Inject type</label>
          <select id="jType">
            <option value="species">species constants</option>
            <option value="stats">base stats</option>
            <option value="types">type tables</option>
            <option value="abilities">ability tables</option>
            <option value="learnset">learnsets</option>
          </select></div>
        <div class="shrink"><button class="primary" id="jGen">Generate source</button></div>
        <div class="shrink"><button id="jMerge">Merge into file ↓</button></div>
      </div>
    </div>
    <div class="grid cols-2">
      <div class="panel"><h2>Generated C</h2><textarea id="jGen_text" rows="18"></textarea></div>
      <div class="panel"><h2>Target file (paste existing)</h2><textarea id="jTarget" rows="18" placeholder="// paste existing .h / .c file here"></textarea></div>
    </div>
    <div class="panel"><h2>Merged result</h2><pre class="out" id="jMerged">— run Merge —</pre></div>`;
  mainEl.querySelector("#jGen").onclick = ()=>{
    const t = mainEl.querySelector("#jType").value;
    const map = {species:cSpeciesTable,stats:cStatsTable,types:cTypeTables,abilities:cAbilityTables,learnset:cLearnsetTables};
    mainEl.querySelector("#jGen_text").value = map[t](store);
    toast("Generated","good");
  };
  mainEl.querySelector("#jMerge").onclick = ()=>{
    const gen = mainEl.querySelector("#jGen_text").value;
    const tgt = mainEl.querySelector("#jTarget").value;
    if(!gen||!tgt){ toast("Need both generated and target","warn"); return; }
    const merged = mergeCFile(tgt, gen);
    mainEl.querySelector("#jMerged").textContent = merged;
    toast("Merged","good");
  };
  function mergeCFile(target, generated){
    // extract [SYMBOL] = { ... } entries from generated, then patch target
    const genEntries = new Map();
    const re = /\[(SPECIES_\w+|MOVE_\w+|ABILITY_\w+|TYPE_\w+|ITEM_\w+)\]\s*=\s*\{([\s\S]*?)\n\s*\},/g;
    let m;
    while((m=re.exec(generated))!==null) genEntries.set(m[1], m[0]);
    let out = target;
    for(const [sym,entry] of genEntries){
      const targetRe = new RegExp(`\\[${sym}\\]\\s*=\\s*\\{[\\s\\S]*?\\n\\s*\\},`,"g");
      if(targetRe.test(out)){
        out = out.replace(targetRe, entry);
      } else {
        // insert before closing };
        out = out.replace(/(\};\s*)$/, entry+"\n$1");
      }
    }
    return out;
  }
};

// ============================================================
//  TAB: TEST  (schema validation)
// ============================================================
RENDER.test = function(){
  mainEl.innerHTML = `
    <div class="panel">
      <h2>🧪 Test / Validate</h2>
      <p style="color:var(--dim);margin:0 0 12px">Validates every stored Pokémon against the parquet schema. Reports missing/invalid fields, clamps out-of-range numerics.</p>
      <div class="row">
        <div class="shrink"><button class="primary" id="tBtn">Run validation</button></div>
        <div class="shrink"><button id="tFix">Auto-fix (clamp + fill emeraldIds)</button></div>
      </div>
    </div>
    <div class="panel"><pre class="out" id="tOut">— click Run validation —</pre></div>`;
  mainEl.querySelector("#tBtn").onclick = ()=>run(false);
  mainEl.querySelector("#tFix").onclick = ()=>run(true);
  async function run(fix){
    const lines = [];
    let errors=0, fixed=0;
    const STAT_KEYS=["hp","attack","defense","spAttack","spDefense","speed"];
    for(const p of store){
      const name=p.name||"?";
      const errs=[];
      const fixes=[];
      if(typeof p.dexNumber!=="number"){ errs.push("dexNumber not number"); }
      if(!p.name){ errs.push("name missing"); }
      if(!p.speciesEmeraldId){ errs.push("speciesEmeraldId missing"); if(fix){ p.speciesEmeraldId=emId("species",p.name); fixes.push("speciesEmeraldId"); } }
      if(!p.baseStats){ errs.push("baseStats missing"); }
      else STAT_KEYS.forEach(k=>{
        if(typeof p.baseStats[k]!=="number"){ errs.push(`baseStats.${k} not number`); if(fix){ p.baseStats[k]=Number(p.baseStats[k])||0; fixes.push(`baseStats.${k}`); } }
        else if(p.baseStats[k]<0||p.baseStats[k]>255){ errs.push(`baseStats.${k}=${p.baseStats[k]} out of [0,255]`); if(fix){ p.baseStats[k]=Math.max(0,Math.min(255,p.baseStats[k])); fixes.push(`baseStats.${k}`); } }
      });
      (p.types||[]).forEach((t,i)=>{ if(!t.emeraldId){ errs.push(`types[${i}].emeraldId missing`); if(fix){ t.emeraldId=emId("type",t.name); fixes.push(`types[${i}].emeraldId`); } } });
      (p.abilities||[]).forEach((a,i)=>{ if(!a.emeraldId){ errs.push(`abilities[${i}].emeraldId missing`); if(fix){ a.emeraldId=emId("ability",a.name); fixes.push(`abilities[${i}].emeraldId`); } } if(!a.flags){ a.flags=[]; if(fix) fixes.push(`abilities[${i}].flags`); } });
      (p.moves||[]).forEach((mv,i)=>{ if(!mv.emeraldId){ errs.push(`moves[${i}].emeraldId missing`); if(fix){ mv.emeraldId=emId("move",mv.name); fixes.push(`moves[${i}].emeraldId`); } } if(!mv.flags){ mv.flags=[]; if(fix) fixes.push(`moves[${i}].flags`); } });
      if(p.catchRate<0||p.catchRate>255){ errs.push(`catchRate=${p.catchRate} out of range`); if(fix){ p.catchRate=Math.max(0,Math.min(255,p.catchRate)); fixes.push("catchRate"); } }
      if(!p.meta){ errs.push("meta missing"); if(fix){ p.meta={source:"manual",lastUpdated:new Date().toISOString()}; fixes.push("meta"); } }
      if(errs.length){ errors+=errs.length; lines.push(`❌ ${name}:`); errs.forEach(e=>lines.push(`   - ${e}`)); }
      else lines.push(`✅ ${name}  OK`);
      if(fix && fixes.length){ p.meta={...(p.meta||{}),lastUpdated:new Date().toISOString()}; await kvPut(p); fixed+=fixes.length; lines.push(`   🔧 fixed: ${fixes.join(", ")}`); }
    }
    lines.push(`\n--- ${store.length} checked, ${errors} errors${fix?`, ${fixed} fixes applied`:""} ---`);
    mainEl.querySelector("#tOut").textContent = lines.join("\n");
    toast(fix?`Fixed ${fixed} issues`:`${errors} errors found`, errors?"warn":"good");
    if(fix) await refreshStore();
  }
};

// ============================================================
//  TAB: WRITE  (write all to workspace / download bundle)
// ============================================================
RENDER.write = function(){
  mainEl.innerHTML = `
    <div class="panel">
      <h2>💾 Write</h2>
      <p style="color:var(--dim);margin:0 0 12px">Export your full dataset as a bundle of files (JSON + C headers + mappings + schema). Each file becomes a download.</p>
      <div class="row">
        <div class="shrink" style="width:160px"><label>Format</label><select id="wFmt"><option value="json">JSON</option><option value="c">C headers</option><option value="both">both</option></select></div>
        <div class="shrink"><button class="primary" id="wBtn">Write bundle</button></div>
        <div class="shrink"><button id="wAll">Download single combined file</button></div>
      </div>
      <div id="wFiles" style="margin-top:12px"></div>
    </div>`;
  mainEl.querySelector("#wBtn").onclick = ()=>writeBundle();
  mainEl.querySelector("#wAll").onclick = ()=>writeCombined();
  async function writeBundle(){
    const fmt = mainEl.querySelector("#wFmt").value;
    const ctn = mainEl.querySelector("#wFiles");
    ctn.innerHTML = "";
    const files = [];
    if(fmt==="json"||fmt==="both"){
      files.push(["pokemon_data.json", JSON.stringify(store, null, 2)]);
      files.push(["parquet_schema.json", JSON.stringify(PARQUET_SCHEMA, null, 2)]);
      files.push(["mappings.json", JSON.stringify(exportMappings(), null, 2)]);
    }
    if(fmt==="c"||fmt==="both"){
      files.push(["species_info.h", cSpeciesTable(store)]);
      files.push(["base_stats.h", cStatsTable(store)]);
      files.push(["species_types.h", cTypeTables(store)]);
      files.push(["abilities.h", cAbilityTables(store)]);
      files.push(["level_up_learnsets.h", cLearnsetTables(store)]);
    }
    for(const [name, content] of files){
      const blob = new Blob([content], {type:"text/plain"});
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = name; a.click();
      URL.revokeObjectURL(a.href);
      const div = document.createElement("div");
      div.className = "card";
      div.style.marginBottom = "6px";
      div.innerHTML = `<span class="pill">wrote</span> <code>${name}</code> <span class="pill">${content.length} bytes</span>`;
      ctn.appendChild(div);
    }
    toast(`Wrote ${files.length} files`,"good");
  }
  async function writeCombined(){
    const parts = [];
    parts.push("# PokéEmerald Data Bundle");
    parts.push(`# Generated: ${new Date().toISOString()}`);
    parts.push(`# Pokémon count: ${store.length}`);
    parts.push("");
    parts.push("## === pokemon_data.json ===");
    parts.push(JSON.stringify(store, null, 2));
    parts.push("");
    parts.push("## === parquet_schema.json ===");
    parts.push(JSON.stringify(PARQUET_SCHEMA, null, 2));
    parts.push("");
    parts.push("## === species_info.h ===");
    parts.push(cSpeciesTable(store));
    parts.push("## === base_stats.h ===");
    parts.push(cStatsTable(store));
    parts.push("## === species_types.h ===");
    parts.push(cTypeTables(store));
    parts.push("## === abilities.h ===");
    parts.push(cAbilityTables(store));
    parts.push("## === level_up_learnsets.h ===");
    parts.push(cLearnsetTables(store));
    const content = parts.join("\n");
    const blob = new Blob([content], {type:"text/plain"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "pokemon_bundle.txt"; a.click();
    URL.revokeObjectURL(a.href);
    toast("Combined bundle downloaded","good");
  }
};
