<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>ow8f1pk28v — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<style>
  html { color-scheme: dark light; }
  body {
    text-align: left;
    font-family: system-ui, sans-serif;
    background: light-dark(#f4f4f5, #0a0a0a);
    color: light-dark(#111, #e6e6e6);
    margin: 0;
    padding: 1rem;
  }
  .wrap { max-width: 980px; margin: 0 auto; }
  h1 { font-size: 1.25rem; margin: 0 0 1rem; }
  .row { display: flex; gap: 0.75rem; align-items: flex-end; flex-wrap: wrap; margin-bottom: 0.75rem; }
  label { font-size: 0.8rem; display: block; margin-bottom: 0.25rem; opacity: 0.8; }
  input[type=text], input[type=number], textarea {
    background: light-dark(#fff, #1a1a1a);
    color: inherit;
    border: 1px solid light-dark(#ccc, #333);
    border-radius: 4px;
    padding: 0.5rem;
    font: inherit;
  }
  #promptInput { width: 100%; min-height: 60px; resize: vertical; box-sizing: border-box; }
  .seedRow { display: flex; gap: 0.25rem; align-items: center; }
  #seedInput { width: 140px; }
  button {
    background: light-dark(#222, #eee);
    color: light-dark(#fff, #111);
    border: 0;
    border-radius: 4px;
    padding: 0.5rem 0.9rem;
    font: inherit;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  button.small { padding: 0.4rem 0.6rem; font-size: 0.85rem; }
  #fileInput { display: none; }
  .refPreview {
    width: 80px; height: 80px; object-fit: cover; border-radius: 4px;
    border: 1px solid light-dark(#ccc, #333); vertical-align: middle;
  }
  .refCtn { display: flex; gap: 0.5rem; align-items: center; }
  .results { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1rem; }
  .col { background: light-dark(#fff, #141414); border-radius: 6px; padding: 0.75rem; }
  .col h3 { margin: 0 0 0.5rem; font-size: 0.95rem; }
  .imgSlot { min-height: 200px; display: flex; align-items: center; justify-content: center; aspect-ratio: 1/1; background: light-dark(#eee, #1d1d1d); border-radius: 4px; overflow: hidden; }
  .imgSlot img { width: 100%; height: 100%; object-fit: contain; }
  .imgSlot .loading { opacity: 0.6; font-size: 0.85rem; }
  .meta { font-size: 0.75rem; opacity: 0.6; margin-top: 0.4rem; word-break: break-word; }
  .hint { font-size: 0.8rem; opacity: 0.7; margin: 0.5rem 0 1rem; }
  @media (max-width: 640px) { .results { grid-template-columns: 1fr; } }
</style>

<div class="wrap">
  <h1>Image-to-Image A/B Tester</h1>
  <p class="hint">Same prompt + same seed, generated twice: once without a reference image (A) and once with it (B). Compare to see what the reference image actually changes.</p>

  <div class="row">
    <div style="flex:1; min-width: 240px;">
      <label for="promptInput">Prompt</label>
      <textarea id="promptInput">a cute mouse</textarea>
    </div>
  </div>

  <div class="row">
    <div>
      <label for="seedInput">Seed (same for A &amp; B)</label>
      <div class="seedRow">
        <input type="number" id="seedInput" value="-1">
        <button class="small" id="randSeedBtn" title="random seed">🎲</button>
      </div>
    </div>
    <div>
      <label>Reference image</label>
      <div class="refCtn">
        <img id="refPreview" class="refPreview" alt="no reference" hidden>
        <button class="small" id="pickBtn">Choose image</button>
        <button class="small" id="clearRefBtn" hidden>Clear</button>
      </div>
      <input type="file" id="fileInput" accept="image/*">
    </div>
    <div>
      <label for="blurInput">Ref blur (0–1)</label>
      <input type="number" id="blurInput" value="0" min="0" max="1" step="0.1" style="width:90px;">
    </div>
    <div>
      <label>&nbsp;</label>
      <button id="generateBtn">Generate A/B</button>
    </div>
  </div>

  <div class="results">
    <div class="col">
      <h3>A — text only</h3>
      <div class="imgSlot" id="slotA"><span class="loading">—</span></div>
      <div class="meta" id="metaA"></div>
    </div>
    <div class="col">
      <h3>B — with reference</h3>
      <div class="imgSlot" id="slotB"><span class="loading">—</span></div>
      <div class="meta" id="metaB"></div>
    </div>
  </div>
</div>

<script type="module">
  const $ = id => document.getElementById(id);
  let refBlob = null;

  $("randSeedBtn").addEventListener("click", () => {
    $("seedInput").value = Math.floor(Math.random() * 1e9);
  });

  $("pickBtn").addEventListener("click", () => $("fileInput").click());

  $("fileInput").addEventListener("change", e => {
    const f = e.target.files[0];
    if (!f) return;
    refBlob = f;
    const prev = $("refPreview");
    prev.src = URL.createObjectURL(f);
    prev.hidden = false;
    $("clearRefBtn").hidden = false;
    $("pickBtn").textContent = "Change";
  });

  $("clearRefBtn").addEventListener("click", () => {
    refBlob = null;
    $("refPreview").hidden = true;
    $("refPreview").src = "";
    $("clearRefBtn").hidden = true;
    $("pickBtn").textContent = "Choose image";
    $("fileInput").value = "";
  });

  function setLoading(slot, meta) {
    slot.innerHTML = '<span class="loading">generating…</span>';
    meta.textContent = "";
  }

  async function gen(opts) {
    return await root.genWithRef(opts.prompt, opts.seed, opts.refBlobUrl || "", opts.blur || 0);
  }

  $("generateBtn").addEventListener("click", async () => {
    const prompt = $("promptInput").value.trim();
    if (!prompt) return;
    let seed = Number($("seedInput").value);
    if (!Number.isFinite(seed)) seed = -1;
    const blur = Math.max(0, Math.min(1, Number($("blurInput").value) || 0));

    const slotA = $("slotA"), slotB = $("slotB");
    const metaA = $("metaA"), metaB = $("metaB");
    const btn = $("generateBtn");
    btn.disabled = true;

    setLoading(slotA, metaA);
    setLoading(slotB, metaB);

    const baseOpts = { prompt, seed, resolution: "512x512" };

    const aPromise = gen({ ...baseOpts });

    let bPromise;
    if (refBlob) {
      const refBlobUrl = URL.createObjectURL(refBlob);
      bPromise = gen({ ...baseOpts, refBlobUrl, blur });
    } else {
      bPromise = Promise.resolve(null);
      slotB.innerHTML = '<span class="loading">no reference image selected</span>';
    }

    // A
    try {
      const r = await aPromise;
      slotA.innerHTML = "";
      const img = document.createElement("img");
      img.src = r.dataUrl;
      slotA.appendChild(img);
      metaA.textContent = `seed used: ${r.inputs.seed}`;
    } catch (err) {
      slotA.innerHTML = '<span class="loading">error</span>';
      metaA.textContent = String(err);
    }

    // B
    if (refBlob) {
      try {
        const r = await bPromise;
        slotB.innerHTML = "";
        const img = document.createElement("img");
        img.src = r.dataUrl;
        slotB.appendChild(img);
        metaB.textContent = `seed used: ${r.inputs.seed} | blur: ${blur}`;
      } catch (err) {
        slotB.innerHTML = '<span class="loading">error</span>';
        metaB.textContent = String(err);
      }
    }

    btn.disabled = false;
  });
</script>

</body>
</html>
