<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>character-forging — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<!--
Character Forging: AI-Powered Character Generator
  [x] Dual-mode generation (AI-assisted and manual procedural)
  [x] AI text generation with streaming output
  [x] AI image generation for character portraits
  [x] Manual attribute selection with randomization
  [x] Interactive HTML5 canvas for sketching avatars
  [x] Character card display with exportable summary
  [x] Tab-based navigation between features
  [x] Responsive dark-themed UI
Possible Next Steps:
  [ ] Save/load characters to local storage
  [ ] More image resolutions
  [ ] Character relationship generator
-->

<div id="appContainer" style="min-height:100vh; background:linear-gradient(135deg, #0f0c29, #302b63, #24243e); font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color:#e0e0e0; padding:20px; text-align:left;">

  <!-- Header -->
  <header style="text-align:center; margin-bottom:30px;">
    <h1 style="font-size:2.8em; margin:0; background:linear-gradient(90deg, #00dbde, #fc00ff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; display:inline-block;">Character Forging</h1>
    <p style="color:#aaa; margin-top:8px; font-size:1.1em;">AI-Powered Ultra Detailed Character Creator</p>
  </header>

  <!-- Navigation Tabs -->
  <nav id="navTabsCtn" style="display:flex; justify-content:center; gap:10px; margin-bottom:25px; flex-wrap:wrap;">
    <button id="tabAiBtn" class="nav-btn active" onclick="switchTab('ai')" style="padding:12px 28px; border-radius:25px; border:none; cursor:pointer; font-size:1em; font-weight:600; transition:all 0.3s; background:linear-gradient(90deg, #00dbde, #fc00ff); color:white; box-shadow:0 4px 15px rgba(0,219,222,0.3);">AI Generator</button>
    <button id="tabManualBtn" class="nav-btn" onclick="switchTab('manual')" style="padding:12px 28px; border-radius:25px; border:none; cursor:pointer; font-size:1em; font-weight:600; transition:all 0.3s; background:rgba(255,255,255,0.1); color:#ccc; border:1px solid rgba(255,255,255,0.2);">Manual Builder</button>
    <button id="tabCanvasBtn" class="nav-btn" onclick="switchTab('canvas')" style="padding:12px 28px; border-radius:25px; border:none; cursor:pointer; font-size:1em; font-weight:600; transition:all 0.3s; background:rgba(255,255,255,0.1); color:#ccc; border:1px solid rgba(255,255,255,0.2);">Avatar Canvas</button>
    <button id="tabGalleryBtn" class="nav-btn" onclick="switchTab('gallery')" style="padding:12px 28px; border-radius:25px; border:none; cursor:pointer; font-size:1em; font-weight:600; transition:all 0.3s; background:rgba(255,255,255,0.1); color:#ccc; border:1px solid rgba(255,255,255,0.2);">Character Card</button>
  </nav>

  <!-- AI Generator Panel -->
  <div id="aiPanel" class="panel" style="max-width:900px; margin:0 auto;">
    <div style="background:rgba(255,255,255,0.05); border-radius:16px; padding:25px; border:1px solid rgba(255,255,255,0.1); backdrop-filter:blur(10px);">
      
      <div style="margin-bottom:20px;">
        <label style="display:block; margin-bottom:8px; color:#00dbde; font-weight:600;">Character Concept / Prompt</label>
        <textarea id="aiPromptInput" placeholder="Describe your character concept (e.g., a cyberpunk elven hacker with neon tattoos) or leave blank for random generation..." style="width:100%; min-height:100px; padding:15px; border-radius:10px; border:1px solid rgba(255,255,255,0.2); background:rgba(0,0,0,0.3); color:#fff; font-size:1em; resize:vertical; box-sizing:border-box;"></textarea>
      </div>

      <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:15px; margin-bottom:20px;">
        <div>
          <label style="display:block; margin-bottom:5px; color:#aaa; font-size:0.9em;">Creativity Level</label>
          <select id="aiCreativitySelect" style="width:100%; padding:10px; border-radius:8px; border:1px solid rgba(255,255,255,0.2); background:rgba(0,0,0,0.3); color:#fff;">
            <option value="balanced">Balanced</option>
            <option value="creative">Highly Creative</option>
            <option value="realistic">Realistic / Grounded</option>
          </select>
        </div>
        <div>
          <label style="display:block; margin-bottom:5px; color:#aaa; font-size:0.9em;">Output Detail</label>
          <select id="aiDetailSelect" style="width:100%; padding:10px; border-radius:8px; border:1px solid rgba(255,255,255,0.2); background:rgba(0,0,0,0.3); color:#fff;">
            <option value="medium">Standard</option>
            <option value="ultra">Ultra Detailed</option>
            <option value="compact">Compact</option>
          </select>
        </div>
      </div>

      <div style="margin-bottom:20px;">
        <label style="display:block; margin-bottom:8px; color:#aaa; font-size:0.9em;">Style Tags (click to add)</label>
        <div id="styleTagsCtn" style="display:flex; flex-wrap:wrap; gap:8px;">
          <span class="style-tag" onclick="toggleStyleTag(this)" style="padding:6px 14px; border-radius:20px; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); cursor:pointer; font-size:0.85em; transition:all 0.2s; user-select:none;">Fantasy</span>
          <span class="style-tag" onclick="toggleStyleTag(this)" style="padding:6px 14px; border-radius:20px; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); cursor:pointer; font-size:0.85em; transition:all 0.2s; user-select:none;">Sci-Fi</span>
          <span class="style-tag" onclick="toggleStyleTag(this)" style="padding:6px 14px; border-radius:20px; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); cursor:pointer; font-size:0.85em; transition:all 0.2s; user-select:none;">Cyberpunk</span>
          <span class="style-tag" onclick="toggleStyleTag(this)" style="padding:6px 14px; border-radius:20px; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); cursor:pointer; font-size:0.85em; transition:all 0.2s; user-select:none;">Steampunk</span>
          <span class="style-tag" onclick="toggleStyleTag(this)" style="padding:6px 14px; border-radius:20px; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); cursor:pointer; font-size:0.85em; transition:all 0.2s; user-select:none;">Horror</span>
          <span class="style-tag" onclick="toggleStyleTag(this)" style="padding:6px 14px; border-radius:20px; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); cursor:pointer; font-size:0.85em; transition:all 0.2s; user-select:none;">Anime</span>
          <span class="style-tag" onclick="toggleStyleTag(this)" style="padding:6px 14px; border-radius:20px; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); cursor:pointer; font-size:0.85em; transition:all 0.2s; user-select:none;">Medieval</span>
          <span class="style-tag" onclick="toggleStyleTag(this)" style="padding:6px 14px; border-radius:20px; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); cursor:pointer; font-size:0.85em; transition:all 0.2s; user-select:none;">Superhero</span>
        </div>
      </div>

      <div style="display:flex; gap:12px; flex-wrap:wrap; margin-bottom:20px;">
        <button id="generateTextBtn" onclick="generateCharacterWithAI()" style="flex:1; min-width:150px; padding:14px; border-radius:10px; border:none; cursor:pointer; font-size:1em; font-weight:700; background:linear-gradient(90deg, #00dbde, #fc00ff); color:white; box-shadow:0 4px 15px rgba(0,219,222,0.3); transition:transform 0.2s;">Generate Character</button>
        <button id="generateImageBtn" onclick="generateCharacterImage()" style="flex:1; min-width:150px; padding:14px; border-radius:10px; border:none; cursor:pointer; font-size:1em; font-weight:700; background:linear-gradient(90deg, #fc00ff, #00dbde); color:white; box-shadow:0 4px 15px rgba(252,0,255,0.3); transition:transform 0.2s;">Generate Portrait</button>
        <button id="generateBothBtn" onclick="generateCharacterAndImage()" style="flex:1; min-width:150px; padding:14px; border-radius:10px; border:none; cursor:pointer; font-size:1em; font-weight:700; background:linear-gradient(90deg, #667eea, #764ba2); color:white; box-shadow:0 4px 15px rgba(102,126,234,0.3); transition:transform 0.2s;">Generate Both</button>
      </div>

      <div id="aiLoadingCtn" hidden style="text-align:center; padding:20px;">
        <div style="display:inline-block; width:40px; height:40px; border:3px solid rgba(255,255,255,0.1); border-top:3px solid #00dbde; border-radius:50%; animation:spin 1s linear infinite;"></div>
        <p id="aiLoadingText" style="margin-top:10px; color:#aaa;">Forging character...</p>
      </div>

      <div id="aiOutputCtn" style="background:rgba(0,0,0,0.2); border-radius:12px; padding:20px; min-height:150px; white-space:pre-wrap; line-height:1.6; border:1px solid rgba(255,255,255,0.1);"></div>

    </div>
  </div>

  <!-- Manual Builder Panel -->
  <div id="manualPanel" class="panel" hidden style="max-width:900px; margin:0 auto;">
    <div style="background:rgba(255,255,255,0.05); border-radius:16px; padding:25px; border:1px solid rgba(255,255,255,0.1); backdrop-filter:blur(10px);">

      <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(250px, 1fr)); gap:20px; margin-bottom:25px;">
        
        <div>
          <label style="display:block; margin-bottom:6px; color:#00dbde; font-weight:600;">Name</label>
          <div style="display:flex; gap:8px;">
            <input id="manualNameInput" type="text" placeholder="Character name" style="flex:1; padding:10px; border-radius:8px; border:1px solid rgba(255,255,255,0.2); background:rgba(0,0,0,0.3); color:#fff;">
            <button onclick="randomizeName()" style="padding:10px 15px; border-radius:8px; border:none; cursor:pointer; background:rgba(255,255,255,0.15); color:#fff;">Random</button>
          </div>
        </div>

        <div>
          <label style="display:block; margin-bottom:6px; color:#00dbde; font-weight:600;">Gender</label>
          <select id="manualGenderSelect" style="width:100%; padding:10px; border-radius:8px; border:1px solid rgba(255,255,255,0.2); background:rgba(0,0,0,0.3); color:#fff;">
            <option>Male</option>
            <option>Female</option>
            <option>Non-binary</option>
            <option>Other</option>
          </select>
        </div>

        <div>
          <label style="display:block; margin-bottom:6px; color:#00dbde; font-weight:600;">Race / Species</label>
          <div style="display:flex; gap:8px;">
            <input id="manualRaceInput" type="text" placeholder="e.g., Human, Elf, Android" style="flex:1; padding:10px; border-radius:8px; border:1px solid rgba(255,255,255,0.2); background:rgba(0,0,0,0.3); color:#fff;">
            <button onclick="randomizeRace()" style="padding:10px 15px; border-radius:8px; border:none; cursor:pointer; background:rgba(255,255,255,0.15); color:#fff;">Random</button>
          </div>
        </div>

        <div>
          <label style="display:block; margin-bottom:6px; color:#00dbde; font-weight:600;">Class / Role</label>
          <div style="display:flex; gap:8px;">
            <input id="manualClassInput" type="text" placeholder="e.g., Mage, Rogue, Pilot" style="flex:1; padding:10px; border-radius:8px; border:1px solid rgba(255,255,255,0.2); background:rgba(0,0,0,0.3); color:#fff;">
            <button onclick="randomizeClass()" style="padding:10px 15px; border-radius:8px; border:none; cursor:pointer; background:rgba(255,255,255,0.15); color:#fff;">Random</button>
          </div>
        </div>

        <div>
          <label style="display:block; margin-bottom:6px; color:#00dbde; font-weight:600;">Age</label>
          <div style="display:flex; gap:8px;">
            <input id="manualAgeInput" type="number" placeholder="Age" style="flex:1; padding:10px; border-radius:8px; border:1px solid rgba(255,255,255,0.2); background:rgba(0,0,0,0.3); color:#fff;">
            <button onclick="randomizeAge()" style="padding:10px 15px; border-radius:8px; border:none; cursor:pointer; background:rgba(255,255,255,0.15); color:#fff;">Random</button>
          </div>
        </div>

        <div>
          <label style="display:block; margin-bottom:6px; color:#00dbde; font-weight:600;">Alignment</label>
          <select id="manualAlignSelect" style="width:100%; padding:10px; border-radius:8px; border:1px solid rgba(255,255,255,0.2); background:rgba(0,0,0,0.3); color:#fff;">
            <option>Lawful Good</option>
            <option>Neutral Good</option>
            <option>Chaotic Good</option>
            <option>Lawful Neutral</option>
            <option>True Neutral</option>
            <option>Chaotic Neutral</option>
            <option>Lawful Evil</option>
            <option>Neutral Evil</option>
            <option>Chaotic Evil</option>
          </select>
        </div>
      </div>

      <div style="margin-bottom:25px;">
        <label style="display:block; margin-bottom:10px; color:#00dbde; font-weight:600;">Attributes (click bars to adjust)</label>
        <div id="attrsCtn">
          <!-- Attribute bars generated by JS -->
        </div>
        <button onclick="randomizeAttributes()" style="margin-top:10px; padding:10px 20px; border-radius:8px; border:none; cursor:pointer; background:rgba(255,255,255,0.15); color:#fff;">Randomize All Stats</button>
      </div>

      <div style="margin-bottom:25px;">
        <label style="display:block; margin-bottom:6px; color:#00dbde; font-weight:600;">Personality Traits</label>
        <textarea id="manualPersonalityInput" placeholder="Describe personality..." style="width:100%; min-height:80px; padding:12px; border-radius:8px; border:1px solid rgba(255,255,255,0.2); background:rgba(0,0,0,0.3); color:#fff; resize:vertical; box-sizing:border-box;"></textarea>
      </div>

      <div style="margin-bottom:25px;">
        <label style="display:block; margin-bottom:6px; color:#00dbde; font-weight:600;">Backstory</label>
        <textarea id="manualBackstoryInput" placeholder="Character history and background..." style="width:100%; min-height:100px; padding:12px; border-radius:8px; border:1px solid rgba(255,255,255,0.2); background:rgba(0,0,0,0.3); color:#fff; resize:vertical; box-sizing:border-box;"></textarea>
      </div>

      <div style="margin-bottom:25px;">
        <label style="display:block; margin-bottom:6px; color:#00dbde; font-weight:600;">Visual Description</label>
        <textarea id="manualVisualInput" placeholder="Physical appearance, clothing, distinguishing features..." style="width:100%; min-height:80px; padding:12px; border-radius:8px; border:1px solid rgba(255,255,255,0.2); background:rgba(0,0,0,0.3); color:#fff; resize:vertical; box-sizing:border-box;"></textarea>
      </div>

      <div style="display:flex; gap:12px; flex-wrap:wrap;">
        <button onclick="enhanceWithAI()" style="flex:1; min-width:150px; padding:14px; border-radius:10px; border:none; cursor:pointer; font-size:1em; font-weight:700; background:linear-gradient(90deg, #00dbde, #fc00ff); color:white;">AI Enhance Details</button>
        <button onclick="sendToCard()" style="flex:1; min-width:150px; padding:14px; border-radius:10px; border:none; cursor:pointer; font-size:1em; font-weight:700; background:linear-gradient(90deg, #667eea, #764ba2); color:white;">View Character Card</button>
        <button onclick="randomizeAllManual()" style="flex:1; min-width:150px; padding:14px; border-radius:10px; border:none; cursor:pointer; font-size:1em; font-weight:700; background:rgba(255,255,255,0.15); color:white;">Randomize All</button>
      </div>

    </div>
  </div>

  <!-- Avatar Canvas Panel -->
  <div id="canvasPanel" class="panel" hidden style="max-width:900px; margin:0 auto;">
    <div style="background:rgba(255,255,255,0.05); border-radius:16px; padding:25px; border:1px solid rgba(255,255,255,0.1); backdrop-filter:blur(10px); text-align:center;">
      
      <div style="margin-bottom:15px; display:flex; justify-content:center; gap:10px; flex-wrap:wrap; align-items:center;">
        <label style="color:#aaa;">Brush Color:</label>
        <input id="brushColorInput" type="color" value="#00dbde" style="width:40px; height:40px; border:none; border-radius:8px; cursor:pointer;">
        <label style="color:#aaa; margin-left:10px;">Size:</label>
        <input id="brushSizeInput" type="range" min="1" max="50" value="5" style="width:100px;">
        <span id="brushSizeVal" style="color:#fff; min-width:30px;">5</span>
        <button onclick="setTool('brush')" style="padding:8px 16px; border-radius:8px; border:none; cursor:pointer; background:#00dbde; color:#000; font-weight:600;">Brush</button>
        <button onclick="setTool('eraser')" style="padding:8px 16px; border-radius:8px; border:none; cursor:pointer; background:rgba(255,255,255,0.2); color:#fff;">Eraser</button>
        <button onclick="clearCanvas()" style="padding:8px 16px; border-radius:8px; border:none; cursor:pointer; background:rgba(255,0,0,0.3); color:#fff;">Clear</button>
        <button onclick="undoCanvas()" style="padding:8px 16px; border-radius:8px; border:none; cursor:pointer; background:rgba(255,255,255,0.15); color:#fff;">Undo</button>
      </div>

      <canvas id="avatarCanvas" width="500" height="500" style="border:2px solid rgba(255,255,255,0.2); border-radius:12px; cursor:crosshair; background:#1a1a2e; max-width:100%;"></canvas>

      <div style="margin-top:15px; display:flex; justify-content:center; gap:10px;">
        <button onclick="saveCanvasImage()" style="padding:10px 24px; border-radius:8px; border:none; cursor:pointer; background:linear-gradient(90deg, #00dbde, #fc00ff); color:white; font-weight:600;">Save to Card</button>
        <button onclick="downloadCanvas()" style="padding:10px 24px; border-radius:8px; border:none; cursor:pointer; background:rgba(255,255,255,0.15); color:white;">Download PNG</button>
      </div>

    </div>
  </div>

  <!-- Character Card / Gallery Panel -->
  <div id="galleryPanel" class="panel" hidden style="max-width:900px; margin:0 auto;">
    <div style="background:rgba(255,255,255,0.05); border-radius:16px; padding:25px; border:1px solid rgba(255,255,255,0.1); backdrop-filter:blur(10px);">

      <div id="characterCardCtn" style="background:linear-gradient(135deg, rgba(0,219,222,0.1), rgba(252,0,255,0.1)); border-radius:16px; padding:25px; border:1px solid rgba(255,255,255,0.15);">
        
        <div style="display:flex; gap:25px; flex-wrap:wrap;">
          <!-- Portrait -->
          <div style="flex:0 0 250px; text-align:center;">
            <div style="width:250px; height:250px; border-radius:16px; border:2px solid rgba(255,255,255,0.2); overflow:hidden; background:rgba(0,0,0,0.3); display:flex; align-items:center; justify-content:center; position:relative;">
              <img id="cardPortraitImg" hidden style="width:100%; height:100%; object-fit:cover;">
              <div id="cardPortraitPlaceholder" style="color:#666; font-size:4em;">?</div>
            </div>
            <button onclick="generateCardImage()" style="margin-top:10px; padding:10px 20px; border-radius:8px; border:none; cursor:pointer; background:linear-gradient(90deg, #667eea, #764ba2); color:white; font-weight:600;">Generate AI Portrait</button>
          </div>

          <!-- Info -->
          <div style="flex:1; min-width:250px;">
            <h2 id="cardNameEl" style="font-size:2em; margin:0 0 5px 0; background:linear-gradient(90deg, #00dbde, #fc00ff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;">Unknown Character</h2>
            <p id="cardSubtitleEl" style="color:#aaa; margin:0 0 15px 0; font-size:1.1em;">No details yet</p>
            
            <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:10px; margin-bottom:15px;">
              <div style="background:rgba(0,0,0,0.2); padding:10px; border-radius:8px;">
                <div style="color:#00dbde; font-size:0.85em;">Race</div>
                <div id="cardRaceEl" style="font-weight:600;">-</div>
              </div>
              <div style="background:rgba(0,0,0,0.2); padding:10px; border-radius:8px;">
                <div style="color:#00dbde; font-size:0.85em;">Class</div>
                <div id="cardClassEl" style="font-weight:600;">-</div>
              </div>
              <div style="background:rgba(0,0,0,0.2); padding:10px; border-radius:8px;">
                <div style="color:#00dbde; font-size:0.85em;">Age</div>
                <div id="cardAgeEl" style="font-weight:600;">-</div>
              </div>
              <div style="background:rgba(0,0,0,0.2); padding:10px; border-radius:8px;">
                <div style="color:#00dbde; font-size:0.85em;">Alignment</div>
                <div id="cardAlignEl" style="font-weight:600;">-</div>
              </div>
            </div>

            <div style="margin-bottom:15px;">
              <div style="color:#00dbde; font-size:0.9em; margin-bottom:5px;">Attributes</div>
              <div id="cardAttrsCtn"></div>
            </div>
          </div>
        </div>

        <div style="margin-top:20px;">
          <div style="color:#00dbde; font-size:0.9em; margin-bottom:5px;">Personality</div>
          <p id="cardPersonalityEl" style="background:rgba(0,0,0,0.2); padding:12px; border-radius:8px; line-height:1.5; margin:0;">-</p>
        </div>

        <div style="margin-top:15px;">
          <div style="color:#00dbde; font-size:0.9em; margin-bottom:5px;">Backstory</div>
          <p id="cardBackstoryEl" style="background:rgba(0,0,0,0.2); padding:12px; border-radius:8px; line-height:1.5; margin:0;">-</p>
        </div>

        <div style="margin-top:15px;">
          <div style="color:#00dbde; font-size:0.9em; margin-bottom:5px;">Visual Description</div>
          <p id="cardVisualEl" style="background:rgba(0,0,0,0.2); padding:12px; border-radius:8px; line-height:1.5; margin:0;">-</p>
        </div>

      </div>

    </div>
  </div>

</div>

<!-- Toast notification -->
<div id="toastEl" style="position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(100px); background:rgba(0,0,0,0.9); color:#fff; padding:12px 24px; border-radius:8px; border:1px solid #00dbde; opacity:0; transition:all 0.3s; pointer-events:none; z-index:1000;"></div>

<style>
  @keyframes spin { to { transform: rotate(360deg); } }
  .nav-btn:hover { transform: translateY(-2px); }
  .style-tag:hover { background: rgba(0,219,222,0.3) !important; border-color: #00dbde !important; }
  .style-tag.active { background: linear-gradient(90deg, #00dbde, #fc00ff) !important; border-color: transparent !important; color: white !important; }
  .attr-bar { height: 20px; border-radius: 10px; background: linear-gradient(90deg, #00dbde, #fc00ff); transition: width 0.5s ease; cursor: pointer; }
  .attr-row:hover { background: rgba(255,255,255,0.05); }
</style>

<script>
  // --- Global State ---
  let currentCharacter = {
    name: "", gender: "", race: "", class: "", age: "", alignment: "",
    stats: { strength: 50, agility: 50, intelligence: 50, charisma: 50, wisdom: 50, constitution: 50 },
    personality: "", backstory: "", visual: "", portrait: ""
  };
  let currentTool = 'brush';
  let canvasHistory = [];

  // --- Tab Navigation ---
  function switchTab(tab) {
    document.querySelectorAll('.panel').forEach(p => p.hidden = true);
    document.querySelectorAll('.nav-btn').forEach(b => {
      b.style.background = 'rgba(255,255,255,0.1)';
      b.style.color = '#ccc';
      b.style.border = '1px solid rgba(255,255,255,0.2)';
    });
    document.getElementById(tab + 'Panel').hidden = false;
    let activeBtn = document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1) + 'Btn');
    activeBtn.style.background = 'linear-gradient(90deg, #00dbde, #fc00ff)';
    activeBtn.style.color = 'white';
    activeBtn.style.border = '1px solid transparent';
  }

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.style.opacity = '1';
    toastEl.style.transform = 'translateX(-50%) translateY(0)';
    setTimeout(() => {
      toastEl.style.opacity = '0';
      toastEl.style.transform = 'translateX(-50%) translateY(100px)';
    }, 3000);
  }

  // --- Style Tags ---
  function toggleStyleTag(el) {
    el.classList.toggle('active');
  }

  function getSelectedStyles() {
    return Array.from(document.querySelectorAll('.style-tag.active')).map(t => t.textContent).join(', ');
  }

  // --- AI Generation ---
  function setLoading(isLoading, text) {
    aiLoadingCtn.hidden = !isLoading;
    aiLoadingText.textContent = text || 'Forging character...';
    generateTextBtn.disabled = isLoading;
    generateImageBtn.disabled = isLoading;
    generateBothBtn.disabled = isLoading;
  }

  function buildAIPrompt() {
    let prompt = aiPromptInput.value.trim();
    let styles = getSelectedStyles();
    let creativity = aiCreativitySelect.value;
    let detail = aiDetailSelect.value;
    
    let instruction = `Generate an ultra-detailed character`;
    if (prompt) instruction += ` based on this concept: ${prompt}`;
    else instruction += ` with a unique, creative concept`;
    
    if (styles) instruction += `. Style/Genre: ${styles}`;
    instruction += `. Creativity level: ${creativity}. Detail level: ${detail}.`;
    
    instruction += `\n\nProvide the following sections:
**Name:** 
**Race/Species:** 
**Gender:** 
**Age:** 
**Class/Role:** 
**Alignment:** 
**Visual Description:** (detailed physical appearance, clothing, distinguishing features)
**Personality:** (traits, mannerisms, demeanor)
**Backstory:** (history, motivations, key events)
**Abilities & Skills:** 
**Equipment:**`;

    return instruction;
  }

  async function generateCharacterWithAI() {
    setLoading(true, 'Crafting character lore...');
    aiOutputCtn.innerHTML = '';
    
    try {
      let instruction = buildAIPrompt();
      let result = await generateText({
        instruction: instruction,
        onChunk: (data) => { aiOutputCtn.innerHTML += data.textChunk; }
      });
      
      // Parse the result into current character
      parseAIResult(aiOutputCtn.innerText || aiOutputCtn.textContent);
      showToast('Character generated! View in Character Card tab.');
    } catch (e) {
      aiOutputCtn.innerHTML = `<span style="color:#ff6b6b;">Error: ${e.message}</span>`;
    }
    
    setLoading(false);
  }

  async function generateCharacterImage() {
    setLoading(true, 'Painting portrait...');
    
    try {
      let desc = currentCharacter.visual || aiPromptInput.value || 'a unique fantasy character';
      let prompt = `Portrait of ${desc}. High quality digital art, detailed, vibrant colors, character concept art style.`;
      let dataUrl = await generateImage(prompt, {resolution: '768x768'});
      
      currentCharacter.portrait = dataUrl;
      cardPortraitImg.src = dataUrl;
      cardPortraitImg.hidden = false;
      cardPortraitPlaceholder.hidden = true;
      showToast('Portrait generated!');
    } catch (e) {
      showToast('Image generation failed: ' + e.message);
    }
    
    setLoading(false);
  }

  async function generateCharacterAndImage() {
    await generateCharacterWithAI();
    if (currentCharacter.visual || aiPromptInput.value) {
      await generateCharacterImage();
    }
  }

  function generateCardImage() {
    let desc = currentCharacter.visual || currentCharacter.name || 'a unique character';
    generateCharacterImage();
  }

  function parseAIResult(text) {
    // Simple parser to extract sections
    let sections = {};
    let lines = text.split('\n');
    let currentSection = '';
    
    for (let line of lines) {
      let match = line.match(/\*\*(.*?)\*\*\s*:?\s*(.*)/);
      if (match) {
        currentSection = match[1].toLowerCase().replace(/[\/&\s]+/g, '');
        sections[currentSection] = match[2];
      } else if (currentSection && line.trim()) {
        sections[currentSection] += ' ' + line.trim();
      }
    }
    
    currentCharacter.name = sections['name'] || currentCharacter.name;
    currentCharacter.race = sections['racespecies'] || sections['race'] || currentCharacter.race;
    currentCharacter.gender = sections['gender'] || currentCharacter.gender;
    currentCharacter.age = sections['age'] || currentCharacter.age;
    currentCharacter.class = sections['classrole'] || sections['class'] || currentCharacter.class;
    currentCharacter.alignment = sections['alignment'] || currentCharacter.alignment;
    currentCharacter.visual = sections['visualdescription'] || sections['visual'] || currentCharacter.visual;
    currentCharacter.personality = sections['personality'] || currentCharacter.personality;
    currentCharacter.backstory = sections['backstory'] || currentCharacter.backstory;
    
    updateCard();
  }

  // --- Manual Builder ---
  let attrNames = ['strength', 'agility', 'intelligence', 'charisma', 'wisdom', 'constitution'];
  
  function renderAttrBars() {
    attrsCtn.innerHTML = attrNames.map(name => {
      let val = currentCharacter.stats[name];
      return `
        <div class="attr-row" style="display:flex; align-items:center; gap:10px; margin-bottom:8px; padding:5px; border-radius:6px;">
          <span style="width:100px; text-transform:capitalize; font-weight:600; color:#aaa;">${name}</span>
          <div style="flex:1; background:rgba(0,0,0,0.3); border-radius:10px; overflow:hidden; height:20px; cursor:pointer;" onclick="adjustAttr('${name}', event)">
            <div class="attr-bar" style="width:${val}%;"></div>
          </div>
          <span style="width:30px; text-align:right; color:#00dbde; font-weight:600;">${val}</span>
        </div>
      `;
    }).join('');
  }

  function adjustAttr(name, e) {
    let rect = e.currentTarget.getBoundingClientRect();
    let pct = Math.max(1, Math.min(100, Math.round(((e.clientX - rect.left) / rect.width) * 100)));
    currentCharacter.stats[name] = pct;
    renderAttrBars();
    updateCardAttrs();
  }

  function randomizeAttributes() {
    attrNames.forEach(n => currentCharacter.stats[n] = Math.floor(Math.random() * 60) + 40);
    renderAttrBars();
    updateCardAttrs();
  }

  const names = ['Aelindra', 'Thorne', 'Kaelen', 'Seraphina', 'Draven', 'Lyra', 'Orion', 'Morrigan', 'Caspian', 'Elara', 'Zephyr', 'Isolde', 'Ragnar', 'Nyssa', 'Solomon', 'Vesper', 'Caelum', 'Thalia', 'Darius', 'Fiora'];
  const races = ['Human', 'Elf', 'Dwarf', 'Orc', 'Tiefling', 'Aasimar', 'Dragonborn', 'Halfling', 'Gnome', 'Android', 'Cyborg', 'Fae', 'Vampire', 'Werewolf', 'Elemental'];
  const classes = ['Warrior', 'Mage', 'Rogue', 'Cleric', 'Ranger', 'Paladin', 'Bard', 'Warlock', 'Monk', 'Druid', 'Artificer', 'Necromancer', 'Psion', 'Engineer', 'Pilot'];

  function randomizeName() { manualNameInput.value = names[Math.floor(Math.random() * names.length)]; }
  function randomizeRace() { manualRaceInput.value = races[Math.floor(Math.random() * races.length)]; }
  function randomizeClass() { manualClassInput.value = classes[Math.floor(Math.random() * classes.length)]; }
  function randomizeAge() { manualAgeInput.value = Math.floor(Math.random() * 80) + 18; }

  function randomizeAllManual() {
    randomizeName(); randomizeRace(); randomizeClass(); randomizeAge();
    manualAlignSelect.selectedIndex = Math.floor(Math.random() * manualAlignSelect.options.length);
    randomizeAttributes();
    manualPersonalityInput.value = generateRandomPersonality();
    manualBackstoryInput.value = generateRandomBackstory();
    manualVisualInput.value = generateRandomVisual();
  }

  function generateRandomPersonality() {
    let traits = ['stoic', 'charismatic', 'paranoid', 'optimistic', 'cynical', 'empathetic', 'ruthless', 'curious', 'stoic', 'flamboyant', 'reserved', 'hot-headed'];
    let selected = [];
    for (let i = 0; i < 3; i++) selected.push(traits[Math.floor(Math.random() * traits.length)]);
    return `A ${selected.join(', ')} individual who approaches challenges with ${['calm precision', 'reckless abandon', 'careful planning', 'intuitive leaps'][Math.floor(Math.random() * 4)]}.`;
  }

  function generateRandomBackstory() {
    let origins = ['raised in a forgotten underground city', 'orphaned during a celestial war', 'born to nobility but disowned', 'created in a secret laboratory', 'found as an infant by wandering monks', 'survivor of a sunken continent'];
    let events = ['discovered an ancient artifact', 'swore vengeance against a corrupt empire', 'made a pact with an otherworldly entity', 'lost their memories in a magical accident', 'betrayed by their closest ally'];
    return `Born ${origins[Math.floor(Math.random() * origins.length)]}, they later ${events[Math.floor(Math.random() * events.length)]}. Now they wander the world seeking ${['redemption', 'power', 'truth', 'peace', 'revenge'][Math.floor(Math.random() * 5)]}.`;
  }

  function generateRandomVisual() {
    let features = ['glowing eyes', 'intricate tattoos', 'a mechanical arm', 'scars across the face', 'unusual hair color', 'an ethereal aura', 'ancient jewelry', 'weathered leather armor'];
    return `A striking figure with ${features[Math.floor(Math.random() * features.length)]} and ${features[Math.floor(Math.random() * features.length)]}. Their presence commands attention wherever they go.`;
  }

  async function enhanceWithAI() {
    // Build prompt from manual inputs
    let desc = `Character: ${manualNameInput.value || 'Unnamed'}, ${manualRaceInput.value || 'Unknown race'} ${manualClassInput.value || 'Unknown class'}`;
    if (manualVisualInput.value) desc += `\nVisual: ${manualVisualInput.value}`;
    if (manualPersonalityInput.value) desc += `\nPersonality: ${manualPersonalityInput.value}`;
    if (manualBackstoryInput.value) desc += `\nBackstory: ${manualBackstoryInput.value}`;
    
    setLoading(true, 'Enhancing with AI...');
    aiOutputCtn.innerHTML = '';
    
    try {
      let result = await generateText({
        instruction: `Enhance and expand this character with ultra-detailed descriptions. Flesh out the backstory, add depth to the personality, and create a vivid visual description:\n\n${desc}`,
        onChunk: (data) => { aiOutputCtn.innerHTML += data.textChunk; }
      });
      parseAIResult(aiOutputCtn.innerText || aiOutputCtn.textContent);
      showToast('Character enhanced! Check the output and Character Card.');
    } catch (e) {
      showToast('Enhancement failed: ' + e.message);
    }
    
    setLoading(false);
    switchTab('ai');
  }

  function sendToCard() {
    currentCharacter.name = manualNameInput.value || 'Unknown';
    currentCharacter.race = manualRaceInput.value || '-';
    currentCharacter.class = manualClassInput.value || '-';
    currentCharacter.age = manualAgeInput.value || '-';
    currentCharacter.gender = manualGenderSelect.value;
    currentCharacter.alignment = manualAlignSelect.value;
    currentCharacter.personality = manualPersonalityInput.value || '-';
    currentCharacter.backstory = manualBackstoryInput.value || '-';
    currentCharacter.visual = manualVisualInput.value || '-';
    
    updateCard();
    switchTab('gallery');
    showToast('Character loaded into card!');
  }

  // --- Character Card ---
  function updateCard() {
    cardNameEl.textContent = currentCharacter.name || 'Unknown Character';
    cardSubtitleEl.textContent = `${currentCharacter.gender} ${currentCharacter.race} ${currentCharacter.class}`.replace(/^\s+|\s+$/g, '') || 'No details yet';
    cardRaceEl.textContent = currentCharacter.race || '-';
    cardClassEl.textContent = currentCharacter.class || '-';
    cardAgeEl.textContent = currentCharacter.age || '-';
    cardAlignEl.textContent = currentCharacter.alignment || '-';
    cardPersonalityEl.textContent = currentCharacter.personality || '-';
    cardBackstoryEl.textContent = currentCharacter.backstory || '-';
    cardVisualEl.textContent = currentCharacter.visual || '-';
    
    if (currentCharacter.portrait) {
      cardPortraitImg.src = currentCharacter.portrait;
      cardPortraitImg.hidden = false;
      cardPortraitPlaceholder.hidden = true;
    }
    
    updateCardAttrs();
  }

  function updateCardAttrs() {
    cardAttrsCtn.innerHTML = attrNames.map(name => {
      let val = currentCharacter.stats[name];
      return `
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:6px;">
          <span style="width:80px; text-transform:capitalize; font-size:0.85em; color:#aaa;">${name.substring(0, 3)}</span>
          <div style="flex:1; background:rgba(0,0,0,0.3); border-radius:8px; overflow:hidden; height:12px;">
            <div style="width:${val}%; height:100%; background:linear-gradient(90deg, #00dbde, #fc00ff); border-radius:8px;"></div>
          </div>
          <span style="width:25px; text-align:right; font-size:0.85em; color:#fff;">${val}</span>
        </div>
      `;
    }).join('');
  }

  // --- Canvas Drawing ---
  let ctx, isDrawing = false;
  
  function initCanvas() {
    ctx = avatarCanvas.getContext('2d');
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    saveCanvasState();
    
    avatarCanvas.addEventListener('mousedown', startDrawing);
    avatarCanvas.addEventListener('mousemove', draw);
    avatarCanvas.addEventListener('mouseup', stopDrawing);
    avatarCanvas.addEventListener('mouseout', stopDrawing);
    
    // Touch support
    avatarCanvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      let touch = e.touches[0];
      let rect = avatarCanvas.getBoundingClientRect();
      startDrawing({clientX: touch.clientX, clientY: touch.clientY});
    });
    avatarCanvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      let touch = e.touches[0];
      draw({clientX: touch.clientX, clientY: touch.clientY});
    });
    avatarCanvas.addEventListener('touchend', stopDrawing);
  }

  function getCanvasPos(e) {
    let rect = avatarCanvas.getBoundingClientRect();
    let scaleX = avatarCanvas.width / rect.width;
    let scaleY = avatarCanvas.height / rect.height;
    return {
      x: (e.clientX - rect.left) * scaleX,
      y: (e.clientY - rect.top) * scaleY
    };
  }

  function startDrawing(e) {
    isDrawing = true;
    let pos = getCanvasPos(e);
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);
  }

  function draw(e) {
    if (!isDrawing) return;
    let pos = getCanvasPos(e);
    ctx.lineWidth = brushSizeInput.value;
    ctx.strokeStyle = currentTool === 'eraser' ? '#1a1a2e' : brushColorInput.value;
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
  }

  function stopDrawing() {
    if (isDrawing) {
      isDrawing = false;
      ctx.closePath();
      saveCanvasState();
    }
  }

  function setTool(tool) {
    currentTool = tool;
    event.target.style.background = '#00dbde';
    event.target.style.color = '#000';
    event.target.style.fontWeight = '600';
    // Reset other buttons
    let buttons = event.target.parentElement.querySelectorAll('button');
    buttons.forEach(btn => {
      if (btn !== event.target && btn.textContent !== 'Clear' && btn.textContent !== 'Undo') {
        btn.style.background = 'rgba(255,255,255,0.2)';
        btn.style.color = '#fff';
        btn.style.fontWeight = 'normal';
      }
    });
  }

  function clearCanvas() {
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, avatarCanvas.width, avatarCanvas.height);
    saveCanvasState();
  }

  function saveCanvasState() {
    canvasHistory.push(ctx.getImageData(0, 0, avatarCanvas.width, avatarCanvas.height));
    if (canvasHistory.length > 20) canvasHistory.shift();
  }

  function undoCanvas() {
    if (canvasHistory.length > 1) {
      canvasHistory.pop();
      ctx.putImageData(canvasHistory[canvasHistory.length - 1], 0, 0);
    }
  }

  function saveCanvasImage() {
    let dataUrl = avatarCanvas.toDataURL('image/png');
    currentCharacter.portrait = dataUrl;
    cardPortraitImg.src = dataUrl;
    cardPortraitImg.hidden = false;
    cardPortraitPlaceholder.hidden = true;
    switchTab('gallery');
    showToast('Canvas saved to character card!');
  }

  function downloadCanvas() {
    let link = document.createElement('a');
    link.download = 'character-avatar.png';
    link.href = avatarCanvas.toDataURL('image/png');
    link.click();
  }

  brushSizeInput.addEventListener('input', () => brushSizeVal.textContent = brushSizeInput.value);

  // --- Initialization ---
  renderAttrBars();
  updateCard();
  initCanvas();

  // Randomize once on load for demo
  randomizeAllManual();
  sendToCard();
</script>
</body>
</html>
