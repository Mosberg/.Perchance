<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>json-visualizer-and-converter — Perchance</title>

    body { margin: 0; text-align: center; font-family: sans-serif; }

<body>
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>JSON Visualizer & Converter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- External libraries -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/highlight.js@11.8.0/styles/github-dark.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.8.0/lib/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ajv@8.12.0/dist/ajv7.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xml-js@1.6.11/dist/xml-js.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@iarna/toml@2.3.0/dist/toml.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.min.js"></script>
    <script src="https://mosberg.github.io/plugins/json-visualizer-plugin.js"></script>

    <style>
      body {
        font-family: sans-serif;
        background-color: #1e1e1e;
        color: #eee;
        margin: 0;
        padding: 1rem;
        transition: background-color 0.3s, color 0.3s;
      }
      .light-mode {
        background-color: #f5f5f5;
        color: #222;
      }
      textarea,
      select,
      button {
        width: 100%;
        margin: 0.5rem 0;
        padding: 0.5rem;
        font-size: 1rem;
        border-radius: 4px;
        border: none;
      }
      button {
        cursor: pointer;
        background-color: #444;
        color: #fff;
        border: 1px solid #666;
      }
      .light-mode button {
        background-color: #ddd;
        color: #222;
        border-color: #aaa;
      }
      .output {
        background-color: #2a2a2a;
        color: #eee;
        padding: 1rem;
        margin-top: 1rem;
        white-space: pre-wrap;
        border: 1px solid #444;
        border-radius: 4px;
        max-height: 300px;
        overflow: auto;
      }
      .light-mode .output {
        background-color: #fff;
        color: #222;
        border-color: #ccc;
      }
      .section {
        margin-top: 2rem;
      }
      .section h2 {
        margin-bottom: 0.5rem;
        font-size: 1.2rem;
        border-bottom: 1px solid #555;
      }
      .light-mode .section h2 {
        border-color: #ccc;
      }
      #dropzone {
        border: 2px dashed #888;
        padding: 1rem;
        text-align: center;
        margin-top: 1rem;
        border-radius: 6px;
        background-color: #222;
        color: #ccc;
      }
      .light-mode #dropzone {
        background-color: #eee;
        color: #333;
      }
      .tooltip {
        position: absolute;
        background: #333;
        color: #fff;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 0.9rem;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.2s;
      }
    </style>
  </head>
  <body>
    <h1>🧩 JSON Visualizer & Converter</h1>

    <div class="section">
      <h2>📥 Input & Format</h2>
      <label>Input Format:</label>
      <select id="inputFormat">
        <option value="json">JSON</option>
        <option value="yaml">YAML</option>
        <option value="csv">CSV</option>
        <option value="xml">XML</option>
        <option value="toml">TOML</option>
      </select>

      <div id="dropzone">📂 Drag & drop a JSON file here</div>

      <label>Theme:</label>
      <select id="theme">
        <option value="dark">Dark</option>
        <option value="light">Light</option>
      </select>

      <label>Input Data:</label>
      <textarea
        id="inputData"
        rows="10"
        placeholder="Paste your structured data here..."
      ></textarea>
    </div>

    <div class="section">
      <h2>🔄 Convert & Validate</h2>
      <label>Convert To:</label>
      <select id="outputFormat">
        <option value="json">JSON</option>
        <option value="yaml">YAML</option>
        <option value="csv">CSV</option>
        <option value="xml">XML</option>
        <option value="toml">TOML</option>
      </select>
      <button onclick="convert()">🔄 Convert Format</button>
      <button onclick="validate()">✅ Beautify & Validate</button>
    </div>

    <div class="section">
      <h2>🧠 Code & Schema</h2>
      <label>Generate For:</label>
      <select id="codeTarget">
        <option value="typescript">TypeScript</option>
        <option value="golang">Golang</option>
        <option value="rust">Rust</option>
        <option value="jsonschema">JSON Schema</option>
      </select>
      <button onclick="generateCode()">🧠 Generate Code</button>
      <button onclick="generateSchema()">📐 Generate Schema</button>
    </div>

    <div class="section">
      <h2>📊 Visualization & Export</h2>
      <button onclick="visualize()">📊 Visualize Graph</button>
      <label>Export As:</label>
      <select id="exportFormat">
        <option value="png">PNG</option>
        <option value="jpeg">JPEG</option>
        <option value="svg">SVG</option>
      </select>
      <button onclick="exportImage()">📤 Export Image</button>
    </div>

    <div class="section">
      <h2>📤 Output Previews</h2>
      <div id="graph" class="output" aria-label="Graph Preview"></div>
      <div
        id="validationPreview"
        class="output"
        aria-label="Validation Result"
      ></div>
      <div id="codePreview" class="output" aria-label="Generated Code"></div>
      <div
        id="schemaPreview"
        class="output"
        aria-label="Generated Schema"
      ></div>
      <pre><code id="codePreviewBlock" class="language-javascript"></code></pre>
    </div>

    <div class="section">
      <h2>🔒 Privacy</h2>
      <p>
        All processing is local. No data is sent to servers or stored
        externally.
      </p>
    </div>

    <script>
      window.addEventListener("DOMContentLoaded", () => {
        if (typeof hljs !== "undefined") {
          hljs.highlightAll();
        } else {
          console.warn("Highlight.js not loaded");
        }
        setupDropzone();
      });

      let plugin =
        typeof perchance !== "undefined"
          ? perchance.loadPlugin("json-visualizer")
          : window.jsonVisualizer;

      function toHierarchy(obj) {
        return {
          name: "root",
          children: Object.entries(obj).map(([key, value]) => {
            if (typeof value === "object" && value !== null) {
              return { name: key, ...toHierarchy(value) };
            } else {
              return { name: `${key}: ${value}` };
            }
          }),
        };
      }

      function renderGraph(data) {
        const container = document.getElementById("graph");
        container.innerHTML = "";

        if (!data || typeof data !== "object") {
          container.textContent = "No graph data";
          return;
        }

        const treeData = toHierarchy(data);
        const width = container.clientWidth || 800;
        const height = 500;

        const svg = d3
          .select(container)
          .append("svg")
          .attr("id", "graphSvg")
          .attr("width", width)
          .attr("height", height)
          .call(
            d3.zoom().on("zoom", (event) => {
              g.attr("transform", event.transform);
            })
          );

        const g = svg.append("g").attr("transform", "translate(80,20)");
        const root = d3.hierarchy(treeData);
        root.descendants().forEach((d) => (d._children = d.children));

        const treeLayout = d3.tree().size([height - 40, width - 160]);
        const tooltip = d3
          .select("body")
          .append("div")
          .attr("class", "tooltip");

        function update(source) {
          treeLayout(root);
          g.selectAll("line").remove();
          g.selectAll("g.node").remove();

          g.selectAll("line")
            .data(root.links())
            .join("line")
            .attr("stroke", "#999")
            .attr("x1", (d) => d.source.y)
            .attr("y1", (d) => d.source.x)
            .attr("x2", (d) => d.target.y)
            .attr("y2", (d) => d.target.x);

          // Nodes
          const node = g
            .selectAll("g.node")
            .data(root.descendants())
            .join("g")
            .attr("class", "node")
            .attr("transform", (d) => `translate(${d.y},${d.x})`)
            .on("click", (event, d) => {
              d.children = d.children ? null : d._children;
              update(d);
            })
            .on("mouseover", (event, d) => {
              tooltip
                .style("opacity", 1)
                .html(d.data.name)
                .style("left", event.pageX + 10 + "px")
                .style("top", event.pageY + "px");
            })
            .on("mouseout", () => {
              tooltip.style("opacity", 0);
            });

          node.append("circle").attr("r", 5).attr("fill", "#007acc");

          node
            .append("text")
            .attr("dy", 3)
            .attr("x", (d) => (d.children ? -10 : 10))
            .style("text-anchor", (d) => (d.children ? "end" : "start"))
            .text((d) => d.data.name);
        }

        update(root);
      }

      function convert() {
        plugin.state.outputFormat =
          document.getElementById("outputFormat").value;
        plugin.functions.convertData();
        document.getElementById("inputData").value = plugin.state.inputData;
      }

      function validate() {
        plugin.functions.validateData();
        render(
          "validationPreview",
          plugin.state.validationResult.beautified || "Invalid format"
        );
      }

      function generateCode() {
        plugin.state.codeTarget = document.getElementById("codeTarget").value;
        plugin.functions.generateCode();
        render("codePreview", plugin.state.generatedCode);
      }

      function generateSchema() {
        plugin.functions.generateSchema();
        render("schemaPreview", plugin.state.schema);
      }

      function exportImage() {
        const format = document.getElementById("exportFormat").value;
        const node = document.getElementById("graphSvg");

        const exportFn = {
          png: htmlToImage.toPng,
          jpeg: htmlToImage.toJpeg,
          svg: htmlToImage.toSvg,
        }[format];

        if (!exportFn) {
          alert("Unsupported format");
          return;
        }

        exportFn(node)
          .then((dataUrl) => {
            const link = document.createElement("a");
            link.download = `graph.${format}`;
            link.href = dataUrl;
            link.click();
          })
          .catch((err) => {
            console.error("Export failed:", err);
            alert("Export failed");
          });
      }

      function visualize() {
        plugin.state.inputData = document.getElementById("inputData").value;
        plugin.state.inputFormat = document.getElementById("inputFormat").value;
        plugin.state.theme = document.getElementById("theme").value;
        plugin.functions.visualizeGraph();
        renderGraph(plugin.state.graphData);
      }

      function render(id, content) {
        const container = document.getElementById(id);
        if (id === "codePreview") {
          const block = document.getElementById("codePreviewBlock");
          block.textContent =
            typeof content === "string"
              ? content
              : JSON.stringify(content, null, 2);
          if (typeof hljs !== "undefined") {
            hljs.highlightElement(block);
          } else {
            console.warn("Highlight.js not available for syntax highlighting");
          }
        } else {
          container.textContent =
            typeof content === "string"
              ? content
              : JSON.stringify(content, null, 2);
        }
      }

      function setupDropzone() {
        const dropzone = document.getElementById("dropzone");
        dropzone.addEventListener("dragover", (e) => {
          e.preventDefault();
          dropzone.style.borderColor = "#00ccff";
        });
        dropzone.addEventListener("dragleave", () => {
          dropzone.style.borderColor = "#888";
        });
        dropzone.addEventListener("drop", (e) => {
          e.preventDefault();
          dropzone.style.borderColor = "#888";
          const file = e.dataTransfer.files[0];
          if (file && file.type === "application/json") {
            const reader = new FileReader();
            reader.onload = () => {
              document.getElementById("inputData").value = reader.result;
              plugin.state.inputData = reader.result;
              plugin.functions.visualizeGraph();
              renderGraph(plugin.state.graphData);
            };
            reader.readAsText(file);
          } else {
            alert("Please drop a valid JSON file.");
          }
        });
      }

      document.getElementById("theme").addEventListener("change", (e) => {
        document.body.className =
          e.target.value === "light" ? "light-mode" : "";
      });

      window.addEventListener("DOMContentLoaded", setupDropzone);

      function validateAgainstSchema() {
        try {
          const ajv = new Ajv();
          const schema = JSON.parse(plugin.state.schema);
          const data = JSON.parse(plugin.state.inputData);
          const valid = ajv.validate(schema, data);
          plugin.state.validationResult = {
            valid,
            beautified: valid
              ? "✅ Data is valid against schema"
              : "❌ Validation failed:\n" + JSON.stringify(ajv.errors, null, 2),
          };
          render("validationPreview", plugin.state.validationResult.beautified);
        } catch (e) {
          plugin.state.validationResult = {
            valid: false,
            beautified: "❌ Error validating against schema:\n" + e.message,
          };
          render("validationPreview", plugin.state.validationResult.beautified);
        }
      }
    </script>
  </body>
</html>

</body>
</html>
