<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>sao9fuearl — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<div style="width:98%; width:calc(100% - 0.5rem); max-width:700px; margin:0 auto; display:flex; flex-direction:column; justify-content:center; align-items:center;">
  
  <div>— Mode —</div> 
  <select id="currentModeEl" style="text-align:left;">
    <option value="general">🧑‍💻 Freeform</option>
    <option value="html">🌐 HTML/CSS/JS</option>
    <option value="python">🐍💻 Python</option>
    <option value="perchanceLists">🎲 Perchance Lists</option>
    <option value="perchanceHtml">🎲 Perchance HTML</option>
    <option value="brainy">🤓 Brainy</option>
  </select>
  <div id="modeDescriptionEl" style="font-size:75%; opacity:0.6; max-width:500px; margin:0 auto; padding-top:0.25rem;"></div>
  
  <div style="margin-top:1rem;">— Instruction —</div>
  <div style="width:100%; position:relative;"> 
    <textarea id="instructionEl" placeholder="Type an instruction here." style="width:100%; height:120px; padding-top:0.25rem; resize:vertical;"></textarea>
    <button id="instructionDeleteBtn" data-mode="delete" style="position:absolute; top:-0.75rem; right:0.5rem; font-size:60%; display:none;"></button>
    <style>
      #instructionDeleteBtn[data-mode='delete']:before { content:'🗑️ delete'; }
      #instructionDeleteBtn[data-mode='undo']:before { content:'↩️ undo'; }
    </style>
  </div>
  
  <div style="margin-top:0.5rem;"> 
    <div style="display:inline-block; position:relative;"> 
      <button id="generateBtn">✨ generate</button>
      <span id="loaderEl" style="position:absolute; right:0; transform:translateX(120%); height:100%; display:inline-flex; align-items:center;"></span>
      <span style="position:absolute; left:0; bottom:0; transform:translateX(-120%); height:100%; display:inline-flex; align-items:center;"><button id="stopBtn" style="font-size:80%; display:none;">🛑 stop</button></span>
    </div>
  </div>
  
  <div id="outputTitleEl" style="margin-top:0.5rem;">— Output —</div>
  <style>@media only screen and (max-width: 670px) { #outputTitleEl { margin-bottom:1rem; } }</style>
  <div style="width:100%; position:relative;">
    <textarea id="responseEl" placeholder="The AI's output will show up here, and you can edit it. You can also manually type text here and then click the 'continue' button, above." style="width:100%; height:800px; max-height:80vh; padding:0.5rem; padding-bottom:0.75rem; resize:vertical;"></textarea>
    <button id="responseCopyBtn" onclick="navigator.clipboard.writeText(responseEl.value); this.innerText = '✅ copied!'; setTimeout(() => { this.innerText = '📋 copy'; }, 2000);" style="position:absolute; top:-0.75rem; right:0.5rem; font-size:60%; display:none;">📋 copy</button>
    <div style="position:absolute; top:-0.75rem; left:0.5rem; font-size:60%; min-width:max-content;">
      <button disabled id="continueBtn">▶️ continue</button>
      <button disabled id="retryBtn">🔁 retry</button>
      <button id="responseDeleteBtn" data-mode="delete" style="margin-left: 1.5rem; display:none;"></button>
      <style>
        #responseDeleteBtn[data-mode='delete']:before { content:'🗑️ delete'; }
        #responseDeleteBtn[data-mode='undo']:before { content:'↩️ undo'; }
      </style>
    </div>
    <div style="position:absolute; bottom:-0.5rem; left:0.5rem; font-size:60%; min-width:max-content;">
      <button disabled id="bottomContinueBtn">▶️ continue</button>
      <button id="bottomStopBtn" style="display:none;">🛑 stop</button>
    </div>
  </div>
</div>

<div id="renderedOutputEl" style="margin-top:3rem;"></div>

<br>
<p style="font-size:80%;">Also check out the <a href="https://perchance.org/ai-story-generator" target="_blank">AI Story Generator</a>, the <a href="https://perchance.org/ai-text-rewriter" target="_blank">AI Text Rewriter</a>, and the <a href="https://perchance.org/ai-text-to-image-generator" target="_blank">AI Image Generator</a>.</p>

<br>

<div id="commentsCtn"></div>
<br><br>

<!-- DARK MODE STUFF -->
<div style="position:fixed; bottom:0.5rem; left:0.5rem; z-index:10;">
  <button id="darkModeBtn" style="cursor:pointer;">🌃</button>
</div>

<!-- FEEDBACK STUFF -->
<div style="position:fixed; bottom:0.5rem; right:0.5rem; text-align:right; z-index:100;">
  <div id="feedbackCommentsCtn"></div>
  <button id="feedbackBtn893745ykfuhd">🗨️ feedback</button>
</div>

<style>
  button:disabled {
    filter: grayscale(1);
  }
  button {
    background-color: var(--bg-primary);
    color: var(--text-primary);
    border: 1px solid var(--text-secondary);
    padding: 0.5em 1em;
    border-radius: 4px;
    margin: 0.2em;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  button:hover:not(:disabled) {
    background-color: var(--accent-primary);
    color: white;
    border-color: var(--accent-primary);
  }
  textarea {
    background-color: var(--bg-secondary);
    color: var(--text-primary);
    border: 1px solid var(--text-secondary);
    border-radius: 4px;
    padding: 0.5em;
  }
  select {
    background-color: var(--bg-primary);
    color: var(--text-primary);
    border: 1px solid var(--text-secondary);
    padding: 0.5em;
    border-radius: 4px;
    cursor: pointer;
  }
  a {
    color: var(--accent-primary);
  }
  body {
    background-color: var(--bg-primary);
    color: var(--text-primary);
    transition: background-color 0.3s ease, color 0.3s ease;
  }
</style>

<script>
  // Initialize modes data
  const modes = {
    general: {
      label: "🧑‍💻 Freeform",
      description: "This mode is for any coding question.",
      instructionPlaceholder: "Write your coding instruction/question here."
    },
    html: {
      label: "🌐 HTML/CSS/JS",
      description: "In this mode, the resulting HTML will be visually rendered below the generated text.",
      instructionPlaceholder: "Write your HTML/CSS/JS instruction here."
    },
    python: {
      label: "🐍💻 Python",
      description: "This mode will execute the Python code that is generated. Execution outputs are displayed below the generated code.",
      instructionPlaceholder: "Write your Python instruction here."
    },
    perchanceLists: {
      label: "🎲 Perchance Lists",
      description: "For use in the Perchance lists editor panel, including Perchance syntax and functions.",
      instructionPlaceholder: "Write your Perchance lists instruction here."
    },
    perchanceHtml: {
      label: "🎲 Perchance HTML",
      description: "For use in the Perchance HTML editor panel.",
      instructionPlaceholder: "Write your Perchance HTML instruction here."
    },
    brainy: {
      label: "🤓 Brainy",
      description: "A mode in which the AI lays out its reasoning, which can improve its accuracy.",
      instructionPlaceholder: "Write your detailed instruction here."
    }
  };

  let currentMode = localStorage.currentMode || 'general';
  let pendingGenerate = null;

  // Initialize UI
  function initializeUI() {
    currentModeEl.value = currentMode;
    modeDescriptionEl.textContent = modes[currentMode].description || '';
    instructionEl.placeholder = modes[currentMode].instructionPlaceholder || instructionEl.dataset.defaultPlaceholder || "Type an instruction here.";
    
    // Load saved data
    if (localStorage.instruction) {
      instructionEl.value = localStorage.instruction;
      instructionDeleteBtn.style.display = '';
    }
    if (localStorage.response) {
      responseEl.value = localStorage.response;
      responseDeleteBtn.style.display = '';
      continueBtn.disabled = false;
      bottomContinueBtn.disabled = false;
    }
  }

  // Mode change handler
  currentModeEl.addEventListener('change', () => {
    currentMode = currentModeEl.value;
    localStorage.currentMode = currentMode;
    modeDescriptionEl.textContent = modes[currentMode].description || '';
    instructionEl.placeholder = modes[currentMode].instructionPlaceholder || instructionEl.dataset.defaultPlaceholder || "Type an instruction here.";
  });

  // Instruction input handlers
  instructionEl.addEventListener('input', () => {
    if (instructionEl.value.trim() == '') {
      instructionDeleteBtn.style.display = 'none';
    } else {
      instructionDeleteBtn.style.display = '';
    }
    localStorage.instruction = instructionEl.value;
    generateBtn.textContent = '✨ generate';
    window.deletedInstruction = '';
    instructionDeleteBtn.dataset.mode = 'delete';
  });

  // Response input handlers
  responseEl.addEventListener('input', () => {
    if (responseEl.value.trim() == '') {
      continueBtn.disabled = true;
      bottomContinueBtn.disabled = true;
      generateBtn.textContent = '✨ generate';
      responseDeleteBtn.style.display = 'none';
    } else {
      continueBtn.disabled = false;
      bottomContinueBtn.disabled = false;
      generateBtn.textContent = '🔁 regenerate';
      responseDeleteBtn.style.display = '';
    }
    responseDeleteBtn.dataset.mode = 'delete';
    localStorage.response = responseEl.value;
    window.deletedResponse = '';
    retryBtn.disabled = true;
  });

  // Delete button handlers
  instructionDeleteBtn.addEventListener('click', () => {
    if (instructionDeleteBtn.dataset.mode === 'delete') {
      window.deletedInstruction = instructionEl.value;
      instructionEl.value = '';
      instructionDeleteBtn.dataset.mode = 'undo';
    } else {
      instructionEl.value = window.deletedInstruction;
      instructionDeleteBtn.dataset.mode = 'delete';
    }
    localStorage.instruction = instructionEl.value;
  });

  responseDeleteBtn.addEventListener('click', () => {
    if (responseDeleteBtn.dataset.mode === 'delete') {
      if (stopBtn.offsetTop) {
        stopBtn.click();
      }
      window.deletedResponse = responseEl.value;
      responseEl.value = '';
      responseDeleteBtn.dataset.mode = 'undo';
    } else {
      responseEl.value = window.deletedResponse;
      responseDeleteBtn.dataset.mode = 'delete';
    }
    localStorage.response = responseEl.value;
  });

  // Generate function
  async function generate() {
    window.responseContentBeforeLastGenerate = responseEl.value;
    
    generateBtn.disabled = true;
    generateBtn.textContent = '⏳ generating...';
    continueBtn.disabled = true;
    bottomContinueBtn.disabled = true;
    retryBtn.disabled = true;
    
    stopBtn.style.display = '';
    bottomStopBtn.style.display = '';
    
    responseDeleteBtn.style.display = '';
    responseDeleteBtn.dataset.mode = 'delete';
    responseCopyBtn.style.display = "";
    
    // Simulate AI generation (replace with actual AI call)
    let generatedText = "";
    const instruction = instructionEl.value.trim();
    
    if (!instruction) {
      alert("Please enter an instruction.");
      resetButtons();
      return;
    }
    
    try {
      // This would be replaced with actual AI text generation
      // For demo purposes, we'll simulate with a simple response
      generatedText = `Generated ${currentMode} code based on: "${instruction}"\n\n// This is a simulated response\n// In a real implementation, this would call an AI service\n// and stream the response as it's generated`;
      
      // Simulate streaming effect
      responseEl.value = "";
      for (let i = 0; i < generatedText.length; i++) {
        responseEl.value += generatedText[i];
        if (responseEl.scrollTop + responseEl.offsetHeight > responseEl.scrollHeight - 60) {
          responseEl.scrollTop = responseEl.scrollHeight;
        }
        await new Promise(resolve => setTimeout(resolve, 10));
      }
      
      // Handle mode-specific rendering
      if (currentMode === 'html' || currentMode === 'perchanceHtml') {
        renderedOutputEl.innerHTML = `<h3>Rendered Output:</h3><iframe srcdoc="${responseEl.value.replace(/"/g, '&quot;')}" style="width:100%; height:400px; border:1px solid var(--text-secondary); border-radius:4px;"></iframe>`;
      } else if (currentMode === 'python') {
        renderedOutputEl.innerHTML = `<h3>Python Output:</h3><div style="background-color:var(--bg-secondary); padding:1em; border-radius:4px; font-family:monospace;">Python execution would happen here in a real implementation.</div>`;
      } else {
        renderedOutputEl.innerHTML = '';
      }
      
      localStorage.response = responseEl.value;
      
    } catch (error) {
      console.error('Generation error:', error);
      responseEl.value = `Error: ${error.message}`;
    }
    
    resetButtons();
    loaderEl.innerHTML = "";
    stopBtn.style.display = "none";
    bottomStopBtn.style.display = "none";
  }

  function resetButtons() {
    generateBtn.disabled = false;
    generateBtn.textContent = "🔁 regenerate";
    continueBtn.disabled = false;
    bottomContinueBtn.disabled = false;
    retryBtn.disabled = false;
  }

  // Button click handlers
  generateBtn.addEventListener('click', () => {
    responseEl.value = '';
    generate();
  });

  continueBtn.addEventListener('click', generate);
  bottomContinueBtn.addEventListener('click', generate);

  retryBtn.addEventListener('click', () => {
    responseEl.value = window.responseContentBeforeLastGenerate || responseEl.value;
    generate();
  });

  // Stop button handlers
  function stopGeneration() {
    if (pendingGenerate && pendingGenerate.stop) {
      pendingGenerate.stop();
    }
    stopBtn.style.display = "none";
    bottomStopBtn.style.display = "none";
    resetButtons();
    loaderEl.innerHTML = "";
  }

  stopBtn.addEventListener('click', stopGeneration);
  bottomStopBtn.addEventListener('click', stopGeneration);

  // Dark mode toggle
  function toggleManualDarkMode() {
    let newColorScheme = (getCurrentColorScheme() === "dark" ? "light" : "dark");
    localStorage.forceColorScheme = newColorScheme;
    setColorScheme(newColorScheme);
    
    let systemColorScheme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? "dark" : "light";
    if (systemColorScheme === newColorScheme) {
      localStorage.removeItem("forceColorScheme");
    }
  }

  function getCurrentColorScheme() {
    if (localStorage.forceColorScheme !== undefined) {
      return localStorage.forceColorScheme;
    } else {
      return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? "dark" : "light";
    }
  }

  function setColorScheme(scheme) {
    if (scheme !== "dark" && scheme !== "light") throw new Error("scheme should be 'light' or 'dark'");
    darkModeBtn.textContent = (scheme === "dark" ? "🌄" : "🌃");
    
    if (scheme === "dark") {
      document.documentElement.style.colorScheme = "dark";
      document.documentElement.style.setProperty('--bg-primary', '#1e1e2e');
      document.documentElement.style.setProperty('--bg-secondary', '#252836');
      document.documentElement.style.setProperty('--text-primary', '#ffffff');
      document.documentElement.style.setProperty('--text-secondary', '#b8b8d9');
      document.documentElement.style.setProperty('--accent-primary', '#6c5ce7');
    } else {
      document.documentElement.style.colorScheme = "light";
      document.documentElement.style.setProperty('--bg-primary', '#f5f7ff');
      document.documentElement.style.setProperty('--bg-secondary', '#ffffff');
      document.documentElement.style.setProperty('--text-primary', '#2d3436');
      document.documentElement.style.setProperty('--text-secondary', '#636e72');
      document.documentElement.style.setProperty('--accent-primary', '#0984e3');
    }
  }

  darkModeBtn.addEventListener('click', toggleManualDarkMode);

  // Feedback button handler
  feedbackBtn893745ykfuhd.addEventListener('click', () => {
    if (feedbackCommentsCtn.innerHTML.length === 0) {
      feedbackCommentsCtn.innerHTML = `<div style="background-color:var(--bg-secondary); padding:1em; border-radius:4px; border:1px solid var(--text-secondary);"><textarea placeholder="Share your feedback..." style="width:100%; height:100px; margin-bottom:0.5em;"></textarea><button>Submit</button></div>`;
      feedbackBtn893745ykfuhd.innerHTML = '✖ close';
    } else {
      feedbackCommentsCtn.innerHTML = '';
      feedbackBtn893745ykfuhd.innerHTML = '🗨️ feedback';
    }
  });

  // Initialize color scheme
  if (localStorage.forceColorScheme !== undefined) {
    setColorScheme(localStorage.forceColorScheme);
  } else {
    let systemIsInDarkMode = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    setColorScheme(systemIsInDarkMode ? "dark" : "light");
  }

  // Initialize the UI when page loads
  initializeUI();
</script>
</body>
</html>
