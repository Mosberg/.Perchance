<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>json-crack-json-visualizer — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }

<body>
<style>
:root[data-theme="dark"]{
  --bg:#0d1117;--bg-panel:#161b22;--bg-input:#0d1117;--bg-code:#0d1117;
  --border:#30363d;--border-light:#21262d;
  --text:#c9d1d9;--text-muted:#8b949e;--text-dim:#484f58;
  --accent:#58a6ff;--accent-hover:#79b8ff;--accent-glow:rgba(88,166,255,.15);
  --success:#3fb950;--warning:#d29922;--error:#f85149;
  --node-object:#58a6ff;--node-array:#bc8cff;--node-string:#7ee787;
  --node-number:#ffa657;--node-boolean:#ff7b72;--node-null:#8b949e;
  --shadow:rgba(0,0,0,.4);
}
:root[data-theme="light"]{
  --bg:#ffffff;--bg-panel:#f6f8fa;--bg-input:#ffffff;--bg-code:#f6f8fa;
  --border:#d0d7de;--border-light:#eaeef2;
  --text:#1f2328;--text-muted:#636c76;--text-dim:#afb8c1;
  --accent:#0969da;--accent-hover:#218bff;--accent-glow:rgba(9,105,218,.12);
  --success:#1a7f37;--warning:#9a6700;--error:#cf222e;
  --node-object:#0969da;--node-array:#8250df;--node-string:#1a7f37;
  --node-number:#bc4c00;--node-boolean:#cf222e;--node-null:#636c76;
  --shadow:rgba(0,0,0,.1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;background:var(--bg);color:var(--text)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:13px}
textarea{font-family:'SF Mono',Monaco,'Cascadia Code','Fira Code',monospace;font-size:13px;line-height:1.5;resize:none}

.app{display:flex;flex-direction:column;height:100vh}
.app-header{display:flex;align-items:center;gap:12px;padding:0 16px;height:48px;background:var(--bg-panel);border-bottom:1px solid var(--border);z-index:10;flex-shrink:0}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;white-space:nowrap}
.logo-icon{width:24px;height:24px;display:flex;align-items:center;justify-content:center;background:var(--accent);color:#fff;border-radius:6px;font-size:14px}
.tabs{display:flex;gap:2px;margin-left:8px}
.tab{padding:6px 12px;border-radius:6px;color:var(--text-muted);font-size:13px;transition:all .15s;white-space:nowrap}
.tab:hover{background:var(--border-light);color:var(--text)}
.tab.active{background:var(--accent-glow);color:var(--accent);font-weight:600}
.header-spacer{flex:1}
.header-btn{padding:6px 10px;border-radius:6px;color:var(--text-muted);transition:all .15s;display:flex;align-items:center;gap:4px}
.header-btn:hover{background:var(--border-light);color:var(--text)}

.app-main{display:flex;flex:1;overflow:hidden}
.input-panel{width:38%;min-width:280px;max-width:600px;display:flex;flex-direction:column;border-right:1px solid var(--border);background:var(--bg-panel)}
.panel-header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--border-light);font-size:12px;color:var(--text-muted);font-weight:600}
.editor-wrapper{flex:1;display:flex;overflow:hidden;position:relative}
.line-numbers{width:40px;padding:8px 4px;text-align:right;color:var(--text-dim);font-size:13px;font-family:'SF Mono',Monaco,monospace;line-height:1.5;user-select:none;overflow:hidden;border-right:1px solid var(--border-light);background:var(--bg-input)}
#jsonInput{flex:1;padding:8px 12px;border:none;outline:none;background:var(--bg-input);color:var(--text);tab-size:2}
.input-actions{display:flex;gap:6px;padding:8px;border-top:1px solid var(--border-light);flex-wrap:wrap}
.btn{padding:6px 14px;border-radius:6px;font-size:13px;font-weight:500;transition:all .15s;border:1px solid var(--border);background:var(--bg-panel);color:var(--text)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{background:var(--accent-hover);color:#fff}
.btn-sm{padding:4px 10px;font-size:12px}

.output-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;background:var(--bg)}
.output-content{flex:1;overflow:auto;position:relative}
.graph-container{width:100%;height:100%;position:relative;overflow:hidden}
#graphSvg{width:100%;height:100%;display:block;cursor:grab}
#graphSvg:active{cursor:grabbing}
.graph-edge{stroke:var(--border);stroke-width:1.5;fill:none;transition:stroke .2s}
.graph-edge.highlighted{stroke:var(--accent);stroke-width:2.5}
.graph-node{cursor:pointer}
.node-rect{fill:var(--bg-panel);stroke:var(--border);stroke-width:1.5;transition:all .2s}
.graph-node:hover .node-rect{stroke-width:2.5;filter:drop-shadow(0 0 6px var(--accent-glow))}
.node-key{fill:var(--text);font-size:12px;font-weight:600;font-family:'SF Mono',Monaco,monospace;text-anchor:middle;pointer-events:none}
.node-value{font-size:11px;font-family:'SF Mono',Monaco,monospace;text-anchor:middle;pointer-events:none}
.node-value.object{fill:var(--node-object)}
.node-value.array{fill:var(--node-array)}
.node-value.string{fill:var(--node-string)}
.node-value.number{fill:var(--node-number)}
.node-value.boolean{fill:var(--node-boolean)}
.node-value.null{fill:var(--node-null)}
.node-stripe{stroke:none}
.node-stripe.object{fill:var(--node-object)}
.node-stripe.array{fill:var(--node-array)}
.node-stripe.string{fill:var(--node-string)}
.node-stripe.number{fill:var(--node-number)}
.node-stripe.boolean{fill:var(--node-boolean)}
.node-stripe.null{fill:var(--node-null)}
.graph-controls{position:absolute;bottom:12px;right:12px;display:flex;flex-direction:column;gap:4px}
.graph-controls .btn{width:36px;height:36px;padding:0;display:flex;align-items:center;justify-content:center;font-size:16px;background:var(--bg-panel);border:1px solid var(--border)}
.graph-legend{position:absolute;top:12px;left:12px;background:var(--bg-panel);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:11px;display:flex;gap:12px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:4px;color:var(--text-muted)}
.legend-dot{width:8px;height:8px;border-radius:2px}
.graph-empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-dim);font-size:14px;flex-direction:column;gap:8px}

.tree-view{padding:12px;font-family:'SF Mono',Monaco,monospace;font-size:13px;line-height:1.6;white-space:nowrap}
.tree-node{display:block}
.tree-toggle{display:inline-block;width:16px;cursor:pointer;color:var(--text-muted);user-select:none;text-align:center}
.tree-key{color:var(--node-object)}
.tree-value.string{color:var(--node-string)}
.tree-value.number{color:var(--node-number)}
.tree-value.boolean{color:var(--node-boolean)}
.tree-value.null{color:var(--node-null)}
.tree-bracket{color:var(--text-muted)}
.tree-comma{color:var(--text-dim)}
.tree-children{padding-left:20px}

.code-output{padding:16px;font-family:'SF Mono',Monaco,monospace;font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word;color:var(--text)}
.code-output .tok-key{color:var(--node-object)}
.code-output .tok-string{color:var(--node-string)}
.code-output .tok-number{color:var(--node-number)}
.code-output .tok-boolean{color:var(--node-boolean)}
.code-output .tok-null{color:var(--node-null)}
.code-output .tok-punc{color:var(--text-muted)}

.convert-bar{display:flex;align-items:center;gap:8px;padding:12px;border-bottom:1px solid var(--border-light);flex-wrap:wrap}
.convert-bar select{padding:6px 10px;border-radius:6px;border:1px solid var(--border);background:var(--bg-panel);color:var(--text);font-size:13px}
.convert-arrow{color:var(--text-muted)}
.codegen-bar{display:flex;align-items:center;gap:8px;padding:12px;border-bottom:1px solid var(--border-light);flex-wrap:wrap}
.lang-btn{padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:var(--bg-panel);color:var(--text-muted);font-size:13px;transition:all .15s}
.lang-btn:hover{border-color:var(--accent);color:var(--text)}
.lang-btn.active{background:var(--accent-glow);color:var(--accent);border-color:var(--accent);font-weight:600}
.query-bar{display:flex;gap:8px;padding:12px;border-bottom:1px solid var(--border-light)}
.query-input{flex:1;padding:8px 12px;border-radius:6px;border:1px solid var(--border);background:var(--bg-input);color:var(--text);font-family:'SF Mono',Monaco,monospace;font-size:13px;outline:none}
.query-input:focus{border-color:var(--accent)}

.output-toolbar{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--border-light);background:var(--bg-panel)}
.output-toolbar .filename{font-size:12px;color:var(--text-muted);font-family:monospace;flex:1}
.copy-btn{padding:4px 10px;border-radius:4px;font-size:12px;border:1px solid var(--border);color:var(--text-muted);transition:all .15s}
.copy-btn:hover{border-color:var(--accent);color:var(--accent)}
.copy-btn.copied{border-color:var(--success);color:var(--success)}

.status-bar{display:flex;align-items:center;gap:16px;padding:4px 12px;height:28px;background:var(--bg-panel);border-top:1px solid var(--border);font-size:11px;color:var(--text-muted);flex-shrink:0}
.status-item{display:flex;align-items:center;gap:4px}
.status-dot{width:8px;height:8px;border-radius:50%}
.status-dot.valid{background:var(--success)}
.status-dot.invalid{background:var(--error)}
.status-dot.empty{background:var(--text-dim)}
.status-spacer{flex:1}

.toast-container{position:fixed;bottom:40px;right:16px;z-index:1000;display:flex;flex-direction:column;gap:8px}
.toast{padding:10px 16px;border-radius:8px;background:var(--bg-panel);border:1px solid var(--border);color:var(--text);font-size:13px;box-shadow:0 4px 12px var(--shadow);animation:slideIn .25s ease;display:flex;align-items:center;gap:8px}
.toast.success{border-color:var(--success)}
.toast.error{border-color:var(--error)}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.spinner{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:768px){
  .app-main{flex-direction:column}
  .input-panel{width:100%;max-width:none;max-height:40vh;border-right:none;border-bottom:1px solid var(--border)}
  .tabs{overflow-x:auto;flex-wrap:nowrap}
  .tab{padding:6px 8px;font-size:12px}
}
</style>

    <div class="status-item">🔒 All processing is local</div>
  </footer>
</div>
<div class="toast-container" id="toastContainer"></div>
<script>
const SVG_NS='http://www.w3.org/2000/svg';
const MAX_NODES=800;

// ── State ──
const state={
  tab:'graph',
  parsed:null,
  inputFormat:'json',
  nodes:[],
  edges:[],
  visibleNodes:[],
  visibleEdges:[],
  transform:{x:0,y:0,scale:1},
  simFrame:null,
  draggedNode:null,
  isPanning:false,
  panStart:{x:0,y:0},
  lang:'typescript',
  convertFrom:'json',
  convertTo:'yaml',
};

// ── Sample Data ──
const SAMPLES=[
`{
  "name": "JSON Crack",
  "version": "2.0.0",
  "openSource": true,
  "description": "Visualize JSON into interactive graphs",
  "stats": {
    "stars": 4200,
    "forks": 280,
    "contributors": 45,
    "rating": 4.9
  },
  "features": ["visualize", "convert", "format", "codegen", "query"],
  "formats": {
    "input": ["JSON", "YAML", "CSV", "XML"],
    "output": ["PNG", "JPEG", "SVG"]
  },
  "themes": ["dark", "light"],
  "privacy": "All data processing is local"
}`,
`{
  "company": "TechCorp",
  "founded": 2015,
  "active": true,
  "employees": [
    {"name": "Alice", "role": "Engineer", "skills": ["Go", "Rust", "TS"]},
    {"name": "Bob", "role": "Designer", "skills": ["Figma", "CSS"]},
    {"name": "Carol", "role": "Manager", "skills": ["Leadership"]}
  ],
  "products": {
    "api": {"version": "3.0", "endpoints": 42},
    "mobile": {"platforms": ["iOS", "Android"], "downloads": 1500000}
  }
}`,
`[
  {"id": 1, "name": "Sword", "type": "weapon", "damage": 45, "rarity": "rare"},
  {"id": 2, "name": "Shield", "type": "armor", "defense": 30, "rarity": "common"},
  {"id": 3, "name": "Potion", "type": "consumable", "heal": 50, "rarity": "common"}
]`
];
let sampleIdx=0;

// ── Utilities ──
function $(id){return document.getElementById(id)}
function toast(msg,type=''){
  const el=document.createElement('div');
  el.className='toast '+type;
  el.textContent=msg;
  $('toastContainer').appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .3s';setTimeout(()=>el.remove(),300)},3000);
}
function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function escapeXml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function capitalize(s){return s.charAt(0).toUpperCase()+s.slice(1).replace(/[^a-zA-Z0-9]/g,'')}
function truncate(s,n){return s==null?'':String(s).length>n?String(s).slice(0,n-1)+'…':String(s)}
function copyText(text){
  navigator.clipboard.writeText(text).then(()=>toast('Copied!','success')).catch(()=>toast('Copy failed','error'));
}
function downloadFile(filename,content,type='text/plain'){
  const blob=new Blob([content],{type});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=filename;a.click();
  URL.revokeObjectURL(url);
}
function getType(v){
  if(v===null)return 'null';
  if(Array.isArray(v))return 'array';
  return typeof v;
}
function getValuePreview(node){
  const t=node.type;
  if(t==='object')return `{${node.childIds.length}}`;
  if(t==='array')return `[${node.childIds.length}]`;
  if(t==='null')return 'null';
  if(t==='string')return `"${truncate(node.value,20)}"`;
  return truncate(node.value,25);
}

// ── Line Numbers ──
function updateLineNumbers(){
  const lines=$('jsonInput').value.split('\n').length;
  $('lineNumbers').innerHTML=Array.from({length:Math.max(lines,1)},(_,i)=>i+1).join('<br>');
}
function updateCharCount(){
  $('charCountStatus').textContent=$('jsonInput').value.length+' chars';
}

// ── Input Format Detection ──
function detectFormat(text){
  const t=text.trim();
  if(t.startsWith('{')||t.startsWith('['))return 'json';
  if(t.startsWith('<'))return 'xml';
  if(t.includes(',')&&t.includes('\n')&&!t.startsWith('{'))return 'csv';
  return 'yaml';
}

// ── Parse Input ──
async function parseInput(text){
  const fmt=detectFormat(text);
  state.inputFormat=fmt;
  try{
    if(fmt==='json')return JSON.parse(text);
    if(fmt==='yaml'){
      const yaml=await import('https://esm.sh/js-yaml@4.1.0');
      return yaml.load(text);
    }
    if(fmt==='csv')return parseCSV(text);
    if(fmt==='xml')return parseXML(text);
  }catch(e){
    throw e;
  }
  return null;
}
function parseCSV(text){
  const lines=text.trim().split('\n');
  if(lines.length<2)return [];
  const headers=lines[0].split(',').map(h=>h.trim());
  return lines.slice(1).map(line=>{
    const vals=line.split(',').map(v=>v.trim());
    const obj={};
    headers.forEach((h,i)=>{
      const v=vals[i];
      if(v!==undefined){
        const n=Number(v);
        obj[h]=v===''?null:(isNaN(n)?v:n);
      }
    });
    return obj;
  });
}
function parseXML(text){
  const parser=new DOMParser();
  const doc=parser.parseFromString(text,'text/xml');
  const err=doc.querySelector('parsererror');
  if(err)throw new Error('XML parse error');
  function elToObj(el){
    const obj={};
    for(const attr of el.attributes)obj['@'+attr.name]=attr.value;
    for(const child of el.children){
      const childObj=elToObj(child);
      if(obj[child.tagName]){
        if(!Array.isArray(obj[child.tagName]))obj[child.tagName]=[obj[child.tagName]];
        obj[child.tagName].push(childObj);
      }else obj[child.tagName]=childObj;
    }
    const text=el.textContent.trim();
    if(el.children.length===0&&text)obj['#text']=text;
    return obj;
  }
  const root=doc.documentElement;
  return {[root.tagName]:elToObj(root)};
}

// ── Graph Builder ──
function buildGraph(data){
  state.nodes=[];
  state.edges=[];
  const rootId=buildNode(data,'root',null,0);
  return rootId;
}
function buildNode(value,key,parentId,depth){
  if(state.nodes.length>=MAX_NODES)return -1;
  const id=state.nodes.length;
  const type=getType(value);
  const node={
    id,key,type,value,depth,parentId,
    x:0,y:0,vx:0,vy:0,
    width:100,height:42,
    collapsed:depth>=3,
    childIds:[],
    fixed:false,
    visible:true,
  };
  state.nodes.push(node);
  if(parentId!==null){
    state.nodes[parentId].childIds.push(id);
    state.edges.push({source:parentId,target:id,label:key});
  }
  if(type==='object'){
    for(const[k,v]of Object.entries(value)){
      if(state.nodes.length>=MAX_NODES)break;
      buildNode(v,k,id,depth+1);
    }
  }else if(type==='array'){
    for(let i=0;i<value.length;i++){
      if(state.nodes.length>=MAX_NODES)break;
      buildNode(value[i],'['+i+']',id,depth+1);
    }
  }
  return id;
}

// ── Visible Nodes/Edges ──
function computeVisible(){
  state.visibleNodes=[];
  state.visibleEdges=[];
  const visSet=new Set();
  function visit(id){
    if(id<0)return;
    const n=state.nodes[id];
    visSet.add(id);
    state.visibleNodes.push(n);
    if(n.collapsed)return;
    for(const cid of n.childIds)visit(cid);
  }
  if(state.nodes.length>0)visit(0);
  for(const e of state.edges){
    if(visSet.has(e.source)&&visSet.has(e.target))state.visibleEdges.push(e);
  }
}

// ── SVG Element Creation ──
const _mc=document.createElement('canvas');
const _mctx=_mc.getContext('2d');
function measureText(text,font){
  _mctx.font=font;
  return _mctx.measureText(text).width;
}
function createNodeEl(node){
  const g=document.createElementNS(SVG_NS,'g');
  g.classList.add('graph-node');
  g.dataset.id=node.id;
  const keyText=truncate(node.key==='root'?'root':node.key,18);
  const valText=getValuePreview(node);
  const kw=measureText(keyText,'bold 12px monospace');
  const vw=measureText(valText,'11px monospace');
  const w=Math.max(kw,vw)+24;
  const h=42;
  node.width=w;node.height=h;
  const rect=document.createElementNS(SVG_NS,'rect');
  rect.setAttribute('x',-w/2);rect.setAttribute('y',-h/2);
  rect.setAttribute('width',w);rect.setAttribute('height',h);
  rect.setAttribute('rx',7);rect.classList.add('node-rect');
  const stripe=document.createElementNS(SVG_NS,'rect');
  stripe.setAttribute('x',-w/2);stripe.setAttribute('y',-h/2);
  stripe.setAttribute('width',3);stripe.setAttribute('height',h);
  stripe.setAttribute('rx',2);stripe.classList.add('node-stripe',node.type);
  const kt=document.createElementNS(SVG_NS,'text');
  kt.setAttribute('x',0);kt.setAttribute('y',-2);
  kt.classList.add('node-key');kt.textContent=keyText;
  const vt=document.createElementNS(SVG_NS,'text');
  vt.setAttribute('x',0);vt.setAttribute('y',13);
  vt.classList.add('node-value',node.type);vt.textContent=valText;
  if((node.type==='object'||node.type==='array')&&node.childIds.length>0){
    const ind=document.createElementNS(SVG_NS,'text');
    ind.setAttribute('x',w/2-8);ind.setAttribute('y',-h/2+10);
    ind.setAttribute('font-size','10');ind.setAttribute('fill','var(--text-muted)');
    ind.textContent=node.collapsed?'+':'−';ind.style.pointerEvents='none';
    g.appendChild(ind);
  }
  g.appendChild(rect);g.appendChild(stripe);g.appendChild(kt);g.appendChild(vt);
  return g;
}
function createEdgeEl(){
  const line=document.createElementNS(SVG_NS,'line');
  line.classList.add('graph-edge');
  return line;
}

// ── Graph Rendering ──
function renderGraphElements(){
  const el=$('edgeLayer'),nl=$('nodeLayer');
  el.innerHTML='';nl.innerHTML='';
  for(const edge of state.visibleEdges){
    edge.el=createEdgeEl();
    el.appendChild(edge.el);
  }
  for(const node of state.visibleNodes){
    node.el=createNodeEl(node);
    nl.appendChild(node.el);
    setupNodeInteraction(node);
  }
}
function updateGraphPositions(){
  for(const edge of state.visibleEdges){
    const s=state.nodes[edge.source],t=state.nodes[edge.target];
    edge.el.setAttribute('x1',s.x);edge.el.setAttribute('y1',s.y);
    edge.el.setAttribute('x2',t.x);edge.el.setAttribute('y2',t.y);
  }
  for(const node of state.visibleNodes){
    node.el.setAttribute('transform',`translate(${node.x},${node.y})`);
  }
}
function updateTransform(){
  $('graphTransform').setAttribute('transform',`translate(${state.transform.x},${state.transform.y}) scale(${state.transform.scale})`);
}

// ── Force-Directed Simulation ──
const SIM={repulsion:6000,spring:0.04,linkDist:100,damping:0.82,center:0.003};
function initPositions(){
  const n=state.visibleNodes.length;
  const cx=$('graphSvg').clientWidth/2,cy=$('graphSvg').clientHeight/2;
  for(let i=0;i<n;i++){
    const node=state.visibleNodes[i];
    const angle=(i/n)*Math.PI*2;
    const r=80+node.depth*60;
    node.x=cx+Math.cos(angle)*r+(Math.random()-0.5)*40;
    node.y=cy+Math.sin(angle)*r+(Math.random()-0.5)*40;
    node.vx=0;node.vy=0;
  }
}
function simulateStep(){
  const nodes=state.visibleNodes;
  const n=nodes.length;
  for(let i=0;i<n;i++){
    for(let j=i+1;j<n;j++){
      const a=nodes[i],b=nodes[j];
      let dx=b.x-a.x,dy=b.y-a.y;
      let d2=dx*dx+dy*dy;
      if(d2<1){d2=1;dx=Math.random()-0.5;dy=Math.random()-0.5}
      const d=Math.sqrt(d2);
      const f=SIM.repulsion/d2;
      const fx=(dx/d)*f,fy=(dy/d)*f;
      if(!a.fixed){a.vx-=fx;a.vy-=fy}
      if(!b.fixed){b.vx+=fx;b.vy+=fy}
    }
  }
  for(const edge of state.visibleEdges){
    const s=state.nodes[edge.source],t=state.nodes[edge.target];
    let dx=t.x-s.x,dy=t.y-s.y;
    const d=Math.sqrt(dx*dx+dy*dy)||1;
    const f=(d-SIM.linkDist)*SIM.spring;
    const fx=(dx/d)*f,fy=(dy/d)*f;
    if(!s.fixed){s.vx+=fx;s.vy+=fy}
    if(!t.fixed){t.vx-=fx;t.vy-=fy}
  }
  const cx=$('graphSvg').clientWidth/2,cy=$('graphSvg').clientHeight/2;
  for(const node of nodes){
    if(node.fixed)continue;
    node.vx=(node.vx+ (cx-node.x)*SIM.center)*SIM.damping;
    node.vy=(node.vy+ (cy-node.y)*SIM.center)*SIM.damping;
    node.x+=node.vx;node.y+=node.vy;
  }
}
function startSim(){
  stopSim();
  let stable=0;
  function tick(){
    let energy=0;
    for(const n of state.visibleNodes)energy+=n.vx*n.vx+n.vy*n.vy;
    if(energy<0.3){stable++;if(stable>30){stopSim();return}}
    else stable=0;
    simulateStep();
    updateGraphPositions();
    state.simFrame=requestAnimationFrame(tick);
  }
  state.simFrame=requestAnimationFrame(tick);
}
function stopSim(){
  if(state.simFrame){cancelAnimationFrame(state.simFrame);state.simFrame=null}
}

// ── Graph Interaction ──
function setupGraphInteraction(){
  const svg=$('graphSvg');
  svg.addEventListener('mousedown',e=>{
    if(e.target===svg||e.target.id==='graphBg'||e.target.id==='graphTransform'||e.target.tagName==='g'&&e.target.id==='edgeLayer'){
      state.isPanning=true;
      state.panStart={x:e.clientX-state.transform.x,y:e.clientY-state.transform.y};
    }
  });
  document.addEventListener('mousemove',e=>{
    if(state.isPanning){
      state.transform.x=e.clientX-state.panStart.x;
      state.transform.y=e.clientY-state.panStart.y;
      updateTransform();
    }
  });
  document.addEventListener('mouseup',()=>{state.isPanning=false});
  svg.addEventListener('wheel',e=>{
    e.preventDefault();
    const rect=svg.getBoundingClientRect();
    const mx=e.clientX-rect.left,my=e.clientY-rect.top;
    const delta=-e.deltaY*0.001;
    const ns=Math.max(0.1,Math.min(5,state.transform.scale*(1+delta)));
    state.transform.x=mx-(mx-state.transform.x)*(ns/state.transform.scale);
    state.transform.y=my-(my-state.transform.y)*(ns/state.transform.scale);
    state.transform.scale=ns;
    updateTransform();
  },{passive:false});
}
function setupNodeInteraction(node){
  let dragging=false,startMx,startMy,startNx,startNy,moved=false;
  node.el.addEventListener('mousedown',e=>{
    e.stopPropagation();
    dragging=true;moved=false;
    node.fixed=true;
    startMx=e.clientX;startMy=e.clientY;
    startNx=node.x;startNy=node.y;
  });
  document.addEventListener('mousemove',e=>{
    if(!dragging)return;
    const dx=e.clientX-startMx,dy=e.clientY-startMy;
    if(Math.abs(dx)>3||Math.abs(dy)>3)moved=true;
    node.x=startNx+dx/state.transform.scale;
    node.y=startNy+dy/state.transform.scale;
    node.vx=0;node.vy=0;
    updateGraphPositions();
  });
  document.addEventListener('mouseup',()=>{
    if(dragging){
      dragging=false;node.fixed=false;
      if(!moved)toggleNode(node);
      startSim();
    }
  });
  node.el.addEventListener('mouseenter',()=>{
    node.el.querySelector('.node-rect').setAttribute('stroke-width','2.5');
    for(const edge of state.visibleEdges){
      if(edge.source===node.id||edge.target===node.id)edge.el.classList.add('highlighted');
    }
  });
  node.el.addEventListener('mouseleave',()=>{
    node.el.querySelector('.node-rect').setAttribute('stroke-width','1.5');
    for(const edge of state.visibleEdges)edge.el.classList.remove('highlighted');
  });
}
function toggleNode(node){
  if(node.type!=='object'&&node.type!=='array')return;
  if(node.childIds.length===0)return;
  node.collapsed=!node.collapsed;
  computeVisible();
  renderGraphElements();
  updateGraphPositions();
  startSim();
  $('nodeCountStatus').textContent=`${state.visibleNodes.length} visible nodes`;
}
function fitToView(){
  if(state.visibleNodes.length===0)return;
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  for(const n of state.visibleNodes){
    minX=Math.min(minX,n.x-n.width/2);
    minY=Math.min(minY,n.y-n.height/2);
    maxX=Math.max(maxX,n.x+n.width/2);
    maxY=Math.max(maxY,n.y+n.height/2);
  }
  const pad=40;
  const gw=maxX-minX+pad*2,gh=maxY-minY+pad*2;
  const sw=$('graphSvg').clientWidth,sh=$('graphSvg').clientHeight;
  const scale=Math.min(sw/gw,sh/gh,2);
  state.transform.scale=scale;
  state.transform.x=sw/2-(minX+maxX)/2*scale;
  state.transform.y=sh/2-(minY+maxY)/2*scale;
  updateTransform();
}

function renderTree(){

  $('textOutput').innerHTML='<div class="tree-view">'+buildTreeHtml(state.parsed,'root',true,0)+'</div>';

function attachTreeToggles(){
  document.querySelectorAll('.tree-toggle').forEach(el=>{
    el.onclick=function(){
      const next=this.parentElement.querySelector('.tree-children');
      if(next){
        next.style.display=next.style.display==='none'?'block':'none';
        this.textContent=this.textContent==='▶'?'▼':'▶';
      }
    };
  });

function buildTreeHtml(data,key,isLast,depth){
  const type=getType(data);
  const comma=isLast?'':'<span class="tree-comma">,</span>';
  if(type==='object'){
    const keys=Object.keys(data);
    if(keys.length===0)return `<div class="tree-node"><span class="tree-toggle"></span><span class="tree-key">"${escapeHtml(key)}"</span>: <span class="tree-bracket">{}</span>${comma}</div>`;
    const children=keys.map((k,i)=>buildTreeHtml(data[k],k,i===keys.length-1,depth+1)).join('');
    return `<div class="tree-node"><span class="tree-toggle">▼</span><span class="tree-key">"${escapeHtml(key)}"</span>: <span class="tree-bracket">{</span><div class="tree-children">${children}</div><span class="tree-bracket">}</span>${comma}</div>`;
  }else if(type==='array'){
    if(data.length===0)return `<div class="tree-node"><span class="tree-toggle"></span><span class="tree-key">"${escapeHtml(key)}"</span>: <span class="tree-bracket">[]</span>${comma}</div>`;
    const children=data.map((v,i)=>buildTreeHtml(v,String(i),i===data.length-1,depth+1)).join('');
    return `<div class="tree-node"><span class="tree-toggle">▼</span><span class="tree-key">"${escapeHtml(key)}"</span>: <span class="tree-bracket">[</span><div class="tree-children">${children}</div><span class="tree-bracket">]</span>${comma}</div>`;
  }else{
    let valHtml='';
    if(type==='string')valHtml=`<span class="tree-value string">"${escapeHtml(data)}"</span>`;
    else if(type==='number')valHtml=`<span class="tree-value number">${data}</span>`;
    else if(type==='boolean')valHtml=`<span class="tree-value boolean">${data}</span>`;
    else valHtml=`<span class="tree-value null">null</span>`;
    return `<div class="tree-node"><span class="tree-toggle"></span><span class="tree-key">"${escapeHtml(key)}"</span>: ${valHtml}${comma}</div>`;
  }
}

function highlightJson(json){
  return escapeHtml(json)
    .replace(/("(?:[^"\\]|\\.)*"\s*:)/g,'<span class="tok-key">$1</span>')
    .replace(/:\s*("(?:[^"\\]|\\.)*")/g,': <span class="tok-string">$1</span>')
    .replace(/:\s*(-?\d+\.?\d*(?:[eE][+-]?\d+)?)/g,': <span class="tok-number">$1</span>')

    .replace(/([{}\[\]])/g,'<span class="tok-punc">$1</span>');

function renderConvertBar(){

  `;

  $('convTo').onchange=e=>state.convertTo=e.target.value;

async function doConvert(){
  if(!state.parsed){toast('Visualize data first','error');return}
  const from=state.convertFrom,to=state.convertTo;
  if(from===to){toast('Source and target are the same','');return}
  try{
    let result='';
    if(to==='json')result=JSON.stringify(state.parsed,null,2);
    else if(to==='yaml'){
      const yaml=await import('https://esm.sh/js-yaml@4.1.0');
      result=yaml.dump(state.parsed,{indent:2,lineWidth:120});
    }else if(to==='csv')result=jsonToCsv(state.parsed);
    else if(to==='xml')result=jsonToXml(state.parsed,'root',0);
    $('convertOutput').innerHTML=to==='json'?highlightJson(result):escapeHtml(result);
    state.lastTextOutput=result;
    $('outputFilename').textContent=`converted.${to}`;
    toast('Converted!','success');
  }catch(e){toast('Conversion error: '+e.message,'error')}
}
function jsonToCsv(data){
  let arr=Array.isArray(data)?data:[data];
  arr=arr.filter(o=>o&&typeof o==='object'&&!Array.isArray(o));
  if(arr.length===0)return '';
  const keys=[...new Set(arr.flatMap(o=>Object.keys(o)))];
  const lines=[keys.join(',')];
  for(const row of arr){
    lines.push(keys.map(k=>{
      const v=row[k];
      if(v==null)return '';
      if(typeof v==='object')return '"'+JSON.stringify(v).replace(/"/g,'""')+'"';
      return '"'+String(v).replace(/"/g,'""')+'"';
    }).join(','));
  }
  return lines.join('\n');
}
function jsonToXml(data,name,indent){
  const pad='  '.repeat(indent);
  if(data===null)return `${pad}<${name} null="true"/>`;
  if(typeof data!=='object')return `${pad}<${name}>${escapeXml(data)}</${name}>`;
  if(Array.isArray(data))return data.map(i=>jsonToXml(i,name,indent)).join('\n');
  let r=`${pad}<${name}>\n`;
  for(const[k,v]of Object.entries(data))r+=jsonToXml(v,k,indent+1)+'\n';
  r+=`${pad}</${name}>`;
  return r;
}

function generateCode(){
  if(!state.parsed){$('codegenOutput').textContent='Visualize data first';return}
  let code='',ext='';
  switch(state.lang){
    case 'typescript':code=jsonToTS(state.parsed);ext='ts';break;

function jsonToTS(obj,name='Root'){
  const ifaces=[];
  function process(o,iname){
    const fields=[];
    for(const[k,v]of Object.entries(o)){
      const t=getTSType(v,k,iname);
      fields.push(`  ${k}: ${t};`);
    }
    ifaces.push(`interface ${iname} {\n${fields.join('\n')}\n}`);
  }
  function getTSType(v,k,parent){
    if(v===null)return 'null';
    if(Array.isArray(v)){
      if(v.length===0)return 'any[]';
      const it=getTSType(v[0],k,parent);
      return `${it}[]`;
    }
    switch(typeof v){
      case 'string':return 'string';
      case 'number':return 'number';
      case 'boolean':return 'boolean';
      case 'object':{const cn=capitalize(k);process(v,cn);return cn}
    }
    return 'any';
  }
  if(typeof obj==='object'&&obj!==null&&!Array.isArray(obj)){process(obj,name)}
  else if(Array.isArray(obj)&&obj.length>0&&typeof obj[0]==='object'){process(obj[0],name)}
  else ifaces.push(`type ${name} = ${typeof obj};`);
  return ifaces.join('\n\n');
}
function jsonToGo(obj,name='Root'){
  const structs=[];
  function process(o,sname){
    const fields=[];
    for(const[k,v]of Object.entries(o)){
      const t=getGoType(v,k,sname);
      fields.push(`\t${capitalize(k)} ${t} \`json:"${k}"\``);
    }
    structs.push(`type ${sname} struct {\n${fields.join('\n')}\n}`);
  }
  function getGoType(v,k,parent){
    if(v===null)return 'interface{}';
    if(Array.isArray(v)){if(v.length===0)return '[]interface{}';return `[]${getGoType(v[0],k,parent)}`}
    switch(typeof v){
      case 'string':return 'string';
      case 'number':return Number.isInteger(v)?'int':'float64';
      case 'boolean':return 'bool';
      case 'object':{const cn=capitalize(k);process(v,cn);return cn}
    }
    return 'interface{}';
  }
  if(typeof obj==='object'&&obj!==null&&!Array.isArray(obj))process(obj,name);
  else if(Array.isArray(obj)&&obj.length>0&&typeof obj[0]==='object')process(obj[0],name);
  return 'package main\n\n'+structs.join('\n\n');
}
function jsonToKotlin(obj,name='Root'){
  const classes=[];
  function process(o,cname){
    const fields=[];
    for(const[k,v]of Object.entries(o)){
      const t=getKotlinType(v,k,cname);
      fields.push(`\t@SerializedName("${k}")\n\tval ${k}: ${t}`);
    }
    classes.push(`data class ${cname} (\n${fields.join(',\n')}\n)`);
  }
  function getKotlinType(v,k,parent){
    if(v===null)return 'Any?';
    if(Array.isArray(v)){if(v.length===0)return 'List<Any>';return `List<${getKotlinType(v[0],k,parent)}>`}
    switch(typeof v){
      case 'string':return 'String';
      case 'number':return Number.isInteger(v)?'Int':'Double';
      case 'boolean':return 'Boolean';
      case 'object':{const cn=capitalize(k);process(v,cn);return cn}
    }
    return 'Any';
  }
  if(typeof obj==='object'&&obj!==null&&!Array.isArray(obj))process(obj,name);
  else if(Array.isArray(obj)&&obj.length>0&&typeof obj[0]==='object')process(obj[0],name);
  return classes.join('\n\n');
}
function jsonToRust(obj,name='Root'){
  const structs=[];
  function process(o,sname){
    const fields=[];
    for(const[k,v]of Object.entries(o)){
      const t=getRustType(v,k,sname);
      fields.push(`    #[serde(rename = "${k}")]\n    pub ${k}: ${t},`);
    }
    structs.push(`#[derive(Debug, Serialize, Deserialize)]\npub struct ${sname} {\n${fields.join('\n')}\n}`);
  }
  function getRustType(v,k,parent){
    if(v===null)return 'Option<serde_json::Value>';
    if(Array.isArray(v)){if(v.length===0)return 'Vec<serde_json::Value>';return `Vec<${getRustType(v[0],k,parent)}>`}
    switch(typeof v){
      case 'string':return 'String';
      case 'number':return Number.isInteger(v)?'i64':'f64';
      case 'boolean':return 'bool';
      case 'object':{const cn=capitalize(k);process(v,cn);return cn}
    }
    return 'serde_json::Value';
  }
  if(typeof obj==='object'&&obj!==null&&!Array.isArray(obj))process(obj,name);
  else if(Array.isArray(obj)&&obj.length>0&&typeof obj[0]==='object')process(obj[0],name);
  return 'use serde::{Serialize, Deserialize};\n\n'+structs.join('\n\n');
}
function jsonToSchema(obj){
  function getSchema(v){
    if(v===null)return {type:'null'};
    if(Array.isArray(v)){const items=v.length>0?getSchema(v[0]):{};return {type:'array',items}}
    switch(typeof v){
      case 'string':return {type:'string'};
      case 'number':return {type:Number.isInteger(v)?'integer':'number'};
      case 'boolean':return {type:'boolean'};
      case 'object':{
        const props={},req=[];
        for(const[k,val]of Object.entries(v)){props[k]=getSchema(val);req.push(k)}
        return {type:'object',properties:props,required:req};
      }
    }
    return {};
  }
  return {$schema:'http://json-schema.org/draft-07/schema#',title:'Root',...getSchema(obj)};
}

// ── Query Tool ──
function renderQueryBar(){
  $('textOutput').innerHTML=`
    <div class="query-bar">
      <input class="query-input" id="queryInput" placeholder="e.g. data.features  or  $.stats.rating  or  data.employees.filter(e => e.role === 'Engineer')" />
      <button class="btn btn-primary btn-sm" id="runQueryBtn">Run</button>
    </div>
    <div style="padding:8px 12px;font-size:11px;color:var(--text-muted)">
      Supports: dot notation (data.key), JSONPath ($.key.subkey), array indexing ($[0]), and JS expressions (data.filter(...))
    </div>
    <div class="code-output" id="queryOutput" style="min-height:200px;color:var(--text-muted)">Results will appear here</div>
  `;
  $('runQueryBtn').onclick=runQuery;
  $('queryInput').addEventListener('keydown',e=>{if(e.key==='Enter')runQuery()});
}
function runQuery(){
  if(!state.parsed){toast('Visualize data first','error');return}
  const q=$('queryInput').value.trim();
  if(!q){toast('Enter a query','error');return}
  try{
    let result;
    if(q.startsWith('$')){
      result=runJsonPath(state.parsed,q);
    }else{
      const fn=new Function('data',`try{return ${q}}catch(e){return {error:e.message}}`);
      result=fn(state.parsed);
    }
    const output=typeof result==='object'?JSON.stringify(result,null,2):String(result);
    $('queryOutput').innerHTML=highlightJson(output);
    state.lastTextOutput=output;
    $('outputFilename').textContent='query-result.json';
  }catch(e){
    $('queryOutput').innerHTML=`<span style="color:var(--error)">Error: ${escapeHtml(e.message)}</span>`;
  }
}
function runJsonPath(data,path){
  let p=path.replace(/^\$\.?/,'');
  if(p==='')return data;
  const parts=p.split(/\.|(\[\d+\])|(\[\*\])/).filter(x=>x);
  let current=[data];
  for(const part of parts){
    const next=[];
    if(part==='*'){
      for(const item of current){
        if(Array.isArray(item))next.push(...item);
        else if(item&&typeof item==='object')next.push(...Object.values(item));
      }
    }else if(part.startsWith('[')&&part.endsWith(']')){
      const idx=parseInt(part.slice(1,-1));
      for(const item of current){
        if(Array.isArray(item)&&item[idx]!==undefined)next.push(item[idx]);
      }
    }else{
      for(const item of current){
        if(item&&typeof item==='object'&&item[part]!==undefined)next.push(item[part]);
      }
    }
    current=next;
  }
  return current.length===0?undefined:current.length===1?current[0]:current;
}

// ── Export ──
function exportGraph(){
  const svg=$('graphSvg');
  if(svg.style.display==='none'){toast('Visualize a graph first','error');return}
  const clone=svg.cloneNode(true);
  const bg=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
  const rect=$('graphContainer').getBoundingClientRect();
  clone.setAttribute('width',rect.width);
  clone.setAttribute('height',rect.height);
  clone.querySelector('#graphBg').setAttribute('fill',bg);
  const styleEl=document.createElementNS(SVG_NS,'style');
  const cs=getComputedStyle(document.documentElement);
  const vars=['--bg-panel','--border','--text','--text-muted','--accent',
    '--node-object','--node-array','--node-string','--node-number','--node-boolean','--node-null'];
  styleEl.textContent=vars.map(v=>v+':'+cs.getPropertyValue(v).trim()).join(';');
  clone.insertBefore(styleEl,clone.firstChild);
  const svgStr=new XMLSerializer().serializeToString(clone);
  const blob=new Blob([svgStr],{type:'image/svg+xml'});
  downloadFile('json-crack-graph.svg',blob,'image/svg+xml');
  toast('SVG exported!','success');
}

// ── Status ──
function updateStatus(valid){
  const dot=$('statusDot'),txt=$('statusText');
  if(valid===null){dot.className='status-dot empty';txt.textContent='Empty';return}
  if(valid){
    dot.className='status-dot valid';
    txt.textContent='Valid '+state.inputFormat.toUpperCase();
  }else{
    dot.className='status-dot invalid';
    txt.textContent='Invalid';
  }
}

// ── Tab Management ──
function switchTab(tab){
  state.tab=tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tab));
  const toolbar=$('outputToolbar');
  const gc=$('graphContainer'),to=$('textOutput');
  if(tab==='graph'){
    toolbar.style.display='flex';
    $('outputFilename').textContent='graph.svg';
    gc.style.display='block';to.style.display='none';
    if(state.parsed){
      showGraphView();
      computeVisible();
      renderGraphElements();
      updateGraphPositions();
      startSim();
    }else{
      $('graphEmpty').style.display='flex';
      $('graphSvg').style.display='none';
      $('graphLegend').style.display='none';
      $('graphControls').style.display='none';
    }
  }else{
    stopSim();
    toolbar.style.display='flex';
    gc.style.display='none';to.style.display='block';
    if(tab==='tree'){to.innerHTML='<div class="tree-view">'+buildTreeHtml(state.parsed,'root',true,0)+'</div>';attachTreeToggles();$('outputFilename').textContent='tree.txt'}
    else if(tab==='format'){formatJson();}
    else if(tab==='convert'){renderConvertBar();$('outputFilename').textContent='converted.txt'}
    else if(tab==='codegen'){renderCodegenBar();$('outputFilename').textContent='generated.txt'}
    else if(tab==='query'){renderQueryBar();$('outputFilename').textContent='query-result.json'}
  }
}

// ── Theme Toggle ──
function toggleTheme(){
  const app=document.querySelector('.app');
  const dark=app.dataset.theme==='dark';
  app.dataset.theme=dark?'light':'dark';
  $('themeToggle').textContent=dark?'☀️':'🌙';
  document.documentElement.dataset.theme=app.dataset.theme;
  if(state.tab==='graph'&&state.parsed){
    const bg=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
    $('graphBg').setAttribute('fill',bg);
  }
}

// ── Init ──
function init(){
  document.documentElement.dataset.theme='dark';
  const input=$('jsonInput');
  input.addEventListener('input',()=>{updateLineNumbers();updateCharCount()});
  input.addEventListener('scroll',()=>{$('lineNumbers').scrollTop=input.scrollTop});
  input.addEventListener('keydown',e=>{
    if(e.key==='Tab'){
      e.preventDefault();
      const s=input.selectionStart,en=input.selectionEnd;
      input.value=input.value.slice(0,s)+'  '+input.value.slice(en);
      input.selectionStart=input.selectionEnd=s+2;
    }
    if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();visualize()}
  });
  $('visualizeBtn').onclick=visualize;
  $('formatInputBtn').onclick=()=>{switchTab('format')};
  $('minifyBtn').onclick=minifyJson;
  $('validateBtn').onclick=validateJson;
  $('sampleBtn').onclick=()=>{input.value=SAMPLES[sampleIdx%SAMPLES.length];sampleIdx++;updateLineNumbers();updateCharCount();visualize()};
  $('clearBtn').onclick=()=>{input.value='';state.parsed=null;state.nodes=[];state.edges=[];updateLineNumbers();updateCharCount();updateStatus(null);$('graphSvg').style.display='none';$('graphLegend').style.display='none';$('graphControls').style.display='none';$('graphEmpty').style.display='flex';$('textOutput').innerHTML='';$('textOutput').style.display='none';$('graphContainer').style.display='block';$('nodeCountStatus').textContent='';state.lastTextOutput=''};
  $('themeToggle').onclick=toggleTheme;
  $('exportBtn').onclick=exportGraph;
  $('zoomInBtn').onclick=()=>{state.transform.scale=Math.min(5,state.transform.scale*1.2);updateTransform()};
  $('zoomOutBtn').onclick=()=>{state.transform.scale=Math.max(0.1,state.transform.scale/1.2);updateTransform()};
  $('fitBtn').onclick=fitToView;
  $('copyOutputBtn').onclick=()=>{
    if(state.tab==='graph'){toast('Use Export button for graph','');return}
    if(state.lastTextOutput)copyText(state.lastTextOutput);
  };
  $('downloadOutputBtn').onclick=()=>{
    if(state.tab==='graph'){exportGraph();return}
    if(state.lastTextOutput)downloadFile($('outputFilename').textContent,state.lastTextOutput);
  };
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>switchTab(t.dataset.tab));
  setupGraphInteraction();
  updateLineNumbers();
  updateCharCount();
  updateStatus(null);
  input.value=SAMPLES[0];
  updateLineNumbers();
  updateCharCount();
  setTimeout(visualize,300);
}
window.addEventListener('load',init);
window.addEventListener('resize',()=>{if(state.tab==='graph'&&state.parsed)fitToView()});
</script>
