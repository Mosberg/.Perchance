<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>vte6md2fd3 — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>

  <main class="sim">
    <header class="hero">
      <h1>[title]</h1>
      <p>[subtitle]</p>
      <button id="rollBtn" onclick="update()">Generate New Robot</button>
    </header>

    <section class="panel">

      <div class="card">
    <h2>[robot_name]</h2>
    <p class="subtitle">[sizeClass] • [archetype]</p>
    <div class="grid">
      <div><span>Weapon</span><strong>[weapon]</strong></div>
      <div><span>Armor</span><strong>[armor]</strong></div>
      <div><span>Drive</span><strong>[drivetrain]</strong></div>
      <div><span>Feature</span><strong>[feature]</strong></div>
      <div><span>Weakness</span><strong>[weakness]</strong></div>
      <div><span>Stats</span><strong>[statBlock]</strong></div>
    </div>
      </div>
    </section>

    <section class="panel panel--notes">
      <h3>Build Notes</h3>
      <p>[build_notes]</p>
    </section>
  </main>

  <style>
    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      background: radial-gradient(circle at top, #1c2330, #0b0f16 60%);
      color: #f3f6fb;
    }
    .sim {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px;
    }
    .hero {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 24px;
      border-radius: 18px;
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(8px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.35);
    }
    .hero h1 {
      margin: 0;
      font-size: 2rem;
    }
    .hero p {
      margin: 0;
      opacity: 0.8;
    }
    button {
      align-self: flex-start;
      border: 0;
      border-radius: 12px;
      padding: 12px 16px;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(135deg, #ff6a3d, #ffb03a);
      color: #111;
    }
    .panel {
      margin-top: 18px;
      padding: 20px;
      border-radius: 18px;
      background: rgba(255,255,255,0.08);
      box-shadow: 0 12px 40px rgba(0,0,0,0.25);
    }
    .card h2 {
      margin: 0 0 6px;
      font-size: 1.8rem;
    }
    .subtitle {
      margin: 0 0 18px;
      opacity: 0.8;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }
    .grid div {
      padding: 14px;
      border-radius: 14px;
      background: rgba(0,0,0,0.18);
    }
    .grid span {
      display: block;
      font-size: 0.78rem;
      opacity: 0.7;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 4px;
    }
    .grid strong {
      font-size: 1rem;
      line-height: 1.35;
    }
    .panel--notes h3 {
      margin-top: 0;
    }
  </style>
</body>
</html>
