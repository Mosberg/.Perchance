<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>8pry95nppt — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<style>
  body { text-align: left; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0d0d14; color: #e8e0d4; }
  #app { max-width: 920px; margin: 0 auto; padding: 28px 16px 60px; }
  h1 { font-size: 1.7rem; margin: 0 0 6px; letter-spacing: 0.5px; }
  .title-arch { background: linear-gradient(90deg, #d4a843, #e8c870, #d4a843); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .title-glitter { background: linear-gradient(90deg, #ff6ec7, #c77dff, #7dd3fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .title-product { background: linear-gradient(90deg, #5b9fff, #7dd3fc, #5b9fff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .sub { color: #8a8276; font-size: 0.88rem; margin: 0 0 18px; }
  .modeBar { display: flex; gap: 0; margin-bottom: 20px; border-radius: 10px; overflow: hidden; border: 1px solid #2a2820; }
  .modeBtn { flex: 1; padding: 12px 16px; text-align: center; font-size: 0.88rem; font-weight: 600; cursor: pointer; transition: all 0.2s; background: #15151f; color: #6a6452; border: none; }
  .modeBtn.active { color: #fff; }
  .modeBtn.active.arch { background: linear-gradient(135deg, #c9a227, #8a7020); }
  .modeBtn.active.glitter { background: linear-gradient(135deg, #ff6ec7, #c77dff); }
  .modeBtn.active.product { background: linear-gradient(135deg, #5b9fff, #4a7ce0); }
  .controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
  .btn-arch { background: linear-gradient(135deg, #c9a227, #e8c870); color: #1a1408; }
  .btn-glitter { background: linear-gradient(135deg, #ff6ec7, #c77dff); color: #fff; }
  .btn-product { background: linear-gradient(135deg, #5b9fff, #4a7ce0); color: #fff; }
  button { border: none; padding: 12px 26px; border-radius: 8px; font-size: 0.92rem; font-weight: 700; cursor: pointer; transition: transform 0.15s, opacity 0.15s; letter-spacing: 0.3px; }
  button:hover { transform: translateY(-1px); opacity: 0.9; }
  button:active { transform: translateY(0); }
  button.secondary { background: #1e1e2e; color: #aaa; border: 1px solid #333; }
  #promptBox { position: relative; }
  #promptEl { background: #15151f; border: 1px solid #2a2820; border-radius: 10px; padding: 22px; font-size: 0.88rem; line-height: 1.7; min-height: 100px; white-space: pre-wrap; word-break: break-word; color: #d4cfc4; font-family: "SF Mono", "Fira Code", Consolas, monospace; }
  .copyBtn { position: absolute; top: 10px; right: 10px; background: #2a2820; border: 1px solid #3a3528; color: #aaa; padding: 6px 16px; border-radius: 6px; font-size: 0.78rem; cursor: pointer; font-weight: 600; z-index: 1; }
  .copyBtn:hover { background: #3a3528; }
  .history { margin-top: 30px; }
  .history h3 { font-size: 0.95rem; color: #8a8276; margin: 0 0 12px; text-transform: uppercase; letter-spacing: 1px; }
  .historyItem { background: #15151f; border: 1px solid #2a2820; border-radius: 8px; padding: 14px 16px; margin-bottom: 8px; font-size: 0.8rem; line-height: 1.55; color: #a8a294; white-space: pre-wrap; word-break: break-word; cursor: pointer; transition: border-color 0.15s, color 0.15s; font-family: "SF Mono", "Fira Code", Consolas, monospace; max-height: 120px; overflow: hidden; }
  .historyItem:hover { color: #d4cfc4; }
  .historyItem.glitter-mode:hover { border-color: #ff6ec7; }
  .historyItem.arch-mode:hover { border-color: #c9a227; }
  .historyItem.product-mode:hover { border-color: #5b9fff; }
  .empty { color: #4a4838; font-style: italic; font-size: 0.85rem; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 4px; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.5px; margin-bottom: 10px; }
  .badge.arch { background: #2a2820; color: #c9a227; }
  .badge.glitter { background: #2a1a2e; color: #ff6ec7; }
  .badge.product { background: #1a2a3a; color: #5b9fff; }
</style>

<div id="app">
  <span class="badge arch" id="badgeEl">Midjourney v6.1 — v8.1</span>
  <h1 class="title-arch" id="titleEl">Luxury Architecture Prompt Generator</h1>
  <p class="sub" id="subEl">Futuristic mansions, rococo maximalism, biophilic estates, and surreal luxury interiors — photorealistic architectural prompts.</p>

  <div class="modeBar">
    <button class="modeBtn arch active" id="modeArchBtn">🏛 Architecture</button>
    <button class="modeBtn glitter" id="modeGlitterBtn">✨ Glitter &amp; Surreal</button>
    <button class="modeBtn product" id="modeProductBtn">📦 Product</button>
  </div>

  <div class="controls">
    <button id="genBtn" class="btn-arch">Generate Prompt</button>
    <button id="gen5Btn" class="secondary">Generate 5</button>
  </div>

  <div id="promptBox">
    <button class="copyBtn" id="copyBtn">Copy</button>
    <div id="promptEl"><span class="empty">Click "Generate Prompt" to create a Midjourney prompt.</span></div>
  </div>

  <div class="history">
    <h3>History</h3>
    <div id="historyEl"></div>
  </div>
</div>

<script>
  let history = [];
  let currentMode = "arch";

  function setMode(mode) {
    currentMode = mode;
    modeArchBtn.classList.remove("active");
    modeGlitterBtn.classList.remove("active");
    modeProductBtn.classList.remove("active");
    if (mode === "glitter") {
      titleEl.textContent = "Glitter & Surreal Prompt Generator";
      titleEl.className = "title-glitter";
      subEl.textContent = "Surreal editorial product photography prompts — glitter, gemstones, holographic foil, pastel solids.";
      badgeEl.textContent = "Midjourney v7 — v8.1";
      badgeEl.className = "badge glitter";
      genBtn.className = "btn-glitter";
      modeGlitterBtn.classList.add("active");
    } else if (mode === "product") {
      titleEl.textContent = "Product Photography Prompt Generator";
      titleEl.className = "title-product";
      subEl.textContent = "Branded commercial product photography — bottles, cans, tins, packaging, flat lays, and studio still life.";
      badgeEl.textContent = "Midjourney v8.1";
      badgeEl.className = "badge product";
      genBtn.className = "btn-product";
      modeProductBtn.classList.add("active");
    } else {
      titleEl.textContent = "Luxury Architecture Prompt Generator";
      titleEl.className = "title-arch";
      subEl.textContent = "Futuristic mansions, rococo maximalism, biophilic estates, and surreal luxury interiors — photorealistic architectural prompts.";
      badgeEl.textContent = "Midjourney v6.1 — v8.1";
      badgeEl.className = "badge arch";
      genBtn.className = "btn-arch";
      modeArchBtn.classList.add("active");
    }
  }

  function showPrompt(p) {
    promptEl.textContent = p;
  }

  function addHistory(p, mode) {
    history.unshift({ text: p, mode: mode });
    if (history.length > 12) history.pop();
    renderHistory();
  }

  function renderHistory() {
    if (history.length === 0) {
      historyEl.innerHTML = '<span class="empty">No prompts yet.</span>';
      return;
    }
    historyEl.innerHTML = history.map(function(item, i) {
      var cls = item.mode === "glitter" ? "glitter-mode" : item.mode === "product" ? "product-mode" : "arch-mode";
      return '<div class="historyItem ' + cls + '" data-idx="' + i + '">' + escapeHtml(item.text) + '</div>';
    }).join('');
  }

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  historyEl.addEventListener('click', function(e) {
    var item = e.target.closest('.historyItem');
    if (item) {
      var idx = parseInt(item.dataset.idx, 10);
      if (!isNaN(idx) && history[idx]) {
        showPrompt(history[idx].text);
        setMode(history[idx].mode);
      }
    }
  });

  async function copyPrompt() {
    var text = promptEl.textContent;
    if (!text || text.indexOf('Click') === 0) return;
    try {
      await navigator.clipboard.writeText(text);
      copyBtn.textContent = 'Copied!';
      setTimeout(function() { copyBtn.textContent = 'Copy'; }, 1500);
    } catch (e) {
      var ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      copyBtn.textContent = 'Copied!';
      setTimeout(function() { copyBtn.textContent = 'Copy'; }, 1500);
    }
  }

  function gen() {
    var p = root.generatePrompt(currentMode);
    showPrompt(p);
    addHistory(p, currentMode);
  }

  function gen5() {
    var prompts = [];
    for (var i = 0; i < 5; i++) prompts.push(root.generatePrompt(currentMode));
    showPrompt(prompts.join('\n\n———\n\n'));
    prompts.forEach(function(p) { addHistory(p, currentMode); });
  }

  modeArchBtn.addEventListener('click', function() { setMode("arch"); });
  modeGlitterBtn.addEventListener('click', function() { setMode("glitter"); });
  modeProductBtn.addEventListener('click', function() { setMode("product"); });
  genBtn.addEventListener('click', gen);
  gen5Btn.addEventListener('click', gen5);
  copyBtn.addEventListener('click', copyPrompt);

  gen();
</script>

</body>
</html>
