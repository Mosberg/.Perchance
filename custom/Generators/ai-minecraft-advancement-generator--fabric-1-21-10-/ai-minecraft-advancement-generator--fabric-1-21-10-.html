<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>ai-minecraft-advancement-generator--fabric-1-21-10- — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<div style="max-width:1200px; margin:0 auto; padding:20px; font-family:Arial,sans-serif;">
  <h1 style="text-align:center; color:#333;">AI Minecraft Advancement Generator (Fabric 1.21.10)</h1>
  <p style="text-align:center; color:#666; font-style:italic;">Powered by Perchance AI Plugins</p>
  
  <div style="display:flex; gap:20px; margin-top:30px;">
    <!-- Form Section -->
    <div style="flex:1; background:#f8f9fa; padding:20px; border-radius:8px; border:1px solid #ddd;">
      <h2 style="color:#2c3e50; margin-top:0;">Advancement Settings</h2>
      
      <!-- AI Generation Controls -->
      <div style="margin-bottom:20px; background:#e8f4f8; padding:15px; border-radius:6px; border:1px solid #b3d9e8;">
        <h3 style="color:#1a7da7; margin-top:0;">AI Generation Controls</h3>
        <p style="color:#2c5282; margin-bottom:10px;">Use AI to generate advancement components:</p>
        <button id="aiSuggestBtn" style="padding:8px 15px; background:#1a7da7; color:white; border:none; border-radius:4px; cursor:pointer; margin-right:10px;">AI Suggest Advancement</button>
        <button id="aiGenerateBtn" style="padding:8px 15px; background:#2c5282; color:white; border:none; border-radius:4px; cursor:pointer;">AI Generate Criteria</button>
      </div>
      
      <!-- Basic Information -->
      <div style="margin-bottom:20px;">
        <h3 style="color:#34495e;">Basic Information</h3>
        <div style="margin-bottom:10px;">
          <label style="display:block; margin-bottom:5px;">Title:</label>
          <input id="titleInputEl" type="text" placeholder="Your First Dirt Block" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px;">
        </div>
        <div style="margin-bottom:10px;">
          <label style="display:block; margin-bottom:5px;">Description:</label>
          <input id="descInputEl" type="text" placeholder="Now make a house from it" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px;">
        </div>
        <div style="margin-bottom:10px;">
          <label style="display:block; margin-bottom:5px;">Icon Item:</label>
          <input id="iconInputEl" type="text" placeholder="minecraft:dirt" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px;">
        </div>
        <div style="margin-bottom:10px;">
          <label style="display:block; margin-bottom:5px;">Background (root only):</label>
          <input id="bgInputEl" type="text" placeholder="minecraft:textures/gui/advancements/backgrounds/adventure.png" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px;">
        </div>
        <div style="margin-bottom:10px;">
          <label style="display:block; margin-bottom:5px;">Type:</label>
          <select id="typeInputEl" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px;">
            <option value="TASK">TASK</option>
            <option value="CHALLENGE">CHALLENGE</option>
            <option value="GOAL">GOAL</option>
          </select>
        </div>
        <div style="display:flex; gap:15px; margin-bottom:10px;">
          <label style="display:flex; align-items:center;">
            <input type="checkbox" id="toastInputEl" checked style="margin-right:5px;"> Show Toast
          </label>
          <label style="display:flex; align-items:center;">
            <input type="checkbox" id="announceInputEl" checked style="margin-right:5px;"> Announce to Chat
          </label>
          <label style="display:flex; align-items:center;">
            <input type="checkbox" id="hiddenInputEl" style="margin-right:5px;"> Hidden Until Achieved
          </label>
        </div>
      </div>
      
      <!-- Criteria Section -->
      <div style="margin-bottom:20px;">
        <h3 style="color:#34495e;">Criteria</h3>
        <div id="criteriaListEl"></div>
        <button id="addCriterionBtn" style="margin-top:10px; padding:8px 15px; background:#3498db; color:white; border:none; border-radius:4px; cursor:pointer;">Add Criterion</button>
      </div>
      
      <!-- Rewards Section -->
      <div style="margin-bottom:20px;">
        <h3 style="color:#34495e;">Rewards (Optional)</h3>
        <div style="margin-bottom:10px;">
          <label style="display:block; margin-bottom:5px;">Experience:</label>
          <input id="xpInputEl" type="number" placeholder="0" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px;">
        </div>
        <div style="margin-bottom:10px;">
          <label style="display:block; margin-bottom:5px;">Loot Table:</label>
          <input id="lootInputEl" type="text" placeholder="minecraft:entities/cow" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px;">
        </div>
      </div>
      
      <!-- Parent Section -->
      <div style="margin-bottom:20px;">
        <h3 style="color:#34495e;">Parent Advancement</h3>
        <input id="parentInputEl" type="text" placeholder="mod_id:parent_advancement" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px;">
      </div>
      
      <!-- Mod Info -->
      <div style="margin-bottom:20px;">
        <h3 style="color:#34495e;">Mod Information</h3>
        <div style="margin-bottom:10px;">
          <label style="display:block; margin-bottom:5px;">Mod ID:</label>
          <input id="modIdInputEl" type="text" placeholder="examplemod" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px;">
        </div>
        <div style="margin-bottom:10px;">
          <label style="display:block; margin-bottom:5px;">Advancement ID:</label>
          <input id="advIdInputEl" type="text" placeholder="get_dirt" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px;">
        </div>
      </div>
      
      <button id="generateBtn" style="width:100%; padding:12px; background:#2ecc71; color:white; border:none; border-radius:4px; font-size:16px; cursor:pointer; font-weight:bold;">Generate Advancement</button>
    </div>
    
    <!-- Output Section -->
    <div style="flex:1; background:#f8f9fa; padding:20px; border-radius:8px; border:1px solid #ddd;">
      <h2 style="color:#2c3e50; margin-top:0;">Generated Code</h2>
      
      <div style="margin-bottom:15px;">
        <button id="jsonTabEl" class="tabBtn active" style="padding:10px 20px; background:#3498db; color:white; border:none; border-radius:4px 4px 0 0; cursor:pointer; margin-right:5px;">JSON</button>
        <button id="javaTabEl" class="tabBtn" style="padding:10px 20px; background:#95a5a6; color:white; border:none; border-radius:4px 4px 0 0; cursor:pointer;">Java</button>
      </div>
      
      <div id="jsonOutputEl" class="outputTab" style="background:#fff; padding:15px; border:1px solid #ddd; border-top:none; border-radius:0 4px 4px 4px; min-height:400px; white-space:pre-wrap; font-family:monospace;"></div>
      <div id="javaOutputEl" class="outputTab hidden" style="background:#fff; padding:15px; border:1px solid #ddd; border-top:none; border-radius:0 4px 4px 4px; min-height:400px; white-space:pre-wrap; font-family:monospace;"></div>
      
      <button id="copyBtn" style="margin-top:15px; padding:10px 20px; background:#9b59b6; color:white; border:none; border-radius:4px; cursor:pointer;">Copy to Clipboard</button>
    </div>
  </div>
  
  <style>
    .tabBtn.active { background:#3498db !important; }
    .outputTab.hidden { display:none; }
    .criterion-item { background:#fff; padding:10px; margin-bottom:10px; border-radius:4px; border:1px solid #ddd; }
    .criterion-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
    .criterion-body { display:flex; gap:10px; align-items:center; }
    .criterion-body select, .criterion-body input { flex:1; padding:6px; border:1px solid #ccc; border-radius:4px; }
    .remove-btn { background:#e74c3c; color:white; border:none; border-radius:4px; padding:5px 10px; cursor:pointer; }
    .ai-btn { background:#3498db; color:white; border:none; border-radius:4px; padding:5px 10px; cursor:pointer; font-size:12px; }
    .loading { color:#3498db; font-style:italic; }
  </style>
  
  <script>
    // Global variables
    let criteriaCount = 0;
    
    // Initialize page
    document.addEventListener('DOMContentLoaded', function() {
      // Set default values
      modIdInputEl.value = 'examplemod';
      advIdInputEl.value = 'get_dirt';
      
      // Add default criterion
      addCriterion();
      
      // Event listeners
      document.getElementById('addCriterionBtn').addEventListener('click', addCriterion);
      document.getElementById('generateBtn').addEventListener('click', generateAdvancement);
      document.getElementById('copyBtn').addEventListener('click', copyToClipboard);
      
      // AI generation event listeners
      aiSuggestBtn.addEventListener('click', suggestAdvancementWithAI);
      aiGenerateBtn.addEventListener('click', generateCriteriaWithAI);
      
      // Tab switching
      jsonTabEl.addEventListener('click', () => switchTab('json'));
      javaTabEl.addEventListener('click', () => switchTab('java'));
    });
    
    // Add new criterion
    function addCriterion() {
      criteriaCount++;
      const criteriaList = criteriaListEl;
      const criterionDiv = document.createElement('div');
      criterionDiv.className = 'criterion-item';
      criterionDiv.id = `criterion-${criteriaCount}`;
      
      criterionDiv.innerHTML = `
        <div class="criterion-header">
          <h4>Criterion ${criteriaCount}</h4>
          <div>
            <button class="ai-btn" onclick="generateSingleCriterionWithAI(${criteriaCount})">AI Generate</button>
            <button class="remove-btn" onclick="removeCriterion(${criteriaCount})">Remove</button>
          </div>
        </div>
        <div class="criterion-body">
          <input type="text" placeholder="Criterion name" id="critName-${criteriaCount}">
          <select id="critType-${criteriaCount}" onchange="updateCriterionParams(${criteriaCount})">
            <option value="inventory_changed">Inventory Changed</option>
            <option value="consume_item">Consume Item</option>
            <option value="custom">Custom Trigger</option>
          </select>
        </div>
        <div id="critParams-${criteriaCount}" class="criterion-params" style="margin-top:10px;"></div>
      `;
      
      criteriaList.appendChild(criterionDiv);
      updateCriterionParams(criteriaCount);
    }
    
    // Remove criterion
    function removeCriterion(id) {
      const element = document.getElementById(`criterion-${id}`);
      element.remove();
    }
    
    // Update criterion parameters based on trigger type
    function updateCriterionParams(id) {
      const type = document.getElementById(`critType-${id}`).value;
      const paramsDiv = document.getElementById(`critParams-${id}`);
      
      if (type === 'inventory_changed') {
        paramsDiv.innerHTML = `
          <div style="margin-bottom:5px;">
            <label style="display:block; margin-bottom:3px;">Item ID:</label>
            <input type="text" id="critItem-${id}" placeholder="minecraft:dirt" style="width:100%; padding:6px; border:1px solid #ccc; border-radius:4px;">
          </div>
        `;
      } else if (type === 'consume_item') {
        paramsDiv.innerHTML = `
          <div style="margin-bottom:5px;">
            <label style="display:block; margin-bottom:3px;">Item ID:</label>
            <input type="text" id="critItem-${id}" placeholder="minecraft:apple" style="width:100%; padding:6px; border:1px solid #ccc; border-radius:4px;">
          </div>
        `;
      } else if (type === 'custom') {
        paramsDiv.innerHTML = `
          <div style="margin-bottom:5px;">
            <label style="display:block; margin-bottom:3px;">Custom Trigger Code:</label>
            <textarea id="critCustom-${id}" placeholder="ModCriteria.CUSTOM.createCriterion(...)" style="width:100%; padding:6px; border:1px solid #ccc; border-radius:4px; min-height:80px;"></textarea>
          </div>
        `;
      }
    }
    
    // Switch between JSON and Java tabs
    function switchTab(tab) {
      document.querySelectorAll('.tabBtn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.outputTab').forEach(out => out.classList.add('hidden'));
      
      if (tab === 'json') {
        jsonTabEl.classList.add('active');
        jsonOutputEl.classList.remove('hidden');
      } else {
        javaTabEl.classList.add('active');
        javaOutputEl.classList.remove('hidden');
      }
    }
    
    // Generate advancement code
    function generateAdvancement() {
      // Collect form data
      const title = titleInputEl.value || 'Advancement';
      const description = descInputEl.value || 'Description';
      const icon = iconInputEl.value || 'minecraft:dirt';
      const background = bgInputEl.value || '';
      const type = typeInputEl.value;
      const showToast = toastInputEl.checked;
      const announce = announceInputEl.checked;
      const hidden = hiddenInputEl.checked;
      const xp = xpInputEl.value || 0;
      const loot = lootInputEl.value || '';
      const parent = parentInputEl.value || '';
      const modId = modIdInputEl.value || 'examplemod';
      const advId = advIdInputEl.value || 'advancement';
      
      // Collect criteria
      const criteria = {};
      const requirements = [];
      const criteriaElements = document.querySelectorAll('.criterion-item');
      
      criteriaElements.forEach((critEl, index) => {
        const critId = critEl.id.split('-')[1];
        const name = document.getElementById(`critName-${critId}`).value || `criterion_${index}`;
        const type = document.getElementById(`critType-${critId}`).value;
        
        if (type === 'inventory_changed') {
          const item = document.getElementById(`critItem-${critId}`).value || 'minecraft:dirt';
          criteria[name] = {
            trigger: 'minecraft:inventory_changed',
            conditions: {
              items: [{ item: item }]
            }
          };
          requirements.push([name]);
        } else if (type === 'consume_item') {
          const item = document.getElementById(`critItem-${critId}`).value || 'minecraft:apple';
          criteria[name] = {
            trigger: 'minecraft:consume_item',
            conditions: {
              item: { item: item }
            }
          };
          requirements.push([name]);
        } else if (type === 'custom') {
          const custom = document.getElementById(`critCustom-${critId}`).value || '// Custom trigger code';
          criteria[name] = {
            trigger: 'minecraft:impossible',
            conditions: {}
          };
          requirements.push([name]);
        }
      });
      
      // Generate JSON
      const json = {
        criteria: criteria,
        display: {
          icon: { item: icon },
          title: { text: title },
          description: { text: description },
          frame: type.toLowerCase(),
          announce_to_chat: announce,
          show_toast: showToast,
          hidden: hidden
        },
        requirements: requirements.length > 0 ? requirements : [['']],
        sends_telemetry_event: true
      };
      
      // Add background for root advancements
      if (background) {
        json.display.background = background;
      }
      
      // Add rewards if specified
      if (xp > 0 || loot) {
        json.rewards = {};
        if (xp > 0) json.rewards.experience = parseInt(xp);
        if (loot) json.rewards.loot = [loot];
      }
      
      // Add parent if specified
      if (parent) {
        json.parent = parent;
      }
      
      // Format JSON output
      jsonOutputEl.textContent = JSON.stringify(json, null, 2);
      
      // Generate Java code
      let javaCode = `Advancement.Builder.advancement()`;
      
      // Display section
      javaCode += `\n  .display(\n`;
      javaCode += `    Items.${icon.split(':')[1].toUpperCase()}, // The display icon\n`;
      javaCode += `    Component.literal("${title}"), // The title\n`;
      javaCode += `    Component.literal("${description}"), // The description\n`;
      javaCode += background ? `    ResourceLocation.withDefaultNamespace("${background}"), // Background image\n` : `    null, // Children don't need a background\n`;
      javaCode += `    AdvancementType.${type}, // TASK, CHALLENGE, or GOAL\n`;
      javaCode += `    ${showToast}, // Show the toast when completing it\n`;
      javaCode += `    ${announce}, // Announce it to chat\n`;
      javaCode += `    ${hidden} // Hide it in the advancement tab until it's achieved\n`;
      javaCode += `  )`;
      
      // Add criteria
      criteriaElements.forEach((critEl, index) => {
        const critId = critEl.id.split('-')[1];
        const name = document.getElementById(`critName-${critId}`).value || `criterion_${index}`;
        const type = document.getElementById(`critType-${critId}`).value;
        
        if (type === 'inventory_changed') {
          const item = document.getElementById(`critItem-${critId}`).value || 'minecraft:dirt';
          javaCode += `\n  .addCriterion("${name}", InventoryChangeTrigger.TriggerInstance.hasItems(Items.${item.split(':')[1].toUpperCase()}))`;
        } else if (type === 'consume_item') {
          const item = document.getElementById(`critItem-${critId}`).value || 'minecraft:apple';
          javaCode += `\n  .addCriterion("${name}", ConsumeItemTrigger.TriggerInstance.usedItem(itemLookup, Items.${item.split(':')[1].toUpperCase()}))`;
        } else if (type === 'custom') {
          const custom = document.getElementById(`critCustom-${critId}`).value || '// Custom trigger code';
          javaCode += `\n  .addCriterion("${name}", ${custom})`;
        }
      });
      
      // Add parent if specified
      if (parent) {
        javaCode += `\n  .parent(${parent})`;
      }
      
      // Final save
      javaCode += `\n  .save(consumer, ${modId}:\"${advId}\");`;
      
      // Format Java output
      javaOutputEl.textContent = javaCode;
    }
    
    // Copy to clipboard
    function copyToClipboard() {
      const activeTab = document.querySelector('.outputTab:not(.hidden)');
      const text = activeTab.textContent;
      
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById('copyBtn');
        const originalText = btn.textContent;
        btn.textContent = 'Copied!';
        btn.style.background = '#2ecc71';
        
        setTimeout(() => {
          btn.textContent = originalText;
          btn.style.background = '#9b59b6';
        }, 2000);
      });
    }
    
    // AI Functions
    async function suggestAdvancementWithAI() {
      aiSuggestBtn.disabled = true;
      aiSuggestBtn.textContent = "⏳ Generating...";
      
      try {
        const prompt = `Generate a creative Minecraft advancement idea for Fabric 1.21.10. 
        Provide the following details in JSON format:
        {
          "title": "Advancement title",
          "description": "Short description",
          "icon": "minecraft:item_id",
          "type": "TASK|CHALLENGE|GOAL",
          "criteria": [
            {"name": "criterion_name", "type": "inventory_changed|consume_item|custom", "item": "minecraft:item_id", "description": "what the player needs to do"}
          ],
          "parent": "mod_id:parent_advancement (optional)"
        }`;
        
        const response = await generateText(prompt);
        const advancementData = JSON.parse(response);
        
        // Populate form with AI-generated data
        titleInputEl.value = advancementData.title;
        descInputEl.value = advancementData.description;
        iconInputEl.value = advancementData.icon;
        typeInputEl.value = advancementData.type;
        
        if (advancementData.parent) {
          parentInputEl.value = advancementData.parent;
        }
        
        // Clear existing criteria
        criteriaListEl.innerHTML = '';
        criteriaCount = 0;
        
        // Add AI-generated criteria
        advancementData.criteria.forEach(criterion => {
          addCriterion();
          
          const lastId = criteriaCount;
          document.getElementById(`critName-${lastId}`).value = criterion.name;
          document.getElementById(`critType-${lastId}`).value = criterion.type;
          updateCriterionParams(lastId);
          
          if (criterion.type !== 'custom' && criterion.item) {
            document.getElementById(`critItem-${lastId}`).value = criterion.item;
          }
        });
        
      } catch (error) {
        alert("Error generating advancement: " + error.message);
      } finally {
        aiSuggestBtn.disabled = false;
        aiSuggestBtn.textContent = "AI Suggest Advancement";
      }
    }
    
    async function generateCriteriaWithAI() {
      aiGenerateBtn.disabled = true;
      aiGenerateBtn.textContent = "⏳ Generating...";
      
      try {
        const title = titleInputEl.value || "advancement";
        const description = descInputEl.value || "player action";
        const prompt = `Generate 2-3 Minecraft advancement criteria for an advancement called "${title}" which is about "${description}".
        Provide the criteria in JSON format:
        [
          {"name": "criterion_name", "type": "inventory_changed|consume_item|custom", "item": "minecraft:item_id", "description": "what the player needs to do"}
        ]`;
        
        const response = await generateText(prompt);
        const criteriaData = JSON.parse(response);
        
        // Clear existing criteria
        criteriaListEl.innerHTML = '';
        criteriaCount = 0;
        
        // Add AI-generated criteria
        criteriaData.forEach(criterion => {
          addCriterion();
          
          const lastId = criteriaCount;
          document.getElementById(`critName-${lastId}`).value = criterion.name;
          document.getElementById(`critType-${lastId}`).value = criterion.type;
          updateCriterionParams(lastId);
          
          if (criterion.type !== 'custom' && criterion.item) {
            document.getElementById(`critItem-${lastId}`).value = criterion.item;
          }
        });
        
      } catch (error) {
        alert("Error generating criteria: " + error.message);
      } finally {
        aiGenerateBtn.disabled = false;
        aiGenerateBtn.textContent = "AI Generate Criteria";
      }
    }
    
    async function generateSingleCriterionWithAI(id) {
      const btn = event.target;
      btn.disabled = true;
      btn.textContent = "⏳ Generating...";
      
      try {
        const title = titleInputEl.value || "advancement";
        const prompt = `Generate a Minecraft advancement criterion for an advancement called "${title}".
        Provide the criterion in JSON format:
        {"name": "criterion_name", "type": "inventory_changed|consume_item|custom", "item": "minecraft:item_id", "description": "what the player needs to do"}`;
        
        const response = await generateText(prompt);
        const criterionData = JSON.parse(response);
        
        // Update the criterion
        document.getElementById(`critName-${id}`).value = criterionData.name;
        document.getElementById(`critType-${id}`).value = criterionData.type;
        updateCriterionParams(id);
        
        if (criterionData.type !== 'custom' && criterionData.item) {
          document.getElementById(`critItem-${id}`).value = criterionData.item;
        }
        
      } catch (error) {
        alert("Error generating criterion: " + error.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "AI Generate";
      }
    }
  </script>
</div>
</body>
</html>
