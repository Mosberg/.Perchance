<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>year-range-and-creator-plugin — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<style>
  body { margin:0; font-family:sans-serif; min-height:100vh; display:flex; flex-direction:column; }
  main { flex:1; padding:2rem; }
  footer { padding:1.5rem; background:#f0f0f0; text-align:center; }
</style>

<header style="background:#333; color:white; padding:1rem;">
  <h1>My Website</h1>
</header>

<main>
  <h2>Welcome!</h2>
  <p>This is a demonstration of the dynamic year range copyright plugin.</p>
  <p>The footer automatically updates the copyright year based on the current year.</p>
</main>

<footer id="footer">
  <p>
    &copy; <span id="yearRangeEl"></span> Created by Mosberg. All rights
    reserved.
  </p>

  <script>
    const startYear = 2025; // Change this to your project's starting year
    const currentYear = new Date().getFullYear();
    const yearText =
      currentYear > startYear ? `${startYear}–${currentYear}` : `${startYear}`;
    yearRangeEl.textContent = yearText;
  </script>
</footer>
</body>
</html>
