<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>ai-minecraft-fabric-mod-generator — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<div style="max-width:800px; margin:0 auto; padding:20px; font-family:Arial,sans-serif;">
  <h1>AI Minecraft Fabric Mod Generator</h1>
  <p>Create custom Minecraft Fabric mods with AI assistance. Fill in the details below to generate a complete mod project.</p>
  
  <div id="formCtn" style="text-align:left; margin:20px 0; padding:15px; border:1px solid #ddd; border-radius:8px;">
    <h2>Mod Details</h2>
    
    <div style="margin:10px 0;">
      <label for="modIdInput" style="display:block; margin-bottom:5px;">Mod ID (unique identifier):</label>
      <input type="text" id="modIdInput" style="width:100%; padding:8px;" placeholder="e.g. mycoolmod" required>
    </div>
    
    <div style="margin:10px 0;">
      <label for="modNameInput" style="display:block; margin-bottom:5px;">Mod Name:</label>
      <input type="text" id="modNameInput" style="width:100%; padding:8px;" placeholder="e.g. My Cool Mod" required>
    </div>
    
    <div style="margin:10px 0;">
      <label for="modVersionInput" style="display:block; margin-bottom:5px;">Mod Version:</label>
      <input type="text" id="modVersionInput" style="width:100%; padding:8px;" value="1.0.0" required>
    </div>
    
    <div style="margin:10px 0;">
      <label for="modDescriptionInput" style="display:block; margin-bottom:5px;">Mod Description:</label>
      <textarea id="modDescriptionInput" style="width:100%; padding:8px; min-height:80px;" placeholder="Brief description of your mod"></textarea>
    </div>
    
    <h3 style="margin-top:20px;">Block Options</h3>
    <div style="margin:10px 0;">
      <label>
        <input type="checkbox" id="includeBlockCheckbox" checked> Include Custom Block
      </label>
    </div>
    
    <div id="blockDetailsCtn">
      <div style="margin:10px 0;">
        <label for="blockNameInput" style="display:block; margin-bottom:5px;">Block Name:</label>
        <input type="text" id="blockNameInput" style="width:100%; padding:8px;" placeholder="e.g. Ruby Block" required>
      </div>
      
      <div style="margin:10px 0;">
        <label for="blockHardnessInput" style="display:block; margin-bottom:5px;">Hardness (0.1-50.0):</label>
        <input type="number" id="blockHardnessInput" style="width:100%; padding:8px;" min="0.1" max="50" step="0.1" value="2.0">
      </div>
      
      <div style="margin:10px 0;">
        <label for="blockResistanceInput" style="display:block; margin-bottom:5px;">Resistance (0.1-1000.0):</label>
        <input type="number" id="blockResistanceInput" style="width:100%; padding:8px;" min="0.1" max="1000" step="0.1" value="6.0">
      </div>
      
      <div style="margin:10px 0;">
        <label for="blockTextureInput" style="display:block; margin-bottom:5px;">Texture (optional):</label>
        <input type="file" id="blockTextureInput" accept="image/png">
        <button type="button" id="generateBlockTextureBtn" style="margin-top:8px; padding:6px 12px;">Generate AI Texture</button>
        <div id="texturePreview" style="margin-top:10px;"></div>
      </div>
    </div>
    
    <button id="generateBtn" style="margin-top:20px; padding:10px 20px; background-color:#4CAF50; color:white; border:none; border-radius:4px; cursor:pointer; font-size:16px;">
      Generate Mod
    </button>
  </div>
  
  <div id="statusEl" style="margin:20px 0; padding:10px; background-color:#f8f9fa; border-radius:4px; display:none;"></div>
  
  <div id="downloadCtn" style="margin-top:20px; text-align:center; display:none;">
    <h2>Your Mod is Ready!</h2>
    <p>Download your mod project files below:</p>
    <button id="downloadBtn" style="margin-top:10px; padding:10px 20px; background-color:#2196F3; color:white; border:none; border-radius:4px; cursor:pointer; font-size:16px;">
      Download Mod (.zip)
    </button>
  </div>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script>
    let blockTextureData = null;
    
    // Helper function to convert to camelCase
    function toCamelCase(str) {
      return str.replace(/(?:^\w|[A-Z]|\b\w)/g, function(word, index) {
        return index === 0 ? word.toLowerCase() : word.toUpperCase();
      }).replace(/\s+/g, '');
    }
    
    // Helper function to convert to constant case
    function toConstantCase(str) {
      return str.replace(/[\W_]+/g, "_").toUpperCase();
    }
    
    // Helper function to convert to registry name
    function toRegistryName(str) {
      return str.toLowerCase().replace(/\s+/g, '_');
    }
    
    // Toggle block details visibility
    includeBlockCheckbox.addEventListener('change', function() {
      blockDetailsCtn.hidden = !this.checked;
    });
    
    // Generate block texture with AI
    generateBlockTextureBtn.addEventListener('click', async function() {
      if (!blockNameInput.value) {
        statusEl.textContent = "Please enter a block name first";
        statusEl.style.display = "block";
        return;
      }
      
      this.disabled = true;
      this.textContent = "Generating...";
      statusEl.textContent = "Generating texture with AI...";
      statusEl.style.display = "block";
      
      try {
        blockTextureData = await generateImage(`Minecraft texture for a ${blockNameInput.value} block, 16x16 pixels, pixel art, seamless tile`);
        
        // Show preview
        texturePreview.innerHTML = '';
        let img = document.createElement('img');
        img.src = blockTextureData;
        img.style.width = '64px';
        img.style.height = '64px';
        img.style.imageRendering = 'pixelated';
        texturePreview.appendChild(img);
        
        statusEl.textContent = "Texture generated successfully!";
      } catch (error) {
        statusEl.textContent = "Error generating texture: " + error.message;
      } finally {
        this.disabled = false;
        this.textContent = "Generate AI Texture";
      }
    });
    
    // Handle file upload for texture
    blockTextureInput.addEventListener('change', function(e) {
      if (e.target.files && e.target.files[0]) {
        const reader = new FileReader();
        reader.onload = function(event) {
          blockTextureData = event.target.result;
          
          // Show preview
          texturePreview.innerHTML = '';
          let img = document.createElement('img');
          img.src = blockTextureData;
          img.style.width = '64px';
          img.style.height = '64px';
          img.style.imageRendering = 'pixelated';
          texturePreview.appendChild(img);
        };
        reader.readAsDataURL(e.target.files[0]);
      }
    });
    
    // Generate mod
    generateBtn.addEventListener('click', async function() {
      // Validate form
      if (!modIdInput.value || !modNameInput.value || !modVersionInput.value) {
        statusEl.textContent = "Please fill in all required mod details";
        statusEl.style.display = "block";
        return;
      }
      
      if (includeBlockCheckbox.checked && !blockNameInput.value) {
        statusEl.textContent = "Please enter a block name";
        statusEl.style.display = "block";
        return;
      }
      
      this.disabled = true;
      this.textContent = "Generating...";
      statusEl.textContent = "Generating your mod project...";
      statusEl.style.display = "block";
      
      try {
        const modId = modIdInput.value;
        const modName = modNameInput.value;
        const modVersion = modVersionInput.value;
        const modDescription = modDescriptionInput.value || "A Minecraft mod created with AI";
        
        const blockName = blockNameInput.value || "Custom Block";
        const blockHardness = blockHardnessInput.value || 2.0;
        const blockResistance = blockResistanceInput.value || 6.0;
        
        // Convert names to appropriate formats
        const modClass = toCamelCase(modName) + "Mod";
        const blockRegistryName = toRegistryName(blockName);
        const blockClassName = toCamelCase(blockName).replace(/\s+/g, '');
        const blockConstant = toConstantCase(blockName);
        const blockDisplayName = blockName;
        
        // Create JSZip instance
        const zip = new JSZip();
        
        // Add build.gradle
        zip.file("build.gradle", `plugins {
    id 'fabric-loom' version '1.4-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:\${project.minecraft_version}"
    mappings "net.fabricmc:yarn:\${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:\${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:\${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

java {
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "\${it}_\${project.base.archivesName.get()}"}
    }
}`);
        
        // Add gradle.properties
        zip.file("gradle.properties", `org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# Fabric Properties
# check these on https://fabricmc.net/versions.html
minecraft_version=1.20.1
yarn_mappings=1.20.1+build.9
loader_version=0.14.21

# Mod Properties
mod_version = ${modVersion}
maven_group = com.example.${modId}
archives_base_name = ${modId}

# Dependencies
fabric_version=0.87.0+1.20.1`);
        
        // Add settings.gradle
        zip.file("settings.gradle", `pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}`);
        
        // Create directories
        const srcDir = zip.folder("src").folder("main");
        const javaDir = srcDir.folder("java").folder("com").folder("example").folder(modId);
        const resourcesDir = srcDir.folder("resources");
        const assetsDir = resourcesDir.folder("assets").folder(modId);
        const dataDir = resourcesDir.folder("data").folder(modId);
        
        // Add main mod class
        zip.file(`src/main/java/com/example/${modId}/${modClass}.java`, `package com.example.${modId};

import net.fabricmc.api.ModInitializer;
import net.minecraft.util.Identifier;
import net.minecraft.registry.Registries;
import net.minecraft.registry.Registry;
import net.minecraft.block.Block;
import net.minecraft.item.BlockItem;
import net.minecraft.item.Item;
import net.minecraft.item.ItemGroup;
import net.minecraft.util.Identifier;

public class ${modClass} implements ModInitializer {
    public static final String MOD_ID = "${modId}";
    public static final Block ${blockConstant} = new Block(Block.Settings.create().strength(${blockHardness}f, ${blockResistance}f));
    public static final Item ${blockConstant}_ITEM = new BlockItem(${blockConstant}, new Item.Settings());

    @Override
    public void onInitialize() {
        Registry.register(Registries.BLOCK, new Identifier(MOD_ID, "${blockRegistryName}"), ${blockConstant});
        Registry.register(Registries.ITEM, new Identifier(MOD_ID, "${blockRegistryName}"), ${blockConstant}_ITEM);
    }
}`);
        
        // Add fabric.mod.json
        zip.file("src/main/resources/fabric.mod.json", JSON.stringify({
          schemaVersion: 1,
          id: modId,
          version: modVersion,
          name: modName,
          description: modDescription,
          authors: [],
          contact: {},
          license: "CC0-1.0",
          environment: "*",
          entrypoints: {
            main: [`com.example.${modId}.${modClass}`]
          },
          mixins: [],
          depends: {
            fabricloader: ">=0.14.21",
            minecraft: "~1.20.1",
            java: ">=17"
          }
        }, null, 2));
        
        // Add blockstate
        zip.file(`src/main/resources/assets/${modId}/blockstates/${blockRegistryName}.json`, JSON.stringify({
          variants: {
            "": { model: `${modId}:block/${blockRegistryName}` }
          }
        }, null, 2));
        
        // Add block model
        zip.file(`src/main/resources/assets/${modId}/models/block/${blockRegistryName}.json`, JSON.stringify({
          parent: "minecraft:block/cube_all",
          textures: {
            all: `${modId}:block/${blockRegistryName}`
          }
        }, null, 2));
        
        // Add item model
        zip.file(`src/main/resources/assets/${modId}/models/item/${blockRegistryName}.json`, JSON.stringify({
          parent: `${modId}:block/${blockRegistryName}`
        }, null, 2));
        
        // Add language file
        zip.file(`src/main/resources/assets/${modId}/lang/en_us.json`, JSON.stringify({
          [`block.${modId}.${blockRegistryName}`]: blockDisplayName,
          [`item.${modId}.${blockRegistryName}`]: blockDisplayName
        }, null, 2));
        
        // Add loot table
        zip.file(`src/main/resources/data/${modId}/loot_tables/blocks/${blockRegistryName}.json`, JSON.stringify({
          type: "minecraft:block",
          pools: [
            {
              rolls: 1,
              entries: [
                {
                  type: "minecraft:item",
                  name: `${modId}:${blockRegistryName}`
                }
              ]
            }
          ]
        }, null, 2));
        
        // Add texture if available
        if (blockTextureData) {
          // Convert data URL to blob
          const response = await fetch(blockTextureData);
          const blob = await response.blob();
          zip.file(`src/main/resources/assets/${modId}/textures/block/${blockRegistryName}.png`, blob);
        } else {
          // Add placeholder texture
          const placeholderSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
            <rect width="16" height="16" fill="#FF5722"/>
            <text x="8" y="12" font-size="10" fill="white" text-anchor="middle">?</text>
          </svg>`;
          zip.file(`src/main/resources/assets/${modId}/textures/block/${blockRegistryName}.png`, placeholderSvg, {base64: true});
        }
        
        // Generate ZIP
        const content = await zip.generateAsync({type: "blob"});
        const url = URL.createObjectURL(content);
        
        // Show download
        statusEl.textContent = "Mod generated successfully!";
        downloadCtn.style.display = "block";
        downloadBtn.onclick = function() {
          const a = document.createElement('a');
          a.href = url;
          a.download = `${modId}-mod.zip`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
        };
      } catch (error) {
        statusEl.textContent = "Error generating mod: " + error.message;
      } finally {
        this.disabled = false;
        this.textContent = "Generate Mod";
      }
    });
  </script>
</div>
</body>
</html>
