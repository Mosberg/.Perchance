<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enhanced Character Visual Description Creator</title>
  </head>

  <body>
    <div class="character-creator">
      <h1>Enhanced Character Visual Description Creator</h1>

      <!-- Core Attributes Section -->
      <section class="attribute-section">
        <h2>Core Identity</h2>

        <!-- Name System -->
        <div class="input-group">
          <label>Name</label>
          <div class="name-controls">
            <input
              type="text"
              placeholder="First name"
              class="name-input"
              id="firstNameInput"
            />
            <input
              type="text"
              placeholder="Last name"
              class="name-input"
              id="lastNameInput"
            />
            <label class="random-toggle">
              <input type="checkbox" id="randomNameToggle" /> Randomize
            </label>
          </div>
        </div>

        <!-- Age System -->
        <div class="input-group">
          <label>Age</label>
          <div class="dual-input">
            <input
              type="number"
              min="0"
              max="120"
              placeholder="Years"
              id="ageInput"
            />
            <select class="life-stage" id="lifeStageSelect">
              <option value="infant">Infant</option>
              <option value="child">Child</option>
              <option value="teen">Teen</option>
              <option value="adult" selected>Adult</option>
              <option value="elderly">Elderly</option>
            </select>
          </div>
        </div>

        <!-- Body Framework -->
        <div class="input-group">
          <label>Gender Identity</label>
          <select class="gender-select" id="genderSelect">
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="trans">Transgender</option>
            <option value="other">Other/Non-binary</option>
          </select>
        </div>

        <div class="input-group">
          <label>Sexuality</label>
          <select class="sexuality-select" id="sexualitySelect">
            <option value="hetero">Heterosexual</option>
            <option value="homo">Homosexual</option>
            <option value="lesbian">Lesbian</option>
            <option value="bi">Bisexual</option>
            <option value="asexual">Asexual</option>
            <option value="queer">Queer</option>
            <option value="other">Other</option>
          </select>
        </div>

        <div class="input-group">
          <label>Physical Build</label>
          <div class="triple-input">
            <input
              type="number"
              min="50"
              max="250"
              placeholder="Height (cm)"
              id="heightInput"
            />
            <select class="build-select" id="buildSelect">
              <option value="slim">Slim</option>
              <option value="athletic">Athletic</option>
              <option value="average" selected>Average</option>
              <option value="overweight">Overweight</option>
              <option value="obese">Obese</option>
            </select>
            <input
              type="number"
              min="5"
              max="500"
              placeholder="Weight (kg)"
              id="weightInput"
            />
          </div>
        </div>

        <!-- Genital Toggle System -->
        <div class="input-group">
          <label class="genital-toggle">
            <input type="checkbox" id="genitalToggle" /> Include genital details
          </label>
          <div
            class="genital-details"
            id="genitalDetails"
            style="display: none"
          >
            <div class="genital-option">
              <label
                ><input type="radio" name="genitalType" value="penis" />
                Penis</label
              >
              <div class="dimension-inputs">
                <input
                  type="number"
                  min="1"
                  max="30"
                  placeholder="Length (cm)"
                  id="penisLengthInput"
                  disabled
                />
                <input
                  type="number"
                  min="1"
                  max="20"
                  placeholder="Girth (cm)"
                  id="penisGirthInput"
                  disabled
                />
              </div>
            </div>
            <div class="genital-option">
              <label
                ><input type="radio" name="genitalType" value="vagina" />
                Vagina</label
              >
            </div>
          </div>
        </div>
      </section>

      <!-- Appearance Section -->
      <section class="attribute-section">
        <h2>Appearance Details</h2>

        <!-- Skin System -->
        <div class="input-group">
          <label>Skin Tone</label>
          <div class="skin-selector">
            <div class="swatch-grid">
              <!-- 12 color swatches -->
              <div class="swatch" style="background: #f8d5c4"></div>
              <div class="swatch" style="background: #e3bc9a"></div>
              <div class="swatch" style="background: #d2a679"></div>
              <div class="swatch" style="background: #b78b61"></div>
              <div class="swatch" style="background: #a57650"></div>
              <div class="swatch" style="background: #8d614a"></div>
              <div class="swatch" style="background: #7d553f"></div>
              <div class="swatch" style="background: #6b4c39"></div>
              <div class="swatch" style="background: #5d4037"></div>
              <div class="swatch" style="background: #4e342e"></div>
              <div class="swatch" style="background: #3e2723"></div>
              <div class="swatch" style="background: #311f1d"></div>
            </div>
            <input
              type="text"
              placeholder="#HEX or RGB"
              class="custom-color"
              id="customColorInput"
            />
          </div>
        </div>

        <!-- Hair Matrix -->
        <div class="input-group">
          <label>Hair</label>
          <div class="hair-matrix">
            <select class="hair-style" id="hairStyleSelect">
              <option value="">Select hairstyle</option>
              <option>Straight</option>
              <option>Curly</option>
              <option>Braided</option>
              <option>Dreadlocks</option>
              <option>Bald</option>
            </select>
            <select class="facial-hair" id="facialHairSelect">
              <option value="">Facial hair</option>
              <option>Clean-shaven</option>
              <option>Stubble</option>
              <option>Goatee</option>
              <option>Full beard</option>
            </select>
            <select class="body-hair" id="bodyHairSelect">
              <option value="">Body hair level</option>
              <option>None</option>
              <option>Light</option>
              <option>Moderate</option>
              <option>Heavy</option>
            </select>
            <input
              type="text"
              placeholder="Hair color"
              class="hair-color"
              id="hairColorInput"
            />
          </div>
        </div>

        <!-- Eye Configuration -->
        <div class="input-group">
          <label>Eyes</label>
          <div class="eye-config">
            <input type="text" placeholder="Eye color" id="eyeColorInput" />
            <select class="eyewear" id="eyewearSelect">
              <option value="">Eyewear</option>
              <option>None</option>
              <option>Glasses</option>
              <option>Sunglasses</option>
              <option>Monocle</option>
              <option>Eyepatch</option>
            </select>
          </div>
        </div>

        <!-- New Appearance Features -->
        <div class="input-group">
          <label>Distinctive Features</label>
          <div class="feature-matrix">
            <select id="tattooSelect">
              <option value="">Tattoos</option>
              <option value="none">None</option>
              <option value="small">Small tattoo</option>
              <option value="medium">Medium tattoo</option>
              <option value="large">Large tattoo</option>
            </select>
            <select id="scarSelect">
              <option value="">Scars</option>
              <option value="none">None</option>
              <option value="small">Small scar</option>
              <option value="medium">Medium scar</option>
              <option value="large">Large scar</option>
            </select>
            <input
              type="text"
              placeholder="Other features"
              id="otherFeaturesInput"
            />
          </div>
        </div>
      </section>

      <!-- Personality & Background Section -->
      <section class="attribute-section">
        <h2>Personality & Background</h2>

        <div class="input-group">
          <label>Personality Traits</label>
          <div class="traits-grid" id="traitsGrid">
            <label><input type="checkbox" value="brave" /> Brave</label>
            <label><input type="checkbox" value="shy" /> Shy</label>
            <label
              ><input type="checkbox" value="intelligent" /> Intelligent</label
            >
            <label><input type="checkbox" value="funny" /> Funny</label>
            <label><input type="checkbox" value="serious" /> Serious</label>
            <label><input type="checkbox" value="kind" /> Kind</label>
            <label><input type="checkbox" value="arrogant" /> Arrogant</label>
            <label><input type="checkbox" value="loyal" /> Loyal</label>
            <label><input type="checkbox" value="reckless" /> Reckless</label>
            <label
              ><input type="checkbox" value="mysterious" /> Mysterious</label
            >
          </div>
        </div>

        <div class="input-group">
          <label>Background Story</label>
          <textarea
            placeholder="Character background and history..."
            id="backgroundTextarea"
            rows="4"
          ></textarea>
        </div>

        <div class="input-group">
          <label>Occupation</label>
          <input
            type="text"
            placeholder="Character's profession"
            id="occupationInput"
          />
        </div>
      </section>

      <!-- Action Buttons Section -->
      <section class="action-section">
        <button class="action-btn" id="randomizeBtn">Randomize All</button>
        <button class="action-btn" id="saveBtn">Save Character</button>
        <button class="action-btn" id="loadBtn">Load Character</button>
        <button class="action-btn" id="exportBtn">Export as JSON</button>
        <button class="action-btn" id="generateAvatarBtn">
          Generate Avatar
        </button>
      </section>

      <!-- Character Preview -->
      <section class="preview-section">
        <h2>Character Preview</h2>
        <div class="preview-area">
          <div class="preview-image-container">
            <img
              src="https://source.unsplash.com/random/?silhouette"
              alt="Character preview"
              id="previewImage"
            />
            <div
              class="loading-indicator"
              id="avatarLoadingIndicator"
              style="display: none"
            >
              Generating avatar...
            </div>
          </div>
          <div class="preview-details" id="previewDetails">
            <!-- Dynamically generated details -->
          </div>
        </div>
      </section>
    </div>

    <script>
      // Initialize DOM elements
      const genitalToggle = document.getElementById("genitalToggle");
      const genitalDetails = document.getElementById("genitalDetails");
      const randomNameToggle = document.getElementById("randomNameToggle");
      const randomizeBtn = document.getElementById("randomizeBtn");
      const saveBtn = document.getElementById("saveBtn");
      const loadBtn = document.getElementById("loadBtn");
      const exportBtn = document.getElementById("exportBtn");
      const generateAvatarBtn = document.getElementById("generateAvatarBtn");
      const previewDetails = document.getElementById("previewDetails");
      const avatarLoadingIndicator = document.getElementById(
        "avatarLoadingIndicator"
      );
      const previewImage = document.getElementById("previewImage");

      // Character data structure
      let characterData = {};

      // Initialize event listeners
      document.addEventListener("DOMContentLoaded", init);

      function init() {
        // Genital details toggle
        genitalToggle.addEventListener("change", function () {
          genitalDetails.style.display = this.checked ? "block" : "none";
        });

        // Enable penis dimension inputs
        document
          .querySelectorAll('input[name="genitalType"]')
          .forEach((radio) => {
            radio.addEventListener("change", function () {
              const inputs = this.closest(".genital-option").querySelectorAll(
                'input[type="number"]'
              );
              inputs.forEach(
                (input) => (input.disabled = this.value !== "penis")
              );
            });
          });

        // Skin color selection
        document.querySelectorAll(".swatch").forEach((swatch) => {
          swatch.addEventListener("click", function () {
            document.querySelector(".custom-color").value =
              this.style.backgroundColor;
            updatePreview();
          });
        });

        // Custom color input
        document
          .querySelector(".custom-color")
          .addEventListener("input", function () {
            const colorRegex = /^#([A-Fa-f0-9]{6}|[A-Fa-f0-9]{3})$/;
            if (colorRegex.test(this.value)) {
              this.style.backgroundColor = this.value;
              updatePreview();
            }
          });

        // Preview updates
        const allInputs = document.querySelectorAll("input, select, textarea");
        allInputs.forEach((input) => {
          input.addEventListener("change", updatePreview);
        });

        // Name randomization
        randomNameToggle.addEventListener("change", function () {
          if (this.checked) {
            generateRandomName();
          }
        });

        // Button event listeners
        randomizeBtn.addEventListener("click", randomizeAllCharacter);
        saveBtn.addEventListener("click", saveCharacter);
        loadBtn.addEventListener("click", loadCharacter);
        exportBtn.addEventListener("click", exportCharacterAsJSON);
        generateAvatarBtn.addEventListener("click", generateCharacterAvatar);

        // Initialize preview
        updatePreview();
      }

      function updatePreview() {
        // Get character data
        characterData = getCharacterData();

        // Clear previous preview
        previewDetails.innerHTML = "";

        // Create character name header
        const nameHeader = document.createElement("h3");
        nameHeader.textContent = `${characterData.name.first} ${characterData.name.last}`;
        previewDetails.appendChild(nameHeader);

        // Create core identity section
        const coreSection = createPreviewSection("Core Identity");
        addPreviewItem(
          coreSection,
          "Age",
          `${characterData.age} (${characterData.lifeStage})`
        );
        addPreviewItem(coreSection, "Gender", characterData.gender);
        addPreviewItem(coreSection, "Sexuality", characterData.sexuality);
        addPreviewItem(coreSection, "Build", characterData.build);
        addPreviewItem(coreSection, "Height", `${characterData.height} cm`);
        addPreviewItem(coreSection, "Weight", `${characterData.weight} kg`);

        // Add genital info if enabled
        if (
          characterData.genitalDetails.enabled &&
          characterData.genitalDetails.type
        ) {
          const genitalText =
            characterData.genitalDetails.type === "penis"
              ? `Penis: ${characterData.genitalDetails.penisLength || "?"}cm, ${
                  characterData.genitalDetails.penisGirth || "?"
                }cm`
              : "Vagina";
          addPreviewItem(coreSection, "Genitals", genitalText);
        }

        previewDetails.appendChild(coreSection);

        // Create appearance section
        const appearanceSection = createPreviewSection("Appearance");
        addPreviewItem(
          appearanceSection,
          "Skin Tone",
          characterData.appearance.skinTone || "?"
        );

        // Hair details
        const hairDetails =
          [
            characterData.appearance.hairStyle || "?",
            characterData.appearance.facialHair || "?",
            characterData.appearance.bodyHair || "?",
            characterData.appearance.hairColor || "?",
          ]
            .filter((item) => item !== "?")
            .join(", ") || "No hair details";
        addPreviewItem(appearanceSection, "Hair", hairDetails);

        addPreviewItem(
          appearanceSection,
          "Eyes",
          `${characterData.appearance.eyeColor || "?"} (${
            characterData.appearance.eyewear || "None"
          })`
        );

        // Distinctive features
        const features = [];
        if (
          characterData.appearance.tattoos &&
          characterData.appearance.tattoos !== "none"
        ) {
          features.push(`${characterData.appearance.tattoos} tattoos`);
        }
        if (
          characterData.appearance.scars &&
          characterData.appearance.scars !== "none"
        ) {
          features.push(`${characterData.appearance.scars} scars`);
        }
        if (characterData.appearance.otherFeatures) {
          features.push(characterData.appearance.otherFeatures);
        }
        if (features.length > 0) {
          addPreviewItem(appearanceSection, "Features", features.join(", "));
        }

        previewDetails.appendChild(appearanceSection);

        // Create personality section
        const personalitySection = createPreviewSection(
          "Personality & Background"
        );

        // Personality traits as tags
        if (characterData.personality.length > 0) {
          const traitsContainer = document.createElement("div");
          traitsContainer.className = "traits-container";

          characterData.personality.forEach((trait) => {
            const traitTag = document.createElement("span");
            traitTag.className = "trait-tag";
            traitTag.textContent = trait;
            traitsContainer.appendChild(traitTag);
          });

          addPreviewItem(personalitySection, "Traits", "", traitsContainer);
        } else {
          addPreviewItem(personalitySection, "Traits", "None selected");
        }

        addPreviewItem(
          personalitySection,
          "Occupation",
          characterData.occupation || "Unknown"
        );

        if (characterData.background) {
          const backgroundContainer = document.createElement("div");
          backgroundContainer.className = "background-container";
          backgroundContainer.textContent = characterData.background;
          addPreviewItem(
            personalitySection,
            "Background",
            "",
            backgroundContainer
          );
        }

        previewDetails.appendChild(personalitySection);
      }

      function createPreviewSection(title) {
        const section = document.createElement("div");
        section.className = "preview-section-content";

        const sectionTitle = document.createElement("h4");
        sectionTitle.textContent = title;
        section.appendChild(sectionTitle);

        return section;
      }

      function addPreviewItem(section, label, value, customElement) {
        const item = document.createElement("div");
        item.className = "preview-item";

        const labelEl = document.createElement("span");
        labelEl.className = "preview-label";
        labelEl.textContent = `${label}:`;
        item.appendChild(labelEl);

        if (customElement) {
          item.appendChild(customElement);
        } else {
          const valueEl = document.createElement("span");
          valueEl.className = "preview-value";
          valueEl.textContent = value;
          item.appendChild(valueEl);
        }

        section.appendChild(item);
      }

      function getCharacterData() {
        return {
          name: {
            first: document.getElementById("firstNameInput").value || "Unnamed",
            last: document.getElementById("lastNameInput").value || "",
          },
          age: document.getElementById("ageInput").value || "?",
          lifeStage: document.getElementById("lifeStageSelect").value,
          gender: document.getElementById("genderSelect").value,
          sexuality: document.getElementById("sexualitySelect").value,
          build: document.getElementById("buildSelect").value,
          height: document.getElementById("heightInput").value || "?",
          weight: document.getElementById("weightInput").value || "?",
          genitalDetails: {
            enabled: genitalToggle.checked,
            type:
              document.querySelector('input[name="genitalType"]:checked')
                ?.value || "",
            penisLength: document.getElementById("penisLengthInput").value,
            penisGirth: document.getElementById("penisGirthInput").value,
          },
          appearance: {
            skinTone: document.getElementById("customColorInput").value,
            hairStyle: document.getElementById("hairStyleSelect").value,
            facialHair: document.getElementById("facialHairSelect").value,
            bodyHair: document.getElementById("bodyHairSelect").value,
            hairColor: document.getElementById("hairColorInput").value,
            eyeColor: document.getElementById("eyeColorInput").value,
            eyewear: document.getElementById("eyewearSelect").value,
            tattoos: document.getElementById("tattooSelect").value,
            scars: document.getElementById("scarSelect").value,
            otherFeatures: document.getElementById("otherFeaturesInput").value,
          },
          personality: Array.from(
            document.querySelectorAll(
              '#traitsGrid input[type="checkbox"]:checked'
            )
          ).map((checkbox) => checkbox.value),
          occupation: document.getElementById("occupationInput").value,
          background: document.getElementById("backgroundTextarea").value,
        };
      }

      function generateRandomName() {
        const firstNames = [
          "Alex",
          "Jordan",
          "Taylor",
          "Casey",
          "Morgan",
          "Riley",
          "Avery",
          "Quinn",
          "Sage",
          "Rowan",
          "Emma",
          "Liam",
          "Olivia",
          "Noah",
          "Ava",
          "Ethan",
          "Sophia",
          "Mason",
          "Isabella",
          "William",
        ];
        const lastNames = [
          "Smith",
          "Johnson",
          "Williams",
          "Brown",
          "Jones",
          "Garcia",
          "Miller",
          "Davis",
          "Rodriguez",
          "Martinez",
          "Anderson",
          "Taylor",
          "Thomas",
          "Hernandez",
          "Moore",
          "Martin",
          "Jackson",
          "Thompson",
          "White",
          "Lopez",
        ];

        document.getElementById("firstNameInput").value =
          firstNames[Math.floor(Math.random() * firstNames.length)];
        document.getElementById("lastNameInput").value =
          lastNames[Math.floor(Math.random() * lastNames.length)];
        updatePreview();
      }

      function randomizeAllCharacter() {
        // Randomize name
        generateRandomName();

        // Randomize age
        const age = Math.floor(Math.random() * 80) + 10; // 10-90
        document.getElementById("ageInput").value = age;

        // Set life stage based on age
        let lifeStage = "adult";
        if (age < 5) lifeStage = "infant";
        else if (age < 13) lifeStage = "child";
        else if (age < 20) lifeStage = "teen";
        else if (age > 65) lifeStage = "elderly";
        document.getElementById("lifeStageSelect").value = lifeStage;

        // Randomize gender
        const genders = ["male", "female", "trans", "other"];
        document.getElementById("genderSelect").value =
          genders[Math.floor(Math.random() * genders.length)];

        // Randomize sexuality
        const sexualities = [
          "hetero",
          "homo",
          "lesbian",
          "bi",
          "asexual",
          "queer",
          "other",
        ];
        document.getElementById("sexualitySelect").value =
          sexualities[Math.floor(Math.random() * sexualities.length)];

        // Randomize build
        const builds = ["slim", "athletic", "average", "overweight", "obese"];
        document.getElementById("buildSelect").value =
          builds[Math.floor(Math.random() * builds.length)];

        // Randomize height and weight
        const height = Math.floor(Math.random() * 100) + 150; // 150-250cm
        const weight = Math.floor(Math.random() * 80) + 50; // 50-130kg
        document.getElementById("heightInput").value = height;
        document.getElementById("weightInput").value = weight;

        // Randomize appearance
        const hairStyles = [
          "",
          "Straight",
          "Curly",
          "Braided",
          "Dreadlocks",
          "Bald",
        ];
        document.getElementById("hairStyleSelect").value =
          hairStyles[Math.floor(Math.random() * hairStyles.length)];

        const facialHair = [
          "",
          "Clean-shaven",
          "Stumble",
          "Goatee",
          "Full beard",
        ];
        document.getElementById("facialHairSelect").value =
          facialHair[Math.floor(Math.random() * facialHair.length)];

        const bodyHair = ["", "None", "Light", "Moderate", "Heavy"];
        document.getElementById("bodyHairSelect").value =
          bodyHair[Math.floor(Math.random() * bodyHair.length)];

        const hairColors = [
          "Black",
          "Brown",
          "Blonde",
          "Red",
          "Gray",
          "White",
          "Blue",
          "Green",
          "Pink",
        ];
        document.getElementById("hairColorInput").value =
          hairColors[Math.floor(Math.random() * hairColors.length)];

        const eyeColors = [
          "Brown",
          "Blue",
          "Green",
          "Hazel",
          "Gray",
          "Amber",
          "Violet",
        ];
        document.getElementById("eyeColorInput").value =
          eyeColors[Math.floor(Math.random() * eyeColors.length)];

        const eyewear = [
          "",
          "None",
          "Glasses",
          "Sunglasses",
          "Monocle",
          "Eyepatch",
        ];
        document.getElementById("eyewearSelect").value =
          eyewear[Math.floor(Math.random() * eyewear.length)];

        const tattoos = ["", "none", "small", "medium", "large"];
        document.getElementById("tattooSelect").value =
          tattoos[Math.floor(Math.random() * tattoos.length)];

        const scars = ["", "none", "small", "medium", "large"];
        document.getElementById("scarSelect").value =
          scars[Math.floor(Math.random() * scars.length)];

        // Randomize skin tone
        const swatches = document.querySelectorAll(".swatch");
        const randomSwatch =
          swatches[Math.floor(Math.random() * swatches.length)];
        document.getElementById("customColorInput").value =
          randomSwatch.style.backgroundColor;

        // Randomize personality traits
        document
          .querySelectorAll('#traitsGrid input[type="checkbox"]')
          .forEach((checkbox) => {
            checkbox.checked = Math.random() > 0.7; // 30% chance to be selected
          });

        // Random occupation
        const occupations = [
          "Warrior",
          "Merchant",
          "Scholar",
          "Farmer",
          "Artist",
          "Healer",
          "Thief",
          "Noble",
          "Blacksmith",
          "Baker",
          "Doctor",
          "Engineer",
          "Teacher",
          "Pilot",
          "Scientist",
          "Writer",
        ];
        document.getElementById("occupationInput").value =
          occupations[Math.floor(Math.random() * occupations.length)];

        // Generate random background
        const backgrounds = [
          "Orphaned at a young age and raised by wolves.",
          "Former noble who lost everything in a war.",
          "Traveled the world seeking ancient knowledge.",
          "Escaped slavery and now fights for freedom.",
          "Descendant of a legendary hero.",
          "Accidentally gained magical powers.",
          "Exiled from their homeland for a crime they didn't commit.",
          "Searching for a lost sibling.",
          "Born into a wealthy family but rejected that life.",
          "Survivor of a natural disaster that destroyed their village.",
        ];
        document.getElementById("backgroundTextarea").value =
          backgrounds[Math.floor(Math.random() * backgrounds.length)];

        updatePreview();
      }

      function saveCharacter() {
        // Get character data
        const data = getCharacterData();

        // Save to localStorage
        localStorage.savedCharacter = JSON.stringify(data);

        // Visual confirmation
        saveBtn.textContent = "Saved!";
        saveBtn.style.backgroundColor = "#4caf50";

        setTimeout(() => {
          saveBtn.textContent = "Save Character";
          saveBtn.style.backgroundColor = "";
        }, 2000);
      }

      function loadCharacter() {
        if (!localStorage.savedCharacter) {
          alert("No saved character found!");
          return;
        }

        const data = JSON.parse(localStorage.savedCharacter);

        // Load core attributes
        document.getElementById("firstNameInput").value = data.name.first || "";
        document.getElementById("lastNameInput").value = data.name.last || "";
        document.getElementById("ageInput").value = data.age || "";
        document.getElementById("lifeStageSelect").value =
          data.lifeStage || "adult";
        document.getElementById("genderSelect").value = data.gender || "male";
        document.getElementById("sexualitySelect").value =
          data.sexuality || "hetero";
        document.getElementById("buildSelect").value = data.build || "average";
        document.getElementById("heightInput").value = data.height || "";
        document.getElementById("weightInput").value = data.weight || "";

        // Load genital details
        genitalToggle.checked = data.genitalDetails.enabled || false;
        genitalDetails.style.display = genitalToggle.checked ? "block" : "none";

        if (data.genitalDetails.type) {
          document.querySelector(
            `input[name="genitalType"][value="${data.genitalDetails.type}"]`
          ).checked = true;
          document.getElementById("penisLengthInput").value =
            data.genitalDetails.penisLength || "";
          document.getElementById("penisGirthInput").value =
            data.genitalDetails.penisGirth || "";

          // Enable inputs if penis is selected
          document
            .querySelectorAll('input[name="genitalType"]')
            .forEach((radio) => {
              const inputs = radio
                .closest(".genital-option")
                .querySelectorAll('input[type="number"]');
              inputs.forEach((input) => {
                input.disabled = radio.value !== "penis";
              });
            });
        }

        // Load appearance
        document.getElementById("customColorInput").value =
          data.appearance.skinTone || "";
        document.getElementById("hairStyleSelect").value =
          data.appearance.hairStyle || "";
        document.getElementById("facialHairSelect").value =
          data.appearance.facialHair || "";
        document.getElementById("bodyHairSelect").value =
          data.appearance.bodyHair || "";
        document.getElementById("hairColorInput").value =
          data.appearance.hairColor || "";
        document.getElementById("eyeColorInput").value =
          data.appearance.eyeColor || "";
        document.getElementById("eyewearSelect").value =
          data.appearance.eyewear || "";
        document.getElementById("tattooSelect").value =
          data.appearance.tattoos || "";
        document.getElementById("scarSelect").value =
          data.appearance.scars || "";
        document.getElementById("otherFeaturesInput").value =
          data.appearance.otherFeatures || "";

        // Load personality
        document
          .querySelectorAll('#traitsGrid input[type="checkbox"]')
          .forEach((checkbox) => {
            checkbox.checked = data.personality.includes(checkbox.value);
          });

        // Load background
        document.getElementById("occupationInput").value =
          data.occupation || "";
        document.getElementById("backgroundTextarea").value =
          data.background || "";

        updatePreview();

        // Visual confirmation
        loadBtn.textContent = "Loaded!";
        loadBtn.style.backgroundColor = "#2196f3";

        setTimeout(() => {
          loadBtn.textContent = "Load Character";
          loadBtn.style.backgroundColor = "";
        }, 2000);
      }

      function exportCharacterAsJSON() {
        // Get character data
        const data = getCharacterData();

        // Convert to JSON
        const jsonString = JSON.stringify(data, null, 2);

        // Create a blob
        const blob = new Blob([jsonString], { type: "application/json" });

        // Create download link
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `character_${data.name.first}_${data.name.last}.json`;
        document.body.appendChild(a);
        a.click();

        // Clean up
        setTimeout(() => {
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, 0);

        // Visual confirmation
        exportBtn.textContent = "Exported!";
        exportBtn.style.backgroundColor = "#8bc34a";

        setTimeout(() => {
          exportBtn.textContent = "Export as JSON";
          exportBtn.style.backgroundColor = "";
        }, 2000);
      }

      async function generateCharacterAvatar() {
        avatarLoadingIndicator.style.display = "block";

        // Get character details for the prompt
        const firstName = characterData.name.first || "Character";
        const gender = characterData.gender || "person";
        const build = characterData.build || "average";
        const hairStyle = characterData.appearance.hairStyle || "short hair";
        const hairColor = characterData.appearance.hairColor || "brown";
        const eyeColor = characterData.appearance.eyeColor || "brown";
        const skinTone = characterData.appearance.skinTone || "light";
        const distinctiveFeatures = [];

        if (
          characterData.appearance.tattoos !== "none" &&
          characterData.appearance.tattoos !== ""
        ) {
          distinctiveFeatures.push(
            `with ${characterData.appearance.tattoos} tattoos`
          );
        }

        if (
          characterData.appearance.scars !== "none" &&
          characterData.appearance.scars !== ""
        ) {
          distinctiveFeatures.push(
            `with ${characterData.appearance.scars} scars`
          );
        }

        if (
          characterData.appearance.eyewear !== "None" &&
          characterData.appearance.eyewear !== ""
        ) {
          distinctiveFeatures.push(
            `wearing ${characterData.appearance.eyewear}`
          );
        }

        const featuresText = distinctiveFeatures.length
          ? distinctiveFeatures.join(", ")
          : "no distinctive features";

        const prompt = `Portrait of ${firstName}, a ${gender} with ${build} build, ${hairStyle} ${hairColor} hair, ${eyeColor} eyes, ${skinTone} skin, ${featuresText}, highly detailed, digital art, fantasy character design, sharp focus`;

        try {
          const dataUrl = await root.generateImage(prompt);
          previewImage.src = dataUrl;
        } catch (error) {
          console.error("Error generating avatar:", error);
          alert("Failed to generate avatar. Please try again.");
        } finally {
          avatarLoadingIndicator.style.display = "none";
        }
      }
    </script>
