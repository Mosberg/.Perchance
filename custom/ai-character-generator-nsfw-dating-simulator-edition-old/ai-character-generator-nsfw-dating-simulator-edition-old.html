      generateBtn.disabled = true;
      if (stopBtn) stopBtn.style.display = "";

      // wait for image to finish generating
      while (!imageCtn.querySelector("iframe")?.textToImagePluginOutput) {
        await new Promise((r) => setTimeout(r, 1000));

      const charInstructionEl = imageCtn.querySelector(".char-description-instruction");
      const nameOutputEl = imageCtn.querySelector(".character-name-output");
      const descriptionOutputEl = imageCtn.querySelector(".character-description-output");
      const textToImagePluginOutput = imageCtn.querySelector("iframe").textToImagePluginOutput;

      const extraInstruction = (charInstructionEl?.value || "").trim();
      const imagePrompt = textToImagePluginOutput?.inputs?.prompt || "";

      nameOutputEl.value = "";
      descriptionOutputEl.value = "";

      const aiText = window.aiTextPlugin || window.aiText || window.root?.aiTextPlugin;
      if (typeof aiText !== "function") {

        generateBtn.disabled = false;

          const personality = (find("Personality") || "").split("\n").slice(1).join("\n").trim() || "";
          const behavior = (find("Roleplay") || "").split("\n").slice(1).join("\n").trim() || "";

  const OLD_SLUG = "ai-character-chat";
  function rewriteUrlString(s) {
    if (typeof s !== "string") return s;
    // only rewrite perchance.org/<OLD_SLUG> (hash or query forms)
    return s.replace(
      new RegExp("https?://perchance\\.org/" + OLD_SLUG.replace(/\./g, "\\.") + "(?=[#?]|$)", "g"),
      "https://perchance.org/" + TARGET_SLUG

  function rewriteInputsIn(root) {
    root.querySelectorAll('input, textarea, a').forEach((el) => {
      if (el.value && el.value.indexOf(OLD_SLUG) !== -1) el.value = rewriteUrlString(el.value);
