<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>dexie-plugin — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Custom Dexie Plugin</title>
</head>
<body style="text-align:left; padding:2rem; font-family:system-ui, sans-serif;">

  <h2>Custom Dexie Plugin</h2>
  <p>Simulates Dexie using KV namespaces + JSON arrays.</p>

  <button onclick="runDemo()" style="padding:0.5rem 1rem; cursor:pointer;">Run Demo</button>
  <pre id="outputEl" style="background:#f5f5f5; padding:1rem; border-radius:4px; min-height:2rem; white-space:pre-wrap;"></pre>

  <script>
    // ─────────────────────────────────────────────
    //  CUSTOM DEXIE PLUGIN (Perchance-Native)
    // ─────────────────────────────────────────────

    let dexie = {
      async init(db, store) {
        let key = db + "_" + store;
        await kv.dexie_meta.set(key, []);
      },

      async put(db, store, value) {
        let key = db + "_" + store;
        let arr = await kv.dexie_meta.get(key) || [];
        arr.push(value);
        await kv.dexie_meta.set(key, arr);
      },

      async getAll(db, store) {
        let key = db + "_" + store;
        let existing = await kv.dexie_meta.get(key);
        return existing || [];
      },

      async clear(db, store) {
        let key = db + "_" + store;
        await kv.dexie_meta.set(key, []);
      }
    };

    async function runDemo() {
      outputEl.textContent = "Running...";
      await dexie.init("testDb", "testStore");
      await dexie.put("testDb", "testStore", {id: 1, name: "Alice"});
      await dexie.put("testDb", "testStore", {id: 2, name: "Bob"});
      let all = await dexie.getAll("testDb", "testStore");
      outputEl.textContent = "getAll result:\n" + JSON.stringify(all, null, 2);
    }
  </script>

</body>
</html>
</body>
</html>
