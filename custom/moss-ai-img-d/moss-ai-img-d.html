<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>moss-ai-img-d — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<div id="appCtn" style="font-family:sans-serif; max-width:1200px; margin:0 auto; padding:10px; text-align:left;">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
    <h1 style="margin:0;">Visionary Architect</h1>
    <div>
      <button onclick="toggleTheme()" style="padding:6px 12px;">Theme</button>
      <button onclick="clearGallery()" style="padding:6px 12px; margin-left:5px;">Clear Gallery</button>
    </div>
  </div>

  <div id="mainLayoutEl" style="display:flex; gap:15px; flex-wrap:wrap;">
    <div id="sidebarEl" style="flex:1; min-width:280px; max-width:350px;">
      <div style="border:1px solid #ccc; border-radius:8px; padding:12px; margin-bottom:15px;">
        <h3 style="margin-top:0;">Prompt Builder</h3>
        <textarea id="promptInput" placeholder="Enter prompt..." style="width:100%; height:80px; resize:vertical;"></textarea>
        <div style="margin-top:8px;">
          <button onclick="randomPrompt()" style="width:100%; padding:8px;">Random Prompt</button>
        </div>
        <div id="promptWeightsCtn" style="margin-top:10px;">
          <label>Style Weight: <input type="range" id="styleWeight" min="0" max="2" step="0.1" value="1" style="width:100px;"></label><br>
          <label>Subject Weight: <input type="range" id="subjWeight" min="0" max="2" step="0.1" value="1" style="width:100px;"></label>
        </div>
        <div style="margin-top:8px;">
          <label>Negative Prompt:</label>
          <textarea id="negPromptInput" placeholder="Enter negative prompt..." style="width:100%; height:60px; resize:vertical;"></textarea>
        </div>
      </div>

      <div style="border:1px solid #ccc; border-radius:8px; padding:12px; margin-bottom:15px;">
        <h3 style="margin-top:0;">Prompt Enhancer</h3>
        <select id="enhanceMode" style="width:100%; margin-bottom:8px;">
          <option value="enhance">Enhance</option>
          <option value="rewrite">Rewrite</option>
          <option value="detail">Detail Boost</option>
          <option value="cinematic">Cinematic</option>
          <option value="photo">Photographic</option>
        </select>
        <label>Length: <input type="range" id="enhanceLen" min="50" max="300" value="150" style="width:100px;"></label>
        <div style="margin-top:8px;">
          <button onclick="enhancePrompt()" style="width:48%;">Preview</button>
          <button onclick="applyEnhance()" style="width:48%;">Apply</button>
        </div>
        <div id="enhancePreviewEl" style="margin-top:8px; padding:8px; background:#f5f5f5; border-radius:4px; font-size:0.9em; white-space:pre-wrap;"></div>
      </div>

      <div style="border:1px solid #ccc; border-radius:8px; padding:12px; margin-bottom:15px;">
        <h3 style="margin-top:0;">Text-to-Image</h3>
        <label>Model:</label>
        <select id="modelSelect" style="width:100%; margin-bottom:5px;">
          <option value="default">Default</option>
          <option value="anime">Anime</option>
          <option value="realistic">Realistic</option>
        </select>
        <label>Resolution:</label>
        <select id="resSelect" style="width:100%; margin-bottom:5px;">
          <option value="512x512">512x512</option>
          <option value="512x768">512x768</option>
          <option value="768x512">768x512</option>
          <option value="768x768">768x768</option>
        </select>
        <label>Steps: <input type="number" id="stepsInput" value="25" min="1" max="100" style="width:60px;"></label><br>
        <label>CFG: <input type="number" id="cfgInput" value="7.5" step="0.5" style="width:60px;"></label><br>
        <label>Sampler:</label>
        <select id="samplerSelect" style="width:100%; margin-bottom:5px;">
          <option value="euler">Euler</option>
          <option value="euler_a">Euler a</option>
          <option value="dpm++">DPM++</option>
        </select>
        <label>Seed: <input type="number" id="seedInput" value="-1" style="width:80px;"></label>
        <div style="margin-top:8px;">
          <label><input type="checkbox" id="faceFixChk"> Face Fix</label><br>
          <label><input type="checkbox" id="upscaleChk"> Upscale</label><br>
          <label><input type="checkbox" id="safetyChk" checked> Safety</label>
        </div>
      </div>

      <button id="generateBtn" onclick="generate()" style="width:100%; padding:12px; font-size:1.1em; font-weight:bold; background:#4a90e2; color:white; border:none; border-radius:6px; cursor:pointer;">Generate</button>
      <div id="loadingEl" hidden style="text-align:center; margin-top:8px; color:#666;">Generating... ⏳</div>
    </div>

    <div id="galleryCtn" style="flex:2; min-width:300px;">
      <div id="galleryGrid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); gap:15px;"></div>
      <div id="emptyGalleryEl" style="text-align:center; color:#999; margin-top:40px;">No images generated yet.</div>
    </div>
  </div>
</div>

<style>
  body.dark { background:#1a1a1a; color:#e0e0e0; }
  body.dark #appCtn { color:#e0e0e0; }
  body.dark div[style*="border:1px solid #ccc"] { border-color:#444 !important; }
  body.dark #enhancePreviewEl { background:#2a2a2a !important; color:#e0e0e0; }
  body.dark #galleryGrid > div { background:#2a2a2a; }
  img { max-width:100%; border-radius:4px; display:block; }
  button { cursor:pointer; }
  .meta { font-size:0.8em; color:#888; margin-top:4px; }
  body.dark .meta { color:#aaa; }
</style>

<script>
  let gallery = [];
  let currentEnhanced = null;
  let isGenerating = false;

  let subjects = ["a cyberpunk samurai", "an ancient forest spirit", "a steampunk airship", "a neon cityscape", "a floating crystal castle", "a biomechanical dragon", "a lunar garden", "a quantum phoenix"];
  let styles = ["digital painting", "oil on canvas", "watercolor", "3D render", "pixel art", "ink illustration", "cinematic concept art", "surrealist collage"];
  let moods = ["ethereal", "ominous", "serene", "chaotic", "melancholic", "vibrant", "mysterious", "majestic"];
  let lights = ["golden hour", "bioluminescent", "neon backlight", "moonlit", "dramatic chiaroscuro", "soft ambient", "harsh midday", "foggy dawn"];
  let details = ["hyper-detailed", "minimalist", "ornate", "weathered textures", "smooth gradients", "rough brushstrokes", "intricate patterns", "volumetric fog"];

  function weightedRandom(arr, weight) {
    if (weight <= 0) return "";
    let count = Math.ceil(weight);
    let picks = [];
    for (let i = 0; i < count; i++) picks.push(arr[Math.floor(Math.random() * arr.length)]);
    return [...new Set(picks)].join(", ");
  }

  function randomPrompt() {
    let sw = parseFloat(styleWeight.value);
    let nw = parseFloat(subjWeight.value);
    let parts = [];
    let subj = weightedRandom(subjects, nw);
    if (subj) parts.push(subj);
    let style = weightedRandom(styles, sw);
    if (style) parts.push(style);
    parts.push(moods[Math.floor(Math.random() * moods.length)]);
    parts.push(lights[Math.floor(Math.random() * lights.length)]);
    parts.push(details[Math.floor(Math.random() * details.length)]);
    promptInput.value = parts.join(", ");
  }

  async function enhancePrompt() {
    if (!promptInput.value.trim()) return;
    enhancePreviewEl.textContent = "Thinking...";
    let mode = enhanceMode.value;
    let len = enhanceLen.value;
    let safe = promptInput.value.replace(/"/g, "'"); // sanitize quotes to avoid malformed payloads
    let instruction = `Take this image prompt and ${mode} it to be roughly ${len} characters, keeping it as a single comma-separated prompt. Original prompt: ${safe}`;
    try {
      let text = await generateText(instruction);
      currentEnhanced = text.trim();
      enhancePreviewEl.textContent = currentEnhanced;
    } catch (e) {
      console.error(e);
      enhancePreviewEl.textContent = "Error enhancing.";
    }
  }

  function applyEnhance() {
    if (currentEnhanced) {
      promptInput.value = currentEnhanced;
      enhancePreviewEl.textContent = "Applied.";
    }
  }

  async function generate() {
    if (isGenerating) return;
    let prompt = promptInput.value.trim();
    if (!prompt) { alert("Enter a prompt"); return; }
    isGenerating = true;
    loadingEl.hidden = false;
    generateBtn.disabled = true;
    generateBtn.textContent = "Generating...";
    try {
      let res = resSelect.value || "512x512";
      let dataUrl = await generateImage(prompt, {resolution: res});
      let meta = {
        id: Date.now(),
        url: dataUrl,
        prompt: prompt,
        negative: negPromptInput.value,
        model: modelSelect.value,
        resolution: res,
        steps: stepsInput.value,
        cfg: cfgInput.value,
        sampler: samplerSelect.value,
        seed: seedInput.value,
        faceFix: faceFixChk.checked,
        upscale: upscaleChk.checked,
        safety: safetyChk.checked,
        time: new Date().toLocaleString()
      };
      gallery.unshift(meta);
      saveGallery();
      renderGallery();
      emptyGalleryEl.hidden = true;
    } catch (e) {
      console.error(e);
      alert("Image generation failed. Please try again.");
    } finally {
      isGenerating = false;
      loadingEl.hidden = true;
      generateBtn.disabled = false;
      generateBtn.textContent = "Generate";
    }
  }

  function renderGallery() {
    galleryGrid.innerHTML = "";
    gallery.forEach(item => {
      let card = document.createElement("div");
      card.style.cssText = "border:1px solid #ccc; border-radius:8px; padding:10px; background:#fff;";
      card.innerHTML = `
        <img src="${item.url}" style="width:100%; height:200px; object-fit:cover; margin-bottom:8px;">
        <div style="font-size:0.85em; margin-bottom:5px; word-break:break-word;"><b>Prompt:</b> ${item.prompt}</div>
        <div class="meta">Model: ${item.model} | Res: ${item.resolution} | Steps: ${item.steps} | CFG: ${item.cfg}</div>
        <div class="meta">Sampler: ${item.sampler} | Seed: ${item.seed} | ${item.time}</div>
        <div style="margin-top:8px; display:flex; gap:5px;">
          <button onclick="downloadImg(${item.id})">Download</button>
          <button onclick="copyPrompt(${item.id})">Copy Prompt</button>
          <button onclick="deleteImg(${item.id})">Delete</button>
        </div>
      `;
      galleryGrid.appendChild(card);
    });
    emptyGalleryEl.hidden = gallery.length > 0;
  }

  function downloadImg(id) {
    let item = gallery.find(i => i.id === id);
    if (!item) return;
    let a = document.createElement("a");
    a.href = item.url;
    a.download = `visionary-${id}.png`;
    a.click();
  }

  function copyPrompt(id) {
    let item = gallery.find(i => i.id === id);
    if (!item) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(item.prompt).catch(() => {});
    } else {
      let ta = document.createElement("textarea");
      ta.value = item.prompt;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
    }
  }

  function deleteImg(id) {
    gallery = gallery.filter(i => i.id !== id);
    saveGallery();
    renderGallery();
  }

  function clearGallery() {
    if (confirm("Clear all images?")) {
      gallery = [];
      saveGallery();
      renderGallery();
    }
  }

  function saveGallery() {
    try { localStorage.visionaryGallery = JSON.stringify(gallery); } catch (e) {}
  }

  function loadGallery() {
    try {
      let data = localStorage.visionaryGallery;
      if (data) {
        gallery = JSON.parse(data);
        renderGallery();
      }
    } catch (e) { console.error(e); }
  }

  function toggleTheme() {
    document.body.classList.toggle("dark");
    localStorage.visionaryTheme = document.body.classList.contains("dark") ? "dark" : "light";
  }

  function loadTheme() {
    if (localStorage.visionaryTheme === "dark") document.body.classList.add("dark");
  }

  loadTheme();
  loadGallery();
</script>
</body>
</html>
