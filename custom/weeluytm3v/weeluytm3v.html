<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>weeluytm3v — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<h1>[title]</h1>
<p style="opacity:0.5; margin-bottom:1.7em;">[subtitle]</p>

<main>
	<section>
		<div id="recipeNameEl" style="font-size:28px; font-weight:bold; color:#333; margin-bottom:0.3em;"></div>
		<div id="resultsEl" style="font-size:[fontSize]%; color:[fontColor]; margin:0; min-height:1em; line-height:1.3;"></div>
		<div style="margin-top:1em;">
			<button onclick="roll();">[buttonText]</button>
			<input type="text" id="countInput" placeholder="how many?" style="text-align:center; width: 7em;" />
			<label style="display:inline-block;">&nbsp;<input type="checkbox" id="uniqueCheckbox" style="vertical-align:middle;" /> unique?</label>
			<button onclick="toggleRecipeMode();" id="recipeBtn" style="margin-left:0.5em;">recipe mode</button>
		</div>
	</section>
	<section style="text-align:left; padding: 0.75em 1.5em;">
		[description]
		<p style="text-align:center; font-size:12px; opacity:0.4; margin-top:1em;">inspired in part by <a href="https://perchance.org/3fxozemhlj" target="_blank" style="color:inherit;">Casper's Hub</a> 🕯️</p>
	</section>
	<p style="text-align:center; font-size:200%; opacity:0.2; margin-top:0.5em;"><span>⚄&#xFE0E;</span></p>
	<br/>
</main>

<style>
	main {
		max-width:750px;
		margin:0 auto;
	}
	section {
		background:#fff;
		padding:1em;
		border-radius:3px;
		box-shadow: 0 0.5px 0 0 #ffffff inset, 0 1px 2px 0 #B3B3B3;
		margin-top:1em;
	}
	body {
		background-color:#f6f6f6;
	}
	.edibility-bar {
		font-size:14px;
		margin-top:4px;
		margin-bottom:6px;
		opacity:0.85;
	}
	.edibility-label {
		display:inline-block;
		width:95px;
		font-weight:bold;
	}
	.edibility-track {
		display:inline-block;
		width:120px;
		height:8px;
		background:#ddd;
		border-radius:4px;
		vertical-align:middle;
		overflow:hidden;
	}
	.edibility-fill {
		height:100%;
		border-radius:4px;
	}
	.edibility-score {
		margin-left:6px;
		color:#999;
	}
</style>

<script>
var recipeMode = false;

function edibilityLabel(score) {
	if (score <= 2) return {label: "\u2620 inedible", color: "#e74c3c"};
	if (score <= 5) return {label: "? questionable", color: "#f39c12"};
	if (score <= 7) return {label: "\u2713 edible", color: "#2ecc71"};
	return {label: "\u2605 delicious!", color: "#27ae60"};
}

function edibilityBar(score) {
	var info = edibilityLabel(score);
	return '<div class="edibility-bar">' +
		'<span class="edibility-label" style="color:' + info.color + ';">' + info.label + '</span>' +
		'<div class="edibility-track">' +
			'<div class="edibility-fill" style="width:' + (score * 10) + '%; background:' + info.color + ';"></div>' +
		'</div>' +
		'<span class="edibility-score">' + score + '/10</span>' +
	'</div>';
}

function getWords(count, unique) {
	var items;
	if (unique) {
		items = root.word.selectUnique(count);
	} else {
		items = root.word.selectMany(count);
	}
	if (!Array.isArray(items)) items = [items];
	return items.map(function(i) {
		return i.evaluateItem !== undefined ? i.evaluateItem : String(i);
	});
}

function buildItemsHtml(words) {
	return words.map(function(w) {
		var score = root.edibilityOf(w);
		return w + edibilityBar(score);
	}).join("<br/>");
}

function roll() {
	if (recipeMode) {
		rollRecipe();
		return;
	}
	recipeNameEl.style.display = "none";
	recipeNameEl.innerHTML = "";
	var count = Number(countInput.value) || 1;
	if (count < 1) count = 1;
	var unique = uniqueCheckbox.checked;
	var words = getWords(count, unique);
	resultsEl.innerHTML = buildItemsHtml(words);
}

function rollRecipe() {
	var words = getWords(3, true);
	var name = root.recipeName(words[0], words[1], words[2]);
	recipeNameEl.style.display = "block";
	recipeNameEl.textContent = name;
	resultsEl.innerHTML = buildItemsHtml(words);
}

function toggleRecipeMode() {
	recipeMode = !recipeMode;
	if (recipeMode) {
		recipeBtn.textContent = "exit recipe mode";
		countInput.disabled = true;
		uniqueCheckbox.disabled = true;
		rollRecipe();
	} else {
		recipeBtn.textContent = "recipe mode";
		countInput.disabled = false;
		uniqueCheckbox.disabled = false;
		recipeNameEl.style.display = "none";
		roll();
	}
}

countInput.addEventListener("input", function() {
	var n = Number(this.value);
	if (this.value === "0" || this.value === "" || isNaN(n)) n = 1;
	if (!recipeMode) roll();
});

setTimeout(roll, 200);
</script>

</body>
</html>
