<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />

<title>RuneScape Lite V2</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:'Courier New',monospace;user-select:none}

  .item-slot{background:#333;border:1px solid #555;position:relative;cursor:pointer;aspect-ratio:1;display:flex;align-items:center;justify-content:center}

  .craft-recipe{display:flex;justify-content:space-between;align-items:center;background:#2a2a2a;padding:4px;border:1px solid #444;cursor:pointer;font-size:11px}

  @keyframes floatUp{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-50px)}}
  ::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:#111}::-webkit-scrollbar-thumb{background:#555}

<div id="gameContainerEl">

  </div>
  <button id="resetGameBtnHiddenEl" hidden>Reset</button>
</div>
<script type="module">

const defaultSkill=()=>({lvl:1,xp:0})
const ITEMS={log:{id:'log',name:'Logs',color:'#8B4513',type:'resource'},oaklog:{id:'oaklog',name:'Oak Logs',color:'#6b4c2a',type:'resource',level:15},willowlog:{id:'willowlog',name:'Willow Logs',color:'#8f6a38',type:'resource',level:30},ore:{id:'ore',name:'Copper Ore',color:'#B87333',type:'resource'},tin_ore:{id:'tin_ore',name:'Tin Ore',color:'#71797E',type:'resource'},iron_ore:{id:'iron_ore',name:'Iron Ore',color:'#9aa0a6',type:'resource',level:15},coal:{id:'coal',name:'Coal',color:'#333',type:'resource',level:20},bronze_bar:{id:'bronze_bar',name:'Bronze Bar',color:'#cd7f32',type:'resource'},steel_bar:{id:'steel_bar',name:'Steel Bar',color:'#b0b7c3',type:'resource',level:30},bones:{id:'bones',name:'Bones',color:'#F0F0F0',type:'resource'},tinderbox:{id:'tinderbox',name:'Tinderbox',color:'#8B0000',type:'tool'},raw_fish:{id:'raw_fish',name:'Raw Trout',color:'#88aabb',type:'consumable'},cooked_fish:{id:'cooked_fish',name:'Trout',color:'#d68e65',type:'food',heal:5},raw_salmon:{id:'raw_salmon',name:'Raw Salmon',color:'#d9a',type:'consumable',level:20},cooked_salmon:{id:'cooked_salmon',name:'Salmon',color:'#e1a17c',type:'food',heal:8},bronze_sword:{id:'bronze_sword',name:'Bronze Sword',color:'#CD7F32',type:'weapon',bonus:{attack:2,strength:1},req:{attack:1}},iron_sword:{id:'iron_sword',name:'Iron Sword',color:'#9aa0a6',type:'weapon',bonus:{attack:4,strength:2},req:{attack:10}},bronze_shield:{id:'bronze_shield',name:'Bronze Shield',color:'#CD7F32',type:'shield',bonus:{defence:1}},bronze_axe:{id:'bronze_axe',name:'Bronze Axe',color:'#CD7F32',type:'tool',bonus:1,tool:'woodcutting',req:{woodcutting:1}},bronze_pickaxe:{id:'bronze_pickaxe',name:'Bronze Pickaxe',color:'#CD7F32',type:'tool',bonus:1,tool:'mining',req:{mining:1}},bronze_hammer:{id:'bronze_hammer',name:'Bronze Hammer',color:'#CD7F32',type:'tool',bonus:1,tool:'smithing',req:{smithing:1}},air_rune:{id:'air_rune',name:'Air Rune',color:'#dfeaff',type:'rune'},mind_rune:{id:'mind_rune',name:'Mind Rune',color:'#b0d',type:'rune'}}
const RECIPES=[{name:'Bronze Bar',req:{ore:1,tin_ore:1},out:'bronze_bar',xp:25,skill:'smithing',station:'anvil'},{name:'Steel Bar',req:{iron_ore:1,coal:1},out:'steel_bar',xp:70,skill:'smithing',station:'anvil'},{name:'Bronze Sword',req:{bronze_bar:2,bronze_hammer:1},out:'bronze_sword',xp:50,skill:'smithing'},{name:'Bonfire',req:{tinderbox:1,log:1},out:'fire_action',xp:10,skill:'firemaking'},{name:'Cook Trout',req:{raw_fish:1},out:'cooked_fish',xp:30,skill:'cooking',station:'fire'},{name:'Cook Salmon',req:{raw_salmon:1},out:'cooked_salmon',xp:45,skill:'cooking',station:'fire'}]
const STATE={player:{x:0,z:0,hp:10,maxHp:10,energy:100,target:null,pendingAction:null,action:'idle',equipment:{mainhand:null,offhand:null}},skills:Object.fromEntries(SKILL_NAMES.map(s=>[s,defaultSkill()])),inventory:['tinderbox','bronze_axe','bronze_pickaxe','bronze_hammer','bronze_sword','bronze_shield','raw_fish','raw_salmon'],bank:[],quest:null,settings:{music:true,sfx:true,showGrid:true,showDamage:true,autoSave:true,musicVol:0.2,sfxVol:0.5,uiScale:1},entities:[],pathQueue:[],dayTime:0,particles:[],dead:false}
const defaultQuest=()=>({title:'',desc:'',objective:'',completed:false,reward:{xp:{},items:[]}})
function safeClone(o){return JSON.parse(JSON.stringify(o))}
function loadState(){try{const s=localStorage.getItem(SAVE_KEY);if(!s)return;const d=JSON.parse(s);if(d&&d.STATE){Object.assign(STATE,d.STATE);for(const k of SKILL_NAMES)STATE.skills[k]??=defaultSkill();STATE.player.equipment??={mainhand:null,offhand:null};STATE.settings??={music:true,sfx:true,showGrid:true,showDamage:true,autoSave:true,musicVol:0.2,sfxVol:0.5,uiScale:1};STATE.quest??=null;Object.assign(STATE.settings,d.STATE?.settings||{})}}catch(e){console.warn(e)}}
function saveGame(){try{localStorage.setItem(SAVE_KEY,JSON.stringify({STATE,CONFIG_VERSION:2}))}catch(e){console.warn('save failed',e)}}
loadState()
const container=document.getElementById('gameContainerEl')
const loadingScreen=document.getElementById('loadingScreenEl')
const uiLayer=document.getElementById('uiLayerEl')
const loadingBar=document.getElementById('loadingBarEl')
const loadingText=document.getElementById('loadingTextEl')
const scene=new THREE.Scene();scene.background=new THREE.Color(0x111111);scene.fog=new THREE.Fog(0x111111,20,80)
const aspect=()=>container.clientWidth/container.clientHeight
let zoom=20
const camera=new THREE.OrthographicCamera(-zoom*aspect(),zoom*aspect(),zoom,-zoom,1,1000)
camera.position.set(20,20,20);camera.lookAt(0,0,0)
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(container.clientWidth,container.clientHeight);renderer.shadowMap.enabled=true;container.appendChild(renderer.domElement)
const ambientLight=new THREE.AmbientLight(0xffffff,.5);scene.add(ambientLight)
const dirLight=new THREE.DirectionalLight(0xffffff,.7);dirLight.position.set(50,100,50);scene.add(dirLight)
const raycaster=new THREE.Raycaster();const mouse=new THREE.Vector2();let targetPos=new THREE.Vector3(0,0.5,0);let isDragging=false;let previousMousePosition={x:0,y:0};let isShiftDown=false
let audioCtx=null
function ensureAudio(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)()}
function createTexture(colorStr){const canvas=document.createElement('canvas');canvas.width=64;canvas.height=64;const ctx=canvas.getContext('2d');ctx.fillStyle=colorStr;ctx.fillRect(0,0,64,64);for(let i=0;i<200;i++){ctx.fillStyle=`rgba(255,255,255,${Math.random()*0.08})`;ctx.fillRect(Math.random()*64,Math.random()*64,2,2)}const tex=new THREE.CanvasTexture(canvas);tex.magFilter=THREE.NearestFilter;return tex}
const mats={grass:new THREE.MeshLambertMaterial({map:createTexture('#3b4d25')}),water:new THREE.MeshLambertMaterial({map:createTexture('#2e4c7b'),transparent:true,opacity:.9}),tree:new THREE.MeshLambertMaterial({map:createTexture('#2a3b15')}),rock:new THREE.MeshLambertMaterial({map:createTexture('#6e6e6e')}),player:new THREE.MeshLambertMaterial({color:CONFIG.colors.player}),goblin:new THREE.MeshLambertMaterial({color:CONFIG.colors.goblin}),bank:new THREE.MeshLambertMaterial({color:CONFIG.colors.bank}),fire:new THREE.MeshBasicMaterial({color:CONFIG.colors.fire}),sage:new THREE.MeshLambertMaterial({color:CONFIG.colors.sage}),water2:new THREE.MeshLambertMaterial({color:CONFIG.colors.water})}
const noise2D=createNoise2D();const grid=[];const entities=[];const entityGroup=new THREE.Group();scene.add(entityGroup)
const groundGeo=new THREE.BoxGeometry(CONFIG.cellSize,1,CONFIG.cellSize);const instancedMesh=new THREE.InstancedMesh(groundGeo,mats.grass,CONFIG.worldSize*CONFIG.worldSize);instancedMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(instancedMesh)
const playerMesh=new THREE.Group();const pBody=new THREE.Mesh(new THREE.BoxGeometry(1,1.8,1),mats.player);pBody.position.y=.9;playerMesh.add(pBody);scene.add(playerMesh)
const marker=new THREE.Mesh(new THREE.RingGeometry(.4,.5,32),new THREE.MeshBasicMaterial({color:CONFIG.colors.select,side:THREE.DoubleSide}));marker.rotation.x=-Math.PI/2;marker.position.y=.05;marker.visible=false;scene.add(marker)
const waterPlane=new THREE.Mesh(new THREE.PlaneGeometry(CONFIG.worldSize*CONFIG.cellSize,CONFIG.worldSize*CONFIG.cellSize),mats.water2);waterPlane.rotation.x=-Math.PI/2;waterPlane.position.set((CONFIG.worldSize*CONFIG.cellSize)/2,-.49,(CONFIG.worldSize*CONFIG.cellSize)/2);scene.add(waterPlane)
function getTileType(x,z){const v=noise2D(x*.08,z*.08);if(v<-0.25)return 1;return 0}
function findPath(sx,sz,ex,ez){const q=[{x:sx,z:sz,p:[]}],vis=new Set([`${sx},${sz}`]);while(q.length){const n=q.shift();if(n.x===ex&&n.z===ez)return n.p;for(const d of[[1,0],[-1,0],[0,1],[0,-1]]){const x=n.x+d[0],z=n.z+d[1];if(x<0||z<0||x>=CONFIG.worldSize||z>=CONFIG.worldSize)continue;if(grid[x][z]===1)continue;const blocked=entities.some(e=>e.userData.blocking&&e.userData.gridX===x&&e.userData.gridZ===z&&e.visible);if(blocked)continue;const key=`${x},${z}`;if(vis.has(key))continue;vis.add(key);q.push({x,z,p:[...n.p,{x,z}]})}}return null}
function makeEntity(gx,gz,type){const g=new THREE.Group();let blocking=true;if(type==='tree'){const trunk=new THREE.Mesh(new THREE.BoxGeometry(.5,1,.5),new THREE.MeshLambertMaterial({color:0x5C4033}));trunk.position.y=.5;const leaves=new THREE.Mesh(new THREE.ConeGeometry(1.2,2,8),mats.tree);leaves.position.y=2;g.add(trunk,leaves)}else if(type==='rock'){g.add(new THREE.Mesh(new THREE.DodecahedronGeometry(.8),mats.rock))}else if(type==='goblin'){g.add(new THREE.Mesh(new THREE.CapsuleGeometry(.4,1,4,8),mats.goblin));const eye=new THREE.Mesh(new THREE.BoxGeometry(.1,.1,.1),new THREE.MeshBasicMaterial({color:0xffff00}));eye.position.set(.2,1.2,.3);g.add(eye)}else if(type==='bank'){g.add(new THREE.Mesh(new THREE.BoxGeometry(1.5,1.5,1),mats.bank))}else if(type==='fire'){blocking=false;const base=new THREE.Mesh(new THREE.CircleGeometry(.6),new THREE.MeshBasicMaterial({color:0x000000}));base.rotation.x=-Math.PI/2;base.position.y=.05;const flames=new THREE.Mesh(new THREE.ConeGeometry(.4,.8,4),mats.fire);flames.position.y=.4;g.add(base,flames);g.userData.tick=()=>{flames.scale.y=1+Math.sin(Date.now()/100)*.2}}else if(type==='sage'){g.add(new THREE.Mesh(new THREE.CylinderGeometry(.3,.3,1.8,8),mats.sage));const hat=new THREE.Mesh(new THREE.ConeGeometry(.5,.8,8),new THREE.MeshLambertMaterial({color:0xffffff}));hat.position.y=2;g.add(hat)}else if(type==='anvil'){g.add(new THREE.Mesh(new THREE.BoxGeometry(1.2,.7,.9),new THREE.MeshLambertMaterial({color:0x555555})));blocking=true}
 g.position.set(gx*CONFIG.cellSize,0,gz*CONFIG.cellSize);g.userData={type,gridX:gx,gridZ:gz,id:Math.random().toString(36).slice(2,11),hp:type==='goblin'?12:999,maxHp:type==='goblin'?12:999,state:'idle',blocking,respawnAt:0};entityGroup.add(g);entities.push(g);return g}
function createWorld(){for(let x=0;x<CONFIG.worldSize;x++){grid[x]=[];for(let z=0;z<CONFIG.worldSize;z++){grid[x][z]=getTileType(x,z);const d=new THREE.Object3D();d.position.set(x*CONFIG.cellSize,-.5,z*CONFIG.cellSize);d.updateMatrix();instancedMesh.setMatrixAt(x*CONFIG.worldSize+z,d.matrix);if(grid[x][z]===0){const r=Math.random();if(r<.08)makeEntity(x,z,'tree');else if(r<.12)makeEntity(x,z,'rock');else if(r<.14)makeEntity(x,z,'goblin');else if(r<.145)makeEntity(x,z,'bank');else if(r<.15)makeEntity(x,z,'anvil');else if(r<.155)makeEntity(x,z,'sage')}}}instancedMesh.instanceMatrix.needsUpdate=true}

let ambientOsc=null,ambientGain=null
function startAmbient(){ensureAudio();if(!STATE.settings.music||ambientOsc)return;if(audioCtx.state==='suspended')audioCtx.resume();ambientOsc=audioCtx.createOscillator();ambientGain=audioCtx.createGain();ambientOsc.type='sine';ambientOsc.frequency.setValueAtTime(50,audioCtx.currentTime);const lfo=audioCtx.createOscillator();lfo.frequency.value=.1;const lfoGain=audioCtx.createGain();lfoGain.gain.value=500;lfo.connect(lfoGain);lfoGain.connect(ambientOsc.frequency);ambientGain.gain.value=STATE.settings.musicVol*.05;ambientOsc.connect(ambientGain);ambientGain.connect(audioCtx.destination);ambientOsc.start();lfo.start();STATE._ambient={lfo,lfoGain}}
function stopAmbient(){try{ambientOsc?.stop();STATE._ambient?.lfo?.stop()}catch{}ambientOsc=null;ambientGain=null;STATE._ambient=null}
function playSound(type){if(!STATE.settings.sfx)return;ensureAudio();if(audioCtx.state==='suspended')audioCtx.resume();const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.connect(gain);gain.connect(audioCtx.destination);const now=audioCtx.currentTime; if(type==='click'){osc.type='square';osc.frequency.setValueAtTime(800,now);osc.frequency.exponentialRampToValueAtTime(300,now+.1);gain.gain.setValueAtTime(STATE.settings.sfxVol*.12,now);gain.gain.exponentialRampToValueAtTime(0.001,now+.1);osc.start(now);osc.stop(now+.1)}else if(type==='chop'||type==='mine'){osc.type='sawtooth';osc.frequency.setValueAtTime(120,now);gain.gain.setValueAtTime(STATE.settings.sfxVol*.1,now);gain.gain.linearRampToValueAtTime(0,now+.1);osc.start(now);osc.stop(now+.1)}else if(type==='levelup'){osc.type='sine';osc.frequency.setValueAtTime(400,now);osc.frequency.linearRampToValueAtTime(800,now+.5);gain.gain.setValueAtTime(STATE.settings.sfxVol*.15,now);gain.gain.linearRampToValueAtTime(0,now+1.5);osc.start(now);osc.stop(now+1.5)}else if(type==='splash'){osc.type='triangle';osc.frequency.setValueAtTime(220,now);osc.frequency.linearRampToValueAtTime(90,now+.2);gain.gain.setValueAtTime(STATE.settings.sfxVol*.1,now);gain.gain.linearRampToValueAtTime(0,now+.3);osc.start(now);osc.stop(now+.3)}else if(type==='hit'){osc.type='square';osc.frequency.setValueAtTime(180,now);gain.gain.setValueAtTime(STATE.settings.sfxVol*.08,now);gain.gain.linearRampToValueAtTime(0,now+.08);osc.start(now);osc.stop(now+.08)} }
function safeLvl(s){return Math.max(1,Math.floor(Math.pow((s.xp||0)/100,1/3))+1)}
function updateSkillUI(){for(const k of SKILL_NAMES)STATE.skills[k].lvl=safeLvl(STATE.skills[k])}
function addChat(msg,color='#ffff00'){const d=document.createElement('div');d.style.color=color;d.textContent=msg;const h=document.getElementById('chatHistoryEl');h.appendChild(d);h.scrollTop=h.scrollHeight}
function addXpDrop(text,x,z,type='xp'){if(!STATE.settings.showDamage)return;const d=document.createElement('div');d.className=type==='damage'?'xp-drop damage-drop':'xp-drop';d.textContent=text;const v=new THREE.Vector3(x,2,z);v.project(camera);d.style.left=((v.x*.5+.5)*container.clientWidth)+'px';d.style.top=((-(v.y*.5)+.5)*container.clientHeight)+'px';document.getElementById('xpDropsCtn').appendChild(d);setTimeout(()=>d.remove(),2000)}
function updateStatsUI(){updateSkillUI();const lines=document.getElementById('statLinesEl');const order=['attack','strength','defence','woodcutting','mining','fishing','cooking','smithing','firemaking','agility','prayer'];lines.innerHTML=order.map(k=>`<div style="display:flex;justify-content:space-between"><span>${k[0].toUpperCase()+k.slice(1)}:</span><span>${STATE.skills[k].lvl}/${STATE.skills[k].lvl}</span></div>`).join('')+`<div style="display:flex;justify-content:space-between;margin-top:5px;color:#ff0000"><span>HP:</span><span>${STATE.player.hp}/${STATE.player.maxHp}</span></div>`;document.getElementById('wieldedItemEl').textContent=STATE.player.equipment.mainhand?ITEMS[STATE.player.equipment.mainhand]?.name||STATE.player.equipment.mainhand:'Nothing';document.getElementById('runModeStatusEl').textContent=isShiftDown?'ON':'OFF';document.getElementById('runEnergyEl').textContent=Math.max(0,Math.floor(STATE.player.energy));document.getElementById('questTitleEl').textContent=STATE.quest?.title||'None';document.getElementById('questDescEl').textContent=STATE.quest?.desc||'Find the Sage NPC to get a quest.';document.getElementById('questProgressEl').textContent=STATE.quest?`${STATE.quest.completed?'Completed':'Active'} • ${STATE.quest.objective||''}`:''}
function addXp(skill,amount){if(!STATE.skills[skill])STATE.skills[skill]=defaultSkill();const before=safeLvl(STATE.skills[skill]);STATE.skills[skill].xp+=Math.max(0,amount*CONFIG.gameplay.xpRate);const after=safeLvl(STATE.skills[skill]);if(after>before){STATE.skills[skill].lvl=after;addChat(`Congratulations! Your ${skill} level is now ${after}.`,'#00ff00');playSound('levelup')}addXpDrop(`+${amount} XP`,playerMesh.position.x,playerMesh.position.z);updateStatsUI();if(STATE.settings.autoSave)saveGame()}
function addToInventory(itemId,sourceBank=false){const arr=sourceBank?STATE.bank:STATE.inventory;const lim=sourceBank?CONFIG.maxBank:CONFIG.maxInventory;if(arr.length>=lim){addChat(sourceBank?'Bank full!':'Inventory full!','red');return false}arr.push(itemId);if(!sourceBank)updateInventoryUI();else updateBankUI();if(!sourceBank)addChat(`You get some ${ITEMS[itemId]?.name||itemId}.`);if(STATE.settings.autoSave)saveGame();return true}
function removeFromInventory(index,sourceBank=false){const arr=sourceBank?STATE.bank:STATE.inventory;if(index>=0&&index<arr.length)arr.splice(index,1);if(!sourceBank)updateInventoryUI();else updateBankUI();if(STATE.settings.autoSave)saveGame()}
function hasItem(id){return STATE.inventory.includes(id)}
function invCount(id){return STATE.inventory.filter(i=>i===id).length}
function spendItems(req){for(const [id,count] of Object.entries(req)){if(invCount(id)<count)return false}for(const [id,count] of Object.entries(req))for(let i=0;i<count;i++){const idx=STATE.inventory.indexOf(id);if(idx>-1)removeFromInventory(idx)}return true}
function equipItem(idx){const id=STATE.inventory[idx];const item=ITEMS[id];if(!item)return; if(item.type==='weapon'){const old=STATE.player.equipment.mainhand;STATE.player.equipment.mainhand=id;removeFromInventory(idx);if(old)addToInventory(old);addChat(`You wield the ${item.name}.`,'#aaa')} else if(item.type==='shield'){const old=STATE.player.equipment.offhand;STATE.player.equipment.offhand=id;removeFromInventory(idx);if(old)addToInventory(old);addChat(`You equip the ${item.name}.`,'#aaa')} updateInventoryUI();updateStatsUI()}
function useFood(idx){const id=STATE.inventory[idx],item=ITEMS[id];if(!item?.heal)return; if(STATE.player.hp>=STATE.player.maxHp){addChat('You are not hungry.','red');return}STATE.player.hp=Math.min(STATE.player.maxHp,STATE.player.hp+item.heal);removeFromInventory(idx);addChat(`You eat the ${item.name}.`,'#ccc');playSound('click');updateStatsUI()}
function handleInventoryClick(idx){const id=STATE.inventory[idx],item=ITEMS[id];if(!item)return;if(item.type==='food')return useFood(idx);if(item.type==='weapon'||item.type==='shield')return equipItem(idx);if(item.type==='tool'&&id==='tinderbox'){addChat('Use the tinderbox from the context menu or a fire recipe.','#aaa');return} if(confirm(`Drop ${item.name}?`)){removeFromInventory(idx);addChat(`Dropped ${item.name}.`,'#aaa')}}
function updateInventoryUI(){const grid=document.getElementById('inventoryGridEl');grid.innerHTML='';STATE.inventory.forEach((id,idx)=>{const item=ITEMS[id];if(!item)return;const div=document.createElement('div');div.className='item-slot';div.title=item.name;const icon=document.createElement('div');icon.className='item-icon';icon.style.backgroundColor=item.color;div.appendChild(icon);div.onclick=()=>handleInventoryClick(idx);grid.appendChild(div)});updateEquipmentUI();updateCraftingUI()}
function updateEquipmentUI(){const w=document.getElementById('equipSlotWeaponEl');const s=document.getElementById('equipSlotShieldEl');w.innerHTML='';s.innerHTML='';if(STATE.player.equipment.mainhand){const item=ITEMS[STATE.player.equipment.mainhand];const d=document.createElement('div');d.style.width='80%';d.style.height='80%';d.style.background=item.color;w.appendChild(d)}if(STATE.player.equipment.offhand){const item=ITEMS[STATE.player.equipment.offhand];const d=document.createElement('div');d.style.width='80%';d.style.height='80%';d.style.background=item.color;s.appendChild(d)}}
function updateBankUI(){const grid=document.getElementById('bankGridEl');const q=(document.getElementById('bankSearchEl').value||'').toLowerCase();grid.innerHTML='';STATE.bank.forEach((id,idx)=>{const item=ITEMS[id];if(!item)return;if(q&&!(item.name.toLowerCase().includes(q)||id.includes(q)))return;const div=document.createElement('div');div.className='item-slot';div.title=item.name;const icon=document.createElement('div');icon.className='item-icon';icon.style.backgroundColor=item.color;div.appendChild(icon);div.onclick=()=>{removeFromInventory(idx,true);addToInventory(id,false)};grid.appendChild(div)})}
function updateCraftingUI(){const list=document.getElementById('craftListEl');list.innerHTML='';RECIPES.forEach((r,idx)=>{const can=Object.entries(r.req).every(([id,c])=>invCount(id)>=c);const div=document.createElement('div');div.className='craft-recipe';div.innerHTML=`<span>${r.name}<span style="font-size:9px;color:#aaa;display:block">${Object.entries(r.req).map(([id,c])=>`${c} ${ITEMS[id]?.name||id}`).join(', ')} ${r.skill?`(${r.skill} XP)`:''}</span></span><button ${can?'':'disabled style="opacity:.5"'}>Craft</button>`;div.querySelector('button').onclick=()=>craftItem(idx);list.appendChild(div)})}
function craftItem(idx){const r=RECIPES[idx];if(!spendItems(r.req))return addChat('You lack the materials.','red');if(r.out==='fire_action'){const gx=Math.round(playerMesh.position.x/CONFIG.cellSize),gz=Math.round(playerMesh.position.z/CONFIG.cellSize);if(!entities.some(e=>e.userData.gridX===gx&&e.userData.gridZ===gz&&e.userData.type==='fire'&&e.visible))makeEntity(gx,gz,'fire');addChat('You light a fire.','#aaa')}else addToInventory(r.out);if(r.skill)addXp(r.skill,r.xp||0);playSound('click');updateCraftingUI()}
function startAction(actionType,targetData){const sx=Math.round(playerMesh.position.x/CONFIG.cellSize),sz=Math.round(playerMesh.position.z/CONFIG.cellSize);const path=findPath(sx,sz,targetData.gridX,targetData.gridZ);STATE.player.pendingAction=actionType;STATE.player.target=targetData;STATE.player.action=path&&path.length>0?'walking_to_action':actionType;STATE.pathQueue=path||[];playSound('click')}
function showContextMenu(x,y,data){const menu=document.getElementById('contextMenuEl');menu.innerHTML='';menu.style.left=x+'px';menu.style.top=y+'px';menu.hidden=false;const add=(txt,fn)=>{const d=document.createElement('div');d.textContent=txt;d.style.padding='4px 10px';d.style.cursor='pointer';d.onmouseover=()=>d.style.background='#fff';d.onmouseout=()=>d.style.background='transparent';d.onclick=()=>{fn();menu.hidden=true};menu.appendChild(d)};if(data.type==='tree')add('Chop down',()=>startAction('woodcutting',data));if(data.type==='rock')add('Mine',()=>startAction('mining',data));if(data.type==='goblin')add('Attack',()=>startAction('attack',data));if(data.type==='bank')add('Use Bank',()=>openBank());if(data.type==='fire'){if(hasItem('raw_fish')||hasItem('raw_salmon'))add('Cook food',()=>startAction('cooking',data));else add('Add logs',()=>startAction('firemaking',data))}if(data.type==='sage')add('Talk to Sage',()=>interactSage(data));if(data.type==='anvil')add('Smith here',()=>openCraftTab());if(hasItem('tinderbox'))add('Light Fire',()=>{const gx=Math.round(playerMesh.position.x/CONFIG.cellSize),gz=Math.round(playerMesh.position.z/CONFIG.cellSize);if(!entities.some(e=>e.userData.gridX===gx&&e.userData.gridZ===gz&&e.userData.type==='fire'&&e.visible)){makeEntity(gx,gz,'fire');removeFromInventory(STATE.inventory.indexOf('tinderbox'));addChat('You light a fire.','#aaa')}})}
function hideContextMenu(){document.getElementById('contextMenuEl').hidden=true}
function handleEntityClick(entity){if(entity.userData.type==='tree')startAction('woodcutting',entity.userData);else if(entity.userData.type==='rock')startAction('mining',entity.userData);else if(entity.userData.type==='goblin')startAction('attack',entity.userData);else if(entity.userData.type==='bank')openBank();else if(entity.userData.type==='sage')interactSage(entity.userData);else if(entity.userData.type==='anvil')openCraftTab()}
function openBank(){document.querySelector('.tabBtn[data-target="bank"]').click()}
function openCraftTab(){document.querySelector('.tabBtn[data-target="craft"]').click()}
async function interactSage(){if(STATE.quest&&!STATE.quest.completed){addChat(`Sage: You are already on a quest: ${STATE.quest.title}`,'#ffff00');return}if(STATE.quest?.completed){addChat('Sage: You have completed my quest. Well done!','#00ff00');return}addChat('Sage: Consulting the stars for a task...','#aaa');let title='Lost Relic',desc='Find 3 logs and 3 ores, then return to the Sage.',objective='Collect 3 Logs and 3 Ore.';try{if(ROOT.generateText){const response=await ROOT.generateText('Generate a short RuneScape-style quest title and objective for a low-level player. Format exactly: Title: ... Objective: ...');const parts=response.split('Objective:');if(parts.length>=2){title=parts[0].replace('Title:','').trim()||title;desc=parts[1].trim()||desc;objective=desc}}}catch{}STATE.quest={title,desc,objective,completed:false,reward:{xp:{attack:50,woodcutting:25},items:['air_rune','mind_rune','bronze_sword']}};addChat(`Sage: Ah! ${title}`,'#00ffff');updateStatsUI();saveGame()}
function completeQuest(){if(!STATE.quest||STATE.quest.completed)return addChat('No active quest.','red');const needLogs=invCount('log')>=3,needOre=invCount('ore')+invCount('tin_ore')>=3;if(!needLogs||!needOre)return addChat('You have not met the quest requirements yet.','red');let logs=3;for(let i=STATE.inventory.length-1;i>=0&&logs>0;i--)if(STATE.inventory[i]==='log'){removeFromInventory(i);logs--}let oreCount=3;for(let i=STATE.inventory.length-1;i>=0&&oreCount>0;i--)if(['ore','tin_ore'].includes(STATE.inventory[i])){removeFromInventory(i);oreCount--}STATE.quest.completed=true;for(const [k,v] of Object.entries(STATE.quest.reward.xp))addXp(k,v);STATE.quest.reward.items.forEach(addToInventory);addChat(`Quest complete: ${STATE.quest.title}`,'#00ff00');saveGame();updateStatsUI()}
function performActionTick(){const target=STATE.player.target;if(!target){STATE.player.action='idle';return}const entity=entities.find(e=>e.userData.id===target.id&&e.visible);if(!entity&&target.type!=='fire'){STATE.player.action='idle';return}if(STATE.player.action==='woodcutting'){playSound('chop');spawnParticles(playerMesh.position,0x8B4513);addXp('woodcutting',25);if(Math.random()<.8)addToInventory(Math.random()<.1?'oaklog':'log');if(Math.random()<.18&&entity)respawnEntity(entity,'tree')}else if(STATE.player.action==='mining'){playSound('mine');spawnParticles(playerMesh.position,0x6e6e6e);addXp('mining',35);if(Math.random()<.65)addToInventory(Math.random()<.15?'iron_ore':Math.random()<.5?'ore':'tin_ore');if(Math.random()<.12&&entity)respawnEntity(entity,'rock')}else if(STATE.player.action==='attack'){if(!entity){STATE.player.action='idle';return}const att=STATE.skills.attack.lvl,str=STATE.skills.strength.lvl,def=STATE.skills.defence.lvl;const weapon=STATE.player.equipment.mainhand?ITEMS[STATE.player.equipment.mainhand]:null;const bonus=(weapon?.bonus?.attack||weapon?.bonus||0);const maxHit=Math.max(1,Math.floor((str+bonus)/2));const acc=Math.min(.95,.55+.02*(att+bonus-def*.15));if(Math.random()<acc){const dmg=Math.max(1,Math.floor(Math.random()*maxHit)+1);entity.userData.hp-=dmg;addXpDrop(`-${dmg}`,entity.position.x,entity.position.z,'damage');addXp('attack',4);addXp('strength',4);playSound('hit');try{if(entity.children[0]?.material?.color)entity.children[0].material.color.setHex(0xff0000)}catch{}setTimeout(()=>{try{if(entity.children[0]?.material?.color)entity.children[0].material.color.setHex(CONFIG.colors.goblin)}catch{}},120);if(entity.userData.hp<=0){addChat('You defeat the goblin!','#00ff00');addToInventory('bones');addXp('attack',30);addXp('strength',20);respawnEntity(entity,'goblin')}}else playSound('hit')}else if(STATE.player.action==='fishing'){playSound('splash');spawnParticles(playerMesh.position,0x2e4c7b);addXp('fishing',20);addToInventory(Math.random()<.5?'raw_fish':'raw_salmon');if(Math.random()<.25)addChat('You catch a fish.','#ccc')}else if(STATE.player.action==='cooking'){const raw=hasItem('raw_fish')?'raw_fish':hasItem('raw_salmon')?'raw_salmon':null;if(!raw){STATE.player.action='idle';return}const idx=STATE.inventory.indexOf(raw);removeFromInventory(idx);const success=Math.random()<.88;addXp('cooking',30);if(success){addToInventory(raw==='raw_fish'?'cooked_fish':'cooked_salmon');addChat('You successfully cook the fish.','#ccc')}else addChat('You burn the fish.','red')}else if(STATE.player.action==='firemaking'){addXp('firemaking',10);if(entity)respawnEntity(entity,'fire');addChat('The fire burns brightly.','#ccc')}STATE.player.action='idle';updateStatsUI();updateInventoryUI();updateBankUI();updateCraftingUI();if(STATE.settings.autoSave)saveGame()}
function respawnEntity(entity,type){entity.userData.respawnAt=performance.now()+CONFIG.autoRespawnMs;entity.visible=false;entity.userData.deadType=type;entity.userData.state='dead';entity.userData.type=type}
function processRespawns(){for(const e of entities){if(e.userData.state==='dead'&&performance.now()>=e.userData.respawnAt){e.visible=true;e.userData.state='idle';e.userData.hp=e.userData.maxHp}}}
function spawnParticles(pos,color){for(let i=0;i<5;i++){const geo=new THREE.BoxGeometry(.2,.2,.2);const mat=new THREE.MeshBasicMaterial({color});const mesh=new THREE.Mesh(geo,mat);mesh.position.copy(pos);mesh.position.x+=(Math.random()-.5);mesh.position.z+=(Math.random()-.5);mesh.position.y+=.5;const vel={x:(Math.random()-.5)*5,y:Math.random()*5,z:(Math.random()-.5)*5};scene.add(mesh);STATE.particles.push({mesh,vel,life:1})}}
function updateParticles(dt){for(let i=STATE.particles.length-1;i>=0;i--){const p=STATE.particles[i];p.life-=dt;p.mesh.position.x+=p.vel.x*dt;p.mesh.position.y+=p.vel.y*dt;p.mesh.position.z+=p.vel.z*dt;p.vel.y-=9.8*dt;p.mesh.rotation.x+=dt*5;if(p.life<=0||p.mesh.position.y<0){scene.remove(p.mesh);STATE.particles.splice(i,1)}}}
function updateDayNight(dt){STATE.dayTime+=dt;const cycle=(Math.sin(STATE.dayTime/CONFIG.dayDuration*Math.PI*2)+1)/2;const angle=cycle*Math.PI;dirLight.position.set(Math.cos(angle)*50,Math.sin(angle)*50,50);dirLight.intensity=.2+cycle*.8;ambientLight.intensity=.1+cycle*.4;const r=0x11+(0x3b-0x11)*cycle,g=0x11+(0x4d-0x11)*cycle,b=0x11+(0x25-0x11)*cycle;scene.background.setRGB(r/255,g/255,b/255);scene.fog.color.setRGB(r/255,g/255,b/255)}
function drawMinimap(){const cvs=document.getElementById('minimapCanvasEl'),ctx=cvs.getContext('2d'),scale=3;ctx.fillStyle='#000';ctx.fillRect(0,0,cvs.width,cvs.height);const px=Math.round(playerMesh.position.x/CONFIG.cellSize),pz=Math.round(playerMesh.position.z/CONFIG.cellSize),radius=25;for(let x=px-radius;x<=px+radius;x++)for(let z=pz-radius;z<=pz+radius;z++){if(x<0||z<0||x>=CONFIG.worldSize||z>=CONFIG.worldSize)continue;ctx.fillStyle=grid[x][z]===1?'#2e4c7b':'#3b4d25';ctx.fillRect((x-px+radius)*scale,(z-pz+radius)*scale,scale,scale);const ent=entities.find(e=>e.visible&&e.userData.gridX===x&&e.userData.gridZ===z);if(ent){ctx.fillStyle=ent.userData.type==='goblin'?'#0f0':ent.userData.type==='bank'?'#8b5':ent.userData.type==='sage'?'#44f':ent.userData.type==='fire'?'#fa0':'#fff';ctx.fillRect((x-px+radius)*scale,(z-pz+radius)*scale,scale,scale)}}ctx.fillStyle='#f00';ctx.fillRect(cvs.width/2-2,cvs.height/2-2,4,4)}
function handleDeath(){STATE.dead=true;STATE.player.hp=STATE.player.maxHp;STATE.player.energy=100;playerMesh.position.set(0,0,0);STATE.pathQueue=[];STATE.player.action='idle';STATE.player.pendingAction=null;STATE.player.target=null;STATE.inventory=STATE.inventory.slice(Math.floor(STATE.inventory.length*CONFIG.gameplay.deathPenalty));addChat('Oh dear, you are dead!','red');updateInventoryUI();updateStatsUI();saveGame();setTimeout(()=>{STATE.dead=false},2000)}
function updateCombatAI(dt){for(const ent of entities){if(!ent.visible)continue;if(ent.userData.type==='goblin'){const dist=playerMesh.position.distanceTo(ent.position);if(dist<CONFIG.aggroRange){ent.userData.state='chase';const dx=playerMesh.position.x-ent.position.x,dz=playerMesh.position.z-ent.position.z;const len=Math.hypot(dx,dz)||1;ent.position.x+=dx/len*CONFIG.enemySpeed*dt;ent.position.z+=dz/len*CONFIG.enemySpeed*dt;ent.lookAt(playerMesh.position);if(dist<CONFIG.attackRange&&Math.random()<.02){STATE.player.hp=Math.max(0,STATE.player.hp-1);addXpDrop('-1',playerMesh.position.x,playerMesh.position.z,'damage');playSound('hit');updateStatsUI();if(STATE.player.hp<=0)handleDeath()}}else{ent.userData.state='idle';if(Math.random()<.005){ent.userData.state='wander';ent.userData.wanderTarget={x:ent.position.x+(Math.random()-.5)*10,z:ent.position.z+(Math.random()-.5)*10}}if(ent.userData.state==='wander'){const dx=ent.userData.wanderTarget.x-ent.position.x,dz=ent.userData.wanderTarget.z-ent.position.z,len=Math.hypot(dx,dz)||1;ent.position.x+=dx/len*CONFIG.enemySpeed*.3*dt;ent.position.z+=dz/len*CONFIG.enemySpeed*.3*dt;if(len<.2)ent.userData.state='idle'}}}if(ent.userData.tick)ent.userData.tick(dt)}}
function updateGame(){const dt=clock.getDelta();if(STATE.settings.music&&!ambientOsc)startAmbient();if(!STATE.settings.music&&ambientOsc)stopAmbient();document.getElementById('runModeStatusEl').textContent=isShiftDown?'ON':'OFF';document.getElementById('runEnergyEl').textContent=Math.floor(STATE.player.energy);const currentSpeed=isShiftDown&&STATE.player.energy>0?CONFIG.runSpeed:CONFIG.moveSpeed;if(isShiftDown&&STATE.player.energy>0)STATE.player.energy=Math.max(0,STATE.player.energy-dt*10);else STATE.player.energy=Math.min(100,STATE.player.energy+dt*6);STATE.player.x=playerMesh.position.x;STATE.player.z=playerMesh.position.z;if(STATE.player.action.startsWith('walking')){if(STATE.pathQueue.length>0){const t=STATE.pathQueue[0];const dest={x:t.x*CONFIG.cellSize,z:t.z*CONFIG.cellSize};const dx=dest.x-playerMesh.position.x,dz=dest.z-playerMesh.position.z,dist=Math.hypot(dx,dz);if(dist<.1){STATE.pathQueue.shift();if(STATE.pathQueue.length===0&&STATE.player.action==='walking_to_action')STATE.player.action=STATE.player.pendingAction||'idle'}else{playerMesh.position.x+=dx/dist*currentSpeed*dt;playerMesh.position.z+=dz/dist*currentSpeed*dt;playerMesh.lookAt(dest.x,playerMesh.position.y,dest.z)}}else{if(STATE.player.action==='walking_to_action')STATE.player.action=STATE.player.pendingAction||'idle';else STATE.player.action='idle'}}else if(STATE.player.action!=='idle'){const t=STATE.player.target;if(t){const tx=t.gridX*CONFIG.cellSize,tz=t.gridZ*CONFIG.cellSize,dx=tx-playerMesh.position.x,dz=tz-playerMesh.position.z,dist=Math.hypot(dx,dz);if(dist>.9){playerMesh.position.x+=dx/dist*currentSpeed*dt;playerMesh.position.z+=dz/dist*currentSpeed*dt;playerMesh.lookAt(tx,playerMesh.position.y,tz)}else{actionTimer+=dt;if(actionTimer>.55){actionTimer=0;performActionTick()}}}else STATE.player.action='idle'}else actionTimer=0
updateCombatAI(dt);updateParticles(dt);updateDayNight(dt);processRespawns();drawMinimap();updateStatsUI();renderer.render(scene,camera);requestAnimationFrame(updateGame);if(STATE.settings.autoSave&&Math.random()<.002)saveGame()}
let actionTimer=0;const clock=new THREE.Clock();
function resize(){const a=aspect();camera.left=-zoom*a;camera.right=zoom*a;camera.top=zoom;camera.bottom=-zoom;camera.updateProjectionMatrix();renderer.setSize(container.clientWidth,container.clientHeight)}
window.addEventListener('resize',resize)
window.addEventListener('mousedown',e=>{if(e.target.closest('.panel')||e.target.closest('button')||e.target.closest('input'))return;if(e.button===1){isDragging=true;previousMousePosition={x:e.clientX,y:e.clientY};return}mouse.x=e.clientX/window.innerWidth*2-1;mouse.y=-(e.clientY/window.innerHeight)*2+1;raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObjects(entityGroup.children,true);if(hits.length){let t=hits[0].object;while(t.parent&&t.parent!==entityGroup)t=t.parent;if(e.button===0)handleEntityClick(t);hideContextMenu();return}const ground=raycaster.intersectObject(instancedMesh);if(ground.length){const pt=ground[0].point;const gx=Math.round(pt.x/CONFIG.cellSize),gz=Math.round(pt.z/CONFIG.cellSize);if(gx>=0&&gz>=0&&gx<CONFIG.worldSize&&gz<CONFIG.worldSize&&grid[gx][gz]!==1){const sx=Math.round(playerMesh.position.x/CONFIG.cellSize),sz=Math.round(playerMesh.position.z/CONFIG.cellSize);const path=findPath(sx,sz,gx,gz);if(path&&path.length){STATE.pathQueue=path;STATE.player.action='walking';STATE.player.target=null;marker.visible=false}else{targetPos.set(gx*CONFIG.cellSize,.5,gz*CONFIG.cellSize);marker.position.copy(targetPos);marker.visible=true;STATE.player.action='walking';STATE.player.target=null}playSound('click');hideContextMenu()}}})
window.addEventListener('mousemove',e=>{if(isDragging){const dx=e.clientX-previousMousePosition.x,dy=e.clientY-previousMousePosition.y;camera.position.x-=dx*.05;camera.position.y+=dy*.05;camera.position.z-=dx*.05;camera.lookAt(0,0,0);previousMousePosition={x:e.clientX,y:e.clientY}}})
window.addEventListener('mouseup',()=>isDragging=false)
window.addEventListener('wheel',e=>{zoom+=e.deltaY*.01;zoom=Math.max(5,Math.min(50,zoom));resize()})
window.addEventListener('keydown',e=>{if(e.key==='Shift')isShiftDown=true})
window.addEventListener('keyup',e=>{if(e.key==='Shift')isShiftDown=false})
window.addEventListener('contextmenu',e=>{e.preventDefault();mouse.x=e.clientX/window.innerWidth*2-1;mouse.y=-(e.clientY/window.innerHeight)*2+1;raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObjects(entityGroup.children,true);if(hits.length){let t=hits[0].object;while(t.parent&&t.parent!==entityGroup)t=t.parent;showContextMenu(e.clientX,e.clientY,t.userData)}else hideContextMenu()})
function tintActiveTab(target){document.querySelectorAll('.tabBtn').forEach(b=>{b.style.background=b.dataset.target===target?'#444':'#222';b.style.color=b.dataset.target===target?'white':'#aaa';b.style.borderBottom=b.dataset.target===target?'2px solid #ff981f':'none'})}
document.querySelectorAll('.tabBtn').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('.tabContent').forEach(c=>c.hidden=true);document.getElementById('tab-'+btn.dataset.target).hidden=false;tintActiveTab(btn.dataset.target);if(btn.dataset.target==='craft')updateCraftingUI();if(btn.dataset.target==='bank')updateBankUI()})
function updateSettingsFromUI(){STATE.settings.music=document.getElementById('musicToggleEl').checked;STATE.settings.sfx=document.getElementById('sfxToggleEl').checked;STATE.settings.showGrid=document.getElementById('showGridToggleEl').checked;STATE.settings.showDamage=document.getElementById('showDamageToggleEl').checked;STATE.settings.autoSave=document.getElementById('autoSaveToggleEl').checked;STATE.settings.musicVol=parseFloat(document.getElementById('musicVolEl').value);STATE.settings.sfxVol=parseFloat(document.getElementById('sfxVolEl').value);STATE.settings.uiScale=parseFloat(document.getElementById('uiScaleEl').value);document.getElementById('uiLayerEl').style.transform=`scale(${STATE.settings.uiScale})`;saveGame()}
for(const id of ['musicToggleEl','sfxToggleEl','showGridToggleEl','showDamageToggleEl','autoSaveToggleEl','musicVolEl','sfxVolEl','uiScaleEl'])document.getElementById(id).addEventListener('input',updateSettingsFromUI)
document.getElementById('settingsBtnEl').onclick=()=>document.getElementById('settingsModalEl').hidden=false
document.getElementById('closeSettingsBtnEl').onclick=()=>document.getElementById('settingsModalEl').hidden=true
document.getElementById('resetGameBtnEl').onclick=()=>{localStorage.removeItem(SAVE_KEY);location.reload()}
document.getElementById('resetGameBtnHiddenEl').onclick=document.getElementById('resetGameBtnEl').onclick
document.getElementById('bankSearchEl').addEventListener('input',updateBankUI)
document.getElementById('depositAllBtn').onclick=()=>{while(STATE.inventory.length)addToInventory(STATE.inventory.shift(),true);updateInventoryUI();updateBankUI();addChat('Deposited all items.','#ccc');saveGame()}
document.getElementById('withdrawAllBtn').onclick=()=>{while(STATE.bank.length)addToInventory(STATE.bank.shift(),false);updateInventoryUI();updateBankUI();addChat('Withdrew all items.','#ccc');saveGame()}
document.getElementById('completeQuestBtn').onclick=completeQuest
document.getElementById('chatInputEl').addEventListener('keydown',e=>{if(e.key==='Enter'){const v=e.target.value.trim();if(v){addChat(`You: ${v}`,'#fff');if(v.toLowerCase()==='help')addChat('Use left click to move, right click for actions, Shift to run, and the bank/craft tabs for management.','#aaa');e.target.value=''}}})
function applyLoadedState(){document.getElementById('musicToggleEl').checked=STATE.settings.music;document.getElementById('sfxToggleEl').checked=STATE.settings.sfx;document.getElementById('showGridToggleEl').checked=STATE.settings.showGrid;document.getElementById('showDamageToggleEl').checked=STATE.settings.showDamage;document.getElementById('autoSaveToggleEl').checked=STATE.settings.autoSave;document.getElementById('musicVolEl').value=STATE.settings.musicVol;document.getElementById('sfxVolEl').value=STATE.settings.sfxVol;document.getElementById('uiScaleEl').value=STATE.settings.uiScale;document.getElementById('uiLayerEl').style.transform=`scale(${STATE.settings.uiScale})`;playerMesh.position.set(STATE.player.x||0,0,STATE.player.z||0);STATE.player.hp=STATE.player.hp||STATE.player.maxHp;updateInventoryUI();updateBankUI();updateStatsUI();updateSettingsFromUI();uiLayer.style.display='block';loadingScreen.style.display='none';startAmbient()}
function init(){loadingText.textContent='Generating world...';loadingBar.style.width='20%';loadingText.textContent='Preparing UI...';loadingBar.style.width='55%';updateInventoryUI();updateBankUI();updateCraftingUI();updateEquipmentUI();updateStatsUI();loadingBar.style.width='85%';applyLoadedState();loadingBar.style.width='100%';requestAnimationFrame(updateGame)}
setTimeout(init,50)
window.addEventListener('beforeunload',()=>saveGame())
</script>
