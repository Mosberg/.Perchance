<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>monster-quest — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d1117;--panel:#161b22;--panel2:#1c2333;--border:#30363d;--text:#e6edf3;--dim:#8b949e;--accent:#7c5cff;--accent2:#4ade80;--hp:#3fb950;--hp-mid:#d29922;--hp-low:#f85149;--gold:#fbbf24}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;text-align:center;min-height:100vh;overflow-x:hidden}
.screen{max-width:640px;margin:0 auto;padding:12px;min-height:100vh}
h1{font-size:2em;margin-bottom:4px}
h2{font-size:1.3em;margin-bottom:8px}
.btn{background:var(--accent);color:#fff;border:none;padding:10px 18px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;transition:.15s;margin:3px;white-space:nowrap}
.btn:hover:not(:disabled){filter:brightness(1.15);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.35;cursor:default}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-sec{background:var(--panel2);border:1px solid var(--border);color:var(--text)}
.btn-danger{background:var(--hp-low)}
.btn-success{background:var(--hp)}
.btn-move{background:var(--panel2);border:1px solid var(--border);text-align:left;padding:10px;display:flex;flex-direction:column;gap:2px;min-height:56px;justify-content:center}
.btn-move:hover:not(:disabled){border-color:var(--accent)}
.hp-bar{width:100%;height:10px;background:#21262d;border-radius:5px;overflow:hidden;border:1px solid #0003}
.hp-fill{height:100%;border-radius:4px;transition:width .4s ease,background .3s}
.xp-bar{width:100%;height:4px;background:#21262d;border-radius:2px;overflow:hidden;margin-top:2px}
.xp-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .4s}
.type-badge{display:inline-block;padding:1px 7px;border-radius:4px;font-size:10px;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:.5px}
.mon-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px;margin:6px 0;text-align:left}
.mon-card.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.sprite-box{width:100px;height:100px;display:flex;align-items:center;justify-content:center;background:var(--panel2);border-radius:10px;flex-shrink:0;overflow:hidden}
.sprite-box img{max-width:96px;max-height:96px;image-rendering:pixelated}
.pokeball{width:48px;height:48px;border-radius:50%;background:linear-gradient(#ee1515 50%,#fff 50%);border:3px solid #222;position:relative;animation:spin 1s linear infinite}
.pokeball::after{content:'';position:absolute;top:50%;left:50%;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid #222;transform:translate(-50%,-50%)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shake{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-6px) rotate(-8deg)}75%{transform:translateX(6px) rotate(8deg)}}
.catching{animation:shake .4s ease-in-out 3}
@keyframes flash{0%,100%{opacity:1}50%{opacity:.3}}
.flashing{animation:flash .15s 2}
@keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.slide-in{animation:slideIn .3s ease}
.rarity-C{color:#8b949e}.rarity-U{color:#4ade80}.rarity-R{color:#fbbf24}.rarity-S{color:#c084fc}
.log-box{background:#0d1117;border:1px solid var(--border);border-radius:8px;padding:10px;min-height:56px;text-align:left;font-size:13px;line-height:1.5;max-height:100px;overflow-y:auto}
.biome-btn{padding:16px;border-radius:12px;cursor:pointer;border:2px solid var(--border);color:#fff;font-weight:700;font-size:15px;text-align:left;transition:.15s;display:flex;align-items:center;gap:8px}
.biome-btn:hover{border-color:var(--accent);transform:scale(1.02)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.flex{display:flex;align-items:center;gap:8px}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.flex-wrap{flex-wrap:wrap}
.gap-sm{gap:4px}
.col{flex-direction:column}
.grow{flex:1;min-width:0}
.center{justify-content:center;align-items:center}
.muted{color:var(--dim)}
.sm{font-size:12px}
.xs{font-size:10px}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}
.mb4{margin-bottom:4px}.mb8{margin-bottom:8px}
.starter-card{background:var(--panel);border:2px solid var(--border);border-radius:14px;padding:14px;cursor:pointer;transition:.2s;text-align:center}
.starter-card:hover{border-color:var(--accent);transform:scale(1.03)}
.starter-card.selected{border-color:var(--accent2);box-shadow:0 0 12px var(--accent2)}
.title-glow{text-shadow:0 0 20px var(--accent),0 0 40px var(--accent)}
.overlay{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.overlay-content{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px;max-width:400px;width:100%;max-height:80vh;overflow-y:auto}
.potion-icon{font-size:1.1em}
</style>

<!-- TITLE SCREEN -->
<div id="titleScreen" class="screen" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh">
  <div style="font-size:3em;margin-bottom:8px">⚔️</div>
  <h1 class="title-glow">Monster Quest</h1>
  <p class="muted mb8">Explore · Battle · Collect</p>
  <div id="titleBtns" class="mt8">
    <button class="btn" onclick="startNewGame()">▶ New Game</button>
    <button id="continueBtn" class="btn btn-sec" hidden onclick="continueGame()">↻ Continue</button>
  </div>
  <p class="muted xs mt12">AI-generated creatures · Turn-based battles · 17 types</p>
</div>

<!-- STARTER SCREEN -->
<div id="starterScreen" class="screen" hidden>
  <h2>Choose Your Starter</h2>
  <p class="muted sm mb8">Your first companion awaits...</p>
  <div id="starterCards" class="grid3" style="grid-template-columns:1fr"></div>
  <div class="mt8 flex center">
    <button id="confirmStarterBtn" class="btn btn-success" disabled onclick="confirmStarter()">✓ Confirm Choice</button>
  </div>
</div>

<!-- MENU SCREEN -->
<div id="menuScreen" class="screen" hidden>
  <div class="flex-between mb8">
    <h2>🏕️ Camp</h2>
    <div class="sm">
      <span class="muted">💰</span> <span id="menuGold">0</span>
      <span class="muted ml4">🎯</span> <span id="menuBalls">0</span>
      <span class="muted ml4">💊</span> <span id="menuPotions">0</span>
    </div>
  </div>
  <div id="menuTeam" class="mb8"></div>
  <div class="grid2">
    <button class="btn" style="font-size:16px;padding:14px" onclick="showScreen('exploreScreen')">🔍 Explore</button>
    <button class="btn btn-sec" style="font-size:16px;padding:14px" onclick="renderTeam();showScreen('teamScreen')">👥 Team</button>
  </div>
  <button class="btn btn-success mt4" style="width:100%" onclick="healAll()">🏥 Heal All Monsters</button>
</div>

<!-- EXPLORE SCREEN -->
<div id="exploreScreen" class="screen" hidden>
  <h2>🗺️ Choose a Biome</h2>
  <div id="biomeGrid" class="grid2"></div>
  <button class="btn btn-sec mt8" onclick="showScreen('menuScreen')">← Back to Camp</button>
</div>

<!-- BATTLE SCREEN -->
<div id="battleScreen" class="screen" hidden>
  <div style="background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:6px">
    <div class="flex-between mb8">
      <div class="grow" style="text-align:left">
        <div class="flex gap-sm"><b id="enemyName"></b> <span id="enemyLevel" class="sm muted"></span> <span id="enemyRarity" class="xs"></span></div>
        <div id="enemyTypes" class="mb4"></div>
        <div class="hp-bar"><div id="enemyHpFill" class="hp-fill"></div></div>
        <div id="enemyHpText" class="xs muted"></div>
      </div>
      <div class="sprite-box" id="enemySpriteBox">
        <div class="pokeball" id="enemyLoader"></div>
        <img id="enemySprite" hidden style="max-width:96px;max-height:96px;image-rendering:pixelated">
      </div>
    </div>
    <div class="flex-between">
      <div class="sprite-box" id="playerSpriteBox">
        <img id="playerSprite" style="max-width:96px;max-height:96px;image-rendering:pixelated">
      </div>
      <div class="grow" style="text-align:left;padding-left:8px">
        <div class="flex gap-sm"><b id="playerName"></b> <span id="playerLevel" class="sm muted"></span></div>
        <div id="playerTypes" class="mb4"></div>
        <div class="hp-bar"><div id="playerHpFill" class="hp-fill"></div></div>
        <div id="playerHpText" class="xs muted"></div>
        <div class="xp-bar"><div id="playerXpFill" class="xp-fill"></div></div>
        <div id="playerStatus" class="xs"></div>
      </div>
    </div>
  </div>
  <div id="battleLog" class="log-box mb4"></div>
  <div id="actionMenu"></div>
</div>

<!-- TEAM SCREEN -->
<div id="teamScreen" class="screen" hidden>
  <div class="flex-between mb8">
    <h2>👥 Your Team</h2>
    <button class="btn btn-sec btn-sm" onclick="showScreen('menuScreen')">← Back</button>
  </div>
  <div id="teamList"></div>
</div>

<!-- OVERLAY -->
<div id="overlay" class="overlay" hidden onclick="if(event.target===this)closeOverlay()">
  <div class="overlay-content" id="overlayContent"></div>
</div>

<script>
// ===== GAME DATA =====
const TYPE_CHART = {
  Fire:{Grass:2,Bug:2,Ice:2,Steel:2,Water:.5,Fire:.5,Rock:.5,Dragon:.5},
  Water:{Fire:2,Ground:2,Rock:2,Water:.5,Grass:.5,Dragon:.5},
  Grass:{Water:2,Ground:2,Rock:2,Fire:.5,Grass:.5,Flying:.5,Bug:.5,Poison:.5,Steel:.5,Dragon:.5},
  Electric:{Water:2,Flying:2,Electric:.5,Grass:.5,Dragon:.5,Ground:0},
  Normal:{Rock:.5,Steel:.5,Ghost:0},
  Dark:{Psychic:2,Ghost:2,Dark:.5,Fairy:.5,Fighting:.5},
  Psychic:{Fighting:2,Poison:2,Psychic:.5,Steel:.5,Dark:0},
  Rock:{Fire:2,Ice:2,Flying:2,Bug:2,Fighting:.5,Ground:.5,Steel:.5},
  Ground:{Fire:2,Electric:2,Poison:2,Rock:2,Steel:2,Grass:.5,Bug:.5,Flying:0},
  Flying:{Grass:2,Bug:2,Fighting:2,Electric:.5,Rock:.5,Steel:.5},
  Bug:{Grass:2,Psychic:2,Dark:2,Fire:.5,Fighting:.5,Poison:.5,Flying:.5,Ghost:.5,Steel:.5,Fairy:.5},
  Ghost:{Psychic:2,Ghost:2,Dark:.5,Normal:0},
  Dragon:{Dragon:2,Steel:.5,Fairy:0},
  Ice:{Grass:2,Ground:2,Flying:2,Dragon:2,Fire:.5,Water:.5,Ice:.5,Steel:.5},
  Poison:{Grass:2,Poison:.5,Ground:.5,Rock:.5,Ghost:.5,Steel:0},
  Steel:{Ice:2,Rock:2,Fairy:2,Fire:.5,Water:.5,Electric:.5,Steel:.5},
  Fairy:{Dragon:2,Dark:2,Fighting:2,Fire:.5,Poison:.5,Steel:.5}
};

const TYPE_COLORS = {
  Fire:"#EE8130",Water:"#6390F0",Grass:"#7AC74C",Electric:"#F7D02C",Normal:"#A8A77A",
  Dark:"#705746",Psychic:"#F95587",Rock:"#B6A136",Ground:"#E2BF65",Flying:"#A98FF3",
  Bug:"#A6B91A",Ghost:"#735797",Dragon:"#6F35FC",Ice:"#96D9D6",Poison:"#A33EA1",Steel:"#B7B7CE",Fairy:"#D685AD"
};

const MOVES = {
  Fire:[{name:"Ember",type:"Fire",power:40,accuracy:100},{name:"Flame Burst",type:"Fire",power:70,accuracy:100},{name:"Inferno",type:"Fire",power:100,accuracy:50,effect:"burn"}],
  Water:[{name:"Water Gun",type:"Water",power:40,accuracy:100},{name:"Bubble Beam",type:"Water",power:65,accuracy:100},{name:"Hydro Pump",type:"Water",power:110,accuracy:80}],
  Grass:[{name:"Vine Whip",type:"Grass",power:45,accuracy:100},{name:"Razor Leaf",type:"Grass",power:55,accuracy:95},{name:"Energy Ball",type:"Grass",power:80,accuracy:100}],
  Electric:[{name:"Thunder Shock",type:"Electric",power:40,accuracy:100},{name:"Spark",type:"Electric",power:65,accuracy:100},{name:"Thunderbolt",type:"Electric",power:90,accuracy:100,effect:"paralyze"}],
  Normal:[{name:"Tackle",type:"Normal",power:40,accuracy:100},{name:"Body Slam",type:"Normal",power:85,accuracy:100},{name:"Slash",type:"Normal",power:70,accuracy:100}],
  Dark:[{name:"Bite",type:"Dark",power:60,accuracy:100},{name:"Crunch",type:"Dark",power:80,accuracy:100},{name:"Dark Pulse",type:"Dark",power:80,accuracy:100}],
  Psychic:[{name:"Confusion",type:"Psychic",power:50,accuracy:100},{name:"Psybeam",type:"Psychic",power:65,accuracy:100},{name:"Psychic",type:"Psychic",power:90,accuracy:100}],
  Rock:[{name:"Rock Throw",type:"Rock",power:50,accuracy:90},{name:"Rock Slide",type:"Rock",power:75,accuracy:90},{name:"Stone Edge",type:"Rock",power:100,accuracy:80}],
  Ground:[{name:"Mud Shot",type:"Ground",power:55,accuracy:95},{name:"Dig",type:"Ground",power:80,accuracy:100},{name:"Earthquake",type:"Ground",power:100,accuracy:100}],
  Flying:[{name:"Gust",type:"Flying",power:40,accuracy:100},{name:"Wing Attack",type:"Flying",power:60,accuracy:100},{name:"Air Slash",type:"Flying",power:75,accuracy:95}],
  Bug:[{name:"Bug Bite",type:"Bug",power:45,accuracy:100},{name:"X-Scissor",type:"Bug",power:80,accuracy:100},{name:"Bug Buzz",type:"Bug",power:90,accuracy:100}],
  Ghost:[{name:"Lick",type:"Ghost",power:30,accuracy:100},{name:"Shadow Ball",type:"Ghost",power:80,accuracy:100},{name:"Shadow Claw",type:"Ghost",power:70,accuracy:100}],
  Dragon:[{name:"Dragon Breath",type:"Dragon",power:60,accuracy:100},{name:"Dragon Pulse",type:"Dragon",power:85,accuracy:100},{name:"Outrage",type:"Dragon",power:120,accuracy:100}],
  Ice:[{name:"Ice Shard",type:"Ice",power:40,accuracy:100},{name:"Ice Beam",type:"Ice",power:90,accuracy:100},{name:"Blizzard",type:"Ice",power:110,accuracy:70,effect:"freeze"}],
  Poison:[{name:"Acid",type:"Poison",power:40,accuracy:100},{name:"Poison Jab",type:"Poison",power:80,accuracy:100},{name:"Sludge Bomb",type:"Poison",power:90,accuracy:100,effect:"poison"}],
  Steel:[{name:"Metal Claw",type:"Steel",power:50,accuracy:95},{name:"Iron Head",type:"Steel",power:80,accuracy:100},{name:"Meteor Mash",type:"Steel",power:90,accuracy:90}],
  Fairy:[{name:"Fairy Wind",type:"Fairy",power:40,accuracy:100},{name:"Play Rough",type:"Fairy",power:90,accuracy:90},{name:"Moonblast",type:"Fairy",power:95,accuracy:100}]
};

const BIOMES = {
  "Verdant Forest":{types:["Grass","Bug","Poison","Fairy"],color:"#2d5a27",icon:"🌲",range:[2,8]},
  "Scorched Plains":{types:["Fire","Ground","Rock"],color:"#8B2500",icon:"🔥",range:[3,10]},
  "Crystal Lake":{types:["Water","Ice","Fairy"],color:"#1a4a6e",icon:"💧",range:[2,9]},
  "Thunder Peak":{types:["Electric","Flying","Rock"],color:"#4a3a8e",icon:"⚡",range:[4,12]},
  "Haunted Hollow":{types:["Ghost","Dark","Psychic"],color:"#2a1a3a",icon:"👻",range:[5,14]},
  "Dragon's Den":{types:["Dragon","Steel","Ground"],color:"#3a2a1a",icon:"🐉",range:[8,18]},
  "Frozen Tundra":{types:["Ice","Steel","Rock"],color:"#3a5a7a",icon:"❄️",range:[5,13]},
  "Shadow Marsh":{types:["Dark","Poison","Ghost","Bug"],color:"#1a2a1a",icon:"🌫️",range:[4,11]}
};

const STARTERS = [
  {name:"Ignipup",types:["Fire"],desc:"A small fiery wolf pup with embers flickering along its spine and glowing orange eyes"},
  {name:"Aquadle",types:["Water"],desc:"A cheerful duckling with a crest of flowing water and iridescent blue feathers"},
  {name:"Sproutle",types:["Grass"],desc:"A sturdy turtle with a lush garden of flowers growing on its mossy shell"}
];

// ===== GAME STATE =====
let game = {
  player:{name:"Trainer",team:[],activeIndex:0,gold:100,balls:15,potions:3,seen:0,caught:0},
  currentEnemy:null,
  inBattle:false,
  battleState:'main',
  starters:[],
  selectedStarter:-1
};

// ===== UTILS =====
const $=id=>document.getElementById(id);
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=arr=>arr[Math.floor(Math.random()*arr.length)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

function typeBadge(t){
  return `<span class="type-badge" style="background:${TYPE_COLORS[t]||'#666'}">${t}</span>`;
}

function hpColor(ratio){
  if(ratio>.5)return'var(--hp)';
  if(ratio>.25)return'var(--hp-mid)';
  return'var(--hp-low)';
}

function getTypeMult(atk,defTypes){
  let m=1;
  const c=TYPE_CHART[atk];
  if(!c)return m;
  for(let t of defTypes){if(c[t]!==undefined)m*=c[t]}
  return m;
}

function getMonsterName(){
  if(typeof root!=='undefined'&&typeof root.generateMonsterName==='function'){
    try{return root.generateMonsterName()}catch(e){}
  }
  const p=["Pyro","Hydro","Volt","Cryo","Terra","Aero","Drago","Spectre","Toxi","Metallo","Fae","Nimbus","Shadow","Psycho","Petra","Geo","Flora","Ignis","Aqua","Storm","Frost","Bould","Venin","Chloro"];
  const s=["saur","mon","rex","drake","wolf","beast","claw","fang","horn","wing","tail","spike","flame","surge","shard","leaf","eye","roar","pup","cub"];
  return pick(p)+pick(s);
}

// ===== MONSTER CREATION =====
function createMonster(name,types,level,catchRate,statMult,rarity,isWild){
  const lm=1+(level-1)*0.12;
  const bHp=Math.floor((45+Math.random()*25)*statMult);
  const bAtk=Math.floor((40+Math.random()*25)*statMult);
  const bDef=Math.floor((35+Math.random()*25)*statMult);
  const bSpd=Math.floor((35+Math.random()*30)*statMult);
  let moves=[];
  for(let t of types){
    if(MOVES[t])for(let m of MOVES[t]){if(moves.length<4&&!moves.some(x=>x.name===m.name))moves.push({...m})}
  }
  if(moves.length<2)moves.push({name:"Tackle",type:"Normal",power:40,accuracy:100});
  return{
    id:uid(),name,types,level,
    maxHp:Math.floor(bHp*lm),hp:Math.floor(bHp*lm),
    attack:Math.floor(bAtk*lm),defense:Math.floor(bDef*lm),speed:Math.floor(bSpd*lm),
    moves,xp:0,xpToNext:level*25,status:null,
    imageUrl:null,description:null,
    catchRate:catchRate||0.3,rarity:rarity||"Common",isWild:!!isWild
  };
}

function generateWildMonster(biomeName){
  const b=BIOMES[biomeName];
  const numTypes=Math.random()<0.25?2:1;
  const avail=[...b.types];
  const types=[];
  for(let i=0;i<numTypes&&avail.length>0;i++){types.push(avail.splice(Math.floor(Math.random()*avail.length),1)[0])}
  const name=getMonsterName();
  const avgLvl=game.player.team.length?game.player.team.reduce((s,m)=>s+m.level,0)/game.player.team.length:5;
  const level=Math.max(b.range[0],Math.min(b.range[1],Math.floor(avgLvl+(Math.random()-0.4)*5)));
  const r=Math.random();
  let rarity,catchRate,statMult,rarityCode;
  if(r<0.04){rarity="Rare";catchRate=0.12;statMult=1.35;rarityCode="R"}
  else if(r<0.25){rarity="Uncommon";catchRate=0.22;statMult=1.12;rarityCode="U"}
  else{rarity="Common";catchRate=0.38;statMult=1.0;rarityCode="C"}
  const m=createMonster(name,types,level,catchRate,statMult,rarityCode,true);
  m.biome=biomeName;
  return m;
}

function calcDamage(attacker,defender,move){
  let mult=getTypeMult(move.type,defender.types);
  if(mult===0)return{damage:0,mult:0,crit:false};
  let stab=attacker.types.includes(move.type)?1.5:1;
  let crit=Math.random()<0.0625?1.5:1;
  let base=((2*attacker.level/5+2)*move.power*(attacker.attack/Math.max(1,defender.defense)))/50+2;
  let dmg=Math.floor(base*mult*stab*crit*(0.85+Math.random()*0.15));
  if(attacker.status==='burn')dmg=Math.floor(dmg*0.5);
  return{damage:Math.max(1,dmg),mult,crit:crit>1};
}

// ===== AI FUNCTIONS =====
async function genMonsterDesc(monster){
  try{
    let gt=typeof root!=='undefined'?root.generateText:generateText;
    let r=await Promise.race([
      gt(`Describe the visual appearance of a fictional monster called ${monster.name}, a ${monster.types.join(' and ')} type creature from biome "${monster.biome||'unknown'}". Use exactly 2 sentences. Focus on physical appearance, colors, and unique features. Be creative.`),
      new Promise((_,rej)=>setTimeout(()=>rej('timeout'),25000))
    ]);
    monster.description=typeof r==='string'?r:(r&&r.text||r&&r.instruction||String(r));
  }catch(e){
    const parts=["A mysterious","A fearsome","A majestic","A peculiar","An ancient"];
    monster.description=`${pick(parts)} ${monster.types.join('-')} type creature with distinctive features.`;
  }
}

async function genMonsterImage(monster){
  try{
    let gi=typeof root!=='undefined'?root.generateImage:generateImage;
    let prompt=`pixel art creature sprite, full body, facing forward, ${monster.description||'a mysterious '+monster.types.join(' ')+' creature'}, ${monster.types.join(' ')} type fantasy monster, 16-bit RPG game character, vibrant colors, clean pixel art style, centered`;
    let r=await Promise.race([
      gi({prompt,negativePrompt:"text, watermark, signature, frame, border, multiple creatures, human, realistic photo, 3d render, dark background, complex scenery",resolution:"512x512"}),
      new Promise((_,rej)=>setTimeout(()=>rej('timeout'),60000))
    ]);
    monster.imageUrl=r.dataUrl||r.url;
  }catch(e){console.error('img gen failed',e)}
}

// ===== BATTLE LOG =====
function log(id,html){
  const el=$(id);
  if(!el)return;
  if(id==='battleLog')el.innerHTML+=html;
  else el.innerHTML=html;
  el.scrollTop=el.scrollHeight;
}

// ===== BATTLE ACTIONS =====
async function playerAttack(moveIdx){
  if(game.battleState!=='main')return;
  game.battleState='busy';
  const p=activeMonster();
  const e=game.currentEnemy;
  const move=p.moves[moveIdx];
  const playerFirst=p.speed>=e.speed;
  if(playerFirst){
    await doAttack(p,e,move,'enemy');
    if(e.hp<=0){await onEnemyFaint();return}
    if(p.status&&p.hp<=0){await onPlayerFaint();return}
    await enemyTurn();
    if(p.hp<=0){await onPlayerFaint();return}
  }else{
    await enemyTurn();
    if(p.hp<=0){await onPlayerFaint();return}
    if(e.hp<=0){await onEnemyFaint();return}
    await doAttack(p,e,move,'enemy');
    if(e.hp<=0){await onEnemyFaint();return}
  }
  applyEndOfTurn();
  renderBattle();
  game.battleState='main';
  renderActionMenu();
}

async function doAttack(attacker,defender,move,targetSide){
  if(attacker.status==='freeze'){
    if(Math.random()<0.2){attacker.status=null;log('battleLog',`<p>${attacker.name} thawed out!</p>`)}
    else{log('battleLog',`<p>${attacker.name} is frozen solid!</p>`);renderBattle();return}
  }
  if(attacker.status==='paralyze'&&Math.random()<0.25){
    log('battleLog',`<p>${attacker.name} is paralyzed and can't move!</p>`);renderBattle();return
  }
  log('battleLog',`<p><b>${attacker.name}</b> used <b>${move.name}</b>!</p>`);
  await sleep(600);
  if(Math.random()*100>move.accuracy){
    log('battleLog',`<p class="muted">...but it missed!</p>`);
    renderBattle();return;
  }
  const result=calcDamage(attacker,defender,move);
  if(result.mult===0){
    log('battleLog',`<p class="muted">It doesn't affect ${defender.name}...</p>`);
    renderBattle();return;
  }
  defender.hp=Math.max(0,defender.hp-result.damage);
  const sprite=targetSide==='enemy'?'enemySpriteBox':'playerSpriteBox';
  $(sprite).classList.add('flashing');
  setTimeout(()=>$(sprite).classList.remove('flashing'),300);
  let msg='';
  if(result.crit)msg+=' Critical hit!';
  if(result.mult>1)msg+=' It\'s super effective!';
  else if(result.mult<1)msg+=' It\'s not very effective...';
  log('battleLog',`<p>${msg}</p>`);
  if(move.effect&&Math.random()<0.15&&!defender.status){
    defender.status=move.effect;
    log('battleLog',`<p>${defender.name} was ${move.effect==='burn'?'burned':move.effect==='poison'?'poisoned':move.effect==='paralyze'?'paralyzed':'frozen'}!</p>`);
  }
  renderBattle();
}

async function enemyTurn(){
  const e=game.currentEnemy;
  const p=activeMonster();
  let bestMove=e.moves[0];
  let bestMult=0;
  if(Math.random()<0.65){
    for(let m of e.moves){
      let mult=getTypeMult(m.type,p.types);
      if(mult>bestMult){bestMult=mult;bestMove=m}
    }
  }else{
    bestMove=pick(e.moves);
  }
  await sleep(700);
  await doAttack(e,p,bestMove,'player');
}

function applyEndOfTurn(){
  const p=activeMonster();
  const e=game.currentEnemy;
  for(let mon of[p,e]){
    if(mon.hp<=0)continue;
    if(mon.status==='burn'||mon.status==='poison'){
      const dmg=Math.floor(mon.maxHp/8);
      mon.hp=Math.max(0,mon.hp-dmg);
      log('battleLog',`<p class="sm">${mon.name} took ${mon.status} damage!</p>`);
    }
  }
  renderBattle();
}

async function onEnemyFaint(){
  const e=game.currentEnemy;
  const p=activeMonster();
  log('battleLog',`<p><b>${e.name}</b> fainted!</p>`);
  await sleep(800);
  const xp=e.level*12+rand(0,5);
  log('battleLog',`<p style="color:var(--accent2)">${p.name} gained ${xp} XP!</p>`);
  await gainXp(p,xp);
  const rewards=rand(3,8);
  game.player.gold+=rewards;
  if(Math.random()<0.5)game.player.balls+=1;
  if(Math.random()<0.3)game.player.potions+=1;
  log('battleLog',`<p class="sm">💰 +${rewards} gold${Math.random()<0.5?' · 🎯 +1 ball':''}</p>`);
  game.inBattle=false;
  saveGame();
  await sleep(1500);
  showScreen('exploreScreen');
  renderExplore();
}

async function onPlayerFaint(){
  const p=activeMonster();
  log('battleLog',`<p><b>${p.name}</b> fainted!</p>`);
  await sleep(800);
  const alive=game.player.team.filter(m=>m.hp>0);
  if(alive.length===0){
    log('battleLog',`<p style="color:var(--hp-low)">All monsters fainted! You blacked out...</p>`);
    await sleep(1500);
    for(let m of game.player.team){m.hp=m.maxHp;m.status=null}
    game.inBattle=false;
    game.currentEnemy=null;
    saveGame();
    showScreen('menuScreen');
    renderMenu();
  }else{
    await openSwitch(true);
  }
}

async function gainXp(mon,amount){
  mon.xp+=amount;
  while(mon.xp>=mon.xpToNext){
    mon.xp-=mon.xpToNext;
    mon.level++;
    mon.xpToNext=mon.level*25;
    const hpGain=rand(4,7),atkGain=rand(2,4),defGain=rand(2,4),spdGain=rand(2,4);
    mon.maxHp+=hpGain;mon.hp+=hpGain;
    mon.attack+=atkGain;mon.defense+=defGain;mon.speed+=spdGain;
    log('battleLog',`<p style="color:var(--gold)">⬆ ${mon.name} grew to Lv.${mon.level}! (+${hpGain}HP +${atkGain}ATK +${defGain}DEF +${spdGain}SPD)</p>`);
    await sleep(500);
    if(mon.level%5===0&&MOVES[mon.types[0]]){
      const pool=MOVES[mon.types[0]];
      const newMove=pool[2];
      if(newMove&&!mon.moves.some(m=>m.name===newMove.name)){
        if(mon.moves.length<4){mon.moves.push({...newMove})}
        else{mon.moves[3]={...newMove}}
        log('battleLog',`<p style="color:var(--accent)">★ ${mon.name} learned ${newMove.name}!</p>`);
        await sleep(500);
      }
    }
  }
}

// ===== CATCH =====
async function attemptCatch(){
  if(game.player.balls<=0)return;
  game.battleState='busy';
  game.player.balls--;
  const e=game.currentEnemy;
  const hpRatio=e.hp/e.maxHp;
  const catchChance=e.catchRate*(1-hpRatio*0.5)*(1+(1-hpRatio)*0.5);
  log('battleLog',`<p>You throw a Monster Ball at ${e.name}!</p>`);
  $('enemyLoader').style.display='block';
  $('enemySprite').hidden=true;
  $('enemyLoader').classList.add('catching');
  renderActionMenu();
  await sleep(1600);
  $('enemyLoader').classList.remove('catching');
  $('enemyLoader').style.display='none';
  if(Math.random()<catchChance){
    log('battleLog',`<p style="color:var(--accent2);font-size:1.1em">🎉 Gotcha! <b>${e.name}</b> was caught!</p>`);
    game.player.caught++;
    e.isWild=false;
    if(game.player.team.length<6){
      game.player.team.push(e);
      log('battleLog',`<p class="sm">${e.name} joined your team!</p>`);
    }else{
      log('battleLog',`<p class="sm muted">Your team is full! ${e.name} was sent to storage.</p>`);
    }
    game.inBattle=false;
    saveGame();
    await sleep(2000);
    showScreen('exploreScreen');
    renderExplore();
    genMonsterDesc(e);
    genMonsterImage(e);
  }else{
    if(e.imageUrl){$('enemySprite').src=e.imageUrl;$('enemySprite').hidden=false}
    log('battleLog',`<p class="muted">...${e.name} broke free!</p>`);
    await sleep(800);
    await enemyTurn();
    if(activeMonster().hp<=0){await onPlayerFaint();return}
    applyEndOfTurn();
    renderBattle();
    game.battleState='main';
    renderActionMenu();
  }
}

// ===== FLEE =====
async function attemptFlee(){
  if(game.battleState!=='main')return;
  game.battleState='busy';
  const p=activeMonster();
  const e=game.currentEnemy;
  const fleeChance=0.5+(p.speed-e.speed)/200;
  if(Math.random()<Math.max(0.2,Math.min(0.9,fleeChance))){
    log('battleLog',`<p>You escaped!</p>`);
    game.inBattle=false;
    game.currentEnemy=null;
    await sleep(800);
    showScreen('exploreScreen');
    renderExplore();
  }else{
    log('battleLog',`<p class="muted">Couldn't escape!</p>`);
    await sleep(600);
    await enemyTurn();
    if(activeMonster().hp<=0){await onPlayerFaint();return}
    applyEndOfTurn();
    renderBattle();
    game.battleState='main';
    renderActionMenu();
  }
}

// ===== POTION =====
async function usePotion(){
  if(game.player.potions<=0||game.battleState!=='main')return;
  game.battleState='busy';
  game.player.potions--;
  const p=activeMonster();
  const heal=Math.min(40,p.maxHp-p.hp);
  p.hp+=heal;
  log('battleLog',`<p>You used a Potion! ${p.name} recovered ${heal} HP.</p>`);
  renderBattle();
  renderActionMenu();
  await sleep(800);
  await enemyTurn();
  if(p.hp<=0){await onPlayerFaint();return}
  applyEndOfTurn();
  renderBattle();
  game.battleState='main';
  renderActionMenu();
}

// ===== SWITCH =====
async function openSwitch(force){
  const overlay=$('overlay');
  const content=$('overlayContent');
  const alive=game.player.team.filter(m=>m.hp>0);
  if(alive.length<=1&&!force){log('battleLog','<p class="muted">No other monsters to switch to!</p>');return}
  content.innerHTML=`<h3>Switch Monster</h3><div class="mt8">`+game.player.team.map((m,i)=>{
    const fainted=m.hp<=0;
    return `<div class="mon-card ${i===game.player.activeIndex?'active':''}" style="cursor:${fainted?'default':'pointer'}" ${fainted?'':'onclick="doSwitch('+i+')"'}">
      <div class="flex gap-sm">
        <div class="sprite-box" style="width:40px;height:40px">${m.imageUrl?`<img src="${m.imageUrl}" style="max-width:36px;max-height:36px">`:'<span>❓</span>'}</div>
        <div class="grow">
          <b>${m.name}</b> <span class="sm muted">Lv.${m.level}</span> ${fainted?'<span class="xs" style="color:var(--hp-low)">FNT</span>':''}
          <div class="hp-bar" style="height:5px"><div class="hp-fill" style="width:${m.hp/m.maxHp*100}%;background:${hpColor(m.hp/m.maxHp)}"></div></div>
          <div class="xs muted">${m.hp}/${m.maxHp} HP</div>
        </div>
      </div>
    </div>`;
  }).join('')+`<button class="btn btn-sec mt8" onclick="closeOverlay();${force?'':'game.battleState=\'main\';renderActionMenu()'}">Cancel</button></div>`;
  overlay.hidden=false;
}

function doSwitch(i){
  if(game.player.team[i].hp<=0)return;
  closeOverlay();
  if(game.battleState==='busy'&&!game.inBattle)return;
  const wasForced=game.battleState==='busy';
  game.player.activeIndex=i;
  log('battleLog',`<p>Go, <b>${activeMonster().name}</b>!</p>`);
  renderBattle();
  if(!wasForced&&game.inBattle){
    game.battleState='busy';
    renderActionMenu();
    setTimeout(async()=>{
      await enemyTurn();
      if(activeMonster().hp<=0){await onPlayerFaint();return}
      game.battleState='main';
      renderActionMenu();
    },600);
  }else if(wasForced&&game.inBattle){
    game.battleState='main';
    renderActionMenu();
  }
  saveGame();
}

function closeOverlay(){$('overlay').hidden=true}

// ===== SAVE / LOAD =====
function saveGame(){
  try{
    localStorage.setItem('monsterQuestSave',JSON.stringify(game));
  }catch(e){
    try{
      const s=JSON.parse(JSON.stringify(game));
      for(let m of s.player.team)m.imageUrl=null;
      if(s.currentEnemy)s.currentEnemy.imageUrl=null;
      for(let m of s.starters)m.imageUrl=null;
      localStorage.setItem('monsterQuestSave',JSON.stringify(s));
    }catch(e2){}
  }
}

function loadGame(){
  try{
    const d=localStorage.getItem('monsterQuestSave');
    if(!d)return false;
    game=JSON.parse(d);
    if(!game.player.team.length)return false;
    if(game.player.activeIndex>=game.player.team.length)game.player.activeIndex=0;
    return true;
  }catch(e){return false}
}

// ===== INIT =====
(function init(){
  if(loadGame()){$('continueBtn').hidden=false}
})();
</script>
