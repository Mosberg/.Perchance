<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>d0sbbhnez5 — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<h1>Tree Hustler</h1>

<div id="statsCtn" style="display:flex; justify-content:center; gap:0.5em; flex-wrap:wrap; margin:1em; font-family:Segoe UI, Tahoma, Geneva, Verdana, sans-serif;">
  <div style="padding:0.5em 1em; border:1px solid currentColor; border-radius:6px; min-width:90px;">
    🪵 Logs<br><b id="logsEl">0</b>
  </div>
  <div style="padding:0.5em 1em; border:1px solid currentColor; border-radius:6px; min-width:90px;">
    💰 Money<br>$<b id="moneyEl">0</b>
  </div>
  <div style="padding:0.5em 1em; border:1px solid currentColor; border-radius:6px; min-width:90px;">
    ⚡ Logs/sec<br><b id="lpsEl">0</b>
  </div>
  <div style="padding:0.5em 1em; border:1px solid currentColor; border-radius:6px; min-width:90px;">
    🪓 Chop Power<br><b id="powerEl">1</b>
  </div>
  <div style="padding:0.5em 1em; border:1px solid currentColor; border-radius:6px; min-width:90px;">
    📈 Sell Price<br>$<b id="priceEl">1</b>/log
  </div>
</div>

<div id="tabBtnCtn" style="margin:1em;">
  <button onclick="switchTab('chop')">🌲 Chop</button>
  <button onclick="switchTab('shop')">🛒 Shop</button>
  <button onclick="switchTab('build')">🏗️ Build</button>
</div>

<div id="chopTabCtn">
  <button id="treeBtn" onclick="chop()" style="font-size:6em; cursor:pointer; background:none; border:none; user-select:none; transition:transform 0.05s;">🌲</button>
  <br><br>
  <button onclick="sellLogs()" style="font-size:1.1em; padding:0.5em 1.5em;">Sell All Logs</button>
  <p style="color:#888; font-size:0.9em;">Click the tree to chop. Sell logs for cash. Spend cash on gear, spend logs on structures.</p>
</div>

<div id="shopTabCtn" hidden>
  <h3>Upgrades (Buy with Money)</h3>
  <div id="shopListEl" style="display:flex; flex-direction:column; gap:0.5em; align-items:center; margin-bottom:1em;"></div>
</div>

<div id="buildTabCtn" hidden>
  <h3>Structures (Build with Logs)</h3>
  <div id="buildListEl" style="display:flex; flex-direction:column; gap:0.5em; align-items:center; margin-bottom:1em;"></div>
</div>

<script>
  let logs = 0;
  let money = 0;
  let chopPower = 1;

  let upgrades = [
    {id:'axe1', name:'Sharper Axe', baseCost:10, scale:1.2, type:'power', amount:1, bought:0},
    {id:'auto1', name:'Lumberjack', baseCost:50, scale:1.3, type:'lps', amount:1, bought:0},
    {id:'axe2', name:'Heavy Axe', baseCost:200, scale:1.25, type:'power', amount:5, bought:0},
    {id:'auto2', name:'Logging Crew', baseCost:1000, scale:1.35, type:'lps', amount:10, bought:0},
    {id:'axe3', name:'Diamond Axe', baseCost:5000, scale:1.3, type:'power', amount:25, bought:0},
    {id:'auto3', name:'Chainsaw Gang', baseCost:20000, scale:1.4, type:'lps', amount:50, bought:0},
  ];

  let structures = [
    {id:'shack', name:'Wood Shed', baseCost:20, scale:1.5, type:'lps', amount:1, count:0},
    {id:'mill', name:'Sawmill', baseCost:100, scale:1.6, type:'lps', amount:5, count:0},
    {id:'camp', name:'Logging Camp', baseCost:500, scale:1.7, type:'lps', amount:20, count:0},
    {id:'market', name:'Market Stand', baseCost:100, scale:1.8, type:'price', amount:0.5, count:0},
    {id:'factory', name:'Timber Factory', baseCost:2000, scale:1.9, type:'lps', amount:100, count:0},
  ];

  function getUpgCost(u) { return Math.floor(u.baseCost * Math.pow(u.scale, u.bought)); }
  function getStrCost(s) { return Math.floor(s.baseCost * Math.pow(s.scale, s.count)); }

  function calcLps() {
    let total = 0;
    for(let u of upgrades) if(u.type === 'lps') total += u.amount * u.bought;
    for(let s of structures) if(s.type === 'lps') total += s.amount * s.count;
    return total;
  }

  function calcSellPrice() {
    let price = 1;
    for(let s of structures) if(s.type === 'price') price += s.amount * s.count;
    return price;
  }

  function calcPower() {
    let p = chopPower;
    for(let u of upgrades) if(u.type === 'power') p += u.amount * u.bought;
    return p;
  }

  function chop() {
    logs += calcPower();
    renderTop();
    treeBtn.style.transform = 'scale(0.92)';
    setTimeout(() => treeBtn.style.transform = 'scale(1)', 80);
  }

  function sellLogs() {
    if(logs <= 0) return;
    let price = calcSellPrice();
    money += logs * price;
    logs = 0;
    renderAll();
  }

  function buyUpgrade(i) {
    let u = upgrades[i];
    let cost = getUpgCost(u);
    if(money >= cost) {
      money -= cost;
      u.bought++;
      renderAll();
    }
  }

  function buyStructure(i) {
    let s = structures[i];
    let cost = getStrCost(s);
    if(logs >= cost) {
      logs -= cost;
      s.count++;
      renderAll();
    }
  }

  function renderTop() {
    logsEl.textContent = Math.floor(logs);
    moneyEl.textContent = Math.floor(money);
    lpsEl.textContent = calcLps().toFixed(1);
    powerEl.textContent = calcPower();
    priceEl.textContent = calcSellPrice().toFixed(2);
  }

  function renderShop() {
    let html = '';
    for(let i = 0; i < upgrades.length; i++) {
      let u = upgrades[i];
      let cost = getUpgCost(u);
      let ok = money >= cost;
      let effect = u.type === 'power' ? '+' + u.amount + ' chop' : '+' + u.amount + ' logs/sec';
      html += '<button class="buyBtn" ' + (ok ? '' : 'disabled') + ' onclick="buyUpgrade(' + i + ')">' + u.name + ' (' + effect + ') — $' + cost + ' (Own: ' + u.bought + ')</button>';
    }
    shopListEl.innerHTML = html;
  }

  function renderBuild() {
    let html = '';
    for(let i = 0; i < structures.length; i++) {
      let s = structures[i];
      let cost = getStrCost(s);
      let ok = logs >= cost;
      let effect = s.type === 'lps' ? '+' + s.amount + ' logs/sec' : '+' + s.amount + ' sell price';
      html += '<button class="buyBtn" ' + (ok ? '' : 'disabled') + ' onclick="buyStructure(' + i + ')">' + s.name + ' (' + effect + ') — ' + cost + ' logs (Built: ' + s.count + ')</button>';
    }
    buildListEl.innerHTML = html;
  }

  function renderAll() {
    renderTop();
    renderShop();
    renderBuild();
  }

  function switchTab(tab) {
    chopTabCtn.hidden = tab !== 'chop';
    shopTabCtn.hidden = tab !== 'shop';
    buildTabCtn.hidden = tab !== 'build';
  }

  setInterval(() => {
    let lps = calcLps();
    if(lps > 0) logs += lps;
    renderAll();
  }, 1000);

  setInterval(() => {
    let data = {logs, money, chopPower, upgrades, structures};
    localStorage.treeHustlerSave = JSON.stringify(data);
  }, 10000);

  function load() {
    if(localStorage.treeHustlerSave) {
      try {
        let data = JSON.parse(localStorage.treeHustlerSave);
        if(typeof data.logs === 'number') logs = data.logs;
        if(typeof data.money === 'number') money = data.money;
        if(typeof data.chopPower === 'number') chopPower = data.chopPower;
        if(data.upgrades) upgrades = data.upgrades;
        if(data.structures) structures = data.structures;
      } catch(e) {}
    }
  }
  load();

  switchTab('chop');
  renderAll();
</script>

<style>
  html { color-scheme: light dark; }
  body { font-family: Segoe UI, Tahoma, Geneva, Verdana, sans-serif; }
  .buyBtn { padding: 0.6em 1.2em; min-width: 320px; cursor: pointer; font-size: 1em; border: 1px solid #888; border-radius: 6px; background: transparent; color: inherit; text-align: left; }
  .buyBtn:disabled { opacity: 0.4; cursor: not-allowed; }
</style>
</body>
</html>
