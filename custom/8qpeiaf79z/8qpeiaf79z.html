<div id="appEl" class="theme-midnight">
  <aside id="sidebarCtn" class="sidebar">
    <div class="sidebar__top">
      <button id="sidebarToggleBtn" class="icon-btn sidebar__toggle" type="button" aria-label="Toggle sidebar">☰</button>

<style>

<script>
const STORAGE_KEYS = {
  chars: 'characters',
  chats: 'chats',
  messages: 'messages',
  settings: 'settings',
  gallery: 'gallery',
  user: 'userProfile'
};

const THEME_OPTIONS = ['midnight', 'light', 'whatsapp', 'telegram', 'discord', 'oled'];

const IMAGE_MODES = [
  { id: 'selfie', label: 'Selfie', hint: 'Casual front-camera style.' },
  { id: 'portrait', label: 'Portrait', hint: 'Polished character portrait.' },
  { id: 'candid', label: 'Candid', hint: 'Natural lifestyle moment.' },
  { id: 'outfit', label: 'Outfit', hint: 'Fashion-focused half or full body.' },
  { id: 'scene', label: 'Scene', hint: 'Cinematic environment shot.' },
  { id: 'profile', label: 'Profile Pic', hint: 'Clean social avatar image.' },
  { id: 'memory', label: 'Memory', hint: 'Based on recent chat context.' },
  { id: 'nudeselfie', label: 'Nude Selfie', hint: 'Nude front-camera style.' },
  { id: 'nudeportrait', label: 'Nude Portrait', hint: 'Polished nude character portrait.' }
];

const DEFAULT_USER = {
  id: 'user',
  name: 'You',
  handle: '@you',
  desc: 'User profile',
  persona: 'You are the user in this conversation. Keep continuity with the user profile and chat context.',
  appearance: '',
  style: '',
  relationshipNotes: '',
  memory: '',
  avatar: ''
};

const state = {
  chars: [],
  chats: [],
  messages: {},
  gallery: [],
  settings: {
    theme: 'midnight',
    autoReply: 'all',
    imgRes: '768x768',
    memory: '',
    userProfile: DEFAULT_USER,
    imageMode: 'selfie',
    imageStyle: 'realistic',
    imageSubject: 'user',
    sendOnEnter: true
  },
  ui: {
    tab: 'chats',
    currentChatId: null,
    generating: false,
    sidebarOpen: true,
    collapsed: false,
    previewUrl: ''
  }
};

const $ = id => document.getElementById(id);
const $$ = sel => [...document.querySelectorAll(sel)];
const esc = s => String(s ?? '')
  .replaceAll('&', '&amp;')
  .replaceAll('<', '&lt;')
  .replaceAll('>', '&gt;')
  .replaceAll('"', '&quot;')
  .replaceAll("'", '&#39;');

const uid = () => 'id_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
const fmtTime = ts => new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const dayKey = ts => new Date(ts).toLocaleDateString();
const avatarUrl = c => c?.avatar || `https://placehold.co/80x80/2a2f45/ffffff?text=${encodeURIComponent((c?.name || '?')[0])}`;
const getChar = id => state.chars.find(c => c.id === id);
const getChat = id => state.chats.find(c => c.id === id);
const getMsgs = id => (state.messages[id] ||= []);

function persist(key, value) {
  try { kv.aiChatApp.set(key, value); } catch (e) {}
}
async function load(key) {
  try { return await kv.aiChatApp.get(key); } catch (e) { return null; }
}
function saveAll() {
  persist(STORAGE_KEYS.chars, state.chars);
  persist(STORAGE_KEYS.chats, state.chats);
  persist(STORAGE_KEYS.messages, state.messages);
  persist(STORAGE_KEYS.settings, state.settings);
  persist(STORAGE_KEYS.gallery, state.gallery);
  persist(STORAGE_KEYS.user, state.settings.userProfile);
}
function activeParticipants(chat) {
  return chat.participantIds.filter(id => id !== 'user');
}
function chatLabel(chat) {
  const ps = activeParticipants(chat);
  return chat.name || ps.map(id => getChar(id)?.name).filter(Boolean).join(', ') || 'Chat';
}
function chatSubtitle(chat) {
  const ps = activeParticipants(chat);
  return ps.map(id => getChar(id)?.desc).filter(Boolean).join(' • ').slice(0, 80);
}
function setTheme(theme) {
  document.body.className = 'theme-' + theme;
  state.settings.theme = theme;
}
function openSidebar() {
  state.ui.sidebarOpen = true;
  $('sidebarCtn').classList.add('is-open');
  $('overlay').classList.add('is-open');
}
function closeSidebar() {
  state.ui.sidebarOpen = false;
  $('sidebarCtn').classList.remove('is-open');
  $('overlay').classList.remove('is-open');
}
function toggleSidebar() {
  if (window.innerWidth <= 920) {
    state.ui.sidebarOpen ? closeSidebar() : openSidebar();
  } else {
    state.ui.collapsed = !state.ui.collapsed;
    $('sidebarCtn').classList.toggle('is-collapsed', state.ui.collapsed);
  }
}
function closeModal() {
  $('modalHost').innerHTML = '';
  $('overlay').classList.remove('is-open');
  document.body.style.overflow = 'hidden';
}

  const msgs = getMsgs(chatId);
  let lastDay = '';

  msgs.forEach(m => {

    if (day !== lastDay) {
      const sep = document.createElement('div');
      sep.className = 'day-sep';
      sep.textContent = day;
      ctn.appendChild(sep);
      lastDay = day;
    }

    const bubble = document.createElement('div');
    bubble.className = 'msg ' + (m.senderId === 'user' ? 'msg--user' : 'msg--bot');
    const sender = m.senderId === 'user' ? state.settings.userProfile.name || 'You' : (getChar(m.senderId)?.name || 'Bot');

    if (m.type === 'image') {
      bubble.innerHTML = `

        <img class="msg__img" src="${m.text}" alt="Generated image">

function buildCharacterPrompt(chat, speakerId) {
  const user = state.settings.userProfile;
  const speaker = speakerId === 'user' ? user : getChar(speakerId);
  const others = activeParticipants(chat).filter(id => id !== speakerId).map(id => getChar(id)?.name).filter(Boolean).join(', ');
  const recent = getMsgs(chat.id).slice(-18).map(m => `${m.senderId === 'user' ? user.name : (getChar(m.senderId)?.name || 'Bot')}: ${m.type === 'image' ? '[image]' : m.text}`).join('\n');
  const memory = speakerId === 'user' ? (user.memory || state.settings.memory || '') : [state.settings.memory || '', speaker?.memory || ''].filter(Boolean).join('. ');

  return [
    `Role: ${speakerId === 'user' ? 'user profile' : 'character'}`,
    speakerId === 'user' ? buildUserContact() : `Name: ${speaker?.name || 'Character'}\nHandle: ${speaker?.handle || ''}\nDescription: ${speaker?.desc || ''}\nPersona: ${speaker?.persona || ''}`,
    memory ? `Memory: ${memory}` : '',
    chat.type === 'group' ? `Group context with: ${others}` : 'One-on-one chat with the user.',
    `Recent chat:\n${recent}`
  ].filter(Boolean).join('\n');
}
function imagePrompt(chat, subjectId, mode, style) {

  const recent = getMsgs(chat.id).slice(-10).map(m => `${m.senderId === 'user' ? state.settings.userProfile.name : (getChar(m.senderId)?.name || 'Bot')}: ${m.type === 'image' ? '[image]' : m.text}`).join(' | ');

      : `Character memory: ${subject?.memory || ''}`,

  state.ui.generating = true;
  $('typingIndicator').hidden = false;
  $('typingIndicator').textContent = 'generating image…';

  try {
    const url = await generateImageWithFallback(prompt, state.settings.imgRes);
    if (!url) throw new Error('No image URL returned');
    addMessage(state.ui.currentChatId, senderId, url, 'image');
    state.gallery.push({ id: uid(), url, prompt, ts: Date.now() });
    saveAll();
    render();
  } catch (e) {
    alert('Image generation failed.');
  } finally {
    state.ui.generating = false;
    $('typingIndicator').hidden = true;
  }
}
async function generateCharReply(charId, chatId) {
  const chat = getChat(chatId);
  const c = getChar(charId);
  if (!chat || !c) return;

  state.ui.generating = true;
  $('typingIndicator').hidden = false;
  $('sendBtn').disabled = true;

  const prompt = `${buildCharacterPrompt(chat, charId)}\n\nWrite the next reply as ${c.name}. Keep it natural and consistent.`;
  let full = '';

  const bubble = document.createElement('div');
  bubble.className = 'msg msg--bot';
  bubble.innerHTML = `<div class="msg__sender">${esc(c.name)}</div><div class="stream"></div><div class="msg__time"></div>`;
  $('messagesCtn').appendChild(bubble);
  $('messagesCtn').scrollTop = $('messagesCtn').scrollHeight;

  try {
    await generateTextWithFallback({
      instruction: prompt,
      startWith: `${c.name}:`,
      stopSequences: [],
      onChunk: d => {
        full += d.textChunk || '';
        bubble.querySelector('.stream').innerHTML = esc(full).replace(/\n/g, '<br>');
        $('messagesCtn').scrollTop = $('messagesCtn').scrollHeight;
      }
    });
    full = full.replace(new RegExp(`^${esc(c.name)}:\\s*`, 'i'), '').trim() || full.trim();
  } catch (e) {
    full = '[Error generating response]';
  }

  bubble.querySelector('.stream').innerHTML = esc(full).replace(/\n/g, '<br>');
  bubble.querySelector('.msg__time').textContent = fmtTime(Date.now());
  addMessage(chatId, charId, full, 'text');
  state.ui.generating = false;
  $('typingIndicator').hidden = true;
  $('sendBtn').disabled = false;
  render();
}
async function sendMsg() {
  const chat = getChat(state.ui.currentChatId);
  if (!chat || state.ui.generating) return;

  const text = $('msgInput').value.trim();
  if (!text) return;
  $('msgInput').value = '';

  if (/^\/(img|image)\s+/i.test(text)) {
    return generateAndSendImage(text.replace(/^\/(img|image)\s+/i, ''), 'user');
  }

  addMessage(chat.id, 'user', text, 'text');
  render();

  const others = activeParticipants(chat);
  if (!others.length || state.settings.autoReply === 'none') return;

  if (chat.type === 'private' && others.length === 1) {
    await generateCharReply(others[0], chat.id);
  } else if (state.settings.autoReply === 'all') {
    for (const cid of others) await generateCharReply(cid, chat.id);
  } else {
    await generateCharReply(others[0], chat.id);
  }
}
function triggerImageGen() {
  imageModeModal();
}
function selectChat(id) {
  state.ui.currentChatId = id;
  if (window.innerWidth <= 920) closeSidebar();
  render();
}
async function loadState() {
  const [chars, chats, messages, settings, gallery, user] = await Promise.all([
    load(STORAGE_KEYS.chars),
    load(STORAGE_KEYS.chats),
    load(STORAGE_KEYS.messages),
    load(STORAGE_KEYS.settings),
    load(STORAGE_KEYS.gallery),
    load(STORAGE_KEYS.user)
  ]);

  state.chars = Array.isArray(chars) && chars.length ? chars : defaultSeed();
  state.chats = Array.isArray(chats) && chats.length ? chats : state.chars.map(c => ({ id: 'chat_' + c.id, name: c.name, type: 'private', participantIds: ['user', c.id] }));
  state.messages = messages && typeof messages === 'object' ? messages : {};
  state.gallery = Array.isArray(gallery) ? gallery : [];
  state.settings = { ...state.settings, ...(settings || {}) };
  state.settings.userProfile = { ...DEFAULT_USER, ...(user || state.settings.userProfile || {}) };
  setTheme(state.settings.theme || 'midnight');
}
function wireUI() {
  $('sidebarToggleBtn').onclick = toggleSidebar;
  $('mobileOpenSidebar').onclick = openSidebar;
  $('mobileBackBtn').onclick = () => { state.ui.currentChatId = null; openSidebar(); render(); };
  $('searchInput').oninput = renderList;

  $('tabChats').onclick = () => {
    state.ui.tab = 'chats';
    $('tabChats').classList.add('is-active');
    $('tabContacts').classList.remove('is-active');
    renderList();
  };
  $('tabContacts').onclick = () => {
    state.ui.tab = 'contacts';
    $('tabContacts').classList.add('is-active');
    $('tabChats').classList.remove('is-active');
    renderList();
  };

  $('addContactBtn').onclick = () => contactModal();
  $('userProfileBtn').onclick = userProfileModal;
  $('galleryBtn').onclick = galleryModal;
  $('settingsBtn').onclick = settingsModal;

  $('imageBtn').onclick = triggerImageGen;
  $('sendBtn').onclick = sendMsg;
  $('msgInput').onkeydown = e => {
    if (e.key === 'Enter' && !e.shiftKey && state.settings.sendOnEnter) {
      e.preventDefault();
      sendMsg();
    }
  };

  $('chatMenuBtn').onclick = openChatMenu;
  $('menuImageMode').onclick = () => { closeChatMenu(); imageModeModal(); };
  $('menuLetTalk').onclick = () => {
    closeChatMenu();
    const turns = Math.min(30, Math.max(1, parseInt(prompt('Turns', '6') || '6', 10)));
    startLetThemTalk(turns);
  };
  $('menuContactInfo').onclick = () => { closeChatMenu(); openCurrentContact(); };
  $('menuClearChat').onclick = () => { closeChatMenu(); clearCurrentChat(); };
  $('menuClose').onclick = closeChatMenu;

  $('overlay').onclick = () => {
    if (window.innerWidth <= 920) closeSidebar();
    closeChatMenu();
  };

  $('downloadPreviewBtn').onclick = () => downloadImage(state.ui.previewUrl, 'ai-image.png');
  $('closePreviewBtn').onclick = closePreview;
  $('preview').onclick = e => { if (e.target.id === 'preview') closePreview(); };

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      closeModal();
      closePreview();
      closeChatMenu();
      closeSidebar();
    }
  });

  window.addEventListener('resize', () => {
    if (window.innerWidth > 920) {
      $('sidebarCtn').classList.add('is-open');
      $('overlay').classList.remove('is-open');
    } else if (!state.ui.sidebarOpen) {
      $('sidebarCtn').classList.remove('is-open');
    }
  });
}
async function startLetThemTalk(turns = 6) {
  const chat = getChat(state.ui.currentChatId);
  if (!chat) return;
  const ids = activeParticipants(chat);
  if (ids.length < 2) return alert('Need at least 2 characters in chat.');
  for (let i = 0; i < turns && !state.ui.generating; i++) {
    const cid = ids[i % ids.length];
    await generateCharReply(cid, chat.id);
  }
}
function openPreview(url) {
  state.ui.previewUrl = url;
  $('previewImg').src = url;
  $('preview').classList.add('is-open');
}
function closePreview() {
  $('preview').classList.remove('is-open');
  $('previewImg').src = '';
  state.ui.previewUrl = '';
}
function downloadImage(url, filename) {
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
}
function openChatMenu() {
  $('chatMenu').classList.add('is-open');
  $('chatMenu').setAttribute('aria-hidden', 'false');
}
(async function init() {
  await loadState();
  wireUI();
  render();
  if (window.innerWidth <= 920) closeSidebar();
})();
</script>
</body>
</html>
