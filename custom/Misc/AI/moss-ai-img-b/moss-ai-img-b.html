<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>moss-ai-img-b — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<div id="labCtn"></div>

<script>
let state = {
  ui: { section: "prompt", theme: "dark" },
  prompt: { base: "", enhanced: "", negative: "", mode: "enhance", length: "long" },
  gen: { model: "SDXL", ratio: "1:1", width: 1024, height: 1024, steps: 30, cfg: 7, sampler: "DPM++ 2M", seed: "random", batch: 1, face_fix: true, upscale: false, safety: true },
  random: { chaos: 0.4, recipe: "cinematic" },
  gallery: { items: [], selectedId: null },
  autosave: { enabled: true, key: "ai_t2i_lab_v1" }
};

let subjects = [
  "mysterious wanderer in a foggy forest",
  "retro-futuristic city skyline at dusk",
  "ancient dragon sleeping on a mountain of books",
  "minimalist product shot of wireless headphones",
  "cozy nordic cabin in a snowstorm",
];

let styles = [
  "hyperrealistic",
  "studio lighting",
  "cinematic lighting",
  "soft natural light",
  "digital painting",
  "anime style",
  "pixel art",
];

let moods = [
  "melancholic",
  "hopeful",
  "ominous",
  "serene",
  "whimsical",
];

let cameras = [
  "shot on 35mm film",
  "shot on DSLR, 50mm lens, f1.8",
  "macro photography, 100mm lens",
  "wide angle lens, f4.0",
];

let compositions = [
  "rule of thirds",
  "centered composition",
  "dramatic close-up",
  "wide establishing shot",
];

let negativeBase = [
  "blurry",
  "low quality",
  "distorted",
  "extra limbs",
  "bad anatomy",
  "watermark",
];

function randFrom(list) { return list[Math.floor(Math.random() * list.length)]; }
function maybe(list, chance) { return Math.random() < chance ? randFrom(list) : ""; }
function joinNonEmpty(parts, sep) { return parts.filter(p => p && p.trim()).join(sep); }

function buildRandomPrompt(recipe, chaos) {
  let base = randFrom(subjects);
  let style = randFrom(styles);
  let mood = maybe(moods, 0.7 + chaos * 0.3);
  let camera = maybe(cameras, 0.4 + chaos * 0.4);
  let comp = maybe(compositions, 0.5);
  if (recipe === "portrait") { camera = "portrait photography, 85mm lens, f1.4"; comp = "dramatic close-up"; }
  else if (recipe === "macro") { camera = "macro photography, 100mm lens, f2.8"; }
  else if (recipe === "anime") { style = "highly detailed anime illustration"; }
  else if (recipe === "product") { style = "studio product photography, softbox lighting"; }
  return joinNonEmpty([base, style, mood, camera, comp], ", ");
}

function buildNegativePrompt() { return negativeBase.join(", "); }

function enhancePrompt(base, mode, length) {
  let extraDetail = "";
  if (mode === "detail") extraDetail = ", ultra-detailed, intricate textures, subtle lighting gradients";
  else if (mode === "cinematic") extraDetail = ", cinematic atmosphere, volumetric light, film grain";
  else if (mode === "photo") extraDetail = ", realistic skin tones, natural shadows, lens imperfections";
  let lengthBoost = "";
  if (length === "ultra") lengthBoost = ", extremely detailed, professional concept art quality";
  else if (length === "long") lengthBoost = ", highly detailed, artstation trending";
  return base + extraDetail + lengthBoost;
}

function autosaveState() {
  if (!state.autosave.enabled) return;
  try { localStorage[state.autosave.key] = JSON.stringify(state); } catch (e) {}
}

function loadState() {
  let saved = localStorage[state.autosave.key];
  if (!saved) return;
  try { state = JSON.parse(saved); } catch (e) {}
}

async function performGeneration(prompt, negative) {
  let cfgSeed = state.gen.seed === "random" ? Math.floor(Math.random() * 999999999) : parseInt(state.gen.seed, 10);
  let resMap = {"1:1":"768x768","16:9":"768x512","9:16":"512x768","4:5":"768x768"};
  let resolution = resMap[state.gen.ratio] || "768x768";
  let btn = generateBtnEl;
  if (btn) { btn.disabled = true; btn.textContent = "⏳ Generating..."; }
  let dataUrl;
  try {
    dataUrl = await generateImage(prompt, {resolution: resolution});
  } catch (e) {
    console.error("generateImage failed:", e);
    if (btn) { btn.disabled = false; btn.textContent = "❌ Failed"; }
    return;
  }
  if (btn) { btn.disabled = false; btn.textContent = "🚀 Generate"; }
  let ts = new Date().toISOString();
  let id = ts + "_" + Math.random().toString(36).slice(2);
  state.gallery.items.unshift({id, url: dataUrl, prompt: prompt, negative: negative, model: state.gen.model, seed: cfgSeed, steps: state.gen.steps, cfg: state.gen.cfg, sampler: state.gen.sampler, ratio: state.gen.ratio, ts: ts});
  autosaveState();
  setSection("gallery");
}

function renderHeader() {
  return `
    <div class="lab-header">
      <div class="lab-title">AI Text-to-Image Lab</div>
      <div class="lab-tabs">
        <button onclick="setSection('prompt')" ${state.ui.section === "prompt" ? "class='active'" : ""}>Prompt</button>
        <button onclick="setSection('enhance')" ${state.ui.section === "enhance" ? "class='active'" : ""}>Enhancer</button>
        <button onclick="setSection('generate')" ${state.ui.section === "generate" ? "class='active'" : ""}>Generate</button>
        <button onclick="setSection('gallery')" ${state.ui.section === "gallery" ? "class='active'" : ""}>Gallery</button>
        <button onclick="setSection('settings')" ${state.ui.section === "settings" ? "class='active'" : ""}>Settings</button>
      </div>
    </div>
  `;
}

function renderPromptSection() {
  let randomPrompt = buildRandomPrompt(state.random.recipe, state.random.chaos);
  return `
    <div class="section">
      <h2>Prompt Builder</h2>
      <textarea onchange="setBasePrompt(this.value)" placeholder="Describe the image you want...">${state.prompt.base}</textarea>
      <div class="row">
        <button onclick="useRandomPrompt()">🎲 Random prompt</button>
        <button onclick="copyPrompt()">Copy prompt</button>
      </div>
      <div class="hint">Example random prompt: <em>${randomPrompt}</em></div>
    </div>
  `;
}

function renderEnhanceSection() {
  let enhancedPreview = enhancePrompt(state.prompt.base || buildRandomPrompt(state.random.recipe, state.random.chaos), state.prompt.mode, state.prompt.length);
  return `
    <div class="section">
      <h2>Prompt Enhancer</h2>
      <label>Mode:
        <select onchange="setEnhanceMode(this.value)">
          <option ${state.prompt.mode === "enhance" ? "selected" : ""} value="enhance">Enhance</option>
          <option ${state.prompt.mode === "rewrite" ? "selected" : ""} value="rewrite">Rewrite</option>
          <option ${state.prompt.mode === "detail" ? "selected" : ""} value="detail">Detail Boost</option>
          <option ${state.prompt.mode === "cinematic" ? "selected" : ""} value="cinematic">Cinematic</option>
          <option ${state.prompt.mode === "photo" ? "selected" : ""} value="photo">Photographic</option>
        </select>
      </label>
      <label>Length:
        <select onchange="setEnhanceLength(this.value)">
          <option ${state.prompt.length === "short" ? "selected" : ""} value="short">Short</option>
          <option ${state.prompt.length === "medium" ? "selected" : ""} value="medium">Medium</option>
          <option ${state.prompt.length === "long" ? "selected" : ""} value="long">Long</option>
          <option ${state.prompt.length === "ultra" ? "selected" : ""} value="ultra">Ultra-detailed</option>
        </select>
      </label>
      <div class="preview">
        <strong>Enhanced preview:</strong>
        <p>${enhancedPreview}</p>
      </div>
      <button onclick="applyEnhancedPrompt()">Apply to generator</button>
    </div>
  `;
}

function renderGenerateSection() {
  let effectivePrompt = state.prompt.enhanced || state.prompt.base || buildRandomPrompt(state.random.recipe, state.random.chaos);
  let negative = state.prompt.negative || buildNegativePrompt();
  return `
    <div class="section">
      <h2>Generate Image</h2>
      <div class="row">
        <label>Model:
          <select onchange="setModel(this.value)">
            <option ${state.gen.model === "SDXL" ? "selected" : ""} value="SDXL">SDXL</option>
            <option ${state.gen.model === "Flux" ? "selected" : ""} value="Flux">Flux</option>
            <option ${state.gen.model === "SD1.5" ? "selected" : ""} value="SD1.5">SD 1.5</option>
            <option ${state.gen.model === "Anime" ? "selected" : ""} value="Anime">Anime</option>
          </select>
        </label>
        <label>Ratio:
          <select onchange="setRatio(this.value)">
            <option ${state.gen.ratio === "1:1" ? "selected" : ""} value="1:1">1:1</option>
            <option ${state.gen.ratio === "16:9" ? "selected" : ""} value="16:9">16:9</option>
            <option ${state.gen.ratio === "9:16" ? "selected" : ""} value="9:16">9:16</option>
            <option ${state.gen.ratio === "4:5" ? "selected" : ""} value="4:5">4:5</option>
          </select>
        </label>
      </div>
      <div class="row">
        <label>Steps: <input type="number" min="5" max="60" value="${state.gen.steps}" onchange="setSteps(this.value)" /></label>
        <label>CFG: <input type="number" min="1" max="15" step="0.5" value="${state.gen.cfg}" onchange="setCfg(this.value)" /></label>
        <label>Seed: <input type="text" value="${state.gen.seed}" onchange="setSeed(this.value)" placeholder="random or number" /></label>
        <label>Batch: <input type="number" min="1" max="8" value="${state.gen.batch}" onchange="setBatch(this.value)" /></label>
      </div>
      <div class="row">
        <label><input type="checkbox" ${state.gen.face_fix ? "checked" : ""} onchange="toggleFaceFix(this.checked)" /> Face fix</label>
        <label><input type="checkbox" ${state.gen.upscale ? "checked" : ""} onchange="toggleUpscale(this.checked)" /> Upscale</label>
        <label><input type="checkbox" ${state.gen.safety ? "checked" : ""} onchange="toggleSafety(this.checked)" /> Safety filter</label>
      </div>
      <div class="preview">
        <strong>Prompt:</strong>
        <p>${effectivePrompt}</p>
        <strong>Negative:</strong>
        <p>${negative}</p>
      </div>
      <button id="generateBtnEl" class="generate-btn" onclick="doGenerate()">🚀 Generate</button>
    </div>
  `;
}

function renderGallerySection() {
  if (!state.gallery.items.length) {
    return `<div class="section"><h2>Gallery</h2><p>No images yet. Generate something first.</p></div>`;
  }
  let cards = state.gallery.items.map(item => `
    <div class="card">
      <img src="${item.url}" />
      <div class="meta">
        <div><strong>Prompt:</strong> ${item.prompt}</div>
        <div><strong>Model:</strong> ${item.model} | <strong>Seed:</strong> ${item.seed}</div>
        <div><strong>Steps/CFG:</strong> ${item.steps}/${item.cfg}</div>
        <button onclick="downloadImage('${item.url}')">Download</button>
        <button onclick="copyText(decodeURIComponent('${encodeURIComponent(item.prompt)}'))">Copy prompt</button>
      </div>
    </div>
  `).join("");
  return `
    <div class="section">
      <h2>Gallery</h2>
      <div class="gallery-grid">${cards}</div>
    </div>
  `;
}

function renderSettingsSection() {
  return `
    <div class="section">
      <h2>Settings</h2>
      <label>Theme:
        <select onchange="setTheme(this.value)">
          <option ${state.ui.theme === "dark" ? "selected" : ""} value="dark">Dark</option>
          <option ${state.ui.theme === "light" ? "selected" : ""} value="light">Light</option>
        </select>
      </label>
      <label><input type="checkbox" ${state.autosave.enabled ? "checked" : ""} onchange="toggleAutosave(this.checked)" /> Autosave session</label>
      <button onclick="resetSession()">Reset session</button>
    </div>
  `;
}

function setSection(sec) { state.ui.section = sec; autosaveState(); render(); }
function setBasePrompt(v) { state.prompt.base = v; autosaveState(); }
function useRandomPrompt() { state.prompt.base = buildRandomPrompt(state.random.recipe, state.random.chaos); autosaveState(); render(); }
function copyPrompt() { copyText(state.prompt.base); }
function setEnhanceMode(v) { state.prompt.mode = v; autosaveState(); render(); }
function setEnhanceLength(v) { state.prompt.length = v; autosaveState(); render(); }
function applyEnhancedPrompt() {
  state.prompt.enhanced = enhancePrompt(state.prompt.base || buildRandomPrompt(state.random.recipe, state.random.chaos), state.prompt.mode, state.prompt.length);
  autosaveState(); render();
}
function setModel(v) { state.gen.model = v; autosaveState(); render(); }
function setRatio(v) {
  state.gen.ratio = v;
  if (v === "1:1") { state.gen.width = 1024; state.gen.height = 1024; }
  else if (v === "16:9") { state.gen.width = 1280; state.gen.height = 720; }
  else if (v === "9:16") { state.gen.width = 720; state.gen.height = 1280; }
  else if (v === "4:5") { state.gen.width = 1024; state.gen.height = 1280; }
  autosaveState(); render();
}
function setSteps(v) { state.gen.steps = parseInt(v, 10); autosaveState(); }
function setCfg(v) { state.gen.cfg = parseFloat(v); autosaveState(); }
function setSeed(v) { state.gen.seed = v || "random"; autosaveState(); }
function setBatch(v) { state.gen.batch = parseInt(v, 10); autosaveState(); }
function toggleFaceFix(b) { state.gen.face_fix = b; autosaveState(); }
function toggleUpscale(b) { state.gen.upscale = b; autosaveState(); }
function toggleSafety(b) { state.gen.safety = b; autosaveState(); }
function setTheme(v) { state.ui.theme = v; autosaveState(); render(); }
function toggleAutosave(b) { state.autosave.enabled = b; autosaveState(); }
function resetSession() { state.gallery.items = []; state.prompt.base = ""; state.prompt.enhanced = ""; autosaveState(); render(); }

function doGenerate() {
  let prompt = state.prompt.enhanced || state.prompt.base || buildRandomPrompt(state.random.recipe, state.random.chaos);
  let negative = state.prompt.negative || buildNegativePrompt();
  performGeneration(prompt, negative).catch(err => {
    console.error("Unhandled generation error:", err);
  });
}

function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).catch(() => {});
  } else {
    let ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
  }
}

function downloadImage(url) {
  let a = document.createElement("a");
  a.href = url;
  a.download = "ai_image_" + Date.now() + ".png";
  a.click();
}

function render() {
  labCtn.innerHTML = `
    <div class="lab lab-${state.ui.theme}">
      ${renderHeader()}
      ${state.ui.section === "prompt" ? renderPromptSection() : ""}
      ${state.ui.section === "enhance" ? renderEnhanceSection() : ""}
      ${state.ui.section === "generate" ? renderGenerateSection() : ""}
      ${state.ui.section === "gallery" ? renderGallerySection() : ""}
      ${state.ui.section === "settings" ? renderSettingsSection() : ""}
    </div>
  `;
}

loadState();
render();
</script>

<style>
body { text-align: left; font-family: system-ui, -apple-system, sans-serif; margin: 0; }
.lab { max-width: 900px; margin: 0 auto; padding: 20px; min-height: 100vh; }
.lab-dark { background: #1a1a1a; color: #eee; }
.lab-light { background: #f5f5f5; color: #222; }
.lab-header { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; border-bottom: 1px solid #444; padding-bottom: 10px; margin-bottom: 20px; }
.lab-light .lab-header { border-color: #ccc; }
.lab-title { font-size: 1.5rem; font-weight: bold; }
.lab-tabs { display: flex; gap: 5px; flex-wrap: wrap; }
.lab-tabs button { background: #333; color: #eee; border: 1px solid #555; padding: 6px 14px; cursor: pointer; border-radius: 4px; }
.lab-light .lab-tabs button { background: #e0e0e0; color: #222; border-color: #bbb; }
.lab-tabs button.active { background: #4a86ff; color: #fff; border-color: #4a86ff; }
.section h2 { margin-top: 0; font-size: 1.2rem; border-bottom: 1px solid #444; padding-bottom: 6px; }
.lab-light .section h2 { border-color: #ccc; }
textarea { width: 100%; min-height: 80px; background: #222; color: #eee; border: 1px solid #555; border-radius: 4px; padding: 8px; font-family: inherit; font-size: 0.95rem; box-sizing: border-box; }
.lab-light textarea { background: #fff; color: #222; border-color: #bbb; }
.row { display: flex; flex-wrap: wrap; gap: 10px; margin: 10px 0; align-items: center; }
label { display: flex; align-items: center; gap: 6px; font-size: 0.9rem; }
select, input[type="number"], input[type="text"] { background: #222; color: #eee; border: 1px solid #555; border-radius: 4px; padding: 4px 8px; }
.lab-light select, .lab-light input { background: #fff; color: #222; border-color: #bbb; }
button { background: #2d2d2d; color: #eee; border: 1px solid #555; padding: 6px 12px; cursor: pointer; border-radius: 4px; font-size: 0.9rem; }
button:hover { opacity: 0.9; }
.lab-light button { background: #ddd; color: #222; border-color: #bbb; }
.generate-btn { background: #4a86ff; color: #fff; font-size: 1rem; padding: 8px 20px; border: none; margin-top: 6px; }
.generate-btn:disabled { background: #666; cursor: wait; }
.preview { background: #222; border: 1px solid #444; padding: 10px; border-radius: 4px; margin: 10px 0; font-size: 0.9rem; line-height: 1.4; }
.lab-light .preview { background: #fff; border-color: #ddd; }
.hint { font-size: 0.85rem; color: #aaa; margin-top: 8px; }
.lab-light .hint { color: #666; }
.gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.card { background: #222; border: 1px solid #444; border-radius: 6px; overflow: hidden; }
.lab-light .card { background: #fff; border-color: #ddd; }
.card img { width: 100%; height: 180px; object-fit: cover; display: block; background: #333; }
.card .meta { padding: 10px; font-size: 0.8rem; line-height: 1.3; }
.card .meta button { margin-top: 6px; margin-right: 4px; padding: 4px 8px; font-size: 0.75rem; }
</style>
</body>
</html>
