<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>the-perchance-editor — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<div class="editor-container">
  <div class="top-bar">
    <button id="saveBtn">Save</button>
    <button id="settingsBtn" hidden>Settings</button>
    <button id="accountBtn" hidden>Account</button>
    <button id="communityBtn">Community</button>
  </div>
  
  <div class="editor-grid">
    <!-- Lists Panel -->
    <div class="panel" id="listsPanel">
      <div class="panel-header">Lists</div>
      <div class="panel-content">
        <textarea id="listsTextarea">// Write your lists here
// Example lists:
animal = {
  cat | dog | bird | fish | rabbit
}

color = {
  red | blue | green | yellow
}

output = {
  A [color] [animal] is here.
}</textarea>
      </div>
    </div>
    
    <!-- Preview Panel -->
    <div class="panel" id="previewPanelEl">
      <div class="panel-header">
        Preview
        <div class="preview-controls">
          <label>
            <input type="checkbox" id="autoUpdateCheckbox" checked> Auto-update
          </label>
          <button id="reloadPreviewBtn">Reload</button>
          <button id="fullscreenBtn">Fullscreen</button>
        </div>
      </div>
      <div class="panel-content">
        <div id="previewContent">
          <p>Preview will appear here as you type...</p>
        </div>
      </div>
    </div>
    
    <!-- Tester Panel -->
    <div class="panel" id="testerPanel">
      <div class="panel-header">Tester</div>
      <div class="panel-content">
        <input type="text" id="testerInput" placeholder="Test expressions like [animal]">
        <button id="testBtn">Test</button>
        <button id="clearTesterBtn">Clear</button>
        <div id="testerOutput">Results will appear here...</div>
      </div>
    </div>
    
    <!-- HTML Panel -->
    <div class="panel" id="htmlPanel">
      <div class="panel-header">HTML</div>
      <div class="panel-content">
        <textarea id="htmlTextarea">&lt;html&gt;
  &lt;head&gt;
    &lt;title&gt;My Generator&lt;/title&gt;
  &lt;/head&gt;
  &lt;body&gt;
    &lt;h1&gt;My Generator&lt;/h1&gt;
    &lt;p&gt;[output]&lt;/p&gt;
  &lt;/body&gt;
&lt;/html&gt;</textarea>
      </div>
    </div>
  </div>
  
  <style>
    .editor-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    
    .top-bar {
      display: flex;
      gap: 10px;
      padding: 10px;
      background: #f0f0f0;
      border-bottom: 1px solid #ccc;
    }
    
    .editor-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      flex: 1;
      overflow: hidden;
    }
    
    .panel {
      display: flex;
      flex-direction: column;
      border: 1px solid #ccc;
      overflow: hidden;
    }
    
    .panel-header {
      padding: 8px 12px;
      background: #e8e8e8;
      font-weight: 500;
      border-bottom: 1px solid #ccc;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .panel-content {
      flex: 1;
      overflow: auto;
      display: flex;
      flex-direction: column;
    }
    
    textarea {
      flex: 1;
      width: 100%;
      border: none;
      padding: 10px;
      font-family: monospace;
      font-size: 14px;
      resize: none;
    }
    
    #previewContent {
      padding: 15px;
      flex: 1;
      overflow: auto;
    }
    
    .preview-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    #testerPanel .panel-content {
      flex-direction: row;
      align-items: center;
      gap: 10px;
      padding: 10px;
    }
    
    #testerInput {
      flex: 1;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    
    #testBtn, #clearTesterBtn {
      padding: 8px 15px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    
    #clearTesterBtn {
      background: #f44336;
    }
    
    #testBtn:hover {
      background: #45a049;
    }
    
    #clearTesterBtn:hover {
      background: #d32f2f;
    }
    
    #testerOutput {
      padding: 10px;
      background: #f9f9f9;
      border-radius: 4px;
      flex: 1;
      min-height: 40px;
      overflow: auto;
    }
    
    button {
      padding: 6px 12px;
      background: #2196F3;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    
    button:hover {
      background: #0b7dda;
    }
    
    #fullscreenBtn {
      background: #ff9800;
    }
    
    #fullscreenBtn:hover {
      background: #e68a00;
    }
    
    #reloadPreviewBtn {
      background: #607D8B;
    }
    
    #reloadPreviewBtn:hover {
      background: #455A64;
    }
  </style>
  
  <script>
    // Initialize editor state
    let autoUpdate = true;
    let lists = {};
    
    // Save functionality with localStorage
    saveBtn.onclick = function() {
      const editorState = {
        lists: listsTextarea.value,
        html: htmlTextarea.value
      };
      localStorage.setItem('perchanceEditor', JSON.stringify(editorState));
      saveBtn.textContent = "✓ Saved";
      saveBtn.style.background = "#4CAF50";
      setTimeout(() => {
        saveBtn.textContent = "Save";
        saveBtn.style.background = "#2196F3";
      }, 2000);
    };
    
    // Load saved state on startup
    window.onload = function() {
      const savedState = localStorage.getItem('perchanceEditor');
      if (savedState) {
        try {
          const editorState = JSON.parse(savedState);
          listsTextarea.value = editorState.lists || listsTextarea.value;
          htmlTextarea.value = editorState.html || htmlTextarea.value;
          updatePreview();
        } catch (e) {
          console.error("Failed to load saved state:", e);
        }
      }
    };
    
    // Keyboard shortcut for saving (Ctrl+S/Cmd+S)
    document.addEventListener('keydown', function(e) {
      if ((e.ctrlKey || e.metaKey) && e.key === 's') {
        e.preventDefault();
        saveBtn.click();
      }
    });
    
    // Improved Perchance expression parser with recursive evaluation
    function parsePerchanceExpression(expr, lists) {
      // Handle nested expressions by evaluating from inside out
      let result = expr;
      let changed;
      
      do {
        changed = false;
        result = result.replace(/\[([^\]]+)\]/g, (match, exprName) => {
          changed = true;
          const list = lists[exprName];
          
          if (!list || !list.items || list.items.length === 0) {
            return `[${exprName}]`; // Return original if list not found
          }
          
          // Return a random item from the list
          return list.items[Math.floor(Math.random() * list.items.length)];
        });
      } while (changed);
      
      return result;
    }
    
    // Enhanced lists parser with proper multi-line support
    function parseLists(content) {
      const lists = {};
      const lines = content.split('\n');
      let currentList = null;
      let currentItem = [];
      
      lines.forEach((line, index) => {
        const lineNumber = index + 1;
        const trimmedLine = line.trim();
        
        // Skip comments and empty lines
        if (trimmedLine.startsWith('//') || trimmedLine === '') return;
        
        // Match list definition
        const listMatch = trimmedLine.match(/^(\w+)\s*=\s*\{/);
        if (listMatch) {
          currentList = listMatch[1];
          lists[currentList] = { items: [], line: lineNumber };
          currentItem = [];
          return;
        }
        
        // Match closing brace - finalize current item
        if (trimmedLine === '}' && currentList) {
          if (currentItem.length > 0) {
            const itemText = currentItem.join('\n').trim();
            if (itemText) {
              lists[currentList].items.push(itemText);
            }
          }
          currentList = null;
          currentItem = [];
          return;
        }
        
        // Parse list items
        if (currentList) {
          // Handle inline comments
          const cleanLine = trimmedLine.split('//')[0].trim();
          
          // Check for pipe separator
          if (cleanLine.includes('|')) {
            // Add current item if exists
            if (currentItem.length > 0) {
              const itemText = currentItem.join('\n').trim();
              if (itemText) {
                lists[currentList].items.push(itemText);
              }
              currentItem = [];
            }
            
            // Split by pipe and add all items
            const items = cleanLine.split('|')
              .map(item => item.trim())
              .filter(item => item);
            
            items.forEach(item => {
              if (item) {
                lists[currentList].items.push(item);
              }
            });
          } else {
            // Add to current item
            currentItem.push(cleanLine);
          }
        }
      });
      
      return lists;
    }
    
    // Preview update with better error handling
    function updatePreview() {
      if (!autoUpdate) return;
      
      try {
        lists = parseLists(listsTextarea.value);
        let htmlContent = htmlTextarea.value;
        
        // Replace Perchance expressions
        htmlContent = htmlContent.replace(/\[([^\]]+)\]/g, (match, expr) => {
          const result = parsePerchanceExpression(match, lists);
          if (result === match) {
            return `<span style="color:red; background:#fee;">${match}</span>`;
          }
          return result;
        });
        
        // Update preview
        previewContent.innerHTML = htmlContent;
      } catch (error) {
        previewContent.innerHTML = `
          <div style="padding: 20px; border: 2px solid #f44336; border-radius: 4px; background: #ffebee;">
            <h3 style="color: #d32f2f;">Error in Preview</h3>
            <p style="color: #b71c1c;">${error.message}</p>
            <p style="font-size: 0.9em; color: #666;">Please check your lists and HTML for syntax errors.</p>
          </div>
        `;
      }
    }
    
    // Auto-update controls
    autoUpdateCheckbox.onchange = function() {
      autoUpdate = this.checked;
    };
    
    listsTextarea.oninput = updatePreview;
    htmlTextarea.oninput = updatePreview;
    reloadPreviewBtn.onclick = updatePreview;
    
    // Enhanced fullscreen functionality
    fullscreenBtn.onclick = function() {
      const preview = previewPanelEl;
      const requestFullscreen = 
        preview.requestFullscreen || 
        preview.webkitRequestFullscreen || 
        preview.msRequestFullscreen;
      
      if (requestFullscreen) {
        requestFullscreen.call(preview);
      } else {
        alert("Fullscreen not supported in your browser");
      }
    };
    
    // Tester functionality with better UX
    testBtn.onclick = function() {
      const expression = testerInput.value.trim();
      if (!expression) {
        testerOutput.innerHTML = '<span style="color: #f44336;">Please enter an expression</span>';
        return;
      }
      
      try {
        lists = parseLists(listsTextarea.value);
        const result = parsePerchanceExpression(expression, lists);
        
        if (result === expression) {
          testerOutput.innerHTML += `
            <div style="margin-bottom: 8px; padding: 8px; background: #ffebee; border-radius: 4px;">
              <strong>Input:</strong> ${expression}<br>
              <strong>Error:</strong> List not found or invalid expression
            </div>
          `;
        } else {
          testerOutput.innerHTML += `
            <div style="margin-bottom: 8px; padding: 8px; background: #e8f5e9; border-radius: 4px;">
              <strong>Input:</strong> ${expression}<br>
              <strong>Output:</strong> ${result}
            </div>
          `;
        }
      } catch (error) {
        testerOutput.innerHTML += `
          <div style="margin-bottom: 8px; padding: 8px; background: #ffebee; border-radius: 4px;">
            <strong>Input:</strong> ${expression}<br>
            <strong>Error:</strong> ${error.message}
          </div>
        `;
      }
      
      // Scroll to bottom
      testerOutput.scrollTop = testerOutput.scrollHeight;
    };
    
    // Clear tester output
    clearTesterBtn.onclick = function() {
      testerOutput.innerHTML = "Results will appear here...";
    };
    
    // Community button opens in new tab
    communityBtn.onclick = function() {
      window.open('https://lemmy.world/c/perchance', '_blank');
    };
    
    // Initial preview update
    updatePreview();
  </script>
</div>
</body>
</html>
