<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>mythic-gme-2e-meaning-tables — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700&display=swap" rel="stylesheet">
<style>
  body { 
    font-family: 'Barlow Condensed', sans-serif;
    transition: background-color 0.3s, color 0.3s;
  }
  
  /* Light theme variables */
  :root {
    --bg-color: #ffffff;
    --text-color: #000000;
    --input-bg: #ffffff;
    --border-color: #cccccc;
    --button-bg: #f0f0f0;
    --button-hover: #e0e0e0;
    --scrollbar-track: #f0f0f0;
    --scrollbar-thumb: #c0c0c0;
  }
  
  /* Dark theme */
  [data-theme="dark"] {
    --bg-color: #1a1a1a;
    --text-color: #f0f0f0;
    --input-bg: #2a2a2a;
    --border-color: #444444;
    --button-bg: #333333;
    --button-hover: #444444;
    --scrollbar-track: #2a2a2a;
    --scrollbar-thumb: #555555;
  }
  
  body {
    background-color: var(--bg-color);
    color: var(--text-color);
  }
  
  a {
    color: white;
  }
  
  textarea {
    background-color: var(--input-bg);
    color: var(--text-color);
    border: 1px solid var(--border-color);
    transition: background-color 0.3s, color 0.3s, border-color 0.3s;
    padding: 4px 8px;
  }

  button {
    background-color: var(--input-bg);
    color: var(--text-color);
    border: 1px solid var(--border-color);
    transition: background-color 0.3s, color 0.3s, border-color 0.3s;
    padding: 2px 4px; /* Reduced button height */
    display: inline-flex;
    align-items: center; /* Vertical center alignment */
    justify-content: center; /* Horizontal center alignment */
  }
  
  button {
    background-color: var(--button-bg);
  }
  
  button:hover {
    background-color: var(--button-hover);
  }

  /* Style for individual lines in the output buffer */
  .output-line {
    cursor: default;
    padding: 2px 4px;
    border-radius: 2px;
    transition: background-color 0.2s;
    display: flex; /* Enable flexbox to align button and text */
    align-items: center; /* Vertically center the button and text */
  }
  .output-line:hover {
    background-color: var(--button-hover);
  }

  /* Style for the delete button */
  .delete-btn {
    background-color: var(--button-bg); /* Make it look like a button */
    border: 1px solid var(--border-color);
    color: var(--text-color);
    cursor: pointer;
    font-weight: bold;
    font-size: 14px;
    padding: 2px 6px;
    margin-right: 8px; /* Space between x and text */
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .delete-btn:hover {
    background-color: var(--button-hover);
    color: #ff6666;
    border-color: #ff6b6b;
  }

  /* Style for the floating tooltip */
  #tooltipEl {
    position: fixed;
    z-index: 1000;
    background-color: var(--text-color);
    color: var(--bg-color);
    padding: 4px 8px;
    border-radius: 4px;
    pointer-events: none; /* Ensure clicks pass through to the line underneath */
    white-space: nowrap;
    opacity: 0.9;
  }

  /* Scrollbar styling */
  ::-webkit-scrollbar {
    width: 8px;
    height: 8px;
  }
  ::-webkit-scrollbar-track {
    background: var(--scrollbar-track);
  }
  ::-webkit-scrollbar-thumb {
    background: var(--scrollbar-thumb);
    border-radius: 4px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: var(--button-hover);
  }
  
  /* Firefox scrollbar */
  * {
    scrollbar-width: thin;
    scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track);
  }
</style>

<div style="padding:0.5em; background:#555; color:white; font-size:12px; margin-bottom:1em; display:flex; flex-wrap:wrap; gap:0.5em; justify-content:center; align-items:center;">
  <strong>Other Oracles:</strong>
  <a href="https://perchance.org/mkn-oracle">MKN Oracle</a>
  <a href="https://perchance.org/mythic-gme-2e-meaning-tables">MGME2e Tables</a>
  <a href="https://perchance.org/one-page-mythic">One-Page Mythic</a>
  <a href="https://perchance.org/tripleo">Triple-O</a>
</div>

<h1><i><a href="https://www.drivethrurpg.com/en/product/422929/mythic-game-master-emulator-second-edition" style="text-decoration:none;">[title]</a></i></h1>

<!-- Floating tooltip element -->
<div id="tooltipEl" hidden>Click to copy</div>

<!-- Hidden element to evaluate the expression -->
<div id="evalEl" hidden>[o = output.evaluateItem]</div>

<!-- Container to place the button group to the right of the textarea -->
<div style="margin: 1em auto; display: flex; align-items: center; gap: 4px; width: fit-content;">
  <!-- Div for accumulating results (replaced textarea to allow line clicking) -->
  <div id="outputTextArea" style="padding:0.5em; width:340px; height:192px; overflow-y:auto; resize:both; background-color:var(--input-bg); color:var(--text-color); border:1px solid var(--border-color); white-space:pre-wrap; transition: background-color 0.3s, color 0.3s, border-color 0.3s; text-align: left; font-family: 'Barlow Condensed', sans-serif;"></div>
  
  <!-- Wrapper to stack buttons vertically -->
  <div style="display: flex; flex-direction: column; gap: 12px;">
    <!-- Button to copy the textarea contents to clipboard -->
    <button id="copyBtn" onclick="copyOutput()" style="cursor:pointer;">Copy</button>
    <!-- Theme Toggle Checkbox -->
    <label style="display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;">
      <input type="checkbox" id="themeToggle" onchange="toggleTheme()">
      <span>Dark Mode</span>
    </label>
    <!-- Button to clear the textarea -->
    <button onclick="lines=[]; renderLines();" style="cursor:pointer;">Clear</button>
  </div>
</div>

<!-- Replaced select dropdown with a generated button grid -->
<div id="menuButtonsCtn" style="display:flex; flex-wrap:wrap; justify-content:center; gap:4px; margin-bottom:4px;"></div>

<script>
  // Theme toggle function
  function toggleTheme() {
    if (themeToggle.checked) {
      document.body.setAttribute('data-theme', 'dark');
      localStorage.theme = 'dark';
    } else {
      document.body.removeAttribute('data-theme');
      localStorage.theme = 'light';
    }
  }
  
  // Load saved theme preference, defaulting to dark mode
  if (localStorage.theme !== 'light') {
    themeToggle.checked = true;
    document.body.setAttribute('data-theme', 'dark');
  }
  
  let options = [
    { v: "Action", l: "Actions" },
    { v: "Descriptor", l: "Descriptions" },
    { v: "Adventure Tone", l: "Adventure Tone" },
    { v: "Alien Species Descriptors", l: "Alien Species Descriptors" },
    { v: "Animal Actions", l: "Animal Actions" },
    { v: "Army Descriptors", l: "Army Descriptors" },
    { v: "Cavern Descriptors", l: "Cavern Descriptors" },
    { v: "Characters", l: "Characters" },
    { v: "Character Actions Combat", l: "Character Actions, Combat" },
    { v: "Character Actions General", l: "Character Actions, General" },
    { v: "Character Appearance", l: "Character Appearance" },
    { v: "Character Background", l: "Character Background" },
    { v: "Character Conversations", l: "Character Conversations" },
    { v: "Character Descriptors", l: "Character Descriptors" },
    { v: "Character Identity", l: "Character Identity" },
    { v: "Character Motivations", l: "Character Motivations" },
    { v: "Character Personality", l: "Character Personality" },
    { v: "Character Skills", l: "Character Skills" },
    { v: "Character Traits and Flaws", l: "Character Traits and Flaws" },
    { v: "City Descriptors", l: "City Descriptors" },
    { v: "Civilization Descriptors", l: "Civilization Descriptors" },
    { v: "Creature Abilities", l: "Creature Abilities" },
    { v: "Creature Descriptors", l: "Creature Descriptors" },
    { v: "Cryptic Message", l: "Cryptic Message" },
    { v: "Curses", l: "Curses" },
    { v: "Domicile Descriptors", l: "Domicile Descriptors" },
    { v: "Dungeon Descriptors", l: "Dungeon Descriptors" },
    { v: "Dungeon Traps", l: "Dungeon Traps" },
    { v: "Forest Descriptors", l: "Forest Descriptors" },
    { v: "Gods", l: "Gods" },
    { v: "Legends", l: "Legends" },
    { v: "Locations", l: "Locations" },
    { v: "Magic Item Descriptors", l: "Magic Item Descriptors" },
    { v: "Mutation Descriptors", l: "Mutation Descriptors" },
    { v: "Names", l: "Names" },
    { v: "Noble House", l: "Noble House" },
    { v: "Objects", l: "Objects" },
    { v: "Plot Twists", l: "Plot Twists" },
    { v: "Powers", l: "Powers" },
    { v: "Scavenging Results", l: "Scavenging Results" },
    { v: "Smells", l: "Smells" },
    { v: "Sounds", l: "Sounds" },
    { v: "Spell Effects", l: "Spell Effects" },
    { v: "Starship Descriptors", l: "Starship Descriptors" },
    { v: "Terrain Descriptors", l: "Terrain Descriptors" },
    { v: "Undead Descriptors", l: "Undead Descriptors" },
    { v: "Visions and Dreams", l: "Visions and Dreams" }
  ];

  let html = "";
  options.forEach(opt => {
    if(opt.v === "") {
      html += `<div style="width:100%; text-align:center; font-weight:bold; margin:15px 0 5px; color:#555;">${opt.l}</div>`;
    } else {
      // Button calls accumulate to append results instead of replacing
      html += `<button onclick="accumulate('${opt.v}')" style="padding:4px 8px; cursor:pointer; ">${opt.l}</button>`;
    }
  });
  menuButtonsCtn.innerHTML = html;

  // Array to store the buffered lines
  let lines = [];

  // Function to move the floating tooltip with the cursor
  function moveTooltip(e) {
    tooltipEl.style.left = (e.clientX + 10) + 'px';
    tooltipEl.style.top = (e.clientY + 10) + 'px';
  }

  // Function to render the lines array into the output div
  function renderLines() {
    outputTextArea.innerHTML = lines.map((text, index) => 
      `<div class="output-line"> 
         <button class="delete-btn" onclick="deleteLine(${index})">x</button>
         <span style="flex-grow:1; cursor:pointer;" 
               onclick="copyLine(${index})" 
               onmouseenter="tooltipEl.hidden=false" 
               onmousemove="moveTooltip(event)" 
               onmouseleave="tooltipEl.hidden=true"
         >${text}</span>
       </div>`
    ).join("");
  }

  // Function to copy a specific line to clipboard
  async function copyLine(index) {
    try {
      await navigator.clipboard.writeText(lines[index]);
      let originalText = tooltipEl.textContent;
      tooltipEl.textContent = "Copied!";
      setTimeout(() => tooltipEl.textContent = originalText, 1000);
    } catch (err) {
      console.error("Failed to copy text: ", err);
    }
  }

  // Function to delete a specific line
  function deleteLine(index) {
    lines.splice(index, 1);
    renderLines();
  }

  // Function to generate a new result and append it to the buffer
  function accumulate(val) {
    version = val; // Set the category for evaluation
    update(evalEl); // Trigger evaluation in the hidden element
    let result = evalEl.textContent.trim(); // Get the evaluated text
    if (result) {
      lines.push(result);
      renderLines();
      outputTextArea.scrollTop = outputTextArea.scrollHeight; // Auto-scroll to bottom
    }
  }

  // Function to copy output contents to clipboard
  async function copyOutput() {
    try {
      await navigator.clipboard.writeText(lines.join("\n"));
      let originalText = copyBtn.innerText;
      copyBtn.innerText = "Copied!";
      setTimeout(() => copyBtn.innerText = originalText, 1500);
    } catch (err) {
      console.error("Failed to copy text: ", err);
    }
  }
</script>

<br>
</body>
</html>
