<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Campeonato de Pontos Corridos</title>
<style>
:root{
 --bg:#f3f6fb;--card:#fff;--txt:#101828;--mut:#667085;--line:#d0d5dd;
 --pri:#08783e;--pri2:#034d29;--ok:#12b76a;--warn:#f79009;--bad:#f04438;
 --blue:#1570ef;--green:#12b76a;--yellow:#f4c430;--orange:#f79009;--red:#f04438;
 --shadow:0 10px 25px rgba(16,24,40,.08)
}
.dark{
 --bg:#09130e;--card:#111d16;--txt:#f4f7fb;--mut:#aab4c4;--line:#2c4033;
 --pri:#20a866;--pri2:#0c6a3b;--shadow:0 10px 25px rgba(0,0,0,.35)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,Segoe UI,Arial,sans-serif}
header{background:linear-gradient(135deg,var(--pri2),#101828);color:#fff;padding:24px 18px;position:sticky;top:0;z-index:20;box-shadow:var(--shadow)}
.hero{max-width:1500px;margin:auto;display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}
h1{margin:0;font-size:clamp(24px,4vw,42px)}
h2,h3{margin-top:0}
.sub{opacity:.88;margin-top:6px}
.actions,.tabs,.tools,.round-tabs{display:flex;gap:8px;flex-wrap:wrap}
button,.file-label{border:0;border-radius:11px;padding:10px 14px;font-weight:800;cursor:pointer;background:var(--pri);color:#fff;box-shadow:var(--shadow);font:inherit}
button.secondary,.file-label.secondary,.tab,.round-tab{background:var(--card);color:var(--txt);border:1px solid var(--line)}
button.active,.tab.active,.round-tab.active{background:var(--pri);color:#fff;border-color:var(--pri)}
button.danger{background:var(--bad)}
button.warning{background:var(--warn)}
button.small{padding:7px 10px;font-size:12px}
.wrap{max-width:1500px;margin:20px auto;padding:0 14px}
.tabs{margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:var(--shadow)}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.metric{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.metric b{font-size:24px;display:block}
.hide{display:none!important}
.table-wrap{overflow:auto;border-radius:13px}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:860px}
th,td{border-bottom:1px solid var(--line);padding:8px 5px;text-align:center}
th{position:sticky;top:0;background:var(--card);z-index:2}
th:nth-child(2),td:nth-child(2){text-align:left;position:sticky;left:0;background:var(--card);z-index:1}
th:nth-child(2){z-index:3}
.team{display:inline-flex;align-items:center;gap:7px;font-weight:850}
.badge{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--pri),var(--pri2));color:white;font-size:10px;font-weight:900;flex:0 0 auto}
.notice{padding:12px;border-radius:14px;border:1px solid var(--line);background:rgba(18,183,106,.08);margin-bottom:14px}
.pill{font-size:12px;border-radius:99px;padding:5px 9px;font-weight:900}
.match{display:grid;grid-template-columns:1fr 52px 18px 52px 1fr auto;gap:7px;align-items:center;background:rgba(127,127,127,.06);border:1px solid var(--line);border-radius:14px;padding:9px;margin:8px 0}
.match.done{border-left:5px solid var(--ok)}
.match.partial{border-left:5px solid var(--warn)}
.match .home{text-align:right}.match .away{text-align:left}
.match input{width:52px;padding:8px;border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:9px;text-align:center;font-weight:900}
.round-tabs{overflow-x:auto;padding-bottom:8px;margin-bottom:12px;flex-wrap:nowrap}
.round-tab{flex:0 0 auto}
.search,.select{width:100%;padding:11px;border:1px solid var(--line);border-radius:13px;background:var(--card);color:var(--txt);margin-bottom:12px}
.toolbar-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:13px;padding:10px;background:rgba(127,127,127,.05)}
.kpi strong{display:block;font-size:18px}
.progress{height:10px;background:rgba(127,127,127,.18);border-radius:999px;overflow:hidden;margin-top:8px}
.progress>span{display:block;height:100%;background:var(--pri)}
.small-text{font-size:12px;color:var(--mut)}

.pos-blue{box-shadow:inset 6px 0 var(--blue)}
.pos-green{box-shadow:inset 6px 0 var(--green)}
.pos-yellow{box-shadow:inset 6px 0 var(--yellow)}
.pos-orange{box-shadow:inset 6px 0 var(--orange)}
.pos-red{box-shadow:inset 6px 0 var(--red)}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.legend span{padding:7px 10px;border-radius:999px;font-size:12px;font-weight:900;color:#fff}
.legend .blue{background:var(--blue)}.legend .green{background:var(--green)}
.legend .yellow{background:var(--yellow);color:#382f00}.legend .orange{background:var(--orange)}
.legend .red{background:var(--red)}

.brasfoot-editor{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px}
.editor-main{min-width:0}
.editor-sidebar{display:flex;flex-direction:column;gap:12px}
.editor-toolbar{display:grid;grid-template-columns:1.5fr 1fr auto auto;gap:10px;margin-bottom:14px}
.team-editor-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.team-editor-row{display:grid;grid-template-columns:42px 46px minmax(0,1fr) 95px 42px;gap:8px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:14px;background:rgba(127,127,127,.045)}
.editor-pos{font-weight:900;text-align:center;color:var(--mut)}
.editor-badge{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font-size:11px;font-weight:900}
.editor-name,.editor-elo{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--txt);font-weight:750}
.drag-handle{cursor:grab;text-align:center;font-size:20px;color:var(--mut);user-select:none}
.editor-error{border-color:var(--bad)!important;box-shadow:0 0 0 2px rgba(240,68,56,.12)}
.editor-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.editor-actions button,.editor-actions .file-label{width:100%;text-align:center}
.editor-preview{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:8px}
.editor-preview-item{display:flex;align-items:center;gap:8px;padding:7px;border-bottom:1px solid var(--line)}
@media(max-width:1000px){.brasfoot-editor{grid-template-columns:1fr}.team-editor-list{grid-template-columns:1fr}}
@media(max-width:900px){.toolbar-grid{grid-template-columns:1fr}}
@media(max-width:700px){.editor-toolbar{grid-template-columns:1fr 1fr}.team-editor-row{grid-template-columns:36px 40px minmax(0,1fr) 82px 34px}}
@media(max-width:650px){
 .match{grid-template-columns:1fr 42px 10px 42px 1fr;position:relative;padding-bottom:48px}
 .match button{position:absolute;left:10px;right:10px;bottom:8px}
 .match input{width:42px}
 header{position:relative}
}
</style>
</head>
<body>
<header><div class="hero">
 <div><h1>🏆 Liga BFL Sudeste</h1>
 <div class="sub">20 clubes • 38 rodadas • turno e returno • sem mata-mata • Z4 rebaixado</div></div>
 <div class="actions">
  <button class="secondary" onclick="toggleTheme()">🌓 Tema</button>
  <button class="secondary" onclick="exportCSV()">⬇️ CSV</button>
  <button class="secondary" onclick="exportJSON()">💾 Backup</button>
  <label class="file-label secondary">📂 Importar<input id="jsonFile" type="file" accept=".json" hidden onchange="importJSON(event)"></label>
  <button onclick="simulateAll()">⚡ Simular tudo</button>
  <button class="danger" onclick="resetAll()">🧹 Resetar</button>
 </div>
</div></header>

<div class="wrap">
 <div class="tabs">
  <button class="tab active" onclick="showTab('classification',this)">Classificação</button>
  <button class="tab" onclick="showTab('fixturesSec',this)">Rodadas</button>
  <button class="tab" onclick="showTab('teamsSec',this)">Editar times</button>
 </div>

 <div class="summary" id="summary"></div>

 <section id="classification"><div id="tableContent"></div></section>

 <section id="fixturesSec" class="hide">
  <div class="toolbar-grid">
   <input class="search" id="filter" placeholder="Filtrar clube..." oninput="renderFixtures()">
   <button class="secondary" onclick="simulateRound()">🎲 Simular rodada</button>
   <button class="warning" onclick="clearRound()">🧽 Limpar rodada</button>
  </div>
  <div class="round-tabs" id="roundTabs"></div>
  <div id="fixtureCard"></div>
 </section>

 <section id="teamsSec" class="hide">
  <div class="card">
   <h3>Editor dos 20 times</h3>
   <div class="notice">Edite nomes e ELOs. Os placares são preservados quando os clubes são apenas renomeados.</div>
   <div class="brasfoot-editor">
    <div class="editor-main">
     <div class="editor-toolbar">
      <input id="teamSearch" class="search" placeholder="🔎 Pesquisar time..." oninput="renderEditorList()">
      <select id="teamSort" class="select" onchange="sortEditorTeams(this.value)">
       <option value="">Ordenar...</option>
       <option value="name">Nome A–Z</option>
       <option value="eloDesc">Maior ELO</option>
       <option value="eloAsc">Menor ELO</option>
      </select>
      <button class="secondary" onclick="randomNames()">🎲 Nomes</button>
      <button class="secondary" onclick="normalizeElos()">⚖️ ELO 1500</button>
     </div>
     <div id="teamEditorList" class="team-editor-list"></div>
    </div>
    <aside class="editor-sidebar">
     <div id="editorStatus"></div>
     <div class="card" style="box-shadow:none">
      <h3 style="font-size:16px">Ações</h3>
      <div class="editor-actions">
       <button onclick="saveTeams()">✅ Salvar</button>
       <button class="secondary" onclick="shuffleTeams()">🔀 Embaralhar</button>
       <button class="secondary" onclick="exportTeamsTXT()">⬇️ Exportar TXT</button>
       <label class="file-label secondary">📂 Importar TXT<input type="file" accept=".txt" hidden onchange="importTeamsTXT(event)"></label>
       <button class="warning" onclick="restoreDefaults()">↩️ Padrão</button>
       <button class="danger" onclick="discardChanges()">✖️ Descartar</button>
      </div>
     </div>
     <div class="card" style="box-shadow:none">
      <h3 style="font-size:16px">Prévia</h3>
      <div id="editorPreview" class="editor-preview"></div>
     </div>
    </aside>
   </div>
  </div>
 </section>
</div>

<script>
const APP_VERSION='liga20-38rodadas-v1';
const STORAGE_PREFIX='LIGA20_38_';
const TOTAL_TEAMS=20;
const TOTAL_ROUNDS=38;
const MATCHES_PER_ROUND=10;
const TOTAL_MATCHES=380;

const DEFAULT_TEAMS=Array.from({length:TOTAL_TEAMS},(_,i)=>({
 name:`Time ${String(i+1).padStart(2,'0')}`,elo:1500
}));

let teams=[],matches=[],currentRound=1,editorTeams=[],draggedIndex=null;

function safeText(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function initials(n){return String(n||'—').split(/\s+/).filter(Boolean).map(x=>x[0]).join('').slice(0,3).toUpperCase()}
function teamHTML(n){return `<span class="team"><span class="badge">${safeText(initials(n))}</span>${safeText(n)}</span>`}
function storageKey(k){return STORAGE_PREFIX+k}
function teamElo(name){return teams.find(t=>t.name===name)?.elo||1500}
function cloneTeams(list){return list.map(t=>({name:String(t.name),elo:Number(t.elo)||1500}))}

function loadTeams(){
 try{
  const saved=JSON.parse(localStorage.getItem(storageKey('teams'))||'null');
  teams=Array.isArray(saved)&&saved.length===TOTAL_TEAMS?saved.map(t=>typeof t==='string'?{name:t,elo:1500}:t):cloneTeams(DEFAULT_TEAMS);
 }catch{teams=cloneTeams(DEFAULT_TEAMS)}
}

function firstTurnSchedule(clubs){
 const rot=clubs.slice();
 const rounds=[];
 for(let r=0;r<19;r++){
  const games=[];
  for(let i=0;i<10;i++){
   let home=rot[i],away=rot[19-i];
   if((r+i)%2===1)[home,away]=[away,home];
   games.push({home,away});
  }
  rounds.push(games);
  rot.splice(1,0,rot.pop());
 }
 return rounds;
}

function generateSchedule(){
 matches=[];
 const first=firstTurnSchedule(teams.map(t=>t.name));
 first.forEach((games,r)=>{
  games.forEach((g,j)=>matches.push({
   id:`${APP_VERSION}_R${r+1}J${j+1}`,round:r+1,home:g.home,away:g.away,hg:'',ag:''
  }));
 });
 first.forEach((games,r)=>{
  games.forEach((g,j)=>matches.push({
   id:`${APP_VERSION}_R${r+20}J${j+1}`,round:r+20,home:g.away,away:g.home,hg:'',ag:''
  }));
 });
 matches.forEach(m=>{
  m.hg=localStorage.getItem(storageKey(m.id+'_hg'))??'';
  m.ag=localStorage.getItem(storageKey(m.id+'_ag'))??'';
 });
}

function blankTable(){
 const s={};
 teams.forEach(t=>s[t.name]={team:t.name,elo:t.elo,p:0,w:0,d:0,l:0,gf:0,ga:0,gd:0,pts:0});
 return s;
}
function standings(){
 const s=blankTable();
 matches.forEach(m=>{
  if(m.hg===''||m.ag==='')return;
  const h=s[m.home],a=s[m.away],hg=+m.hg,ag=+m.ag;
  if(!h||!a)return;
  h.p++;a.p++;h.gf+=hg;h.ga+=ag;a.gf+=ag;a.ga+=hg;
  h.gd=h.gf-h.ga;a.gd=a.gf-a.ga;
  if(hg>ag){h.w++;a.l++;h.pts+=3}
  else if(hg<ag){a.w++;h.l++;a.pts+=3}
  else{h.d++;a.d++;h.pts++;a.pts++}
 });
 return Object.values(s).sort((a,b)=>b.pts-a.pts||b.w-a.w||b.gd-a.gd||b.gf-a.gf||b.elo-a.elo||a.team.localeCompare(b.team));
}

function rowClass(i){
 if(i<4)return'pos-blue';
 if(i<8)return'pos-green';
 if(i<12)return'pos-yellow';
 if(i<16)return'pos-orange';
 return'pos-red';
}
function statusHTML(i){
 if(i<4)return'<span class="pill" style="background:rgba(21,112,239,.15);color:var(--blue)">1º ao 4º</span>';
 if(i<8)return'<span class="pill" style="background:rgba(18,183,106,.15);color:var(--green)">5º ao 8º</span>';
 if(i<12)return'<span class="pill" style="background:rgba(244,196,48,.18);color:#7a6200">9º ao 12º</span>';
 if(i<16)return'<span class="pill" style="background:rgba(247,144,9,.16);color:var(--orange)">13º ao 16º</span>';
 return'<span class="pill" style="background:rgba(240,68,56,.15);color:var(--red)">Z4</span>';
}

function renderSummary(){
 const played=matches.filter(m=>m.hg!==''&&m.ag!=='').length;
 const goals=matches.reduce((n,m)=>m.hg!==''&&m.ag!==''?n+(+m.hg)+(+m.ag):n,0);
 const completedRounds=Array.from({length:38},(_,i)=>i+1).filter(r=>matches.filter(m=>m.round===r).every(m=>m.hg!==''&&m.ag!=='')).length;
 document.getElementById('summary').innerHTML=`
 <div class="metric"><span>Clubes</span><b>20</b></div>
 <div class="metric"><span>Rodadas</span><b>${completedRounds}/38</b></div>
 <div class="metric"><span>Jogos</span><b>${played}/380</b><div class="progress"><span style="width:${played/380*100}%"></span></div></div>
 <div class="metric"><span>Gols</span><b>${goals}</b></div>
 <div class="metric"><span>Formato</span><b>Turno e returno</b></div>
 <div class="metric"><span>Rebaixamento</span><b>Z4</b><span class="small-text">17º ao 20º</span></div>`;
}

function renderTable(){
 const data=standings();
 let h=`<div class="card"><h3>Classificação geral</h3>
 <div class="notice">Campeonato de pontos corridos com 38 rodadas. Critérios: pontos, vitórias, saldo de gols, gols marcados, ELO e ordem alfabética.</div>
 <div class="legend">
  <span class="blue">1º ao 4º</span><span class="green">5º ao 8º</span>
  <span class="yellow">9º ao 12º</span><span class="orange">13º ao 16º</span>
  <span class="red">Z4 — 17º ao 20º</span>
 </div><div class="table-wrap"><table>
 <tr><th>Pos</th><th>Clube</th><th>Faixa</th><th>ELO</th><th>J</th><th>V</th><th>E</th><th>D</th><th>GP</th><th>GC</th><th>SG</th><th>Pts</th></tr>`;
 data.forEach((x,i)=>h+=`<tr class="${rowClass(i)}"><td><b>${i+1}</b></td><td>${teamHTML(x.team)}</td><td>${statusHTML(i)}</td><td>${x.elo}</td><td>${x.p}</td><td>${x.w}</td><td>${x.d}</td><td>${x.l}</td><td>${x.gf}</td><td>${x.ga}</td><td>${x.gd}</td><td><b>${x.pts}</b></td></tr>`);
 document.getElementById('tableContent').innerHTML=h+'</table></div></div>';
}

function renderRoundTabs(){
 document.getElementById('roundTabs').innerHTML=Array.from({length:38},(_,i)=>i+1).map(r=>
  `<button class="round-tab small ${r===currentRound?'active':''}" onclick="selectRound(${r})">Rodada ${r}</button>`
 ).join('');
}
function selectRound(r){currentRound=r;renderRoundTabs();renderFixtures()}

function renderFixtures(){
 const f=(document.getElementById('filter')?.value||'').toLowerCase();
 const list=matches.filter(m=>m.round===currentRound&&(m.home+' '+m.away).toLowerCase().includes(f));
 let h=`<div class="card"><h3>Rodada ${currentRound}</h3>`;
 list.forEach(m=>{
  const state=m.hg!==''&&m.ag!==''?'done':(m.hg!==''||m.ag!==''?'partial':'');
  h+=`<div class="match ${state}" data-match="${m.id}">
   <div class="home">${teamHTML(m.home)}</div>
   <input type="number" min="0" value="${m.hg}" oninput="saveScore('${m.id}','hg',this.value)">
   <b>x</b>
   <input type="number" min="0" value="${m.ag}" oninput="saveScore('${m.id}','ag',this.value)">
   <div class="away">${teamHTML(m.away)}</div>
   <button class="small secondary" onclick="simulateMatch('${m.id}')">Simular</button>
  </div>`;
 });
 document.getElementById('fixtureCard').innerHTML=h+'</div>';
}

function saveScore(id,side,value){
 const m=matches.find(x=>x.id===id);if(!m)return;
 const clean=value===''?'':Math.max(0,Math.floor(Number(value)));
 m[side]=clean;
 localStorage.setItem(storageKey(id+'_'+side),clean);
 renderSummary();renderTable();
 const row=document.querySelector(`[data-match="${id}"]`);
 if(row){
  row.classList.toggle('done',m.hg!==''&&m.ag!=='');
  row.classList.toggle('partial',(m.hg===''&&m.ag!=='')||(m.hg!==''&&m.ag===''));
 }
}

function expectedHomeGoals(home,away){
 const diff=(teamElo(home)-teamElo(away)+85)/400;
 return Math.max(.25,1.25+diff*.65);
}
function expectedAwayGoals(home,away){
 const diff=(teamElo(away)-teamElo(home)-85)/400;
 return Math.max(.20,1.05+diff*.60);
}
function poisson(lambda){
 let L=Math.exp(-lambda),k=0,p=1;
 do{k++;p*=Math.random()}while(p>L);
 return Math.min(9,k-1);
}
function simulateScore(home,away){return[poisson(expectedHomeGoals(home,away)),poisson(expectedAwayGoals(home,away))]}
function simulateMatch(id){
 const m=matches.find(x=>x.id===id);if(!m)return;
 const [h,a]=simulateScore(m.home,m.away);
 m.hg=h;m.ag=a;
 localStorage.setItem(storageKey(id+'_hg'),h);
 localStorage.setItem(storageKey(id+'_ag'),a);
 renderAll();
}
function simulateRound(){
 const list=matches.filter(m=>m.round===currentRound);
 if(list.some(m=>m.hg!==''||m.ag!=='')&&!confirm('Há placares preenchidos. Deseja sobrescrevê-los?'))return;
 list.forEach(m=>{
  const[h,a]=simulateScore(m.home,m.away);m.hg=h;m.ag=a;
  localStorage.setItem(storageKey(m.id+'_hg'),h);
  localStorage.setItem(storageKey(m.id+'_ag'),a);
 });
 renderAll();
}
function clearRound(){
 if(!confirm('Limpar todos os placares desta rodada?'))return;
 matches.filter(m=>m.round===currentRound).forEach(m=>{
  m.hg='';m.ag='';
  localStorage.removeItem(storageKey(m.id+'_hg'));
  localStorage.removeItem(storageKey(m.id+'_ag'));
 });
 renderAll();
}
function simulateAll(){
 if(!confirm('Simular as 38 rodadas e sobrescrever os placares atuais?'))return;
 clearScores();
 matches.forEach(m=>{
  const[h,a]=simulateScore(m.home,m.away);m.hg=h;m.ag=a;
  localStorage.setItem(storageKey(m.id+'_hg'),h);
  localStorage.setItem(storageKey(m.id+'_ag'),a);
 });
 renderAll();
}
function clearScores(){
 Object.keys(localStorage).forEach(k=>{
  if(k.startsWith(STORAGE_PREFIX)&&k!==storageKey('teams')&&k!==storageKey('theme'))localStorage.removeItem(k);
 });
}
function resetAll(){
 if(!confirm('Apagar todos os placares da temporada?'))return;
 clearScores();generateSchedule();renderAll();
}

function renderEditor(){
 editorTeams=cloneTeams(teams);
 renderEditorList();
}
function renderEditorList(){
 const filter=(document.getElementById('teamSearch')?.value||'').toLowerCase();
 let h='';
 editorTeams.forEach((t,i)=>{
  if(filter&&!t.name.toLowerCase().includes(filter))return;
  h+=`<div class="team-editor-row" draggable="true"
   ondragstart="dragStart(event,${i})" ondragover="event.preventDefault()"
   ondrop="dropTeam(event,${i})">
   <div class="editor-pos">${i+1}</div>
   <div class="editor-badge">${safeText(initials(t.name))}</div>
   <input class="editor-name" id="name${i}" value="${safeText(t.name)}" oninput="updateEditor(${i},'name',this.value)">
   <input class="editor-elo" id="elo${i}" type="number" min="500" max="3000" value="${t.elo}" oninput="updateEditor(${i},'elo',this.value)">
   <div class="drag-handle">☰</div>
  </div>`;
 });
 document.getElementById('teamEditorList').innerHTML=h;
 updateEditorStatus();renderEditorPreview();
}
function updateEditor(i,field,value){
 editorTeams[i][field]=field==='elo'?(value===''?'':Math.round(Number(value))):value;
 renderEditorPreview();updateEditorStatus();
}
function editorValidation(){
 const names=editorTeams.map(t=>String(t.name||'').trim());
 const lowered=names.map(n=>n.toLocaleLowerCase('pt-BR'));
 const duplicate=names.some((n,i)=>n&&lowered.indexOf(lowered[i])!==i);
 const invalid=editorTeams.some(t=>!String(t.name||'').trim()||!Number.isFinite(Number(t.elo))||Number(t.elo)<500||Number(t.elo)>3000);
 return{valid:editorTeams.length===20&&!duplicate&&!invalid,duplicate,invalid};
}
function updateEditorStatus(){
 const v=editorValidation();
 document.getElementById('editorStatus').innerHTML=`
 <div class="kpis"><div class="kpi"><span>Times</span><strong>${editorTeams.length}/20</strong></div>
 <div class="kpi"><span>Situação</span><strong>${v.valid?'Pronto':'Revisar'}</strong></div></div>
 <div class="notice" style="margin-top:10px">${v.valid?'✅ Lista pronta para salvar.':'⚠️ Corrija nomes vazios, repetidos ou ELO inválido.'}</div>`;
}
function renderEditorPreview(){
 document.getElementById('editorPreview').innerHTML=editorTeams.map((t,i)=>
  `<div class="editor-preview-item"><span class="editor-badge" style="width:28px;height:28px">${safeText(initials(t.name))}</span><span><b>${i+1}. ${safeText(t.name||'Sem nome')}</b><br><span class="small-text">ELO ${safeText(t.elo)}</span></span></div>`
 ).join('');
}
function saveTeams(){
 const v=editorValidation();if(!v.valid){alert('Corrija a lista antes de salvar.');return}
 const oldTeams=cloneTeams(teams),oldMatches=matches.map(m=>({...m}));
 const newTeams=editorTeams.map(t=>({name:String(t.name).trim(),elo:Math.round(Number(t.elo))}));
 const rename=new Map(oldTeams.map((t,i)=>[t.name,newTeams[i].name]));
 oldMatches.forEach(m=>{
  localStorage.removeItem(storageKey(m.id+'_hg'));
  localStorage.removeItem(storageKey(m.id+'_ag'));
 });
 teams=newTeams;
 localStorage.setItem(storageKey('teams'),JSON.stringify(teams));
 generateSchedule();
 oldMatches.forEach(old=>{
  if(old.hg===''||old.ag==='')return;
  const nh=rename.get(old.home),na=rename.get(old.away);
  const target=matches.find(m=>m.home===nh&&m.away===na);
  if(!target)return;
  target.hg=old.hg;target.ag=old.ag;
  localStorage.setItem(storageKey(target.id+'_hg'),old.hg);
  localStorage.setItem(storageKey(target.id+'_ag'),old.ag);
 });
 renderAll();renderEditor();
 alert('Times salvos e placares preservados.');
}
function shuffleTeams(){for(let i=editorTeams.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[editorTeams[i],editorTeams[j]]=[editorTeams[j],editorTeams[i]]}renderEditorList()}
function sortEditorTeams(mode){
 if(mode==='name')editorTeams.sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'));
 if(mode==='eloDesc')editorTeams.sort((a,b)=>Number(b.elo)-Number(a.elo));
 if(mode==='eloAsc')editorTeams.sort((a,b)=>Number(a.elo)-Number(b.elo));
 renderEditorList();
}
function normalizeElos(){editorTeams.forEach(t=>t.elo=1500);renderEditorList()}
function randomNames(){
 const names=['Atlético','União','Esportivo','Nacional','Real','Ferroviário','Independente','Guarani','Operário','Juventude','América','Portuguesa','Central','Oeste','Nova Cidade','Santa Cruz','Vila Nova','Internacional','São José','Rio Branco'];
 editorTeams=editorTeams.map((t,i)=>({...t,name:names[i]}));renderEditorList();
}
function restoreDefaults(){editorTeams=cloneTeams(DEFAULT_TEAMS);renderEditorList()}
function discardChanges(){editorTeams=cloneTeams(teams);renderEditorList()}
function dragStart(e,i){draggedIndex=i;e.dataTransfer.effectAllowed='move'}
function dropTeam(e,i){e.preventDefault();if(draggedIndex===null||draggedIndex===i)return;const[m]=editorTeams.splice(draggedIndex,1);editorTeams.splice(i,0,m);draggedIndex=null;renderEditorList()}

function exportTeamsTXT(){
 const blob=new Blob(['\ufeff'+editorTeams.map(t=>`${t.name};${t.elo}`).join('\n')],{type:'text/plain;charset=utf-8'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='liga-20-times.txt';a.click();URL.revokeObjectURL(a.href);
}
function importTeamsTXT(e){
 const file=e.target.files[0];if(!file)return;
 const r=new FileReader();
 r.onload=()=>{
  const list=String(r.result).split(/\r?\n/).map(x=>x.trim()).filter(Boolean).map(line=>{
   const[name,elo]=line.split(';');return{name:name.trim(),elo:Math.round(Number(elo||1500))}
  });
  if(list.length!==20){alert('O arquivo precisa conter exatamente 20 linhas.');return}
  editorTeams=list;renderEditorList();
 };
 r.readAsText(file);
}
function exportCSV(){
 const rows=['Posição,Clube,Faixa,ELO,J,V,E,D,GP,GC,SG,Pts'];
 standings().forEach((x,i)=>{
  const faixa=i<4?'Azul':i<8?'Verde':i<12?'Amarela':i<16?'Laranja':'Z4';
  rows.push([i+1,`"${x.team.replaceAll('"','""')}"`,faixa,x.elo,x.p,x.w,x.d,x.l,x.gf,x.ga,x.gd,x.pts].join(','));
 });
 const blob=new Blob(['\ufeff'+rows.join('\n')],{type:'text/csv;charset=utf-8'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='classificacao-38-rodadas.csv';a.click();URL.revokeObjectURL(a.href);
}
function exportJSON(){
 const data={version:APP_VERSION,exportedAt:new Date().toISOString(),teams,storage:{}};
 Object.keys(localStorage).filter(k=>k.startsWith(STORAGE_PREFIX)).forEach(k=>data.storage[k]=localStorage.getItem(k));
 const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='liga-38-rodadas-backup.json';a.click();URL.revokeObjectURL(a.href);
}
function importJSON(e){
 const file=e.target.files[0];if(!file)return;
 const r=new FileReader();
 r.onload=()=>{
  try{
   const data=JSON.parse(r.result);
   if(!Array.isArray(data.teams)||data.teams.length!==20)throw new Error('Backup incompatível');
   if(!confirm('Importar e substituir a temporada atual?'))return;
   Object.keys(localStorage).filter(k=>k.startsWith(STORAGE_PREFIX)).forEach(k=>localStorage.removeItem(k));
   Object.entries(data.storage||{}).forEach(([k,v])=>localStorage.setItem(k,v));
   localStorage.setItem(storageKey('teams'),JSON.stringify(data.teams));
   loadTeams();generateSchedule();renderAll();
  }catch(err){alert('Erro ao importar: '+err.message)}
  e.target.value='';
 };
 r.readAsText(file);
}
function toggleTheme(){
 document.body.classList.toggle('dark');
 localStorage.setItem(storageKey('theme'),document.body.classList.contains('dark')?'dark':'light');
}
function showTab(id,el){
 document.querySelectorAll('section').forEach(s=>s.classList.add('hide'));
 document.getElementById(id).classList.remove('hide');
 document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
 el.classList.add('active');
 if(id==='teamsSec')renderEditor();
}
function renderAll(){renderSummary();renderTable();renderRoundTabs();renderFixtures()}

if(localStorage.getItem(storageKey('theme'))==='dark')document.body.classList.add('dark');
loadTeams();generateSchedule();renderAll();
</script>
