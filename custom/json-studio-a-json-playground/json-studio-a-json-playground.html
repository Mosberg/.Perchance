<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>json-studio-a-json-playground — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<style>
:root[data-theme="dark"]{
  --bg:#0d1117;--bg-panel:#161b22;--bg-input:#0d1117;--bg-code:#0d1117;
  --border:#30363d;--border-light:#21262d;
  --text:#c9d1d9;--text-muted:#8b949e;--text-dim:#484f58;
  --accent:#58a6ff;--accent-hover:#79b8ff;--accent-glow:rgba(88,166,255,.15);
  --success:#3fb950;--warning:#d29922;--error:#f85149;
  --node-object:#58a6ff;--node-array:#bc8cff;--node-string:#7ee787;
  --node-number:#ffa657;--node-boolean:#ff7b72;--node-null:#8b949e;
  --diff-add:#3fb950;--diff-del:#f85149;--diff-mod:#d29922;
  --shadow:rgba(0,0,0,.4);
}
:root[data-theme="light"]{
  --bg:#ffffff;--bg-panel:#f6f8fa;--bg-input:#ffffff;--bg-code:#f6f8fa;
  --border:#d0d7de;--border-light:#eaeef2;
  --text:#1f2328;--text-muted:#636c76;--text-dim:#afb8c1;
  --accent:#0969da;--accent-hover:#218bff;--accent-glow:rgba(9,105,218,.12);
  --success:#1a7f37;--warning:#9a6700;--error:#cf222e;
  --node-object:#0969da;--node-array:#8250df;--node-string:#1a7f37;
  --node-number:#bc4c00;--node-boolean:#cf222e;--node-null:#636c76;
  --diff-add:#1a7f37;--diff-del:#cf222e;--diff-mod:#9a6700;
  --shadow:rgba(0,0,0,.1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;background:var(--bg);color:var(--text);text-align:left}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:13px}
textarea{font-family:'SF Mono',Monaco,'Cascadia Code','Fira Code',monospace;font-size:13px;line-height:1.5;resize:none}
select{font-family:inherit;font-size:13px}
input{font-family:inherit;font-size:13px}

.app{display:flex;flex-direction:column;height:100vh}
.app-header{display:flex;align-items:center;gap:12px;padding:0 16px;height:48px;background:var(--bg-panel);border-bottom:1px solid var(--border);z-index:10;flex-shrink:0}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;white-space:nowrap}
.logo-icon{width:24px;height:24px;display:flex;align-items:center;justify-content:center;background:var(--accent);color:#fff;border-radius:6px;font-size:14px}
.tabs{display:flex;gap:2px;margin-left:8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:6px 10px;border-radius:6px;color:var(--text-muted);font-size:13px;transition:all .15s;white-space:nowrap}
.tab:hover{background:var(--border-light);color:var(--text)}
.tab.active{background:var(--accent-glow);color:var(--accent);font-weight:600}
.header-spacer{flex:1}
.header-btn{padding:6px 10px;border-radius:6px;color:var(--text-muted);transition:all .15s;display:flex;align-items:center;gap:4px;white-space:nowrap}
.header-btn:hover{background:var(--border-light);color:var(--text)}

.app-main{display:flex;flex:1;overflow:hidden}
.input-panel{width:38%;min-width:280px;max-width:600px;display:flex;flex-direction:column;border-right:1px solid var(--border);background:var(--bg-panel)}
.panel-header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--border-light);font-size:12px;color:var(--text-muted);font-weight:600}
.format-badge{padding:2px 8px;border-radius:4px;background:var(--accent-glow);color:var(--accent);font-size:11px;font-weight:600;text-transform:uppercase}
.editor-wrapper{flex:1;display:flex;overflow:hidden;position:relative}
.line-numbers{width:40px;padding:8px 4px;text-align:right;color:var(--text-dim);font-size:13px;font-family:'SF Mono',Monaco,monospace;line-height:1.5;user-select:none;overflow:hidden;border-right:1px solid var(--border-light);background:var(--bg-input)}
#jsonInput{flex:1;padding:8px 12px;border:none;outline:none;background:var(--bg-input);color:var(--text);tab-size:2}
.input-actions{display:flex;gap:6px;padding:8px;border-top:1px solid var(--border-light);flex-wrap:wrap}
.search-bar{display:flex;gap:6px;padding:6px 8px;border-bottom:1px solid var(--border-light)}
.search-input{flex:1;padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:var(--bg-input);color:var(--text);font-size:12px;outline:none}
.search-input:focus{border-color:var(--accent)}
.btn{padding:6px 14px;border-radius:6px;font-size:13px;font-weight:500;transition:all .15s;border:1px solid var(--border);background:var(--bg-panel);color:var(--text)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{background:var(--accent-hover);color:#fff}
.btn-sm{padding:4px 10px;font-size:12px}
.drop-zone{position:absolute;inset:0;background:var(--accent-glow);border:2px dashed var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--accent);font-weight:600;z-index:5;pointer-events:none}

.output-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;background:var(--bg)}
.output-content{flex:1;overflow:auto;position:relative}
.graph-container{width:100%;height:100%;position:relative;overflow:hidden}
#graphSvg{width:100%;height:100%;display:block;cursor:grab}
#graphSvg:active{cursor:grabbing}
.graph-edge{stroke:var(--border);stroke-width:1.5;fill:none;transition:stroke .2s}
.graph-edge.highlighted{stroke:var(--accent);stroke-width:2.5}
.graph-node{cursor:pointer}
.node-rect{fill:var(--bg-panel);stroke:var(--border);stroke-width:1.5;transition:all .2s}
.graph-node:hover .node-rect{stroke-width:2.5;filter:drop-shadow(0 0 6px var(--accent-glow))}
.graph-node.search-match .node-rect{stroke:var(--warning);stroke-width:2.5}
.node-key{fill:var(--text);font-size:12px;font-weight:600;font-family:'SF Mono',Monaco,monospace;text-anchor:middle;pointer-events:none}
.node-value{font-size:11px;font-family:'SF Mono',Monaco,monospace;text-anchor:middle;pointer-events:none}
.node-value.object{fill:var(--node-object)}
.node-value.array{fill:var(--node-array)}
.node-value.string{fill:var(--node-string)}
.node-value.number{fill:var(--node-number)}
.node-value.boolean{fill:var(--node-boolean)}
.node-value.null{fill:var(--node-null)}
.node-stripe{stroke:none}
.node-stripe.object{fill:var(--node-object)}
.node-stripe.array{fill:var(--node-array)}
.node-stripe.string{fill:var(--node-string)}
.node-stripe.number{fill:var(--node-number)}
.node-stripe.boolean{fill:var(--node-boolean)}
.node-stripe.null{fill:var(--node-null)}
.graph-controls{position:absolute;bottom:12px;right:12px;display:flex;flex-direction:column;gap:4px}
.graph-controls .btn{width:36px;height:36px;padding:0;display:flex;align-items:center;justify-content:center;font-size:16px;background:var(--bg-panel);border:1px solid var(--border)}
.graph-layout-bar{position:absolute;top:12px;right:12px;display:flex;gap:4px}
.graph-layout-bar .btn{padding:4px 10px;font-size:12px;background:var(--bg-panel);border:1px solid var(--border)}
.graph-layout-bar .btn.active{background:var(--accent-glow);color:var(--accent);border-color:var(--accent)}
.graph-legend{position:absolute;top:12px;left:12px;background:var(--bg-panel);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:11px;display:flex;gap:12px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:4px;color:var(--text-muted)}
.legend-dot{width:8px;height:8px;border-radius:2px}
.graph-empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-dim);font-size:14px;flex-direction:column;gap:8px}

.tree-view{padding:12px;font-family:'SF Mono',Monaco,monospace;font-size:13px;line-height:1.6;white-space:nowrap}
.tree-node{display:block}
.tree-toggle{display:inline-block;width:16px;cursor:pointer;color:var(--text-muted);user-select:none;text-align:center}
.tree-key{color:var(--node-object)}
.tree-value.string{color:var(--node-string)}
.tree-value.number{color:var(--node-number)}
.tree-value.boolean{color:var(--node-boolean)}
.tree-value.null{color:var(--node-null)}
.tree-bracket{color:var(--text-muted)}
.tree-comma{color:var(--text-dim)}
.tree-children{padding-left:20px}
.tree-actions{display:flex;gap:6px;padding:6px 12px;border-bottom:1px solid var(--border-light);font-size:12px}

.code-output{padding:16px;font-family:'SF Mono',Monaco,monospace;font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word;color:var(--text)}
.code-output .tok-key{color:var(--node-object)}
.code-output .tok-string{color:var(--node-string)}
.code-output .tok-number{color:var(--node-number)}
.code-output .tok-boolean{color:var(--node-boolean)}
.code-output .tok-null{color:var(--node-null)}
.code-output .tok-punc{color:var(--text-muted)}
.code-output .tok-comment{color:var(--text-dim);font-style:italic}

.convert-bar,.codegen-bar,.query-bar,.schema-bar,.diff-bar,.stats-bar,.tools-grid{display:flex;align-items:center;gap:8px;padding:12px;border-bottom:1px solid var(--border-light);flex-wrap:wrap}
.convert-bar select,.codegen-bar select,.schema-bar select{padding:6px 10px;border-radius:6px;border:1px solid var(--border);background:var(--bg-panel);color:var(--text);font-size:13px}
.convert-arrow{color:var(--text-muted)}
.lang-btn{padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:var(--bg-panel);color:var(--text-muted);font-size:13px;transition:all .15s}
.lang-btn:hover{border-color:var(--accent);color:var(--text)}
.lang-btn.active{background:var(--accent-glow);color:var(--accent);border-color:var(--accent);font-weight:600}
.query-input{flex:1;padding:8px 12px;border-radius:6px;border:1px solid var(--border);background:var(--bg-input);color:var(--text);font-family:'SF Mono',Monaco,monospace;font-size:13px;outline:none}
.query-input:focus{border-color:var(--accent)}

.output-toolbar{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--border-light);background:var(--bg-panel)}
.output-toolbar .filename{font-size:12px;color:var(--text-muted);font-family:monospace;flex:1}
.copy-btn{padding:4px 10px;border-radius:4px;font-size:12px;border:1px solid var(--border);color:var(--text-muted);transition:all .15s}
.copy-btn:hover{border-color:var(--accent);color:var(--accent)}
.copy-btn.copied{border-color:var(--success);color:var(--success)}

.status-bar{display:flex;align-items:center;gap:16px;padding:4px 12px;height:28px;background:var(--bg-panel);border-top:1px solid var(--border);font-size:11px;color:var(--text-muted);flex-shrink:0}
.status-item{display:flex;align-items:center;gap:4px}
.status-dot{width:8px;height:8px;border-radius:50%}
.status-dot.valid{background:var(--success)}
.status-dot.invalid{background:var(--error)}
.status-dot.empty{background:var(--text-dim)}
.status-spacer{flex:1}

.diff-output{padding:16px;font-family:'SF Mono',Monaco,monospace;font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.diff-line{display:block}
.diff-line.added{color:var(--diff-add);background:rgba(63,185,80,.08)}
.diff-line.removed{color:var(--diff-del);background:rgba(248,81,73,.08)}
.diff-line.changed{color:var(--diff-mod)}
.diff-line.unchanged{color:var(--text-muted)}
.diff-input{width:100%;min-height:120px;padding:8px 12px;border:1px solid var(--border);border-radius:6px;background:var(--bg-input);color:var(--text);font-family:'SF Mono',Monaco,monospace;font-size:13px;outline:none;resize:vertical}
.diff-input:focus{border-color:var(--accent)}
.diff-panel{display:flex;gap:12px;padding:12px}
.diff-panel>div{flex:1}
.diff-panel label{font-size:12px;color:var(--text-muted);font-weight:600;display:block;margin-bottom:4px}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;padding:16px}
.stat-card{background:var(--bg-panel);border:1px solid var(--border);border-radius:8px;padding:16px;text-align:center}
.stat-card .stat-value{font-size:28px;font-weight:700;color:var(--accent)}
.stat-card .stat-label{font-size:12px;color:var(--text-muted);margin-top:4px}
.stat-dist{grid-column:1/-1;background:var(--bg-panel);border:1px solid var(--border);border-radius:8px;padding:16px}
.stat-dist-bar{display:flex;align-items:center;gap:8px;margin:6px 0}
.stat-dist-bar .bar-bg{flex:1;height:20px;background:var(--bg-input);border-radius:4px;overflow:hidden}
.stat-dist-bar .bar-fill{height:100%;border-radius:4px;transition:width .3s}
.stat-dist-bar .bar-label{width:80px;font-size:12px;color:var(--text-muted)}
.stat-dist-bar .bar-count{width:40px;font-size:12px;text-align:right;color:var(--text)}

.tools-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;padding:12px}
.tool-card{padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg-panel);cursor:pointer;transition:all .15s;text-align:center;font-size:13px}
.tool-card:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-glow)}
.tool-card .tool-icon{font-size:24px;margin-bottom:6px}
.tool-result{padding:16px;font-family:'SF Mono',Monaco,monospace;font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word}

.schema-editor{width:100%;min-height:200px;padding:12px;border:1px solid var(--border);border-radius:6px;background:var(--bg-input);color:var(--text);font-family:'SF Mono',Monaco,monospace;font-size:13px;outline:none;resize:vertical}
.schema-editor:focus{border-color:var(--accent)}
.schema-validation{padding:16px;max-height:300px;overflow:auto}
.schema-val-item{padding:6px 12px;border-radius:6px;margin:4px 0;font-size:12px;font-family:'SF Mono',Monaco,monospace}
.schema-val-item.ok{background:rgba(63,185,80,.1);color:var(--success)}
.schema-val-item.err{background:rgba(248,81,73,.1);color:var(--error)}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:center;justify-content:center}
.modal{background:var(--bg-panel);border:1px solid var(--border);border-radius:12px;width:500px;max-width:90vw;max-height:80vh;overflow:auto;box-shadow:0 8px 32px var(--shadow)}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid var(--border-light)}
.modal-header h3{font-size:16px;font-weight:600}
.modal-body{padding:16px}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;padding:16px;border-top:1px solid var(--border-light)}
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border-light)}
.setting-row label{font-size:13px;color:var(--text)}
.setting-row select,.setting-row input{padding:4px 8px;border-radius:4px;border:1px solid var(--border);background:var(--bg-input);color:var(--text);font-size:13px}

.import-dropdown{position:absolute;top:48px;right:16px;background:var(--bg-panel);border:1px solid var(--border);border-radius:8px;padding:8px;z-index:50;display:flex;flex-direction:column;gap:4px;min-width:200px;box-shadow:0 4px 12px var(--shadow)}
.import-dropdown .btn{justify-content:flex-start;text-align:left}
.import-divider{height:1px;background:var(--border-light);margin:4px 0}

.toast-container{position:fixed;bottom:40px;right:16px;z-index:1000;display:flex;flex-direction:column;gap:8px}
.toast{padding:10px 16px;border-radius:8px;background:var(--bg-panel);border:1px solid var(--border);color:var(--text);font-size:13px;box-shadow:0 4px 12px var(--shadow);animation:slideIn .25s ease;display:flex;align-items:center;gap:8px;max-width:400px}
.toast.success{border-color:var(--success)}
.toast.error{border-color:var(--error)}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.spinner{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:768px){
  .app-main{flex-direction:column}
  .input-panel{width:100%;max-width:none;max-height:40vh;border-right:none;border-bottom:1px solid var(--border)}
  .tabs{overflow-x:auto;flex-wrap:nowrap}
  .tab{padding:6px 8px;font-size:12px}
  .stats-grid{grid-template-columns:1fr 1fr}
  .diff-panel{flex-direction:column}
}
</style>

<div class="app" data-theme="dark">
  <header class="app-header">
    <div class="logo"><span class="logo-icon">JC</span> JSON Studio</div>
    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="graph">Graph</button>
      <button class="tab" data-tab="tree">Tree</button>
      <button class="tab" data-tab="format">Format</button>
      <button class="tab" data-tab="convert">Convert</button>
      <button class="tab" data-tab="codegen">Codegen</button>
      <button class="tab" data-tab="schema">Schema</button>
      <button class="tab" data-tab="diff">Diff</button>
      <button class="tab" data-tab="stats">Stats</button>
      <button class="tab" data-tab="tools">Tools</button>
      <button class="tab" data-tab="query">Query</button>
    </nav>
    <div class="header-spacer"></div>
    <button class="header-btn" id="importBtn" title="Import file">📂</button>
    <button class="header-btn" id="exportBtn" title="Export">💾</button>
    <button class="header-btn" id="settingsBtn" title="Settings">⚙️</button>
    <button class="header-btn" id="themeToggle" title="Toggle theme">🌙</button>
  </header>
  <main class="app-main">
    <section class="input-panel">
      <div class="panel-header">
        <span>Input <span class="format-badge" id="formatBadge" style="display:none">JSON</span></span>
        <div style="display:flex;gap:4px">
          <button class="btn btn-sm" id="sampleBtn">Sample</button>
          <button class="btn btn-sm" id="clearBtn">Clear</button>
        </div>
      </div>
      <div class="search-bar">
        <input class="search-input" id="searchInput" placeholder="Search keys/values..." />
        <button class="btn btn-sm" id="searchBtn">Find</button>
      </div>
      <div class="editor-wrapper">
        <div class="line-numbers" id="lineNumbers">1</div>
        <textarea id="jsonInput" spellcheck="false" placeholder="Paste JSON, JSONC, JSON5, YAML, CSV, XML, TOML, or Properties here... (Ctrl+Enter to visualize)"></textarea>
        <div class="drop-zone" id="dropZone" style="display:none">Drop file here</div>
      </div>
      <div class="input-actions">
        <button class="btn btn-primary" id="visualizeBtn">Visualize</button>
        <button class="btn" id="formatInputBtn">Format</button>
        <button class="btn" id="minifyBtn">Minify</button>
        <button class="btn" id="validateBtn">Validate</button>
      </div>
    </section>
    <section class="output-panel">
      <div class="output-toolbar" id="outputToolbar">
        <span class="filename" id="outputFilename">graph.svg</span>
        <button class="copy-btn" id="copyOutputBtn">Copy</button>
        <button class="copy-btn" id="downloadOutputBtn">Download</button>
      </div>
      <div class="output-content" id="outputContent">
        <div class="graph-container" id="graphContainer">
          <div class="graph-empty" id="graphEmpty">
            <div style="font-size:48px;opacity:.3">📊</div>
            <div>Enter data and click <b>Visualize</b> to see the graph</div>
            <div style="font-size:12px;color:var(--text-dim)">Or click <b>Sample</b> to try with example data</div>
          </div>
          <svg id="graphSvg" style="display:none">
            <rect id="graphBg" width="100%" height="100%" fill="transparent"/>
            <g id="graphTransform">
              <g id="edgeLayer"></g>
              <g id="nodeLayer"></g>
            </g>
          </svg>
          <div class="graph-legend" id="graphLegend" style="display:none">
            <div class="legend-item"><span class="legend-dot" style="background:var(--node-object)"></span>Object</div>
            <div class="legend-item"><span class="legend-dot" style="background:var(--node-array)"></span>Array</div>
            <div class="legend-item"><span class="legend-dot" style="background:var(--node-string)"></span>String</div>
            <div class="legend-item"><span class="legend-dot" style="background:var(--node-number)"></span>Number</div>
            <div class="legend-item"><span class="legend-dot" style="background:var(--node-boolean)"></span>Boolean</div>
            <div class="legend-item"><span class="legend-dot" style="background:var(--node-null)"></span>Null</div>

// ── Utilities ──
function $(id){return document.getElementById(id)}
function toast(msg,type=''){const el=document.createElement('div');el.className='toast '+type;el.textContent=msg;$('toastContainer').appendChild(el);setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .3s';setTimeout(()=>el.remove(),300)},3000)}
function escapeHtml(s){return s==null?'':String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function escapeXml(s){return s==null?'':String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function capitalize(s){return s.charAt(0).toUpperCase()+s.slice(1).replace(/[^a-zA-Z0-9]/g,'')}
function truncate(s,n){return s==null?'':String(s).length>n?String(s).slice(0,n-1)+'…':String(s)}
function copyText(text){navigator.clipboard.writeText(text).then(()=>toast('Copied!','success')).catch(()=>{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('Copied!','success')})}
function downloadFile(filename,content,type='text/plain'){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;a.click();URL.revokeObjectURL(url)}
function getType(v){if(v===null)return 'null';if(Array.isArray(v))return 'array';return typeof v}
function getValuePreview(node){const t=node.type;if(t==='object')return '{'+node.childIds.length+'}';if(t==='array')return '['+node.childIds.length+']';if(t==='null')return 'null';if(t==='string')return '"'+truncate(node.value,20)+'"';return truncate(node.value,25)}
function getIndent(){return settings.indent==='tab'?'	':settings.indent==='0'?'':' '.repeat(parseInt(settings.indent))}
function sortObjectKeys(obj){if(Array.isArray(obj))return obj.map(sortObjectKeys);if(obj&&typeof obj==='object'){const sorted={};for(const k of Object.keys(obj).sort())sorted[k]=sortObjectKeys(obj[k]);return sorted}return obj}

// ── Line Numbers & Char Count ──

// ── Format Detection ──
function detectFormat(text){
  const t=text.trim();
  if(!t)return 'json';
  if(t.startsWith('<?xml')||t.startsWith('<'))return 'xml';
  if(/^\[[\w.]+\]/.test(t)&&t.includes('\n')&&t.includes('='))return 'toml';
  if(t.startsWith('{')||t.startsWith('[')){
    if(t.includes('//')||t.includes('/*'))return 'jsonc';
    if(/'$/.test(t)||/\w:$/.test(t.replace(/".*?"/g,''))||/[,]\s*[}\]]/.test(t))return 'json5';
    return 'json';
  }
  if(/^\w+\s*=/.test(t)&&!t.includes(': ')&&!t.includes('\n  '))return 'properties';
  if(t.includes(',')&&t.includes('\n')&&!t.startsWith('{')&&!t.startsWith('[')){const fl=t.split('\n')[0];if((fl.match(/,/g)||[]).length>=1)return 'csv'}
  return 'yaml';
}

// ── JSONC (JSON with Comments) ──
function stripJsonComments(text){
  let result='',i=0,inStr=false,strCh='';
  while(i<text.length){
    const c=text[i],n=text[i+1];
    if(inStr){
      if(c==='\\'){result+=c+(text[i+1]||'');i+=2;continue}
      if(c===strCh)inStr=false;
      result+=c;i++;
    }else{
      if(c==='"'||c==="'"){inStr=true;strCh=c;result+=c;i++}
      else if(c==='/'&&n==='/'){while(i<text.length&&text[i]!=='\n')i++}
      else if(c==='/'&&n==='*'){i+=2;while(i<text.length&&!(text[i]==='*'&&text[i+1]==='/'))i++;i+=2}
      else{result+=c;i++}
    }
  }
  return result.replace(/,\s*([}\]])/g,'$1');
}
function parseJsonc(text){return JSON.parse(stripJsonComments(text))}

// ── JSON5 ──
async function parseJson5(text){
  const JSON5=await import('https://esm.sh/json5@2.2.3');
  return JSON5.parse(text);
}
function stringifyJson5(obj){
  return JSON5_stringify(obj);
}
function JSON5_stringify(obj,indent,level){
  if(indent===undefined)indent=getIndent()||'  ';
  if(level===undefined)level=0;
  const pad=indent.repeat(level),pad2=indent.repeat(level+1);
  if(obj===null)return 'null';
  if(obj===undefined)return 'undefined';
  if(typeof obj==='boolean')return String(obj);
  if(typeof obj==='number')return String(obj);
  if(typeof obj==='string')return JSON5_quoteString(obj);
  if(typeof obj==='bigint')return String(obj)+'n';
  if(Array.isArray(obj)){
    if(obj.length===0)return '[]';
    const items=obj.map(v=>pad2+JSON5_stringify(v,indent,level+1));
    return '[\n'+items.join(',\n')+'\n'+pad+']';
  }
  if(typeof obj==='object'){
    const keys=Object.keys(obj);
    if(keys.length===0)return '{}';
    const items=keys.map(k=>pad2+JSON5_quoteKey(k)+': '+JSON5_stringify(obj[k],indent,level+1));
    return '{\n'+items.join(',\n')+'\n'+pad+'}';
  }
  return JSON.stringify(obj);
}
function JSON5_quoteString(s){
  if(/["']/.test(s)&&!s.includes('"'))return "'"+s.replace(/'/g,"\\'")+"'";
  return JSON.stringify(s);
}
function JSON5_quoteKey(k){
  if(/^[A-Za-z_$][A-Za-z0-9_$]*$/.test(k))return k;
  return JSON5_quoteString(k);
}

// ── YAML ──
let _yamlCache=null;
async function getYaml(){if(!_yamlCache)_yamlCache=await import('https://esm.sh/js-yaml@4.1.0');return _yamlCache}
async function parseYaml(text){const yaml=await getYaml();return yaml.load(text)}
async function stringifyYaml(obj){const yaml=await getYaml();return yaml.dump(obj,{indent:settings.yamlIndent,lineWidth:120,noRefs:true})}

// ── CSV ──
function parseCSV(text,delim){
  delim=delim||settings.csvDelim;
  if(delim==='\\t')delim='\t';
  const rows=[];
  let row=[],field='',inQuotes=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQuotes){
      if(c==='"'){
        if(text[i+1]==='"'){field+='"';i++}
        else inQuotes=false;
      }else field+=c;
    }else{
      if(c==='"')inQuotes=true;
      else if(c===delim){row.push(field);field=''}
      else if(c==='\n'){row.push(field);rows.push(row);row=[];field=''}
      else if(c==='\r'){}
      else field+=c;
    }
  }
  if(field||row.length){row.push(field);rows.push(row)}
  const nonEmpty=rows.filter(r=>r.some(f=>f.trim()));
  if(nonEmpty.length<2)return [];
  const headers=nonEmpty[0].map(h=>h.trim());
  return nonEmpty.slice(1).map(r=>{
    const obj={};
    headers.forEach((h,i)=>{
      const v=(r[i]||'').trim();
      if(v!==''){const n=Number(v);obj[h]=v==='true'?true:v==='false'?false:(isNaN(n)||v===''?v:n)}
      else obj[h]=null;
    });
    return obj;
  });
}
function jsonToCsv(data,delim){
  delim=delim||settings.csvDelim;
  if(delim==='\\t')delim='\t';
  let arr=Array.isArray(data)?data:[data];
  arr=arr.filter(o=>o&&typeof o==='object'&&!Array.isArray(o));
  if(arr.length===0)return '';
  const keys=[...new Set(arr.flatMap(o=>Object.keys(o)))];
  const esc=v=>{if(v==null)return '';if(typeof v==='object')return '"'+JSON.stringify(v).replace(/"/g,'""')+'"';const s=String(v);return /[,"\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const lines=[keys.join(delim)];
  for(const row of arr)lines.push(keys.map(k=>esc(row[k])).join(delim));
  return lines.join('\n');
}

// ── XML ──
function parseXML(text){
  const parser=new DOMParser();
  const doc=parser.parseFromString(text,'text/xml');
  const err=doc.querySelector('parsererror');
  if(err)throw new Error('XML parse error');
  function elToObj(el){
    const obj={};
    for(const attr of el.attributes)obj['@'+attr.name]=attr.value;
    for(const child of el.children){
      const childObj=elToObj(child);
      if(obj[child.tagName]){if(!Array.isArray(obj[child.tagName]))obj[child.tagName]=[obj[child.tagName]];obj[child.tagName].push(childObj)}
      else obj[child.tagName]=childObj;
    }
    const txt=el.textContent.trim();
    if(el.children.length===0&&txt)obj['#text']=txt;
    return obj;
  }
  const root=doc.documentElement;
  return {[root.tagName]:elToObj(root)};
}
function jsonToXml(data,name,indent){
  const pad='  '.repeat(indent);
  name=name||settings.xmlRoot;
  if(data===null)return pad+'<'+name+' null="true"/>';
  if(typeof data!=='object')return pad+'<'+name+'>'+escapeXml(data)+'</'+name+'>';
  if(Array.isArray(data))return data.map(i=>jsonToXml(i,name,indent)).join('\n');
  let r=pad+'<'+name+'>\n';
  for(const[k,v]of Object.entries(data)){
    if(k.startsWith('@'))continue;
    r+=jsonToXml(v,k,indent+1)+'\n';
  }
  r+=pad+'</'+name+'>';
  return r;
}

// ── TOML ──
async function parseToml(text){
  const toml=await import('https://esm.sh/@ltd/j-toml@1.38.0');
  return toml.parse(text,{1.0:true});
}
function tomlStringify(obj,prefix){
  prefix=prefix||'';
  let r='';
  for(const[k,v]of Object.entries(obj)){
    const key=/^[A-Za-z_][A-Za-z0-9_]*$/.test(k)?k:JSON.stringify(k);
    if(v===null)r+=key+' = ""\n';
    else if(typeof v==='boolean')r+=key+' = '+v+'\n';
    else if(typeof v==='number')r+=key+' = '+v+'\n';
    else if(typeof v==='string')r+=key+' = '+JSON.stringify(v)+'\n';
    else if(Array.isArray(v))r+=key+' = ['+v.map(i=>JSON.stringify(String(i))).join(', ')+']\n';
    else if(typeof v==='object'){
      const section=prefix?prefix+'.'+k:k;
      r+='\n['+section+']\n'+tomlStringify(v,section);
    }
  }
  return r;
}

// ── Properties ──
function parseProperties(text){
  const result={};
  for(let line of text.split('\n')){
    line=line.trim();
    if(!line||line.startsWith('#')||line.startsWith('!'))continue;
    const eqIdx=line.indexOf('=');
    if(eqIdx===-1)continue;
    const key=line.slice(0,eqIdx).trim();
    const val=line.slice(eqIdx+1).trim();
    setNestedProp(result,key.split('.'),val);
  }
  return result;
}
function setNestedProp(obj,keys,val){
  for(let i=0;i<keys.length-1;i++){
    if(!obj[keys[i]])obj[keys[i]]={};
    obj=obj[keys[i]];
  }
  obj[keys[keys.length-1]]=val;
}
function toProperties(data,prefix){
  prefix=prefix||'';
  let r='';
  for(const[k,v]of Object.entries(data)){
    const key=prefix?prefix+'.'+k:k;
    if(v===null)r+=key+'=\n';
    else if(typeof v==='object'&&!Array.isArray(v))r+=toProperties(v,key);
    else if(Array.isArray(v))v.forEach((item,i)=>{r+=key+'['+i+']='+item+'\n'});
    else r+=key+'='+v+'\n';
  }
  return r;
}

// ── Parse Input (dispatcher) ──
async function parseInput(text){
  const fmt=detectFormat(text);
  state.inputFormat=fmt;
  const badge=$('formatBadge');
  if(badge){badge.style.display='inline';badge.textContent=fmt.toUpperCase()}
  if(fmt==='json')return JSON.parse(text);
  if(fmt==='jsonc')return parseJsonc(text);
  if(fmt==='json5')return await parseJson5(text);
  if(fmt==='yaml')return await parseYaml(text);
  if(fmt==='csv')return parseCSV(text);
  if(fmt==='xml')return parseXML(text);
  if(fmt==='toml')return await parseToml(text);
  if(fmt==='properties')return parseProperties(text);
  return JSON.parse(text);
}

// ── Serialize (dispatcher) ──
async function serializeData(data,fmt){
  if(fmt==='json')return JSON.stringify(data,null,getIndent()||undefined);
  if(fmt==='jsonc')return JSON.stringify(data,null,getIndent()||undefined);
  if(fmt==='json5')return JSON5_stringify(data);
  if(fmt==='yaml')return await stringifyYaml(data);
  if(fmt==='csv')return jsonToCsv(data);
  if(fmt==='xml')return jsonToXml(data,settings.xmlRoot,0);
  if(fmt==='toml')return tomlStringify(data);
  if(fmt==='properties')return toProperties(data);
  return JSON.stringify(data,null,getIndent());
}

// ── Graph Builder ──
function buildGraph(data){
  state.nodes=[];state.edges=[];
  buildNode(data,'root',null,0);
}
function buildNode(value,key,parentId,depth){
  if(state.nodes.length>=MAX_NODES)return -1;
  const id=state.nodes.length;
  const type=getType(value);
  const node={id,key,type,value,depth,parentId,x:0,y:0,vx:0,vy:0,width:100,height:42,collapsed:depth>=3,childIds:[],fixed:false,visible:true};
  state.nodes.push(node);
  if(parentId!==null){state.nodes[parentId].childIds.push(id);state.edges.push({source:parentId,target:id,label:key})}
  if(type==='object'){for(const[k,v]of Object.entries(value)){if(state.nodes.length>=MAX_NODES)break;buildNode(v,k,id,depth+1)}}
  else if(type==='array'){for(let i=0;i<value.length;i++){if(state.nodes.length>=MAX_NODES)break;buildNode(value[i],'['+i+']',id,depth+1)}}
  return id;
}

// ── Visible Nodes/Edges ──
function computeVisible(){
  state.visibleNodes=[];state.visibleEdges=[];
  const visSet=new Set();
  function visit(id){
    if(id<0)return;const n=state.nodes[id];visSet.add(id);state.visibleNodes.push(n);
    if(n.collapsed)return;
    for(const cid of n.childIds)visit(cid);
  }
  if(state.nodes.length>0)visit(0);
  for(const e of state.edges){if(visSet.has(e.source)&&visSet.has(e.target))state.visibleEdges.push(e)}
}

// ── SVG Element Creation ──
const _mc=document.createElement('canvas');const _mctx=_mc.getContext('2d');
function measureText(text,font){_mctx.font=font;return _mctx.measureText(text).width}
function createNodeEl(node){
  const g=document.createElementNS(SVG_NS,'g');
  g.classList.add('graph-node');g.dataset.id=node.id;
  const keyText=truncate(node.key==='root'?'root':node.key,18);
  const valText=getValuePreview(node);
  const kw=measureText(keyText,'bold 12px monospace');
  const vw=measureText(valText,'11px monospace');
  const w=Math.max(kw,vw)+24;const h=42;node.width=w;node.height=h;
  const rect=document.createElementNS(SVG_NS,'rect');
  rect.setAttribute('x',-w/2);rect.setAttribute('y',-h/2);rect.setAttribute('width',w);rect.setAttribute('height',h);
  rect.setAttribute('rx',7);rect.classList.add('node-rect');
  const stripe=document.createElementNS(SVG_NS,'rect');
  stripe.setAttribute('x',-w/2);stripe.setAttribute('y',-h/2);stripe.setAttribute('width',3);stripe.setAttribute('height',h);
  stripe.setAttribute('rx',2);stripe.classList.add('node-stripe',node.type);
  const kt=document.createElementNS(SVG_NS,'text');
  kt.setAttribute('x',0);kt.setAttribute('y',-2);kt.classList.add('node-key');kt.textContent=keyText;
  const vt=document.createElementNS(SVG_NS,'text');
  vt.setAttribute('x',0);vt.setAttribute('y',13);vt.classList.add('node-value',node.type);vt.textContent=valText;
  if((node.type==='object'||node.type==='array')&&node.childIds.length>0){
    const ind=document.createElementNS(SVG_NS,'text');
    ind.setAttribute('x',w/2-8);ind.setAttribute('y',-h/2+10);ind.setAttribute('font-size','10');ind.setAttribute('fill','var(--text-muted)');
    ind.textContent=node.collapsed?'+':'−';ind.style.pointerEvents='none';g.appendChild(ind);
  }
  g.appendChild(rect);g.appendChild(stripe);g.appendChild(kt);g.appendChild(vt);
  return g;
}
function createEdgeEl(){const line=document.createElementNS(SVG_NS,'line');line.classList.add('graph-edge');return line}

// ── Graph Rendering ──
function renderGraphElements(){
  const el=$('edgeLayer'),nl=$('nodeLayer');el.innerHTML='';nl.innerHTML='';
  for(const edge of state.visibleEdges){edge.el=createEdgeEl();el.appendChild(edge.el)}
  for(const node of state.visibleNodes){node.el=createNodeEl(node);nl.appendChild(node.el);setupNodeInteraction(node)}
  applySearchHighlight();
}
function updateGraphPositions(){
  for(const edge of state.visibleEdges){
    const s=state.nodes[edge.source],t=state.nodes[edge.target];
    edge.el.setAttribute('x1',s.x);edge.el.setAttribute('y1',s.y);edge.el.setAttribute('x2',t.x);edge.el.setAttribute('y2',t.y);
  }
  for(const node of state.visibleNodes)node.el.setAttribute('transform','translate('+node.x+','+node.y+')');
}
function updateTransform(){$('graphTransform').setAttribute('transform','translate('+state.transform.x+','+state.transform.y+') scale('+state.transform.scale+')')}

// ── Force-Directed Simulation ──
const SIM={repulsion:6000,spring:0.04,linkDist:100,damping:0.82,center:0.003};
function initPositions(){
  const n=state.visibleNodes.length;const cx=$('graphSvg').clientWidth/2,cy=$('graphSvg').clientHeight/2;
  if(state.layout==='radial'){
    for(let i=0;i<n;i++){const node=state.visibleNodes[i];const angle=(i/n)*Math.PI*2;const r=60+node.depth*80;node.x=cx+Math.cos(angle)*r;node.y=cy+Math.sin(angle)*r;node.vx=0;node.vy=0}
  }else if(state.layout==='tree'){
    const byDepth={};
    for(const node of state.visibleNodes){if(!byDepth[node.depth])byDepth[node.depth]=[];byDepth[node.depth].push(node)}
    const maxDepth=Math.max(...Object.keys(byDepth).map(Number));
    const levelH=Math.min(80,( $('graphSvg').clientHeight-100)/(maxDepth+1));
    for(let d=0;d<=maxDepth;d++){
      const nodes=byDepth[d]||[];const w=$('graphSvg').clientWidth;
      nodes.forEach((node,i)=>{node.x=w*(i+1)/(nodes.length+1);node.y=60+d*levelH;node.vx=0;node.vy=0});
    }
  }else{
    for(let i=0;i<n;i++){const node=state.visibleNodes[i];const angle=(i/n)*Math.PI*2;const r=80+node.depth*60;node.x=cx+Math.cos(angle)*r+(Math.random()-0.5)*40;node.y=cy+Math.sin(angle)*r+(Math.random()-0.5)*40;node.vx=0;node.vy=0}
  }
}
function simulateStep(){
  const nodes=state.visibleNodes;const n=nodes.length;
  if(state.layout==='tree')return;
  for(let i=0;i<n;i++){
    for(let j=i+1;j<n;j++){
      const a=nodes[i],b=nodes[j];let dx=b.x-a.x,dy=b.y-a.y;let d2=dx*dx+dy*dy;
      if(d2<1){d2=1;dx=Math.random()-0.5;dy=Math.random()-0.5}
      const d=Math.sqrt(d2);const f=SIM.repulsion/d2;const fx=(dx/d)*f,fy=(dy/d)*f;
      if(!a.fixed){a.vx-=fx;a.vy-=fy}if(!b.fixed){b.vx+=fx;b.vy+=fy}
    }
  }
  for(const edge of state.visibleEdges){
    const s=state.nodes[edge.source],t=state.nodes[edge.target];
    let dx=t.x-s.x,dy=t.y-s.y;const d=Math.sqrt(dx*dx+dy*dy)||1;const f=(d-SIM.linkDist)*SIM.spring;
    const fx=(dx/d)*f,fy=(dy/d)*f;if(!s.fixed){s.vx+=fx;s.vy+=fy}if(!t.fixed){t.vx-=fx;t.vy-=fy}
  }
  const cx=$('graphSvg').clientWidth/2,cy=$('graphSvg').clientHeight/2;
  for(const node of nodes){if(node.fixed)continue;node.vx=(node.vx+(cx-node.x)*SIM.center)*SIM.damping;node.vy=(node.vy+(cy-node.y)*SIM.center)*SIM.damping;node.x+=node.vx;node.y+=node.vy}
}
function startSim(){
  stopSim();let stable=0;
  function tick(){
    let energy=0;for(const n of state.visibleNodes)energy+=n.vx*n.vx+n.vy*n.vy;
    if(energy<0.3){stable++;if(stable>30){stopSim();return}}else stable=0;
    simulateStep();updateGraphPositions();state.simFrame=requestAnimationFrame(tick);
  }
  state.simFrame=requestAnimationFrame(tick);
}
function stopSim(){if(state.simFrame){cancelAnimationFrame(state.simFrame);state.simFrame=null}}

// ── Graph Interaction ──
function setupGraphInteraction(){
  const svg=$('graphSvg');
  svg.addEventListener('mousedown',e=>{
    if(e.target===svg||e.target.id==='graphBg'||e.target.id==='graphTransform'||e.target.tagName==='g'&&e.target.id==='edgeLayer'){
      state.isPanning=true;state.panStart={x:e.clientX-state.transform.x,y:e.clientY-state.transform.y};
    }
  });
  document.addEventListener('mousemove',e=>{if(state.isPanning){state.transform.x=e.clientX-state.panStart.x;state.transform.y=e.clientY-state.panStart.y;updateTransform()}});
  document.addEventListener('mouseup',()=>{state.isPanning=false});
  svg.addEventListener('wheel',e=>{
    e.preventDefault();const rect=svg.getBoundingClientRect();const mx=e.clientX-rect.left,my=e.clientY-rect.top;
    const delta=-e.deltaY*0.001;const ns=Math.max(0.1,Math.min(5,state.transform.scale*(1+delta)));
    state.transform.x=mx-(mx-state.transform.x)*(ns/state.transform.scale);state.transform.y=my-(my-state.transform.y)*(ns/state.transform.scale);
    state.transform.scale=ns;updateTransform();
  },{passive:false});
  // Touch support
  let touchStart=null,lastTouchDist=null;
  svg.addEventListener('touchstart',e=>{
    if(e.touches.length===1){touchStart={x:e.touches[0].clientX-state.transform.x,y:e.touches[0].clientY-state.transform.y}}
    else if(e.touches.length===2){lastTouchDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)}
  },{passive:true});
  svg.addEventListener('touchmove',e=>{
    e.preventDefault();
    if(e.touches.length===1&&touchStart){state.transform.x=e.touches[0].clientX-touchStart.x;state.transform.y=e.touches[0].clientY-touchStart.y;updateTransform()}
    else if(e.touches.length===2&&lastTouchDist){
      const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
      const ns=Math.max(0.1,Math.min(5,state.transform.scale*d/lastTouchDist));lastTouchDist=d;state.transform.scale=ns;updateTransform();
    }
  },{passive:false});
}
function setupNodeInteraction(node){
  let dragging=false,startMx,startMy,startNx,startNy,moved=false;
  node.el.addEventListener('mousedown',e=>{
    e.stopPropagation();dragging=true;moved=false;node.fixed=true;startMx=e.clientX;startMy=e.clientY;startNx=node.x;startNy=node.y;
  });
  document.addEventListener('mousemove',e=>{
    if(!dragging)return;const dx=e.clientX-startMx,dy=e.clientY-startMy;
    if(Math.abs(dx)>3||Math.abs(dy)>3)moved=true;
    node.x=startNx+dx/state.transform.scale;node.y=startNy+dy/state.transform.scale;node.vx=0;node.vy=0;updateGraphPositions();
  });
  document.addEventListener('mouseup',()=>{if(dragging){dragging=false;node.fixed=false;if(!moved)toggleNode(node);startSim()}});
  node.el.addEventListener('mouseenter',()=>{
    node.el.querySelector('.node-rect').setAttribute('stroke-width','2.5');
    for(const edge of state.visibleEdges){if(edge.source===node.id||edge.target===node.id)edge.el.classList.add('highlighted')}
  });
  node.el.addEventListener('mouseleave',()=>{
    node.el.querySelector('.node-rect').setAttribute('stroke-width','1.5');
    for(const edge of state.visibleEdges)edge.el.classList.remove('highlighted');
  });
}
function toggleNode(node){
  if(node.type!=='object'&&node.type!=='array')return;if(node.childIds.length===0)return;
  node.collapsed=!node.collapsed;computeVisible();renderGraphElements();updateGraphPositions();startSim();
  $('nodeCountStatus').textContent=state.visibleNodes.length+' visible nodes';
}
function expandAllNodes(){for(const n of state.nodes)n.collapsed=false;computeVisible();renderGraphElements();updateGraphPositions();startSim();$('nodeCountStatus').textContent=state.visibleNodes.length+' visible nodes'}
function collapseAllNodes(){for(const n of state.nodes){if(n.depth>=1&&n.childIds.length>0)n.collapsed=true}computeVisible();renderGraphElements();updateGraphPositions();startSim();$('nodeCountStatus').textContent=state.visibleNodes.length+' visible nodes'}
function fitToView(){
  if(state.visibleNodes.length===0)return;
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  for(const n of state.visibleNodes){minX=Math.min(minX,n.x-n.width/2);minY=Math.min(minY,n.y-n.height/2);maxX=Math.max(maxX,n.x+n.width/2);maxY=Math.max(maxY,n.y+n.height/2)}
  const pad=40;const gw=maxX-minX+pad*2,gh=maxY-minY+pad*2;
  const sw=$('graphSvg').clientWidth,sh=$('graphSvg').clientHeight;
  const scale=Math.min(sw/gw,sh/gh,2);state.transform.scale=scale;
  state.transform.x=sw/2-(minX+maxX)/2*scale;state.transform.y=sh/2-(minY+maxY)/2*scale;updateTransform();
}

// ── Search ──
function searchInGraph(term){
  state.searchMatches=[];
  if(!term){applySearchHighlight();return 0}
  const tl=term.toLowerCase();
  for(const n of state.nodes){
    if(String(n.key).toLowerCase().includes(tl)||(n.value!=null&&String(n.value).toLowerCase().includes(tl)))state.searchMatches.push(n.id);
    if(n.collapsed===false)continue;
    for(const id of state.searchMatches){const node=state.nodes[id];let p=node.parentId;while(p!==null){state.nodes[p].collapsed=false;p=state.nodes[p].parentId}}
  }
  computeVisible();renderGraphElements();updateGraphPositions();startSim();applySearchHighlight();
  return state.searchMatches.length;
}
function applySearchHighlight(){
  document.querySelectorAll('.graph-node.search-match').forEach(el=>el.classList.remove('search-match'));
  for(const id of state.searchMatches){const n=state.nodes[id];if(n&&n.el)n.el.classList.add('search-match')}
}

    el.onclick=function(){
      const next=this.parentElement.querySelector('.tree-children');

    };

function treeMatchesSearch(data,key,search){
  if(!search)return true;
  if(String(key).toLowerCase().includes(search))return true;
  if(data!==null&&typeof data!=='object'&&String(data).toLowerCase().includes(search))return true;
  if(data&&typeof data==='object'){for(const[k,v]of Object.entries(data)){if(treeMatchesSearch(v,k,search))return true}}
  return false;
}
function buildTreeHtml(data,key,isLast,depth,search){
  if(search&&!treeMatchesSearch(data,key,search))return '';
  const type=getType(data);const comma=isLast?'':'<span class="tree-comma">,</span>';
  const keyStr='<span class="tree-key">"'+escapeHtml(key)+'"</span>';
  if(type==='object'){
    const keys=Object.keys(data);
    if(keys.length===0)return '<div class="tree-node"><span class="tree-toggle"></span>'+keyStr+': <span class="tree-bracket">{}</span>'+comma+'</div>';
    const children=keys.map((k,i)=>buildTreeHtml(data[k],k,i===keys.length-1,depth+1,search)).join('');
    const collapsed=depth>=2;
    return '<div class="tree-node"><span class="tree-toggle">'+(collapsed?'▶':'▼')+'</span>'+keyStr+': <span class="tree-bracket">{</span><div class="tree-children"'+(collapsed?' style="display:none"':'')+'>'+children+'</div><span class="tree-bracket">}</span>'+comma+'</div>';
  }else if(type==='array'){
    if(data.length===0)return '<div class="tree-node"><span class="tree-toggle"></span>'+keyStr+': <span class="tree-bracket">[]</span>'+comma+'</div>';
    const children=data.map((v,i)=>buildTreeHtml(v,String(i),i===data.length-1,depth+1,search)).join('');
    const collapsed=depth>=2;
    return '<div class="tree-node"><span class="tree-toggle">'+(collapsed?'▶':'▼')+'</span>'+keyStr+': <span class="tree-bracket">[</span><div class="tree-children"'+(collapsed?' style="display:none"':'')+'>'+children+'</div><span class="tree-bracket">]</span>'+comma+'</div>';
  }else{
    let valHtml='';
    if(type==='string')valHtml='<span class="tree-value string">"'+escapeHtml(data)+'"</span>';
    else if(type==='number')valHtml='<span class="tree-value number">'+data+'</span>';
    else if(type==='boolean')valHtml='<span class="tree-value boolean">'+data+'</span>';
    else valHtml='<span class="tree-value null">null</span>';
    return '<div class="tree-node"><span class="tree-toggle"></span>'+keyStr+': '+valHtml+comma+'</div>';
  }
}

function jsonToTS(obj,name='Root'){
  const ifaces=[];
  function process(o,iname){
    const fields=[];
    for(const[k,v]of Object.entries(o)){const t=getTSType(v,k,iname);fields.push('  '+k+': '+t+';')}
    ifaces.push('interface '+iname+' {\n'+fields.join('\n')+'\n}');
  }
  function getTSType(v,k,parent){
    if(v===null)return 'null';
    if(Array.isArray(v)){if(v.length===0)return 'any[]';return getTSType(v[0],k,parent)+'[]'}
    switch(typeof v){case 'string':return 'string';case 'number':return 'number';case 'boolean':return 'boolean';case 'object':{const cn=capitalize(k);process(v,cn);return cn}}
    return 'any';
  }
  if(typeof obj==='object'&&obj!==null&&!Array.isArray(obj))process(obj,name);

function validateAgainstSchema(){
  if(!state.parsed){toast('No data to validate','error');return}
  let schema;
  try{schema=JSON.parse($('schemaEditor').value)}catch(e){toast('Invalid schema JSON','error');return}
  const errors=validateSchema(state.parsed,schema,'$');
  const valEl=$('schemaValidation');valEl.style.display='block';valEl.innerHTML='';
  if(errors.length===0){valEl.innerHTML='<div class="schema-val-item ok">✓ Data is valid against the schema</div>';toast('Valid!','success')}
  else{
    errors.forEach(err=>{const item=document.createElement('div');item.className='schema-val-item err';item.textContent='✗ '+err;valEl.appendChild(item)});
    toast(errors.length+' validation errors','error');
  }

function validateSchema(data,schema,path){
  const errors=[];
  if(!schema)return errors;
  if(schema.type){
    const t=getType(data);
    const valid=schema.type===t||(schema.type==='integer'&&t==='number'&&Number.isInteger(data))||(schema.type==='number'&&t==='number');
    if(!valid)errors.push(path+': expected '+schema.type+', got '+t);
  }
  if(schema.enum&&!schema.enum.includes(data))errors.push(path+': value not in enum ['+schema.enum.join(', ')+']');
  if(schema.minimum!==undefined&&typeof data==='number'&&data<schema.minimum)errors.push(path+': '+data+' < minimum '+schema.minimum);
  if(schema.maximum!==undefined&&typeof data==='number'&&data>schema.maximum)errors.push(path+': '+data+' > maximum '+schema.maximum);
  if(schema.minLength!==undefined&&typeof data==='string'&&data.length<schema.minLength)errors.push(path+': string length < minLength '+schema.minLength);
  if(schema.maxLength!==undefined&&typeof data==='string'&&data.length>schema.maxLength)errors.push(path+': string length > maxLength '+schema.maxLength);
  if(schema.pattern!==undefined&&typeof data==='string'&&!new RegExp(schema.pattern).test(data))errors.push(path+': does not match pattern '+schema.pattern);
  if(schema.required&&typeof data==='object'&&!Array.isArray(data)){
    for(const req of schema.required){if(!(req in data))errors.push(path+'.'+req+': required property missing')}
  }
  if(schema.properties&&typeof data==='object'&&!Array.isArray(data)){
    for(const[k,v]of Object.entries(schema.properties)){if(k in data)errors.push(...validateSchema(data[k],v,path+'.'+k))}
  }
  if(schema.items&&Array.isArray(data)){for(let i=0;i<data.length;i++)errors.push(...validateSchema(data[i],schema.items,path+'['+i+']'))}
  return errors;
}

function renderDiffBar(){

    '<div class="diff-output" id="diffOutput"></div>';
  $('runDiffBtn').onclick=runDiff;

async function runDiff(){
  const leftText=$('diffLeftInput').value.trim(),rightText=$('diffRightInput').value.trim();
  state.diffLeft=leftText;state.diffRight=rightText;
  if(!leftText||!rightText){toast('Enter both sides','error');return}
  let left,right;
  try{left=await parseInput(leftText)}catch(e){toast('Left parse error: '+e.message,'error');return}
  try{right=await parseInput(rightText)}catch(e){toast('Right parse error: '+e.message,'error');return}
  const diffs=computeDiff(left,right,'');
  const out=$('diffOutput');
  if(diffs.length===0){out.innerHTML='<div style="padding:16px;color:var(--success)">✓ Objects are identical</div>';state.lastTextOutput='Objects are identical';return}
  let html='';
  for(const d of diffs){
    if(d.type==='added')html+='<div class="diff-line added">+ '+escapeHtml(d.path)+': '+escapeHtml(JSON.stringify(d.value))+'</div>';
    else if(d.type==='removed')html+='<div class="diff-line removed">- '+escapeHtml(d.path)+': '+escapeHtml(JSON.stringify(d.value))+'</div>';
    else if(d.type==='changed')html+='<div class="diff-line changed">~ '+escapeHtml(d.path)+': '+escapeHtml(JSON.stringify(d.oldVal))+' → '+escapeHtml(JSON.stringify(d.newVal))+'</div>';
  }
  out.innerHTML=html;state.lastTextOutput=diffs.map(d=>d.type+': '+d.path).join('\n');
  $('outputFilename').textContent='diff.txt';
}
function computeDiff(left,right,path){
  const diffs=[];
  if(getType(left)!==getType(right)){diffs.push({type:'changed',path:path||'$',oldVal:left,newVal:right});return diffs}
  if(Array.isArray(left)){
    const maxLen=Math.max(left.length,right.length);
    for(let i=0;i<maxLen;i++){
      if(i>=left.length)diffs.push({type:'added',path:path+'['+i+']',value:right[i]});
      else if(i>=right.length)diffs.push({type:'removed',path:path+'['+i+']',value:left[i]});
      else diffs.push(...computeDiff(left[i],right[i],path+'['+i+']'));
    }
    return diffs;
  }
  if(left&&typeof left==='object'){
    const allKeys=new Set([...Object.keys(left),...Object.keys(right)]);
    for(const k of allKeys){
      if(!(k in left))diffs.push({type:'added',path:path+'.'+k,value:right[k]});
      else if(!(k in right))diffs.push({type:'removed',path:path+'.'+k,value:left[k]});
      else diffs.push(...computeDiff(left[k],right[k],path+'.'+k));
    }
    return diffs;
  }
  if(left!==right)diffs.push({type:'changed',path:path||'$',oldVal:left,newVal:right});
  return diffs;
}

function computeStats(data,path,depth,keySet,longestKeys){
  path=path||'';depth=depth||0;keySet=keySet||new Set();longestKeys=longestKeys||[];
  const s={totalNodes:1,maxDepth:depth,totalKeys:0,uniqueKeys:0,objects:0,arrays:0,strings:0,numbers:0,booleans:0,nulls:0,sizeBytes:0,arrays:0,longestKeys:longestKeys};
  const t=getType(data);
  if(t==='null')s.nulls++;
  else if(t==='string')s.strings++;
  else if(t==='number')s.numbers++;
  else if(t==='boolean')s.booleans++;
  else if(t==='array'){s.arrays++;s.sizeBytes+=JSON.stringify(data).length;for(const v of data){const sub=computeStats(v,path,depth+1,keySet,longestKeys);mergeStats(s,sub)}}
  else if(t==='object'){s.objects++;s.sizeBytes+=JSON.stringify(data).length;for(const[k,v]of Object.entries(data)){s.totalKeys++;keySet.add(k);if(k.length>=3)longestKeys.push({k,len:k.length});for(const sub of [computeStats(v,path+'.'+k,depth+1,keySet,longestKeys)])mergeStats(s,sub)}}
  if(path===''){s.uniqueKeys=keySet.size;longestKeys.sort((a,b)=>b.len-a.len);s.longestKeys=longestKeys.slice(0,10);s.sizeBytes+=JSON.stringify(data).length}
  return s;
}
function mergeStats(a,b){a.totalNodes+=b.totalNodes;a.maxDepth=Math.max(a.maxDepth,b.maxDepth);a.totalKeys+=b.totalKeys;a.objects+=b.objects;a.arrays+=b.arrays;a.strings+=b.strings;a.numbers+=b.numbers;a.booleans+=b.booleans;a.nulls+=b.nulls}

// ── Tools ──
function renderTools(){
  const tools=[
    {icon:'🔀',name:'Flatten JSON',fn:toolFlatten},
    {icon:'🔀',name:'Unflatten JSON',fn:toolUnflatten},
    {icon:'🔤',name:'Sort Keys',fn:toolSortKeys},
    {icon:'🔢',name:'Base64 Encode',fn:()=>toolBase64(true)},
    {icon:'🔢',name:'Base64 Decode',fn:()=>toolBase64(false)},
    {icon:'🔗',name:'URL Encode',fn:()=>toolUrlEncDec(true)},
    {icon:'🔗',name:'URL Decode',fn:()=>toolUrlEncDec(false)},
    {icon:'💉',name:'Escape String',fn:()=>toolEscape(true)},
    {icon:'💉',name:'Unescape String',fn:()=>toolEscape(false)},
    {icon:'🎨',name:'UUID Generator',fn:toolUUID},
    {icon:'📊',name:'JSON to TSV',fn:()=>toolDelim('\t')},
    {icon:'📊',name:'JSON to Markdown',fn:toolMarkdown},
    {icon:'🔄',name:'Reverse JSON',fn:toolReverse},
    {icon:'📏',name:'Size Info',fn:toolSize},
    {icon:'🏷️',name:'Extract Keys',fn:toolExtractKeys},
    {icon:'📦',name:'Extract Values',fn:toolExtractValues},
  ];
  let html='<div class="tools-grid">';
  for(const t of tools)html+='<div class="tool-card" data-tool="'+t.name+'"><div class="tool-icon">'+t.icon+'</div>'+t.name+'</div>';
  html+='</div><div class="tool-result" id="toolResult" style="color:var(--text-muted)">Select a tool above to transform your data</div>';
  $('textOutput').innerHTML=html;
  document.querySelectorAll('.tool-card').forEach(c=>{
    c.onclick=()=>{
      const tool=tools.find(t=>t.name===c.dataset.tool);
      if(tool){
        try{const result=tool.fn();$('toolResult').textContent=result;state.lastTextOutput=result;$('outputFilename').textContent='tool-result.txt'}
        catch(e){$('toolResult').innerHTML='<span style="color:var(--error)">Error: '+escapeHtml(e.message)+'</span>'}
      }
    };
  });
}
function toolFlatten(){
  if(!state.parsed)throw new Error('Visualize data first');
  return JSON.stringify(flattenObject(state.parsed),null,2);
}
function flattenObject(obj,prefix){
  prefix=prefix||'';const result={};
  if(obj&&typeof obj==='object'&&!Array.isArray(obj)){
    for(const[k,v]of Object.entries(obj)){const key=prefix?prefix+'.'+k:k;if(v&&typeof v==='object'&&!Array.isArray(v)&&Object.keys(v).length>0)Object.assign(result,flattenObject(v,key));else result[key]=v}
  }else if(Array.isArray(obj)){obj.forEach((v,i)=>{const key=prefix?prefix+'.'+i:String(i);if(v&&typeof v==='object')Object.assign(result,flattenObject(v,key));else result[key]=v})}
  else if(prefix)result[prefix]=obj;
  return result;
}
function toolUnflatten(){
  if(!state.parsed)throw new Error('Visualize data first');
  return JSON.stringify(unflattenObject(state.parsed),null,2);
}
function unflattenObject(obj){
  const result={};
  for(const[k,v]of Object.entries(obj)){
    const keys=k.split('.');let cur=result;
    for(let i=0;i<keys.length-1;i++){if(!cur[keys[i]])cur[keys[i]]={};cur=cur[keys[i]]}
    cur[keys[keys.length-1]]=v;
  }
  return result;
}
function toolSortKeys(){
  if(!state.parsed)throw new Error('Visualize data first');
  return JSON.stringify(sortObjectKeys(state.parsed),null,2);
}
function toolBase64(encode){
  if(!state.parsed)throw new Error('Visualize data first');
  const text=JSON.stringify(state.parsed);
  return encode?btoa(text):atob(text);
}
function toolUrlEncDec(encode){
  if(!state.parsed)throw new Error('Visualize data first');
  const text=JSON.stringify(state.parsed);
  return encode?encodeURIComponent(text):decodeURIComponent(text);
}
function toolEscape(escape){
  if(!state.parsed)throw new Error('Visualize data first');
  const text=JSON.stringify(state.parsed);
  return escape?JSON.stringify(text):JSON.parse(text);
}
function toolUUID(){
  const uuids=[];
  for(let i=0;i<5;i++)uuids.push(crypto.randomUUID?crypto.randomUUID():([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16)));
  return uuids.join('\n');
}
function toolDelim(delim){
  if(!state.parsed)throw new Error('Visualize data first');
  return jsonToCsv(state.parsed,delim);
}
function toolMarkdown(){
  if(!state.parsed)throw new Error('Visualize data first');
  let arr=Array.isArray(state.parsed)?state.parsed:[state.parsed];
  arr=arr.filter(o=>o&&typeof o==='object'&&!Array.isArray(o));
  if(arr.length===0)throw new Error('Need an array of objects');
  const keys=[...new Set(arr.flatMap(o=>Object.keys(o)))];
  let md='| '+keys.join(' | ')+' |\n| '+keys.map(()=>'---').join(' | ')+' |\n';
  for(const row of arr)md+='| '+keys.map(k=>row[k]==null?'':String(row[k]).replace(/\|/g,'\\|')).join(' | ')+' |\n';
  return md;
}
function toolReverse(){
  if(!state.parsed)throw new Error('Visualize data first');
  function rev(v){if(Array.isArray(v))return v.slice().reverse().map(rev);if(v&&typeof v==='object'){const r={};for(const k of Object.keys(v).reverse())r[k]=rev(v[k]);return r}return v}
  return JSON.stringify(rev(state.parsed),null,2);
}
function toolSize(){
  if(!state.parsed)throw new Error('Visualize data first');
  const json=JSON.stringify(state.parsed);
  return 'JSON size: '+json.length+' chars\nBytes (UTF-8): '+new Blob([json]).size+' bytes\nPretty size: '+JSON.stringify(state.parsed,null,2).length+' chars\nNodes: '+countNodes(state.parsed);
}
function toolExtractKeys(){
  if(!state.parsed)throw new Error('Visualize data first');
  const keys=new Set();
  function extract(v){if(v&&typeof v==='object'){if(!Array.isArray(v))for(const k of Object.keys(v))keys.add(k);for(const val of Object.values(v))extract(val)}}
  extract(state.parsed);return JSON.stringify([...keys].sort(),null,2);
}
function toolExtractValues(){
  if(!state.parsed)throw new Error('Visualize data first');
  const values=[];
  function extract(v){if(v&&typeof v==='object'){for(const val of Object.values(v))extract(val)}else values.push(v)}
  extract(state.parsed);return JSON.stringify(values,null,2);
}

// ── Query Tool ──
function renderQueryBar(){
  $('textOutput').innerHTML='<div class="query-bar">'+
    '<input class="query-input" id="queryInput" placeholder="e.g. data.features  or  $.stats.rating  or  employees.filter(e =&gt; e.role === &apos;Engineer&apos;)" />'+
    '<button class="btn btn-primary btn-sm" id="runQueryBtn">Run</button></div>'+
    '<div style="padding:8px 12px;font-size:11px;color:var(--text-muted)">Supports: dot notation (data.key), JSONPath ($.key.subkey), array indexing ($[0]), wildcards ($.*), and JS expressions (data.filter(...))</div>'+
    '<div class="code-output" id="queryOutput" style="min-height:200px;color:var(--text-muted)">Results will appear here</div>';
  $('runQueryBtn').onclick=runQuery;
  $('queryInput').addEventListener('keydown',e=>{if(e.key==='Enter')runQuery()});
}
function runQuery(){
  if(!state.parsed){toast('Visualize data first','error');return}
  const q=$('queryInput').value.trim();if(!q){toast('Enter a query','error');return}
  try{
    let result;
    if(q.startsWith('$'))result=runJsonPath(state.parsed,q);
    else{const fn=new Function('data','try{return '+q+'}catch(e){return {error:e.message}}');result=fn(state.parsed)}
    const output=typeof result==='object'?JSON.stringify(result,null,2):String(result);
    $('queryOutput').innerHTML=highlightJson(output);state.lastTextOutput=output;$('outputFilename').textContent='query-result.json';
  }catch(e){$('queryOutput').innerHTML='<span style="color:var(--error)">Error: '+escapeHtml(e.message)+'</span>'}
}
function runJsonPath(data,path){
  let p=path.replace(/^\$\.?/,'');if(p==='')return data;
  const parts=p.split(/\.|(\[\d+\])|(\[\*\])/).filter(x=>x);let current=[data];
  for(const part of parts){
    const next=[];
    if(part==='*'){for(const item of current){if(Array.isArray(item))next.push(...item);else if(item&&typeof item==='object')next.push(...Object.values(item))}}
    else if(part.startsWith('[')&&part.endsWith(']')){const idx=parseInt(part.slice(1,-1));for(const item of current){if(Array.isArray(item)&&item[idx]!==undefined)next.push(item[idx])}}
    else{for(const item of current){if(item&&typeof item==='object'&&item[part]!==undefined)next.push(item[part])}}
    current=next;
  }
  return current.length===0?undefined:current.length===1?current[0]:current;
}

// ── Export ──
function showExportOptions(){
  if(!state.parsed&&state.tab==='graph'){exportGraph();return}
  const formats=['json','jsonc','json5','yaml','csv','xml','toml','properties'];
  let html='<div class="modal-overlay" id="exportModal"><div class="modal"><div class="modal-header"><h3>💾 Export</h3><button class="header-btn" onclick="document.getElementById(\'exportModal\').remove()">✕</button></div><div class="modal-body">';
  if(state.tab==='graph')html+='<button class="btn" style="width:100%;margin-bottom:8px" id="exportSvgBtn">📷 Export as SVG</button>';
  html+='<div style="font-size:12px;color:var(--text-muted);margin:8px 0">Export current data as:</div>';
  for(const f of formats)html+='<button class="btn" style="width:100%;margin-bottom:4px" data-export="'+f+'">'+f.toUpperCase()+'</button>';
  html+='</div></div></div>';
  const div=document.createElement('div');div.innerHTML=html;document.body.appendChild(div.firstElementChild);
  const modal=document.getElementById('exportModal');
  if($('exportSvgBtn'))$('exportSvgBtn').onclick=()=>{exportGraph();modal.remove()};
  modal.querySelectorAll('[data-export]').forEach(b=>{
    b.onclick=async()=>{try{const result=await serializeData(state.parsed,b.dataset.export);downloadFile('data.'+b.dataset.export,result);toast('Exported as '+b.dataset.export.toUpperCase(),'success')}catch(e){toast('Export error: '+e.message,'error')}modal.remove()};
  });
}
function exportGraph(){
  const svg=$('graphSvg');if(svg.style.display==='none'){toast('Visualize a graph first','error');return}
  const clone=svg.cloneNode(true);
  const bg=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
  const rect=$('graphContainer').getBoundingClientRect();
  clone.setAttribute('width',rect.width);clone.setAttribute('height',rect.height);
  clone.querySelector('#graphBg').setAttribute('fill',bg);
  const styleEl=document.createElementNS(SVG_NS,'style');
  const cs=getComputedStyle(document.documentElement);
  const vars=['--bg-panel','--border','--text','--text-muted','--accent','--node-object','--node-array','--node-string','--node-number','--node-boolean','--node-null'];
  styleEl.textContent=vars.map(v=>v+':'+cs.getPropertyValue(v).trim()).join(';');
  clone.insertBefore(styleEl,clone.firstChild);
  const svgStr=new XMLSerializer().serializeToString(clone);
  downloadFile('json-crack-graph.svg',svgStr,'image/svg+xml');toast('SVG exported!','success');
}

// ── Import ──
function setupImport(){
  $('importBtn').onclick=e=>{e.stopPropagation();$('importDropdown').style.display=$('importDropdown').style.display==='none'?'flex':'none'};
  document.addEventListener('click',e=>{if(!e.target.closest('#importDropdown')&&e.target.id!=='importBtn')$('importDropdown').style.display='none'});
  $('importFileBtn').onclick=()=>$('fileInput').click();
  $('importUrlBtn').onclick=async()=>{
    const url=prompt('Enter URL to fetch:');if(!url)return;
    try{toast('Fetching...','');const res=await fetch(url);const text=await res.text();$('jsonInput').value=text;updateLineNumbers();updateCharCount();visualize()}catch(e){toast('Fetch error: '+e.message,'error')}
  };
  document.querySelectorAll('[data-sample]').forEach(b=>{
    b.onclick=()=>{const idx=parseInt(b.dataset.sample);$('jsonInput').value=SAMPLES[idx];sampleIdx=idx+1;updateLineNumbers();updateCharCount();$('importDropdown').style.display='none';visualize()};
  });
  $('fileInput').onchange=e=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=()=>{$('jsonInput').value=reader.result;updateLineNumbers();updateCharCount();visualize()};
    reader.readAsText(file);$('importDropdown').style.display='none';
  };
  // Drag and drop
  const wrapper=document.querySelector('.editor-wrapper');
  const dropZone=$('dropZone');
  wrapper.addEventListener('dragover',e=>{e.preventDefault();dropZone.style.display='flex'});
  wrapper.addEventListener('dragleave',e=>{if(e.target===wrapper)dropZone.style.display='none'});
  wrapper.addEventListener('drop',e=>{
    e.preventDefault();dropZone.style.display='none';const file=e.dataTransfer.files[0];if(!file)return;
    const reader=new FileReader();reader.onload=()=>{$('jsonInput').value=reader.result;updateLineNumbers();updateCharCount();visualize()};reader.readAsText(file);
  });
}

// ── Settings Modal ──
function setupSettings(){
  $('settingsBtn').onclick=()=>$('settingsModal').hidden=false;
  $('closeSettingsBtn').onclick=()=>$('settingsModal').hidden=true;
  $('settingsModal').onclick=e=>{if(e.target===$('settingsModal'))$('settingsModal').hidden=true};
  $('setOutputFormat').value=settings.outputFormat;
  $('setIndent').value=String(settings.indent);
  $('setSortKeys').checked=settings.sortKeys;
  $('setYamlIndent').value=String(settings.yamlIndent);
  $('setCsvDelim').value=settings.csvDelim;
  $('setXmlRoot').value=settings.xmlRoot;
  $('setSchemaDraft').value=settings.schemaDraft;
  $('setMaxNodes').value=String(settings.maxNodes);
  $('setTheme').value=settings.theme;
  $('saveSettingsBtn').onclick=()=>{
    settings.outputFormat=$('setOutputFormat').value;
    settings.indent=$('setIndent').value==='tab'?'tab':parseInt($('setIndent').value);
    settings.sortKeys=$('setSortKeys').checked;
    settings.yamlIndent=parseInt($('setYamlIndent').value);
    settings.csvDelim=$('setCsvDelim').value;
    settings.xmlRoot=$('setXmlRoot').value||'root';
    settings.schemaDraft=$('setSchemaDraft').value;
    settings.maxNodes=parseInt($('setMaxNodes').value);
    settings.theme=$('setTheme').value;
    saveSettings();applySettings();$('settingsModal').hidden=true;toast('Settings saved!','success');
    if(state.tab==='graph'&&state.parsed){buildGraph(state.parsed);computeVisible();renderGraphElements();updateGraphPositions();startSim()}
  };
}

// ── Status ──
function updateStatus(valid){
  const dot=$('statusDot'),txt=$('statusText');
  if(valid===null){dot.className='status-dot empty';txt.textContent='Empty';return}
  if(valid){dot.className='status-dot valid';txt.textContent='Valid '+state.inputFormat.toUpperCase()}
  else{dot.className='status-dot invalid';txt.textContent='Invalid'}
}

// ── Tab Management ──
function switchTab(tab){
  state.tab=tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tab));
  const toolbar=$('outputToolbar'),gc=$('graphContainer'),to=$('textOutput');
  if(tab==='graph'){
    toolbar.style.display='flex';$('outputFilename').textContent='graph.svg';
    gc.style.display='block';to.style.display='none';
    if(state.parsed){showGraphView();computeVisible();renderGraphElements();updateGraphPositions();startSim()}
    else{$('graphEmpty').style.display='flex';$('graphSvg').style.display='none';$('graphLegend').style.display='none';$('graphControls').style.display='none';$('graphLayoutBar').style.display='none'}
  }else{
    stopSim();toolbar.style.display='flex';gc.style.display='none';to.style.display='block';
    if(tab==='tree'){renderTree();$('outputFilename').textContent='tree.txt'}
    else if(tab==='format'){formatJson()}
    else if(tab==='convert'){renderConvertBar();$('outputFilename').textContent='converted.txt'}
    else if(tab==='codegen'){renderCodegenBar();$('outputFilename').textContent='generated.txt'}
    else if(tab==='schema'){renderSchemaBar();$('outputFilename').textContent='schema.json'}
    else if(tab==='diff'){renderDiffBar();$('outputFilename').textContent='diff.txt'}
    else if(tab==='stats'){renderStats();$('outputFilename').textContent='stats.json'}
    else if(tab==='tools'){renderTools();$('outputFilename').textContent='tool-result.txt'}
    else if(tab==='query'){renderQueryBar();$('outputFilename').textContent='query-result.json'}
  }
}

// ── Theme Toggle ──
function toggleTheme(){
  const app=document.querySelector('.app');const dark=app.dataset.theme==='dark';
  app.dataset.theme=dark?'light':'dark';document.documentElement.dataset.theme=app.dataset.theme;
  $('themeToggle').textContent=dark?'☀️':'🌙';settings.theme=app.dataset.theme;saveSettings();
  if(state.tab==='graph'&&state.parsed){const bg=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();$('graphBg').setAttribute('fill',bg)}
}

// ── Init ──
function init(){
  loadSettings();applySettings();
  const input=$('jsonInput');
  input.addEventListener('input',()=>{updateLineNumbers();updateCharCount()});
  input.addEventListener('scroll',()=>{$('lineNumbers').scrollTop=input.scrollTop});
  input.addEventListener('keydown',e=>{
    if(e.key==='Tab'){e.preventDefault();const s=input.selectionStart,en=input.selectionEnd;input.value=input.value.slice(0,s)+'  '+input.value.slice(en);input.selectionStart=input.selectionEnd=s+2}
    if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();visualize()}
  });
  $('visualizeBtn').onclick=visualize;
  $('formatInputBtn').onclick=()=>switchTab('format');
  $('minifyBtn').onclick=minifyJson;
  $('validateBtn').onclick=validateJson;
  $('sampleBtn').onclick=()=>{input.value=SAMPLES[sampleIdx%SAMPLES.length];sampleIdx++;updateLineNumbers();updateCharCount();visualize()};
  $('clearBtn').onclick=()=>{
    input.value='';state.parsed=null;state.nodes=[];state.edges=[];state.searchMatches=[];updateLineNumbers();updateCharCount();updateStatus(null);
    $('graphSvg').style.display='none';$('graphLegend').style.display='none';$('graphControls').style.display='none';$('graphLayoutBar').style.display='none';
    $('graphEmpty').style.display='flex';$('textOutput').innerHTML='';$('textOutput').style.display='none';$('graphContainer').style.display='block';
    $('nodeCountStatus').textContent='';state.lastTextOutput='';const badge=$('formatBadge');if(badge)badge.style.display='none';
  };
  $('themeToggle').onclick=toggleTheme;
  $('exportBtn').onclick=showExportOptions;
  $('zoomInBtn').onclick=()=>{state.transform.scale=Math.min(5,state.transform.scale*1.2);updateTransform()};
  $('zoomOutBtn').onclick=()=>{state.transform.scale=Math.max(0.1,state.transform.scale/1.2);updateTransform()};
  $('fitBtn').onclick=fitToView;
  $('copyOutputBtn').onclick=()=>{if(state.tab==='graph'){toast('Use Export button for graph','');return}if(state.lastTextOutput)copyText(state.lastTextOutput)};
  $('downloadOutputBtn').onclick=()=>{if(state.tab==='graph'){exportGraph();return}if(state.lastTextOutput)downloadFile($('outputFilename').textContent,state.lastTextOutput)};
  $('searchBtn').onclick=()=>{const term=$('searchInput').value.trim();if(!term){toast('Enter search term','');return}if(state.tab==='graph'){const n=searchInGraph(term);toast(n+' matches found',n>0?'success':'')}else if(state.tab==='tree'){renderTree()}else{toast('Switch to Graph or Tree tab for search','')}};
  $('searchInput').addEventListener('keydown',e=>{if(e.key==='Enter')$('searchBtn').click()});
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>switchTab(t.dataset.tab));
  document.querySelectorAll('#graphLayoutBar .btn').forEach(b=>{
    b.onclick=()=>{document.querySelectorAll('#graphLayoutBar .btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.layout=b.dataset.layout;if(state.parsed){initPositions();renderGraphElements();updateGraphPositions();startSim()}};
  });
  setupGraphInteraction();setupImport();setupSettings();
  updateLineNumbers();updateCharCount();updateStatus(null);
  input.value=SAMPLES[0];updateLineNumbers();updateCharCount();
  setTimeout(visualize,300);
}
window.addEventListener('load',init);
window.addEventListener('resize',()=>{if(state.tab==='graph'&&state.parsed)fitToView()});
</script>
