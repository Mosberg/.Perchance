    async function updatePasswordHash(password) {
      if(password.length < 10) {
        passwordStatusEl.innerHTML = "Password should be <span style='color:red;'>at least 10 characters.</span>";
        passwordStatusEl.style.display = "block";
        pwHashEl.value = "";
        return;
      }
      if(!/[A-Z]/.test(password)) {
        passwordStatusEl.innerHTML = "Password should have <span style='color:red;'>at least one capital letter.</span>";
        passwordStatusEl.style.display = "block";
        pwHashEl.value = "";
        return;
      }
      // if(!/[0-9]/.test(password)) {
      //   passwordStatusEl.innerHTML = "Password should have <span style='color:red;'>at least one number.</span>";
      //   passwordStatusEl.style.display = "block";
      //   pwHashEl.value = "";
      //   return;
      // }
      // if(!/[!@#$%^&*()\[\]{}|:;"'?/><,.~`\-_+=]/.test(password)) {
      //   passwordStatusEl.innerHTML = "Password should have <span style='color:red;'>at least one symbol like ! @ # $ % etc.</span>";
      //   passwordStatusEl.style.display = "block";
      //   pwHashEl.value = "";
      //   return;
      // }
      passwordStatusEl.style.display = "none";
      let hash = await sha256('perchance-comments-plugin|'+password);
      pwHashEl.value = hash;
    }
    async function sha256(text) {
      const msgUint8 = new TextEncoder().encode(text);                          
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);          
      const hashArray = Array.from(new Uint8Array(hashBuffer));                    
      const hashHex = hashArray.map((b) => b.toString(16).padStart(2, '0')).join('');
      return hashHex;
    }
