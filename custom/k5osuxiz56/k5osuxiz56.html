<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>k5osuxiz56 — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<!--
Fabric Studio Web Application
A complete web-based generator for Minecraft Fabric mods (26.1.2)

Features:
- Mod configuration (ID, name, package)
- Feature selection (Blocks, Items, Networking, Renderer)
- Automatic client/common split enforcement
- Gradle and fabric.mod.json generation
- Full project ZIP download
- Fabric Studio branding
-->

<div style="font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; max-width:900px; margin:0 auto; padding:20px; background:#0f172a; color:#e5e7eb; min-height:100vh;">
  
  <!-- Header -->
  <div style="display:flex; align-items:center; gap:20px; margin-bottom:30px; padding-bottom:20px; border-bottom:1px solid #334155;">
    <div style="width:64px; height:64px; background:#FFCB3C; border-radius:12px; display:flex; align-items:center; justify-content:center; font-weight:bold; color:#1E293B; font-size:24px;">FS</div>
    <div>
      <h1 style="margin:0; font-size:28px; color:#FFCB3C;">Fabric Studio</h1>
      <p style="margin:5px 0 0 0; color:#94a3b8; font-size:14px;">Minecraft 26.1.2 • Fabric API 0.148.0</p>
    </div>
  </div>

  <!-- Main Form -->
  <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:20px;">
    
    <!-- Left Column -->
    <div>
      <label style="display:block; margin-bottom:6px; font-weight:600; color:#38BDF8;">Mod ID</label>
      <input id="modIdInput" value="mymod" placeholder="mymod" style="width:100%; padding:12px; border-radius:8px; border:1px solid #334155; background:#1e293b; color:#e5e7eb; font-size:14px; box-sizing:border-box;">
      <small style="color:#64748b; font-size:12px;">Lowercase, alphanumeric, hyphens only</small>

      <label style="display:block; margin:15px 0 6px 0; font-weight:600; color:#38BDF8;">Mod Name</label>
      <input id="modNameInput" value="My Mod" placeholder="My Mod" style="width:100%; padding:12px; border-radius:8px; border:1px solid #334155; background:#1e293b; color:#e5e7eb; font-size:14px; box-sizing:border-box;">

      <label style="display:block; margin:15px 0 6px 0; font-weight:600; color:#38BDF8;">Java Package</label>
      <input id="pkgInput" value="com.example.mymod" placeholder="com.example.mymod" style="width:100%; padding:12px; border-radius:8px; border:1px solid #334155; background:#1e293b; color:#e5e7eb; font-size:14px; box-sizing:border-box;">
      <small style="color:#64748b; font-size:12px;">Reverse domain notation</small>
    </div>

    <!-- Right Column - Features -->
    <div>
      <label style="display:block; margin-bottom:6px; font-weight:600; color:#38BDF8;">Features</label>
      <div id="featuresCtn" style="display:flex; flex-direction:column; gap:10px; background:#1e293b; padding:15px; border-radius:8px; border:1px solid #334155;">
        
        <label style="display:flex; align-items:center; gap:10px; cursor:pointer;">
          <input type="checkbox" id="featBlocks" checked style="width:18px; height:18px; accent-color:#FFCB3C;">
          <span>Blocks</span>
          <small style="color:#64748b; margin-left:auto;">src/main/java</small>
        </label>

        <label style="display:flex; align-items:center; gap:10px; cursor:pointer;">
          <input type="checkbox" id="featItems" checked style="width:18px; height:18px; accent-color:#FFCB3C;">
          <span>Items</span>
          <small style="color:#64748b; margin-left:auto;">src/main/java</small>
        </label>

        <label style="display:flex; align-items:center; gap:10px; cursor:pointer;">
          <input type="checkbox" id="featNetwork" style="width:18px; height:18px; accent-color:#FFCB3C;">
          <span>Networking</span>
          <small style="color:#64748b; margin-left:auto;">client + common</small>
        </label>

        <label style="display:flex; align-items:center; gap:10px; cursor:pointer;">
          <input type="checkbox" id="featRenderer" style="width:18px; height:18px; accent-color:#FFCB3C;">
          <span>Client Renderer</span>
          <small style="color:#64748b; margin-left:auto;">src/client/java</small>
        </label>

      </div>

      <!-- Version Info -->
      <div style="margin-top:15px; padding:12px; background:rgba(56,189,248,0.1); border-radius:8px; border:1px solid rgba(56,189,248,0.2);">
        <small style="color:#38BDF8; font-weight:600;">Target Versions</small><br>
        <small style="color:#94a3b8;">Minecraft: 26.1.2</small><br>
        <small style="color:#94a3b8;">Fabric API: 0.148.0+26.1.2</small><br>
        <small style="color:#94a3b8;">Loader: 0.16.0</small>
      </div>
    </div>
  </div>

  <!-- Generate Button -->
  <button id="generateBtn" onclick="generateProject()" style="width:100%; padding:15px; background:#FFCB3C; color:#1E293B; border:none; border-radius:8px; font-size:16px; font-weight:bold; cursor:pointer; transition:background 0.2s;">
    📦 Generate & Download ZIP
  </button>

  <!-- Status / Loading -->
  <div id="statusEl" style="margin-top:20px; padding:15px; border-radius:8px; display:none;"></div>

  <!-- Preview Area -->
  <div id="previewCtn" style="margin-top:30px; display:none;">
    <h3 style="margin:0 0 15px 0; color:#38BDF8; font-size:18px;">Project Structure</h3>
    <pre id="previewEl" style="background:#1e293b; padding:15px; border-radius:8px; border:1px solid #334155; overflow-x:auto; font-size:12px; color:#94a3b8; margin:0;"></pre>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
async function generateProject() {
  const modId = modIdInput.value.trim().toLowerCase().replace(/[^a-z0-9-]/g, '-');
  const modName = modNameInput.value.trim() || modId;
  const pkg = pkgInput.value.trim() || `com.example.${modId}`;
  const pkgPath = pkg.replace(/\./g, '/');

  const features = {
    blocks: featBlocks.checked,
    items: featItems.checked,
    network: featNetwork.checked,
    renderer: featRenderer.checked
  };

  // Show loading
  statusEl.style.display = 'block';
  statusEl.style.background = 'rgba(56,189,248,0.1)';
  statusEl.style.border = '1px solid rgba(56,189,248,0.3)';
  statusEl.innerHTML = `<span style="color:#38BDF8;">⏳ Generating ${modName}...</span>`;
  generateBtn.disabled = true;
  generateBtn.style.opacity = '0.6';

  try {
    const zip = new JSZip();

    // === Gradle Files ===
    zip.file('build.gradle', `plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
}

repositories {
    mavenCentral()
    maven { url "https://maven.fabricmc.net/" }
}

dependencies {
    minecraft "com.mojang:minecraft:26.1.2"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:0.16.0"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.148.0+26.1.2"
}

sourceSets {
    client {
        compileClasspath += main.compileClasspath
        runtimeClasspath += main.runtimeClasspath
    }
}

loom {
    splitEnvironmentSourceSets()
}
`);

    zip.file('gradle.properties', `org.gradle.jvmargs=-Xmx2G
fabric.loom.multiProjectOptimisation=true
`);

    zip.file('settings.gradle', `rootProject.name = "${modId}"
`);

    // === Main Mod Class (Common) ===
    let mainModImports = `import net.fabricmc.api.ModInitializer;`;
    let mainModInit = `System.out.println("${modName} initialized!");`;

    if (features.blocks) {
      mainModInit += `\n        // Register blocks`;
      mainModInit += `\n        try {`;
      mainModInit += `\n            Class.forName("${pkg}.registry.BlockRegistry")`;
      mainModInit += `\n                .getMethod("register")`;
      mainModInit += `\n                .invoke(null);`;
      mainModInit += `\n        } catch (Exception ignored) {}`;
    }
    if (features.items) {
      mainModInit += `\n        // Register items`;
      mainModInit += `\n        try {`;
      mainModInit += `\n            Class.forName("${pkg}.registry.ItemRegistry")`;
      mainModInit += `\n                .getMethod("register")`;
      mainModInit += `\n                .invoke(null);`;
      mainModInit += `\n        } catch (Exception ignored) {}`;
    }
    if (features.network) {
      mainModInit += `\n        // Register networking`;
      mainModInit += `\n        try {`;
      mainModInit += `\n            Class.forName("${pkg}.network.NetworkHandler")`;
      mainModInit += `\n                .getMethod("registerServer")`;
      mainModInit += `\n                .invoke(null);`;
      mainModInit += `\n        } catch (Exception ignored) {}`;
    }

    zip.file(`src/main/java/${pkgPath}/MyMod.java`, `package ${pkg};

${mainModImports}

public class MyMod implements ModInitializer {
    public static final String MOD_ID = "${modId}";

    @Override
    public void onInitialize() {
        ${mainModInit}
    }
}
`);

    // === Client Mod Class ===
    let clientInit = `System.out.println("${modName} client initialized!");`;
    if (features.network) {
      clientInit += `\n        // Register client networking`;
      clientInit += `\n        try {`;
      clientInit += `\n            Class.forName("${pkg}.network.NetworkHandler")`;
      clientInit += `\n                .getMethod("registerClient")`;
      clientInit += `\n                .invoke(null);`;
      clientInit += `\n        } catch (Exception ignored) {}`;
    }

    zip.file(`src/client/java/${pkgPath}/client/MyModClient.java`, `package ${pkg}.client;

import net.fabricmc.api.ClientModInitializer;

public class MyModClient implements ClientModInitializer {
    @Override
    public void onInitializeClient() {
        ${clientInit}
    }
}
`);

    // === fabric.mod.json ===
    zip.file('src/main/resources/fabric.mod.json', JSON.stringify({
      schemaVersion: 1,
      id: modId,
      version: "1.0.0",
      name: modName,
      environment: "*",
      entrypoints: {
        main: [`${pkg}.MyMod`],
        client: [`${pkg}.client.MyModClient`]
      },
      depends: {
        fabricloader: ">=0.16.0",
        "fabric-api": "*",
        minecraft: "26.1.2"
      }
    }, null, 2));

    // === Assets directories ===
    zip.file(`src/main/resources/assets/${modId}/.gitkeep`, '');
    zip.file(`src/main/resources/data/${modId}/.gitkeep`, '');

    // === Feature: Blocks ===
    if (features.blocks) {
      zip.file(`src/main/java/${pkgPath}/block/ExampleBlock.java`, `package ${pkg}.block;

import net.minecraft.block.Block;
import net.minecraft.block.AbstractBlock;

public class ExampleBlock extends Block {
    public ExampleBlock() {
        super(AbstractBlock.Settings.create().strength(1.5F, 6.0F));
    }
}
`);

      zip.file(`src/main/java/${pkgPath}/registry/BlockRegistry.java`, `package ${pkg}.registry;

import ${pkg}.MyMod;
import ${pkg}.block.ExampleBlock;
import net.minecraft.block.Block;
import net.minecraft.registry.Registries;
import net.minecraft.registry.Registry;
import net.minecraft.util.Identifier;

public class BlockRegistry {
    public static final Block EXAMPLE_BLOCK = new ExampleBlock();

    public static void register() {
        Registry.register(Registries.BLOCK,
            new Identifier(MyMod.MOD_ID, "exampleblock"),
            EXAMPLE_BLOCK
        );
    }
}
`);

      zip.file(`src/main/resources/assets/${modId}/blockstates/exampleblock.json`, JSON.stringify({
        variants: {
          "": { model: `${modId}:block/exampleblock` }
        }
      }, null, 2));

      zip.file(`src/main/resources/assets/${modId}/models/block/exampleblock.json`, JSON.stringify({
        parent: "minecraft:block/cube_all",
        textures: {
          all: `${modId}:block/exampleblock`
        }
      }, null, 2));
    }

    // === Feature: Items ===
    if (features.items) {
      zip.file(`src/main/java/${pkgPath}/item/ExampleItem.java`, `package ${pkg}.item;

import net.minecraft.item.Item;

public class ExampleItem extends Item {
    public ExampleItem(Settings settings) {
        super(settings);
    }
}
`);

      zip.file(`src/main/java/${pkgPath}/registry/ItemRegistry.java`, `package ${pkg}.registry;

import ${pkg}.MyMod;
import ${pkg}.item.ExampleItem;
import net.minecraft.item.Item;
import net.minecraft.registry.Registries;
import net.minecraft.registry.Registry;
import net.minecraft.util.Identifier;

public class ItemRegistry {
    public static final Item EXAMPLE_ITEM = new ExampleItem(new Item.Settings());

    public static void register() {
        Registry.register(Registries.ITEM,
            new Identifier(MyMod.MOD_ID, "exampleitem"),
            EXAMPLE_ITEM
        );
    }
}
`);

      zip.file(`src/main/resources/assets/${modId}/models/item/exampleitem.json`, JSON.stringify({
        parent: "item/generated",
        textures: {
          layer0: `${modId}:item/exampleitem`
        }
      }, null, 2));
    }

    // === Feature: Networking ===
    if (features.network) {
      zip.file(`src/main/java/${pkgPath}/network/ExampleChannel.java`, `package ${pkg}.network;

import ${pkg}.MyMod;
import net.minecraft.util.Identifier;

public class ExampleChannel {
    public static final Identifier EXAMPLEPACKETID =
        new Identifier(MyMod.MOD_ID, "examplepacket");
}
`);

      zip.file(`src/main/java/${pkgPath}/network/NetworkHandler.java`, `package ${pkg}.network;

import net.fabricmc.fabric.api.networking.v1.ServerPlayNetworking;
import net.fabricmc.fabric.api.networking.v1.ClientPlayNetworking;
import net.minecraft.server.network.ServerPlayerEntity;
import net.minecraft.network.PacketByteBuf;
import net.minecraft.network.PacketByteBufs;

public class NetworkHandler {

    public static void registerServer() {
        ServerPlayNetworking.registerGlobalReceiver(
            ExampleChannel.EXAMPLEPACKETID,
            (server, player, handler, buf, responseSender) -> {
                int value = buf.readInt();
                System.out.println("Server received: " + value);
            }
        );
    }

    public static void registerClient() {
        ClientPlayNetworking.registerGlobalReceiver(
            ExampleChannel.EXAMPLEPACKETID,
            (client, handler, buf, responseSender) -> {
                int value = buf.readInt();
                System.out.println("Client received: " + value);
            }
        );
    }

    public static void sendToServer(int value) {
        PacketByteBuf buf = PacketByteBufs.create();
        buf.writeInt(value);
        ClientPlayNetworking.send(ExampleChannel.EXAMPLEPACKETID, buf);
    }

    public static void sendToPlayer(ServerPlayerEntity player, int value) {
        PacketByteBuf buf = PacketByteBufs.create();
        buf.writeInt(value);
        ServerPlayNetworking.send(player, ExampleChannel.EXAMPLEPACKETID, buf);
    }
}
`);
    }

    // === Feature: Renderer ===
    if (features.renderer) {
      zip.file(`src/client/java/${pkgPath}/render/ExampleEntityRenderer.java`, `package ${pkg}.render;

import net.minecraft.client.render.entity.EntityRendererFactory;
import net.minecraft.client.render.entity.EntityRenderer;
import net.minecraft.entity.Entity;
import net.minecraft.util.Identifier;

public class ExampleEntityRenderer extends EntityRenderer {
    public ExampleEntityRenderer(EntityRendererFactory.Context ctx) {
        super(ctx);
    }

    @Override
    public Identifier getTexture(Entity entity) {
        return new Identifier("${modId}", "textures/entity/example.png");
    }
}
`);
    }

    // === README ===
    zip.file('README.md', `# ${modName}

A Minecraft Fabric mod generated by Fabric Studio.

## Setup

1. Clone this repository
2. Run \`./gradlew genSources\`
3. Open in your favorite IDE
4. Run \`./gradlew runClient\`

## Development

- Minecraft: 26.1.2
- Fabric API: 0.148.0+26.1.2
- Fabric Loader: 0.16.0

## Features

${features.blocks ? '- Blocks' : ''}
${features.items ? '- Items' : ''}
${features.network ? '- Networking' : ''}
${features.renderer ? '- Custom Renderers' : ''}

Generated with Fabric Studio
`);

    // Generate and download
    const blob = await zip.generateAsync({type: 'blob'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${modId}-fabric-mod.zip`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    // Show success
    statusEl.style.background = 'rgba(74,222,128,0.1)';
    statusEl.style.border = '1px solid rgba(74,222,128,0.3)';
    statusEl.innerHTML = `<span style="color:#4ade80;">✅ ${modName} generated successfully!</span>`;

    // Show preview
    previewCtn.style.display = 'block';
    previewEl.textContent = `${modId}/
 ├─ build.gradle
 ├─ gradle.properties
 ├─ settings.gradle
 ├─ README.md
 └─ src/
     ├─ main/
     │   ├─ java/${pkgPath}/
     │   │   ├─ MyMod.java
     ${features.blocks ? `│   │   ├─ block/ExampleBlock.java
     │   │   └─ registry/BlockRegistry.java` : ''}
     ${features.items ? `${features.blocks ? '│   │   ' : '│   ├─ '}item/ExampleItem.java
     ${features.blocks ? '│   │   ' : '│   ├─ '}registry/ItemRegistry.java` : ''}
     ${features.network ? `${features.blocks || features.items ? '│   │   ' : '│   ├─ '}network/
     │   │       ├─ ExampleChannel.java
     │   │       └─ NetworkHandler.java` : ''}
     │   └─ resources/
     │       ├─ fabric.mod.json
     │       ├─ assets/${modId}/
     ${features.blocks ? `│       │   └─ blockstates/exampleblock.json
     │       └─ models/block/exampleblock.json` : ''}
     │       └─ data/${modId}/
     └─ client/
         └─ java/${pkgPath}/client/
             ├─ MyModClient.java
             ${features.renderer ? `└─ render/ExampleEntityRenderer.java` : ''}`;

  } catch (err) {
    statusEl.style.background = 'rgba(248,113,113,0.1)';
    statusEl.style.border = '1px solid rgba(248,113,113,0.3)';
    statusEl.innerHTML = `<span style="color:#f87171;">❌ Error: ${err.message}</span>`;
    console.error(err);
  }

  generateBtn.disabled = false;
  generateBtn.style.opacity = '1';
}
</script>
</body>
</html>
