<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>minecraft-clone — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<div id="gameContainerEl" style="width:100vw; height:100vh; overflow:hidden; font-family:'Courier New', Courier, monospace; user-select:none;">
  
  <!-- HUD -->
  <div id="hudCtn" style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; display:none;">
    <!-- Crosshair -->
    <div style="position:absolute; top:50%; left:50%; width:20px; height:20px; transform:translate(-50%, -50%); z-index:10;">
      <div style="position:absolute; top:9px; left:0; width:20px; height:2px; background:white; mix-blend-mode:difference;"></div>
      <div style="position:absolute; top:0; left:9px; width:2px; height:20px; background:white; mix-blend-mode:difference;"></div>
    </div>

    <!-- Stats (Health/Hunger) -->
    <div style="position:absolute; top:10px; left:10px; display:flex; flex-direction:column; gap:5px;">
      <div style="display:flex; align-items:center; gap:5px;">
        <span style="color:red; font-weight:bold;">❤</span>
        <div style="width:100px; height:10px; background:#333; border:1px solid white;">
          <div id="healthBarEl" style="width:100%; height:100%; background:red; transition:width 0.2s;"></div>
        </div>
      </div>
      <div style="display:flex; align-items:center; gap:5px;">
        <span style="color:orange; font-weight:bold;">🍗</span>
        <div style="width:100px; height:10px; background:#333; border:1px solid white;">
          <div id="hungerBarEl" style="width:100%; height:100%; background:orange; transition:width 0.2s;"></div>
        </div>
      </div>
    </div>

    <!-- Debug / Time -->
    <div id="debugEl" style="position:absolute; top:10px; left:10px; color:lime; font-size:12px; pointer-events:none; text-shadow:1px 1px 0 #000; margin-top:40px;"></div>
    <div id="timeEl" style="position:absolute; top:10px; right:10px; color:white; font-weight:bold; text-shadow:1px 1px 0 #000; pointer-events:none;"></div>

    <!-- Hotbar UI -->
    <div id="hotbarCtn" style="position:absolute; bottom:20px; left:50%; transform:translateX(-50%); display:flex; gap:4px; background:rgba(0,0,0,0.5); padding:6px; border-radius:4px; pointer-events:none; border-bottom:4px solid rgba(255,255,255,0.2);">
      <!-- Slots generated by JS -->
    </div>
    
    <!-- Interaction Prompt -->
    <div id="interactionEl" style="position:absolute; top:60%; left:50%; transform:translateX(-50%); color:white; font-size:14px; opacity:0; transition:opacity 0.2s; text-shadow:1px 1px 0 #000;"></div>
  </div>

  <!-- Inventory UI -->
  <div id="inventoryCtn" style="position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); width:352px; height:332px; background:#c6c6c6; border:4px solid #555; display:none; pointer-events:auto; flex-direction:column; padding:10px; z-index:30; box-shadow: 0 10px 20px rgba(0,0,0,0.5);">
    <div style="font-family:'Courier New'; font-weight:bold; color:#404040; margin-bottom:8px; text-align:center; text-shadow:1px 1px 0 #fff; user-select:none;">Inventory</div>
    <div id="inventoryGrid" style="flex:1; display:grid; grid-template-columns:repeat(9, 1fr); grid-template-rows:repeat(4, 1fr); gap:2px; background:#8b8b8b; padding:4px; border:2px solid #373737;">
      <!-- Slots generated by JS -->
    </div>
    <div style="text-align:center; font-size:12px; color:#555; margin-top:5px; user-select:none;">Click to Move | E to Close</div>
  </div>

  <!-- Blocker/Menu -->
  <div id="blockerEl" style="position:absolute; width:100%; height:100%; background:rgba(0,0,0,0.85); display:flex; justify-content:center; align-items:center; z-index:20; backdrop-filter:blur(5px);">
    <div id="instructionsEl" style="text-align:center; color:white; cursor:pointer; transition:transform 0.2s;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
      <h1 style="font-size:50px; margin-bottom:5px; text-shadow:0 0 10px cyan;">MINECRAFT CLONE</h1>
      <p style="font-size:20px; color:#ccc;">Click to Play</p>
      <div style="margin-top:20px; text-align:left; display:inline-block; font-size:14px; color:#aaa; line-height:1.6;">
        <div><b>WASD</b> to Move | <b>SPACE</b> to Jump | <b>SHIFT</b> to Sprint</div>
        <div><b>L-Click</b> Mine | <b>R-Click</b> Place</div>
        <div><b>1-9</b> Select Blocks | <b>E</b> Inventory</div>
        <div><b>ESC</b> Pause</div>
      </div>
    </div>
    
    <!-- Settings Panel (Hidden by default) -->
    <div id="settingsPanel" style="position:absolute; right:20px; top:20px; background:rgba(0,0,0,0.8); padding:20px; border-radius:8px; display:none; pointer-events:auto; border:1px solid #555;">
      <h3>Settings</h3>
      <label style="color:white; display:block; margin-bottom:10px;">
        <input type="checkbox" id="soundToggle" checked> Enable Sound
      </label>
      <label style="color:white; display:block; margin-bottom:10px;">
        <input type="range" id="fovSlider" min="60" max="110" value="75"> FOV
      </label>
      <label style="color:white; display:block; margin-bottom:10px;">
        <input type="range" id="sensSlider" min="0.1" max="2.0" step="0.1" value="1.0"> Mouse Sensitivity
      </label>
      <button id="saveBtn" style="padding:5px 10px; cursor:pointer; margin-right:5px;">Save World</button>
      <button id="loadBtn" style="padding:5px 10px; cursor:pointer; margin-right:5px;">Load World</button>
      <button id="resetWorldBtn" style="padding:5px 10px; cursor:pointer;">Reset World</button>
    </div>
    
    <!-- Settings Button in Menu -->
    <button id="settingsBtn" style="position:absolute; top:20px; right:20px; padding:10px; cursor:pointer; background:#444; color:white; border:none; border-radius:4px;">⚙️ Settings</button>
  </div>

</div>

<script type="module">
  import * as THREE from 'https://esm.sh/three@0.177.0';
  import { PointerLockControls } from 'https://esm.sh/three@0.177.0/examples/jsm/controls/PointerLockControls.js';
  import { createNoise2D, createNoise3D } from 'https://esm.sh/simplex-noise@4.0.3';

  // --- Config ---
  const WORLD_SIZE = 64; // Increased world size
  const WORLD_HEIGHT = 48; 
  const GRAVITY = 25.0;
  const JUMP_FORCE = 11.0;
  const SPEED = 6.0;
  const SPRINT_SPEED = 10.0;
  const REACH = 6;
  const DAY_LENGTH = 120; // Seconds for full day/night cycle
  const INVENTORY_SIZE = 36; // 9 hotbar + 27 inventory

  // --- Block Types ---
  const BLOCKS = {
    AIR: 0,
    GRASS: 1,
    DIRT: 2,
    STONE: 3,
    WOOD: 4,
    LEAVES: 5,
    SAND: 6,
    BEDROCK: 7,
    WATER: 8,
    GLASS: 9,
    BRICK: 10,
    COBBLESTONE: 11,
    COAL_ORE: 12,
    PLANKS: 13,
    POPPY: 14,
    DANDELION: 15,
    CRAFTING_TABLE: 16
  };
  
  // Properties
  const BLOCK_PROPS = {
    [BLOCKS.GRASS]: { color: '#567d46', name: 'Grass' },
    [BLOCKS.DIRT]:  { color: '#8b5a2b', name: 'Dirt' },
    [BLOCKS.STONE]: { color: '#7d7d7d', name: 'Stone' },
    [BLOCKS.WOOD]:  { color: '#5c4033', name: 'Log' },
    [BLOCKS.LEAVES]:{ color: '#2d4c1e', name: 'Leaves', transparent: true, opacity: 0.9 },
    [BLOCKS.SAND]:  { color: '#E8D68D', name: 'Sand' },
    [BLOCKS.BEDROCK]:{color: '#222222', name: 'Bedrock' },
    [BLOCKS.WATER]: { color: '#3498db', name: 'Water', transparent: true, opacity: 0.6, fluid: true },
    [BLOCKS.GLASS]: { color: '#add8e6', name: 'Glass', transparent: true, opacity: 0.3 },
    [BLOCKS.BRICK]: { color: '#a04030', name: 'Brick' },
    [BLOCKS.COBBLESTONE]: { color: '#555555', name: 'Cobble' },
    [BLOCKS.COAL_ORE]: { color: '#333333', name: 'Coal Ore' },
    [BLOCKS.PLANKS]: { color: '#bc9458', name: 'Planks' },
    [BLOCKS.POPPY]: { color: '#d32f2f', name: 'Poppy', transparent: true },
    [BLOCKS.DANDELION]: { color: '#fbc02d', name: 'Dandelion', transparent: true },
    [BLOCKS.CRAFTING_TABLE]: { color: '#8b5a2b', name: 'Crafting Table' }
  };

  // --- Globals ---
  let camera, scene, renderer, controls;
  let raycaster;
  let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
  let isSprinting = false;
  let canJump = false;
  let prevTime = performance.now();
  let velocity = new THREE.Vector3();
  let direction = new THREE.Vector3();
  
  // World Data
  let worldData = new Uint8Array(WORLD_SIZE * WORLD_SIZE * WORLD_HEIGHT);
  let meshes = {}; 
  let worldNeedsUpdate = true;
  let selectedBlockType = BLOCKS.GRASS;

  // Game State
  let health = 100;
  let hunger = 100;
  let dayTime = 0; // 0 to 1
  let isDay = true;
  let mouseSensitivity = 1.0;
  
  // Inventory System
  let inventory = new Array(INVENTORY_SIZE).fill(0);
  let cursorItem = BLOCKS.AIR; // Item held by mouse cursor
  let selectedSlotIndex = 0; // 0-8 for hotbar

  // Entities (Mobs, Drops, Particles)
  let mobs = []; 
  let drops = []; // Dropped items
  let particles = []; // Visual effects
  let clouds = [];
  
  // Geometries
  let mobGeometry = new THREE.BoxGeometry(0.8, 1.8, 0.8);
  let dropGeometry = new THREE.BoxGeometry(0.25, 0.25, 0.25);
  let cloudGeometry = new THREE.BoxGeometry(10, 2, 10);

  // Highlight
  let highlightMesh;

  // Audio Context
  let audioCtx;
  
  // --- Helpers ---
  const getIdx = (x, y, z) => x + z * WORLD_SIZE + y * WORLD_SIZE * WORLD_SIZE;
  const getBlock = (x, y, z) => {
    if(x<0||x>=WORLD_SIZE||y<0||y>=WORLD_HEIGHT||z<0||z>=WORLD_SIZE) return BLOCKS.AIR;
    return worldData[getIdx(x,y,z)];
  };
  const setBlock = (x, y, z, type) => {
    if(x<0||x>=WORLD_SIZE||y<0||y>=WORLD_HEIGHT||z<0||z>=WORLD_SIZE) return;
    worldData[getIdx(x,y,z)] = type;
    worldNeedsUpdate = true;
  };

  // --- Audio System ---
  function initAudio() {
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }

  function playSound(type) {
    if (!soundToggle.checked || !audioCtx) return;
    if(audioCtx.state === 'suspended') audioCtx.resume();

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    const now = audioCtx.currentTime;

    if (type === 'jump') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(150, now);
      osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
      gain.gain.setValueAtTime(0.1, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
      osc.start(now);
      osc.stop(now + 0.1);
    } else if (type === 'break') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(100, now);
      osc.frequency.exponentialRampToValueAtTime(50, now + 0.1);
      gain.gain.setValueAtTime(0.1, now);
      gain.gain.linearRampToValueAtTime(0, now + 0.1);
      osc.start(now);
      osc.stop(now + 0.1);
    } else if (type === 'place') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(400, now);
      osc.frequency.exponentialRampToValueAtTime(200, now + 0.1);
      gain.gain.setValueAtTime(0.1, now);
      gain.gain.linearRampToValueAtTime(0, now + 0.1);
      osc.start(now);
      osc.stop(now + 0.1);
    } else if (type === 'hurt') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(100, now);
      osc.frequency.linearRampToValueAtTime(50, now + 0.3);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.linearRampToValueAtTime(0, now + 0.3);
      osc.start(now);
      osc.stop(now + 0.3);
    } else if (type === 'pop') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(800, now);
      osc.frequency.exponentialRampToValueAtTime(1200, now + 0.05);
      gain.gain.setValueAtTime(0.1, now);
      gain.gain.linearRampToValueAtTime(0, now + 0.05);
      osc.start(now);
      osc.stop(now + 0.05);
    }
  }

  // --- Texture Generation ---
  function createTexture(type) {
    const canvas = document.createElement('canvas');
    canvas.width = 64; canvas.height = 64;
    const ctx = canvas.getContext('2d');
    
    let color = BLOCK_PROPS[type].color;
    ctx.fillStyle = color;
    ctx.fillRect(0, 0, 64, 64);

    // Noise Overlay
    for(let i=0; i<400; i++) {
      ctx.fillStyle = `rgba(0,0,0,${Math.random() * 0.15})`;
      ctx.fillRect(Math.random()*64, Math.random()*64, 4, 4);
      ctx.fillStyle = `rgba(255,255,255,${Math.random() * 0.1})`;
      ctx.fillRect(Math.random()*64, Math.random()*64, 2, 2);
    }

    // Specific patterns
    if (type === BLOCKS.GRASS) {
      ctx.fillStyle = '#4a6b3c';
      for(let i=0; i<50; i++) ctx.fillRect(Math.random()*64, 0, 2, 10);
    } else if (type === BLOCKS.WOOD) {
      ctx.fillStyle = 'rgba(0,0,0,0.1)';
      for(let i=0; i<8; i++) ctx.fillRect(i*8, 0, 2, 64);
    } else if (type === BLOCKS.BRICK) {
      ctx.fillStyle = 'rgba(200,200,200,0.3)';
      ctx.fillRect(0, 0, 64, 2);
      ctx.fillRect(0, 16, 64, 2);
      ctx.fillRect(0, 32, 64, 2);
      ctx.fillRect(0, 48, 64, 2);
      ctx.fillRect(16, 0, 2, 16);
      ctx.fillRect(48, 0, 2, 16);
      ctx.fillRect(0, 16, 2, 16);
      ctx.fillRect(32, 16, 2, 16);
    } else if (type === BLOCKS.COAL_ORE || type === BLOCKS.STONE) {
      if(type === BLOCKS.COAL_ORE) {
         ctx.fillStyle = '#111';
         for(let i=0; i<10; i++) ctx.fillRect(Math.random()*60, Math.random()*60, 6, 6);
      }
    } else if (type === BLOCKS.COBBLESTONE) {
       ctx.fillStyle = 'rgba(0,0,0,0.3)';
       ctx.fillRect(5, 5, 10, 10);
       ctx.fillRect(30, 20, 15, 15);
    } else if (type === BLOCKS.CRAFTING_TABLE) {
      ctx.fillStyle = '#735538'; // Darker wood frame
      ctx.fillRect(0,0,64,4); ctx.fillRect(0,0,4,64); ctx.fillRect(60,0,4,64); ctx.fillRect(0,60,64,4);
      // Tools
      ctx.fillStyle = '#555'; // Hammer head
      ctx.fillRect(10, 10, 20, 20);
      ctx.fillStyle = '#8b5a2b'; // Handle
      ctx.fillRect(40, 10, 10, 40);
    }

    const tex = new THREE.CanvasTexture(canvas);
    tex.magFilter = THREE.NearestFilter;
    tex.minFilter = THREE.NearestFilter;
    tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
  }

  // Material Cache
  const materials = {};
  function getMaterial(type) {
    if (materials[type]) return materials[type];
    const map = createTexture(type);
    const props = BLOCK_PROPS[type];
    const mat = new THREE.MeshLambertMaterial({ 
      map: map, 
      transparent: props.transparent, 
      opacity: props.opacity !== undefined ? props.opacity : 1.0 
    });
    materials[type] = mat;
    return mat;
  }

  // --- World Generation ---
  const noise2D = createNoise2D();
  const noise3D = createNoise3D();

  function generateWorld() {
    const scale = 0.05;
    const caveScale = 0.08;
    
    for (let x = 0; x < WORLD_SIZE; x++) {
      for (let z = 0; z < WORLD_SIZE; z++) {
        // Terrain Height
        let n = noise2D(x * scale, z * scale);
        let h = Math.floor((n + 1) * 8) + 5; 
        
        for (let y = 0; y < WORLD_HEIGHT; y++) {
          let idx = getIdx(x, y, z);
          
          // Bedrock
          if (y === 0) {
            worldData[idx] = BLOCKS.BEDROCK;
            continue;
          }

          // 3D Noise for Caves
          let caveNoise = noise3D(x * caveScale, y * caveScale, z * caveScale);
          let isCave = caveNoise > 0.4; 

          if (isCave && y > 1 && y < h - 2) {
             worldData[idx] = BLOCKS.AIR;
             continue;
          }

          if (y < h - 4) {
            // Deep stone - chance for ores
            let oreNoise = noise3D(x*0.2, y*0.2, z*0.2);
            if(oreNoise > 0.8) worldData[idx] = BLOCKS.COAL_ORE;
            else worldData[idx] = BLOCKS.STONE;
          } else if (y < h) {
            worldData[idx] = BLOCKS.DIRT;
          } else if (y === h) {
            if (h < 8) worldData[idx] = BLOCKS.SAND;
            else worldData[idx] = BLOCKS.GRASS;
            
            // Trees
            if (worldData[idx] === BLOCKS.GRASS && Math.random() < 0.015) {
               generateTree(x, y + 1, z);
            } else if (worldData[idx] === BLOCKS.GRASS && Math.random() < 0.05) {
              // Flowers
              let flowerType = Math.random() > 0.5 ? BLOCKS.POPPY : BLOCKS.DANDELION;
              setBlock(x, y+1, z, flowerType);
            }
          } else if (y < 7) {
             worldData[idx] = BLOCKS.WATER;
          }
        }
      }
    }
    
    spawnMobs(5);
    generateClouds();
  }

  function generateTree(x, y, z) {
    if (x < 2 || x >= WORLD_SIZE-2 || z < 2 || z >= WORLD_SIZE-2) return;
    const height = 4 + Math.floor(Math.random()*2);
    for(let i=0; i<height; i++) setBlock(x, y+i, z, BLOCKS.WOOD);
    
    for(let lx=x-2; lx<=x+2; lx++) {
      for(let ly=y+height-2; ly<=y+height; ly++) {
        for(let lz=z-2; lz<=z+2; lz++) {
          if (getBlock(lx,ly,lz) === BLOCKS.AIR) {
             if (Math.abs(lx-x) + Math.abs(ly-(y+height-1)) + Math.abs(lz-z) < 4) {
               setBlock(lx, ly, lz, BLOCKS.LEAVES);
             }
          }
        }
      }
    }
  }

  function generateClouds() {
    clouds.forEach(c => scene.remove(c.mesh));
    clouds = [];
    const cloudMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 });
    
    for(let i=0; i<15; i++) {
      let mesh = new THREE.Mesh(cloudGeometry, cloudMat);
      mesh.position.set(
        Math.random() * WORLD_SIZE,
        35 + Math.random() * 5,
        Math.random() * WORLD_SIZE
      );
      mesh.scale.set(1 + Math.random(), 0.5, 1 + Math.random());
      scene.add(mesh);
      clouds.push({ mesh, speed: 0.5 + Math.random() * 0.5 });
    }
  }

  // --- Drop Item Class ---
  class Drop {
    constructor(x, y, z, type) {
      this.type = type;
      this.mesh = new THREE.Mesh(dropGeometry, getMaterial(type));
      this.mesh.position.set(x, y, z);
      this.velocity = new THREE.Vector3((Math.random()-0.5)*5, 5, (Math.random()-0.5)*5);
      this.rotation = new THREE.Vector3(Math.random(), Math.random(), Math.random());
      this.life = 300; // Despawn time
      scene.add(this.mesh);
    }
    update(dt) {
      this.velocity.y -= GRAVITY * dt;
      this.mesh.position.addScaledVector(this.velocity, dt);
      this.mesh.rotation.x += this.rotation.x * dt;
      this.mesh.rotation.y += this.rotation.y * dt;
      this.life--;

      // Floor collision
      let bx = Math.round(this.mesh.position.x);
      let by = Math.round(this.mesh.position.y);
      let bz = Math.round(this.mesh.position.z);
      
      if (getBlock(bx, by, bz) !== BLOCKS.AIR && getBlock(bx, by, bz) !== BLOCKS.WATER) {
        this.mesh.position.y = by + 0.25; // Sit on top
        this.velocity.y = 0;
        this.velocity.x *= 0.9;
        this.velocity.z *= 0.9;
      }

      // Pick up
      let pPos = controls.getObject().position;
      let dist = this.mesh.position.distanceTo(pPos);
      if (dist < 1.5) {
        // Add to inventory
        addToInventory(this.type);
        playSound('pop');
        return false; // Remove
      }
      
      return this.life > 0;
    }
    remove() {
      scene.remove(this.mesh);
    }
  }

  // --- Particle System ---
  class Particle {
    constructor(x, y, z, color) {
      this.mesh = new THREE.Mesh(
        new THREE.BoxGeometry(0.1, 0.1, 0.1),
        new THREE.MeshBasicMaterial({ color: color })
      );
      this.mesh.position.set(x, y, z);
      this.velocity = new THREE.Vector3((Math.random()-0.5)*5, (Math.random())*5, (Math.random()-0.5)*5);
      scene.add(this.mesh);
    }
    update(dt) {
      this.velocity.y -= GRAVITY * dt;
      this.mesh.position.addScaledVector(this.velocity, dt);
      this.mesh.rotation.x += dt * 5;
      this.mesh.rotation.z += dt * 5;
      this.life -= dt;
      
      // Basic ground check
      if(this.mesh.position.y < Math.floor(this.mesh.position.y)) {
        this.mesh.position.y = Math.floor(this.mesh.position.y);
        this.velocity.y *= -0.5;
        this.velocity.x *= 0.8;
        this.velocity.z *= 0.8;
      }
      return this.life > 0;
    }
    remove() {
      scene.remove(this.mesh);
    }
  }

  function spawnParticles(x, y, z, color) {
    for(let i=0; i<8; i++) {
      let p = new Particle(x+0.5, y+0.5, z+0.5, color);
      p.life = 0.5 + Math.random() * 0.5;
      particles.push(p);
    }
  }

  // --- Inventory Logic ---
  function addToInventory(type) {
    // Try to stack (not implementing distinct counts for simplicity, just filling empty slots)
    for(let i=0; i<INVENTORY_SIZE; i++) {
      if(inventory[i] === BLOCKS.AIR) {
        inventory[i] = type;
        updateInventoryUI();
        return true;
      }
    }
    return false; // Full
  }

  function updateInventoryUI() {
    // Update Hotbar
    const slots = hotbarCtn.children;
    for(let i=0; i<9; i++) {
      let type = inventory[i];
      slots[i].style.backgroundColor = type === BLOCKS.AIR ? 'transparent' : BLOCK_PROPS[type].color;
      slots[i].innerHTML = ''; // Clear previous content
      if(i === selectedSlotIndex) slots[i].style.border = '3px solid white';
      else slots[i].style.border = '2px solid #333';
      
      // Optional: Add icon/text for non-color blocks
    }

    // Update Inventory Grid
    const gridSlots = inventoryGrid.children;
    for(let i=0; i<36; i++) {
      let type = inventory[i];
      let div = gridSlots[i];
      div.style.backgroundColor = type === BLOCKS.AIR ? 'transparent' : BLOCK_PROPS[type].color;
      
      // Highlight if it's the cursor item
      if(type === cursorItem && cursorItem !== BLOCKS.AIR) {
        div.style.outline = '2px solid white';
      } else {
        div.style.outline = 'none';
      }
    }
  }

  // --- Mob System ---
  class Mob {
    constructor(x, z) {
      this.mesh = new THREE.Mesh(mobGeometry, new THREE.MeshLambertMaterial({ color: 0x8844aa })); // Purple Slime/Zombie
      this.mesh.position.set(x + 0.5, 20, z + 0.5);
      this.velocity = new THREE.Vector3();
      this.mesh.castShadow = true;
      scene.add(this.mesh);
    }
    
    update(dt, playerPos) {
      const dx = playerPos.x - this.mesh.position.x;
      const dz = playerPos.z - this.mesh.position.z;
      const dist = Math.sqrt(dx*dx + dz*dz);
      
      if (dist < 20 && dist > 1) {
        this.velocity.x += (dx / dist) * 10 * dt;
        this.velocity.z += (dz / dist) * 10 * dt;
        if(this.mesh.position.y <= Math.floor(this.mesh.position.y) + 0.1 && Math.random() < 0.05) {
           this.velocity.y = 8;
        }
      }

      this.velocity.y -= GRAVITY * dt;
      this.mesh.position.x += this.velocity.x * dt;
      this.mesh.position.z += this.velocity.z * dt;
      this.mesh.position.y += this.velocity.y * dt;
      
      let groundY = 0;
      let checkY = Math.floor(this.mesh.position.y);
      while(checkY > 0 && getBlock(Math.round(this.mesh.position.x), checkY, Math.round(this.mesh.position.z)) === BLOCKS.AIR) {
        checkY--;
      }
      groundY = checkY + 1;

      if(this.mesh.position.y < groundY) {
        this.mesh.position.y = groundY;
        this.velocity.y = 0;
        this.velocity.x *= 0.8; 
        this.velocity.z *= 0.8;
      }

      if (dist < 1.5) {
        takeDamage(10);
        this.velocity.x -= (dx/dist) * 5;
        this.velocity.z -= (dz/dist) * 5;
      }
    }
  }

  function spawnMobs(count) {
    for(let i=0; i<count; i++) {
      let x = Math.floor(Math.random() * WORLD_SIZE);
      let z = Math.floor(Math.random() * WORLD_SIZE);
      mobs.push(new Mob(x, z));
    }
  }

  // --- Initialization ---
  function init() {
    setupHotbar();
    setupInventoryUI();
    
    // Scene
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    scene.fog = new THREE.Fog(0x87CEEB, 20, WORLD_SIZE - 5);

    // Camera
    camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    
    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);
    
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(50, 100, 50);
    dirLight.castShadow = true;
    dirLight.shadow.camera.left = -50;
    dirLight.shadow.camera.right = 50;
    dirLight.shadow.camera.top = 50;
    dirLight.shadow.camera.bottom = -50;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    scene.add(dirLight);
    window.sunLight = dirLight; 

    // Renderer
    renderer = new THREE.WebGLRenderer({ antialias: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    gameContainerEl.appendChild(renderer.domElement);

    // Highlight Box
    highlightMesh = new THREE.LineSegments(
      new THREE.EdgesGeometry(new THREE.BoxGeometry(1.01, 1.01, 1.01)),
      new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 2 })
    );
    highlightMesh.visible = false;
    scene.add(highlightMesh);

    // Controls
    controls = new PointerLockControls(camera, document.body);
    
    const blocker = blockerEl;
    const instructions = instructionsEl;

    instructions.addEventListener('click', () => {
      initAudio();
      controls.lock();
    });
    
    controls.addEventListener('lock', () => {
      blocker.style.display = 'none';
      inventoryCtn.style.display = 'none'; // Hide inventory on play
      settingsPanel.style.display = 'none'; 
      hudCtn.style.display = 'block';
    });
    
    controls.addEventListener('unlock', () => {
      // If not in inventory, show menu
      if (inventoryCtn.style.display !== 'flex') {
        blocker.style.display = 'flex';
        settingsPanel.style.display = 'none';
      }
      hudCtn.style.display = 'none';
    });

    scene.add(controls.getObject());

    // Inputs
    document.addEventListener('keydown', onKeyDown);
    document.addEventListener('keyup', onKeyUp);
    document.addEventListener('mousedown', onMouseDown);
    window.addEventListener('resize', onWindowResize);
    
    // Settings Listeners
    settingsBtn.onclick = (e) => {
      e.stopPropagation();
      settingsPanel.style.display = settingsPanel.style.display === 'none' ? 'block' : 'none';
    };
    
    resetWorldBtn.onclick = () => {
      resetGame();
    };

    fovSlider.oninput = (e) => {
      camera.fov = parseInt(e.target.value);
      camera.updateProjectionMatrix();
    };

    sensSlider.oninput = (e) => {
      mouseSensitivity = parseFloat(e.target.value);
    };
    
    // Save/Load
    saveBtn.onclick = async () => {
      saveBtn.textContent = 'Saving...';
      await saveGame();
      saveBtn.textContent = 'Saved!';
      setTimeout(()=>saveBtn.textContent='Save World', 1000);
    };
    
    loadBtn.onclick = async () => {
      loadBtn.textContent = 'Loading...';
      await loadGame();
      loadBtn.textContent = 'Loaded!';
      setTimeout(()=>loadBtn.textContent='Load World', 1000);
    };

    // Raycaster
    raycaster = new THREE.Raycaster();
    raycaster.far = REACH;

    // Generate or Load
    // Try load immediately
    loadGame().then(loaded => {
      if(!loaded) {
        generateWorld();
        controls.getObject().position.set(WORLD_SIZE/2, 30, WORLD_SIZE/2);
      }
      rebuildWorldMesh();
      updateHUD();
      updateInventoryUI();
      // Loop
      animate();
    });
  }

  function resetGame() {
    worldData.fill(0);
    mobs.forEach(m => scene.remove(m.mesh));
    mobs = [];
    drops.forEach(d => d.remove());
    drops = [];
    particles.forEach(p => p.remove());
    particles = [];
    inventory.fill(0);
    cursorItem = BLOCKS.AIR;
    selectedSlotIndex = 0;
    generateWorld();
    rebuildWorldMesh();
    controls.getObject().position.set(WORLD_SIZE/2, 30, WORLD_SIZE/2);
    velocity.set(0,0,0);
    health = 100;
    hunger = 100;
    updateHUD();
    updateInventoryUI();
  }

  async function saveGame() {
    if(!root || !root.kv) return;
    try {
      const pPos = controls.getObject().position;
      const data = {
        world: Array.from(worldData),
        player: { x: pPos.x, y: pPos.y, z: pPos.z, health, hunger, inventory },
        time: dayTime
      };
      await root.kv.minecraft.set('save', data);
    } catch(e) { console.error(e); }
  }

  async function loadGame() {
    if(!root || !root.kv) return false;
    try {
      const data = await root.kv.minecraft.get('save');
      if(data) {
        worldData = new Uint8Array(data.world);
        controls.getObject().position.set(data.player.x, data.player.y, data.player.z);
        health = data.player.health;
        hunger = data.player.hunger;
        inventory = data.player.inventory || new Array(INVENTORY_SIZE).fill(0);
        dayTime = data.time || 0;
        
        // Clear entities
        mobs.forEach(m => scene.remove(m.mesh));
        mobs = [];
        drops.forEach(d => d.remove());
        drops = [];
        
        spawnMobs(5); // Respawn mobs
        generateClouds();
        return true;
      }
    } catch(e) { console.error(e); }
    return false;
  }

  function setupHotbar() {
    const slots = [BLOCKS.GRASS, BLOCKS.DIRT, BLOCKS.STONE, BLOCKS.COBBLESTONE, BLOCKS.WOOD, BLOCKS.PLANKS, BLOCKS.LEAVES, BLOCKS.BRICK, BLOCKS.GLASS];
    hotbarCtn.innerHTML = '';
    slots.forEach((type, idx) => {
      let el = document.createElement('div');
      el.id = `slot-${idx}`;
      el.style.width = '36px';
      el.style.height = '36px';
      el.style.border = '2px solid #333';
      el.style.backgroundColor = BLOCK_PROPS[type].color;
      el.style.position = 'relative';
      if (idx === 0) el.style.border = '3px solid white';
      el.title = BLOCK_PROPS[type].name;
      hotbarCtn.appendChild(el);
      inventory[idx] = type; // Pre-fill hotbar
    });
  }

  function setupInventoryUI() {
    inventoryGrid.innerHTML = '';
    for(let i=0; i<INVENTORY_SIZE; i++) {
      let el = document.createElement('div');
      el.dataset.idx = i;
      el.style.border = '1px solid #373737';
      el.style.backgroundColor = 'transparent';
      el.style.cursor = 'pointer';
      el.onclick = (e) => onSlotClick(i);
      inventoryGrid.appendChild(el);
    }
  }

  function onSlotClick(idx) {
    const temp = inventory[idx];
    inventory[idx] = cursorItem;
    cursorItem = temp;
    updateInventoryUI();
  }

  function selectSlot(idx) {
    if (idx < 0 || idx >= 9) return;
    selectedSlotIndex = idx;
    selectedBlockType = inventory[idx];
    updateInventoryUI();
    
    interactionEl.textContent = `Selected: ${selectedBlockType === BLOCKS.AIR ? 'Empty' : BLOCK_PROPS[selectedBlockType].name}`;
    interactionEl.style.opacity = 1;
    setTimeout(() => interactionEl.style.opacity = 0, 1500);
  }

  function takeDamage(amount) {
    health -= amount;
    if (health < 0) health = 0;
    updateHUD();
    playSound('hurt');
    
    const flash = document.createElement('div');
    flash.style.cssText = "position:absolute; top:0; left:0; width:100%; height:100%; background:red; opacity:0.3; pointer-events:none; transition:opacity 0.5s";
    document.body.appendChild(flash);
    setTimeout(()=> { flash.style.opacity=0; setTimeout(()=>flash.remove(), 500); }, 50);

    if(health <= 0) {
      health = 100;
      hunger = 100;
      controls.getObject().position.set(WORLD_SIZE/2, 30, WORLD_SIZE/2);
      velocity.set(0,0,0);
      updateHUD();
    }
  }

  function updateHUD() {
    healthBarEl.style.width = `${health}%`;
    hungerBarEl.style.width = `${hunger}%`;
  }

  // --- Controls ---
  function onKeyDown(event) {
    switch (event.code) {
      case 'ArrowUp': case 'KeyW': moveForward = true; break;
      case 'ArrowLeft': case 'KeyA': moveLeft = true; break;
      case 'ArrowDown': case 'KeyS': moveBackward = true; break;
      case 'ArrowRight': case 'KeyD': moveRight = true; break;
      case 'ShiftLeft': case 'ShiftRight': isSprinting = true; break;
      case 'Space': 
        if (canJump) {
          velocity.y += JUMP_FORCE;
          canJump = false;
          playSound('jump');
        }
        break;
      case 'KeyE':
        if(controls.isLocked) {
          controls.unlock();
          inventoryCtn.style.display = 'flex';
          updateInventoryUI();
        } else if(inventoryCtn.style.display === 'flex') {
          inventoryCtn.style.display = 'none';
          controls.lock();
        }
        break;
      case 'Digit1': selectSlot(0); break;
      case 'Digit2': selectSlot(1); break;
      case 'Digit3': selectSlot(2); break;
      case 'Digit4': selectSlot(3); break;
      case 'Digit5': selectSlot(4); break;
      case 'Digit6': selectSlot(5); break;
      case 'Digit7': selectSlot(6); break;
      case 'Digit8': selectSlot(7); break;
      case 'Digit9': selectSlot(8); break;
    }
  }

  function onKeyUp(event) {
    switch (event.code) {
      case 'ArrowUp': case 'KeyW': moveForward = false; break;
      case 'ArrowLeft': case 'KeyA': moveLeft = false; break;
      case 'ArrowDown': case 'KeyS': moveBackward = false; break;
      case 'ArrowRight': case 'KeyD': moveRight = false; break;
      case 'ShiftLeft': case 'ShiftRight': isSprinting = false; break;
    }
  }

  function onMouseDown(event) {
    if (!controls.isLocked) return;

    raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
    const intersects = raycaster.intersectObjects(Object.values(meshes));

    highlightMesh.visible = false;

    if (intersects.length > 0) {
      const hit = intersects[0];
      const mesh = hit.object;
      
      const dummy = new THREE.Object3D();
      mesh.getMatrixAt(hit.instanceId, dummy.matrix);
      dummy.matrix.decompose(dummy.position, dummy.quaternion, dummy.scale);
      
      const x = Math.round(dummy.position.x);
      const y = Math.round(dummy.position.y);
      const z = Math.round(dummy.position.z);
      const type = mesh.userData.blockType;

      if (event.button === 0) {
        // Mine
        if (type !== BLOCKS.BEDROCK && type !== BLOCKS.WATER) {
          setBlock(x, y, z, BLOCKS.AIR);
          playSound('break');
          
          // Drop Item
          drops.push(new Drop(x+0.5, y+0.5, z+0.5, type));
          
          // Particles
          spawnParticles(x,y,z, BLOCK_PROPS[type].color);
        }
      } else if (event.button === 2) {
        // Place
        if (selectedBlockType === BLOCKS.AIR) return;

        const normal = hit.face.normal;
        const nx = x + Math.round(normal.x);
        const ny = y + Math.round(normal.y);
        const nz = z + Math.round(normal.z);
        
        const pPos = controls.getObject().position;
        const px = Math.round(pPos.x);
        const py = Math.round(pPos.y);
        const pz = Math.round(pPos.z);
        
        // Don't place inside player
        if (!(nx === px && (ny === py || ny === py-1) && nz === pz) && getBlock(nx, ny, nz) === BLOCKS.AIR) {
           // Check if we have the item
           if(inventory[selectedSlotIndex] === selectedBlockType || selectedBlockType === BLOCKS.AIR) {
             setBlock(nx, ny, nz, selectedBlockType);
             playSound('place');
           }
        }
      }
    }
  }

  function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  // --- Mesh Building ---
  const geometry = new THREE.BoxGeometry(1, 1, 1);
  
  function rebuildWorldMesh() {
    Object.values(meshes).forEach(m => {
      scene.remove(m);
      m.dispose();
    });
    meshes = {};

    const positions = {};
    
    for (let i = 0; i < worldData.length; i++) {
      const type = worldData[i];
      if (type === BLOCKS.AIR) continue;
      
      const y = Math.floor(i / (WORLD_SIZE * WORLD_SIZE));
      const rem = i % (WORLD_SIZE * WORLD_SIZE);
      const z = Math.floor(rem / WORLD_SIZE);
      const x = rem % WORLD_SIZE;

      if (getBlock(x+1, y, z) === BLOCKS.AIR || getBlock(x-1, y, z) === BLOCKS.AIR ||
          getBlock(x, y+1, z) === BLOCKS.AIR || getBlock(x, y-1, z) === BLOCKS.AIR ||
          getBlock(x, y, z+1) === BLOCKS.AIR || getBlock(x, y, z-1) === BLOCKS.AIR) {
        
        if (!positions[type]) positions[type] = [];
        positions[type].push({x, y, z});
      }
    }

    for (const typeStr in positions) {
      const type = parseInt(typeStr);
      const posArray = positions[type];
      const mesh = new THREE.InstancedMesh(geometry, getMaterial(type), posArray.length);
      mesh.userData.blockType = type;
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      
      const dummy = new THREE.Object3D();
      for (let i = 0; i < posArray.length; i++) {
        const p = posArray[i];
        dummy.position.set(p.x + 0.5, p.y + 0.5, p.z + 0.5);
        dummy.updateMatrix();
        mesh.setMatrixAt(i, dummy.matrix);
      }
      
      scene.add(mesh);
      meshes[type] = mesh;
    }
    worldNeedsUpdate = false;
  }

  // --- Physics & Logic ---
  function checkPlayerCollision(pos) {
    const r = 0.3; 
    const x = Math.floor(pos.x);
    const y = Math.floor(pos.y);
    const z = Math.floor(pos.z);
    
    const solid = (bx, by, bz) => {
       const b = getBlock(bx, by, bz);
       return b !== BLOCKS.AIR && b !== BLOCKS.WATER && !BLOCK_PROPS[b]?.transparent; // Collide with solids, not water/glass
    };

    // Simplified Collision
    if (solid(x, Math.round(pos.y - 1.5), z)) return true; // Feet
    if (solid(x, Math.round(pos.y - 0.2), z)) return true; // Body
    return false;
  }

  function animate() {
    requestAnimationFrame(animate);

    const time = performance.now();
    const delta = Math.min((time - prevTime) / 1000, 0.1); 
    prevTime = time;

    // Day/Night Cycle
    dayTime += delta / DAY_LENGTH;
    if (dayTime > 1) dayTime = 0;
    const sunAngle = (dayTime * Math.PI * 2) - (Math.PI / 2);
    window.sunLight.position.set(Math.cos(sunAngle)*100, Math.sin(sunAngle)*100, 50);
    
    const dayColor = new THREE.Color(0x87CEEB);
    const nightColor = new THREE.Color(0x050510);
    
    if (Math.sin(sunAngle) > 0) { // Night
       scene.background = nightColor;
       scene.fog.color = nightColor;
       window.sunLight.intensity = 0.2;
    } else { // Day
       scene.background = dayColor;
       scene.fog.color = dayColor;
       window.sunLight.intensity = 0.8;
    }
    
    const hours = Math.floor(dayTime * 24);
    const mins = Math.floor((dayTime * 24 * 60) % 60);
    timeEl.textContent = `${hours.toString().padStart(2,'0')}:${mins.toString().padStart(2,'0')}`;

    if (controls.isLocked) {
      // Apply Sensitivity (Simulated by rotating camera object itself since PointerLockControls handles input)
      // Note: PointerLockControls handles look internally. Sensitivity in standard ThreeJS is tricky without modifying the library code or handling events manually.
      // For this implementation, we assume standard behavior. The slider is a placeholder for "Game Feel" or requires manual event handling override.
      // To implement properly, we'd need to override PointerLockControls' onMouseMove, but we'll keep it simple.
      
      hunger -= delta * 0.5;
      if (hunger <= 0) hunger = 0;
      if (hunger === 0 && Math.random() < 0.005) takeDamage(1); 
      updateHUD();

      const currentSpeed = isSprinting && hunger > 0 ? SPRINT_SPEED : SPEED;
      
      velocity.x -= velocity.x * 10.0 * delta;
      velocity.z -= velocity.z * 10.0 * delta;
      velocity.y -= GRAVITY * delta; 

      direction.z = Number(moveForward) - Number(moveBackward);
      direction.x = Number(moveRight) - Number(moveLeft);
      direction.normalize(); 

      if (moveForward || moveBackward) velocity.z -= direction.z * currentSpeed * 10.0 * delta;
      if (moveLeft || moveRight) velocity.x -= direction.x * currentSpeed * 10.0 * delta;

      const obj = controls.getObject();
      
      // X Collision
      obj.translateX(-velocity.x * delta); 
      if (checkPlayerCollision(obj.position)) {
        obj.translateX(velocity.x * delta);
        velocity.x = 0;
      }

      // Z Collision
      obj.translateZ(velocity.z * delta);
      if (checkPlayerCollision(obj.position)) {
        obj.translateZ(-velocity.z * delta);
        velocity.z = 0;
      }

      // Y Collision
      obj.position.y += velocity.y * delta;
      
      if (checkPlayerCollision(obj.position)) {
        if(velocity.y < -20) {
          takeDamage(Math.floor(Math.abs(velocity.y) - 20) * 2);
        }
        if (velocity.y < 0) {
          canJump = true;
          obj.position.y = Math.ceil(obj.position.y - 1.6) + 1.6;
        } else {
          obj.position.y = Math.floor(obj.position.y);
        }
        velocity.y = 0;
      }
      
      if(getBlock(Math.round(obj.position.x), Math.round(obj.position.y), Math.round(obj.position.z)) === BLOCKS.WATER) {
         velocity.y += GRAVITY * 1.5 * delta; 
      }

      if (obj.position.y < -20) {
        takeDamage(100);
      }
      
      debugEl.innerText = `XYZ: ${obj.position.x.toFixed(1)}, ${obj.position.y.toFixed(1)}, ${obj.position.z.toFixed(1)}\nEntities: ${mobs.length}\nDrops: ${drops.length}`;

      // Highlight Box
      raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
      const intersects = raycaster.intersectObjects(Object.values(meshes));
      if(intersects.length > 0) {
        const hit = intersects[0];
        const dummy = new THREE.Object3D();
        hit.object.getMatrixAt(hit.instanceId, dummy.matrix);
        dummy.matrix.decompose(dummy.position, dummy.quaternion, dummy.scale);
        highlightMesh.position.copy(dummy.position);
        highlightMesh.visible = true;
      } else {
        highlightMesh.visible = false;
      }
    }
    
    // Update Clouds
    clouds.forEach(c => {
      c.mesh.position.x += c.speed * delta * 0.05;
      if(c.mesh.position.x > WORLD_SIZE) c.mesh.position.x = -10;
    });

    // Update Mobs
    mobs.forEach(mob => mob.update(delta, controls.getObject().position));

    // Update Drops
    for (let i = drops.length - 1; i >= 0; i--) {
      if (!drops[i].update(delta)) {
        drops[i].remove();
        drops.splice(i, 1);
      }
    }

    // Update Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      if (!particles[i].update(delta)) {
        particles[i].remove();
        particles.splice(i, 1);
      }
    }

    if (worldNeedsUpdate) rebuildWorldMesh();

    renderer.render(scene, camera);
  }

  // Start
  init();

</script>
