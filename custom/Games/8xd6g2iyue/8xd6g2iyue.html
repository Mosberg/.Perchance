        row.innerHTML = `
          <div class="ci-left">
            <span class="ci-emoji">${p[1]}</span>
            <span class="ci-name">${p[0]}</span>
          </div>
          <span class="ci-price">${CURRENCY}${p[3].toFixed(2)}</span>
          <button class="rm" onclick="removeFromCart(${i})">🗑️</button>
        `;
        itemsEl.appendChild(row);
      });
    }
    document.getElementById("cartTotal").textContent = CURRENCY + total.toFixed(2);
  }

  function toggleCart() {
    const panel = document.getElementById("cartPanel");
    const overlay = document.getElementById("overlay");
    panel.classList.toggle("open");
    overlay.classList.toggle("show");
  }

  function checkout() {
    if (cart.length === 0) { alert("🛒 Your cart is empty! Add some gear first. 🎽"); return; }
    let total = cart.reduce((s, i) => s + PRODUCTS[i][3], 0);
    alert(`🎉 Order placed!\n\n📦 ${cart.length} item(s)\n💰 Total: ${CURRENCY}${total.toFixed(2)}\n\nThanks for shopping at LittleChamps! 🏆`);
    cart = [];
    updateCart();
    toggleCart();
    renderGrid();
  }

  window.addToCart = addToCart;
  window.removeFromCart = removeFromCart;
  window.toggleCart = toggleCart;
  window.checkout = checkout;

  renderFilters();
  renderGrid();
  updateCart();
})();
</script>

<style> html { color-scheme: light; } </style>

</body>
</html>
