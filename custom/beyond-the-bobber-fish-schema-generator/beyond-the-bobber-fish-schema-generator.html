<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>beyond-the-bobber-fish-schema-generator — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<div>
  <h1>Beyond the Bobber Fish Schema Generator</h1>
  <p>Create JSON files for the Beyond the Bobber Minecraft mod with AI assistance</p>
  
  <div style="display:flex; gap:20px; margin-top:20px;">
    <!-- Form Section -->
    <div style="flex:1; padding:15px; border:1px solid #ddd; border-radius:8px;">
      <h2>Fish Properties</h2>
      
      <!-- Basic Properties -->
      <div class="form-group">
        <label>Fish ID:</label>
        <input id="idInputEl" type="text" placeholder="snake_case_id" required>
      </div>
      
      <div class="form-group">
        <label>Fish Name:</label>
        <input id="nameInputEl" type="text" placeholder="Display Name" required>
      </div>
      
      <div class="form-group">
        <label>Rarity:</label>
        <select id="raritySelectEl">
          <option value="common">Common</option>
          <option value="uncommon">Uncommon</option>
          <option value="rare">Rare</option>
          <option value="legendary">Legendary</option>
        </select>
      </div>
      
      <!-- Biomes -->
      <div class="form-group">
        <label>Biomes:</label>
        <div id="biomesContainerEl">
          <div class="biome-item">
            <input type="text" placeholder="Biome ID" class="biome-input">
            <button onclick="removeBiome(this)">Remove</button>
          </div>
        </div>
        <button onclick="addBiome()" style="margin-top:5px;">Add Biome</button>
      </div>
      
      <!-- Conditions -->
      <div class="form-group">
        <label>Time of Day:</label>
        <select id="timeSelectEl">
          <option value="any">Any</option>
          <option value="day">Day</option>
          <option value="night">Night</option>
        </select>
      </div>
      
      <div class="form-group">
        <label>Weather:</label>
        <select id="weatherSelectEl">
          <option value="any">Any</option>
          <option value="clear">Clear</option>
          <option value="rain">Rain</option>
        </select>
      </div>
      
      <!-- Physical Properties -->
      <div class="form-group">
        <label>Size (0.1-10.0):</label>
        <input id="sizeInputEl" type="number" min="0.1" max="10.0" step="0.1">
      </div>
      
      <div class="form-group">
        <label>Weight (0.1-100.0):</label>
        <input id="weightInputEl" type="number" min="0.1" max="100.0" step="0.1">
      </div>
      
      <!-- Loot -->
      <div class="form-group">
        <label>Loot Drops:</label>
        <div id="lootContainerEl">
          <div class="loot-item">
            <input type="text" placeholder="Item ID" class="loot-item-input">
            <input type="number" placeholder="Chance (0-1)" min="0" max="1" step="0.01" class="loot-chance-input">
            <button onclick="removeLoot(this)">Remove</button>
          </div>
        </div>
        <button onclick="addLoot()" style="margin-top:5px;">Add Loot</button>
      </div>
      
      <!-- Effects -->
      <div class="form-group">
        <label>Effects:</label>
        <div id="effectsContainerEl">
          <div class="effect-item">
            <input type="text" placeholder="Effect ID" class="effect-input">
            <input type="number" placeholder="Duration (ticks)" min="1" class="effect-duration-input">
            <input type="number" placeholder="Amplifier" min="0" value="0" class="effect-amplifier-input">
            <button onclick="removeEffect(this)">Remove</button>
          </div>
        </div>
        <button onclick="addEffect()" style="margin-top:5px;">Add Effect</button>
      </div>
      
      <!-- Flavor Text -->
      <div class="form-group">
        <label>Flavor Text:</label>
        <textarea id="flavorTextareaEl" rows="3" placeholder="Optional lore or description"></textarea>
      </div>
      
      <!-- Action Buttons -->
      <div style="margin-top:20px;">
        <button onclick="generateFishAI()" id="generateAIBtn">Generate with AI</button>
        <button onclick="generateJson()">Generate JSON</button>
        <button onclick="clearForm()">Clear Form</button>
      </div>
    </div>
    
    <!-- Preview Section -->
    <div style="flex:1; padding:15px; border:1px solid #ddd; border-radius:8px;">
      <h2>JSON Preview</h2>
      <pre id="jsonOutputEl" style="background:#f5f5f5; padding:10px; border-radius:4px; min-height:300px; white-space:pre-wrap;"></pre>
      <button onclick="copyJson()" style="margin-top:10px;">Copy JSON</button>
    </div>
  </div>
  
  <!-- AI Settings -->
  <div style="margin-top:30px; padding:15px; border:1px solid #ddd; border-radius:8px;">
    <h2>AI Settings</h2>
    <div class="form-group">
      <label>Creativity Level:</label>
      <select id="creativitySelectEl">
        <option value="low">Low (More predictable)</option>
        <option value="medium" selected>Medium (Balanced)</option>
        <option value="high">High (More creative)</option>
      </select>
    </div>
    <div class="form-group">
      <label>Biome Theme:</label>
      <input id="biomeThemeInputEl" type="text" placeholder="e.g., ocean, jungle, nether">
    </div>
    <div class="form-group">
      <label>Special Abilities:</label>
      <input id="abilitiesInputEl" type="text" placeholder="e.g., glowing, poisonous, fast">
    </div>
  </div>
  
  <style>
    body { text-align: left; }
    .form-group { margin-bottom: 15px; }
    label { display: inline-block; width: 150px; font-weight: bold; }
    input, select, textarea { padding: 8px; border-radius: 4px; border: 1px solid #ccc; width: 250px; }
    button { padding: 8px 15px; background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #45a049; }
    .biome-item, .loot-item, .effect-item { display: flex; gap: 5px; margin-bottom: 5px; align-items: center; }
    .biome-item input, .loot-item input, .effect-item input { width: auto; }
    .loot-item input:first-child { width: 150px; }
    .effect-item input:first-child { width: 120px; }
    .effect-item input:nth-child(2) { width: 100px; }
    .effect-item input:nth-child(3) { width: 80px; }
  </style>
  
  <script>
    // Add biome input field
    function addBiome() {
      const container = biomesContainerEl;
      const div = document.createElement('div');
      div.className = 'biome-item';
      div.innerHTML = `
        <input type="text" placeholder="Biome ID" class="biome-input">
        <button onclick="removeBiome(this)">Remove</button>
      `;
      container.appendChild(div);
    }
    
    // Remove biome input field
    function removeBiome(btn) {
      btn.parentElement.remove();
    }
    
    // Add loot input field
    function addLoot() {
      const container = lootContainerEl;
      const div = document.createElement('div');
      div.className = 'loot-item';
      div.innerHTML = `
        <input type="text" placeholder="Item ID" class="loot-item-input">
        <input type="number" placeholder="Chance (0-1)" min="0" max="1" step="0.01" class="loot-chance-input">
        <button onclick="removeLoot(this)">Remove</button>
      `;
      container.appendChild(div);
    }
    
    // Remove loot input field
    function removeLoot(btn) {
      btn.parentElement.remove();
    }
    
    // Add effect input field
    function addEffect() {
      const container = effectsContainerEl;
      const div = document.createElement('div');
      div.className = 'effect-item';
      div.innerHTML = `
        <input type="text" placeholder="Effect ID" class="effect-input">
        <input type="number" placeholder="Duration (ticks)" min="1" class="effect-duration-input">
        <input type="number" placeholder="Amplifier" min="0" value="0" class="effect-amplifier-input">
        <button onclick="removeEffect(this)">Remove</button>
      `;
      container.appendChild(div);
    }
    
    // Remove effect input field
    function removeEffect(btn) {
      btn.parentElement.remove();
    }
    
    // Generate fish with AI
    async function generateFishAI() {
      const btn = document.getElementById('generateAIBtn');
      btn.disabled = true;
      btn.textContent = "Generating...";
      
      const creativity = creativitySelectEl.value;
      const biomeTheme = biomeThemeInputEl.value || "various biomes";
      const abilities = abilitiesInputEl.value || "standard fish abilities";
      
      const prompt = `Generate a fish entity for a Minecraft mod called "Beyond the Bobber" with these characteristics:
      
      - Creativity level: ${creativity}
      - Biome theme: ${biomeTheme}
      - Special abilities: ${abilities}
      
      Provide a response with all required properties in this exact JSON format:
      {
        "id": "snake_case_id",
        "name": "Display Name",
        "rarity": "common|uncommon|rare|legendary",
        "biomes": ["biome1", "biome2"],
        "time_of_day": "day|night|any",
        "weather": "clear|rain|any",
        "size": number between 0.1-10.0,
        "weight": number between 0.1-100.0,
        "loot": [{"item": "item_id", "chance": 0.x}],
        "effects": [{"effect": "effect_id", "duration": 100, "amplifier": 0}],
        "flavor_text": "Lore description"
      }`;
      
      try {
        const response = await generateText(prompt);
        const data = JSON.parse(response);
        
        // Fill form with AI-generated data
        idInputEl.value = data.id || "";
        nameInputEl.value = data.name || "";
        raritySelectEl.value = data.rarity || "common";
        
        // Clear and populate biomes
        const biomesContainer = biomesContainerEl;
        biomesContainer.innerHTML = "";
        if (data.biomes && data.biomes.length > 0) {
          data.biomes.forEach(biome => {
            const div = document.createElement('div');
            div.className = 'biome-item';
            div.innerHTML = `
              <input type="text" placeholder="Biome ID" class="biome-input" value="${biome}">
              <button onclick="removeBiome(this)">Remove</button>
            `;
            biomesContainer.appendChild(div);
          });
        }
        
        timeSelectEl.value = data.time_of_day || "any";
        weatherSelectEl.value = data.weather || "any";
        sizeInputEl.value = data.size || "";
        weightInputEl.value = data.weight || "";
        
        // Clear and populate loot
        const lootContainer = lootContainerEl;
        lootContainer.innerHTML = "";
        if (data.loot && data.loot.length > 0) {
          data.loot.forEach(loot => {
            const div = document.createElement('div');
            div.className = 'loot-item';
            div.innerHTML = `
              <input type="text" placeholder="Item ID" class="loot-item-input" value="${loot.item}">
              <input type="number" placeholder="Chance (0-1)" min="0" max="1" step="0.01" class="loot-chance-input" value="${loot.chance}">
              <button onclick="removeLoot(this)">Remove</button>
            `;
            lootContainer.appendChild(div);
          });
        }
        
        // Clear and populate effects
        const effectsContainer = effectsContainerEl;
        effectsContainer.innerHTML = "";
        if (data.effects && data.effects.length > 0) {
          data.effects.forEach(effect => {
            const div = document.createElement('div');
            div.className = 'effect-item';
            div.innerHTML = `
              <input type="text" placeholder="Effect ID" class="effect-input" value="${effect.effect}">
              <input type="number" placeholder="Duration (ticks)" min="1" class="effect-duration-input" value="${effect.duration}">
              <input type="number" placeholder="Amplifier" min="0" value="${effect.amplifier || 0}" class="effect-amplifier-input">
              <button onclick="removeEffect(this)">Remove</button>
            `;
            effectsContainer.appendChild(div);
          });
        }
        
        flavorTextareaEl.value = data.flavor_text || "";
        
        // Show success message
        jsonOutputEl.textContent = "AI generation complete! Check the form fields.";
      } catch (error) {
        jsonOutputEl.textContent = "Error generating fish: " + error.message;
      } finally {
        btn.disabled = false;
        btn.textContent = "Generate with AI";
      }
    }
    
    // Generate JSON from form
    function generateJson() {
      try {
        // Collect basic properties
        const id = idInputEl.value.trim();
        const name = nameInputEl.value.trim();
        const rarity = raritySelectEl.value;
        
        // Validate required fields
        if (!id) throw new Error("Fish ID is required");
        if (!/^[a-z0-9_]+$/.test(id)) throw new Error("ID must be snake_case (lowercase letters, numbers, underscores)");
        if (!name) throw new Error("Fish name is required");
        
        // Collect biomes
        const biomes = [];
        document.querySelectorAll('.biome-input').forEach(input => {
          if (input.value.trim()) biomes.push(input.value.trim());
        });
        
        if (biomes.length === 0) throw new Error("At least one biome is required");
        
        // Build JSON object
        const fish = {
          id,
          name,
          rarity,
          biomes,
          time_of_day: timeSelectEl.value,
          weather: weatherSelectEl.value
        };
        
        // Add optional size
        const size = parseFloat(sizeInputEl.value);
        if (!isNaN(size)) fish.size = size;
        
        // Add optional weight
        const weight = parseFloat(weightInputEl.value);
        if (!isNaN(weight)) fish.weight = weight;
        
        // Add loot
        const loot = [];
        document.querySelectorAll('.loot-item').forEach(item => {
          const itemId = item.querySelector('.loot-item-input').value.trim();
          const chance = parseFloat(item.querySelector('.loot-chance-input').value);
          
          if (itemId && !isNaN(chance)) {
            loot.push({ item: itemId, chance });
          }
        });
        
        if (loot.length > 0) fish.loot = loot;
        
        // Add effects
        const effects = [];
        document.querySelectorAll('.effect-item').forEach(item => {
          const effectId = item.querySelector('.effect-input').value.trim();
          const duration = parseInt(item.querySelector('.effect-duration-input').value);
          const amplifier = parseInt(item.querySelector('.effect-amplifier-input').value) || 0;
          
          if (effectId && !isNaN(duration)) {
            effects.push({ effect: effectId, duration, amplifier });
          }
        });
        
        if (effects.length > 0) fish.effects = effects;
        
        // Add flavor text
        const flavorText = flavorTextareaEl.value.trim();
        if (flavorText) fish.flavor_text = flavorText;
        
        // Display JSON
        jsonOutputEl.textContent = JSON.stringify(fish, null, 2);
      } catch (error) {
        jsonOutputEl.textContent = "Validation Error: " + error.message;
      }
    }
    
    // Copy JSON to clipboard
    function copyJson() {
      const jsonText = jsonOutputEl.textContent;
      navigator.clipboard.writeText(jsonText)
        .then(() => {
          const btn = event.target;
          const originalText = btn.textContent;
          btn.textContent = "Copied!";
          setTimeout(() => {
            btn.textContent = originalText;
          }, 2000);
        })
        .catch(err => {
          console.error('Failed to copy: ', err);
        });
    }
    
    // Clear form
    function clearForm() {
      idInputEl.value = "";
      nameInputEl.value = "";
      raritySelectEl.value = "common";
      timeSelectEl.value = "any";
      weatherSelectEl.value = "any";
      sizeInputEl.value = "";
      weightInputEl.value = "";
      flavorTextareaEl.value = "";
      
      // Clear dynamic fields
      biomesContainerEl.innerHTML = `
        <div class="biome-item">
          <input type="text" placeholder="Biome ID" class="biome-input">
          <button onclick="removeBiome(this)">Remove</button>
        </div>
      `;
      
      lootContainerEl.innerHTML = `
        <div class="loot-item">
          <input type="text" placeholder="Item ID" class="loot-item-input">
          <input type="number" placeholder="Chance (0-1)" min="0" max="1" step="0.01" class="loot-chance-input">
          <button onclick="removeLoot(this)">Remove</button>
        </div>
      `;
      
      effectsContainerEl.innerHTML = `
        <div class="effect-item">
          <input type="text" placeholder="Effect ID" class="effect-input">
          <input type="number" placeholder="Duration (ticks)" min="1" class="effect-duration-input">
          <input type="number" placeholder="Amplifier" min="0" value="0" class="effect-amplifier-input">
          <button onclick="removeEffect(this)">Remove</button>
        </div>
      `;
      
      jsonOutputEl.textContent = "";
    }
  </script>
</div>
</body>
</html>
