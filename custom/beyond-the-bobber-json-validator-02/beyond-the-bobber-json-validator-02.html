  <script>
    // Schemas data
    const schemas = {
      tools: {
        $schema: "http://json-schema.org/draft-07/schema#",
        title: "Fishing Tools",
        type: "object",
        patternProperties: {
          "^[a-z_]+$": {
            type: "object",
            properties: {
              id: { type: "string" },
              type: { enum: ["net", "rod", "harpoon", "trap"] },
              bonus_success: { type: "number" },
              durability: { type: "integer" },
              catch_types: { type: "array", items: { type: "string" } },
              repair_item: { type: "string" },
            },
            required: ["id", "type", "bonus_success", "durability"],
          },
        },
      },
      tools_recipes: {
        $schema: "http://json-schema.org/draft-07/schema#",
        title: "Fishing Tool Recipes",
        description: "Schema for crafting recipes that produce fishing tools.",
        type: "object",
        patternProperties: {
          "^[a-z_]+$": {
            type: "object",
            properties: {
              id: {
                type: "string",
                description: "Unique namespaced ID for the recipe.",
                pattern: "^beyond_the_bobber:[a-z_]+$",
              },
              pattern: {
                type: "array",
                items: {
                  type: "string",
                  maxLength: 3,
                  minLength: 3,
                },
                minItems: 1,
                maxItems: 3,
                description: "Crafting grid rows (3x3). Spaces = empty slots.",
              },
              key: {
                type: "object",
                patternProperties: {
                  "^[A-Z]$": {
                    type: "string",
                    description: "Maps pattern symbol to a Minecraft item ID.",
                  },
                },
                additionalProperties: false,
                description: "Symbol-to-item mapping for the recipe pattern.",
              },
              result: {
                type: "object",
                properties: {
                  item: {
                    type: "string",
                    description: "Item ID produced by the recipe.",
                    pattern: "^beyond_the_bobber:[a-z_]+$",
                  },
                  count: {
                    type: "integer",
                    minimum: 1,
                    description: "Number of items produced.",
                  },
                },
                required: ["item", "count"],
                additionalProperties: false,
              },
            },
            required: ["id", "pattern", "key", "result"],
            additionalProperties: false,
          },
        },
        additionalProperties: false,
        allOf: [
          {
            description:
              "Cross-validation: ensure recipe result item exists in tools.json",
            properties: {
              result: {
                properties: {
                  item: {
                    enum: [
                      "beyond_the_bobber:small_fishing_net",
                      "beyond_the_bobber:big_fishing_net",
                      "beyond_the_bobber:fishing_rod",
                      "beyond_the_bobber:fly_fishing_rod",
                      "beyond_the_bobber:harpoon",
                      "beyond_the_bobber:lobster_pot",
                    ],
                  },
                },
              },
            },
          },
        ],
      },
      raw_fish: {
        $schema: "http://json-schema.org/draft-07/schema#",
        title: "Raw Fish Species",
        type: "object",
        patternProperties: {
          "^[a-z_]+$": {
            type: "object",
            properties: {
              id: { type: "string" },
              tool: { type: "string" },
              xp: { type: "integer" },
              rarity: { $ref: "rarity.schema.json" },
              biome: { type: "array", items: { type: "string" } },
              food: {
                type: "object",
                properties: {
                  hunger: { type: "integer" },
                  saturation: { type: "number" },
                },
              },
              stack_size: { type: "integer" },
            },
            required: ["id", "tool", "xp", "rarity", "food"],
          },
        },
      },
      cooked_fish: {
        $schema: "http://json-schema.org/draft-07/schema#",
        title: "Cooked Fish",
        type: "object",
        patternProperties: {
          "^[a-z_]+$": {
            type: "object",
            properties: {
              id: { type: "string" },
              source: { type: "string" },
              methods: {
                type: "array",
                items: { enum: ["campfire", "furnace", "smoker"] },
              },
              xp: { type: "integer" },
              food: {
                type: "object",
                properties: {
                  hunger: { type: "integer" },
                  saturation: { type: "number" },
                },
              },
              effects: {
                type: "array",
                items: {
                  type: "object",
                  properties: {
                    id: { type: "string" },
                    duration: { type: "integer" },
                    amplifier: { type: "integer" },
                  },
                },
              },
            },
            required: ["id", "source", "methods", "xp", "food"],
          },
        },
      },
      dishes: {
        $schema: "http://json-schema.org/draft-07/schema#",
        title: "Multi-Ingredient Dishes",
        type: "object",
        patternProperties: {
          "^[a-z_]+$": {
            type: "object",
            properties: {
              id: { type: "string" },
              ingredients: {
                type: "array",
                items: {
                  type: "object",
                  properties: {
                    item: { type: "string" },
                    count: { type: "integer" },
                  },
                },
              },
              method: { enum: ["campfire", "furnace", "smoker", "crafting"] },
              station: { type: "string" },
              xp: { type: "integer" },
              food: {
                type: "object",
                properties: {
                  hunger: { type: "integer" },
                  saturation: { type: "number" },
                },
              },
              effects: {
                type: "array",
                items: {
                  type: "object",
                  properties: {
                    id: { type: "string" },
                    duration: { type: "integer" },
                    amplifier: { type: "integer" },
                  },
                },
              },
              rarity: { $ref: "rarity.schema.json" },
              category: { type: "string" },
            },
            required: ["id", "ingredients", "method", "xp", "food", "rarity"],
          },
        },
      },
      rarity: {
        $schema: "http://json-schema.org/draft-07/schema#",
        title: "Rarity Enum",
        description: "Defines rarity tiers for fish, dishes, and items.",
        enum: ["common", "uncommon", "rare", "epic", "legendary"],
        definitions: {
          rarities: {
            common: {
              enum: "common",
              color: "gray",
              colorHex: "#A0A0A0",
              displayName: "Common",
              type: "rarity",
            },
            uncommon: {
              enum: "uncommon",
              color: "green",
              colorHex: "#1EFF00",
              displayName: "Uncommon",
              type: "rarity",
            },
            rare: {
              enum: "rare",
              color: "blue",
              colorHex: "#0070DD",
              displayName: "Rare",
              type: "rarity",
            },
            epic: {
              enum: "epic",
              color: "dark_purple",
              colorHex: "#A335EE",
              displayName: "Epic",
              type: "rarity",
            },
            legendary: {
              enum: "legendary",
              color: "gold",
              colorHex: "#FF8000",
              displayName: "Legendary",
              type: "rarity",
            },
          },
        },
      },
    };

    // Example data for each schema
    const examples = {
      tools: JSON.stringify(

          small_fishing_net: {
            id: "beyond_the_bobber:small_fishing_net",
            type: "net",
            bonus_success: 0.01,

          },
        },
        null,
        2
      ),

      tools_recipes: JSON.stringify(
        {
          small_fishing_net: {
            id: "beyond_the_bobber:small_fishing_net",
            pattern: ["SSS", "S S", "SSS"],
            key: {
              S: "minecraft:string",
            },
            result: {
              item: "beyond_the_bobber:small_fishing_net",
              count: 1,
            },
          },
        },
        null,
        2
      ),

      raw_fish: JSON.stringify(
        {
          raw_shrimp: {
            id: "beyond_the_bobber:raw_shrimp",
            tool: "beyond_the_bobber:small_fishing_net",
            xp: 10,
            rarity: "common",
            biome: ["ocean", "river"],
            food: { hunger: 3, saturation: 0.2 },
            stack_size: 64,
          },
        },
        null,
        2
      ),

      cooked_fish: JSON.stringify(
        {
          cooked_shrimp: {
            id: "beyond_the_bobber:cooked_shrimp",
            source: "beyond_the_bobber:raw_shrimp",
            methods: ["campfire", "furnace", "smoker"],
            xp: 30,
            food: { hunger: 5, saturation: 0.4 },
            effects: [],
          },
        },
        null,
        2
      ),

      dishes: JSON.stringify(
        {
          fish_stew: {
            id: "beyond_the_bobber:fish_stew",
            ingredients: [
              { item: "beyond_the_bobber:cooked_cod", count: 1 },
              { item: "minecraft:carrot", count: 2 },
              { item: "minecraft:potato", count: 1 },
              { item: "minecraft:bowl", count: 1 },
            ],
            method: "crafting",
            station: "crafting_table",
            xp: 150,
            food: { hunger: 12, saturation: 0.9 },
            effects: [{ id: "regeneration", duration: 600, amplifier: 1 }],
            rarity: "rare",
            category: "stew",
          },
        },
        null,
        2
      ),

      rarity: JSON.stringify("common", null, 2),
    };

    // Initialize tabs with examples
    function initializeTabs() {
      for (let schema in examples) {
        document.getElementById(`${schema}-json`).value = examples[schema];
      }
    }

    // Switch to a specific tab
    function switchTab(tabName) {
      // Hide all tab panels
      const panels = document.querySelectorAll(".tab-panel");
      panels.forEach((panel) => panel.classList.remove("active"));

      // Deactivate all tab buttons
      const buttons = document.querySelectorAll(".tab-btn");
      buttons.forEach((btn) => btn.classList.remove("active"));

      // Show selected tab panel
      document.getElementById(`${tabName}-panel`).classList.add("active");

      // Activate selected tab button
      document.querySelector(`[data-tab="${tabName}"]`).classList.add("active");
    }

    // Validate JSON for a specific schema
    async function validateJson(schemaName) {
      const jsonInput = document.getElementById(`${schemaName}-json`);
      const resultCtn = document.getElementById(`${schemaName}-result`);
      const loadingIndicator = document.getElementById(`${schemaName}-loading`);
      const validateBtn = document.querySelector(
        `#${schemaName}-panel .validate-btn`
      );

      const jsonString = jsonInput.value;

      // Show loading indicator
      loadingIndicator.style.display = "block";
      validateBtn.disabled = true;
      validateBtn.textContent = "Validating...";
      resultCtn.style.display = "none";

      try {
        // Parse JSON
        const jsonData = JSON.parse(jsonString);

        // Validate against schema
        const schema = schemas[schemaName];
        const isValid = validateAgainstSchema(jsonData, schema);

        if (isValid) {
          resultCtn.innerHTML = `
            <div style="color:#27ae60; font-weight:bold; margin-bottom:15px;">✅ Valid JSON!</div>
            <p>Your JSON data is valid against the ${schemaName} schema.</p>
          `;
          resultCtn.style.backgroundColor = "#eafaf1";
          resultCtn.style.border = "1px solid #27ae60";
        } else {
          // Get validation errors
          const errors = getValidationErrors(jsonData, schema);

          // Generate AI explanation for errors
          const explanation = await root.generateText({
            instruction: `Explain the following JSON validation errors in simple terms for a mod developer: ${errors.join(
              ". "
            )}.
            Focus on what's wrong and how to fix it. Keep explanations clear and concise.`,
            maxTokens: 300,
          });

          resultCtn.innerHTML = `
            <div style="color:#e74c3c; font-weight:bold; margin-bottom:15px;">❌ Validation Errors</div>
            <div style="margin-bottom:15px; font-style:italic;">AI Explanation:</div>
            <div style="background-color:#fdeaea; padding:10px; border-radius:4px; margin-bottom:15px;">
              ${explanation}
            </div>
            <details>
              <summary style="cursor:pointer; font-weight:bold;">Technical Details</summary>
              <pre style="background-color:#f8f9fa; padding:10px; border-radius:4px; overflow-x:auto; margin-top:10px;">
                ${errors.join("\n")}
              </pre>
            </details>
          `;
          resultCtn.style.backgroundColor = "#fdeaea";
          resultCtn.style.border = "1px solid #e74c3c";
        }

        resultCtn.style.display = "block";
      } catch (error) {
        resultCtn.innerHTML = `
          <div style="color:#e74c3c; font-weight:bold; margin-bottom:15px;">❌ JSON Parsing Error</div>
          <p>${error.message}</p>
          <p>Please check your JSON syntax.</p>
        `;
        resultCtn.style.backgroundColor = "#fdeaea";
        resultCtn.style.border = "1px solid #e74c3c";
        resultCtn.style.display = "block";
      } finally {
        // Hide loading indicator
        loadingIndicator.style.display = "none";
        validateBtn.disabled = false;
        validateBtn.textContent = "Validate JSON";
      }
    }

    // Generate content using AI for a specific schema
    async function generateContent(schemaName) {
      const jsonInput = document.getElementById(`${schemaName}-json`);
      const resultCtn = document.getElementById(`${schemaName}-result`);
      const loadingIndicator = document.getElementById(`${schemaName}-loading`);
      const generateBtn = document.querySelector(
        `#${schemaName}-panel .generate-btn`
      );

      const jsonString = jsonInput.value;
      const schema = schemas[schemaName];

      // Show loading indicator
      loadingIndicator.style.display = "block";
      generateBtn.disabled = true;
      generateBtn.textContent = "Generating...";
      resultCtn.style.display = "none";

      try {
        // Generate content instruction
        const instruction = `Based on the following JSON schema and example data, generate a new example that follows the schema:

        Schema: ${JSON.stringify(schema, null, 2)}

        Example Data: ${jsonString}

        Generate a new, unique example that follows all the rules of the schema. Make it different from the example but still valid.`;

        // Generate content using AI
        const generatedContent = await root.generateText({
          instruction: instruction,
          maxTokens: 1000,
        });

        // Try to parse as JSON
        try {
          const parsedJson = JSON.parse(generatedContent);
          const formattedJson = JSON.stringify(parsedJson, null, 2);

          resultCtn.innerHTML = `
            <div style="color:#2ecc71; font-weight:bold; margin-bottom:15px;">✅ Generated Content</div>
            <p>AI has generated new content based on the ${schemaName} schema.</p>
            <div style="margin-top:15px;">
              <button onclick="document.getElementById('${schemaName}-json').value = \`${formattedJson.replace(
            /`/g,
            "\\`"
          )}\`; document.getElementById('${schemaName}-result').style.display='none';" style="padding:8px 15px; background-color:#3498db; color:white; border:none; border-radius:4px; cursor:pointer;">Use This Content</button>
            </div>
            <details style="margin-top:15px;">
              <summary style="cursor:pointer; font-weight:bold;">Generated JSON</summary>
              <pre style="background-color:#f8f9fa; padding:10px; border-radius:4px; overflow-x:auto; margin-top:10px;">
                ${formattedJson}
              </pre>
            </details>
          `;
        } catch (parseError) {
          // If not JSON, display as text
          resultCtn.innerHTML = `
            <div style="color:#f39c12; font-weight:bold; margin-bottom:15px;">⚠️ Generated Content</div>
            <p>AI has generated content based on the ${schemaName} schema, but it's not valid JSON.</p>
            <div style="background-color:#fef5e7; padding:10px; border-radius:4px; margin-top:10px;">
              <pre style="white-space:pre-wrap;">${generatedContent}</pre>
            </div>
          `;
        }

        resultCtn.style.backgroundColor = "#eafaf1";
        resultCtn.style.border = "1px solid #2ecc71";
        resultCtn.style.display = "block";
      } catch (error) {
        resultCtn.innerHTML = `
          <div style="color:#e74c3c; font-weight:bold; margin-bottom:15px;">❌ Generation Error</div>
          <p>${error.message}</p>
          <p>Unable to generate content at this time.</p>
        `;
        resultCtn.style.backgroundColor = "#fdeaea";
        resultCtn.style.border = "1px solid #e74c3c";
        resultCtn.style.display = "block";
      } finally {
        // Hide loading indicator
        loadingIndicator.style.display = "none";
        generateBtn.disabled = false;
        generateBtn.textContent = "Generate Content";
      }
    }

    function validateAgainstSchema(data, schema) {
      // Simplified validation for demonstration
      // In a real implementation, you would use a proper JSON schema validator
      try {
        if (schema.type === "object" && typeof data !== "object") return false;
        if (schema.enum && !schema.enum.includes(data)) return false;
        // Additional validation checks would go here
        return true;
      } catch (e) {
        return false;
      }
    }

    function getValidationErrors(data, schema) {
      // Simplified error generation for demonstration
      const errors = [];

      if (schema.type === "object" && typeof data !== "object") {
        errors.push(`Expected object but got ${typeof data}`);
      }

      if (schema.enum && !schema.enum.includes(data)) {
        errors.push(`Value must be one of: ${schema.enum.join(", ")}`);
      }

      if (schema.required) {
        for (const field of schema.required) {
          if (!data[field]) {
            errors.push(`Missing required field: ${field}`);
          }
        }
      }

      return errors.length > 0 ? errors : ["Unknown validation error"];
    }

    // Initialize on page load
    window.onload = function () {
      initializeTabs();
    };
  </script>

  <style>

      0% {
        transform: rotate(0deg);

      100% {
        transform: rotate(360deg);
      }
    }

    .tab-panel {
      display: none;
    }

    .tab-panel.active {
      display: block;

    .tab-btn {
      padding: 10px 20px;
      background-color: #ecf0f1;
      border: none;
      cursor: pointer;
      font-size: 16px;
      margin-right: 5px;
      border-bottom: 3px solid transparent;
    }

    .tab-btn:hover {
      background-color: #d5dbdb;
    }

    .tab-btn.active {
      background-color: #3498db;
      color: white;
      border-bottom: 3px solid #2980b9;
    }

    details {
      margin-top: 10px;
    }

    summary::-webkit-details-marker {
      color: #3498db;
    }
  </style>
</div>
