<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>p38ey8gvmg — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<div id="gameContainerEl" style="position:relative; width:100%; height:100vh; background:#5C94FC; overflow:hidden;">
  <!-- Character Selection Screen -->
  <div id="characterSelectEl" style="position:absolute; inset:0; background:linear-gradient(to bottom, #87CEEB, #98FB98); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:10;">
    <h1 style="color:#2A4B7C; text-shadow:2px 2px 4px rgba(0,0,0,0.3); font-family:Arial, sans-serif;">Super Mario 2: AI Edition</h1>
    <p style="color:#2A4B7C; margin:10px 0 30px;">Select Your Character</p>
    <div style="display:flex; gap:20px;">
      <div class="characterCard" onclick="selectCharacter('mario')" style="cursor:pointer; background:white; border-radius:10px; padding:15px; width:120px; text-align:center; box-shadow:0 4px 8px rgba(0,0,0,0.2); transition:transform 0.2s;">
        <img src="https://placehold.co/80x80/FF0000/FFFFFF?text=Mario" style="border-radius:50%; margin-bottom:10px;">
        <h3 style="margin:0; color:#D20000;">Mario</h3>
        <p style="font-size:12px; margin:5px 0;">Balanced</p>
      </div>
      <div class="characterCard" onclick="selectCharacter('luigi')" style="cursor:pointer; background:white; border-radius:10px; padding:15px; width:120px; text-align:center; box-shadow:0 4px 8px rgba(0,0,0,0.2); transition:transform 0.2s;">
        <img src="https://placehold.co/80x80/00FF00/FFFFFF?text=Luigi" style="border-radius:50%; margin-bottom:10px;">
        <h3 style="margin:0; color:#008000;">Luigi</h3>
        <p style="font-size:12px; margin:5px 0;">High Jump</p>
      </div>
      <div class="characterCard" onclick="selectCharacter('toad')" style="cursor:pointer; background:white; border-radius:10px; padding:15px; width:120px; text-align:center; box-shadow:0 4px 8px rgba(0,0,0,0.2); transition:transform 0.2s;">
        <img src="https://placehold.co/80x80/0000FF/FFFFFF?text=Toad" style="border-radius:50%; margin-bottom:10px;">
        <h3 style="margin:0; color:#0055AA;">Toad</h3>
        <p style="font-size:12px; margin:5px 0;">Strong & Fast</p>
      </div>
      <div class="characterCard" onclick="selectCharacter('peach')" style="cursor:pointer; background:white; border-radius:10px; padding:15px; width:120px; text-align:center; box-shadow:0 4px 8px rgba(0,0,0,0.2); transition:transform 0.2s;">
        <img src="https://placehold.co/80x80/FFB6C1/FFFFFF?text=Peach" style="border-radius:50%; margin-bottom:10px;">
        <h3 style="margin:0; color:#FF69B4;">Peach</h3>
        <p style="font-size:12px; margin:5px 0;">Float</p>
      </div>
    </div>
    <button id="startBtn" onclick="startGame()" style="margin-top:30px; padding:12px 30px; background:#FF6B35; color:white; border:none; border-radius:30px; font-size:18px; cursor:pointer; box-shadow:0 4px 8px rgba(0,0,0,0.2);">Start Adventure</button>
  </div>

  <!-- Game HUD -->
  <div id="gameHUDEl" style="position:absolute; top:0; left:0; width:100%; padding:15px; display:none; z-index:5; background:rgba(0,0,0,0.3); color:white; font-family:Arial, sans-serif;">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <div>
        <span>World: <span id="worldEl">1-1</span></span>
        <span style="margin-left:20px;">Score: <span id="scoreEl">0</span></span>
      </div>
      <div>
        <span>Lives: <span id="livesEl">3</span></span>
        <span style="margin-left:20px;">Health: <span id="healthEl">♥♥♥</span></span>
      </div>
    </div>
  </div>

  <!-- Game Canvas -->
  <canvas id="gameCanvasEl" width="800" height="400" style="position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); background:#5C94FC; display:none; border:4px solid #2A4B7C; box-shadow:0 0 20px rgba(0,0,0,0.5);"></canvas>

  <!-- AI Features Panel -->
  <div id="aiPanelEl" style="position:absolute; right:10px; top:80px; width:280px; background:rgba(255,255,255,0.9); border-radius:10px; padding:15px; box-shadow:0 4px 8px rgba(0,0,0,0.2); display:none; z-index:6;">
    <h3 style="margin-top:0; color:#2A4B7C;">AI Features</h3>
    <button onclick="toggleAISettings()" style="background:#4CAF50; color:white; border:none; padding:8px 15px; border-radius:5px; cursor:pointer;">Toggle AI Settings</button>
    
    <div id="aiSettingsEl" style="margin-top:15px; display:none;">
      <div style="margin-bottom:10px;">
        <label>Enemy Difficulty:</label>
        <select id="aiDifficultyEl" style="width:100%; margin-top:5px;">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
          <option value="adaptive">Adaptive (AI)</option>
        </select>
      </div>
      <div style="margin-bottom:10px;">
        <label>Level Design:</label>
        <select id="aiLevelEl" style="width:100%; margin-top:5px;">
          <option value="original">Original</option>
          <option value="procedural">Procedural (AI)</option>
          <option value="dynamic">Dynamic (AI)</option>
        </select>
      </div>
      <div style="margin-bottom:10px;">
        <label>Story Mode:</label>
        <select id="aiStoryEl" style="width:100%; margin-top:5px;">
          <option value="original">Original</option>
          <option value="enhanced">Enhanced (AI)</option>
        </select>
      </div>
      <button onclick="generateLevel()" style="background:#2196F3; color:white; border:none; padding:8px 15px; border-radius:5px; cursor:pointer; margin-top:10px;">Generate New Level</button>
    </div>
    
    <div style="margin-top:20px;">
      <h4 style="margin-bottom:10px;">AI Assistant</h4>
      <textarea id="aiChatEl" style="width:100%; height:80px; border-radius:5px; padding:5px;" placeholder="Ask for game hints or strategies..."></textarea>
      <button onclick="getAIAdvice()" style="background:#9C27B0; color:white; border:none; padding:8px 15px; border-radius:5px; cursor:pointer; margin-top:5px;">Get Advice</button>
      <div id="aiResponseEl" style="margin-top:10px; padding:10px; background:#E1F5FE; border-radius:5px; min-height:40px; font-size:14px;"></div>
    </div>
  </div>

  <!-- Sub-space Effect -->
  <div id="subspaceEl" style="position:absolute; inset:0; background:linear-gradient(45deg, #9C27B0, #673AB7); opacity:0; pointer-events:none; z-index:3; transition:opacity 0.5s;"></div>
  
  <!-- Game Over Screen -->
  <div id="gameOverEl" style="position:absolute; inset:0; background:rgba(0,0,0,0.8); display:none; flex-direction:column; align-items:center; justify-content:center; z-index:10;">
    <h1 style="color:#FF0000; font-size:48px;">GAME OVER</h1>
    <p style="color:white; margin:20px 0;">Final Score: <span id="finalScoreEl">0</span></p>
    <button onclick="restartGame()" style="padding:12px 30px; background:#4CAF50; color:white; border:none; border-radius:30px; font-size:18px; cursor:pointer;">Play Again</button>
  </div>
  
  <!-- Victory Screen -->
  <div id="victoryEl" style="position:absolute; inset:0; background:rgba(0,0,0,0.8); display:none; flex-direction:column; align-items:center; justify-content:center; z-index:10;">
    <h1 style="color:#FFD700; font-size:48px;">VICTORY!</h1>
    <p style="color:white; margin:20px 0;">You saved Subcon!</p>
    <p style="color:white;">Final Score: <span id="victoryScoreEl">0</span></p>
    <button onclick="restartGame()" style="margin-top:20px; padding:12px 30px; background:#4CAF50; color:white; border:none; border-radius:30px; font-size:18px; cursor:pointer;">Play Again</button>
  </div>
</div>

<style>
  .characterCard:hover {
    transform: translateY(-5px);
    box-shadow: 0 6px 12px rgba(0,0,0,0.3);
  }
</style>

<script>
  // Game state
  let gameState = {
    character: null,
    world: 1,
    level: 1,
    score: 0,
    lives: 3,
    health: 3,
    gameRunning: false,
    keys: {},
    enemies: [],
    items: [],
    platforms: [],
    playerPos: {x: 50, y: 300},
    playerVelocity: {x: 0, y: 0},
    isJumping: false,
    hasItem: false,
    currentItem: null,
    subspaceActive: false,
    subspaceTimer: 0,
    aiDifficulty: 'medium',
    aiLevelDesign: 'original',
    aiStoryMode: 'original'
  };
  
  // Character stats
  const characterStats = {
    mario: { speed: 5, jump: 12, strength: 3, floatTime: 0 },
    luigi: { speed: 4, jump: 15, strength: 2, floatTime: 0 },
    toad: { speed: 7, jump: 9, strength: 5, floatTime: 0 },
    peach: { speed: 3, jump: 11, strength: 1, floatTime: 60 }
  };
  
  // Select character
  function selectCharacter(char) {
    gameState.character = char;
    document.querySelectorAll('.characterCard').forEach(card => {
      card.style.border = 'none';
    });
    event.currentTarget.style.border = '3px solid #FFD700';
  }
  
  // Start game
  async function startGame() {
    if (!gameState.character) {
      alert('Please select a character!');
      return;
    }
    
    // Hide character selection
    characterSelectEl.style.display = 'none';
    
    // Show game HUD and canvas
    gameHUDEl.style.display = 'block';
    gameCanvasEl.style.display = 'block';
    aiPanelEl.style.display = 'block';
    
    // Initialize game
    initGame();
    
    // Start game loop
    gameLoop();
  }
  
  // Initialize game
  function initGame() {
    // Reset player position
    gameState.playerPos = {x: 50, y: 300};
    gameState.playerVelocity = {x: 0, y: 0};
    
    // Create initial platforms
    gameState.platforms = [
      {x: 0, y: 350, width: 800, height: 50}, // Ground
      {x: 200, y: 250, width: 150, height: 20},
      {x: 450, y: 200, width: 150, height: 20},
      {x: 650, y: 150, width: 100, height: 20}
    ];
    
    // Create enemies
    gameState.enemies = [
      {x: 300, y: 330, width: 30, height: 30, type: 'shyguy', velocity: {x: 1, y: 0}},
      {x: 500, y: 330, width: 30, height: 30, type: 'shyguy', velocity: {x: -1, y: 0}},
      {x: 700, y: 130, width: 30, height: 30, type: 'snifit', velocity: {x: 0, y: 0}}
    ];
    
    // Create items
    gameState.items = [
      {x: 250, y: 220, width: 20, height: 20, type: 'vegetable'},
      {x: 500, y: 170, width: 20, height: 20, type: 'mushroom'},
      {x: 700, y: 100, width: 20, height: 20, type: 'potion'}
    ];
    
    // Update HUD
    updateHUD();
    
    // Start listening for keys
    document.addEventListener('keydown', (e) => {
      gameState.keys[e.key] = true;
    });
    
    document.addEventListener('keyup', (e) => {
      gameState.keys[e.key] = false;
    });
    
    gameState.gameRunning = true;
  }
  
  // Game loop
  function gameLoop() {
    if (!gameState.gameRunning) return;
    
    update();
    render();
    
    requestAnimationFrame(gameLoop);
  }
  
  // Update game state
  function update() {
    const player = gameState.playerPos;
    const velocity = gameState.playerVelocity;
    const stats = characterStats[gameState.character];
    
    // Player movement
    if (gameState.keys['ArrowRight'] || gameState.keys['d']) {
      velocity.x = stats.speed;
    } else if (gameState.keys['ArrowLeft'] || gameState.keys['a']) {
      velocity.x = -stats.speed;
    } else {
      velocity.x *= 0.8; // Friction
    }
    
    // Jumping
    if ((gameState.keys['ArrowUp'] || gameState.keys['w']) && !gameState.isJumping) {
      velocity.y = -stats.jump;
      gameState.isJumping = true;
    }
    
    // Floating ability (Peach)
    if (gameState.character === 'peach' && gameState.isJumping && stats.floatTime > 0) {
      velocity.y = Math.min(velocity.y, -1);
      stats.floatTime--;
    }
    
    // Gravity
    velocity.y += 0.5;
    
    // Update position
    player.x += velocity.x;
    player.y += velocity.y;
    
    // Platform collision
    gameState.isJumping = true;
    gameState.platforms.forEach(platform => {
      if (
        player.x < platform.x + platform.width &&
        player.x + 30 > platform.x &&
        player.y < platform.y + platform.height &&
        player.y + 30 > platform.y
      ) {
        // Top collision (landing)
        if (velocity.y > 0 && player.y < platform.y) {
          player.y = platform.y - 30;
          velocity.y = 0;
          gameState.isJumping = false;
          
          // Reset float time for Peach
          if (gameState.character === 'peach') {
            stats.floatTime = 60;
          }
        }
      }
    });
    
    // Update enemies
    gameState.enemies.forEach(enemy => {
      enemy.x += enemy.velocity.x;
      
      // Simple AI movement
      if (enemy.type === 'shyguy') {
        // Change direction at platform edges
        let onPlatform = false;
        gameState.platforms.forEach(platform => {
          if (
            enemy.x > platform.x &&
            enemy.x < platform.x + platform.width &&
            enemy.y >= platform.y - 30
          ) {
            onPlatform = true;
          }
        });
        
        if (!onPlatform) {
          enemy.velocity.x *= -1;
        }
      }
      
      // Snifit shooting
      if (enemy.type === 'snifit' && Math.random() < 0.01) {
        // Create projectile
        gameState.items.push({
          x: enemy.x + 15,
          y: enemy.y + 15,
          width: 10,
          height: 10,
          type: 'bullet',
          velocity: {x: player.x > enemy.x ? 3 : -3, y: 0}
        });
      }
    });
    
    // Update items
    gameState.items = gameState.items.filter(item => {
      if (item.type === 'bullet') {
        item.x += item.velocity.x;
        
        // Remove bullets that go off screen
        if (item.x < 0 || item.x > 800) return false;
      }
      return true;
    });
    
    // Check for item collection
    gameState.items = gameState.items.filter(item => {
      if (
        player.x < item.x + item.width &&
        player.x + 30 > item.x &&
        player.y < item.y + item.height &&
        player.y + 30 > item.y
      ) {
        handleItemCollection(item);
        return false;
      }
      return true;
    });
    
    // Check for enemy collision
    gameState.enemies.forEach(enemy => {
      if (
        player.x < enemy.x + enemy.width &&
        player.x + 30 > enemy.x &&
        player.y < enemy.y + enemy.height &&
        player.y + 30 > enemy.y
      ) {
        // If player has an item, throw it at enemy
        if (gameState.hasItem && gameState.keys[' ']) {
          // Remove enemy
          gameState.enemies = gameState.enemies.filter(e => e !== enemy);
          gameState.score += 100;
          updateHUD();
          
          // Drop heart occasionally
          if (Math.random() < 0.3) {
            gameState.items.push({
              x: enemy.x,
              y: enemy.y,
              width: 20,
              height: 20,
              type: 'heart'
            });
          }
        } else {
          // Player takes damage
          gameState.health--;
          updateHUD();
          
          // Knockback
          velocity.x = player.x < enemy.x ? -5 : 5;
          velocity.y = -5;
          
          if (gameState.health <= 0) {
            loseLife();
          }
        }
      }
    });
    
    // Subspace timer
    if (gameState.subspaceActive) {
      gameState.subspaceTimer--;
      if (gameState.subspaceTimer <= 0) {
        gameState.subspaceActive = false;
        subspaceEl.style.opacity = 0;
      }
    }
    
    // Check for level completion
    if (player.x > 750) {
      nextLevel();
    }
    
    // Check for falling off screen
    if (player.y > 400) {
      loseLife();
    }
  }
  
  // Render game
  function render() {
    const canvas = gameCanvasEl;
    const ctx = canvas.getContext('2d');
    
    // Clear canvas
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Draw background
    ctx.fillStyle = '#5C94FC';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Draw clouds
    ctx.fillStyle = 'white';
    ctx.beginPath();
    ctx.arc(100, 80, 20, 0, Math.PI * 2);
    ctx.arc(130, 70, 25, 0, Math.PI * 2);
    ctx.arc(160, 80, 20, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.beginPath();
    ctx.arc(500, 60, 20, 0, Math.PI * 2);
    ctx.arc(530, 50, 25, 0, Math.PI * 2);
    ctx.arc(560, 60, 20, 0, Math.PI * 2);
    ctx.fill();
    
    // Draw platforms
    ctx.fillStyle = '#8B4513';
    gameState.platforms.forEach(platform => {
      ctx.fillRect(platform.x, platform.y, platform.width, platform.height);
      
      // Add grass on top
      ctx.fillStyle = '#228B22';
      ctx.fillRect(platform.x, platform.y, platform.width, 5);
      ctx.fillStyle = '#8B4513';
    });
    
    // Draw items
    gameState.items.forEach(item => {
      if (item.type === 'vegetable') {
        ctx.fillStyle = '#FF6347';
        ctx.fillRect(item.x, item.y, item.width, item.height);
      } else if (item.type === 'mushroom') {
        ctx.fillStyle = '#8A2BE2';
        ctx.beginPath();
        ctx.arc(item.x + item.width/2, item.y + item.height/2, item.width/2, 0, Math.PI * 2);
        ctx.fill();
      } else if (item.type === 'potion') {
        ctx.fillStyle = '#FF00FF';
        ctx.fillRect(item.x, item.y, item.width, item.height);
      } else if (item.type === 'heart') {
        ctx.fillStyle = '#FF1493';
        ctx.beginPath();
        ctx.arc(item.x + 5, item.y + 5, 5, 0, Math.PI * 2);
        ctx.arc(item.x + 15, item.y + 5, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(item.x, item.y + 10);
        ctx.lineTo(item.x + 20, item.y + 10);
        ctx.lineTo(item.x + 10, item.y + 20);
        ctx.closePath();
        ctx.fill();
      } else if (item.type === 'bullet') {
        ctx.fillStyle = 'black';
        ctx.beginPath();
        ctx.arc(item.x + item.width/2, item.y + item.height/2, item.width/2, 0, Math.PI * 2);
        ctx.fill();
      }
    });
    
    // Draw enemies
    gameState.enemies.forEach(enemy => {
      if (enemy.type === 'shyguy') {
        ctx.fillStyle = '#FF0000';
        ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
        
        // Eyes
        ctx.fillStyle = 'white';
        ctx.fillRect(enemy.x + 5, enemy.y + 10, 5, 5);
        ctx.fillRect(enemy.x + 20, enemy.y + 10, 5, 5);
      } else if (enemy.type === 'snifit') {
        ctx.fillStyle = '#000000';
        ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
        
        // Mask
        ctx.fillStyle = 'gray';
        ctx.fillRect(enemy.x + 5, enemy.y + 10, 20, 10);
        
        // Nozzle
        ctx.fillStyle = 'black';
        ctx.fillRect(enemy.x + 25, enemy.y + 13, 5, 4);
      }
    });
    
    // Draw player
    const player = gameState.playerPos;
    if (gameState.character === 'mario') {
      ctx.fillStyle = '#FF0000';
    } else if (gameState.character === 'luigi') {
      ctx.fillStyle = '#00FF00';
    } else if (gameState.character === 'toad') {
      ctx.fillStyle = '#0000FF';
    } else if (gameState.character === 'peach') {
      ctx.fillStyle = '#FFB6C1';
    }
    
    ctx.fillRect(player.x, player.y, 30, 30);
    
    // Draw face details
    ctx.fillStyle = 'white';
    ctx.fillRect(player.x + 5, player.y + 5, 5, 5);
    ctx.fillRect(player.x + 20, player.y + 5, 5, 5);
    
    // Draw held item
    if (gameState.hasItem && gameState.currentItem) {
      const item = gameState.currentItem;
      if (item.type === 'vegetable') {
        ctx.fillStyle = '#FF6347';
        ctx.fillRect(player.x + 15, player.y - 10, 15, 15);
      } else if (item.type === 'mushroom') {
        ctx.fillStyle = '#8A2BE2';
        ctx.beginPath();
        ctx.arc(player.x + 22, player.y - 2, 8, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }
  
  // Handle item collection
  function handleItemCollection(item) {
    if (item.type === 'vegetable' || item.type === 'mushroom') {
      gameState.hasItem = true;
      gameState.currentItem = item;
    } else if (item.type === 'potion') {
      activateSubspace();
    } else if (item.type === 'heart') {
      gameState.health = Math.min(gameState.health + 1, 3);
      updateHUD();
    }
    
    gameState.score += 50;
    updateHUD();
  }
  
  // Activate subspace
  function activateSubspace() {
    gameState.subspaceActive = true;
    gameState.subspaceTimer = 300; // 5 seconds at 60fps
    subspaceEl.style.opacity = 0.5;
    
    // Generate coins in subspace
    for (let i = 0; i < 5; i++) {
      gameState.items.push({
        x: Math.random() * 700 + 50,
        y: Math.random() * 200 + 100,
        width: 15,
        height: 15,
        type: 'coin'
      });
    }
  }
  
  // Update HUD
  function updateHUD() {
    worldEl.textContent = `${gameState.world}-${gameState.level}`;
    scoreEl.textContent = gameState.score;
    livesEl.textContent = gameState.lives;
    
    let hearts = '';
    for (let i = 0; i < gameState.health; i++) {
      hearts += '♥';
    }
    healthEl.textContent = hearts;
  }
  
  // Lose life
  function loseLife() {
    gameState.lives--;
    updateHUD();
    
    if (gameState.lives <= 0) {
      gameOver();
    } else {
      // Reset player position
      gameState.playerPos = {x: 50, y: 300};
      gameState.playerVelocity = {x: 0, y: 0};
      gameState.health = 3;
      updateHUD();
    }
  }
  
  // Game over
  function gameOver() {
    gameState.gameRunning = false;
    finalScoreEl.textContent = gameState.score;
    gameOverEl.style.display = 'flex';
  }
  
  // Victory
  function victory() {
    gameState.gameRunning = false;
    victoryScoreEl.textContent = gameState.score;
    victoryEl.style.display = 'flex';
  }
  
  // Next level
  function nextLevel() {
    gameState.level++;
    if (gameState.level > 3) {
      gameState.world++;
      gameState.level = 1;
      
      if (gameState.world > 7) {
        victory();
        return;
      }
    }
    
    // Reset player position
    gameState.playerPos = {x: 50, y: 300};
    gameState.playerVelocity = {x: 0, y: 0};
    gameState.hasItem = false;
    gameState.currentItem = null;
    
    // Generate new level
    generateLevel();
    
    updateHUD();
  }
  
  // Restart game
  function restartGame() {
    // Reset game state
    gameState = {
      character: gameState.character,
      world: 1,
      level: 1,
      score: 0,
      lives: 3,
      health: 3,
      gameRunning: false,
      keys: {},
      enemies: [],
      items: [],
      platforms: [],
      playerPos: {x: 50, y: 300},
      playerVelocity: {x: 0, y: 0},
      isJumping: false,
      hasItem: false,
      currentItem: null,
      subspaceActive: false,
      subspaceTimer: 0,
      aiDifficulty: 'medium',
      aiLevelDesign: 'original',
      aiStoryMode: 'original'
    };
    
    // Hide game over/victory screens
    gameOverEl.style.display = 'none';
    victoryEl.style.display = 'none';
    
    // Show character selection
    characterSelectEl.style.display = 'flex';
    gameHUDEl.style.display = 'none';
    gameCanvasEl.style.display = 'none';
    aiPanelEl.style.display = 'none';
  }
  
  // Toggle AI settings
  function toggleAISettings() {
    aiSettingsEl.style.display = aiSettingsEl.style.display === 'none' ? 'block' : 'none';
  }
  
  // Generate level using AI
  async function generateLevel() {
    if (gameState.aiLevelDesign === 'procedural' || gameState.aiLevelDesign === 'dynamic') {
      // Show loading
      aiResponseEl.innerHTML = '⏳ Generating level...';
      
      // Generate level description
      const levelDesc = await root.generateText({
        instruction: `Generate a unique level description for Super Mario Bros 2 with AI features. The level should be in World ${gameState.world} and have ${gameState.aiLevelDesign} design. Include platforms, enemies, and items.`,
        maxTokens: 150
      });
      
      // Apply generated level (simplified for demo)
      aiResponseEl.innerHTML = `<strong>Generated Level:</strong> ${levelDesc}`;
      
      // In a real implementation, we would parse this description and generate the level
      // For now, we'll just add some random platforms
      gameState.platforms = [
        {x: 0, y: 350, width: 800, height: 50} // Ground
      ];
      
      for (let i = 0; i < 5; i++) {
        gameState.platforms.push({
          x: Math.random() * 600 + 100,
          y: Math.random() * 150 + 150,
          width: Math.random() * 100 + 50,
          height: 20
        });
      }
    }
  }
  
  // Get AI advice
  async function getAIAdvice() {
    const question = aiChatEl.value;
    if (!question.trim()) return;
    
    // Show loading
    aiResponseEl.innerHTML = '⏳ Thinking...';
    
    // Generate AI response
    const response = await root.generateText({
      instruction: `You are an AI assistant for Super Mario Bros 2 with AI features. The player is playing as ${gameState.character} in World ${gameState.world}-${gameState.level}. Their current health is ${gameState.health}/3 and they have ${gameState.lives} lives left. Provide helpful advice for their question: "${question}"`,
      maxTokens: 100
    });
    
    aiResponseEl.innerHTML = response;
  }
</script>
</body>
</html>
