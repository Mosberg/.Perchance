<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>ai-anime-character-generator — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<div id="appCtn" style="max-width:1200px; margin:0 auto; padding:20px;">
  <h1 style="font-size:42px; margin-bottom:8px; background:linear-gradient(135deg,#e879f9,#38bdf8); -webkit-background-clip:text; color:transparent;">AI Anime Character Generator</h1>
  <p style="color:#94a3b8; margin-bottom:24px;">Create unique anime characters with AI-generated descriptions, personalities, roleplay examples, and artwork.</p>

  <div id="controlsCtn" style="margin-bottom:24px;">
    <select id="themeSelect" style="font-size:16px; padding:10px 16px; border-radius:8px; border:1px solid rgba(255,255,255,0.2); background:rgba(0,0,0,0.4); color:white; margin:4px;">
      <option>Random Theme</option>
      <option>Fantasy</option>
      <option>Cyberpunk</option>
      <option>School Life</option>
      <option>Sci-Fi</option>
      <option>Medieval</option>
      <option>Steampunk</option>
      <option>Magical</option>
      <option>Post-Apocalyptic</option>
      <option>Horror</option>
    </select>
    <select id="genderSelect" style="font-size:16px; padding:10px 16px; border-radius:8px; border:1px solid rgba(255,255,255,0.2); background:rgba(0,0,0,0.4); color:white; margin:4px;">
      <option>Random Gender</option>
      <option>Female</option>
      <option>Male</option>
      <option>Non-binary</option>
    </select>
    <button id="generateBtn" onclick="generateCharacter()" style="font-size:16px; padding:10px 28px; border-radius:8px; border:none; background:linear-gradient(135deg,#c026d3,#7c3aed); color:white; font-weight:bold; cursor:pointer; margin:4px;">✨ Generate Character</button>
  </div>

  <div id="loadingEl" hidden style="margin:40px auto;">
    <div style="font-size:20px; color:#e879f9; animation:pulse 2s infinite;">Generating your character...</div>
    <div id="loadingSubEl" style="color:#94a3b8; margin-top:8px;"></div>
  </div>

  <div id="resultCtn" hidden>
    <h2 id="nameEl" style="font-size:32px; margin-bottom:20px; color:#f0abfc;"></h2>

    <div style="display:flex; gap:24px; justify-content:center; flex-wrap:wrap; margin-bottom:30px;">
      <div>
        <div style="font-weight:bold; color:#e879f9; margin-bottom:8px;">AI Avatar</div>
        <img id="avatarEl" style="width:256px; height:256px; border-radius:16px; object-fit:cover; border:2px solid rgba(232,121,249,0.3); box-shadow:0 8px 32px rgba(0,0,0,0.4);">
      </div>
      <div>
        <div style="font-weight:bold; color:#38bdf8; margin-bottom:8px;">Character Illustration</div>
        <img id="artEl" style="width:384px; height:512px; border-radius:16px; object-fit:cover; border:2px solid rgba(56,189,248,0.3); box-shadow:0 8px 32px rgba(0,0,0,0.4);">
      </div>
    </div>

    <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:20px; max-width:1000px; margin:0 auto; text-align:left;">
      <div style="background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:16px; padding:24px; backdrop-filter:blur(10px);">
        <h3 style="color:#e879f9; margin-top:0; font-size:18px;">👁️ Visual Description</h3>
        <p id="visualEl" style="color:#e2e8f0; white-space:pre-wrap; line-height:1.6; margin:0;"></p>
      </div>

      <div style="background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:16px; padding:24px; backdrop-filter:blur(10px);">
        <h3 style="color:#38bdf8; margin-top:0; font-size:18px;">🧠 Personality</h3>
        <p id="personalityEl" style="color:#e2e8f0; white-space:pre-wrap; line-height:1.6; margin:0;"></p>
      </div>

      <div style="background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:16px; padding:24px; backdrop-filter:blur(10px); grid-column:1 / -1;">
        <h3 style="color:#f472b6; margin-top:0; font-size:18px;">💬 Example Roleplay Behavior</h3>
        <p id="roleplayEl" style="color:#e2e8f0; white-space:pre-wrap; line-height:1.6; margin:0; font-style:italic;"></p>
      </div>
    </div>
  </div>
</div>

<style>
  body { margin:0; padding:0; font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif; background:linear-gradient(135deg,#0f172a 0%,#1e1b4b 40%,#312e81 100%); color:white; min-height:100vh; }
  button:hover:not(:disabled) { transform:translateY(-2px); filter:brightness(1.1); }
  button:active:not(:disabled) { transform:translateY(0); }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
  select { cursor:pointer; }
</style>

<script>
  function cleanPrompt(str) {
    return (str || "").replace(/[\r\n]+/g, " ").trim() || "anime character";
  }

  function extractField(label, text) {
    let r = new RegExp(label + ":\\s*([\\s\\S]*?)(?=\\n[A-Z]+:|$)", "i");
    return text.match(r)?.[1]?.trim() || "";
  }

  async function generateCharacter() {
    generateBtn.disabled = true;
    resultCtn.hidden = true;
    loadingEl.hidden = false;
    loadingSubEl.textContent = "Dreaming up character concept...";

    try {
      let theme = themeSelect.value === "Random Theme" ? "random" : themeSelect.value;
      let gender = genderSelect.value === "Random Gender" ? "random" : genderSelect.value;

      let prompt = `Create a unique anime OC.
Theme/Setting: ${theme}
Gender: ${gender}

Return EXACTLY in this format:
NAME: [creative anime-style name]
VISUAL: [detailed visual description of hair, eyes, clothing, colors, accessories]
PERSONALITY: [detailed personality description, demeanor, quirks]
ROLEPLAY: [a short 3-5 line in-character dialogue example]`;

      let rawText = await generateText(prompt);

      let name = extractField("NAME", rawText) || "Unknown Character";
      let visual = extractField("VISUAL", rawText) || "A mysterious anime character.";
      let personality = extractField("PERSONALITY", rawText) || "Complex and intriguing.";
      let roleplay = extractField("ROLEPLAY", rawText) || "No roleplay sample generated.";

      nameEl.textContent = name;
      visualEl.textContent = visual;
      personalityEl.textContent = personality;
      roleplayEl.textContent = roleplay;

      // Build safe single-line image prompts
      let vis = cleanPrompt(visual);
      let avatarPrompt = `Anime portrait, close-up, ${vis}, ${theme} style, detailed anime art, vibrant colors, soft lighting`.slice(0, 400);
      let artPrompt = `Anime illustration, ${vis}, ${theme} style, full body, detailed anime art, beautiful background`.slice(0, 400);

      // Generate images sequentially to avoid fetch conflicts
      loadingSubEl.textContent = "Painting character portrait (1/2)...";
      let avatarData = await generateImage(avatarPrompt, {resolution: "512x512"});

      loadingSubEl.textContent = "Painting full illustration (2/2)...";
      let artData = await generateImage(artPrompt, {resolution: "512x768"});

      avatarEl.src = avatarData;
      artEl.src = artData;

      loadingEl.hidden = true;
      resultCtn.hidden = false;
    } catch (err) {
      console.error(err);
      loadingSubEl.textContent = "Something went wrong: " + (err.message || "Generation failed. Please try again!");
    } finally {
      generateBtn.disabled = false;
    }
  }
</script>
</body>
</html>
