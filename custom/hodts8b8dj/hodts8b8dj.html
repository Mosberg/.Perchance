<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>hodts8b8dj — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<!--
Perchance.org Editor (Enhanced, Mobile-Friendly, Feature-Rich)
- Default code initialized via JS to avoid HTML parsing conflicts with the host environment.
-->

<style>
  :root {
    --bg-main: #ffffff;
    --bg-header: #2c3e50;
    --bg-subtle: #ecf0f1;
    --bg-subtle-alt: #f9f9f9;
    --border-color: #d0d7de;
    --text-main: #2c3e50;
    --text-muted: #6b7280;
    --accent: #27ae60;
    --accent-soft: #e8f7ef;
    --danger: #e74c3c;
    --danger-soft: #ffecec;
    --editor-font-size: 14px;
  }

  .theme-dark {
    --bg-main: #0b1120;
    --bg-header: #020617;
    --bg-subtle: #020617;
    --bg-subtle-alt: #020617;
    --border-color: #1f2937;
    --text-main: #e5e7eb;
    --text-muted: #9ca3af;
    --accent: #22c55e;
    --accent-soft: #052e16;
    --danger: #f97373;
    --danger-soft: #451010;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 0;
  }

  #appCtn {
    display: flex;
    height: 100vh;
    flex-direction: column;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg-main);
    color: var(--text-main);
  }

  .app-header {
    padding: 0 16px;
    height: 56px;
    background: var(--bg-header);
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .app-header-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .app-title {
    font-weight: 700;
    font-size: 1.05rem;
    letter-spacing: 0.02em;
  }

  .badge {
    font-size: 0.7rem;
    padding: 2px 6px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.12);
    text-transform: uppercase;
  }

  .btn {
    border: none;
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background 0.15s ease, transform 0.05s ease, box-shadow 0.15s ease;
    white-space: nowrap;
  }

  .btn-primary {
    background: var(--accent);
    color: #ffffff;
    box-shadow: 0 0 0 1px rgba(15, 118, 110, 0.2), 0 8px 18px rgba(16, 185, 129, 0.35);
  }

  .btn-primary:hover {
    background: #1f9a52;
    transform: translateY(-1px);
  }

  .btn-ghost {
    background: transparent;
    color: inherit;
  }

  .btn-ghost:hover {
    background: rgba(148, 163, 184, 0.18);
  }

  .btn-sm {
    padding: 4px 8px;
    font-size: 0.8rem;
  }

  .btn-icon {
    width: 28px;
    height: 28px;
    padding: 0;
    border-radius: 999px;
    justify-content: center;
  }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 12px;
    background: var(--bg-subtle);
    border-bottom: 1px solid var(--border-color);
    font-size: 0.8rem;
    color: var(--text-muted);
    flex-wrap: wrap;
  }

  .toolbar-group {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding-right: 10px;
    border-right: 1px solid rgba(148, 163, 184, 0.4);
  }

  .toolbar-group:last-child {
    border-right: none;
    padding-right: 0;
  }

  .toolbar-label {
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-size: 0.7rem;
  }

  .toolbar-select,
  .toolbar-input {
    border-radius: 4px;
    border: 1px solid var(--border-color);
    background: var(--bg-main);
    color: var(--text-main);
    padding: 3px 6px;
    font-size: 0.8rem;
  }

  .toolbar-input {
    width: 52px;
    text-align: center;
  }

  .toolbar-kbd {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    font-size: 0.7rem;
    padding: 2px 4px;
    border-radius: 4px;
    border: 1px solid rgba(148, 163, 184, 0.7);
    background: rgba(15, 23, 42, 0.04);
  }

  .main-layout {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  .pane {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 260px;
  }

  .pane-header {
    padding: 6px 14px;
    background: var(--bg-subtle-alt);
    border-bottom: 1px solid var(--border-color);
    font-size: 0.8rem;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .pane-title {
    font-weight: 700;
    letter-spacing: 0.06em;
  }

  .pane-sub {
    font-size: 0.7rem;
    opacity: 0.8;
  }

  #editorEl {
    flex: 1;
    border: none;
    resize: none;
    padding: 14px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    font-size: var(--editor-font-size);
    line-height: 1.6;
    outline: none;
    color: var(--text-main);
    background: var(--bg-main);
  }

  #outputEl {
    flex: 1;
    padding: 18px 18px 10px 18px;
    font-size: 1.05rem;
    line-height: 1.6;
    color: var(--text-main);
    overflow-y: auto;
  }

  .output-meta {
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .output-item {
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    background: var(--bg-main);
    margin-bottom: 10px;
  }

  .output-index {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 4px;
  }

  .output-text {
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .output-empty {
    font-size: 0.9rem;
    color: var(--text-muted);
    padding: 10px 0;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .error-inline {
    color: var(--danger);
    background: var(--danger-soft);
    padding: 0 2px;
    border-radius: 2px;
  }

  .error-banner {
    padding: 6px 10px;
    border-radius: 6px;
    background: var(--danger-soft);
    color: var(--danger);
    font-size: 0.8rem;
    margin-bottom: 8px;
  }

  .layout-stacked .main-layout {
    flex-direction: column;
  }

  .layout-stacked .pane {
    min-height: 40vh;
  }

  @media (max-width: 768px) {
    #appCtn {
      height: 100vh;
    }

    .app-header {
      padding: 0 10px;
      height: 52px;
    }

    .app-title {
      font-size: 0.95rem;
    }

    .toolbar {
      padding: 6px 8px;
      gap: 6px;
    }

    .toolbar-group {
      border-right: none;
      padding-right: 0;
    }

    .main-layout {
      flex-direction: column;
    }

    .pane {
      min-height: 45vh;
    }

    #outputEl {
      font-size: 1rem;
    }
  }
</style>

<div id="appCtn" class="layout-split">
  <header class="app-header">
    <div class="app-header-left">
      <span class="app-title">Perchance Editor</span>
      <span class="badge">Local Sandbox</span>
    </div>
    <div style="display:flex; align-items:center; gap:6px;">
      <button id="copyLastBtn" class="btn btn-ghost btn-sm" type="button" title="Copy last result">
        ⧉ Copy
      </button>
      <button id="generateBtn" class="btn btn-primary" type="button">
        ▶ Generate
      </button>
    </div>
  </header>

  <div class="toolbar">
    <div class="toolbar-group">
      <span class="toolbar-label">Theme</span>
      <select id="themeSelect" class="toolbar-select">
        <option value="system">System</option>
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
    </div>

    <div class="toolbar-group">
      <span class="toolbar-label">Layout</span>
      <select id="layoutSelect" class="toolbar-select">
        <option value="split">Side by side</option>
        <option value="stacked">Stacked</option>
      </select>
    </div>

    <div class="toolbar-group">
      <span class="toolbar-label">Editor</span>
      <button id="fontDecBtn" class="btn btn-ghost btn-sm btn-icon" type="button" title="Smaller font">−</button>
      <button id="fontIncBtn" class="btn btn-ghost btn-sm btn-icon" type="button" title="Larger font">+</button>
      <span id="fontSizeLabel" style="font-size:0.75rem; min-width:40px; text-align:center;">14px</span>
    </div>

    <div class="toolbar-group">
      <span class="toolbar-label">Results</span>
      <input id="resultsCountInput" class="toolbar-input" type="number" min="1" max="10" value="1" />
      <span style="font-size:0.7rem;">× per generate</span>
    </div>

    <div class="toolbar-group">
      <span class="toolbar-label">Shortcuts</span>
      <span class="toolbar-kbd">Ctrl</span> + <span class="toolbar-kbd">Enter</span>
    </div>
  </div>

  <div class="main-layout">
    <!-- Editor Pane -->
    <div class="pane" style="border-right:1px solid var(--border-color);">
      <div class="pane-header">
        <div>
          <span class="pane-title">CODE EDITOR</span>
          <span class="pane-sub">Perchance-style lists & output template</span>
        </div>
        <button id="resetCodeBtn" class="btn btn-ghost btn-sm" type="button">Reset</button>
      </div>
      <textarea id="editorEl" spellcheck="false"></textarea>
    </div>

    <!-- Preview Pane -->
    <div class="pane">
      <div class="pane-header">
        <div>
          <span class="pane-title">PREVIEW</span>
          <span class="pane-sub">Live generated output</span>
        </div>
        <button id="clearOutputBtn" class="btn btn-ghost btn-sm" type="button">Clear</button>
      </div>
      <div id="outputEl"></div>
    </div>
  </div>
</div>

<script>
  (function () {
    var editorEl = document.getElementById("editorEl");
    var outputEl = document.getElementById("outputEl");
    var generateBtn = document.getElementById("generateBtn");
    var copyLastBtn = document.getElementById("copyLastBtn");
    var resetCodeBtn = document.getElementById("resetCodeBtn");
    var clearOutputBtn = document.getElementById("clearOutputBtn");
    var themeSelect = document.getElementById("themeSelect");
    var layoutSelect = document.getElementById("layoutSelect");
    var fontIncBtn = document.getElementById("fontIncBtn");
    var fontDecBtn = document.getElementById("fontDecBtn");
    var fontSizeLabel = document.getElementById("fontSizeLabel");
    var resultsCountInput = document.getElementById("resultsCountInput");
    var appCtn = document.getElementById("appCtn");

    var lastResultText = "";
    var editorFontSize = 14;

    function applyFontSize() {
      editorEl.style.fontSize = editorFontSize + "px";
      fontSizeLabel.textContent = editorFontSize + "px";
    }

    function applyLayout(layout) {
      if (layout === "stacked") {
        appCtn.classList.add("layout-stacked");
        appCtn.classList.remove("layout-split");
      } else {
        appCtn.classList.add("layout-split");
        appCtn.classList.remove("layout-stacked");
      }
    }

    function getSystemPrefersDark() {
      try {
        return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      } catch (e) {
        return false;
      }
    }

    function applyTheme(theme) {
      var isDark = theme === "dark" || (theme === "system" && getSystemPrefersDark());
      if (isDark) {
        appCtn.classList.add("theme-dark");
      } else {
        appCtn.classList.remove("theme-dark");
      }
    }

    function parseCode(code) {
      var lists = {};
      var outputTemplate = "";
      var blocks = code.split(/\n\s*\n/);

      blocks.forEach(function (block) {
        var trimmed = block.trim();
        if (!trimmed) return;

        var lines = trimmed.split("\n");
        if (lines.length === 0) return;

        var firstLine = lines[0].trim();

        if (firstLine.indexOf("output") === 0) {
          outputTemplate = lines.join("\n").replace(/^output\s*=\s*/, "");
        } else if (firstLine.charAt(0) === "[" && firstLine.charAt(firstLine.length - 1) === "]") {
          var listName = firstLine.slice(1, -1);
          var items = [];
          for (var i = 1; i < lines.length; i++) {
            var l = lines[i].trim();
            if (l.length > 0) items.push(l);
          }
          if (items.length > 0) {
            lists[listName] = items;
          }
        }
      });

      return {
        lists: lists,
        outputTemplate: outputTemplate
      };
    }

    function resolveTemplate(str, lists, missingNames) {
      return str.replace(/\[([^\]]+)\]/g, function (match, listName) {
        if (!lists[listName]) {
          if (missingNames.indexOf(listName) === -1) {
            missingNames.push(listName);
          }
          return '<span class="error-inline">[?' + listName + "]</span>";
        }
        var arr = lists[listName];
        var item = arr[Math.floor(Math.random() * arr.length)];
        return resolveTemplate(item, lists, missingNames);
      });
    }

    function generate() {
      var code = editorEl.value || "";
      var parsed = parseCode(code);
      var lists = parsed.lists;
      var outputTemplate = parsed.outputTemplate;

      if (!outputTemplate) {
        outputEl.innerHTML =
          '<div class="error-banner">No <strong>output = ...</strong> definition found. Add a line like <strong>output = Your template here</strong>.</div>';
        lastResultText = "";
        return;
      }

      var count = parseInt(resultsCountInput.value, 10);
      if (isNaN(count) || count < 1) count = 1;
      if (count > 10) count = 10;
      resultsCountInput.value = count;

      var html = "";
      var missingNamesGlobal = [];

      html += '<div class="output-meta">';
      html += '<div><span class="chip">Generated</span></div>';
      html +=
        '<div>Lists: ' +
        Object.keys(lists).length +
        " · Results: " +
        count +
        "</div>";
      html += "</div>";

      for (var i = 0; i < count; i++) {
        var missingNames = [];
        var result = resolveTemplate(outputTemplate, lists, missingNames);
        html += '<div class="output-item">';
        if (count > 1) {
          html += '<div class="output-index">Result ' + (i + 1) + "</div>";
        }
        html += '<div class="output-text">' + result + "</div>";
        html += "</div>";

        missingNames.forEach(function (name) {
          if (missingNamesGlobal.indexOf(name) === -1) {
            missingNamesGlobal.push(name);
          }
        });

        if (i === 0) {
          // store plain text version of first result (strip tags)
          var tmp = document.createElement("div");
          tmp.innerHTML = result;
          lastResultText = tmp.textContent || tmp.innerText || "";
        }
      }

      if (missingNamesGlobal.length > 0) {
        html =
          '<div class="error-banner">Missing list definitions for: <strong>' +
          missingNamesGlobal.join(", ") +
          "</strong></div>" + html;
      }

      outputEl.innerHTML = html;
    }

    function copyLastResult() {
      if (!lastResultText) return;
      try {
        navigator.clipboard.writeText(lastResultText);
      } catch (e) {
        // Fallback: select text in a temporary textarea
        var temp = document.createElement("textarea");
        temp.value = lastResultText;
        temp.style.position = "fixed";
        temp.style.opacity = "0";
        document.body.appendChild(temp);
        temp.select();
        try {
          document.execCommand("copy");
        } catch (e2) {}
        document.body.removeChild(temp);
      }
    }

    function clearOutput() {
      outputEl.innerHTML =
        '<div class="output-empty">No output yet. Click <strong>Generate</strong> or press <span class="toolbar-kbd">Ctrl</span> + <span class="toolbar-kbd">Enter</span>.</div>';
      lastResultText = "";
    }

    function resetCode() {
      var defaultCode =
        "[adjective]\n" +
        "Crimson\n" +
        "Dark\n" +
        "Mysterious\n" +
        "Ancient\n" +
        "Glowing\n" +
        "\n" +
        "[noun]\n" +
        "Sword\n" +
        "Amulet\n" +
        "Scroll\n" +
        "Dagger\n" +
        "Gauntlet\n" +
        "\n" +
        "[location]\n" +
        "Forest\n" +
        "Dungeon\n" +
        "Castle\n" +
        "Volcano\n" +
        "Swamp\n" +
        "\n" +
        "[creature]\n" +
        "Dragon\n" +
        "Goblin\n" +
        "Spirit\n" +
        "Golem\n" +
        "Wraith\n" +
        "\n" +
        "output = In the [location], you found a [adjective] [noun] guarded by a [creature].";

      editorEl.value = defaultCode;
      generate();
    }

    // Event wiring
    generateBtn.onclick = generate;
    copyLastBtn.onclick = copyLastResult;
    clearOutputBtn.onclick = clearOutput;
    resetCodeBtn.onclick = resetCode;

    themeSelect.onchange = function () {
      applyTheme(themeSelect.value);
    };

    layoutSelect.onchange = function () {
      applyLayout(layoutSelect.value);
    };

    fontIncBtn.onclick = function () {
      if (editorFontSize < 24) {
        editorFontSize++;
        applyFontSize();
      }
    };

    fontDecBtn.onclick = function () {
      if (editorFontSize > 10) {
        editorFontSize--;
        applyFontSize();
      }
    };

    editorEl.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        generate();
      }
    });

    // Initial setup on load
    window.onload = function () {
      // Default code only if empty
      if (!editorEl.value) {
        resetCode();
      } else {
        generate();
      }

      // Theme & layout defaults
      themeSelect.value = "system";
      applyTheme("system");
      layoutSelect.value = "split";
      applyLayout("split");
      applyFontSize();
      clearOutput();
      generate();
    };
  })();
</script>
</body>
</html>
