<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>tahh-1 — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<!--
Features:
  [x] Prompt Engineering (Text-to-Text Generation, Random, Enhancer)
  [x] Image Generation (Text-to-Image, 1-12 batch, Seeds, Steps, Guidance)
  [x] Scratchpad (Tabs, Saving)
  [x] Gallery (Search, Filter, Folders, Metadata, Persistent via KV)
  [x] UI/UX (Dark theme, Responsive, Inline styles for simplicity)
  
Note: Since this is a client-side demo using sandboxed globals (generateImage, generateText, kv), 
actual 'adult' content generation depends on the safety filters of the underlying AI models provided by the platform.
The code implements the requested functionality structure.
-->

<style>
  :root { --bg: #0f0f13; --panel: #1a1a20; --accent: #ff0055; --accent-2: #00e5ff; --text: #e0e0e0; --text-dim: #888; --border: #333; }
  body { background:var(--bg); color:var(--text); font-family:sans-serif; margin:0; display:flex; height:100vh; overflow:hidden; }
  input, select, textarea, button { background:var(--panel); border:1px solid var(--border); color:var(--text); padding:8px; margin:4px; border-radius:4px; font-family:inherit; }
  button { background:var(--panel); cursor:pointer; transition:0.2s; }
  button:hover { background:var(--accent); color:white; border-color:var(--accent); }
  button:disabled { opacity:0.5; cursor:not-allowed; }
  ::-webkit-scrollbar { width:8px; } ::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }
  .col { display:flex; flex-direction:column; padding:10px; gap:10px; overflow-y:auto; box-sizing:border-box; }
  .panel { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:10px; display:flex; flex-direction:column; gap:10px; }
  .row { display:flex; gap:10px; align-items:center; }
  .label { font-size:0.8rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:1px; margin-bottom:2px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px; }
  .img-card { position:relative; border:1px solid var(--border); border-radius:6px; overflow:hidden; background:#000; aspect-ratio:1; group:card; }
  .img-card img { width:100%; height:100%; object-fit:cover; transition:0.3s; }
  .img-card:hover img { transform:scale(1.05); }
  .img-overlay { position:absolute; bottom:0; left:0; right:0; background:rgba(0,0,0,0.8); padding:5px; font-size:0.7rem; display:flex; justify-content:space-between; opacity:0; transition:0.2s; pointer-events:none; }
  .img-card:hover .img-overlay { opacity:1; pointer-events:auto; }
  .tab-btn { flex:1; padding:4px; font-size:0.8rem; opacity:0.5; border-bottom:2px solid transparent; }
  .tab-btn.active { opacity:1; border-color:var(--accent); background:transparent; }
  #mainPromptInput { height:80px; resize:none; }
  .hidden { display:none !important; }
  .loader { border:3px solid var(--panel); border-top:3px solid var(--accent); border-radius:50%; width:20px; height:20px; animation:spin 1s linear infinite; }
  @keyframes spin { 0% { transform:rotate(0deg); } 100% { transform:rotate(360deg); } }
</style>

<!-- Layout -->
<div style="width:300px; border-right:1px solid var(--border);" class="col">
  <!-- Account -->
  <div class="panel">
    <div class="label">User Account</div>
    <div class="row">
      <input id="usernameInput" placeholder="Username" style="flex:1;">
      <button onclick="app.login()">Login</button>
    </div>
    <div id="userDisplayEl" class="label" style="color:var(--accent);"></div>
  </div>

  <!-- Prompt Helper -->
  <div class="panel" style="flex:1;">
    <div class="label">Prompt AI Helper</div>
    <textarea id="helperInput" placeholder="Enter idea or leave empty..."></textarea>
    <div class="row">
      <button onclick="app.generatePrompt('generate')" style="flex:1;">Generate</button>
      <button onclick="app.generatePrompt('random')" style="flex:1;">Random</button>
    </div>
    <div class="row">
      <button onclick="app.generatePrompt('enhance')" style="flex:1;">Enhance</button>
      <button onclick="app.copyHelper()">Copy</button>
    </div>
    <button onclick="app.saveToScratchpad()">Save to Scratchpad</button>
  </div>

  <!-- Scratchpad -->
  <div class="panel" style="flex:1;">
    <div class="label">Scratchpad</div>
    <div class="row" style="border-bottom:1px solid var(--border); padding-bottom:5px;">
      <button class="tab-btn active" onclick="app.setScratchTab(0)">1</button>
      <button class="tab-btn" onclick="app.setScratchTab(1)">2</button>
      <button class="tab-btn" onclick="app.setScratchTab(2)">3</button>
      <button onclick="app.clearScratchpad()">Clear</button>
    </div>
    <textarea id="scratchpadInput" style="flex:1; resize:none;"></textarea>
  </div>
</div>

<div style="flex:1; display:flex; flex-direction:column;" class="col">
  <!-- Header -->
  <header style="padding:15px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;">
    <h1 style="margin:0; font-size:1.5rem; color:var(--accent);">The AI HentaiHub</h1>
    <div class="row">
      <button onclick="app.exportData()">Export JSON</button>
      <label class="row" style="cursor:pointer; padding:8px; background:var(--panel); border:1px solid var(--border); border-radius:4px;">
        Import <input type="file" id="importInput" hidden onchange="app.importData(this)">
      </label>
    </div>
  </header>

  <!-- Main Controls -->
  <div class="panel" style="margin:10px;">
    <div class="row" style="flex-wrap:wrap;">
      <!-- Dropdowns -->
      <div style="flex:1; min-width:150px;">
        <div class="label">Style</div>
        <select id="styleSelect" style="width:100%; margin:0;">
          <option value="Anime Realistic">Anime Realistic</option>
          <option value="Cel Shaded">Cel Shaded</option>
          <option value="Oil Painting">Oil Painting</option>
          <option value="Cyberpunk">Cyberpunk</option>
          <option value="Watercolor">Watercolor</option>
          <option value="3D Render">3D Render</option>
        </select>
      </div>
      <div style="flex:1; min-width:150px;">
        <div class="label">Category</div>
        <select id="categorySelect" style="width:100%; margin:0;">
          <option value="General">General</option>
          <option value="Portrait">Portrait</option>
          <option value="Landscape">Landscape</option>
          <option value="Action">Action</option>
          <option value="Fantasy">Fantasy</option>
        </select>
      </div>
      <div style="flex:2; min-width:300px;">
        <div class="label">Modifiers (Comma separated)</div>
        <input id="modifiersInput" placeholder="e.g. masterpiece, best quality, 4k, detailed lighting" style="width:100%; margin:0;">
      </div>
    </div>

    <!-- Sliders -->
    <div class="row" style="flex-wrap:wrap; margin-top:10px;">
      <div class="row" style="flex:1;">
        <span class="label">Guidance: <span id="guidanceVal">7</span></span>
        <input type="range" min="1" max="20" value="7" step="0.5" oninput="guidanceVal.innerText=this.value" id="guidanceInput">
      </div>
      <div class="row" style="flex:1;">
        <span class="label">Steps: <span id="stepsVal">30</span></span>
        <input type="range" min="10" max="100" value="30" oninput="stepsVal.innerText=this.value" id="stepsInput">
      </div>
      <div class="row" style="flex:1;">
        <span class="label">Batch: <span id="batchVal">1</span></span>
        <input type="range" min="1" max="12" value="1" oninput="batchVal.innerText=this.value" id="batchInput">
      </div>
      <div class="row" style="flex:1;">
        <span class="label">Seed (-1 Random)</span>
        <input type="number" id="seedInput" value="-1" style="width:70px;">
        <button onclick="seedInput.value = Math.floor(Math.random()*999999)">R</button>
      </div>
    </div>

    <!-- Main Prompt -->
    <div class="label">Main Prompt</div>
    <textarea id="mainPromptInput" placeholder="Describe the image you want to generate..."></textarea>
    
    <div class="row" style="justify-content:flex-end;">
      <button id="generateBtn" onclick="app.generateImages()">⚡ Generate Images</button>
    </div>
  </div>

  <!-- Gallery Section -->
  <div style="flex:1; padding:10px; overflow:hidden; display:flex; flex-direction:column;">
    <div class="row" style="padding:5px 0; border-bottom:1px solid var(--border);">
      <div class="label">Gallery (<span id="galleryCount">0</span>)</div>
      <input id="searchInput" placeholder="Search prompts..." style="flex:1;" onkeyup="app.renderGallery()">
      <select id="sortSelect" onchange="app.renderGallery()" style="width:120px;">
        <option value="newest">Newest</option>
        <option value="oldest">Oldest</option>
      </select>
      <select id="folderSelect" onchange="app.renderGallery()" style="width:120px;">
        <option value="all">All Folders</option>
        <option value="favorites">❤ Favorites</option>
      </select>
    </div>
    
    <div id="galleryGrid" class="grid" style="flex:1; overflow-y:auto; padding:10px;">
      <!-- Images go here -->
    </div>
  </div>
</div>

<!-- Modal for viewing/editing -->
<dialog id="imageModal" style="background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:20px; max-width:800px; width:90%;">
  <div style="display:flex; gap:20px; flex-wrap:wrap;">
    <div style="flex:1; min-width:300px;">
      <img id="modalImg" src="" style="width:100%; border-radius:4px; border:1px solid var(--border);">
    </div>
    <div style="flex:1; min-width:300px; display:flex; flex-direction:column; gap:10px;">
      <h2 style="margin:0; color:var(--accent);">Image Details</h2>
      <div class="label">Prompt</div>
      <textarea id="modalPrompt" style="height:100px; font-size:0.8rem;"></textarea>
      
      <div class="row">
        <div class="label">Seed: <span id="modalSeed"></span></div>
        <div class="label">Steps: <span id="modalSteps"></span></div>
        <div class="label">Guidance: <span id="modalGuidance"></span></div>
      </div>
      
      <div class="row">
        <button onclick="app.downloadCurrent()">⬇ Download</button>
        <button onclick="app.toggleFavorite()">❤ Favorite</button>
        <button onclick="app.regenerateFromModal()">🔄 Regenerate</button>
        <button onclick="imageModal.close()" style="background:#d32f2f;">✕ Close</button>
      </div>
      <button onclick="app.deleteCurrent()" style="background:#d32f2f; margin-top:auto;">Delete Image</button>
    </div>
  </div>
</dialog>

<script type="module">
  // Global access for the app
  window.app = {
    currentUser: 'guest',
    scratchpads: ['', '', ''],
    activeScratchTab: 0,
    currentModalImageId: null,
    gallery: [],
    
    async init() {
      // Load last user
      let lastUser = localStorage.lastHentaiHubUser || 'guest';
      this.login(lastUser);
      
      // Load Scratchpad
      let savedScratch = localStorage.hentaiHubScratch;
      if(savedScratch) this.scratchpads = JSON.parse(savedScratch);
      this.updateScratchpadUI();
      
      // Setup Prompt Helper Streaming
      this.setupHelper();
    },

    async login(name) {
      if(!name) name = usernameInput.value.trim() || 'guest';
      this.currentUser = name.replace(/[^a-z0-9]/gi, '_');
      usernameInput.value = this.currentUser;
      userDisplayEl.innerText = `User: ${this.currentUser}`;
      localStorage.lastHentaiHubUser = this.currentUser;
      
      // Load Gallery from KV
      try {
        this.gallery = await root.kv.hentaiHub_gallery.get(this.currentUser) || [];
      } catch(e) {
        console.error("KV Load Error", e);
        this.gallery = JSON.parse(localStorage[`hentaiHub_gallery_${this.currentUser}`] || '[]');
      }
      this.renderGallery();
    },

    saveGallery() {
      // Save to KV and LocalStorage fallback
      try {
        root.kv.hentaiHub_gallery.set(this.currentUser, this.gallery);
      } catch(e) {}
      localStorage[`hentaiHub_gallery_${this.currentUser}`] = JSON.stringify(this.gallery);
    },

    // --- Prompt Helper Logic ---
    setupHelper() {
      helperInput.oninput = () => { if(!helperInput.value) helperInput.dataset.dirty = 'false'; };
    },

    async generatePrompt(mode) {
      let instruction = "";
      let input = helperInput.value.trim();
      
      if(mode === 'generate') instruction = `Generate a detailed, explicit NSFW hentai prompt for an image generator based on this concept: ${input}`;
      if(mode === 'random') instruction = `Generate a completely random, explicit, creative NSFW hentai image generation prompt.`;
      if(mode === 'enhance') instruction = `Rewrite and enhance this NSFW hentai prompt to be more detailed, artistic, and visually descriptive: ${input}`;
      
      helperInput.value = ""; // Clear to show streaming
      let fullText = "";
      
      // Show loading on button? Simplified for inline.
      helperInput.disabled = true;
      
      try {
        let p = root.generateText({ instruction, onChunk: d => { fullText += d.textChunk; helperInput.value = fullText; }});
        await p;
      } catch(e) {
        helperInput.value = "Error generating prompt.";
      }
      
      helperInput.disabled = false;
      helperInput.dataset.dirty = 'true';
    },

    copyHelper() {
      navigator.clipboard.writeText(helperInput.value);
    },

    saveToScratchpad() {
      this.scratchpads[this.activeScratchTab] = helperInput.value;
      this.saveScratchpads();
      this.updateScratchpadUI();
      // Also fill main prompt
      mainPromptInput.value = helperInput.value;
    },

    // --- Scratchpad Logic ---
    setScratchTab(index) {
      this.scratchpads[this.activeScratchTab] = scratchpadInput.value; // Save current
      this.activeScratchTab = index;
      this.updateScratchpadUI();
    },

    updateScratchpadUI() {
      scratchpadInput.value = this.scratchpads[this.activeScratchTab];
      document.querySelectorAll('.tab-btn').forEach((b, i) => {
        b.classList.toggle('active', i === this.activeScratchTab);
      });
    },

    saveScratchpads() {
      localStorage.hentaiHubScratch = JSON.stringify(this.scratchpads);
    },

    clearScratchpad() {
      this.scratchpads[this.activeScratchTab] = "";
      scratchpadInput.value = "";
      this.saveScratchpads();
    },

    // --- Image Generation Logic ---
    async generateImages() {
      let prompt = mainPromptInput.value.trim();
      if(!prompt) { alert("Please enter a prompt"); return; }
      
      let count = parseInt(batchInput.value);
      let seed = parseInt(seedInput.value);
      let steps = parseInt(stepsInput.value);
      let guidance = parseFloat(guidanceInput.value);
      let style = styleSelect.value;
      let category = categorySelect.value;
      let modifiers = modifiersInput.value;
      
      let fullPrompt = `${style}, ${category}, ${modifiers}, ${prompt}`;
      
      generateBtn.disabled = true;
      generateBtn.innerHTML = `<div class="loader" style="display:inline-block; vertical-align:middle; margin-right:5px;"></div> Generating...`;
      
      let newImages = [];
      
      for(let i=0; i<count; i++) {
        let currentSeed = seed === -1 ? Math.floor(Math.random()*999999999) : (seed + i);
        let imgId = Date.now() + "_" + i;
        
        try {
          // Using generateImage global
          let dataUrl = await root.generateImage(fullPrompt, { resolution: "768x768" }); // Simplified resolution for consistency
          
          let imgObj = {
            id: imgId,
            url: dataUrl,
            prompt: prompt,
            fullPrompt: fullPrompt,
            seed: currentSeed,
            steps: steps,
            guidance: guidance,
            style: style,
            category: category,
            timestamp: Date.now(),
            favorite: false
          };
          
          this.gallery.unshift(imgObj); // Add to top
          newImages.push(imgObj);
          
        } catch(e) {
          console.error("Gen fail", e);
        }
      }
      
      this.saveGallery();
      this.renderGallery();
      
      generateBtn.disabled = false;
      generateBtn.innerText = "⚡ Generate Images";
    },

    // --- Gallery Logic ---
    renderGallery() {
      let search = searchInput.value.toLowerCase();
      let sort = sortSelect.value;
      let folder = folderSelect.value;
      
      let filtered = this.gallery.filter(img => {
        let matchesSearch = img.prompt.toLowerCase().includes(search);
        let matchesFolder = folder === 'all' || (folder === 'favorites' && img.favorite);
        return matchesSearch && matchesFolder;
      });
      
      filtered.sort((a,b) => sort === 'newest' ? b.timestamp - a.timestamp : a.timestamp - b.timestamp);
      
      galleryCount.innerText = filtered.length;
      galleryGrid.innerHTML = "";
      
      filtered.forEach(img => {
        let div = document.createElement('div');
        div.className = "img-card";
        div.innerHTML = `
          <img src="${img.url}" loading="lazy">
          <div class="img-overlay">
            <span>${img.favorite ? '❤' : ''}</span>
            <div class="row">
              <button onclick="app.openModal('${img.id}')" style="padding:2px 6px; margin:0;">Edit</button>
              <button onclick="app.deleteImage('${img.id}')" style="padding:2px 6px; margin:0; background:#d32f2f;">X</button>
            </div>
          </div>
        `;
        galleryGrid.appendChild(div);
      });
    },

    deleteImage(id) {
      if(!confirm("Delete this image?")) return;
      this.gallery = this.gallery.filter(img => img.id !== id);
      this.saveGallery();
      this.renderGallery();
    },

    // --- Modal Logic ---
    openModal(id) {
      let img = this.gallery.find(i => i.id === id);
      if(!img) return;
      this.currentModalImageId = id;
      
      modalImg.src = img.url;
      modalPrompt.value = img.prompt;
      modalSeed.innerText = img.seed;
      modalSteps.innerText = img.steps;
      modalGuidance.innerText = img.guidance;
      
      // Sync main inputs if user wants to regenerate
      // We don't auto-fill main inputs to avoid confusion, but we do it on "Regenerate" click
      
      imageModal.showModal();
    },

    async toggleFavorite() {
      let img = this.gallery.find(i => i.id === this.currentModalImageId);
      if(img) {
        img.favorite = !img.favorite;
        this.saveGallery();
        this.renderGallery(); // Update overlay icon
      }
    },

    downloadCurrent() {
      let img = this.gallery.find(i => i.id === this.currentModalImageId);
      if(img) {
        let a = document.createElement('a');
        a.href = img.url;
        a.download = `hentai_${img.id}.png`;
        a.click();
      }
    },

    regenerateFromModal() {
      let img = this.gallery.find(i => i.id === this.currentModalImageId);
      if(img) {
        imageModal.close();
        // Fill main inputs
        mainPromptInput.value = img.prompt;
        styleSelect.value = img.style;
        categorySelect.value = img.category;
        seedInput.value = img.seed; // Allow exact regen or change
        stepsInput.value = img.steps;
        guidanceInput.value = img.guidance;
        
        // Update UI labels
        stepsVal.innerText = img.steps;
        guidanceVal.innerText = img.guidance;
        
        // Trigger generation
        this.generateImages();
      }
    },

    deleteCurrent() {
      this.deleteImage(this.currentModalImageId);
      imageModal.close();
    },

    // --- Import/Export ---
    exportData() {
      let data = JSON.stringify(this.gallery, null, 2);
      let blob = new Blob([data], {type: 'application/json'});
      let url = URL.createObjectURL(blob);
      let a = document.createElement('a');
      a.href = url;
      a.download = `hentaihub_backup_${this.currentUser}_${Date.now()}.json`;
      a.click();
    },

    importData(input) {
      let file = input.files[0];
      if(!file) return;
      let reader = new FileReader();
      reader.onload = (e) => {
        try {
          let imported = JSON.parse(e.target.result);
          if(Array.isArray(imported)) {
            if(confirm(`Merge ${imported.length} images into gallery?`)) {
              // Merge strategy: Add new ones, prevent ID collisions?
              // Simple append for now
              this.gallery = [...imported, ...this.gallery];
              this.saveGallery();
              this.renderGallery();
            }
          }
        } catch(err) {
          alert("Invalid JSON file");
        }
      };
      reader.readAsText(file);
    }
  };

  // Start
  await app.init();
</script>
</body>
</html>
