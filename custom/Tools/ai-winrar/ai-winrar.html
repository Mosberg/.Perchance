<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>ai-winrar — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<div style="font-family:Arial,sans-serif; max-width:800px; margin:0 auto; padding:20px;">
  <h1 style="text-align:center; color:#0066cc;">AI WinRAR</h1>
  
  <div style="border:1px solid #ccc; border-radius:8px; padding:15px; margin-bottom:20px; background:#f9f9f9;">
    <h2>AI-Powered Compression</h2>
    <p>Upload files and let AI intelligently compress them with advanced algorithms</p>
    
    <div style="margin:15px 0;">
      <label for="fileInput" style="display:block; margin-bottom:5px; font-weight:bold;">Select Files:</label>
      <input type="file" id="fileInputEl" multiple style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px;">
    </div>
    
    <div style="display:flex; gap:10px; margin:15px 0;">
      <button id="compressBtn" style="flex:1; padding:10px; background:#0066cc; color:white; border:none; border-radius:4px; cursor:pointer;">Compress with AI</button>
      <button id="extractBtn" style="flex:1; padding:10px; background:#28a745; color:white; border:none; border-radius:4px; cursor:pointer;">Extract</button>
    </div>
    
    <div id="compressionOptions" style="margin:15px 0;">
      <label style="display:block; margin-bottom:5px; font-weight:bold;">Compression Strength:</label>
      <div style="display:flex; align-items:center; gap:10px;">
        <input type="range" id="compressionLevelEl" min="1" max="10" value="5" style="flex:1;">
        <span id="levelValueEl" style="width:30px;">5</span>
      </div>
      <div style="display:flex; gap:20px; margin-top:10px;">
        <label style="display:flex; align-items:center; gap:5px;">
          <input type="checkbox" id="aiOptimizationEl" checked>
          <span>AI Optimization</span>
        </label>
        <label style="display:flex; align-items:center; gap:5px;">
          <input type="checkbox" id="encryptionEl">
          <span>Encryption</span>
        </label>
      </div>
    </div>
  </div>
  
  <div id="outputArea" style="border:1px solid #ccc; border-radius:8px; padding:15px; min-height:200px;">
    <h3>Output</h3>
    <div id="statusMessageEl" style="margin:15px 0; padding:10px; background:#e9f7ef; border-radius:4px; display:none;"></div>
    <div id="fileListEl" style="margin:15px 0;"></div>
    <div id="progressContainerEl" style="margin:15px 0; display:none;">
      <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
        <span>Processing:</span>
        <span id="progressPercentEl">0%</span>
      </div>
      <div style="width:100%; height:20px; background:#e0e0e0; border-radius:10px; overflow:hidden;">
        <div id="progressBarEl" style="width:0%; height:100%; background:#0066cc; transition:width 0.3s;"></div>
      </div>
    </div>
    <div id="resultAreaEl" style="margin-top:15px; white-space:pre-wrap; font-family:monospace; background:#f5f5f5; padding:10px; border-radius:4px; display:none;"></div>
  </div>
  
  <div style="margin-top:20px; text-align:center; color:#666; font-size:14px;">
    <p>AI WinRAR - Next-generation file compression powered by artificial intelligence</p>
  </div>

  <script>
    // UI Elements
    const fileInput = fileInputEl;
            const compressionLevel = compressionLevelEl;
    const levelValue = levelValueEl;
    const aiOptimization = aiOptimizationEl;
    const encryption = encryptionEl;
    const statusMessage = statusMessageEl;
    const fileList = fileListEl;
    const progressContainer = progressContainerEl;
    const progressBar = progressBarEl;
    const progressPercent = progressPercentEl;
    const resultArea = resultAreaEl;
    
    // State
    let selectedFiles = [];
    let currentProcess = null;
    
    // Update compression level display
    compressionLevel.addEventListener('input', () => {
      levelValue.textContent = compressionLevel.value;
    });
    
    // Handle file selection
    fileInput.addEventListener('change', (e) => {
      selectedFiles = Array.from(e.target.files);
      updateFileList();
    });
    
    // Update file list display
    function updateFileList() {
      fileList.innerHTML = '';
      if (selectedFiles.length === 0) {
        fileList.innerHTML = '<p style="color:#999;">No files selected</p>';
        return;
      }
      
      const list = document.createElement('ul');
      list.style.paddingLeft = '20px';
      
      selectedFiles.forEach(file => {
        const item = document.createElement('li');
        item.textContent = `${file.name} (${formatFileSize(file.size)})`;
        list.appendChild(item);
      });
      
      fileList.appendChild(list);
    }
    
    // Format file size
    function formatFileSize(bytes) {
      if (bytes < 1024) return bytes + ' bytes';
      else if (bytes < 1048576) return Math.round(bytes / 1024) + ' KB';
      else return Math.round(bytes / 1048576) + ' MB';
    }
    
    // Show status message
    function showStatus(message, isError = false) {
      statusMessage.textContent = message;
      statusMessage.style.background = isError ? '#f8d7da' : '#e9f7ef';
      statusMessage.style.display = 'block';
      
      setTimeout(() => {
        statusMessage.style.display = 'none';
      }, 5000);
    }
    
    // Simulate compression with AI
    async function compressWithAI() {
      if (selectedFiles.length === 0) {
        showStatus('Please select files first', true);
        return;
      }
      
      // Reset UI
      resultArea.style.display = 'none';
      progressContainer.style.display = 'block';
      progressBar.style.width = '0%';
      progressPercent.textContent = '0%';
      
      // Get settings
      const level = compressionLevel.value;
      const useAI = aiOptimization.checked;
      const encrypt = encryption.checked;
      
      // Simulate progress
      let progress = 0;
      const progressInterval = setInterval(() => {
        progress += Math.random() * 15;
        if (progress > 90) progress = 90;
        progressBar.style.width = progress + '%';
        progressPercent.textContent = Math.round(progress) + '%';
      }, 300);
      
      try {
        // Simulate AI processing
        const aiPrompt = `Compress the following ${selectedFiles.length} files using AI optimization level ${level}. ${encrypt ? 'Apply encryption.' : ''} Files: ${selectedFiles.map(f => f.name).join(', ')}`;
        
        // Generate AI compression result
        const aiResult = await generateText(aiPrompt);
        
        // Complete progress
        clearInterval(progressInterval);
        progressBar.style.width = '100%';
        progressPercent.textContent = '100%';
        
        // Show result
        setTimeout(() => {
          progressContainer.style.display = 'none';
          resultArea.style.display = 'block';
          resultArea.textContent = aiResult;
          showStatus(`Successfully compressed ${selectedFiles.length} files with AI`);
        }, 500);
        
      } catch (error) {
        clearInterval(progressInterval);
        progressContainer.style.display = 'none';
        showStatus('Compression failed: ' + error.message, true);
      }
    }
    
    // Simulate extraction
    async function extractFiles() {
      if (selectedFiles.length === 0) {
        showStatus('Please select files first', true);
        return;
      }
      
      // Reset UI
      resultArea.style.display = 'none';
      progressContainer.style.display = 'block';
      progressBar.style.width = '0%';
      progressPercent.textContent = '0%';
      
      // Simulate progress
      let progress = 0;
      const progressInterval = setInterval(() => {
        progress += Math.random() * 20;
        if (progress > 95) progress = 95;
        progressBar.style.width = progress + '%';
        progressPercent.textContent = Math.round(progress) + '%';
      }, 200);
      
      try {
        // Simulate AI extraction
        const aiPrompt = `Extract the following compressed files using AI. Files: ${selectedFiles.map(f => f.name).join(', ')}`;
        const aiResult = await generateText(aiPrompt);
        
        // Complete progress
        clearInterval(progressInterval);
        progressBar.style.width = '100%';
        progressPercent.textContent = '100%';
        
        // Show result
        setTimeout(() => {
          progressContainer.style.display = 'none';
          resultArea.style.display = 'block';
          resultArea.textContent = aiResult;
          showStatus(`Successfully extracted ${selectedFiles.length} files with AI`);
        }, 500);
        
      } catch (error) {
        clearInterval(progressInterval);
        progressContainer.style.display = 'none';
        showStatus('Extraction failed: ' + error.message, true);
      }
    }
    
    // Event listeners
    compressBtn.addEventListener('click', compressWithAI);
    extractBtn.addEventListener('click', extractFiles);
    
    // Initialize
    updateFileList();
  </script>
</div>
</body>
</html>
