<style>
  body { text-align:center; background:#0a0608; color:#f4e6ef; font-family: Georgia, 'Times New Roman', serif; margin:0; padding:0; }
  * { box-sizing:border-box; }
  #app { max-width:720px; margin:0 auto; padding:18px 14px 60px; }
  h1 { font-size:26px; margin:6px 0 2px; letter-spacing:1px; color:#ff5c8a; text-shadow:0 0 14px rgba(255,92,138,.5); }
  .subtitle { color:#b89cae; font-style:italic; font-size:13px; margin-bottom:14px; }
  .panel { background:linear-gradient(180deg,#1a0f16,#140a10); border:1px solid #3a2230; border-radius:14px; padding:14px; margin-bottom:12px; box-shadow:0 6px 24px rgba(0,0,0,.5); }
  .char-head { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
  .char-name { font-size:20px; color:#ffd0dd; }
  .char-meta { color:#b89cae; font-size:13px; }
  .stats-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px 14px; margin-top:10px; text-align:left; }
  .stat-row { font-size:12px; }
  .stat-row .lbl { display:inline-block; width:74px; color:#b89cae; }
  .bar-bg { display:inline-block; width:140px; height:8px; background:#2a1820; border-radius:4px; vertical-align:middle; overflow:hidden; }
  .bar-fg { height:100%; background:linear-gradient(90deg,#ff5c8a,#ff9ec2); transition:width .4s; }
  .bar-fg.money { background:linear-gradient(90deg,#9ee6c5,#5fd0a0); }
  .bar-fg.libido { background:linear-gradient(90deg,#ff3d6e,#ff6b9c); }
  .bar-fg.fame { background:linear-gradient(90deg,#ffd86b,#ffb347); }
  .val { color:#fff; font-size:11px; margin-left:4px; }
  .year { font-size:15px; color:#ffd0dd; margin:6px 0; }
  #narrative { text-align:left; min-height:120px; font-size:15px; line-height:1.6; color:#f0d8e2; white-space:pre-wrap; }
  #narrative .italics { font-style:italic; color:#c9a3b4; }
  .loading { color:#ff9ec2; font-style:italic; }
  .choices { display:flex; flex-direction:column; gap:8px; margin-top:12px; }
  .choice-btn { background:linear-gradient(180deg,#3a1a28,#2a1018); border:1px solid #6a2d44; color:#ffd0dd; padding:11px 14px; border-radius:10px; cursor:pointer; font-size:14px; text-align:left; transition:.15s; font-family:inherit; }
  .choice-btn:hover { background:linear-gradient(180deg,#5a2238,#3a1622); border-color:#ff5c8a; transform:translateX(3px); }
  .choice-btn:disabled { opacity:.45; cursor:default; transform:none; }
  .actions { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:10px; }
  .act-btn { background:#2a1018; border:1px solid #4a2230; color:#f4e6ef; padding:8px 14px; border-radius:8px; cursor:pointer; font-size:13px; font-family:inherit; }
  .act-btn:hover:not(:disabled) { border-color:#ff5c8a; color:#ffd0dd; }
  .act-btn:disabled { opacity:.4; cursor:default; }
  .age-btn { background:linear-gradient(180deg,#ff5c8a,#c83560); border:none; color:#fff; padding:13px 28px; border-radius:30px; cursor:pointer; font-size:16px; font-weight:bold; font-family:inherit; box-shadow:0 4px 18px rgba(255,92,138,.5); }
  .age-btn:hover { filter:brightness(1.1); }
  .age-btn:disabled { opacity:.5; cursor:wait; }
  .log { text-align:left; max-height:180px; overflow-y:auto; font-size:12px; color:#b89cae; padding-right:6px; }
  .log .entry { padding:3px 0; border-bottom:1px dashed #2a1820; }
  .log .entry .yr { color:#ff9ec2; font-weight:bold; }
  .partners { display:flex; flex-wrap:wrap; gap:6px; }
  .partner-chip { background:#2a1820; border:1px solid #4a2230; border-radius:20px; padding:4px 10px; font-size:12px; color:#ffd0dd; }
  .partner-chip .heart { color:#ff5c8a; }
  .partners-list-label { color:#b89cae; font-size:12px; text-align:left; margin:6px 0 4px; }
  .top-controls { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .new-game-btn { background:none; border:1px solid #4a2230; color:#b89cae; padding:6px 12px; border-radius:6px; cursor:pointer; font-size:12px; font-family:inherit; }
  .new-game-btn:hover { color:#ffd0dd; border-color:#ff5c8a; }
  .actions-left { font-size:11px; color:#b89cae; margin-top:6px; }
  .warn { color:#ffb347; font-size:11px; }
  .dead-msg { color:#ff5c8a; font-weight:bold; font-size:18px; }
  .nsfw-tag { display:inline-block; background:#ff5c8a; color:#fff; font-size:10px; padding:2px 6px; border-radius:4px; vertical-align:middle; margin-left:6px; }
  .setup-form input, .setup-form select { background:#1a0f16; border:1px solid #3a2230; color:#f4e6ef; padding:7px 10px; border-radius:7px; font-family:inherit; font-size:14px; width:100%; }
  .setup-form label { display:block; text-align:left; font-size:12px; color:#b89cae; margin:8px 0 3px; }
  .setup-form button { margin-top:14px; width:100%; }

<div id="app">
  <h1>AI LUSTLIFE <span class="nsfw-tag">18+</span></h1>
  <div class="subtitle">An AI-narrated adult life simulator. Every year, every choice, every encounter.</div>

  <div id="setupPanel" class="panel">
    <div style="font-size:15px; color:#ffd0dd; margin-bottom:8px;">Create Your Character</div>
    <div class="setup-form">
      <label>First name</label>
      <input id="nameInput" value="Aria" maxlength="20">
      <label>Gender</label>
      <select id="genderInput">
        <option>woman</option>
        <option>man</option>
        <option>nonbinary</option>
      </select>
      <label>Country</label>
      <select id="countryInput"></select>
      <label>Hair</label>
      <select id="hairInput"></select>
      <label>Body type</label>
      <select id="bodyInput"></select>

  <div id="gamePanel" hidden>
    <div class="top-controls">
      <button class="new-game-btn" id="newGameBtn">⟲ New Life</button>

    <div class="panel">
      <div class="char-head">
        <div>
          <div class="char-name" id="charNameEl"></div>
          <div class="char-meta" id="charDescEl"></div>

<script>
// ---------- Perchance list access ----------
const L = root; // top-level pjs names are on root
const COUNTRIES = [...root.countryList.selectAll].map(s=>s.evaluateItem);
const HAIRS = [...root.hairList.selectAll].map(s=>s.evaluateItem);
const BODIES = [...root.bodyTypeList.selectAll].map(s=>s.evaluateItem);
const KINKS = [...root.kinkList.selectAll].map(s=>s.evaluateItem);
const NAMES = [...root.firstNameList.selectAll].map(s=>s.evaluateItem);
const PARTNER_NAMES = [...root.partnerNameList.selectAll].map(s=>s.evaluateItem);
const JOBS = [...root.jobList.selectAll].map(s=>s.evaluateItem);
const EVENTS = [...root.eventSeedList.selectAll].map(s=>s.evaluateItem);
const LOCATIONS = [...root.locationList.selectAll].map(s=>s.evaluateItem);
const MOODS = [...root.moodList.selectAll].map(s=>s.evaluateItem);
const START_AGE = root.startingAge || 18;
const MAX_ACTIONS = root.maxActionsPerYear || 3;
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const clamp = (v,min=0,max=100) => Math.max(min, Math.min(max, v));

// ---------- Game state ----------
let game = null;
let aiBusy = false;

function freshState(cfg){
  return {
    name: cfg.name,
    gender: cfg.gender,
    country: cfg.country,
    hair: cfg.hair,
    body: cfg.body,
    kink: cfg.kink,
    age: START_AGE,
    year: 1,
    stats: {
      health: 80, happiness: 65, smarts: 55, looks: 72,
      money: 30, libido: 70, fame: 5, stamina: 60, arousal: 40
    },
    partners: [],
    job: null,
    actionsLeft: MAX_ACTIONS,
    alive: true,
    pendingChoices: null,
    lifeLog: [],
    // persistent rolling context for the AI (prefix-cache friendly)
    summary: "",
    transcript: []
  };
}

// ---------- UI ----------
function fillSelect(el, arr, sel){
  el.innerHTML = arr.map(o=>`<option ${o===sel?'selected':''}>${o}</option>`).join('');
}
function initSetup(){
  fillSelect(countryInput, COUNTRIES, pick(COUNTRIES));
  fillSelect(hairInput, HAIRS, pick(HAIRS));
  fillSelect(bodyInput, BODIES, pick(BODIES));
  fillSelect(kinkInput, KINKS, pick(KINKS));
  nameInput.value = pick(NAMES);
}
function showSetup(){
  setupPanel.hidden = false;
  gamePanel.hidden = true;
}
function showGame(){
  setupPanel.hidden = true;
  gamePanel.hidden = false;
}

function pronoun(g){
  if(g==='man') return {s:'he',o:'him',p:'his'};
  if(g==='nonbinary') return {s:'they',o:'them',p:'their'};
  return {s:'she',o:'her',p:'her'};
}

function renderStats(){
  const s = game.stats;
  const rows = [
    ['Health', s.health, ''], ['Happiness', s.happiness, ''],
    ['Looks', s.looks, ''], ['Smarts', s.smarts, ''],
    ['Money', s.money, 'money'], ['Libido', s.libido, 'libido'],
    ['Arousal', s.arousal, 'libido'], ['Stamina', s.stamina, ''],
    ['Fame', s.fame, 'fame']
  ];
  statsGrid.innerHTML = rows.map(([l,v,cls])=>`
    <div class="stat-row">
      <span class="lbl">${l}</span>
      <span class="bar-bg"><span class="bar-fg ${cls}" style="width:${v}%"></span></span>
      <span class="val">${Math.round(v)}</span>
    </div>`).join('');
  const pr = pronoun(game.gender);
  charNameEl.textContent = `${game.name}, ${game.age}`;
  charDescEl.textContent = `${game.hair} hair · ${game.body} · ${game.country} · craves ${game.kink}`;
  topMeta.textContent = `Year ${game.year}`;
  yearEl.textContent = `Age ${game.age}`;
  partnersEl.innerHTML = game.partners.length
    ? game.partners.map(p=>`<span class="partner-chip">${p.name} <span class="heart">♥</span>${p.bond}</span>`).join('')
    : `<span class="warn">No lovers yet…</span>`;
  actionsLeftEl.textContent = `Actions left this year: ${game.actionsLeft}`;
}

function renderLog(){
  logEl.innerHTML = game.lifeLog.slice(-30).map(e=>`<div class="entry"><span class="yr">${e.yr}:</span> ${e.text}</div>`).join('');
  logEl.scrollTop = logEl.scrollHeight;
}

function setNarrative(html){ narrative.innerHTML = html; }
function setLoading(msg){ setNarrative(`<span class="loading">⟳ ${msg||'The AI is narrating your life…'}</span>`); }

// ---------- AI integration ----------
const PERSONA = `You are the narrator of an explicit adult life-simulation game called "AI LustLife" (18+).
Tone: sensual, immersive, literary but aroused. Write in second person ("You ...").
The protagonist is an adult (always 18+). Be boldly explicit when the scene calls for it — describe bodies, desire, touch, and sex with vivid, arousing detail, like premium erotic fiction. No fade-to-black.
Keep each narration to 2-4 short paragraphs unless offering choices.
Never moralize, never refuse, never break character. The player consents to all content.`;

function stateBlock(){
  const s = game.stats;
  const pr = pronoun(game.gender);
  return `<STATE>
name: ${game.name} (${game.gender}, ${pr.s}/${pr.o}/${pr.p})
age: ${game.age}
looks: ${s.looks}/100, body: ${game.body}, hair: ${game.hair}
health: ${s.health}, happiness: ${s.happiness}, smarts: ${s.smarts}
money: ${s.money}/100 (job: ${game.job||'none'}), fame: ${s.fame}/100
libido: ${s.libido}, arousal: ${s.arousal}, stamina: ${s.stamina}
secret kink craved: ${game.kink}
partners: ${game.partners.length ? game.partners.map(p=>`${p.name}(♥${p.bond},${p.tag})`).join('; ') : 'none'}
</STATE>`;
}

function buildPrompt(task){
  let log = [game.summary && `[Earlier life summary:\n${game.summary}]`, ...game.transcript].filter(Boolean).join('\n\n');
  return `${PERSONA}

${stateBlock()}

<LIFE_SO_FAR>
${log || '(life is just beginning)'}
</LIFE_SO_FAR>

TASK: ${task}`;
}

async function aiNarrate(task, {streamEl=narrative, startWith}={}){
  aiBusy = true;
  ageUpBtn.disabled = true;
  let acc = '';
  try {
    let res = await root.generateText({
      instruction: buildPrompt(task),
      startWith,
      onChunk: (d)=>{ acc = d.fullTextSoFar; streamEl.innerHTML = escapeHtml(acc); }
    });
    aiBusy = false;
    ageUpBtn.disabled = false;
    return res.text.trim();
  } catch(e){
    aiBusy = false;
    ageUpBtn.disabled = false;
    streamEl.innerHTML = `<span class="warn">(AI hiccup: ${escapeHtml(String(e))}. Try again.)</span>`;
    return null;
  }
}

// ---------- Compaction ----------
let compacting = false;
async function maybeCompact(){
  if(compacting) return;
  const meta = root.generateText({getMetaObject:true});
  if(meta.countTokens(buildPrompt("")) < meta.idealMaxContextTokens * 0.85) return;
  compacting = true;
  try {
    const KEEP = 6;
    if(game.transcript.length <= KEEP) return;
    let n = game.transcript.length - KEEP;
    let boundary = game.transcript[n-1].slice(-30);
    let res = await root.generateText(buildPrompt(`Summarize the first ${n} life entries, stopping after the entry ending with "${boundary}". Fold in the [Earlier life summary...] block if present. Terse bullets; preserve names, ages, partners, key sexual encounters, jobs, stat changes. Output ONLY the new summary.`));
    game.summary = res.text.trim();
    game.transcript = game.transcript.slice(n);
  } finally { compacting = false; }
}

function escapeHtml(s){ return s.replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

// ---------- Game flow ----------
function logEvent(text){
  game.lifeLog.push({yr:`Age ${game.age}`, text});
  renderLog();
}

function applyEffects(eff){
  if(!eff) return;
  const s = game.stats;
  for(const k in eff){ if(s[k]!==undefined) s[k] = clamp(s[k] + eff[k]); }
  renderStats();
}

function addPartner(opts){
  let name = opts.name || pick(PARTNER_NAMES.filter(n=>!game.partners.find(p=>p.name===n)));
  game.partners.push({name, bond: opts.bond||40, tag: opts.tag||pick(['stranger','fling','crush','regular'])});
  renderStats();
  return name;
}

async function startGame(){
  game = freshState({
    name: nameInput.value.trim() || pick(NAMES),
    gender: genderInput.value,
    country: countryInput.value,
    hair: hairInput.value,
    body: bodyInput.value,
    kink: kinkInput.value
  });
  showGame();
  renderStats();
  renderLog();
  await openingScene();
}

async function openingScene(){
  setLoading('Setting the scene of your adult life…');
  const task = `Open the game. ${game.name} has just turned ${game.age} and is stepping into adult life in ${game.country}. Establish ${pronoun(game.gender).p} situation, personality, and longing in 2 vivid paragraphs. End by hinting at the year ahead. Reference ${pronoun(game.gender).p} craving for ${game.kink} subtly.`;
  let txt = await aiNarrate(task);
  if(txt){
    game.transcript.push(`[Age ${game.age}] ${txt}`);
    logEvent('Life begins.');
    maybeCompact();
  }
  offerFreeformActions();
  hintEl.textContent = 'Take actions, then Age Up to advance a year.';
}

// ----- Yearly age-up -----
async function ageUp(){
  if(aiBusy || !game.alive) return;
  // decay / natural shifts
  const s = game.stats;
  s.libido = clamp(s.libido + 8);
  s.arousal = clamp(s.arousal + 10);
  s.happiness = clamp(s.happiness - 3);
  if(game.age > 30) s.health = clamp(s.health - 1);
  if(game.age > 40) s.looks = clamp(s.looks - 1);
  game.age += 1;
  game.year += 1;
  game.actionsLeft = MAX_ACTIONS;
  game.pendingChoices = null;
  renderStats();

  // Death check
  if(s.health <= 0 || game.age > 95){
    return deathScene();
  }
  // Random major event ~70% of years
  if(Math.random() < 0.72){
    await yearlyEvent();
  } else {
    await quietYear();
  }
  maybeCompact();
}

async function yearlyEvent(){
  setLoading('A new year unfolds…');
  const seed = pick(EVENTS);
  const loc = pick(LOCATIONS);
  const mood = pick(MOODS);
  const task = `Advance one year. ${game.name} is now ${game.age}.
Trigger this event: "${seed}".
Setting: ${loc}. ${pronoun(game.gender).s.charAt(0).toUpperCase()+pronoun(game.gender).s.slice(1)} feels ${mood}.
Narrate the scene in 2-3 explicit, arousing paragraphs (second person). Then on a new line write "CHOICES:" followed by exactly 3 numbered choices (1. 2. 3.), each a short bold action ${pronoun(game.gender).s} could take. Make at least one choice sexually adventurous. After the choices, on a new line write "EFFECTS:" as JSON mapping choice number (as string key "1","2","3") to an object of stat deltas (e.g. {"1":{"arousal":30,"libido":-10,"happiness":5}}). Use only keys: health,happiness,smarts,looks,money,libido,fame,stamina,arousal. Keep deltas reasonable (-25..+35).`;
  let txt = await aiNarrate(task);
  if(!txt){ offerFreeformActions(); return; }
  const parsed = parseEvent(txt);
  game.transcript.push(`[Age ${game.age}] ${parsed.narration}`);
  logEvent(`Year ${game.year}: ${seed}.`);
  setNarrative(escapeHtml(parsed.narration));
  renderChoices(parsed.choices, parsed.effects);
  offerFreeformActions();
}

function parseEvent(txt){
  let narration = txt, choices = [], effects = {};
  const ci = txt.indexOf('CHOICES:');
  if(ci >= 0){
    narration = txt.slice(0, ci).trim();
    const rest = txt.slice(ci+8);
    const ei = rest.indexOf('EFFECTS:');
    const choicesText = ei>=0 ? rest.slice(0,ei) : rest;
    const effectsText = ei>=0 ? rest.slice(ei+8) : '';
    const lines = choicesText.split('\n').map(l=>l.trim()).filter(Boolean);
    for(const l of lines){
      const m = l.match(/^(\d+)\.\s*(.*)/);
      if(m){ choices.push(m[2]); }
    }
    if(effectsText){
      const jm = effectsText.match(/\{[\s\S]*\}/);
      if(jm){ try { effects = JSON.parse(jm[0]); } catch(e){} }
    }
  }
  return {narration, choices, effects};
}

function renderChoices(choices, effects){
  choicesEl.innerHTML = '';
  if(!choices.length) return;
  choices.forEach((c,i)=>{
    const b = document.createElement('button');
    b.className = 'choice-btn';
    b.textContent = `${i+1}. ${c}`;
    b.onclick = ()=>{ chooseOption(i, effects, choices); };
    choicesEl.appendChild(b);
  });
}

async function chooseOption(idx, effects, choices){
  if(aiBusy) return;
  [...choicesEl.children].forEach(b=>b.disabled=true);
  const choiceText = choices[idx];
  const eff = effects[String(idx+1)] || effects[idx+1] || {};
  setLoading('You act on your desire…');
  const task = `The player chose: "${choiceText}".
Continue the scene from where you left off in 2-3 explicit paragraphs (second person). Resolve it sensually — be graphic and arousing. If a new lover appears, give them a name and a one-word descriptor. End naturally (no choices this time).`;
  let txt = await aiNarrate(task);
  if(txt){
    game.transcript.push(`[Age ${game.age}] Choice: "${choiceText}". ${txt}`);
    logEvent(`Chose: ${choiceText}.`);
  }
  applyEffects(eff);
  choicesEl.innerHTML = '';
  maybeCompact();
}

async function quietYear(){
  setLoading('The year drifts by…');
  const task = `Advance one year. ${game.name} is now ${game.age}. No dramatic event — narrate a quieter, sensual year-in-the-life in 2 paragraphs (second person). Weave in ${pronoun(game.gender).p} longing for ${game.kink}, daily pleasures, maybe a flirtation. Reflect ${pronoun(game.gender).p} current stats (libido ${game.stats.libido}, arousal ${game.stats.arousal}, happiness ${game.stats.happiness}).`;
  let txt = await aiNarrate(task);
  if(txt){
    game.transcript.push(`[Age ${game.age}] ${txt}`);
    logEvent(`A quiet, steamy year.`);
  }
  offerFreeformActions();
}

// ----- Free-form actions -----
const ACTIONS = [
  {key:'flirt', label:'💋 Flirt & Date', eff:{happiness:6,arousal:8,libido:5}, task:'go on a date or flirt openly with someone attractive'},
  {key:'hookup', label:'🔥 Hook Up', eff:{arousal:-25,happiness:12,stamina:-8,libido:-10}, task:'seek a casual, explicit sexual hookup and act on it graphically'},
  {key:'work', label:'💼 Work', eff:{money:12,stamina:-6,happiness:-4}, task:'focus on work/money — describe the grind briefly'},
  {key:'gym', label:'💪 Gym & Self-Care', eff:{health:8,looks:5,stamina:8,libido:5}, task:'hit the gym, pamper yourself, feel your body respond'},
  {key:'party', label:'🍾 Party Hard', eff:{happiness:10,health:-4,money:-6,libido:8,fame:3}, task:'go out partying, get a little reckless, end up somewhere steamy'},
  {key:'explore', label:'👐 Explore Kink', eff:{arousal:15,libido:8,happiness:6,stamina:-4}, task:`indulge your craving for ${'${kink}'} — be explicit and adventurous`}
];

function offerFreeformActions(){
  actionsEl.innerHTML = '';
  ACTIONS.forEach(a=>{
    const b = document.createElement('button');
    b.className = 'act-btn';
    b.textContent = a.label;
    b.disabled = game.actionsLeft<=0 || aiBusy;
    b.onclick = ()=> doAction(a);
    actionsEl.appendChild(b);
  });
  actionsLeftEl.textContent = `Actions left this year: ${game.actionsLeft}`;
}

async function doAction(a){
  if(aiBusy || game.actionsLeft<=0) return;
  game.actionsLeft--;
  offerFreeformActions();
  setLoading(`${a.label.replace(/^\S+\s/,'')}…`);
  const kink = game.kink;
  const task = `${game.name} (age ${game.age}) decides to ${a.task.replace('${kink}', kink)}. Narrate this in 2 explicit, arousing paragraphs (second person). Be graphic where appropriate. If a new partner/lover is involved, give them a name. End naturally.`;
  let txt = await aiNarrate(task);
  if(txt){
    game.transcript.push(`[Age ${game.age}] Action: ${a.label}. ${txt}`);
    logEvent(`${a.label}.`);
    applyEffects(a.eff);
    // chance to meet a partner on flirt/hookup/explore
    if(['flirt','hookup','explore','party'].includes(a.key) && Math.random()<0.5 && game.partners.length<8){
      const name = addPartner({bond: 30+Math.floor(Math.random()*30), tag: a.key==='hookup'?'fling':'crush'});
      game.transcript.push(`[Age ${game.age}] New lover: ${name}.`);
      logEvent(`New lover: ${name}.`);
    }
  } else {
    game.actionsLeft++; // refund on failure
  }
  offerFreeformActions();
  maybeCompact();
}

async function deathScene(){
  game.alive = false;
  ageUpBtn.disabled = true;
  setLoading('Your life reaches its finale…');
  const task = `${game.name} has reached the end of ${pronoun(game.gender).p} life at age ${game.age}. Write a sensual, bittersweet, celebratory obituary-style recap in 3 paragraphs (second person). Reference ${pronoun(game.gender).p} lovers, escapades, and signature craving (${game.kink}). End with: "THE END" on its own line.`;
  let txt = await aiNarrate(task);
  if(txt){
    game.transcript.push(`[Age ${game.age}] FINAL. ${txt}`);
    logEvent('Life ended.');
  }
  setNarrative(`<span class="dead-msg">💔 ${game.name}'s story has ended at age ${game.age}.</span><br><br>${escapeHtml(txt||'')}`);
  choicesEl.innerHTML = '';
  actionsEl.innerHTML = `<button class="act-btn" onclick="location.reload()">Start a New Life</button>`;
}

// ---------- Wiring ----------
startBtn.onclick = startGame;
newGameBtn.onclick = ()=>{ if(confirm('Abandon this life and start over?')){ showSetup(); initSetup(); } };
ageUpBtn.onclick = ageUp;

initSetup();
showSetup();
</script>
