<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>ai-text-to-image-generator-art-styles-default — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Dynamic Metadata -->
    <meta name="description" content="[$meta.description]" />
    <meta name="keywords" content="[$meta.tags]" />
    <meta name="author" content="[author]" />
    <meta name="version" content="[version]" />

    <title>[$meta.title]</title>

    <!-- Favicon -->
    <link
      rel="shortcut icon"
      href="https://user.uploads.dev/file/8c7563d0ece7c9ed36c8a83f8361a7a7.webp"
      type="image/x-icon"
    />

    <!-- Base Styling -->
    <style>
      :root {
        --bg: #0d0d0d;
        --bg-alt: #1a1a1a;
        --text: #e6e6e6;
        --accent: #4da3ff;
        --border: #333;
        --radius: 8px;
        --transition: 0.25s ease;
      }

      [data-theme="light"] {
        --bg: #ffffff;
        --bg-alt: #f2f2f2;
        --text: #111;
        --accent: #0066cc;
        --border: #ccc;
      }

      body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, sans-serif;
        transition:
          background var(--transition),
          color var(--transition);
      }

      header,
      footer {
        padding: 20px;
        text-align: center;
        background: var(--bg-alt);
        border-bottom: 1px solid var(--border);
      }

      footer {
        border-top: 1px solid var(--border);
        border-bottom: none;
      }

      main {
        padding: 20px;
        max-width: 900px;
        margin: auto;
      }

      h1,
      h2,
      h3 {
        margin-top: 0;
        color: var(--accent);
      }

      .container {
        background: var(--bg-alt);
        padding: 20px;
        border-radius: var(--radius);
        border: 1px solid var(--border);
        margin-bottom: 20px;
      }

      .btn {
        display: inline-block;
        padding: 10px 16px;
        background: var(--accent);
        color: #fff;
        border-radius: var(--radius);
        cursor: pointer;
        transition: opacity var(--transition);
        text-decoration: none;
      }

      .btn:hover {
        opacity: 0.8;
      }

      .theme-toggle {
        position: fixed;
        top: 15px;
        right: 15px;
        padding: 10px 14px;
        background: var(--accent);
        border-radius: var(--radius);
        cursor: pointer;
        user-select: none;
      }
    </style>
  </head>

  <body>
    <!-- Theme Toggle -->
    <div class="theme-toggle" onclick="toggleTheme()">Theme</div>

    <header>
      <h1>[$meta.title]</h1>
      <p>[$meta.description]</p>
    </header>

    <main>
      <!-- Dynamic Content Container -->
      <section class="container" id="content-area">
        <h2>Main Content</h2>
        <h3>[$output]</h3>
        <h3>[animeModifiers]</h3>
        <h3>[animeModifiers.style.Ghibli]</h3>
        <h3>[animeModifiers.effect.toon]</h3>
      </section>
    </main>

    <footer>
      <p>
        Copyright © [author]
        <span id="year"></span> — Version: [version]
      </p>
    </footer>

    <!-- Logic / Methods / Mechanics -->
    <script>
      // Auto-year
      document.getElementById("year").textContent = new Date().getFullYear();

      // Theme System
      function toggleTheme() {
        const html = document.documentElement;
        html.dataset.theme = html.dataset.theme === "light" ? "dark" : "light";
      }
    </script>
  </body>
</html>

</body>
</html>
