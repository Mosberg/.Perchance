<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Danske Casinoer – Oversigt</title>
<style>
    body {
        font-family: Arial, sans-serif;
        max-width: 1000px;
        margin: 20px auto;
        background: #f7f7f7;
        padding: 20px;
        border-radius: 10px;
    }
    h1 {
        text-align: center;
    }
    .controls {
        display: flex;
        gap: 20px;
        margin-bottom: 20px;
    }
    #search {
        flex: 1;
        padding: 10px;
        font-size: 16px;
    }
    #categoryFilter {
        padding: 10px;
        font-size: 16px;
    }
    .casino {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: white;
        padding: 10px;
        margin-bottom: 8px;
        border-radius: 6px;
        border: 1px solid #ddd;
    }
    .casino a {
        font-weight: bold;
        color: #0066cc;
        text-decoration: none;
        width: 250px;
    }
    .casino input[type="text"] {
        width: 180px;
        padding: 5px;
    }
    #clearBtn {
        margin-top: 20px;
        padding: 10px 20px;
        background: #cc0000;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 16px;
    }
</style>
</head>
<body>

<h1>Alle Casinoer med Dansk Licens</h1>

<div class="controls">
    <input type="text" id="search" placeholder="Søg efter casino...">
    <select id="categoryFilter">
        <option value="all">Alle kategorier</option>
        <option value="casino">Casino</option>
        <option value="sportsbetting">Sportsbetting</option>
        <option value="live">Live Casino</option>
        <option value="poker">Poker</option>
        <option value="bingo">Bingo</option>
    </select>
</div>

<div id="casinoList"></div>

<button id="clearBtn">Clear alle checkboxes</button>

<script>
// Liste over alle danske casinoer med kategorier
const casinos = [
    { name: "888 Casino", url: "https://www.888casino.dk", category: "casino" },
    { name: "Bet365", url: "https://www.bet365.dk", category: "sportsbetting" },
    { name: "Unibet", url: "https://www.unibet.dk", category: "sportsbetting" },
    { name: "LeoVegas", url: "https://www.leovegas.dk", category: "casino" },
    { name: "Mr Green", url: "https://www.mrgreen.dk", category: "casino" },
    { name: "Casino.dk", url: "https://www.casino.dk", category: "casino" },
    { name: "PokerStars", url: "https://www.pokerstars.dk", category: "poker" },
    { name: "Bingo.dk", url: "https://www.bingo.dk", category: "bingo" },
    { name: "ComeOn", url: "https://www.comeon.dk", category: "casino" },
    { name: "Ladbrokes", url: "https://www.ladbrokes.dk", category: "sportsbetting" },
    { name: "Betfair", url: "https://www.betfair.dk", category: "sportsbetting" },
    { name: "Maria Casino", url: "https://www.mariacasino.dk", category: "casino" },
    { name: "Rizk", url: "https://www.rizk.dk", category: "casino" },
    { name: "Royal Casino", url: "https://www.royalcasino.dk", category: "casino" },
    { name: "Spilnu", url: "https://www.spilnu.dk", category: "casino" },
    { name: "Betinia", url: "https://www.betinia.dk", category: "casino" }
];

// Render casinoer
function renderCasinos() {
    const list = document.getElementById("casinoList");
    list.innerHTML = "";

    const searchValue = document.getElementById("search").value.toLowerCase();
    const categoryValue = document.getElementById("categoryFilter").value;

    casinos.forEach((casino, index) => {
        if (
            (casino.name.toLowerCase().includes(searchValue)) &&
            (categoryValue === "all" || casino.category === categoryValue)
        ) {
            const div = document.createElement("div");
            div.className = "casino";

            div.innerHTML = `
                <a href="${casino.url}" target="_blank">${casino.name}</a>
                <input type="checkbox" class="usedToday" data-id="${index}">
                <input type="text" class="depositLimit" data-id="${index}" placeholder="Max deposit (dag/uge/mdr)">
            `;

            list.appendChild(div);
        }
    });

    restoreState();
}

// Lokal lagring
function saveState() {
    const checkboxes = document.querySelectorAll(".usedToday");
    const inputs = document.querySelectorAll(".depositLimit");

    const state = {};

    checkboxes.forEach(cb => {
        state["cb_" + cb.dataset.id] = cb.checked;
    });

    inputs.forEach(inp => {
        state["inp_" + inp.dataset.id] = inp.value;
    });

    localStorage.setItem("casinoState", JSON.stringify(state));
}

function restoreState() {
    const saved = JSON.parse(localStorage.getItem("casinoState") || "{}");

    document.querySelectorAll(".usedToday").forEach(cb => {
        cb.checked = saved["cb_" + cb.dataset.id] || false;
        cb.addEventListener("change", saveState);
    });

    document.querySelectorAll(".depositLimit").forEach(inp => {
        inp.value = saved["inp_" + inp.dataset.id] || "";
        inp.addEventListener("input", saveState);
    });
}

// Clear-knap
document.getElementById("clearBtn").addEventListener("click", () => {
    document.querySelectorAll(".usedToday").forEach(cb => cb.checked = false);
    saveState();
});

// Søgefelt + filter
document.getElementById("search").addEventListener("input", renderCasinos);
document.getElementById("categoryFilter").addEventListener("change", renderCasinos);

// Første load
renderCasinos();
</script>

</body>
</html>
</body>
</html>
