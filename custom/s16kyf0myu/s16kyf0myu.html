<style>

<script>
  // Optional: lightweight client-side search/filter.
  // Perchance should output each card with:
  //   class="pokemon-card type-[primary_type]"
  //   data-name="[name]"
  //   data-number="[number]"
  //   data-types="[type1,type2]"
  (function () {
    const searchInput = document.getElementById('pokedex-search');
    const typeSelect = document.getElementById('pokedex-type-filter');
    const cardsContainer = document.getElementById('pokedex-cards');

    if (!searchInput || !typeSelect || !cardsContainer) return;

    function normalize(str) {
      return (str || '').toString().toLowerCase().trim();
    }

    function applyFilters() {
      const query = normalize(searchInput.value);
      const typeFilter = normalize(typeSelect.value);
      const cards = cardsContainer.querySelectorAll('.pokemon-card');

      cards.forEach(card => {
        const name = normalize(card.getAttribute('data-name'));
        const number = normalize(card.getAttribute('data-number'));
        const types = normalize(card.getAttribute('data-types')); // "fire, flying"

        let matchesSearch =
          !query ||
          name.includes(query) ||
          number.includes(query);

        let matchesType =
          !typeFilter ||
          (types && types.split(',').map(normalize).includes(typeFilter));

        card.classList.toggle('hidden', !(matchesSearch && matchesType));
      });
    }

    searchInput.addEventListener('input', applyFilters);
    typeSelect.addEventListener('change', applyFilters);
  })();
</script>
</body>
