<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>kk50rzf6k2 — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<div id="gameContainerEl" style="position:relative; width:100%; height:100vh; background:linear-gradient(to bottom, #87CEEB, #98D8C8); font-family:'Courier New', monospace;">
  <!-- Game Canvas -->
  <canvas id="gameCanvasEl" width="800" height="600" style="position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); border:3px solid #5D4037; background:#E8F5E9;"></canvas>
  
  <!-- Inventory Panel -->
  <div id="inventoryCtn" style="position:absolute; top:10px; right:10px; width:200px; background:rgba(255,255,255,0.9); border:2px solid #5D4037; padding:10px; border-radius:5px;">
    <h3 style="margin-top:0; text-align:center;">Inventory</h3>
    <div id="inventorySlotsEl" style="display:grid; grid-template-columns:repeat(4,1fr); gap:5px;">
      <!-- Inventory slots will be generated by JS -->
    </div>
  </div>
  
  <!-- Skills Panel -->
  <div id="skillsCtn" style="position:absolute; top:10px; left:10px; width:200px; background:rgba(255,255,255,0.9); border:2px solid #5D4037; padding:10px; border-radius:5px;">
    <h3 style="margin-top:0; text-align:center;">Skills</h3>
    <div id="skillsList">
      <div>Woodcutting: <span id="woodcuttingLvl">1</span></div>
      <div>Mining: <span id="miningLvl">1</span></div>
      <div>Fishing: <span id="fishingLvl">1</span></div>
    </div>
  </div>
  
  <!-- Action Progress Bar -->
  <div id="progressBarCtn" style="position:absolute; bottom:20px; left:50%; transform:translateX(-50%); width:300px; background:rgba(0,0,0,0.7); border:2px solid #FFD700; padding:5px; border-radius:5px; display:none;">
    <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
      <span id="actionNameEl">Action</span>
      <span id="actionProgressEl">0%</span>
    </div>
    <div style="height:15px; background:#333; border:1px solid #FFD700; border-radius:3px;">
      <div id="progressFillEl" style="height:100%; width:0%; background:#FFD700; transition:width 0.1s;"></div>
    </div>
  </div>
  
  <!-- Game Messages -->
  <div id="gameMessagesEl" style="position:absolute; bottom:50px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.7); color:#FFD700; padding:5px 15px; border-radius:5px; display:none;"></div>
</div>

<script>
  // Game state
  const game = {
    player: {
      x: 400,
      y: 300,
      size: 20,
      speed: 3,
      color: '#FF5722',
      inventory: [],
      skills: {
        woodcutting: { level: 1, exp: 0, nextLevel: 83 },
        mining: { level: 1, exp: 0, nextLevel: 83 },
        fishing: { level: 1, exp: 0, nextLevel: 83 }
      }
    },
    objects: [
      { type: 'tree', x: 200, y: 150, size: 30, color: '#2E7D32', action: 'Chop', skill: 'woodcutting', item: 'Logs' },
      { type: 'tree', x: 600, y: 200, size: 30, color: '#2E7D32', action: 'Chop', skill: 'woodcutting', item: 'Logs' },
      { type: 'tree', x: 350, y: 400, size: 30, color: '#2E7D32', action: 'Chop', skill: 'woodcutting', item: 'Logs' },
      { type: 'rock', x: 150, y: 350, size: 25, color: '#607D8B', action: 'Mine', skill: 'mining', item: 'Ore' },
      { type: 'rock', x: 550, y: 450, size: 25, color: '#607D8B', action: 'Mine', skill: 'mining', item: 'Ore' },
      { type: 'water', x: 300, y: 100, size: 40, color: '#1E88E5', action: 'Fish', skill: 'fishing', item: 'Fish' },
      { type: 'water', x: 500, y: 350, size: 40, color: '#1E88E5', action: 'Fish', skill: 'fishing', item: 'Fish' }
    ],
    keys: {},
    currentAction: null,
    progress: 0,
    maxProgress: 100
  };

  // Canvas setup
  const canvas = gameCanvasEl;
  const ctx = canvas.getContext('2d');

  // Create inventory slots
  function createInventorySlots() {
    const inventorySlots = inventorySlotsEl;
    for (let i = 0; i < 20; i++) {
      const slot = document.createElement('div');
      slot.style.width = '40px';
      slot.style.height = '40px';
      slot.style.border = '1px solid #5D4037';
      slot.style.backgroundColor = '#F5F5F5';
      slot.style.display = 'flex';
      slot.style.alignItems = 'center';
      slot.style.justifyContent = 'center';
      slot.style.fontSize = '10px';
      slot.textContent = i < game.player.inventory.length ? game.player.inventory[i] : '';
      inventorySlots.appendChild(slot);
    }
  }

  // Draw game objects
  function drawObject(obj) {
    ctx.fillStyle = obj.color;
    
    if (obj.type === 'tree') {
      // Draw tree trunk
      ctx.fillRect(obj.x - 5, obj.y - 10, 10, 20);
      // Draw tree top
      ctx.beginPath();
      ctx.arc(obj.x, obj.y - 15, obj.size, 0, Math.PI * 2);
      ctx.fill();
    } else if (obj.type === 'rock') {
      // Draw rock as a circle
      ctx.beginPath();
      ctx.arc(obj.x, obj.y, obj.size, 0, Math.PI * 2);
      ctx.fill();
    } else if (obj.type === 'water') {
      // Draw water as a circle
      ctx.beginPath();
      ctx.arc(obj.x, obj.y, obj.size, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Draw player
  function drawPlayer() {
    ctx.fillStyle = game.player.color;
    ctx.beginPath();
    ctx.arc(game.player.x, game.player.y, game.player.size, 0, Math.PI * 2);
    ctx.fill();
    
    // Draw player direction indicator
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(game.player.x, game.player.y - 5, 4, 0, Math.PI * 2);
    ctx.fill();
  }

  // Check if player is near an object
  function isNearObject(obj) {
    const dx = game.player.x - obj.x;
    const dy = game.player.y - obj.y;
    const distance = Math.sqrt(dx * dx + dy * dy);
    return distance < (game.player.size + obj.size + 10);
  }

  // Handle object interaction
  function interactWithObject(obj) {
    if (isNearObject(obj)) {
      game.currentAction = obj;
      game.progress = 0;
      actionNameEl.textContent = obj.action + ' ' + obj.type;
      document.getElementById('progressBarCtn').style.display = 'block';
    } else {
      showMessage('You need to get closer to that ' + obj.type + '!');
    }
  }

  // Show message to player
  function showMessage(msg) {
    const gameMessages = gameMessagesEl;
    gameMessages.textContent = msg;
    gameMessages.style.display = 'block';
    setTimeout(() => {
      gameMessages.style.display = 'none';
    }, 2000);
  }

  // Add item to inventory
  function addItemToInventory(item) {
    if (game.player.inventory.length < 20) {
      game.player.inventory.push(item);
      updateInventoryDisplay();
      showMessage('You got ' + item + '!');
    } else {
      showMessage('Your inventory is full!');
    }
  }

  // Update inventory display
  function updateInventoryDisplay() {
    const slots = document.querySelectorAll('#inventorySlots > div');
    for (let i = 0; i < 20; i++) {
      slots[i].textContent = i < game.player.inventory.length ? game.player.inventory[i] : '';
    }
  }

  // Update skill display
  function updateSkillDisplay(skillName) {
    const skill = game.player.skills[skillName];
    document.getElementById(skillName + 'Lvl').textContent = skill.level;
    
    // Check for level up
    if (skill.exp >= skill.nextLevel) {
      skill.level++;
      skill.exp = 0;
      skill.nextLevel = Math.floor(skill.nextLevel * 1.5);
      showMessage('Congratulations! Your ' + skillName + ' level is now ' + skill.level + '!');
    }
  }

  // Add experience to a skill
  function addExperience(skillName, amount) {
    const skill = game.player.skills[skillName];
    skill.exp += amount;
    updateSkillDisplay(skillName);
  }

  // Game loop
  function gameLoop() {
    // Clear canvas
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Draw ground
    ctx.fillStyle = '#8BC34A';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Draw objects
    game.objects.forEach(obj => drawObject(obj));
    
    // Draw player
    drawPlayer();
    
    // Handle movement
    if (game.keys['ArrowUp'] || game.keys['w']) game.player.y -= game.player.speed;
    if (game.keys['ArrowDown'] || game.keys['s']) game.player.y += game.player.speed;
    if (game.keys['ArrowLeft'] || game.keys['a']) game.player.x -= game.player.speed;
    if (game.keys['ArrowRight'] || game.keys['d']) game.player.x += game.player.speed;
    
    // Keep player within canvas
    game.player.x = Math.max(game.player.size, Math.min(canvas.width - game.player.size, game.player.x));
    game.player.y = Math.max(game.player.size, Math.min(canvas.height - game.player.size, game.player.y));
    
    // Handle action progress
    if (game.currentAction) {
      game.progress += 1;
      actionProgressEl.textContent = game.progress + '%';
      progressFillEl.style.width = game.progress + '%';
      
      if (game.progress >= game.maxProgress) {
        // Action completed
        addItemToInventory(game.currentAction.item);
        addExperience(game.currentAction.skill, 10);
        game.currentAction = null;
        document.getElementById('progressBarCtn').style.display = 'none';
      }
    }
    
    requestAnimationFrame(gameLoop);
  }

  // Event listeners
  document.addEventListener('keydown', (e) => {
    game.keys[e.key] = true;
  });

  document.addEventListener('keyup', (e) => {
    game.keys[e.key] = false;
  });

  canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    
    // Check if clicked on an object
    for (const obj of game.objects) {
      const dx = x - obj.x;
      const dy = y - obj.y;
      const distance = Math.sqrt(dx * dx + dy * dy);
      
      if (distance < obj.size) {
        interactWithObject(obj);
        return;
      }
    }
  });

  // Initialize game
  createInventorySlots();
  gameLoop();
</script>
</body>
</html>
