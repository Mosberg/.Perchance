<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>beyond-the-bobber-json-validator-01 — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<div style="max-width:800px; margin:0 auto; padding:20px; font-family:Arial,sans-serif;">
  <h1 style="text-align:center; color:#2c3e50;">Beyond the Bobber JSON Validator</h1>
  <p style="text-align:center; color:#7f8c8d;">Validate your JSON against mod schemas using AI-powered explanations</p>
  
  <div style="margin:20px 0;">
    <label for="schemaSelect" style="display:block; margin-bottom:5px; font-weight:bold;">Select Schema:</label>
    <select id="schemaSelect" style="width:100%; padding:8px; border:1px solid #bdc3c7; border-radius:4px;">
      <option value="tools">Tools Schema</option>
      <option value="tools_recipes">Tools Recipes Schema</option>
      <option value="raw_fish">Raw Fish Schema</option>
      <option value="cooked_fish">Cooked Fish Schema</option>
      <option value="dishes">Dishes Schema</option>
      <option value="rarity">Rarity Schema</option>
    </select>
  </div>
  
  <div style="margin:20px 0;">
    <label for="jsonInput" style="display:block; margin-bottom:5px; font-weight:bold;">JSON Data:</label>
    <textarea id="jsonInput" rows="15" style="width:100%; padding:10px; border:1px solid #bdc3c7; border-radius:4px; font-family:monospace;"></textarea>
  </div>
  
  <div style="text-align:center; margin:20px 0;">
    <button id="validateBtn" onclick="validateJson()" style="padding:12px 25px; background-color:#3498db; color:white; border:none; border-radius:4px; cursor:pointer; font-size:16px;">Validate JSON</button>
  </div>
  
  <div id="resultCtn" style="margin-top:30px; padding:15px; border-radius:4px; display:none;"></div>
  
  <div id="loadingIndicator" style="display:none; text-align:center; margin:20px 0;">
    <div style="display:inline-block; width:40px; height:40px; border:4px solid #f3f3f3; border-top:4px solid #3498db; border-radius:50%; animation:spin 1s linear infinite;"></div>
    <p>Validating and generating explanation...</p>
  </div>
  
  <script>
    // Schemas data
    const schemas = {
      tools: {
        "$schema": "http://json-schema.org/draft-07/schema#",
        "title": "Fishing Tools",
        "type": "object",
        "patternProperties": {
          "^[a-z_]+$": {
            "type": "object",
            "properties": {
              "id": { "type": "string" },
              "type": { "enum": ["net", "rod", "harpoon", "trap"] },
              "bonus_success": { "type": "number" },
              "durability": { "type": "integer" },
              "catch_types": { "type": "array", "items": { "type": "string" } },
              "repair_item": { "type": "string" }
            },
            "required": ["id", "type", "bonus_success", "durability"]
          }
        }
      },
      tools_recipes: {
        "$schema": "http://json-schema.org/draft-07/schema#",
        "title": "Fishing Tool Recipes",
        "description": "Schema for crafting recipes that produce fishing tools.",
        "type": "object",
        "patternProperties": {
          "^[a-z_]+$": {
            "type": "object",
            "properties": {
              "id": {
                "type": "string",
                "description": "Unique namespaced ID for the recipe.",
                "pattern": "^beyond_the_bobber:[a-z_]+$"
              },
              "pattern": {
                "type": "array",
                "items": {
                  "type": "string",
                  "maxLength": 3,
                  "minLength": 3
                },
                "minItems": 1,
                "maxItems": 3,
                "description": "Crafting grid rows (3x3). Spaces = empty slots."
              },
              "key": {
                "type": "object",
                "patternProperties": {
                  "^[A-Z]$": {
                    "type": "string",
                    "description": "Maps pattern symbol to a Minecraft item ID."
                  }
                },
                "additionalProperties": false,
                "description": "Symbol-to-item mapping for the recipe pattern."
              },
              "result": {
                "type": "object",
                "properties": {
                  "item": {
                    "type": "string",
                    "description": "Item ID produced by the recipe.",
                    "pattern": "^beyond_the_bobber:[a-z_]+$"
                  },
                  "count": {
                    "type": "integer",
                    "minimum": 1,
                    "description": "Number of items produced."
                  }
                },
                "required": ["item", "count"],
                "additionalProperties": false
              }
            },
            "required": ["id", "pattern", "key", "result"],
            "additionalProperties": false
          }
        },
        "additionalProperties": false,
        "allOf": [
          {
            "description": "Cross-validation: ensure recipe result item exists in tools.json",
            "properties": {
              "result": {
                "properties": {
                  "item": {
                    "enum": [
                      "beyond_the_bobber:small_fishing_net",
                      "beyond_the_bobber:big_fishing_net",
                      "beyond_the_bobber:fishing_rod",
                      "beyond_the_bobber:fly_fishing_rod",
                      "beyond_the_bobber:harpoon",
                      "beyond_the_bobber:lobster_pot"
                    ]
                  }
                }
              }
            }
          }
        ]
      },
      raw_fish: {
        "$schema": "http://json-schema.org/draft-07/schema#",
        "title": "Raw Fish Species",
        "type": "object",
        "patternProperties": {
          "^[a-z_]+$": {
            "type": "object",
            "properties": {
              "id": { "type": "string" },
              "tool": { "type": "string" },
              "xp": { "type": "integer" },
              "rarity": { "$ref": "rarity.schema.json" },
              "biome": { "type": "array", "items": { "type": "string" } },
              "food": {
                "type": "object",
                "properties": {
                  "hunger": { "type": "integer" },
                  "saturation": { "type": "number" }
                }
              },
              "stack_size": { "type": "integer" }
            },
            "required": ["id", "tool", "xp", "rarity", "food"]
          }
        }
      },
      cooked_fish: {
        "$schema": "http://json-schema.org/draft-07/schema#",
        "title": "Cooked Fish",
        "type": "object",
        "patternProperties": {
          "^[a-z_]+$": {
            "type": "object",
            "properties": {
              "id": { "type": "string" },
              "source": { "type": "string" },
              "methods": {
                "type": "array",
                "items": { "enum": ["campfire", "furnace", "smoker"] }
              },
              "xp": { "type": "integer" },
              "food": {
                "type": "object",
                "properties": {
                  "hunger": { "type": "integer" },
                  "saturation": { "type": "number" }
                }
              },
              "effects": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "id": { "type": "string" },
                    "duration": { "type": "integer" },
                    "amplifier": { "type": "integer" }
                  }
                }
              }
            },
            "required": ["id", "source", "methods", "xp", "food"]
          }
        }
      },
      dishes: {
        "$schema": "http://json-schema.org/draft-07/schema#",
        "title": "Multi-Ingredient Dishes",
        "type": "object",
        "patternProperties": {
          "^[a-z_]+$": {
            "type": "object",
            "properties": {
              "id": { "type": "string" },
              "ingredients": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "item": { "type": "string" },
                    "count": { "type": "integer" }
                  }
                }
              },
              "method": { "enum": ["campfire", "furnace", "smoker", "crafting"] },
              "station": { "type": "string" },
              "xp": { "type": "integer" },
              "food": {
                "type": "object",
                "properties": {
                  "hunger": { "type": "integer" },
                  "saturation": { "type": "number" }
                }
              },
              "effects": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "id": { "type": "string" },
                    "duration": { "type": "integer" },
                    "amplifier": { "type": "integer" }
                  }
                }
              },
              "rarity": { "$ref": "rarity.schema.json" },
              "category": { "type": "string" }
            },
            "required": ["id", "ingredients", "method", "xp", "food", "rarity"]
          }
        }
      },
      rarity: {
        "$schema": "http://json-schema.org/draft-07/schema#",
        "title": "Rarity Enum",
        "description": "Defines rarity tiers for fish, dishes, and items.",
        "enum": ["common", "uncommon", "rare", "legendary"]
      }
    };

    // Example data for each schema
    const examples = {
      tools: JSON.stringify({
        "small_fishing_net": {
          "id": "beyond_the_bobber:small_fishing_net",
          "type": "net",
          "bonus_success": 0.01,
          "durability": 64,
          "catch_types": ["shrimp", "anchovy"],
          "repair_item": "minecraft:string"
        }
      }, null, 2),
      
      tools_recipes: JSON.stringify({
        "small_fishing_net": {
          "id": "beyond_the_bobber:small_fishing_net",
          "pattern": ["SSS", "S S", "SSS"],
          "key": {
            "S": "minecraft:string"
          },
          "result": {
            "item": "beyond_the_bobber:small_fishing_net",
            "count": 1
          }
        }
      }, null, 2),
      
      raw_fish: JSON.stringify({
        "raw_shrimp": {
          "id": "beyond_the_bobber:raw_shrimp",
          "tool": "beyond_the_bobber:small_fishing_net",
          "xp": 10,
          "rarity": "common",
          "biome": ["ocean", "river"],
          "food": { "hunger": 3, "saturation": 0.2 },
          "stack_size": 64
        }
      }, null, 2),
      
      cooked_fish: JSON.stringify({
        "cooked_shrimp": {
          "id": "beyond_the_bobber:cooked_shrimp",
          "source": "beyond_the_bobber:raw_shrimp",
          "methods": ["campfire", "furnace", "smoker"],
          "xp": 30,
          "food": { "hunger": 5, "saturation": 0.4 },
          "effects": []
        }
      }, null, 2),
      
      dishes: JSON.stringify({
        "fish_stew": {
          "id": "beyond_the_bobber:fish_stew",
          "ingredients": [
            { "item": "beyond_the_bobber:cooked_cod", "count": 1 },
            { "item": "minecraft:carrot", "count": 2 },
            { "item": "minecraft:potato", "count": 1 },
            { "item": "minecraft:bowl", "count": 1 }
          ],
          "method": "crafting",
          "station": "crafting_table",
          "xp": 150,
          "food": { "hunger": 12, "saturation": 0.9 },
          "effects": [{ "id": "regeneration", "duration": 600, "amplifier": 1 }],
          "rarity": "rare",
          "category": "stew"
        }
      }, null, 2),
      
      rarity: JSON.stringify("common", null, 2)
    };

    // Load example when schema changes
    schemaSelect.addEventListener('change', function() {
      jsonInput.value = examples[schemaSelect.value];
      resultCtn.style.display = 'none';
    });

    // Initial load
    jsonInput.value = examples[schemaSelect.value];

    async function validateJson() {
      const schemaName = schemaSelect.value;
      const jsonString = jsonInput.value;
      
      // Show loading indicator
      loadingIndicator.style.display = 'block';
      validateBtn.disabled = true;
      validateBtn.textContent = 'Validating...';
      resultCtn.style.display = 'none';
      
      try {
        // Parse JSON
        const jsonData = JSON.parse(jsonString);
        
        // Validate against schema
        const schema = schemas[schemaName];
        const isValid = validateAgainstSchema(jsonData, schema);
        
        if (isValid) {
          resultCtn.innerHTML = `
            <div style="color:#27ae60; font-weight:bold; margin-bottom:15px;">✅ Valid JSON!</div>
            <p>Your JSON data is valid against the ${schemaName} schema.</p>
          `;
          resultCtn.style.backgroundColor = '#eafaf1';
          resultCtn.style.border = '1px solid #27ae60';
        } else {
          // Get validation errors
          const errors = getValidationErrors(jsonData, schema);
          
          // Generate AI explanation for errors
          const explanation = await root.generateText({
            instruction: `Explain the following JSON validation errors in simple terms for a mod developer: ${errors.join('. ')}. 
            Focus on what's wrong and how to fix it. Keep explanations clear and concise.`,
            maxTokens: 300
          });
          
          resultCtn.innerHTML = `
            <div style="color:#e74c3c; font-weight:bold; margin-bottom:15px;">❌ Validation Errors</div>
            <div style="margin-bottom:15px; font-style:italic;">AI Explanation:</div>
            <div style="background-color:#fdeaea; padding:10px; border-radius:4px; margin-bottom:15px;">
              ${explanation}
            </div>
            <details>
              <summary style="cursor:pointer; font-weight:bold;">Technical Details</summary>
              <pre style="background-color:#f8f9fa; padding:10px; border-radius:4px; overflow-x:auto; margin-top:10px;">
                ${errors.join('\n')}
              </pre>
            </details>
          `;
          resultCtn.style.backgroundColor = '#fdeaea';
          resultCtn.style.border = '1px solid #e74c3c';
        }
        
        resultCtn.style.display = 'block';
      } catch (error) {
        resultCtn.innerHTML = `
          <div style="color:#e74c3c; font-weight:bold; margin-bottom:15px;">❌ JSON Parsing Error</div>
          <p>${error.message}</p>
          <p>Please check your JSON syntax.</p>
        `;
        resultCtn.style.backgroundColor = '#fdeaea';
        resultCtn.style.border = '1px solid #e74c3c';
        resultCtn.style.display = 'block';
      } finally {
        // Hide loading indicator
        loadingIndicator.style.display = 'none';
        validateBtn.disabled = false;
        validateBtn.textContent = 'Validate JSON';
      }
    }

    function validateAgainstSchema(data, schema) {
      // Simplified validation for demonstration
      // In a real implementation, you would use a proper JSON schema validator
      try {
        if (schema.type === 'object' && typeof data !== 'object') return false;
        if (schema.enum && !schema.enum.includes(data)) return false;
        // Additional validation checks would go here
        return true;
      } catch (e) {
        return false;
      }
    }

    function getValidationErrors(data, schema) {
      // Simplified error generation for demonstration
      const errors = [];
      
      if (schema.type === 'object' && typeof data !== 'object') {
        errors.push(`Expected object but got ${typeof data}`);
      }
      
      if (schema.enum && !schema.enum.includes(data)) {
        errors.push(`Value must be one of: ${schema.enum.join(', ')}`);
      }
      
      if (schema.required) {
        for (const field of schema.required) {
          if (!data[field]) {
            errors.push(`Missing required field: ${field}`);
          }
        }
      }
      
      return errors.length > 0 ? errors : ['Unknown validation error'];
    }
  </script>
  
  <style>
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    details {
      margin-top: 10px;
    }
    
    summary::-webkit-details-marker {
      color: #3498db;
    }
  </style>
</div>
</body>
</html>
