<script>
  function capitalizeOutput(el) {
    if (!el) return;
    let walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    let nodes = [], n;
    while (n = walker.nextNode()) nodes.push(n);
    for (n of nodes) n.nodeValue = n.nodeValue.replace(/\.\s*\./g, '.').replace(/([a-zA-Z])\s+\./g, '$1').replace(/\s+,/g, ',').replace(/, and, and/g, ', and').toLowerCase();
    for (let i = 0; i < nodes.length; i++) {
      let node = nodes[i];
      let text = node.nodeValue;
      let startsLine = (i === 0);
      if (!startsLine) {
        let prev = node.previousSibling;
        while (prev && prev.nodeName === '#text' && prev.textContent.trim() === '') prev = prev.previousSibling;
        if (prev && prev.nodeName === 'BR') startsLine = true;
        if (!prev) startsLine = true;
        if (prev && prev.nodeName === '#text' && /[.:!?]\s*$/.test(prev.textContent)) startsLine = true;
      }
      if (startsLine) text = text.replace(/^(\s*)([a-z])/, (m, s, c) => s + c.toUpperCase());
      text = text.replace(/\.\s*\./g, '.').replace(/([a-zA-Z])\s+\./g, '$1').replace(/\s+,/g, ',').replace(/, and, and/g, ', and');
      text = text.replace(/([.:!?])(\s+)([a-z])/g, (m, p, s, c) => p + s + c.toUpperCase());
      node.nodeValue = text;
    }
  }
  function updateLineageBtns() {
    let hexBtn = document.getElementById('hexBtn');
    let dampBtn = document.getElementById('dampBtn');
    let reBtn = document.getElementById('reBtn');
    if (hexBtn) { if (showHex) { hexBtn.style.setProperty('background-color', '#46b37a', 'important'); hexBtn.style.setProperty('color', '#fff', 'important'); } else { hexBtn.style.setProperty('background-color', '#fff', 'important'); hexBtn.style.setProperty('color', '#1f5e3f', 'important'); } }
    if (dampBtn) { if (showDamp) { dampBtn.style.setProperty('background-color', '#46b37a', 'important'); dampBtn.style.setProperty('color', '#fff', 'important'); } else { dampBtn.style.setProperty('background-color', '#fff', 'important'); dampBtn.style.setProperty('color', '#1f5e3f', 'important'); } }
    if (reBtn) { if (showRe) { reBtn.style.setProperty('background-color', '#46b37a', 'important'); reBtn.style.setProperty('color', '#fff', 'important'); } else { reBtn.style.setProperty('background-color', '#fff', 'important'); reBtn.style.setProperty('color', '#1f5e3f', 'important'); } }
  }
  window._lineagePronoun = 'It';
  function saveBaseAppearance() {
    let el = document.getElementById('appearance-text');
    if (!el || !el.textContent.trim() || el.textContent.includes('randomized appearance')) return;
    let text = el.textContent;
    if (/It is|It has|It also/.test(text)) window._lineagePronoun = 'It';
    else if (/She has|She also|She is/.test(text)) window._lineagePronoun = 'She';
    else if (/He has|He also|He is/.test(text)) window._lineagePronoun = 'He';
    else if (/\bfemale\b/.test(text)) window._lineagePronoun = 'She';
    else if (/\bmale\b/.test(text)) window._lineagePronoun = 'He';
    else window._lineagePronoun = 'It';
  }
  function updateLineageAppearance() {
    let el = document.getElementById('lineage-text');
    if (!el) return;
    let lineage = '';
    let p = window._lineagePronoun;
    if (showHex) lineage += ' Additionally, ' + p + ' is a hexblood, ' + root.Hexblood.evaluateItem;
    if (showDamp) lineage += ' Additionally, ' + p + ' is a dhampir, ' + root.Dhampir.evaluateItem;
    if (showRe) lineage += ' Additionally, ' + p + ' is a reborn, ' + root.Reborn.evaluateItem;
    el.innerHTML = lineage;
    capitalizeAll();
  }
  function capitalizeAll() {
    ['core-text','personality-text','appearance-text','clothing-output'].forEach(id => capitalizeOutput(document.getElementById(id)));
  }
  ['core-text','personality-text','appearance-text','clothing-output'].forEach(id => { let e = document.getElementById(id); if (e) e.style.visibility = 'hidden'; });
  setTimeout(function poll() {
    let el = document.getElementById('core-text');
    if (el && el.textContent.trim()) {
      capitalizeAll();
      ['core-text','personality-text','appearance-text','clothing-output'].forEach(id => { let e = document.getElementById(id); if (e) e.style.visibility = ''; });
    }
    else setTimeout(poll, 200);
  }, 200);
  if (!window._updateOriginal) {
    window._updateOriginal = update;
    update = function(el) {
      window._updateOriginal(el);
      if (!(el instanceof Node)) return;
      el.style.visibility = 'hidden';
      let timer = null;
      let isAppearance = el.id === 'appearance-text';
      let done = false;
      function finish() { if (done) return; done = true; obs.disconnect(); clearTimeout(timer); capitalizeAll(); if (isAppearance) { saveBaseAppearance(); updateLineageAppearance(); } el.style.visibility = ''; }
      let obs = new MutationObserver(function() {
        clearTimeout(timer);
        timer = setTimeout(finish, 30);
      });
      obs.observe(el, {childList:true, characterData:true, subtree:true});
      setTimeout(finish, 500);
    };
  }
  function onSelectChange(field) {
    if (field == 'clothing') {
      update(document.getElementById('clothing-output'));
      return;
    }
    root._updateOnly = field;
    update(document.getElementById('core-text'));
    if (field == 'alignment') {
      update(document.getElementById('personality-text'));
    }
    if (field == 'race' || field == 'gender' || field == 'age') {
      update(document.getElementById('appearance-text'));
    }
    if (field == 'gender' || field == 'race') {
      update(document.getElementById('clothing-output'));
    }
    setTimeout(function() { saveBaseAppearance(); updateLineageAppearance(); }, 600);
  }
  function rollAppearanceSyncAge() {
    root._updateOnly = "syncAge";
    update(document.getElementById('core-text'));
    update(document.getElementById('appearance-text'));
    setTimeout(function() { saveBaseAppearance(); updateLineageAppearance(); }, 600);
  }
  function rollCoreInfo() {
    root._updateOnly = false;
    update(document.getElementById('core-text'));
    update(document.getElementById('personality-text'));
    update(document.getElementById('appearance-text'));
    update(document.getElementById('clothing-output'));
    setTimeout(function() { saveBaseAppearance(); updateLineageAppearance(); }, 600);
  }
</script>
