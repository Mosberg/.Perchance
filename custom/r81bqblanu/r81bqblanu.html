<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>[title]</title>
    <style>
      html {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: radial-gradient(circle at top, #1b2735, #090a0f);
        color: #f5f5f5;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        min-height: 100vh;
      }
      .wrapper {
        max-width: 800px;
        margin: 3rem 1rem;
        padding: 2rem 2.5rem;
        background: rgba(10, 12, 20, 0.9);
        border-radius: 16px;
        box-shadow: 0 18px 45px rgba(0, 0, 0, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(10px);
      }
      h1 {
        margin-top: 0;
        margin-bottom: 1rem;
        font-size: 1.9rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        text-align: center;
      }
      .subtitle {
        text-align: center;
        font-size: 0.9rem;
        opacity: 0.8;
        margin-bottom: 1.5rem;
      }
      .output {
        line-height: 1.7;
        font-size: 1rem;
        white-space: normal;
      }
      button {
        margin-top: 2rem;
        display: inline-block;
        padding: 0.6rem 1.6rem;
        font-size: 0.95rem;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        background: linear-gradient(135deg, #3b82f6, #8b5cf6);
        color: #f9fafb;
        cursor: pointer;
        transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.2s ease;
      }
      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4);
      }
      button:active {
        transform: translateY(0);
        box-shadow: none;
      }
      .button-row {
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <h1>[title]</h1>
      <div class="subtitle">A procedurally generated encounter in a strange world.</div>
      <div class="output">[narrative]</div>
      <div class="button-row">
        <button onclick="update()">Generate another encounter</button>
      </div>
    </div>
  </body>
</html>
</body>
</html>
