<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Content Generator</title>
  <style>
    body { 
      font-family: sans-serif; 
      max-width: 800px; 
      margin: 0 auto; 
      padding: 20px; 
      text-align: left; /* Override default center alignment */
    }
    .settings-panel { 
      background: #f5f5f5; 
      padding: 15px; 
      border-radius: 8px; 
      margin-bottom: 20px; 
    }
    .form-group { 
      margin-bottom: 15px; 
    }
    label { 
      display: block; 
      margin-bottom: 5px; 
      font-weight: bold; 
    }
    input, select, button { 
      width: 100%; 
      padding: 8px; 
      border-radius: 4px; 
      border: 1px solid #ddd; 
      box-sizing: border-box; 
    }
    button { 
      background: #4CAF50; 
      color: white; 
      border: none; 
      cursor: pointer; 
      font-weight: bold; 
    }
    button:hover { 
      background: #45a049; 
    }
    button:disabled { 
      background: #cccccc; 
      cursor: not-allowed; 
    }
    .result-container { 
      margin-top: 20px; 
      padding: 15px; 
      border: 1px dashed #ddd; 
      min-height: 100px; 
      word-wrap: break-word; 
    }
    .gallery { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); 
      gap: 10px; 
      margin-top: 10px; 
    }
    .gallery img { 
      width: 100%; 
      height: auto; 
      border-radius: 4px; 
    }
    .loading { 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      height: 100px; 
    }
    .spinner { 
      border: 4px solid rgba(0, 0, 0, 0.1); 
      border-radius: 50%; 
      border-top: 4px solid #3498db; 
      width: 30px; 
      height: 30px; 
      animation: spin 1s linear infinite; 
    }
    @keyframes spin { 
      0% { transform: rotate(0deg); } 
      100% { transform: rotate(360deg); } 
    }
  </style>
</head>
<body>
  <h1>Dynamic Content Generator</h1>
  
  <div class="settings-panel">
    <div class="form-group">
      <label for="topicInput">Topic:</label>
      <input type="text" id="topicInput" placeholder="Enter a topic...">
    </div>
    
    <div class="form-group">
      <label for="styleSelect">Content Style:</label>
      <select id="styleSelect">
        <option value="article">Article</option>
        <option value="image">Image</option>
        <option value="gallery">Image Gallery</option>
        <option value="list">List</option>
      </select>
    </div>
    
    <button id="generateBtn">Generate Content</button>
  </div>
  
  <div id="resultContainerEl" class="result-container">
    <p>Generated content will appear here...</p>
  </div>

  <script>
    // Helper function to escape curly braces to prevent template parsing
    function escapeCurlyBraces(text) {
      return text.replace(/\{/g, '\\{').replace(/\}/g, '\\}');
    }
    
    // Main generateHTML function that creates content based on settings
    async function generateHTML(settings) {
      // Validate required settings
      if (!settings.topic) return "<p>Please enter a topic first.</p>";
      
      switch (settings.style) {
        case 'article':
          return await generateArticle(settings.topic);
          
        case 'image':
          return await generateImageContent(settings.topic);
          
        case 'gallery':
          return await generateGallery(settings.topic);
          
        case 'list':
          return await generateList(settings.topic);
          
        default:
          return "<p>Unsupported content style selected.</p>";
      }
    }
    
    // Generate article content
    async function generateArticle(topic) {
      const article = await generateText(`Write a comprehensive article about ${topic}. Include an introduction, key points, and conclusion.`);
      return `<article>${article}</article>`;
    }
    
    // Generate single image with description
    async function generateImageContent(topic) {
      const imageUrl = await generateImage(`A professional illustration of ${topic}`);
      const description = await generateText(`Describe this image of ${topic} in one paragraph.`);
      return `
        <div>
          <img src="${imageUrl}" alt="${topic}" style="max-width:100%; border-radius:8px;">
          <p style="margin-top:10px; font-style:italic;">${description}</p>
        </div>`;
    }
    
    // Generate image gallery
    async function generateGallery(topic) {
      const galleryHtml = [];
      
      // Generate 3 images for gallery
      for (let i = 0; i < 3; i++) {
        const imageUrl = await generateImage(`Different artistic representation of ${topic}, variation ${i+1}`);
        galleryHtml.push(`<img src="${imageUrl}" alt="${topic} ${i+1}">`);
      }
      
      const galleryIntro = await generateText(`Write a brief introduction for an image gallery about ${topic}.`);
      
      return `
        <div>
          <p>${galleryIntro}</p>
          <div class="gallery">
            ${galleryHtml.join('')}
          </div>
        </div>`;
    }
    
    // Generate list content
    async function generateList(topic) {
      const listContent = await generateText(`Create a numbered list of 5 important facts about ${topic}. Each point should be concise but informative.`);
      
      // Convert numbered list to HTML
      const items = listContent.split(/\n/).filter(item => item.trim());
      const listItems = items.map(item => `<li>${item.replace(/^\d+\.\s*/, '')}</li>`);
      
      return `
        <div>
          <h2>Key Facts About ${topic}</h2>
          <ol>
            ${listItems.join('')}
          </ol>
        </div>`;
    }
    
    // Event handler for generate button
    async function handleGenerate() {
      // Get current settings
      const settings = {
        topic: topicInput.value.trim(),
        style: styleSelect.value
      };
      
      // Validate topic
      if (!settings.topic) {
        resultContainerEl.innerHTML = "<p style='color:red;'>Please enter a topic first.</p>";
        return;
      }
      
      // Show loading state
      generateBtn.disabled = true;
      generateBtn.textContent = "Generating...";
      resultContainerEl.innerHTML = `
        <div class="loading">
          <div class="spinner"></div>
        </div>`;
      
      try {
        // Generate content
        const generatedContent = await generateHTML(settings);
        
        // Display result
        resultContainerEl.innerHTML = generatedContent;
      } catch (error) {
        // Handle errors - escape curly braces in error message
        const safeErrorMessage = escapeCurlyBraces(error.message);
        resultContainerEl.innerHTML = `
          <p style="color:red;">Error generating content: ${safeErrorMessage}</p>
          <p>Please try again with a different topic.</p>`;
      } finally {
        // Reset button state
        generateBtn.disabled = false;
        generateBtn.textContent = "Generate Content";
      }
    }
    
    // Attach event listener
    generateBtn.addEventListener('click', handleGenerate);
    
    // Allow generating with Enter key
    topicInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleGenerate();
    });
  </script>
</body>
</html>
</body>
</html>
