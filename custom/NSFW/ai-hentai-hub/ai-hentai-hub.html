<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>ai-hentai-hub — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<div style="font-family:sans-serif; background:#120a12; color:#eee; min-height:100vh; padding:12px; text-align:left;">
  <h1 style="color:#ff4d8d; margin:0 0 12px; text-shadow:0 0 8px #ff0055;">🍑 AI Hentai Hub</h1>

  <!-- Tab Bar -->
  <div style="display:flex; gap:6px; margin-bottom:12px; border-bottom:2px solid #2a2a2a; padding-bottom:6px;">
    <button id="tabGenBtn" onclick="switchTab('gen')" style="background:#ff4d8d; color:#fff; border:none; padding:8px 14px; cursor:pointer; border-radius:4px; font-weight:bold;">Generator</button>
    <button id="tabGalBtn" onclick="switchTab('gal')" style="background:#2a2a2a; color:#ccc; border:none; padding:8px 14px; cursor:pointer; border-radius:4px;">Gallery</button>
    <button id="tabFoldBtn" onclick="switchTab('fold')" style="background:#2a2a2a; color:#ccc; border:none; padding:8px 14px; cursor:pointer; border-radius:4px;">Folders</button>
    <button id="tabSetBtn" onclick="switchTab('set')" style="background:#2a2a2a; color:#ccc; border:none; padding:8px 14px; cursor:pointer; border-radius:4px;">Settings</button>
  </div>

  <!-- Generator Tab -->
  <div id="genTab">
    <div style="display:flex; flex-direction:column; gap:8px; max-width:700px;">
      <textarea id="promptEl" rows="3" placeholder="Describe your NSFW hentai scene..." style="background:#1e1e1e; color:#fff; border:1px solid #444; padding:8px; border-radius:4px; resize:vertical;"></textarea>
      <input id="negPromptEl" placeholder="Negative prompt (optional)..." style="background:#1e1e1e; color:#ddd; border:1px solid #444; padding:6px; border-radius:4px;">
      
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <select id="resEl" style="background:#1e1e1e; color:#fff; border:1px solid #444; padding:5px; border-radius:4px;">
          <option>512x512</option>
          <option>512x768</option>
          <option>768x512</option>
          <option>768x768</option>
        </select>
        <select id="catEl" style="background:#1e1e1e; color:#fff; border:1px solid #444; padding:5px; border-radius:4px;"></select>
        <select id="folderEl" style="background:#1e1e1e; color:#fff; border:1px solid #444; padding:5px; border-radius:4px;"></select>
        <input id="tagsEl" placeholder="Tags, comma separated" style="background:#1e1e1e; color:#fff; border:1px solid #444; padding:5px; border-radius:4px; flex:1; min-width:120px;">
      </div>

      <div style="display:flex; gap:6px; flex-wrap:wrap;">
        <button id="genImgBtn" onclick="doGenImg()" style="background:#ff4d8d; color:#fff; border:none; padding:8px 14px; cursor:pointer; border-radius:4px; font-weight:bold;">🎨 Generate Image</button>
        <button id="genTxtBtn" onclick="doGenText()" style="background:#6a1b9a; color:#fff; border:none; padding:8px 14px; cursor:pointer; border-radius:4px; font-weight:bold;">📖 Generate Story</button>
        <button id="enhBtn" onclick="enhancePrompt()" style="background:#2a2a2a; color:#ffcc00; border:1px solid #555; padding:8px 12px; cursor:pointer; border-radius:4px;">✨ AI Enhance Prompt</button>
        <button id="randBtn" onclick="randomPrompt()" style="background:#2a2a2a; color:#00e5ff; border:1px solid #555; padding:8px 12px; cursor:pointer; border-radius:4px;">🎲 Random Prompt</button>
      </div>
      <div id="statusEl" style="color:#aaa; font-size:13px; min-height:18px;">Ready.</div>
    </div>
    <div id="outputCtn" style="margin-top:12px;"></div>
  </div>

  <!-- Gallery Tab -->
  <div id="galTab" hidden>
    <div style="display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap;">
      <select id="filterFolderEl" onchange="renderGallery()" style="background:#1e1e1e; color:#fff; border:1px solid #444; padding:5px; border-radius:4px;"></select>
      <select id="filterCatEl" onchange="renderGallery()" style="background:#1e1e1e; color:#fff; border:1px solid #444; padding:5px; border-radius:4px;"></select>
      <input id="searchEl" placeholder="Search tags or prompt..." oninput="renderGallery()" style="background:#1e1e1e; color:#fff; border:1px solid #444; padding:5px; border-radius:4px; flex:1; min-width:150px;">
    </div>
    <div id="galleryGrid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:10px;"></div>
  </div>

  <!-- Folders Tab -->
  <div id="foldTab" hidden>
    <div style="display:flex; gap:6px; margin-bottom:12px;">
      <input id="newFolderEl" placeholder="New folder name" style="background:#1e1e1e; color:#fff; border:1px solid #444; padding:6px; border-radius:4px; flex:1;">
      <button onclick="addFolder()" style="background:#ff4d8d; color:#fff; border:none; padding:6px 14px; cursor:pointer; border-radius:4px; font-weight:bold;">+ Add</button>
    </div>
    <div id="folderListEl" style="display:flex; flex-direction:column; gap:6px;"></div>
  </div>

  <!-- Settings Tab -->
  <div id="setTab" hidden>
    <h3 style="margin-top:0; color:#ff4d8d;">Hub Settings</h3>
    <label style="display:block; margin:6px 0;"><input type="checkbox" id="rememberCheck" checked> Enable Remember Plugin (save last prompt &amp; history)</label>
    <label style="display:block; margin:6px 0;"><input type="checkbox" id="autoSaveCheck" checked> Enable KV Plugin Auto-Save</label>
    <label style="display:block; margin:6px 0;"><input type="checkbox" id="streamCheck" checked> Stream AI text output</label>
    <div style="height:1px; background:#333; margin:12px 0;"></div>
    <button onclick="exportJSON()" style="background:#333; color:#fff; border:1px solid #555; padding:6px 12px; cursor:pointer; border-radius:4px; margin-right:6px;">⬇ Export JSON</button>
    <button onclick="importJSON()" style="background:#333; color:#fff; border:1px solid #555; padding:6px 12px; cursor:pointer; border-radius:4px; margin-right:6px;">⬆ Import JSON</button>
    <button onclick="clearAll()" style="background:#900; color:#fff; border:1px solid #b71c1c; padding:6px 12px; cursor:pointer; border-radius:4px;">🗑 Clear All Data</button>

    <h3 style="margin-top:24px; color:#ff4d8d;">Community (Comments Plugin)</h3>
    <div id="commentsCtn"></div>
    <script>
      try { commentsCtn.innerHTML = commentsPlugin({channel:"hentai-ai-hub", width:"100%", height:"420px"}); }
      catch(e) { commentsCtn.innerHTML = '<div style="color:#888;">Comments plugin unavailable.</div>'; }
    </script>
  </div>
</div>

<!-- Detail Modal -->
<div id="modalEl" style="position:fixed; inset:0; background:rgba(0,0,0,0.85); display:none; align-items:center; justify-content:center; z-index:100;" onclick="if(event.target===this) closeModal()">
  <div style="background:#1b1b1b; border:1px solid #444; border-radius:8px; padding:16px; max-width:90vw; max-height:90vh; overflow:auto; min-width:300px;">
    <div id="modalContentEl"></div>
    <div style="display:flex; gap:6px; margin-top:12px; flex-wrap:wrap;">
      <select id="moveFolderSel" style="background:#2a2a2a; color:#fff; border:1px solid #555; padding:4px; border-radius:4px;"></select>
      <button onclick="moveItem()" style="background:#333; color:#fff; border:1px solid #555; padding:4px 10px; cursor:pointer; border-radius:4px;">Move</button>
      <select id="moveCatSel" style="background:#2a2a2a; color:#fff; border:1px solid #555; padding:4px; border-radius:4px;"></select>
      <button onclick="setItemCat()" style="background:#333; color:#fff; border:1px solid #555; padding:4px 10px; cursor:pointer; border-radius:4px;">Set Category</button>
      <button onclick="deleteCurrentItem()" style="background:#900; color:#fff; border:none; padding:4px 10px; cursor:pointer; border-radius:4px; margin-left:auto;">Delete</button>
      <button onclick="closeModal()" style="background:#444; color:#fff; border:none; padding:4px 10px; cursor:pointer; border-radius:4px;">Close</button>
    </div>
  </div>
</div>

<script>
  // ── State ──
  let items = [];
  let folders = ['Default', 'Favorites', 'Archive'];
  let categories = ['General', 'Anime', '3D', 'Futa', 'Bondage', 'Tentacle', 'Vanilla', 'Hardcore', 'Yuri', 'Yaoi'];
  let currentItemId = null;

  // ── Helpers ──
  function fill(sel, arr, extra) {
    sel.innerHTML = (extra ? `<option>${extra}</option>` : '') + arr.map(x => `<option value="${x}">${x}</option>`).join('');
  }
  function populateAll() {
    fill(catEl, categories);
    fill(folderEl, folders);
    fill(filterFolderEl, folders, 'All');
    fill(filterCatEl, categories, 'All');
  }
  populateAll();

  // ── KV Load / Save ──
  async function loadData() {
    try {
      let d = await kv.hubData.get('state');
      if(d) { items = d.items || []; folders = d.folders || folders; categories = d.categories || categories; }
    } catch(e) {}
    populateAll();
    if(localStorage.lastPrompt) promptEl.value = localStorage.lastPrompt;
    renderFolders(); renderGallery();
  }
  loadData();

  function saveData() {
    if(!autoSaveCheck.checked) return;
    kv.hubData.set('state', {items, folders, categories});
  }

  // ── Tabs ──
  function switchTab(id) {
    [genTab, galTab, foldTab, setTab].forEach(t => t.hidden = true);
    [tabGenBtn, tabGalBtn, tabFoldBtn, tabSetBtn].forEach(b => { b.style.background='#2a2a2a'; b.style.color='#ccc'; });
    let activeBtn, activeTab;
    if(id==='gen') { activeTab=genTab; activeBtn=tabGenBtn; }
    if(id==='gal') { activeTab=galTab; activeBtn=tabGalBtn; renderGallery(); }
    if(id==='fold') { activeTab=foldTab; activeBtn=tabFoldBtn; renderFolders(); }
    if(id==='set') { activeTab=setTab; activeBtn=tabSetBtn; }
    activeTab.hidden = false;
    activeBtn.style.background = '#ff4d8d';
    activeBtn.style.color = '#fff';
  }

  // ── Generator ──
  async function doGenImg() {
    let prompt = promptEl.value.trim(); if(!prompt) return;
    statusEl.textContent = '⏳ Generating image...'; genImgBtn.disabled = true;
    if(rememberCheck.checked) localStorage.lastPrompt = prompt;
    try {
      let url = await generateImage(prompt + (negPromptEl.value ? ' ### ' + negPromptEl.value : ''), {resolution: resEl.value});
      let item = { id: Date.now(), type:'image', prompt, content:url, resolution:resEl.value, category:catEl.value, folder:folderEl.value, tags: tagsEl.value.split(',').map(t=>t.trim()).filter(Boolean), meta:{created:new Date().toLocaleString(), negative:negPromptEl.value} };
      items.unshift(item); saveData(); renderGallery();
      outputCtn.innerHTML = `<div style="font-size:12px; color:#888; margin-bottom:4px;">${prompt}</div><img src="${url}" style="max-width:100%; max-height:65vh; border:2px solid #444; border-radius:6px;">`;
      statusEl.textContent = 'Image saved to gallery.';
    } catch(e){ statusEl.textContent = 'Error: ' + e.message; }
    genImgBtn.disabled = false;
  }

  async function doGenText() {
    let prompt = promptEl.value.trim(); if(!prompt) return;
    statusEl.textContent = '⏳ Generating story...'; genTxtBtn.disabled = true; outputCtn.textContent = '';
    if(rememberCheck.checked) localStorage.lastPrompt = prompt;
    let opts = { instruction: `Write a vivid NSFW hentai scene based on this prompt. Be explicit and descriptive:\n\n${prompt}` };
    if(streamCheck.checked) {
      opts.onChunk = d => { outputCtn.textContent = (outputCtn.textContent || '') + d.textChunk; };
    }
    try {
      let text = await generateText(opts);
      let finalText = (typeof text === 'string' ? text : outputCtn.textContent) || '[No output]';
      let item = { id: Date.now()+1, type:'text', prompt, content: finalText, resolution:'', category:catEl.value, folder:folderEl.value, tags: tagsEl.value.split(',').map(t=>t.trim()).filter(Boolean), meta:{created:new Date().toLocaleString()} };
      items.unshift(item); saveData(); renderGallery();
      if(!streamCheck.checked) outputCtn.textContent = finalText;
      statusEl.textContent = 'Story saved to gallery.';
    } catch(e){ statusEl.textContent = 'Error: ' + e.message; }
    genTxtBtn.disabled = false;
  }

  async function enhancePrompt() {
    if(!promptEl.value.trim()) return;
    statusEl.textContent = '⏳ Enhancing prompt via ai-text...'; enhBtn.disabled = true;
    let res = await generateText(`Rewrite this hentai prompt into a highly detailed, vivid NSFW image generation prompt. Only output the final prompt text.\n\nOriginal: ${promptEl.value}`);
    promptEl.value = (typeof res === 'string' ? res : '').trim() || promptEl.value;
    statusEl.textContent = 'Prompt enhanced.'; enhBtn.disabled = false;
  }

  async function randomPrompt() {
    statusEl.textContent = '⏳ Generating random prompt...'; randBtn.disabled = true;
    let res = await generateText("Generate a creative, unexpected NSFW hentai scenario prompt suitable for AI image generation. Only output the prompt, no extra commentary.");
    promptEl.value = (typeof res === 'string' ? res : '').trim();
    statusEl.textContent = 'Random prompt ready.'; randBtn.disabled = false;
  }

  // ── Gallery ──
  function renderGallery() {
    galleryGrid.innerHTML = '';
    let ff = filterFolderEl.value, fc = filterCatEl.value, q = searchEl.value.toLowerCase();
    let filtered = items.filter(it => {
      if(ff !== 'All' && it.folder !== ff) return false;
      if(fc !== 'All' && it.category !== fc) return false;
      if(q && !it.prompt.toLowerCase().includes(q) && !it.tags.some(t=>t.toLowerCase().includes(q))) return false;
      return true;
    });
    for(let it of filtered) {
      let card = document.createElement('div');
      card.style.cssText = 'background:#1b1b1b; border:1px solid #444; border-radius:6px; overflow:hidden; cursor:pointer;';
      card.onclick = () => openItem(it.id);
      if(it.type === 'image') {
        card.innerHTML = `<img src="${it.content}" style="width:100%; height:150px; object-fit:cover; display:block;">`;
      } else {
        card.innerHTML = `<div style="height:150px; padding:8px; font-size:12px; color:#ccc; overflow:hidden; background:#121212;">${it.content.slice(0,240).replace(/</g,'&lt;')}...</div>`;
      }
      let bar = document.createElement('div');
      bar.style.cssText = 'padding:6px 8px; font-size:11px; color:#aaa; display:flex; justify-content:space-between; border-top:1px solid #333;';
      bar.innerHTML = `<span>[${it.category}]</span><span>${it.folder}</span>`;
      card.appendChild(bar);
      galleryGrid.appendChild(card);
    }
    if(!filtered.length) galleryGrid.innerHTML = '<div style="color:#555;">No items match.</div>';
  }

  // ── Modal ──
  function openItem(id) {
    let it = items.find(x=>x.id===id); if(!it) return;
    currentItemId = id; modalEl.style.display = 'flex';
    let html = `<div style="color:#ff4d8d; font-weight:bold; margin-bottom:4px;">${it.type.toUpperCase()} • ${it.meta.created}</div>`;
    html += `<div style="color:#888; font-size:12px; margin-bottom:8px;">Res: ${it.resolution||'N/A'} | Folder: ${it.folder} | Category: ${it.category}</div>`;
    html += `<div style="margin-bottom:8px;"><b>Prompt:</b> <span style="color:#ccc;">${it.prompt}</span></div>`;
    if(it.meta.negative) html += `<div style="margin-bottom:8px; color:#ea7777;"><b>Negative:</b> ${it.meta.negative}</div>`;
    html += `<div style="margin-bottom:10px;"><b>Tags:</b> ${it.tags.join(', ') || 'none'}</div>`;
    if(it.type==='image') html += `<img src="${it.content}" style="max-width:100%; max-height:55vh; border-radius:6px; display:block; margin-bottom:8px;">`;
    else html += `<div style="background:#121212; padding:10px; border-radius:6px; white-space:pre-wrap; max-height:45vh; overflow:auto; border:1px solid #333;">${it.content.replace(/</g,'&lt;')}</div>`;
    modalContentEl.innerHTML = html;
    fill(moveFolderSel, folders); moveFolderSel.value = it.folder;
    fill(moveCatSel, categories); moveCatSel.value = it.category;
  }
  function closeModal(){ modalEl.style.display='none'; currentItemId=null; }
  function moveItem(){ let it=items.find(x=>x.id===currentItemId); if(it){it.folder=moveFolderSel.value; saveData(); renderGallery(); closeModal();} }
  function setItemCat(){ let it=items.find(x=>x.id===currentItemId); if(it){it.category=moveCatSel.value; saveData(); renderGallery();} }
  function deleteCurrentItem(){ items=items.filter(x=>x.id!==currentItemId); saveData(); renderGallery(); closeModal(); }

  // ── Folders ──
  function renderFolders(){
    folderListEl.innerHTML = folders.map(f => {
      let c = items.filter(i=>i.folder===f).length;
      let safe = f.replace(/'/g,"\\'");
      return `<div style="background:#1b1b1b; border:1px solid #444; padding:8px 10px; border-radius:4px; display:flex; justify-content:space-between; align-items:center;">
        <span>${f} <span style="color:#777; font-size:12px;">(${c})</span></span>
        ${['Default','Favorites','Archive'].includes(f) ? '' : `<button onclick="removeFolder('${safe}')" style="background:#900; color:#fff; border:none; cursor:pointer; padding:2px 8px; border-radius:3px;">×</button>`}
      </div>`;
    }).join('');
  }
  function addFolder(){
    let n = newFolderEl.value.trim(); if(!n || folders.includes(n)) return;
    folders.push(n); newFolderEl.value=''; populateAll(); saveData(); renderFolders();
  }
  function removeFolder(name){
    if(!confirm(`Delete folder "${name}"? Items inside will move to Default.`)) return;
    items.forEach(i=>{if(i.folder===name) i.folder='Default';});
    folders = folders.filter(f=>f!==name); populateAll(); saveData(); renderFolders(); renderGallery();
  }

  // ── Settings / Data ──
  function exportJSON(){
    let blob = new Blob([JSON.stringify({items,folders,categories},null,2)], {type:'application/json'});
    let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='hentai-hub-backup.json'; a.click();
  }
  function importJSON(){
    let inp=document.createElement('input'); inp.type='file'; inp.accept='.json';
    inp.onchange=async e=>{
      try{
        let d=JSON.parse(await e.target.files[0].text());
        if(Array.isArray(d.items)) items=d.items; if(Array.isArray(d.folders)) folders=d.folders; if(Array.isArray(d.categories)) categories=d.categories;
        populateAll(); saveData(); renderFolders(); renderGallery();
      }catch(err){ alert('Invalid JSON'); }
    }; inp.click();
  }
  function clearAll(){
    if(!confirm('DESTROY all saved data?')) return;
    items=[]; folders=['Default','Favorites','Archive']; categories=['General','Anime','3D','Futa','Bondage','Tentacle','Vanilla','Hardcore','Yuri','Yaoi'];
    saveData(); populateAll(); renderFolders(); renderGallery();
  }
</script>
</body>
</html>
