function resolvePrompt(t){
  let d=descriptionInput.value, n=negativeInput.value, out=t;
  out=out.replace(/\[input\.description\.length\s*>\s*(\d+)\s*\?\s*"([^"]*)"\s*:\s*"([^"]*)"\]/g,(_,num,a,b)=>d.length>+num?a:b);
  out=out.replace(/\[input\.description\.length\s*<\s*(\d+)\s*\?\s*"([^"]*)"\s*:\s*"([^"]*)"\]/g,(_,num,a,b)=>d.length<+num?a:b);
  out=out.replace(/\[input\.description\.length\s*<\s*(\d+)\s*\?\s*input\.description\s*:\s*""\]/g,(_,num)=>d.length<+num?d:"");
  out=out.replace(/\[input\.pokemonType\s*\?\s*input\.pokemonType\s*\+\s*"\s*,\s*"\s*:\s*""\]/g,"");
  out=out.replace(/\[input\.description\]/g,d);
  out=out.replace(/\[input\.negative\]/g,n);
  out=out.replace(/\{a\}/g,"a ");
  out=out.replace(/\{([^}]+)\|([^}]+)\}/g,(_,a)=>a.split('|')[0]);
  return out;
}

function renderStyles(){
  let q=(searchInput.value||"").toLowerCase();
  styleGridCtn.innerHTML="";
  stylesData.forEach((s,i)=>{
    if(q && !s.n.toLowerCase().includes(q) && !s.p.toLowerCase().includes(q)) return;
    let card=document.createElement("div");
    card.style.cssText="background:#222;border-radius:8px;overflow:hidden;cursor:pointer;transition:transform .1s;";
    card.onmouseenter=()=>card.style.transform="scale(1.02)";
    card.onmouseleave=()=>card.style.transform="scale(1)";
    card.onclick=()=>selectStyle(i);
    let img=document.createElement("img");
    img.src=s.img.startsWith("http")?s.img:imgBase+s.img;
    img.style.cssText="width:100%;height:100px;object-fit:cover;display:block;background:#111;";
    img.onerror=()=>img.src="https://placehold.co/300x150/111/666?text="+encodeURIComponent(s.n);
    let lbl=document.createElement("div");
    lbl.textContent=s.n;
    lbl.style.cssText="padding:8px;font-size:12px;font-weight:600;text-align:center;";
    card.appendChild(img); card.appendChild(lbl);
    styleGridCtn.appendChild(card);
  });
}
function selectStyle(i){
  selectedStyle=stylesData[i];
  useAlt=false;
  activeMods=new Set();
  selectedStyleTitle.textContent=selectedStyle.n;
  selectedStyleImg.src=selectedStyle.img.startsWith("http")?selectedStyle.img:imgBase+selectedStyle.img;
  selectedStyleImg.onerror=()=>selectedStyleImg.src="https://placehold.co/600x300/111/666?text="+encodeURIComponent(selectedStyle.n);
  outputCtn.hidden=false;
  altBtn.hidden=!selectedStyle.alt;
  altBtn.textContent="Use Alt Prompt";
  renderModifiers();
  updateOutput();
}
function renderModifiers(){
  modifiersCtn.innerHTML="";
  if(!selectedStyle||!selectedStyle.mods) return;
  for(let g of selectedStyle.mods){
    let w=document.createElement("div"); w.style.marginBottom="8px";
    let t=document.createElement("div"); t.textContent=g.g; t.style.cssText="font-size:12px;color:#aaa;margin-bottom:4px;";
    w.appendChild(t);
    let row=document.createElement("div"); row.style.cssText="display:flex;flex-wrap:wrap;gap:4px;";
    for(let o of g.o){
      let chip=document.createElement("button");
      chip.textContent=o.n;
      chip.style.cssText="font-size:11px;padding:3px 8px;border-radius:4px;border:1px solid #444;background:#222;color:#ddd;cursor:pointer;";
      if(activeMods.has(o.v)){chip.style.background="#0f0";chip.style.color="#000";}
      chip.onclick=()=>{if(activeMods.has(o.v))activeMods.delete(o.v);else activeMods.add(o.v);renderModifiers();updateOutput();};
      row.appendChild(chip);
    }
    w.appendChild(row);
    modifiersCtn.appendChild(w);
  }
}
function updateOutput(){
  if(!selectedStyle) return;
  let t=useAlt&&selectedStyle.alt?selectedStyle.alt:selectedStyle.p;
  let prompt=resolvePrompt(t);
  for(let v of activeMods) prompt+=v;
  let neg=resolvePrompt(selectedStyle.ng);
  promptOutputEl.value=prompt;
  negativeOutputEl.value=neg;
}
function toggleAlt(){useAlt=!useAlt;altBtn.textContent=useAlt?"Use Main":"Use Alt";updateOutput();}
function copyPrompt(){navigator.clipboard.writeText(promptOutputEl.value).then(()=>{let b=event.target;b.textContent="Copied!";setTimeout(()=>b.textContent="Copy Prompt",1000);});}
function copyNegative(){navigator.clipboard.writeText(negativeOutputEl.value).then(()=>{let b=event.target;b.textContent="Copied!";setTimeout(()=>b.textContent="Copy Negative",1000);});}
async function generatePreview(){
  loadingEl.hidden=false; previewCtn.hidden=true;
  try{
    let url=await generateImage(promptOutputEl.value,{resolution:"768x768"});
    previewImg.src=url; previewCtn.hidden=false;
  }catch(e){alert("Image generation failed: "+e);}
  loadingEl.hidden=true;
}
