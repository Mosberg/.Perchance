      anatomyMode: "profile"
    }
  };

  // === HEREIN FATE RESOLVETH EACH COMPOSITION ===
  function hpRandomItem(items) {
    return items[Math.floor(Math.random() * items.length)];
  }

  function hpSceneIds() {
    return Object.keys(HP_PARTNER_SCENES);
  }

  function hpNormalPoseIds() {
    return Object.keys(HP_NORMAL_POSES);
  }

  function hpInterestingPoseIds(group) {
    return Object.keys(HP_INTERESTING_POSES).filter(function (id) {
      return !group || HP_INTERESTING_POSES[id].group === group;
    });
  }

  function hpValidSelectedNormalPoseIds() {
    var selected = Array.isArray(window.__hpSelectedNormalPoseIds) ? window.__hpSelectedNormalPoseIds : [];
    return selected.filter(function (id) {
      return Object.prototype.hasOwnProperty.call(HP_NORMAL_POSES, id);
    });
  }

  function hpEligibleNormalPoseIds() {
    var selected = hpValidSelectedNormalPoseIds();
    return selected.length ? selected : hpNormalPoseIds();
  }

  function hpValidSelectedPoseIds() {
    var selected = Array.isArray(window.__hpSelectedPoseIds) ? window.__hpSelectedPoseIds : [];
    return selected.filter(function (id) {
      return Object.prototype.hasOwnProperty.call(HP_INTERESTING_POSES, id);
    });
  }

  function hpEligiblePoseIds() {
    var selected = hpValidSelectedPoseIds();
    return selected.length ? selected : hpInterestingPoseIds();
  }

  function hpValidSelectedSceneIds() {
    var selected = Array.isArray(window.__hpSelectedSceneIds) ? window.__hpSelectedSceneIds : [];
    return selected.filter(function (id) {
      return Object.prototype.hasOwnProperty.call(HP_PARTNER_SCENES, id);
    });
  }

  function hpEligibleSceneIds() {
    var selected = hpValidSelectedSceneIds();
    return selected.length ? selected : hpSceneIds();
  }

  function hpRandomCatalogEntry(catalog, allowedIds) {
    var keys = Array.isArray(allowedIds) && allowedIds.length ? allowedIds : Object.keys(catalog);
    var id = hpRandomItem(keys);
    return { id: id, data: catalog[id] };
  }

  function hpResolveComposition(mode) {
    var normalizedMode = mode === "on"
      ? "scene"
      : (window.__hpPoseMode === "on" ? "interesting" : "normal");

    if (window.__hpCompositionResolved && window.__hpCompositionResolved.mode === normalizedMode) {
      return window.__hpCompositionResolved;
    }

    var chosen;

    if (normalizedMode === "scene") {
      chosen = hpRandomCatalogEntry(HP_PARTNER_SCENES, hpEligibleSceneIds());
    } else if (normalizedMode === "interesting") {
      chosen = hpRandomCatalogEntry(HP_INTERESTING_POSES, hpEligiblePoseIds());
    } else {
      chosen = hpRandomCatalogEntry(HP_NORMAL_POSES, hpEligibleNormalPoseIds());
    }

    var resolvedData = Object.assign({}, chosen.data);

    if (normalizedMode === "scene") {
      var partner = hpRandomItem(HP_OLDER_REGAL_MEN);
      resolvedData.pose = String(resolvedData.pose || "").replace(/\{partner\}/g, partner);
    }

    window.__hpCompositionResolved = {
      mode: normalizedMode,
      id: chosen.id,
      data: resolvedData
    };

    return window.__hpCompositionResolved;
  }

  window.__hpGetExpressionPrompt = function (mode) {
    return hpResolveComposition(mode).data.expression || "";
  };

  window.__hpGetCropPrompt = function (mode) {
    return hpResolveComposition(mode).data.crop || "";
  };

  window.__hpGetPosePrompt = function (mode) {
    return hpResolveComposition(mode).data.pose || "";
  };

  window.__hpGetAnatomyPrompt = function (mode) {
    var resolved = hpResolveComposition(mode);

    if (resolved.mode === "scene") {
      return resolved.data.anatomyMode === "rear"
        ? hpPartnerRearAnatomy()
        : hpPartnerProfileAnatomy();
    }

    if (resolved.data.anatomyMode === "rear") return hpSoloRearAnatomy();
    if (resolved.data.anatomyMode === "profile") return hpSoloProfileAnatomy();
    return hpSoloFrontAnatomy();
  };

  // === HEREIN MAY YE TEST EACH ROYAL POSTURE ===
  function hpSetSelectedNormalPoseIds(ids) {
    var validIds = ids.filter(function (id) {
      return Object.prototype.hasOwnProperty.call(HP_NORMAL_POSES, id);
    });

    window.__hpSelectedNormalPoseIds = Array.from(new Set(validIds));
    window.__hpCompositionResolved = null;
    hpSaveWorkshopState();
    hpRefreshPoseMenu();
  }

  function hpToggleNormalPoseId(id) {
    var selected = hpValidSelectedNormalPoseIds();
    var index = selected.indexOf(id);

    if (index >= 0) {
      selected.splice(index, 1);
    } else {
      selected.push(id);
    }

    hpSetSelectedNormalPoseIds(selected);
  }

  function hpSetSelectedPoseIds(ids) {
    var validIds = ids.filter(function (id) {
      return Object.prototype.hasOwnProperty.call(HP_INTERESTING_POSES, id);
    });

    window.__hpSelectedPoseIds = Array.from(new Set(validIds));
    window.__hpCompositionResolved = null;
    hpSaveWorkshopState();
    hpRefreshPoseMenu();
  }

  function hpTogglePoseId(id) {
    var selected = hpValidSelectedPoseIds();
    var index = selected.indexOf(id);

    if (index >= 0) {
      selected.splice(index, 1);
    } else {
      selected.push(id);
    }

    hpSetSelectedPoseIds(selected);
  }

  function hpSetPoseSectionSelection(catalogType, groupId, shouldSelect) {
    if (catalogType === "normal") {
      hpSetSelectedNormalPoseIds(shouldSelect ? hpNormalPoseIds() : []);
      return;
    }

    var selectedSet = new Set(hpValidSelectedPoseIds());
    hpInterestingPoseIds(groupId).forEach(function (id) {
      if (shouldSelect) selectedSet.add(id);
      else selectedSet.delete(id);
    });
    hpSetSelectedPoseIds(Array.from(selectedSet));
  }

  function hpRefreshPoseMenu() {
    var menu = document.getElementById("hpPoseMenu");
    if (!menu) return;

    var selectedNormal = hpValidSelectedNormalPoseIds();
    var selectedInteresting = hpValidSelectedPoseIds();
    var selectedNormalSet = new Set(selectedNormal);
    var selectedInterestingSet = new Set(selectedInteresting);
    var status = menu.querySelector(".hpTestingStatus");

    if (status) {
      var normalText = selectedNormal.length
        ? selectedNormal.length + " marked"
        : "the whole lot";
      var interestingText = selectedInteresting.length
        ? selectedInteresting.length + " marked"
        : "the whole lot";
      status.textContent = "Courtly Stances: " + normalText + ". Perilous Postures: " + interestingText + ".";
    }

    menu.querySelectorAll("[data-hp-normal-pose-id]").forEach(function (button) {
      var isSelected = selectedNormalSet.has(button.getAttribute("data-hp-normal-pose-id"));
      button.classList.toggle("is-selected", isSelected);
      button.setAttribute("aria-pressed", isSelected ? "true" : "false");
    });

    menu.querySelectorAll("[data-hp-pose-id]").forEach(function (button) {
      var isSelected = selectedInterestingSet.has(button.getAttribute("data-hp-pose-id"));
      button.classList.toggle("is-selected", isSelected);
      button.setAttribute("aria-pressed", isSelected ? "true" : "false");
    });

    menu.querySelectorAll("[data-hp-pose-group-check]").forEach(function (button) {
      var groupId = button.getAttribute("data-hp-pose-group-check");
      var catalogType = button.getAttribute("data-hp-pose-catalog");
      var groupIds = catalogType === "normal" ? hpNormalPoseIds() : hpInterestingPoseIds(groupId);
      var selectedSet = catalogType === "normal" ? selectedNormalSet : selectedInterestingSet;
      var allSelected = groupIds.length > 0 && groupIds.every(function (id) {
        return selectedSet.has(id);
      });
      button.classList.toggle("is-selected", allSelected);
      button.setAttribute("aria-pressed", allSelected ? "true" : "false");
    });

    var allButton = menu.querySelector('[data-hp-pose-filter="all"]');
    if (allButton) {
      var allSelected = hpInterestingPoseIds().every(function (id) {
        return selectedInterestingSet.has(id);
      });
      allButton.classList.toggle("is-selected", allSelected);
      allButton.setAttribute("aria-pressed", allSelected ? "true" : "false");
    }
  }

  function hpAppendPoseSection(menu, config) {
    var section = document.createElement("section");
    section.className = "hpTestingSection";

    var header = document.createElement("div");
    header.className = "hpTestingSectionHeader";

    var title = document.createElement("div");
    title.className = "hpTestingSectionTitle";
    title.textContent = config.label;
    header.appendChild(title);

    var actions = document.createElement("div");
    actions.className = "hpTestingSectionActions";

    var checkButton = hpCreateButton("Mark the Lot", "hpTestingSectionAction");
    checkButton.setAttribute("data-hp-pose-group-check", config.id);
    checkButton.setAttribute("data-hp-pose-catalog", config.catalog);
    checkButton.addEventListener("click", function () {
      hpSetPoseSectionSelection(config.catalog, config.id, true);
    });
    actions.appendChild(checkButton);

    var clearButton = hpCreateButton("Clear the Lot", "hpTestingSectionAction");
    clearButton.addEventListener("click", function () {
      hpSetPoseSectionSelection(config.catalog, config.id, false);
    });
    actions.appendChild(clearButton);

    header.appendChild(actions);
    section.appendChild(header);

    var grid = document.createElement("div");
    grid.className = "hpTestingButtonGrid";

    var ids = config.catalog === "normal" ? hpNormalPoseIds() : hpInterestingPoseIds(config.id);
    ids.forEach(function (id) {
      var catalog = config.catalog === "normal" ? HP_NORMAL_POSES : HP_INTERESTING_POSES;
      var pose = catalog[id];
      var button = hpCreateButton(pose.label, "hpTestingChoiceButton hpPoseChoiceButton");

      if (config.catalog === "normal") {
        button.setAttribute("data-hp-normal-pose-id", id);
        button.addEventListener("click", function () {
          hpToggleNormalPoseId(id);
        });
      } else {
        button.setAttribute("data-hp-pose-id", id);
        button.addEventListener("click", function () {
          hpTogglePoseId(id);
        });
      }

      grid.appendChild(button);
    });

    section.appendChild(grid);
    menu.appendChild(section);
  }

  function hpBuildPoseMenu() {
    var menu = document.getElementById("hpPoseMenu");
    if (!menu || menu.getAttribute("data-hp-built") === "true") return;

    menu.setAttribute("data-hp-built", "true");

    var status = document.createElement("p");
    status.className = "hpTestingStatus";
    menu.appendChild(status);

    var groupControls = document.createElement("div");
    groupControls.className = "hpTestingGroupControls";

    var allButton = hpCreateButton("All Perilous Postures", "hpTestingFilterButton");
    allButton.setAttribute("data-hp-pose-filter", "all");
    allButton.addEventListener("click", function () {
      var selected = hpValidSelectedPoseIds();
      var allIds = hpInterestingPoseIds();
      hpSetSelectedPoseIds(selected.length === allIds.length ? [] : allIds);
    });
    groupControls.appendChild(allButton);
    menu.appendChild(groupControls);

    [
      { id: "default", label: "Courtly Stances — When Perilous Postures Be Nay", catalog: "normal" },
      { id: "standing", label: "Upright Postures", catalog: "interesting" },
      { id: "kneeling", label: "Upon the Knee", catalog: "interesting" },
      { id: "sitting", label: "Seated Upon the Floor", catalog: "interesting" },
      { id: "reclining", label: "Repose & Reclining", catalog: "interesting" },
      { id: "dynamic", label: "Perilous Contortions", catalog: "interesting" }
    ].forEach(function (group) {
      hpAppendPoseSection(menu, group);
    });

    hpRefreshPoseMenu();
  }

  // === HEREIN MAY YE TEST EACH ARTICLE OF ROYAL GARB ===
  function hpSetSelectedOutfitIds(ids) {
    var validIds = new Set(hpOutfitIds());

    window.__hpSelectedOutfitIds = Array.from(new Set(ids.filter(function (id) {
      return validIds.has(id);
    })));

    window.__hpOutfitResolved = null;
    hpSaveWorkshopState();
    hpRefreshGarbMenu();
  }

  function hpToggleOutfitId(id) {
    var selected = hpValidSelectedOutfitIds();
    var index = selected.indexOf(id);

    if (index >= 0) {
      selected.splice(index, 1);
    } else {
      selected.push(id);
    }

    hpSetSelectedOutfitIds(selected);
  }

  function hpSetOutfitGroupSelection(groupId, shouldSelect) {
    var selectedSet = new Set(hpValidSelectedOutfitIds());

    hpOutfitIds(groupId).forEach(function (id) {
      if (shouldSelect) selectedSet.add(id);
      else selectedSet.delete(id);
    });

    hpSetSelectedOutfitIds(Array.from(selectedSet));
  }

  function hpRefreshGarbMenu() {
    var menu = document.getElementById("hpGarbMenu");
    if (!menu) return;

    var selected = hpValidSelectedOutfitIds();
    var selectedSet = new Set(selected);
    var status = document.getElementById("hpGarbStatus");

    if (status) {
      status.textContent = selected.length
        ? selected.length + (selected.length === 1 ? " garment is" : " garments are") + " marked; Fate shall choose amongst " + (selected.length === 1 ? "it." : "them.")
        : "None are marked; Fate may choose from the whole wardrobe.";
    }

    menu.querySelectorAll("[data-hp-outfit-id]").forEach(function (button) {
      var isSelected = selectedSet.has(button.getAttribute("data-hp-outfit-id"));
      button.classList.toggle("is-selected", isSelected);
      button.setAttribute("aria-pressed", isSelected ? "true" : "false");
    });

    menu.querySelectorAll("[data-hp-outfit-group-check]").forEach(function (button) {
      var groupIds = hpOutfitIds(button.getAttribute("data-hp-outfit-group-check"));
      var allSelected = groupIds.length > 0 && groupIds.every(function (id) {
        return selectedSet.has(id);
      });
      button.classList.toggle("is-selected", allSelected);
      button.setAttribute("aria-pressed", allSelected ? "true" : "false");
    });
  }

  function hpBuildGarbMenu() {
    var menu = document.getElementById("hpGarbMenu");
    if (!menu || menu.getAttribute("data-hp-built") === "true") return;

    menu.setAttribute("data-hp-built", "true");

    HP_OUTFIT_GROUPS.forEach(function (group) {
      var section = document.createElement("section");
      section.className = "hpGarbSection";

      var header = document.createElement("div");
      header.className = "hpGarbSectionHeader";

      var title = document.createElement("div");
      title.className = "hpGarbSectionTitle";
      title.textContent = group.label;
      header.appendChild(title);

      var actions = document.createElement("div");
      actions.className = "hpGarbSectionActions";

      var checkButton = hpCreateButton("+", "hpGarbSectionAction hpGarbSectionAdd");
      checkButton.setAttribute("data-hp-outfit-group-check", group.id);
      checkButton.setAttribute("title", "Mark all " + group.label);
      checkButton.setAttribute("aria-label", "Mark all " + group.label);
      checkButton.addEventListener("click", function () {
        hpSetOutfitGroupSelection(group.id, true);
      });
      actions.appendChild(checkButton);

      var clearButton = hpCreateButton("−", "hpGarbSectionAction hpGarbSectionClear");
      clearButton.setAttribute("title", "Clear all " + group.label);
      clearButton.setAttribute("aria-label", "Clear all " + group.label);
      clearButton.addEventListener("click", function () {
        hpSetOutfitGroupSelection(group.id, false);
      });
      actions.appendChild(clearButton);

      header.appendChild(actions);
      section.appendChild(header);

      var grid = document.createElement("div");
      grid.className = "hpGarbButtonGrid";

      group.outfits.forEach(function (outfit) {
        var button = hpCreateButton(outfit.label, "hpGarbChoiceButton");
        button.setAttribute("data-hp-outfit-id", outfit.id);
        button.addEventListener("click", function () {
          hpToggleOutfitId(outfit.id);
        });
        grid.appendChild(button);
      });

      section.appendChild(grid);
      menu.appendChild(section);
    });

    hpRefreshGarbMenu();
  }

  function hpApplyGarbOpenState() {
    var toggle = document.getElementById("hpGarbToggle");
    var drawer = document.getElementById("hpGarbDrawer");
    if (!toggle || !drawer) return;

    var isOpen = window.__hpGarbOpen === true;
    drawer.hidden = !isOpen;
    toggle.classList.toggle("is-open", isOpen);
    toggle.setAttribute("aria-expanded", isOpen ? "true" : "false");
  }

  function hpInitializeGarbControls() {
    var toggle = document.getElementById("hpGarbToggle");
    var drawer = document.getElementById("hpGarbDrawer");
    if (!toggle || !drawer) return false;

    hpRestoreWorkshopState();
    hpBuildGarbMenu();

    if (toggle.getAttribute("data-hp-bound") !== "true") {
      toggle.setAttribute("data-hp-bound", "true");
      toggle.addEventListener("click", function () {
        window.__hpGarbOpen = window.__hpGarbOpen !== true;
        hpApplyGarbOpenState();
        hpSaveWorkshopState();
      });
    }

    hpApplyGarbOpenState();
    hpRefreshGarbMenu();
    return true;
  }

  // === HEREIN MAY YE TEST EACH COURTLY ENCOUNTER ===
  function hpSetSelectedSceneIds(ids) {
    var validIds = ids.filter(function (id) {
      return Object.prototype.hasOwnProperty.call(HP_PARTNER_SCENES, id);
    });

    window.__hpSelectedSceneIds = Array.from(new Set(validIds));
    window.__hpCompositionResolved = null;
    hpSaveWorkshopState();
    hpRefreshSceneMenu();
  }

  function hpToggleSceneId(id) {
    var selected = hpValidSelectedSceneIds();
    var index = selected.indexOf(id);

    if (index >= 0) {
      selected.splice(index, 1);
    } else {
      selected.push(id);
    }

    hpSetSelectedSceneIds(selected);
  }

  function hpIdsForFilter(filterName) {
    if (filterName === "all") return hpSceneIds();

    return hpSceneIds().filter(function (id) {
      var scene = HP_PARTNER_SCENES[id];
      if (filterName === "rear") return scene.cameraGroup === "rear";
      return scene.group === filterName;
    });
  }

  function hpToggleSceneFilter(filterName) {
    var selected = hpValidSelectedSceneIds();
    var selectedSet = new Set(selected);
    var groupIds = hpIdsForFilter(filterName);
    var allGroupSelected = groupIds.every(function (id) {
      return selectedSet.has(id);
    });

    groupIds.forEach(function (id) {
      if (allGroupSelected) {
        selectedSet.delete(id);
      } else {
        selectedSet.add(id);
      }
    });

    hpSetSelectedSceneIds(Array.from(selectedSet));
  }

  function hpRefreshSceneMenu() {
    var menu = document.getElementById("hpSceneMenu");
    if (!menu) return;

    var selected = hpValidSelectedSceneIds();
    var selectedSet = new Set(selected);
    var status = menu.querySelector(".hpTestingStatus");

    if (status) {
      status.textContent = selected.length
        ? selected.length + (selected.length === 1 ? " is" : " are") + " marked; Fate shall choose amongst " + (selected.length === 1 ? "it." : "them.")
        : "None are marked; Fate may choose from the whole lot.";
    }

    menu.querySelectorAll("[data-hp-scene-id]").forEach(function (button) {
      var isSelected = selectedSet.has(button.getAttribute("data-hp-scene-id"));
      button.classList.toggle("is-selected", isSelected);
      button.setAttribute("aria-pressed", isSelected ? "true" : "false");
    });

    menu.querySelectorAll("[data-hp-scene-filter]").forEach(function (button) {
      var filterName = button.getAttribute("data-hp-scene-filter");
      var groupIds = hpIdsForFilter(filterName);
      var isSelected = groupIds.length > 0 && groupIds.every(function (id) {
        return selectedSet.has(id);
      });
      button.classList.toggle("is-selected", isSelected);
      button.setAttribute("aria-pressed", isSelected ? "true" : "false");
    });
  }

  function hpCreateButton(label, className) {
    var button = document.createElement("button");
    button.type = "button";
    button.className = className;
    button.textContent = label;
    button.setAttribute("aria-pressed", "false");
    return button;
  }

  function hpBuildSceneMenu() {
    var menu = document.getElementById("hpSceneMenu");
    if (!menu || menu.getAttribute("data-hp-built") === "true") return;

    menu.setAttribute("data-hp-built", "true");

    var status = document.createElement("p");
    status.className = "hpTestingStatus";
    menu.appendChild(status);

    var groupControls = document.createElement("div");
    groupControls.className = "hpTestingGroupControls";

    [
      ["all", "The Whole Court"],
      ["gentle", "Tender Dealings"],
      ["dramatic", "Courtly Tumult"],
      ["rear", "Rearward Affairs"]
    ].forEach(function (item) {
      var button = hpCreateButton(item[1], "hpTestingFilterButton");
      button.setAttribute("data-hp-scene-filter", item[0]);
      button.addEventListener("click", function () {
        hpToggleSceneFilter(item[0]);
      });
      groupControls.appendChild(button);
    });

    menu.appendChild(groupControls);

    [
      ["gentle", "Tender Encounters"],
      ["dramatic", "Dramatic Entanglements"]
    ].forEach(function (sectionInfo) {
      var section = document.createElement("section");
      section.className = "hpTestingSection";

      var title = document.createElement("div");
      title.className = "hpTestingSectionTitle";
      title.textContent = sectionInfo[1];
      section.appendChild(title);

      var grid = document.createElement("div");
      grid.className = "hpTestingButtonGrid";

      hpSceneIds().forEach(function (id) {
        var scene = HP_PARTNER_SCENES[id];
        if (scene.group !== sectionInfo[0]) return;

        var button = hpCreateButton(scene.label, "hpTestingChoiceButton");
        button.setAttribute("data-hp-scene-id", id);
        button.addEventListener("click", function () {
          hpToggleSceneId(id);
        });
        grid.appendChild(button);
      });

      section.appendChild(grid);
      menu.appendChild(section);
    });

    hpRefreshSceneMenu();
  }

  // === OF YE TWO GREAT TOGGLES AND THEIR OBEDIENCE ===
  function hpInitializeCompositionControls() {
    var sceneSelect = document.querySelector('select[data-name="scene_mode"]');
    var sceneButton = document.getElementById("hpSceneToggle");
    var poseButton = document.getElementById("hpPoseToggle");
    var control = document.getElementById("hpCompositionControl");

    if (!sceneSelect || !sceneButton || !poseButton || !control) return false;

    hpRestoreWorkshopState();

    window.__hpSelectedSceneIds = hpValidSelectedSceneIds();
    window.__hpSelectedPoseIds = hpValidSelectedPoseIds();
    window.__hpSelectedNormalPoseIds = hpValidSelectedNormalPoseIds();
    window.__hpSelectedOutfitIds = hpValidSelectedOutfitIds();

    var title = document.querySelector("h1, .page-title, .header h1");
    if (title && title.parentNode && control.previousElementSibling !== title) {
      title.insertAdjacentElement("afterend", control);
    }

    hpBuildSceneMenu();
    hpBuildPoseMenu();

    function refreshButtons() {
      var sceneEnabled = sceneSelect.value === "on";
      var poseEnabled = window.__hpPoseMode === "on";

      sceneButton.textContent = sceneEnabled ? "Courtly Companie: Aye" : "Courtly Companie: Nay";
      sceneButton.classList.toggle("is-on", sceneEnabled);
      sceneButton.setAttribute("aria-pressed", sceneEnabled ? "true" : "false");

      poseButton.textContent = poseEnabled ? "Perilous Postures: Aye" : "Perilous Postures: Nay";
      poseButton.classList.toggle("is-on", poseEnabled);
      poseButton.setAttribute("aria-pressed", poseEnabled ? "true" : "false");
    }

    if (sceneButton.getAttribute("data-hp-bound") !== "true") {
      sceneButton.setAttribute("data-hp-bound", "true");

      sceneButton.addEventListener("click", function () {
        sceneSelect.value = sceneSelect.value === "on" ? "off" : "on";
        sceneSelect.dispatchEvent(new Event("input", { bubbles: true }));
        sceneSelect.dispatchEvent(new Event("change", { bubbles: true }));
        window.__hpCompositionResolved = null;
        refreshButtons();
      });

      sceneSelect.addEventListener("change", function () {
        window.__hpCompositionResolved = null;
        refreshButtons();
      });
    }

    if (poseButton.getAttribute("data-hp-bound") !== "true") {
      poseButton.setAttribute("data-hp-bound", "true");

      poseButton.addEventListener("click", function () {
        window.__hpPoseMode = window.__hpPoseMode === "on" ? "off" : "on";
        window.__hpCompositionResolved = null;
        hpSaveWorkshopState();
        refreshButtons();
      });
    }

    refreshButtons();
    hpRefreshSceneMenu();
    hpRefreshPoseMenu();
    hpSaveWorkshopState();
    return true;
  }

  var attempts = 0;
  var timer = setInterval(function () {
    attempts += 1;

    var compositionReady = hpInitializeCompositionControls();
    var garbReady = hpInitializeGarbControls();

    if ((compositionReady && garbReady) || attempts >= 60) {
      clearInterval(timer);
    }
  }, 100);
})();
</script>


<script id="hpRoyalThemeMachinations">
(function () {
  "use strict";

  // === HEREIN IS YE MOSTE QUESTIONABLE SUBTITLE SET BENEATH THE TITLE ===
  function hpInstallSubtitle() {
    var title = document.querySelector('[id^="pageTitleEl"]');
    if (!title) return false;
    if (document.getElementById("hpRoyalSubtitle")) return true;

    try {
      warningSeen = localStorage.getItem(warningSeenKey) === "true";

    if (warning && warningSeen) {
      warning.style.display = "none";

    if (accept && accept.getAttribute("data-hp-bound") !== "true") {
      accept.setAttribute("data-hp-bound", "true");
      accept.addEventListener("click", function () {

  // === BANISH YE PROMPT REVEALS, FEEDBACK, YE OLD RETURN, AND OTHER UNWANTED WORDING ===

    );

    if (!style) {
      style = document.createElement("style");
      style.id = "hpPromptShieldStyles";

    document

  function hpTendFrameworkButtons() {
    hpHidePromptViewButtons();

    document.querySelectorAll("button, a").forEach(function (el) {
      var text = (el.textContent || "").trim().toLowerCase();

      if (text === "feedback" || text.indexOf("feedback") !== -1) {
        el.style.setProperty("display", "none", "important");
      }

      if (text === "↖" || text === "⇱" || text === "↥") {
        el.style.setProperty("display", "none", "important");
      }

      if (text === "private gallery" || text === "🛡 private gallery") {
        el.textContent = "🛡 Ye Privie Gallery";
      }

  // === KEEP YE FLAT THEME AWAKE AS THE FRAMEWORK BUILDETH ITSELF ===
  function hpOrderRoyalHeader() {
    var title = document.querySelector('[id^="pageTitleEl"]');
    var subtitle = document.getElementById("hpRoyalSubtitle");
    var control = document.getElementById("hpCompositionControl");

    if (title && subtitle && subtitle.previousElementSibling !== title) {
      title.insertAdjacentElement("afterend", subtitle);
    }

    if (subtitle && control && control.previousElementSibling !== subtitle) {
      subtitle.insertAdjacentElement("afterend", control);
    }
  }

  // === LET YE GARB REST ABOVE THE GALLERY, THEN DOCK UNTO THE VIEWPORT ===
  var hpGarbDockBound = false;
  var hpGarbDockFrame = 0;

  function hpGarbPinThreshold() {
    return window.matchMedia("(max-width: 700px)").matches ? 4 : 6;
  }

  function hpUpdateGarbDock() {
    hpGarbDockFrame = 0;

    var anchor = document.getElementById("hpGarbFlowAnchor");
    var garb = document.getElementById("hpGarbControl");
    if (!anchor || !garb) return;

    var measuredHeight = Math.ceil(garb.offsetHeight || 34);
    anchor.style.minHeight = measuredHeight + "px";

    var shouldPin =
      anchor.getBoundingClientRect().top <= hpGarbPinThreshold();

    garb.classList.toggle("hpGarbIsPinned", shouldPin);
  }

  function hpScheduleGarbDockUpdate() {
    if (hpGarbDockFrame) return;

    hpGarbDockFrame = window.requestAnimationFrame(
      hpUpdateGarbDock
    );
  }

  function hpBindGarbDock() {
    if (hpGarbDockBound) return;
    hpGarbDockBound = true;

    window.addEventListener(
      "scroll",
      hpScheduleGarbDockUpdate,
      { passive: true }
    );

    window.addEventListener(
      "resize",
      hpScheduleGarbDockUpdate,
      { passive: true }
    );

    if (window.visualViewport) {
      window.visualViewport.addEventListener(
        "resize",
        hpScheduleGarbDockUpdate,
        { passive: true }
      );
    }
  }

  function hpPlaceGarbInGalleryFlow() {
    var garb = document.getElementById("hpGarbControl");
    if (!garb) return false;

    var anchor = document.getElementById("hpGarbFlowAnchor");

    if (!anchor) {
      anchor = document.createElement("div");
      anchor.id = "hpGarbFlowAnchor";
      anchor.setAttribute("aria-hidden", "true");
    }

    var firstImage = document.querySelector(".t2i-image-ctn");

    if (
      firstImage &&
      firstImage.parentElement &&
      firstImage.parentElement.parentNode
    ) {
      var gallery = firstImage.parentElement;
      var galleryParent = gallery.parentNode;

      if (
        anchor.parentNode !== galleryParent ||
        anchor.nextElementSibling !== gallery
      ) {
        galleryParent.insertBefore(anchor, gallery);
      }
    } else {
      var generateButton = document.getElementById("generateButtonEl");
      var generateBlock = generateButton
        ? (generateButton.closest(".input-ctn") || generateButton.parentElement)
        : null;

      if (generateBlock && generateBlock.parentNode) {
        if (
          anchor.parentNode !== generateBlock.parentNode ||
          generateBlock.nextElementSibling !== anchor
        ) {
          generateBlock.insertAdjacentElement("afterend", anchor);
        }
      } else {
        return false;
      }
    }

    if (garb.parentNode !== anchor) {
      anchor.appendChild(garb);
    }

    hpBindGarbDock();
    hpScheduleGarbDockUpdate();
    return true;
  }

  function hpApplyRoyalTheme() {
    hpInstallSubtitle();
    hpOrderRoyalHeader();
    hpPlaceGarbInGalleryFlow();
    hpBindRoyalCommands();
    hpTendFrameworkButtons();
  }

  hpApplyRoyalTheme();

  var attempts = 0;
  var timer = setInterval(function () {
    attempts += 1;
    hpApplyRoyalTheme();
    if (attempts >= 50) clearInterval(timer);
  }, 120);

  var observer = new MutationObserver(function () {
    hpApplyRoyalTheme();
  });

  if (document.body) {
    observer.observe(document.body, { childList: true, subtree: true });
  }
})();
</script>

<script id="hpWholeCrownPressPatchScript">
(function () {
  "use strict";

  var crown = document.getElementById("hpFloatingGenerate");
  if (!crown) return;

  var wholeCrown = crown.closest(".hpRoyalRingLarge");
  if (!wholeCrown) return;

  var releaseTimer = null;
  var pressStartedAt = 0;
  var minimumPressLength =900;

  function beginWholeCrownPress() {
    window.clearTimeout(releaseTimer);
    pressStartedAt = Date.now();
    wholeCrown.classList.add("hpCrownIsPressed");
  }

  function endWholeCrownPress() {
    var elapsed = Date.now() - pressStartedAt;
    var remaining = Math.max(0, minimumPressLength - elapsed);

    window.clearTimeout(releaseTimer);
    releaseTimer = window.setTimeout(function () {
      wholeCrown.classList.remove("hpCrownIsPressed");
    }, remaining);
  }

  crown.addEventListener("pointerdown", beginWholeCrownPress);
  crown.addEventListener("pointerup", endWholeCrownPress);
  crown.addEventListener("pointercancel", endWholeCrownPress);
  crown.addEventListener("lostpointercapture", endWholeCrownPress);

  crown.addEventListener("keydown", function (event) {
    if (event.key === "Enter" || event.key === " ") {
      beginWholeCrownPress();
    }
  });

  crown.addEventListener("keyup", function (event) {
    if (event.key === "Enter" || event.key === " ") {
      endWholeCrownPress();
    }
  });

  crown.addEventListener("blur", endWholeCrownPress);

  crown.addEventListener("click", function () {
    if (!wholeCrown.classList.contains("hpCrownIsPressed")) {
      beginWholeCrownPress();
      endWholeCrownPress();
    }
  });
})();
</script>

<style id="hpTrueTitleAndExclusiveModesStyles">

<script id="hpTrueTitleAndExclusiveModesScript">
(function () {
  "use strict";

  var titleNode = null;
  var titleText = "";
  var workshopStateKey = "handsomeCloneWorkshopState_v1";

  // === KEEP THE ORIGINAL TITLE NODE ABOVE THE SUBTITLE ===
  function hpRememberTrueTitle() {
    var foundTitle = document.querySelector(
      '[id^="pageTitleEl"]'
    );

    if (foundTitle) {
      titleNode = foundTitle;

      var foundText =
        (foundTitle.textContent || "").trim();

      if (foundText) {
        titleText = foundText;
      }
    }

    return titleNode;
  }

  function hpKeepTrueTitleInPlace() {
    var title = hpRememberTrueTitle();
    var subtitle = document.getElementById(
      "hpRoyalSubtitle"
    );
    var controls = document.getElementById(
      "hpCompositionControl"
    );

    if (!title || !subtitle || !subtitle.parentNode) {
      return;
    }

    if (
      !(title.textContent || "").trim() &&
      titleText
    ) {
      title.textContent = titleText;
    }

    title.style.setProperty(
      "display",
      "block",
      "important"
    );
    title.style.setProperty(
      "visibility",
      "visible",
      "important"
    );
    title.style.setProperty(
      "opacity",
      "1",
      "important"
    );
    title.style.setProperty(
      "max-height",
      "none",
      "important"
    );
    title.style.setProperty(
      "overflow",
      "visible",
      "important"
    );

    var parent = subtitle.parentNode;

    if (
      title.parentNode !== parent ||
      title.nextElementSibling !== subtitle
    ) {
      parent.insertBefore(title, subtitle);
    }

    if (
      controls &&
      (
        controls.parentNode !== parent ||
        subtitle.nextElementSibling !== controls
      )
    ) {
      subtitle.insertAdjacentElement(
        "afterend",
        controls
      );
    }
  }

  // === SAVE THE POSTURE MODE WITHOUT DISTURBING OTHER STATE ===
  function hpSaveExclusivePoseMode() {
    try {
      var saved = JSON.parse(
        localStorage.getItem(workshopStateKey) ||
        "{}"
      );

      saved.poseMode =
        window.__hpPoseMode === "on"
          ? "on"
          : "off";

      localStorage.setItem(
        workshopStateKey,
        JSON.stringify(saved)
      );
    } catch (error) {}
  }

  function hpRefreshExclusiveButtons() {
    var sceneSelect = document.querySelector(
      'select[data-name="scene_mode"]'
    );
    var sceneButton = document.getElementById(
      "hpSceneToggle"
    );
    var poseButton = document.getElementById(
      "hpPoseToggle"
    );

    if (
      !sceneSelect ||
      !sceneButton ||
      !poseButton
    ) {
      return;
    }

    var sceneEnabled =
      sceneSelect.value === "on";
    var poseEnabled =
      window.__hpPoseMode === "on";

    sceneButton.textContent = sceneEnabled
      ? "Courtly Companie: Aye"
      : "Courtly Companie: Nay";

    sceneButton.classList.toggle(
      "is-on",
      sceneEnabled
    );

    sceneButton.setAttribute(
      "aria-pressed",
      sceneEnabled ? "true" : "false"
    );

    poseButton.textContent = poseEnabled
      ? "Perilous Postures: Aye"
      : "Perilous Postures: Nay";

    poseButton.classList.toggle(
      "is-on",
      poseEnabled
    );

    poseButton.setAttribute(
      "aria-pressed",
      poseEnabled ? "true" : "false"
    );
  }

  // === LET THE ORIGINAL HANDLERS RUN, THEN TURN OFF THE OTHER MODE ===
  function hpBindExclusiveModes() {
    var sceneSelect = document.querySelector(
      'select[data-name="scene_mode"]'
    );
    var sceneButton = document.getElementById(
      "hpSceneToggle"
    );
    var poseButton = document.getElementById(
      "hpPoseToggle"
    );

    if (
      !sceneSelect ||
      !sceneButton ||
      !poseButton
    ) {
      return false;
    }

    if (
      sceneButton.getAttribute(
        "data-hp-exclusive-bound"
      ) !== "true"
    ) {
      sceneButton.setAttribute(
        "data-hp-exclusive-bound",
        "true"
      );

      sceneButton.addEventListener(
        "click",
        function () {
          var turningOn =
            sceneSelect.value !== "on";

          setTimeout(function () {
            if (turningOn) {
              window.__hpPoseMode = "off";
              window.__hpCompositionResolved =
                null;

              hpSaveExclusivePoseMode();
            }

            hpRefreshExclusiveButtons();
          }, 0);
        },
        true
      );
    }

    if (
      poseButton.getAttribute(
        "data-hp-exclusive-bound"
      ) !== "true"
    ) {
      poseButton.setAttribute(
        "data-hp-exclusive-bound",
        "true"
      );

      poseButton.addEventListener(
        "click",
        function () {
          var turningOn =
            window.__hpPoseMode !== "on";

          setTimeout(function () {
            if (turningOn) {
              sceneSelect.value = "off";
              window.__hpCompositionResolved =
                null;

              sceneSelect.dispatchEvent(
                new Event("input", {
                  bubbles: true
                })
              );

              sceneSelect.dispatchEvent(
                new Event("change", {
                  bubbles: true
                })
              );

              hpSaveExclusivePoseMode();
            }

            hpRefreshExclusiveButtons();
          }, 0);
        },
        true
      );
    }

    if (
      sceneSelect.value === "on" &&
      window.__hpPoseMode === "on"
    ) {
      window.__hpPoseMode = "off";
      window.__hpCompositionResolved = null;

      hpSaveExclusivePoseMode();
    }

    hpRefreshExclusiveButtons();
    return true;
  }

  function hpProtectTitleAfterGeneration() {
    [
      0,
      50,
      150,
      300,
      600,
      1000,
      1600,
      2500,
      4000,
      6000
    ].forEach(function (delay) {
      setTimeout(
        hpKeepTrueTitleInPlace,
        delay
      );
    });
  }

  function hpInitializeFinalPatch() {
    hpRememberTrueTitle();
    hpKeepTrueTitleInPlace();
    return hpBindExclusiveModes();
  }

  hpInitializeFinalPatch();

  var attempts = 0;
  var setupTimer = setInterval(function () {
    attempts += 1;

    var ready = hpInitializeFinalPatch();

    if (ready || attempts >= 60) {
      clearInterval(setupTimer);
    }
  }, 100);

  document.addEventListener(
    "click",
    function (event) {
      var target = event.target;

      if (!(target instanceof Element)) {
        return;
      }

      var generateButton = target.closest(
        "#hpFloatingGenerate, #generateButtonEl"
      );

      if (!generateButton) {
        return;
      }

      hpProtectTitleAfterGeneration();
    },
    true
  );
})();
</script>

    if (!header || !menu) return false;

var randomButton = hpCreateGlobalButton(

);

.hpPortraitPrimaryControl
.input-wrapper {
  width: 100% !important;
}

[id^="userInputsCtn"].hpRoyalTwoControlRow
.hpPortraitPrimaryControl
select,
[id^="userInputsCtn"].hpRoyalTwoControlRow
.hpPortraitPrimaryControl
input {
  width: 100% !important;
  max-width: none !important;
  box-sizing: border-box !important;
}
</style>

<script id="hpTwoControlPortraitRowScript">
(function () {
  "use strict";

  function hpFindControlByLabel(row, labelText) {
    var targetText =
      String(labelText || "").toLowerCase();

    return Array.from(
      row.querySelectorAll(".input-ctn")
    ).find(function (control) {
      var label =
        control.querySelector(".input-label");

      var currentText = label
        ? (label.textContent || "")
            .trim()
            .toLowerCase()
        : "";

      return currentText.indexOf(
        targetText
      ) !== -1;
    }) || null;
  }

  function hpForceProperSquare(shapeControl) {
    if (!shapeControl) return;

    var select =
      shapeControl.querySelector("select");

    if (!select) return;

    var squareOption = Array.from(
      select.options
    ).find(function (option) {
      return (
        (option.textContent || "")
          .trim()
          .toLowerCase() ===
        "proper square"
      );
    });

    if (!squareOption) {
      squareOption = Array.from(
        select.options
      ).find(function (option) {
        return (
          (option.textContent || "")
            .trim()
            .toLowerCase()
            .indexOf("square") !== -1
        );
      });
    }

    if (
      squareOption &&
      select.value !== squareOption.value
    ) {
      select.value = squareOption.value;

      select.dispatchEvent(
        new Event("input", {
          bubbles: true
        })
      );

      select.dispatchEvent(
        new Event("change", {
          bubbles: true
        })
      );
    }
  }

  function hpClearHiddenSeed(seedControl) {
    if (!seedControl) return;

    var seedInput =
      seedControl.querySelector(
        "input, textarea"
      );

    if (
      seedInput &&
      seedInput.value !== ""
    ) {
      seedInput.value = "";

      seedInput.dispatchEvent(
        new Event("input", {
          bubbles: true
        })
      );

      seedInput.dispatchEvent(
        new Event("change", {
          bubbles: true
        })
      );
    }
  }

  function hpApplyTwoControlPortraitRow() {
    var row = document.querySelector(
      '[id^="userInputsCtn"]'
    );

    if (!row) return false;

    var portraitControl =
      hpFindControlByLabel(
        row,
        "no. of portraits"
      );

    var shapeControl =
      hpFindControlByLabel(
        row,
        "shape of ye portrait"
      );

    var strengthControl =
      hpFindControlByLabel(
        row,
        "spell strength"
      );

    var seedControl =
      hpFindControlByLabel(
        row,
        "seed of fate"
      );

    hpForceProperSquare(shapeControl);
    hpClearHiddenSeed(seedControl);

    if (shapeControl) {
      shapeControl.classList.add(
        "hpHiddenPortraitControl"
      );
    }

    if (seedControl) {
      seedControl.classList.add(
        "hpHiddenPortraitControl"
      );
    }

    if (portraitControl) {
      portraitControl.classList.add(
        "hpPortraitPrimaryControl"
      );
    }

    if (strengthControl) {
      strengthControl.classList.add(
        "hpPortraitPrimaryControl"
      );
    }

    row.classList.add(
      "hpRoyalTwoControlRow"
    );

    return !!(
      portraitControl &&
      shapeControl &&
      strengthControl &&
      seedControl
    );
  }

  hpApplyTwoControlPortraitRow();

  var attempts = 0;

  var setupTimer = setInterval(function () {
    attempts += 1;

    var ready =
      hpApplyTwoControlPortraitRow();

    if (ready || attempts >= 80) {
      clearInterval(setupTimer);
    }
  }, 100);

  var observer = new MutationObserver(
    function () {
      hpApplyTwoControlPortraitRow();
    }
  );

  if (document.body) {
    observer.observe(document.body, {
      childList: true,
      subtree: true
    });
  }

  document.addEventListener(
    "click",
    function (event) {
      var target = event.target;

      if (!(target instanceof Element)) {
        return;
      }

      if (
        target.closest(
          "#generateButtonEl, " +
          "#hpFloatingGenerate, " +
          "#shareSettingsBtn758374"
        )
      ) {
        hpApplyTwoControlPortraitRow();
      }
    },
    true
  );
})();
</script>

</body>
</html>
