  pick(key, depth) {

    if (!arr || !arr.length) return "{" + key + "}";
    let item = this.weightedPick(arr);
    return item.replace(/\{(\w+)\}/g, (_, k) => this.pick(k, depth + 1));
  },

  setIntensity(val) {

    statusEl.textContent = "Intensity set to " + val;

  // ------------------------------------------------------------------

  generate(type) {

    if (type === "character") {

  stopGeneration() {
    if (this.currentPromise && this.currentPromise.stop) {

  // ------------------------------------------------------------------

  display(text, type) {
    emptyEl.hidden = true;

    copyBtn.hidden = false;
    imageCtn.hidden = true;

    this.renderHistory();

  renderHistory() {
    historyCtn.innerHTML = this.history.map((h, i) =>

  restore(i) {
    let h = this.history[i];
    if (!h) return;
    this.currentText = h.full;
    emptyEl.hidden = true;
    resultEl.hidden = false;
    copyBtn.hidden = false;
    imageCtn.hidden = true;
    imageCtn.innerHTML = "";
    resultEl.textContent = h.full;
    statusEl.textContent = "Restored — " + new Date().toLocaleTimeString();
  },

      let saved = await kv.nsfwPlugin.get("history");
      if (saved && Array.isArray(saved)) {
        this.history = saved.slice(0, this.maxHistory);
        this.renderHistory();
      }
    } catch (e) { /* noop */ }
  },
