<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>6uf6fdra4j — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<div id="gameContainer" style="position:relative; width:100vw; height:100vh; background:#001e2d; overflow:hidden; font-family:sans-serif; user-select:none;">
  
  <canvas id="gameCanvas" style="display:block;"></canvas>

  <!-- HUD -->
  <div id="hudLayer" hidden style="position:absolute; top:20px; left:20px; color:white; pointer-events:none;">
    <div style="display:flex; flex-direction:column; gap:5px;">
      <div>
        <span style="font-size:14px; opacity:0.7;">BIOMASS</span>
        <div style="width:200px; height:10px; background:rgba(0,0,0,0.5); border-radius:5px; overflow:hidden;">
          <div id="biomassBar" style="width:10%; height:100%; background:#4ade80; transition:width 0.2s;"></div>
        </div>
      </div>
      <div>
        <span style="font-size:14px; opacity:0.7;">DNA</span>
        <div id="dnaDisplay" style="font-size:20px; font-weight:bold; color:#60a5fa;">0</div>
      </div>
      <div id="evoBtn" style="pointer-events:auto; margin-top:10px; background:#fbbf24; color:black; padding:8px 16px; border-radius:4px; font-weight:bold; cursor:pointer; display:none; text-align:center; box-shadow:0 4px 0 #b45309;" onclick="enterEditor()">EVOLVE</div>
    </div>
  </div>

  <!-- Start Screen -->
  <div id="menuLayer" style="position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:rgba(0,0,0,0.7); color:white; z-index:10;">
    <h1 style="font-size:4rem; margin:0; text-shadow:0 0 20px #4ade80; letter-spacing:5px;">ABYSS OF ORIGINS</h1>
    <p style="max-width:600px; text-align:center; line-height:1.5; opacity:0.8; margin-bottom:40px;">
      Eat to grow. Avoid predators. Mutate to survive.<br>
      <span style="color:#4ade80">Plants</span> are safe. <span style="color:#f87171">Meat</span> is risky but nutritious.
    </p>
    <button id="startBtn" style="padding:15px 40px; font-size:1.5rem; background:#4ade80; border:none; border-radius:8px; cursor:pointer; font-weight:bold; color:#064e3b; box-shadow:0 5px 0 #166534; transition:transform 0.1s;" onclick="startGame()">SPAWN</button>
  </div>

  <!-- Editor Screen -->
  <div id="editorLayer" hidden style="position:absolute; inset:0; background:rgba(0,20,30,0.95); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:20;">
    <h2 style="color:#fbbf24; margin-top:0;">MUTATION LAB</h2>
    <div style="position:relative; width:300px; height:300px; margin:20px; background:rgba(255,255,255,0.05); border-radius:50%; border:1px dashed rgba(255,255,255,0.2); display:flex; align-items:center; justify-content:center;">
      <canvas id="editorCanvasEl" width="300" height="300"></canvas>
    </div>
    
    <div style="display:flex; gap:10px; flex-wrap:wrap; justify-content:center; max-width:600px;">
      <!-- Part Buttons generated by JS -->
    </div>
    
    <div id="partListEl" style="display:flex; gap:10px; margin:20px;"></div>

    <div style="margin-top:20px;">
      <button id="resumeBtn" style="padding:10px 30px; font-size:1.2rem; background:#60a5fa; color:white; border:none; border-radius:5px; cursor:pointer;" onclick="exitEditor()">CONTINUE SURVIVAL</button>
    </div>
  </div>

  <!-- Game Over Screen -->
  <div id="gameOverLayer" hidden style="position:absolute; inset:0; background:rgba(50,0,0,0.8); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:30;">
    <h1 style="font-size:3rem; color:#f87171;">EXTINCT</h1>
    <p id="finalScore" style="font-size:1.5rem; margin-bottom:20px;"></p>
    <button onclick="location.reload()" style="padding:15px 30px; background:white; border:none; cursor:pointer; font-size:1.2rem;">TRY AGAIN</button>
  </div>

</div>

<script>
/* --- GAME ENGINE & STATE --- */
const canvas = gameCanvas;
const ctx = canvas.getContext('2d');
const editorCanvas = editorCanvasEl;
const eCtx = editorCanvas.getContext('2d');

let width, height;
const resize = () => { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; };
window.addEventListener('resize', resize);
resize();

// Game Constants
const WORLD_SIZE = 4000;
const CAMERA_LERP = 0.1;

// State
let gameRunning = false;
let lastTime = 0;
let mouse = { x: 0, y: 0, down: false };
let camera = { x: 0, y: 0, zoom: 1, targetZoom: 1 };

// Player Definition
let player = {
  x: 0, y: 0, 
  vx: 0, vy: 0, 
  angle: 0,
  radius: 20,
  color: { r: 74, g: 222, b: 128 }, // Green initially
  hp: 100, maxHp: 100,
  dna: 0, biomass: 0,
  speed: 2,
  turnSpeed: 0.08,
  diet: { plant: 0, meat: 0 },
  // Parts: 'front', 'rear', 'left', 'right'
  parts: { front: 'mouth', rear: null, left: null, right: null } 
};

// Entities
let entities = [];
let particles = [];

/* --- INPUT --- */
window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
window.addEventListener('mousedown', () => mouse.down = true);
window.addEventListener('mouseup', () => mouse.down = false);

/* --- UTILS --- */
const rand = (min, max) => Math.random() * (max - min) + min;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const clamp = (v, min, max) => Math.min(Math.max(v, min), max);

/* --- CLASSES --- */

class Entity {
  constructor(type, x, y, radius) {
    this.type = type; // 'food_plant', 'food_meat', 'enemy_herb', 'enemy_carn'
    this.x = x;
    this.y = y;
    this.radius = radius;
    this.vx = rand(-0.5, 0.5);
    this.vy = rand(-0.5, 0.5);
    this.angle = rand(0, Math.PI * 2);
    this.dead = false;
    this.hp = type.startsWith('enemy') ? radius * 2 : 1;
    
    // Visual variation
    this.colorOffset = rand(-20, 20);
    if (type === 'food_plant') this.color = `rgb(${74 + this.colorOffset}, ${222 + this.colorOffset}, 128)`;
    if (type === 'food_meat') this.color = `rgb(${248 + this.colorOffset}, ${113 - this.colorOffset}, 113)`;
    if (type === 'enemy_herb') this.color = `rgb(100, 200, 255)`;
    if (type === 'enemy_carn') this.color = `rgb(255, 100, 100)`;
    
    this.parts = { front: 'mouth', rear: null, left: null, right: null };
    if (type === 'enemy_carn') {
      this.parts.front = 'spike';
      this.speed = 2.2;
    } else {
      this.speed = 1.5;
    }
  }

  update(dt) {
    // Simple physics
    this.x += this.vx;
    this.y += this.vy;
    this.angle += rand(-0.05, 0.05);

    // Wrap world
    if (this.x < -WORLD_SIZE) this.x = WORLD_SIZE;
    if (this.x > WORLD_SIZE) this.x = -WORLD_SIZE;
    if (this.y < -WORLD_SIZE) this.y = WORLD_SIZE;
    if (this.y > WORLD_SIZE) this.y = -WORLD_SIZE;

    // AI
    if (this.type.startsWith('enemy')) {
      let d = dist(this, player);
      if (d < 400) {
        let targetX = player.x;
        let targetY = player.y;
        
        // Herbivores flee, Carnivores chase
        if (this.type === 'enemy_herb' && player.radius > this.radius) {
          targetX = this.x - (player.x - this.x);
          targetY = this.y - (player.y - this.y);
        } else if (this.type === 'enemy_carn' || player.radius < this.radius) {
          // Chase logic
        }

        let desiredAngle = Math.atan2(targetY - this.y, targetX - this.x);
        // Smooth turn
        let diff = desiredAngle - this.angle;
        while (diff < -Math.PI) diff += Math.PI * 2;
        while (diff > Math.PI) diff -= Math.PI * 2;
        this.angle += clamp(diff, -0.05, 0.05);
        
        this.vx += Math.cos(this.angle) * 0.1;
        this.vy += Math.sin(this.angle) * 0.1;
      }
      
      // Friction
      this.vx *= 0.98;
      this.vy *= 0.98;
      
      // Cap speed
      let speed = Math.hypot(this.vx, this.vy);
      if (speed > this.speed) {
        this.vx = (this.vx / speed) * this.speed;
        this.vy = (this.vy / speed) * this.speed;
      }
    }
  }

  draw(ctx, camX, camY) {
    let screenX = (this.x - camX) * camera.zoom + width / 2;
    let screenY = (this.y - camY) * camera.zoom + height / 2;
    let r = this.radius * camera.zoom;

    if (screenX < -r || screenX > width + r || screenY < -r || screenY > height + r) return;

    ctx.save();
    ctx.translate(screenX, screenY);
    ctx.rotate(this.angle);

    // Body
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fillStyle = this.color;
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Draw parts
    drawCellParts(ctx, r, this.parts);

    // Eye (simple)
    ctx.fillStyle = 'white';
    ctx.beginPath();
    ctx.arc(r * 0.4, -r * 0.3, r * 0.25, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'black';
    ctx.beginPath();
    ctx.arc(r * 0.5, -r * 0.3, r * 0.1, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }
}

class Particle {
  constructor(x, y, color) {
    this.x = x; this.y = y;
    this.color = color;
    this.life = 1.0;
    this.vx = rand(-2, 2);
    this.vy = rand(-2, 2);
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life -= 0.02;
  }
  draw(ctx, cx, cy) {
    let sx = (this.x - cx) * camera.zoom + width / 2;
    let sy = (this.y - cy) * camera.zoom + height / 2;
    ctx.globalAlpha = this.life;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(sx, sy, 2 * camera.zoom, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

/* --- RENDER HELPERS --- */
function drawCellParts(ctx, r, parts) {
  // Helper to draw specific parts based on slot
  const drawSpike = (offsetAngle) => {
    ctx.fillStyle = '#555';
    ctx.beginPath();
    ctx.moveTo(r, 0);
    ctx.lineTo(r * 1.8, -r * 0.3);
    ctx.lineTo(r * 1.8, r * 0.3);
    ctx.fill();
  };
  
  const drawJet = (offsetAngle) => {
    ctx.fillStyle = '#fbbf24';
    ctx.beginPath();
    ctx.moveTo(-r * 0.8, -r * 0.4);
    ctx.lineTo(-r * 1.4, 0);
    ctx.lineTo(-r * 0.8, r * 0.4);
    ctx.fill();
  };

  const drawMouth = (offsetAngle) => {
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(r * 0.8, 0, r * 0.3, 0, Math.PI * 2);
    ctx.fill();
    // Teeth
    ctx.fillStyle = 'white';
    ctx.beginPath();
    ctx.moveTo(r * 0.7, -r * 0.1);
    ctx.lineTo(r * 0.9, -r * 0.2);
    ctx.lineTo(r * 0.9, 0);
    ctx.fill();
  };

  // Draw parts based on configuration
  // Front (0)
  if (parts.front === 'spike') drawSpike(0);
  if (parts.front === 'mouth') drawMouth(0);
  
  // Rear (PI)
  ctx.save();
  ctx.rotate(Math.PI);
  if (parts.rear === 'spike') drawSpike(0);
  if (parts.rear === 'jet') drawJet(0);
  ctx.restore();

  // Sides
  ctx.save();
  ctx.rotate(Math.PI / 2);
  if (parts.left === 'spike') drawSpike(0);
  if (parts.left === 'jet') drawJet(0);
  ctx.restore();

  ctx.save();
  ctx.rotate(-Math.PI / 2);
  if (parts.right === 'spike') drawSpike(0);
  if (parts.right === 'jet') drawJet(0);
  ctx.restore();
}

/* --- GAMEPLAY LOGIC --- */

function spawnEnemy() {
  let angle = rand(0, Math.PI * 2);
  let d = Math.hypot(width, height) * 0.8; // spawn offscreen
  let ex = player.x + Math.cos(angle) * d;
  let ey = player.y + Math.sin(angle) * d;
  
  let type = Math.random() > 0.5 ? 'enemy_herb' : 'enemy_carn';
  // Scale enemy with player progress
  let size = clamp(player.radius * rand(0.7, 1.3), 15, 60);
  
  entities.push(new Entity(type, ex, ey, size));
}

function spawnFood() {
  let type = Math.random() > 0.3 ? 'food_plant' : 'food_meat';
  // Spawn around player but not too close
  let angle = rand(0, Math.PI * 2);
  let d = rand(300, 800);
  let fx = player.x + Math.cos(angle) * d;
  let fy = player.y + Math.sin(angle) * d;
  entities.push(new Entity(type, fx, fy, rand(5, 10)));
}

function updatePlayer(dt) {
  // Mouse steering
  let screenX = width / 2; // Player is always center conceptually for input
  let screenY = height / 2;
  
  let dx = mouse.x - screenX;
  let dy = mouse.y - screenY;
  let targetAngle = Math.atan2(dy, dx);
  
  // Smooth rotation
  let diff = targetAngle - player.angle;
  while (diff < -Math.PI) diff += Math.PI * 2;
  while (diff > Math.PI) diff -= Math.PI * 2;
  player.angle += clamp(diff, -player.turnSpeed, player.turnSpeed);

  // Movement
  let speed = player.speed;
  if (mouse.down && (player.parts.rear === 'jet' || player.parts.left === 'jet' || player.parts.right === 'jet')) {
    speed *= 1.8; // Dash
    createJetParticle();
  }
  
  player.vx += Math.cos(player.angle) * 0.1;
  player.vy += Math.sin(player.angle) * 0.1;

  // Friction
  player.vx *= 0.95;
  player.vy *= 0.95;

  // Cap speed
  let currentSpeed = Math.hypot(player.vx, player.vy);
  if (currentSpeed > speed) {
    player.vx = (player.vx / currentSpeed) * speed;
    player.vy = (player.vy / currentSpeed) * speed;
  }

  player.x += player.vx;
  player.y += player.vy;

  // Boundaries (Bounce)
  if (Math.abs(player.x) > WORLD_SIZE) { player.x = Math.sign(player.x) * WORLD_SIZE; player.vx *= -1; }
  if (Math.abs(player.y) > WORLD_SIZE) { player.y = Math.sign(player.y) * WORLD_SIZE; player.vy *= -1; }

  // Camera follow
  camera.x = player.x;
  camera.y = player.y;
  camera.zoom += (camera.targetZoom - camera.zoom) * 0.05;

  // Diet Color shifting
  let total = player.diet.plant + player.diet.meat;
  if (total > 0) {
    let ratio = player.diet.meat / total;
    // Interpolate green (74,222,128) to red (248,113,113)
    player.color.r = 74 + (248 - 74) * ratio;
    player.color.g = 222 + (113 - 222) * ratio;
    player.color.b = 128 + (113 - 128) * ratio;
  }
}

function createJetParticle() {
  particles.push(new Particle(
    player.x - Math.cos(player.angle) * player.radius,
    player.y - Math.sin(player.angle) * player.radius,
    '#60a5fa'
  ));
}

function checkCollisions() {
  for (let i = entities.length - 1; i >= 0; i--) {
    let e = entities[i];
    let d = dist(player, e);
    
    if (d < player.radius + e.radius) {
      // Overlap logic
      
      // Eating Food
      if (e.type.startsWith('food')) {
        if (player.parts.front === 'mouth') {
          e.dead = true;
          player.dna += 5;
          player.biomass += 2;
          if (e.type === 'food_plant') player.diet.plant++;
          if (e.type === 'food_meat') player.diet.meat++;
          // Grow slightly
          player.radius = Math.min(player.radius + 0.1, 80);
        }
      } 
      // Combat
      else if (e.type.startsWith('enemy')) {
        // Check Spikes
        let myDamage = 0;
        let enemyDamage = 0;
        
        // Simple angle check for front spike
        let angleToEnemy = Math.atan2(e.y - player.y, e.x - player.x);
        let angleDiff = Math.abs(angleToEnemy - player.angle);
        
        if (player.parts.front === 'spike' && angleDiff < 1) myDamage += 20;
        if (player.parts.rear === 'spike' && Math.abs(angleDiff - Math.PI) < 1) myDamage += 20;
        
        // Enemy damage player
        if (e.radius > player.radius * 1.1) enemyDamage = 2; // Bigger hurts constantly
        else if (e.parts.front === 'spike' && Math.abs(e.angle - angleToEnemy + Math.PI) < 1) enemyDamage = 10;
        
        player.hp -= enemyDamage;
        e.hp -= myDamage;

        // Knockback
        let kx = Math.cos(angleToEnemy) * 2;
        let ky = Math.sin(angleToEnemy) * 2;
        player.vx -= kx;
        player.vy -= ky;
        e.vx += kx;
        e.vy += ky;

        if (e.hp <= 0) {
          e.dead = true;
          player.dna += 20;
          player.diet.meat++;
          // Explode into meat chunks
          for(let k=0; k<3; k++) {
            entities.push(new Entity('food_meat', e.x + rand(-10,10), e.y + rand(-10,10), 8));
          }
        }
      }
    }
  }
}

function drawGame() {
  // Background
  ctx.fillStyle = '#001e2d';
  ctx.fillRect(0, 0, width, height);

  // Grid lines (parallax)
  ctx.save();
  ctx.translate(width/2 - camera.x * camera.zoom, height/2 - camera.y * camera.zoom);
  ctx.scale(camera.zoom, camera.zoom);
  
  ctx.strokeStyle = '#023e4f';
  ctx.lineWidth = 2;
  ctx.beginPath();
  let gridSize = 100;
  let startX = Math.floor((camera.x - width/2/camera.zoom)/gridSize) * gridSize;
  let endX = startX + width/camera.zoom + gridSize*2;
  let startY = Math.floor((camera.y - height/2/camera.zoom)/gridSize) * gridSize;
  let endY = startY + height/camera.zoom + gridSize*2;

  for (let x = startX; x < endX; x += gridSize) {
    ctx.moveTo(x, startY); ctx.lineTo(x, endY);
  }
  for (let y = startY; y < endY; y += gridSize) {
    ctx.moveTo(startX, y); ctx.lineTo(endX, y);
  }
  ctx.stroke();

  // Entities
  entities.forEach(e => e.draw(ctx, camera.x, camera.y));
  
  // Player
  ctx.save();
  ctx.translate(player.x, player.y);
  ctx.rotate(player.angle);
  
  // Body
  ctx.beginPath();
  ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
  ctx.fillStyle = `rgb(${player.color.r}, ${player.color.g}, ${player.color.b})`;
  ctx.fill();
  ctx.strokeStyle = 'white';
  ctx.lineWidth = 2;
  ctx.stroke();
  
  drawCellParts(ctx, player.radius, player.parts);
  
  // Eye
  ctx.fillStyle = 'white';
  ctx.beginPath();
  ctx.arc(player.radius * 0.5, -player.radius * 0.3, player.radius * 0.25, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'black';
  ctx.beginPath();
  ctx.arc(player.radius * 0.6, -player.radius * 0.3, player.radius * 0.1, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();

  // Particles
  particles.forEach(p => p.draw(ctx, camera.x, camera.y));

  ctx.restore();
}

function gameLoop(timestamp) {
  if (!gameRunning) return;
  let dt = (timestamp - lastTime) / 1000;
  lastTime = timestamp;

  if (dt > 0.1) dt = 0.1; // Cap lag

  updatePlayer(dt);

  // Update Entities
  entities.forEach(e => e.update(dt));
  entities = entities.filter(e => !e.dead);
  
  // Particles
  particles.forEach(p => p.update());
  particles = particles.filter(p => p.life > 0);

  // Spawning
  if (Math.random() < 0.05) spawnFood();
  if (entities.length < 15 && Math.random() < 0.02) spawnEnemy();

  checkCollisions();

  // UI Updates
  biomassBar.style.width = Math.min(100, (player.biomass / 50) * 100) + '%';
  dnaDisplay.textContent = Math.floor(player.dna);
  
  if (player.dna >= 50 && player.biomass > 20) {
    evoBtn.style.display = 'block';
  } else {
    evoBtn.style.display = 'none';
  }

  // Game Over
  if (player.hp <= 0) {
    gameRunning = false;
    gameOverLayer.hidden = false;
    hudLayer.hidden = true;
    finalScore.textContent = `DNA Collected: ${Math.floor(player.dna)}`;
  }

  drawGame();
  requestAnimationFrame(gameLoop);
}

/* --- EDITOR LOGIC --- */
const PARTS = {
  'spike': { cost: 15, desc: 'Front Spike: Charge Attack', slot: 'front' },
  'mouth': { cost: 5, desc: 'Mouth: Eat Food', slot: 'front' },
  'jet': { cost: 20, desc: 'Rear Jet: Burst Speed', slot: 'rear' },
  'eye': { cost: 10, desc: 'Eye: Zoom Out', slot: 'front' }, // Simplified: upgrades stats rather than slot
};

function enterEditor() {
  gameRunning = false;
  editorLayer.hidden = false;
  hudLayer.hidden = true;
  
  // Reset some stats for balance
  player.dna -= 20; // Cost to enter
  if (player.dna < 0) player.dna = 0;
  
  renderEditorUI();
  renderEditorCell();
}

function renderEditorUI() {
  const list = partListEl;
  list.innerHTML = '';
  
  for (let key in PARTS) {
    let p = PARTS[key];
    let btn = document.createElement('div');
    btn.style.cssText = `
      background:rgba(255,255,255,0.1); border:1px solid #60a5fa; 
      color:#60a5fa; padding:10px; border-radius:5px; cursor:pointer;
      display:flex; flex-direction:column; align-items:center; width:100px;
    `;
    btn.innerHTML = `<span style="font-weight:bold; text-transform:uppercase;">${key}</span><span style="font-size:0.8em; color:#fbbf24;">${p.cost} DNA</span>`;
    
    // Check if affordable
    if (player.dna < p.cost) {
      btn.style.opacity = '0.5';
      btn.style.cursor = 'not-allowed';
    } else {
      btn.onclick = () => buyPart(key);
    }
    list.appendChild(btn);
  }
}

function renderEditorCell() {
  eCtx.clearRect(0,0,300,300);
  eCtx.save();
  eCtx.translate(150, 150);
  
  // Draw background slots
  eCtx.fillStyle = 'rgba(255,255,255,0.1)';
  eCtx.beginPath(); eCtx.arc(0, 0, 60, 0, Math.PI*2); eCtx.fill(); // Body outline
  
  // Draw current cell
  eCtx.rotate(-Math.PI/2); // Face right
  eCtx.beginPath();
  eCtx.arc(0, 0, 40, 0, Math.PI * 2);
  eCtx.fillStyle = `rgb(${player.color.r}, ${player.color.g}, ${player.color.b})`;
  eCtx.fill();
  drawCellParts(eCtx, 40, player.parts);
  
  eCtx.restore();
}

function buyPart(partKey) {
  let p = PARTS[partKey];
  if (player.dna >= p.cost) {
    player.dna -= p.cost;
    
    // Apply Logic
    if (partKey === 'spike') {
      // Find empty side or front
      if (!player.parts.front) player.parts.front = 'spike';
      else if (!player.parts.rear) player.parts.rear = 'spike';
      else if (!player.parts.left) player.parts.left = 'spike';
      else if (!player.parts.right) player.parts.right = 'spike';
      else player.parts.front = 'spike'; // Replace
    } else if (partKey === 'jet') {
      if (!player.parts.rear) player.parts.rear = 'jet';
      else if (!player.parts.left) player.parts.left = 'jet';
      else if (!player.parts.right) player.parts.right = 'jet';
      else player.parts.rear = 'jet';
    } else if (partKey === 'mouth') {
      player.parts.front = 'mouth';
    } else if (partKey === 'eye') {
      camera.targetZoom += 0.2; // Zoom out
      player.turnSpeed += 0.01;
    }
    
    renderEditorUI();
    renderEditorCell();
  }
}

function exitEditor() {
  editorLayer.hidden = true;
  hudLayer.hidden = false;
  gameRunning = true;
  lastTime = performance.now();
  requestAnimationFrame(gameLoop);
}

/* --- INITIALIZATION --- */
function startGame() {
  menuLayer.hidden = true;
  hudLayer.hidden = false;
  
  // Reset Player
  player.x = 0; player.y = 0;
  player.hp = 100;
  player.dna = 0;
  player.biomass = 0;
  player.radius = 20;
  player.parts = { front: 'mouth', rear: null, left: null, right: null };
  player.color = { r: 74, g: 222, b: 128 };
  player.diet = { plant: 0, meat: 0 };
  camera.targetZoom = 1;
  
  entities = [];
  particles = [];
  
  // Initial Spawn
  for(let i=0; i<20; i++) spawnFood();
  
  gameRunning = true;
  lastTime = performance.now();
  requestAnimationFrame(gameLoop);
}
