<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>y6uf93lhoh — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<main class="sim">
  <header class="hero">
    <h1>Combat Robot Archetype Simulator</h1>
    <p>Randomized Robot Wars-style dossiers with archetype pools, rarity tiers, arena personality, team mode, safety checklist, and AI generation tools.</p>

    <div class="controls">
      <label>
        Archetype:
        <select id="archetypeSelectEl">
          <option value="null">Random</option>
          <option value="flipper">Flipper</option>
          <option value="spinner">Spinner</option>
          <option value="crusher">Crusher</option>
          <option value="drum">Drum</option>
          <option value="lifter">Lifter</option>
          <option value="wedge">Wedge</option>
          <option value="control bot">Control Bot</option>
          <option value="rammer">Rammer</option>
          <option value="axe bot">Axe Bot</option>
        </select>
      </label>

      <label>
        Rarity:
        <select id="raritySelectEl">
          <option value="null">Random</option>
          <option value="common">Common</option>
          <option value="elite">Elite</option>
          <option value="prototype">Prototype</option>
        </select>
      </label>

      <label>
        AI Art Style:
        <select id="aiStyleSelectEl">
          <option value="gritty industrial">Gritty Industrial</option>
          <option value="technical blueprint">Technical Blueprint</option>
          <option value="dark cyberpunk">Dark Cyberpunk</option>
          <option value="watercolor concept">Watercolor Concept</option>
        </select>
      </label>

      <label>
        AI Image Res:
        <select id="aiResSelectEl">
          <option value="512x512">512x512</option>
          <option value="768x768">768x768</option>
          <option value="512x768">512x768</option>
          <option value="768x512">768x512</option>
        </select>
      </label>

      <label>
        AI Tone:
        <select id="aiToneSelectEl">
          <option value="dramatic">Dramatic</option>
          <option value="technical">Technical</option>
          <option value="humorous">Humorous</option>
        </select>
      </label>
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('single', this)">Single Robot</button>
      <button class="tab-btn" onclick="switchTab('team', this)">Generate Team</button>
      <button class="tab-btn" onclick="switchTab('safety', this)">Safety Checklist</button>
      <button class="tab-btn" onclick="switchTab('ai', this)">AI Workshop</button>
    </div>

    <div class="actions">
      <button onclick="renderSingle()">Generate New Robot</button>
      <button onclick="renderTeam()">Generate Team</button>
      <button onclick="renderSafety()">Refresh Checklist</button>
    </div>
  </header>

  <section id="singleViewEl" class="panel">
    <div id="singleCardEl"></div>
    <div id="singleImageEl" style="margin-top:12px;"></div>
    <div class="actions" style="margin-top:12px;">
      <button onclick="generateAiLore()">📝 AI Lore</button>
      <button onclick="generateAiPortrait()">🎨 AI Portrait</button>
      <button onclick="generateAiAnalysis()">⚔️ AI Analysis</button>
    </div>
    <div id="singleAiOutputEl" style="margin-top:12px; white-space:pre-wrap; font-size:0.95rem; line-height:1.5; min-height:24px;"></div>
    <div id="singleNotesEl" class="panel--notes" style="margin-top:12px;"></div>
  </section>

  <section id="teamViewEl" class="panel" hidden>
    <div class="actions" style="margin-bottom:16px;">
      <button onclick="generateAiTeamStrategy()">📋 AI Team Strategy</button>
      <button onclick="generateAiTeamPortrait()">🎨 AI Team Portrait</button>
    </div>
    <div id="teamAiOutputEl" style="margin-bottom:16px; white-space:pre-wrap; font-size:0.95rem; line-height:1.5; min-height:24px;"></div>
    <div id="teamGridEl" class="team-grid"></div>
  </section>

  <section id="safetyViewEl" class="panel" hidden></section>

  <section id="aiViewEl" class="panel" hidden>
    <h2 style="margin-top:0;">AI Workshop</h2>
    <p style="opacity:0.8;">Ask the AI about combat robotics, generate custom content, or explore strategies.</p>
    <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:12px;">
      <input id="aiPromptInputEl" placeholder="Ask the AI anything..." style="flex:1 1 300px; border-radius:10px; padding:10px; background:#1b2433; color:#f3f6fb; border:1px solid #3a465c; font-size:0.95rem;">
      <button onclick="generateAiWorkshop()">Generate</button>
      <button onclick="generateAiRandomPrompt()">🎲 Random Prompt</button>
    </div>
    <div id="aiWorkshopOutputEl" style="margin-top:16px; white-space:pre-wrap; font-size:0.95rem; line-height:1.5; min-height:80px;"></div>
  </section>
</main>

<style>
  body { margin: 0; font-family: Inter, system-ui, sans-serif; background: radial-gradient(circle at top, #1c2330, #0b0f16 60%); color: #f3f6fb; text-align: left; }
  .sim { max-width: 1100px; margin: 0 auto; padding: 24px; }
  .hero { display: flex; flex-direction: column; gap: 12px; padding: 24px; border-radius: 18px; background: rgba(255,255,255,0.06); backdrop-filter: blur(8px); box-shadow: 0 12px 40px rgba(0,0,0,0.35); }
  .hero h1 { margin: 0; font-size: 2rem; }
  .hero p { margin: 0; opacity: 0.8; }
  .controls { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 4px; }
  .controls label { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 0.95rem; }
  select { border-radius: 10px; padding: 8px 10px; background: #1b2433; color: #f3f6fb; border: 1px solid #3a465c; font-size: 0.95rem; }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .tab-btn { border: 0; border-radius: 12px; padding: 10px 14px; font-weight: 700; cursor: pointer; background: rgba(255,255,255,0.08); color: #f3f6fb; }
  .tab-btn.active { background: linear-gradient(135deg, #ff6a3d, #ffb03a); color: #111; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
  .actions button { border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 700; cursor: pointer; background: linear-gradient(135deg, #ff6a3d, #ffb03a); color: #111; }
  .panel { margin-top: 18px; padding: 20px; border-radius: 18px; background: rgba(255,255,255,0.08); box-shadow: 0 12px 40px rgba(0,0,0,0.25); }
  .card h2 { margin: 0 0 6px; font-size: 1.8rem; }
  .subtitle { margin: 0 0 18px; opacity: 0.8; }
  .rarity-badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; color: #fff; background: #7f8c8d; }
  .rarity-elite { background: linear-gradient(135deg, #ff6a3d, #ffb03a); color: #111; }
  .rarity-prototype { background: #9b59b6; color: #fff; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  .grid div { padding: 14px; border-radius: 14px; background: rgba(0,0,0,0.18); }
  .grid span { display: block; font-size: 0.78rem; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }
  .grid strong { font-size: 1rem; line-height: 1.35; }
  .panel--notes h3 { margin-top: 0; }
  .team-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
  .team-slot { padding: 16px; border-radius: 16px; background: rgba(0,0,0,0.22); }
  .team-slot h3 { margin-top: 0; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 0.04em; opacity: 0.9; }
  .safety-card { padding: 16px; border-radius: 16px; background: rgba(0,0,0,0.22); }
  .safety-card h3 { margin-top: 0; }
  .checklist { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
  .checklist li { padding: 10px 12px; border-radius: 10px; background: rgba(255,255,255,0.06); font-size: 0.95rem; }
</style>

<script>
  let adjectives = ["Iron","Titan","Viper","Atlas","Razor","Ember","Nova","Aegis","Rift","Granite","Volt","Onyx","Phantom","Omega"];
  let nouns = ["Fang","Bastion","Reaper","Forge","Kraken","Warden","Pulse","Talon","Hydra","Sentinel","Mantis","Breaker","Spectre","Juggernaut"];
  let romans = ["I","II","III","IV","V","VI","VII","VIII","IX","X"];
  let sizeClasses = ["lightweight","middleweight","heavyweight"];
  let rarities = ["common","elite","prototype"];
  let personas = ["favours control","thrives in chaos","needs a clean opening to win","dominates push fights","excels at ring-outs","thrives on aggression","built for endurance","high-risk, high-reward","conservative but deadly","unpredictable and adaptive"];
  let drivetrains = ["dual-motor skid steer","four-motor tank drive","belt-linked drive train","high-torque twin gearbox drive","compact differential drive"];
  let armors = ["Hardox front wedge","layered steel shell","titanium nose plate","anti-spinner forks","sacrificial bolt-on armor","aluminum-and-steel composite shell","reinforced front ram plate"];
  let features = ["self-righting mechanism","modular front end","protected electronics pod","weapon lock pin","redundant receiver failsafe","quick-swap armor package","isolated battery bay","shock-mounted control tray"];
  let weaknesses = ["exposed top armor","vulnerable side pods","complex maintenance requirements","slower recharge cycle","limited pushing power","poor rear defense","sensitive drivetrain alignment","high recoil stress"];
  let archetypes = ["flipper","spinner","crusher","drum","lifter","wedge","control bot","rammer","axe bot"];
  let weaponsByArchetype = {
    flipper: ["high-pressure flipper","CO₂-powered flipper","pneumatic ramming flipper","self-righting flipper arm","dual-stage flipper"],
    spinner: ["armored vertical spinner","high-RPM vertical disc","long-bar horizontal spinner","titanium horizontal drum","balanced steel bar spinner"],
    crusher: ["hydraulic crusher jaw","synchronized crushing arms","slow but crushing press","multi-stage compression arm"],
    drum: ["high-speed drum","toothed combat drum","reinforced drum with spikes","dual-zone drum spinner"],
    lifter: ["lifting fork system","fork-and-lift combo","undercutting lift arm"],
    wedge: ["reinforced wedge and forks","anti-spinner wedge","low-profile ram wedge"],
    "control bot": ["control wedge with anti-spinner forks","gripping arms and wedge","push-and-control wedge"],
    rammer: ["pneumatic rammer","high-torque ram plate","battering ram wedge"],
    "axe bot": ["overhead axe","swinging hammer axe","fast-strike axe arm"]
  };
  let statNames = ["aggression","control","durability","damage","reliability","mobility"];
  let safetyItems = [
    "Weapon arm is locked in place with a physical pin",
    "Master power disconnect is accessible from outside the chassis",
    "Removable link / safety link is installed for pit work",
    "Receiver failsafe is tested and returns to neutral",
    "Weapon motor / solenoid has a separate disconnect",
    "Battery is secured and isolated",
    "ESCs and receiver are shock-mounted",
    "No exposed sharp edges in handling zones",
    "Belt guards installed where required",
    "Spinning weapon is balanced and restrained",
    "Team has a clear safety officer for pit checks",
    "You have a repair kit and spare armor panels"
  ];

  let currentRobot = null;
  let currentTeam = [];

  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

  function buildRobot(){
    let archetypeFilter = archetypeSelectEl.value;
    let rarityFilter = raritySelectEl.value;
    let archetype = archetypeFilter !== "null" ? archetypeFilter : pick(archetypes);
    let rarity = rarityFilter !== "null" ? rarityFilter : pick(rarities);
    let weapon = pick(weaponsByArchetype[archetype]);
    let stats = {};
    statNames.forEach(s => stats[s] = Math.floor(Math.random()*5)+1);
    let statBlock = statNames.map(s => s.charAt(0).toUpperCase()+s.slice(1)+": "+stats[s]).join("<br>");
    return {
      name: pick(adjectives)+" "+pick(nouns)+" "+pick(romans),
      sizeClass: pick(sizeClasses),
      archetype: archetype,
      rarity: rarity,
      weapon: weapon,
      drivetrain: pick(drivetrains),
      armor: pick(armors),
      feature: pick(features),
      weakness: pick(weaknesses),
      persona: pick(personas),
      statBlock: statBlock
    };
  }

  function robotCardHtml(r){
    let badgeClass = "rarity-"+r.rarity;
    return `<div class="card">
      <h2>${r.name}</h2>
      <p class="subtitle">${r.sizeClass} • ${r.archetype} • <span class="rarity-badge ${badgeClass}">${r.rarity}</span></p>
      <div class="grid">
        <div><span>Weapon</span><strong>${r.weapon}</strong></div>
        <div><span>Armor</span><strong>${r.armor}</strong></div>
        <div><span>Drive</span><strong>${r.drivetrain}</strong></div>
        <div><span>Feature</span><strong>${r.feature}</strong></div>
        <div><span>Weakness</span><strong>${r.weakness}</strong></div>
        <div><span>Personality</span><strong>${r.persona}</strong></div>
        <div><span>Stats</span><strong>${r.statBlock}</strong></div>
      </div>
    </div>`;
  }

  function renderSingle(){
    currentRobot = buildRobot();
    singleCardEl.innerHTML = robotCardHtml(currentRobot);
    singleNotesEl.innerHTML = `<h3>Build Notes</h3><p>${currentRobot.name} is a ${currentRobot.sizeClass} ${currentRobot.archetype} built around ${currentRobot.weapon}. It uses ${currentRobot.drivetrain} and carries ${currentRobot.armor}. Signature feature: ${currentRobot.feature}. Likely weakness: ${currentRobot.weakness}. Arena personality: ${currentRobot.persona}. Rarity: ${currentRobot.rarity}.</p>`;
    singleImageEl.innerHTML = "";
    singleAiOutputEl.textContent = "";
  }

  function renderTeam(){
    currentTeam = [buildRobot(), buildRobot(), buildRobot()];
    teamGridEl.innerHTML = currentTeam.map((r,i) => `<div class="team-slot"><h3>Robot ${i+1}</h3>${robotCardHtml(r)}</div>`).join("");
    teamAiOutputEl.textContent = "";
  }

  function renderSafety(){
    let shuffled = [...safetyItems].sort(() => Math.random()-0.5);
    let lis = shuffled.map(i => `<li>⬜ ${i}</li>`).join("");
    safetyViewEl.innerHTML = `<div class="safety-card">
      <h3>Weapon-Lock & Safety Checklist</h3>
      <p>Before transport, pit access, and competition inspection:</p>
      <ul class="checklist">${lis}</ul>
    </div>`;
  }

  function switchTab(tab, btn){
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    singleViewEl.hidden = tab !== "single";
    teamViewEl.hidden = tab !== "team";
    safetyViewEl.hidden = tab !== "safety";
    aiViewEl.hidden = tab !== "ai";
  }

  async function generateAiLore(){
    if(!currentRobot) renderSingle();
    singleAiOutputEl.textContent = "⏳ Generating AI lore...";
    let tone = aiToneSelectEl.value;
    let prompt = `Write a ${tone} backstory and combat dossier for a combat robot named ${currentRobot.name}. It is a ${currentRobot.sizeClass} ${currentRobot.archetype} with a ${currentRobot.weapon}, ${currentRobot.drivetrain}, and ${currentRobot.armor}. Special feature: ${currentRobot.feature}. Weakness: ${currentRobot.weakness}. Arena personality: ${currentRobot.persona}. Rarity: ${currentRobot.rarity}. Keep it to 2-3 paragraphs.`;
    try {
      let text = await generateText(prompt);
      singleAiOutputEl.textContent = text;
    } catch(e) {
      singleAiOutputEl.textContent = "AI generation failed. Please try again.";
    }
  }

  async function generateAiPortrait(){
    if(!currentRobot) renderSingle();
    singleImageEl.innerHTML = "⏳ Generating AI portrait...";
    let style = aiStyleSelectEl.value;
    let res = aiResSelectEl.value;
    let prompt = `A ${style} concept art of a combat robot named ${currentRobot.name}, ${currentRobot.sizeClass} class, ${currentRobot.archetype} type, armed with ${currentRobot.weapon}, with ${currentRobot.armor}. Mechanical, detailed, arena lighting.`;
    try {
      let dataUrl = await generateImage(prompt, {resolution: res});
      singleImageEl.innerHTML = `<img src="${dataUrl}" style="max-width:100%; border-radius:14px; box-shadow:0 8px 30px rgba(0,0,0,0.4);">`;
    } catch(e) {
      singleImageEl.textContent = "Image generation failed. Please try again.";
    }
  }

  async function generateAiAnalysis(){
    if(!currentRobot) renderSingle();
    singleAiOutputEl.textContent = "⏳ Analyzing combat capabilities...";
    let tone = aiToneSelectEl.value;
    let prompt = `Provide a ${tone} tactical combat analysis for the robot ${currentRobot.name}, a ${currentRobot.sizeClass} ${currentRobot.archetype}. Weapon: ${currentRobot.weapon}. Armor: ${currentRobot.armor}. Feature: ${currentRobot.feature}. Weakness: ${currentRobot.weakness}. Personality: ${currentRobot.persona}. Suggest ideal matchups and counter-strategies. Keep concise.`;
    try {
      let text = await generateText(prompt);
      singleAiOutputEl.textContent = text;
    } catch(e) {
      singleAiOutputEl.textContent = "AI analysis failed. Please try again.";
    }
  }

  async function generateAiTeamStrategy(){
    if(!currentTeam.length) renderTeam();
    teamAiOutputEl.textContent = "⏳ Generating team strategy...";
    let tone = aiToneSelectEl.value;
    let bots = currentTeam.map((r,i) => `${i+1}. ${r.name} (${r.sizeClass} ${r.archetype}, ${r.weapon}) — ${r.persona}; weakness: ${r.weakness}`).join("\n");
    let prompt = `Analyze this combat robot team and provide a ${tone} team strategy:\n${bots}\n\nDiscuss team tactics, how they cover each other's weaknesses, and suggest an opening battle plan.`;
    try {
      let text = await generateText(prompt);
      teamAiOutputEl.textContent = text;
    } catch(e) {
      teamAiOutputEl.textContent = "Team strategy generation failed. Please try again.";
    }
  }

  async function generateAiTeamPortrait(){
    if(!currentTeam.length) renderTeam();
    teamAiOutputEl.innerHTML = "⏳ Generating team portrait...";
    let style = aiStyleSelectEl.value;
    let res = aiResSelectEl.value;
    let prompt = `A ${style} team lineup of three distinct combat robots side by side in an arena: ${currentTeam.map(r => r.name + " (" + r.archetype + " with " + r.weapon + ")").join(", ")}. Dramatic lighting, mechanical detail.`;
    try {
      let dataUrl = await generateImage(prompt, {resolution: res});
      teamAiOutputEl.innerHTML = `<img src="${dataUrl}" style="max-width:100%; border-radius:14px; box-shadow:0 8px 30px rgba(0,0,0,0.4);"><p style="margin-top:8px; opacity:0.8;">AI-generated team portrait.</p>`;
    } catch(e) {
      teamAiOutputEl.textContent = "Team portrait generation failed. Please try again.";
    }
  }

  async function generateAiWorkshop(){
    let prompt = aiPromptInputEl.value.trim();
    if(!prompt) return;
    aiWorkshopOutputEl.textContent = "⏳ Thinking...";
    try {
      let text = await generateText(`You are an expert combat robotics engineer and strategist. Answer the following:\n${prompt}`);
      aiWorkshopOutputEl.textContent = text;
    } catch(e) {
      aiWorkshopOutputEl.textContent = "Workshop generation failed. Please try again.";
    }
  }

  function generateAiRandomPrompt(){
    let prompts = [
      "Design a new robot archetype that counters spinners.",
      "Write a dramatic monologue from a crusher robot before a match.",
      "Explain how to improve wedge design against flippers.",
      "Describe a fictional championship match between an axe bot and a drum spinner.",
      "Invent a new arena hazard and explain its tactical implications.",
      "Compare lithium polymer versus nickel metal hydride for combat robots.",
      "Write a humorous post-match interview with a rammer bot."
    ];
    aiPromptInputEl.value = pick(prompts);
  }

  renderSingle();
  renderTeam();
  renderSafety();
</script>
</body>
</html>
