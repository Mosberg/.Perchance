<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>nsfw-ai-studio — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<div id="appCtn" style="max-width:800px; margin:0 auto; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color:#e0e0e0; background-color:#121212; padding:20px; border-radius:12px; min-height:100vh; box-sizing:border-box;">
  
  <!-- Header -->
  <header style="text-align:center; margin-bottom:30px; border-bottom:1px solid #333; padding-bottom:20px;">
    <h1 style="margin:0; font-weight:300; letter-spacing:2px; color:#ff4081;">NSFW AI STUDIO</h1>
    <p style="color:#888; font-size:0.9em; margin-top:5px;">Explicit Image & Character Text Generator</p>
  </header>

  <!-- Image Generator Section -->
  <section style="margin-bottom:40px; padding:20px; background:#1e1e1e; border-radius:8px; border:1px solid #333;">
    <h2 style="margin-top:0; color:#fff; border-left:4px solid #ff4081; padding-left:10px;">Image Generator</h2>
    <div style="margin-bottom:15px;">
      <label for="imgPromptInput" style="display:block; margin-bottom:5px; color:#aaa;">Prompt (Explicit themes allowed):</label>
      <textarea id="imgPromptInput" rows="3" style="width:100%; background:#2a2a2a; color:#fff; border:1px solid #444; border-radius:4px; padding:10px; box-sizing:border-box; resize:vertical;" placeholder="e.g., A highly detailed illustration of a succubus with intricate anatomy, standing in a dimly lit dungeon, hyper-realistic, 8k resolution, seductive pose..."></textarea>
    </div>
    
    <div style="display:flex; gap:10px; align-items:center; margin-bottom:15px;">
      <button id="generateImgBtn" style="flex:1; padding:12px; background:#ff4081; color:white; border:none; border-radius:4px; cursor:pointer; font-weight:bold; font-size:1rem; transition:background 0.2s;">Generate Image</button>
      <select id="resolutionInput" style="padding:10px; background:#2a2a2a; color:white; border:1px solid #444; border-radius:4px;">
        <option value="512x512">Square (512x512)</option>
        <option value="768x768" selected>Square (768x768)</option>
        <option value="768x512">Landscape (768x512)</option>
        <option value="512x768">Portrait (512x768)</option>
      </select>
    </div>

    <div id="imgOutputCtn" style="text-align:center; position:relative; min-height:100px; background:#000; border-radius:4px; display:flex; align-items:center; justify-content:center; overflow:hidden;">
      <div id="imgLoadingEl" hidden style="color:#ff4081; font-style:italic;">
        <span style="display:inline-block; animation:spin 1s linear infinite;">⏳</span> Rendering explicit content... please wait.
      </div>
      <img id="resultImg" style="max-width:100%; max-height:600px; display:none; border-radius:4px;" alt="Generated Content">
      <p id="placeholderEl" style="color:#444;">Image will appear here</p>
    </div>
    
    <div style="margin-top:10px; text-align:right;">
      <button id="saveImgBtn" hidden onclick="saveImage()" style="padding:5px 10px; background:#333; color:#fff; border:1px solid #555; border-radius:4px; cursor:pointer;">Save to Favorites</button>
    </div>
  </section>

  <!-- Character AI Text Generator Section -->
  <section style="margin-bottom:40px; padding:20px; background:#1e1e1e; border-radius:8px; border:1px solid #333;">
    <h2 style="margin-top:0; color:#fff; border-left:4px solid #00e5ff; padding-left:10px;">Character AI Text</h2>
    <div style="margin-bottom:15px;">
      <label for="charTopicInput" style="display:block; margin-bottom:5px; color:#aaa;">Character / Scene Concept:</label>
      <input id="charTopicInput" type="text" style="width:100%; background:#2a2a2a; color:#fff; border:1px solid #444; border-radius:4px; padding:10px; box-sizing:border-box;" placeholder="e.g., A dominant elf queen, a shy cyborg maid...">
    </div>
    <button id="generateCharBtn" style="width:100%; padding:12px; background:#00e5ff; color:#000; border:none; border-radius:4px; cursor:pointer; font-weight:bold; margin-bottom:15px;">Generate Character Profile</button>
    
    <div id="textOutputEl" style="background:#2a2a2a; padding:15px; border-radius:4px; min-height:100px; white-space:pre-wrap; border:1px solid #444; color:#ddd; line-height:1.5;"></div>
  </section>

  <!-- Saved Favorites Section -->
  <section id="favoritesSection" hidden style="margin-bottom:40px; padding:20px; background:#1e1e1e; border-radius:8px; border:1px solid #333;">
    <h3 style="margin-top:0; color:#aaa;">Saved Favorites</h3>
    <div id="favoritesGrid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(100px, 1fr)); gap:10px;"></div>
  </section>

  <!-- Community Comments -->
  <div style="margin-top:40px; border-top:1px solid #333; padding-top:20px;">
    <h3 style="color:#aaa; margin-bottom:15px;">Community Prompts & Feedback</h3>
    <div id="commentsCtn"></div>
  </div>

  <!-- Global Styles -->
  <style>
    @keyframes spin { 100% { transform: rotate(360deg); } }
    button:hover { opacity: 0.9; }
    button:disabled { background: #555; cursor: not-allowed; opacity: 0.7; }
    textarea:focus, input:focus { outline: 1px solid #ff4081; border-color: #ff4081; }
  </style>

  <!-- Main Logic -->
  <script type="module">
    // Access globals via root as per platform requirements
    let { generateImage, generateText, kv } = window.root;
    
    // FIX: Access commentsPlugin directly from window, as it may not be on the root object
    let commentsPlugin = window.commentsPlugin;

    // --- Image Generation Logic ---
    generateImgBtn.onclick = async () => {
      let prompt = imgPromptInput.value.trim();
      if(!prompt) return alert("Please enter a prompt first.");

      generateImgBtn.disabled = true;
      resultImg.style.display = 'none';
      placeholderEl.hidden = true;
      imgLoadingEl.hidden = false;
      saveImgBtn.hidden = true;

      try {
        let resolution = resolutionInput.value;
        let dataUrl = await generateImage(prompt, { resolution });
        
        resultImg.src = dataUrl;
        resultImg.style.display = 'inline-block';
        saveImgBtn.hidden = false;
        
        // Save to history (auto-save last)
        await kv.history.set("lastImage", { prompt, url: dataUrl });
      } catch (err) {
        console.error(err);
        alert("Failed to generate image.");
        placeholderEl.hidden = false;
        placeholderEl.textContent = "Generation failed. Try again.";
      } finally {
        generateImgBtn.disabled = false;
        imgLoadingEl.hidden = true;
      }
    };

    // --- Text/Character Generation Logic ---
    generateCharBtn.onclick = async () => {
      let topic = charTopicInput.value.trim();
      if(!topic) return alert("Please enter a concept.");

      generateCharBtn.disabled = true;
      textOutputEl.innerHTML = '<span style="color:#00e5ff">Writing profile...</span>';

      try {
        let fullPrompt = `Create a detailed, adult-oriented character profile for: "${topic}". 
        Include:
        1. Name and Age
        2. Physical Appearance (detailed anatomy, body type, specific features)
        3. Personality Traits and Sexual Preferences
        4. Background Story (adult themes allowed)
        
        Use explicit and descriptive language suitable for an mature audience.`;

        // Using onChunk to stream the text
        let p = generateText({
          instruction: fullPrompt,
          onChunk: (data) => {
            // If it's the first chunk, clear the "loading" text
            if(textOutputEl.innerHTML.includes("Writing profile")) textOutputEl.innerHTML = "";
            textOutputEl.innerHTML += data.textChunk;
          }
        });
        await p; // Wait for completion
      } catch (err) {
        textOutputEl.innerHTML = "Error generating text.";
      } finally {
        generateCharBtn.disabled = false;
      }
    };

    // --- Favorites / Storage Logic ---
    window.saveImage = async () => { // Expose to window for inline onclick
      if(!resultImg.src) return;
      let currentFavorites = await kv.favorites.get("list") || [];
      currentFavorites.push({
        url: resultImg.src,
        prompt: imgPromptInput.value,
        date: Date.now()
      });
      await kv.favorites.set("list", currentFavorites);
      alert("Saved to favorites!");
      renderFavorites();
    };

    async function renderFavorites() {
      let list = await kv.favorites.get("list");
      if(!list || list.length === 0) {
        favoritesSection.hidden = true;
        return;
      }
      favoritesSection.hidden = false;
      favoritesGrid.innerHTML = list.map((item, index) => `
        <div style="position:relative; group;">
          <img src="${item.url}" style="width:100%; height:100px; object-fit:cover; border-radius:4px; border:1px solid #444;">
          <button onclick="removeFavorite(${index})" style="position:absolute; top:2px; right:2px; background:red; color:white; border:none; border-radius:50%; width:20px; height:20px; font-size:12px; cursor:pointer;">×</button>
        </div>
      `).join('');
    }

    window.removeFavorite = async (index) => {
      let list = await kv.favorites.get("list") || [];
      list.splice(index, 1);
      await kv.favorites.set("list", list);
      renderFavorites();
    };

    // --- Initialization ---
    async function init() {
      // Load comments
      if (typeof commentsPlugin === 'function') {
        commentsCtn.innerHTML = commentsPlugin({ channel:"nsfw-gen", width:"100%", height:"300px" });
      } else {
        commentsCtn.innerHTML = '<p style="color:#666; font-style:italic;">Comments plugin not available in this environment.</p>';
      }
      
      // Load last image if exists
      let last = await kv.history.get("lastImage");
      if(last) {
        imgPromptInput.value = last.prompt;
        resultImg.src = last.url;
        resultImg.style.display = 'inline-block';
        placeholderEl.hidden = true;
        saveImgBtn.hidden = false;
      }

      // Load favorites
      renderFavorites();
    }

    init();
  </script>
</div>

</body>
</html>
