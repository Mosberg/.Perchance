<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>neural-slots — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<div style="font-family: 'Courier New', monospace; background: radial-gradient(circle at center, #2a2a2a, #000); color: #0f0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; overflow-x: hidden;">
  
  <!-- Header Section -->
  <div style="text-align: center; margin-bottom: 20px;">
    <div id="loadingIndicatorEl" style="color: yellow; margin-bottom: 10px;">Initializing Neural Casino...</div>
    <img id="bannerImgEl" style="width: 300px; height: 150px; border: 2px solid #444; border-radius: 10px; display: none; object-fit: cover;" alt="AI Casino Banner">
    <h1 id="titleEl" style="margin: 10px 0; text-shadow: 0 0 10px #0f0; display: none;">🤖 NEURAL SLOTS 🤖</h1>
  </div>

  <!-- Casino Machine Frame -->
  <div id="machineCtn" style="background: linear-gradient(135deg, #444, #222); border: 4px solid gold; border-radius: 20px; padding: 20px; box-shadow: 0 0 30px rgba(255, 215, 0, 0.3); max-width: 500px; width: 100%;">
    
    <!-- Display Screen -->
    <div style="background: #000; border: 2px solid #666; padding: 15px; border-radius: 10px; margin-bottom: 20px; text-align: center; height: 80px; display: flex; align-items: center; justify-content: center;">
      <div id="statusEl" style="font-size: 1.2rem; color: cyan;">Ready to Spin...</div>
    </div>

    <!-- Reels Area -->
    <div style="display: flex; justify-content: space-between; gap: 10px; background: #111; padding: 15px; border-radius: 10px; border: 2px solid #333;">
      <div id="reel1El" class="reel" style="background: white; color: black; font-size: 3rem; width: 30%; height: 120px; display: flex; align-items: center; justify-content: center; border-radius: 5px; box-shadow: inset 0 0 10px rgba(0,0,0,0.5);">🍒</div>
      <div id="reel2El" class="reel" style="background: white; color: black; font-size: 3rem; width: 30%; height: 120px; display: flex; align-items: center; justify-content: center; border-radius: 5px; box-shadow: inset 0 0 10px rgba(0,0,0,0.5);">🍒</div>
      <div id="reel3El" class="reel" style="background: white; color: black; font-size: 3rem; width: 30%; height: 120px; display: flex; align-items: center; justify-content: center; border-radius: 5px; box-shadow: inset 0 0 10px rgba(0,0,0,0.5);">🍒</div>
    </div>

    <!-- Controls -->
    <div style="margin-top: 20px; display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; justify-content: space-between; align-items: center; color: gold; font-weight: bold;">
        <span>CREDITS:</span>
        <span id="balanceEl">$1000</span>
      </div>
      <button id="spinBtn" onclick="spin()" style="background: linear-gradient(to bottom, #ff0000, #990000); color: white; border: none; padding: 15px; font-size: 1.5rem; font-weight: bold; border-radius: 50px; cursor: pointer; box-shadow: 0 5px 0 #660000; transition: transform 0.1s;">SPIN ($50)</button>
    </div>
  </div>

  <!-- AI Dealer Commentary -->
  <div style="margin-top: 30px; width: 100%; max-width: 600px;">
    <div style="color: #aaa; margin-bottom: 5px; font-size: 0.8rem;">--- AI DEALER FEED ---</div>
    <div id="aiFeedEl" style="background: #111; border: 1px solid #333; padding: 15px; border-radius: 5px; min-height: 60px; color: #ddd; font-style: italic;">
      Welcome to the Neural Casino. I calculate your odds of winning are statistically low. Good luck.
    </div>
  </div>

  <!-- Jackpot Display (Hidden by default) -->
  <div id="jackpotOverlayEl" hidden style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 999; display: flex; flex-direction: column; align-items: center; justify-content: center; color: gold;">
    <h1 style="font-size: 4rem; text-shadow: 0 0 20px gold; animation: pulse 0.5s infinite;">JACKPOT!</h1>
    <img id="jackpotImgEl" style="margin-top: 20px; border: 5px solid gold; border-radius: 10px; max-width: 80%;">
    <button onclick="closeJackpot()" style="margin-top: 20px; padding: 10px 20px; font-size: 1.2rem; cursor: pointer;">CLAIM WINNINGS</button>
  </div>

  <style>
    /* Simple animation classes */
    .spinning {
      animation: blurMove 0.1s infinite;
    }
    @keyframes blurMove {
      0% { transform: translateY(-5px); filter: blur(2px); }
      100% { transform: translateY(5px); filter: blur(2px); }
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
    /* Disable text selection on UI */
    button { user-select: none; }
    div { user-select: none; }
  </style>

  <script type="module">
    // Access globals from root since we are in a module
    const generateText = root.generateText;
    const generateImage = root.generateImage;

    // Game State
    let balance = 1000;
    const costPerSpin = 50;
    const symbols = ['🍒', '🍋', '🍇', '💎', '7️⃣', '🪙']; // Symbols
    const weights = [40, 30, 20, 5, 4, 1]; // Probabilities (Coin is rarest)
    let isSpinning = false;

    // Elements
                    const reels = [
      document.getElementById('reel1El'),
      document.getElementById('reel2El'),
      document.getElementById('reel3El')
    ];
    const bannerImg = bannerImgEl;
        const loadingIndicator = loadingIndicatorEl;
    const jackpotOverlay = jackpotOverlayEl;
    const jackpotImg = jackpotImgEl;

    // Initial Setup: Generate Banner
    (async () => {
      try {
        // Generate a cyberpunk/casino banner
        let url = await generateImage("futuristic cyberpunk casino neon sign, AI themed, digital art, high quality", {resolution:"512x256"});
        bannerImg.src = url;
        bannerImg.style.display = 'inline-block';
        titleEl.style.display = 'block';
        loadingIndicator.hidden = true;
      } catch (e) {
        console.error("Failed to generate banner", e);
        loadingIndicator.textContent = "Banner generation failed. Starting game anyway.";
      }
    })();

    // Helper: Weighted Random Picker
    function getRandomSymbol() {
      let totalWeight = weights.reduce((a, b) => a + b, 0);
      let random = Math.random() * totalWeight;
      for (let i = 0; i < symbols.length; i++) {
        if (random < weights[i]) return symbols[i];
        random -= weights[i];
      }
      return symbols[0];
    }

    // Export spin function to window so the inline onclick works
    window.spin = async function() {
      if (isSpinning) return;
      if (balance < costPerSpin) {
        statusEl.textContent = "Insufficient Credits!";
        statusEl.style.color = "red";
        aiFeedEl.textContent = "Error: User wallet is empty. Please deposit more virtual currency.";
        return;
      }

      isSpinning = true;
      balance -= costPerSpin;
      updateUI();
      
      spinBtn.disabled = true;
      spinBtn.textContent = "SPINNING...";
      spinBtn.style.background = "#555";
      statusEl.textContent = "RNG Processing...";
      statusEl.style.color = "cyan";

      // Determine results beforehand
      const results = [getRandomSymbol(), getRandomSymbol(), getRandomSymbol()];
      
      // Start visual spinning
      reels.forEach(r => r.classList.add('spinning'));
      
      // Interval for "blur" effect during spin
      const interval = setInterval(() => {
        reels.forEach(r => r.textContent = symbols[Math.floor(Math.random() * symbols.length)]);
      }, 100);

      // Stop reels sequentially
      setTimeout(() => stopReel(0, results[0], interval), 1000);
      setTimeout(() => stopReel(1, results[1], interval), 1500);
      setTimeout(() => stopReel(2, results[2], interval), 2000);

      // After all stop, check win
      setTimeout(async () => {
        clearInterval(interval);
        reels.forEach(r => r.classList.remove('spinning')); // Ensure clean
        await checkWin(results);
        isSpinning = false;
        spinBtn.disabled = false;
        spinBtn.textContent = `SPIN ($${costPerSpin})`;
        spinBtn.style.background = "linear-gradient(to bottom, #ff0000, #990000)";
      }, 2500);
    };

    function stopReel(index, symbol, interval) {
      // Only stop animation for this reel visually by stopping the text change for it?
      // For simplicity, we just set the text. The blur class removal in the final step handles the cleanup.
      // Actually, to make it look like it stops one by one, we need to stop updating that specific reel in the interval.
      // But since we use one interval for all, let's just override the text content in the final check.
      // Or better: Just set the specific reel content here and remove the class.
      reels[index].classList.remove('spinning');
      reels[index].textContent = symbol;
      // Play a sound effect logic here if we had audio
    }

    async function checkWin(results) {
      const [s1, s2, s3] = results;
      let winAmount = 0;
      let winType = "loss";

      if (s1 === s2 && s2 === s3) {
        // 3 of a kind
        if (s1 === '🪙') {
          winAmount = 5000; // Jackpot
          winType = "jackpot";
        } else if (s1 === '💎' || s1 === '7️⃣') {
          winAmount = 500;
          winType = "big";
        } else {
          winAmount = 200;
          winType = "medium";
        }
      } else if (s1 === s2 || s2 === s3 || s1 === s3) {
        // 2 of a kind
        winAmount = 20; // Small win, less than cost (house edge)
        winType = "small";
      }

      balance += winAmount;
      updateUI();

      if (winAmount > 0) {
        statusEl.textContent = `WIN! +$${winAmount}`;
        statusEl.style.color = "#0f0";
      } else {
        statusEl.textContent = "No Match.";
        statusEl.style.color = "#aaa";
      }

      // Trigger AI Commentary
      generateAICommentary(results, winAmount, winType);
      
      // Trigger Jackpot Screen if applicable
      if (winType === "jackpot") {
        showJackpot();
      }
    }

    async function generateAICommentary(results, winAmount, winType) {
      const resultString = results.join(" ");
      let prompt = "";
      
      if (winType === "jackpot") {
        prompt = "The user just hit the MEGA JACKPOT on the slots! Write a short, excited, dramatic reaction as an AI casino dealer.";
      } else if (winType === "big") {
        prompt = `The user spun ${resultString} and won a big prize ($${winAmount}). Write a slightly impressed but still professional comment from an AI dealer.`;
      } else if (winType === "small") {
        prompt = `The user spun ${resultString} and won a tiny amount ($${winAmount}). Mock them gently for the small win.`;
      } else {
        prompt = `The user spun ${resultString} and lost everything ($${winAmount}). Write a dry, robotic, or sarcastic comment about probability and bad luck.`;
      }

      aiFeedEl.innerHTML = `<span style="color:yellow;">Thinking...</span>`;
      
      try {
        let response = await generateText(prompt);
        aiFeedEl.textContent = response;
      } catch (e) {
        aiFeedEl.textContent = "Error processing linguistic response module.";
      }
    }

    async function showJackpot() {
      statusEl.textContent = "JACKPOT!!!";
      jackpotOverlay.hidden = false;
      // Generate a celebratory image
      jackpotImg.src = ""; // Clear previous
      try {
        let url = await generateImage("explosion of gold coins and fireworks, photorealistic, celebration, jackpot", {resolution:"768x512"});
        jackpotImg.src = url;
      } catch(e) {}
    }

    window.closeJackpot = function() {
      jackpotOverlay.hidden = true;
    };

    function updateUI() {
      balanceEl.textContent = `$${balance}`;
    }
  </script>
</div>
</body>
</html>
