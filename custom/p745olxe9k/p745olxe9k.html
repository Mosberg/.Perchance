<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>p745olxe9k — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<h1>AI Code Generator Optimized</h1>

[remember(root, "@inputs")]

<link
  rel="shortcut icon"
  href="https://user.uploads.dev/file/8c7563d0ece7c9ed36c8a83f8361a7a7.webp"
  type="image/x-icon"
/>

<style>
  :root {
    --bg: #f5f8fc;
    --panel: #ffffff;
    --line: #d4deea;
    --ink: #1a2230;
    --muted: #5b6b81;
    --accent: #0a7a6c;
    --accent-2: #1363a2;
  }
  .theme-dark {
    --bg: #0d141d;
    --panel: #132031;
    --line: #2a3a4f;
    --ink: #e6edf5;
    --muted: #a2b1c3;
    --accent: #31c5b3;
    --accent-2: #56a8ff;
  }
  body {
    margin: 0;
    padding: 1rem;
    background:
      radial-gradient(
        circle at 10% 0%,
        rgba(19, 99, 162, 0.15),
        transparent 38%
      ),
      var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", Tahoma, sans-serif;
  }
  .wrap {
    width: min(1080px, 100%);
    margin: 0 auto;
    display: grid;
    gap: 0.75rem;
  }
  .panel {
    border: 1px solid var(--line);
    background: var(--panel);
    border-radius: 12px;
    padding: 0.75rem;
  }
  .row {
    display: flex;
    gap: 0.5rem;
    align-items: center;
    flex-wrap: wrap;
  }
  .grow {
    flex: 1;
  }
  .split {
    display: grid;
    grid-template-columns: 1fr;
    gap: 0.75rem;
  }
  @media (min-width: 900px) {
    .split {
      grid-template-columns: 1fr 1fr;
    }
  }
  textarea,
  select,
  input,
  button {
    font: inherit;
  }
  textarea,
  select,
  input[type="text"] {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: transparent;
    color: inherit;
    padding: 0.5rem;
  }
  #instructionEl {
    min-height: 160px;
    resize: vertical;
  }
  #responseEl {
    min-height: 360px;
    resize: vertical;
  }
  button {
    border: 1px solid var(--line);
    border-radius: 8px;
    background: transparent;
    color: inherit;
    padding: 0.4rem 0.65rem;
    cursor: pointer;
  }
  button.primary {
    border-color: transparent;
    color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
  }
  .muted {
    color: var(--muted);
    font-size: 0.9rem;
  }
  .chip {
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 0.18rem 0.5rem;
    font-size: 0.78rem;
    color: var(--muted);
  }
  .hidden {
    display: none !important;
  }
  .history-item {
    border-top: 1px dashed var(--line);
    margin-top: 0.45rem;
    padding-top: 0.45rem;
  }
</style>

<div class="wrap" id="appRoot">
  <div class="panel row">
    <strong>AI Code Generator</strong>
    <span class="chip" id="modeBadge">mode</span>
    <span class="muted" id="modeDescriptionEl">description</span>
    <div class="grow"></div>
    <button id="themeBtn">Theme</button>
  </div>

  <div class="panel split">
    <div class="row">
      <label class="muted" for="currentModeEl">Mode</label>
      <select id="currentModeEl" class="grow">
        [generateModesHtml()]
      </select>
    </div>
    <div class="row">
      <label class="muted" for="templateEl">Template</label>
      <select id="templateEl" class="grow"></select>
    </div>
    <div class="row">
      <label class="muted" for="runtimeFocusEl">Focus</label>
      <input
        id="runtimeFocusEl"
        type="text"
        placeholder="performance, reliability, security, UX..."
      />
    </div>
  </div>

  <div class="panel">
    <div class="row" style="margin-bottom: 0.45rem">
      <strong>Instruction</strong>
      <div class="grow"></div>
      <button id="enhanceBtn">Enhance</button>
      <button id="shortenBtn">Shorten</button>
      <button id="instructionDeleteBtn" data-mode="delete">Delete</button>
    </div>
    <textarea
      id="instructionEl"
      data-default-placeholder="Type an instruction here."
    ></textarea>
  </div>

  <div class="panel">
    <details>
      <summary><strong>Runtime Settings</strong></summary>
      <div class="split" style="margin-top: 0.6rem">
        <div>
          <label class="muted" for="runtimePresetEl">Preset</label>
          <select id="runtimePresetEl">
            <option value="balanced">balanced</option>
            <option value="strict">strict</option>
            <option value="fast">fast</option>
            <option value="mentor">mentor</option>
            <option value="production">production</option>
          </select>
        </div>
        <div>
          <label class="muted" for="runtimeFormatEl">Format</label>
          <select id="runtimeFormatEl">
            <option value="auto">auto</option>
            <option value="markdown">markdown</option>
            <option value="json">json</option>
            <option value="code">code-first</option>
          </select>
        </div>
        <div>
          <label class="muted" for="runtimeLengthEl">Length</label>
          <select id="runtimeLengthEl">
            <option value="short">short</option>
            <option value="normal">normal</option>
            <option value="long">long</option>
          </select>
        </div>
        <div>
          <label class="muted" for="runtimeCreativityEl">Creativity</label>
          <input
            id="runtimeCreativityEl"
            type="range"
            min="0"
            max="1"
            step="0.05"
            value="0.55"
          />
        </div>
      </div>
      <div class="row" style="margin-top: 0.45rem">
        <label
          ><input id="runtimeChecklistEl" type="checkbox" /> checklist</label
        >
        <label
          ><input id="runtimeFencesEl" type="checkbox" /> strict fences</label
        >
        <label
          ><input id="runtimeCommentsEl" type="checkbox" checked /> include
          comments</label
        >
        <label
          ><input id="autoScrollEl" type="checkbox" checked /> auto-scroll
          output</label
        >
      </div>
    </details>
  </div>

  <div class="panel">
    <div class="row">
      <button id="generateBtn" class="primary">Generate</button>
      <button id="continueBtn" disabled>Continue</button>
      <button id="retryBtn" disabled>Retry</button>
      <button id="stopBtn" style="display: none">Stop</button>
      <span id="loaderEl" class="muted"></span>
      <div class="grow"></div>
      <button id="downloadBtn">Download</button>
      <button id="downloadJsonBtn">Session JSON</button>
      <button id="saveSnapshotBtn">Snapshot</button>
      <button id="notebookBtn">Notebook</button>
    </div>
    <div class="hidden">
      <button id="bottomContinueBtn"></button>
      <button id="bottomStopBtn"></button>
    </div>
  </div>

  <div class="panel">
    <div class="row" style="margin-bottom: 0.45rem">
      <strong>Output</strong>
      <div class="grow"></div>
      <button id="responseCopyBtn" style="display: none">Copy</button>
      <button id="responseDeleteBtn" data-mode="delete">Delete</button>
    </div>
    <textarea id="responseEl" placeholder="AI output appears here."></textarea>
  </div>

  <div id="renderedOutputEl" class="panel muted">
    Rendered output for supported modes appears here.
  </div>

  <div class="panel">
    <div class="row" style="margin-bottom: 0.4rem">
      <strong>Recent History</strong>
      <div class="grow"></div>
      <button id="clearHistoryBtn">Clear</button>
    </div>
    <div id="historyEl" class="muted">No history yet.</div>
  </div>

  <div class="panel">
    <div class="row">
      <button id="commentsToggleBtn">Comments</button>
      <button id="feedbackToggleBtn">Feedback</button>
    </div>
    <div id="commentsCtn" style="margin-top: 0.5rem"></div>
    <div id="feedbackCtn" style="margin-top: 0.5rem"></div>
  </div>
</div>

<script>
  (function () {
    const LS = {
      get(key, fallback) {
        try {
          const v = localStorage.getItem(key);
          return v === null || v === undefined ? fallback : v;
        } catch (_) {
          return fallback;
        }
      },
      set(key, value) {
        try {
          localStorage.setItem(key, value);
        } catch (_) {}
      },
    };

    const TEMPLATES = {
      general: [
        { id: "blank", name: "Blank", text: "" },
        {
          id: "solver",
          name: "Problem Solver",
          text: "Solve the problem with assumptions, approach, and final result.",
        },
      ],
      html: [
        {
          id: "landing",
          name: "Landing Page",
          text: "Build a polished responsive landing page with hero, features, and CTA.",
        },
        {
          id: "dashboard",
          name: "Dashboard",
          text: "Create a dashboard with navigation, cards, and chart placeholders.",
        },
      ],
      python: [
        {
          id: "cli",
          name: "CLI",
          text: "Write a robust Python CLI tool with argparse and clear error handling.",
        },
        {
          id: "analysis",
          name: "Data Analysis",
          text: "Analyze CSV data with pandas and include key plots and summary.",
        },
      ],
      markdown: [
        {
          id: "guide",
          name: "Guide",
          text: "Write a practical guide with steps, examples, and troubleshooting.",
        },
      ],
      typescript: [
        {
          id: "api",
          name: "Typed API",
          text: "Build a typed API client with retries, timeouts, and tests.",
        },
      ],
    };

    const modeEl = document.getElementById("currentModeEl");
    const modeDescriptionEl = document.getElementById("modeDescriptionEl");
    const modeBadge = document.getElementById("modeBadge");
    const templateEl = document.getElementById("templateEl");
    const instructionEl = document.getElementById("instructionEl");
    const responseEl = document.getElementById("responseEl");
    const generateBtn = document.getElementById("generateBtn");
    const continueBtn = document.getElementById("continueBtn");
    const retryBtn = document.getElementById("retryBtn");
    const stopBtn = document.getElementById("stopBtn");
    const bottomContinueBtn = document.getElementById("bottomContinueBtn");
    const bottomStopBtn = document.getElementById("bottomStopBtn");
    const responseCopyBtn = document.getElementById("responseCopyBtn");
    const responseDeleteBtn = document.getElementById("responseDeleteBtn");
    const loaderEl = document.getElementById("loaderEl");
    const runtimeFocusEl = document.getElementById("runtimeFocusEl");
    const autoScrollEl = document.getElementById("autoScrollEl");

    window.instructionEl = instructionEl;
    window.responseEl = responseEl;
    window.generateBtn = generateBtn;
    window.continueBtn = continueBtn;
    window.bottomContinueBtn = bottomContinueBtn;
    window.retryBtn = retryBtn;
    window.stopBtn = stopBtn;
    window.bottomStopBtn = bottomStopBtn;
    window.responseCopyBtn = responseCopyBtn;
    window.responseDeleteBtn = responseDeleteBtn;
    window.loaderEl = loaderEl;
    window.modeDescriptionEl = modeDescriptionEl;
    window.runtimeFocusEl = runtimeFocusEl;
    window.autoScrollEl = autoScrollEl;

    function modeKeyForTemplate(mode) {
      if (mode === "javascript" || mode === "css") return "html";
      return mode;
    }

    function refreshModeUi() {
      const mode = modeEl.value;
      window.currentMode = mode;
      LS.set("currentMode", mode);
      if (window.modes && window.modes[mode]) {
        modeDescriptionEl.textContent = window.modes[mode].description || "";
        modeBadge.textContent = window.modes[mode].label || mode;
        instructionEl.placeholder =
          window.modes[mode].instructionPlaceholder ||
          instructionEl.dataset.defaultPlaceholder;
      }
      buildTemplates();
    }

    function buildTemplates() {
      const key = modeKeyForTemplate(modeEl.value);
      const list = TEMPLATES[key] || TEMPLATES.general;
      templateEl.innerHTML = list
        .map((x) => `<option value="${x.id}">${x.name}</option>`)
        .join("");
      const saved = LS.get("acg.template." + key, list[0] ? list[0].id : "");
      if (saved) templateEl.value = saved;
    }

    function insertTemplate() {
      const key = modeKeyForTemplate(modeEl.value);
      const list = TEMPLATES[key] || TEMPLATES.general;
      const t = list.find((x) => x.id === templateEl.value);
      if (!t) return;
      instructionEl.value = instructionEl.value.trim()
        ? instructionEl.value + "\n\n" + t.text
        : t.text;
      LS.set("instruction", instructionEl.value);
      LS.set("acg.template." + key, templateEl.value);
    }

    function syncOutputState() {
      const has = responseEl.value.trim().length > 0;
      continueBtn.disabled = !has;
      bottomContinueBtn.disabled = !has;
      retryBtn.disabled = !has;
      responseCopyBtn.style.display = has ? "" : "none";
      generateBtn.textContent = has ? "Regenerate" : "Generate";
    }

    function addHistoryItem(item) {
      const rowsRaw = LS.get("acg.history", "[]");
      let rows = [];
      try {
        rows = JSON.parse(rowsRaw) || [];
      } catch (_) {
        rows = [];
      }
      rows.unshift({
        ts: Date.now(),
        mode: item.mode || modeEl.value,
        instruction: item.instruction || "",
        output: item.output || "",
      });
      if (rows.length > 20) rows = rows.slice(0, 20);
      LS.set("acg.history", JSON.stringify(rows));
      renderHistory();
    }
    window.addHistoryItem = addHistoryItem;

    function renderHistory() {
      const el = document.getElementById("historyEl");
      let rows = [];
      try {
        rows = JSON.parse(LS.get("acg.history", "[]")) || [];
      } catch (_) {
        rows = [];
      }
      if (!rows.length) {
        el.textContent = "No history yet.";
        return;
      }
      el.innerHTML = rows
        .map((r, i) => {
          const dt = new Date(r.ts).toLocaleString();
          const snip = (r.instruction || "")
            .slice(0, 130)
            .replace(/</g, "&lt;");
          return `<div class="history-item"><strong>${dt}</strong> <span class="chip">${r.mode}</span><br>${snip}<br><button data-hidx="${i}">Reuse</button></div>`;
        })
        .join("");
      [...el.querySelectorAll("button[data-hidx]")].forEach((btn) => {
        btn.addEventListener("click", () => {
          const rowsNow = JSON.parse(LS.get("acg.history", "[]") || "[]");
          const row = rowsNow[Number(btn.dataset.hidx)];
          if (!row) return;
          modeEl.value = row.mode;
          refreshModeUi();
          instructionEl.value = row.instruction || "";
          responseEl.value = row.output || "";
          LS.set("instruction", instructionEl.value);
          LS.set("response", responseEl.value);
          syncOutputState();
        });
      });
    }

    function downloadOutput(filename, mime, text) {
      const blob = new Blob([text || ""], {
        type: mime || "text/plain;charset=utf-8",
      });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    function modeExt(mode) {
      const map = {
        html: "html",
        python: "py",
        markdown: "md",
        perchanceLists: "perchance",
        perchanceHtml: "html",
        luau: "lua",
        gdscript: "gd",
        csharp_unity: "cs",
        typescript: "ts",
        cpp: "cpp",
        rust: "rs",
        sql: "sql",
      };
      return map[mode] || "txt";
    }

    function enhance(mode) {
      let txt = instructionEl.value.trim();
      if (!txt) return;
      if (mode === "short") {
        txt = txt.replace(/\s+/g, " ").trim();
      } else {
        txt +=
          "\n\nClarify assumptions, constraints, edge cases, and expected output format.";
      }
      instructionEl.value = txt;
      LS.set("instruction", txt);
    }

    function restoreRuntimeSettings() {
      document.getElementById("runtimePresetEl").value = LS.get(
        "acg.preset",
        "balanced",
      );
      document.getElementById("runtimeLengthEl").value = LS.get(
        "acg.length",
        "normal",
      );
      document.getElementById("runtimeFormatEl").value = LS.get(
        "acg.format",
        "auto",
      );
      document.getElementById("runtimeCreativityEl").value = LS.get(
        "acg.creativity",
        "0.55",
      );
      document.getElementById("runtimeChecklistEl").checked =
        LS.get("acg.includeChecklist", "0") === "1";
      document.getElementById("runtimeFencesEl").checked =
        LS.get("acg.strictFences", "0") === "1";
      document.getElementById("runtimeCommentsEl").checked =
        LS.get("acg.includeComments", "1") === "1";
      autoScrollEl.checked = LS.get("acg.autoScroll", "1") === "1";
      runtimeFocusEl.value = LS.get("acg.focus", "");
    }

    function saveRuntimeSettings() {
      LS.set("acg.preset", document.getElementById("runtimePresetEl").value);
      LS.set("acg.length", document.getElementById("runtimeLengthEl").value);
      LS.set("acg.format", document.getElementById("runtimeFormatEl").value);
      LS.set(
        "acg.creativity",
        document.getElementById("runtimeCreativityEl").value,
      );
      LS.set(
        "acg.includeChecklist",
        document.getElementById("runtimeChecklistEl").checked ? "1" : "0",
      );
      LS.set(
        "acg.strictFences",
        document.getElementById("runtimeFencesEl").checked ? "1" : "0",
      );
      LS.set(
        "acg.includeComments",
        document.getElementById("runtimeCommentsEl").checked ? "1" : "0",
      );
      LS.set("acg.autoScroll", autoScrollEl.checked ? "1" : "0");
      LS.set("acg.focus", runtimeFocusEl.value || "");
    }

    function notebookLoad() {
      try {
        return JSON.parse(LS.get("acg.notebook", "[]")) || [];
      } catch (_) {
        return [];
      }
    }

    function notebookSave(rows) {
      LS.set("acg.notebook", JSON.stringify(rows || []));
    }

    function notebookOpen() {
      const rows = notebookLoad();
      const title = prompt("Notebook page title", "Untitled");
      if (title === null) return;
      rows.unshift({
        id: "n_" + Math.random().toString(36).slice(2, 9),
        title: title || "Untitled",
        text: "",
        updatedAt: Date.now(),
      });
      notebookSave(rows);
      alert("Notebook page added. Use Export JSON to back it up.");
    }

    function commentsHtml() {
      if (!window.comments) return "";
      return comments({
        width: "min(780px, 100%)",
        height: "min(58vh, 520px)",
        forceColorScheme: LS.get("forceColorScheme", null),
      });
    }

    function feedbackHtml() {
      if (!window.comments) return "";
      const opts = {
        channel: "feedback",
        hideComments: true,
        height: 140,
        commentPlaceholderText: "Share feedback. Avoid personal info.",
        submitButtonText: "Send",
      };
      const forced = LS.get("forceColorScheme", "");
      if (forced) opts.forceColorScheme = forced;
      return comments(opts);
    }

    function applyTheme(theme) {
      const next = theme === "dark" ? "dark" : "light";
      if (next === "dark") document.body.classList.add("theme-dark");
      else document.body.classList.remove("theme-dark");
      LS.set("forceColorScheme", next);
    }

    modeEl.addEventListener("change", refreshModeUi);
    templateEl.addEventListener("change", insertTemplate);

    instructionEl.addEventListener("input", () => {
      LS.set("instruction", instructionEl.value);
    });

    responseEl.addEventListener("input", () => {
      LS.set("response", responseEl.value);
      syncOutputState();
    });

    generateBtn.addEventListener("click", () => {
      responseEl.value = "";
      syncOutputState();
      generate();
    });

    continueBtn.addEventListener("click", () => {
      instructionEl.value =
        (instructionEl.value || "") +
        "\n\nContinue the previous output and improve quality.";
      LS.set("instruction", instructionEl.value);
      generate();
    });

    retryBtn.addEventListener("click", () => {
      responseEl.value =
        window.responseContentBeforeLastGenerate || responseEl.value;
      syncOutputState();
      generate();
    });

    responseCopyBtn.addEventListener("click", async () => {
      await navigator.clipboard.writeText(responseEl.value || "");
      responseCopyBtn.textContent = "Copied";
      setTimeout(() => (responseCopyBtn.textContent = "Copy"), 1200);
    });

    responseDeleteBtn.addEventListener("click", () => {
      if (responseDeleteBtn.dataset.mode === "delete") {
        window.deletedResponse = responseEl.value;
        responseEl.value = "";
        responseDeleteBtn.dataset.mode = "undo";
        responseDeleteBtn.textContent = "Undo";
      } else {
        responseEl.value = window.deletedResponse || "";
        responseDeleteBtn.dataset.mode = "delete";
        responseDeleteBtn.textContent = "Delete";
      }
      LS.set("response", responseEl.value);
      syncOutputState();
    });

    document
      .getElementById("instructionDeleteBtn")
      .addEventListener("click", () => {
        const btn = document.getElementById("instructionDeleteBtn");
        if (btn.dataset.mode === "delete") {
          window.deletedInstruction = instructionEl.value;
          instructionEl.value = "";
          btn.dataset.mode = "undo";
          btn.textContent = "Undo";
        } else {
          instructionEl.value = window.deletedInstruction || "";
          btn.dataset.mode = "delete";
          btn.textContent = "Delete";
        }
        LS.set("instruction", instructionEl.value);
      });

    document
      .getElementById("enhanceBtn")
      .addEventListener("click", () => enhance("enhance"));
    document
      .getElementById("shortenBtn")
      .addEventListener("click", () => enhance("short"));

    document.getElementById("downloadBtn").addEventListener("click", () => {
      const ext = modeExt(modeEl.value || "general");
      const filename = `acg-${modeEl.value || "general"}-${Date.now()}.${ext}`;
      downloadOutput(
        filename,
        "text/plain;charset=utf-8",
        responseEl.value || "",
      );
    });

    document.getElementById("downloadJsonBtn").addEventListener("click", () => {
      const payload = {
        mode: modeEl.value,
        instruction: instructionEl.value,
        output: responseEl.value,
        settings: {
          preset: document.getElementById("runtimePresetEl").value,
          length: document.getElementById("runtimeLengthEl").value,
          format: document.getElementById("runtimeFormatEl").value,
          creativity: Number(
            document.getElementById("runtimeCreativityEl").value,
          ),
        },
      };
      downloadOutput(
        "acg-session.json",
        "application/json",
        JSON.stringify(payload, null, 2),
      );
    });

    document.getElementById("saveSnapshotBtn").addEventListener("click", () => {
      addHistoryItem({
        mode: modeEl.value,
        instruction: instructionEl.value,
        output: responseEl.value,
      });
    });

    document.getElementById("clearHistoryBtn").addEventListener("click", () => {
      LS.set("acg.history", "[]");
      renderHistory();
    });

    document
      .getElementById("commentsToggleBtn")
      .addEventListener("click", () => {
        const ctn = document.getElementById("commentsCtn");
        ctn.innerHTML = ctn.innerHTML ? "" : commentsHtml();
      });

    document
      .getElementById("feedbackToggleBtn")
      .addEventListener("click", () => {
        const ctn = document.getElementById("feedbackCtn");
        ctn.innerHTML = ctn.innerHTML ? "" : feedbackHtml();
      });

    document.getElementById("themeBtn").addEventListener("click", () => {
      const current = LS.get("forceColorScheme", "light");
      applyTheme(current === "dark" ? "light" : "dark");
      document.getElementById("commentsCtn").innerHTML = "";
      document.getElementById("feedbackCtn").innerHTML = "";
    });

    document
      .getElementById("notebookBtn")
      .addEventListener("click", notebookOpen);

    [
      "runtimePresetEl",
      "runtimeLengthEl",
      "runtimeFormatEl",
      "runtimeCreativityEl",
      "runtimeChecklistEl",
      "runtimeFencesEl",
      "runtimeCommentsEl",
      "autoScrollEl",
      "runtimeFocusEl",
    ].forEach((id) => {
      const node = document.getElementById(id);
      node.addEventListener("change", saveRuntimeSettings);
      node.addEventListener("input", saveRuntimeSettings);
    });

    window.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
        e.preventDefault();
        generate();
      }
    });

    applyTheme(LS.get("forceColorScheme", "light"));

    const startupMode = normalizeMode(
      LS.get("currentMode", modeEl.value || "general"),
    );
    modeEl.value = startupMode;
    window.currentMode = startupMode;

    instructionEl.value = LS.get("instruction", "");
    responseEl.value = LS.get("response", "");
    restoreRuntimeSettings();
    refreshModeUi();
    syncOutputState();
    renderHistory();
  })();
</script>

</body>
</html>
