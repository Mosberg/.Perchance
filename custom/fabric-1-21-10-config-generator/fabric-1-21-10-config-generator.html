<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>fabric-1-21-10-config-generator — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<div class="container">
    <h1>🐛 Fabric 1.21.10 Config Generator</h1>

    <div class="layout">
        <!-- Input Section -->
        <div class="section">
            <h2>Configuration Input</h2>
            <div id="statusMessageEl" class="status-message"></div>

            <div class="form-group">
                <label for="modId">Mod ID</label>
                <input type="text" id="modIdEl" value="myinsectmod" placeholder="e.g., myinsectmod">
            </div>

            <div class="form-group">
                <label for="modName">Mod Name</label>
                <input type="text" id="modNameEl" value="My Insect Mod" placeholder="e.g., My Insect Mod">
            </div>

            <div class="form-group">
                <label for="modDescription">Description</label>
                <textarea id="modDescriptionEl" placeholder="Describe your mod...">A Fabric mod adding custom insects to Minecraft!</textarea>
                <button type="button" class="btn-secondary" onclick="generateAIDescription()">✨ AI Generate Description</button>
            </div>

            <div class="form-group">
                <label for="mavenGroup">Maven Group</label>
                <input type="text" id="mavenGroupEl" value="com.mosberg.myinsectmod" placeholder="e.g., com.mosberg.myinsectmod">
            </div>

            <div class="form-group">
                <label for="modVersion">Mod Version</label>
                <input type="text" id="modVersionEl" value="1.0.0" placeholder="e.g., 1.0.0">
            </div>

            <div class="form-group">
                <label for="authorName">Author Name</label>
                <input type="text" id="authorNameEl" value="Me!" placeholder="Your name">
            </div>

            <div class="form-group">
                <label for="githubUrl">GitHub URL (optional)</label>
                <input type="text" id="githubUrlEl" placeholder="https://github.com/yourusername/yourrepo">
            </div>

            <div class="form-group">
                <label>Mod Icon (AI Generated)</label>
                <div class="icon-preview">
                    <img id="modIconImgEl" style="display: none;" alt="Mod Icon Preview">
                    <div id="iconPlaceholderEl">🖼️ No icon generated</div>
                </div>
                <button type="button" class="btn-secondary" onclick="generateAIIcon()">🎨 AI Generate Icon</button>
                <small>Right-click generated image to save</small>
            </div>

            <div class="button-group">
                <button class="btn-primary" onclick="generateConfigs()">Generate Configs</button>
            </div>
        </div>

        <!-- Output Section -->
        <div class="section">
            <h2>Generated Files</h2>
            
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('gradle-properties')">gradle.properties</button>
                <button class="tab-btn" onclick="switchTab('fabric-mod')">fabric.mod.json</button>
                <button class="tab-btn" onclick="switchTab('build-gradle')">build.gradle</button>
            </div>

            <div id="gradle-properties" class="tab-content active">
                <div class="output-box" id="gradlePropertiesOutputEl"></div>
                <button class="copy-btn" onclick="copyToClipboard('gradlePropertiesOutput')">Copy</button>
            </div>

            <div id="fabric-mod" class="tab-content">
                <div class="output-box" id="fabricModJsonOutputEl"></div>
                <button class="copy-btn" onclick="copyToClipboard('fabricModJsonOutput')">Copy</button>
            </div>

            <div id="build-gradle" class="tab-content">
                <div class="output-box" id="buildGradleOutputEl"></div>
                <button class="copy-btn" onclick="copyToClipboard('buildGradleOutput')">Copy</button>
            </div>
        </div>
    </div>
</div>

<style>
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #1a2a3e 0%, #2d3e50 100%); color: #e0e0e0; margin: 0; padding: 20px; }
  
  .container { max-width: 1200px; margin: 0 auto; background: rgba(30, 40, 55, 0.9); border-radius: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); padding: 25px; }
  
  h1 { text-align: center; color: #4fc3f7; font-size: 2.5rem; margin-bottom: 30px; text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3); }
  
  .layout { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
  
  .section { background: rgba(40, 50, 65, 0.7); border-radius: 10px; padding: 20px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2); }
  
  h2 { color: #81d4fa; border-bottom: 2px solid #3498db; padding-bottom: 10px; margin-top: 0; }
  
  .form-group { margin-bottom: 20px; }
  
  label { display: block; margin-bottom: 8px; color: #bbdefb; font-weight: 500; }
  
  input, textarea { 
    width: 100%; 
    padding: 12px; 
    border: 1px solid #4a6580; 
    border-radius: 6px; 
    background: rgba(30, 40, 55, 0.8); 
    color: #e0e0e0; 
    font-size: 14px;
    transition: border-color 0.3s;
  }
  
  input:focus, textarea:focus { 
    border-color: #4fc3f7; 
    outline: none;
    box-shadow: 0 0 0 2px rgba(79, 195, 247, 0.3);
  }
  
  textarea { min-height: 100px; resize: vertical; }
  
  .btn-primary, .btn-secondary {
    padding: 12px 20px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.3s ease;
    margin-top: 10px;
  }
  
  .btn-primary { 
    background: linear-gradient(to right, #4fc3f7, #29b6f6); 
    color: white; 
    box-shadow: 0 4px 15px rgba(41, 182, 246, 0.3);
  }
  
  .btn-primary:hover { 
    background: linear-gradient(to right, #29b6f6, #03a9f4);
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(41, 182, 246, 0.4);
  }
  
  .btn-secondary { 
    background: linear-gradient(to right, #9c27b0, #8e24aa); 
    color: white; 
    box-shadow: 0 4px 15px rgba(142, 36, 170, 0.3);
  }
  
  .btn-secondary:hover { 
    background: linear-gradient(to right, #8e24aa, #7b1fa2);
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(142, 36, 170, 0.4);
  }
  
  .button-group { margin-top: 25px; }
  
  .tabs { display: flex; border-bottom: 2px solid #34495e; margin-bottom: 15px; }
  
  .tab-btn {
    background: none;
    border: none;
    color: #95a5a6;
    padding: 12px 20px;
    cursor: pointer;
    font-weight: 500;
    border-bottom: 2px solid transparent;
    transition: all 0.3s;
  }
  
  .tab-btn.active { 
    color: #4fc3f7; 
    border-bottom-color: #4fc3f7;
  }
  
  .tab-btn:hover { color: #81d4fa; }
  
  .tab-content { display: none; }
  .tab-content.active { display: block; }
  
  .output-box { 
    background: rgba(30, 40, 55, 0.9); 
    border: 1px solid #4a6580; 
    border-radius: 6px; 
    padding: 15px; 
    font-family: 'Consolas', 'Monaco', monospace; 
    font-size: 13px; 
    white-space: pre-wrap; 
    max-height: 400px; 
    overflow-y: auto;
    color: #e0e0e0;
  }
  
  .copy-btn {
    background: #16a085;
    color: white;
    border: none;
    padding: 8px 15px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
    margin-top: 10px;
    transition: background 0.3s;
  }
  
  .copy-btn:hover { background: #138d75; }
  
  .status-message { 
    padding: 10px 15px; 
    border-radius: 6px; 
    margin-bottom: 20px; 
    text-align: center;
    font-weight: 500;
  }
  
  .status-message.success { background: rgba(76, 175, 80, 0.2); color: #a5d6a7; }
  .status-message.error { background: rgba(244, 67, 54, 0.2); color: #ef9a9a; }
  .status-message.ai-info { background: rgba(156, 39, 176, 0.2); color: #ce93d8; }
  
  .icon-preview {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 128px;
    background: rgba(30, 40, 55, 0.8);
    border: 1px solid #4a6580;
    border-radius: 6px;
    margin-bottom: 10px;
    position: relative;
  }
  
  .icon-preview img { max-width: 128px; max-height: 128px; }
  
  #iconPlaceholderEl { color: #7f8c8d; font-style: italic; }
  
  small { color: #95a5a6; font-size: 12px; display: block; margin-top: 5px; }
  
  @media (max-width: 968px) {
    .layout { grid-template-columns: 1fr; }
  }
  
  @media (max-width: 480px) {
    .container { padding: 15px; }
    h1 { font-size: 2rem; }
  }
</style>

<script>
    function switchTab(tabName) {
        // Hide all tabs
        document.querySelectorAll('.tab-content').forEach(tab => {
            tab.classList.remove('active');
        });
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.remove('active');
        });

        // Show selected tab
        document.getElementById(tabName).classList.add('active');
        event.target.classList.add('active');
    }

    async function generateAIDescription() {
        const btn = event.target;
        btn.disabled = true;
        btn.textContent = "⏳ Generating...";
        
        try {
            const modName = modNameEl.value || "My Mod";
            const modId = modIdEl.value || "mymod";
            const instruction = `Generate a concise and engaging description for a Minecraft Fabric mod named "${modName}" with the mod ID "${modId}". The description should be 1-3 sentences long and suitable for a mod's fabric.mod.json file.`;
            
            const description = await generateText(instruction);
            modDescriptionEl.value = description;
            
            showStatus('ai-info', '✓ AI description generated!');
        } catch (error) {
            showStatus('error', 'Failed to generate AI description: ' + error.message);
        } finally {
            btn.disabled = false;
            btn.textContent = "✨ AI Generate Description";
        }
    }

    async function generateAIIcon() {
        const btn = event.target;
        btn.disabled = true;
        btn.textContent = "⏳ Generating...";
        
        try {
            const modName = modNameEl.value || "My Mod";
            const modId = modIdEl.value || "mymod";
            const prompt = `A 128x128 pixel icon for a Minecraft Fabric mod named "${modName}" with the mod ID "${modId}". The icon should be simple, recognizable, and in a pixel art style. It should represent the mod's theme.`;
            
            const dataUrl = await generateImage(prompt, { resolution: "128x128" });
            modIconImgEl.src = dataUrl;
            modIconImgEl.style.display = "block";
            iconPlaceholderEl.style.display = "none";
            
            showStatus('ai-info', '✓ AI icon generated!');
        } catch (error) {
            showStatus('error', 'Failed to generate AI icon: ' + error.message);
        } finally {
            btn.disabled = false;
            btn.textContent = "🎨 AI Generate Icon";
        }
    }

    async function generateConfigs() {
        const btn = event.target;
        btn.disabled = true;
        btn.textContent = "⏳ Generating...";
        
        try {
            const modId = modIdEl.value || 'mymod';
            const modName = modNameEl.value || 'My Mod';
            const modDescription = modDescriptionEl.value || 'A Fabric mod';
            const mavenGroup = mavenGroupEl.value || 'com.example.mymod';
            const modVersion = modVersionEl.value || '1.0.0';
            const authorName = authorNameEl.value || 'Me!';
            const githubUrl = githubUrlEl.value || 'https://github.com/yourusername/yourrepo';

            if (!modId || !mavenGroup) {
                showStatus('error', 'Mod ID and Maven Group are required!');
                return;
            }

            // Generate gradle.properties
            const gradleProperties = `# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.10
yarn_mappings=1.21.10+build.3
loader_version=0.18.2
loom_version=1.14-SNAPSHOT

# Mod Properties
mod_version=${modVersion}
maven_group=${mavenGroup}
archives_base_name=${modId}

# Dependencies
fabric_version=0.138.3+1.21.10
cloth_config_version=15.2.127
mod_menu_version=11.0.2
rei_version=14.2.699
animation_api_version=0.2.1+1.21
jankson_version=1.2.3
cotton_networking_version=1.0.0
badpackets_version=0.4.3
carpet_version=1.21.10-1.7.10+v240715`;

            // Generate fabric.mod.json
            const fabricModJson = `{
\t"schemaVersion": 1,
\t"id": "${modId}",
\t"version": "\${version}",
\t"name": "${modName}",
\t"description": "${modDescription}",
\t"authors": [
\t\t"${authorName}"
\t],
\t"contact": {
\t\t"homepage": "https://fabricmc.net/",
\t\t"sources": "${githubUrl}"
\t},
\t"license": "CC0-1.0",
\t"icon": "assets/${modId}/icon.png",
\t"environment": "*",
\t"entrypoints": {
\t\t"main": [
\t\t\t"com.mosberg.${modId.replace(/-/g, '')}.${modName.replace(/\\s+/g, '')}"
\t\t],
\t\t"client": [
\t\t\t"com.mosberg.${modId.replace(/-/g, '')}.${modName.replace(/\\s+/g, '')}Client"
\t\t]
\t},
\t"mixins": [
\t\t"${modId}.mixins.json",
\t\t{
\t\t\t"config": "${modId}.client.mixins.json",
\t\t\t"environment": "client"
\t\t}
\t],
\t"depends": {
\t\t"fabricloader": ">=0.18.2",
\t\t"minecraft": "~1.21.10",
\t\t"java": ">=21",
\t\t"fabric-api": "*"
\t},
\t"suggests": {
\t\t"modmenu": "*",
\t\t"cloth-config": "*"
\t}
}`;

            // Generate build.gradle
            const buildGradle = `plugins {
\tid 'net.fabricmc.fabric-loom-remap' version "\${loom_version}"
\tid 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
\tarchivesName = project.archives_base_name
}

repositories {
\tmaven {
\t\tname = "Modrinth"
\t\turl = "https://api.modrinth.com/maven"
\t}
\tmaven {
\t\tname = "Curseforge"
\t\turl = "https://curse.maven"
\t}
\tmaven {
\t\tname = "Jitpack"
\t\turl = "https://jitpack.io"
\t}
\tmaven {
\t\tname = "Terraformers Maven"
\t\turl = "https://maven.terraformersmc.com/"
\t}
}

loom {
\tsplitEnvironmentSourceSets()

\tmods {
\t\t"${modId}" {
\t\t\tsourceSet sourceSets.main
\t\t\tsourceSet sourceSets.client
\t\t}
\t}
}

dependencies {
\t// To change the versions see the gradle.properties file
\tminecraft "com.mojang:minecraft:\${project.minecraft_version}"
\tmappings "net.fabricmc:yarn:\${project.yarn_mappings}:v2"
\tmodImplementation "net.fabricmc:fabric-loader:\${project.loader_version}"

\t// Fabric API
\tmodImplementation "net.fabricmc.fabric-api:fabric-api:\${project.fabric_version}"
\t
\t// Cloth Config
\tmodImplementation "me.shedaniel.cloth:cloth-config-fabric:\${cloth_config_version}"

\t// Mod Menu
\tmodImplementation "com.terraformersmc:modmenu:\${mod_menu_version}"

\t// REI (Roughly Enough Items)
\tmodImplementation "me.shedaniel:RoughlyEnoughItems-fabric:\${rei_version}"
\t
\t// AnimationAPI (for custom entities)
\tmodImplementation "io.github.foundationgames:AnimationAPI:\${animation_api_version}"

\t// Jankson (JSON handling)
\timplementation "blue.endless:jankson:\${jankson_version}"
\t
\t// Cotton Networking
\tmodImplementation "io.github.cottonmc:cotton-networking:\${cotton_networking_version}"
\t
\t// Badpackets (debugging)
\tmodImplementation "lol.bai:badpackets:\${badpackets_version}"

\t// Carpet (server utilities)
\tmodImplementation "carpet:fabric-carpet:\${carpet_version}"
}

processResources {
\tinputs.property "version", project.version

\tfilesMatching("fabric.mod.json") {
\t\texpand "version": inputs.properties.version
\t}
}

tasks.withType(JavaCompile).configureEach {
\tit.options.release = 21
}

java {
\twithSourcesJar()

\tsourceCompatibility = JavaVersion.VERSION_21
\ttargetCompatibility = JavaVersion.VERSION_21
}

jar {
\tinputs.property "archivesName", project.base.archivesName

\tfrom("LICENSE") {
\t\trename { "\${it}_\${inputs.properties.archivesName}"}
\t}
}

// configure the maven publication
publishing {
\tpublications {
\t\tcreate("mavenJava", MavenPublication) {
\t\t\tartifactId = project.archives_base_name
\t\t\tfrom components.java
\t\t}
\t}

\trepositories {
\t\t// Add repositories to publish to here.
\t}
}`;

            // Update outputs
            gradlePropertiesOutputEl.textContent = gradleProperties;
            fabricModJsonOutputEl.textContent = fabricModJson;
            buildGradleOutputEl.textContent = buildGradle;

            showStatus('success', '✓ Configs generated successfully!');
        } finally {
            btn.disabled = false;
            btn.textContent = "Generate Configs";
        }
    }

    function copyToClipboard(elementId) {
        const element = document.getElementById(elementId);
        const text = element.textContent;
        navigator.clipboard.writeText(text).then(() => {
            const btn = event.target;
            const originalText = btn.textContent;
            btn.textContent = '✓ Copied!';
            setTimeout(() => {
                btn.textContent = originalText;
            }, 2000);
        });
    }

    function showStatus(type, message) {
        const statusEl = statusMessageEl;
        statusEl.className = `status-message ${type}`;
        statusEl.textContent = message;
        setTimeout(() => {
            statusEl.className = 'status-message';
        }, 5000);
    }

    // Generate on load
    window.addEventListener('DOMContentLoaded', () => {
        generateConfigs();
    });
</script>
</body>
</html>
