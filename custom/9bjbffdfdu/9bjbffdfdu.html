<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>9bjbffdfdu — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<!-- 
  AI Image Describer - Professional Edition
  - Features: Structured Analysis, Prompt Generation, Metadata Inference, Object Recognition, Q&A.
  - Tech: Vanilla HTML/CSS/JS, generateImage, generateText.
-->

<div style="max-width:1200px; margin:0 auto; padding:20px; font-family:sans-serif; color:#333;">
  
  <!-- Header -->
  <header style="text-align:center; margin-bottom:30px;">
    <h1 style="margin:0; color:#2563eb; font-weight:800; font-size:2.5rem;">AI Image Describer</h1>
    <p style="color:#64748b; margin-top:10px;">Instantly analyze any image. Get detailed descriptions, generate AI-ready prompts, recognize objects, and extract visual insights.</p>
  </header>

  <!-- Controls & Settings -->
  <div style="display:flex; flex-direction:column; gap:15px; align-items:center; margin-bottom:30px;">
    
    <!-- Main Actions -->
    <div style="display:flex; gap:15px; justify-content:center; flex-wrap:wrap;">
      <label style="background:#2563eb; color:white; padding:12px 24px; border-radius:8px; cursor:pointer; font-weight:600; transition:background 0.2s; display:inline-block;" onmouseover="this.style.background='#1d4ed8'" onmouseout="this.style.background='#2563eb'">
        📁 Upload Image
        <input type="file" id="fileInput" accept="image/*" hidden onchange="handleFileUpload(this)">
      </label>
      
      <button id="generateDemoBtn" onclick="generateDemoImage()" style="background:white; color:#2563eb; border:2px solid #2563eb; padding:12px 24px; border-radius:8px; cursor:pointer; font-weight:600; transition:all 0.2s;">
        ✨ Generate Demo Image
      </button>
    </div>

    <!-- Configuration Settings -->
    <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap; background:#f8fafc; padding:10px 20px; border-radius:8px; border:1px solid #e2e8f0;">
      <div style="display:flex; align-items:center; gap:5px;">
        <span style="font-size:0.9rem; font-weight:600; color:#475569;">Style:</span>
        <select id="styleSelect" style="padding:5px 10px; border-radius:4px; border:1px solid #cbd5e1;">
          <option value="auto">Auto</option>
          <option value="photo">Photo</option>
          <option value="cinematic">Cinematic</option>
          <option value="anime">Anime</option>
          <option value="digital art">Digital Art</option>
          <option value="fantasy">Fantasy</option>
          <option value="sci-fi">Sci-Fi</option>
        </select>
      </div>

      <div style="display:flex; align-items:center; gap:5px;">
        <span style="font-size:0.9rem; font-weight:600; color:#475569;">Detail:</span>
        <select id="detailSelect" style="padding:5px 10px; border-radius:4px; border:1px solid #cbd5e1;">
          <option value="simple">Simple</option>
          <option value="descriptive" selected>Descriptive</option>
          <option value="ultra-detailed">Ultra-Detailed</option>
        </select>
      </div>

      <div style="display:flex; align-items:center; gap:5px;">
        <span style="font-size:0.9rem; font-weight:600; color:#475569;">Prompt Length:</span>
        <select id="lengthSelect" style="padding:5px 10px; border-radius:4px; border:1px solid #cbd5e1;">
          <option value="short">Short</option>
          <option value="medium" selected>Medium</option>
          <option value="long">Long</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Main Content Grid -->
  <div style="display:grid; grid-template-columns:1fr 1fr; gap:30px; align-items:start;">
    
    <!-- Left Column: Image Preview -->
    <div style="background:#f8fafc; padding:20px; border-radius:12px; border:1px solid #e2e8f0; text-align:center;">
      <img id="previewImg" src="https://placehold.co/600x400?text=Upload+or+Generate+an+Image" style="max-width:100%; border-radius:8px; box-shadow:0 4px 6px -1px rgba(0,0,0,0.1); min-height:200px; object-fit:contain;">
      <div id="imgControls" style="margin-top:20px;" hidden>
        <button id="describeBtn" onclick="startDescription()" style="background:#10b981; color:white; border:none; padding:12px 24px; border-radius:8px; font-size:1.1rem; cursor:pointer; font-weight:bold; width:100%; transition:background 0.2s;" onmouseover="this.style.background='#059669'" onmouseout="this.style.background='#10b981'">🔍 Describe This Image</button>
      </div>
    </div>

    <!-- Right Column: Analysis & Chat -->
    <div style="display:flex; flex-direction:column; gap:20px;">
      
      <!-- Description Section -->
      <div style="background:white; border:1px solid #e2e8f0; border-radius:12px; padding:20px; box-shadow:0 4px 6px -1px rgba(0,0,0,0.05);">
        <h2 style="margin-top:0; font-size:1.2rem; color:#1e293b; border-bottom:2px solid #f1f5f9; padding-bottom:10px; display:flex; justify-content:space-between; align-items:center;">
          Visual Analysis
          <span id="statusText" style="font-size:0.8rem; font-weight:normal; color:#94a3b8;"></span>
        </h2>
        
        <div id="loadingIndicator" hidden style="text-align:center; color:#64748b; padding:20px;">
          <span style="display:inline-block; animation:spin 1s linear infinite; font-size:1.5rem;">⏳</span>
          <div style="margin-top:5px;">Analyzing visual elements...</div>
        </div>
        
        <div id="descriptionOutputEl" style="white-space:pre-wrap; line-height:1.6; color:#334155; min-height:100px; font-family:'Courier New', Courier, monospace; font-size:0.9rem;">
          <span style="color:#94a3b8; font-style:italic;">Analysis will appear here...</span>
        </div>
      </div>

      <!-- Q&A Section -->
      <div style="background:white; border:1px solid #e2e8f0; border-radius:12px; padding:20px; flex-grow:1; display:flex; flex-direction:column;">
        <h2 style="margin-top:0; font-size:1.2rem; color:#1e293b; border-bottom:2px solid #f1f5f9; padding-bottom:10px;">Ask a Question</h2>
        <div id="chatHistoryEl" style="flex-grow:1; overflow-y:auto; max-height:300px; margin-bottom:15px; display:flex; flex-direction:column; gap:10px;">
          <!-- Chat bubbles will go here -->
        </div>
        <div style="display:flex; gap:10px;">
          <input type="text" id="questionInput" placeholder="Ask about the image (e.g., 'What color is the car?')" style="flex-grow:1; padding:12px; border:1px solid #cbd5e1; border-radius:8px; outline:none; transition:border 0.2s;" onfocus="this.style.borderColor='#2563eb'" onblur="this.style.borderColor='#cbd5e1'">
          <button id="askBtn" onclick="askQuestion()" style="background:#2563eb; color:white; border:none; padding:0 20px; border-radius:8px; cursor:pointer; font-weight:600;">Ask</button>
        </div>
      </div>
      
    </div>
  </div>
</div>

<style>
  @keyframes spin { 100% { transform: rotate(360deg); } }
</style>

<script>
  let currentImageAnalysis = ""; // Store full structured analysis for context
  
  // Handle File Upload
  async function handleFileUpload(input) {
    if (!input.files || !input.files[0]) return;
    let file = input.files[0];
    let reader = new FileReader();
    reader.onload = (e) => {
      previewImg.src = e.target.result;
      imgControls.hidden = false;
      descriptionOutputEl.innerHTML = '<span style="color:#94a3b8; font-style:italic;">New image loaded. Click "Describe This Image" to start.</span>';
      chatHistoryEl.innerHTML = "";
      currentImageAnalysis = "";
    };
    reader.readAsDataURL(file);
  }

  // Generate Demo Image
  async function generateDemoImage() {
    generateDemoBtn.disabled = true;
    generateDemoBtn.textContent = "⏳ Generating...";
    
    let style = styleSelect.value;
    // Adjust prompt based on style selection
    let prompt = "A high-quality photograph of a futuristic cyberpunk city street at night with neon lights, rain, and reflections.";
    if(style === "anime") prompt = "A high quality anime drawing of a magical forest with glowing spirits and floating islands, studio ghibli style.";
    if(style === "fantasy") prompt = "An epic fantasy landscape with a majestic dragon perched on a cliff overlooking a valley of castles, cinematic lighting.";
    
    try {
      let dataUrl = await generateImage(prompt, {resolution:"768x512"});
      previewImg.src = dataUrl;
      imgControls.hidden = false;
      descriptionOutputEl.innerHTML = '<span style="color:#94a3b8; font-style:italic;">Image generated. Click "Describe This Image" to start.</span>';
      chatHistoryEl.innerHTML = "";
      currentImageAnalysis = "";
    } catch (err) {
      descriptionOutputEl.textContent = "Error generating image: " + err;
    }
    
    generateDemoBtn.disabled = false;
    generateDemoBtn.textContent = "✨ Generate Demo Image";
  }

  // Start Description Process
  async function startDescription() {
    describeBtn.disabled = true;
    describeBtn.textContent = "⏳ Analyzing...";
    loadingIndicator.hidden = false;
    descriptionOutputEl.innerHTML = "";
    
    let style = styleSelect.value;
    let detail = detailSelect.value;
    let length = lengthSelect.value;

    // Construct the prompt based on the user's provided Perchance template structure
    let instruction = `You are an expert AI Image Describer. Analyze the provided image and generate a structured report.

Settings:
- Style: ${style}
- Detail Level: ${detail}
- Prompt Length: ${length}

Please provide the output in the following exact structure. Do not deviate from the section headers:

[AI ANALYSIS]
High-level summary including main subject(s), scene type (indoor/outdoor), mood, visual style, notable objects, lighting, and color characteristics.

[DESCRIPTION]
A ${detail} natural-language description of the image, as if explaining it to someone who cannot see it. Mention the main subject, background, environment, colors, lighting, mood, and context.

[PROMPT]
An AI image-generation prompt in a ${style} style, with ${length} length and ${detail} detail. Include Subject, Environment, Style/Medium, Lighting, and Mood. Format as a single clean line.

[NEGATIVE PROMPT]
A concise negative prompt listing things to avoid (unwanted artifacts, distortions, extra limbs, blurry details, low quality). Format as comma-separated.

[TAGS]
A comma-separated list of tags and keywords describing subjects, style, mood, setting, and colors.

[COLOR PALETTE]
List 5-8 key colors in the image with simple names.

[COMPOSITION NOTES]
Short notes on framing, perspective, rule of thirds/symmetry, depth, and visual balance.

[METADATA]
Summarize likely camera settings or environmental conditions (e.g. "soft natural light, outdoor, late afternoon").`;

    let generationPromise = generateText(instruction);
    descriptionOutputEl.innerHTML = generationPromise; // Enables auto-streaming
    
    try {
      currentImageAnalysis = await generationPromise;
    } catch (err) {
      descriptionOutputEl.textContent = "Error analyzing image: " + err;
    }
    
    loadingIndicator.hidden = true;
    describeBtn.disabled = false;
    describeBtn.textContent = "🔍 Describe This Image";
  }

  // Handle Q&A
  async function askQuestion() {
    let question = questionInput.value.trim();
    if (!question) return;
    
    // Add User Question
    let userBubble = document.createElement("div");
    userBubble.style.cssText = "align-self:flex-end; background:#2563eb; color:white; padding:10px 15px; border-radius:12px 12px 0 12px; max-width:80%;";
    userBubble.textContent = question;
    chatHistoryEl.appendChild(userBubble);
    
    questionInput.value = "";
    
    // Add AI Placeholder
    let aiBubble = document.createElement("div");
    aiBubble.style.cssText = "align-self:flex-start; background:#f1f5f9; color:#334155; padding:10px 15px; border-radius:12px 12px 12px 0; max-width:80%;";
    aiBubble.innerHTML = '<span style="display:inline-block; animation:spin 1s linear infinite;">⏳</span>';
    chatHistoryEl.appendChild(aiBubble);
    chatHistoryEl.scrollTop = chatHistoryEl.scrollHeight;

    // Use the full analysis as context for the question
    let contextPrompt = `I am showing you an image. Here is a detailed analysis of it to help you understand it:\n${currentImageAnalysis || "No analysis available yet."}\n\nBased on the image, answer this user question concisely: ${question}`;
    
    try {
      let response = await generateText(contextPrompt);
      aiBubble.textContent = response;
    } catch (err) {
      aiBubble.textContent = "Error getting answer.";
    }
    
    chatHistoryEl.scrollTop = chatHistoryEl.scrollHeight;
  }
  
  questionInput.addEventListener("keypress", (e) => {
    if (e.key === "Enter") askQuestion();
  });
</script>
</body>
</html>
