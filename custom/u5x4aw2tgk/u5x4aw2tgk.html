<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>u5x4aw2tgk — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<!-- A RuneLite client shell with a walking canvas viewport, working minimap, sidebar panels, chat, and click-to-chop trees with Woodcutting XP drops. -->
<style>
  body { margin:0; overflow:hidden; background:#050505; color:#ccc; font-family:'Segoe UI',system-ui,sans-serif; text-align:left; }
  .invSlot:hover { border-color:#888 !important; background:#333 !important; }
</style>

<div style="display:flex;flex-direction:column;width:100vw;height:100vh;">
  <div id="menuBarEl" style="height:28px;background:#1a1a1a;border-bottom:1px solid #333;display:flex;align-items:center;padding:0 10px;gap:16px;font-size:12px;color:#aaa;user-select:none;">
    <span style="color:#c2a054;font-weight:bold;">RuneLite</span>
    <span style="cursor:pointer;" onclick="alert('Coming soon')">File</span>
    <span style="cursor:pointer;" onclick="alert('Coming soon')">View</span>
    <span style="cursor:pointer;" onclick="alert('Coming soon')">Plugins</span>
    <span style="cursor:pointer;" onclick="alert('Coming soon')">Configuration</span>
  </div>
  <div id="appCtn" style="flex:1;display:flex;overflow:hidden;">
    <div id="gameCtn" style="flex:1;position:relative;background:#000;overflow:hidden;">
      <canvas id="gameCanvasEl" style="width:100%;height:100%;display:block;image-rendering:pixelated;cursor:crosshair;"></canvas>
      <canvas id="minimapCanvasEl" width="150" height="150" style="position:absolute;top:4px;right:4px;width:146px;height:146px;background:#1a150e;border:2px solid #5c5346;border-radius:50%;image-rendering:pixelated;"></canvas>
      <div id="chatCtn" style="position:absolute;bottom:0;left:0;width:100%;height:120px;background:rgba(0,0,0,0.92);border-top:2px solid #5c5346;display:flex;flex-direction:column;">
        <div id="chatLogEl" style="flex:1;overflow-y:auto;padding:4px 6px;font-size:13px;line-height:1.4;color:#ffff00;font-family:'Courier New',monospace;"></div>
        <div style="display:flex;height:24px;border-top:1px solid #333;">
          <input id="chatInputEl" placeholder="Type here..." style="flex:1;background:#111;border:none;outline:none;color:#fff;padding:0 6px;font-size:12px;" onkeydown="if(event.key==='Enter') window.sendChat()" />
          <button id="chatBtn" style="width:50px;background:#2a2a2a;color:#fff;border:none;border-left:1px solid #444;cursor:pointer;font-size:12px;" onclick="window.sendChat()">Send</button>
        </div>
      </div>
    </div>
    <div id="sidebarCtn" style="width:220px;background:#1e1e1e;border-left:2px solid #333;display:flex;flex-direction:column;user-select:none;">
      <div id="tabBarEl" style="display:flex;height:36px;background:#2a2a2a;border-bottom:1px solid #444;"></div>
      <div id="panelCtn" style="flex:1;overflow-y:auto;padding:8px;"></div>
    </div>
  </div>
</div>

<script type="module">
  import { createNoise2D } from 'https://esm.sh/simplex-noise@4.0.3';
  
  let noise2D = createNoise2D();
  let canvas = window.gameCanvasEl;
  let ctx = canvas.getContext('2d');
  let mmCanvas = window.minimapCanvasEl;
  let mmCtx = mmCanvas.getContext('2d');
  
  let mapSize = 80;
  let tileSize = 32;
  let map = [];
  let trees = [];
  
  function initMap() {
    map = [];
    for(let y=0; y<mapSize; y++) {
      let row = [];
      for(let x=0; x<mapSize; x++) {
        let n = noise2D(x/15, y/15);
        let t = 0; // grass
        if(n > 0.28) t = 2; // water
        else if(n > 0.08) t = 1; // dirt
        row.push(t);
      }
      map.push(row);
    }
    trees = [];
    for(let i=0; i<300; i++) {
      let tx = Math.floor(Math.random()*mapSize);
      let ty = Math.floor(Math.random()*mapSize);
      if(map[ty][tx] === 0) trees.push({x:tx, y:ty});
    }
  }
  
  let player = {x:40, y:40, tx:40, ty:40};
  
  function resize() {
    canvas.width = canvas.clientWidth;
    canvas.height = canvas.clientHeight;
  }
  window.addEventListener('resize', resize);
  
  function getMousePos(e) {
    let r = canvas.getBoundingClientRect();
    return {x: e.clientX - r.left, y: e.clientY - r.top};
  }
  
  function addChat(msg) {
    let line = document.createElement('div');
    line.textContent = msg;
    window.chatLogEl.appendChild(line);
    window.chatLogEl.scrollTop = window.chatLogEl.scrollHeight;
  }
  
  function addXp(skill, amount) {
    let s = skills.find(z => z.name === skill);
    if(s) {
      s.xp += amount;
      let newLvl = Math.max(1, Math.floor(1 + (s.xp/1154)));
      if(newLvl > s.lvl) s.lvl = newLvl;
    }
    if(activeTab === 'sk') updatePanel();
    showXpDrop(amount);
  }
  
  function showXpDrop(amount) {
    let drop = document.createElement('div');
    drop.style.cssText = 'position:absolute;left:'+(45+Math.random()*10)+'%;top:45%;color:#7fff00;font-weight:bold;font-size:13px;text-shadow:1px 1px 0 #000;pointer-events:none;animation:floatUp 1.2s forwards;';
    drop.textContent = '+' + amount;
    window.gameCtn.appendChild(drop);
    setTimeout(() => drop.remove(), 1200);
  }
  
  window.sendChat = function() {
    let txt = window.chatInputEl.value.trim();
    if(!txt) return;
    addChat('[Player] ' + txt);
    window.chatInputEl.value = '';
  };
  
  function getWorldPos(mx, my) {
    let camX = player.x * tileSize - canvas.width/2;
    let camY = player.y * tileSize - canvas.height/2;
    return {
      x: Math.floor((mx + camX)/tileSize),
      y: Math.floor((my + camY)/tileSize)
    };
  }
  
  canvas.addEventListener('mousedown', e => {
    let m = getMousePos(e);
    let w = getWorldPos(m.x, m.y);
    if(w.x < 0 || w.y < 0 || w.x >= mapSize || w.y >= mapSize) return;
    let tree = trees.find(t => t.x === w.x && t.y === w.y);
    if(tree) {
      addXp('Woodcutting', 25);
      addChat('You get some logs.');
      return;
    }
    player.tx = w.x;
    player.ty = w.y;
  });
  
  let lastTime = 0;
  function updateGame(time) {
    let dt = (time - lastTime) / 16.67;
    lastTime = time;
    
    let dx = player.tx - player.x;
    let dy = player.ty - player.y;
    let dist = Math.hypot(dx, dy);
    if(dist > 0.05) {
      let speed = 0.12 * dt;
      player.x += Math.sign(dx) * Math.min(Math.abs(dx), speed);
      player.y += Math.sign(dy) * Math.min(Math.abs(dy), speed);
    }
    
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    let camX = player.x * tileSize - canvas.width/2;
    let camY = player.y * tileSize - canvas.height/2;
    
    let sx = Math.max(0, Math.floor(camX/tileSize));
    let ex = Math.min(mapSize, Math.ceil((camX + canvas.width)/tileSize));
    let sy = Math.max(0, Math.floor(camY/tileSize));
    let ey = Math.min(mapSize, Math.ceil((camY + canvas.height)/tileSize));
    
    for(let y=sy; y<ey; y++) {
      for(let x=sx; x<ex; x++) {
        let t = map[y][x];
        let px = x*tileSize - camX;
        let py = y*tileSize - camY;
        ctx.fillStyle = t===2 ? '#3B6E8F' : t===1 ? '#6B5C43' : '#4B6B3C';
        ctx.fillRect(px, py, tileSize+1, tileSize+1);
      }
    }
    
    let renderList = [];
    for(let t of trees) {
      if(t.x >= sx && t.x < ex && t.y >= sy && t.y < ey) renderList.push({type:'tree', x:t.x, y:t.y});
    }
    renderList.push({type:'player', x:player.x, y:player.y});
    renderList.sort((a,b) => a.y - b.y);
    
    for(let o of renderList) {
      if(o.type === 'tree') {
        let px = o.x*tileSize - camX;
        let py = o.y*tileSize - camY;
        ctx.fillStyle = '#5c4033';
        ctx.fillRect(px+12, py+16, 8, 16);
        ctx.fillStyle = '#2d5a27';
        ctx.beginPath();
        ctx.arc(px+16, py+14, 12, 0, Math.PI*2);
        ctx.fill();
      } else {
        let px = o.x*tileSize - camX + tileSize/2;
        let py = o.y*tileSize - camY + tileSize/2;
        ctx.fillStyle = '#2b4d9e';
        ctx.fillRect(px-6, py-2, 12, 14);
        ctx.fillStyle = '#e0ac69';
        ctx.beginPath();
        ctx.arc(px, py-6, 7, 0, Math.PI*2);
        ctx.fill();
        ctx.fillRect(px-10, py-1, 4, 10);
        ctx.fillRect(px+6, py-1, 4, 10);
        ctx.fillStyle = '#3d3d3d';
        ctx.fillRect(px-6, py+12, 5, 10);
        ctx.fillRect(px+1, py+12, 5, 10);
      }
    }
    
    renderMinimap();
    requestAnimationFrame(updateGame);
  }
  
  function renderMinimap() {
    let w = mmCanvas.width, h = mmCanvas.height;
    let cx = w/2, cy = h/2, scale = 2;
    mmCtx.save();
    mmCtx.beginPath();
    mmCtx.arc(cx, cy, w/2 - 1, 0, Math.PI*2);
    mmCtx.clip();
    mmCtx.fillStyle = '#1a150e';
    mmCtx.fillRect(0,0,w,h);
    let offX = player.x - cx/scale;
    let offY = player.y - cy/scale;
    for(let y=0; y<h/scale+1; y++) {
      for(let x=0; x<w/scale+1; x++) {
        let tx = Math.floor(x + offX);
        let ty = Math.floor(y + offY);
        if(tx>=0 && ty>=0 && tx<mapSize && ty<mapSize) {
          let t = map[ty][tx];
          mmCtx.fillStyle = t===2 ? '#3a6b8a' : t===1 ? '#5c5346' : '#2d4a2b';
          mmCtx.fillRect(x*scale, y*scale, scale, scale);
        }
      }
    }
    mmCtx.fillStyle = '#ff0';
    mmCtx.fillRect(cx-2, cy-2, 4, 4);
    mmCtx.restore();
  }
  
  let tabs = [
    {id:'inv', name:'Inventory', svg:'<svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 8h18M3 16h18M8 3v18M16 3v18"/></svg>'},
    {id:'eq', name:'Worn Equipment', svg:'<svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;"><path d="M12 2L2 7v10c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-10-5z"/></svg>'},
    {id:'sk', name:'Skills', svg:'<svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:currentColor;"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>'},
    {id:'pr', name:'Prayer', svg:'<svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:currentColor;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>'},
    {id:'mg', name:'Magic', svg:'<svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:currentColor;"><path d="M7.5 5.6L5 7l1.4-2.5L5 2l2.5 1.4L10 2 8.6 4.5 10 7 7.5 5.6zm12.1 4.9l-1.4 2.5 2.5-1.4 2.5 1.4-1.4-2.5 1.4-2.5-2.5 1.4-2.5-1.4 1.4 2.5zM12 14c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4zm0 6c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>'},
    {id:'st', name:'Settings', svg:'<svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:currentColor;"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84a.484.484 0 0 0-.48.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.488.488 0 0 0-.59.22L3.16 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.27.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54c.59-.24 1.13-.58 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>'}
  ];
  
  let activeTab = 'inv';
  
  tabs.forEach(t => {
    let d = document.createElement('div');
    d.style.cssText = 'flex:1;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0.6;';
    d.innerHTML = t.svg;
    d.title = t.name;
    d.onclick = () => { activeTab = t.id; renderTabs(); updatePanel(); };
    window.tabBarEl.appendChild(d);
  });
  
  function renderTabs() {
    Array.from(window.tabBarEl.children).forEach((d,i) => {
      let active = tabs[i].id === activeTab;
      d.style.opacity = active ? '1' : '0.6';
      d.style.background = active ? '#3a3a3a' : '';
      d.style.borderBottom = active ? '2px solid #c2a054' : '2px solid transparent';
    });
  }
  
  let skills = [
    {name:'Attack', lvl:1, xp:0}, {name:'Hitpoints', lvl:10, xp:1154}, {name:'Mining', lvl:1, xp:0},
    {name:'Strength', lvl:1, xp:0}, {name:'Agility', lvl:1, xp:0}, {name:'Smithing', lvl:1, xp:0},
    {name:'Defence', lvl:1, xp:0}, {name:'Herblore', lvl:1, xp:0}, {name:'Fishing', lvl:1, xp:0},
    {name:'Ranged', lvl:1, xp:0}, {name:'Thieving', lvl:1, xp:0}, {name:'Cooking', lvl:1, xp:0},
    {name:'Prayer', lvl:1, xp:0}, {name:'Crafting', lvl:1, xp:0}, {name:'Firemaking', lvl:1, xp:0},
    {name:'Magic', lvl:1, xp:0}, {name:'Fletching', lvl:1, xp:0}, {name:'Woodcutting', lvl:1, xp:0},
    {name:'Runecraft', lvl:1, xp:0}, {name:'Slayer', lvl:1, xp:0}, {name:'Farming', lvl:1, xp:0},
    {name:'Construction', lvl:1, xp:0}, {name:'Hunter', lvl:1, xp:0}
  ];
  
  function updatePanel() {
    let c = window.panelCtn;
    c.innerHTML = '';
    let h = document.createElement('div');
    h.style.cssText = 'font-size:14px;color:#c2a054;margin-bottom:8px;border-bottom:1px solid #444;padding-bottom:2px;';
    let cur = tabs.find(x => x.id === activeTab);
    h.textContent = cur ? cur.name : '';
    c.appendChild(h);
    
    if(activeTab === 'inv') {
      let g = document.createElement('div');
      g.style.cssText = 'display:grid;grid-template-columns:repeat(4,1fr);gap:3px;';
      for(let i=0; i<28; i++) {
        let s = document.createElement('div');
        s.className = 'invSlot';
        s.style.cssText = 'aspect-ratio:1;background:#2a2a2a;border:1px solid #444;display:flex;align-items:center;justify-content:center;font-size:11px;color:#aaa;cursor:pointer;';
        if(i===0) { s.textContent = 'Shrimp'; s.onclick = () => addXp('Cooking', 20); }
        if(i===3) { s.textContent = 'Logs'; s.onclick = () => addXp('Woodcutting', 10); }
        if(i===4) s.textContent = 'Knife';
        if(i===10) { s.textContent = 'GP'; s.style.color = '#ffd700'; }
        g.appendChild(s);
      }
      c.appendChild(g);
    } else if(activeTab === 'sk') {
      skills.forEach(s => {
        let r = document.createElement('div');
        r.style.cssText = 'display:flex;justify-content:space-between;padding:3px 4px;font-size:12px;border-bottom:1px solid #2a2a2a;';
        r.innerHTML = `<span style="color:#aaa;">${s.name}</span><span style="color:#fff;font-weight:bold;">${s.lvl}</span>`;
        c.appendChild(r);
      });
    } else if(activeTab === 'eq') {
      let wrap = document.createElement('div');
      wrap.style.cssText = 'display:grid;grid-template-columns:repeat(3,1fr);gap:4px;';
      let slots = ['Head','Cape','Amulet','Weapon','Body','Shield','Legs','Hands','Feet','Ring','Ammo',''];
      slots.forEach(s => {
        let d = document.createElement('div');
        d.style.cssText = 'aspect-ratio:1;background:#222;border:1px solid #555;display:flex;align-items:center;justify-content:center;font-size:10px;color:#777;';
        d.textContent = s;
        wrap.appendChild(d);
      });
      c.appendChild(wrap);
    } else {
      let p = document.createElement('div');
      p.style.cssText = 'color:#666;font-size:12px;text-align:center;margin-top:20px;';
      p.textContent = 'Plugin panel placeholder';
      c.appendChild(p);
    }
  }
  
  let style = document.createElement('style');
  style.textContent = '@keyframes floatUp { 0%{opacity:1;transform:translateY(0);} 100%{opacity:0;transform:translateY(-40px);} }';
  document.head.appendChild(style);
  
  resize();
  initMap();
  renderTabs();
  updatePanel();
  addChat('Welcome to RuneLite.');
  addChat('Click the world to walk. Click trees to chop them.');
  requestAnimationFrame(updateGame);
</script>
</body>
</html>
