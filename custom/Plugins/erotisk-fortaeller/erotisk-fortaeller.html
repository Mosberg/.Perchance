<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>erotisk-fortaeller — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<div
    id="app-container"
    style="
        max-width: 800px;
        margin: 0 auto;
        font-family: &quot;Segoe UI&quot;, Tahoma, Geneva, Verdana, sans-serif;
        background-color: #1a1a1a;
        color: #f5f5f5;
        padding: 20px;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    "
>
    <header style="text-align: center; margin-bottom: 30px">
        <h1
            style="
                color: #ff4d6d;
                font-size: 2.5rem;
                text-transform: uppercase;
                letter-spacing: 2px;
            "
        >
            Erotisk Fortæller
        </h1>
        <p style="font-style: italic; color: #ccc">
            Hvor begær bliver til ord, og spænding bliver til nydelse.
        </p>
    </header>

    <!-- Control Panel -->
    <div
        id="control-panel"
        style="
            background: #2a2a2a;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #444;
            margin-bottom: 20px;
        "
    >
        <div
            style="
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 15px;
                margin-bottom: 20px;
            "
        >
            <div>
                <label
                    style="
                        display: block;
                        margin-bottom: 5px;
                        font-weight: bold;
                        color: #ff4d6d;
                    "
                    >Vælg Mode:</label
                >
                <select
                    id="modeSelect"
                    style="
                        width: 100%;
                        padding: 10px;
                        background: #333;
                        color: white;
                        border: 1px solid #555;
                        border-radius: 5px;
                    "
                >
                    <option value="story">Erotisk Novelle</option>
                    <option value="character">Karakter-Rollespil</option>
                </select>
            </div>
            <div id="charSelectContainer" style="display: none">
                <label
                    style="
                        display: block;
                        margin-bottom: 5px;
                        font-weight: bold;
                        color: #ff4d6d;
                    "
                    >Vælg Personlighed:</label
                >
                <select
                    id="characterSelectInput"
                    style="
                        width: 100%;
                        padding: 10px;
                        background: #333;
                        color: white;
                        border: 1px solid #555;
                        border-radius: 5px;
                    "
                >
                    <option value="viking">Rå Viking</option>
                    <option value="bard">Poetisk Bard</option>
                    <option value="witch">Mystisk Heks</option>
                    <option value="robot">Logisk Robot</option>
                </select>
            </div>
        </div>

        <div style="margin-bottom: 20px">
            <label
                style="
                    display: block;
                    margin-bottom: 5px;
                    font-weight: bold;
                    color: #ff4d6d;
                "
                >Din Prompt / Start på historien:</label
            >
            <textarea
                id="promptInput"
                rows="4"
                style="
                    width: 100%;
                    padding: 10px;
                    background: #333;
                    color: white;
                    border: 1px solid #555;
                    border-radius: 5px;
                    box-sizing: border-box;
                "
                placeholder="Beskriv scenariet, personerne eller gnisten..."
            ></textarea>
        </div>

        <div style="display: flex; gap: 10px">
            <button
                id="generateBtn"
                style="
                    flex: 2;
                    padding: 12px;
                    background: #ff4d6d;
                    color: white;
                    border: none;
                    border-radius: 5px;
                    cursor: pointer;
                    font-weight: bold;
                    transition: 0.3s;
                "
            >
                Generér Erotik
            </button>
            <button
                id="optimizeBtn"
                style="
                    flex: 1;
                    padding: 12px;
                    background: #555;
                    color: white;
                    border: none;
                    border-radius: 5px;
                    cursor: pointer;
                    transition: 0.3s;
                "
            >
                Optimer Prompt
            </button>
        </div>
    </div>

    <!-- Output Area -->
    <div id="outputContainer" style="display: none">
        <img
            id="storyImage"
            src=""
            style="
                width: 100%;
                height: 300px;
                object-fit: cover;
                border-radius: 10px;
                margin-bottom: 20px;
                border: 2px solid #ff4d6d;
            "
        />
        <div
            id="outputEl"
            style="
                line-height: 1.6;
                font-size: 1.1rem;
                white-space: pre-wrap;
                color: #ddd;
                background: #222;
                padding: 20px;
                border-radius: 10px;
                border-left: 4px solid #ff4d6d;
            "
        ></div>
        <button
            id="continueBtn"
            style="
                margin-top: 20px;
                padding: 10px 20px;
                background: transparent;
                color: #ff4d6d;
                border: 1px solid #ff4d6d;
                border-radius: 5px;
                cursor: pointer;
                display: none;
            "
        >
            Fortsæt historien... ➔
        </button>
    </div>

    <div
        id="loading"
        style="
            display: none;
            text-align: center;
            color: #ff4d6d;
            margin: 20px 0;
        "
    >
        <span class="loader">⌛ Skriver lidenskabelige ord...</span>
    </div>
</div>

<script>
    // Mocking the external API functions provided in the instruction
    const generateText = async ({ instruction, onChunk }) => {
        // Simulation of AI response for demo purposes
        const responses = [
            "Hendes fingre strejfede hans nakke, en elektrisk spænding der fik alt andet til at forsvinde. 'Du har ventet for længe,' hviskede hun, mens hendes læber næsten rørte hans.",
            "Rummet var badet i et svagt rødt lys. Han kunne mærke hendes varme ånde mod sin hud, en invitation han ikke kunne modstå. Hver berøring føltes som en gnist i mørket.",
            "Med et langsomt, bevidst blik mødte hun hans øjne. Der var ingen tvivl længere; kun et overvældende begær, der krævede at blive mættet her og nu."
        ];

        let text = responses[Math.floor(Math.random() * responses.length)];
        for (let char of text) {
            onChunk({ textChunk: char });
            await new Promise(r => setTimeout(r, 30));
        }
        return { text: text };
    };

    // State Management
    let lastOutput = "";
    const modeSelect = document.getElementById("modeSelect");
    const charSelectContainer = document.getElementById("charSelectContainer");
    const promptInput = document.getElementById("promptInput");
    const outputEl = document.getElementById("outputEl");
    const outputContainer = document.getElementById("outputContainer");
    const continueBtn = document.getElementById("continueBtn");
    const loading = document.getElementById("loading");
    const storyImage = document.getElementById("storyImage");

    // UI Logic
    modeSelect.addEventListener("change", () => {
        charSelectContainer.style.display =
            modeSelect.value === "character" ? "block" : "none";
    });

    async function handleGenerate() {
        const mode = modeSelect.value;
        const charValue = document.getElementById("characterSelectInput").value;
        let system = "Skriv på flydende dansk.";

        if (mode === "story") {
            system =
                "Du er en dansk erotisk sexhistorie og sexnovelle forfatter og fortæller. Skriv levende erotiske, billedrigt og kapitel-baseret.";
        } else if (mode === "character") {
            let personalities = {
                viking: "Du er en rå, ærefuld nordisk kriger.",
                bard: "Du er en dramatisk, poetisk bard.",
                witch: "Du er en mystisk heks med mørk humor.",
                robot: "Du er en logisk robot med tør humor."
            };
            system = personalities[charValue];
        }

        const prompt = promptInput.value;
        const fullInstruction = `${system}\n\nInstruktion: Skriv på dansk og sørg for at den laver de frækkeste sexhistorier, sexnoveller, som alle er spækket med erotik, spænding, kærlighed, forførelse og hed sex.\n\nBrugerens input: ${prompt}`;

        await runGeneration(fullInstruction);
    }

    async function runGeneration(instruction) {
        loading.style.display = "block";
        outputContainer.style.display = "none";
        outputEl.textContent = "";
        continueBtn.style.display = "none";

        // Random Erotic Image from Unsplash
        storyImage.src = `https://source.unsplash.com/random/?romance,passion,sensual`;

        const result = await generateText({
            instruction: instruction,
            onChunk: d => {
                loading.style.display = "none";
                outputContainer.style.display = "block";
                outputEl.textContent += d.textChunk;
            }
        });

        lastOutput = result.text;
        continueBtn.style.display = "block";
    }

    async function optimizePrompt() {
        const p = promptInput.value;
        if (!p) return alert("Skriv noget først!");

        loading.style.display = "block";
        const result = await generateText({
            instruction: "Forbedr denne prompt på dansk: " + p,
            onChunk: () => {}
        });
        promptInput.value = result.text;
        loading.style.display = "none";
    }

    async function continueStory() {
        if (!lastOutput) return;

        loading.style.display = "block";
        continueBtn.style.display = "none";

        await generateText({
            instruction: "Fortsæt historien i samme stil: " + lastOutput,
            onChunk: d => {
                loading.style.display = "none";
                outputEl.textContent += d.textChunk;
            }
        });
        continueBtn.style.display = "block";
    }

    document
        .getElementById("generateBtn")
        .addEventListener("click", handleGenerate);
    document
        .getElementById("optimizeBtn")
        .addEventListener("click", optimizePrompt);
    continueBtn.addEventListener("click", continueStory);
</script>

</body>
</html>
