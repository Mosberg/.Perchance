<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>theme-selector-plugin-and-themes-css-link-plugin — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<!-- Theme Selector Plugin and Themes CSS Link Plugin -->
<div class="theme-selector">
  <h1 id="header">🎨 Theme Selector Plugin and Themes CSS Link Plugin</h1>
  <label for="themeSelectEl">🎨 Theme:</label>
  <select id="themeSelectEl" aria-label="Select visual theme">
    <option value="dark" data-desc="Dimmed elegance 🌑">Dark</option>
    <option value="light" data-desc="Bright & clean ☀️">Light</option>
    <option value="cosmic" data-desc="Galactic glow 🌌">Cosmic</option>
    <option value="forest" data-desc="Earthy calm 🌲">Forest</option>
    <option value="frost" data-desc="Cool & crisp ❄️">Frost</option>
    <option value="matrix" data-desc="Digital green 💻">Matrix</option>
    <option value="ocean" data-desc="Deep blue 🌊">Ocean</option>
    <option value="retro" data-desc="Old-school vibes 🕹️">Retro</option>
    <option value="sunset" data-desc="Warm twilight 🌇">Sunset</option>
  </select>
  <button id="resetThemeEl" aria-label="Reset to default theme">
    ♻️ Reset
  </button>
  <p id="themeDescriptionEl" class="theme-desc" aria-live="polite"></p>

  <h2 id="footer">Created by Mosberg</h2>
</div>

<!-- Internal scripts -->
<script defer>
  document.addEventListener("DOMContentLoaded", () => {
    const select = document.getElementById("themeSelectEl");
    const desc = document.getElementById("themeDescriptionEl");
    const resetBtn = document.getElementById("resetThemeEl");
    const defaultTheme = "dark";

    const applyTheme = (theme) => {
      document.documentElement.setAttribute("data-theme", theme);
      localStorage.setItem("homepageTheme", theme);
      const selected = select.querySelector(`option[value="${theme}"]`);
      desc.textContent = selected?.dataset.desc || "";
      select.value = theme;
    };

    const saved = localStorage.getItem("homepageTheme") || defaultTheme;
    applyTheme(saved);

    select.addEventListener("change", (e) => applyTheme(e.target.value));
    resetBtn.addEventListener("click", () => {
      localStorage.removeItem("homepageTheme");
      applyTheme(defaultTheme);
    });

    select.addEventListener("input", () => {
      const selected = select.options[select.selectedIndex];
      desc.textContent = selected?.dataset.desc || "";
    });
  });
</script>

<!-- External styles: themes.css -->
<link rel="stylesheet" href="https://mosberg.github.io/src/styles/themes.css" />

<!-- Internal styles -->
<style>
  .theme-selector {
    display: inline-block;
    margin: 1rem;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    border: var(--second-border-color) var(--border-width) solid;
    border-radius: var(--border-radius);
    background-color: var(--second-bg-color);
    padding: 1.5em;
    color: var(--second-text-color);
    font-family: var(--font-family);
  }

  .theme-selector label,
  .theme-selector select,
  .theme-selector button {
    font-size: 1rem;
    font-family: inherit;
  }

  label {
    margin-inline-end: 0.5em;
    color: var(--second-text-color);
    font-weight: bold;
  }

  select,
  button {
    transition: background-color 0.2s ease, color 0.2s ease,
      border-color 0.2s ease;
    cursor: pointer;
    margin-inline-end: 0.5em;
    border: 1px solid var(--second-border-color);
    border-radius: 4px;
    background-color: var(--first-bg-color);
    padding: 0.5em 1em;
    color: var(--first-text-color);
  }

  select:hover,
  button:hover,
  select:focus,
  button:focus {
    outline: none;
    border-color: var(--accent-color);
    background-color: var(--accent-color);
    color: var(--first-button-text-color);
  }

  .theme-desc {
    margin-top: 0.5em;
    border: var(--second-border-color) var(--border-width) solid;
    border-radius: var(--border-radius);
    padding: 0.5em 1em;
    color: var(--second-text-color);
    font-weight: bold;
    font-size: 1em;
  }

  #header {
    margin-bottom: 2em;
    color: var(--second-text-color);
    text-align: center;
  }

  #footer {
    margin-top: 2em;
    color: var(--third-text-color);
    text-align: center;
  }
</style>

</body>
</html>
