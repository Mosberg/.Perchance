<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>ajbl5lpjln — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<div id="gameboyCtn" style="position:relative; max-width:800px; margin:0 auto; background:#333; border-radius:30px; padding:20px; box-shadow:0 0 30px rgba(0,0,0,0.5); font-family:monospace;">
  <!-- Screen Area -->
  <div id="screenEl" style="width:100%; aspect-ratio:10/9; background:#9bbc0f; border-radius:10px; position:relative; overflow:hidden; border:5px solid #0f380f;">
    <div id="gameDisplayEl" style="position:absolute; inset:10px; background:#9bbc0f; color:#0f380f; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:10px; box-sizing:border-box;">
      <div id="gameContentEl" style="font-size:1.2em; line-height:1.5; max-height:100%; overflow:auto;">
        <div id="titleScreenEl">
          <h1 style="margin:0; font-size:1.8em;">AI GAMEBOY</h1>
          <p style="margin:10px 0;">Press START to play</p>
        </div>
        <div id="gameAreaEl" hidden>
          <div id="mapDisplayEl" style="display:grid; grid-template-columns:repeat(10,1fr); gap:2px; max-width:300px; margin:0 auto;">
            <!-- Map tiles will be generated here -->
          </div>
          <div id="eventDisplayEl" style="margin-top:15px; font-size:0.9em; min-height:80px;"></div>
          <div id="statsDisplayEl" style="margin-top:10px; font-size:0.8em;">
            HP: <span id="hpEl">100</span> | XP: <span id="xpEl">0</span> | Level: <span id="levelEl">1</span>
          </div>
        </div>
        <div id="settingsMenuEl" hidden>
          <h2>Settings</h2>
          <div style="margin:15px 0;">
            <label>AI Event Frequency: <span id="aiFreqValueEl">50</span>%</label>
            <input type="range" id="aiFreqSliderEl" min="10" max="90" value="50" style="width:100%; margin:5px 0;">
          </div>
          <div style="margin:15px 0;">
            <label>AI Creativity: <span id="aiCreativityValueEl">Medium</span></label>
            <select id="aiCreativitySelectEl" style="width:100%; padding:5px; margin:5px 0;">
              <option>Low</option>
              <option selected>Medium</option>
              <option>High</option>
            </select>
          </div>
          <div style="margin:15px 0;">
            <label><input type="checkbox" id="soundToggleEl" checked> Enable Sound</label>
          </div>
          <div style="margin:15px 0;">
            <label><input type="checkbox" id="animationToggleEl" checked> Enable Animations</label>
          </div>
          <button onclick="saveSettings()" style="padding:8px 15px; background:#0f380f; color:#9bbc0f; border:none; border-radius:5px; cursor:pointer;">Save Settings</button>
        </div>
      </div>
      <div id="loadingEl" hidden style="position:absolute; inset:0; background:rgba(0,0,0,0.7); color:white; display:flex; align-items:center; justify-content:center;">
        <span>Generating...</span>
      </div>
    </div>
  </div>

  <!-- Control Panel -->
  <div id="controlsEl" style="display:flex; justify-content:space-between; margin-top:20px; padding:0 10px;">
    <!-- D-Pad -->
    <div style="position:relative; width:150px; height:150px;">
      <button id="upBtn" class="dpadBtn" style="position:absolute; top:0; left:50%; transform:translateX(-50%); width:50px; height:50px;" onclick="movePlayer('up')">↑</button>
      <button id="leftBtn" class="dpadBtn" style="position:absolute; top:50%; left:0; transform:translateY(-50%); width:50px; height:50px;" onclick="movePlayer('left')">←</button>
      <button id="rightBtn" class="dpadBtn" style="position:absolute; top:50%; right:0; transform:translateY(-50%); width:50px; height:50px;" onclick="movePlayer('right')">→</button>
      <button id="downBtn" class="dpadBtn" style="position:absolute; bottom:0; left:50%; transform:translateX(-50%); width:50px; height:50px;" onclick="movePlayer('down')">↓</button>
    </div>

    <!-- Action Buttons -->
    <div style="display:flex; gap:20px; align-items:center;">
      <button id="aBtn" class="actionBtn" style="width:60px; height:60px; border-radius:50%; background:#c84c0c; color:white; border:none; font-size:1.5em; font-weight:bold;" onclick="actionButton()">A</button>
      <button id="bBtn" class="actionBtn" style="width:60px; height:60px; border-radius:50%; background:#0c84c8; color:white; border:none; font-size:1.5em; font-weight:bold;" onclick="backButton()">B</button>
    </div>
  </div>

  <!-- Function Buttons -->
  <div style="display:flex; justify-content:center; gap:20px; margin-top:20px;">
    <button id="startBtn" style="padding:10px 20px; background:#0f380f; color:#9bbc0f; border:none; border-radius:5px; cursor:pointer;" onclick="startGame()">START</button>
    <button id="settingsBtn" style="padding:10px 20px; background:#0f380f; color:#9bbc0f; border:none; border-radius:5px; cursor:pointer;" onclick="openSettings()">SETTINGS</button>
    <button id="saveBtn" style="padding:10px 20px; background:#0f380f; color:#9bbc0f; border:none; border-radius:5px; cursor:pointer;" onclick="saveGame()">SAVE</button>
  </div>

  <!-- AI Feature Indicator -->
  <div id="aiStatusEl" style="position:absolute; top:10px; right:10px; background:rgba(0,0,0,0.7); color:#9bbc0f; padding:5px 10px; border-radius:5px; font-size:0.8em;">
    AI: <span id="aiModeEl">READY</span>
  </div>
</div>

<style>
  .dpadBtn {
    background: #555;
    color: #9bbc0f;
    border: none;
    border-radius: 5px;
    font-size: 1.5em;
    cursor: pointer;
    transition: all 0.1s;
  }
  .dpadBtn:active, .actionBtn:active {
    transform: scale(0.95);
    background: #777;
  }
  .actionBtn {
    box-shadow: 0 4px 0 rgba(0,0,0,0.3);
    cursor: pointer;
    transition: all 0.1s;
  }
  #gameDisplayEl {
    transition: all 0.3s ease;
  }
  .tile {
    width: 100%;
    aspect-ratio: 1/1;
    background: #8bac0f;
    border: 1px solid #0f380f;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5em;
  }
  .player-tile {
    background: #0f380f;
    color: #9bbc0f;
  }
  .event-tile {
    background: #8bac0f;
    animation: pulse 1s infinite;
  }
  @keyframes pulse {
    0% { opacity: 1; }
    50% { opacity: 0.7; }
    100% { opacity: 1; }
  }
  @media (max-width: 600px) {
    #gameboyCtn {
      padding: 10px;
    }
    #controlsEl {
      transform: scale(0.9);
      margin-top: 10px;
    }
  }
</style>

<script type="module">
  // Game state
  let gameState = {
    playerPos: {x: 5, y: 5},
    hp: 100,
    xp: 0,
    level: 1,
    map: [],
    mapSize: 10,
    eventTiles: [],
    currentEvent: null,
    aiFrequency: 50,
    aiCreativity: 'Medium',
    soundEnabled: true,
    animationsEnabled: true,
    gameActive: false
  };

  // Initialize game
  async function initGame() {
    // Load saved game if exists
    try {
      let savedGame = await root.kv.gameboyGame.get('saveState');
      if (savedGame) {
        gameState = JSON.parse(savedGame);
      }
    } catch(e) {
      console.log('No saved game found');
    }

    // Generate initial map
    generateMap();
    updateDisplay();
    
    // Load settings
    loadSettings();
  }

  // Generate game map
  function generateMap() {
    gameState.map = [];
    gameState.eventTiles = [];
    
    for (let y = 0; y < gameState.mapSize; y++) {
      let row = [];
      for (let x = 0; x < gameState.mapSize; x++) {
        let isEvent = Math.random() * 100 < gameState.aiFrequency;
        row.push(isEvent ? 'event' : 'empty');
        
        if (isEvent) {
          gameState.eventTiles.push({x, y});
        }
      }
      gameState.map.push(row);
    }
    
    // Ensure player start position is empty
    gameState.map[gameState.playerPos.y][gameState.playerPos.x] = 'empty';
  }

  // Update game display
  function updateDisplay() {
    // Update map display
    let mapHtml = '';
    for (let y = 0; y < gameState.mapSize; y++) {
      for (let x = 0; x < gameState.mapSize; x++) {
        let tileClass = 'tile';
        let content = '';
        
        if (x === gameState.playerPos.x && y === gameState.playerPos.y) {
          tileClass += ' player-tile';
          content = '😎';
        } else if (gameState.map[y][x] === 'event') {
          tileClass += ' event-tile';
          content = '❓';
        }
        
        mapHtml += `<div class="${tileClass}">${content}</div>`;
      }
    }
    mapDisplayEl.innerHTML = mapHtml;
    
    // Update stats
    hpEl.textContent = gameState.hp;
    xpEl.textContent = gameState.xp;
    levelEl.textContent = gameState.level;
    
    // Update event display
    if (gameState.currentEvent) {
      eventDisplayEl.innerHTML = `<div>${gameState.currentEvent}</div>`;
    } else {
      eventDisplayEl.innerHTML = '<div>Explore to find events!</div>';
    }
  }

  // Move player
  function movePlayer(direction) {
    if (!gameState.gameActive || gameState.currentEvent) return;
    
    let newPos = {...gameState.playerPos};
    
    switch(direction) {
      case 'up': newPos.y--; break;
      case 'down': newPos.y++; break;
      case 'left': newPos.x--; break;
      case 'right': newPos.x++; break;
    }
    
    // Check boundaries
    if (newPos.x < 0 || newPos.x >= gameState.mapSize || 
        newPos.y < 0 || newPos.y >= gameState.mapSize) {
      return;
    }
    
    // Move player
    gameState.playerPos = newPos;
    
    // Check for event
    if (gameState.map[newPos.y][newPos.x] === 'event') {
      gameState.map[newPos.y][newPos.x] = 'empty';
      triggerAIEvent();
    }
    
    updateDisplay();
  }

  // Trigger AI-generated event
  async function triggerAIEvent() {
    aiModeEl.textContent = 'GENERATING';
    loadingEl.hidden = false;
    
    try {
      let creativityLevel = gameState.aiCreativity === 'High' ? 'very creative and unexpected' : 
                           gameState.aiCreativity === 'Low' ? 'simple and straightforward' : 
                           'balanced and interesting';
      
      let eventPrompt = `Generate a short game event for an RPG. The player is at level ${gameState.level} with ${gameState.hp} HP. Make it ${creativityLevel}. The event should be 1-2 sentences max and include a choice or outcome.`;
      
      let eventText = await root.generateText({
        instruction: eventPrompt,
        onChunk: (data) => {
          // Optional: show streaming text
        }
      });
      
      gameState.currentEvent = eventText;
      
      // Process event outcome
      if (Math.random() > 0.5) {
        gameState.hp += Math.floor(Math.random() * 20) - 5;
        gameState.hp = Math.max(1, Math.min(100, gameState.hp));
        
        if (Math.random() > 0.7) {
          gameState.xp += 10;
          if (gameState.xp >= gameState.level * 50) {
            gameState.level++;
            gameState.xp = 0;
          }
        }
      }
    } catch(error) {
      gameState.currentEvent = "You found a mysterious artifact! (+5 HP)";
      gameState.hp += 5;
    }
    
    loadingEl.hidden = true;
    aiModeEl.textContent = 'READY';
    updateDisplay();
  }

  // Action button
  function actionButton() {
    if (!gameState.gameActive) return;
    
    if (gameState.currentEvent) {
      // Clear event
      gameState.currentEvent = null;
      updateDisplay();
    }
  }

  // Back button
  function backButton() {
    if (!gameState.gameActive) return;
    
    // Go back to previous screen
    if (gameState.currentEvent) {
      gameState.currentEvent = null;
      updateDisplay();
    }
  }

  // Start game
  function startGame() {
    gameState.gameActive = true;
    titleScreenEl.hidden = true;
    gameAreaEl.hidden = false;
    settingsMenuEl.hidden = true;
    updateDisplay();
  }

  // Open settings
  function openSettings() {
    titleScreenEl.hidden = true;
    gameAreaEl.hidden = true;
    settingsMenuEl.hidden = false;
    
    // Load current settings
    aiFreqSliderEl.value = gameState.aiFrequency;
    aiFreqValueEl.textContent = gameState.aiFrequency;
    aiCreativitySelectEl.value = gameState.aiCreativity;
    soundToggleEl.checked = gameState.soundEnabled;
    animationToggleEl.checked = gameState.animationsEnabled;
  }

  // Save settings
  function saveSettings() {
    gameState.aiFrequency = parseInt(aiFreqSliderEl.value);
    gameState.aiCreativity = aiCreativitySelectEl.value;
    gameState.soundEnabled = soundToggleEl.checked;
    gameState.animationsEnabled = animationToggleEl.checked;
    
    // Apply animation settings
    document.body.style.setProperty('--animations-enabled', gameState.animationsEnabled ? '1' : '0');
    
    // Save settings
    try {
      root.kv.gameboyGame.set('settings', {
        aiFrequency: gameState.aiFrequency,
        aiCreativity: gameState.aiCreativity,
        soundEnabled: gameState.soundEnabled,
        animationsEnabled: gameState.animationsEnabled
      });
    } catch(e) {
      console.error('Error saving settings', e);
    }
    
    // Return to game
    if (gameState.gameActive) {
      gameAreaEl.hidden = false;
    } else {
      titleScreenEl.hidden = false;
    }
    settingsMenuEl.hidden = true;
  }

  // Load settings
  async function loadSettings() {
    try {
      let settings = await root.kv.gameboyGame.get('settings');
      if (settings) {
        gameState.aiFrequency = settings.aiFrequency;
        gameState.aiCreativity = settings.aiCreativity;
        gameState.soundEnabled = settings.soundEnabled;
        gameState.animationsEnabled = settings.animationsEnabled;
      }
    } catch(e) {
      console.error('Error loading settings', e);
    }
  }

  // Save game
  async function saveGame() {
    try {
      await root.kv.gameboyGame.set('saveState', JSON.stringify(gameState));
      alert('Game saved successfully!');
    } catch(e) {
      alert('Error saving game: ' + e.message);
    }
  }

  // Initialize on load
  window.addEventListener('DOMContentLoaded', initGame);
  
  // Keyboard controls
  window.addEventListener('keydown', (e) => {
    if (!gameState.gameActive) return;
    
    switch(e.key) {
      case 'ArrowUp': movePlayer('up'); break;
      case 'ArrowDown': movePlayer('down'); break;
      case 'ArrowLeft': movePlayer('left'); break;
      case 'ArrowRight': movePlayer('right'); break;
      case 'Enter': actionButton(); break;
      case 'Escape': backButton(); break;
    }
  });
  
  // Export functions to global scope
  window.startGame = startGame;
  window.openSettings = openSettings;
  window.saveGame = saveGame;
  window.movePlayer = movePlayer;
  window.actionButton = actionButton;
  window.backButton = backButton;
  window.saveSettings = saveSettings;
</script>
</body>
</html>
