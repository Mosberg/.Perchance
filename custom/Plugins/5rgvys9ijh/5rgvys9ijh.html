<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>5rgvys9ijh — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<div id="appCtn" style="display:flex; height:100vh; background:#1a1a1a; color:#eee; font-family:system-ui, sans-serif; overflow:hidden; text-align:left;">
  <!-- Sidebar: Character List -->
  <div id="sidebarCtn" style="width:260px; background:#252525; border-right:1px solid #444; display:flex; flex-direction:column; padding:12px; gap:10px; overflow-y:auto;">
    <h2 style="margin:0; font-size:1.1rem; color:#ff6b6b;">AI Companions</h2>
    <button id="newCharacterBtn" onclick="openNewCharacter()" style="padding:8px; background:#ff6b6b; border:none; color:#fff; border-radius:6px; cursor:pointer; font-weight:bold;">+ New Character</button>
    <div id="characterListCtn" style="display:flex; flex-direction:column; gap:8px;"></div>
  </div>

  <!-- Main Chat / Story Area -->
  <div id="mainCtn" style="flex:1; display:flex; flex-direction:column; min-width:0;">
    <div id="headerCtn" style="padding:12px 18px; background:#222; border-bottom:1px solid #444; display:flex; justify-content:space-between; align-items:center;">
      <div style="font-size:0.95rem;">
        <span id="modeLabelEl" style="font-weight:bold; color:#ff6b6b;">Chat</span>
        <span style="opacity:0.7;"> with </span>
        <span id="activeCharacterEl" style="font-weight:bold;">Select a character</span>
      </div>
      <div>
        <button id="modeToggleBtn" onclick="toggleMode()" style="padding:6px 12px; background:#333; border:1px solid #555; color:#eee; border-radius:4px; cursor:pointer;">Switch to Story</button>
        <button id="editCharacterBtn" onclick="openEditCharacter()" hidden style="padding:6px 12px; background:#333; border:1px solid #555; color:#eee; border-radius:4px; cursor:pointer; margin-left:6px;">Edit</button>
        <button id="clearChatBtn" onclick="clearChat()" hidden style="padding:6px 12px; background:#333; border:1px solid #555; color:#eee; border-radius:4px; cursor:pointer; margin-left:6px;">Clear</button>
      </div>
    </div>

    <div id="messagesCtn" style="flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:12px; align-items:flex-start;"></div>

    <div id="inputAreaCtn" style="padding:14px 18px; background:#222; border-top:1px solid #444; display:flex; flex-direction:column; gap:8px;">
      <div style="display:flex; gap:10px; align-items:center; min-height:20px;">
        <span id="typingIndicatorEl" hidden style="font-size:0.8rem; color:#888; font-style:italic;">AI is thinking...</span>
        <span id="imageGenIndicatorEl" hidden style="font-size:0.8rem; color:#ff6b6b; font-style:italic;">Generating image...</span>
      </div>
      <div style="display:flex; gap:8px; align-items:flex-end;">
        <textarea id="messageInput" onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault(); sendMessage();}" placeholder="Type your message..." style="flex:1; background:#333; color:#eee; border:1px solid #555; border-radius:8px; padding:10px; resize:none; height:60px; font-family:inherit;"></textarea>
        <div style="display:flex; flex-direction:column; gap:6px; align-items:center;">
          <label style="font-size:0.7rem; display:flex; align-items:center; gap:4px; cursor:pointer; white-space:nowrap;">
            <input type="checkbox" id="aiImageCheckEl" style="accent-color:#ff6b6b;"> AI Image
          </label>
          <div style="display:flex; gap:6px;">
            <button id="genImageBtn" onclick="manualImageGen()" title="Generate image from text" style="padding:10px 12px; background:#444; border:none; color:#eee; border-radius:6px; cursor:pointer;">🖼️</button>
            <button id="sendBtn" onclick="sendMessage()" style="padding:10px 18px; background:#ff6b6b; border:none; color:#fff; border-radius:6px; cursor:pointer; font-weight:bold;">Send</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Character Modal -->
<div id="characterModalCtn" hidden style="position:fixed; inset:0; background:rgba(0,0,0,0.85); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;">
  <div style="background:#2a2a2a; width:520px; max-width:100%; border-radius:12px; padding:20px; border:1px solid #444; display:flex; flex-direction:column; gap:12px; max-height:90vh; overflow-y:auto;">
    <h3 id="modalTitleEl" style="margin:0; color:#ff6b6b;">New Character</h3>
    <input id="charNameInput" placeholder="Character Name" style="padding:10px; background:#333; color:#eee; border:1px solid #555; border-radius:6px;">
    <textarea id="charVisualInput" placeholder="Visual Description (appearance, outfit, body, etc.)" style="padding:10px; background:#333; color:#eee; border:1px solid #555; border-radius:6px; height:80px; resize:vertical;"></textarea>
    <textarea id="charPersonalityInput" placeholder="Personality Description" style="padding:10px; background:#333; color:#eee; border:1px solid #555; border-radius:6px; height:70px; resize:vertical;"></textarea>
    <textarea id="charBehaviorInput" placeholder="Example Roleplay Behavior / First Message / Tone" style="padding:10px; background:#333; color:#eee; border:1px solid #555; border-radius:6px; height:70px; resize:vertical;"></textarea>
    <div style="display:flex; gap:12px; align-items:center;">
      <img id="avatarPreviewImg" src="https://placehold.co/100x100/333/eee?text=Avatar" style="width:80px; height:80px; object-fit:cover; border-radius:10px; border:1px solid #555;">
      <button id="generateAvatarBtn" onclick="generateAvatar()" style="padding:8px 14px; background:#444; border:none; color:#eee; border-radius:6px; cursor:pointer;">Generate Avatar</button>
    </div>
    <div style="display:flex; gap:8px; margin-top:4px;">
      <button id="saveCharacterBtn" onclick="saveCharacter()" style="flex:1; padding:10px; background:#ff6b6b; border:none; color:#fff; border-radius:6px; cursor:pointer; font-weight:bold;">Save</button>
      <button id="deleteCharacterBtn" onclick="deleteCharacter()" hidden style="flex:1; padding:10px; background:#880000; border:none; color:#fff; border-radius:6px; cursor:pointer;">Delete</button>
      <button id="closeModalBtn" onclick="characterModalCtn.hidden=true" style="flex:1; padding:10px; background:#444; border:none; color:#eee; border-radius:6px; cursor:pointer;">Cancel</button>
    </div>
  </div>
</div>

<script>
  // Explicitly grab globals to avoid ReferenceError in strict/module-wrapped contexts
  let G = typeof root !== 'undefined' ? root : window;
  let kv = G.kv;
  let generateText = G.generateText;
  let generateImage = G.generateImage;

  let characters = [];
  let activeCharacterId = null;
  let activeCharacter = null;
  let currentMessages = [];
  let mode = 'chat'; // 'chat' or 'story'
  let editingId = null;

  function buildHistoryText(msgs) {
    return msgs.slice(-20).map(m => (m.role === 'user' ? 'User' : activeCharacter.name) + ': ' + m.content).join('\n');
  }

  function appendMessage(msg) {
    let row = document.createElement('div');
    row.style.cssText = `align-self:${msg.role==='user'?'flex-end':'flex-start'}; max-width:78%; display:flex; flex-direction:column; gap:6px;`;
    let bubble = document.createElement('div');
    bubble.style.cssText = `background:${msg.role==='user'?'#ff6b6b':'#333'}; padding:10px 14px; border-radius:14px; color:#fff; text-align:left; word-wrap:break-word; border:1px solid ${msg.role==='user'?'#ff8585':'#444'};`;
    let nameLabel = document.createElement('div');
    nameLabel.style.cssText = 'font-size:0.75rem; opacity:0.7; margin-bottom:4px; font-weight:bold;';
    nameLabel.innerText = msg.role === 'user' ? 'You' : (activeCharacter ? activeCharacter.name : 'AI');
    bubble.appendChild(nameLabel);
    let textDiv = document.createElement('div');
    textDiv.style.whiteSpace = 'pre-wrap';
    textDiv.innerText = msg.content;
    bubble.appendChild(textDiv);
    if (msg.image) {
      let img = document.createElement('img');
      img.src = msg.image;
      img.style.cssText = 'max-width:100%; border-radius:10px; margin-top:8px; display:block;';
      bubble.appendChild(img);
    }
    row.appendChild(bubble);
    messagesCtn.appendChild(row);
    messagesCtn.scrollTop = messagesCtn.scrollHeight;
    return { row, bubble, textDiv };
  }

  function renderCharacterList() {
    characterListCtn.innerHTML = '';
    characters.forEach(c => {
      let div = document.createElement('div');
      let isActive = c.id === activeCharacterId;
      div.style.cssText = `display:flex; align-items:center; gap:10px; padding:9px; border-radius:8px; cursor:pointer; border:1px solid ${isActive?'#ff6b6b':'transparent'}; background:${isActive?'#3a3a3a':'#333'};`;
      div.onclick = () => selectCharacter(c.id);
      div.innerHTML = `<img src="${c.avatar}" style="width:42px;height:42px;border-radius:50%;object-fit:cover;flex-shrink:0;border:1px solid #555;"><div style="overflow:hidden;"><div style="font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:0.9rem;">${c.name}</div><div style="font-size:0.75rem;opacity:0.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${c.personality.substring(0,30)}...</div></div>`;
      characterListCtn.appendChild(div);
    });
  }

  async function selectCharacter(id) {
    activeCharacterId = id;
    activeCharacter = characters.find(c => c.id === id) || null;
    activeCharacterEl.innerText = activeCharacter ? activeCharacter.name : 'Select a character';
    editCharacterBtn.hidden = !activeCharacter;
    clearChatBtn.hidden = !activeCharacter;
    messagesCtn.innerHTML = '';
    if (activeCharacter) {
      let saved = await kv.chats.get(activeCharacterId);
      currentMessages = Array.isArray(saved) ? saved : [];
      currentMessages.forEach(m => appendMessage(m));
    } else {
      currentMessages = [];
    }
    renderCharacterList();
  }

  function openNewCharacter() {
    editingId = null;
    modalTitleEl.innerText = 'New Character';
    charNameInput.value = '';
    charVisualInput.value = '';
    charPersonalityInput.value = '';
    charBehaviorInput.value = '';
    avatarPreviewImg.src = 'https://placehold.co/100x100/333/eee?text=Avatar';
    deleteCharacterBtn.hidden = true;
    characterModalCtn.hidden = false;
  }

  function openEditCharacter() {
    if (!activeCharacter) return;
    editingId = activeCharacter.id;
    modalTitleEl.innerText = 'Edit Character';
    charNameInput.value = activeCharacter.name;
    charVisualInput.value = activeCharacter.visualDesc;
    charPersonalityInput.value = activeCharacter.personality;
    charBehaviorInput.value = activeCharacter.behavior;
    avatarPreviewImg.src = activeCharacter.avatar;
    deleteCharacterBtn.hidden = false;
    characterModalCtn.hidden = false;
  }

  async function generateAvatar() {
    let prompt = `Portrait avatar of ${charNameInput.value || 'character'}, ${charVisualInput.value || 'human'}. Face focused, high quality digital art, centered composition.`;
    generateAvatarBtn.disabled = true;
    generateAvatarBtn.innerText = '⏳';
    try {
      let url = await generateImage(prompt, {resolution:'512x512'});
      avatarPreviewImg.src = url;
    } catch (e) { alert('Avatar generation failed'); }
    generateAvatarBtn.disabled = false;
    generateAvatarBtn.innerText = 'Generate Avatar';
  }

  async function saveCharacter() {
    let name = charNameInput.value.trim();
    if (!name) return alert('Name is required');
    let char = {
      id: editingId || Date.now().toString(),
      name: name,
      visualDesc: charVisualInput.value.trim(),
      personality: charPersonalityInput.value.trim(),
      behavior: charBehaviorInput.value.trim(),
      avatar: avatarPreviewImg.src,
      created: Date.now()
    };
    if (editingId) {
      let idx = characters.findIndex(c => c.id === editingId);
      if (idx > -1) characters[idx] = char;
    } else {
      characters.push(char);
    }
    await kv.characters.set(char.id, char);
    if (activeCharacterId === char.id) activeCharacter = char;
    renderCharacterList();
    characterModalCtn.hidden = true;
  }

  async function deleteCharacter() {
    if (!editingId) return;
    if (!confirm('Delete this character and all chat history?')) return;
    await kv.characters.delete(editingId);
    await kv.chats.delete(editingId);
    characters = characters.filter(c => c.id !== editingId);
    if (activeCharacterId === editingId) {
      activeCharacterId = null;
      activeCharacter = null;
      currentMessages = [];
      messagesCtn.innerHTML = '';
      activeCharacterEl.innerText = 'Select a character';
      editCharacterBtn.hidden = true;
      clearChatBtn.hidden = true;
    }
    renderCharacterList();
    characterModalCtn.hidden = true;
  }

  function toggleMode() {
    mode = mode === 'chat' ? 'story' : 'chat';
    modeLabelEl.innerText = mode === 'chat' ? 'Chat' : 'Story';
    modeToggleBtn.innerText = mode === 'chat' ? 'Switch to Story' : 'Switch to Chat';
  }

  async function clearChat() {
    if (!activeCharacterId) return;
    currentMessages = [];
    await kv.chats.set(activeCharacterId, currentMessages);
    messagesCtn.innerHTML = '';
  }

  async function sendMessage() {
    let text = messageInput.value.trim();
    if (!text || !activeCharacter) return;
    messageInput.value = '';
    currentMessages.push({role:'user', content: text});
    await kv.chats.set(activeCharacterId, currentMessages);
    appendMessage({role:'user', content: text});

    typingIndicatorEl.hidden = false;
    sendBtn.disabled = true;
    genImageBtn.disabled = true;

    let history = buildHistoryText(currentMessages);
    let prompt;
    let startWith = null;
    if (mode === 'chat') {
      prompt = `You are ${activeCharacter.name}, an immersive NSFW character companion.
Appearance: ${activeCharacter.visualDesc}
Personality: ${activeCharacter.personality}
Example behavior: ${activeCharacter.behavior}

You are in a private NSFW roleplay chat with User. Stay fully in character. Respond naturally.

Conversation:
${history}

${activeCharacter.name}:`;
      startWith = `${activeCharacter.name}:`;
    } else {
      prompt = `You are a collaborative NSFW storyteller writing alongside User.
Main character: ${activeCharacter.name}
Appearance: ${activeCharacter.visualDesc}
Personality: ${activeCharacter.personality}
Tone/Behavior: ${activeCharacter.behavior}

Write the next paragraph of the ongoing story in vivid, descriptive, immersive prose. Focus on ${activeCharacter.name}. Only provide the next segment.

Story so far:
${history}

Next segment:`;
    }

    let raw = '';
    let {textDiv, bubble} = appendMessage({role:'assistant', content: ''});
    try {
      let opts = {
        instruction: prompt,
        stopSequences: ["\nUser:"],
        onChunk: (data) => {
          raw += data.textChunk;
          let display = raw;
          if (startWith) display = raw.replace(startWith, '').trimStart();
          textDiv.innerText = display;
          messagesCtn.scrollTop = messagesCtn.scrollHeight;
        }
      };
      if (startWith) opts.startWith = startWith;
      await generateText(opts);
    } catch (e) {
      console.error(e);
      textDiv.innerText = '[Error generating response]';
    }

    let finalText = raw;
    if (startWith) finalText = raw.replace(startWith, '').trimStart();
    let assistantMsg = {role:'assistant', content: finalText};

    typingIndicatorEl.hidden = false;

    if (aiImageCheckEl.checked) {
      imageGenIndicatorEl.hidden = false;
      try {
        let scene = finalText.substring(0, 250);
        let imgPrompt = `NSFW digital art of ${activeCharacter.name}, ${activeCharacter.visualDesc}. Scene: ${scene}. High quality, detailed, cinematic lighting, artistic.`;
        let dataUrl = await generateImage(imgPrompt, {resolution:'768x768'});
        assistantMsg.image = dataUrl;
        let img = document.createElement('img');
        img.src = dataUrl;
        img.style.cssText = 'max-width:100%; border-radius:10px; margin-top:8px; display:block;';
        bubble.appendChild(img);
        messagesCtn.scrollTop = messagesCtn.scrollHeight;
      } catch (e) { console.error('Image gen failed', e); }
      imageGenIndicatorEl.hidden = true;
      aiImageCheckEl.checked = false;
    }

    currentMessages.push(assistantMsg);
    await kv.chats.set(activeCharacterId, currentMessages);
    sendBtn.disabled = false;
    genImageBtn.disabled = false;
    typingIndicatorEl.hidden = true;
  }

  async function manualImageGen() {
    if (!activeCharacter) return;
    let promptText = messageInput.value.trim() || `${activeCharacter.name} posing`;
    let imgPrompt = `NSFW digital art of ${activeCharacter.name}, ${activeCharacter.visualDesc}. ${promptText}. High quality, detailed, artistic.`;
    imageGenIndicatorEl.hidden = false;
    sendBtn.disabled = true;
    genImageBtn.disabled = true;
    try {
      let dataUrl = await generateImage(imgPrompt, {resolution:'768x768'});
      let msg = {role:'assistant', content: '*[Generated Image]*', image: dataUrl};
      currentMessages.push(msg);
      await kv.chats.set(activeCharacterId, currentMessages);
      appendMessage(msg);
    } catch (e) { alert('Image generation failed'); }
    imageGenIndicatorEl.hidden = true;
    sendBtn.disabled = false;
    genImageBtn.disabled = false;
  }

  async function init() {
    let entries = await kv.characters.entries();
    characters = entries.map(e => e[1]);
    renderCharacterList();
  }
  init();
</script>
</body>
</html>
