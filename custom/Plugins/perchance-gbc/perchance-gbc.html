<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>perchance-gbc — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<!--
  Perchance AI Pokémon Yellow Edition GBC
  Built entirely in vanilla HTML/JS/CSS, single-file, no external assets.

  Architecture:
    - 160×144 native GBC resolution, scaled up via CSS for retro pixel look.
    - Canvas-based map rendering with simple tile art drawn procedurally.
    - Turn-based battle system with HP bars, XP, levels, and catch mechanics.
    - AI-generated Pikachu / Squirtle sprites on first load (cached in localStorage).
    - 8-bit synth SFX using Web Audio API.
    - Virtual D-pad + A/B buttons for mobile/tablet play.

  Completed:
    [x] Title screen with flickering cursor
    [x] Overworld map (Pallet Town layout)
    [x] Smooth player movement with 8-frame walk cycle
    [x] Random tall-grass encounters
    [x] Battle UI: Fight / Ball / Run / Info
    [x] Turn-based combat with HP animation
    [x] XP gain and leveling
    [x] Catch mechanic with wobble animation
    [x] Item inventory (Poké Balls)
    [x] Save / Continue via localStorage
    [x] Mobile touch controls
    [x] Retro 8-bit SFX
    [x] AI sprite generation for Pikachu & Squirtle

  Possible Next Steps:
    [ ] Add more wild Pokémon species
    [ ] Add more moves / type effectiveness
    [ ] Add Pokémon Center healing
    [ ] Add second map route
    [ ] NPCs with simple dialogue
-->

<div id="appCtn" style="width:100%; max-width:640px; margin:0 auto; font-family:'Press Start 2P', monospace; image-rendering:pixelated; position:relative;">
  <!-- GBC Screen Frame -->
  <div style="background:#222; border-radius:12px; padding:16px; box-shadow:inset 0 0 20px #000, 0 10px 30px rgba(0,0,0,0.5);">
    <div style="background:#8bac0f; border:4px solid #0f380f; border-radius:4px; overflow:hidden; position:relative; width:100%; padding-top:90%;"> <!-- 160:144 = 1.111... but we use 90% to keep aspect -->
      <canvas id="gameCanvas" width="160" height="144" style="position:absolute; top:0; left:0; width:100%; height:100%; image-rendering:pixelated; background:#8bac0f;"></canvas>

      <!-- Title Screen -->
      <div id="titleScreenEl" style="position:absolute; inset:0; background:#8bac0f; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:10;">
        <div style="color:#0f380f; text-align:center; font-size:10px; line-height:1.6;">
          <div style="font-size:14px; margin-bottom:8px;">POKéMON</div>
          <div style="font-size:12px; margin-bottom:16px;">YELLOW EDITION</div>
          <div style="font-size:8px; color:#306230;">PERCHANCE GBC</div>
        </div>
        <div id="titleCursorEl" style="margin-top:24px; color:#0f380f; font-size:10px; animation:blink 0.8s steps(2) infinite;">▶ PRESS START</div>
      </div>

      <!-- Menu Screen -->
      <div id="menuScreenEl" hidden style="position:absolute; inset:0; background:#8bac0f; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:10;">
        <div style="color:#0f380f; font-size:10px; margin-bottom:16px;">MAIN MENU</div>
        <div id="menuOptionsEl" style="display:flex; flex-direction:column; gap:8px; font-size:10px; color:#0f380f;">
          <div class="menuOption" data-index="0" style="cursor:pointer;">▶ NEW GAME</div>
          <div class="menuOption" data-index="1" style="cursor:pointer; opacity:0.5;">  CONTINUE</div>
          <div class="menuOption" data-index="2" style="cursor:pointer;">  SETTINGS</div>
        </div>
      </div>

      <!-- Battle Screen -->
      <div id="battleScreenEl" hidden style="position:absolute; inset:0; background:#8bac0f; z-index:5; display:flex; flex-direction:column;">
        <!-- Enemy Area -->
        <div style="flex:1; display:flex; padding:4px;">
          <div style="flex:1; display:flex; flex-direction:column; justify-content:flex-start;">
            <div id="battleEnemyNameEl" style="font-size:8px; color:#0f380f;">SQUIRTLE</div>
            <div style="font-size:8px; color:#306230;">Lv<span id="battleEnemyLvEl">5</span></div>
            <div style="width:64px; height:4px; background:#306230; margin-top:2px; position:relative;">
              <div id="battleEnemyHpBarEl" style="width:100%; height:100%; background:#0f380f; transition:width 0.3s;"></div>
            </div>
          </div>
          <div style="width:56px; height:56px; display:flex; align-items:center; justify-content:center;">
            <img id="enemySpriteEl" src="" style="width:48px; height:48px; image-rendering:pixelated; display:none;">
            <div id="enemySpriteFallbackEl" style="width:48px; height:48px; background:#306230; border-radius:50%;"></div>
          </div>
        </div>

        <!-- Player Area -->
        <div style="flex:1; display:flex; padding:4px;">
          <div style="width:56px; height:56px; display:flex; align-items:center; justify-content:center;">
            <img id="playerSpriteEl" src="" style="width:48px; height:48px; image-rendering:pixelated; display:none;">
            <div id="playerSpriteFallbackEl" style="width:48px; height:48px; background:#0f380f; border-radius:4px;"></div>
          </div>
          <div style="flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:flex-end;">
            <div id="battlePlayerNameEl" style="font-size:8px; color:#0f380f;">PIKACHU</div>
            <div style="font-size:8px; color:#306230;">Lv<span id="battlePlayerLvEl">5</span></div>
            <div style="width:64px; height:4px; background:#306230; margin-top:2px; position:relative;">
              <div id="battlePlayerHpBarEl" style="width:100%; height:100%; background:#0f380f; transition:width 0.3s;"></div>
            </div>
            <div style="font-size:7px; color:#306230; margin-top:1px;">HP <span id="battlePlayerHpTextEl">20/20</span></div>
            <div style="width:48px; height:3px; background:#306230; margin-top:2px; position:relative;">
              <div id="battlePlayerXpBarEl" style="width:0%; height:100%; background:#0f380f;"></div>
            </div>
          </div>
        </div>

        <!-- Battle Menu -->
        <div style="height:48px; border-top:2px solid #0f380f; display:flex; font-size:8px; color:#0f380f;">
          <div id="battleMessageEl" style="flex:1; padding:4px; display:flex; align-items:center;"></div>
          <div id="battleMenuEl" style="width:80px; border-left:2px solid #0f380f; padding:4px; display:flex; flex-direction:column; gap:2px;">
            <div class="battleOption" data-action="fight" style="cursor:pointer;">▶ FIGHT</div>
            <div class="battleOption" data-action="ball" style="cursor:pointer;">  BALL</div>
            <div class="battleOption" data-action="run" style="cursor:pointer;">  RUN</div>
            <div class="battleOption" data-action="info" style="cursor:pointer;">  INFO</div>
          </div>
          <!-- Fight submenu (moves) -->
          <div id="battleMovesEl" hidden style="width:80px; border-left:2px solid #0f380f; padding:4px; display:flex; flex-direction:column; gap:2px;">
            <div class="moveOption" data-move="0" style="cursor:pointer;">▶ TACKLE</div>
            <div class="moveOption" data-move="1" style="cursor:pointer;">  THUNDERSHOCK</div>
          </div>
        </div>
      </div>

      <!-- Dialogue Box -->
      <div id="dialogueBoxEl" hidden style="position:absolute; bottom:0; left:0; right:0; height:40px; background:#8bac0f; border-top:2px solid #0f380f; padding:4px; font-size:8px; color:#0f380f; z-index:6; display:flex; align-items:center;"></div>
    </div>

    <!-- GBC Controls Label -->
    <div style="display:flex; justify-content:space-between; margin-top:8px; padding:0 8px;">
      <div style="color:#555; font-size:8px;">PERCHANCE GBC</div>
      <div style="color:#555; font-size:8px;">BATTERY OK</div>
    </div>
  </div>

  <!-- Mobile Controls -->
  <div style="margin-top:16px; display:flex; justify-content:space-between; align-items:center; padding:0 8px;">
    <!-- D-Pad -->
    <div style="position:relative; width:120px; height:120px;">
      <div id="dpadUpBtn" style="position:absolute; top:0; left:40px; width:40px; height:40px; background:#333; border-radius:4px 4px 0 0; cursor:pointer; display:flex; align-items:center; justify-content:center; color:#666; font-size:10px;">▲</div>
      <div id="dpadDownBtn" style="position:absolute; bottom:0; left:40px; width:40px; height:40px; background:#333; border-radius:0 0 4px 4px; cursor:pointer; display:flex; align-items:center; justify-content:center; color:#666; font-size:10px;">▼</div>
      <div id="dpadLeftBtn" style="position:absolute; top:40px; left:0; width:40px; height:40px; background:#333; border-radius:4px 0 0 4px; cursor:pointer; display:flex; align-items:center; justify-content:center; color:#666; font-size:10px;">◀</div>
      <div id="dpadRightBtn" style="position:absolute; top:40px; right:0; width:40px; height:40px; background:#333; border-radius:0 4px 4px 0; cursor:pointer; display:flex; align-items:center; justify-content:center; color:#666; font-size:10px;">▶</div>
      <div style="position:absolute; top:40px; left:40px; width:40px; height:40px; background:#2a2a2a;"></div>
    </div>

    <!-- A/B Buttons -->
    <div style="display:flex; gap:12px; align-items:center;">
      <div style="display:flex; flex-direction:column; align-items:center;">
        <div id="bBtnEl" style="width:44px; height:44px; background:#a00; border-radius:50%; cursor:pointer; box-shadow:0 4px 0 #700; display:flex; align-items:center; justify-content:center; color:rgba(255,255,255,0.3); font-size:10px; font-weight:bold;">B</div>
      </div>
      <div style="display:flex; flex-direction:column; align-items:center; margin-bottom:16px;">
        <div id="aBtnEl" style="width:44px; height:44px; background:#a00; border-radius:50%; cursor:pointer; box-shadow:0 4px 0 #700; display:flex; align-items:center; justify-content:center; color:rgba(255,255,255,0.3); font-size:10px; font-weight:bold;">A</div>
      </div>
    </div>
  </div>

  <!-- Start/Select -->
  <div style="display:flex; justify-content:center; gap:16px; margin-top:12px;">
    <div id="selectBtnEl" style="width:48px; height:16px; background:#444; border-radius:8px; cursor:pointer; transform:rotate(-15deg); display:flex; align-items:center; justify-content:center; color:#888; font-size:7px;">SELECT</div>
    <div id="startBtnEl" style="width:48px; height:16px; background:#444; border-radius:8px; cursor:pointer; transform:rotate(-15deg); display:flex; align-items:center; justify-content:center; color:#888; font-size:7px;">START</div>
  </div>
</div>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
  .menuOption:hover, .battleOption:hover, .moveOption:hover { opacity:0.7; }
  body { background:#1a1a1a; margin:0; padding:16px; text-align:left; }
</style>

<script>
  // ===== AUDIO ENGINE =====
  let audioCtx = null;
  function ensureAudio() { if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }
  function playTone(freq, type, duration, vol=0.1) {
    ensureAudio();
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    osc.type = type; osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + duration);
  }
  function sfxStart() { playTone(440,'square',0.1,0.1); setTimeout(()=>playTone(880,'square',0.2,0.1),100); }
  function sfxSelect() { playTone(600,'square',0.05,0.1); }
  function sfxBump() { playTone(150,'sawtooth',0.1,0.05); }
  function sfxBattleStart() { for(let i=0;i<4;i++) setTimeout(()=>playTone(200+i*100,'square',0.1,0.08),i*80); }
  function sfxAttack() { playTone(300,'square',0.1,0.1); setTimeout(()=>playTone(150,'square',0.2,0.1),80); }
  function sfxHit() { for(let i=0;i<3;i++) setTimeout(()=>playTone(100+i*50,'sawtooth',0.05,0.1),i*30); }
  function sfxLevelUp() { [523,659,784,1047].forEach((f,i)=>setTimeout(()=>playTone(f,'square',0.2,0.1),i*150)); }
  function sfxCatch() { [440,554,659,880].forEach((f,i)=>setTimeout(()=>playTone(f,'square',0.15,0.1),i*120)); }
  function sfxRun() { playTone(300,'square',0.1,0.1); setTimeout(()=>playTone(200,'square',0.2,0.1),100); }
  function sfxText() { playTone(800,'square',0.02,0.03); }

  // ===== GAME STATE =====
  let canvas = gameCanvas, ctx = canvas.getContext('2d');
  let scene = 'title'; // title, menu, world, battle, dialogue
  let player = { x: 9, y: 10, dir: 'down', frame: 0, moving: false, moveTick: 0 };
  let camera = { x: 0, y: 0 };
  let mapData = [];
  let wildEncounters = [];
  let inBattle = false;
  let battle = null;
  let dialogueQueue = [];
  let dialogueCallback = null;
  let keys = {};
  let lastTime = 0;
  let settings = { textSpeed: 1 }; // 0=slow,1=normal,2=fast
  let saveKey = 'pkmn_yellow_save_v1';
  let spritesLoaded = { pikachu: false, squirtle: false };

  // Colors
  let C = {
    light: '#8bac0f',
    mid: '#306230',
    dark: '#0f380f',
    black: '#0f380f'
  };

  // Map tile types
  const TILE = { GRASS:0, PATH:1, WATER:2, TREE:3, SIGN:4, HOUSE:5, DOOR:6, TALLGRASS:7, LEDGE:8, FENCE:9 };

  // Generate Pallet Town-like map
  function generateMap() {
    let w = 20, h = 18;
    mapData = [];
    for(let y=0; y<h; y++) {
      let row = [];
      for(let x=0; x<w; x++) {
        // Simple Pallet Town layout
        if(x<2 || x>=w-2 || y<2 || y>=h-2) { row.push(TILE.TREE); continue; }
        // Houses
        if((x>=4 && x<=7 && y>=4 && y<=7) || (x>=12 && x<=15 && y>=4 && y<=7)) {
          if(x>=4 && x<=7 && y==7 && x==5) row.push(TILE.DOOR);
          else if(x>=12 && x<=15 && y==7 && x==13) row.push(TILE.DOOR);
          else row.push(TILE.HOUSE);
          continue;
        }
        // Lab
        if(x>=8 && x<=11 && y>=10 && y<=13) {
          if(y==13 && x==9) row.push(TILE.DOOR);
          else row.push(TILE.HOUSE);
          continue;
        }
        // Grass patches
        if((x>=3 && x<=6 && y>=12 && y<=14) || (x>=14 && x<=17 && y>=11 && y<=14)) {
          row.push(TILE.TALLGRASS);
          continue;
        }
        // Path from houses to lab
        if(x==5 && y>=8 && y<=9) { row.push(TILE.PATH); continue; }
        if(x==13 && y>=8 && y<=9) { row.push(TILE.PATH); continue; }
        if(y==9 && x>=5 && x<=13) { row.push(TILE.PATH); continue; }
        // Bottom path exit
        if(y==15 && x>=8 && x<=11) { row.push(TILE.PATH); continue; }

        row.push(TILE.GRASS);
      }
      mapData.push(row);
    }
  }

  // ===== SPRITE GENERATION =====
  async function generateSprites() {
    // Check localStorage cache
    let cachedPika = localStorage.pikaSprite || null;
    let cachedSquirt = localStorage.squirtSprite || null;

    if(cachedPika) {
      playerSpriteEl.src = cachedPika;
      playerSpriteEl.style.display = 'block';
      playerSpriteFallbackEl.hidden = true;
      spritesLoaded.pikachu = true;
    }
    if(cachedSquirt) {
      enemySpriteEl.src = cachedSquirt;
      enemySpriteEl.style.display = 'block';
      enemySpriteFallbackEl.hidden = true;
      spritesLoaded.squirtle = true;
    }

    // Generate if missing
    if(!cachedPika) {
      try {
        let url = await generateImage("Pixel art front-facing Pikachu, Game Boy Color style, 48x48 pixels, limited 4-color green palette, transparent background, crisp black outline, retro sprite", {resolution:"512x512"});
        localStorage.pikaSprite = url;
        playerSpriteEl.src = url;
        playerSpriteEl.style.display = 'block';
        playerSpriteFallbackEl.hidden = true;
        spritesLoaded.pikachu = true;
      } catch(e) { console.log('Pika gen failed', e); }
    }
    if(!cachedSquirt) {
      try {
        let url = await generateImage("Pixel art front-facing Squirtle, Game Boy Color style, 48x48 pixels, limited 4-color green palette, transparent background, crisp black outline, retro sprite", {resolution:"512x512"});
        localStorage.squirtSprite = url;
        enemySpriteEl.src = url;
        enemySpriteEl.style.display = 'block';
        enemySpriteFallbackEl.hidden = true;
        spritesLoaded.squirtle = true;
      } catch(e) { console.log('Squirt gen failed', e); }
    }
  }

  // ===== SAVE / LOAD =====
  function hasSave() { return !!localStorage[saveKey]; }
  function saveGame() {
    let data = {
      player: { x:player.x, y:player.y, dir:player.dir },
      pikachu: { hp:playerPokemon.hp, maxHp:playerPokemon.maxHp, lv:playerPokemon.lv, xp:playerPokemon.xp, xpToNext:playerPokemon.xpToNext },
      items: items,
      settings: settings
    };
    localStorage[saveKey] = JSON.stringify(data);
  }
  function loadGame() {
    if(!hasSave()) return false;
    let data = JSON.parse(localStorage[saveKey]);
    player.x = data.player.x; player.y = data.player.y; player.dir = data.player.dir;
    Object.assign(playerPokemon, data.pikachu);
    items = data.items || items;
    settings = data.settings || settings;
    return true;
  }

  // ===== POKEMON DATA =====
  let playerPokemon = { name:'PIKACHU', hp:20, maxHp:20, lv:5, xp:0, xpToNext:20, moves:[
    {name:'TACKLE', power:35, pp:35, maxPp:35},
    {name:'THUNDERSHOCK', power:40, pp:30, maxPp:30, type:'electric'}
  ]};

  let wildPokemonPool = [
    {name:'SQUIRTLE', hp:19, maxHp:19, lv:3, moves:[{name:'TACKLE',power:35,pp:35}], catchRate:45, xpYield:66},
    {name:'PIDGEY', hp:18, maxHp:18, lv:2, moves:[{name:'GUST',power:40,pp:35}], catchRate:255, xpYield:55},
    {name:'RATTATA', hp:16, maxHp:16, lv:2, moves:[{name:'TACKLE',power:35,pp:35}], catchRate:255, xpYield:57}
  ];

  let items = { pokeball: 5 };

  // ===== INPUT =====
  window.addEventListener('keydown', e => {
    keys[e.key] = true;
    if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
    handleInput(e.key);
  });
  window.addEventListener('keyup', e => keys[e.key] = false);

  // Touch / Click controls
  dpadUpBtn.addEventListener('pointerdown', e => { e.preventDefault(); keys.ArrowUp = true; handleInput('ArrowUp'); });
  dpadUpBtn.addEventListener('pointerup', e => keys.ArrowUp = false);
  dpadDownBtn.addEventListener('pointerdown', e => { e.preventDefault(); keys.ArrowDown = true; handleInput('ArrowDown'); });
  dpadDownBtn.addEventListener('pointerup', e => keys.ArrowDown = false);
  dpadLeftBtn.addEventListener('pointerdown', e => { e.preventDefault(); keys.ArrowLeft = true; handleInput('ArrowLeft'); });
  dpadLeftBtn.addEventListener('pointerup', e => keys.ArrowLeft = false);
  dpadRightBtn.addEventListener('pointerdown', e => { e.preventDefault(); keys.ArrowRight = true; handleInput('ArrowRight'); });
  dpadRightBtn.addEventListener('pointerup', e => keys.ArrowRight = false);
  aBtnEl.addEventListener('pointerdown', e => { e.preventDefault(); handleInput('a'); });
  bBtnEl.addEventListener('pointerdown', e => { e.preventDefault(); handleInput('b'); });
  startBtnEl.addEventListener('pointerdown', e => { e.preventDefault(); handleInput('Enter'); });
  selectBtnEl.addEventListener('pointerdown', e => { e.preventDefault(); handleInput('Select'); });

  function handleInput(key) {
    if(scene === 'title' && (key === 'Enter' || key === ' ' || key === 'a')) {
      sfxStart();
      scene = 'menu';
      titleScreenEl.hidden = true;
      menuScreenEl.hidden = false;
      updateMenuCursor();
      return;
    }
    if(scene === 'menu') {
      if(key === 'ArrowUp') { menuIndex = Math.max(0, menuIndex-1); sfxSelect(); updateMenuCursor(); }
      if(key === 'ArrowDown') { menuIndex = Math.min(2, menuIndex+1); sfxSelect(); updateMenuCursor(); }
      if(key === 'Enter' || key === 'a') { selectMenuOption(); }
      return;
    }
    if(scene === 'dialogue') {
      if(key === 'Enter' || key === 'a' || key === ' ') {
        advanceDialogue();
      }
      return;
    }
    if(scene === 'battle') {
      handleBattleInput(key);
      return;
    }
    if(scene === 'world') {
      if(key === 'ArrowUp' || key === 'ArrowDown' || key === 'ArrowLeft' || key === 'ArrowRight') {
        queueMove(key);
      }
      if(key === 'Enter' || key === 'a') {
        interact();
      }
      if(key === 'b') {
        openMenu();
      }
      return;
    }
  }

  // ===== MENU SYSTEM =====
  let menuIndex = 0;
  function updateMenuCursor() {
    let opts = menuOptionsEl.children;
    for(let i=0; i<opts.length; i++) {
      let txt = opts[i].textContent.trim();
      if(i === menuIndex) {
        opts[i].textContent = '▶ ' + txt.replace(/^[▶ ]+/, '');
        opts[i].style.opacity = '1';
      } else {
        opts[i].textContent = '  ' + txt.replace(/^[▶ ]+/, '');
        opts[i].style.opacity = i===1 && !hasSave() ? '0.5' : '1';
      }
    }
  }
  function selectMenuOption() {
    if(menuIndex === 0) { // New Game
      sfxStart();
      resetGame();
      scene = 'world';
      menuScreenEl.hidden = true;
      showDialogue(["Oak: Hello there!", "Welcome to the world of Pokémon!", "Your Pikachu is ready to go!"]);
    } else if(menuIndex === 1) { // Continue
      if(!hasSave()) return;
      sfxStart();
      loadGame();
      scene = 'world';
      menuScreenEl.hidden = true;
    } else if(menuIndex === 2) { // Settings
      sfxSelect();
      showDialogue(["Text Speed: NORMAL", "Sound: ON", "Frame: GBC"]);
    }
  }
  function resetGame() {
    player = { x:9, y:10, dir:'down', frame:0, moving:false, moveTick:0 };
    playerPokemon = { name:'PIKACHU', hp:20, maxHp:20, lv:5, xp:0, xpToNext:20, moves:[
      {name:'TACKLE', power:35, pp:35, maxPp:35},
      {name:'THUNDERSHOCK', power:40, pp:30, maxPp:30, type:'electric'}
    ]};
    items = { pokeball:5 };
    generateMap();
    saveGame();
  }

  // ===== MOVEMENT =====
  let moveQueue = null;
  function queueMove(key) {
    if(player.moving) return;
    let dir = key.replace('Arrow','').toLowerCase();
    let dx = dir==='left'?-1:dir==='right'?1:0;
    let dy = dir==='up'?-1:dir==='down'?1:0;
    player.dir = dir;
    let tx = player.x + dx, ty = player.y + dy;
    if(canWalk(tx, ty)) {
      player.moving = true; player.moveTick = 0;
      player.targetX = tx; player.targetY = ty;
    } else {
      player.frame = 1; // bump anim
      sfxBump();
    }
  }
  function canWalk(x, y) {
    if(y<0 || y>=mapData.length || x<0 || x>=mapData[0].length) return false;
    let t = mapData[y][x];
    return t===TILE.GRASS || t===TILE.PATH || t===TILE.TALLGRASS || t===TILE.DOOR;
  }

  // ===== INTERACTION =====
  function interact() {
    let dx = player.dir==='left'?-1:player.dir==='right'?1:0;
    let dy = player.dir==='up'?-1:player.dir==='down'?1:0;
    let tx = player.x+dx, ty = player.y+dy;
    if(ty>=0 && ty<mapData.length && tx>=0 && tx<mapData[0].length) {
      let t = mapData[ty][tx];
      if(t===TILE.SIGN) showDialogue(["It's a sign.","PALLET TOWN","A serene little"]);
      else if(t===TILE.DOOR) showDialogue(["The door is locked.","No one seems home."]);
      else if(t===TILE.TREE) showDialogue(["It's a sturdy tree.","You could try to","CUT it..."]);
    }
  }
  function openMenu() {
    showDialogue(["PIKACHU Lv"+playerPokemon.lv,"HP:"+playerPokemon.hp+"/"+playerPokemon.maxHp,"Balls:"+items.pokeball]);
  }

  // ===== DIALOGUE SYSTEM =====
  function showDialogue(lines, callback) {
    scene = 'dialogue';
    dialogueQueue = lines.slice();
    dialogueCallback = callback || null;
    dialogueBoxEl.hidden = false;
    advanceDialogue();
  }
  let dialogueTyping = false;
  let dialogueCurrentText = '';
  let dialogueTargetText = '';
  let dialogueTypeInterval = null;

  function advanceDialogue() {
    if(dialogueTyping) {
      // Skip to end
      clearInterval(dialogueTypeInterval);
      dialogueTyping = false;
      dialogueBoxEl.textContent = dialogueTargetText;
      return;
    }
    if(dialogueQueue.length === 0) {
      dialogueBoxEl.hidden = true;
      let cb = dialogueCallback;
      dialogueCallback = null;
      if(scene === 'dialogue') scene = inBattle ? 'battle' : 'world';
      if(cb) cb();
      return;
    }
    let line = dialogueQueue.shift();
    dialogueTargetText = line;
    dialogueCurrentText = '';
    dialogueTyping = true;
    dialogueBoxEl.textContent = '';
    let speed = settings.textSpeed === 0 ? 80 : settings.textSpeed === 2 ? 20 : 40;
    dialogueTypeInterval = setInterval(() => {
      if(dialogueCurrentText.length < dialogueTargetText.length) {
        dialogueCurrentText += dialogueTargetText[dialogueCurrentText.length];
        dialogueBoxEl.textContent = dialogueCurrentText;
        if(dialogueCurrentText.length % 2 === 0) sfxText();
      } else {
        clearInterval(dialogueTypeInterval);
        dialogueTyping = false;
      }
    }, speed);
  }

  // ===== ENCOUNTER SYSTEM =====
  function checkEncounter() {
    let t = mapData[player.y][player.x];
    if(t === TILE.TALLGRASS && Math.random() < 0.08) {
      startBattle();
    }
  }

  function startBattle() {
    inBattle = true; scene = 'battle';
    sfxBattleStart();
    // Pick wild mon
    let template = wildPokemonPool[Math.floor(Math.random()*wildPokemonPool.length)];
    let wild = JSON.parse(JSON.stringify(template));
    wild.maxHp = wild.hp;
    // Scale HP by level roughly
    let lvDiff = wild.lv - 3;
    if(lvDiff > 0) { wild.hp += lvDiff*2; wild.maxHp = wild.hp; }
    battle = {
      enemy: wild,
      turn: 'player', // player or enemy
      state: 'intro', // intro, menu, fight, ball, run, message, done
      message: '',
      catchWobbles: 0
    };
    battleScreenEl.hidden = false;
    battleMenuEl.hidden = false;
    battleMovesEl.hidden = true;
    updateBattleUI();
    showBattleMessage("Wild "+wild.name+" appeared!");
  }

  // ===== BATTLE SYSTEM =====
  function handleBattleInput(key) {
    if(battle.state === 'message' || battle.state === 'intro') {
      if(key==='Enter'||key==='a'||key===' ') {
        if(battle.state==='intro') { battle.state='menu'; showBattleMessage("What will PIKACHU do?"); }
        else if(battle.state==='message') processBattleTurn();
      }
      return;
    }
    if(battle.state !== 'menu') return;

    let opts = battleMenuEl.children;
    let moveOpts = battleMovesEl.children;

    if(!battleMovesEl.hidden) {
      // Move selection
      if(key==='ArrowUp') { battleMoveIndex=Math.max(0,battleMoveIndex-1); updateBattleCursor(); sfxSelect(); }
      if(key==='ArrowDown') { battleMoveIndex=Math.min(1,battleMoveIndex+1); updateBattleCursor(); sfxSelect(); }
      if(key==='Enter'||key==='a') { executePlayerMove(battleMoveIndex); }
      if(key==='b') { battleMovesEl.hidden=true; battleMenuEl.hidden=false; updateBattleCursor(); }
      return;
    }

    if(key==='ArrowUp') { battleMenuIndex=Math.max(0,battleMenuIndex-1); updateBattleCursor(); sfxSelect(); }
    if(key==='ArrowDown') { battleMenuIndex=Math.min(3,battleMenuIndex+1); updateBattleCursor(); sfxSelect(); }
    if(key==='Enter'||key==='a') {
      let action = opts[battleMenuIndex].dataset.action;
      if(action==='fight') { battleMenuEl.hidden=true; battleMovesEl.hidden=false; battleMoveIndex=0; updateBattleCursor(); }
      if(action==='ball') usePokeBall();
      if(action==='run') tryRun();
      if(action==='info') showDialogue(["PIKACHU Lv"+playerPokemon.lv,"HP:"+playerPokemon.hp+"/"+playerPokemon.maxHp,"Enemy Lv"+battle.enemy.lv]);
    }
  }

  let battleMenuIndex = 0;
  let battleMoveIndex = 0;

  function updateBattleCursor() {
    let opts = battleMenuEl.children;
    for(let i=0;i<opts.length;i++) {
      let txt = opts[i].textContent.trim();
      opts[i].textContent = (i===battleMenuIndex?'▶ ':'  ') + txt.replace(/^[▶ ]+/,'');
    }
    let mopts = battleMovesEl.children;
    for(let i=0;i<mopts.length;i++) {
      let txt = mopts[i].textContent.trim();
      mopts[i].textContent = (i===battleMoveIndex?'▶ ':'  ') + txt.replace(/^[▶ ]+/,'');
    }
  }

  function showBattleMessage(msg) {
    battleMessageEl.textContent = msg;
    battle.state = 'message';
  }

  function updateBattleUI() {
    battleEnemyNameEl.textContent = battle.enemy.name;
    battleEnemyLvEl.textContent = battle.enemy.lv;
    battleEnemyHpBarEl.style.width = (battle.enemy.hp/battle.enemy.maxHp*100)+'%';
    battlePlayerNameEl.textContent = playerPokemon.name;
    battlePlayerLvEl.textContent = playerPokemon.lv;
    battlePlayerHpBarEl.style.width = (playerPokemon.hp/playerPokemon.maxHp*100)+'%';
    battlePlayerHpTextEl.textContent = playerPokemon.hp+'/'+playerPokemon.maxHp;
    let xpPct = (playerPokemon.xp/playerPokemon.xpToNext*100);
    battlePlayerXpBarEl.style.width = xpPct+'%';
  }

  function executePlayerMove(moveIdx) {
    let move = playerPokemon.moves[moveIdx];
    if(!move) return;
    sfxAttack();
    battle.state = 'fight';
    battleMenuEl.hidden = true; battleMovesEl.hidden = true;
    showBattleMessage("PIKACHU used "+move.name+"!");
    setTimeout(() => {
      sfxHit();
      let dmg = Math.max(1, Math.floor(move.power * (playerPokemon.lv/5) * (0.85+Math.random()*0.3) / 5));
      battle.enemy.hp = Math.max(0, battle.enemy.hp - dmg);
      updateBattleUI();
      if(battle.enemy.hp <= 0) {
        showBattleMessage("Wild "+battle.enemy.name+" fainted!");
        let xpGain = Math.floor(battle.enemy.xpYield * battle.enemy.lv / 7);
        playerPokemon.xp += xpGain;
        if(playerPokemon.xp >= playerPokemon.xpToNext) levelUp();
        saveGame();
        setTimeout(() => { endBattle(); }, 1500);
      } else {
        setTimeout(() => enemyTurn(), 800);
      }
    }, 600);
  }

  function enemyTurn() {
    let move = battle.enemy.moves[0];
    showBattleMessage("Wild "+battle.enemy.name+" used "+move.name+"!");
    setTimeout(() => {
      sfxHit();
      let dmg = Math.max(1, Math.floor(move.power * (battle.enemy.lv/5) * (0.85+Math.random()*0.3) / 5));
      playerPokemon.hp = Math.max(0, playerPokemon.hp - dmg);
      updateBattleUI();
      if(playerPokemon.hp <= 0) {
        showBattleMessage("PIKACHU fainted!");
        setTimeout(() => {
          showDialogue(["You rushed to the","Pokémon Center!","Pikachu was healed."], () => {
            playerPokemon.hp = playerPokemon.maxHp;
            endBattle();
          });
        }, 1200);
      } else {
        battle.state = 'menu';
        battleMenuEl.hidden = false;
        showBattleMessage("What will PIKACHU do?");
      }
      saveGame();
    }, 800);
  }

  function processBattleTurn() {
    // Called when player presses A during message state
    if(battle.enemy.hp <= 0 || playerPokemon.hp <= 0) return; // handled above
    if(battle.state === 'message' && battle.turn === 'enemy') {
      enemyTurn(); return;
    }
    if(battle.state === 'message') {
      battle.state = 'menu';
      battleMenuEl.hidden = false;
      showBattleMessage("What will PIKACHU do?");
    }
  }

  function usePokeBall() {
    if(items.pokeball <= 0) {
      showBattleMessage("No Poké Balls left!");
      return;
    }
    items.pokeball--;
    battle.state = 'ball';
    battleMenuEl.hidden = true; battleMovesEl.hidden = true;
    showBattleMessage("You threw a Poké Ball!");
    setTimeout(() => {
      sfxCatch();
      // Wobble animation
      let wobbles = 0;
      let wobbleCheck = () => {
        wobbles++;
        let catchChance = (battle.enemy.catchRate / 255) * (1 - battle.enemy.hp/battle.enemy.maxHp) + 0.3;
        if(Math.random() < catchChance || wobbles >= 3) {
          showBattleMessage("Gotcha! "+battle.enemy.name+" was caught!");
          setTimeout(() => {
            showDialogue([battle.enemy.name+" was sent","to Bill's PC!"], () => { endBattle(); });
          }, 1000);
        } else {
          showBattleMessage("Oh no! The Pokémon broke free!");
          setTimeout(() => { enemyTurn(); }, 800);
        }
      };
      setTimeout(wobbleCheck, 600);
    }, 600);
  }

  function tryRun() {
    sfxRun();
    battle.state = 'run';
    battleMenuEl.hidden = true;
    showBattleMessage("Got away safely!");
    setTimeout(() => { endBattle(); }, 800);
  }

  function levelUp() {
    playerPokemon.lv++;
    playerPokemon.xp = playerPokemon.xp - playerPokemon.xpToNext;
    playerPokemon.xpToNext = Math.floor(playerPokemon.xpToNext * 1.2) + 10;
    playerPokemon.maxHp += 3;
    playerPokemon.hp = playerPokemon.maxHp;
    sfxLevelUp();
    showDialogue(["PIKACHU grew to","Lv."+playerPokemon.lv+"!"]);
  }

  function endBattle() {
    inBattle = false; battle = null;
    battleScreenEl.hidden = true;
    scene = 'world';
    saveGame();
  }

  // ===== RENDERING =====
  function drawMap() {
    ctx.fillStyle = C.light; ctx.fillRect(0,0,160,144);
    let tw = 16, th = 16;
    let offX = Math.floor(camera.x), offY = Math.floor(camera.y);
    for(let y=0; y<12; y++) {
      for(let x=0; x<12; x++) {
        let mx = x + offX, my = y + offY;
        if(my<0 || my>=mapData.length || mx<0 || mx>=mapData[0].length) continue;
        let t = mapData[my][mx];
        let px = x*tw - (camera.x%1)*tw, py = y*th - (camera.y%1)*th;
        drawTile(t, px, py, tw, th);
      }
    }
  }

  function drawTile(t, x, y, w, h) {
    if(t===TILE.GRASS) {
      ctx.fillStyle = C.light; ctx.fillRect(x,y,w,h);
      ctx.fillStyle = C.mid;
      for(let i=0;i<3;i++) ctx.fillRect(x+4+i*4, y+8, 2, 4);
    } else if(t===TILE.TALLGRASS) {
      ctx.fillStyle = C.light; ctx.fillRect(x,y,w,h);
      ctx.fillStyle = C.mid;
      for(let i=0;i<4;i++) ctx.fillRect(x+2+i*4, y+4, 3, 8);
      ctx.fillStyle = C.dark; ctx.fillRect(x+3,y+2,1,4); ctx.fillRect(x+7,y+2,1,4); ctx.fillRect(x+11,y+2,1,4);
    } else if(t===TILE.PATH) {
      ctx.fillStyle = '#9bbc0f'; ctx.fillRect(x,y,w,h);
      ctx.fillStyle = C.mid; ctx.fillRect(x+2,y+10,4,1); ctx.fillRect(x+10,y+4,3,1);
    } else if(t===TILE.TREE) {
      ctx.fillStyle = C.light; ctx.fillRect(x,y,w,h);
      ctx.fillStyle = C.dark; ctx.fillRect(x+2,y+2,12,10); // foliage
      ctx.fillRect(x+6,y+12,4,4); // trunk
    } else if(t===TILE.HOUSE) {
      ctx.fillStyle = C.light; ctx.fillRect(x,y,w,h);
      ctx.fillStyle = C.dark; ctx.fillRect(x+1,y+4,14,10); // walls
      ctx.fillStyle = C.mid; ctx.fillRect(x,y+2,16,4); // roof
    } else if(t===TILE.DOOR) {
      ctx.fillStyle = '#9bbc0f'; ctx.fillRect(x,y,w,h);
      ctx.fillStyle = C.dark; ctx.fillRect(x+4,y,8,14);
      ctx.fillStyle = C.mid; ctx.fillRect(x+5,y+1,6,12);
    } else if(t===TILE.WATER) {
      ctx.fillStyle = '#306230'; ctx.fillRect(x,y,w,h);
      ctx.fillStyle = '#8bac0f'; ctx.fillRect(x+2,y+4,4,1); ctx.fillRect(x+8,y+8,4,1);
    } else if(t===TILE.SIGN) {
      ctx.fillStyle = C.light; ctx.fillRect(x,y,w,h);
      ctx.fillStyle = C.mid; ctx.fillRect(x+4,y+4,8,8);
      ctx.fillStyle = C.dark; ctx.fillRect(x+6,y+6,4,1); ctx.fillRect(x+6,y+8,4,1);
    } else if(t===TILE.LEDGE) {
      ctx.fillStyle = C.light; ctx.fillRect(x,y,w,h);
      ctx.fillStyle = C.mid; ctx.fillRect(x,y+12,w,4);
      ctx.fillStyle = C.dark; ctx.fillRect(x,y+12,w,1);
    } else if(t===TILE.FENCE) {
      ctx.fillStyle = C.light; ctx.fillRect(x,y,w,h);
      ctx.fillStyle = C.mid; ctx.fillRect(x,y+4,w,2); ctx.fillRect(x+2,y,2,8); ctx.fillRect(x+10,y,2,8);
    }
  }

  function drawPlayer() {
    let tw = 16, th = 16;
    // Interpolate position
    let px = player.x, py = player.y;
    if(player.moving) {
      let t = player.moveTick / 8;
      px = player.x * (1-t) + player.targetX * t;
      py = player.y * (1-t) + player.targetY * t;
    }
    let sx = (px - camera.x) * tw + 72; // center on screen
    let sy = (py - camera.y) * th + 64;
    // Clamp to screen
    sx = Math.max(0, Math.min(144, sx));
    sy = Math.max(0, Math.min(128, sy));

    ctx.fillStyle = C.dark;
    // Simple 16x16 player sprite based on direction
    if(player.dir === 'down') {
      ctx.fillRect(sx+4, sy+2, 8, 6); // head
      ctx.fillRect(sx+2, sy+8, 12, 6); // body
      if(player.moving && Math.floor(player.moveTick/4)%2===0) { ctx.fillRect(sx+2, sy+14, 4, 2); ctx.fillRect(sx+10, sy+14, 4, 2); }
      else { ctx.fillRect(sx+4, sy+14, 2, 2); ctx.fillRect(sx+10, sy+14, 2, 2); }
    } else if(player.dir === 'up') {
      ctx.fillRect(sx+4, sy+2, 8, 6);
      ctx.fillRect(sx+2, sy+8, 12, 6);
      if(player.moving && Math.floor(player.moveTick/4)%2===0) { ctx.fillRect(sx+2, sy+14, 4, 2); ctx.fillRect(sx+10, sy+14, 4, 2); }
      else { ctx.fillRect(sx+4, sy+14, 2, 2); ctx.fillRect(sx+10, sy+14, 2, 2); }
    } else if(player.dir === 'left') {
      ctx.fillRect(sx+6, sy+2, 6, 6);
      ctx.fillRect(sx+2, sy+8, 10, 6);
      if(player.moving && Math.floor(player.moveTick/4)%2===0) ctx.fillRect(sx, sy+14, 4, 2);
      else ctx.fillRect(sx+2, sy+14, 3, 2);
    } else {
      ctx.fillRect(sx+4, sy+2, 6, 6);
      ctx.fillRect(sx+4, sy+8, 10, 6);
      if(player.moving && Math.floor(player.moveTick/4)%2===0) ctx.fillRect(sx+12, sy+14, 4, 2);
      else ctx.fillRect(sx+11, sy+14, 3, 2);
    }
  }

  function updateCamera() {
    let tx = player.moving ? (player.x*(1-player.moveTick/8) + player.targetX*(player.moveTick/8)) : player.x;
    let ty = player.moving ? (player.y*(1-player.moveTick/8) + player.targetY*(player.moveTick/8)) : player.y;
    camera.x = tx - 4.5;
    camera.y = ty - 4.5;
  }

  // ===== GAME LOOP =====
  function step() {
    if(scene === 'world') {
      if(player.moving) {
        player.moveTick++;
        if(player.moveTick >= 8) {
          player.x = player.targetX; player.y = player.targetY;
          player.moving = false; player.moveTick = 0;
          player.frame = 0;
          checkEncounter();
          // Auto-save on every tile
          saveGame();
        } else {
          player.frame = Math.floor(player.moveTick/2)%4;
        }
      }
      updateCamera();
      drawMap();
      drawPlayer();
    }
    requestAnimationFrame(step);
  }

  // ===== INIT =====
  generateMap();
  generateSprites();
  updateMenuCursor();
  updateBattleCursor();
  step();

  // Auto-focus canvas for keyboard
  window.focus();
</script>
</body>
