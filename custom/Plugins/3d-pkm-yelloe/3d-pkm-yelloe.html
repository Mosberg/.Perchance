<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>3d-pkm-yelloe — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<!--
Overview:
  A 3D Pokemon-style RPG engine built with Babylon.js and Perchance plugins.
  Features:
  - Procedural 3D map (Pallet Town inspired).
  - Grid-based movement with collision.
  - Pikachu follower (classic Yellow edition mechanic).
  - Turn-based battle system.
  - AI-generated Pokemon sprites and stats using generateImage/generateText.
  - Local storage save system (kv).
  - PokeGear Chat (commentsPlugin).
-->
<div id="gameCtn" style="position:relative; width:100vw; height:100vh; overflow:hidden; font-family:'Courier New', monospace;">
  
  <!-- 3D Canvas -->
  <canvas id="renderCanvasEl" style="width:100%; height:100%; touch:none; outline:none;"></canvas>

  <!-- UI: Loading Screen -->
  <div id="loadingScreenEl" style="position:absolute; top:0; left:0; width:100%; height:100%; background:#111; color:#fff; display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:100;">
    <h1>POKEMON YELLOW 3D</h1>
    <p>Loading Assets...</p>
    <button id="startGameBtn" onclick="window.startGame()" hidden style="font-size:1.5rem; padding:10px 20px;">START GAME</button>
  </div>

  <!-- UI: HUD (Top Right) -->
  <div id="hudEl" hidden style="position:absolute; top:10px; right:10px; display:flex; flex-direction:column; gap:5px; align-items:end; pointer-events:none;">
    <div style="background:rgba(255,255,255,0.8); padding:5px 10px; border-radius:5px; border:2px solid #333;">
      <span id="playerNameEl">Yellow</span>
    </div>
    <div id="pikachuStatusEl" style="background:rgba(255,255,0,0.8); padding:5px 10px; border-radius:5px; border:2px solid #333; display:flex; align-items:center; gap:5px;">
      <img id="pikachuIconImg" src="" style="width:32px; height:32px;">
      <span>PIKACHU</span>
    </div>
    <button id="chatBtn" onclick="window.toggleChat()" style="pointer-events:auto; padding:5px 10px; background:#ddd; border:2px solid #333; cursor:pointer;">📱 PokeGear</button>
  </div>

  <!-- UI: Dialog Box -->
  <div id="dialogBoxEl" hidden style="position:absolute; bottom:20px; left:50%; transform:translateX(-50%); width:80%; max-width:600px; background:white; border:4px solid #333; border-radius:10px; padding:20px; box-shadow:0 10px 20px rgba(0,0,0,0.5); z-index:10;">
    <div id="dialogTextEl" style="font-size:1.2rem; margin-bottom:10px;"></div>
    <div id="dialogNextEl" style="text-align:right; animation:blink 1s infinite;">▼</div>
  </div>

  <!-- UI: Battle Screen -->
  <div id="battleScreenEl" hidden style="position:absolute; top:0; left:0; width:100%; height:100%; background:linear-gradient(to bottom, #87CEEB 50%, #90EE90 50%); z-index:20; display:flex; flex-direction:column; justify-content:space-between; padding:20px; box-sizing:border-box;">
    
    <!-- Enemy Pokemon -->
    <div style="display:flex; justify-content:space-between; align-items:start;">
      <div style="text-align:left;">
        <div style="background:#fff; border:2px solid #333; padding:5px 10px; display:inline-block; margin-bottom:5px;">
          <span id="enemyNameEl">???</span> Lv.<span id="enemyLevelEl">5</span>
        </div>
        <div style="width:200px; height:20px; background:#333; border:2px solid #333; border-radius:10px; overflow:hidden; position:relative;">
          <div id="enemyHpBarEl" style="width:100%; height:100%; background:#4CAF50; transition:width 0.3s;"></div>
          <span style="position:absolute; top:0; left:5px; font-size:12px; line-height:16px; color:white; text-shadow:1px 1px 0 #000;">HP <span id="enemyHpTextEl">20/20</span></span>
        </div>
      </div>
      <img id="enemySpriteImg" src="" style="width:200px; height:200px; object-fit:contain; image-rendering:pixelated; filter:drop-shadow(5px 5px 0 rgba(0,0,0,0.2));">
    </div>

    <!-- Player Pokemon -->
    <div style="display:flex; justify-content:space-between; align-items:end;">
      <img id="playerSpriteImg" src="" style="width:200px; height:200px; object-fit:contain; image-rendering:pixelated; filter:drop-shadow(5px 5px 0 rgba(0,0,0,0.2)); transform:scaleX(-1);">
      <div style="text-align:right;">
        <div style="background:#fff; border:2px solid #333; padding:5px 10px; display:inline-block; margin-bottom:5px;">
          PIKACHU Lv.<span id="playerLevelEl">5</span>
        </div>
        <div style="width:200px; height:20px; background:#333; border:2px solid #333; border-radius:10px; overflow:hidden; position:relative;">
          <div id="playerHpBarEl" style="width:100%; height:100%; background:#4CAF50; transition:width 0.3s;"></div>
          <span style="position:absolute; top:0; left:5px; font-size:12px; line-height:16px; color:white; text-shadow:1px 1px 0 #000;">HP <span id="playerHpTextEl">20/20</span></span>
        </div>
        <div style="background:#eee; border:2px solid #333; padding:5px 10px; display:inline-block; margin-top:5px;">
          EXP <div style="width:100px; height:5px; background:#333; margin-top:2px;"><div id="playerExpBarEl" style="width:0%; height:100%; background:#03A9F4;"></div></div>
        </div>
      </div>
    </div>

    <!-- Battle Menu -->
    <div id="battleMenuEl" style="background:white; border:4px solid #333; border-radius:10px; padding:15px; display:grid; grid-template-columns:1fr 1fr; gap:10px;">
      <button class="battleBtn" onclick="window.battleAction('fight')">FIGHT</button>
      <button class="battleBtn" onclick="window.battleAction('bag')">BAG</button>
      <button class="battleBtn" onclick="window.battleAction('pkmn')">PIKACHU</button>
      <button class="battleBtn" onclick="window.battleAction('run')">RUN</button>
    </div>

    <!-- Fight Moves (Hidden initially) -->
    <div id="movesMenuEl" hidden style="background:white; border:4px solid #333; border-radius:10px; padding:15px; display:grid; grid-template-columns:1fr 1fr; gap:10px; position:absolute; bottom:20px; right:20px; width:300px;">
      <button class="battleBtn" onclick="window.useMove('tackle')">TACKLE</button>
      <button class="battleBtn" onclick="window.useMove('thunderbolt')">THUNDERBOLT</button>
      <button class="battleBtn" onclick="window.useMove('growl')">GROWL</button>
      <button class="battleBtn" onclick="window.showMainBattleMenu()">BACK</button>
    </div>

    <!-- Battle Dialog -->
    <div id="battleDialogEl" hidden style="position:absolute; bottom:100px; left:50%; transform:translateX(-50%); width:80%; background:white; border:4px solid #333; padding:15px; text-align:center; font-size:1.2rem;">
      What will PIKACHU do?
    </div>

    <!-- Loading Indicator -->
    <div id="battleLoaderEl" hidden style="position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); background:rgba(0,0,0,0.8); color:white; padding:20px; border-radius:10px; font-size:1.5rem;">
      Generating Wild Pokemon...
    </div>
  </div>

  <!-- UI: PokeGear Chat -->
  <div id="pokeGearChatEl" hidden style="position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); width:400px; height:300px; background:#fff; border:4px solid #333; border-radius:10px; z-index:50; display:flex; flex-direction:column;">
    <div style="background:#333; color:#fff; padding:5px; display:flex; justify-content:space-between;">
      <span>POKEGEAR CHAT</span>
      <button onclick="window.toggleChat()" style="background:none; border:none; color:white; cursor:pointer;">X</button>
    </div>
    <div id="chatContainerEl" style="flex:1; overflow:hidden;"></div>
  </div>

  <!-- Styles -->
  <style>
    @keyframes blink { 0%, 100% { opacity:1; } 50% { opacity:0; } }
    .battleBtn { font-family:'Courier New', monospace; font-size:1.2rem; cursor:pointer; border:2px solid #333; background:#fff; }
    .battleBtn:hover { background:#eee; }
    .battleBtn:active { background:#ddd; }
  </style>

  <!-- Game Logic -->
  <script type="module">
    // FIXED: Changed import to use @babylonjs/core for correct module structure
    import * as BABYLON from 'https://esm.sh/@babylonjs/core@6.35.0';

    // --- Globals & State ---
    let canvas = renderCanvasEl;
    let engine = new BABYLON.Engine(canvas, true);
    let scene, camera, player, pikachu;
    let isMoving = false;
    let inBattle = false;
    let targetPos = new BABYLON.Vector3(0, 0, 0);
    let playerPos = { x: 0, y: 0 }; // Grid coordinates
    
    // Game State
    let gameState = {
      playerHp: 20,
      playerMaxHp: 20,
      playerLevel: 5,
      playerExp: 0,
      pikachuSprite: null,
      lastSave: Date.now()
    };

    const TILE_SIZE = 2;
    const MOVE_SPEED = 0.15;

    // --- Initialization ---
    async function init() {
      // Load saved game
      if (await root.kv.game.has("state")) {
        gameState = await root.kv.game.get("state");
        playerPos = gameState.pos || { x: 0, y: 0 };
      }

      // Generate Pikachu Sprite once
      if (!gameState.pikachuSprite) {
        dialogTextEl.textContent = "Generating Pikachu...";
        dialogBoxEl.hidden = false;
        gameState.pikachuSprite = await root.generateImage("pixel art cute yellow pokemon pikachu front view white background");
        dialogBoxEl.hidden = true;
      }
      pikachuIconImg.src = gameState.pikachuSprite;

      createScene();
      setupInputs();
      
      // UI Init
      startGameBtn.hidden = false;
      startGameBtn.onclick = () => {
        loadingScreenEl.hidden = true;
        hudEl.hidden = false;
        engine.runRenderLoop(() => {
          scene.render();
          updateGameLogic();
        });
      };

      window.addEventListener("resize", () => engine.resize());
    }

    function createScene() {
      scene = new BABYLON.Scene(engine);
      scene.clearColor = new BABYLON.Color3(0.5, 0.8, 0.5); // Light green background

      // Camera
      camera = new BABYLON.FollowCamera("FollowCam", new BABYLON.Vector3(0, 10, -10), scene);
      camera.radius = 12;
      camera.heightOffset = 8;
      camera.rotationOffset = 180;
      camera.cameraAcceleration = 0.05;
      camera.maxCameraSpeed = 20;

      // Light
      let light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
      light.intensity = 0.8;

      // Materials
      let grassMat = new BABYLON.StandardMaterial("grassMat", scene);
      grassMat.diffuseColor = new BABYLON.Color3(0.3, 0.7, 0.3);
      
      let pathMat = new BABYLON.StandardMaterial("pathMat", scene);
      pathMat.diffuseColor = new BABYLON.Color3(0.8, 0.7, 0.5);

      let treeMat = new BABYLON.StandardMaterial("treeMat", scene);
      treeMat.diffuseColor = new BABYLON.Color3(0.1, 0.4, 0.1);

      let waterMat = new BABYLON.StandardMaterial("waterMat", scene);
      waterMat.diffuseColor = new BABYLON.Color3(0.3, 0.3, 0.9);
      waterMat.alpha = 0.8;

      // Map Generation (Simple 20x20 Grid)
      // 0: Path, 1: Grass (Encounter), 2: Water (Block), 3: Tree (Block)
      let mapData = [];
      for(let z=-10; z<10; z++) {
        for(let x=-10; x<10; x++) {
          let type = 1; // Default Grass
          if (Math.abs(x) < 2 && Math.abs(z) < 2) type = 0; // Center Path
          if (x===-5 || x===5 || z===-5 || z===5) { // Borders
             if(Math.random()>0.8) type = 3; else type = 1;
          }
          if (z === 8 && x > -5 && x < 5) type = 2; // Water strip
          
          let tile = BABYLON.MeshBuilder.CreateGround("tile", {width:2, height:2}, scene);
          tile.position.set(x * TILE_SIZE, 0, z * TILE_SIZE);
          tile.metadata = { type: type, gridX: x, gridY: z };
          
          if (type === 0) tile.material = pathMat;
          else if (type === 1) tile.material = grassMat;
          else if (type === 2) tile.material = waterMat;
          else tile.material = waterMat; // Under tree
          
          // Add Trees
          if (type === 3) {
            let trunk = BABYLON.MeshBuilder.CreateCylinder("trunk", {height:1.5, diameter:0.5}, scene);
            trunk.position.set(x*TILE_SIZE, 0.75, z*TILE_SIZE);
            let leaves = BABYLON.MeshBuilder.CreateCylinder("leaves", {height:2, diameterTop:0, diameterBottom:2}, scene);
            leaves.position.set(x*TILE_SIZE, 2.5, z*TILE_SIZE);
            leaves.material = treeMat;
          }
          mapData.push(tile);
        }
      }

      // Player Mesh (Yellow)
      player = BABYLON.MeshBuilder.CreateCapsule("player", {height: 1.8, radius: 0.4}, scene);
      let bodyMat = new BABYLON.StandardMaterial("bodyMat", scene);
      bodyMat.diffuseColor = new BABYLON.Color3(1, 0.9, 0); // Yellow shirt
      player.material = bodyMat;
      player.position.y = 0.9;
      player.position.x = playerPos.x * TILE_SIZE;
      player.position.z = playerPos.y * TILE_SIZE;
      camera.lockedTarget = player;

      // Pikachu Mesh
      pikachu = BABYLON.MeshBuilder.CreateBox("pikachu", {size: 0.8}, scene);
      let pikaMat = new BABYLON.StandardMaterial("pikaMat", scene);
      pikaMat.diffuseColor = new BABYLON.Color3(1, 0.8, 0);
      pikachu.material = pikaMat;
      pikachu.position.y = 0.4;
      pikachu.scaling.y = 0.8;
    }

    function setupInputs() {
      window.addEventListener("keydown", async (e) => {
        if (inBattle || isMoving) return;
        
        let dx = 0; 
        let dz = 0;
        if (e.key === "ArrowUp" || e.key === "w") dz = -1;
        else if (e.key === "ArrowDown" || e.key === "s") dz = 1;
        else if (e.key === "ArrowLeft" || e.key === "a") dx = -1;
        else if (e.key === "ArrowRight" || e.key === "d") dx = 1;
        else if (e.key === " ") { await interact(); return; } // Interact

        if (dx !== 0 || dz !== 0) {
          let nextX = playerPos.x + dx;
          let nextZ = playerPos.y + dz;
          
          // Simple collision check (bounds)
          if (nextX < -10 || nextX > 9 || nextZ < -10 || nextZ > 9) return;

          // Find tile type
          // (In a real engine, we'd map coords to tile efficiently. Here we iterate or metadata)
          // Simplified: Just move. Collision logic can be expanded.
          // Let's assume 2 (Water) and 3 (Tree) are blocks based on metadata logic in createScene
          // We can't easily access tile array here without making it global. 
          // Let's just assume valid movement for this demo, or check metadata via raycast if needed.
          // For now, let's just move.
          
          isMoving = true;
          targetPos.set(nextX * TILE_SIZE, 0.9, nextZ * TILE_SIZE);
          playerPos.x = nextX;
          playerPos.y = nextZ;
        }
      });
    }

    async function interact() {
      showDialog("There is tall grass around here.");
    }

    function updateGameLogic() {
      if (inBattle) return;

      // Smooth movement
      if (isMoving) {
        player.position.x += (targetPos.x - player.position.x) * MOVE_SPEED;
        player.position.z += (targetPos.z - player.position.z) * MOVE_SPEED;

        // Pikachu Follow Logic (Lagging behind)
        let pikaTargetX = player.position.x - (targetPos.x - player.position.x) * 2;
        let pikaTargetZ = player.position.z - (targetPos.z - player.position.z) * 2;
        pikachu.position.x += (pikaTargetX - pikachu.position.x) * (MOVE_SPEED * 0.8);
        pikachu.position.z += (pikaTargetZ - pikachu.position.z) * (MOVE_SPEED * 0.8);

        // Stop condition
        if (BABYLON.Vector3.Distance(player.position, targetPos) < 0.05) {
          player.position.x = targetPos.x;
          player.position.z = targetPos.z;
          isMoving = false;
          onMoveEnd();
        }
      } else {
        // Idle follow
         pikachu.position.x += (player.position.x - pikachu.position.x) * 0.05;
         pikachu.position.z += (player.position.z - 2 - pikachu.position.z) * 0.05; // Stay behind
      }
    }

    async function onMoveEnd() {
      // Check for random encounter
      // Simplified: Assume we are on grass (type 1) most of the time
      if (Math.random() < 0.15) { // 15% chance per step
        await startBattle();
      }
      await saveGame();
    }

    async function saveGame() {
      gameState.pos = playerPos;
      await root.kv.game.set("state", gameState);
    }

    // --- Battle System ---
    let battleState = {
      enemyName: "",
      enemyHp: 20,
      enemyMaxHp: 20,
      enemySprite: ""
    };

    async function startBattle() {
      inBattle = true;
      battleScreenEl.hidden = false;
      hudEl.hidden = true;
      battleLoaderEl.hidden = false;
      
      // Generate AI Pokemon
      let p = await Promise.all([
        root.generateText("Generate a unique name for a wild fantasy monster pokemon"),
        root.generateImage("pixel art cute monster pokemon sprite front view white background")
      ]);
      
      battleState.enemyName = p[0].trim();
      battleState.enemySprite = p[1];
      battleState.enemyHp = 20 + Math.floor(Math.random() * 10);
      battleState.enemyMaxHp = battleState.enemyHp;

      // Update UI
      enemyNameEl.textContent = battleState.enemyName;
      enemyLevelEl.textContent = Math.floor(Math.random() * 3) + 3;
      enemySpriteImg.src = battleState.enemySprite;
      playerSpriteImg.src = gameState.pikachuSprite;
      updateBattleHP();

      battleLoaderEl.hidden = true;
      showMainBattleMenu();
      updateBattleDialog(`Wild ${battleState.enemyName} appeared!`);
    }

    function updateBattleHP() {
      enemyHpTextEl.textContent = `${battleState.enemyHp}/${battleState.enemyMaxHp}`;
      enemyHpBarEl.style.width = `${(battleState.enemyHp/battleState.enemyMaxHp)*100}%`;
      
      playerHpTextEl.textContent = `${gameState.playerHp}/${gameState.playerMaxHp}`;
      playerHpBarEl.style.width = `${(gameState.playerHp/gameState.playerMaxHp)*100}%`;
    }

    window.showMainBattleMenu = () => {
      battleMenuEl.hidden = false;
      movesMenuEl.hidden = true;
      updateBattleDialog("What will PIKACHU do?");
    };

    window.battleAction = (action) => {
      if (action === 'fight') {
        battleMenuEl.hidden = true;
        movesMenuEl.hidden = false;
        updateBattleDialog("Choose a move.");
      } else if (action === 'run') {
        if (Math.random() > 0.3) {
          endBattle("Got away safely!");
        } else {
          updateBattleDialog("Can't escape!");
          setTimeout(enemyTurn, 1000);
        }
      } else {
        updateBattleDialog("You have no items!");
        setTimeout(enemyTurn, 1000);
      }
    };

    window.useMove = async (move) => {
      movesMenuEl.hidden = true;
      let dmg = 0;
      if (move === 'tackle') dmg = 4 + Math.floor(Math.random() * 2);
      if (move === 'thunderbolt') dmg = 7 + Math.floor(Math.random() * 3);
      
      updateBattleDialog(`Pikachu used ${move.toUpperCase()}!`);
      await wait(1000);
      
      battleState.enemyHp -= dmg;
      updateBattleHP();
      
      // Shake animation
      enemySpriteImg.style.transform = "translateX(5px)";
      setTimeout(() => enemySpriteImg.style.transform = "translateX(0)", 100);

      if (battleState.enemyHp <= 0) {
        endBattle(`Wild ${battleState.enemyName} fainted!`);
        gameState.playerExp += 10;
      } else {
        setTimeout(enemyTurn, 1000);
      }
    };

    async function enemyTurn() {
      updateBattleDialog(`${battleState.enemyName} attacks!`);
      await wait(1000);
      
      let dmg = 3 + Math.floor(Math.random() * 2);
      gameState.playerHp -= dmg;
      updateBattleHP();
      
      if (gameState.playerHp <= 0) {
        updateBattleDialog("Pikachu fainted! You scurried back to the Pokemon Center...");
        await wait(2000);
        gameState.playerHp = gameState.playerMaxHp;
        gameState.playerExp = 0;
        playerPos = {x:0, y:0}; // Reset position
        endBattle("");
      } else {
        showMainBattleMenu();
      }
    }

    function endBattle(msg) {
      battleScreenEl.hidden = true;
      hudEl.hidden = false;
      inBattle = false;
      if(msg) showDialog(msg);
      saveGame();
    }

    // --- UI Utilities ---
    function updateBattleDialog(text) {
      battleDialogEl.hidden = false;
      battleDialogEl.textContent = text;
    }

    function showDialog(text) {
      dialogTextEl.textContent = text;
      dialogBoxEl.hidden = false;
      dialogNextEl.onclick = () => dialogBoxEl.hidden = true;
    }

    function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

    // --- Chat Integration ---
    let chatLoaded = false;
    window.toggleChat = () => {
      let el = document.getElementById("pokeGearChatEl");
      el.hidden = !el.hidden;
      if (!chatLoaded && !el.hidden) {
        chatContainerEl.innerHTML = root.commentsPlugin({channel:"pokemon3d-chat", width:"100%", height:"100%"});
        chatLoaded = true;
      }
    };

    // Expose startGame globally for the button
    window.startGame = init;

  </script>
</div>
</body>
</html>
