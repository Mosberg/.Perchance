<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>load-from-github-plugin — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<!-- 
  GitHub Loader Plugin
  This file implements the plugin described in the instructions.
  It allows loading JS, CSS, HTML, MD, and JSON from GitHub raw URLs.
-->
<div id="mainCtn" style="max-width:800px; margin:20px auto; font-family:sans-serif;">
  <h1>GitHub Loader Plugin</h1>
  <p>Enter a raw GitHub URL to load content directly into the page.</p>
  
  <div style="margin-bottom:10px;">
    <input id="urlInput" type="text" style="width:70%; padding:8px;" placeholder="https://raw.githubusercontent.com/..." 
           value="https://raw.githubusercontent.com/Mosberg/Ant/refs/heads/main/index.html">
    <select id="typeSelect" style="padding:8px;">
      <option value="html">HTML</option>
      <option value="css">CSS</option>
      <option value="js">JS</option>
      <option value="md">Markdown</option>
      <option value="json">JSON</option>
    </select>
    <button id="loadBtn" style="padding:8px 16px;">Load</button>
  </div>

  <div id="statusEl" hidden style="padding:10px; margin-bottom:10px; border-radius:4px;"></div>
  
  <div id="outputCtn" style="text-align:left; border-top:1px solid #ccc; padding-top:10px; min-height:50px;"></div>
</div>

<!-- Markdown Parser Library -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>


<div id="statusEl" hidden style="padding: 8px; margin-bottom: 8px; border-radius: 4px"></div>
<div
  id="outputEl"
  data-github-src="https://raw.githubusercontent.com/Mosberg/Ant/refs/heads/main/README.md"
  data-github-type="md"
  data-github-status="#statusEl"
  data-github-trigger="auto"
  style="border: 1px solid #ddd; padding: 10px; min-height: 60px"
></div>

<div style="margin-top: 10px">
  <button id="reloadBtn" style="padding: 8px 12px">Reload README</button>
  <button id="addDynamicBtn" style="padding: 8px 12px; margin-left: 8px">Add Dynamic Loader</button>
</div>

<div id="dynamicArea" style="margin-top: 10px"></div>

<script>
  document.getElementById("reloadBtn").addEventListener("click", function () {
    window.loadFromGitHub.scanAuto("#outputEl", { force: true });
  });

  document.getElementById("addDynamicBtn").addEventListener("click", function () {
    var host = document.createElement("div");
    host.style.border = "1px dashed #bbb";
    host.style.padding = "10px";
    host.style.marginTop = "10px";

    var statusId = "dynStatus-" + Date.now();
    var outId = "dynOut-" + Date.now();

    host.innerHTML =
      "<div id='" +
      statusId +
      "' hidden style='padding:8px; margin-bottom:8px; border-radius:4px;'></div>" +
      "<div id='" +
      outId +
      "' data-github-src='https://raw.githubusercontent.com/Mosberg/Ant/refs/heads/main/index.html' data-github-type='html' data-github-status='#" +
      statusId +
      "' data-github-trigger='auto' style='min-height:50px;'></div>";

    document.getElementById("dynamicArea").appendChild(host);
    // No manual call needed. The plugin observer picks this up automatically.
  });
</script>

</body>
</html>
