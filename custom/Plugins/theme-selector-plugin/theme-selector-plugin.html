<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>theme-selector-plugin — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<div class="theme-selector">
  <label for="themeSelect">🎨 Theme:</label>
  <select id="themeSelectEl" aria-label="Select visual theme">
    <option value="dark" data-desc="Dimmed elegance 🌑">Dark</option>
    <option value="light" data-desc="Bright & clean ☀️">Light</option>
    <option value="retro" data-desc="Old-school vibes 🕹️">Retro</option>
    <option value="frost" data-desc="Cool & crisp ❄️">Frost</option>
    <option value="sunset" data-desc="Warm twilight 🌇">Sunset</option>
    <option value="cosmic" data-desc="Galactic glow 🌌">Cosmic</option>
  </select>
  <button id="resetThemeEl" aria-label="Reset to default theme">♻️ Reset</button>
  <p id="themeDescriptionEl" class="theme-desc" aria-live="polite"></p>
</div>

<script>
(() => {
  let select = themeSelectEl;
  let desc = themeDescriptionEl;
  let resetBtn = resetThemeEl;
  let defaultTheme = "dark";

  function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    localStorage.homepageTheme = theme;
    let selectedOption = select.querySelector(`option[value="${theme}"]`);
    desc.textContent = selectedOption?.dataset.desc || "";
    select.value = theme;
  }

  let saved = localStorage.homepageTheme || defaultTheme;
  applyTheme(saved);

  select.addEventListener("change", () => applyTheme(select.value));
  resetBtn.addEventListener("click", () => {
    localStorage.removeItem("homepageTheme");
    applyTheme(defaultTheme);
  });

  select.addEventListener("mouseover", (e) => {
    if (e.target.tagName === "OPTION") {
      desc.textContent = e.target.dataset.desc || "";
    }
  });
})();
</script>

<style>
.theme-desc {
  font-size: 0.9em;
  color: var(--text-secondary);
  margin-top: 0.5em;
}

[data-theme="dark"] {
  --bg-primary: #1e1e2e;
  --bg-secondary: #252836;
  --text-primary: #ffffff;
  --text-secondary: #b8b8d9;
  --accent-primary: #6c5ce7;
}

[data-theme="light"] {
  --bg-primary: #f5f7ff;
  --bg-secondary: #ffffff;
  --text-primary: #2d3436;
  --text-secondary: #636e72;
  --accent-primary: #0984e3;
}

[data-theme="retro"] {
  --bg-primary: #2d3436;
  --bg-secondary: #3c4245;
  --text-primary: #ffeaa7;
  --text-secondary: #fab1a0;
  --accent-primary: #e17055;
}

[data-theme="frost"] {
  --bg-primary: #dfe6e9;
  --bg-secondary: #b2bec3;
  --text-primary: #2d3436;
  --text-secondary: #636e72;
  --accent-primary: #74b9ff;
}

[data-theme="sunset"] {
  --bg-primary: #2d3436;
  --bg-secondary: #3c4245;
  --text-primary: #ffeaa7;
  --text-secondary: #fdcb6e;
  --accent-primary: #e17055;
}

[data-theme="cosmic"] {
  --bg-primary: #0f0c29;
  --bg-secondary: #302b63;
  --text-primary: #c3bef0;
  --text-secondary: #a29bfe;
  --accent-primary: #6a5ae0;
}

body {
  background-color: var(--bg-primary);
  color: var(--text-primary);
  transition: background-color 0.3s ease, color 0.3s ease;
}

.theme-selector {
  padding: 2em;
  background-color: var(--bg-secondary);
  border-radius: 8px;
  display: inline-block;
  box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
}

select, button {
  background-color: var(--bg-primary);
  color: var(--text-primary);
  border: 1px solid var(--text-secondary);
  padding: 0.5em 1em;
  border-radius: 4px;
  margin: 0 0.5em 0 0;
  cursor: pointer;
  transition: all 0.2s ease;
}

select:hover, button:hover {
  background-color: var(--accent-primary);
  color: white;
  border-color: var(--accent-primary);
}

label {
  color: var(--text-primary);
  font-weight: bold;
}
</style>
</body>
</html>
