<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>v8sfocxbar — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<div id="appCtn" style="display:flex; height:100vh; font-family:Arial,sans-serif;">
  <!-- Left Panel: Controls -->
  <div style="width:320px; background:#f5f5f5; border-right:1px solid #ddd; padding:20px; display:flex; flex-direction:column; gap:15px;">
    <h2 style="margin:0;">AI Code Generator</h2>
    
    <!-- Prompt Input -->
    <div>
      <label style="display:block; margin-bottom:5px;">Describe what you need:</label>
      <textarea id="promptInput" placeholder="e.g., A function to validate email addresses" style="width:100%; height:80px; padding:8px; border-radius:4px; border:1px solid #ccc;"></textarea>
    </div>
    
    <!-- Language Selector -->
    <div>
      <label style="display:block; margin-bottom:5px;">Language:</label>
      <select id="langSelect" style="width:100%; padding:8px; border-radius:4px; border:1px solid #ccc;">
        <option value="javascript">JavaScript</option>
        <option value="python">Python</option>
        <option value="java">Java</option>
        <option value="csharp">C#</option>
        <option value="cpp">C++</option>
        <option value="rust">Rust</option>
        <option value="go">Go</option>
        <option value="php">PHP</option>
      </select>
    </div>
    
    <!-- Plugin Selector -->
    <div>
      <label style="display:block; margin-bottom:5px;">Active Plugins:</label>
      <div id="pluginCtn" style="display:flex; flex-direction:column; gap:8px;">
        <label style="display:flex; align-items:center; gap:5px;">
          <input type="checkbox" id="pluginDocs" checked>
          <span>Auto Documentation</span>
        </label>
        <label style="display:flex; align-items:center; gap:5px;">
          <input type="checkbox" id="pluginError">
          <span>Error Handling</span>
        </label>
        <label style="display:flex; align-items:center; gap:5px;">
          <input type="checkbox" id="pluginOptimize">
          <span>Code Optimization</span>
        </label>
        <label style="display:flex; align-items:center; gap:5px;">
          <input type="checkbox" id="pluginTests">
          <span>Unit Tests</span>
        </label>
      </div>
    </div>
    
    <!-- Advanced Options -->
    <details>
      <summary style="cursor:pointer; font-weight:bold;">Advanced Settings</summary>
      <div style="margin-top:10px; display:flex; flex-direction:column; gap:10px;">
        <div>
          <label style="display:block; margin-bottom:5px;">Creativity:</label>
          <input type="range" id="creativitySlider" min="0" max="1" step="0.1" value="0.7" style="width:100%;">
          <div style="display:flex; justify-content:space-between; font-size:12px;">
            <span>Conservative</span>
            <span id="creativityValue">0.7</span>
            <span>Creative</span>
          </div>
        </div>
        <div>
          <label style="display:block; margin-bottom:5px;">Output Length:</label>
          <select id="lengthSelect" style="width:100%; padding:5px; border-radius:4px; border:1px solid #ccc;">
            <option value="short">Short</option>
            <option value="medium" selected>Medium</option>
            <option value="long">Long</option>
          </select>
        </div>
      </div>
    </details>
    
    <!-- Action Buttons -->
    <button id="generateBtn" style="background:#4285f4; color:white; border:none; padding:12px; border-radius:4px; font-weight:bold; cursor:pointer;">Generate Code</button>
    <button id="stopBtn" hidden style="background:#ea4335; color:white; border:none; padding:12px; border-radius:4px; font-weight:bold; cursor:pointer;">Stop Generation</button>
    
    <!-- History Section -->
    <div style="flex:1; overflow-y:auto;">
      <h3 style="margin:0 0 10px;">Generation History</h3>
      <div id="historyCtn" style="display:flex; flex-direction:column; gap:8px;"></div>
    </div>
  </div>
  
  <!-- Right Panel: Code Output -->
  <div style="flex:1; display:flex; flex-direction:column;">
    <div style="padding:15px; background:#eee; border-bottom:1px solid #ddd; display:flex; justify-content:space-between; align-items:center;">
      <h3 style="margin:0;">Generated Code</h3>
      <div>
        <button id="copyBtn" style="background:#34a853; color:white; border:none; padding:8px 15px; border-radius:4px; margin-right:10px; cursor:pointer;">Copy</button>
        <button id="downloadBtn" style="background:#fbbc05; color:black; border:none; padding:8px 15px; border-radius:4px; cursor:pointer;">Download</button>
      </div>
    </div>
    <div style="flex:1; position:relative;">
      <pre id="codeOutput" style="position:absolute; top:0; left:0; right:0; bottom:0; margin:0; padding:20px; background:#1e1e1e; color:#d4d4d4; overflow:auto; font-family:Consolas,monospace; white-space:pre-wrap;"></pre>
      <div id="loadingIndicator" hidden style="position:absolute; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.7); display:flex; align-items:center; justify-content:center; color:white; font-size:20px;">
        <div>
          <div>Generating code...</div>
          <div style="margin-top:10px; font-size:14px;">This may take up to 60 seconds</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  // Global variables
  let currentGenerationPromise = null;
  
  // Initialize app
  function init() {
    // Load history from storage
    loadHistory();
    
    // Set up event listeners
    generateBtn.onclick = generateCode;
    stopBtn.onclick = stopGeneration;
    copyBtn.onclick = copyCode;
    downloadBtn.onclick = downloadCode;
    
    // Update creativity display
    creativitySlider.oninput = () => creativityValue.textContent = creativitySlider.value;
    
    // Update history UI when plugins change
    pluginCtn.onchange = saveHistory;
  }
  
  // Generate code using AI
  async function generateCode() {
    const prompt = promptInput.value.trim();
    if (!prompt) {
      alert("Please enter a prompt");
      return;
    }
    
    // Get settings
    const language = langSelect.value;
    const creativity = parseFloat(creativitySlider.value);
    const length = lengthSelect.value;
    
    // Build plugin instructions
    let pluginInstructions = "";
    if (pluginDocs.checked) pluginInstructions += "Include detailed comments and documentation. ";
    if (pluginError.checked) pluginInstructions += "Add comprehensive error handling. ";
    if (pluginOptimize.checked) pluginInstructions += "Optimize for performance. ";
    if (pluginTests.checked) pluginInstructions += "Include unit tests. ";
    
    // Create generation instruction
    const instruction = `Generate ${language} code for: ${prompt}. ${pluginInstructions}Make the code ${length}.`;
    
    // Show loading state
    loadingIndicator.hidden = false;
    generateBtn.disabled = true;
    stopBtn.hidden = false;
    
    // Generate code
    try {
      currentGenerationPromise = generateText({ 
        instruction, 
        temperature: creativity,
        stopSequences: ["```", "Example:"]
      });
      
      const code = await currentGenerationPromise;
      
      // Display code
      codeOutput.textContent = code;
      
      // Add to history
      addToHistory(prompt, code, language);
    } catch (error) {
      codeOutput.textContent = `Error generating code: ${error.message}`;
    } finally {
      loadingIndicator.hidden = true;
      generateBtn.disabled = false;
      stopBtn.hidden = true;
      currentGenerationPromise = null;
    }
  }
  
  // Stop generation
  function stopGeneration() {
    if (currentGenerationPromise) {
      currentGenerationPromise.stop();
      currentGenerationPromise = null;
      loadingIndicator.hidden = true;
      generateBtn.disabled = false;
      stopBtn.hidden = true;
    }
  }
  
  // Copy code to clipboard
  function copyCode() {
    navigator.clipboard.writeText(codeOutput.textContent).then(() => {
      const originalText = copyBtn.textContent;
      copyBtn.textContent = "Copied!";
      setTimeout(() => copyBtn.textContent = originalText, 2000);
    });
  }
  
  // Download code as file
  function downloadCode() {
    const code = codeOutput.textContent;
    const language = langSelect.value;
    const extensions = {
      javascript: "js",
      python: "py",
      java: "java",
      csharp: "cs",
      cpp: "cpp",
      rust: "rs",
      go: "go",
      php: "php"
    };
    
    const blob = new Blob([code], { type: "text/plain" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `generated_code.${extensions[language] || "txt"}`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  
  // History management
  function addToHistory(prompt, code, language) {
    const historyItem = {
      id: Date.now(),
      prompt,
      code,
      language,
      timestamp: new Date().toISOString()
    };
    
    let history = JSON.parse(localStorage.getItem("codeHistory") || "[]");
    history.unshift(historyItem);
    
    // Keep only last 20 items
    if (history.length > 20) history = history.slice(0, 20);
    
    localStorage.setItem("codeHistory", JSON.stringify(history));
    renderHistory();
  }
  
  function loadHistory() {
    renderHistory();
  }
  
  function renderHistory() {
    const history = JSON.parse(localStorage.getItem("codeHistory") || "[]");
    historyCtn.innerHTML = "";
    
    if (history.length === 0) {
      historyCtn.innerHTML = "<div style='color:#666; font-style:italic;'>No history yet</div>";
      return;
    }
    
    history.forEach(item => {
      const itemEl = document.createElement("div");
      itemEl.className = "history-item";
      itemEl.style.cssText = "padding:10px; background:white; border-radius:4px; border:1px solid #ddd; cursor:pointer; font-size:14px;";
      itemEl.innerHTML = `
        <div style="font-weight:bold; margin-bottom:4px;">${item.prompt.substring(0, 40)}${item.prompt.length > 40 ? '...' : ''}</div>
        <div style="display:flex; justify-content:space-between; color:#666; font-size:12px;">
          <span>${item.language}</span>
          <span>${new Date(item.timestamp).toLocaleString()}</span>
        </div>
      `;
      
      itemEl.onclick = () => {
        promptInput.value = item.prompt;
        langSelect.value = item.language;
        codeOutput.textContent = item.code;
      };
      
      historyCtn.appendChild(itemEl);
    });
  }
  
  function saveHistory() {
    // Trigger history re-render when plugins change
    renderHistory();
  }
  
  // Initialize app when DOM is ready
  init();
</script>

<style>
  .history-item:hover {
    background: #e8f0fe;
  }
</style>
</body>
</html>
