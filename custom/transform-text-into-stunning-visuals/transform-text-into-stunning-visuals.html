<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>transform-text-into-stunning-visuals — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<div id="mainCtn" style="max-width:600px; margin:0 auto; padding:20px; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color:#eee; background:#1a1a1a; min-height:100vh; border-left:1px solid #333; border-right:1px solid #333;">
  
  <!-- Header & Stats -->
  <header style="text-align:center; margin-bottom:20px; border-bottom:1px solid #333; padding-bottom:15px;">
    <h1 style="margin:0; font-size:1.8rem; background: linear-gradient(90deg, #ff8a00, #e52e71); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">AI Image Gen</h1>
    <p style="margin:5px 0 0; opacity:0.6; font-size:0.9rem;">Transform text into stunning visuals.</p>
    <!-- Generator Stats Plugin Placeholder -->
    <div id="statsEl" style="margin-top:10px; font-size:0.75rem; color:#666;"></div>
  </header>

  <!-- Prompt Input Section -->
  <section style="margin-bottom:20px;">
    <label style="display:block; margin-bottom:8px; font-weight:600; font-size:0.95rem; color:#ddd;">
      Prompt
      <span class="tooltip-trigger" data-tooltip="Describe the image you want to see. Be specific for best results." style="cursor:help; opacity:0.5; font-size:0.8em; margin-left:5px;">(?)</span>
    </label>
    <textarea id="promptInput" rows="3" placeholder="A futuristic city with flying cars, neon lights, cyberpunk style, highly detailed..." style="width:100%; box-sizing:border-box; padding:12px; border-radius:8px; border:1px solid #444; background:#252525; color:#fff; font-family:inherit; resize:vertical; font-size:1rem; outline:none; transition:border-color 0.2s;" onfocus="this.style.borderColor='#e52e71'" onblur="this.style.borderColor='#444'"></textarea>
    
    <div style="display:flex; gap:10px; margin-top:10px;">
      <button id="enhanceBtn" onclick="enhancePrompt()" style="flex:1; padding:10px; border-radius:6px; border:none; background:#333; color:#ccc; cursor:pointer; font-size:0.9rem; transition:background 0.2s; display:flex; align-items:center; justify-content:center; gap:6px;" data-tooltip="Uses AI to expand and improve your description.">
        <span>✨</span> Enhance Prompt
      </button>
      <button id="clearBtn" onclick="clearPrompt()" style="flex:0 0 70px; padding:10px; border-radius:6px; border:none; background:#333; color:#ccc; cursor:pointer; font-size:0.9rem;">Clear</button>
    </div>
  </section>

  <!-- Style Selection (Select-Leaf / Random-Select Simulation) -->
  <section style="margin-bottom:20px;">
    <label style="display:block; margin-bottom:8px; font-weight:600; font-size:0.95rem; color:#ddd;">
      Art Style
      <span class="tooltip-trigger" data-tooltip="Select a preset style to guide the AI." style="cursor:help; opacity:0.5; font-size:0.8em; margin-left:5px;">(?)</span>
    </label>
    <div id="styleChipsCtn" style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px;">
      <!-- Chips injected by JS -->
    </div>
    <button id="randomStyleBtn" onclick="pickRandomStyle()" style="padding:6px 12px; border-radius:20px; border:1px solid #555; background:transparent; color:#aaa; cursor:pointer; font-size:0.85rem; transition:all 0.2s;" onmouseover="this.style.borderColor='#e52e71'; this.style.color='#fff'" onmouseout="this.style.borderColor='#555'; this.style.color='#aaa'">
      🎲 Random Style
    </button>
  </section>

  <!-- Advanced Settings (Collapsible) -->
  <section style="margin-bottom:25px;">
    <button id="settingsToggleBtn" onclick="toggleSettings()" style="background:none; border:none; color:#888; text-decoration:underline; cursor:pointer; font-size:0.85rem; padding:0;">Show Advanced Settings</button>
    <div id="advancedSettingsCtn" hidden style="margin-top:12px; padding:15px; background:#222; border-radius:8px; border:1px solid #333; animation: fadeIn 0.3s ease;">
      <div style="margin-bottom:12px;">
        <label style="display:block; font-size:0.85rem; margin-bottom:5px; color:#ccc;">Resolution</label>
        <select id="resolutionInput" style="width:100%; padding:8px; border-radius:4px; background:#333; color:white; border:1px solid #444; outline:none;">
          <option value="512x512">Square (512x512)</option>
          <option value="768x512">Landscape (768x512)</option>
          <option value="512x768">Portrait (512x768)</option>
          <option value="768x768">High Detail (768x768)</option>
        </select>
      </div>
      <div style="display:flex; gap:15px;">
        <div style="flex:1;">
            <label style="display:block; font-size:0.85rem; margin-bottom:5px; color:#ccc;" data-tooltip="More steps = more detail (slower).">Steps</label>
            <input type="number" id="stepsInput" value="20" min="10" max="50" style="width:100%; padding:8px; border-radius:4px; background:#333; color:white; border:1px solid #444;">
        </div>
        <div style="flex:1;">
            <label style="display:block; font-size:0.85rem; margin-bottom:5px; color:#ccc;" data-tooltip="How closely the AI follows your prompt.">Guidance</label>
            <input type="number" id="guidanceInput" value="7" min="1" max="20" step="0.5" style="width:100%; padding:8px; border-radius:4px; background:#333; color:white; border:1px solid #444;">
        </div>
      </div>
    </div>
  </section>

  <!-- Generate Action -->
  <button id="generateBtn" onclick="generateImageHandler()" style="width:100%; padding:16px; border-radius:8px; border:none; background:linear-gradient(135deg, #e52e71, #ff8a00); color:white; font-size:1.1rem; font-weight:bold; cursor:pointer; box-shadow:0 4px 15px rgba(229, 46, 113, 0.3); transition:transform 0.1s, box-shadow 0.2s; position:relative; overflow:hidden;">
    <span id="btnText">Generate Image</span>
  </button>

  <!-- Loading State -->
  <div id="loadingCtn" hidden style="margin-top:25px; text-align:center; padding:25px; background:#222; border-radius:8px; border:1px dashed #444;">
    <div style="width:30px; height:30px; border:3px solid #444; border-top-color:#e52e71; border-radius:50%; margin:0 auto 15px; animation:spin 1s linear infinite;"></div>
    <div style="font-weight:bold; color:#fff;">Generating...</div>
    <div style="font-size:0.85rem; color:#666; margin-top:5px;">AI is painting your masterpiece.</div>
  </div>

  <!-- Result Display -->
  <div id="resultArea" hidden style="margin-top:30px; border-top:1px solid #333; padding-top:20px; animation: slideUp 0.4s ease;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <h2 style="font-size:1.1rem; margin:0; color:#ddd;">Result</h2>
      <button onclick="copyPrompt()" style="background:none; border:none; color:#e52e71; cursor:pointer; font-size:0.85rem;">Copy Prompt</button>
    </div>
    
    <div style="background:#000; border-radius:8px; overflow:hidden; box-shadow:0 8px 20px rgba(0,0,0,0.5); margin-bottom:15px; border:1px solid #333;">
      <img id="resultImg" alt="Generated Art" style="width:100%; display:block; height:auto; min-height:200px;">
    </div>

    <div id="usedPromptEl" style="background:#222; padding:10px; border-radius:4px; font-size:0.85rem; color:#aaa; white-space:pre-wrap; word-break:break-word; margin-bottom:15px; border-left:3px solid #e52e71;"></div>

    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
      <button id="saveGalleryBtn" onclick="saveToGallery()" style="padding:12px; border-radius:6px; border:none; background:#2ecc71; color:white; font-weight:bold; cursor:pointer; box-shadow:0 2px 5px rgba(0,0,0,0.2);" data-tooltip="Save to persistent gallery below.">Save to Gallery</button>
      <button id="downloadBtn" onclick="downloadImage()" style="padding:12px; border-radius:6px; border:none; background:#3498db; color:white; font-weight:bold; cursor:pointer; box-shadow:0 2px 5px rgba(0,0,0,0.2);">Download</button>
      <button onclick="generateImageHandler()" style="padding:12px; border-radius:6px; border:none; background:#e67e22; color:white; font-weight:bold; cursor:pointer; box-shadow:0 2px 5px rgba(0,0,0,0.2);">Regenerate</button>
      <button onclick="window.open('https://www.perchance.org/ai-photo-generator?prompt='+encodeURIComponent(getCurrentPrompt()), '_blank')" style="padding:12px; border-radius:6px; border:none; background:#555; color:white; font-weight:bold; cursor:pointer;">Edit in Pro</button>
    </div>
  </div>

  <!-- Gallery Section -->
  <section id="gallerySection" style="margin-top:40px; border-top:1px solid #333; padding-top:20px;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
      <h2 style="font-size:1.2rem; margin:0; color:#fff;">Gallery</h2>
      <div style="display:flex; align-items:center; gap:8px;">
        <span style="font-size:0.8rem; color:#888;">Sort:</span>
        <select id="gallerySortInput" onchange="renderGallery()" style="padding:4px 8px; border-radius:4px; background:#333; color:white; border:1px solid #444; font-size:0.85rem;">
          <option value="newest">Newest</option>
          <option value="oldest">Oldest</option>
        </select>
      </div>
    </div>
    
    <div id="galleryGrid" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap:10px;">
      <div id="emptyGalleryMsg" style="grid-column:1/-1; text-align:center; padding:40px; color:#555; font-style:italic; background:#111; border-radius:8px; border:1px dashed #333;">
        No images saved yet. Generate and save some!
      </div>
    </div>
  </section>
</div>

<!-- Tooltip Element -->
<div id="tooltipEl" style="position:fixed; background:rgba(20, 20, 20, 0.95); color:#fff; padding:6px 10px; border-radius:4px; font-size:0.8rem; pointer-events:none; opacity:0; transition:opacity 0.2s; z-index:1000; max-width:200px; border:1px solid #444; box-shadow:0 4px 10px rgba(0,0,0,0.5);"></div>

<script type="module">
  // --- Access Perchance Globals via root ---
  const generateText = root.generateText;
  const generateImage = root.generateImage;
  const kv = root.kv;
  const uploadPlugin = root.uploadPlugin;

  // --- Internal State (Local to module, NOT attached to root/window) ---
  let currentStyle = "";
  let generatedDataUrl = "";
  let currentPrompt = "";
  
  // Style Presets
  const styles = [
    "Photorealistic", "Anime", "Cyberpunk", "Oil Painting", 
    "Watercolor", "3D Render", "Pixel Art", "Sketch", "Fantasy Art", 
    "Cinematic", "Vaporwave", "Noir", "Ukiyo-e"
  ];

  // --- Utilities ---
  const get = (id) => document.getElementById(id);

  // --- Initialization ---
  window.onload = async () => {
    // 1. Initialize Stats
    if(root.generatorStatsPlugin) {
      try { get("statsEl").innerHTML = root.generatorStatsPlugin({showViews:true}); } catch(e){}
    }

    // 2. Render Style Chips
    renderStyleChips();
    
    // 3. Restore Settings (Remember-plugin simulation)
    if(localStorage.getItem("imgGen_res")) get("resolutionInput").value = localStorage.getItem("imgGen_res");
    if(localStorage.getItem("imgGen_sort")) get("gallerySortInput").value = localStorage.getItem("imgGen_sort");
    
    // 4. Handle URL Params
    handleUrlParams();

    // 5. Load Gallery
    await renderGallery();

    // 6. Setup Tooltips
    setupTooltips();
  };

  // --- Style Logic ---
  function renderStyleChips() {
    const ctn = get("styleChipsCtn");
    ctn.innerHTML = "";
    styles.forEach(style => {
      let chip = document.createElement("button");
      chip.textContent = style;
      chip.className = "styleChip";
      chip.onclick = () => selectStyle(style, chip);
      chip.style.cssText = `
        padding: 6px 12px; border-radius: 20px; border: 1px solid #444; 
        background: #222; color: #999; cursor: pointer; font-size: 0.85rem; 
        transition: all 0.2s; white-space: nowrap;
      `;
      ctn.appendChild(chip);
    });
  }

  function selectStyle(styleName, btnElement) {
    currentStyle = styleName;
    document.querySelectorAll(".styleChip").forEach(b => {
      b.style.background = "#222";
      b.style.borderColor = "#444";
      b.style.color = "#999";
    });
    btnElement.style.background = "linear-gradient(135deg, #e52e71, #ff8a00)";
    btnElement.style.borderColor = "transparent";
    btnElement.style.color = "#fff";
    btnElement.style.fontWeight = "bold";
  }

  // --- Tooltip Logic ---
  function setupTooltips() {
    const triggers = document.querySelectorAll(".tooltip-trigger");
    const tooltip = get("tooltipEl");

    triggers.forEach(el => {
      el.addEventListener("mouseenter", (e) => {
        tooltip.textContent = el.dataset.tooltip;
        tooltip.style.opacity = "1";
        const rect = el.getBoundingClientRect();
        tooltip.style.top = (rect.top + window.scrollY - tooltip.offsetHeight - 6) + "px";
        tooltip.style.left = (rect.left + window.scrollX + (rect.width/2) - (tooltip.offsetWidth/2)) + "px";
      });
      el.addEventListener("mouseleave", () => {
        tooltip.style.opacity = "0";
      });
    });
  }

  // --- Settings Logic ---
  function toggleSettings() {
    const ctn = get("advancedSettingsCtn");
    const btn = get("settingsToggleBtn");
    ctn.hidden = !ctn.hidden;
    btn.textContent = ctn.hidden ? "Show Advanced Settings" : "Hide Advanced Settings";
  };

  get("resolutionInput").onchange = (e) => localStorage.setItem("imgGen_res", e.target.value);
  get("gallerySortInput").onchange = (e) => localStorage.setItem("imgGen_sort", e.target.value);

  // --- Actions ---
  function clearPrompt() { get("promptInput").value = ""; }

  async function enhancePrompt() {
    const original = get("promptInput").value;
    if(!original.trim()) return alert("Please enter a prompt first.");
    
    const btn = get("enhanceBtn");
    btn.innerHTML = "<span>⏳</span> Thinking...";
    btn.disabled = true;

    try {
      const enhanced = await generateText({
        instruction: `Expand this image generation prompt with rich, descriptive details suitable for Stable Diffusion. Keep the core meaning but make it vivid. Output ONLY the text.\n\nOriginal: ${original}`,
        maxTokens: 80
      });
      get("promptInput").value = enhanced.trim();
    } catch(e) { console.error(e); alert("Enhancement failed."); }

    btn.innerHTML = "<span>✨</span> Enhance Prompt";
    btn.disabled = false;
  }

  function pickRandomStyle() {
    const chips = document.querySelectorAll(".styleChip");
    if(chips.length) chips[Math.floor(Math.random() * chips.length)].click();
  }

  async function generateImageHandler() {
    const prompt = get("promptInput").value.trim();
    if(!prompt) return alert("Please enter a prompt!");

    let fullPrompt = prompt;
    if(currentStyle) fullPrompt += `, ${currentStyle} style`;

    const btn = get("generateBtn");
    const btnText = get("btnText");
    btn.disabled = true;
    btnText.textContent = "Generating...";
    btn.style.opacity = "0.7";
    get("loadingCtn").hidden = false;
    get("resultArea").hidden = true;

    try {
      const res = get("resolutionInput").value;
      generatedDataUrl = await generateImage(fullPrompt, { resolution: res });
      currentPrompt = fullPrompt;
      
      get("resultImg").src = generatedDataUrl;
      get("usedPromptEl").textContent = fullPrompt;
      get("resultArea").hidden = false;
      
      get("resultArea").scrollIntoView({behavior: "smooth", block: "start"});

    } catch(e) {
      console.error(e);
      alert("Generation failed. Please try again.");
    } finally {
      btn.disabled = false;
      btnText.textContent = "Generate Image";
      btn.style.opacity = "1";
      get("loadingCtn").hidden = true;
    }
  }

  function downloadImage() {
    if(!generatedDataUrl) return;
    const a = document.createElement("a");
    a.href = generatedDataUrl;
    a.download = `ai-art-${Date.now()}.png`;
    a.click();
  }

  function copyPrompt() {
    if(!currentPrompt) return;
    navigator.clipboard.writeText(currentPrompt).then(() => alert("Prompt copied!"));
  }
  
  // Helper for window.open access
  function getCurrentPrompt() { return currentPrompt; }

  // --- Gallery & Persistence (KV Plugin) ---
  async function saveToGallery() {
    if(!generatedDataUrl) return;
    const btn = get("saveGalleryBtn");
    const originalText = btn.textContent;
    
    btn.textContent = "Uploading...";
    btn.disabled = true;

    try {
      const blob = await fetch(generatedDataUrl).then(r => r.blob());
      const upload = await uploadPlugin(blob);
      if(upload.error) throw new Error(upload.error);

      const item = { url: upload.url, prompt: currentPrompt, id: Date.now().toString() };
      
      let images = await kv.gallery.get("list") || [];
      images.push(item);
      await kv.gallery.set("list", images);

      btn.textContent = "Saved!";
      setTimeout(() => { btn.textContent = originalText; btn.disabled = false; }, 1500);
      await renderGallery();

    } catch(e) {
      console.error(e);
      alert("Save failed: " + e.message);
      btn.textContent = originalText;
      btn.disabled = false;
    }
  }

  async function renderGallery() {
    const grid = get("galleryGrid");
    const sort = get("gallerySortInput").value;
    let images = await kv.gallery.get("list") || [];

    if(images.length === 0) {
      grid.innerHTML = '<div id="emptyGalleryMsg" style="grid-column:1/-1; text-align:center; padding:40px; color:#555; font-style:italic; background:#111; border-radius:8px; border:1px dashed #333;">No images saved yet.</div>';
      return;
    }

    images.sort((a,b) => sort === "newest" ? b.id - a.id : a.id - b.id);

    grid.innerHTML = "";
    images.forEach(img => {
      const el = document.createElement("div");
      el.style.cssText = "position:relative; aspect-ratio:1; background:#111; border-radius:8px; overflow:hidden; border:1px solid #333; cursor:pointer; transition:transform 0.2s;";
      el.onmouseover = () => el.style.transform = "scale(1.02)";
      el.onmouseout = () => el.style.transform = "scale(1)";
      
      el.innerHTML = `
        <img src="${img.url}" style="width:100%; height:100%; object-fit:cover;">
        <div style="position:absolute; bottom:0; left:0; right:0; background:rgba(0,0,0,0.8); color:#fff; font-size:0.75rem; padding:8px; opacity:0; transition:opacity 0.2s; display:flex; justify-content:space-between; align-items:center;">
          <span style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:80%;">${img.prompt}</span>
          <button style="background:none; border:none; color:#ff5555; font-weight:bold; cursor:pointer;" class="del-btn">×</button>
        </div>
      `;
      
      const overlay = el.querySelector("div");
      el.onmouseenter = () => overlay.style.opacity = "1";
      el.onmouseleave = () => overlay.style.opacity = "0";
      
      el.querySelector(".del-btn").onclick = async (e) => {
        e.stopPropagation();
        if(confirm("Delete this image?")) {
          const list = (await kv.gallery.get("list") || []).filter(i => i.id !== img.id);
          await kv.gallery.set("list", list);
          await renderGallery();
        }
      };

      grid.appendChild(el);
    });
  }

  // --- URL Params Plugin Logic ---
  function handleUrlParams() {
    const params = new URLSearchParams(window.location.search);
    const pPrompt = params.get("prompt");
    const pStyle = params.get("style");

    if(pPrompt) get("promptInput").value = pPrompt;
    if(pStyle) {
      const chips = Array.from(document.querySelectorAll(".styleChip"));
      const match = chips.find(c => c.textContent.toLowerCase() === pStyle.toLowerCase());
      if(match) match.click();
    }

    if(pPrompt) setTimeout(() => generateImageHandler(), 800);
  }

  // --- Exports to Window (for inline onclick handlers) ---
  // We assign to window, not root, to avoid Proxy errors
  window.enhancePrompt = enhancePrompt;
  window.toggleSettings = toggleSettings;
  window.generateImageHandler = generateImageHandler;
  window.downloadImage = downloadImage;
  window.copyPrompt = copyPrompt;
  window.saveToGallery = saveToGallery;
  window.renderGallery = renderGallery;
  window.pickRandomStyle = pickRandomStyle;
  window.clearPrompt = clearPrompt;
  window.getCurrentPrompt = getCurrentPrompt;

</script>

<style>
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  
  @media (max-width: 500px) {
    #mainCtn { padding: 15px; border:none; }
    h1 { font-size: 1.5rem; }
    #galleryGrid { grid-template-columns: repeat(2, 1fr); }
    #resultArea button { font-size: 0.9rem; padding: 10px; }
  }
</style>

</body>
</html>
