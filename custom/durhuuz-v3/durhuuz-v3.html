<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Danske Casinoer – Oversigt</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
/* ---------- AUTO DARK/LIGHT THEME ---------- */
:root {
    --bg: #ffffff;
    --card: #f2f2f2;
    --text: #111;
    --accent: #0066ff;
    --danger: #cc0000;
    --shadow: rgba(0,0,0,0.1);
}

@media (prefers-color-scheme: dark) {
:root {
    --bg: #121212;
    --card: #1e1e1e;
    --text: #eaeaea;
    --accent: #4da3ff;
    --danger: #ff4d4d;
    --shadow: rgba(0,0,0,0.6);
}
}

/* ---------- GLOBAL ---------- */
body {
    font-family: Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 20px;
}

h1 {
    text-align: center;
    margin-bottom: 10px;
}

#dashboard {
    background: var(--card);
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 20px;
    box-shadow: 0 4px 10px var(--shadow);
}

.progress {
    height: 10px;
    background: #ccc;
    border-radius: 5px;
    overflow: hidden;
    margin-top: 5px;
}

.progress-bar {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.4s;
}

/* ---------- CONTROLS ---------- */
.controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 20px;
}

.controls input, .controls select {
    padding: 10px;
    font-size: 16px;
    flex: 1;
}

/* ---------- CASINO CARDS ---------- */
.casino {
    background: var(--card);
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 12px;
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 10px;
    align-items: center;
    box-shadow: 0 4px 10px var(--shadow);
    transition: transform 0.2s;
}

.casino:hover {
    transform: scale(1.01);
}

.casino a {
    font-weight: bold;
    color: var(--accent);
    text-decoration: none;
}

.limitInput {
    width: 150px;
    padding: 6px;
}

.warning {
    color: var(--danger);
    font-size: 14px;
}

/* ---------- CLEAR BUTTON ---------- */
#clearBtn {
    padding: 12px 20px;
    background: var(--danger);
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    margin-top: 20px;
    width: 100%;
}
</style>
</head>
<body>

<h1>Alle Danske Casinoer</h1>

<div id="dashboard">
    <h3>Status i dag</h3>
    <p><b>Brugt i dag:</b> <span id="usedCount">0</span> / <span id="totalCount">0</span></p>

    <p><b>Samlet deposit limit:</b> <span id="totalLimit">0</span> kr</p>
    <div class="progress"><div id="limitBar" class="progress-bar"></div></div>
</div>

<div class="controls">
    <input type="text" id="search" placeholder="Søg casino...">
    <select id="categoryFilter">
        <option value="all">Alle kategorier</option>
        <option value="casino">Casino</option>
        <option value="sportsbetting">Sportsbetting</option>
        <option value="live">Live Casino</option>
        <option value="poker">Poker</option>
        <option value="bingo">Bingo</option>
    </select>
    <select id="sort">
        <option value="az">A → Z</option>
        <option value="za">Z → A</option>
        <option value="used">Brugt i dag først</option>
    </select>
</div>

<div id="casinoList"></div>

<button id="clearBtn">Nulstil dagens brug</button>

<script>
/* ---------- CASINO DATA ---------- */
const casinos = [
    { name: "888 Casino", url: "https://www.888casino.dk", category: "casino" },
    { name: "Bet365", url: "https://www.bet365.dk", category: "sportsbetting" },
    { name: "Unibet", url: "https://www.unibet.dk", category: "sportsbetting" },
    { name: "LeoVegas", url: "https://www.leovegas.dk", category: "casino" },
    { name: "Mr Green", url: "https://www.mrgreen.dk", category: "casino" },
    { name: "Casino.dk", url: "https://www.casino.dk", category: "casino" },
    { name: "PokerStars", url: "https://www.pokerstars.dk", category: "poker" },
    { name: "Bingo.dk", url: "https://www.bingo.dk", category: "bingo" },
    { name: "ComeOn", url: "https://www.comeon.dk", category: "casino" },
    { name: "Ladbrokes", url: "https://www.ladbrokes.dk", category: "sportsbetting" },
    { name: "Betfair", url: "https://www.betfair.dk", category: "sportsbetting" },
    { name: "Maria Casino", url: "https://www.mariacasino.dk", category: "casino" },
    { name: "Rizk", url: "https://www.rizk.dk", category: "casino" },
    { name: "Royal Casino", url: "https://www.royalcasino.dk", category: "casino" },
    { name: "Spilnu", url: "https://www.spilnu.dk", category: "casino" },
    { name: "Betinia", url: "https://www.betinia.dk", category: "casino" }
];

/* ---------- STATE ---------- */
let state = JSON.parse(localStorage.getItem("casinoState") || "{}");

/* ---------- RENDER ---------- */
function render() {
    const list = document.getElementById("casinoList");
    list.innerHTML = "";

    const search = document.getElementById("search").value.toLowerCase();
    const filter = document.getElementById("categoryFilter").value;
    const sort = document.getElementById("sort").value;

    let items = casinos.map((c, i) => ({...c, id: i}));

    if (search) items = items.filter(c => c.name.toLowerCase().includes(search));
    if (filter !== "all") items = items.filter(c => c.category === filter);

    if (sort === "az") items.sort((a,b)=>a.name.localeCompare(b.name));
    if (sort === "za") items.sort((a,b)=>b.name.localeCompare(a.name));
    if (sort === "used") items.sort((a,b)=>(state["cb_"+b.id]||0)-(state["cb_"+a.id]||0));

    items.forEach(casino => {
        const div = document.createElement("div");
        div.className = "casino";

        div.innerHTML = `
            <a href="${casino.url}" target="_blank">${casino.name}</a>
            <input type="checkbox" data-id="${casino.id}" class="usedToday">
            <div>
                <input type="number" min="0" class="limitInput" data-id="${casino.id}" placeholder="Limit kr" value="${state["limit_"+casino.id]||""}">
                <div class="warning" id="warn_${casino.id}"></div>
            </div>
        `;

        list.appendChild(div);
    });

    restoreState();
    updateDashboard();
}

/* ---------- STATE SAVE/RESTORE ---------- */
function saveState() {
    localStorage.setItem("casinoState", JSON.stringify(state));
}

function restoreState() {
    document.querySelectorAll(".usedToday").forEach(cb => {
        const id = cb.dataset.id;
        cb.checked = state["cb_"+id] || false;
        cb.onchange = () => {
            state["cb_"+id] = cb.checked;
            saveState();
            updateDashboard();
        };
    });

    document.querySelectorAll(".limitInput").forEach(inp => {
        const id = inp.dataset.id;
        inp.oninput = () => {
            state["limit_"+id] = inp.value;
            saveState();
            updateDashboard();
        };
    });
}

/* ---------- DASHBOARD ---------- */
function updateDashboard() {
    const used = Object.keys(state).filter(k=>k.startsWith("cb_") && state[k]).length;
    const total = casinos.length;
    const limits = Object.keys(state).filter(k=>k.startsWith("limit_")).map(k=>Number(state[k])||0);
    const totalLimit = limits.reduce((a,b)=>a+b,0);

    document.getElementById("usedCount").textContent = used;
    document.getElementById("totalCount").textContent = total;
    document.getElementById("totalLimit").textContent = totalLimit;

    const bar = document.getElementById("limitBar");
    const pct = Math.min(100, totalLimit / 50000 * 100);
    bar.style.width = pct + "%";

    casinos.forEach((c,i)=>{
        const warn = document.getElementById("warn_"+i);
        const val = Number(state["limit_"+i]||0);
        warn.textContent = val > 5000 ? "⚠ Over 5000 kr!" : "";
    });
}

/* ---------- CLEAR ---------- */
document.getElementById("clearBtn").onclick = () => {
    casinos.forEach((c,i)=>state["cb_"+i] = false);
    saveState();
    render();
};

/* ---------- AUTO RESET AT MIDNIGHT ---------- */
function autoReset() {
    const now = new Date();
    if (now.getHours() === 0 && now.getMinutes() === 0) {
        casinos.forEach((c,i)=>state["cb_"+i] = false);
        saveState();
        render();
    }
}
setInterval(autoReset, 60000);

/* ---------- EVENTS ---------- */
document.getElementById("search").oninput = render;
document.getElementById("categoryFilter").onchange = render;
document.getElementById("sort").onchange = render;

/* ---------- INIT ---------- */
render();
</script>

</body>
</html>
</body>
</html>
