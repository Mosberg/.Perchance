<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>fabric-modding-ai-2 — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<div id="app" style="font-family: var(--vscode-font-family); background: var(--vscode-editor-background); color: var(--vscode-editor-foreground); height: 100vh; display: flex; flex-direction: column; overflow: hidden;">
  <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background: linear-gradient(135deg, #1e5128, #2d5a3e); color: white; flex-shrink: 0;">
    <div style="font-weight: bold; font-size: 18px;">⚒️ Fabric Modding AI</div>
    <div style="font-size: 12px; opacity: 0.8;">MC 1.21.10 | Fabric API 0.138.3 | Java 21</div>
  </div>
  
  <div style="display: flex; padding: 0 20px; border-bottom: 1px solid var(--vscode-panel-border); overflow-x: auto; flex-shrink: 0;">
    <div id="tabsCtn" style="display: flex; min-width: max-content;">
      <button class="tabBtn active" data-tab="main" style="padding: 10px 20px; background: none; border: none; color: var(--vscode-tab-activeForeground); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap;">Main</button>
      <button class="tabBtn" data-tab="entities" style="padding: 10px 20px; background: none; border: none; color: var(--vscode-tab-inactiveForeground); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap;">Entities</button>
      <button class="tabBtn" data-tab="blocks" style="padding: 10px 20px; background: none; border: none; color: var(--vscode-tab-inactiveForeground); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap;">Blocks</button>
      <button class="tabBtn" data-tab="items" style="padding: 10px 20px; background: none; border: none; color: var(--vscode-tab-inactiveForeground); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap;">Items</button>
      <button class="tabBtn" data-tab="commands" style="padding: 10px 20px; background: none; border: none; color: var(--vscode-tab-inactiveForeground); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap;">Commands</button>
      <button class="tabBtn" data-tab="screens" style="padding: 10px 20px; background: none; border: none; color: var(--vscode-tab-inactiveForeground); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap;">Screens</button>
      <button class="tabBtn" data-tab="mixins" style="padding: 10px 20px; background: none; border: none; color: var(--vscode-tab-inactiveForeground); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap;">Mixins</button>
    </div>
  </div>
  
  <div id="tabContentCtn" style="flex: 1; display: flex; flex-direction: column; overflow: hidden; min-height: 0;">
    <div id="mainContent" class="tabContent" style="flex: 1; display: flex; flex-direction: column; padding: 20px; min-height: 0;">
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 20px; flex-shrink: 0;">
        <button class="actionBtn" onclick="generateMod(event)" style="padding: 15px; background: linear-gradient(135deg, #1e5128, #2d5a3e); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; min-height: 60px;">⚙️ Setup New Mod</button>
        <button class="actionBtn" onclick="generateEntity(event)" style="padding: 15px; background: linear-gradient(135deg, #4a7c59, #2d5a3e); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; min-height: 60px;">🪲 Generate Entity</button>
        <button class="actionBtn" onclick="generateBlock(event)" style="padding: 15px; background: linear-gradient(135deg, #8b4513, #654321); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; min-height: 60px;">🧱 Generate Block</button>
        <button class="actionBtn" onclick="generateItem(event)" style="padding: 15px; background: linear-gradient(135deg, #483d8b, #4169e1); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; min-height: 60px;">📦 Generate Item</button>
        <button class="actionBtn" onclick="generateCommand(event)" style="padding: 15px; background: linear-gradient(135deg, #2e8b57, #3cb371); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; min-height: 60px;">💬 Generate Command</button>
        <button class="actionBtn" onclick="generateScreen(event)" style="padding: 15px; background: linear-gradient(135deg, #8b7355, #a0522d); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; min-height: 60px;">🖼️ Generate Screen</button>
      </div>
      
      <div style="flex: 1; overflow-y: auto; border: 1px solid var(--vscode-input-border); border-radius: 8px; padding: 15px; background: var(--vscode-textBlockQuote-background); min-height: 0;">
        <div id="messagesCtn" style="display: flex; flex-direction: column; gap: 10px;">
          <div style="padding: 12px; background: var(--vscode-badge-background); border-radius: 8px;">
            <strong>Fabric Modding AI</strong> is ready! Select an action above or type a custom prompt below.
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <div style="padding: 15px 20px; border-top: 1px solid var(--vscode-panel-border); display: flex; flex-direction: column; gap: 10px; flex-shrink: 0;">
    <div style="display: flex; gap: 10px; align-items: center;">
      <select id="modelSelect" style="padding: 8px; background: var(--vscode-dropdown-background); color: var(--vscode-dropdown-foreground); border: 1px solid var(--vscode-dropdown-border); border-radius: 4px; flex: 1; min-width: 0;">
        <option value="sonar-pro">Sonar Pro (Fast Code)</option>
        <option value="sonar-research">Sonar Research (Complex)</option>
      </select>
      <button id="apiStatusBtn" style="padding: 8px 15px; background: var(--vscode-button-background); color: var(--vscode-button-foreground); border: none; border-radius: 4px; cursor: pointer; white-space: nowrap;">Set API Key</button>
    </div>
    <div style="display: flex; gap: 10px; align-items: flex-end;">
      <textarea id="promptInput" rows="2" placeholder="Type your modding prompt here... (e.g., 'Create a custom bee entity with pollination AI')" style="flex: 1; padding: 12px; background: var(--vscode-input-background); color: var(--vscode-input-foreground); border: 1px solid var(--vscode-input-border); border-radius: 6px; resize: none; min-width: 0;"></textarea>
      <button id="sendBtn" onclick="sendPrompt(event)" style="padding: 12px 24px; background: #1e5128; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; white-space: nowrap;">Send</button>
    </div>
  </div>
</div>

<script>
  // Tab switching functionality
  const tabBtns = document.querySelectorAll('.tabBtn');
  const tabContents = document.querySelectorAll('.tabContent');
  
  tabBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      // Remove active class from all buttons
      tabBtns.forEach(b => {
        b.classList.remove('active');
        b.style.color = 'var(--vscode-tab-inactiveForeground)';
        b.style.borderBottom = '2px solid transparent';
      });
      
      // Add active class to clicked button
      btn.classList.add('active');
      btn.style.color = 'var(--vscode-tab-activeForeground)';
      btn.style.borderBottom = '2px solid var(--vscode-button-background)';
      
      // Show corresponding tab content (simplified for this demo)
      const tabName = btn.getAttribute('data-tab');
      // In a real implementation, we would show/hide tab content here
    });
  });
  
  // Add message to chat
  function addMessage(role, content) {
    const messageEl = document.createElement('div');
    messageEl.className = `message ${role}`;
    messageEl.style.padding = '12px';
    messageEl.style.borderRadius = '8px';
    messageEl.style.maxWidth = '90%';
    messageEl.style.wordBreak = 'break-word';
    
    if (role === 'user') {
      messageEl.style.background = 'var(--vscode-badge-background)';
      messageEl.style.marginLeft = 'auto';
    } else {
      messageEl.style.background = 'var(--vscode-textBlockQuote-background)';
    }
    
    messageEl.innerHTML = content.replace(/```(\w+)?\n([\s\S]*?)```/g, '<pre style="background:var(--vscode-textBlockQuote-background); padding:10px; border-radius:4px; overflow-x:auto;"><code>$2</code></pre>');
    messagesCtn.appendChild(messageEl);
    messagesCtn.scrollTop = messagesCtn.scrollHeight;
  }
  
  // Perchance plugin integration for all AI features
  async function generateWithPerchance(prompt, options = {}) {
    try {
      // Use generateText from Perchance plugin
      return await generateText({
        instruction: prompt,
        ...options
      });
    } catch (error) {
      console.error('Generation error:', error);
      return `Error: ${error.message || 'Failed to generate content'}`;
    }
  }
  
  // Generator functions using Perchance plugins
  async function generateMod(event) {
    const name = prompt('Enter mod name (e.g., MyAwesomeMod):');
    if (!name) return;
    
    // Show loading state
    const originalText = event.target.textContent;
    event.target.textContent = '⏳ Generating...';
    event.target.disabled = true;
    
    // Generate mod setup using Perchance
    const prompt = `Generate a complete Fabric mod setup for Minecraft 1.21.10 with Fabric API 0.138.3 and Java 21. The mod name is "${name}". Include:
    - build.gradle with all necessary dependencies
    - gradle.properties with correct versions
    - fabric.mod.json with metadata
    - Main mod class structure
    - Example registration code
    - Directory structure explanation
    
    Make sure all code is correct and follows Fabric modding best practices.`;
    
    const response = await generateWithPerchance(prompt);
    addMessage('assistant', `✅ Generated mod **${name}**:\n\n${response}`);
    
    // Restore button state
    event.target.textContent = originalText;
    event.target.disabled = false;
  }
  
  async function generateEntity(event) {
    const name = prompt('Enter entity name (e.g., MyCustomEntity):');
    if (!name) return;
    
    // Show loading state
    const originalText = event.target.textContent;
    event.target.textContent = '⏳ Generating...';
    event.target.disabled = true;
    
    // Generate entity using Perchance
    const prompt = `Generate a complete custom entity for Minecraft Fabric mod 1.21.10. The entity name is "${name}". Include:
    - Entity class extending PathfinderMob
    - Entity registration code
    - Entity attributes
    - Spawn egg item
    - Basic AI goals
    - Render class
    - Entity model (JSON)
    - Texture file paths
    
    Make sure all code is correct and follows Minecraft entity creation best practices.`;
    
    const response = await generateWithPerchance(prompt);
    addMessage('assistant', `✅ Generated entity **${name}**:\n\n${response}`);
    
    // Restore button state
    event.target.textContent = originalText;
    event.target.disabled = false;
  }
  
  async function generateBlock(event) {
    const name = prompt('Enter block name (e.g., MyCustomBlock):');
    if (!name) return;
    
    // Show loading state
    const originalText = event.target.textContent;
    event.target.textContent = '⏳ Generating...';
    event.target.disabled = true;
    
    // Generate block using Perchance
    const prompt = `Generate a complete custom block for Minecraft Fabric mod 1.21.10. The block name is "${name}". Include:
    - Block class
    - Block registration code
    - Block item
    - Blockstate JSON
    - Block model JSON
    - Item model JSON
    - Texture file paths
    - Loot table JSON
    
    Make sure all code is correct and follows Minecraft block creation best practices.`;
    
    const response = await generateWithPerchance(prompt);
    addMessage('assistant', `✅ Generated block **${name}**:\n\n${response}`);
    
    // Restore button state
    event.target.textContent = originalText;
    event.target.disabled = false;
  }
  
  async function generateItem(event) {
    const name = prompt('Enter item name (e.g., MyCustomItem):');
    if (!name) return;
    
    // Show loading state
    const originalText = event.target.textContent;
    event.target.textContent = '⏳ Generating...';
    event.target.disabled = true;
    
    // Generate item using Perchance
    const prompt = `Generate a complete custom item for Minecraft Fabric mod 1.21.10. The item name is "${name}". Include:
    - Item class
    - Item registration code
    - Item model JSON
    - Texture file paths
    - Custom properties if applicable
    
    Make sure all code is correct and follows Minecraft item creation best practices.`;
    
    const response = await generateWithPerchance(prompt);
    addMessage('assistant', `✅ Generated item **${name}**:\n\n${response}`);
    
    // Restore button state
    event.target.textContent = originalText;
    event.target.disabled = false;
  }
  
  async function generateCommand(event) {
    const name = prompt('Enter command name (e.g., mycommand):');
    if (!name) return;
    
    // Show loading state
    const originalText = event.target.textContent;
    event.target.textContent = '⏳ Generating...';
    event.target.disabled = true;
    
    // Generate command using Perchance
    const prompt = `Generate a complete custom command for Minecraft Fabric mod 1.21.10. The command name is "${name}". Include:
    - Command class
    - Command registration code
    - Argument handling if applicable
    - Command execution logic
    - Permission level requirements
    
    Make sure all code is correct and follows Minecraft command creation best practices.`;
    
    const response = await generateWithPerchance(prompt);
    addMessage('assistant', `✅ Generated command **/${name}**:\n\n${response}`);
    
    // Restore button state
    event.target.textContent = originalText;
    event.target.disabled = false;
  }
  
  async function generateScreen(event) {
    const name = prompt('Enter screen name (e.g., MyCustomScreen):');
    if (!name) return;
    
    // Show loading state
    const originalText = event.target.textContent;
    event.target.textContent = '⏳ Generating...';
    event.target.disabled = true;
    
    // Generate screen using Perchance
    const prompt = `Generate a complete custom screen for Minecraft Fabric mod 1.21.10. The screen name is "${name}". Include:
    - Screen class
    - Screen handler class if applicable
    - Registration code
    - Example UI components (buttons, text fields)
    - Rendering logic
    - Texture file paths
    
    Make sure all code is correct and follows Minecraft screen creation best practices.`;
    
    const response = await generateWithPerchance(prompt);
    addMessage('assistant', `✅ Generated screen **${name}**:\n\n${response}`);
    
    // Restore button state
    event.target.textContent = originalText;
    event.target.disabled = false;
  }
  
  // Send prompt to Perchance
  async function sendPrompt(event) {
    const prompt = promptInput.value.trim();
    if (!prompt) return;
    
    // Add user message to chat
    addMessage('user', prompt);
    
    // Show loading state
    const originalText = sendBtn.textContent;
    sendBtn.textContent = '⏳ Generating...';
    sendBtn.disabled = true;
    
    // Generate response using Perchance
    const response = await generateWithPerchance(prompt, {
      model: modelSelect.value
    });
    
    // Add assistant message
    addMessage('assistant', response);
    
    // Restore button state
    sendBtn.textContent = originalText;
    sendBtn.disabled = false;
    
    // Clear input
    promptInput.value = '';
  }
  
  // Handle API key status
  function updateApiStatus() {
    const hasKey = !!localStorage.fabricApiKey;
    apiStatusBtn.textContent = hasKey ? '✅ API Key Set' : 'Set API Key';
    apiStatusBtn.style.background = hasKey ? 'var(--vscode-badge-background)' : 'var(--vscode-inputValidation-errorBackground)';
  }
  
  // Set API key
  apiStatusBtn.addEventListener('click', () => {
    const key = prompt('Enter your Perchance API key:');
    if (key) {
      localStorage.fabricApiKey = key;
      updateApiStatus();
    }
  });
  
  // Handle Enter key in prompt input
  promptInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendPrompt(e);
    }
  });
  
  // Initialize API key status
  updateApiStatus();
  
  // Mobile responsiveness adjustments
  function adjustForMobile() {
    if (window.innerWidth < 768) {
      // Adjust grid layout for mobile
      const grid = document.querySelector('.actionBtn').parentElement;
      grid.style.gridTemplateColumns = 'repeat(2, 1fr)';
      
      // Adjust font sizes
      document.querySelectorAll('.actionBtn').forEach(btn => {
        btn.style.fontSize = '12px';
        btn.style.padding = '10px';
      });
      
      // Adjust tab font size
      tabBtns.forEach(btn => {
        btn.style.fontSize = '12px';
        btn.style.padding = '8px 12px';
      });
      
      // Adjust input area
      promptInput.style.fontSize = '14px';
      sendBtn.style.fontSize = '14px';
      sendBtn.style.padding = '10px 16px';
    }
  }
  
  // Initial adjustment and add resize listener
  adjustForMobile();
  window.addEventListener('resize', adjustForMobile);
  
  // Touch-friendly scrolling for tabs
  const tabsContainer = document.getElementById('tabsCtn');
  let isDown = false;
  let startX;
  let scrollLeft;
  
  tabsContainer.addEventListener('mousedown', (e) => {
    isDown = true;
    tabsContainer.style.cursor = 'grabbing';
    startX = e.pageX - tabsContainer.offsetLeft;
    scrollLeft = tabsContainer.scrollLeft;
  });
  
  tabsContainer.addEventListener('mouseleave', () => {
    isDown = false;
    tabsContainer.style.cursor = 'grab';
  });
  
  tabsContainer.addEventListener('mouseup', () => {
    isDown = false;
    tabsContainer.style.cursor = 'grab';
  });
  
  tabsContainer.addEventListener('mousemove', (e) => {
    if (!isDown) return;
    e.preventDefault();
    const x = e.pageX - tabsContainer.offsetLeft;
    const walk = (x - startX) * 2;
    tabsContainer.scrollLeft = scrollLeft - walk;
  });
  
  // Touch support for mobile
  tabsContainer.addEventListener('touchstart', (e) => {
    startX = e.touches[0].pageX - tabsContainer.offsetLeft;
    scrollLeft = tabsContainer.scrollLeft;
  });
  
  tabsContainer.addEventListener('touchmove', (e) => {
    if (e.touches.length !== 1) return;
    const x = e.touches[0].pageX - tabsContainer.offsetLeft;
    const walk = (x - startX) * 2;
    tabsContainer.scrollLeft = scrollLeft - walk;
  });
</script>
</body>
</html>
