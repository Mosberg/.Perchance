<body>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;

    font-family: "Tahoma", "Verdana", "Segoe UI", sans-serif;

  }
  #bg {
    position: fixed; inset: 0; z-index: 0;

    filter: brightness(0.55) blur(1px);
  }
  #vignette {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;

      linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0) 22%, rgba(0,0,0,0) 70%, rgba(0,0,0,0.75) 100%),

  }
  #root { position: relative; z-index: 2; width: 100%; height: 100%; }

  /* Small title top-left */
  @font-face {
    font-family: "coolvetica";
    src: url("https://user.uploads.dev/file/d0870f5b7c94c3112117f9d1b01071b7.ttf") format("truetype");
  }
  #title {

    border-radius: 11px;

    font-family: "coolvetica", sans-serif;

  /* Menu — top-left, compact, flat */
  #menu {

  .mbtn {

  .mbtn:hover, .mbtn.active {

    border-left-color: #ffb020;
    color: #fff;
    padding-left: 16px;

  .mbtn .arrow { display: none; }

  /* Section divider label */
  .msec {

  /* Bottom bar */

  #bottombar .left { display: flex; gap: 16px; align-items: center; }
  #bottombar .player { display: flex; align-items: center; gap: 6px; }
  #bottombar .dot { width: 8px; height: 8px; background: #4ade80; border-radius: 50%; box-shadow: 0 0 6px #4ade80; }
  #bottombar a { color: #cdd6d4; text-decoration: none; cursor: pointer; }
  #bottombar a:hover { color: #ffb020; text-decoration: underline; }
  #version { opacity: 0.65; font-family: monospace; }
  #mpNameBar { display: flex; align-items: center; }
  .mp-name-bar-input {
    background: #1a1e21; color: #e0e6e8; border: 1px solid #000;
    padding: 3px 8px; font-size: 12px; border-radius: 3px;
    width: 130px; font-family: inherit;
  }
  .mp-name-bar-input:focus { outline: none; border-color: #ffb020; }

  .ctx-pm {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);

  .ctx-pm-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
  }
  .ctx-pm-item {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px;
    background: #2a2f33; border: 1px solid #0c0e0f; border-radius: 4px;
    cursor: pointer; transition: background 0.08s, border-color 0.08s;
  }
  .ctx-pm-item:hover { background: #3a4146; border-color: #ffb020; }
  .ctx-pm-item.selected { border-color: #ffb020; background: #2e3438; }
  .ctx-pm-item-icon { width: 28px; height: 28px; flex-shrink: 0; border-radius: 4px; }
  .ctx-pm-item-info { flex: 1; min-width: 0; }
  .ctx-pm-item-name { font-size: 12px; color: #dfe5e3; font-weight: 600; }
  .ctx-pm-item-desc { font-size: 10px; color: #8a9498; margin-top: 1px; }
  .ctx-pm-color-row { display: flex; align-items: center; gap: 8px; }
  .ctx-pm-presets { display: flex; gap: 4px; flex-wrap: wrap; }
  .ctx-pm-preset {
    width: 22px; height: 22px; border-radius: 4px; cursor: pointer;
    border: 1px solid #000;
  }
  .ctx-pm-preset:hover { transform: scale(1.15); }

  /* Console hint */
  #hint {
    position: absolute; bottom: 40px; right: 22px;
    font-size: 11px; color: #5f6a6d; font-family: monospace;
    opacity: 0.8;
  }

  /* Overlay panel */
  .panel-scrim {
    position: absolute; inset: 0; z-index: 5;
    background: rgba(0,0,0,0.6);
    display: flex; align-items: center; justify-content: center;
  }
  .panel {
    width: 600px; max-width: 92vw; max-height: 82vh;
    background: #22272a; border: 1px solid #000;
    box-shadow: 0 12px 50px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.04);
    display: flex; flex-direction: column;
    font-size: 14px;
  }
  .panel .phdr {
    padding: 10px 16px; background: #2c3236;
    border-bottom: 1px solid #000;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 15px; font-weight: 600; color: #ffb020;
    text-shadow: 1px 1px 0 #000;
  }
  .panel .pbody { padding: 16px; overflow-y: auto; color: #cdd6d4; }
  .panel .pftr {
    padding: 10px 16px; border-top: 1px solid #000;
    background: #1a1d1f; display: flex; justify-content: flex-end; gap: 8px;
  }
  .pbtn {
    all: unset; cursor: pointer; padding: 6px 16px;
    background: #3a4146; color: #fff; font-family: inherit; font-size: 13px;
    border: 1px solid #000; box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
    transition: background 0.1s;
  }
  .pbtn:hover { background: #ffb020; color: #000; }
  .pbtn.primary { background: #ffb020; color: #000; font-weight: 600; }
  .pbtn.primary:hover { background: #ffc24a; }
  .pbtn:active { transform: translateY(1px); }

  /* Map list */
  .maplist { display: flex; flex-direction: column; gap: 3px; }
  .mapitem {
    display: flex; align-items: center; gap: 11px;
    padding: 8px 10px; cursor: pointer;
    background: #2a2f33; border: 1px solid #0c0e0f;
    transition: background 0.08s, border-color 0.08s;
  }
  .mapitem:hover, .mapitem.sel { background: #3a4146; border-color: #ffb020; }
  .mapitem .ico {
    width: 26px; height: 26px; flex-shrink: 0;
    background: linear-gradient(135deg, #4a5258, #2a2f33);
    border: 1px solid #000; display: grid; place-items: center;
    font-size: 12px; color: #ffb020; font-weight: 700;
  }
  .mapitem .nm { font-weight: 600; color: #dfe5e3; font-size: 13px; }
  .mapitem .gm { font-size: 11px; color: #8a9498; margin-top: 1px; }
  .mapselected {
    margin-top: 12px; padding: 9px 11px; background: #1a1d1f;
    border: 1px dashed #4a5258; font-size: 12px; color: #9aa4a7;
  }
  .mapselected b { color: #ffb020; }

  /* Options */
  .opt-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0; border-bottom: 1px solid #2a2f33;
  }
  .opt-row .lbl { color: #cdd6d4; font-size: 13px; }
  .opt-row .val { display: flex; gap: 6px; align-items: center; }
  .slider {
    -webkit-appearance: none; appearance: none;
    width: 150px; height: 5px; background: #0c0e0f; border: 1px solid #000;
    outline: none;
  }
  .slider::-webkit-slider-thumb {
    -webkit-appearance: none; width: 11px; height: 16px;
    background: #ffb020; cursor: pointer; border: 1px solid #000;
  }
  .slider::-moz-range-thumb {
    width: 11px; height: 16px; background: #ffb020; cursor: pointer; border: 1px solid #000;
  }
  .sel {
    background: #0c0e0f; color: #dfe5e3; border: 1px solid #000;
    padding: 4px 7px; font-family: inherit; font-size: 13px; min-width: 120px;
  }

  /* Loading screen */
  #loadscr {
    position: fixed; inset: 0; z-index: 20; background: #000;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; font-family: inherit;
  }
  #loadscr.on { display: flex; }
  #loadscr .lt { font-size: 26px; font-weight: 700; margin-bottom: 16px; text-shadow: 2px 2px 0 #000; }
  #loadbar { width: 440px; max-width: 80vw; height: 12px; background: #1b1f22; border: 1px solid #000; overflow: hidden; }
  #loadfill { height: 100%; width: 0%; background: linear-gradient(90deg, #ffb020, #ff7a00); transition: width 0.15s; }
  #loadstat { margin-top: 9px; font-size: 12px; color: #8a9498; }

  /* ===== HL2 HUD ===== */
  .hl2-hud { position: absolute; inset: 0; pointer-events: none; z-index: 10; font-family: "Trebuchet MS","Lucida Grande",Verdana,sans-serif; }
  .hl2-hud * { -webkit-font-smoothing: antialiased; }

  /* Crosshair — thin white lines + center dot, no background */
  .hl2-cross { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 24px; height: 24px; opacity: 0.9; }
  .hl2-cross .bar { position: absolute; background: #fff; box-shadow: 0 0 2px rgba(0,0,0,1), 0 0 1px rgba(0,0,0,1); }
  .hl2-cross .bar.v { left: 50%; width: 2px; height: 6px; transform: translateX(-50%); }
  .hl2-cross .bar.h { top: 50%; height: 2px; width: 6px; transform: translateY(-50%); }
  .hl2-cross .dot { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 2px; height: 2px; background: #fff; border-radius: 50%; box-shadow: 0 0 2px rgba(0,0,0,1); }

  /* Grab indicator */
  .hl2-grab { position: absolute; top: 55%; left: 50%; transform: translateX(-50%); font-size: 10px; color: rgba(200,160,255,0.9); font-family: monospace; text-shadow: 0 0 4px rgba(0,0,0,1); display: none; letter-spacing: 1px; }
  .hl2-grab.on { display: block; }

  /* Health — bottom left, large orange number with HEV cross icon, NO box */
  .hl2-health { position: absolute; bottom: 12px; left: 18px; display: flex; align-items: center; gap: 6px; }
  .hl2-health .icon { width: 22px; height: 22px; display: grid; place-items: center; }
  .hl2-health .icon svg { width: 18px; height: 18px; filter: drop-shadow(0 0 2px rgba(0,0,0,1)); }
  .hl2-health .val { font-size: 38px; font-weight: 700; color: rgb(255,160,0); line-height: 1; text-shadow: 0 0 6px rgba(0,0,0,0.95), 0 0 3px rgba(0,0,0,1); }

  /* Armor — right of health, smaller, with shield icon */
  .hl2-armor { position: absolute; bottom: 14px; left: 92px; display: flex; align-items: center; gap: 5px; }
  .hl2-armor .icon { width: 18px; height: 18px; display: grid; place-items: center; }
  .hl2-armor .icon svg { width: 15px; height: 15px; filter: drop-shadow(0 0 2px rgba(0,0,0,1)); }
  .hl2-armor .val { font-size: 26px; font-weight: 700; color: rgb(255,160,0); line-height: 1; text-shadow: 0 0 6px rgba(0,0,0,0.95), 0 0 3px rgba(0,0,0,1); }

  .hl2-aux { position: absolute; bottom: 60px; left: 20px; width: 90px; height: 4px; background: rgba(0,0,0,0.6); border: 1px solid rgba(0,0,0,0.8); opacity: 0; transition: opacity 0.3s; }
  .hl2-aux.on { opacity: 1; }
  .hl2-aux .fill { height: 100%; width: 100%; background: rgb(255,160,0); box-shadow: 0 0 3px rgba(255,160,0,0.6); transition: width 0.1s; }

  .bsp-texlog { position: absolute; top: 12px; right: 12px; z-index: 12; background: rgba(8,12,16,0.92); border: 1px solid rgba(255,100,100,0.3); border-radius: 4px; max-width: 340px; max-height: 60vh; overflow-y: auto; font-family: monospace; font-size: 11px; box-shadow: 0 4px 20px rgba(0,0,0,0.6); }
  .bsp-texlog-header { padding: 6px 10px; background: rgba(255,80,80,0.12); color: #ff6464; font-weight: 700; border-bottom: 1px solid rgba(255,100,100,0.2); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; }
  .bsp-texlog-header span:last-child { cursor: pointer; font-size: 15px; line-height: 1; }
  .bsp-texlog-header span:last-child:hover { color: #fff; }
  .bsp-texlog-item { padding: 4px 10px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.04); }
  .bsp-texlog-item .name { color: #ff6464; word-break: break-all; flex: 1; }
  .bsp-texlog-item .copy { background: rgba(255,160,0,0.15); border: 1px solid rgba(255,160,0,0.35); color: rgb(255,160,0); padding: 2px 8px; border-radius: 2px; cursor: pointer; font-size: 10px; white-space: nowrap; margin-left: 8px; font-family: monospace; }
  .bsp-texlog-item .copy:hover { background: rgba(255,160,0,0.35); }
  .bsp-texlog-item .copy.copied { background: rgba(100,255,100,0.2); border-color: rgba(100,255,100,0.4); color: #6ada6a; }

  /* Ammo — bottom right, large clip + smaller reserve, NO box */
  .hl2-ammo { position: absolute; bottom: 12px; right: 20px; text-align: right; }
  .hl2-ammo .clip { font-size: 38px; font-weight: 700; color: rgb(255,160,0); line-height: 1; text-shadow: 0 0 6px rgba(0,0,0,0.95), 0 0 3px rgba(0,0,0,1); }
  .hl2-ammo .reserve { font-size: 18px; font-weight: 700; color: rgb(255,160,0); line-height: 1; text-shadow: 0 0 5px rgba(0,0,0,0.95), 0 0 3px rgba(0,0,0,1); margin-top: 1px; }
  .hl2-ammo.noammo .clip { font-size: 20px; }

  /* Weapon name flash on switch — appears center-bottom briefly, fades out */
  .hl2-wepname { position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%); font-size: 16px; font-weight: 700; color: rgb(255,160,0); text-shadow: 0 0 6px rgba(0,0,0,0.95), 0 0 3px rgba(0,0,0,1); opacity: 0; transition: opacity 0.3s; letter-spacing: 1px; }
  .hl2-wepname.show { opacity: 1; transition: opacity 0.1s; }

  .hl2-noclip { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); font-size: 14px; font-weight: 700; color: rgb(255,100,100); text-shadow: 0 0 6px rgba(0,0,0,0.95); opacity: 0; letter-spacing: 2px; font-family: "Trebuchet MS",sans-serif; }
  .hl2-noclip.show { opacity: 1; }

  .hl2-speedo { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 2px; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
  .hl2-speedo.show { opacity: 1; }
  .hl2-speedo .val { font-size: 22px; font-weight: 700; color: rgb(255,235,180); line-height: 1; text-shadow: 0 0 6px rgba(0,0,0,0.95), 0 0 3px rgba(0,0,0,1); font-family: "Trebuchet MS",sans-serif; }
  .hl2-speedo .unit { font-size: 10px; font-weight: 700; color: rgba(255,235,180,0.7); letter-spacing: 1px; text-shadow: 0 0 4px rgba(0,0,0,0.95); }

  /* Weapon selection bar — top center */
  .hl2-wbar { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; gap: 3px; pointer-events: auto; }
  .wbar-slot { display: flex; align-items: center; gap: 6px; padding: 5px 10px; background: rgba(8,12,16,0.7); border: 1px solid rgba(255,255,255,0.08); border-radius: 3px; cursor: pointer; transition: all 0.1s; }
  .wbar-slot:hover { background: rgba(255,160,0,0.12); border-color: rgba(255,160,0,0.3); }
  .wbar-slot.active { background: rgba(255,160,0,0.18); border-color: rgba(255,160,0,0.6); }
  .wbar-num { font-size: 16px; font-weight: 700; color: rgb(255,160,0); text-shadow: 0 0 4px rgba(0,0,0,0.9); min-width: 14px; text-align: center; }
  .wbar-info { display: flex; flex-direction: column; gap: 1px; }
  .wbar-wep { font-size: 10px; color: #6f7a7d; font-family: "Trebuchet MS",sans-serif; white-space: nowrap; transition: color 0.1s; }
  .wbar-wep.cur { color: #fff; font-weight: 700; }
  .wbar-wep.pending { color: rgb(255,235,100); font-weight: 700; text-shadow: 0 0 6px rgba(255,235,100,0.5); }
  .wbar-slot.active.has-pending { border-color: rgba(255,235,100,0.6); background: rgba(255,235,100,0.12); }
  .wbar-outline { position: absolute; top: 50%; right: 4px; transform: translateY(-50%); height: 50px; width: auto; image-rendering: pixelated; filter: drop-shadow(0 0 3px rgba(255,136,0,0.6)); animation: wbar-fade-in 0.2s ease-out, wbar-fade-out 0.7s ease-in 2.3s forwards; pointer-events: none; }
  .wbar-slot { position: relative; }
  @keyframes wbar-fade-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes wbar-fade-out { from { opacity: 1; } to { opacity: 0; } }

  #dmgFlash { position: absolute; inset: 0; z-index: 11; pointer-events: none; background: radial-gradient(ellipse at center, transparent 30%, rgba(180,0,0,0.7) 100%); opacity: 0; transition: opacity 0.15s; }

  /* ===== Developer Console ===== */
  .dev-console {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 720px; max-width: 95vw; height: 480px; max-height: 85vh; z-index: 200;
    background: rgba(12,15,20,0.97); border: 1px solid rgba(255,160,0,0.4);
    border-radius: 6px; font-family: "Consolas","Courier New",monospace; font-size: 13px;
    color: #d0d0d0; display: none; flex-direction: column; overflow: hidden;
    box-shadow: 0 12px 48px rgba(0,0,0,0.8);
  }
  .dev-console.open { display: flex; }
  .dev-console .dc-titlebar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 12px; background: rgba(255,160,0,0.1);
    border-bottom: 1px solid rgba(255,160,0,0.25); cursor: move; user-select: none;
    font-weight: 700; color: rgb(255,160,0);
  }
  .dev-console .dc-close { cursor: pointer; font-size: 16px; line-height: 1; padding: 0 4px; }
  .dev-console .dc-close:hover { color: #ff6464; }
  .dev-console .dc-output {
    flex: 1; overflow-y: auto; padding: 8px 12px;
    line-height: 1.5; white-space: pre-wrap; word-break: break-word;
  }
  .dev-console .dc-output .ln-cmd { color: rgb(255,200,80); }
  .dev-console .dc-output .ln-err { color: rgb(255,100,100); }
  .dev-console .dc-output .ln-ok { color: rgb(130,230,130); }
  .dev-console .dc-output .ln-sys { color: rgb(150,150,200); }
  .dev-console .dc-output .ln-lua { color: rgb(100,220,255); }
  .dev-console .dc-input-row {
    display: flex; border-top: 1px solid rgba(255,160,0,0.2); padding: 4px 8px;
    background: rgba(8,10,14,0.95);
  }
  .dev-console .dc-suggest {
    display: none; flex-direction: column; border-top: 1px solid rgba(255,160,0,0.15);
    background: rgba(6,8,12,0.98); max-height: 120px; overflow-y: auto;
  }
  .dev-console .dc-suggest.show { display: flex; }
  .dev-console .dc-suggest-item {
    padding: 3px 10px; color: #8a9498; font-size: 12px; cursor: pointer; white-space: pre;
    border-bottom: 1px solid rgba(255,255,255,0.03);
  }
  .dev-console .dc-suggest-item:hover, .dev-console .dc-suggest-item.sel {
    background: rgba(255,160,0,0.12); color: rgb(255,160,0);

  /* ===== Lua vgui elements ===== */

<script type="text/x-server-plugin">
const TOPIC_CHAT = "chat"; // global lobby chat (not room-specific)
const TYPE_HELLO = 0, TYPE_TRANSFORM = 1, TYPE_CHAT = 2, TYPE_PROPSPAWN = 3,
      TYPE_PROPREMOVE = 4, TYPE_GRAB = 5, TYPE_RELEASE = 6, TYPE_LEAVE = 7,
      TYPE_PING = 8, TYPE_NAME = 9,
      TYPE_ROOMJOIN = 10, TYPE_ROOMLEAVE = 11, TYPE_ROOMLIST = 12, TYPE_ROOMCREATE = 13,
      TYPE_JOIN = 14, TYPE_DAMAGE = 15, TYPE_KILL = 16,
      TYPE_PROPTRANSFORM = 17, TYPE_PROPDRAG = 18, TYPE_PROPIMPULSE = 19,
      TYPE_NPCSPAWN = 20, TYPE_NPCTRANSFORM = 21, TYPE_NPCKILL = 22,
      TYPE_SOUND = 23, TYPE_WEAPON = 24,
      TYPE_OWNER_AUTH = 25, TYPE_OWNER_STATUS = 26, TYPE_OWNER_KICK = 27, TYPE_KICKED = 28;
const ROOM_OFFSET = 100000; // fixed offset in state for room JSON

function readPlayerNames(s) {
  if (s.byteLength < 3 || s[0] !== 1) return {};
  const count = s[1] << 8 | s[2];
  const names = {};
  let off = 3;
  for (let i = 0; i < count; i++) {
    if (off + 5 > s.byteLength) break;
    const pid = s[off] << 24 | s[off+1] << 16 | s[off+2] << 8 | s[off+3];
    off += 4;
    const nlen = s[off]; off += 1;
    if (off + nlen + 3 > s.byteLength) break;
    let name = "";
    for (let j = 0; j < nlen; j++) name += String.fromCharCode(s[off + j]);
    off += nlen;
    names[pid] = { name, color: [s[off], s[off+1], s[off+2]] };
    off += 3;
  }
  return names;
}
function writePlayerNames(s, names) {
  const pids = Object.keys(names).map(Number);
  let needed = 3;
  for (const pid of pids) needed += 5 + names[pid].name.length + 3;
  const buf = new Uint8Array(Math.max(needed, 3));
  buf[0] = 1;
  buf[1] = (pids.length >> 8) & 0xff;
  buf[2] = pids.length & 0xff;
  let off = 3;
  for (const pid of pids) {
    buf[off] = (pid >> 24) & 0xff; buf[off+1] = (pid >> 16) & 0xff;
    buf[off+2] = (pid >> 8) & 0xff; buf[off+3] = pid & 0xff;
    off += 4;
    buf[off] = names[pid].name.length; off += 1;
    for (let j = 0; j < names[pid].name.length; j++) buf[off + j] = names[pid].name.charCodeAt(j);
    off += names[pid].name.length;
    buf[off] = names[pid].color[0]; buf[off+1] = names[pid].color[1]; buf[off+2] = names[pid].color[2];
    off += 3;
  }
  s.set(buf.subarray(0, off));
}

function readRooms(s) {
  let off = ROOM_OFFSET;
  if (off + 4 > s.byteLength) return {};
  const roomLen = s[off] << 24 | s[off+1] << 16 | s[off+2] << 8 | s[off+3];
  off += 4;
  if (roomLen === 0 || roomLen > 100000 || off + roomLen > s.byteLength) return {};
  let jsonStr = "";
  for (let i = 0; i < roomLen; i++) jsonStr += String.fromCharCode(s[off + i]);
  try { return JSON.parse(jsonStr); } catch(e) { return {}; }
}
function writeRooms(s, rooms) {
  let off = ROOM_OFFSET;
  const jsonStr = JSON.stringify(rooms);
  const len = jsonStr.length;
  if (off + 4 + len > s.byteLength) return;
  s[off] = (len >> 24) & 0xff; s[off+1] = (len >> 16) & 0xff;
  s[off+2] = (len >> 8) & 0xff; s[off+3] = len & 0xff;
  off += 4;
  for (let i = 0; i < len; i++) s[off + i] = jsonStr.charCodeAt(i);
}

function roomTopic(roomId) { return "r:" + roomId; }

function countRoomSubscribers(roomId) {
  return pubsub.numSubscribers(roomTopic(roomId));
}

function getRoomList() {
  const rooms = readRooms(state);
  const list = [];
  for (const [id, room] of Object.entries(rooms)) {
    const subs = countRoomSubscribers(id);
    if (subs === 0 && (Date.now() - room.created > 600000)) {
      delete rooms[id];
      continue;
    }
    list.push({
      id, name: room.name, map: room.map, maxPlayers: room.maxPlayers,
      players: subs, hostPid: room.hostPid, created: room.created
    });
  }
  writeRooms(state, rooms);
  return list;
}

const OWNER_HASH = "3c5b6cad8e07b30194946c21009978f0f8bab475cee0e388db27b4bbea90c310";
const ownerConnIds = new Set();
const ownerAuthAttempts = new Map();

function sha256Hex(str) {
  function rr(v, n) { return (v >>> n) | (v << (32 - n)); }
  const K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const bytes = [];
  for (let i = 0; i < str.length; i++) { const c = str.charCodeAt(i); if (c < 0x80) bytes.push(c); else if (c < 0x800) { bytes.push(0xc0|(c>>6),0x80|(c&0x3f)); } else { bytes.push(0xe0|(c>>12),0x80|((c>>6)&0x3f),0x80|(c&0x3f)); } }
  const l = bytes.length; bytes.push(0x80);
  while (bytes.length % 64 !== 56) bytes.push(0);
  const bl = l * 8; bytes.push(0, 0, 0, 0);
  for (let i = 3; i >= 0; i--) bytes.push((bl >>> (i * 8)) & 0xff);
  let H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  for (let off = 0; off < bytes.length; off += 64) {
    const W = new Array(64);
    for (let i = 0; i < 16; i++) W[i] = ((bytes[off+i*4]<<24)|(bytes[off+i*4+1]<<16)|(bytes[off+i*4+2]<<8)|bytes[off+i*4+3])>>>0;
    for (let i = 16; i < 64; i++) { const s0=rr(W[i-15],7)^rr(W[i-15],18)^(W[i-15]>>>3); const s1=rr(W[i-2],17)^rr(W[i-2],19)^(W[i-2]>>>10); W[i]=(W[i-16]+s0+W[i-7]+s1)>>>0; }
    let a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for (let i = 0; i < 64; i++) { const S1=rr(e,6)^rr(e,11)^rr(e,25); const ch=(e&f)^(~e&g); const t1=(h+S1+ch+K[i]+W[i])>>>0; const S0=rr(a,2)^rr(a,13)^rr(a,22); const mj=(a&b)^(a&c)^(b&c); const t2=(S0+mj)>>>0; h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0; }
    H[0]=(H[0]+a)>>>0;H[1]=(H[1]+b)>>>0;H[2]=(H[2]+c)>>>0;H[3]=(H[3]+d)>>>0;H[4]=(H[4]+e)>>>0;H[5]=(H[5]+f)>>>0;H[6]=(H[6]+g)>>>0;H[7]=(H[7]+h)>>>0;
  }
  let hex=""; for (let i=0;i<8;i++){hex+=(H[i]>>>24&0xff).toString(16).padStart(2,"0");hex+=(H[i]>>>16&0xff).toString(16).padStart(2,"0");hex+=(H[i]>>>8&0xff).toString(16).padStart(2,"0");hex+=(H[i]&0xff).toString(16).padStart(2,"0");} return hex;
}
function isOwner(conn) { return ownerConnIds.has(conn.id); }
function allowOwnerAttempt(conn) {
  const now = Date.now();
  let a = ownerAuthAttempts.get(conn.id);
  if (!a || now - a.first > 60000) { a = { count: 0, first: now }; ownerAuthAttempts.set(conn.id, a); }
  a.count++;
  return a.count <= 5;
}

const connData = new Map();

function getUD(conn) {
  return connData.get(conn.id);
}

self.onopen = ({ conn }) => {
  conn.subscribe(TOPIC_CHAT);
  let pid = 0;
  const idStr = conn.id || "";
  for (let i = 0; i < idStr.length; i++) {
    pid = ((pid * 31) + idStr.charCodeAt(i)) | 0;
  }
  pid = pid >>> 0;
  connData.set(conn.id, { pid, name: null, color: null, lastMsg: 0, msgCount: 0, roomId: null, isOwner: false });
  const names = readPlayerNames(state);
  const count = Object.keys(names).length;
  conn.send(JSON.stringify({ t: TYPE_HELLO, pid: pid, count: count, players: names }));
};

self.onmessage = ({ conn, data }) => {
  const ud = getUD(conn);
  if (!ud) return;

  if (data instanceof ArrayBuffer) {
    if (ud.roomId) pubsub.publish(roomTopic(ud.roomId), data);
    return;
  }

  let msg;
  try { msg = JSON.parse(data); } catch(e) { return; }
  if (!msg || typeof msg.t !== "number") return;

  switch (msg.t) {
    case TYPE_NAME: {
      let name = String(msg.name || "").substring(0, 16).trim();
      if (!name) name = "Player" + (ud.pid % 1000);
      const color = msg.color || [200 + (ud.pid*37)%55, 200 + (ud.pid*53)%55, 200 + (ud.pid*71)%55];
      ud.name = name;
      ud.color = color;
      if (msg.modelId) ud.modelId = msg.modelId;
      if (msg.weaponId) ud.weaponId = msg.weaponId;
      const names = readPlayerNames(state);
      names[ud.pid] = { name, color };
      writePlayerNames(state, names);
      const nameMsg = JSON.stringify({ t: TYPE_NAME, pid: ud.pid, name, color, modelId: ud.modelId, weaponId: ud.weaponId });
      pubsub.publish(TOPIC_CHAT, nameMsg);
      if (ud.roomId) pubsub.publish(roomTopic(ud.roomId), nameMsg);
      break;
    }
    case TYPE_CHAT: {
      const now = Date.now();
      if (now - ud.lastMsg > 10000) { ud.lastMsg = now; ud.msgCount = 0; }
      ud.msgCount++;
      if (ud.msgCount > 5) return;
      let text = String(msg.text || "").substring(0, 200);
      if (!text.trim()) return;
      const topic = ud.roomId ? roomTopic(ud.roomId) : TOPIC_CHAT;
      pubsub.publish(topic, JSON.stringify({ t: TYPE_CHAT, pid: ud.pid, text, time: now }));
      break;
    }
    case TYPE_ROOMCREATE: {
      const roomId = "room-" + ud.pid + "-" + (Date.now() % 100000);
      const roomName = String(msg.name || "New Server").substring(0, 32);
      const map = String(msg.map || "pm_baseplate").substring(0, 64);
      const maxPlayers = Math.min(128, Math.max(1, parseInt(msg.maxPlayers) || 8));
      const rooms = readRooms(state);
      rooms[roomId] = { name: roomName, map, maxPlayers, hostPid: ud.pid, created: Date.now() };
      writeRooms(state, rooms);
      if (ud.roomId) { conn.unsubscribe(roomTopic(ud.roomId)); }
      ud.roomId = roomId;
      conn.subscribe(roomTopic(roomId));
      conn.send(JSON.stringify({ t: TYPE_ROOMJOIN, roomId, room: rooms[roomId], players: {} }));
      break;
    }
    case TYPE_ROOMLIST: {
      const list = getRoomList();
      conn.send(JSON.stringify({ t: TYPE_ROOMLIST, rooms: list }));
      break;
    }
    case TYPE_ROOMJOIN: {
      const roomId = String(msg.roomId || "");
      const rooms = readRooms(state);
      if (!rooms[roomId]) { conn.send(JSON.stringify({ t: TYPE_ROOMJOIN, error: "Room not found" })); return; }
      const subs = countRoomSubscribers(roomId);
      if (subs >= rooms[roomId].maxPlayers) { conn.send(JSON.stringify({ t: TYPE_ROOMJOIN, error: "Room full" })); return; }
      if (ud.roomId) { conn.unsubscribe(roomTopic(ud.roomId)); }
      ud.roomId = roomId;
      conn.subscribe(roomTopic(roomId));
      const joinName = ud.name || ("Player" + (ud.pid % 1000));
      const joinColor = ud.color || [200, 200, 200];
      pubsub.publish(roomTopic(roomId), JSON.stringify({ t: TYPE_NAME, pid: ud.pid, name: joinName, color: joinColor, modelId: ud.modelId, weaponId: ud.weaponId }));
      pubsub.publish(roomTopic(roomId), JSON.stringify({ t: TYPE_JOIN, pid: ud.pid, name: joinName }));
      conn.send(JSON.stringify({ t: TYPE_ROOMJOIN, roomId, room: rooms[roomId] }));
      break;
    }
    case TYPE_ROOMLEAVE: {
      if (ud.roomId) {
        conn.unsubscribe(roomTopic(ud.roomId));
        pubsub.publish(roomTopic(ud.roomId), JSON.stringify({ t: TYPE_LEAVE, pid: ud.pid }));
        ud.roomId = null;
      }
      break;
    }
    case TYPE_PROPSPAWN:
    case TYPE_PROPREMOVE:
    case TYPE_GRAB:
    case TYPE_RELEASE:
    case TYPE_PROPTRANSFORM:
    case TYPE_PROPDRAG:
    case TYPE_PROPIMPULSE:
    case TYPE_NPCSPAWN:
    case TYPE_NPCTRANSFORM:
    case TYPE_NPCKILL:
    case TYPE_DAMAGE:
    case TYPE_KILL:
    case TYPE_SOUND:
    case TYPE_WEAPON: {
      msg.pid = ud.pid;
      if (ud.roomId) pubsub.publish(roomTopic(ud.roomId), JSON.stringify(msg));
      break;
    }
    case TYPE_PING:
      conn.send(JSON.stringify({ t: TYPE_PING, time: Date.now() }));
      break;
    case TYPE_OWNER_AUTH: {
      if (!allowOwnerAttempt(conn)) { conn.send(JSON.stringify({ t: TYPE_OWNER_STATUS, ok: false, error: "Too many attempts" })); return; }
      const pw = String(msg.password || "");
      if (pw && sha256Hex(pw) === OWNER_HASH) {
        ownerConnIds.add(conn.id);
        if (ud) ud.isOwner = true;
        conn.send(JSON.stringify({ t: TYPE_OWNER_STATUS, ok: true }));
        if (ud && ud.roomId) pubsub.publish(roomTopic(ud.roomId), JSON.stringify({ t: TYPE_OWNER_STATUS, pid: ud.pid, ok: true }));
        if (ud) pubsub.publish(TOPIC_CHAT, JSON.stringify({ t: TYPE_OWNER_STATUS, pid: ud.pid, ok: true }));
      } else {
        conn.send(JSON.stringify({ t: TYPE_OWNER_STATUS, ok: false, error: "Wrong password" }));
      }
      break;
    }
    case TYPE_OWNER_KICK: {
      if (!isOwner(conn)) { conn.send(JSON.stringify({ t: TYPE_OWNER_STATUS, ok: false, error: "Not authorized" })); return; }
      const targetPid = parseInt(msg.targetPid);
      const reason = String(msg.reason || "Kicked by game owner").substring(0, 100);
      for (const [cid, d] of connData) {
        if (d.pid === targetPid) {
          if (d.roomId) pubsub.publish(roomTopic(d.roomId), JSON.stringify({ t: TYPE_KICKED, pid: targetPid, reason }));
          pubsub.publish(TOPIC_CHAT, JSON.stringify({ t: TYPE_KICKED, pid: targetPid, reason }));
          break;
        }
      }
      break;
    }
  }
};

self.onclose = ({ conn }) => {
  const ud = getUD(conn);
  ownerConnIds.delete(conn.id);
  ownerAuthAttempts.delete(conn.id);
  if (!ud) return;
  connData.delete(conn.id);
  const names = readPlayerNames(state);
  if (names[ud.pid]) {
    delete names[ud.pid];
    writePlayerNames(state, names);
  }
  if (ud.roomId) {
    const leaveName = ud.name || ("Player" + (ud.pid % 1000));
    pubsub.publish(roomTopic(ud.roomId), JSON.stringify({ t: TYPE_LEAVE, pid: ud.pid, name: leaveName }));
    const rooms = readRooms(state);
    if (rooms[ud.roomId] && rooms[ud.roomId].hostPid === ud.pid) {
      delete rooms[ud.roomId];
      writeRooms(state, rooms);
    }
  }
  pubsub.publish(TOPIC_CHAT, JSON.stringify({ t: TYPE_LEAVE, pid: ud.pid }));
};
</script>

<script>
  const maps = [
    { name: "pm_baseplate",      game: "Sandbox",  category: "Sandbox", max: 128, desc: "Empty gray baseplate" },

  function closePanel() {
    document.getElementById("panelMount").innerHTML = "";
  }

  function panel(hdr, bodyHtml, ftrHtml) {

  function setupBspDrop() {
    const drop = document.getElementById("bspDrop");
    const input = document.getElementById("bspFileInput");
    const label = document.getElementById("bspDropLabel");
    if (!drop) return;
    drop.onclick = () => input.click();
    input.onchange = () => {
      if (input.files[0]) { customBspFile = input.files[0]; label.textContent = "📄 " + customBspFile.name; updateMapSel(); }
    };
    drop.ondragover = (e) => { e.preventDefault(); drop.style.borderColor = "#ffb020"; drop.style.background = "rgba(255,176,32,0.08)"; };
    drop.ondragleave = () => { drop.style.borderColor = "#4a5258"; drop.style.background = ""; };
    drop.ondrop = (e) => {
      e.preventDefault();
      drop.style.borderColor = "#4a5258"; drop.style.background = "";
      const f = e.dataTransfer.files[0];
      if (f && f.name.toLowerCase().endsWith(".bsp")) { customBspFile = f; label.textContent = "📄 " + f.name; updateMapSel(); }
      else { label.textContent = "⚠ Not a .bsp file"; label.style.color = "#ff6464"; }
    };
  }

  let customAddons = []; // {id, name, type, url, data, enabled}
  let viewmodelOverrideCache = {}; // {weaponId: viewmodelSpec} — preloaded from kv
  let customWeapons = [];
  let customProps = [];
  let customNPCs = [];
  let addonMapGeoms = {}; // {mapName: geometryDef} — data-driven map geometry from addons

  async function loadStoredAddons() {
    if (!window.root || !window.root.kv) return;
    try {
      viewmodelOverrideCache = {};
      const overrides = await window.root.kv.viewmodelOverrides.entries();
      for (const [wid, spec] of overrides) {
        viewmodelOverrideCache[wid] = spec;
      }
      const folder = window.root.kv.addons;
      const entries = await folder.entries();
      for (const [id, addon] of entries) {
        if (addon && addon.data) {
          customAddons.push(addon);
          if (addon.enabled !== false) injectAddon(addon.data);
        }
      }
    } catch(e) { console.warn("Failed to load stored addons:", e); }
  }

  function injectAddon(data) {
    if (!data) return;
    if (data.sounds) {
      for (const [name, def] of Object.entries(data.sounds)) {
        SOUND_DEFS[name] = def;
      }
    }
    if (data.weapons) {
      for (const w of data.weapons) {
        if (!WEAPONS.find(x => x.id === w.id)) {
          WEAPONS.push(w);
          customWeapons.push(w);
          if (!w.viewmodel && viewmodelOverrideCache[w.id]) {
            w.viewmodel = viewmodelOverrideCache[w.id];
          }
        }
      }
    }
    if (data.props) {
      let propTab = SPAWN_TABS.find(t => t.id === "prop");
      let customCat = propTab.subcats.find(s => s.name === "Custom");
      if (!customCat) {
        customCat = { name: "Custom", icon: "📦", items: [] };
        propTab.subcats.push(customCat);
      }
      for (const p of data.props) {
        if (!customCat.items.find(x => x.name === p.name)) {
          customCat.items.push(p);
          customProps.push(p);
        }
      }
    }
    if (data.npcs) {
      for (const n of data.npcs) {
        if (!NPC_TYPES.find(x => x.id === n.id)) {
          NPC_TYPES.push(n);
          customNPCs.push(n);
        }
      }
    }
    if (data.maps) {
      for (const m of data.maps) {
        if (!m.category) m.category = "Other";
        if (!maps.find(x => x.name === m.name)) {
          maps.push(m);
        }
        if (m.geometry) {
          addonMapGeoms[m.name] = m.geometry;
        }
      }
    }
    if (data.lua) {
      if (!luaLoaded) {
        initLuaEngine().then(() => {
          runLuaCode(data.lua);
          consoleLog("Addon Lua loaded: " + (data.name || "unknown"), "lua");
        });
      } else {
        runLuaCode(data.lua);
        consoleLog("Addon Lua loaded: " + (data.name || "unknown"), "lua");
      }
    }
  }

  function removeAddon(addonId) {
    const idx = customAddons.findIndex(a => a.id === addonId);
    if (idx < 0) return;
    const addon = customAddons[idx];
    const data = addon.data;
    if (data.sounds) {
      for (const name of Object.keys(data.sounds)) {
        delete SOUND_DEFS[name];
        delete soundCache[name];
      }
    }
    if (data.weapons) {
      for (const w of data.weapons) {
        const wi = WEAPONS.findIndex(x => x.id === w.id);
        if (wi >= 0) WEAPONS.splice(wi, 1);
        const cwi = customWeapons.findIndex(x => x.id === w.id);
        if (cwi >= 0) customWeapons.splice(cwi, 1);
        delete viewmodelOverrideCache[w.id];
        if (window.root && window.root.kv) {
          window.root.kv.viewmodelOverrides.delete(w.id).catch(() => {});
        }
      }
    }
    if (data.props) {
      let propTab = SPAWN_TABS.find(t => t.id === "prop");
      let customCat = propTab?.subcats.find(s => s.name === "Custom");
      if (customCat) {
        for (const p of data.props) {
          const pi = customCat.items.findIndex(x => x.name === p.name);
          if (pi >= 0) customCat.items.splice(pi, 1);
        }
        if (customCat.items.length === 0) {
          const cci = propTab.subcats.findIndex(s => s.name === "Custom");
          if (cci >= 0) propTab.subcats.splice(cci, 1);
        }
      }
    }
    if (data.npcs) {
      for (const n of data.npcs) {
        const ni = NPC_TYPES.findIndex(x => x.id === n.id);
        if (ni >= 0) NPC_TYPES.splice(ni, 1);
        const cni = customNPCs.findIndex(x => x.id === n.id);
        if (cni >= 0) customNPCs.splice(cni, 1);
      }
    }
    if (data.maps) {
      for (const m of data.maps) {
        const mi = maps.findIndex(x => x.name === m.name);
        if (mi >= 0 && maps[mi].custom) maps.splice(mi, 1);
        if (m.geometry) delete addonMapGeoms[m.name];
      }
    }
    customAddons.splice(idx, 1);
    if (window.root && window.root.kv) {
      window.root.kv.addons.delete(addonId).catch(()=>{});
    }
    renderAddonsPanel();
  }

  async function subscribeAddonUrl(url) {
    try {
      const resp = await fetch(url).then(r => r.json());
      if (!resp || !resp.name) { alert("Invalid addon manifest: missing name"); return; }
      const addonId = resp.id || resp.name.toLowerCase().replace(/[^a-z0-9]/g, "-").substring(0, 32);
      if (customAddons.find(a => a.id === addonId)) { alert("Addon already installed: " + resp.name); return; }
      const addon = { id: addonId, name: resp.name, type: resp.type || "mixed", url, data: resp, enabled: true };
      customAddons.push(addon);
      injectAddon(resp);
      if (window.root && window.root.kv) {
        await window.root.kv.addons.set(addonId, addon);
      }
      renderAddonsPanel();
    } catch(e) {
      alert("Failed to load addon: " + e.message);
    }
  }

  async function subscribeAddonJson(jsonText) {
    try {
      const data = JSON.parse(jsonText);
      if (!data.name) { alert("Invalid addon JSON: missing name"); return; }
      const addonId = data.id || data.name.toLowerCase().replace(/[^a-z0-9]/g, "-").substring(0, 32);
      if (customAddons.find(a => a.id === addonId)) { alert("Addon already installed: " + data.name); return; }
      const addon = { id: addonId, name: data.name, type: data.type || "mixed", data, enabled: true };
      customAddons.push(addon);
      injectAddon(data);
      if (window.root && window.root.kv) {
        await window.root.kv.addons.set(addonId, addon);
      }
      renderAddonsPanel();
    } catch(e) {
      alert("Failed to parse addon JSON: " + e.message);
    }
  }

  async function toggleAddon(addonId) {
    const addon = customAddons.find(a => a.id === addonId);
    if (!addon) return;
    addon.enabled = !addon.enabled;
    if (addon.enabled) {
      injectAddon(addon.data);
    } else {
      removeAddon(addonId);
      const reAdd = { id: addonId, name: addon.name, type: addon.type, data: addon.data, enabled: false };
      customAddons.push(reAdd);
      if (window.root && window.root.kv) {
        await window.root.kv.addons.set(addonId, reAdd);
      }
    }
    renderAddonsPanel();
  }

  function setupAddonDrop() {
    const drop = document.getElementById("addonDrop");
    const input = document.getElementById("addonFileInput");
    const label = document.getElementById("addonDropLabel");
    if (!drop) return;
    drop.onclick = () => input.click();
    input.onchange = () => {
      if (input.files[0]) {
        const reader = new FileReader();
        reader.onload = () => subscribeAddonJson(reader.result);
        reader.readAsText(input.files[0]);
      }
    };
    drop.ondragover = (e) => { e.preventDefault(); drop.style.borderColor = "#ffb020"; drop.style.background = "rgba(255,176,32,0.08)"; };
    drop.ondragleave = () => { drop.style.borderColor = "#4a5258"; drop.style.background = ""; };
    drop.ondrop = (e) => {
      e.preventDefault();
      drop.style.borderColor = "#4a5258"; drop.style.background = "";
      const f = e.dataTransfer.files[0];
      if (f && f.name.toLowerCase().endsWith(".json")) {
        const reader = new FileReader();
        reader.onload = () => subscribeAddonJson(reader.result);
        reader.readAsText(f);
      } else {
        label.textContent = "⚠ Not a .json file";
        label.style.color = "#ff6464";
      }
    };
  }

  async function initWorkshop() {
    if (workshopComments) return workshopComments;
    if (!window.root || !window.root.commentsPlugin) return null;
    const ctn = document.getElementById("workshopCommentsCtn");
    if (!ctn) return null;
    const result = window.root.commentsPlugin({
      channel: "pm-workshop",
      hideComments: true,
      hideSettingsButton: true,
      hideFullscreenButton: true,
      newestCommentsAtTop: true,
      onLoad: (comments) => {
        workshopAddons = parseWorkshopComments(comments);
        renderWorkshopContent();
      },
      onComment: (comment) => {
        const parsed = parseWorkshopComment(comment);
        if (parsed) {
          workshopAddons.unshift(parsed);
          renderWorkshopContent();
        }
      },
    });
    ctn.innerHTML = result;
    workshopComments = result;
    return workshopComments;
  }

  function parseWorkshopComment(comment) {
    try {
      const msg = comment.message?.trim?.() || comment.message || "";
      if (!msg.startsWith("{")) return null;
      const data = JSON.parse(msg);
      if (data.type !== "addon" || !data.url) return null;
      return {
        name: data.name || "Untitled",
        desc: data.desc || "",
        url: data.url,
        author: comment.user?.nickname || comment.user?.visualId || "anonymous",
        time: comment.time,
        byCurrentUser: comment.byCurrentUser,
      };
    } catch { return null; }
  }

  function parseWorkshopComments(comments) {
    const result = [];
    for (const c of comments) {
      const parsed = parseWorkshopComment(c);
      if (parsed) result.push(parsed);
    }
    return result;
  }

  async function publishToAddonWorkshop(addonId) {
    const addon = customAddons.find(a => a.id === addonId);
    if (!addon) return;
    if (!window.root || !window.root.uploadPlugin) { alert("Upload plugin not available"); return; }
    const btn = document.getElementById(`pubBtn_${addonId}`);
    if (btn) { btn.textContent = "Uploading..."; btn.disabled = true; }
    try {
      const json = JSON.stringify(addon.data);
      const result = await window.root.uploadPlugin(json);
      if (result.error) { alert("Upload failed: " + result.error); if (btn) { btn.textContent = "🌐 Publish"; btn.disabled = false; } return; }
      if (!workshopComments) {
        let ctn = document.getElementById("workshopCommentsCtn");
        if (!ctn) {
          ctn = document.createElement("div");
          ctn.id = "workshopCommentsCtn";
          ctn.style.cssText = "position:fixed;left:0;bottom:0;width:300px;height:60px;opacity:0.01;pointer-events:none;z-index:0;";
          document.body.appendChild(ctn);
        }
        await initWorkshop();
      }
      if (!workshopComments) { alert("Comments plugin not available"); return; }
      const types = [];
      if (addon.data.weapons) types.push("Weapons");
      if (addon.data.props) types.push("Props");
      if (addon.data.npcs) types.push("NPCs");
      if (addon.data.maps) types.push("Maps");
      const submission = JSON.stringify({
        type: "addon",
        name: addon.data.name,
        desc: types.join(", ") || "Addon",
        url: result.url,
      });
      const inst = workshopComments;
      if (inst && inst.submit) {
        inst.submit(submission);
      }
      if (btn) { btn.textContent = "✅ Published!"; setTimeout(() => { btn.textContent = "🌐 Publish"; btn.disabled = false; }, 2000); }
    } catch(e) {
      alert("Publish failed: " + e.message);
      if (btn) { btn.textContent = "🌐 Publish"; btn.disabled = false; }
    }
  }

  async function installWorkshopAddon(url, btnId) {
    const btn = document.getElementById(btnId);
    if (btn) { btn.textContent = "Installing..."; btn.disabled = true; }
    try {
      const json = await fetch(url).then(r => r.text());
      await subscribeAddonJson(json);
      if (btn) { btn.textContent = "✅ Installed!"; setTimeout(() => { btn.textContent = "Subscribe"; btn.disabled = false; }, 2000); }
    } catch(e) {
      alert("Install failed: " + e.message);
      if (btn) { btn.textContent = "Subscribe"; btn.disabled = false; }
    }
  }

    const fill = document.getElementById("loadfill");

      "Initializing engine...","Precaching resources...","Loading map geometry...",
      "Spawning entities...","Mounting addons...","Sending client info...","Almost there...",
      "Connecting to server..."
    ];
    let p = 0, pi = 0;
    const iv = setInterval(async ()=>{
      p += 3 + Math.random()*7;
      if (p > 100) p = 100;
      fill.style.width = p + "%";
      if (Math.random() < 0.4 && pi < phases.length) stat.textContent = phases[pi++];
      if (p >= 100) {
        clearInterval(iv);
        stat.textContent = bspFile ? "Parsing BSP geometry..." : "Joined the game!";
        let bspData = null;
        if (bspFile) {
          try { bspData = await parseBSP(bspFile); }

          stat.textContent = "Joined the game!";
        }
        setTimeout(()=>{ ls.classList.remove("on"); launchGame(mapName, bspData); }, bspFile ? 400 : 900);

  function playImpactSound(pos, strength, material) {
    const ctx = getAudioCtx();
    if (!ctx) return;
    const now = ctx.currentTime;
    const vol = Math.min(0.5, strength * 0.04);
    if (vol < 0.02) return;
    const dist = game ? game.player.pos.distanceTo(pos) : 0;
    const atten = Math.max(0.1, 1 - dist / 40);
    const finalVol = vol * atten;
    if (finalVol < 0.01) return;

    const bufLen = Math.floor(ctx.sampleRate * 0.15);
    const buf = ctx.createBuffer(1, bufLen, ctx.sampleRate);
    const data = buf.getChannelData(0);
    const mat = material || "wood";
    let filterFreq, filterQ, decay;
    if (mat === "glass") { filterFreq = 4500; filterQ = 6; decay = 0.12; }
    else if (mat === "metal") { filterFreq = 3500; filterQ = 12; decay = 0.25; }
    else if (mat === "concrete") { filterFreq = 800; filterQ = 1; decay = 0.08; }
    else { filterFreq = 500; filterQ = 1.5; decay = 0.1; } // wood
    for (let i = 0; i < bufLen; i++) {
      const env = Math.exp(-i / (ctx.sampleRate * decay));
      data[i] = (Math.random() * 2 - 1) * env;
    }
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const filt = ctx.createBiquadFilter();
    filt.type = "bandpass";
    filt.frequency.value = filterFreq;
    filt.Q.value = filterQ;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(finalVol, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + decay * 2);
    src.connect(filt); filt.connect(gain); gain.connect(masterGain || ctx.destination);
    src.start(now); src.stop(now + decay * 2);
    if (mat === "glass") {
      for (const f of [3200, 5100, 7300]) {
        const osc = ctx.createOscillator();
        osc.type = "sine"; osc.frequency.value = f * (0.95 + Math.random() * 0.1);
        const og = ctx.createGain();
        og.gain.setValueAtTime(finalVol * 0.3, now);
        og.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
        osc.connect(og); og.connect(masterGain || ctx.destination);
        osc.start(now); osc.stop(now + 0.2);
      }
    } else if (mat === "metal") {
      const osc = ctx.createOscillator();
      osc.type = "triangle"; osc.frequency.value = 1200 + Math.random() * 400;
      const og = ctx.createGain();
      og.gain.setValueAtTime(finalVol * 0.2, now);
      og.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
      osc.connect(og); og.connect(masterGain || ctx.destination);
      osc.start(now); osc.stop(now + 0.3);
    }
  }

  function playBreakSound(pos, material) {
    const ctx = getAudioCtx();
    if (!ctx) return;
    const now = ctx.currentTime;
    const dist = game ? game.player.pos.distanceTo(pos) : 0;
    const atten = Math.max(0.1, 1 - dist / 40);
    const vol = 0.4 * atten;
    const mat = material || "wood";
    const bufLen = Math.floor(ctx.sampleRate * 0.5);
    const buf = ctx.createBuffer(1, bufLen, ctx.sampleRate);
    const data = buf.getChannelData(0);
    let filterFreq, decay;
    if (mat === "glass") { filterFreq = 6000; decay = 0.4; }
    else if (mat === "concrete") { filterFreq = 600; decay = 0.2; }
    else { filterFreq = 800; decay = 0.25; }
    for (let i = 0; i < bufLen; i++) {
      const env = Math.exp(-i / (ctx.sampleRate * decay));
      data[i] = (Math.random() * 2 - 1) * env;
    }
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const filt = ctx.createBiquadFilter();
    filt.type = mat === "glass" ? "highpass" : "lowpass";
    filt.frequency.value = filterFreq;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(vol, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + decay * 2);
    src.connect(filt); filt.connect(gain); gain.connect(masterGain || ctx.destination);
    src.start(now); src.stop(now + decay * 2);
    if (mat === "glass") {
      for (let k = 0; k < 8; k++) {
        const f = 2500 + Math.random() * 6000;
        const osc = ctx.createOscillator();
        osc.type = "sine"; osc.frequency.value = f;
        const og = ctx.createGain();
        const t0 = now + Math.random() * 0.15;
        og.gain.setValueAtTime(vol * 0.15, t0);
        og.gain.exponentialRampToValueAtTime(0.001, t0 + 0.15 + Math.random() * 0.2);
        osc.connect(og); og.connect(masterGain || ctx.destination);
        osc.start(t0); osc.stop(t0 + 0.4);
      }
    }
  }

  const soundCache = {};
  let audioCtx = null;
  let masterGain = null;
  let masterVolume = 1;

  function getAudioCtx() {
    if (!audioCtx) {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        masterGain = audioCtx.createGain();
        masterGain.gain.value = masterVolume;
        masterGain.connect(audioCtx.destination);
      }
      catch(e) { return null; }
    }
    if (audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }

  function setMasterVolume(v) {
    masterVolume = Math.max(0, Math.min(1, v));
    if (masterGain) masterGain.gain.value = masterVolume;
  }

  function playSound(name, opts) {
    const def = SOUND_DEFS[name];
    if (!def) return;
    if (typeof mpSendSound === "function" && !(opts && opts._remote)) mpSendSound(name, opts);
    const ctx = getAudioCtx();
    if (!ctx) return;
    if (!soundCache[name]) {
      soundCache[name] = fetch(def.url).then(r => r.arrayBuffer()).then(buf => ctx.decodeAudioData(buf)).catch(() => null);
    }
    soundCache[name].then(buffer => {
      if (!buffer || !audioCtx) return;
      const src = ctx.createBufferSource();
      src.buffer = buffer;
      const gain = ctx.createGain();
      const vol = (opts && opts.volume !== undefined) ? opts.volume : def.volume;
      gain.gain.value = vol;
      if (opts && opts.pitch) src.playbackRate.value = opts.pitch;
      src.connect(gain);
      gain.connect(masterGain || ctx.destination);
      src.start();
    });
  }

  function playFootstep(material) {
    const ctx = getAudioCtx();
    if (!ctx) return;
    const now = ctx.currentTime;
    const mat = material || "concrete";
    const vol = 0.22 + Math.random() * 0.06;
    const bufLen = Math.floor(ctx.sampleRate * 0.09);
    const buf = ctx.createBuffer(1, bufLen, ctx.sampleRate);
    const data = buf.getChannelData(0);
    const decay = 0.045;
    for (let i = 0; i < bufLen; i++) {
      const env = Math.exp(-i / (ctx.sampleRate * decay));
      data[i] = (Math.random() * 2 - 1) * env;
    }
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const filt = ctx.createBiquadFilter();
    filt.type = "lowpass";
    filt.frequency.value = mat === "metal" ? 1100 : (450 + Math.random() * 150);
    filt.Q.value = mat === "metal" ? 4 : 1.5;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(vol, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
    src.connect(filt); filt.connect(gain); gain.connect(masterGain || ctx.destination);
    src.start(now); src.stop(now + 0.2);
    const buf2Len = Math.floor(ctx.sampleRate * 0.045);
    const buf2 = ctx.createBuffer(1, buf2Len, ctx.sampleRate);
    const data2 = buf2.getChannelData(0);
    for (let i = 0; i < buf2Len; i++) {
      const env = Math.exp(-i / (ctx.sampleRate * 0.02));
      data2[i] = (Math.random() * 2 - 1) * env;
    }
    const src2 = ctx.createBufferSource();
    src2.buffer = buf2;
    const filt2 = ctx.createBiquadFilter();
    filt2.type = "bandpass";
    filt2.frequency.value = 1600 + Math.random() * 500;
    filt2.Q.value = 0.7;
    const gain2 = ctx.createGain();
    gain2.gain.setValueAtTime(vol * 0.6, now);
    gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
    src2.connect(filt2); filt2.connect(gain2); gain2.connect(masterGain || ctx.destination);
    src2.start(now); src2.stop(now + 0.08);
    if (mat === "metal") {
      const osc = ctx.createOscillator();
      osc.type = "triangle";
      osc.frequency.value = 800 + Math.random() * 200;
      const og = ctx.createGain();
      og.gain.setValueAtTime(vol * 0.15, now);
      og.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
      osc.connect(og); og.connect(masterGain || ctx.destination);
      osc.start(now); osc.stop(now + 0.2);
    }
  }

  function updateFootsteps(p, dt) {
    if (!p.onGround || p.noclip) { p.footstepTimer = 0; return; }
    const horizSpeed = Math.sqrt(p.vel.x * p.vel.x + p.vel.z * p.vel.z);
    if (horizSpeed < 0.8) { p.footstepTimer = 0; return; }
    let interval;
    if (p.crouching) interval = 0.60;
    else if (p.sprinting) interval = 0.30;
    else interval = 0.45;
    p.footstepTimer += dt;
    if (p.footstepTimer >= interval) {
      p.footstepTimer -= interval;
      playFootstep("concrete");
    }
  }

  let recoilOffset = 0, recoilRot = 0;
  let recoilPitch = 0, recoilYaw = 0, recoilVelPitch = 0, recoilVelYaw = 0;
  let weaponSwitchTime = 0;
  let muzzleFlashTime = 0;

  function buildCustomViewmodel(w) {
    if (!w) return null;
    const T = THREE;
    const g = new T.Group();
    const spec = w.viewmodel || {};
    const parts = [];

    const matBody = new T.MeshStandardMaterial({ color: spec.bodyColor || 0x2a2a2e, roughness: 0.4, metalness: 0.7 });
    const matAccent = new T.MeshStandardMaterial({ color: spec.accentColor || 0x4a4a52, roughness: 0.5, metalness: 0.6 });
    const matDark = new T.MeshStandardMaterial({ color: 0x141418, roughness: 0.7, metalness: 0.3 });
    const matGrip = new T.MeshStandardMaterial({ color: 0x1e1e22, roughness: 0.8, metalness: 0.1 });
    const matGlow = spec.glowColor != null
      ? new T.MeshStandardMaterial({ color: spec.glowColor, emissive: spec.glowColor, emissiveIntensity: 2.0, roughness: 0.2, metalness: 0.1 })
      : null;

    function addPart(geo, mat, pos, rot) {
      const m = new T.Mesh(geo, mat);
      if (pos) m.position.set(pos[0], pos[1], pos[2]);
      if (rot) m.rotation.set(rot[0], rot[1], rot[2]);
      g.add(m);
      return m;
    }

    if (spec.parts && Array.isArray(spec.parts)) {
      for (const p of spec.parts) {
        let geo;
        const s = p.size || [0.05, 0.05, 0.2];
        if (p.shape === "cylinder" || p.shape === "cyl") {
          geo = new T.CylinderGeometry(Math.max(0.001, s[0]), Math.max(0.001, s[0]), Math.max(0.001, s[1]), 12);
        } else if (p.shape === "sphere" || p.shape === "ball") {
          geo = new T.SphereGeometry(Math.max(0.001, s[0]), 12, 8);
        } else if (p.shape === "torus") {
          geo = new T.TorusGeometry(Math.max(0.001, s[0]), Math.max(0.001, s[1]||0.005), 8, 16);
        } else {
          geo = new T.BoxGeometry(Math.max(0.001, s[0]), Math.max(0.001, s[1]), Math.max(0.001, s[2]));
        }
        const mat = p.glow && matGlow ? matGlow : (p.material === "accent" ? matAccent : p.material === "dark" ? matDark : p.material === "grip" ? matGrip : matBody);
        const m = addPart(geo, mat, p.pos, p.rot);
        if (p.name) parts.push({ name: p.name, mesh: m });
      }
    } else {
      const wt = w.type;
      if (wt === "hitscan" || wt === "shotgun") {
        const bodyLen = wt === "shotgun" ? 0.35 : 0.28;
        const bodyW = wt === "shotgun" ? 0.06 : 0.045;
        addPart(new T.BoxGeometry(bodyW, bodyW * 0.7, bodyLen), matBody, [0, 0, -bodyLen/2 - 0.05]);
        addPart(new T.CylinderGeometry(bodyW*0.4, bodyW*0.4, bodyLen*0.8, 10), matDark, [0, bodyW*0.2, -bodyLen/2 - 0.05], [Math.PI/2, 0, 0]);
        const gripH = 0.1;
        addPart(new T.BoxGeometry(bodyW*0.8, gripH, bodyW*0.6), matGrip, [0, -gripH/2 - bodyW*0.3, 0.02], [0.3, 0, 0]);
        addPart(new T.BoxGeometry(bodyW*0.3, bodyW*0.3, bodyW*0.3), matDark, [0, -bodyW*0.2, 0.06]);
        addPart(new T.CylinderGeometry(bodyW*0.35, bodyW*0.45, 0.04, 10), matAccent, [0, 0, -bodyLen - 0.07], [Math.PI/2, 0, 0]);
        if (matGlow) {
          const glow = addPart(new T.SphereGeometry(0.008, 8, 6), matGlow, [0, 0.02, -bodyLen - 0.09]);
          parts.push({ name: "glow", mesh: glow });
        }
        if (wt === "shotgun") {
          addPart(new T.CylinderGeometry(0.02, 0.02, 0.15, 8), matDark, [0, bodyW*0.15, -bodyLen - 0.1], [Math.PI/2, 0, 0]);
          addPart(new T.BoxGeometry(bodyW*0.9, 0.06, 0.15), matGrip, [0, -0.02, -0.12]);
        }
      } else if (wt === "melee") {
        addPart(new T.BoxGeometry(0.025, 0.025, 0.4), matBody, [0, 0, -0.2]);
        addPart(new T.BoxGeometry(0.06, 0.025, 0.15), matAccent, [0, 0, -0.42]);
        addPart(new T.CylinderGeometry(0.015, 0.015, 0.12, 8), matGrip, [0, 0, 0.06], [Math.PI/2, 0, 0]);
      } else if (wt === "projectile" || wt === "thrown") {
        addPart(new T.CylinderGeometry(0.03, 0.04, 0.25, 12), matBody, [0, 0, -0.12], [Math.PI/2, 0, 0]);
        addPart(new T.CylinderGeometry(0.025, 0.035, 0.06, 10), matAccent, [0, 0, 0.02], [Math.PI/2, 0, 0]);
        addPart(new T.BoxGeometry(0.04, 0.08, 0.04), matGrip, [0, -0.05, 0.02], [0.3, 0, 0]);
        if (matGlow) {
          const glow = addPart(new T.SphereGeometry(0.01, 8, 6), matGlow, [0, 0, -0.26]);
          parts.push({ name: "glow", mesh: glow });
        }
      } else {
        addPart(new T.BoxGeometry(0.05, 0.05, 0.2), matBody, [0, 0, -0.1]);
        addPart(new T.BoxGeometry(0.04, 0.1, 0.04), matGrip, [0, -0.06, 0.02], [0.3, 0, 0]);
        if (matGlow) {
          const glow = addPart(new T.SphereGeometry(0.01, 8, 6), matGlow, [0, 0, -0.22]);
          parts.push({ name: "glow", mesh: glow });
        }
      }
    }

    g.position.set(spec.pos ? spec.pos[0] : 0.1, spec.pos ? spec.pos[1] : -0.12, spec.pos ? spec.pos[2] : -0.25);
    g.rotation.set(spec.rot ? spec.rot[0] : 0, spec.rot ? spec.rot[1] : -0.05, spec.rot ? spec.rot[2] : 0);
    g.userData.basePos = g.position.clone();
    g.userData.baseRot = g.rotation.clone();
    g.userData.parts = {};
    for (const p of parts) g.userData.parts[p.name] = p.mesh;
    g.userData.muzzle = new T.Vector3(0, 0, -0.3);
    viewScene.add(g);
    return g;
  }

  function buildViewScene() {
    const T = THREE;
    viewScene = new T.Scene();
    viewCamera = new T.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.01, 10);
    const key = new T.DirectionalLight(0xfff0e0, 1.8);
    key.position.set(0.5, 1, 1);
    viewScene.add(key);
    const fill = new T.DirectionalLight(0x88aaff, 0.6);
    fill.position.set(-1, 0.3, 0.5);
    viewScene.add(fill);
    const rim = new T.DirectionalLight(0xffaa66, 0.4);
    rim.position.set(0, 0.5, -1);
    viewScene.add(rim);
    viewScene.add(new T.AmbientLight(0x556677, 0.5));
    viewModels.physgun = buildGravityGun();
    viewModels.realphysgun = buildPhysgun();
    viewModels.crowbar = buildCrowbar();
    viewModels.pistol = buildPistol();
    viewModels["357"] = build357();
    viewModels.smg1 = buildSMG1();
    viewModels.ar2 = buildAR2();
    viewModels.shotgun = buildShotgun();
    viewModels.crossbow = buildCrossbow();
    viewModels.rpg = buildRPG();
    viewModels.grenade = buildGrenade();
    viewModels.toolgun = buildToolGun();
    for (const w of WEAPONS) {
      if (!viewModels[w.id] && !customViewmodels[w.id]) {
        const vm = buildCustomViewmodel(w);
        if (vm) viewModels[w.id] = vm;
      }
    }
    muzzleFlash = new T.Mesh(
      new T.SphereGeometry(0.08, 8, 6),
      new T.MeshBasicMaterial({ color: 0xffdd66, transparent: true, opacity: 0, blending: T.AdditiveBlending, depthWrite: false })
    );
    muzzleFlash.visible = false;
    viewScene.add(muzzleFlash);
    showViewModel(WEAPONS[currentWeapon].id);
  }

  function showViewModel(id) {
    for (const wid in viewModels) viewModels[wid].visible = false;
    for (const wid in customViewmodels) customViewmodels[wid].wrapper.visible = false;
    if (customViewmodels[id]) {
      customViewmodels[id].wrapper.visible = true;
    } else if (viewModels[id]) {
      viewModels[id].visible = true;
    }
    weaponSwitchTime = performance.now();
    outlineCache = {};
  }

  function metalMat(color, rough, metal) { return new THREE.MeshStandardMaterial({ color, roughness: rough||0.4, metalness: metal||0.7 }); }
  function plasticMat(color, rough) { return new THREE.MeshStandardMaterial({ color, roughness: rough||0.6, metalness: 0.1 }); }
  function darkMat() { return metalMat(0x1a1a1e, 0.5, 0.6); }

  function buildGravityGun(palette) {
    const pal = palette || {
      body: 0xd97a2e, bodyDark: 0xa85a1e, darkMetal: 0x2a2a2e, steel: 0x88888c,
      black: 0x141418, grip: 0x1e1e22, vent: 0x1a1a1e,
      coilColor: 0x66ddff, coilEmissive: 0x3399ff, glowColor: 0x66bbff,
      coilEmissiveIntensity: 1.5, glowEmissiveIntensity: 2.5,
    };
    const g = new THREE.Group();

    const copperMat = plasticMat(pal.body, 0.45);
    const darkCopperMat = plasticMat(pal.bodyDark, 0.5);
    const darkMetalMat = metalMat(pal.darkMetal, 0.35, 0.85);
    const steelMat = metalMat(pal.steel, 0.25, 0.9);
    const blackMat = plasticMat(pal.black, 0.7);
    const gripMat = plasticMat(pal.grip, 0.8);
    const coilMat = new THREE.MeshStandardMaterial({ color: pal.coilColor, emissive: pal.coilEmissive, emissiveIntensity: pal.coilEmissiveIntensity, roughness: 0.2, metalness: 0.3 });
    const glowMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: pal.glowColor, emissiveIntensity: pal.glowEmissiveIntensity, roughness: 0.1, metalness: 0 });
    const ventMat = metalMat(pal.vent, 0.6, 0.5);

    const backHousing = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.04, 0.1, 16), darkMetalMat);
    backHousing.rotation.x = Math.PI/2;
    backHousing.position.set(0, -0.01, 0.02);
    g.add(backHousing);
    const backCap = new THREE.Mesh(new THREE.CylinderGeometry(0.038, 0.035, 0.02, 16), blackMat);
    backCap.rotation.x = Math.PI/2;
    backCap.position.set(0, -0.01, 0.07);
    g.add(backCap);
    const backCoil = new THREE.Mesh(new THREE.TorusGeometry(0.04, 0.006, 8, 24), coilMat);
    backCoil.position.set(0, -0.01, 0.0);
    g.add(backCoil);

    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.055, 0.2, 16), copperMat);
    body.rotation.x = Math.PI/2;
    body.position.set(0, -0.01, -0.08);
    g.add(body);
    const bodyRib = new THREE.Mesh(new THREE.CylinderGeometry(0.056, 0.056, 0.02, 16), darkCopperMat);
    bodyRib.rotation.x = Math.PI/2;
    bodyRib.position.set(0, -0.01, -0.04);
    g.add(bodyRib);
    for (const side of [-1, 1]) {
      const panel = new THREE.Mesh(new THREE.BoxGeometry(0.008, 0.03, 0.1), darkCopperMat);
      panel.position.set(side * 0.05, -0.01, -0.08);
      g.add(panel);
    }

    for (let i = 0; i < 4; i++) {
      const vent = new THREE.Mesh(new THREE.BoxGeometry(0.015, 0.004, 0.008), ventMat);
      vent.position.set(0, 0.048, -0.02 - i * 0.015);
      g.add(vent);
    }

    const emitterHousing = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.045, 0.06, 16), darkMetalMat);
    emitterHousing.rotation.x = Math.PI/2;
    emitterHousing.position.set(0, -0.01, -0.21);
    g.add(emitterHousing);
    const emitterRing = new THREE.Mesh(new THREE.TorusGeometry(0.052, 0.008, 8, 20), blackMat);
    emitterRing.position.set(0, -0.01, -0.24);
    g.add(emitterRing);

    const coil = new THREE.Mesh(new THREE.TorusGeometry(0.035, 0.01, 12, 24), coilMat);
    coil.position.set(0, -0.01, -0.26);
    g.add(coil);
    const glowDisc = new THREE.Mesh(new THREE.CircleGeometry(0.03, 16),
      new THREE.MeshBasicMaterial({ color: 0x66bbff, transparent: true, opacity: 0.3, blending: THREE.AdditiveBlending, depthWrite: false }));
    glowDisc.position.set(0, -0.01, -0.265);
    g.add(glowDisc);

    const prongs = [];
    for (let i = 0; i < 3; i++) {
      const ang = (i / 3) * Math.PI * 2 + Math.PI / 6; // offset so one prong is on top
      const px = Math.cos(ang) * 0.05;
      const py = Math.sin(ang) * 0.05 + -0.01;
      const prongGroup = new THREE.Group();

      const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.01, 0.1, 8), steelMat);
      shaft.rotation.x = Math.PI/2;
      shaft.position.set(0, 0, -0.05);
      prongGroup.add(shaft);

      const tipSeg = new THREE.Mesh(new THREE.CylinderGeometry(0.005, 0.007, 0.04, 8), steelMat);
      tipSeg.position.set(0, 0.005, -0.11);
      tipSeg.rotation.x = Math.PI/2 - 0.5; // curve inward
      prongGroup.add(tipSeg);

      const tipCap = new THREE.Mesh(new THREE.SphereGeometry(0.006, 8, 6), darkMetalMat);
      tipCap.position.set(0, 0.012, -0.13);
      prongGroup.add(tipCap);

      const base = new THREE.Mesh(new THREE.BoxGeometry(0.014, 0.014, 0.02), darkMetalMat);
      base.position.set(0, 0, 0.01);
      prongGroup.add(base);

      prongGroup.position.set(px, py, -0.24);
      prongGroup.userData.baseAng = ang;
      prongGroup.userData.basePos = prongGroup.position.clone();
      g.add(prongGroup);
      prongs.push(prongGroup);
    }

    const handle = new THREE.Group();
    const handleMain = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.14, 0.045), gripMat);
    handleMain.position.set(0, -0.07, 0);
    handle.add(handleMain);
    for (let i = 0; i < 5; i++) {
      const ridge = new THREE.Mesh(new THREE.BoxGeometry(0.042, 0.003, 0.047), blackMat);
      ridge.position.set(0, -0.02 - i * 0.02, 0);
      handle.add(ridge);
    }
    const trigger = new THREE.Mesh(new THREE.BoxGeometry(0.008, 0.02, 0.012), darkMetalMat);
    trigger.position.set(0, -0.03, 0.02);
    handle.add(trigger);
    handle.position.set(0, -0.04, 0.0);
    handle.rotation.x = 0.35;
    g.add(handle);

    const guard = new THREE.Mesh(new THREE.TorusGeometry(0.025, 0.005, 6, 12, Math.PI), darkMetalMat);
    guard.position.set(0, -0.05, 0.01);
    guard.rotation.x = Math.PI;
    g.add(guard);

    const tip = new THREE.Mesh(new THREE.SphereGeometry(0.015, 12, 8), glowMat);
    tip.position.set(0, -0.01, -0.26);
    g.add(tip);

    for (const side of [-1, 1]) {
      const pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.006, 0.12, 8), steelMat);
      pipe.rotation.x = Math.PI/2;
      pipe.position.set(side * 0.048, -0.025, -0.08);
      g.add(pipe);
      for (const z of [-0.13, -0.03]) {
        const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.007, 0.007, 0.008, 8), darkMetalMat);
        cap.rotation.x = Math.PI/2;
        cap.position.set(side * 0.048, -0.025, z);
        g.add(cap);
      }
    }

    g.position.set(0.16, -0.14, -0.3);
    g.rotation.y = -0.08;
    g.rotation.x = 0.02;
    g.userData.basePos = g.position.clone();
    g.userData.baseRot = g.rotation.clone();
    g.userData.parts = { coil, tip, body, prongs, backCoil, glowDisc, emitterRing };
    viewScene.add(g);
    return g;
  }

  function buildPhysgun() {
    const pal = {
      body: 0x1a1a2e, bodyDark: 0x0d0d18, darkMetal: 0x222228, steel: 0x4a4a52,
      black: 0x0a0a0e, grip: 0x12121a, vent: 0x1a1a1e,
      coilColor: 0x66ffff, coilEmissive: 0x00ddff, glowColor: 0x66ffff,
      coilEmissiveIntensity: 2.5, glowEmissiveIntensity: 4.0,
    };
    return buildGravityGun(pal);
  }

  function buildToolGun() {
    const g = new THREE.Group();
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x2a2a2e, roughness: 0.6, metalness: 0.4 });
    const accentMat = new THREE.MeshStandardMaterial({ color: 0x4a8a6a, roughness: 0.4, metalness: 0.6 });
    const darkMat2 = new THREE.MeshStandardMaterial({ color: 0x141418, roughness: 0.7, metalness: 0.3 });
    const glowMat = new THREE.MeshStandardMaterial({ color: 0x66ffaa, emissive: 0x33ff88, emissiveIntensity: 1.5, roughness: 0.2, metalness: 0.1 });

    const body = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.07, 0.22), bodyMat);
    body.position.set(0, 0, -0.05);
    g.add(body);

    const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.022, 0.12, 12), accentMat);
    barrel.rotation.x = Math.PI / 2;
    barrel.position.set(0, 0.01, -0.18);
    g.add(barrel);

    const tip = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.018, 0.02, 12), darkMat2);
    tip.rotation.x = Math.PI / 2;

  function buildCrowbar() {
    const g = new THREE.Group();
    const redMat = metalMat(0xb8302a, 0.35, 0.6);
    const darkRedMat = metalMat(0x8a2018, 0.45, 0.5);
    const steelMat = metalMat(0x888888, 0.25, 0.9);
    const rustMat = new THREE.MeshStandardMaterial({ color: 0x6a2818, roughness: 0.7, metalness: 0.4 });

    const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.013, 0.016, 0.55, 6), redMat);
    shaft.rotation.x = Math.PI/2;
    shaft.position.set(0, 0, -0.25);
    g.add(shaft);

    for (let i = 0; i < 3; i++) {
      const band = new THREE.Mesh(new THREE.CylinderGeometry(0.0165, 0.0165, 0.015, 6), darkRedMat);
      band.rotation.x = Math.PI/2;
      band.position.set(0, 0, -0.15 - i*0.12);
      g.add(band);
    }

    for (let i = 0; i < 8; i++) {
      const tape = new THREE.Mesh(new THREE.CylinderGeometry(0.017, 0.017, 0.008, 8), darkMat());
      tape.rotation.x = Math.PI/2;
      tape.position.set(0, 0, 0.0 - i*0.012);
      g.add(tape);
    }

    const flatEnd = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.008, 0.04), steelMat);
    flatEnd.position.set(0, 0, 0.05);
    flatEnd.rotation.x = 0.1;
    g.add(flatEnd);
    const bevel = new THREE.Mesh(new THREE.BoxGeometry(0.028, 0.004, 0.015), steelMat);
    bevel.position.set(0, -0.003, 0.075);
    bevel.rotation.x = 0.3;
    g.add(bevel);

    const clawGroup = new THREE.Group();
    const segments = 6;
    for (let i = 0; i < segments; i++) {
      const t = i / (segments - 1);
      const angle = t * Math.PI * 0.55; // curve from 0 to ~100 degrees
      const r = 0.05;
      const x = 0;
      const y = Math.sin(angle) * r;
      const z = -0.55 - Math.cos(angle) * r + r * 0.3;
      const seg = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.025, 6), i > 3 ? steelMat : redMat);
      seg.position.set(x, y, z);
      seg.rotation.x = Math.PI/2 - angle;
      clawGroup.add(seg);
    }
    const tipAngle = Math.PI * 0.55;
    const r = 0.05;
    const tipZ = -0.55 - Math.cos(tipAngle) * r + r * 0.3;
    const tipY = Math.sin(tipAngle) * r;
    for (const side of [-1, 1]) {
      const prong = new THREE.Mesh(new THREE.BoxGeometry(0.006, 0.022, 0.008), steelMat);
      prong.position.set(side * 0.008, tipY + 0.01, tipZ);
      prong.rotation.x = -0.2;
      clawGroup.add(prong);
      const notch = new THREE.Mesh(new THREE.BoxGeometry(0.005, 0.008, 0.006), darkMat());
      notch.position.set(side * 0.008, tipY + 0.018, tipZ);
      clawGroup.add(notch);
    }
    g.add(clawGroup);

    for (let i = 0; i < 4; i++) {
      const rust = new THREE.Mesh(new THREE.SphereGeometry(0.006, 6, 4), rustMat);
      rust.position.set(
        (Math.random()-0.5) * 0.02,
        0.014,
        -0.1 - i * 0.1
      );
      rust.scale.set(1.5, 0.3, 1);
      g.add(rust);
    }

    g.position.set(0.18, -0.13, -0.12);
    g.rotation.set(-0.15, -0.35, 0.15);
    g.userData.basePos = g.position.clone();
    g.userData.baseRot = g.rotation.clone();
    g.userData.parts = { shaft: shaft, clawGroup: clawGroup };
    viewScene.add(g);
    return g;
  }

    g.userData.muzzle = new THREE.Vector3(0, 0.02, -0.32);
    viewScene.add(g); return g;
  }
