        { key: "height", label: "Target Height", type: "range", min: 1, max: 30, step: 1, default: 8 },
        { key: "strength", label: "Strength", type: "range", min: 5, max: 100, step: 5, default: 30 },
      ],
      fire(g, hit, mods, toolState) {
        if (!hit || !hit.mesh || !hit.body) return;
        if (mods.alt) {
          const oldMesh = hit.hoverballMesh, oldH = hit.hoverballHeight, oldS = hit.hoverballStrength;
          if (hit.hoverballMesh) { g.scene.remove(hit.hoverballMesh); hit.hoverballMesh = null; }
          hit.hoverballHeight = 0;
          playSound("weapon_switch");
          pushUndo({ type: "tool", tool: "Hoverball (remove)", undoFn: () => { hit.hoverballMesh = oldMesh; if (oldMesh) g.scene.add(oldMesh); hit.hoverballHeight = oldH; hit.hoverballStrength = oldS; } });
          return;
        }
        const oldMesh = hit.hoverballMesh, oldH = hit.hoverballHeight, oldS = hit.hoverballStrength;
        if (!hit.hoverballMesh) {
          const hbGeo = new THREE.SphereGeometry(0.25, 12, 8);
          const hbMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, roughness: 0.2, metalness: 0.3, transparent: true, opacity: 0.7 });
          hit.hoverballMesh = new THREE.Mesh(hbGeo, hbMat);
          hit.hoverballMesh.position.copy(hit.mesh.position);
          hit.hoverballMesh.position.y += 2;
          hit.hoverballMesh.castShadow = true;
          g.scene.add(hit.hoverballMesh);
        }
        hit.hoverballHeight = toolState.height || 8;
        hit.hoverballStrength = toolState.strength || 30;
        playSound("weapon_switch");
        pushUndo({ type: "tool", tool: "Hoverball", undoFn: () => {
          if (!oldMesh && hit.hoverballMesh) { g.scene.remove(hit.hoverballMesh); hit.hoverballMesh = null; }
          hit.hoverballHeight = oldH; hit.hoverballStrength = oldS;
        } });
      }
    },
  ];
  let toolSettings = {};
  for (const t of TOOL_LIST) {
    toolSettings[t.name] = {};
    if (t.settings) for (const s of t.settings) toolSettings[t.name][s.key] = s.default;
  }
  const TOOLGUN_TOOLS = TOOL_LIST.map(t => t.name);
  function getToolState() { return toolSettings[TOOL_LIST[currentTool].name] || {}; }

  function renderToolPanel() {
    const items = TOOL_LIST.map((t, i) =>
      '<div class="sm-toolitem ' + (i === currentTool ? "active" : "") + '" data-tool="' + i + '" title="' + t.name + '"><span class="tic">' + t.icon + '</span><span>' + t.name + '</span></div>'
    ).join("");
    return '<div class="tp-header">Tools</div>' + items;
  }

  function renderToolSettings() {
    const tool = TOOL_LIST[currentTool];
    let html = '<div class="ts-header"><span>' + tool.icon + '</span>' + tool.name + '</div>';
    if (tool.desc) html += '<div class="ts-desc">' + tool.desc + '</div>';
    if (tool.hints && tool.hints.length > 0) {
      html += '<div class="ts-hints">';
      for (const h of tool.hints) {
        html += '<b>' + h.keys + '</b>: ' + h.action + '<br>';
      }
      html += '</div>';
    }
    if (!tool.settings || tool.settings.length === 0) {
      html += '<div class="ts-empty">No settings for this tool.</div>';
    } else {
      const st = getToolState();
      for (const s of tool.settings) {
        html += '<div class="ts-row"><span class="lbl">' + s.label + '</span>';
        const val = st[s.key];
        if (s.type === "range") {
          html += '<input type="range" data-tskey="' + s.key + '" min="' + s.min + '" max="' + s.max + '" step="' + s.step + '" value="' + val + '"><span style="font-size:11px;color:#8a9498;font-family:monospace;">' + val + '</span>';
        } else if (s.type === "color") {
          html += '<input type="color" data-tskey="' + s.key + '" value="' + val + '">';
        } else if (s.type === "select") {
          html += '<select data-tskey="' + s.key + '">';
          for (const opt of s.options) {
            html += '<option ' + (opt === val ? "selected" : "") + '>' + opt + '</option>';
          }
          html += '</select>';
        } else if (s.type === "buttons") {
          html += '<div class="ts-btngroup">';
          for (const opt of s.options) {
            html += '<button class="ts-btn ' + (opt === val ? "active" : "") + '" data-tskey="' + s.key + '" data-tsval="' + opt + '">' + opt + '</button>';
          }
          html += '</div>';
        } else if (s.type === "toggle") {
          html += '<label class="ts-toggle"><input type="checkbox" data-tskey="' + s.key + '" ' + (val ? "checked" : "") + '><span class="ts-check">' + (val ? "✓" : "") + '</span><span class="ts-toggle-lbl">' + (s.toggleLabel || "Enabled") + '</span></label>';
        }
        html += '</div>';
      }
    }
    return html;
  }

  function fireToolgun() {
    if (!game) return;
    const tool = TOOL_LIST[currentTool];
    const hit = raycastProp(game);
    if (!hit) { playSound("weapon_deny"); return; }
    const mods = { ctrl: game.keys["control"], alt: game.keys["alt"], e: game.keys["e"], shift: game.keys["shift"] };
    playSound("weapon_switch");
    try { tool.fire(game, hit, mods, getToolState()); } catch(e) { console.error("Tool error:", e); }
  }

  function handleToolKey(g, key, mods) {
    const tool = TOOL_LIST[currentTool];
    if (!tool.onKey) return false;
    const hit = raycastProp(g);
    try { tool.onKey(g, key, hit, mods, getToolState()); } catch(e) { console.error(e); }
    return true;
  }

  function raycastProp(g) {
    const origin = g.player.pos.clone();
    const dir = getCameraForward(g);
    let best = null, bestT = 30;
    for (const p of g.props) {
      const oc = origin.clone().sub(p.mesh.position);
      const b = oc.dot(dir);
      const c = oc.dot(oc) - p.radius * p.radius;
      const disc = b * b - c;
      if (disc < 0) continue;
      const t = -b - Math.sqrt(disc);
      if (t > 0 && t < bestT) { bestT = t; best = p; }
      else if (t <= 0) {
        const t2 = -b + Math.sqrt(disc);
        if (t2 < bestT) { bestT = t2; best = p; }
      }
    }
    for (const n of g.npcs) {
      if (!n.alive) continue;
      const oc = origin.clone().sub(n.mesh.position);
      const b = oc.dot(dir);
      const r = n.radius;
      const c = oc.dot(oc) - r * r;
      const disc = b * b - c;
      if (disc < 0) continue;
      const t = -b - Math.sqrt(disc);
      if (t > 0 && t < bestT) { bestT = t; best = n; }
      else if (t <= 0) {
        const t2 = -b + Math.sqrt(disc);
        if (t2 < bestT) { bestT = t2; best = n; }
      }
    }
    for (const n of g.npcs) {
      if (!n.ragdollBodies) continue;
      for (let i = 0; i < n.ragdollBodies.length; i++) {
        const rb = n.ragdollBodies[i];
        const rm = n.ragdollMeshes[i];
        if (!rb || !rm) continue;
        const oc = origin.clone().sub(rb.position);
        const b = oc.dot(dir);
        const r = 0.3; // approx part radius (generous for easy grabbing)
        const c = oc.dot(oc) - r * r;
        const disc = b * b - c;
        if (disc < 0) continue;
        const t = -b - Math.sqrt(disc);
        if (t > 0 && t < bestT) { bestT = t; best = { body: rb, mesh: rm, radius: r, isRagdollPart: true, npc: n }; }
        else if (t <= 0) {
          const t2 = -b + Math.sqrt(disc);
          if (t2 < bestT) { bestT = t2; best = { body: rb, mesh: rm, radius: r, isRagdollPart: true, npc: n }; }
        }
      }
    }
    if (MP.roomId) {
      for (const propId in MP.remoteProps) {
        const rp = MP.remoteProps[propId];
        if (!rp.mesh || !rp.mesh.parent) continue;
        const oc = origin.clone().sub(rp.mesh.position);
        const b = oc.dot(dir);
        const r = rp.mesh.userData.radius || 0.8;
        const c = oc.dot(oc) - r * r;
        const disc = b * b - c;
        if (disc < 0) continue;
        const t = -b - Math.sqrt(disc);
        if (t > 0 && t < bestT) { bestT = t; best = { mesh: rp.mesh, radius: r, isRemoteProp: true, mpId: parseInt(propId), rp }; }
        else if (t <= 0) {
          const t2 = -b + Math.sqrt(disc);
          if (t2 < bestT) { bestT = t2; best = { mesh: rp.mesh, radius: r, isRemoteProp: true, mpId: parseInt(propId), rp }; }
        }
      }
    }
    return best;
  }

  let undoStack = [];
  const MAX_UNDO = 50;

  function pushUndo(action) {
    undoStack.push(action);
    if (undoStack.length > MAX_UNDO) undoStack.shift();
  }

  function doUndo() {
    if (undoStack.length === 0) return;
    const action = undoStack.pop();
    let msg = "";
    switch (action.type) {
      case "spawnProp":
        if (action.prop && game.props.includes(action.prop)) {
          msg = "Removed prop (" + (action.name || "Prop") + ")";
          removeProp3D(game, action.prop);
        }
        break;
      case "spawnEntity":
        if (action.prop && game.props.includes(action.prop)) {
          msg = "Removed entity (" + (action.name || "Entity") + ")";
          if (action.prop.body) game.world.removeBody(action.prop.body);
          removeProp3D(game, action.prop);
        }
        break;
      case "spawnNPC":
        if (action.npc && game.npcs.includes(action.npc)) {
          msg = "Removed (" + (action.name || "NPC") + ")";
          removeNPC(game, action.npc);
        }
        break;
      case "spawnRagdoll":
        if (action.npc && game.npcs.includes(action.npc)) {
          msg = "Removed ragdoll (" + (action.name || "Ragdoll") + ")";
          removeNPC(game, action.npc);
        }
        break;
      case "tool":
        msg = "Undid " + action.tool + "!";
        if (action.undoFn) { try { action.undoFn(); } catch(e) {} }
        break;
      case "weld":
        msg = "Undid weld";
        if (action.constraint && game.world.constraints.includes(action.constraint)) {
          game.world.removeConstraint(action.constraint);
        }
        break;
    }
    playSound("undo");
    showUndoNotification(msg);
  }

  let undoNotifyEl = null;
  let undoNotifyTimer = null;
  function showUndoNotification(msg) {
    if (!undoNotifyEl) {
      undoNotifyEl = document.createElement("div");
      undoNotifyEl.id = "undoNotify";
      undoNotifyEl.style.cssText = "position:absolute;bottom:70px;left:20px;background:rgba(20,24,28,0.92);color:#ffaa44;font-family:'Trebuchet MS',Verdana,sans-serif;font-size:14px;font-weight:700;padding:8px 14px;border-left:3px solid #ffaa44;border-radius:3px;pointer-events:none;z-index:20;opacity:0;transition:opacity 0.25s;text-shadow:0 0 4px rgba(0,0,0,0.9);max-width:300px;";
      const hud = document.querySelector(".hl2-hud");
      if (hud) hud.appendChild(undoNotifyEl);
      else document.body.appendChild(undoNotifyEl);
    }
    undoNotifyEl.textContent = msg;
    undoNotifyEl.style.opacity = "1";
    if (undoNotifyTimer) clearTimeout(undoNotifyTimer);
    undoNotifyTimer = setTimeout(() => { if (undoNotifyEl) undoNotifyEl.style.opacity = "0"; }, 3000);
  }

  function spawnAtCrosshair(g, item) {
    const origin = g.player.pos.clone();
    const dir = getCameraForward(g);
    let bestT = 12;
    for (const col of g.colliders) {
      const t = rayAABB(origin, dir, col);
      if (t !== null && t < bestT) bestT = t;
    }
    if (dir.y < -0.01) {
      const t = -origin.y / dir.y;
      if (t > 0 && t < bestT) bestT = t;
    }
    const dist = Math.max(3, bestT - 1.5);
    const pos = origin.add(dir.multiplyScalar(dist));
    const prop = spawnProp3D(g, pos.x, pos.y, pos.z, item);
    pushUndo({ type: "spawnProp", prop: prop, name: item.name || "Prop" });
  }

  function spawnNPCCrosshair(g, npcType) {
    const origin = g.player.pos.clone();
    const dir = getCameraForward(g);
    let bestT = 12;
    for (const col of g.colliders) {
      const t = rayAABB(origin, dir, col);
      if (t !== null && t < bestT) bestT = t;
    }
    if (dir.y < -0.01) {
      const t = -origin.y / dir.y;
      if (t > 0 && t < bestT) bestT = t;
    }
    const dist = Math.max(3, bestT - 2);
    const pos = origin.add(dir.multiplyScalar(dist));
    const groundY = findGroundHeight(g, pos.x, pos.z);
    const spawnY = groundY !== null ? groundY : pos.y;
    const npc = spawnNPC3D(g, pos.x, spawnY, pos.z, npcType);
    const def = NPC_TYPES.find(t => t.id === npcType);
    if (npcType.startsWith("ragdoll")) {
      pushUndo({ type: "spawnRagdoll", npc: npc, name: def ? def.name : "Ragdoll" });
    } else {
      pushUndo({ type: "spawnNPC", npc: npc, name: def ? def.name : "NPC" });
    }
  }

  function rayAABB(origin, dir, col) {
    let tmin = -Infinity, tmax = Infinity;
    for (const ax of ["x", "y", "z"]) {
      if (Math.abs(dir[ax]) < 1e-8) {
        if (origin[ax] < col.min[ax] || origin[ax] > col.max[ax]) return null;
      } else {
        let t1 = (col.min[ax] - origin[ax]) / dir[ax];
        let t2 = (col.max[ax] - origin[ax]) / dir[ax];
        if (t1 > t2) { const tmp = t1; t1 = t2; t2 = tmp; }
        tmin = Math.max(tmin, t1); tmax = Math.min(tmax, t2);
        if (tmin > tmax) return null;
      }
    }
    return tmin > 0 ? tmin : (tmax > 0 ? tmax : null);
  }

  function physics3D(g, dt) {
    const T = THREE;
    const p = g.player;

    if (p.noclip) {
      const qYaw = new T.Quaternion().setFromAxisAngle(new T.Vector3(0, 1, 0), p.yaw + recoilYaw);
      const qPitch = new T.Quaternion().setFromAxisAngle(new T.Vector3(1, 0, 0), p.pitch + recoilPitch);
      g.camera.quaternion.copy(qYaw).multiply(qPitch);
      if (g.camera.roll) {
        const qRoll = new T.Quaternion().setFromAxisAngle(new T.Vector3(0, 0, 1), g.camera.roll);
        g.camera.quaternion.multiply(qRoll);
      }
      const fwd3 = new T.Vector3();
      g.camera.getWorldDirection(fwd3);
      const right3 = new T.Vector3().crossVectors(fwd3, new T.Vector3(0,1,0)).normalize();
      const SPD = g.keys["shift"] ? 40 : 15;
      const move = new T.Vector3();
      if (g.keys["w"]) move.add(fwd3);
      if (g.keys["s"]) move.sub(fwd3);
      if (g.keys["d"]) move.add(right3);
      if (g.keys["a"]) move.sub(right3);
      if (g.keys[" "]) move.y += 1;
      if (g.keys["control"]) move.y -= 1;
      if (move.lengthSq() > 0) move.normalize().multiplyScalar(SPD * dt);
      p.pos.add(move);
      p.vel.set(0,0,0);
      p.onGround = false;
      g.camera.position.copy(p.pos);
      g.playerBody.position.set(p.pos.x, p.pos.y, p.pos.z);
      g.world.step(1 / 60, dt, 3);
      for (const prop of g.props) { prop.mesh.position.copy(prop.body.position); prop.mesh.quaternion.copy(prop.body.quaternion); }
      for (let i = g.props.length - 1; i >= 0; i--) { if (g.props[i].body.position.y < g.killY) removeProp3D(g, g.props[i]); }
      return;
    }

    const wantCrouch = !!(g.keys["control"]);
    if (!wantCrouch && p.height < 1.6) {
      let blocked = false;
      const headTop = p.pos.y + 0.05;
      const standTop = p.pos.y + (1.7 - p.height) + 0.05;
      for (const col of g.colliders) {
        if (p.pos.x > col.min.x - 0.3 && p.pos.x < col.max.x + 0.3 &&
            p.pos.z > col.min.z - 0.3 && p.pos.z < col.max.z + 0.3 &&
            headTop < col.max.y && standTop > col.min.y) { blocked = true; break; }
      }
      if (blocked) p.crouching = true; else p.crouching = false;
    } else {
      p.crouching = wantCrouch;
    }
    const targetEye = p.crouching ? 1.1 : 1.7;
    const prevEye = p.height;
    p.height = T.MathUtils.lerp(p.height, targetEye, Math.min(1, dt * 12));
    p.pos.y += (p.height - prevEye);

    const springK = 25, dampK = 8;
    recoilVelPitch += (-springK * recoilPitch - dampK * recoilVelPitch) * dt;
    recoilVelYaw += (-springK * recoilYaw - dampK * recoilVelYaw) * dt;
    recoilPitch += recoilVelPitch * dt;
    recoilYaw += recoilVelYaw * dt;
    recoilOffset *= Math.pow(0.001, dt);

    g.camera.position.copy(p.pos);
    g.camera.position.add(g.cameraOffset);
    const qYaw = new T.Quaternion().setFromAxisAngle(new T.Vector3(0, 1, 0), p.yaw + recoilYaw);
    const qPitch = new T.Quaternion().setFromAxisAngle(new T.Vector3(1, 0, 0), p.pitch + recoilPitch);
    g.camera.quaternion.copy(qYaw).multiply(qPitch);
    if (g.camera.roll || g.cameraRollOffset) {
      const roll = (g.camera.roll || 0) + g.cameraRollOffset;
      if (roll) {
        const qRoll = new T.Quaternion().setFromAxisAngle(new T.Vector3(0, 0, 1), roll);
        g.camera.quaternion.multiply(qRoll);
      }
    }

    const fwd = new T.Vector3(Math.sin(p.yaw), 0, Math.cos(p.yaw)).multiplyScalar(-1);
    const right = new T.Vector3(Math.cos(p.yaw), 0, -Math.sin(p.yaw));
    const wishdir = new T.Vector3();
    if (g.keys["w"]) wishdir.add(fwd);
    if (g.keys["s"]) wishdir.sub(fwd);
    if (g.keys["d"]) wishdir.add(right);
    if (g.keys["a"]) wishdir.sub(right);
    const hasInput = wishdir.lengthSq() > 0;
    if (hasInput) wishdir.normalize();

    const SPRINT = 13.5, WALK = 8, CROUCH = 3;
    let maxSpeed = WALK;
    p.sprinting = false;
    const movingFwd = g.keys["w"] || g.keys["a"] || g.keys["s"] || g.keys["d"];
    if (p.crouching) {
      maxSpeed = CROUCH;
    } else if (g.keys["shift"] && movingFwd && p.stamina > 0 && p.sprintCooldown <= 0) {
      maxSpeed = SPRINT;
      p.sprinting = true;
      p.stamina = Math.max(0, p.stamina - dt * 22);
      if (p.stamina <= 0) p.sprintCooldown = 1.2;
    } else {
      p.stamina = Math.min(100, p.stamina + dt * 15);
    }
    if (p.sprintCooldown > 0) p.sprintCooldown -= dt;

    const wishspeed = hasInput ? maxSpeed : 0;

    if (g.keys[" "]) p.jumpBuffer = 0.15;
    else p.jumpBuffer = Math.max(0, (p.jumpBuffer || 0) - dt);

    if (p.onGround) {
      const bhopGrace = p.stoodTime < 0.1 && p.jumpBuffer > 0;
      if (!bhopGrace) {
        const speed = Math.sqrt(p.vel.x * p.vel.x + p.vel.z * p.vel.z);
        if (speed > 0.001) {
          const control = Math.max(speed, 1.9); // sv_stopspeed
          const drop = control * 4 * dt;        // sv_friction
          const newspeed = Math.max(0, speed - drop) / speed;
          p.vel.x *= newspeed;
          p.vel.z *= newspeed;
        }
      }
      if (hasInput) {
        const currentspeed = p.vel.x * wishdir.x + p.vel.z * wishdir.z;
        const addspeed = wishspeed - currentspeed;
        if (addspeed > 0) {
          let accelspeed = 10 * dt * wishspeed;
          if (accelspeed > addspeed) accelspeed = addspeed;
          p.vel.x += wishdir.x * accelspeed;
          p.vel.z += wishdir.z * accelspeed;
        }
      }
      if (p.jumpBuffer > 0) {
        p.vel.y = p.crouching ? 5.8 : 7.2;
        p.onGround = false;
        p.jumpBuffer = 0;
        p.stoodTime = 0;
      } else {
        p.stoodTime += dt;
      }
    } else {
      if (hasInput) {
        const airWish = Math.min(wishspeed, 3.0); // cap (lower = harder bhop; higher = easier)
        const currentspeed = p.vel.x * wishdir.x + p.vel.z * wishdir.z;
        const addspeed = airWish - currentspeed;
        if (addspeed > 0) {
          let accelspeed = 30 * dt * airWish; // sv_airaccelerate (boosted for fun bhop)
          if (accelspeed > addspeed) accelspeed = addspeed;
          p.vel.x += wishdir.x * accelspeed;
          p.vel.z += wishdir.z * accelspeed;
        }
      }
    }

    p.vel.y -= 20 * dt;
    if (p.vel.y < -40) p.vel.y = -40;

    p.pos.x += p.vel.x * dt;
    p.pos.z += p.vel.z * dt;
    p.pos.y += p.vel.y * dt;

    p.onGround = false;
    if (!g.bspData && p.pos.y < p.height) { p.pos.y = p.height; p.vel.y = 0; p.onGround = true; }

    if (p.pos.y < g.killY) {
      if (g.playerSpawn) { p.pos.copy(g.playerSpawn); }
      else { p.pos.set(0, 5, 20); }
      p.vel.set(0, 0, 0);
      p.onGround = false;
    }

    const allColliders = g.colliders.slice();
    if (MP.roomId && MP.remoteProps) {
      for (const propId in MP.remoteProps) {
        const rp = MP.remoteProps[propId];
        if (!rp.mesh || !rp.mesh.parent) continue;
        const r = rp.mesh.userData.radius || 0.6;
        const pos = rp.mesh.position;
        allColliders.push({
          min: { x: pos.x - r, y: pos.y - r, z: pos.z - r },
          max: { x: pos.x + r, y: pos.y + r, z: pos.z + r },
        });
      }
    }

    for (const col of allColliders) {
      const r = p.radius;
      const feetY = p.pos.y - p.height;
      const headY = p.pos.y;
      const prevFeetY = feetY - p.vel.y * dt; // feet Y last frame
      if (p.pos.x > col.min.x - r && p.pos.x < col.max.x + r &&
          p.pos.z > col.min.z - r && p.pos.z < col.max.z + r &&
          p.vel.y <= 0) {
        const prevEye = p.pos.y - p.vel.y * dt;
        const topY = col.max.y + p.height;
        if (prevEye >= col.max.y - 0.05 && p.pos.y <= topY + 0.5) {
          p.pos.y = topY;
          p.vel.y = 0;
          p.onGround = true;
        }
        if (p.pos.y < topY && p.pos.y > col.max.y && feetY < col.max.y) {
          p.pos.y = topY;
          p.vel.y = 0;
          p.onGround = true;
        }
      }
      if (prevFeetY < col.max.y - 0.05 &&
          p.pos.x > col.min.x - r && p.pos.x < col.max.x + r &&
          p.pos.z > col.min.z - r && p.pos.z < col.max.z + r &&
          feetY < col.max.y - 0.02 && headY > col.min.y) {
        const penXn = p.pos.x - (col.min.x - r);
        const penXp = (col.max.x + r) - p.pos.x;
        const penZn = p.pos.z - (col.min.z - r);
        const penZp = (col.max.z + r) - p.pos.z;
        const minPen = Math.min(penXn, penXp, penZn, penZp);
        if (minPen === penXn) { p.pos.x = col.min.x - r; if (p.vel.x > 0) p.vel.x = 0; }
        else if (minPen === penXp) { p.pos.x = col.max.x + r; if (p.vel.x < 0) p.vel.x = 0; }
        else if (minPen === penZn) { p.pos.z = col.min.z - r; if (p.vel.z > 0) p.vel.z = 0; }
        else { p.pos.z = col.max.z + r; if (p.vel.z < 0) p.vel.z = 0; }
      }
      const prevHead = p.pos.y - p.vel.y * dt;
      if (p.pos.x > col.min.x && p.pos.x < col.max.x &&
          p.pos.z > col.min.z && p.pos.z < col.max.z &&
          prevHead <= col.min.y && p.pos.y >= col.min.y && p.vel.y > 0) {
        p.pos.y = col.min.y - 0.01;
        p.vel.y = 0;
      }
    }

    for (const col of g.colliders) {
      const r = p.radius;
      const feetY = p.pos.y - p.height;
      const headY = p.pos.y;
      if (p.pos.x > col.min.x - r && p.pos.x < col.max.x + r &&
          p.pos.z > col.min.z - r && p.pos.z < col.max.z + r &&
          feetY < col.max.y - 0.02 && headY > col.min.y) {
        const penXn = p.pos.x - (col.min.x - r);
        const penXp = (col.max.x + r) - p.pos.x;
        const penZn = p.pos.z - (col.min.z - r);
        const penZp = (col.max.z + r) - p.pos.z;
        const minPen = Math.min(penXn, penXp, penZn, penZp);
        if (minPen < 0.05) {
          if (minPen === penXn) p.pos.x = col.min.x - r;
          else if (minPen === penXp) p.pos.x = col.max.x + r;
          else if (minPen === penZn) p.pos.z = col.min.z - r;
          else p.pos.z = col.max.z + r;
        }
      }
    }

    g.playerBody.position.set(p.pos.x, p.pos.y, p.pos.z);

    if (g.grabbed && g.grabbed.body) {
      const f = getCameraForward(g);
      const target = g.player.pos.clone().add(f.multiplyScalar(g.grabDist));
      const b = g.grabbed.body;
      const isRealPhys = WEAPONS[currentWeapon].type === "realphysgun";
      if (b.type !== CANNON.Body.KINEMATIC && b.type !== CANNON.Body.STATIC) {
        b._prevType = b.type;
        b._prevMass = b.mass;
        b.type = CANNON.Body.KINEMATIC;
        b.mass = 0;
        b.updateMassProperties();
      }
      if (isRealPhys) {
        const prevAng = b.quaternion.clone();
        const dx = target.x - b.position.x;
        const dy = target.y - b.position.y;
        const dz = target.z - b.position.z;
        const holdSpeed = 30;
        b.velocity.set(dx * holdSpeed, dy * holdSpeed, dz * holdSpeed);
        b.quaternion.copy(prevAng);
        if (g.keys["e"]) {
          const dx = g._rotMouseDX || 0;
          const dy = g._rotMouseDY || 0;
          g._rotMouseDX = 0;
          g._rotMouseDY = 0;
          const rotSpeed = 0.01;
          const q = new CANNON.Quaternion();
          const newQ = new CANNON.Quaternion();
          q.setFromAxisAngle(new CANNON.Vec3(0, 1, 0), -dx * rotSpeed);
          q.mult(b.quaternion, newQ);
          b.quaternion.copy(newQ);
          const right = new THREE.Vector3(Math.cos(p.yaw), 0, -Math.sin(p.yaw));
          q.setFromAxisAngle(new CANNON.Vec3(right.x, right.y, right.z), -dy * rotSpeed);
          q.mult(b.quaternion, newQ);
          b.quaternion.copy(newQ);
        }
        if (!g._grabPrevTarget) g._grabPrevTarget = target.clone();
        g._grabVel = new THREE.Vector3(
          (target.x - g._grabPrevTarget.x) / dt,
          (target.y - g._grabPrevTarget.y) / dt,
          (target.z - g._grabPrevTarget.z) / dt
        );
        g._grabPrevTarget.copy(target);
      } else {
        const holdStr = 10;
        b.velocity.set(
          (target.x - b.position.x) * holdStr,
          (target.y - b.position.y) * holdStr,
          (target.z - b.position.z) * holdStr
        );
        b.angularVelocity.scale(0.85, b.angularVelocity);
        if (g.keys["e"]) {
          const dx = g._rotMouseDX || 0;
          const dy = g._rotMouseDY || 0;
          g._rotMouseDX = 0;
          g._rotMouseDY = 0;
          const rotSpeed = 0.01;
          const q = new CANNON.Quaternion();
          const newQ = new CANNON.Quaternion();
          q.setFromAxisAngle(new CANNON.Vec3(0, 1, 0), -dx * rotSpeed);
          q.mult(b.quaternion, newQ);
          b.quaternion.copy(newQ);
          const right = new THREE.Vector3(Math.cos(p.yaw), 0, -Math.sin(p.yaw));
          q.setFromAxisAngle(new CANNON.Vec3(right.x, right.y, right.z), -dy * rotSpeed);
          q.mult(b.quaternion, newQ);
          b.quaternion.copy(newQ);
        }
      }
      b.wakeUp();
      if (!g.physBeam) {
        const beamMat = new THREE.LineBasicMaterial({ color: 0x66ddff, transparent: true, opacity: 0.7 });
        const beamGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
        g.physBeam = new THREE.Line(beamGeo, beamMat);
        g.scene.add(g.physBeam);
      }
      g.physBeam.visible = true;
      const beamPos = g.physBeam.geometry.attributes.position;
      beamPos.setXYZ(0, g.player.pos.x, g.player.pos.y - 0.1, g.player.pos.z);
      beamPos.setXYZ(1, b.position.x, b.position.y, b.position.z);
      beamPos.needsUpdate = true;
      g.physBeam.material.color.setHex(isRealPhys ? 0x00ffff : 0x66bbff);
    } else if (g.physBeam) {
      g.physBeam.visible = false;
    }

    g.world.step(1 / 60, dt, 3);

    if (g.playerBody) {
      const pr = p.radius;
      const pTop = p.pos.y;
      const pBot = p.pos.y - p.height;
      const tmpV = new THREE.Vector3();
      const tmpQ = new THREE.Quaternion();
      const localP = new THREE.Vector3();
      const clamped = new THREE.Vector3();
      const closest = new THREE.Vector3();
      for (const prop of g.props) {
        const pb = prop.body;
        tmpQ.set(pb.quaternion.x, pb.quaternion.y, pb.quaternion.z, pb.quaternion.w);

        if (prop.shape === "ball") {
          const propY = pb.position.y;
          const segY = Math.max(pBot, Math.min(pTop, propY));
          const dx = p.pos.x - pb.position.x;
          const dy = segY - propY;
          const dz = p.pos.z - pb.position.z;
          const distSq = dx*dx + dy*dy + dz*dz;
          const minDist = pr + prop.radius;
          if (distSq < minDist*minDist && distSq > 1e-6) {
            const dist = Math.sqrt(distSq);
            const push = minDist - dist;
            const nx = dx/dist, ny = dy/dist, nz = dz/dist;
            p.pos.x += nx * push;
            p.pos.y += ny * push;
            p.pos.z += nz * push;
            const into = p.vel.x*nx + p.vel.y*ny + p.vel.z*nz;
            if (into < 0) {
              if (ny > 0.5) {
                if (p.vel.y < 0) p.vel.y = 0;
                p.onGround = true;
              } else {
                p.vel.x -= nx*into;
                p.vel.y -= ny*into;
                p.vel.z -= nz*into;
              }
            }
          }
        } else if (prop.halfExtents) {
          const he = prop.halfExtents;
          const invQ = tmpQ.clone().invert();
          const contacts = [];
          const samples = 6;
          for (let s = 0; s <= samples; s++) {
            const sy = pBot + (pTop - pBot) * (s / samples);
            tmpV.set(p.pos.x - pb.position.x, sy - pb.position.y, p.pos.z - pb.position.z);
            localP.copy(tmpV).applyQuaternion(invQ);
            const inside = Math.abs(localP.x) < he.x && Math.abs(localP.y) < he.y && Math.abs(localP.z) < he.z;
            if (inside) {
              const penX = he.x - Math.abs(localP.x);
              const penY = he.y - Math.abs(localP.y);
              const penZ = he.z - Math.abs(localP.z);
              const minPen = Math.min(penX, penY, penZ);
              let lx = 0, ly = 0, lz = 0;
              if (minPen === penX) lx = localP.x > 0 ? 1 : -1;
              else if (minPen === penY) ly = localP.y > 0 ? 1 : -1;
              else lz = localP.z > 0 ? 1 : -1;
              clamped.set(lx, ly, lz);
              closest.copy(clamped).applyQuaternion(tmpQ);
              contacts.push({ nx: closest.x, ny: closest.y, nz: closest.z, push: pr + minPen });
            } else {
              clamped.set(
                Math.max(-he.x, Math.min(he.x, localP.x)),
                Math.max(-he.y, Math.min(he.y, localP.y)),
                Math.max(-he.z, Math.min(he.z, localP.z))
              );
              closest.copy(clamped).applyQuaternion(tmpQ).add(tmpV.set(pb.position.x, pb.position.y, pb.position.z));
              const dx = p.pos.x - closest.x;
              const dy = sy - closest.y;
              const dz = p.pos.z - closest.z;
              const distSq = dx*dx + dy*dy + dz*dz;
              if (distSq < pr*pr && distSq > 1e-6) {
                const dist = Math.sqrt(distSq);
                contacts.push({ nx: dx/dist, ny: dy/dist, nz: dz/dist, push: pr - dist });
              }
            }
          }
          contacts.sort((a, b) => b.ny - a.ny);
          for (const c of contacts) {
            p.pos.x += c.nx * c.push;
            p.pos.y += c.ny * c.push;
            p.pos.z += c.nz * c.push;
            const into = p.vel.x*c.nx + p.vel.y*c.ny + p.vel.z*c.nz;
            if (into < 0) {
              if (c.ny > 0.3) {
                if (p.vel.y < 0) p.vel.y = 0;
                p.onGround = true;
              } else {
                p.vel.x -= c.nx*into;
                p.vel.y -= c.ny*into;
                p.vel.z -= c.nz*into;
              }
            }
          }
        }
      }
      g.playerBody.position.set(p.pos.x, p.pos.y, p.pos.z);
    }

    for (const prop of g.props) {
      prop.mesh.position.copy(prop.body.position);
      prop.mesh.quaternion.copy(prop.body.quaternion);
    }

    for (let i = g.props.length - 1; i >= 0; i--) {
      const pr = g.props[i];
      if (pr.body.position.y < g.killY) { removeProp3D(g, pr); continue; }
      if (pr.isFragment) {
        pr.fragLife -= dt;
        if (pr.fragLife <= 0) {
          if (pr.mesh.material) {
            pr.mesh.material.transparent = true;
            pr.mesh.material.opacity = Math.max(0, (pr.fragLife + 2) / 2);
          }
          if (pr.fragLife <= -2) removeProp3D(g, pr);
        }
      }
    }
    updateFootsteps(g.player, dt);

    if (g.grassUniforms) {
      g.grassUniforms.uTime.value = performance.now() * 0.001;
    }
  }

  let lastFrameTime = 0;
  function toggleFlashlight() {
    if (!game || !game.scene) return;
    if (game.flashlight) {
      game.scene.remove(game.flashlight);
      game.flashlight.target && game.scene.remove(game.flashlight.target);
      game.flashlight = null;
      consoleLog("flashlight off", "sys");
    } else {
      const T = THREE;
      const fl = new T.SpotLight(0xfff0cc, 0, 60, Math.PI/7, 0.4, 1.5);
      fl.castShadow = false;
      fl.position.copy(game.camera.position);
      const tgt = new T.Object3D();
      game.scene.add(tgt);
      fl.target = tgt;
      game.scene.add(fl);
      game.flashlight = fl;
      consoleLog("flashlight on", "sys");
    }
  }

  function updateFlashlight() {
    if (!game || !game.flashlight) return;
    const c = game.camera;
    game.flashlight.position.copy(c.position);
    const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(c.quaternion);
    game.flashlight.target.position.copy(c.position).add(dir);
    game.flashlight.target.updateMatrixWorld();
    game.flashlight.intensity = 8;
  }

  function game3DLoop() {
    if (!gameRunning) return;
    rafId = setTimeout(game3DLoop, 1000 / 60);
    try {
      const now = performance.now();
      if (!lastFrameTime) lastFrameTime = now;
      let dt = (now - lastFrameTime) / 1000;
      lastFrameTime = now;
      if (dt > 0.05) dt = 0.05;
      physics3D(game, dt);
      updateNPCs(game, dt);
      updateEntities(game, dt);
      updateProjectiles(game, dt);
      updateTracers(game, dt);
      updateParticles(dt);
      updateDecals(dt);
      updateLuaHooks(dt);
      updateLuaTimers(dt);
      callLuaHook("HUDPaint", dt);
      updateFlashlight();
      mpSendTransform();
      mpUpdateAvatars(dt);
      mpSendPropTransforms();
      mpUpdateRemoteProps(dt);
      mpSendDragUpdate();
      if (isFiring && !spawnMenuOpen) tryFire(now);
      updateViewmodel(dt, now);
      if (pendingWeapon >= 0 && now - pendingWeaponTime > 3000) silentDenyWeapon();
      renderWithPostProcess(game, dt);
      gameRenderer.autoClear = false;
      gameRenderer.clearDepth();
      viewCamera.aspect = gameCamera.aspect;
      viewCamera.updateProjectionMatrix();
      if (WEAPONS[currentWeapon].type !== "camera") {
        gameRenderer.render(viewScene, viewCamera);
      }
      updateHUD3D();
    } catch (err) {
      console.error("gameLoop error:", err);
      gameRunning = false;
    }
  }

  function updateHUD3D() {
    const w = WEAPONS[currentWeapon];
    updateWeaponBar();
    const ammoEl = document.getElementById("hudAmmo");
    const ce = document.getElementById("hudClip");
    const re = document.getElementById("hudReserve");
    if (w.ammo === Infinity) {
      if (ammoEl) ammoEl.classList.add("noammo");
      if (ce) ce.textContent = w.name.toUpperCase();
      if (re) re.textContent = "";
    } else {
      if (ammoEl) ammoEl.classList.remove("noammo");
      if (ce) ce.textContent = w.clip === Infinity ? "\u221E" : w.clip;
      if (re) re.textContent = w.ammo === Infinity ? "\u221E" : w.ammo;
    }
    const ge = document.getElementById("hudGrab");
    if (ge) ge.classList.toggle("on", !!game.grabbed);
    const aux = document.getElementById("hudAux");
    const auxFill = document.getElementById("hudAuxFill");
    if (aux && auxFill && game) {
      const p = game.player;
      const show = p.sprinting || p.stamina < 99.5 || p.sprintCooldown > 0;
      aux.classList.toggle("on", show);
      auxFill.style.width = Math.max(0, Math.min(100, p.stamina)) + "%";
    }
    const speedo = document.getElementById("hudSpeedo");
    const speedVal = document.getElementById("hudSpeedVal");
    if (speedo && speedVal && game) {
      const v = game.player.vel;
      const horiz = Math.sqrt(v.x * v.x + v.z * v.z);
      const total = Math.sqrt(v.x * v.x + v.y * v.y + v.z * v.z);
      const ups = Math.round(game.player.noclip ? total * 39.37 : horiz * 39.37);
      speedVal.textContent = ups;
      speedo.classList.toggle("show", !!game.showSpeedo);
    }
  }

  function pauseGame() {
    gameRunning = false;
    if (document.pointerLockElement) document.exitPointerLock();
    const root = document.getElementById("root");
    let ov = document.getElementById("pauseOverlay");
    if (!ov) {
      ov = document.createElement("div");
      ov.id = "pauseOverlay";
      ov.style.cssText = "position:absolute;inset:0;z-index:15;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;";
      root.appendChild(ov);
    }
    ov.innerHTML =
      '<div style="background:#22272a;border:1px solid #000;padding:28px 36px;text-align:center;box-shadow:0 12px 50px rgba(0,0,0,0.8);">' +
      '<div style="font-size:24px;color:#f4c430;font-weight:700;margin-bottom:18px;text-shadow:1px 1px 0 #000;">Paused</div>' +
      '<button class="pbtn primary" style="width:220px;margin-bottom:8px;" onclick="resumeGame()">Resume</button><br>' +
      '<button class="pbtn" style="width:220px;margin-bottom:8px;" onclick="pauseOptionsPanel()">Options</button><br>' +
      '<button class="pbtn" style="width:220px;" onclick="returnToMenu()">Return to Main Menu</button>' +
      '</div>';
  }

  function returnToMenu() {
    gameRunning = false;
    if (rafId) clearTimeout(rafId);
    if (document.pointerLockElement) document.exitPointerLock();

    if (ov) ov.remove();
    if (bspTexLogEl) { bspTexLogEl.remove(); bspTexLogEl = null; }
    tracerPool = [];

    recoilPitch = 0; recoilYaw = 0; recoilVelPitch = 0; recoilVelYaw = 0; recoilOffset = 0; recoilRot = 0;
    for (const d of decalPool) { if (d.mesh) { d.mesh.visible = false; d.active = false; d.isAttached = false; d.attachedProp = null; } }
    if (gameRenderer) { gameRenderer.dispose(); gameRenderer.domElement.remove(); }
    if (gameScene) {
      gameScene.traverse(function (o) {
        if (o.geometry) o.geometry.dispose();
        if (o.material) { if (Array.isArray(o.material)) o.material.forEach(function (m) { m.dispose(); }); else o.material.dispose(); }
      });
    }
    if (game && game.textures) Object.values(game.textures).forEach(function (t) { t.dispose(); });
    if (game && game.scene && game.scene.environment) game.scene.environment.dispose();
    if (viewScene) {
      viewScene.traverse(function (o) {
        if (o.geometry) o.geometry.dispose();
        if (o.material) { if (Array.isArray(o.material)) o.material.forEach(function (m) { m.dispose(); }); else o.material.dispose(); }
      });
      viewScene = null; viewModels = {};
    }
    gameRenderer = null; gameScene = null; gameCamera = null; game = null;
    mpCleanupScene();
    if (MP.roomId && MP.connected && MP.socket) {

      MP.hostPid = null;

    const chatInputCtn = document.getElementById("mpChatInputCtn");
    if (chatInputCtn) chatInputCtn.style.display = "none";
    const root = document.getElementById("root");
    root.innerHTML = savedMenuHTML;
    document.body.style.background = "";
    mpUpdateCount();

        lua.lua_createtable(luaState, 0, Object.keys(obj).length);

            pushJSFn((L) => {
              const top = lua.lua_gettop(L);
              const jsArgs = [];
              for (let i = 1; i <= top; i++) {
                jsArgs.push(interop.tojs(L, i));
              }
              const result = val(...jsArgs);
              return pushResult(L, result);

            lua.lua_setfield(luaState, -2, to_luastring(key));
          } else {
            interop.pushjs(luaState, val);
            lua.lua_setfield(luaState, -2, to_luastring(key));
          }
        }
        lua.lua_setglobal(luaState, to_luastring(name));

      function pushResult(L, result) {
        if (result === undefined || result === null) {
          lua.lua_pushnil(L);
          return 1;
        }
        if (typeof result === 'number') {
          lua.lua_pushnumber(L, result);
          return 1;
        }
        if (typeof result === 'string') {
          lua.lua_pushstring(L, to_luastring(result));
          return 1;
        }
        if (typeof result === 'boolean') {
          lua.lua_pushboolean(L, result ? 1 : 0);
          return 1;
        }
        if (result && result.__isVguiProxy) {
          interop.pushjs(L, result);
          return 1;
        }
        if (typeof result === 'object') {
          if (Array.isArray(result)) {
            lua.lua_createtable(L, result.length, 0);
            for (let i = 0; i < result.length; i++) {
              pushResult(L, result[i]);
              lua.lua_rawseti(L, -2, i + 1);
            }
          } else {
            const keys = Object.keys(result);
            lua.lua_createtable(L, 0, keys.length);
            for (const k of keys) {
              pushResult(L, result[k]);
              lua.lua_setfield(L, -2, to_luastring(k));
            }
          }
          return 1;
        }
        lua.lua_pushnil(L);
        return 1;

          el.className = "vgui-panel";
          if (typeName === "DFrame") {
            el.classList.add("vgui-frame");
            el.innerHTML = '<div class="vgui-titlebar"><span class="vgui-title">Untitled</span><span class="vgui-close">×</span></div><div class="vgui-body"></div>';
            const titlebar = el.querySelector(".vgui-titlebar");
            const closeBtn = el.querySelector(".vgui-close");
            if (closeBtn) closeBtn.onclick = () => luaVguiAPI.Remove(id);
            makeVguiDraggable(el, titlebar);
          }
          let parent = null;
          if (parentPanel && typeof parentPanel === "string" && luaVguiPanels.has(parentPanel)) {
            parent = luaVguiPanels.get(parentPanel);
          }
          let mountEl;
          if (parent) {
            mountEl = parent.el.querySelector(".vgui-body") || parent.el;
            parent.children.push(id);
          } else {
            mountEl = document.getElementById("vguiRoot");
          }
          if (mountEl) mountEl.appendChild(el);
          const panelObj = { id, el, type: typeName, parent: parent ? parent.id : null, children: [] };
          luaVguiPanels.set(id, panelObj);
          return makeVguiProxy(panelObj);
        },
        Remove: (id) => {
          const p = luaVguiPanels.get(id);
          if (!p) return;
          if (p.children) { for (const cid of p.children) luaVguiAPI.Remove(cid); }
          if (p.el && p.el.parentNode) p.el.parentNode.removeChild(p.el);
          if (p.parent && luaVguiPanels.has(p.parent)) {
            const par = luaVguiPanels.get(p.parent);
            par.children = par.children.filter(c => c !== id);
          }
          luaVguiPanels.delete(id);
        },
        RemoveAll: () => {
          for (const id of [...luaVguiPanels.keys()]) luaVguiAPI.Remove(id);
        },
        GetList: () => [...luaVguiPanels.keys()],
      };

      function makeVguiProxy(panelObj) {
        const id = panelObj.id;
        const el = panelObj.el;
        const proxy = {
          __isVguiProxy: true,
          _id: id,
          SetTitle: (title) => {
            const t = el.querySelector(".vgui-title"); if (t) t.textContent = String(title);
          },
          SetText: (text) => { el.textContent = String(text); },
          GetText: () => el.textContent,
          SetSize: (w, h) => { el.style.width = w + "px"; el.style.height = h + "px"; },
          SetPos: (x, y) => { el.style.left = x + "px"; el.style.top = y + "px"; },
          SetPosCenter: () => {
            const w = el.offsetWidth, h = el.offsetHeight;
            el.style.left = ((window.innerWidth - w) / 2) + "px";
            el.style.top = ((window.innerHeight - h) / 2) + "px";
          },
          SetVisible: (visible) => { el.style.display = visible ? "" : "none"; },
          Remove: () => luaVguiAPI.Remove(id),
          AddChild: (typeName) => luaVguiAPI.Create(typeName, id),
          DoClick: (fn) => { if (panelObj.type === "DButton") { el.className = "vgui-button"; el.onclick = () => { try { fn(); } catch(e) { consoleLog("vgui DoClick error: " + e.message, "err"); } }; } },
          OnClick: (fn) => { el.style.cursor = "pointer"; el.onclick = () => { try { fn(); } catch(e) { consoleLog("vgui OnClick error: " + e.message, "err"); } }; },
          SetColor: (r, g, b, a) => {
            if (a !== undefined) el.style.background = `rgba(${r},${g},${b},${a/255})`;
            else if (g !== undefined) el.style.background = `rgb(${r},${g},${b})`;
            else el.style.background = `rgb(${r},${r},${r})`;
          },
          SetFont: (font) => { el.style.fontFamily = String(font); },
          SetFontSize: (size) => { el.style.fontSize = size + "px"; },
          GetParent: () => panelObj.parent,
          GetChildren: () => panelObj.children.slice(),
          Dock: (dockType) => {
            if (dockType === "top") { el.style.width = "100%"; el.style.marginBottom = "2px"; }
            else if (dockType === "bottom") { el.style.width = "100%"; el.style.bottom = "0"; }
            else if (dockType === "left") { el.style.height = "100%"; el.style.float = "left"; }
            else if (dockType === "right") { el.style.height = "100%"; el.style.float = "right"; }
            else if (dockType === "fill") { el.style.flex = "1"; }
          },
        };
        if (panelObj.type === "DButton") { el.className = "vgui-button"; }
        if (panelObj.type === "DLabel") { el.className = "vgui-label"; }

          el.innerHTML = '<div class="vgui-label" style="margin-bottom:2px;"></div><input type="range" class="vgui-slider">';

          proxy.GetValue = () => parseFloat(slider.value);
          proxy.SetMin = (v) => { slider.min = v; };
          proxy.SetMax = (v) => { slider.max = v; };
          proxy.OnValueChanged = (fn) => { slider.oninput = () => { try { fn(parseFloat(slider.value)); } catch(e) { consoleLog("vgui OnValueChanged error: " + e.message, "err"); } }; };
          proxy.SetText = (text) => { const l = el.querySelector(".vgui-label"); if (l) l.textContent = String(text); };
          proxy.GetText = () => { const l = el.querySelector(".vgui-label"); return l ? l.textContent : ""; };
        }
        if (panelObj.type === "DTextEntry") {
          el.className = "vgui-textentry";
          el.tagName_override = "input";
          const input = document.createElement("input");
          input.type = "text";
          input.className = "vgui-textentry";
          input.id = id;
          el.parentNode.replaceChild(input, el);
          panelObj.el = input;
          proxy.SetText = (text) => { input.value = String(text); };
          proxy.GetText = () => input.value;
          proxy.OnChange = (fn) => { input.oninput = () => { try { fn(input.value); } catch(e) { consoleLog("vgui OnChange error: " + e.message, "err"); } }; };
          proxy.SetPlaceholder = (text) => { input.placeholder = String(text); };
        }
        if (panelObj.type === "DCheckBox") {
          el.className = "vgui-checkbox-label";
          el.innerHTML = '<input type="checkbox" class="vgui-checkbox"><span class="vgui-label"></span>';
          const cb = el.querySelector("input");
          const lbl = el.querySelector("span");
          proxy.SetChecked = (v) => { cb.checked = !!v; };

          const input = document.createElement("input");
          input.type = "color";
          input.className = "vgui-colorbtn";

          panelObj.el = input;
          proxy.SetColor = (r, g, b) => { input.value = `#${(r||0).toString(16).padStart(2,'0')}${(g||0).toString(16).padStart(2,'0')}${(b||0).toString(16).padStart(2,'0')}`; };
          proxy.GetColor = () => { const h = input.value; return {r: parseInt(h.substr(1,2),16), g: parseInt(h.substr(3,2),16), b: parseInt(h.substr(5,2),16)}; };
          proxy.OnChange = (fn) => { input.oninput = () => { try { const h = input.value; fn(parseInt(h.substr(1,2),16), parseInt(h.substr(3,2),16), parseInt(h.substr(5,2),16)); } catch(e) { consoleLog("vgui OnChange error: " + e.message, "err"); } }; };

          proxy.SetText = (text) => { ta.value = String(text); };

          proxy.OnChange = (fn) => { ta.oninput = () => { try { fn(ta.value); } catch(e) { consoleLog("vgui OnChange error: " + e.message, "err"); } }; };
        }
        return proxy;
      }

      function makeVguiDraggable(el, handle) {
        if (!handle) return;
        let dx = 0, dy = 0, dragging = false;
        handle.onmousedown = (e) => {
          if (e.target.classList.contains("vgui-close")) return;
          dragging = true;
          dx = e.clientX - el.offsetLeft;
          dy = e.clientY - el.offsetTop;
          e.preventDefault();
        };
        document.addEventListener("mousemove", (e) => {
          if (!dragging) return;
          el.style.left = (e.clientX - dx) + "px";
          el.style.top = (e.clientY - dy) + "px";
        });
        document.addEventListener("mouseup", () => { dragging = false; });
      }

  function runLuaCode(code) {
    if (!luaLoaded) {
      consoleLog("Lua engine not loaded yet", "err");
      return;
    }
    const F = window.__fengari;
    const { lauxlib, to_luastring } = F;
    try {
      const ok = lauxlib.luaL_dostring(luaState, to_luastring(code));
      if (ok !== 0) {
        const msg = F.lua.lua_tojsstring(luaState, -1);
        consoleLog("Lua error: " + msg, "err");
      }
    } catch (e) {
      consoleLog("Lua runtime error: " + e.message, "err");
    }
  }

  function updateLuaHooks(dt) {
    if (!luaLoaded) return;
    callLuaHook("Think", dt);
  }

  function updateLuaTimers(dt) {
    if (!luaLoaded || luaTimers.length === 0) return;
    const now = performance.now();
    for (let i = luaTimers.length - 1; i >= 0; i--) {
      const t = luaTimers[i];
      if (now >= t.nextFire) {
        try { t.fn(); } catch (e) { consoleLog("Lua timer error: " + e.message, "err"); }
        if (t.repeats === 1) {
          luaTimers.splice(i, 1);
        } else if (t.repeats > 1) {
          t.repeats--;
          t.nextFire = now + t.delay * 1000;
        } else {
          t.nextFire = now + t.delay * 1000;
        }
      }
    }
  }

  function resetLuaState() {
    luaThinkHooks = [];
    luaTimers = [];
    luaConcommands = {};
    for (const k in luaHooks) delete luaHooks[k];
    for (const id of [...luaVguiPanels.keys()]) luaVguiAPI_Remove(id);
  }
  function callLuaHook(event, ...args) {
    if (!luaLoaded) return;
    const hooks = luaHooks[event];
    if (!hooks) return;
    for (const h of hooks) {
      try { h.fn(...args); } catch(e) { consoleLog("hook [" + event + "/" + h.name + "] error: " + e.message, "err"); }
    }
  }
  function callLuaHookResults(event, ...args) {
    if (!luaLoaded) return true;
    const hooks = luaHooks[event];
    if (!hooks) return true;
    let result = true;
    for (const h of hooks) {
      try {
        const r = h.fn(...args);
        if (r === false) result = false;
      } catch(e) { consoleLog("hook [" + event + "/" + h.name + "] error: " + e.message, "err"); }
    }
    return result;
  }
  function luaVguiAPI_Remove(id) {
    const p = luaVguiPanels.get(id);
    if (!p) return;
    if (p.children) { for (const cid of p.children) luaVguiAPI_Remove(cid); }
    if (p.el && p.el.parentNode) p.el.parentNode.removeChild(p.el);
    luaVguiPanels.delete(id);
  }

    if (!el || el.dataset.dragBound) return;

    let dragOffX = 0, dragOffY = 0, dragging = false;
    if (titlebar) {
      titlebar.onmousedown = (e) => {
        if (e.target === closeBtn) return;
        dragging = true;
        const rect = el.getBoundingClientRect();
        el.style.transform = "none";
        el.style.left = rect.left + "px";
        el.style.top = rect.top + "px";
        dragOffX = e.clientX - rect.left;
        dragOffY = e.clientY - rect.top;
        e.preventDefault();
      };
      document.addEventListener("mousemove", (e) => {
        if (!dragging) return;
        el.style.left = Math.max(0, Math.min(window.innerWidth - 100, e.clientX - dragOffX)) + "px";
        el.style.top = Math.max(0, Math.min(window.innerHeight - 40, e.clientY - dragOffY)) + "px";
      });
      document.addEventListener("mouseup", () => { dragging = false; });
    }

    let resizing = false, startW = 0, startH = 0, startX = 0, startY = 0;
    if (resizer) {
      resizer.onmousedown = (e) => {
        resizing = true;
        startW = el.offsetWidth;
        startH = el.offsetHeight;
        startX = e.clientX;
        startY = e.clientY;
        e.preventDefault();
        e.stopPropagation();
      };
      document.addEventListener("mousemove", (e) => {
        if (!resizing) return;
        el.style.width = Math.max(300, Math.min(window.innerWidth - 20, startW + (e.clientX - startX))) + "px";
        el.style.height = Math.max(200, Math.min(window.innerHeight - 20, startH + (e.clientY - startY))) + "px";
      });
      document.addEventListener("mouseup", () => { resizing = false; });
    }
  }

  function updateConsoleSuggest() {
    const inp = document.getElementById("dcInput");
    const box = document.getElementById("dcSuggest");
    if (!inp || !box) return;
    const raw = inp.value;
    const parts = raw.trim().split(/\s+/);
    const typed = parts[0].toLowerCase();

    const luaCmds = Object.keys(luaConcommands).map(n => ({ name: n, args: luaConcommands[n].help || "", desc: "Lua concommand", getVal: null }));

    if (!raw.trim()) {
      suggestItems = [...CONSOLE_COMMANDS, ...luaCmds].map(c => {
        let val = c.getVal ? c.getVal() : null;
        return { name: c.name, args: c.args, val, desc: c.desc, full: false };
      });
    } else if (parts.length > 1) {
      const cmd = [...CONSOLE_COMMANDS, ...luaCmds].find(c => c.name === typed);
      if (cmd && cmd.getVal) {
        const v = cmd.getVal();
        if (v !== null) {
          suggestItems = [{ name: cmd.name, val: v, desc: cmd.desc, full: true }];
        } else { suggestItems = []; }
      } else { suggestItems = []; }
    } else {
      const all = [...CONSOLE_COMMANDS, ...luaCmds];
      const matches = typed
        ? all.filter(c => c.name.startsWith(typed))
        : all;
      suggestItems = matches.map(c => {
        let val = c.getVal ? c.getVal() : null;
        return { name: c.name, args: c.args, val, desc: c.desc, full: false };
      });
    }

    if (suggestItems.length === 0) {
      box.classList.remove("show");
      box.innerHTML = "";
      suggestSelIdx = -1;
      return;
    }

    box.innerHTML = suggestItems.map((it, i) => {
      let html = '<div class="dc-suggest-item' + (i === suggestSelIdx ? " sel" : "") + '" data-idx="' + i + '">';
      html += '<span class="dc-sug-cmd">' + it.name + '</span>';
      if (it.args) html += ' <span class="dc-sug-arg">' + it.args + '</span>';
      if (it.val !== null && it.val !== undefined) html += ' <span class="dc-sug-val">= ' + it.val + '</span>';
      if (it.desc) html += '<span class="dc-sug-desc">— ' + it.desc + '</span>';
      html += '</div>';
      return html;
    }).join("");
    box.classList.add("show");

    box.querySelectorAll(".dc-suggest-item").forEach(el => {
      el.addEventListener("mousedown", (e) => {
        e.preventDefault();
        const idx = parseInt(el.dataset.idx);
        const item = suggestItems[idx];
        if (item) {
          inp.value = item.name + (item.args ? " " : "");
          updateConsoleSuggest();
          inp.focus();
        }
      });
    });
  }

  function moveSuggestSel(dir) {
    if (suggestItems.length === 0) return;
    if (dir > 0) {
      suggestSelIdx = (suggestSelIdx + 1) % suggestItems.length;
    } else {
      suggestSelIdx = suggestSelIdx <= 0 ? suggestItems.length - 1 : suggestSelIdx - 1;
    }
    if (suggestSelIdx === 0 && dir < 0 && suggestItems.length > 1) suggestSelIdx = 0;
    updateConsoleSuggestSel();
  }

  function updateConsoleSuggestSel() {
    const box = document.getElementById("dcSuggest");
    if (!box) return;
    box.querySelectorAll(".dc-suggest-item").forEach((el, i) => {
      el.classList.toggle("sel", i === suggestSelIdx);
    });
    const sel = box.querySelector(".dc-suggest-item.sel");
    if (sel) sel.scrollIntoView({ block: "nearest" });
  }

  function acceptSuggestion() {
    const inp = document.getElementById("dcInput");
    if (!inp || suggestItems.length === 0) return;
    const idx = suggestSelIdx >= 0 ? suggestSelIdx : 0;
    const item = suggestItems[idx];
    if (item) {
      inp.value = item.name + (item.args ? " " : "");
      updateConsoleSuggest();
      inp.focus();
      inp.setSelectionRange(inp.value.length, inp.value.length);
    }
  }
