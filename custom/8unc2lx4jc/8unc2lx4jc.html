    resizePostProcessRTs(window.innerWidth, window.innerHeight);
  }

  function buildHudBar() {
    const bar = document.getElementById("hudBar");
    if (!bar || !game) return;
    bar.innerHTML = WEAPONS.map(function (w, i) {
      return '<div class="hl2-tool ' + (i === currentWeapon ? "active" : "") + '"><span class="k">' + i + '</span>' + w.name + '</div>';
    }).join("");
  }

  function setupGame3DInput() {
    const c = game.canvas;
    c.addEventListener("click", function () { if (!game.pointerLocked) c.requestPointerLock(); });
    document.addEventListener("pointerlockchange", function () {
      game.pointerLocked = document.pointerLockElement === c;
    });
    document.addEventListener("mousemove", function (e) {
      if (!game || !game.pointerLocked) return;
      if (game.cameraAdjusting && WEAPONS[currentWeapon].type === "camera") {
        game.camera.fov = Math.max(10, Math.min(120, game.camera.fov - e.movementX * 0.1));
        game.camera.roll = (game.camera.roll || 0) + e.movementY * 0.005;
        game.camera.updateProjectionMatrix();
        return;
      }
      if (game.grabbed && game.keys["e"]) {
        game._rotMouseDX = (game._rotMouseDX || 0) + e.movementX;
        game._rotMouseDY = (game._rotMouseDY || 0) + e.movementY;
        return;
      }
      game.player.yaw -= e.movementX * 0.0025 * (game.mouseSens || 1);
      game.player.pitch -= e.movementY * 0.0025 * (game.mouseSens || 1);
      game.player.pitch = Math.max(-1.5, Math.min(1.5, game.player.pitch));
    });
    c.addEventListener("mousedown", function (e) {
      if (!game.pointerLocked) return;
      if (pendingWeapon >= 0) {
        if (e.button === 0) { confirmWeapon(); return; }
        if (e.button === 2) { cancelWeapon(); return; }
      }
      const wtype = WEAPONS[currentWeapon].type;
      if (e.button === 0) {
        if (wtype === "physgun") {
          if (game.grabbed && (game.grabbed.body || game.grabbed._isRemoteDrag)) {
            if (game.grabbed._isRemoteDrag) {
              mpReleaseRemoteProp(game.grabbed, false);
            } else {
            const b = game.grabbed.body;
            if (b._prevType !== undefined) { b.type = b._prevType; b.mass = b._prevMass || 4; b.updateMassProperties(); b._prevType = undefined; }
            b.velocity.set(0, 0, 0);
            b.angularVelocity.set(0, 0, 0);
            if (game.grabbed.mpId && MP.connected && MP.socket) {
              const q = game.grabbed.mesh.quaternion;
              MP.socket.send(JSON.stringify({ t: MP_TYPE_RELEASE, propId: game.grabbed.mpId, x: b.position.x, y: b.position.y, z: b.position.z, qx: q.x, qy: q.y, qz: q.z, qw: q.w }));
            }
            }
            game.grabbed = null;
            playSound("physcannon_drop");
            playSound("physcannon_claws_close");
          } else {
            const hit = raycastProp(game);
            if (hit && hit.isRemoteProp) {
              const prop = mpClaimRemoteProp(hit);
              if (prop) {
                game.grabbed = prop;
                game.grabDist = Math.max(3, Math.min(15, prop.mesh.position.distanceTo(game.player.pos)));
                if (prop.body) {
                  prop.body._prevType = prop.body.type;
                  prop.body._prevMass = prop.body.mass;
                  prop.body.type = CANNON.Body.KINEMATIC;
                  prop.body.mass = 0;
                  prop.body.updateMassProperties();
                  prop.body.wakeUp();
                }
                playSound("physcannon_pickup");
                playSound("physcannon_claws_open");
              }
            } else if (hit && hit.body) {
              game.grabbed = hit;
              game.grabDist = Math.max(3, Math.min(15, hit.mesh.position.distanceTo(game.player.pos)));
              hit.body.wakeUp();
              playSound("physcannon_pickup");
              playSound("physcannon_claws_open");
            } else {
              playSound("weapon_deny");
            }
          }
        } else if (wtype === "realphysgun") {
          if (!game.grabbed) {
            const hit = raycastProp(game);
            if (hit && hit.isRemoteProp) {
              const prop = mpClaimRemoteProp(hit);
              if (prop) {
                game.grabbed = prop;
                game.grabDist = Math.max(3, Math.min(20, prop.mesh.position.distanceTo(game.player.pos)));
                game._grabPrevTarget = null;
                game._grabVel = null;
                if (prop.body) prop.body.wakeUp();
                playSound("physcannon_pickup");
                playSound("physcannon_claws_open");
              }
            } else if (hit && hit.body) {
              game.grabbed = hit;
              game.grabDist = Math.max(3, Math.min(20, hit.mesh.position.distanceTo(game.player.pos)));
              game._grabPrevTarget = null;
              game._grabVel = null;
              hit.body.wakeUp();
              playSound("physcannon_pickup");
              playSound("physcannon_claws_open");
            } else {
              playSound("weapon_deny");
            }
          }
        } else if (wtype === "camera") {
          takeScreenshot();
        } else if (wtype === "toolgun") {
          fireToolgun();
        } else {
          isFiring = true;
          tryFire(performance.now());
        }
      } else if (e.button === 2) {
        if (wtype === "physgun" && game.grabbed && (game.grabbed.body || game.grabbed._isRemoteDrag)) {
          if (game.grabbed._isRemoteDrag) {
            mpReleaseRemoteProp(game.grabbed, true);
          } else {
          const fwd = getCameraForward(game);
          const b = game.grabbed.body;
          if (b._prevType !== undefined) { b.type = b._prevType; b.mass = b._prevMass || 4; b.updateMassProperties(); b._prevType = undefined; }
          b.velocity.set(fwd.x * 40, fwd.y * 40, fwd.z * 40);
          b.angularVelocity.set((Math.random() - 0.5) * 15, (Math.random() - 0.5) * 15, (Math.random() - 0.5) * 15);
          b.wakeUp();
          if (game.grabbed.mpId && MP.connected && MP.socket) {
            const q = game.grabbed.mesh.quaternion;
            MP.socket.send(JSON.stringify({ t: MP_TYPE_RELEASE, propId: game.grabbed.mpId, x: b.position.x, y: b.position.y, z: b.position.z, qx: q.x, qy: q.y, qz: q.z, qw: q.w, vx: fwd.x*40, vy: fwd.y*40, vz: fwd.z*40 }));
          }
          }
          game.grabbed = null;
          playSound("physcannon_launch");
          playSound("physcannon_claws_close");
        } else if (wtype === "realphysgun") {
          if (game.grabbed && (game.grabbed.body || game.grabbed._isRemoteDrag)) {
            if (game.grabbed._isRemoteDrag) {
              mpReleaseRemoteProp(game.grabbed, false);
              game.grabbed = null;
              playSound("physcannon_claws_close");
            } else {
            const b = game.grabbed.body;
            if (b._prevType !== undefined) { b._prevType = undefined; }
            b._savedMass = b._prevMass || b.mass || 4;
            b.type = CANNON.Body.STATIC;
            b.mass = 0;
            b.updateMassProperties();
            b.velocity.set(0, 0, 0);
            b.angularVelocity.set(0, 0, 0);
            if (game.grabbed.mpId && MP.connected && MP.socket) {
              const q = game.grabbed.mesh.quaternion;
              MP.socket.send(JSON.stringify({ t: MP_TYPE_RELEASE, propId: game.grabbed.mpId, x: b.position.x, y: b.position.y, z: b.position.z, qx: q.x, qy: q.y, qz: q.z, qw: q.w }));
            }
            game.grabbed = null;
            playSound("physcannon_claws_close");
            }
          } else {
            const hit = raycastProp(game);
            if (hit && hit.body && hit.body.type === CANNON.Body.STATIC) {
              hit.body.type = CANNON.Body.DYNAMIC;
              hit.body.mass = hit.body._savedMass || 4;
              hit.body.updateMassProperties();
              hit.body.velocity.set(0, 0, 0);
              hit.body.angularVelocity.set(0, 0, 0);
              playSound("physcannon_drop");
            }
          }
        } else if (wtype === "camera") {
          game.cameraAdjusting = true;
        }
      }
    });
    c.addEventListener("mouseup", function (e) {
      if (e.button === 0) {
        isFiring = false;
        if (WEAPONS[currentWeapon].type === "realphysgun" && game.grabbed && (game.grabbed.body || game.grabbed._isRemoteDrag)) {
          if (game.grabbed._isRemoteDrag) {
            mpReleaseRemoteProp(game.grabbed, false);
            game.grabbed = null;
            game._grabPrevTarget = null;
            game._grabVel = null;
            playSound("physcannon_drop");
            playSound("physcannon_claws_close");
          } else {
          const b = game.grabbed.body;
          if (b._prevType !== undefined) {
            b.type = b._prevType;
            b.mass = b._prevMass || 4;
            b.updateMassProperties();
            b._prevType = undefined;
          }
          if (game._grabVel) {
            b.velocity.set(game._grabVel.x, game._grabVel.y, game._grabVel.z);
          }
          b.wakeUp();
          if (game.grabbed.mpId && MP.connected && MP.socket) {
            const q = game.grabbed.mesh.quaternion;
            MP.socket.send(JSON.stringify({ t: MP_TYPE_RELEASE, propId: game.grabbed.mpId, x: b.position.x, y: b.position.y, z: b.position.z, qx: q.x, qy: q.y, qz: q.z, qw: q.w, vx: (game._grabVel?game._grabVel.x:0), vy: (game._grabVel?game._grabVel.y:0), vz: (game._grabVel?game._grabVel.z:0) }));
          }
          game.grabbed = null;
          game._grabPrevTarget = null;
          game._grabVel = null;
          playSound("physcannon_drop");
          playSound("physcannon_claws_close");
          }
        }
      }
      if (e.button === 2) {
        if (WEAPONS[currentWeapon].type === "camera") {
          game.cameraAdjusting = false;
        }
      }
    });
    c.addEventListener("contextmenu", function (e) { e.preventDefault(); });
    c.addEventListener("wheel", function (e) {
      if (!game.pointerLocked) return;
      if (WEAPONS[currentWeapon].type === "realphysgun" && game.grabbed) {
        e.preventDefault();
        game.grabDist = Math.max(2, Math.min(30, game.grabDist - e.deltaY * 0.01));
      }
    }, { passive: false });
  }

  let spawnMenuOpen = false;
  let spawnMenuCat = 0;
  let spawnMenuTab = 0;

  function getShapeIcon(shape, item) {
    if (item.tall) return "🏛️";
    if (item.color === 0x5a5a5e) return "⚙️";
    if (item.color === 0x909090) return "🧱";
    if (item.color === 0xb84a3a) return "🚢";
    if (shape === "box") return "📦";
    if (shape === "ball") return "⚽";
    if (shape === "barrel") return "🛢️";
    if (shape === "plank") return "🪵";
    return "❓";
  }

  function toggleSpawnMenu() {
    if (spawnMenuOpen) closeSpawnMenu();
    else openSpawnMenu();
  }

  function openSpawnMenu() {
    if (spawnMenuOpen) return;
    spawnMenuOpen = true;
    callLuaHook("OnSpawnMenuOpen");
    if (document.pointerLockElement) document.exitPointerLock();
    if (game && game.grabbed) {
      const fwd = getCameraForward(game);
      const b = game.grabbed.body;
      if (b && b._prevType !== undefined) { b.type = b._prevType; b.mass = b._prevMass || 4; b.updateMassProperties(); b._prevType = undefined; }
      if (b) b.velocity.set(fwd.x * 8, fwd.y * 8, fwd.z * 8);
      game.grabbed = null;
    }
    const root = document.getElementById("root");
    let sm = document.getElementById("spawnMenu");
    if (!sm) {
      sm = document.createElement("div");
      sm.id = "spawnMenu";
      sm.className = "spawnmenu";
      root.appendChild(sm);
    }
    renderSpawnMenu();
  }

  function closeSpawnMenu() {
    spawnMenuOpen = false;
    callLuaHook("OnSpawnMenuClose");
    const sm = document.getElementById("spawnMenu");
    if (sm) sm.remove();
    if (vmakerPreviewGroup) {
      viewScene.remove(vmakerPreviewGroup);
      vmakerPreviewGroup.traverse(o => { if (o.geometry) o.geometry.dispose(); });
      vmakerPreviewGroup = null;
      showViewModel(WEAPONS[currentWeapon].id);
    }
  }

  function renderSpawnMenu() {
    const sm = document.getElementById("spawnMenu");
    if (!sm) return;
    const tab = SPAWN_TABS[spawnMenuTab];

    }

    let contentHtml;
    if (tab.id === "post" && spawnMenuCat === 0) {
      contentHtml = renderPostProcessPanel();

    const mdlDz = sm.querySelector("#mdlDropzone");
    if (mdlDz) {

        input.type = "file";

            await handleMDLDrop([...input.files]);

        input.click();

      mdlDz.ondragover = (e) => { e.preventDefault(); mdlDz.classList.add("dragover"); };
      mdlDz.ondragleave = () => { mdlDz.classList.remove("dragover"); };
      mdlDz.ondrop = async (e) => {
        e.preventDefault();
        mdlDz.classList.remove("dragover");

          closeSpawnMenu();
          await handleMDLDrop(files);
        }
      };

    sm.querySelectorAll("[data-vm-load]").forEach(btn => {
      btn.onclick = async () => {
        const weaponId = btn.dataset.vmLoad;
        const input = document.createElement("input");
        input.type = "file";
        input.multiple = true;
        input.accept = ".mdl,.vvd,.vtx,.vmt,.vtf";
        input.onchange = async () => {
          if (input.files.length === 0) return;
          const files = [...input.files];
          const fileMap = {};
          for (const f of files) {
            const n = f.name.toLowerCase();
            if (n.endsWith('.mdl')) fileMap.mdl = f;
            else if (n.endsWith('.vvd')) fileMap.vvd = f;
            else if (n.endsWith('.vtx') || n.endsWith('.dx90.vtx')) fileMap.vtx = f;
            else if (n.endsWith('.vmt')) { fileMap.vmts = fileMap.vmts || []; fileMap.vmts.push(f); }
            else if (n.endsWith('.vtf')) { fileMap.vtfs = fileMap.vtfs || []; fileMap.vtfs.push(f); }
          }
          if (!fileMap.mdl || !fileMap.vvd || !fileMap.vtx) {
            consoleLog("Need .mdl, .vvd, and .dx90.vtx files", "err");
            return;
          }
          if (!window.loadSourceModelFromBuffers) await ensureMDLLoader();
          const mdlBuf = await fileMap.mdl.arrayBuffer();
          const vvdBuf = await fileMap.vvd.arrayBuffer();
          const vtxBuf = await fileMap.vtx.arrayBuffer();
          let textureFiles = null;
          if ((fileMap.vmts && fileMap.vmts.length) || (fileMap.vtfs && fileMap.vtfs.length)) {
            textureFiles = { vmts: {}, vtfs: {} };
            for (const f of (fileMap.vmts || [])) {
              textureFiles.vmts[f.name.toLowerCase().replace(/\.vmt$/, '')] = await f.text();
            }
            for (const f of (fileMap.vtfs || [])) {
              textureFiles.vtfs[f.name.toLowerCase().replace(/\.vtf$/, '')] = await f.arrayBuffer();
            }
          }
          await loadMDLAsViewmodel(mdlBuf, vvdBuf, vtxBuf, weaponId, textureFiles);
          renderSpawnMenu();
        };
        input.click();
      };

  let currentPostProcess = null;
  let ppParams = { brightness: 1, contrast: 1, saturation: 1, blur: 0 };
  let ppState = {
    motionBlur: 0,
    dofStrength: 0,
    dofFocalDist: 15,
    dofFocalRange: 8,
    shadowQuality: 2,
  };
  let ppRT = null, ppRTprev = null, ppRTblur = null;
  let ppScene = null, ppCamera = null, ppQuad = null;
  let ppMotionMat = null, ppDOFMat = null, ppBlurHMat = null, ppBlurVMat = null, ppCopyMat = null;
  let ppInit = false;

  function initPostProcessRTs(g) {
    const T = THREE;
    const w = window.innerWidth;
    const h = window.innerHeight;
    const rtOpts = { type: T.UnsignedByteType, format: T.RGBAFormat, minFilter: T.LinearFilter, magFilter: T.LinearFilter };
    ppRT = new T.WebGLRenderTarget(w, h, rtOpts);
    ppRTprev = new T.WebGLRenderTarget(w, h, rtOpts);
    ppRTblur = new T.WebGLRenderTarget(w, h, rtOpts);
    ppScene = new T.Scene();
    ppCamera = new T.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const quadGeo = new T.PlaneGeometry(2, 2);

    const vs = `varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position, 1.0); }`;

    ppMotionMat = new T.ShaderMaterial({
      uniforms: { tCurrent: { value: null }, tPrevious: { value: null }, blend: { value: 0 } },
      vertexShader: vs,
      fragmentShader: `
        uniform sampler2D tCurrent; uniform sampler2D tPrevious; uniform float blend;
        varying vec2 vUv;
        void main() {
          vec4 cur = texture2D(tCurrent, vUv);
          vec4 prev = texture2D(tPrevious, vUv);
          gl_FragColor = mix(cur, prev, blend);
        }`,
      depthTest: false, depthWrite: false,
    });

    ppDOFMat = new T.ShaderMaterial({
      uniforms: {
        tDiffuse: { value: null },
        tBlur: { value: null },
        dofStrength: { value: 0 },
        focalDist: { value: 15 },
        focalRange: { value: 8 },
      },
      vertexShader: vs,
      fragmentShader: `
        uniform sampler2D tDiffuse; uniform sampler2D tBlur;
        uniform float dofStrength; uniform float focalDist; uniform float focalRange;
        varying vec2 vUv;
        void main() {
          vec4 sharp = texture2D(tDiffuse, vUv);
          vec4 blurred = texture2D(tBlur, vUv);
          float depth = distance(vec3(0.0), vec3(0.0)); // placeholder
          float coc = dofStrength * 0.5;
          gl_FragColor = mix(sharp, blurred, coc);
        }`,
      depthTest: false, depthWrite: false,
    });

    ppBlurHMat = new T.ShaderMaterial({
      uniforms: { tDiffuse: { value: null }, resolution: { value: new T.Vector2(w, h) }, radius: { value: 4.0 } },
      vertexShader: vs,
      fragmentShader: `
        uniform sampler2D tDiffuse; uniform vec2 resolution; uniform float radius;
        varying vec2 vUv;
        void main() {
          vec4 sum = vec4(0.0);
          float total = 0.0;
          for (float i = -4.0; i <= 4.0; i += 1.0) {
            float w = 1.0 - abs(i) / 4.0;
            sum += texture2D(tDiffuse, vUv + vec2(i * radius / resolution.x, 0.0)) * w;
            total += w;
          }
          gl_FragColor = sum / total;
        }`,
      depthTest: false, depthWrite: false,
    });

    ppBlurVMat = new T.ShaderMaterial({
      uniforms: { tDiffuse: { value: null }, resolution: { value: new T.Vector2(w, h) }, radius: { value: 4.0 } },
      vertexShader: vs,
      fragmentShader: `
        uniform sampler2D tDiffuse; uniform vec2 resolution; uniform float radius;
        varying vec2 vUv;
        void main() {
          vec4 sum = vec4(0.0);
          float total = 0.0;
          for (float i = -4.0; i <= 4.0; i += 1.0) {
            float w = 1.0 - abs(i) / 4.0;
            sum += texture2D(tDiffuse, vUv + vec2(0.0, i * radius / resolution.y)) * w;
            total += w;
          }
          gl_FragColor = sum / total;
        }`,
      depthTest: false, depthWrite: false,
    });

    ppCopyMat = new T.ShaderMaterial({
      uniforms: { tDiffuse: { value: null } },
      vertexShader: vs,
      fragmentShader: `uniform sampler2D tDiffuse; varying vec2 vUv; void main() { gl_FragColor = texture2D(tDiffuse, vUv); }`,
      depthTest: false, depthWrite: false,
    });

    ppQuad = new T.Mesh(quadGeo, ppCopyMat);
    ppScene.add(ppQuad);
    ppInit = true;
  }

  function resizePostProcessRTs(w, h) {
    if (!ppInit) return;
    ppRT.setSize(w, h);
    ppRTprev.setSize(w, h);
    ppRTblur.setSize(w, h);
    ppBlurHMat.uniforms.resolution.value.set(w, h);
    ppBlurVMat.uniforms.resolution.value.set(w, h);
  }

  function applyShadowQuality(g, level) {
    const T = THREE;
    ppState.shadowQuality = level;
    let sun = null;
    g.scene.traverse(o => { if (o.isDirectionalLight && o.castShadow) sun = o; });
    if (!sun) return;
    if (level === 0) {
      g.renderer.shadowMap.enabled = false;
      return;
    }
    g.renderer.shadowMap.enabled = true;
    const sizes = [0, 512, 1024, 2048, 4096];
    sun.shadow.mapSize.set(sizes[level], sizes[level]);
    sun.shadow.camera.left = -(25 + level * 15);
    sun.shadow.camera.right = 25 + level * 15;
    sun.shadow.camera.top = 25 + level * 15;
    sun.shadow.camera.bottom = -(25 + level * 15);
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 300;
    sun.shadow.bias = -0.0003 - level * 0.00005;
    sun.shadow.normalBias = level >= 3 ? 0.02 : 0.01;
    g.renderer.shadowMap.type = level >= 3 ? T.PCFSoftShadowMap : T.PCFShadowMap;
    sun.shadow.needsUpdate = true;
    sun.shadow.map?.dispose();
    sun.shadow.map = null;
  }

  function applyDOFPreset(preset) {
    ppState.dofStrength = preset.dof || 0;
    ppState.dofFocalDist = preset.focalDist || 15;
    ppState.dofFocalRange = preset.focalRange || 8;
  }

  function applyMotionBlurPreset(preset) {
    ppState.motionBlur = preset.motionBlur || 0;
  }

  function renderWithPostProcess(g, dt) {
    const T = THREE;
    if (!ppInit) initPostProcessRTs(g);
    const r = g.renderer;
    const hasMotionBlur = ppState.motionBlur > 0.01;
    const hasDOF = ppState.dofStrength > 0.01;
    const needsRT = hasMotionBlur || hasDOF;

    if (!needsRT) {
      r.autoClear = true;
      r.render(g.scene, g.camera);
      return;
    }

    r.setRenderTarget(ppRT);
    r.clear();
    r.render(g.scene, g.camera);

    let currentRT = ppRT;

    if (hasDOF) {
      ppBlurHMat.uniforms.tDiffuse.value = currentRT.texture;
      ppBlurHMat.uniforms.radius.value = 3 + ppState.dofStrength * 6;
      ppQuad.material = ppBlurHMat;
      r.setRenderTarget(ppRTblur);
      r.clear();
      r.render(ppScene, ppCamera);
      ppBlurVMat.uniforms.tDiffuse.value = ppRTblur.texture;
      ppBlurVMat.uniforms.radius.value = 3 + ppState.dofStrength * 6;
      ppQuad.material = ppBlurVMat;
      r.setRenderTarget(ppRTblur);
      r.clear();
      r.render(ppScene, ppCamera);
      ppDOFMat.uniforms.tDiffuse.value = currentRT.texture;
      ppDOFMat.uniforms.tBlur.value = ppRTblur.texture;
      ppDOFMat.uniforms.dofStrength.value = ppState.dofStrength;
      ppDOFMat.uniforms.focalDist.value = ppState.dofFocalDist;
      ppDOFMat.uniforms.focalRange.value = ppState.dofFocalRange;
      ppQuad.material = ppDOFMat;
      r.setRenderTarget(ppRTprev);
      r.clear();
      r.render(ppScene, ppCamera);
      currentRT = ppRTprev;
      const tmp = ppRT; ppRT = ppRTprev; ppRTprev = tmp; currentRT = ppRT;
    }

    if (hasMotionBlur) {
      ppMotionMat.uniforms.tCurrent.value = currentRT.texture;
      ppMotionMat.uniforms.tPrevious.value = ppRTprev.texture;
      ppMotionMat.uniforms.blend.value = ppState.motionBlur;
      ppQuad.material = ppMotionMat;
      r.setRenderTarget(ppRTblur);
      r.clear();
      r.render(ppScene, ppCamera);
      const tmp = ppRTblur; ppRTblur = ppRTprev; ppRTprev = tmp;
      currentRT = ppRTprev;
    } else {
      ppCopyMat.uniforms.tDiffuse.value = currentRT.texture;
      ppQuad.material = ppCopyMat;
      r.setRenderTarget(ppRTprev);
      r.clear();
      r.render(ppScene, ppCamera);
    }

    ppCopyMat.uniforms.tDiffuse.value = currentRT.texture;
    ppQuad.material = ppCopyMat;
    r.setRenderTarget(null);
    r.clear();
    r.render(ppScene, ppCamera);
  }

  let vtaTweaks = {};
  let vtaWeapon = "pistol";
  let vtaShowPreview = true;
  function initVTATweaks() {
    if (Object.keys(vtaTweaks).length) return;
    for (const wid in VIEWMODEL_PRESETS) {
      const p = VIEWMODEL_PRESETS[wid];
      vtaTweaks[wid] = {
        pos: [...p.pos],
        rot: [...p.rot],
        scale: p.scale || 1.0,
        target: p.target || 0.2,
      };
    }
  }
  function applyVTAToViewmodel(wid) {
    const t = vtaTweaks[wid];
    if (!t) return;
    const cv = customViewmodels[wid];
    if (cv) {
      cv.wrapper.position.set(t.pos[0], t.pos[1], t.pos[2]);
      cv.wrapper.rotation.set(t.rot[0], t.rot[1], t.rot[2]);
      cv.wrapper.userData.basePos = cv.wrapper.position.clone();
      cv.wrapper.userData.baseRot = cv.wrapper.rotation.clone();
      const box = new THREE.Box3().setFromObject(cv.group);
      const sz = new THREE.Vector3(); box.getSize(sz);
      const maxDim = Math.max(sz.x, sz.y, sz.z);
      if (maxDim > 0) {
        const rawMax = maxDim / cv.group.scale.x;
        const newScale = t.target / rawMax;
        cv.group.scale.setScalar(newScale * t.scale);
      }
    }
    if (viewModels[wid]) {
      const vm = viewModels[wid];
      vm.position.set(t.pos[0], t.pos[1], t.pos[2]);
      vm.rotation.set(t.rot[0], t.rot[1], t.rot[2]);
      vm.scale.setScalar(t.scale);
      if (vm.userData.basePos) vm.userData.basePos = vm.position.clone();
      if (vm.userData.baseRot) vm.userData.baseRot = vm.rotation.clone();
    }
  }
  function applyVTAAll() {
    for (const wid in vtaTweaks) applyVTAToViewmodel(wid);
  }
  function generateVTACode() {
    let out = "  const VIEWMODEL_PRESETS = {\n";
    for (const wid in vtaTweaks) {

      out += `    ${key}:  { pos: [${t.pos.map(v=>v.toFixed(4)).join(', ')}], rot: [${t.rot.map(v=>v.toFixed(4)).join(', ')}], scale: ${t.scale.toFixed(2)}, target: ${t.target.toFixed(2)} },\n`;
    }
    out += "  };";
    return out;
  }

      <div style="display:flex;gap:24px;flex-wrap:wrap;margin-top:12px;">
        <div style="flex:1;min-width:240px;">
          <h3 style="color:#ffb020;font-size:13px;margin-bottom:8px;">Scale</h3>
          ${slider('Scale multiplier', 'scale', 0.1, 3, 0.01, t.scale)}
          ${slider('Target size (max dim)', 'target', 0.05, 0.8, 0.005, t.target)}
        </div>
        <div style="flex:1;min-width:240px;display:flex;flex-direction:column;gap:8px;justify-content:flex-end;">
          <button class="sm-toolbtn" id="vtaPreview" style="font-size:12px;">${vtaShowPreview?'Hide Preview':'Show Preview'}</button>
          <button class="sm-toolbtn" id="vtaSwitchWeapon" style="font-size:12px;">Switch to this weapon</button>
          <button class="sm-toolbtn" id="vtaReset" style="font-size:12px;">Reset to defaults</button>
        </div>
      </div>
      <div style="margin-top:20px;border-top:1px solid rgba(255,255,255,0.1);padding-top:16px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <h3 style="color:#6ada6a;font-size:13px;">Generated Code (replace VIEWMODEL_PRESETS)</h3>
          <button class="sm-toolbtn" id="vtaCopy" style="font-size:12px;">📋 Copy</button>
        </div>
        <textarea id="vtaCode" class="lua-code" style="width:100%;height:180px;font-size:11px;" readonly>${generateVTACode()}</textarea>
      </div>
      <div style="margin-top:8px;font-size:11px;color:#5f6a6d;">
        Tip: Switch to the weapon you're tweaking, then adjust sliders. The viewmodel updates live.
        Press Copy when done, then paste over the VIEWMODEL_PRESETS in index.html.
      </div>
    </div>`;
  }

  function renderPostProcessPanel() {
    const presetCards = POSTPROCESS_PRESETS.map((p, i) => renderSpawnCard(p, i)).join("");
    const sliders = [
      { key: "brightness", label: "Brightness", min: 0.3, max: 2, step: 0.05, val: ppParams.brightness },
      { key: "contrast", label: "Contrast", min: 0.3, max: 2, step: 0.05, val: ppParams.contrast },
      { key: "saturation", label: "Saturation", min: 0, max: 3, step: 0.05, val: ppParams.saturation },
      { key: "blur", label: "Blur", min: 0, max: 5, step: 0.1, val: ppParams.blur },
    ].map(s =>
      '<div class="sm-pp-row"><span class="lbl">' + s.label + '</span><span class="val">' +
      '<input type="range" class="slider" min="' + s.min + '" max="' + s.max + '" step="' + s.step + '" value="' + s.val + '" data-pp-slider="' + s.key + '">' +
      '<span style="font-size:11px;color:#8a9498;width:32px;text-align:right;" id="ppVal_' + s.key + '">' + s.val.toFixed(2) + '</span>' +
      '</span></div>'
    ).join("");
    return '<div style="max-width:520px;">' +
      '<h3 style="color:rgb(255,160,0);font-size:14px;margin-bottom:12px;">Presets</h3>' +
      '<div class="sm-grid">' + presetCards + '</div>' +
      '<h3 style="color:rgb(255,160,0);font-size:14px;margin:20px 0 8px;">Custom Adjustments</h3>' +
      sliders +
      '<button class="sm-toolbtn" style="margin-top:16px;" data-pp="none">Reset All</button>' +
    '</div>';
  }

  function applyPostProcess(presetId) {
    const preset = POSTPROCESS_PRESETS.find(p => p.id === presetId);
    if (!preset) return;
    currentPostProcess = preset;
    if (presetId === "none") {
      ppParams = { brightness: 1, contrast: 1, saturation: 1, blur: 0 };
    }
    updatePostProcessFilter();
  }

  function updatePostProcessParam(key, val) {
    ppParams[key] = val;
    const valEl = document.getElementById("ppVal_" + key);
    if (valEl) valEl.textContent = val.toFixed(2);
    currentPostProcess = null;
    updatePostProcessFilter();
  }

  function updatePostProcessFilter() {
    if (!game || !game.canvas) return;
    let filter;
    if (currentPostProcess && currentPostProcess.id !== "none") {
      filter = currentPostProcess.filter;
    } else {
      const parts = [];
      if (ppParams.brightness !== 1) parts.push("brightness(" + ppParams.brightness + ")");
      if (ppParams.contrast !== 1) parts.push("contrast(" + ppParams.contrast + ")");
      if (ppParams.saturation !== 1) parts.push("saturate(" + ppParams.saturation + ")");
      if (ppParams.blur > 0) parts.push("blur(" + ppParams.blur + "px)");
      filter = parts.length > 0 ? parts.join(" ") : "none";
    }
    game.canvas.style.filter = filter;
  }

  let vmakerParts = []; // [{id, shape, size:[w,h,d], pos:[x,y,z], rot:[x,y,z], material, glow, color, name}]
  let vmakerSelectedPart = -1;
  let vmakerWeapon = "pistol";
  let vmakerBodyColor = 0x2a2a2e;
  let vmakerAccentColor = 0x4a4a52;
  let vmakerGlowColor = 0x00ffff;
  let vmakerPreviewGroup = null;
  let vmakerNextId = 1;

  function vmakerShapes() {
    return [
      { id: "box", name: "Box", icon: "📦" },
      { id: "cylinder", name: "Cylinder", icon: "🥫" },
      { id: "sphere", name: "Sphere", icon: "⚽" },
      { id: "torus", name: "Torus", icon: "🍩" },
    ];
  }

  function vmakerBuildPreview() {
    if (!viewScene) return;
    if (vmakerPreviewGroup) {
      viewScene.remove(vmakerPreviewGroup);
      vmakerPreviewGroup.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); });
    }
    const T = THREE;
    const g = new T.Group();
    const matBody = new T.MeshStandardMaterial({ color: vmakerBodyColor, roughness: 0.4, metalness: 0.7 });
    const matAccent = new T.MeshStandardMaterial({ color: vmakerAccentColor, roughness: 0.5, metalness: 0.6 });
    const matDark = new T.MeshStandardMaterial({ color: 0x141418, roughness: 0.7, metalness: 0.3 });
    const matGrip = new T.MeshStandardMaterial({ color: 0x1e1e22, roughness: 0.8, metalness: 0.1 });
    const matGlow = new T.MeshStandardMaterial({ color: vmakerGlowColor, emissive: vmakerGlowColor, emissiveIntensity: 2.0, roughness: 0.2, metalness: 0.1 });
    for (const p of vmakerParts) {
      let geo;
      const s = p.size;
      if (p.shape === "cylinder") {
        geo = new T.CylinderGeometry(Math.max(0.001, s[0]), Math.max(0.001, s[0]), Math.max(0.001, s[1]), 12);
      } else if (p.shape === "sphere") {
        geo = new T.SphereGeometry(Math.max(0.001, s[0]), 12, 8);
      } else if (p.shape === "torus") {
        geo = new T.TorusGeometry(Math.max(0.001, s[0]), Math.max(0.001, s[1] || 0.005), 8, 16);
      } else {
        geo = new T.BoxGeometry(Math.max(0.001, s[0]), Math.max(0.001, s[1]), Math.max(0.001, s[2]));
      }
      let mat;
      if (p.glow) mat = matGlow;
      else if (p.material === "accent") mat = matAccent;
      else if (p.material === "dark") mat = matDark;
      else if (p.material === "grip") mat = matGrip;
      else mat = matBody;
      const m = new T.Mesh(geo, mat);
      m.position.set(p.pos[0], p.pos[1], p.pos[2]);
      m.rotation.set(p.rot[0], p.rot[1], p.rot[2]);
      m.userData.partId = p.id;
      g.add(m);
    }
    g.position.set(0.1, -0.12, -0.25);
    g.rotation.set(0, -0.05, 0);
    g.userData.basePos = g.position.clone();
    g.userData.baseRot = g.rotation.clone();
    g.userData.parts = {};
    g.userData.muzzle = new T.Vector3(0, 0, -0.3);
    viewScene.add(g);
    vmakerPreviewGroup = g;
    for (const wid in viewModels) viewModels[wid].visible = false;
    for (const wid in customViewmodels) customViewmodels[wid].wrapper.visible = false;
    g.visible = true;
  }

  function vmakerAddPart(shape) {
    const part = {
      id: vmakerNextId++,
      shape,
      size: shape === "box" ? [0.05, 0.05, 0.2] : shape === "cylinder" ? [0.03, 0.2] : shape === "sphere" ? [0.03] : [0.03, 0.008],
      pos: [0, 0, -0.1],
      rot: [0, 0, 0],
      material: "body",
      glow: false,
      name: "",
    };
    vmakerParts.push(part);
    vmakerSelectedPart = vmakerParts.length - 1;
    vmakerBuildPreview();
    renderSpawnMenu();
  }

  function vmakerRemovePart(id) {
    const idx = vmakerParts.findIndex(p => p.id === id);
    if (idx < 0) return;
    vmakerParts.splice(idx, 1);
    if (vmakerSelectedPart >= vmakerParts.length) vmakerSelectedPart = vmakerParts.length - 1;
    vmakerBuildPreview();
    renderSpawnMenu();
  }

  function vmakerSelectPart(id) {
    vmakerSelectedPart = vmakerParts.findIndex(p => p.id === id);
    renderSpawnMenu();
  }

  function vmakerUpdatePart(id, key, val) {
    const p = vmakerParts.find(p => p.id === id);
    if (!p) return;
    if (key === "shape") { p.shape = val; }
    else if (key === "material") { p.material = val; }
    else if (key === "glow") { p.glow = val; }
    else if (key === "name") { p.name = val; }
    else if (key.startsWith("size_")) { p.size[parseInt(key.split("_")[1])] = val; }
    else if (key.startsWith("pos_")) { p.pos[parseInt(key.split("_")[1])] = val; }
    else if (key.startsWith("rot_")) { p.rot[parseInt(key.split("_")[1])] = val; }
    vmakerBuildPreview();
  }

  function vmakerExportJSON() {
    const spec = {
      bodyColor: vmakerBodyColor,
      accentColor: vmakerAccentColor,
      glowColor: vmakerGlowColor,
      parts: vmakerParts.map(p => ({
        shape: p.shape,
        size: p.size.map(v => +v.toFixed(4)),
        pos: p.pos.map(v => +v.toFixed(4)),
        rot: p.rot.map(v => +v.toFixed(4)),
        material: p.material,
        glow: p.glow,
        ...(p.name ? { name: p.name } : {})
      }))
    };
    return JSON.stringify(spec, null, 2);
  }

  function vmakerFindAddon() {
    const w = WEAPONS.find(w => w.id === vmakerWeapon);
    if (!w) return null;
    return customAddons.find(a => a.data?.weapons?.some(aw => aw.id === w.id));
  }

  function vmakerSaveToAddon() {
    const addon = vmakerFindAddon();
    if (!addon) { consoleLog("Could not find addon for this weapon", "err"); return; }
    const w = WEAPONS.find(w => w.id === vmakerWeapon);
    const spec = JSON.parse(vmakerExportJSON());
    let weaponInAddon = addon.data.weapons.find(aw => aw.id === w.id);
    if (weaponInAddon) {
      weaponInAddon.viewmodel = spec;
    }
    w.viewmodel = spec;
    if (viewModels[w.id]) {
      viewScene.remove(viewModels[w.id]);
      viewModels[w.id].traverse(o => { if (o.geometry) o.geometry.dispose(); });
      delete viewModels[w.id];
    }
    if (customViewmodels[w.id]) {
      viewScene.remove(customViewmodels[w.id].wrapper);
      customViewmodels[w.id].wrapper.traverse(o => { if (o.geometry) o.geometry.dispose(); });
      delete customViewmodels[w.id];
    }
    if (viewScene) {
      const vm = buildCustomViewmodel(w);
      if (vm) {
        viewModels[w.id] = vm;
        if (vtaTweaks[w.id]) applyVTAToViewmodel(w.id);
        if (WEAPONS[currentWeapon] && WEAPONS[currentWeapon].id === w.id) showViewModel(w.id);
      }
    }
    viewmodelOverrideCache[w.id] = spec;
    if (window.root && window.root.kv) {
      window.root.kv.addons.set(addon.id, addon).catch(e => console.warn("Failed to save addon:", e));
      window.root.kv.viewmodelOverrides.set(w.id, spec).catch(()=>{});
    }
    renderSpawnMenu();
    consoleLog("Viewmodel saved to addon: " + addon.name, "ok");
  }

  function vmakerExportAddonJSON() {
    const addon = vmakerFindAddon();
    if (!addon) return vmakerExportJSON();
    const w = WEAPONS.find(w => w.id === vmakerWeapon);
    const spec = JSON.parse(vmakerExportJSON());
    const clone = JSON.parse(JSON.stringify(addon.data));
    if (clone.weapons) {
      const aw = clone.weapons.find(x => x.id === w.id);
      if (aw) aw.viewmodel = spec;
    }
    return JSON.stringify(clone, null, 2);
  }

  function vmakerApplyToWeapon() {
    const w = WEAPONS.find(w => w.id === vmakerWeapon);
    if (!w) return;
    w.viewmodel = JSON.parse(vmakerExportJSON());
    viewmodelOverrideCache[w.id] = w.viewmodel;
    if (window.root && window.root.kv) {
      window.root.kv.viewmodelOverrides.set(w.id, w.viewmodel).catch(e => console.warn("Failed to save viewmodel override:", e));
    }
    if (viewModels[w.id]) {
      viewScene.remove(viewModels[w.id]);
      viewModels[w.id].traverse(o => { if (o.geometry) o.geometry.dispose(); });
      delete viewModels[w.id];
    }
    if (customViewmodels[w.id]) {
      viewScene.remove(customViewmodels[w.id].wrapper);
      customViewmodels[w.id].wrapper.traverse(o => { if (o.geometry) o.geometry.dispose(); });
      delete customViewmodels[w.id];
    }
    if (viewScene) {
      const vm = buildCustomViewmodel(w);
      if (vm) {
        viewModels[w.id] = vm;
        if (vtaTweaks[w.id]) applyVTAToViewmodel(w.id);
      }
    }
    const idx = WEAPONS.indexOf(w);
    if (idx >= 0) currentWeapon = idx;
    if (vmakerPreviewGroup) vmakerPreviewGroup.visible = false;
    showViewModel(w.id);
    renderSpawnMenu();
  }

  async function applyStoredViewmodelOverride(w) {
    if (!w) return;
    if (!w.viewmodel) return;
    if (viewScene && viewModels[w.id]) {
      viewScene.remove(viewModels[w.id]);
      viewModels[w.id].traverse(o => { if (o.geometry) o.geometry.dispose(); });
      delete viewModels[w.id];
      const vm = buildCustomViewmodel(w);
      if (vm) {
        viewModels[w.id] = vm;
        if (vtaTweaks[w.id]) applyVTAToViewmodel(w.id);
        if (WEAPONS[currentWeapon] && WEAPONS[currentWeapon].id === w.id) showViewModel(w.id);
      }
    }
  }

  function vmakerLoadFromWeapon() {
    const w = WEAPONS.find(w => w.id === vmakerWeapon);
    if (!w || !w.viewmodel) return;
    const spec = w.viewmodel;
    vmakerBodyColor = spec.bodyColor || 0x2a2a2e;
    vmakerAccentColor = spec.accentColor || 0x4a4a52;
    vmakerGlowColor = spec.glowColor || 0x00ffff;
    vmakerParts = (spec.parts || []).map(p => ({
      id: vmakerNextId++,
      shape: p.shape,
      size: [...p.size],
      pos: [...p.pos],
      rot: [...p.rot],
      material: p.material || "body",
      glow: p.glow || false,
      name: p.name || "",
    }));
    vmakerSelectedPart = vmakerParts.length > 0 ? 0 : -1;
    vmakerBuildPreview();
    renderSpawnMenu();
  }

  function vmakerClear() {
    vmakerParts = [];
    vmakerSelectedPart = -1;
    if (vmakerPreviewGroup) {
      viewScene.remove(vmakerPreviewGroup);
      vmakerPreviewGroup.traverse(o => { if (o.geometry) o.geometry.dispose(); });
      vmakerPreviewGroup = null;
    }
    renderSpawnMenu();
  }

  function vmakerResetOverride() {
    const w = WEAPONS.find(w => w.id === vmakerWeapon);
    if (!w) return;
    delete w.viewmodel;
    delete viewmodelOverrideCache[w.id];
    if (window.root && window.root.kv) {
      window.root.kv.viewmodelOverrides.delete(w.id).catch(e => console.warn("Failed to delete viewmodel override:", e));
    }
    if (viewModels[w.id]) {
      viewScene.remove(viewModels[w.id]);
      viewModels[w.id].traverse(o => { if (o.geometry) o.geometry.dispose(); });
      delete viewModels[w.id];
    }
    if (viewScene) {
      const vm = buildCustomViewmodel(w);
      if (vm) {
        viewModels[w.id] = vm;
        if (vtaTweaks[w.id]) applyVTAToViewmodel(w.id);
        if (WEAPONS[currentWeapon] && WEAPONS[currentWeapon].id === w.id) showViewModel(w.id);
      }
    }
    vmakerClear();
  }

  function vmakerHex(n) { return "#" + n.toString(16).padStart(6, "0"); }
  function vmakerParseHex(h) { return parseInt(h.replace("#", ""), 16); }

  function renderVMakerPanel() {
    if (!viewScene) return '<div class="sm-empty">Start a game first to use the Viewmodel Builder.</div>';
    if (!vmakerPreviewGroup && vmakerParts.length > 0) vmakerBuildPreview();
    if (!vmakerPreviewGroup && vmakerParts.length === 0) {
      for (const wid in viewModels) viewModels[wid].visible = false;
      for (const wid in customViewmodels) customViewmodels[wid].wrapper.visible = false;
    }

    if (customWeapons.length === 0) {
      return '<div class="sm-empty">No addon weapons loaded.<br><br>Install an addon with weapons (via the Addons panel) to build viewmodels for them.</div>';
    }
    if (!customWeapons.find(w => w.id === vmakerWeapon)) vmakerWeapon = customWeapons[0].id;

    const weaponOpts = customWeapons.map(w =>
      `<option value="${w.id}" ${w.id === vmakerWeapon ? 'selected' : ''}>${w.name}</option>`
    ).join('');

    const shapeBtns = vmakerShapes().map(s =>
      `<button class="sm-toolbtn" data-vmaker-add="${s.id}" style="font-size:12px;padding:6px 10px;">${s.icon} ${s.name}</button>`
    ).join('');

    const partRows = vmakerParts.map((p, i) => {
      const sel = i === vmakerSelectedPart;
      const shapeIcon = vmakerShapes().find(s => s.id === p.shape)?.icon || "❓";
      return `<div class="mapitem ${sel ? 'sel' : ''}" style="cursor:pointer;" data-vmaker-select="${p.id}">
        <div class="ico">${shapeIcon}</div>
        <div style="flex:1;"><div class="nm">${p.name || p.shape + ' #' + p.id}</div><div class="gm">${p.material}${p.glow ? ' • glow' : ''}</div></div>
        <button class="pbtn" style="padding:2px 6px;font-size:11px;color:#ff6464;" data-vmaker-del="${p.id}">×</button>
      </div>`;
    }).join('');

    const part = vmakerSelectedPart >= 0 ? vmakerParts[vmakerSelectedPart] : null;

    const slider = (label, key, min, max, step, val) =>
      `<div class="sm-pp-row"><span class="lbl">${label}</span><span class="val">` +
      `<input type="range" class="slider" min="${min}" max="${max}" step="${step}" value="${val}" data-vmaker-prop="${key}" style="width:140px;">` +
      `<span style="font-size:11px;color:#8a9498;width:48px;text-align:right;" id="vmVal_${key}">${val.toFixed(3)}</span>` +
      `</span></div>`;

    let partEditor = '';
    if (part) {
      const matOpts = ["body", "accent", "dark", "grip"].map(m =>
        `<option value="${m}" ${part.material === m ? 'selected' : ''}>${m}</option>`
      ).join('');
      const shapeOpts = vmakerShapes().map(s =>
        `<option value="${s.id}" ${part.shape === s.id ? 'selected' : ''}>${s.name}</option>`
      ).join('');
      let sizeSliders = '';
      if (part.shape === "box") {
        sizeSliders = slider("Width", "size_0", 0.005, 0.3, 0.001, part.size[0]) +
                      slider("Height", "size_1", 0.005, 0.3, 0.001, part.size[1]) +
                      slider("Depth", "size_2", 0.005, 0.3, 0.001, part.size[2]);
      } else if (part.shape === "cylinder") {
        sizeSliders = slider("Radius", "size_0", 0.005, 0.3, 0.001, part.size[0]) +
                      slider("Length", "size_1", 0.005, 0.3, 0.001, part.size[1]);
      } else if (part.shape === "sphere") {
        sizeSliders = slider("Radius", "size_0", 0.005, 0.3, 0.001, part.size[0]);
      } else if (part.shape === "torus") {
        sizeSliders = slider("Radius", "size_0", 0.005, 0.3, 0.001, part.size[0]) +
                      slider("Tube", "size_1", 0.002, 0.05, 0.001, part.size[1]);
      }
      partEditor = `
        <div style="border:1px solid rgba(255,160,0,0.3);border-radius:4px;padding:12px;margin-top:12px;background:rgba(255,160,0,0.03);">
          <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px;">
            <span style="color:#ffb020;font-size:13px;font-weight:700;">Edit Part #${part.id}</span>
            <select class="sel" data-vmaker-prop-sel="shape" style="font-size:11px;">${shapeOpts}</select>
            <select class="sel" data-vmaker-prop-sel="material" style="font-size:11px;">${matOpts}</select>
            <label style="font-size:11px;color:#8a9498;display:flex;align-items:center;gap:4px;">
              <input type="checkbox" data-vmaker-prop-chk="glow" ${part.glow ? 'checked' : ''}> Glow
            </label>
          </div>
          <div style="display:flex;gap:20px;flex-wrap:wrap;">
            <div style="flex:1;min-width:180px;">
              <div style="color:#6ada6a;font-size:11px;margin-bottom:4px;">Size</div>
              ${sizeSliders}
            </div>
            <div style="flex:1;min-width:180px;">
              <div style="color:#6ada6a;font-size:11px;margin-bottom:4px;">Position</div>
              ${slider("X", "pos_0", -0.5, 0.5, 0.002, part.pos[0])}
              ${slider("Y", "pos_1", -0.5, 0.5, 0.002, part.pos[1])}
              ${slider("Z", "pos_2", -0.5, 0.5, 0.002, part.pos[2])}
            </div>
            <div style="flex:1;min-width:180px;">
              <div style="color:#6ada6a;font-size:11px;margin-bottom:4px;">Rotation (rad)</div>
              ${slider("X", "rot_0", -3.14, 3.14, 0.01, part.rot[0])}
              ${slider("Y", "rot_1", -3.14, 3.14, 0.01, part.rot[1])}
              ${slider("Z", "rot_2", -3.14, 3.14, 0.01, part.rot[2])}
            </div>
          </div>
          <div style="margin-top:8px;">
            <span style="color:#8a9498;font-size:11px;">Name (optional):</span>
            <input type="text" data-vmaker-prop-text="name" value="${part.name || ''}" placeholder="e.g. muzzle, barrel" style="background:#1a1e21;color:#e0e6e8;border:1px solid #000;padding:3px 6px;font-size:11px;border-radius:3px;width:160px;">
          </div>
        </div>`;
    }

    return `<div style="max-width:760px;">
      <div style="display:flex;gap:12px;align-items:center;margin-bottom:12px;flex-wrap:wrap;">
        <span style="color:#ffb020;font-size:14px;font-weight:700;">Weapon:</span>
        <select class="sel" id="vmakerWeaponSelect" style="min-width:140px;">${weaponOpts}</select>
        <button class="sm-toolbtn" id="vmakerLoadBtn" style="font-size:12px;">📥 Load from weapon</button>

  }

  function spawnEntityCrosshair(g, item) {
    const origin = g.player.pos.clone();
    const dir = getCameraForward(g);
    let bestT = 12;
    for (const col of g.colliders) {
      const t = rayAABB(origin, dir, col);
      if (t !== null && t < bestT) bestT = t;
    }
    if (dir.y < -0.01) {
      const t = -origin.y / dir.y;
      if (t > 0 && t < bestT) bestT = t;
    }
    const dist = Math.max(3, bestT - 1.5);
    const pos = origin.add(dir.multiplyScalar(dist));
    spawnEntity3D(g, pos.x, pos.y, pos.z, item);
  }

  function spawnEntity3D(g, x, y, z, item) {
    const prop = makePropMesh(g, item);
    prop.mesh.position.set(x, y, z);
    if (item.color) {
      prop.mesh.traverse(o => { if (o.isMesh && o.material && o.material.color) o.material.color.set(item.color); });
    }
    const C = CANNON;
    let shape;
    if (prop.shape === "ball") {
      shape = new C.Sphere(prop.radius);
    } else {
      const he = prop.halfExtents;
      shape = new C.Box(new C.Vec3(he.x, he.y, he.z));
    }
    const mass = item.mass || 4;
    const body = new C.Body({ mass, shape });
    body.position.set(x, y, z);
    body.linearDamping = 0.05;
    body.angularDamping = 0.08;

    if (item.entity === "balloon") {
      body.linearDamping = 0.3;
    } else if (item.entity === "bouncy") {
      body.material = new C.Material({ restitution: 1.5 });
    } else if (item.entity === "ice") {
      body.material = new C.Material({ friction: 0.01, restitution: 0.1 });
    } else if (item.entity === "heavy") {
      body.linearDamping = 0.2;
      body.angularDamping = 0.2;
    }

    g.world.addBody(body);
    g.scene.add(prop.mesh);
    prop.body = body;

    prop.entity = item.entity;
    prop.entityType = item.id;
    prop.health = item.entity === "explosive" ? 20 : 100;
    prop.exploded = false;
    prop.spawnTime = performance.now();

    if (item.entity === "beacon") {
      const light = new THREE.PointLight(0xffaa00, 2, 15);
      light.position.set(0, 0.5, 0);
      prop.mesh.add(light);
      prop.beaconLight = light;
    }
    if (item.entity === "ammo") {
      const light = new THREE.PointLight(item.color || 0x88aa44, 1.5, 6);
      light.position.set(0, 0.3, 0);
      prop.mesh.add(light);
      prop.beaconLight = light;
      body.linearDamping = 0.4;
      body.angularDamping = 0.4;
    }
    if (item.entity === "balloon") {
      const stringGeo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0, -prop.radius, 0),
        new THREE.Vector3(0, -prop.radius - 1, 0),
      ]);
      const stringLine = new THREE.Line(stringGeo, new THREE.LineBasicMaterial({ color: 0x888888 }));
      prop.mesh.add(stringLine);
    }

    g.props.push(prop);
    callLuaHook("OnEntitySpawned", item.name || "Prop", prop.mesh.position.x, prop.mesh.position.y, prop.mesh.position.z);
    if (g.props.length > 80) {
      const old = g.props.shift();
      removeProp3D(g, old);
    }
    return prop;
  }

  function updateEntities(g, dt) {
    const now = performance.now();
    for (let i = g.props.length - 1; i >= 0; i--) {
      const prop = g.props[i];
      if (prop.ignited) {
        if (now - prop.igniteTime > 5000) {
          prop.ignited = false;
        } else {
          if (prop.breakable && !prop.broken) {
            damageBreakable(g, prop, 10 * dt, prop.mesh.position.clone());
          }
          if (Math.random() < 0.5) {
            const pos = prop.mesh.position.clone();
            pos.x += (Math.random() - 0.5) * 0.5;
            pos.y += Math.random() * 0.5;
            pos.z += (Math.random() - 0.5) * 0.5;
            spawnImpactParticles(g, pos, "metal", 2);
          }
        }
      }
      if (prop.thrusterForce && prop.thrusterMesh) {
        const mode = prop.thrusterMode || "Always On";
        let active = prop.thrusterOn;
        if (mode === "Hold (R)") active = !!game.keys["r"];
        if (active) {
          prop.body.wakeUp();
          const dir = prop.thrusterDir || "up";
          const force = prop.thrusterForce;
          let vx = 0, vy = 0, vz = 0;
          if (dir === "up") vy = force;
          else if (dir === "down") vy = -force;
          else {
            const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(prop.mesh.quaternion);
            if (dir === "fwd") { vx = fwd.x * force; vy = fwd.y * force; vz = fwd.z * force; }
            else { vx = -fwd.x * force; vy = -fwd.y * force; vz = -fwd.z * force; }
          }
          prop.body.force.x += vx * dt;
          prop.body.force.y += vy * dt;
          prop.body.force.z += vz * dt;
          if (Math.random() < 0.6) {
            const flame = new THREE.Mesh(
              new THREE.SphereGeometry(0.06, 6, 4),
              new THREE.MeshBasicMaterial({ color: 0xff6600, transparent: true, opacity: 0.8 })
            );
            const fpos = prop.mesh.position.clone();
            if (dir === "up") fpos.y -= 0.5;
            else if (dir === "down") fpos.y += 0.5;
            else { const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(prop.mesh.quaternion); fpos.add(fwd.multiplyScalar(dir === "fwd" ? -0.5 : 0.5)); }
            flame.position.copy(fpos);
            g.scene.add(flame);
            setTimeout(() => { g.scene.remove(flame); flame.geometry.dispose(); flame.material.dispose(); }, 120);
          }
        }
      }
      if (prop.balloonLift && prop.balloonMesh) {
        prop.body.wakeUp();
        prop.body.force.y += prop.balloonLift * dt * 10;
        prop.balloonMesh.position.copy(prop.mesh.position);
        prop.balloonMesh.position.y += 1.5;
      }
      if (prop.hoverballMesh && prop.hoverballHeight) {
        const groundY = 0;
        const targetY = groundY + prop.hoverballHeight;
        const curY = prop.body.position.y;
        const dy = targetY - curY;
        const str = prop.hoverballStrength || 30;
        if (Math.abs(dy) > 0.5) {
          prop.body.wakeUp();
          prop.body.force.y += dy * str * dt;
          prop.body.velocity.y *= 0.95;
        }
        prop.hoverballMesh.position.copy(prop.mesh.position);
        prop.hoverballMesh.position.y += 2;
      }
      if (prop.keepUpright && prop.uprightTarget && prop.body.type !== CANNON.Body.STATIC) {
        prop.body.wakeUp();
        const tq = prop.uprightTarget;
        const bq = prop.body.quaternion;
        const qErr = new CANNON.Quaternion(tq.x, tq.y, tq.z, tq.w);
        const inv = new CANNON.Quaternion(bq.x, bq.y, bq.z, bq.w);
        inv.conjugate();
        qErr.mult(inv, qErr);
        const angle = 2 * Math.acos(Math.max(-1, Math.min(1, qErr.w)));
        let ax = qErr.x, ay = qErr.y, az = qErr.z;
        const len = Math.sqrt(ax*ax + ay*ay + az*az);
        if (len > 0.001 && angle > 0.01) {
          const k = 40;
          ax /= len; ay /= len; az /= len;
          prop.body.torque.x += ax * angle * k * dt;
          prop.body.torque.y += ay * angle * k * dt;
          prop.body.torque.z += az * angle * k * dt;
          prop.body.angularVelocity.scale(0.9, prop.body.angularVelocity);
        }
      }
      if (prop.trailPoints) {
        prop.trailPoints.push(prop.mesh.position.clone());
        if (prop.trailPoints.length > prop.trailMax) prop.trailPoints.shift();
        if (prop.trailLine && prop.trailPoints.length > 1) {
          const positions = new Float32Array(prop.trailPoints.length * 3);
          for (let j = 0; j < prop.trailPoints.length; j++) {
            positions[j*3] = prop.trailPoints[j].x;
            positions[j*3+1] = prop.trailPoints[j].y;
            positions[j*3+2] = prop.trailPoints[j].z;
          }
          prop.trailLine.geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
          prop.trailLine.geometry.attributes.position.needsUpdate = true;
        }
      }
      if (prop.ropes) {
        for (const r of prop.ropes) {
          if (r.line && r.other && r.other.body) {
            const pos = r.line.geometry.attributes.position;
            pos.setXYZ(0, prop.body.position.x, prop.body.position.y, prop.body.position.z);
            pos.setXYZ(1, r.other.body.position.x, r.other.body.position.y, r.other.body.position.z);
            pos.needsUpdate = true;
          }
        }
      }
      if (!prop.entity) continue;

      if (prop.entity === "balloon") {
        prop.body.wakeUp();
        prop.body.force.y += 60 * dt * (prop.body.mass || 0.1);
        if (prop.body.velocity.y > 5) prop.body.velocity.y = 5;
      } else if (prop.entity === "thruster") {
        prop.body.wakeUp();
        const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(prop.mesh.quaternion);
        prop.body.force.x += fwd.x * 200 * dt;
        prop.body.force.y += fwd.y * 200 * dt;
        prop.body.force.z += fwd.z * 200 * dt;
        if (Math.random() < 0.5) {
          const flame = new THREE.Mesh(
            new THREE.SphereGeometry(0.08, 6, 4),
            new THREE.MeshBasicMaterial({ color: 0xff6600, transparent: true, opacity: 0.7 })
          );
          flame.position.copy(prop.mesh.position).add(fwd.clone().multiplyScalar(-0.3));
          g.scene.add(flame);
          setTimeout(() => { g.scene.remove(flame); flame.geometry.dispose(); flame.material.dispose(); }, 150);
        }
      } else if (prop.entity === "beacon" && prop.beaconLight) {
        prop.beaconLight.intensity = 1.5 + Math.sin(now * 0.005) * 1;
      } else if (prop.entity === "explosive" && !prop.exploded) {
        const speed = prop.body.velocity.length();
        if (speed > 15 || prop.health <= 0) {
          explodeEntity(g, prop);
        }
      } else if (prop.entity === "ammo" && !prop.pickedUp) {
        const dist = prop.body.position.distanceTo(g.player.pos);
        if (dist < 2.5) {
          pickupAmmo(g, prop);
        }
        if (prop.beaconLight) prop.beaconLight.intensity = 1 + Math.sin(now * 0.008) * 0.5;
      }
    }
  }

  const AMMO_REFILL = {
    ammo_pistol:   { pistol: 17, "357": 6 },
    ammo_smg:      { smg1: 90 },
    ammo_ar2:      { ar2: 30 },
    ammo_shotgun:  { shotgun: 12 },
    ammo_rpg:      { rpg: 2 },
    ammo_crossbow: { crossbow: 4 },
    ammo_all:      { pistol: 17, "357": 6, smg1: 90, ar2: 30, shotgun: 12, rpg: 3, crossbow: 5 },
  };

  function pickupAmmo(g, prop) {
    prop.pickedUp = true;
    const refills = AMMO_REFILL[prop.entityType] || {};
    let picked = false;
    for (const wid in refills) {
      const w = WEAPONS.find(w2 => w2.id === wid);
      if (w) {
        const amount = refills[wid];
        const maxTotal = (w.maxClip || 0) * 10 + amount;
        if (w.ammo < maxTotal) {
          w.ammo = Math.min(maxTotal, w.ammo + amount);
          picked = true;
        }
      }
    }
    if (picked) {
      playSound("ammo_pickup");
      spawnImpactParticles(g, prop.mesh.position.clone(), "metal", 8);
    }
    const i = g.props.indexOf(prop);
    if (i >= 0) {
      g.props.splice(i, 1);
      g.scene.remove(prop.mesh);
      prop.mesh.traverse(o => { if (o.geometry) o.geometry.dispose(); });
      g.world.removeBody(prop.body);
    }
  }

  function explodeEntity(g, prop) {
    if (prop.exploded) return;
    prop.exploded = true;
    playSound("explode");
    const pos = prop.mesh.position.clone();
    const radius = 8;
    const force = 50;

    for (const npc of g.npcs) {
      if (!npc.alive) continue;
      const d = npc.body.position.distanceTo(pos);
      if (d < radius) {
        const dir = npc.body.position.vsub(prop.body.position).unit();
        damageNPC(g, npc, 100 * (1 - d / radius), new THREE.Vector3(dir.x, dir.y, dir.z));
      }
    }
    const playerDist = g.player.pos.distanceTo(pos);
    if (playerDist < radius) {
      damagePlayer(g, Math.floor(80 * (1 - playerDist / radius)));
      const knockDir = g.player.pos.clone().sub(pos).normalize();
      g.player.vel.x += knockDir.x * 20;
      g.player.vel.y += 10;
      g.player.vel.z += knockDir.z * 20;
    }
    for (const p of g.props) {
      if (p === prop) continue;
      const d = p.body.position.distanceTo(pos);
      if (d < radius && d > 0.1) {
        const dir = p.body.position.vsub(prop.body.position).unit();
        p.body.wakeUp();
        p.body.velocity.x += dir.x * force * (1 - d / radius);
        p.body.velocity.y += dir.y * force * (1 - d / radius) + 5;
        p.body.velocity.z += dir.z * force * (1 - d / radius);
        if (p.entity === "explosive" && !p.exploded) {
          p.health = 0;
          setTimeout(() => explodeEntity(g, p), 100 + Math.random() * 200);
        }
        if (p.breakable && !p.broken) {
          damageBreakable(g, p, 80 * (1 - d / radius), p.body.position.clone());
        }
      }
    }

    const fireball = new THREE.Mesh(
      new THREE.SphereGeometry(1, 16, 12),
      new THREE.MeshBasicMaterial({ color: 0xff6600, transparent: true, opacity: 0.9 })
    );
    fireball.position.copy(pos);
    g.scene.add(fireball);
    const light = new THREE.PointLight(0xff6600, 5, 20);
    light.position.copy(pos);
    g.scene.add(light);
    let age = 0;
    const animExplosion = () => {
      age += 0.05;
      const s = 1 + age * 4;
      fireball.scale.set(s, s, s);
      fireball.material.opacity = Math.max(0, 0.9 - age * 1.5);
      light.intensity = Math.max(0, 5 - age * 8);
      if (age < 0.6) {
        requestAnimationFrame(animExplosion);
      } else {
        g.scene.remove(fireball);
        g.scene.remove(light);
        fireball.geometry.dispose();
        fireball.material.dispose();
      }
    };
    animExplosion();
    removeProp3D(g, prop);
  }

  function spawnVehicleCrosshair(g, vehicleId) {
    const def = VEHICLE_TYPES.find(v => v.id === vehicleId);
    if (!def) return;
    const origin = g.player.pos.clone();
    const dir = getCameraForward(g);
    let bestT = 12;
    for (const col of g.colliders) {
      const t = rayAABB(origin, dir, col);
      if (t !== null && t < bestT) bestT = t;
    }
    if (dir.y < -0.01) {
      const t = -origin.y / dir.y;
      if (t > 0 && t < bestT) bestT = t;
    }
    const dist = Math.max(4, bestT - 3);
    const pos = origin.add(dir.multiplyScalar(dist));
    const groundY = findGroundHeight(g, pos.x, pos.z);
    const spawnY = groundY !== null ? groundY + 1 : pos.y;

    const T = THREE;
    const grp = new T.Group();
    const bodyMat = new T.MeshStandardMaterial({ color: vehicleId === "jeep" ? 0x3a5a3a : vehicleId === "pod" ? 0x5a5a5e : 0x8a6a3a, roughness: 0.6, metalness: 0.3 });
    const wheelMat = new T.MeshStandardMaterial({ color: 0x1a1a1e, roughness: 0.8 });

    if (vehicleId === "pod") {
      const hull = new T.Mesh(new T.SphereGeometry(1.2, 16, 12, 0, Math.PI*2, 0, Math.PI/2), bodyMat);
      grp.add(hull);
      const seat = new T.Mesh(new T.BoxGeometry(1, 0.3, 1), new T.MeshStandardMaterial({ color: 0x4a4a4e, roughness: 0.9 }));
      seat.position.y = -0.2; grp.add(seat);
    } else {
      const w = 2.2, h = 1.0, d = 4.0;
      const chassis = new T.Mesh(new T.BoxGeometry(w, h, d), bodyMat);
      chassis.position.y = 0.8; grp.add(chassis);
      const cabin = new T.Mesh(new T.BoxGeometry(w * 0.8, h * 0.7, d * 0.5), new T.MeshStandardMaterial({ color: 0x222226, roughness: 0.2, metalness: 0.8 }));
      cabin.position.set(0, 1.4, -0.3); grp.add(cabin);
      const wheelGeo = new T.CylinderGeometry(0.5, 0.5, 0.3, 16);
      const wheelPositions = [[-1.1, 0.5, 1.3], [1.1, 0.5, 1.3], [-1.1, 0.5, -1.3], [1.1, 0.5, -1.3]];
      for (const wp of wheelPositions) {
        const wheel = new T.Mesh(wheelGeo, wheelMat);
        wheel.position.set(wp[0], wp[1], wp[2]);
        wheel.rotation.z = Math.PI / 2;
        grp.add(wheel);
      }
    }
    grp.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });

    const C = CANNON;
    const shape = new C.Box(new C.Vec3(1.1, 0.8, 2.0));
    const body = new C.Body({ mass: 200, shape });
    body.position.set(pos.x, spawnY + 1, pos.z);
    body.linearDamping = 0.05;
    body.angularDamping = 0.1;
    g.world.addBody(body);
    g.scene.add(grp);

    g.props.push({
      mesh: grp, body, radius: 2.5, halfExtents: { x: 1.1, y: 0.8, z: 2.0 }, shape: "box",
      isVehicle: true, vehicleId: def.name,
    });
    if (g.props.length > 80) {
      const old = g.props.shift();
      g.scene.remove(old.mesh);
      old.mesh.traverse(o => { if (o.geometry) o.geometry.dispose(); });
      g.world.removeBody(old.body);
    }
  }

  function getCameraForward(g) {
    return new THREE.Vector3(0, 0, -1).applyQuaternion(g.camera.quaternion);
  }

  function raycastWorld(g, maxDist) {
    const origin = g.player.pos.clone();
    const dir = getCameraForward(g);
    let bestT = maxDist || 100, bestCol = null;
    for (const col of g.colliders) {
      const min = col.min, max = col.max;
      let tmin = -Infinity, tmax = Infinity;
      for (let ax = 0; ax < 3; ax++) {
        const o = ax === 0 ? origin.x : ax === 1 ? origin.y : origin.z;
        const d = ax === 0 ? dir.x : ax === 1 ? dir.y : dir.z;
        const lo = ax === 0 ? min.x : ax === 1 ? min.y : min.z;
        const hi = ax === 0 ? max.x : ax === 1 ? max.y : max.z;
        if (Math.abs(d) < 1e-8) {
          if (o < lo || o > hi) { tmin = Infinity; break; }
        } else {
          let t1 = (lo - o) / d, t2 = (hi - o) / d;
          if (t1 > t2) [t1, t2] = [t2, t1];
          if (t1 > tmin) tmin = t1;
          if (t2 < tmax) tmax = t2;
          if (tmin > tmax) { tmin = Infinity; break; }
        }
      }
      if (tmin !== Infinity && tmin > 0 && tmin < bestT) { bestT = tmin; bestCol = col; }
      else if (tmax > 0 && tmax < bestT) { bestT = tmax; bestCol = col; }
    }
    if (!bestCol) return null;
    return { point: origin.clone().add(dir.clone().multiplyScalar(bestT)), dist: bestT, collider: bestCol };
  }

  function takeScreenshot() {
    if (!game || !gameRenderer) return;
    renderWithPostProcess(game, 0.016);
    gameRenderer.autoClear = false;
    gameRenderer.clearDepth();
    if (WEAPONS[currentWeapon].type !== "camera" || document.querySelector(".hl2-hud")?.style.display !== "none") {
      gameRenderer.render(viewScene, viewCamera);
    }
    const dataUrl = gameRenderer.domElement.toDataURL("image/png");
    const a = document.createElement("a");
    a.href = dataUrl;
