  document.addEventListener("keydown", (e) => {
    if (e.key === "`" || e.key === "~" || e.key === "Backquote") {
      e.preventDefault();
      toggleConsole();
      return;
    }

    if (consoleOpen) {
      if (e.key === "Escape") { toggleConsole(); e.preventDefault(); return; }
      if (e.key === "Enter") {
        const inp = document.getElementById("dcInput");
        if (inp) {
          const val = inp.value;
          if (val.trim()) { consoleHistory.push(val); consoleHistIdx = consoleHistory.length; }
          runConsoleCommand(val);
          inp.value = "";
          updateConsoleSuggest();
        }
        e.preventDefault(); return;
      }
      if (e.key === "Tab") {
        e.preventDefault();
        acceptSuggestion();
        return;
      }
      if (e.key === "ArrowUp" && suggestItems.length > 0) {
        moveSuggestSel(1);
        e.preventDefault(); return;
      }
      if (e.key === "ArrowDown" && suggestItems.length > 0) {
        moveSuggestSel(-1);
        e.preventDefault(); return;
      }
      if (e.key === "ArrowUp" && suggestItems.length === 0) {
        if (consoleHistory.length > 0) {
          consoleHistIdx = Math.max(0, consoleHistIdx - 1);
          const inp = document.getElementById("dcInput");
          inp.value = consoleHistory[consoleHistIdx] || "";
          updateConsoleSuggest();
        }
        e.preventDefault(); return;
      }
      if (e.key === "ArrowDown" && suggestItems.length === 0) {
        if (consoleHistory.length > 0) {
          consoleHistIdx = Math.min(consoleHistory.length, consoleHistIdx + 1);
          const inp = document.getElementById("dcInput");
          inp.value = consoleHistory[consoleHistIdx] || "";
          updateConsoleSuggest();
        }
        e.preventDefault(); return;
      }
      if (e.key !== "Shift" && e.key !== "Control") return;
    }

    if (!gameRunning) return;
    {
      const k = e.key.toLowerCase();

      if ((k === "y" || k === "t") && !spawnMenuOpen && !consoleOpen && MP.connected && !mpChatOpen) {
        openMpChat();
        e.preventDefault();
        return;
      }
      if (mpChatOpen) return; // swallow all game keys while chatting

      if (k === "q") {
        if (ctxPlayermenuOpen) toggleContextPlayermenu();
        toggleSpawnMenu(); e.preventDefault(); return;
      }
      if (k === "escape") {
        if (ctxPlayermenuOpen) { toggleContextPlayermenu(); return; }
        if (spawnMenuOpen) { closeSpawnMenu(); return; }
        pauseGame(); return;
      }
      if (k === "v") {
        if (game && game.player) {
          game.player.noclip = !game.player.noclip;
          document.getElementById("hudNoclip")?.classList.toggle("show", game.player.noclip);
        }
        e.preventDefault(); return;
      }
      if (k === "f") {
        toggleFlashlight();
        e.preventDefault(); return;
      }
      if (k === "c") {
        toggleContextPlayermenu();
        e.preventDefault(); return;
      }
      if (customBinds[k]) {
        runConsoleCommand(customBinds[k]);
        e.preventDefault(); return;
      }
      if (spawnMenuOpen) return;
      game.keys[k] = true;
      callLuaHook("KeyPress", k);
      if (k >= "1" && k <= "6") { switchWeaponCategory(parseInt(k)); }
      if (k === "e") {
        if (game.grabbed) { /* E rotates grabbed prop — no deny sound */ }
        else {
          const hit = raycastProp(game);
          if (!hit || !hit.body) { playSound("weapon_deny"); }
        }
      }
      if (k === "r") {
        if (WEAPONS[currentWeapon].type === "toolgun") {
          handleToolKey(game, "r", { ctrl: game.keys["control"], alt: game.keys["alt"], e: game.keys["e"], shift: game.keys["shift"] });
        } else if (WEAPONS[currentWeapon].type === "realphysgun") {
          const hit = raycastProp(game);
          if (hit && hit.body && hit.body.type === CANNON.Body.STATIC) {
            hit.body.type = CANNON.Body.DYNAMIC;
            hit.body.mass = hit.body._savedMass || 4;
            hit.body.updateMassProperties();
            hit.body.velocity.set(0, 0, 0);
            hit.body.angularVelocity.set(0, 0, 0);
            playSound("physcannon_drop");
          } else {
            tryReload();
          }
        } else {
          tryReload();
        }
      }
      if (k === "z") {
        doUndo();
        e.preventDefault(); return;
      }
      if (["a","d","w","s"," ","shift","control"].includes(k)) e.preventDefault();
      return;
    }
    if (e.key === "Escape") {
      const pm = document.getElementById("panelMount");
      if (pm.innerHTML) closePanel();
    }
  });

  document.addEventListener("keyup", (e) => {
    if (mpChatOpen) {
      if (e.key === "Escape") { closeMpChat(); e.preventDefault(); }
      return;
    }
    if (gameRunning) game.keys[e.key.toLowerCase()] = false;
    if (gameRunning) callLuaHook("KeyRelease", e.key.toLowerCase());
  });

  const MP = {
    socket: null,       connected: false, myPid: 0, myName: "",
    players: {},       // pid -> { name, color, x,y,z, yaw, pitch, vx,vy,vz, lastUpdate, mesh, nameplate, sceneRef }
    remoteProps: {},   // propId -> { mesh, tx,ty,tz, qx,qy,qz,qw, x,y,z, owner, lastUpdate, item }
    remoteNpcs: {},    // npcId -> { mesh, tx,ty,tz, qx,qy,qz,qw, x,y,z, alive, type, lastUpdate }
    chatMsgs: [],
    reconnectDelay: 500, reconnectTimer: null, reconnecting: false,
    lastTransformSend: 0, lastPropSend: 0, statusEl: null,
    initialized: false,
    roomId: null,      // current room ID
    hostPid: null,      // pid of the room host
    isOwner: false,     // true if authenticated as game owner
    ownerPids: new Set(), // pids of game owner(s)
    pendingRoom: null, // room to create after game loads
    pendingJoinRoom: null, // room ID to join after game loads
    pendingMapName: null,
  };
  const MP_TYPE_HELLO = 0, MP_TYPE_TRANSFORM = 1, MP_TYPE_CHAT = 2, MP_TYPE_PROPSPAWN = 3,
        MP_TYPE_PROPREMOVE = 4, MP_TYPE_GRAB = 5, MP_TYPE_RELEASE = 6, MP_TYPE_LEAVE = 7,
        MP_TYPE_PING = 8, MP_TYPE_NAME = 9,
        MP_TYPE_ROOMJOIN = 10, MP_TYPE_ROOMLEAVE = 11, MP_TYPE_ROOMLIST = 12, MP_TYPE_ROOMCREATE = 13,
        MP_TYPE_JOIN = 14, MP_TYPE_DAMAGE = 15, MP_TYPE_KILL = 16,
        MP_TYPE_PROPTRANSFORM = 17, MP_TYPE_PROPDRAG = 18, MP_TYPE_PROPIMPULSE = 19,
        MP_TYPE_NPCSPAWN = 20, MP_TYPE_NPCTRANSFORM = 21, MP_TYPE_NPCKILL = 22,
        MP_TYPE_SOUND = 23, MP_TYPE_WEAPON = 24,
        MP_TYPE_OWNER_AUTH = 25, MP_TYPE_OWNER_STATUS = 26, MP_TYPE_OWNER_KICK = 27, MP_TYPE_KICKED = 28;
  let mpChatOpen = false;
  let mpNextPropId = 1;

  function mpPickName() {
    let saved = "";
    try { saved = localStorage.getItem("pm_mp_name") || ""; } catch(e) {}
    if (saved) return saved;
    const adj = ["Cool","Salty","Lucky","Mad","Tiny","Big","Sneaky","Brave","Wise","Quick","Noisy","Silent"];
    const noun = ["Builder","Gamer","Physicist","Engineer","Gunner","Sandbox","Man","Player","Gmod","Garry"];
    return adj[Math.floor(Math.random()*adj.length)] + noun[Math.floor(Math.random()*noun.length)] + Math.floor(Math.random()*100);
  }
  function mpPickColor() {
    const hues = [0, 30, 60, 120, 180, 210, 260, 290, 330];
    const h = hues[Math.floor(Math.random()*hues.length)];
    const s = 0.7, l = 0.6;
    const c = (1 - Math.abs(2*l - 1)) * s;
    const x = c * (1 - Math.abs((h/60) % 2 - 1));
    const m = l - c/2;
    let r,g,b;
    if (h < 60) { r=c; g=x; b=0; } else if (h < 120) { r=x; g=c; b=0; }
    else if (h < 180) { r=0; g=c; b=x; } else if (h < 240) { r=0; g=x; b=c; }
    else if (h < 300) { r=x; g=0; b=c; } else { r=c; g=0; b=x; }
    return [Math.round((r+m)*255), Math.round((g+m)*255), Math.round((b+m)*255)];
  }
  function mpMyColor() {
    try { const saved = localStorage.getItem("pm_mp_color"); if (saved) return JSON.parse(saved); } catch(e) {}
    const c = mpPickColor();
    try { localStorage.setItem("pm_mp_color", JSON.stringify(c)); } catch(e) {}
    return c;
  }

  function mpEnsureStatus() {
    if (MP.statusEl && document.body.contains(MP.statusEl)) return MP.statusEl;
    const el = document.createElement("div");
    el.className = "mp-connecting on";
    el.textContent = "Connecting…";
    el.style.display = "none";
    document.body.appendChild(el);
    MP.statusEl = el;
    return el;
  }
  function mpSetStatus(text, cls) {
    const el = mpEnsureStatus();
    el.textContent = text;
    el.className = "mp-connecting " + (cls || "");
    el.style.display = text ? "block" : "none";
  }

  async function mpConnect() {
    if (MP.socket && (MP.connected || MP.reconnecting)) return;
    if (!window.root || !window.root.createServerSocket) return;
    MP.reconnecting = true;
    mpSetStatus("Connecting…", "on");
    try {
      const socket = window.root.createServerSocket();
      socket.binaryType = "arraybuffer";
      MP.socket = socket;

      socket.addEventListener("open", () => {
        MP.connected = true;
        MP.reconnecting = false;
        mpSetStatus("Online", "live");
        MP.myName = mpPickName();
        const w0 = WEAPONS[currentWeapon];
        socket.send(JSON.stringify({ t: MP_TYPE_NAME, name: MP.myName, color: mpMyColor(), modelId: playerModelId, weaponId: w0 ? w0.id : null }));
        try { localStorage.setItem("pm_mp_name", MP.myName); } catch(e) {}
        const nameInput = document.getElementById("mpNameInput");
        if (nameInput) nameInput.value = MP.myName;
      });

      socket.addEventListener("message", (event) => {
        mpHandleMessage(event.data);
      });

      socket.addEventListener("close", (event) => {
        MP.connected = false;
        if (MP.socket === socket) MP.socket = null;
        if (event.code === 4403) {
          mpSetStatus("Multiplayer requires perchance.org", "fail");
          MP.reconnecting = false;
          return;
        }
        if (event.code === 4429) {
          mpSetStatus("Server cooling down…", "fail");
          scheduleReconnect(Math.max(5000, MP.reconnectDelay * 8));
          return;
        }
        if (!MP.reconnecting && gameRunning) {
          mpSetStatus("Reconnecting…", "on");
          scheduleReconnect(MP.reconnectDelay);
        } else if (!gameRunning) {
          scheduleReconnect(MP.reconnectDelay);
        }
      });

      socket.addEventListener("error", () => {
      });

      if (MP.heartbeatTimer) clearInterval(MP.heartbeatTimer);
      MP.heartbeatTimer = setInterval(() => {
        if (MP.connected && MP.socket) {
          MP.socket.send(JSON.stringify({ t: MP_TYPE_PING }));
        }
      }, 20000);

    } catch(e) {
      mpSetStatus("MP error", "fail");
      scheduleReconnect(MP.reconnectDelay);
    }
  }

  function scheduleReconnect(delay) {
    if (MP.reconnectTimer) return;
    if (MP.reconnectDelay < 5000) MP.reconnectDelay = Math.min(5000, MP.reconnectDelay * 1.5);
    else MP.reconnectDelay = Math.min(10000, MP.reconnectDelay + 1000);
    MP.reconnectTimer = setTimeout(() => {
      MP.reconnectTimer = null;
      MP.reconnecting = false;
      mpConnect();
    }, delay || MP.reconnectDelay);
  }

  function mpHandleMessage(data) {
    if (data instanceof ArrayBuffer) {
      if (data.byteLength < 26) return;
      const dv = new DataView(data);
      const t = dv.getUint8(0);
      if (t !== MP_TYPE_TRANSFORM) return;
      const pid = dv.getUint32(1, false);
      if (pid === MP.myPid) return; // own echo
      const x = dv.getFloat32(5, false);
      const y = dv.getFloat32(9, false);
      const z = dv.getFloat32(13, false);
      const yaw = dv.getFloat32(17, false);
      const pitch = dv.getFloat32(21, false);
      const flags = dv.getUint8(25) || 0;
      mpUpdatePlayer(pid, x, y, z, yaw, pitch, flags);
      return;
    }
    let msg;
    try { msg = JSON.parse(data); } catch(e) { return; }
    if (!msg || typeof msg.t !== "number") return;

    switch (msg.t) {
      case MP_TYPE_HELLO: {
        MP.myPid = msg.pid;
        if (msg.players) {
          for (const [pidStr, info] of Object.entries(msg.players)) {
            const pid = parseInt(pidStr);
            if (pid !== MP.myPid) {
              MP.players[pid] = {
                name: info.name, color: info.color,
                x:0, y:0, z:0, yaw:0, pitch:0,
                tx:0, ty:0, tz:0, tyaw:0,
                lastUpdate: performance.now(),
                mesh: null, nameplate: null,
              };
            }
          }
        }
        if (MP.socket && MP.connected) {
          const w0 = WEAPONS[currentWeapon];
          MP.socket.send(JSON.stringify({ t: MP_TYPE_NAME, name: MP.myName, color: mpMyColor(), modelId: playerModelId, weaponId: w0 ? w0.id : null }));
        }
        break;
      }
      case MP_TYPE_NAME: {
        const p = MP.players[msg.pid];
        if (p) {
          p.name = msg.name;
          p.color = msg.color;
          if (msg.modelId) p.modelId = msg.modelId;
          if (msg.weaponId) p.weaponId = msg.weaponId;
          if (p.nameplate) {
            p.nameplate.textContent = mpNamePrefix(msg.pid) + msg.name;
          }
          if (msg.modelId && p.mesh && p.mesh.userData.modelId !== msg.modelId) {
            if (p.mesh.parent) p.mesh.parent.remove(p.mesh);
            p.mesh.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); });
            p.mesh = null;
          }
          if (msg.weaponId && p.weaponId !== msg.weaponId) {
            mpUpdateAvatarWeapon(msg.pid);
          }
        } else {
          MP.players[msg.pid] = {
            name: msg.name, color: msg.color,
            modelId: msg.modelId || "bean",
            weaponId: msg.weaponId || null,
            x:0, y:0, z:0, yaw:0, pitch:0,
            tx:0, ty:0, tz:0, tyaw:0,
            lastUpdate: performance.now(),
            mesh: null, nameplate: null,
          };
        }
        break;
      }
      case MP_TYPE_CHAT: {
        if (msg.pid === MP.myPid) break; // already shown locally in sendMpChat
        const p = MP.players[msg.pid];
        const name = p ? p.name : ("Player" + (msg.pid % 1000));
        const color = p ? p.color : [200,200,200];
        mpAddChat(name, color, msg.text, mpIsHost(msg.pid), mpIsGameOwner(msg.pid));
        break;
      }
      case MP_TYPE_LEAVE: {
        mpRemovePlayer(msg.pid);
        if (msg.name && MP.roomId) {
          mpAddChat("", [180,180,180], msg.name + " has left the game");
          playSound("mp_friend_leave");
        }
        break;
      }
      case MP_TYPE_JOIN: {
        if (msg.pid !== MP.myPid && MP.roomId) {
          mpAddChat("", [180,180,180], (msg.name || ("Player" + (msg.pid % 1000))) + " has joined the game");
          playSound("mp_friend_join");
        }
        break;
      }
      case MP_TYPE_DAMAGE: {
        if (msg.targetPid === MP.myPid && gameRunning && game) {
          damagePlayer(game, msg.dmg);
          if (game.player.hp <= 0 && MP.connected && MP.socket) {
            const killer = MP.players[msg.pid];
            const killerName = killer ? killer.name : ("Player" + (msg.pid % 1000));
            MP.socket.send(JSON.stringify({ t: MP_TYPE_KILL, killerPid: msg.pid, victimName: MP.myName }));
          }
        }
        break;
      }
      case MP_TYPE_KILL: {
        if (msg.pid !== MP.myPid && MP.roomId) {
          const killer = MP.players[msg.pid];
          const killerName = killer ? killer.name : ("Player" + (msg.pid % 1000));
          mpAddChat("", [255,100,100], killerName + " killed " + (msg.victimName || "a player"));
        }
        break;
      }
      case MP_TYPE_PROPSPAWN: {
        if (msg.pid === MP.myPid || !game || !game.scene) break;
        const item = msg.item || { name: "Prop", shape: "box", size: 1, mass: 4 };
        const p = makePropMesh(game, item);
        p.mesh.position.set(msg.x, msg.y, msg.z);
        if (msg.qx !== undefined) p.mesh.quaternion.set(msg.qx, msg.qy, msg.qz, msg.qw);
        game.scene.add(p.mesh);
        p.mesh.userData.radius = p.radius || 0.8;
        const C = CANNON;
        let colShape;
        if (item.shape === "ball") {
          colShape = new C.Sphere(p.radius || 0.5);
        } else {
          const he = p.halfExtents || { x: 0.5, y: 0.5, z: 0.5 };
          colShape = new C.Box(new C.Vec3(he.x, he.y, he.z));
        }
        const colBody = new C.Body({ type: C.Body.KINEMATIC, shape: colShape });
        colBody.position.set(msg.x, msg.y, msg.z);
        game.world.addBody(colBody);
        MP.remoteProps[msg.propId] = {
          mesh: p.mesh, item, colBody,
          x: msg.x, y: msg.y, z: msg.z,
          tx: msg.x, ty: msg.y, tz: msg.z,
          qx: msg.qx||0, qy: msg.qy||0, qz: msg.qz||0, qw: msg.qw||1,
          owner: msg.pid, lastUpdate: performance.now(),
        };
        break;
      }
      case MP_TYPE_PROPREMOVE: {
        if (msg.pid === MP.myPid) break;
        const rp = MP.remoteProps[msg.propId];
        if (rp) {
          if (rp.colBody && game.world) game.world.removeBody(rp.colBody);
          if (rp.mesh) { game.scene.remove(rp.mesh); rp.mesh.traverse(o => { if (o.geometry) o.geometry.dispose(); }); }
          delete MP.remoteProps[msg.propId];
        }
        break;
      }
      case MP_TYPE_PROPTRANSFORM: {
        if (msg.pid === MP.myPid) break;
        const updates = msg.props || [];
        for (const u of updates) {
          const rp = MP.remoteProps[u[0]];
          if (rp) {
            rp.tx = u[1]; rp.ty = u[2]; rp.tz = u[3];
            rp.qx = u[4]; rp.qy = u[5]; rp.qz = u[6]; rp.qw = u[7];
            rp.lastUpdate = performance.now();
          }
        }
        break;
      }
      case MP_TYPE_GRAB: {
        if (msg.pid === MP.myPid) break;
        const prop = game.props.find(p => p.mpId === msg.propId);
        if (prop && prop.body) {
          if (prop.body._prevType === undefined) {
            prop.body._prevType = prop.body.type;
            prop.body._prevMass = prop.body.mass;
            prop.body.type = CANNON.Body.KINEMATIC;
            prop.body.mass = 0;
            prop.body.updateMassProperties();
            prop.body.velocity.set(0, 0, 0);
            prop.body.angularVelocity.set(0, 0, 0);
          }
          prop._mpDragger = msg.pid;
          if (game.grabbed === prop) game.grabbed = null;
        }
        break;
      }
      case MP_TYPE_PROPDRAG: {
        if (msg.pid === MP.myPid) break;
        const prop = game.props.find(p => p.mpId === msg.propId);
        if (prop && prop.body && prop._mpDragger === msg.pid) {
          const b = prop.body;
          const target = new CANNON.Vec3(msg.x, msg.y, msg.z);
          b.position.lerp(target, 0.4, b.position);
          if (msg.qx !== undefined) {
            const tq = new CANNON.Quaternion(msg.qx, msg.qy, msg.qz, msg.qw);
            b.quaternion.slerp(tq, 0.4, b.quaternion);
          }
          b.wakeUp();
        }
        break;
      }
      case MP_TYPE_RELEASE: {
        if (msg.pid === MP.myPid) break;
        const prop = game.props.find(p => p.mpId === msg.propId);
        if (prop && prop.body && prop._mpDragger === msg.pid) {
          prop._mpDragger = null;
          if (prop.body._prevType !== undefined) {
            prop.body.type = prop.body._prevType;
            prop.body.mass = prop.body._prevMass || 4;
            prop.body.updateMassProperties();
            prop.body._prevType = undefined;
          }
          if (msg.vx !== undefined) {
            prop.body.velocity.set(msg.vx, msg.vy, msg.vz);
          }
          if (msg.wx !== undefined) {
            prop.body.angularVelocity.set(msg.wx, msg.wy, msg.wz);
          }
          prop.body.wakeUp();
        }
        break;
      }
      case MP_TYPE_PROPIMPULSE: {
        if (msg.pid === MP.myPid) break;
        const prop = game.props.find(p => p.mpId === msg.propId);
        if (prop && prop.body) {
          prop.body.wakeUp();
          prop.body.velocity.x += msg.vx || 0;
          prop.body.velocity.y += msg.vy || 0;
          prop.body.velocity.z += msg.vz || 0;
          if (prop.breakable && !prop.broken && msg.dmg) {
            damageBreakable(game, prop, msg.dmg, prop.mesh.position.clone());
          }
        }
        break;
      }
      case MP_TYPE_NPCSPAWN: {
        if (msg.pid === MP.myPid || !game || !game.scene) break;
        const mesh = buildNPCMesh(msg.npcType);
        mesh.position.set(msg.x, msg.y, msg.z);
        game.scene.add(mesh);
        MP.remoteNpcs[msg.npcId] = {
          mesh, type: msg.npcType,
          x: msg.x, y: msg.y, z: msg.z,
          tx: msg.x, ty: msg.y, tz: msg.z,
          qx: 0, qy: 0, qz: 0, qw: 1,
          alive: true, lastUpdate: performance.now(),
        };
        break;
      }
      case MP_TYPE_NPCTRANSFORM: {
        if (msg.pid === MP.myPid) break;
        for (const u of (msg.npcs || [])) {
          const rn = MP.remoteNpcs[u[0]];
          if (rn) {
            rn.tx = u[1]; rn.ty = u[2]; rn.tz = u[3];
            rn.qx = u[4]; rn.qy = u[5]; rn.qz = u[6]; rn.qw = u[7];
            rn.alive = u[8] === 1;
            rn.lastUpdate = performance.now();
          }
        }
        break;
      }
      case MP_TYPE_NPCKILL: {
        if (msg.pid === MP.myPid) break;
        const npc = game.npcs.find(n => n.mpId === msg.npcId);
        if (npc) {
          if (msg.dmg && npc.alive) {
            damageNPC(game, npc, msg.dmg, new THREE.Vector3(0, 0, 1));
          } else {
            removeNPC(game, npc);
          }
        } else {
          const rn = MP.remoteNpcs[msg.npcId];
          if (rn) {
            if (rn.mesh) { game.scene.remove(rn.mesh); rn.mesh.traverse(o => { if (o.geometry) o.geometry.dispose(); }); }
            delete MP.remoteNpcs[msg.npcId];
          }
        }
        break;
      }
      case MP_TYPE_ROOMLIST: {
        mpRoomList = msg.rooms || [];
        mpRenderRoomList();
        break;
      }
      case MP_TYPE_ROOMJOIN: {
        if (msg.error) {
          alert("Failed to join room: " + msg.error);
          MP.pendingJoinRoom = null;
        } else {
          MP.roomId = msg.roomId;
          MP.hostPid = (msg.room && msg.room.hostPid !== undefined) ? msg.room.hostPid : null;
          mpRefreshOwnerTags();
          MP.pendingJoinRoom = null;
        }
        break;
      }
      case MP_TYPE_ROOMCREATE: {
        break;
      }
      case MP_TYPE_SOUND: {
        if (msg.pid === MP.myPid || !game || !game.player) break;
        mpPlayRemoteSound(msg.sound, msg.x, msg.y, msg.z, msg.pitch);
        break;
      }
      case MP_TYPE_WEAPON: {
        if (msg.pid === MP.myPid) break;
        const p = MP.players[msg.pid];
        if (p) {
          p.weaponId = msg.weaponId;
          mpUpdateAvatarWeapon(Number(msg.pid));
        }
        break;
      }
      case MP_TYPE_OWNER_STATUS: {
        if (msg.ok === true) {
          if (msg.pid === undefined || msg.pid === MP.myPid) {
            MP.isOwner = true;
            mpRefreshOwnerTags();
            consoleLog("Game Owner authenticated", "ok");
          }
          if (msg.pid !== undefined && msg.pid !== MP.myPid) {
            MP.ownerPids.add(msg.pid);
            mpRefreshOwnerTags();
          }
        } else if (msg.ok === false && msg.pid === undefined) {
          consoleLog("Owner auth failed: " + (msg.error || "unknown"), "err");
        }
        break;
      }
      case MP_TYPE_KICKED: {
        if (msg.pid === MP.myPid) {
          mpAddChat("", [255,80,80], "You were kicked: " + (msg.reason || "Kicked by game owner"));
          if (MP.socket) { try { MP.socket.close(3000, "kicked"); } catch(e) {} MP.socket = null; }
          MP.connected = false;
          MP.roomId = null;
          MP.isOwner = false;
          mpSetStatus("Kicked", "fail");
        }
        break;
      }
    }
    mpUpdateCount();
  }

  function mpUpdatePlayer(pid, x, y, z, yaw, pitch, flags) {
    let p = MP.players[pid];
    if (!p) {
      p = MP.players[pid] = {
        name: "Player" + (pid % 1000), color: [200,200,200],
        x:x, y:y, z:z, yaw:yaw, pitch:pitch,
        tx:x, ty:y, tz:z, tyaw:yaw,
        lastUpdate: performance.now(),
        mesh: null, nameplate: null,
      };
    }
    p.tx = x; p.ty = y; p.tz = z; p.tyaw = yaw;
    p.pitch = pitch;
    p.lastUpdate = performance.now();
  }

  function mpRemovePlayer(pid) {
    const p = MP.players[pid];
    if (!p) return;
    if (p.weaponMesh && p.mesh) p.mesh.remove(p.weaponMesh);
    if (p.mesh && p.mesh.parent) p.mesh.parent.remove(p.mesh);
    if (p.nameplate && p.nameplate.parentElement) p.nameplate.parentElement.removeChild(p.nameplate);
    delete MP.players[pid];
  }

  function buildPlayerModel(modelId, color) {
    const T = THREE;
    const grp = new T.Group();
    const col = (color && color.length >= 3) ? (color[0]<<16 | color[1]<<8 | color[2]) : 0xffb020;
    const skinCol = 0xffcc99;

    if (modelId === "blocky") {
      const bodyMat = new T.MeshStandardMaterial({ color: col, roughness: 0.6 });
      const skinMat = new T.MeshStandardMaterial({ color: skinCol, roughness: 0.7 });
      const darkMat = new T.MeshStandardMaterial({ color: new T.Color(col).multiplyScalar(0.5), roughness: 0.6 });
      const torso = new T.Mesh(new T.BoxGeometry(0.6, 0.7, 0.35), bodyMat);
      torso.position.y = 1.1; torso.castShadow = true; grp.add(torso);
      const head = new T.Mesh(new T.BoxGeometry(0.4, 0.4, 0.4), skinMat);
      head.position.y = 1.65; head.castShadow = true; grp.add(head);
      for (const sx of [-0.18, 0.18]) {
        const arm = new T.Mesh(new T.BoxGeometry(0.22, 0.65, 0.22), bodyMat);
        arm.position.set(sx, 1.05, 0); arm.castShadow = true; grp.add(arm);
      }
      for (const sx of [-0.15, 0.15]) {
        const leg = new T.Mesh(new T.BoxGeometry(0.24, 0.7, 0.24), darkMat);
        leg.position.set(sx, 0.35, 0); leg.castShadow = true; grp.add(leg);
      }
      const nose = new T.Mesh(new T.BoxGeometry(0.06, 0.06, 0.15), skinMat);
      nose.position.set(0, 1.65, -0.22); grp.add(nose);
    } else if (modelId === "robot") {
      const metalMat = new T.MeshStandardMaterial({ color: col, roughness: 0.3, metalness: 0.8 });
      const darkMat = new T.MeshStandardMaterial({ color: 0x2a2a2e, roughness: 0.3, metalness: 0.8 });

  function mpIsHost(pid) {
    return MP.hostPid !== null && Number(pid) === Number(MP.hostPid);
  }
  function mpIsGameOwner(pid) {
    return Number(pid) === Number(MP.myPid) ? MP.isOwner : MP.ownerPids.has(Number(pid));
  }
  function mpHostNameForPid(pid) {
    if (pid === undefined || pid === null) return "Unknown";
    if (Number(pid) === Number(MP.myPid)) return MP.myName || ("Player" + (Number(pid) % 1000));
    const p = MP.players[Number(pid)];
    if (p && p.name) return p.name;
    return "Player" + (Number(pid) % 1000);
  }
  function mpNamePrefix(pid) {
    if (mpIsGameOwner(pid)) return "⭐ ";
    if (mpIsHost(pid)) return "👑 ";
    return "";
  }
  function mpRefreshOwnerTags() {
    for (const pid of Object.keys(MP.players)) {
      const p = MP.players[pid];
      if (p && p.nameplate) {
        const isHost = mpIsHost(pid);
        const isOwner = mpIsGameOwner(pid);
        p.nameplate.classList.toggle("mp-host", isHost && !isOwner);
        p.nameplate.classList.toggle("mp-owner", isOwner);
        p.nameplate.textContent = mpNamePrefix(pid) + p.name;
      }
    }
  }

  function mpCreateAvatar(pid) {
    const p = MP.players[pid];
    if (!p || !game || !game.scene) return;
    if (p.mesh) return;

    const col = (p.color && p.color.length >= 3) ? p.color : [255, 176, 32];
    const grp = buildPlayerModel(p.modelId || "bean", col);

    grp.position.set(p.x, p.y - 1.7, p.z);
    grp.rotation.y = p.yaw;
    game.scene.add(grp);
    p.mesh = grp;

    if (!p.nameplate) {
      const np = document.createElement("div");
      np.className = "mp-nameplate";
      const isHost = mpIsHost(pid);
      const isOwner = mpIsGameOwner(pid);
      if (isOwner) np.classList.add("mp-owner");
      else if (isHost) np.classList.add("mp-host");
      np.textContent = mpNamePrefix(pid) + p.name;
      document.body.appendChild(np);
      p.nameplate = np;
    }
    if (p.weaponId) mpUpdateAvatarWeapon(pid);
  }

  function mpUpdateAvatarWeapon(pid) {
    const p = MP.players[pid];
    if (!p || !p.mesh) return;
    if (p.weaponMesh) {
      p.mesh.remove(p.weaponMesh);
      p.weaponMesh.traverse(o => { if (o.geometry) o.geometry.dispose(); });
      p.weaponMesh = null;
    }
    if (!p.weaponId || p.weaponId === "camera") return;
    const wm = buildWorldWeaponModel(p.weaponId);
    if (!wm) return;
    wm.position.set(0.32, 1.0, -0.15);
    wm.rotation.y = -Math.PI / 2;
    p.mesh.add(wm);
    p.weaponMesh = wm;
  }

  const MP_SHARED_SOUNDS = new Set([
    "pistol_fire", "357_fire", "smg1_fire", "ar2_fire", "shotgun_fire",
    "crossbow_fire", "rpg_fire", "explode", "crowbar_swing", "crowbar_hit",
    "crowbar_hitflesh", "physcannon_launch", "physcannon_pickup", "physcannon_drop",
    "physcannon_claws_open", "physcannon_claws_close", "physcannon_dryfire",
    "pistol_reload", "357_reload", "smg1_reload", "ar2_reload", "shotgun_reload",
    "crossbow_reload", "rpg_reload",
  ]);

  function mpSendSound(name, opts) {
    if (!MP.connected || !MP.socket || !game || !game.player || !MP.roomId) return;
    if (!MP_SHARED_SOUNDS.has(name)) return;
    const p = game.player.pos;
    MP.socket.send(JSON.stringify({ t: MP_TYPE_SOUND, sound: name, x: p.x, y: p.y, z: p.z, pitch: opts && opts.pitch }));
  }

  function mpPlayRemoteSound(name, x, y, z, pitch) {
    if (!game || !game.player) return;
    const dist = Math.sqrt((x-game.player.pos.x)**2 + (y-game.player.pos.y)**2 + (z-game.player.pos.z)**2);
    if (dist > 80) return;
    const vol = Math.max(0.05, 1 - dist / 80);
    playSound(name, { volume: vol, pitch, _remote: true });
  }

  function mpSendWeaponSwitch() {
    if (!MP.connected || !MP.socket || !MP.roomId) return;
    const w = WEAPONS[currentWeapon];
    if (!w) return;
    MP.socket.send(JSON.stringify({ t: MP_TYPE_WEAPON, weaponId: w.id }));
    MP.socket.send(JSON.stringify({ t: MP_TYPE_NAME, name: MP.myName, color: mpMyColor(), modelId: playerModelId, weaponId: w.id }));
  }

  function mpUpdateAvatars(dt) {
    if (!game || !game.scene) return;
    const now = performance.now();
    const lerpSpeed = Math.min(1, dt * 12);

    for (const pid in MP.players) {
      const p = MP.players[pid];
      p.x += (p.tx - p.x) * lerpSpeed;
      p.y += (p.ty - p.y) * lerpSpeed;
      p.z += (p.tz - p.z) * lerpSpeed;
      let dy = p.tyaw - p.yaw;
      if (dy > Math.PI) dy -= Math.PI * 2;
      if (dy < -Math.PI) dy += Math.PI * 2;
      p.yaw += dy * lerpSpeed;

      if (now - p.lastUpdate > 15000) {
        mpRemovePlayer(Number(pid));
        continue;
      }

      if (!p.mesh) mpCreateAvatar(Number(pid));
      if (!p.mesh) continue;

      p.mesh.position.set(p.x, p.y - 1.7, p.z);
      p.mesh.rotation.y = p.yaw;

      if (p.nameplate && game.camera) {
        const worldPos = new THREE.Vector3(p.x, p.y + 0.3, p.z);
        const screenPos = worldPos.clone().project(game.camera);
        if (screenPos.z < 1 && screenPos.z > -1) {
          const sx = (screenPos.x * 0.5 + 0.5) * window.innerWidth;
          const sy = (-screenPos.y * 0.5 + 0.5) * window.innerHeight;
          p.nameplate.style.display = "block";
          p.nameplate.style.left = sx + "px";
          p.nameplate.style.top = sy + "px";
        } else {
          p.nameplate.style.display = "none";
        }
      }
    }
  }

  function mpSendTransform() {
    if (!MP.connected || !MP.socket || !game || !game.player) return;
    const now = performance.now();
    if (now - MP.lastTransformSend < 50) return; // 20 Hz max
    MP.lastTransformSend = now;
    const p = game.player;
    const buf = new ArrayBuffer(26);
    const dv = new DataView(buf);
    dv.setUint8(0, MP_TYPE_TRANSFORM);
    dv.setUint32(1, MP.myPid, false);
    dv.setFloat32(5, p.pos.x, false);
    dv.setFloat32(9, p.pos.y, false);
    dv.setFloat32(13, p.pos.z, false);
    dv.setFloat32(17, p.yaw, false);
    dv.setFloat32(21, p.pitch, false);
    let flags = 0;
    if (p.noclip) flags |= 1;
    dv.setUint8(25, flags);
    MP.socket.send(buf);
  }

  function mpSendPropTransforms() {
    if (!MP.connected || !MP.socket || !game || !MP.roomId) return;
    const now = performance.now();
    if (now - MP.lastPropSend < 66) return; // ~15Hz
    MP.lastPropSend = now;
    const props = [];
    for (const prop of game.props) {
      if (!prop.mpId || prop.mpOwner !== MP.myPid) continue;
      if (!prop.body) continue;
      const b = prop.body;
      props.push([
        prop.mpId,
        b.position.x, b.position.y, b.position.z,
        prop.mesh.quaternion.x, prop.mesh.quaternion.y,
        prop.mesh.quaternion.z, prop.mesh.quaternion.w,
      ]);
      if (props.length >= 40) break;
    }
    if (props.length > 0) {
      MP.socket.send(JSON.stringify({ t: MP_TYPE_PROPTRANSFORM, props }));
    }
    const npcs = [];
    for (const npc of game.npcs) {
      if (!npc.mpId || npc.mpOwner !== MP.myPid) continue;
      if (!npc.body) continue;
      const b = npc.body;
      const m = npc.mesh;
      npcs.push([
        npc.mpId,
        b.position.x, b.position.y, b.position.z,
        m.quaternion.x, m.quaternion.y, m.quaternion.z, m.quaternion.w,
        npc.alive ? 1 : 0,
      ]);
      if (npcs.length >= 20) break;
    }
    if (npcs.length > 0) {
      MP.socket.send(JSON.stringify({ t: MP_TYPE_NPCTRANSFORM, npcs }));
    }
  }

  function mpUpdateRemoteProps(dt) {
    if (!game || !game.scene) return;
    const now = performance.now();
    const lerpSpeed = Math.min(1, dt * 14);
    for (const propId in MP.remoteProps) {
      const rp = MP.remoteProps[propId];
      if (now - rp.lastUpdate > 30000) {
        if (rp.mesh) { game.scene.remove(rp.mesh); rp.mesh.traverse(o => { if (o.geometry) o.geometry.dispose(); }); }
        delete MP.remoteProps[propId];
        continue;
      }
      if (!rp.mesh || !rp.mesh.parent) continue;
      if (rp.dragging) continue;
      rp.x += (rp.tx - rp.x) * lerpSpeed;
      rp.y += (rp.ty - rp.y) * lerpSpeed;
      rp.z += (rp.tz - rp.z) * lerpSpeed;
      rp.mesh.position.set(rp.x, rp.y, rp.z);
      const targetQ = new THREE.Quaternion(rp.qx, rp.qy, rp.qz, rp.qw);
      rp.mesh.quaternion.slerp(targetQ, lerpSpeed);
      if (rp.colBody) {
        rp.colBody.position.set(rp.x, rp.y, rp.z);
        rp.colBody.quaternion.set(rp.mesh.quaternion.x, rp.mesh.quaternion.y, rp.mesh.quaternion.z, rp.mesh.quaternion.w);
      }
    }
    for (const npcId in MP.remoteNpcs) {
      const rn = MP.remoteNpcs[npcId];
      if (now - rn.lastUpdate > 30000) {
        if (rn.mesh) { game.scene.remove(rn.mesh); rn.mesh.traverse(o => { if (o.geometry) o.geometry.dispose(); }); }
        delete MP.remoteNpcs[npcId];
        continue;
      }
      if (!rn.mesh || !rn.mesh.parent) continue;
      rn.x += (rn.tx - rn.x) * lerpSpeed;
      rn.y += (rn.ty - rn.y) * lerpSpeed;
      rn.z += (rn.tz - rn.z) * lerpSpeed;
      rn.mesh.position.set(rn.x, rn.y, rn.z);
      const tq = new THREE.Quaternion(rn.qx, rn.qy, rn.qz, rn.qw);
      rn.mesh.quaternion.slerp(tq, lerpSpeed);
    }
  }

  function mpClearRemoteProps() {
    if (game) {
      for (const propId in MP.remoteProps) {
        const rp = MP.remoteProps[propId];
        if (rp.colBody && game.world) game.world.removeBody(rp.colBody);
        if (rp.mesh) { game.scene.remove(rp.mesh); rp.mesh.traverse(o => { if (o.geometry) o.geometry.dispose(); }); }
      }
      for (const npcId in MP.remoteNpcs) {
        const rn = MP.remoteNpcs[npcId];
        if (rn.mesh) { game.scene.remove(rn.mesh); rn.mesh.traverse(o => { if (o.geometry) o.geometry.dispose(); }); }
      }
    }
    MP.remoteProps = {};
    MP.remoteNpcs = {};
  }

  function mpClearPropOwnership() {
    if (!game) return;
    for (const prop of game.props) {
      prop.mpId = undefined;
      prop.mpOwner = undefined;
    }
  }

  function mpClaimRemoteProp(hit) {
    const rp = hit.rp;
    if (!rp || !game) return null;
    rp.dragging = true;
    rp.draggerPid = MP.myPid;
    rp.mpId = hit.mpId;
    rp.dragDist = 8; // default drag distance
    if (MP.connected && MP.socket) {
      MP.socket.send(JSON.stringify({ t: MP_TYPE_GRAB, propId: hit.mpId }));
    }
    return {
      mesh: rp.mesh,
      body: null, // no local body — we send drag targets to the owner
      radius: rp.mesh.userData.radius || 0.8,
      _isRemoteDrag: true,
      _mpId: hit.mpId,
      _rp: rp,
    };
  }

  function mpSendDragUpdate() {
    if (!MP.connected || !MP.socket || !game || !MP.roomId) return;
    const now = performance.now();
    if (now - (MP.lastDragSend || 0) < 33) return; // 30Hz
    MP.lastDragSend = now;
    for (const propId in MP.remoteProps) {
      const rp = MP.remoteProps[propId];
      if (!rp.dragging) continue;
      const origin = game.player.pos.clone();
      const dir = getCameraForward(game);
      const dist = (game.grabbed && game.grabbed._isRemoteDrag && game.grabbed._rp === rp)
        ? (game.grabDist || 8) : (rp.dragDist || 8);
      const target = origin.add(dir.multiplyScalar(dist));
      const q = rp.mesh.quaternion;
      MP.socket.send(JSON.stringify({
        t: MP_TYPE_PROPDRAG, propId: parseInt(propId),
        x: target.x, y: target.y, z: target.z,
        qx: q.x, qy: q.y, qz: q.z, qw: q.w,
      }));
      rp.mesh.position.lerp(target, 0.5);
      rp.x = rp.mesh.position.x; rp.y = rp.mesh.position.y; rp.z = rp.mesh.position.z;
    }
  }

  function mpReleaseRemoteProp(stub, launch) {
    const rp = stub._rp;
    if (!rp) return;
    rp.dragging = false;
    const pos = rp.mesh.position;
    const q = rp.mesh.quaternion;
    const msg = {
      t: MP_TYPE_RELEASE, propId: stub._mpId,
      x: pos.x, y: pos.y, z: pos.z,
      qx: q.x, qy: q.y, qz: q.z, qw: q.w,
    };
    if (launch) {
      const fwd = getCameraForward(game);
      msg.vx = fwd.x * 40; msg.vy = fwd.y * 40; msg.vz = fwd.z * 40;
      msg.wx = (Math.random() - 0.5) * 15;
      msg.wy = (Math.random() - 0.5) * 15;
      msg.wz = (Math.random() - 0.5) * 15;
    }
    if (MP.connected && MP.socket) {
      MP.socket.send(JSON.stringify(msg));
    }
  }

  function mpUpdateCount() {
    const count = Object.keys(MP.players).length + (MP.connected ? 1 : 0);
    const el = document.getElementById("playerCount");
    if (el) el.textContent = count.toLocaleString();
  }

  function mpAddChat(name, color, text, isHost, isOwner) {
    const chatEl = document.getElementById("mpChat");
    if (!chatEl) return;
    const colStr = `rgb(${color[0]},${color[1]},${color[2]})`;
    const div = document.createElement("div");
    div.className = "mp-msg";
    const tag = isOwner ? '<span class="mp-ownertag">[OWNER]</span> '
              : isHost ? '<span class="mp-hosttag">[HOST]</span> ' : '';
    div.innerHTML = `<span class="mp-name" style="color:${colStr}">${escapeHtml(name)}</span><span class="mp-colon">:</span> ${tag}${escapeHtml(text)}`;
    chatEl.appendChild(div);
    while (chatEl.children.length > 50) chatEl.removeChild(chatEl.firstChild);
    chatEl.scrollTop = chatEl.scrollHeight;
    if (gameRunning) chatEl.classList.add("show");
    clearTimeout(MP.chatHideTimer);
    MP.chatHideTimer = setTimeout(() => {
      if (!mpChatOpen) chatEl.classList.remove("show");
    }, 10000);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
  }

  function openMpChat() {
    if (!MP.connected) return;
    mpChatOpen = true;
    const ctn = document.getElementById("mpChatInputCtn");
    const input = document.getElementById("mpChatInput");
    const chatEl = document.getElementById("mpChat");
    if (ctn) ctn.style.display = "block";
    if (chatEl) chatEl.classList.add("show");
    if (input) {
      input.value = "";
      input.focus();
    }
    if (document.pointerLockElement) document.exitPointerLock();
  }
  function closeMpChat() {
    mpChatOpen = false;
    const ctn = document.getElementById("mpChatInputCtn");
    if (ctn) ctn.style.display = "none";
    const chatEl = document.getElementById("mpChat");
    if (chatEl) {
      clearTimeout(MP.chatHideTimer);
      MP.chatHideTimer = setTimeout(() => chatEl.classList.remove("show"), 5000);
    }
  }
  function sendMpChat() {
    const input = document.getElementById("mpChatInput");
    if (!input) return;
    let text = input.value.trim();
    if (text) {
      text = callLuaHookResults("PlayerSay", text) !== false ? text : "";
      if (!text) { closeMpChat(); return; }
    }
    if (text && MP.connected && MP.socket) {
      MP.socket.send(JSON.stringify({ t: MP_TYPE_CHAT, text }));
      mpAddChat(MP.myName, mpMyColor(), text, mpIsHost(MP.myPid), mpIsGameOwner(MP.myPid));
    }
    closeMpChat();
  }

  function mpDisconnect() {
    if (MP.heartbeatTimer) { clearInterval(MP.heartbeatTimer); MP.heartbeatTimer = null; }
    if (MP.reconnectTimer) { clearTimeout(MP.reconnectTimer); MP.reconnectTimer = null; }
    if (MP.socket) {
      try { MP.socket.close(1000, "disconnect"); } catch(e) {}
      MP.socket = null;
    }
    MP.connected = false;
    MP.reconnecting = false;
    for (const pid in MP.players) {
      mpRemovePlayer(Number(pid));
    }
    MP.players = {};
    mpSetStatus("", "");
  }

  function mpCleanupScene() {
    for (const pid in MP.players) {
      const p = MP.players[pid];
      if (p.mesh && p.mesh.parent) p.mesh.parent.remove(p.mesh);
      if (p.nameplate && p.nameplate.parentElement) p.nameplate.parentElement.removeChild(p.nameplate);
    }
    MP.players = {};
    mpClearRemoteProps();
    mpClearPropOwnership();
  }

  let ctxPlayermenuOpen = false;
  const PM_COLOR_PRESETS = ["#ffb020","#ff4444","#44ff44","#4488ff","#ff44ff","#44ffff","#ffffff","#888888","#8b4513","#9370db"];

  function toggleContextPlayermenu() {
    ctxPlayermenuOpen = !ctxPlayermenuOpen;
    callLuaHook(ctxPlayermenuOpen ? "OnContextMenuOpen" : "OnContextMenuClose");
    const el = document.getElementById("ctxPlayermenu");
    if (!el) return;
    el.hidden = !ctxPlayermenuOpen;
    if (ctxPlayermenuOpen) {
      if (document.pointerLockElement) document.exitPointerLock();
      buildCtxPlayermenu();
    }
  }

  function buildCtxPlayermenu() {
    const grid = document.getElementById("ctxPmGrid");
    if (!grid) return;
    grid.innerHTML = "";
    for (const model of PLAYER_MODELS) {
      const div = document.createElement("div");
      div.className = "ctx-pm-item" + (model.id === playerModelId ? " selected" : "");
      const icon = document.createElement("div");
      icon.className = "ctx-pm-item-icon";
      icon.style.background = playerModelColor;
      const info = document.createElement("div");
      info.className = "ctx-pm-item-info";
      info.innerHTML = `<div class="ctx-pm-item-name">${escapeHtml(model.name)}</div><div class="ctx-pm-item-desc">${escapeHtml(model.desc)}</div>`;
      div.appendChild(icon);
      div.appendChild(info);
      div.onclick = () => {
        playerModelId = model.id;
        if (MP.connected && MP.socket) {
          const w0 = WEAPONS[currentWeapon];
          MP.socket.send(JSON.stringify({ t: MP_TYPE_NAME, name: MP.myName, color: mpMyColor(), modelId: playerModelId, weaponId: w0 ? w0.id : null }));
        }
        buildCtxPlayermenu();
      };
      grid.appendChild(div);
    }
    const colorInput = document.getElementById("ctxPmColor");
    if (colorInput) {
      colorInput.value = playerModelColor;
      colorInput.oninput = () => {
        playerModelColor = colorInput.value;
        const hex = playerModelColor.replace("#","");
        const r = parseInt(hex.substring(0,2),16);
        const g = parseInt(hex.substring(2,4),16);
        const b = parseInt(hex.substring(4,6),16);
        if (MP.connected && MP.socket) {
          try { localStorage.setItem("pm_mp_color", JSON.stringify([r,g,b])); } catch(e) {}
          const w0 = WEAPONS[currentWeapon];
          MP.socket.send(JSON.stringify({ t: MP_TYPE_NAME, name: MP.myName, color: [r,g,b], modelId: playerModelId, weaponId: w0 ? w0.id : null }));
        }
        buildCtxPlayermenu();
      };
    }
    const presetsEl = document.getElementById("ctxPmPresets");
    if (presetsEl) {
      presetsEl.innerHTML = "";
      for (const c of PM_COLOR_PRESETS) {
        const d = document.createElement("div");
        d.className = "ctx-pm-preset";
        d.style.background = c;
        d.onclick = () => {
          playerModelColor = c;
          const hex = c.replace("#","");
          const r = parseInt(hex.substring(0,2),16);
          const g = parseInt(hex.substring(2,4),16);
          const b = parseInt(hex.substring(4,6),16);
          if (MP.connected && MP.socket) {
            try { localStorage.setItem("pm_mp_color", JSON.stringify([r,g,b])); } catch(e) {}
            const w0 = WEAPONS[currentWeapon];
            MP.socket.send(JSON.stringify({ t: MP_TYPE_NAME, name: MP.myName, color: [r,g,b], modelId: playerModelId, weaponId: w0 ? w0.id : null }));
          }
          buildCtxPlayermenu();
        };
        presetsEl.appendChild(d);
      }
    }
  }

  function mpInit() {
    if (MP.initialized) return;
    MP.initialized = true;
    const input = document.getElementById("mpChatInput");
    if (input) {
      input.addEventListener("keydown", (e) => {
        e.stopPropagation();
        if (e.key === "Enter") { sendMpChat(); e.preventDefault(); }
        else if (e.key === "Escape") { closeMpChat(); e.preventDefault(); }
      });
    }
    const nameInput = document.getElementById("mpNameInput");
    if (nameInput) {
      nameInput.value = MP.myName || "";
      let nameDebounce = null;
      function sendNameUpdate() {
        let name = nameInput.value.trim().substring(0, 16);
        if (!name) name = mpPickName();
        MP.myName = name;
        try { localStorage.setItem("pm_mp_name", name); } catch(e) {}
        nameInput.value = name;
        if (MP.connected && MP.socket) {
          const w0 = WEAPONS[currentWeapon];
          MP.socket.send(JSON.stringify({ t: MP_TYPE_NAME, name: MP.myName, color: mpMyColor(), modelId: playerModelId, weaponId: w0 ? w0.id : null }));
        }
      }
      nameInput.addEventListener("input", () => {
        if (nameDebounce) clearTimeout(nameDebounce);
        nameDebounce = setTimeout(sendNameUpdate, 600);
      });
      nameInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") { e.preventDefault(); if (nameDebounce) clearTimeout(nameDebounce); sendNameUpdate(); nameInput.blur(); }
      });
      nameInput.addEventListener("blur", () => {
        if (nameDebounce) clearTimeout(nameDebounce);
        sendNameUpdate();
      });
    }
    mpConnect();
    mpUpdateCount();
  }

  window.resumeGame = resumeGame;
  window.returnToMenu = returnToMenu;
  window.pauseGame = pauseGame;
  window.pauseOptionsPanel = pauseOptionsPanel;
  window.setMasterVolume = setMasterVolume;
  window.cycleWeapon = cycleWeapon;
  window.confirmWeapon = confirmWeapon;
  window.cancelWeapon = cancelWeapon;
  window.silentDenyWeapon = silentDenyWeapon;
  window.selectMapCat = selectMapCat;
  window.findMpPanel = findMpPanel;
  window.mpQuickCreate = mpQuickCreate;
  window.mpJoinRoom = mpJoinRoom;
  window.mpRefreshRooms = mpRefreshRooms;
  window.stopMpRoomPoll = stopMpRoomPoll;
  window.renderAddonsPanel = renderAddonsPanel;
  window.subscribeAddonUrl = subscribeAddonUrl;
  window.subscribeAddonJson = subscribeAddonJson;
  window.toggleAddon = toggleAddon;
  window.removeAddon = removeAddon;
  window.workshopPanel = workshopPanel;
  window.publishToAddonWorkshop = publishToAddonWorkshop;
  window.installWorkshopAddon = installWorkshopAddon;
  window.storeBSPTexture = async function(name, url) {
    if (window.root && window.root.kv) {
      await window.root.kv.bspTextures.set(name.toLowerCase(), url);
      console.log("Stored BSP texture:", name, "→", url);
    }
  };
  setTimeout(() => { if (typeof loadStoredAddons === 'function') loadStoredAddons(); }, 100);
  setTimeout(() => { if (typeof loadCustomBinds === 'function') loadCustomBinds(); }, 100);
  setTimeout(() => { if (typeof mpInit === 'function') mpInit(); }, 500);
</script>
