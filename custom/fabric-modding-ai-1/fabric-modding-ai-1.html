<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>fabric-modding-ai-1 — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<div id="app" style="font-family: var(--vscode-font-family); background: var(--vscode-editor-background); color: var(--vscode-editor-foreground); height: 100vh; display: flex; flex-direction: column;">
  <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background: linear-gradient(135deg, #1e5128, #2d5a3e); color: white;">
    <div style="font-weight: bold; font-size: 18px;">⚒️ Fabric Modding AI</div>
    <div style="font-size: 12px; opacity: 0.8;">MC 1.21.10 | Fabric API 0.138.3 | Java 21</div>
  </div>
  
  <div style="display: flex; padding: 0 20px; border-bottom: 1px solid var(--vscode-panel-border);">
    <div id="tabsCtn" style="display: flex; overflow-x: auto;">
      <button class="tabBtn active" data-tab="main" style="padding: 10px 20px; background: none; border: none; color: var(--vscode-tab-activeForeground); cursor: pointer; border-bottom: 2px solid transparent;">Main</button>
      <button class="tabBtn" data-tab="entities" style="padding: 10px 20px; background: none; border: none; color: var(--vscode-tab-inactiveForeground); cursor: pointer; border-bottom: 2px solid transparent;">Entities</button>
      <button class="tabBtn" data-tab="blocks" style="padding: 10px 20px; background: none; border: none; color: var(--vscode-tab-inactiveForeground); cursor: pointer; border-bottom: 2px solid transparent;">Blocks</button>
      <button class="tabBtn" data-tab="items" style="padding: 10px 20px; background: none; border: none; color: var(--vscode-tab-inactiveForeground); cursor: pointer; border-bottom: 2px solid transparent;">Items</button>
      <button class="tabBtn" data-tab="commands" style="padding: 10px 20px; background: none; border: none; color: var(--vscode-tab-inactiveForeground); cursor: pointer; border-bottom: 2px solid transparent;">Commands</button>
      <button class="tabBtn" data-tab="screens" style="padding: 10px 20px; background: none; border: none; color: var(--vscode-tab-inactiveForeground); cursor: pointer; border-bottom: 2px solid transparent;">Screens</button>
      <button class="tabBtn" data-tab="mixins" style="padding: 10px 20px; background: none; border: none; color: var(--vscode-tab-inactiveForeground); cursor: pointer; border-bottom: 2px solid transparent;">Mixins</button>
    </div>
  </div>
  
  <div id="tabContentCtn" style="flex: 1; display: flex; flex-direction: column; overflow: hidden;">
    <div id="mainContent" class="tabContent" style="flex: 1; display: flex; flex-direction: column; padding: 20px;">
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px;">
        <button class="actionBtn" onclick="generateMod()" style="padding: 15px; background: linear-gradient(135deg, #1e5128, #2d5a3e); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;">⚙️ Setup New Mod</button>
        <button class="actionBtn" onclick="generateEntity()" style="padding: 15px; background: linear-gradient(135deg, #4a7c59, #2d5a3e); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;">🪲 Generate Entity</button>
        <button class="actionBtn" onclick="generateBlock()" style="padding: 15px; background: linear-gradient(135deg, #8b4513, #654321); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;">🧱 Generate Block</button>
        <button class="actionBtn" onclick="generateItem()" style="padding: 15px; background: linear-gradient(135deg, #483d8b, #4169e1); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;">📦 Generate Item</button>
        <button class="actionBtn" onclick="generateCommand()" style="padding: 15px; background: linear-gradient(135deg, #2e8b57, #3cb371); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;">💬 Generate Command</button>
        <button class="actionBtn" onclick="generateScreen()" style="padding: 15px; background: linear-gradient(135deg, #8b7355, #a0522d); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;">🖼️ Generate Screen</button>
      </div>
      
      <div style="flex: 1; overflow-y: auto; border: 1px solid var(--vscode-input-border); border-radius: 8px; padding: 15px; background: var(--vscode-textBlockQuote-background);">
        <div id="messagesCtn" style="display: flex; flex-direction: column; gap: 10px;">
          <div style="padding: 12px; background: var(--vscode-badge-background); border-radius: 8px;">
            <strong>Fabric Modding AI</strong> is ready! Select an action above or type a custom prompt below.
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <div style="padding: 15px 20px; border-top: 1px solid var(--vscode-panel-border); display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; gap: 10px; align-items: center;">
      <select id="modelSelect" style="padding: 8px; background: var(--vscode-dropdown-background); color: var(--vscode-dropdown-foreground); border: 1px solid var(--vscode-dropdown-border); border-radius: 4px; flex: 1;">
        <option value="sonar-pro">Sonar Pro (Fast Code)</option>
        <option value="sonar-research">Sonar Research (Complex)</option>
      </select>
      <button id="apiStatusBtn" style="padding: 8px 15px; background: var(--vscode-button-background); color: var(--vscode-button-foreground); border: none; border-radius: 4px; cursor: pointer;">Set API Key</button>
    </div>
    <div style="display: flex; gap: 10px;">
      <textarea id="promptInput" rows="2" placeholder="Type your modding prompt here... (e.g., 'Create a custom bee entity with pollination AI')" style="flex: 1; padding: 12px; background: var(--vscode-input-background); color: var(--vscode-input-foreground); border: 1px solid var(--vscode-input-border); border-radius: 6px; resize: none;"></textarea>
      <button id="sendBtn" onclick="sendPrompt()" style="padding: 12px 24px; background: #1e5128; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;">Send</button>
    </div>
  </div>
</div>

<script>
  // Mock VSCode API for standalone HTML testing
  let mockVscode = {
    postMessage: function(message) {
      // Simulate delayed response
      setTimeout(() => {
        handleMockResponse(message);
      }, 1000);
    }
  };
  
  // Mock response handler
  function handleMockResponse(message) {
    let response = { command: 'response' };
    
    switch (message.command) {
      case 'sendPrompt':
        response.content = `This would normally use ${message.model} to respond to: "${message.text}"\n\nIn a real VSCode extension, this would call the Perplexity API and return actual code.`;
        break;
      case 'generateMod':
        response.content = `✅ Fabric mod structure generated!\n\n// build.gradle\nplugins {\n    id 'fabric-loom' version '1.14.10'\n}\n\n// gradle.properties\nminecraft_version=1.21.10\nyarn_mappings=1.21.10+build.3\nloader_version=0.18.4`;
        break;
      case 'generateEntity':
        response.content = `✅ Generated ${message.name} entity!\n\npublic class ${message.name} extends PathfinderMob {\n    public ${message.name}(EntityType<? extends ${message.name}> entityType, Level level) {\n        super(entityType, level);\n    }\n    \n    // Custom AI and features would be here\n}`;
        break;
      case 'generateBlock':
        response.content = `✅ Generated ${message.name} block!\n\npublic class ${message.name} extends Block {\n    public ${message.name}(Properties settings) {\n        super(settings);\n    }\n    \n    // Custom block behavior would be here\n}`;
        break;
      case 'generateItem':
        response.content = `✅ Generated ${message.name} item!\n\npublic class ${message.name} extends Item {\n    public ${message.name}(Settings settings) {\n        super(settings);\n    }\n    \n    // Custom item behavior would be here\n}`;
        break;
      case 'generateCommand':
        response.content = `✅ Generated ${message.name} command!\n\npublic class ${message.name}Command {\n    public static void register(CommandDispatcher<CommandSourceStack> dispatcher) {\n        dispatcher.register(Commands.literal("${message.name}")\n            .executes(context -> execute(context)));\n    }\n    \n    private static int execute(CommandContext<CommandSourceStack> context) {\n        context.getSource().sendSuccess(() -> Component.literal("${message.name} executed!"), true);\n        return 1;\n    }\n}`;
        break;
      case 'generateScreen':
        response.content = `✅ Generated ${message.name} screen!\n\npublic class ${message.name} extends Screen {\n    public ${message.name}(Component title) {\n        super(title);\n    }\n    \n    @Override\n    protected void init() {\n        super.init();\n        // Initialize screen components\n    }\n    \n    @Override\n    public void render(PoseStack poseStack, int mouseX, int mouseY) {\n        renderBackground(poseStack);\n        super.render(poseStack, mouseX, mouseY);\n        // Custom rendering code\n    }\n}`;
        break;
      case 'setApiKey':
        localStorage.fabricApiKey = 'pplx-demo-key';
        response = { command: 'apiStatus', hasKey: true };
        break;
      case 'checkApiKey':
        response = { command: 'apiStatus', hasKey: !!localStorage.fabricApiKey };
        break;
      default:
        response = { command: 'error', content: 'Unknown command: ' + message.command };
    }
    
    // Dispatch the response
    window.dispatchEvent(new MessageEvent('message', { data: response }));
  }
  
  // Mock acquireVsCodeApi function
  function acquireVsCodeApi() {
    return mockVscode;
  }
  
  // Tab switching functionality
  const tabBtns = document.querySelectorAll('.tabBtn');
  const tabContents = document.querySelectorAll('.tabContent');
  
  tabBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      // Remove active class from all buttons
      tabBtns.forEach(b => {
        b.classList.remove('active');
        b.style.color = 'var(--vscode-tab-inactiveForeground)';
        b.style.borderBottom = '2px solid transparent';
      });
      
      // Add active class to clicked button
      btn.classList.add('active');
      btn.style.color = 'var(--vscode-tab-activeForeground)';
      btn.style.borderBottom = '2px solid var(--vscode-button-background)';
      
      // Show corresponding tab content (simplified for this demo)
      const tabName = btn.getAttribute('data-tab');
      // In a real implementation, we would show/hide tab content here
    });
  });
  
  // VSCode webview API (now mocked)
  const vscode = acquireVsCodeApi();
  
  // Send prompt to extension
  function sendPrompt() {
    const prompt = promptInput.value.trim();
    if (!prompt) return;
    
    // Add user message to chat
    addMessage('user', prompt);
    
    // Send to extension
    vscode.postMessage({
      command: 'sendPrompt',
      text: prompt,
      model: modelSelect.value
    });
    
    // Clear input
    promptInput.value = '';
  }
  
  // Add message to chat
  function addMessage(role, content) {
    const messageEl = document.createElement('div');
    messageEl.className = `message ${role}`;
    messageEl.style.padding = '12px';
    messageEl.style.borderRadius = '8px';
    messageEl.style.maxWidth = '90%';
    
    if (role === 'user') {
      messageEl.style.background = 'var(--vscode-badge-background)';
      messageEl.style.marginLeft = 'auto';
    } else {
      messageEl.style.background = 'var(--vscode-textBlockQuote-background)';
    }
    
    messageEl.textContent = content;
    messagesCtn.appendChild(messageEl);
    messagesCtn.scrollTop = messagesCtn.scrollHeight;
  }
  
  // Generator functions
  function generateMod() {
    vscode.postMessage({ command: 'generateMod' });
  }
  
  function generateEntity() {
    const name = prompt('Enter entity name (e.g., MyCustomEntity):');
    if (name) {
      vscode.postMessage({ 
        command: 'generateEntity',
        name: name,
        features: ['spawn egg', 'custom AI', 'server-side spawn rules']
      });
    }
  }
  
  function generateBlock() {
    const name = prompt('Enter block name (e.g., MyCustomBlock):');
    if (name) {
      vscode.postMessage({ 
        command: 'generateBlock',
        name: name,
        properties: ['custom shape', 'block entity']
      });
    }
  }
  
  function generateItem() {
    const name = prompt('Enter item name (e.g., MyCustomItem):');
    if (name) {
      vscode.postMessage({ 
        command: 'generateItem',
        name: name,
        properties: ['custom texture', 'food component']
      });
    }
  }
  
  function generateCommand() {
    const name = prompt('Enter command name (e.g., mycommand):');
    if (name) {
      vscode.postMessage({ 
        command: 'generateCommand',
        name: name,
        features: ['player target', 'permission level']
      });
    }
  }
  
  function generateScreen() {
    const name = prompt('Enter screen name (e.g., MyCustomScreen):');
    if (name) {
      vscode.postMessage({ 
        command: 'generateScreen',
        name: name,
        features: ['text input', 'button controls']
      });
    }
  }
  
  // Handle messages from extension
  window.addEventListener('message', event => {
    const message = event.data;
    
    switch (message.command) {
      case 'response':
        addMessage('assistant', message.content);
        break;
      case 'error':
        addMessage('assistant', `Error: ${message.content}`);
        break;
      case 'apiStatus':
        apiStatusBtn.textContent = message.hasKey ? '✅ API Key Set' : 'Set API Key';
        apiStatusBtn.style.background = message.hasKey ? 'var(--vscode-badge-background)' : 'var(--vscode-inputValidation-errorBackground)';
        break;
    }
  });
  
  // Send API key request
  apiStatusBtn.addEventListener('click', () => {
    vscode.postMessage({ command: 'setApiKey' });
  });
  
  // Handle Enter key in prompt input
  promptInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendPrompt();
    }
  });
  
  // Check API key status on load
  vscode.postMessage({ command: 'checkApiKey' });
</script>
</body>
</html>
