<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>plugin-architect-forge — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<div id="appCtn" style="font-family:system-ui,-apple-system,sans-serif; max-width:1100px; margin:auto; text-align:left; padding:1rem; color:#1e293b;">

  <div style="margin-bottom:1.2rem; border-bottom:2px solid #4f46e5; padding-bottom:0.6rem;">
    <h1 style="margin:0; font-size:1.6rem; color:#4f46e5;">Plugin Architect</h1>
    <p style="margin:0.3rem 0 0; font-size:0.9rem; color:#64748b;">Forge modular, production-ready Perchance plugins.</p>
  </div>

  <div style="display:flex; flex-wrap:wrap; gap:1.5rem;">
    <div id="configCtn" style="flex:0 0 300px; background:#f8fafc; border:1px solid #e2e8f0; border-radius:0.5rem; padding:1rem;">
      <h3 style="margin-top:0; font-size:1rem;">Blueprint</h3>
      <label style="display:block; margin-bottom:1rem; font-size:0.9rem;">
        Plugin Name
        <input id="pluginNameInput" value="myPlugin" style="display:block; width:100%; margin-top:0.3rem; padding:0.35rem; border:1px solid #cbd5e1; border-radius:0.25rem; font-size:0.9rem;">
      </label>
      <div style="margin-bottom:1rem; font-size:0.9rem;">
        Modules
        <label style="display:block; margin:0.35rem 0; font-size:0.85rem;"><input type="checkbox" id="listsChk" checked> Lists DSL</label>
        <label style="display:block; margin:0.35rem 0; font-size:0.85rem;"><input type="checkbox" id="htmlChk" checked> HTML UI</label>
        <label style="display:block; margin:0.35rem 0; font-size:0.85rem;"><input type="checkbox" id="cssChk" checked> CSS Styling</label>
        <label style="display:block; margin:0.35rem 0; font-size:0.85rem;"><input type="checkbox" id="jsChk" checked> JS Logic</label>
        <label style="display:block; margin:0.35rem 0; font-size:0.85rem;"><input type="checkbox" id="jsonChk"> JSON Data</label>
      </div>
      <label style="display:block; margin-bottom:0.5rem; font-size:0.9rem;">
        Lists (top-level names)
        <textarea id="listsInput" style="display:block; width:100%; height:110px; margin-top:0.3rem; padding:0.4rem; border:1px solid #cbd5e1; border-radius:0.25rem; font-family:monospace; font-size:0.8rem;">color
  red
  blue
  green
animal
  dog
  cat
  bird</textarea>
      </label>
      <div id="listValidationEl" style="font-size:0.75rem; min-height:1.2rem; margin-bottom:0.8rem;"></div>
      <button id="generateBtn" style="width:100%; padding:0.5rem; background:#4f46e5; color:white; border:none; border-radius:0.25rem; cursor:pointer; font-weight:600;">Generate Blueprint</button>
    </div>

    <div id="outputCtn" style="flex:1 1 400px; display:flex; flex-direction:column; gap:0.75rem;">
      <div style="display:flex; gap:0.4rem; flex-wrap:wrap;">
        <button id="tabListsBtn" style="padding:0.4rem 0.9rem; background:#4f46e5; color:white; border:none; border-radius:0.25rem; cursor:pointer; font-size:0.85rem;">Lists</button>
        <button id="tabHtmlBtn" style="padding:0.4rem 0.9rem; background:transparent; border:1px solid #e2e8f0; border-radius:0.25rem; cursor:pointer; font-size:0.85rem;">HTML</button>
        <button id="tabCssBtn" style="padding:0.4rem 0.9rem; background:transparent; border:1px solid #e2e8f0; border-radius:0.25rem; cursor:pointer; font-size:0.85rem;">CSS</button>
        <button id="tabJsBtn" style="padding:0.4rem 0.9rem; background:transparent; border:1px solid #e2e8f0; border-radius:0.25rem; cursor:pointer; font-size:0.85rem;">JS</button>
        <button id="tabJsonBtn" style="padding:0.4rem 0.9rem; background:transparent; border:1px solid #e2e8f0; border-radius:0.25rem; cursor:pointer; font-size:0.85rem;">JSON</button>
      </div>
      <div id="codeViewCtn" style="flex:1; background:#0f172a; color:#e2e8f0; border-radius:0.5rem; padding:1rem; font-family:ui-monospace,SFMono-Regular,monospace; font-size:0.8rem; overflow:auto; min-height:260px; white-space:pre-wrap; line-height:1.4;">Select modules and click Generate.</div>
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span id="statusEl" style="font-size:0.85rem; color:#64748b;">Ready.</span>
        <button id="copyBtn" style="padding:0.4rem 1rem; background:#10b981; color:white; border:none; border-radius:0.25rem; cursor:pointer; font-size:0.85rem;">Copy Block</button>
      </div>
    </div>
  </div>

  <div id="previewSectionCtn" style="margin-top:2rem; border-top:2px solid #e2e8f0; padding-top:1rem;">
    <h3 style="margin:0 0 0.6rem; font-size:1.05rem;">Live Preview</h3>
    <div id="livePreviewCtn" style="border:2px dashed #cbd5e1; border-radius:0.5rem; padding:1.5rem; min-height:100px; display:flex; align-items:center; justify-content:center; color:#64748b; background:#f8fafc;">Generated plugin preview will render here.</div>
  </div>
</div>

<style>
  .tabBtn { cursor:pointer; padding:0.4rem 0.9rem; border:1px solid #e2e8f0; border-radius:0.25rem; background:transparent; font-size:0.85rem; }
  .tabBtn:hover { opacity:0.85; }
</style>

<script type="module">
  let jsKeywords = new Set('break case catch class const continue debugger default delete do else export extends false finally for function if import in instanceof new null return super switch this throw true try typeof var void while with let static yield await'.split(' '));
  let currentTab = 'lists';
  let generatedBlocks = {};
  let tabOrder = ['lists','html','css','js','json'];

  function validateListNames() {
    let errors = [];
    let names = new Set();
    for (let line of listsInput.value.split('\n')) {
      let t = line.trim();
      if (!t || line.startsWith(' ')) continue;
      if (t.includes('-')) errors.push('"' + t + '" contains hyphens.');
      if (t.includes(' ')) errors.push('"' + t + '" contains spaces.');
      if (jsKeywords.has(t)) errors.push('"' + t + '" is a reserved JS keyword.');
      if (names.has(t)) errors.push('Duplicate list name: "' + t + '".');
      names.add(t);
    }
    listValidationEl.innerHTML = errors.length
      ? errors.map(e => '<span style="color:#dc2626;">&#10060; ' + e + '</span>').join('<br>')
      : '<span style="color:#10b981;">&#10004; All list names are valid.</span>';
    return !errors.length;
  }

  function generateBlueprint() {
    if (!validateListNames()) {
      statusEl.textContent = 'Fix validation errors before generating.';
      statusEl.style.color = '#dc2626';
      return;
    }
    statusEl.textContent = 'Blueprint generated.';
    statusEl.style.color = '#059669';
    let rawName = (pluginNameInput.value || 'myPlugin').replace(/[^a-zA-Z0-9_]/g, '');
    let name = rawName || 'myPlugin';
    let blocks = {};
    if (listsChk.checked) {
      blocks.lists = '# ===== ' + name + ' :: Lists DSL =====\n' + listsInput.value.trim() + '\n';
    }
    if (cssChk.checked) {
      blocks.css = '/* ===== ' + name + ' :: Scoped CSS ===== */\n#' + name + 'Ctn { text-align:left; }\n.' + name + 'Btn { cursor:pointer; padding:0.5rem 1rem; border:none; border-radius:0.25rem; background:#4f46e5; color:white; }\n.' + name + 'Btn:hover { background:#4338ca; }\n';
    }
    if (htmlChk.checked) {
      blocks.html = '<!-- ===== ' + name + ' :: HTML UI ===== -->\n<div id="' + name + 'Ctn">\n  <h3>' + name + '</h3>\n  <button class="' + name + 'Btn" onclick="run' + name + '()">Generate</button>\n  <div id="' + name + 'OutputEl" style="margin-top:0.75rem; white-space:pre-wrap;"></div>\n</div>\n';
    }
    if (jsChk.checked) {
      blocks.js = '// ===== ' + name + ' :: JS Logic =====\nfunction run' + name + '() {\n  // Replace with your generator logic\n  ' + name + 'OutputEl.textContent = "Hello from ' + name + '!";\n}\nwindow.run' + name + ' = run' + name + '; // Export for HTML onclick\n';
    }
    if (jsonChk.checked) {
      let payload = {pluginName: name, generatedAt: Date.now(), modules: []};
      if (listsChk.checked) payload.modules.push('lists');
      if (htmlChk.checked) payload.modules.push('html');
      if (cssChk.checked) payload.modules.push('css');
      if (jsChk.checked) payload.modules.push('js');
      blocks.json = '// ===== ' + name + ' :: JSON Config =====\nlet ' + name + 'Config = ' + JSON.stringify(payload, null, 2) + ';\n';
    }
    generatedBlocks = blocks;
    switchTab(currentTab);
    renderPreview(name);
  }

  function switchTab(tab) {
    currentTab = tab;
    let ids = {lists: tabListsBtn, html: tabHtmlBtn, css: tabCssBtn, js: tabJsBtn, json: tabJsonBtn};
    for (let key in ids) {
      let btn = ids[key];
      if (key === tab) {
        btn.style.cssText = 'padding:0.4rem 0.9rem; background:#4f46e5; color:white; border:none; border-radius:0.25rem; cursor:pointer; font-size:0.85rem;';
      } else {
        btn.style.cssText = 'padding:0.4rem 0.9rem; background:transparent; border:1px solid #e2e8f0; border-radius:0.25rem; cursor:pointer; font-size:0.85rem;';
      }
    }
    renderCurrentTab();
  }

  function renderCurrentTab() {
    codeViewCtn.textContent = generatedBlocks[currentTab] || '// Module not selected or empty.';
  }

  async function copyCode() {
    let text = codeViewCtn.textContent;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
      } else {
        let ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
      }
      copyBtn.textContent = 'Copied!';
    } catch (err) {
      copyBtn.textContent = 'Copy failed';
    }
    setTimeout(() => copyBtn.textContent = 'Copy Block', 1200);
  }

  function renderPreview(name) {
    if (!htmlChk.checked) {
      livePreviewCtn.innerHTML = '<span>Enable the HTML module to see a preview.</span>';
      return;
    }
    let styleBlock = '';
    if (cssChk.checked) {
      styleBlock = '<style>#' + name + 'Ctn { text-align:left; } .' + name + 'Btn { cursor:pointer; padding:0.5rem 1rem; border:none; border-radius:0.25rem; background:#4f46e5; color:white; } .' + name + 'Btn:hover { background:#4338ca; }</style>';
    }
    livePreviewCtn.innerHTML = styleBlock + '<div id="' + name + 'Ctn" style="text-align:left;"><h3 style="margin-top:0;">' + name + '</h3><button class="' + name + 'Btn" onclick="alert(\'This would call run' + name + '()\')">Generate</button><div id="' + name + 'OutputEl" style="margin-top:0.75rem; color:#475569;">Output area</div></div>';
  }

  function init() {
    validateListNames();
    generateBtn.onclick = generateBlueprint;
    tabListsBtn.onclick = () => switchTab('lists');
    tabHtmlBtn.onclick = () => switchTab('html');
    tabCssBtn.onclick = () => switchTab('css');
    tabJsBtn.onclick = () => switchTab('js');
    tabJsonBtn.onclick = () => switchTab('json');
    copyBtn.onclick = copyCode;
    listsInput.oninput = validateListNames;
    generateBlueprint();
  }

  // Expose to window so inline onclick in preview works if needed, and init
  window.generateBlueprint = generateBlueprint;
  window.copyCode = copyCode;
  window.switchTab = switchTab;

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
</script>
</body>
</html>
