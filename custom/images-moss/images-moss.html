<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>images-moss — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<!-- Image Generator UI with Enhanced Features -->
<div
  id="imageGenerator"
  style="
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-width: 800px;
    margin: auto;
  "
>
  <!-- Top Bar with Accessibility Toggle -->
  <div style="display: flex; justify-content: space-between; align-items: center;">
    <button
      onclick="showRandomPrompt()"
      title="Get a random prompt idea"
      style="
        background: #3e3e3e;
        color: #d4d4d4;
        border: 1px solid #555;
        padding: 5px 10px;
        border-radius: 3px;
        cursor: pointer;
      "
    >
      🎲 Random Prompt
    </button>
    <button
      onclick="toggleAccessibility()"
      title="Toggle high contrast mode"
      style="
        background: #2e2e2e;
        color: #d4d4d4;
        border: 1px solid #3e3e3e;
        padding: 5px 10px;
        border-radius: 3px;
        cursor: pointer;
      "
    >
      ♿ Accessibility
    </button>
  </div>

  <!-- Prompt Templates and Input Row -->
  <div style="display: flex; flex-direction: column; gap: 5px">
    <div style="display: flex; gap: 10px;">
      <select
        id="promptTemplates"
        aria-label="Prompt templates"
        style="
          flex: 1;
          background: #1e1e1e;
          color: #d4d4d4;
          border: 1px solid #3e3e3e;
          padding: 5px;
          border-radius: 3px;
        "
      >
        <option value="">Choose a template...</option>
        <option value="A futuristic city skyline at sunset">
          Futuristic City
        </option>
        <option value="A cozy cabin in snowy woods">Winter Cabin</option>
        <option value="A surreal dreamscape with floating islands">
          Surreal Dream
        </option>
        <option value="A majestic dragon soaring over mountains">
          Epic Dragon
        </option>
        <option value="A serene Japanese zen garden with koi pond">
          Zen Garden
        </option>
      </select>
      <button
        onclick="generateAIPrompt()"
        title="Generate AI-enhanced prompt"
        style="
          background: #5e2e8e;
          color: white;
          border: 1px solid #7e4eae;
          padding: 5px 10px;
          border-radius: 3px;
          cursor: pointer;
        "
      >
        ✨ AI Prompt
      </button>
    </div>

    <div style="display: flex; gap: 5px">
      <input
        type="text"
        id="imagePromptInput"
        placeholder="Describe an image to generate..."
        aria-label="Image prompt"
        style="
          flex-grow: 1;
          background: #1e1e1e;
          color: #d4d4d4;
          border: 1px solid #3e3e3e;
          padding: 8px;
          border-radius: 3px;
        "
      />
      <button
        onclick="startVoiceInput()"
        title="Speak your prompt"
        style="
          background: #3e3e3e;
          color: #d4d4d4;
          border: 1px solid #555;
          padding: 8px 10px;
          border-radius: 3px;
          cursor: pointer;
        "
      >
        🎤
      </button>
      <button
        onclick="enhancePrompt()"
        title="Enhance with AI"
        style="
          background: #0e7c4e;
          color: white;
          border: 1px solid #2e9c6e;
          padding: 8px 10px;
          border-radius: 3px;
          cursor: pointer;
        "
      >
        🚀 Enhance
      </button>
      <button
        id="generateImageBtn"
        style="
          background: #0e639c;
          color: white;
          border: 1px solid #007acc;
          padding: 8px 15px;
          border-radius: 3px;
          cursor: pointer;
        "
      >
        Generate
      </button>
    </div>
  </div>

  <!-- Style Blending Options -->
  <div
    style="
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 8px;
      background: #252526;
      border-radius: 3px;
    "
  >
    <span style="color: #d4d4d4; font-weight: bold">Style Blending:</span>
    <label><input type="checkbox" value="realistic" checked /> Realistic</label>
    <label><input type="checkbox" value="cartoon" /> Cartoon</label>
    <label><input type="checkbox" value="abstract" /> Abstract</label>
    <label><input type="checkbox" value="anime" /> Anime</label>
    <label><input type="checkbox" value="oil-painting" /> Oil Painting</label>
    <label><input type="checkbox" value="watercolor" /> Watercolor</label>
    <label><input type="checkbox" value="pixel-art" /> Pixel Art</label>
    <label><input type="checkbox" value="low-poly" /> Low Poly</label>
    <label><input type="checkbox" value="cyberpunk" /> Cyberpunk</label>
    <label><input type="checkbox" value="steampunk" /> Steampunk</label>
    <label><input type="checkbox" value="vintage" /> Vintage</label>
    <label><input type="checkbox" value="graffiti" /> Graffiti</label>
    <label><input type="checkbox" value="surrealism" /> Surrealism</label>
    <label><input type="checkbox" value="impressionist" /> Impressionist</label>
    <label><input type="checkbox" value="expressionist" /> Expressionist</label>
    <label><input type="checkbox" value="cubism" /> Cubism</label>
    <label><input type="checkbox" value="pop-art" /> Pop Art</label>
    <label><input type="checkbox" value="gothic" /> Gothic</label>
    <label><input type="checkbox" value="minimalist" /> Minimalist</label>
    <label><input type="checkbox" value="futuristic" /> Futuristic</label>
    <label><input type="checkbox" value="retro" /> Retro</label>
    <label><input type="checkbox" value="fantasy" /> Fantasy</label>
    <label><input type="checkbox" value="noir" /> Noir</label>
    <label><input type="checkbox" value="vaporwave" /> Vaporwave</label>
    <label><input type="checkbox" value="synthwave" /> Synthwave</label>
    <label><input type="checkbox" value="dieselpunk" /> Dieselpunk</label>
    <label><input type="checkbox" value="other" /> Other</label>
    <button
      onclick="selectAllStyles()"
      style="
        background: transparent;
        color: #888;
        border: none;
        cursor: pointer;
        font-size: 12px;
        margin-left: auto;
      "
    >
      Select All
    </button>
    <button
      onclick="clearAllStyles()"
      style="
        background: transparent;
        color: #888;
        border: none;
        cursor: pointer;
        font-size: 12px;
      "
    >
      Clear All
    </button>
  </div>

  <!-- Basic Options Row -->
  <div style="display: flex; gap: 10px; flex-wrap: wrap">
    <select
      id="imageSize"
      aria-label="Image size"
      style="
        flex: 1;
        min-width: 120px;
        background: #1e1e1e;
        color: #d4d4d4;
        border: 1px solid #3e3e3e;
        padding: 5px;
      "
    >
      <option value="small">512x512</option>
      <option value="medium" selected>768x768</option>
      <option value="large">1024x1024</option>
      <option value="xlarge">X-Large (1536x1536)</option>
      <option value="xxlarge">XX-Large (2048x2048)</option>
      <option value="xxxlarge">XXX-Large (2560x2560)</option>
      <option value="xxxxlarge">XXXX-Large (3072x3072)</option>
      <option value="xxxxxlarge">XXXXX-Large (3584x3584)</option>
      <option value="huge">Huge (4096x4096)</option>
      <option value="custom">Custom Size</option>
    </select>
    <select
      id="imageQuality"
      aria-label="Image quality"
      style="
        flex: 1;
        min-width: 120px;
        background: #1e1e1e;
        color: #d4d4d4;
        border: 1px solid #3e3e3e;
        padding: 5px;
      "
    >
      <option value="draft">Draft</option>
      <option value="standard" selected>Standard</option>
      <option value="high">High</option>
      <option value="ultra">Ultra</option>
      <option value="masterpiece">Masterpiece</option>
      <option value="photorealistic">Photorealistic</option>
      <option value="cinematic">Cinematic</option>
      <option value="artistic">Artistic</option>
      <option value="painterly">Painterly</option>
      <option value="sketch">Sketch</option>
      <option value="line-art">Line Art</option>
      <option value="vector">Vector</option>
      <option value="3d-render">3D Render</option>
      <option value="pixel-perfect">Pixel Perfect</option>
      <option value="retro-8bit">Retro 8-bit</option>
    </select>
    <select
      id="exportFormat"
      aria-label="Export format"
      style="
        flex: 1;
        min-width: 120px;
        background: #1e1e1e;
        color: #d4d4d4;
        border: 1px solid #3e3e3e;
        padding: 5px;
      "
    >
      <option value="png">PNG</option>
      <option value="jpeg">JPEG</option>
      <option value="webp">WebP</option>
      <option value="svg">SVG</option>
    </select>
  </div>

  <!-- Advanced Options (Collapsible) -->
  <div style="margin-top: 5px">
    <button
      id="toggleAdvancedBtn"
      style="
        background: #2e2e2e;
        color: #d4d4d4;
        border: 1px solid #3e3e3e;
        padding: 5px 10px;
        border-radius: 3px;
        cursor: pointer;
        width: 100%;
        text-align: left;
      "
    >
      Show Advanced Options ▼
    </button>
    <div
      id="advancedOptionsCtn"
      style="
        display: none;
        margin-top: 10px;
        padding: 10px;
        border: 1px solid #3e3e3e;
        border-radius: 3px;
        background: #252526;
      "
    >
      <div
        style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px"
      >
        <div style="flex: 1; min-width: 200px">
          <label style="display: block; margin-bottom: 5px; color: #d4d4d4"
            >Aspect Ratio</label
          >
          <select
            id="aspectRatio"
            style="
              width: 100%;
              background: #1e1e1e;
              color: #d4d4d4;
              border: 1px solid #3e3e3e;
              padding: 5px;
            "
          >
            <option value="1:1" selected>1:1 (Square)</option>
            <option value="16:9">16:9 (Landscape)</option>
            <option value="9:16">9:16 (Portrait)</option>
            <option value="4:3">4:3</option>
            <option value="3:4">3:4</option>
            <option value="21:9">21:9 (Ultrawide)</option>
            <option value="3:2">3:2</option>
            <option value="2:3">2:3</option>
            <option value="5:4">5:4</option>
            <option value="4:5">4:5</option>
            <option value="golden">Golden Ratio (1.618:1)</option>
            <option value="silver">Silver Ratio (2.414:1)</option>
            <option value="plastic">Plastic Number (1.325:1)</option>
            <option value="superior">Superior Highly Composite</option>
            <option value="triangular">Triangular (T(n):T(n+1))</option>
            <option value="fibonacci">Fibonacci (approx. 1.618:1)</option>
          </select>
        </div>
        <div style="flex: 1; min-width: 200px">
          <label style="display: block; margin-bottom: 5px; color: #d4d4d4"
            >Color Scheme</label
          >
          <select
            id="colorScheme"
            style="
              width: 100%;
              background: #1e1e1e;
              color: #d4d4d4;
              border: 1px solid #3e3e3e;
              padding: 5px;
            "
          >
            <option value="vibrant" selected>Vibrant</option>
            <option value="pastel">Pastel</option>
            <option value="monochrome">Monochrome</option>
            <option value="sepia">Sepia</option>
            <option value="cool">Cool Tones</option>
            <option value="warm">Warm Tones</option>
            <option value="neon">Neon</option>
            <option value="earth">Earth Tones</option>
            <option value="metallic">Metallic</option>
            <option value="retro">Retro</option>
            <option value="futuristic">Futuristic</option>
            <option value="fantasy">Fantasy</option>
            <option value="cyberpunk">Cyberpunk</option>
            <option value="steampunk">Steampunk</option>
            <option value="gothic">Gothic</option>
            <option value="minimalist">Minimalist</option>
          </select>
        </div>
      </div>

      <div
        style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px"
      >
        <div style="flex: 1; min-width: 200px">
          <label style="display: block; margin-bottom: 5px; color: #d4d4d4"
            >Lighting</label
          >
          <select
            id="lighting"
            style="
              width: 100%;
              background: #1e1e1e;
              color: #d4d4d4;
              border: 1px solid #3e3e3e;
              padding: 5px;
            "
          >
            <option value="natural" selected>Natural</option>
            <option value="studio">Studio</option>
            <option value="golden-hour">Golden Hour</option>
            <option value="blue-hour">Blue Hour</option>
            <option value="dramatic">Dramatic</option>
            <option value="soft">Soft</option>
            <option value="harsh">Harsh</option>
            <option value="neon">Neon</option>
            <option value="cinematic">Cinematic</option>
            <option value="volumetric">Volumetric</option>
            <option value="backlit">Backlit</option>
            <option value="rim-light">Rim Light</option>
          </select>
        </div>
        <div style="flex: 1; min-width: 200px">
          <label style="display: block; margin-bottom: 5px; color: #d4d4d4"
            >Composition</label
          >
          <select
            id="composition"
            style="
              width: 100%;
              background: #1e1e1e;
              color: #d4d4d4;
              border: 1px solid #3e3e3e;
              padding: 5px;
            "
          >
            <option value="balanced" selected>Balanced</option>
            <option value="rule-of-thirds">Rule of Thirds</option>
            <option value="centered">Centered</option>
            <option value="diagonal">Diagonal</option>
            <option value="leading-lines">Leading Lines</option>
            <option value="symmetry">Symmetry</option>
            <option value="asymmetry">Asymmetry</option>
            <option value="minimal">Minimal</option>
            <option value="dynamic">Dynamic</option>
            <option value="panoramic">Panoramic</option>
          </select>
        </div>
      </div>

      <div
        style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px"
      >
        <div style="flex: 1; min-width: 200px">
          <label style="display: block; margin-bottom: 5px; color: #d4d4d4"
            >Negative Prompt</label
          >
          <input
            type="text"
            id="negativePrompt"
            placeholder="What to avoid in the image..."
            style="
              width: 100%;
              background: #1e1e1e;
              color: #d4d4d4;
              border: 1px solid #3e3e3e;
              padding: 5px;
            "
          />
        </div>
        <div style="flex: 1; min-width: 200px">
          <label style="display: block; margin-bottom: 5px; color: #d4d4d4"
            >Seed (for reproducibility)</label
          >
          <input
            type="text"
            id="seedInput"
            placeholder="Leave blank for random"
            style="
              width: 100%;
              background: #1e1e1e;
              color: #d4d4d4;
              border: 1px solid #3e3e3e;
              padding: 5px;
            "
          />
        </div>
      </div>

      <div style="display: flex; gap: 10px; flex-wrap: wrap">
        <div style="flex: 1; min-width: 200px">
          <label style="display: block; margin-bottom: 5px; color: #d4d4d4"
            >Creativity Level</label
          >
          <input
            type="range"
            id="creativitySlider"
            min="1"
            max="10"
            value="5"
            style="width: 100%"
          />
          <div
            style="
              display: flex;
              justify-content: space-between;
              color: #888;
              font-size: 12px;
            "
          >
            <span>Literal</span>
            <span>Creative</span>
          </div>
        </div>
        <div style="flex: 1; min-width: 200px">
          <label style="display: block; margin-bottom: 5px; color: #d4d4d4"
            >Detail Level</label
          >
          <input
            type="range"
            id="detailSlider"
            min="1"
            max="10"
            value="7"
            style="width: 100%"
          />
          <div
            style="
              display: flex;
              justify-content: space-between;
              color: #888;
              font-size: 12px;
            "
          >
            <span>Simple</span>
            <span>Detailed</span>
          </div>
        </div>
        <div style="flex: 1; min-width: 200px">
          <label style="display: block; margin-bottom: 5px; color: #d4d4d4"
            >Number of Images</label
          >
          <select
            id="imageCount"
            style="
              width: 100%;
              background: #1e1e1e;
              color: #d4d4d4;
              border: 1px solid #3e3e3e;
              padding: 5px;
            "
          >
            <option value="1" selected>1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
            <option value="11">11</option>
            <option value="12">12</option>
          </select>
        </div>
      </div>

      <div
        style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px"
      >
        <div style="flex: 1; min-width: 200px">
          <label style="display: block; margin-bottom: 5px; color: #d4d4d4"
            >Prompt Variations</label
          >
          <select
            id="promptVariations"
            style="
              width: 100%;
              background: #1e1e1e;
              color: #d4d4d4;
              border: 1px solid #3e3e3e;
              padding: 5px;
            "
          >
            <option value="0" selected>None</option>
            <option value="1">1 Variation</option>
            <option value="2">2 Variations</option>
            <option value="3">3 Variations</option>
            <option value="4">4 Variations</option>
            <option value="5">5 Variations</option>
          </select>
        </div>
        <div style="flex: 1; min-width: 200px">
          <label style="display: block; margin-bottom: 5px; color: #d4d4d4"
            >Custom Size</label
          >
          <div style="display: flex; gap: 5px">
            <input
              type="number"
              id="customWidth"
              placeholder="Width"
              min="64"
              max="8192"
              style="
                flex: 1;
                background: #1e1e1e;
                color: #d4d4d4;
                border: 1px solid #3e3e3e;
                padding: 5px;
              "
            />
            <input
              type="number"
              id="customHeight"
              placeholder="Height"
              min="64"
              max="8192"
              style="
                flex: 1;
                background: #1e1e1e;
                color: #d4d4d4;
                border: 1px solid #3e3e3e;
                padding: 5px;
              "
            />
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Loading Indicator -->
  <div
    id="loadingIndicator"
    style="display: none; text-align: center; padding: 20px"
  >
    <div class="spinner"></div>
    <p style="margin-top: 10px; color: #d4d4d4">Generating image(s)...</p>
    <div
      id="progressBar"
      style="
        width: 100%;
        height: 5px;
        background: #3e3e3e;
        border-radius: 3px;
        margin-top: 10px;
        overflow: hidden;
      "
    >
      <div
        id="progressFill"
        style="
          height: 100%;
          background: #0e639c;
          width: 0%;
          transition: width 0.3s;
        "
      ></div>
    </div>
  </div>

  <!-- Image Display and Editing -->
  <div id="generatedImageContainer" style="text-align: center">
    <div
      id="imageGallery"
      style="
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 15px;
        margin-top: 15px;
      "
    ></div>
    <canvas
      id="editCanvas"
      width="600"
      height="300"
      style="
        display: none;
        margin-top: 15px;
        border: 1px solid #3e3e3e;
        border-radius: 3px;
      "
    ></canvas>
    <div id="singleImageActions" style="margin-top: 15px; display: none">
      <button
        onclick="copyImage()"
        style="
          background: #3e3e3e;
          color: #d4d4d4;
          border: 1px solid #555;
          padding: 5px 10px;
          border-radius: 3px;
          cursor: pointer;
        "
      >
        📋 Copy
      </button>
      <button
        onclick="downloadImage()"
        style="
          background: #3e3e3e;
          color: #d4d4d4;
          border: 1px solid #555;
          padding: 5px 10px;
          border-radius: 3px;
          cursor: pointer;
        "
      >
        ⬇️ Download
      </button>
      <button
        onclick="regenerateImage()"
        style="
          background: #3e3e3e;
          color: #d4d4d4;
          border: 1px solid #555;
          padding: 5px 10px;
          border-radius: 3px;
          cursor: pointer;
        "
      >
        🔄 Regenerate
      </button>
      <button
        onclick="saveAsFavorite()"
        style="
          background: #3e3e3e;
          color: #d4d4d4;
          border: 1px solid #555;
          padding: 5px 10px;
          border-radius: 3px;
          cursor: pointer;
        "
      >
        ⭐ Save
      </button>
      <button
        onclick="enableEditing()"
        style="
          background: #3e3e3e;
          color: #d4d4d4;
          border: 1px solid #555;
          padding: 5px 10px;
          border-radius: 3px;
          cursor: pointer;
        "
      >
        ✂️ Edit
      </button>
      <button
        onclick="shareImage()"
        style="
          background: #3e3e3e;
          color: #d4d4d4;
          border: 1px solid #555;
          padding: 5px 10px;
          border-radius: 3px;
          cursor: pointer;
        "
      >
        🔗 Share
      </button>
    </div>
    <div id="editActions" style="margin-top: 15px; display: none">
      <button
        onclick="applyCrop()"
        style="
          background: #3e3e3e;
          color: #d4d4d4;
          border: 1px solid #555;
          padding: 5px 10px;
          border-radius: 3px;

  <!-- Prompt History -->
  <div style="margin-top: 20px">

<script>
  // DOM Elements
  const promptInput = document.getElementById("imagePromptInput");
  const generateBtn = document.getElementById("generateImageBtn");
  const imageGallery = document.getElementById("imageGallery");
  const singleImageActions = document.getElementById("singleImageActions");
  const editActions = document.getElementById("editActions");
  const editCanvas = document.getElementById("editCanvas");
  const promptHistory = document.getElementById("promptHistory");
  const favoritesList = document.getElementById("favoritesList");
  const loadingIndicator = document.getElementById("loadingIndicator");
  const toggleAdvancedBtn = document.getElementById("toggleAdvancedBtn");
  const advancedOptionsCtn = document.getElementById("advancedOptionsCtn");
  const promptTemplates = document.getElementById("promptTemplates");
  const aiSuggestions = document.getElementById("aiSuggestions");
  const progressFill = document.getElementById("progressFill");

  // State
  let generatedImages = [];
  let selectedImageIndex = -1;
  let lastUsedSettings = {};
  let isEditing = false;
  let cropStart = null;
  let cropEnd = null;
  let currentGenerationPromise = null;

  // Initialize prompt templates
  promptTemplates.onchange = (e) => {
    if (e.target.value) promptInput.value = e.target.value;
  };

  // Toggle Advanced Options
  toggleAdvancedBtn.onclick = () => {
    if (advancedOptionsCtn.style.display === "none") {
      advancedOptionsCtn.style.display = "block";
      toggleAdvancedBtn.textContent = "Hide Advanced Options ▲";
    } else {
      advancedOptionsCtn.style.display = "none";
      toggleAdvancedBtn.textContent = "Show Advanced Options ▼";
    }
  };

  // Generate Images
  generateBtn.onclick = async () => {
    if (currentGenerationPromise) {
      if (confirm("A generation is already in progress. Do you want to cancel it?")) {
        currentGenerationPromise.stop();
        currentGenerationPromise = null;
        return;
      } else {
        return;
      }
    }

    const prompt = promptInput.value.trim();
    if (!prompt) return alert("Please enter an image description");

    // Collect all settings
    const settings = {
      prompt,
      size: document.getElementById("imageSize").value,
      quality: document.getElementById("imageQuality").value,
      aspectRatio: document.getElementById("aspectRatio").value,
      colorScheme: document.getElementById("colorScheme").value,
      lighting: document.getElementById("lighting").value,
      composition: document.getElementById("composition").value,
      negativePrompt: document.getElementById("negativePrompt").value.trim(),
      seed: document.getElementById("seedInput").value.trim(),
      creativity: document.getElementById("creativitySlider").value,
      detail: document.getElementById("detailSlider").value,
      count: parseInt(document.getElementById("imageCount").value),
      exportFormat: document.getElementById("exportFormat").value,
      style: getBlendedStyles(),
      variations: parseInt(document.getElementById("promptVariations").value),
      customWidth: document.getElementById("customWidth").value,
      customHeight: document.getElementById("customHeight").value,
    };

    // Save settings for regeneration
    lastUsedSettings = { ...settings };

    // Show loading indicator
    loadingIndicator.style.display = "block";
    generateBtn.disabled = true;
    generateBtn.textContent = "Cancel Generation";
    imageGallery.innerHTML = "";
    generatedImages = [];
    singleImageActions.style.display = "none";
    progressFill.style.width = "0%";

    try {
      // Generate images based on count and variations
      const imagePromises = [];
      const totalImages = settings.count * (1 + settings.variations);
      let completedImages = 0;

      // Generate original prompt images
      for (let i = 0; i < settings.count; i++) {
        imagePromises.push(
          generateImageWithProgress(settings.prompt, settings, i, completedImages, totalImages)
        );
        completedImages++;
      }

      // Generate variations if specified
      if (settings.variations > 0) {
        for (let v = 0; v < settings.variations; v++) {
          const variationPrompt = await generatePromptVariation(settings.prompt);
          for (let i = 0; i < settings.count; i++) {
            imagePromises.push(
              generateImageWithProgress(variationPrompt, settings, i + v * settings.count, completedImages, totalImages)
            );
            completedImages++;
          }
        }
      }

      // Wait for all images to generate
      const dataUrls = await Promise.all(imagePromises);

      // Store generated images
      generatedImages = dataUrls;

      // Display images
      dataUrls.forEach((url, index) => {
        addToGallery(url, settings.prompt, index);
      });

      // Show actions if at least one image was generated
      if (dataUrls.length > 0) {
        singleImageActions.style.display = "flex";
      }

      // Save to history
      saveToHistory(settings, dataUrls[0]);

      // Generate AI suggestions for next prompts
      generateSuggestions(settings.prompt);
    } catch (err) {
      console.error("Image generation failed:", err);
      alert("Something went wrong. Try again.");
    } finally {
      loadingIndicator.style.display = "none";
      generateBtn.disabled = false;
      generateBtn.textContent = "Generate";
      currentGenerationPromise = null;
    }
  };

  // Generate image with progress tracking
  async function generateImageWithProgress(prompt, settings, index, completed, total) {
    try {
      // Build full prompt with all settings
      let fullPrompt = `${prompt} | Style: ${settings.style} | Size: ${settings.size} | Quality: ${settings.quality}`;
      fullPrompt += ` | Aspect Ratio: ${settings.aspectRatio} | Color: ${settings.colorScheme}`;
      fullPrompt += ` | Lighting: ${settings.lighting} | Composition: ${settings.composition}`;
      fullPrompt += ` | Creativity: ${settings.creativity}/10 | Detail: ${settings.detail}/10`;

      if (settings.negativePrompt) fullPrompt += ` | Avoid: ${settings.negativePrompt}`;
      if (settings.seed) fullPrompt += ` | Seed: ${settings.seed + index}`; // Modify seed for multiple images

      // Handle custom size
      if (settings.size === "custom" && settings.customWidth && settings.customHeight) {
        fullPrompt += ` | Size: ${settings.customWidth}x${settings.customHeight}`;
      }

      const dataUrl = await root.generateImage(fullPrompt);
      updateProgress((completed + 1) / total * 100);
      return dataUrl;
    } catch (error) {
      console.error("Error generating image:", error);
      updateProgress((completed + 1) / total * 100);
      return null;
    }
  }

  // Update progress bar
  function updateProgress(percent) {
    progressFill.style.width = `${percent}%`;
  }

  // Keyboard shortcut
  promptInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") generateBtn.click();
  });

  // Get blended styles from checkboxes
  function getBlendedStyles() {
    return Array.from(document.querySelectorAll("input[type=checkbox]:checked"))
      .map((cb) => cb.value)
      .join(", ");
  }

  // Add image to gallery
  function addToGallery(dataUrl, prompt, index) {
    if (!dataUrl) return; // Skip failed generations

    const imageItem = document.createElement("div");
    imageItem.className = "image-item";
    if (index === 0) {
      imageItem.classList.add("selected");
      selectedImageIndex = 0;
    }

    imageItem.innerHTML = `
    <img src="${dataUrl}" alt="${prompt}" title="${prompt}" />
    <div class="image-actions">
      <button onclick="selectImage(${index})">Select</button>
      <button onclick="copyImage(${index})">📋</button>
      <button onclick="downloadImage(${index})">⬇️</button>
      <button onclick="shareImage(${index})">🔗</button>
    </div>
  `;

    imageItem.onclick = () => selectImage(index);
    imageGallery.appendChild(imageItem);
  }

  // Voice input function
  function startVoiceInput() {
    if (
      !("webkitSpeechRecognition" in window || "SpeechRecognition" in window)
    ) {
      alert("Speech recognition not supported in your browser");
      return;
    }

    const recognition = new (window.SpeechRecognition ||
      window.webkitSpeechRecognition)();
    recognition.lang = "en-US";
    recognition.continuous = false;
    recognition.interimResults = false;

    recognition.onresult = (e) => {
      promptInput.value = e.results[0][0].transcript;
    };

    recognition.onerror = (e) => {
      console.error("Speech recognition error", e.error);
      alert("Speech recognition error: " + e.error);
    };

    recognition.start();
  }

  // Toggle accessibility mode
  function toggleAccessibility() {
    document.body.classList.toggle("high-contrast");
  }

  // Enable image editing
  function enableEditing() {
    if (selectedImageIndex === -1) return;

    const img = new Image();
    img.onload = () => {
      const canvas = editCanvas;
      const ctx = canvas.getContext("2d");

      // Set canvas dimensions to match image
      canvas.width = img.width;
      canvas.height = img.height;

      // Draw image on canvas
      ctx.drawImage(img, 0, 0);

      // Show canvas and edit actions
      canvas.style.display = "block";
      editActions.style.display = "flex";
      singleImageActions.style.display = "none";
      isEditing = true;

      // Set up crop selection
      canvas.onmousedown = startCrop;
      canvas.onmousemove = updateCrop;
      canvas.onmouseup = endCrop;
    };

    img.src = generatedImages[selectedImageIndex];
  }

  // Start crop selection
  function startCrop(e) {
    if (!isEditing) return;
    const rect = editCanvas.getBoundingClientRect();
    cropStart = {
      x: e.clientX - rect.left,
      y: e.clientY - rect.top,
    };
    cropEnd = null;
  }

  // Update crop selection
  function updateCrop(e) {
    if (!isEditing || !cropStart) return;
    const rect = editCanvas.getBoundingClientRect();
    cropEnd = {
      x: e.clientX - rect.left,
      y: e.clientY - rect.top,
    };

    // Redraw image with crop rectangle
    const ctx = editCanvas.getContext("2d");
    const img = new Image();
    img.onload = () => {
      ctx.clearRect(0, 0, editCanvas.width, editCanvas.height);
      ctx.drawImage(img, 0, 0);

      // Draw crop rectangle
      ctx.strokeStyle = "#0e639c";
      ctx.lineWidth = 2;
      ctx.strokeRect(
        cropStart.x,
        cropStart.y,
        cropEnd.x - cropStart.x,
        cropEnd.y - cropStart.y
      );
    };
    img.src = generatedImages[selectedImageIndex];
  }

  // End crop selection
  function endCrop() {
    if (!isEditing) return;
    // Keep cropStart and cropEnd for applying crop
  }

  // Apply crop to image
  function applyCrop() {
    if (!cropStart || !cropEnd) {
      alert("Please select an area to crop");
      return;
    }

    const canvas = editCanvas;
    const ctx = canvas.getContext("2d");
    const img = new Image();

    img.onload = () => {
      // Calculate crop dimensions
      const cropX = Math.min(cropStart.x, cropEnd.x);
      const cropY = Math.min(cropStart.y, cropEnd.y);
      const cropWidth = Math.abs(cropEnd.x - cropStart.x);
      const cropHeight = Math.abs(cropEnd.y - cropStart.y);

      // Create temporary canvas for cropped image
      const tempCanvas = document.createElement("canvas");
      const tempCtx = tempCanvas.getContext("2d");
      tempCanvas.width = cropWidth;
      tempCanvas.height = cropHeight;

      // Draw cropped image
      tempCtx.drawImage(
        img,
        cropX,
        cropY,
        cropWidth,
        cropHeight,
        0,
        0,
        cropWidth,
        cropHeight
      );

      // Update gallery with cropped image
      const croppedDataUrl = tempCanvas.toDataURL();
      generatedImages[selectedImageIndex] = croppedDataUrl;

      // Update gallery display
      const selectedImageItem =
        document.querySelectorAll(".image-item")[selectedImageIndex];
      if (selectedImageItem) {
        selectedImageItem.querySelector("img").src = croppedDataUrl;
      }

      // Exit editing mode
      cancelEditing();
    };

    img.src = generatedImages[selectedImageIndex];
  }

  // Apply filters to image
  function applyFilters() {
    if (selectedImageIndex === -1) return;
    
    const filters = prompt("Enter filters (e.g., 'grayscale', 'sepia', 'invert'):");
    if (!filters) return;

    const canvas = editCanvas;
    const ctx = canvas.getContext("2d");
    const img = new Image();

    img.onload = () => {
      canvas.width = img.width;
      canvas.height = img.height;
      ctx.drawImage(img, 0, 0);

      // Apply filters
      const filterList = filters.split(',').map(f => f.trim());
      let filterString = '';
      
      filterList.forEach(filter => {
        switch(filter) {
          case 'grayscale':
            filterString += 'grayscale(100%) ';
            break;
          case 'sepia':
            filterString += 'sepia(100%) ';
            break;
          case 'invert':
            filterString += 'invert(100%) ';
            break;
          case 'blur':
            filterString += 'blur(5px) ';
            break;
          case 'brightness':
            filterString += 'brightness(150%) ';
            break;
          case 'contrast':
            filterString += 'contrast(200%) ';
            break;
          case 'saturate':
            filterString += 'saturate(200%) ';
            break;
        }
      });

      if (filterString) {
        ctx.filter = filterString;
        ctx.drawImage(img, 0, 0);
        
        // Update gallery with filtered image
        const filteredDataUrl = canvas.toDataURL();
        generatedImages[selectedImageIndex] = filteredDataUrl;

        // Update gallery display
        const selectedImageItem = document.querySelectorAll(".image-item")[selectedImageIndex];
        if (selectedImageItem) {
          selectedImageItem.querySelector("img").src = filteredDataUrl;
        }
      }

      // Exit editing mode
      cancelEditing();
    };

    img.src = generatedImages[selectedImageIndex];
  }

  // Cancel editing
  function cancelEditing() {
    editCanvas.style.display = "none";
    editActions.style.display = "none";
    singleImageActions.style.display = "flex";
    isEditing = false;
    cropStart = null;
    cropEnd = null;
  }

  // Select an image from the gallery
  function selectImage(index) {
    selectedImageIndex = index;

    // Update selection UI
    document.querySelectorAll(".image-item").forEach((item, i) => {
      if (i === index) {
        item.classList.add("selected");
      } else {
        item.classList.remove("selected");
      }
    });
  }

  // Copy image to clipboard
  function copyImage(index = selectedImageIndex) {
    if (index === -1) return;

    navigator.clipboard.writeText(generatedImages[index]).then(() => {
      alert("Image URL copied to clipboard!");
    });
  }

  // Download image
  function downloadImage(index = selectedImageIndex) {
    if (index === -1) return;

    const format = document.getElementById("exportFormat").value;
    const link = document.createElement("a");
    link.href = generatedImages[index];
    link.download = `generated-image-${Date.now()}.${format}`;
    link.click();
  }

  // Share image
  function shareImage(index = selectedImageIndex) {
    if (index === -1) return;

    if (navigator.share) {
      // Convert data URL to blob for sharing
      fetch(generatedImages[index])
        .then(res => res.blob())
        .then(blob => {
          const file = new File([blob], "generated-image.png", { type: "image/png" });
          navigator.share({
            title: 'Generated Image',
            text: 'Check out this AI-generated image!',
            files: [file]
          }).catch(err => console.error('Error sharing:', err));
        });
    } else {
      // Fallback to copying URL to clipboard
      navigator.clipboard.writeText(generatedImages[index]).then(() => {
        alert("Image URL copied to clipboard for sharing!");
      });
    }
  }

  // Regenerate image with same settings
  function regenerateImage() {
    if (Object.keys(lastUsedSettings).length === 0) return;

    // Restore settings
    promptInput.value = lastUsedSettings.prompt;
    document.getElementById("imageSize").value = lastUsedSettings.size;

    // Restore style checkboxes
    const styles = lastUsedSettings.style.split(", ");
    document.querySelectorAll("input[type=checkbox]").forEach((cb) => {
      cb.checked = styles.includes(cb.value);
    });

    document.getElementById("imageQuality").value = lastUsedSettings.quality;
    document.getElementById("aspectRatio").value = lastUsedSettings.aspectRatio;
    document.getElementById("colorScheme").value = lastUsedSettings.colorScheme;
    document.getElementById("lighting").value = lastUsedSettings.lighting;
    document.getElementById("composition").value = lastUsedSettings.composition;
    document.getElementById("negativePrompt").value = lastUsedSettings.negativePrompt;
    document.getElementById("seedInput").value = lastUsedSettings.seed;
    document.getElementById("creativitySlider").value = lastUsedSettings.creativity;
    document.getElementById("detailSlider").value = lastUsedSettings.detail;
    document.getElementById("imageCount").value = lastUsedSettings.count;
    document.getElementById("exportFormat").value = lastUsedSettings.exportFormat;
    document.getElementById("promptVariations").value = lastUsedSettings.variations;
    document.getElementById("customWidth").value = lastUsedSettings.customWidth;
    document.getElementById("customHeight").value = lastUsedSettings.customHeight;

    // Generate again
    generateBtn.click();
  }

  // Save prompt to history
  function saveToHistory(settings, imageUrl) {
    const entry = document.createElement("div");
    entry.className = "history-item";

    // Create a preview
    const preview = document.createElement("div");
    preview.style.display = "flex";
    preview.style.gap = "10px";
    preview.style.alignItems = "center";

    const img = document.createElement("img");
    img.src = imageUrl;
    img.style.width = "40px";
    img.style.height = "40px";
    img.style.objectFit = "cover";
    img.style.borderRadius = "3px";

    const text = document.createElement("div");
    text.style.flex = "1";
    text.innerHTML = `<strong>${settings.prompt}</strong><br><small>${settings.style} | ${settings.size}</small>`;

    preview.appendChild(img);
    preview.appendChild(text);

    entry.appendChild(preview);

    entry.onclick = () => {
      // Restore settings when clicked
      promptInput.value = settings.prompt;
      document.getElementById("imageSize").value = settings.size;

      // Restore style checkboxes
      const styles = settings.style.split(", ");
      document.querySelectorAll("input[type=checkbox]").forEach((cb) => {
        cb.checked = styles.includes(cb.value);
      });

      document.getElementById("imageQuality").value = settings.quality;
      document.getElementById("aspectRatio").value = settings.aspectRatio;
      document.getElementById("colorScheme").value = settings.colorScheme;
      document.getElementById("lighting").value = settings.lighting;
      document.getElementById("composition").value = settings.composition;
      document.getElementById("negativePrompt").value = settings.negativePrompt;
      document.getElementById("seedInput").value = settings.seed;
      document.getElementById("creativitySlider").value = settings.creativity;
      document.getElementById("detailSlider").value = settings.detail;
      document.getElementById("imageCount").value = settings.count;
      document.getElementById("exportFormat").value = settings.exportFormat;
      document.getElementById("promptVariations").value = settings.variations;
      document.getElementById("customWidth").value = settings.customWidth;
      document.getElementById("customHeight").value = settings.customHeight;

      // Scroll to top
      window.scrollTo(0, 0);

      // Optionally auto-generate
      if (confirm("Generate with these settings?")) {
        generateBtn.click();
      }
    };

    promptHistory.prepend(entry);

    // Save to localStorage
    let history = JSON.parse(localStorage.getItem("imageGenHistory") || "[]");
    history.unshift({ ...settings, imageUrl, timestamp: Date.now() });
    history = history.slice(0, 20); // Keep only last 20
    localStorage.setItem("imageGenHistory", JSON.stringify(history));
  }

  // Save as favorite
  function saveAsFavorite() {
    if (Object.keys(lastUsedSettings).length === 0) return;

    const name = prompt("Name this favorite prompt:");
    if (!name) return;

    const favorite = {
      name,
      settings: lastUsedSettings,
      timestamp: Date.now(),
    };

    // Save to localStorage
    let favorites = JSON.parse(
      localStorage.getItem("imageGenFavorites") || "[]"
    );
    favorites.unshift(favorite);
    localStorage.setItem("imageGenFavorites", JSON.stringify(favorites));

    // Refresh favorites display
    loadFavorites();

    alert(`Saved as "${name}"`);
  }

  // Load favorites from localStorage
  function loadFavorites() {
    favoritesList.innerHTML = "";

    const favorites = JSON.parse(
      localStorage.getItem("imageGenFavorites") || "[]"
    );

    if (favorites.length === 0) {
      favoritesList.innerHTML =
        '<div style="color: #888; text-align: center; padding: 10px">No favorites yet</div>';
      return;
    }

    favorites.forEach((fav, index) => {
      const item = document.createElement("div");
      item.className = "favorite-item";

      item.innerHTML = `
      <div><strong>${fav.name}</strong></div>
      <div style="font-size: 12px; color: #888">${fav.settings.prompt}</div>
      <div class="favorite-actions">
        <button onclick="useFavorite(${index})">Use</button>
        <button onclick="deleteFavorite(${index})">Delete</button>
      </div>
    `;

      favoritesList.appendChild(item);
    });
  }

  // Use a favorite prompt
  function useFavorite(index) {
    const favorites = JSON.parse(
      localStorage.getItem("imageGenFavorites") || "[]"
    );
    if (index >= favorites.length) return;

    const fav = favorites[index];
    const settings = fav.settings;

    // Restore settings
    promptInput.value = settings.prompt;
    document.getElementById("imageSize").value = settings.size;

    // Restore style checkboxes
    const styles = settings.style.split(", ");
    document.querySelectorAll("input[type=checkbox]").forEach((cb) => {
      cb.checked = styles.includes(cb.value);
    });

    document.getElementById("imageQuality").value = settings.quality;
    document.getElementById("aspectRatio").value = settings.aspectRatio;
    document.getElementById("colorScheme").value = settings.colorScheme;
    document.getElementById("lighting").value = settings.lighting;
    document.getElementById("composition").value = settings.composition;
    document.getElementById("negativePrompt").value = settings.negativePrompt;
    document.getElementById("seedInput").value = settings.seed;
    document.getElementById("creativitySlider").value = settings.creativity;
    document.getElementById("detailSlider").value = settings.detail;
    document.getElementById("imageCount").value = settings.count;
    document.getElementById("exportFormat").value = settings.exportFormat;
    document.getElementById("promptVariations").value = settings.variations;
    document.getElementById("customWidth").value = settings.customWidth;
    document.getElementById("customHeight").value = settings.customHeight;

    // Scroll to top
    window.scrollTo(0, 0);

    // Optionally auto-generate
    if (confirm(`Use favorite "${fav.name}" and generate?`)) {
      generateBtn.click();
    }
  }

  // Delete a favorite
  function deleteFavorite(index) {
    if (!confirm("Delete this favorite?")) return;

    let favorites = JSON.parse(
      localStorage.getItem("imageGenFavorites") || "[]"
    );
    favorites.splice(index, 1);
    localStorage.setItem("imageGenFavorites", JSON.stringify(favorites));

    loadFavorites();
  }

  // Clear history
  function clearHistory() {
    if (!confirm("Clear all prompt history?")) return;

    promptHistory.innerHTML = "";
    localStorage.removeItem("imageGenHistory");
  }

  // Clear favorites
  function clearFavorites() {
    if (!confirm("Clear all favorites?")) return;

    favoritesList.innerHTML =
      '<div style="color: #888; text-align: center; padding: 10px">No favorites yet</div>';
    localStorage.removeItem("imageGenFavorites");
  }

  // Export favorites
  function exportFavorites() {
    const favorites = JSON.parse(
      localStorage.getItem("imageGenFavorites") || "[]"
    );
    
    if (favorites.length === 0) {
      alert("No favorites to export");
      return;
    }
    
    const dataStr = JSON.stringify(favorites, null, 2);
    const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
    
    const exportFileDefaultName = 'image-generator-favorites.json';
    
    const linkElement = document.createElement('a');
    linkElement.setAttribute('href', dataUri);
    linkElement.setAttribute('download', exportFileDefaultName);
    linkElement.click();
  }

  // Import favorites
  function importFavorites() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json';
    
    input.onchange = e => {
      const file = e.target.files[0];
      const reader = new FileReader();
      
      reader.onload = event => {
        try {
          const importedFavorites = JSON.parse(event.target.result);
          
          if (!Array.isArray(importedFavorites)) {
            throw new Error("Invalid format");
          }
          
          let favorites = JSON.parse(localStorage.getItem("imageGenFavorites") || "[]");
          favorites = [...importedFavorites, ...favorites];
          localStorage.setItem("imageGenFavorites", JSON.stringify(favorites));
          
          loadFavorites();
          alert(`Imported ${importedFavorites.length} favorites`);
        } catch (error) {
          alert("Error importing favorites: Invalid file format");
        }
      };
      
      reader.readAsText(file);
    };
    
    input.click();
  }

  // Search history
  function searchHistory() {
    const searchTerm = prompt("Search prompt history:");
    if (!searchTerm) return;
    
    const history = JSON.parse(localStorage.getItem("imageGenHistory") || "[]");
    const results = history.filter(item => 
      item.prompt.toLowerCase().includes(searchTerm.toLowerCase()) ||
      item.style.toLowerCase().includes(searchTerm.toLowerCase())
    );
    
    if (results.length === 0) {
      alert("No matching prompts found");
      return;
    }
    
    // Display search results
    promptHistory.innerHTML = "";
    results.forEach(item => {
      const entry = document.createElement("div");
      entry.className = "history-item";

      const preview = document.createElement("div");
      preview.style.display = "flex";
      preview.style.gap = "10px";
      preview.style.alignItems = "center";

      const img = document.createElement("img");
      img.src = item.imageUrl;
      img.style.width = "40px";
      img.style.height = "40px";
      img.style.objectFit = "cover";
      img.style.borderRadius = "3px";

      const text = document.createElement("div");
      text.style.flex = "1";
      text.innerHTML = `<strong>${item.prompt}</strong><br><small>${item.style} | ${item.size}</small>`;

      preview.appendChild(img);
      preview.appendChild(text);

      entry.appendChild(preview);

      entry.onclick = () => {
        promptInput.value = item.prompt;
        document.getElementById("imageSize").value = item.size;

        // Restore style checkboxes
        const styles = item.style.split(", ");
        document.querySelectorAll("input[type=checkbox]").forEach((cb) => {
          cb.checked = styles.includes(cb.value);
        });

        document.getElementById("imageQuality").value = item.quality;
        document.getElementById("aspectRatio").value = item.aspectRatio;
        document.getElementById("colorScheme").value = item.colorScheme;
        document.getElementById("lighting").value = item.lighting;
        document.getElementById("composition").value = item.composition;
        document.getElementById("negativePrompt").value = item.negativePrompt;
        document.getElementById("seedInput").value = item.seed;
        document.getElementById("creativitySlider").value = item.creativity;
        document.getElementById("detailSlider").value = item.detail;
        document.getElementById("imageCount").value = item.count;
        document.getElementById("exportFormat").value = item.exportFormat;
        document.getElementById("promptVariations").value = item.variations;
        document.getElementById("customWidth").value = item.customWidth;
        document.getElementById("customHeight").value = item.customHeight;

        window.scrollTo(0, 0);

        if (confirm("Generate with these settings?")) {
          generateBtn.click();
        }
      };

      promptHistory.appendChild(entry);
    });
  }

  // Generate AI prompt
  async function generateAIPrompt() {
    const topic = prompt("What topic should the AI generate a prompt for?");
    if (!topic) return;
    
    generateBtn.disabled = true;
    generateBtn.textContent = "Generating AI prompt...";
    
    try {
      const aiPrompt = await root.generateText(`Generate a creative and detailed image generation prompt about "${topic}". The prompt should be descriptive and include details about style, lighting, and composition. Only return the prompt text without any explanation.`);
      promptInput.value = aiPrompt;
    } catch (error) {
      console.error("Error generating AI prompt:", error);
      alert("Error generating AI prompt. Please try again.");
    } finally {
      generateBtn.disabled = false;
      generateBtn.textContent = "Generate";
    }
  }

  // Enhance prompt
  async function enhancePrompt() {
    const currentPrompt = promptInput.value.trim();
    if (!currentPrompt) {
      alert("Please enter a prompt to enhance");
      return;
    }
    
    generateBtn.disabled = true;
    generateBtn.textContent = "Enhancing prompt...";
    
    try {
      const enhancedPrompt = await root.generateText(`Enhance this image generation prompt by adding more descriptive details, improving clarity, and adding artistic direction: "${currentPrompt}". Make it more vivid and detailed while preserving the original intent. Only return the enhanced prompt without any explanation.`);
      promptInput.value = enhancedPrompt;
    } catch (error) {
      console.error("Error enhancing prompt:", error);
      alert("Error enhancing prompt. Please try again.");
    } finally {
      generateBtn.disabled = false;
      generateBtn.textContent = "Generate";
    }
  }

  // Generate prompt variation
  async function generatePromptVariation(originalPrompt) {
    try {
      const variation = await root.generateText(`Create a variation of this image generation prompt: "${originalPrompt}". The variation should maintain the core subject but change details like style, composition, or perspective. Only return the varied prompt without any explanation.`);
      return variation;
    } catch (error) {
      console.error("Error generating prompt variation:", error);
      return originalPrompt; // Fallback to original if variation fails
    }
  }

  // Generate AI suggestions
  async function generateSuggestions(prompt) {
    try {
      const suggestionsText = await root.generateText(`Generate 5-8 short keyword suggestions (2-3 words each) related to this image generation prompt: "${prompt}". These should be related concepts, styles, or elements that could enhance the prompt. Only return a comma-separated list of suggestions without any explanation.`);
      
      const suggestions = suggestionsText.split(',').map(s => s.trim());
      aiSuggestions.innerHTML = '';
      
      suggestions.forEach(suggestion => {
        const tag = document.createElement("div");
        tag.className = "suggestion-tag";
        tag.textContent = suggestion;
        tag.onclick = () => {
          promptInput.value = `${promptInput.value} ${suggestion}`;
        };
        aiSuggestions.appendChild(tag);
      });
    } catch (error) {
      console.error("Error generating suggestions:", error);
      aiSuggestions.innerHTML = '<div style="color: #888; text-align: center; padding: 10px">No suggestions available</div>';
    }
  }

  function selectAllStyles() {
    document.querySelectorAll("input[type=checkbox]").forEach(cb => {

  function clearAllStyles() {
    document.querySelectorAll("input[type=checkbox]").forEach(cb => {

      img.style.width = "40px";

      const text = document.createElement("div");
      text.style.flex = "1";
      text.innerHTML = `<strong>${item.prompt}</strong><br><small>${item.style} | ${item.size}</small>`;

      preview.appendChild(img);
      preview.appendChild(text);

      entry.onclick = () => {
        promptInput.value = item.prompt;
        document.getElementById("imageSize").value = item.size;

        // Restore style checkboxes
        const styles = item.style.split(", ");
        document.querySelectorAll("input[type=checkbox]").forEach((cb) => {
          cb.checked = styles.includes(cb.value);
        });

        document.getElementById("imageQuality").value = item.quality;
        document.getElementById("aspectRatio").value = item.aspectRatio;
        document.getElementById("colorScheme").value = item.colorScheme;
        document.getElementById("lighting").value = item.lighting;
        document.getElementById("composition").value = item.composition;
        document.getElementById("negativePrompt").value = item.negativePrompt;
        document.getElementById("seedInput").value = item.seed;
        document.getElementById("creativitySlider").value = item.creativity;
        document.getElementById("detailSlider").value = item.detail;
        document.getElementById("imageCount").value = item.count;
        document.getElementById("exportFormat").value = item.exportFormat;
        document.getElementById("promptVariations").value = item.variations;
        document.getElementById("customWidth").value = item.customWidth;
        document.getElementById("customHeight").value = item.customHeight;

        window.scrollTo(0, 0);

        if (confirm("Generate with these settings?")) {
          generateBtn.click();
        }
      };

      promptHistory.appendChild(entry);
    });

    // Load favorites
    loadFavorites();

    // Generate initial AI suggestions
    generateSuggestions("A futuristic city skyline at sunset");
