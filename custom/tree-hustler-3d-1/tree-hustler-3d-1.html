<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>tree-hustler-3d-1 — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<div id="tree-hustler-root"></div>

<style>
  :root {
    --font-display: 'Cinzel', serif;
    --font-body: 'Outfit', sans-serif;
    --text-xs: clamp(0.75rem, 0.72rem + 0.15vw, 0.875rem);
    --text-sm: clamp(0.875rem, 0.84rem + 0.2vw, 1rem);
    --text-base: clamp(1rem, 0.96rem + 0.24vw, 1.125rem);
    --text-lg: clamp(1.125rem, 1rem + 0.6vw, 1.5rem);
    --text-xl: clamp(1.4rem, 1.15rem + 1vw, 2rem);
    --text-2xl: clamp(2rem, 1.4rem + 2vw, 3.25rem);
    --space-1: 0.25rem;
    --space-2: 0.5rem;
    --space-3: 0.75rem;
    --space-4: 1rem;
    --space-5: 1.25rem;
    --space-6: 1.5rem;
    --space-8: 2rem;
    --space-10: 2.5rem;
    --space-12: 3rem;
    --radius-sm: 0.4rem;
    --radius-md: 0.75rem;
    --radius-lg: 1rem;
    --radius-xl: 1.25rem;
    --radius-full: 999px;

    --color-bg: [pageBg];
    --color-surface: [panelColor];
    --color-surface-2: [panelColor2];
    --color-border: [borderColor];
    --color-text: [pageText];
    --color-text-muted: [mutedColor];
    --color-text-inverse: #171712;
    --color-primary: [primaryColor];
    --color-gold: [goldColor];
    --color-danger: [dangerColor];
  }

  #tree-hustler-root, #tree-hustler-root * { box-sizing: border-box; }
  #tree-hustler-root {
    position: relative;
    width: 100%;
    min-height: 100dvh;
    overflow: hidden;
    color: var(--color-text);
    font-family: var(--font-body);
    background: radial-gradient(circle at top, #334126 0%, var(--color-bg) 38%, #0f100c 100%);
  }

  #tree-hustler-root canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  .th-ui {
    position: relative;
    min-height: 100dvh;
    display: grid;
    grid-template-rows: auto auto 1fr auto;
    z-index: 2;
    pointer-events: none;
  }

  .th-topbar,
  .th-hud,
  .th-panels,
  .th-dock,
  .th-overlay,
  .th-start {
    pointer-events: none;
  }

  .th-panel,
  .th-btn,
  .th-chip,
  .th-card,
  .th-dock-inner,
  .th-toolbar,
  .th-dialog {
    background: var(--color-surface);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--color-border);
    box-shadow: 0 14px 34px rgba(0,0,0,0.35);
  }

  .th-topbar {
    display: flex;
    justify-content: space-between;
    gap: var(--space-4);
    padding: var(--space-4);
    align-items: flex-start;
  }

  .th-brand {
    pointer-events: auto;
    display: flex;
    gap: var(--space-3);
    align-items: center;
  }

  .th-logo {
    width: 3rem;
    height: 3rem;
    color: var(--color-primary);
    flex: none;
  }

  .th-brand-copy h1 {
    font-family: var(--font-display);
    font-size: var(--text-xl);
    line-height: 1;
    margin: 0;
  }

  .th-brand-copy p {
    margin: 0.2rem 0 0;
    color: var(--color-text-muted);
    font-size: var(--text-sm);
    max-width: 46ch;
  }

  .th-toolbar {
    pointer-events: auto;
    display: flex;
    gap: var(--space-2);
    align-items: center;
    padding: var(--space-2);
    border-radius: var(--radius-full);
  }

  .th-btn,
  .th-icon-btn {
    pointer-events: auto;
    min-height: 44px;
    border-radius: var(--radius-full);
    border: 1px solid var(--color-border);
    color: var(--color-text);
    font: inherit;
    cursor: pointer;
    transition: transform .18s ease, opacity .18s ease, background .18s ease;
  }

  .th-btn:hover,
  .th-icon-btn:hover {
    transform: translateY(-1px);
  }

  .th-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-2);
    padding: 0 var(--space-4);
    background: var(--color-surface-2);
  }

  .th-btn--primary {
    background: var(--color-primary);
    color: var(--color-text-inverse);
    border-color: transparent;
  }

  .th-btn--danger {
    background: var(--color-danger);
    color: white;
    border-color: transparent;
  }

  .th-icon-btn {
    width: 44px;
    background: var(--color-surface-2);
  }

  .th-hud {
    display: grid;
    grid-template-columns: repeat(4, minmax(0,1fr));
    gap: var(--space-3);
    padding: 0 var(--space-4);
  }

  .th-card {
    padding: var(--space-3) var(--space-4);
    border-radius: var(--radius-lg);
    min-width: 0;
    pointer-events: auto;
  }

  .th-label {
    font-size: var(--text-xs);
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--color-text-muted);
  }

  .th-value {
    font-size: var(--text-lg);
    font-weight: 700;
    font-variant-numeric: tabular-nums lining-nums;
  }

  .th-money { color: var(--color-gold); }

  .th-progress {
    height: 0.65rem;
    border-radius: var(--radius-full);
    background: rgba(255,255,255,.08);
    overflow: hidden;
    margin-top: 0.35rem;
  }

  .th-progress > span {
    display: block;
    width: 50%;
    height: 100%;
    background: linear-gradient(90deg, var(--color-primary), var(--color-gold));
  }

  .th-panels {
    align-self: end;
    display: grid;
    grid-template-columns: minmax(18rem,22rem) minmax(16rem,20rem);
    gap: var(--space-4);
    justify-content: space-between;
    padding: var(--space-4);
    margin-top: auto;
  }

  .th-stack { display: grid; gap: var(--space-4); }
  .th-panel {
    pointer-events: auto;
    border-radius: var(--radius-xl);
    padding: var(--space-4);
  }

  .th-panel h2 {
    margin: 0 0 var(--space-2);
    font-size: var(--text-lg);
  }

  .th-small {
    font-size: var(--text-sm);
    color: var(--color-text-muted);
  }

  .th-list {
    display: grid;
    gap: var(--space-2);
    margin-top: var(--space-3);
  }

  .th-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: var(--space-3);
    align-items: center;
    padding: var(--space-3);
    border-radius: var(--radius-lg);
    background: var(--color-surface-2);
    border: 1px solid rgba(255,255,255,0.04);
  }

  .th-row-title {
    font-weight: 700;
  }

  .th-row-desc {
    font-size: var(--text-sm);
    color: var(--color-text-muted);
  }

  .th-pill {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0.15rem 0.6rem;
    border-radius: var(--radius-full);
    font-size: var(--text-xs);
    font-weight: 700;
    background: rgba(121,192,95,0.16);
    color: var(--color-primary);
  }

  .th-dock {
    display: flex;
    justify-content: center;
    padding: var(--space-4);
  }

  .th-dock-inner {
    pointer-events: auto;
    display: flex;
    gap: var(--space-2);
    padding: var(--space-2);
    border-radius: var(--radius-full);
  }

  .th-overlay,
  .th-start {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    padding: var(--space-4);
    background: linear-gradient(180deg, rgba(10,12,8,.55), rgba(10,12,8,.76));
    z-index: 5;
    pointer-events: auto;
  }

  .th-overlay[hidden],
  .th-start[hidden] {
    display: none !important;
  }

  .th-dialog {
    width: min(72rem, 100%);
    max-height: min(92dvh, 56rem);
    overflow: auto;
    padding: var(--space-6);
    border-radius: var(--radius-xl);
    display: grid;
    gap: var(--space-5);
  }

  .th-hero {
    display: grid;
    grid-template-columns: 1.2fr .8fr;
    gap: var(--space-6);
    align-items: center;
  }

  .th-eyebrow {
    font-size: var(--text-xs);
    text-transform: uppercase;
    letter-spacing: .15em;
    color: var(--color-primary);
    font-weight: 800;
    margin-bottom: var(--space-2);
  }

  .th-hero h2 {
    font-family: var(--font-display);
    font-size: var(--text-2xl);
    line-height: .95;
    margin: 0;
  }

  .th-hero p {
    color: var(--color-text-muted);
    margin: var(--space-3) 0 0;
    max-width: 60ch;
  }

  .th-hero-art {
    min-height: 18rem;
    border-radius: var(--radius-xl);
    position: relative;
    overflow: hidden;
    border: 1px solid var(--color-border);
    background:
      radial-gradient(circle at 30% 20%, rgba(121,192,95,.35), transparent 28%),
      radial-gradient(circle at 75% 25%, rgba(214,164,65,.25), transparent 22%),
      linear-gradient(180deg, rgba(255,255,255,.04), rgba(0,0,0,.18));
  }

  .th-hero-art::before,
  .th-hero-art::after {
    content: "";
    position: absolute;
    bottom: -8%;
    width: 42%;
    aspect-ratio: 1 / 1.4;
    background: linear-gradient(180deg, #4d6d2d, #2f4320 56%, #1a2412);
    clip-path: polygon(50% 0,60% 7%,66% 13%,72% 22%,70% 38%,76% 51%,72% 68%,82% 100%,18% 100%,28% 68%,24% 51%,30% 38%,28% 22%,34% 13%,40% 7%);
    filter: drop-shadow(0 10px 18px rgba(0,0,0,.3));
  }

  .th-hero-art::before { left: 8%; }
  .th-hero-art::after { right: 10%; transform: scale(.72); }

  .th-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0,1fr));
    gap: var(--space-4);
  }

  .th-tabs {
    display: flex;
    gap: var(--space-2);
    flex-wrap: wrap;
  }

  .th-tabs button.active {
    background: var(--color-primary);
    color: var(--color-text-inverse);
  }

  .th-toast-wrap {
    position: absolute;
    right: var(--space-4);
    bottom: 6rem;
    display: grid;
    gap: var(--space-2);
    z-index: 6;
  }

  .th-toast {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    padding: var(--space-3) var(--space-4);
    box-shadow: 0 14px 34px rgba(0,0,0,0.35);
    min-width: min(22rem, calc(100vw - 2rem));
  }

  .th-footer-note {
    font-size: var(--text-xs);
    color: var(--color-text-muted);
  }

  @media (max-width: 1100px) {
    .th-hud { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .th-panels { grid-template-columns: 1fr; }
    .th-hero, .th-grid { grid-template-columns: 1fr; }
  }

  @media (max-width: 760px) {
    .th-topbar { flex-direction: column; align-items: stretch; }
    .th-toolbar { justify-content: space-between; }
    .th-hud { grid-template-columns: 1fr 1fr; }
    .th-row { grid-template-columns: 1fr; }
    .th-dock-inner { width: 100%; justify-content: space-between; }
    .th-dock-inner .th-btn { flex: 1; }
  }
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script type="module">
  import * as THREE from "https://esm.sh/three@0.161.0";

  const rootNode = document.getElementById("tree-hustler-root");

  rootNode.innerHTML = `

        <div class="th-stack">

        </div>
      </section>

      <footer class="th-dock">
        <nav class="th-dock-inner">
          <button class="th-btn" data-panel="build">[uiLabel.build]</button>
          <button class="th-btn" data-panel="craft">[uiLabel.craft]</button>

          <button class="th-btn" data-panel="stats">[uiLabel.stats]</button>
        </nav>
      </footer>
    </div>

    <section class="th-start" id="th-start-screen">
      <div class="th-dialog">
        <div class="th-hero">
          <div>
            <div class="th-eyebrow">Perchance forest sim</div>
            <h2>Build a timber empire one swing at a time.</h2>
            <p>
              Click trees in the 3D forest, harvest logs, sell them for cash, and reinvest into better tools,
              smarter helpers, and structures that reshape the economy.
            </p>
            <p class="th-small">[heroFlavor]</p>
            <div style="display:flex;gap:var(--space-3);flex-wrap:wrap;margin-top:var(--space-4)">
              <button class="th-btn th-btn--primary" id="th-start-btn">[uiLabel.start]</button>
              <button class="th-btn" id="th-guide-btn">[uiLabel.guide]</button>
            </div>
          </div>
          <div class="th-hero-art" aria-hidden="true"></div>
        </div>

        <div class="th-grid">
          <article class="th-card"><strong>Action gameplay</strong><div class="th-small">Manual chopping, stamina, crits, combos and harvest timing.</div></article>
          <article class="th-card"><strong>Economy depth</strong><div class="th-small">Demand swings, structures, workers, contracts and crafting.</div></article>
          <article class="th-card"><strong>Builder strategy</strong><div class="th-small">Each structure unlocks a system that changes the run.</div></article>
        </div>

        <div class="th-footer-note">
          Starter contract example: [starterContract]
        </div>
      </div>
    </section>

    <section class="th-overlay" id="th-overlay" hidden>
      <div class="th-dialog" id="th-overlay-card"></div>
    </section>

    <div class="th-toast-wrap" id="th-toasts"></div>
  `;

  const state = {
    paused: false,
    started: false,
    soundOn: true,
    overlay: null,
    time: 0,
    day: 1,
    weather: "[weatherStates.selectOne]",
    difficulty: "[defaultDifficulty]",
    selectedTree: null,
    stats: {
      cash: Number("[startCash]"),
      logs: 0,
      reservedLogs: 0,

      cart: 0,

      automation: 0

  const refs = {
    cash: rootNode.querySelector("#th-cash"),
    marketState: rootNode.querySelector("#th-market-state"),
    logs: rootNode.querySelector("#th-logs"),
    storage: rootNode.querySelector("#th-storage"),

  const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
  const rand = (min, max) => Math.random() * (max - min) + min;
  const choice = arr => arr[Math.floor(Math.random() * arr.length)];
  const money = v => "$" + Math.floor(v).toLocaleString();

  const upgradeData = {

  const workerData = {

    machineOperator: { label: "[workerLabel.machineOperator]", desc: "[workerDescription.machineOperator]", cost: Number("[workerCost.machineOperator]"), wage: Number("[workerWage.machineOperator]"), rate: Number("[workerRate.machineOperator]"), unlocked: () => state.structures.sawmill > 0 },
    forestWarden: { label: "[workerLabel.forestWarden]", desc: "[workerDescription.forestWarden]", cost: Number("[workerCost.forestWarden]"), wage: Number("[workerWage.forestWarden]"), rate: Number("[workerRate.forestWarden]"), unlocked: () => state.structures.sapShrine > 0 }

  const scene = new THREE.Scene();

  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();
  const clock = new THREE.Clock();

  const ambient = new THREE.HemisphereLight(0xf5f0d8, 0x33472e, 1.25);

  scene.add(sun);

  const ground = new THREE.Mesh(

  const speciesData = {
    oak:   { hp: Number("[speciesHp.oak]"), value: Number("[speciesValue.oak]"), xp: Number("[speciesXp.oak]"), energy: Number("[speciesEnergy.oak]"), trunk: 0x7c5738, leaves: 0x547d34 },
    pine:  { hp: Number("[speciesHp.pine]"), value: Number("[speciesValue.pine]"), xp: Number("[speciesXp.pine]"), energy: Number("[speciesEnergy.pine]"), trunk: 0x6d4f35, leaves: 0x416d2d },
    birch: { hp: Number("[speciesHp.birch]"), value: Number("[speciesValue.birch]"), xp: Number("[speciesXp.birch]"), energy: Number("[speciesEnergy.birch]"), trunk: 0xd9d1b8, leaves: 0x7ca356 },
    cedar: { hp: Number("[speciesHp.cedar]"), value: Number("[speciesValue.cedar]"), xp: Number("[speciesXp.cedar]"), energy: Number("[speciesEnergy.cedar]"), trunk: 0x5e3e27, leaves: 0x31502a }
  };

  const trees = [];
  const treeGroup = new THREE.Group();
  world.add(treeGroup);

  function makeTree(species, x, z, scale = 1) {
    const spec = speciesData[species];
    const group = new THREE.Group();
    group.position.set(x, 0, z);
    group.userData.type = "tree";

    const trunk = new THREE.Mesh(
      new THREE.CylinderGeometry(.42 * scale, .56 * scale, 3.8 * scale, 8),
      new THREE.MeshStandardMaterial({ color: spec.trunk, roughness: 1 })
    );
    trunk.position.y = 2 * scale;
    trunk.castShadow = true;
    trunk.receiveShadow = true;

    const leaves1 = new THREE.Mesh(
      new THREE.ConeGeometry(1.8 * scale, 3.6 * scale, 8),
      new THREE.MeshStandardMaterial({ color: spec.leaves, roughness: .95 })
    );
    leaves1.position.y = 4.4 * scale;
    leaves1.castShadow = true;

    const leaves2 = new THREE.Mesh(
      new THREE.ConeGeometry(1.3 * scale, 2.7 * scale, 8),
      new THREE.MeshStandardMaterial({ color: spec.leaves + 0x101010, roughness: .95 })
    );
    leaves2.position.y = 5.8 * scale;
    leaves2.castShadow = true;

    const marker = new THREE.Mesh(
      new THREE.RingGeometry(.75 * scale, .92 * scale, 24),
      new THREE.MeshBasicMaterial({ color: 0xf5d46f, transparent: true, opacity: 0 })
    );
    marker.rotation.x = -Math.PI / 2;
    marker.position.y = .05;

    group.add(marker, trunk, leaves1, leaves2);
    group.userData.tree = {
      species,
      hp: spec.hp,
      maxHp: spec.hp,
      value: spec.value,
      xp: spec.xp,
      energyCost: spec.energy,
      cooldown: 0,
      regrow: 0,
      alive: true,
      marker,
      trunk,
      canopy: [leaves1, leaves2]
    };

    treeGroup.add(group);
    trees.push(group);
  }

  for (let i = 0; i < 32; i++) {
    const angle = Math.random() * Math.PI * 2;
    const radius = rand(8, 30);
    const x = Math.cos(angle) * radius;
    const z = Math.sin(angle) * radius;
    const species = choice(["oak","oak","pine","birch","cedar"]);
    makeTree(species, x, z, rand(.9, 1.28));
  }

  function totalWorkers() {
    return Object.values(state.workers).reduce((a, v) => a + v, 0);
  }

  function storageCap() {
    return Number("[startStorage]") + state.upgrades.cart * 12 + state.structures.lumberYard * 25 + state.workers.muleDriver * 18;
  }

  function logSpaceLeft() {
    return storageCap() - state.stats.logs - state.stats.reservedLogs;
  }

  function rawLogPrice() {
    const base = 10 + state.stats.level * .8;
    const weatherBoost = state.weather === "rain" ? 1.08 : state.weather === "dusk" ? 1.12 : 1;
    const brokerBoost = state.workers.marketBroker * .08 + (state.structures.merchantStall ? .08 : 0);
    const bargaining = 1 + state.upgrades.bargaining * .08;
    const yard = state.structures.lumberYard * .08;
    const stall = state.structures.merchantStall * .1;
    return Math.floor(base * weatherBoost * bargaining * (1 + yard + stall) * state.ai.marketMultiplier * (1 + brokerBoost));
  }

  function upgradeCost(key) {
    const d = upgradeData[key];
    return Math.floor(d.base * Math.pow(d.scale, state.upgrades[key]));
  }

  function addToast(text) {
    const node = document.createElement("div");
    node.className = "th-toast";
    node.textContent = text;
    refs.toasts.appendChild(node);
    setTimeout(() => node.remove(), 2800);
  }

  function gainXp(amount) {
    state.stats.xp += amount;
    while (state.stats.xp >= state.stats.xpToNext) {
      state.stats.xp -= state.stats.xpToNext;
      state.stats.level += 1;
      state.stats.xpToNext = Math.floor(state.stats.xpToNext * 1.28);
      state.stats.maxEnergy += 8;
      state.stats.energy = Math.min(state.stats.maxEnergy, state.stats.energy + 24);
      addToast(`Level ${state.stats.level}! Max energy increased.`);
    }
  }

  function refreshContracts() {
    while (state.contracts.length < 3 + (state.structures.merchantStall > 0 ? 1 : 0)) {
      state.contracts.push({
        id: Math.random().toString(36).slice(2),
        species: choice(["oak","pine","birch","cedar"]),
        need: Math.floor(rand(8, 18)),
        progress: 0,
        daysLeft: Math.floor(rand(2, 5)),
        reward: Math.floor(rand(120, 420) * (1 + state.upgrades.bargaining * .08)),
        active: true
      });
    }
    state.contracts = state.contracts.filter(c => c.active);
  }

  function updateAdvisor() {
    const tips = [
      "[aiTips.selectOne]",
      "[aiTips.selectOne]",
      "[aiTips.selectOne]"
    ];
    if (state.structures.foresterCamp === 0) state.ai.advisor = "Reserve logs for a Forester Camp to unlock worker AI.";
    else if (state.upgrades.swingSpeed < 2) state.ai.advisor = "Swing Speed is the strongest early upgrade for manual farming.";
    else if (state.stats.logs > storageCap() * .7 && !state.settings.autoSell) state.ai.advisor = "You are nearing capacity. Consider a Lumber Yard or auto-sell.";
    else state.ai.advisor = choice(tips);
  }

  function updateHUD() {
    state.stats.highestCash = Math.max(state.stats.highestCash, state.stats.cash);
    refs.cash.textContent = money(state.stats.cash);
    refs.marketState.textContent = `${state.weather} market x${state.ai.marketMultiplier.toFixed(2)} · Day ${state.day}`;
    refs.logs.textContent = String(state.stats.logs);
    refs.storage.textContent = `Storage ${state.stats.logs + state.stats.reservedLogs} / ${storageCap()}`;
    refs.energy.textContent = `${Math.round(state.stats.energy)} / ${state.stats.maxEnergy}`;
    refs.energyBar.style.width = `${(state.stats.energy / state.stats.maxEnergy) * 100}%`;
    refs.level.textContent = String(state.stats.level);
    refs.xp.textContent = `${Math.floor(state.stats.xp)} / ${state.stats.xpToNext} xp`;

    renderMarketList();
    renderUpgradeList();
    renderStructureList();
    renderTaskList();
  }

  function sellLogs(amount, multi = 1) {
    amount = Math.min(amount, state.stats.logs);
    if (amount <= 0) return;
    const gain = rawLogPrice() * amount * multi;
    state.stats.logs -= amount;
    state.stats.cash += gain;
    state.stats.sold += amount;
    gainXp(amount * 2);
    addToast(`Sold ${amount} logs for ${money(gain)}.`);
    updateAdvisor();
    updateHUD();
  }

  function reserveLogs(amount) {
    if (state.stats.logs < amount) return;
    state.stats.logs -= amount;
    state.stats.reservedLogs += amount;
    addToast(`${amount} logs reserved.`);
    updateHUD();
  }

  function releaseReserved(amount) {
    amount = Math.min(amount, state.stats.reservedLogs);
    if (amount <= 0) return;
    state.stats.reservedLogs -= amount;
    state.stats.logs += amount;
    addToast(`${amount} reserved logs released.`);
    updateHUD();
  }

  function buyUpgrade(key) {
    const cost = upgradeCost(key);
    if (state.stats.cash < cost) return;
    if (state.upgrades[key] >= upgradeData[key].max) return;
    state.stats.cash -= cost;
    state.upgrades[key] += 1;
    addToast(`${upgradeData[key].label} upgraded.`);
    updateAdvisor();
    updateHUD();
  }

  function buildStructure(key) {
    const s = structureData[key];
    if (state.structures[key] >= s.max) return;
    if (state.stats.reservedLogs < s.costLogs || state.stats.cash < s.costCash) return;
    state.stats.reservedLogs -= s.costLogs;
    state.stats.cash -= s.costCash;
    state.structures[key] += 1;
    state.stats.built += 1;
    refreshContracts();
    addToast(`${s.label} constructed.`);
    updateAdvisor();
    updateHUD();
  }

  function hireWorker(key) {
    const w = workerData[key];
    if (!w.unlocked()) return;
    if (state.stats.cash < w.cost) return;
    state.stats.cash -= w.cost;
    state.workers[key] += 1;
    addToast(`${w.label} hired.`);
    updateHUD();
  }

  function deliverContract(id) {
    const c = state.contracts.find(x => x.id === id);
    if (!c) return;
    if (state.stats.logs < c.need) {
      addToast("Not enough logs for this contract.");
      return;
    }
    state.stats.logs -= c.need;
    state.stats.cash += c.reward;
    state.stats.contractsDone += 1;
    c.active = false;
    gainXp(c.reward * .12);
    addToast(`Contract fulfilled for ${money(c.reward)}.`);
    refreshContracts();
    updateHUD();
  }

  function renderMarketList() {
    const rows = [
      {
        title: "Sell 1 Raw Log",
        desc: `Current value ${money(rawLogPrice())}.`,
        action: "Sell",
        enabled: state.stats.logs >= 1,
        click: () => sellLogs(1)
      },
      {
        title: "Sell 5 Logs",
        desc: `Bulk sale for ${money(rawLogPrice() * 5 * 1.04)}.`,
        action: "Sell 5",
        enabled: state.stats.logs >= 5,
        click: () => sellLogs(5, 1.04)
      },
      {
        title: "Reserve 5 Logs",
        desc: "Set aside materials for structures and crafting.",
        action: "Reserve",
        enabled: state.stats.logs >= 5,
        click: () => reserveLogs(5)
      },
      {
        title: "Release Reserved Logs",
        desc: "Return stored materials to inventory.",
        action: "Release",
        enabled: state.stats.reservedLogs >= 5,
        click: () => releaseReserved(5)
      }
    ];

    refs.marketList.innerHTML = rows.map((r, i) => `
      <div class="th-row">
        <div>
          <div class="th-row-title">${r.title}</div>
          <div class="th-row-desc">${r.desc}</div>
        </div>
        <button class="th-btn ${r.enabled ? 'th-btn--primary' : ''}" data-market-index="${i}" ${r.enabled ? '' : 'disabled'}>${r.action}</button>
      </div>
    `).join("");

    refs.marketList.querySelectorAll("[data-market-index]").forEach(btn => {
      btn.addEventListener("click", () => rows[Number(btn.dataset.marketIndex)].click());
    });
  }

  function renderUpgradeList() {
    refs.upgradeList.innerHTML = Object.entries(upgradeData).map(([key, d]) => {
      const level = state.upgrades[key];
      const cost = upgradeCost(key);
      const can = state.stats.cash >= cost && level < d.max;
      return `
        <div class="th-row">
          <div>
            <div class="th-row-title">${d.label} <span class="th-pill">Lv ${level}/${d.max}</span></div>
            <div class="th-row-desc">${d.desc} · Cost ${money(cost)}</div>
          </div>
          <button class="th-btn ${can ? 'th-btn--primary' : ''}" data-upgrade-key="${key}" ${can ? '' : 'disabled'}>${level < d.max ? 'Upgrade' : 'Maxed'}</button>
        </div>
      `;
    }).join("");

    refs.upgradeList.querySelectorAll("[data-upgrade-key]").forEach(btn => {
      btn.addEventListener("click", () => buyUpgrade(btn.dataset.upgradeKey));
    });
  }

  function renderStructureList() {
    refs.structureList.innerHTML = Object.entries(structureData).map(([key, d]) => {
      const built = state.structures[key];
      const can = built < d.max && state.stats.reservedLogs >= d.costLogs && state.stats.cash >= d.costCash;
      return `
        <div class="th-row">
          <div>
            <div class="th-row-title">${d.label} <span class="th-pill">${built}/${d.max}</span></div>
            <div class="th-row-desc">${d.desc} · ${d.costLogs} reserved logs + ${money(d.costCash)} · ${d.effect}</div>
          </div>
          <button class="th-btn ${can ? 'th-btn--primary' : ''}" data-structure-key="${key}" ${can ? '' : 'disabled'}>${built < d.max ? 'Build' : 'Done'}</button>
        </div>
      `;
    }).join("");

    refs.structureList.querySelectorAll("[data-structure-key]").forEach(btn => {
      btn.addEventListener("click", () => buildStructure(btn.dataset.structureKey));
    });
  }

  function renderTaskList() {
    const tasks = [
      { title: "AI Advisor", desc: state.ai.advisor, action: `<span class="th-pill">${rawLogPrice() > 16 ? "hot market" : "steady"}</span>` },
      { title: "Village Demand", desc: "Sell 8 logs for fast cash.", action: state.stats.sold >= 8 ? `<span class="th-pill">Done</span>` : "In progress" },
      { title: "Builder Ambition", desc: "Build 1 structure.", action: state.stats.built >= 1 ? `<span class="th-pill">Done</span>` : "In progress" },
      { title: "Combo Crafter", desc: "Reach a chop combo of 8.", action: state.stats.bestCombo >= 8 ? `<span class="th-pill">Done</span>` : "In progress" }
    ];

    const contractHtml = state.contracts.map(c => `
      <div class="th-row">
        <div>
          <div class="th-row-title">${c.species} contract <span class="th-pill">${c.progress}/${c.need}</span></div>
          <div class="th-row-desc">Deliver ${c.need} ${c.species} logs · Reward ${money(c.reward)} · ${c.daysLeft} day(s) left</div>
        </div>
        <button class="th-btn" data-contract-id="${c.id}">Deliver</button>
      </div>
    `).join("");

    refs.taskList.innerHTML = tasks.map(t => `
      <div class="th-row">
        <div>
          <div class="th-row-title">${t.title}</div>
          <div class="th-row-desc">${t.desc}</div>
        </div>
        <div>${t.action}</div>
      </div>
    `).join("") + contractHtml;

    refs.taskList.querySelectorAll("[data-contract-id]").forEach(btn => {
      btn.addEventListener("click", () => deliverContract(btn.dataset.contractId));
    });
  }

  function renderOverlay(title, intro, content, activeKey) {
    refs.overlayCard.innerHTML = `
      <div class="th-tabs">
        <button class="th-btn ${activeKey === 'build' ? 'active' : ''}" data-tab="build">[uiLabel.build]</button>
        <button class="th-btn ${activeKey === 'craft' ? 'active' : ''}" data-tab="craft">[uiLabel.craft]</button>
        <button class="th-btn ${activeKey === 'workers' ? 'active' : ''}" data-tab="workers">[uiLabel.workers]</button>
        <button class="th-btn ${activeKey === 'quests' ? 'active' : ''}" data-tab="quests">[uiLabel.quests]</button>
        <button class="th-btn ${activeKey === 'stats' ? 'active' : ''}" data-tab="stats">[uiLabel.stats]</button>
        <button class="th-btn ${activeKey === 'settings' ? 'active' : ''}" data-tab="settings">[uiLabel.settings]</button>
      </div>
      <div>
        <h2 style="font-family: var(--font-display); font-size: var(--text-xl); margin: 0;">${title}</h2>
        <p class="th-small">${intro}</p>
      </div>
      ${content}
      <div style="display:flex;justify-content:flex-end">
        <button class="th-btn" id="th-close-overlay">Close</button>
      </div>
    `;

    refs.overlay.hidden = false;
    refs.overlayCard.querySelector("#th-close-overlay").addEventListener("click", () => refs.overlay.hidden = true);
    refs.overlayCard.querySelectorAll("[data-tab]").forEach(btn => {
      btn.addEventListener("click", () => openPanel(btn.dataset.tab));
    });
  }

  function openPanel(key) {
    if (key === "build") {
      const html = Object.entries(structureData).map(([k, d]) => `
        <article class="th-card">
          <strong>${d.label}</strong>
          <div class="th-small">${d.desc}</div>
          <div class="th-small">Cost: ${d.costLogs} reserved logs + ${money(d.costCash)}</div>
          <div class="th-small">Benefit: ${d.effect}</div>
          <div style="margin-top:var(--space-3)">
            <button class="th-btn th-btn--primary" data-build-overlay="${k}">Build</button>
          </div>
        </article>
      `).join("");
      renderOverlay("Structures", "Buildings create permanent utility and unlock systems.", `<div class="th-grid">${html}</div>`, "build");
      refs.overlayCard.querySelectorAll("[data-build-overlay]").forEach(btn => btn.addEventListener("click", () => buildStructure(btn.dataset.buildOverlay)));
      return;
    }

    if (key === "craft") {
      const html = `
        <div class="th-grid">
          <article class="th-card"><strong>[recipeLabel.bundle]</strong><div class="th-small">[recipeDescription.bundle]</div></article>
          <article class="th-card"><strong>[recipeLabel.planks]</strong><div class="th-small">[recipeDescription.planks]</div></article>
          <article class="th-card"><strong>[recipeLabel.treated]</strong><div class="th-small">[recipeDescription.treated]</div></article>
          <article class="th-card"><strong>[recipeLabel.resinKit]</strong><div class="th-small">[recipeDescription.resinKit]</div></article>
        </div>
      `;
      renderOverlay("Crafting", "Convert logs into higher-value outputs.", html, "craft");
      return;
    }

    if (key === "workers") {
      const html = Object.entries(workerData).map(([k, d]) => `
        <article class="th-card">
          <strong>${d.label}</strong>
          <div class="th-small">${d.desc}</div>
          <div class="th-small">Hire cost ${money(d.cost)} · Wage ${money(d.wage)}/day</div>
          <div style="margin-top:var(--space-3)">
            <button class="th-btn ${d.unlocked() ? 'th-btn--primary' : ''}" data-hire-overlay="${k}" ${d.unlocked() ? '' : 'disabled'}>${d.unlocked() ? 'Hire' : 'Locked'}</button>
          </div>
        </article>
      `).join("");
      renderOverlay("Workers & AI", "Autonomous workers improve chopping, hauling and markets.", `<div class="th-grid">${html}</div>`, "workers");
      refs.overlayCard.querySelectorAll("[data-hire-overlay]").forEach(btn => btn.addEventListener("click", () => hireWorker(btn.dataset.hireOverlay)));
      return;
    }

    if (key === "quests") {
      const html = state.contracts.map(c => `
        <article class="th-card">
          <strong>${c.species} contract</strong>
          <div class="th-small">Need ${c.need} logs · Reward ${money(c.reward)} · ${c.daysLeft} day(s) left</div>
          <div style="margin-top:var(--space-3)">
            <button class="th-btn th-btn--primary" data-deliver-overlay="${c.id}">Deliver</button>
          </div>
        </article>
      `).join("");
      renderOverlay("Contracts", "Use contracts to spike income and progression.", `<div class="th-grid">${html}</div>`, "quests");
      refs.overlayCard.querySelectorAll("[data-deliver-overlay]").forEach(btn => btn.addEventListener("click", () => deliverContract(btn.dataset.deliverOverlay)));
      return;
    }

    if (key === "stats") {
      const html = `
        <div class="th-grid">
          <article class="th-card"><strong>Trees chopped</strong><div class="th-value">${state.stats.chopped}</div></article>
          <article class="th-card"><strong>Logs sold</strong><div class="th-value">${state.stats.sold}</div></article>
          <article class="th-card"><strong>Structures built</strong><div class="th-value">${state.stats.built}</div></article>
          <article class="th-card"><strong>Contracts done</strong><div class="th-value">${state.stats.contractsDone}</div></article>
          <article class="th-card"><strong>Critical hits</strong><div class="th-value">${state.stats.crits}</div></article>
          <article class="th-card"><strong>Best combo</strong><div class="th-value">${state.stats.bestCombo}</div></article>
        </div>
      `;
      renderOverlay("Stats", "Track your run and efficiency.", html, "stats");
      return;
    }

    if (key === "settings") {
      const html = `
        <div class="th-grid">
          <article class="th-card"><strong>Weather effects</strong><div class="th-small">Toggle weather-driven economy and growth.</div><div style="margin-top:var(--space-3)"><button class="th-btn th-btn--primary" id="th-toggle-weather">${state.settings.weatherEffects ? 'On' : 'Off'}</button></div></article>
          <article class="th-card"><strong>Auto-sell overflow</strong><div class="th-small">Automatically sell excess logs when storage is full.</div><div style="margin-top:var(--space-3)"><button class="th-btn th-btn--primary" id="th-toggle-auto">${state.settings.autoSell ? 'On' : 'Off'}</button></div></article>
          <article class="th-card"><strong>Accessibility mode</strong><div class="th-small">Slightly softer decay and clearer feedback.</div><div style="margin-top:var(--space-3)"><button class="th-btn th-btn--primary" id="th-toggle-access">${state.settings.accessibilityMode ? 'On' : 'Off'}</button></div></article>
        </div>
      `;
      renderOverlay("Settings", "Tune the run without leaving the game.", html, "settings");

      refs.overlayCard.querySelector("#th-toggle-weather").addEventListener("click", () => {
        state.settings.weatherEffects = !state.settings.weatherEffects;
        openPanel("settings");
      });
      refs.overlayCard.querySelector("#th-toggle-auto").addEventListener("click", () => {
        state.settings.autoSell = !state.settings.autoSell;
        openPanel("settings");
      });
      refs.overlayCard.querySelector("#th-toggle-access").addEventListener("click", () => {
        state.settings.accessibilityMode = !state.settings.accessibilityMode;
        openPanel("settings");
      });
    }
  }

  const weatherTypes = {
    clear: { sky: 0x9ed0ff, fog: 0xcfe6ff, growth: 1, energy: 1 },
    windy: { sky: 0xa7bfe8, fog: 0xdce9f8, growth: 0.9, energy: 1.05 },
    rain: { sky: 0x7d92ad, fog: 0x9ba8ba, growth: 1.3, energy: 0.95 },
    dusk: { sky: 0xd38a62, fog: 0x674f40, growth: 0.85, energy: 1.08 }
  };

  function updateDayCycle(dt) {
    const scaled = dt * state.settings.dayNightSpeed;
    const sunPhase = (state.time * 0.03 * scaled) % 1;
    const angle = sunPhase * Math.PI * 2;

    sun.position.set(Math.cos(angle) * 22, 18 + Math.sin(angle) * 10, Math.sin(angle) * 16);
    const brightness = clamp(.45 + Math.sin(angle) * .35, .18, 1);
    sun.intensity = 0.8 + brightness;
    ambient.intensity = 0.8 + brightness * .7;

    if (sunPhase < 0.002) {
      state.day += 1;
      state.contracts.forEach(c => c.daysLeft -= 1);
      state.contracts = state.contracts.filter(c => c.daysLeft > 0 && c.active);
      refreshContracts();
      addToast(`Day ${state.day} begins.`);
    }

    const weatherCycle = ["clear","windy","rain","dusk"];
    const idx = Math.floor((state.time * 0.02) % weatherCycle.length);
    state.weather = state.settings.weatherEffects ? weatherCycle[idx] : "clear";

    const data = weatherTypes[state.weather];
    scene.fog = new THREE.Fog(data.fog, 30, 80);
    renderer.setClearColor(data.sky);
  }

  function updateSimulation(dt) {
    if (state.paused || !state.started) return;

    state.time += dt;
    state.stats.energy = clamp(
      state.stats.energy + state.stats.energyRegen * dt * weatherTypes[state.weather].energy,
      0,
      state.stats.maxEnergy
    );
    state.stats.combo = Math.max(0, state.stats.combo - dt * (state.settings.accessibilityMode ? .22 : .34));

    if (state.workers.marketBroker > 0) state.ai.marketMultiplier += 0.003 * dt;
    state.ai.marketMultiplier += (1 - state.ai.marketMultiplier) * dt * .18;

    if (state.structures.dryingShed > 0 && Math.random() < 0.055 * dt * state.structures.dryingShed && state.stats.logs >= 1) {
      state.stats.logs -= 1;
      state.stats.processedLumber += 1;
    }

    if (state.structures.sawmill > 0 && Math.random() < 0.08 * dt * state.structures.sawmill && state.stats.logs >= 2) {
      state.stats.logs -= 2;
      state.stats.processedLumber += 1;
    }

    if (state.workers.rookieLogger > 0 && Math.random() < 0.16 * dt * (1 + state.upgrades.automation * .12) && logSpaceLeft() > 0) {
      state.stats.logs += 1;
      gainXp(2);
    }

    if (state.settings.autoSell && state.stats.logs > storageCap()) {
      const overflow = state.stats.logs - storageCap();
      if (overflow > 0) sellLogs(overflow);
    }

    updateDayCycle(dt);
    updateTrees(dt);
    updateAdvisor();
    updateHUD();
  }

  function fellTree(treeObj) {
    const tree = treeObj.userData.tree;
    tree.alive = false;
    state.stats.chopped += 1;

    const logGain = 1 + Math.floor(tree.value / 16) + (Math.random() < .2 ? 1 : 0);
    const stored = Math.min(logGain, logSpaceLeft());
    state.stats.logs += stored;

    const overflow = logGain - stored;
    if (overflow > 0 && state.settings.autoSell) {
      state.stats.cash += overflow * rawLogPrice();
    }

    gainXp(tree.xp);
    state.stats.combo += 2;
    state.stats.bestCombo = Math.max(state.stats.bestCombo, state.stats.combo);

    state.contracts.forEach(contract => {
      if (contract.species === tree.species) contract.progress = Math.min(contract.need, contract.progress + stored);
    });

    addToast(`${tree.species} tree felled. +${stored} logs.`);
    tree.canopy.forEach((mesh, i) => mesh.rotation.z = i === 0 ? .7 : -.55);
    tree.trunk.rotation.z = .72;
    tree.regrow = rand(18, 34) / (1 + state.upgrades.reforestation * .12) / weatherTypes[state.weather].growth;

    updateHUD();
  }

  function chopTree(treeObj) {
    const tree = treeObj.userData.tree;
    if (!tree.alive || tree.cooldown > 0) return;

    const cost = tree.energyCost * clamp(1 - state.upgrades.endurance * .06, .52, 1);
    if (state.stats.energy < cost) {
      addToast("Too tired. Recover some energy.");
      return;
    }

    state.stats.energy -= cost;
    tree.cooldown = clamp(.62 / (1 + state.upgrades.swingSpeed * .14), .12, .8);

    let damage = 1 * (1 + state.upgrades.sharpness * .16);
    const crit = Math.random() < (.08 + state.upgrades.sharpness * .03);
    if (crit) {
      damage *= 1.9;
      state.stats.crits += 1;
    }

    tree.hp -= damage;
    state.stats.combo += 1;
    state.stats.bestCombo = Math.max(state.stats.bestCombo, state.stats.combo);

    if (tree.hp <= 0) {
      fellTree(treeObj);
    }
  }

  function updateTrees(dt) {
    trees.forEach(treeObj => {
      const tree = treeObj.userData.tree;
      if (tree.cooldown > 0) tree.cooldown -= dt;
      if (!tree.alive) {
        tree.regrow -= dt;
        if (tree.regrow <= 0) {
          const spec = speciesData[tree.species];
          tree.alive = true;
          tree.maxHp = spec.hp;
          tree.hp = spec.hp;
          tree.trunk.rotation.z = 0;
          tree.canopy[0].rotation.z = 0;
          tree.canopy[1].rotation.z = 0;
        }
      }
      if (state.selectedTree === treeObj && state.settings.outlineTrees) {
        tree.marker.material.opacity = 0.55 + Math.sin(state.time * 4) * 0.25;
      }
    });
  }

  function resize() {
    const rect = rootNode.getBoundingClientRect();
    camera.aspect = rect.width / rect.height;
    camera.updateProjectionMatrix();
    renderer.setSize(rect.width, rect.height, false);
  }

  function render() {
    const dt = Math.min(clock.getDelta(), .05);
    updateSimulation(dt);

    const focus = new THREE.Vector3(0, 2.4, 0);
    camera.position.set(
      Math.cos(orbit.theta) * orbit.radius * Math.sin(orbit.phi),
      Math.cos(orbit.phi) * orbit.radius + 3,
      Math.sin(orbit.theta) * orbit.radius * Math.sin(orbit.phi)
    );
    camera.lookAt(focus);

    renderer.render(scene, camera);
    requestAnimationFrame(render);
  }

  refs.canvas.addEventListener("pointerdown", e => {
    if (!state.started || state.paused) return;

    orbit.dragging = true;
    orbit.x = e.clientX;
    orbit.y = e.clientY;

    const rect = refs.canvas.getBoundingClientRect();
    pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);

    const hit = raycaster.intersectObjects(trees, true).find(i => i.object.parent?.userData?.type === "tree");
    if (hit) {
      const treeObj = hit.object.parent;
      if (state.selectedTree && state.selectedTree !== treeObj) {
        state.selectedTree.userData.tree.marker.material.opacity = 0;
      }
      state.selectedTree = treeObj;
      treeObj.userData.tree.marker.material.opacity = 0.9;
      chopTree(treeObj);
    }
  });

  window.addEventListener("pointermove", e => {
    if (!orbit.dragging) return;
    orbit.theta -= (e.clientX - orbit.x) * 0.005 * state.settings.cameraSensitivity;
    orbit.phi = clamp(orbit.phi + (e.clientY - orbit.y) * 0.0035 * state.settings.cameraSensitivity, 0.45, 1.3);
    orbit.x = e.clientX;
    orbit.y = e.clientY;
  });

  window.addEventListener("pointerup", () => {
    orbit.dragging = false;
  });

  refs.canvas.addEventListener("wheel", e => {
    orbit.radius = clamp(orbit.radius + e.deltaY * 0.012, 11, 42);
  }, { passive: true });

  rootNode.querySelector("#th-start-btn").addEventListener("click", () => {
    state.started = true;
    refs.startScreen.hidden = true;
    addToast("Tree Hustler started.");
    updateHUD();
  });

  rootNode.querySelector("#th-guide-btn").addEventListener("click", () => openPanel("quests"));
  rootNode.querySelector("#th-help").addEventListener("click", () => openPanel("quests"));
  rootNode.querySelector("#th-settings").addEventListener("click", () => openPanel("settings"));

  rootNode.querySelector("#th-theme").addEventListener("click", () => {
    rootNode.classList.toggle("th-light");
    addToast("Theme toggle is ready for extension.");
  });

  rootNode.querySelector("#th-sound").addEventListener("click", () => {
    state.soundOn = !state.soundOn;
    addToast(state.soundOn ? "Sound on." : "Sound muted.");
  });

  rootNode.querySelector("#th-pause").addEventListener("click", () => {
    state.paused = !state.paused;
    addToast(state.paused ? "Game paused." : "Game resumed.");
  });

  rootNode.querySelectorAll("[data-panel]").forEach(btn => {
    btn.addEventListener("click", () => openPanel(btn.dataset.panel));
  });

  refs.overlay.addEventListener("click", e => {
    if (e.target === refs.overlay) refs.overlay.hidden = true;
  });

  window.addEventListener("keydown", e => {
    if (e.key.toLowerCase() === "p") state.paused = !state.paused;
    if (e.key.toLowerCase() === "b") openPanel("build");
    if (e.key.toLowerCase() === "c") openPanel("craft");
    if (e.key.toLowerCase() === "w") openPanel("workers");
    if (e.key.toLowerCase() === "q") openPanel("quests");
    if (e.key === "Escape") refs.overlay.hidden = true;
  });

  refreshContracts();
  updateAdvisor();
  updateHUD();
  resize();
  window.addEventListener("resize", resize);
  render();
</script>
</body>
</html>
