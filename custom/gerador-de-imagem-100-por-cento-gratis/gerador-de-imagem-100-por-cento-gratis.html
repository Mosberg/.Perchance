<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>gerador-de-imagem-100-por-cento-gratis — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
[generateHTML(settings)]

<script>

// Override das gerações de texto em inglês para português
// Este script substitui as funções do t2i-framework-plugin-v2 que geram texto em inglês

(function() {
  function waitForFn(fnName, callback) {
    if (window[fnName]) return callback();
    const interval = setInterval(() => {
      if (window[fnName]) {
        clearInterval(interval);
        callback();
      }
    }, 200);
  }

  // Função para balancear chaves { } em texto gerado por IA
  // Garante que toda { tenha uma } correspondente, adicionando as que faltam no final
  function balanceCurlyBraces(text) {
    let depth = 0;
    let result = text;
    for (let i = 0; i < result.length; i++) {
      if (result[i] === '{') depth++;
      else if (result[i] === '}') depth--;
      if (depth < 0) depth = 0; // ignora } sem { correspondente
    }
    // Adiciona } que faltam no final
    while (depth > 0) {
      result += '}';
      depth--;
    }
    return result;
  }

  // Modal simples para substituir getUserInput do framework
  function ptGetUserInput(fields, opts) {
    fields = fields || {};
    opts = opts || {};
    const cancelText = opts.cancelText || "Cancelar";
    const okText = opts.okText || "Gerar";

    return new Promise(resolve => {
      const overlay = Object.assign(document.createElement("div"), { tabIndex: 0 });
      overlay.style.cssText = "position:fixed;inset:0;z-index:99999999;display:grid;place-items:center;background-color:rgba(0,0,0,.65);font:16px/1.4 system-ui";

      const modal = document.createElement("div");
      modal.style.cssText = "text-align:left !important;width:520px;max-width:97vw;border-radius:8px;padding:15px;background-color:light-dark(#fff,#222);color:light-dark(#000,#fff);box-shadow:0 2px 8px rgba(0,0,0,.2);display:flex;flex-direction:column;gap:12px;max-height:min(92vh,900px);";

      const scrollWrap = document.createElement("div");
      scrollWrap.style.cssText = "overflow:auto;min-height:0;";
      const host = document.createElement("div");
      host.style.cssText = "display:block";
      scrollWrap.append(host);

      const footer = document.createElement("div");
      footer.style.cssText = "display:flex;gap:8px;align-items:center;margin-top:4px;";
      const cancelBtn = document.createElement("button");
      cancelBtn.textContent = cancelText;
      cancelBtn.hidden = !!opts.hideCancel;
      cancelBtn.style.cssText = "padding:6px 16px;border:1px solid light-dark(#ccc,#555);border-radius:6px;background-color:light-dark(#f6f6f6,#333);color:inherit;cursor:pointer;";
      const okBtn = document.createElement("button");
      okBtn.textContent = okText;
      okBtn.autofocus = true;
      okBtn.style.cssText = "margin-left:auto;padding:6px 16px;border:none;border-radius:6px;background-color:light-dark(#1677ff,#2b87ff);color:#fff;cursor:pointer;";

      footer.append(cancelBtn, okBtn);
      modal.append(scrollWrap, footer);
      overlay.append(modal);

      const inputCSS = "width:100%;max-width:100%;box-sizing:border-box;padding:8px;border:1px solid light-dark(#ccc,#555);border-radius:6px;background-color:light-dark(#fff,#333);color:inherit;";
      const elMap = new Map();

      Object.entries(fields).forEach(([name, cfgRaw]) => {
        const cfg = cfgRaw || {};
        const t = (cfg.type || "input:text").toLowerCase();
        const wrap = document.createElement("div");
        wrap.style.cssText = `margin:0 0 ${cfg.marginBottom || "12px"}`;

        if (cfg.label) {
          const lab = document.createElement("div");
          lab.style.cssText = "margin:0 0 6px;display:flex;align-items:center;gap:6px;";
          const labText = document.createElement("div");
          labText.textContent = cfg.label || name;
          lab.append(labText);
          wrap.append(lab);
        }

        if (t === "html") {
          const div = document.createElement("div");
          div.innerHTML = cfg.html || "";
          wrap.append(div);
        } else if (t === "textarea") {
          const el = document.createElement("textarea");
          el.rows = cfg.rows || 4;
          el.style.cssText = inputCSS;
          if (cfg.placeholder != null) el.placeholder = cfg.placeholder;
          if (cfg.value != null) el.value = cfg.value;
          wrap.append(el);
          elMap.set(name, el);
        } else if (t === "select") {
          const el = document.createElement("select");
          el.style.cssText = inputCSS;
          (cfg.options || []).forEach(opt => {
            const o = document.createElement("option");
            o.value = opt.value;
            o.textContent = opt.label;
            el.append(o);
          });
          if (cfg.value != null) el.value = cfg.value;
          wrap.append(el);
          elMap.set(name, el);
        } else {
          const el = document.createElement("input");
          el.type = "text";
          el.style.cssText = inputCSS;
          if (cfg.placeholder != null) el.placeholder = cfg.placeholder;
          if (cfg.value != null) el.value = cfg.value;
          wrap.append(el);
          elMap.set(name, el);
        }

        host.append(wrap);
      });

      function close(result) {
        overlay.remove();
        resolve(result);
      }

      okBtn.onclick = () => {
        const result = {};
        elMap.forEach((el, name) => { result[name] = el.value; });
        close(result);
      };
      cancelBtn.onclick = () => close(null);
      overlay.onclick = (e) => { if (e.target === overlay && opts.cancelOnBackgroundClick) close(null); };
      overlay.onkeydown = (e) => {
        if (e.key === "Escape") close(null);
        if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) okBtn.click();
      };

      document.body.append(overlay);
      overlay.focus();
    });
  }

  // Override: Editor de persona com UI em português
  function ptOpenCharacterDescriptionEditor(imageCtn) {
    imageCtn.querySelector('.personality-chat-button').style.visibility = 'hidden';
    if (imageCtn.querySelector('.char-description-editor-ctn')) {
      imageCtn.querySelector('.char-description-editor-ctn').style.display = 'flex';
    } else {
      let tmp = document.createElement("div");
      tmp.innerHTML = `<div class="char-description-editor-ctn" style="color-scheme:dark; color:#dddddd; position:absolute;top:0;left:0;right:0;bottom:0;display: flex;flex-direction:column; gap:0.125rem; padding:0.125rem; padding-bottom:0; backdrop-filter:brightness(0.7);">
        <textarea class="char-description-instruction" style="backdrop-filter:blur(3px); background:rgba(0, 0, 0, 0.8); font-size:80%; min-height:70px; border:1px solid grey; border-radius:2px; color-scheme:dark;" placeholder="(Opcional) Instruções extras para a personalidade, aparência e história do personagem."></textarea>
        <div style="display:flex; gap:0.125rem; justify-content:center;">
          <button class="char-description-generate-button" style="color-scheme:dark; flex-grow:1; font-weight:bold; max-width:max-content; box-shadow:0px 0px 12px 2px black;" onclick="window.t2i_generateCharacterDescription(this.closest('.t2i-image-ctn'))">✨ gerar persona</button>
          <button class="char-description-stop-button" style="color-scheme:dark; min-width:4rem; display:none; box-shadow:0px 0px 12px 2px black;" onclick="this.closest('.t2i-image-ctn').__generateObj.stop()">🛑 parar</button>
        </div>
        <input class="character-name-output" style="backdrop-filter:blur(3px); background:rgba(0, 0, 0, 0.8); border:1px solid grey; border-radius:2px; color-scheme:dark;" placeholder="Nome do personagem">
        <textarea class="character-description-output" placeholder="Clique no botão 𝗴𝗲𝗿𝗮𝗿 persona acima! A descrição do personagem aparecerá aqui, e então você poderá editá-la." style="backdrop-filter:blur(3px); flex-grow:1; background:rgba(0,0,0,0.8); border:1px solid grey; border-radius:2px; font-size:85%; color-scheme:dark;"></textarea>
        <div style="display:flex; gap:0.25rem;">
          <button style="flex-grow:1; color-scheme:dark;" onclick="window.t2i_generateChatLink(this.closest('.t2i-image-ctn'))">💬 conversar com o personagem</button>
          <button style="min-width:4rem; color-scheme:dark;" onclick="this.closest('.char-description-editor-ctn').style.display='none'; this.closest('.t2i-image-ctn').querySelector('.personality-chat-button').style.visibility='visible';">❌ fechar</button>
        </div>
      </div>`;
      imageCtn.appendChild(tmp.firstElementChild);
    }
  }

  // Override: Geração de persona com prompts em português
  async function ptGenerateCharacterDescription(imageCtn) {
    let generateBtn = imageCtn.querySelector(".char-description-generate-button");
    let stopBtn = imageCtn.querySelector(".char-description-stop-button");

    let originalGenerateButtonTextContent = generateBtn.textContent;
    generateBtn.innerHTML = `<span style="display:inline-block; animation:rotate 1.5s linear infinite;">⏳</span> carregando...`;
    generateBtn.disabled = true;
    stopBtn.style.display = "";

    while (!imageCtn.querySelector("iframe").textToImagePluginOutput) await new Promise(r => setTimeout(r, 1000));

    let charDescriptionInstruction = imageCtn.querySelector(".char-description-instruction").value.trim();
    let textToImagePluginOutput = imageCtn.querySelector("iframe").textToImagePluginOutput;
    let nameOutputEl = imageCtn.querySelector(".character-name-output");
    let descriptionOutputEl = imageCtn.querySelector(".character-description-output");

    nameOutputEl.value = "";
    descriptionOutputEl.value = "";

    let generateObj = root.generateText({
      instruction: `
      TAREFA: O usuário criou uma imagem de um personagem usando um prompt. O prompt é mostrado abaixo. Sua tarefa é usar as dicas de personalidade do personagem no prompt para gerar uma descrição de personagem para roleplay. Sua descrição deve incluir personalidade, aparência, exemplos de fala/maneirismos, etc., de modo que um ator pudesse lê-la e saber como interpretar o personagem em todos os aspectos relevantes. Use um estilo de escrita denso em informações para capturar *sucintamente* todos os aspectos da personalidade do personagem que você gerar. Sua descrição deve ter entre 200 e 600 palavras. Faça o seu melhor para gerar um personagem baseado no que você vê abaixo. Siga as dicas no prompt de imagem do usuário para capturar com precisão os detalhes que são mais importantes para um chat/roleplay de personagem.

      --- INÍCIO DO PROMPT DE IMAGEM ---
      ${textToImagePluginOutput.inputs.prompt.replace(/\s+/g, " ")}
      --- FIM DO PROMPT DE IMAGEM ---

      Lembrete: Sua tarefa é gerar um personagem inspirado no prompt de imagem acima. Sua resposta deve descrever como o personagem se parece/age/fala/comporta-se de modo que, se alguém lesse, seria capaz de emular ou interpretar com precisão os maneirismos, personalidade, etc. do personagem alvo. No máximo 600 palavras.
      ${charDescriptionInstruction ? `\nMas também, o personagem deve ser baseado nesta instrução: ${charDescriptionInstruction}\n` : ""}

      Responda inteiramente em português brasileiro. Use o seguinte modelo para sua resposta:
      <modelo_de_resposta>
      # Nome:
      (O nome do personagem)

      # Descrição Visual:
      (Um CURTO parágrafo descrevendo a aparência do personagem - mantenha curto, conciso e direto. Baixa contagem de palavras, alta densidade de informações. Evite prosa roxa e descrições excessivamente floridas.)

      # Personalidade:
      (UM parágrafo de descrição de personalidade. Use principalmente frases curtas - ou seja, escreva em um estilo denso em informações. Concentre-se nos aspectos que os tornam únicos/interessantes. Se relevante, você pode usar termos como tsundere, yandere, kuudere, deredere, dandere, genki girl, seme, uke, megane, chuunibyou, heroína desajeitada, complexo de superioridade, dominante, submisso, etc. para capturar sucintamente aspectos de sua personalidade. Invente alguns aspectos interessantes, use liberdade criativa para criar um personagem com profundidade genuína, com idiossincrasias, objetivos, medos, gostos, desgostos, ética, etc. Lembre-se, seu objetivo é criar um personagem que seria divertido para o usuário interpretar! Siga a iniciativa do usuário com base em sua ideia inicial, mas dê um passo além para surpreender e empolgar.)

      # Exemplos de Comportamento:
      (Uma lista numerada de 5 exemplos separados e diversos de fala/comportamento do personagem, cada um começando com um asterisco ou aspas, que colocam o personagem em situações aleatórias de roleplay, como se você tivesse extraído momentos aleatórios e diversos de uma história, com contexto suficiente capturado pelo diálogo e ações, para mostrar a essência de quem eles são como personagem, como eles falam/agem/reagem. Cada exemplo deve capturar perfeitamente um aspecto de quem eles são como personagem. Cada exemplo deve ser seu próprio momento separado de uma história hipotética, não relacionado aos outros exemplos que você escreve. Você deve usar asteriscos em torno de ações e aspas em torno de fala no estilo típico de roleplay, por exemplo [não use este exemplo específico em sua resposta, é apenas para demonstrar a sintaxe]: 1. "E por que a..." *Ele gesticula para a carruagem virada* "...entrada grandiosa?")

      # Comida Favorita:
      (comida favorita)
      </modelo_de_resposta>
      `.trim(),
      startWith: "# Nome:",
      stopSequences: ["# Comida"],
      onChunk: (data) => {
        let parts = data.fullTextSoFar.split(/(^|\n\n)# /s).map(p => p.trim()).filter(p => p);
        let name = parts.find(p => p.startsWith("Nome"))?.split("\n")?.[1]?.trim();
        let visualDescription = parts.find(p => p.startsWith("Visual"))?.split("\n").slice(1).join("\n").trim() || "";
        let personalityDescription = parts.find(p => p.startsWith("Personalidade"))?.split("\n").slice(1).join("\n").trim() || "";
        let roleplayBehaviorExamples = parts.find(p => p.startsWith("Exemplos"))?.split("\n").slice(1).join("\n").trim() || "";

        nameOutputEl.value = name || "";

        let description = `# {{char}} Descrição Visual:\n${visualDescription}\n\n# {{char}} Personalidade:\n${personalityDescription}\n\n# {{char}} Exemplos de Comportamento:\n${roleplayBehaviorExamples}`;
        descriptionOutputEl.value = description;

        if (descriptionOutputEl.scrollTop > (descriptionOutputEl.scrollHeight - descriptionOutputEl.offsetHeight) - 30) {
          descriptionOutputEl.scrollTop = 99999999;
        }
      },
    });

    imageCtn.__generateObj = generateObj;
    let data = await generateObj;

    generateBtn.textContent = originalGenerateButtonTextContent;
    generateBtn.disabled = false;
    stopBtn.style.display = "none";
  }

  // Override: Chat link com alerta e instrução de roleplay em português
  // Guarda referência à função original para reaproveitar a lógica complexa
  let originalGenerateChatLink = window.t2i_generateChatLink;

  async function ptGenerateChatLink(imageCtn) {
    let descriptionEl = imageCtn.querySelector(".character-description-output");
    let description = descriptionEl.value.trim().replace(/\n+/g, "\n").trim();

    if (!description) return alert("Primeiro clique no botão 𝗴𝗲𝗿𝗮𝗿 persona acima para gerar uma descrição de personagem.");

    // Adiciona instrução em português temporariamente para que o chat aconteça em português
    let originalValue = descriptionEl.value;
    let ptInstruction = "Importante: Sempre responda e faça roleplay inteiramente em português brasileiro. Todos os diálogos, narrativa e ações devem ser em português.";
    if (!description.includes("Sempre responda e faça roleplay inteiramente em português")) {
      descriptionEl.value = ptInstruction + "\n\n" + description;
    }

    try {
      // Chama a função original que cuida de toda a lógica (art style, share link, etc.)
      await originalGenerateChatLink(imageCtn);
    } finally {
      // Restaura o valor original
      descriptionEl.value = originalValue;
    }
  }

  // Handler para sugestão de prompt por IA em português (chamado via event capture)
  async function ptAiSuggestClickHandler(btn) {
    if (btn.disabled) return; // não faz nada se o botão estiver desabilitado (ex: já gerando)

    const userInput = await ptGetUserInput({
      instruction: { type: "textarea", label: "Deixe a IA gerar um prompt completo baseado em suas ideias:", placeholder: "Adicione palavras-chave/ideias/instruções aqui...", value: window.lastUsedAiSuggestPrompt || "" },
      type:        { type: "select",   label: "Tipo de resposta:", options: [{ value: "curly", label: "Um prompt com blocos {aleatórios|chaves}" }, { value: "normal", label: "Um prompt normal" }], value: localStorage.lastUsedAiSuggestResponseType || "curly" },
      tip:         { type: "html",     html: `<div style="opacity:0.8; font-size:75%;"><b>Dica</b>: Otimize prompts com o <a href="https://perchance.org/image-prompt-optimizer" style="font-weight:bold;color:#2bbb00;" target="_blank">Otimizador de Prompts de Imagem</a>.</div>`, marginBottom: "0px" },
    }, { okText: "Gerar", cancelText: "Cancelar", cancelOnBackgroundClick: true });

    if (userInput && userInput.instruction.trim()) {
      window.lastUsedAiSuggestPrompt = userInput.instruction.trim();
      localStorage.lastUsedAiSuggestResponseType = userInput.type;
    } else {
      return;
    }

    userInput.instruction = userInput.instruction.trim();
    const doCurly = userInput.type === "curly";
    let curlyBraceInstruction = "";
    if (doCurly) {
      curlyBraceInstruction = `\n\nEsta descrição será usada para geração de imagem, então ao longo da descrição você deve adicionar muita notação de 'blocos de chaves' para adicionar aleatoriedade, de modo que cada imagem seja única. Por exemplo, você poderia escrever "uma {candidata|de estúdio|de drone|selfie|fofa ilustrada} {retrato|panorama} de um...". Você pode usar blocos de chaves para variar cores, iluminação, expressões, locais/cenários, fundos, ângulo de câmera, roupas, temas, estilos de arte/foto, e literalmente qualquer outra coisa. IMPORTANTE: Certifique-se de que TODAS as chaves estejam balanceadas — cada { deve ter uma } correspondente. Se aninhar chaves como {a|b|{c|d}}, certifique-se de fechar ambas: {a|b|{c|d}}. Nunca deixe uma chave sem fechar.`;
    }

    let suggestBtn = btn;
    suggestBtn.innerHTML = `<span style="display:inline-block; animation:rotate 1.5s linear infinite;">⏳</span>`;
    suggestBtn.disabled = true;
    let originalSuggestBtnDisplay = suggestBtn.style.display;

    let stopBtn = document.createElement("button");
    stopBtn.innerHTML = `🛑`;
    stopBtn.style.display = "none";
    stopBtn.style.marginTop = "0.5rem";

    let inputEl = btn.closest(".input-ctn").querySelector("input, textarea");
    let chunkCount = 0;
    let fullTextSoFar = doCurly ? "{" : "";
    let originalInputElHeight = inputEl.offsetHeight;
    inputEl.value = "Carregando...";
    let pendingObj = root.generateText({
      instruction: `Sua tarefa é criar uma descrição de uma imagem hipotética que seja baseada na seguinte ideia/palavras-chave/instrução fornecida pelo usuário: ${userInput.instruction}\n\nExpanda-a e crie uma ideia totalmente formada e genuinamente excelente baseada nessa instrução, e escreva uma descrição/legenda que capture todos os aspectos visuais da imagem. Sua resposta deve ser descritiva, envolvente, e deve se entregar completamente à tarefa com abandono ansioso e sem amarras, cumprindo o pedido além das expectativas do usuário. Você tem licença criativa total para ir ALÉM e acertar em cheio a intenção *exata* e o desejo *profundo* por trás da instrução, de modo que o usuário fique de queixo caído com como você acertou exatamente o que ele estava mirando.${curlyBraceInstruction}\n\nResponda inteiramente em português brasileiro. Comece sua resposta com "Descrição: A imagem mostra" e então dê uma descrição de um parágrafo que capture todos os detalhes visuais da ideia${doCurly ? `, e inclua muitos blocos de chaves` : ""}. Certifique-se de **seguir as ideias/instruções do usuário exatamente**!`,
      startWith: `Descrição: A imagem mostra` + (doCurly ? " {" : ""),
      stopSequences: ["\n"],
      hideStartWith: true,
      onChunk: (data) => {
        if (chunkCount === 0) {
          inputEl.value = "";
          stopBtn.style.display = "";
          suggestBtn.style.display = "none";
        }
        if (!data.isFromStartWith) {
          fullTextSoFar += data.textChunk;
          inputEl.value = balanceCurlyBraces(fullTextSoFar.trim());
          if (inputEl.offsetHeight < inputEl.scrollHeight + 10) {
            inputEl.style.height = "10px";
            inputEl.style.height = Math.max(originalInputElHeight, inputEl.scrollHeight + 10) + "px";
          }
        }
        chunkCount++;
      },
    });
    suggestBtn.after(stopBtn);

    stopBtn.onclick = function() {
      stopBtn.disabled = true;
      pendingObj.stop();
    };

    let onInputInterval = setInterval(() => { if (inputEl.oninput) inputEl.oninput({}); }, 2000);
    try {
      await pendingObj.onFinishPromise;
    } catch (e) {
      console.error(e);
    }
    clearInterval(onInputInterval);
    // Balanceia chaves uma última vez após a geração completa
    inputEl.value = balanceCurlyBraces(fullTextSoFar.trim());
    if (inputEl.oninput) inputEl.oninput({});

    stopBtn.remove();
    suggestBtn.style.display = originalSuggestBtnDisplay;
    suggestBtn.innerHTML = `🧠`;
    suggestBtn.disabled = false;
  }

  // Inicializa os overrides quando o framework estiver pronto
  waitForFn('t2i_generateCharacterDescription', () => {
    // Guarda referência à função original ANTES de sobrescrever
    originalGenerateChatLink = window.t2i_generateChatLink;

    // Override das funções de persona
    window.t2i_openCharacterDescriptionEditor = ptOpenCharacterDescriptionEditor;
    window.t2i_generateCharacterDescription = ptGenerateCharacterDescription;
    window.t2i_generateChatLink = ptGenerateChatLink;

    // Intercepta cliques nos botões de sugestão por IA (🧠) usando event capture
    // Isso é necessário porque o framework define o onclick APÓS inserir o botão no DOM,
    // então tentar sobrescrever o onclick diretamente não funciona de forma confiável.
    document.addEventListener('click', function(e) {
      const btn = e.target.closest('.ai-suggest-btn');
      if (btn) {
        e.stopPropagation();
        e.preventDefault();
        ptAiSuggestClickHandler(btn);
      }
    }, true); // capture phase — intercepta antes do onclick do framework

    // Fix: garante que downloads de blob da galeria funcionem
    // O create-media-gallery-plugin cria um <a> com href="blob:https://..." e chama .click(),
    // mas downloads de blob URLs dentro de iframes cross-origin podem ser bloqueados pelo navegador.
    // Solução: converter o blob para um data URL (base64) antes de disparar o download —
    // data URLs não sofrem da mesma restrição e funcionam de forma confiável em qualquer contexto.
    // Também atrasa o revokeObjectURL para evitar interrupção da leitura do blob.
    if (!window.__ptAnchorClickPatched) {
      const origAnchorClick = HTMLAnchorElement.prototype.click;
      HTMLAnchorElement.prototype.click = async function() {
        if (this.download && this.href && this.href.startsWith("blob:")) {
          try {
            const resp = await fetch(this.href);
            const blob = await resp.blob();
            const reader = new FileReader();
            const dataUrl = await new Promise((resolve, reject) => {
              reader.onload = () => resolve(reader.result);
              reader.onerror = reject;
              reader.readAsDataURL(blob);
            });
            const origHref = this.href;
            this.href = dataUrl;
            if (!this.isConnected) document.body.appendChild(this);
            try { origAnchorClick.call(this); } finally { setTimeout(() => { this.remove(); this.href = origHref; }, 2000); }
            return;
          } catch (e) {
            console.warn("blob→dataURL download fallback failed, trying direct:", e);
          }
        }
        if (!this.isConnected && this.download && this.href) {
          document.body.appendChild(this);
