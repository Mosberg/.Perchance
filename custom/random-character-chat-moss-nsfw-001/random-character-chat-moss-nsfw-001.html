<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Character Chat</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    :root{
      --primary:#6366f1;--primary-dark:#4f46e5;--primary-light:#818cf8;
      --secondary:#10b981;--danger:#ef4444;--warning:#f59e0b;
      --bg-dark:#0b1120;--bg-card:#131c2e;--bg-hover:#1e293b;
      --text-primary:#f1f5f9;--text-secondary:#94a3b8;--border:#1e293b;
      --shadow:rgba(0,0,0,0.4);--gradient:linear-gradient(135deg,#6366f1 0%,#8b5cf6 100%);
    }
    body{
      font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
      background:var(--bg-dark);color:var(--text-primary);
      min-height:100vh;padding:2rem 1rem;line-height:1.6;
    }
    .container{max-width:1000px;margin:0 auto;}

    h1.title{
      text-align:center;font-size:2.5rem;margin-bottom:1.5rem;
      background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
      background-clip:text;font-weight:800;letter-spacing:-0.5px;
    }

    .controls-panel{
      background:var(--bg-card);border-radius:16px;padding:1.5rem;
      margin-bottom:1.5rem;border:1px solid var(--border);
      box-shadow:0 8px 32px var(--shadow);
    }

    .panel-section{
      margin-bottom:1.25rem;padding-bottom:1.25rem;border-bottom:1px solid var(--border);
    }
    .panel-section:last-of-type{border-bottom:none;margin-bottom:0;padding-bottom:0;}

    .section-title{
      font-size:0.75rem;font-weight:700;color:var(--primary-light);
      text-transform:uppercase;letter-spacing:1px;margin-bottom:0.75rem;
    }

    .controls-grid{
      display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem;
    }

    .control-group{display:flex;flex-direction:column;gap:0.4rem;}
    .control-group label{
      font-size:0.8rem;font-weight:600;color:var(--text-secondary);
      text-transform:uppercase;letter-spacing:0.5px;
    }
    .control-group select,
    .control-group input[type="number"],
    .control-group input[type="text"],
    .control-group textarea{
      background:var(--bg-dark);border:1px solid var(--border);border-radius:8px;
      padding:0.65rem 0.75rem;color:var(--text-primary);font-size:0.95rem;
      transition:all 0.2s ease;width:100%;
    }
    .control-group select:focus,
    .control-group input:focus,
    .control-group textarea:focus{
      outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,0.15);
    }
    .control-group textarea{resize:vertical;min-height:60px;font-family:inherit;}

    .checkbox-group{
      display:flex;align-items:center;gap:0.6rem;padding:0.35rem 0;
    }
    .checkbox-group input[type="checkbox"]{width:18px;height:18px;cursor:pointer;accent-color:var(--primary);}
    .checkbox-group label{font-size:0.9rem;cursor:pointer;user-select:none;color:var(--text-secondary);}

    .button-row{display:flex;gap:0.75rem;flex-wrap:wrap;margin-top:1rem;}
    .btn{
      padding:0.75rem 1.5rem;border:none;border-radius:10px;font-size:0.95rem;
      font-weight:600;cursor:pointer;transition:all 0.2s ease;
      display:inline-flex;align-items:center;gap:0.5rem;text-decoration:none;justify-content:center;
    }
    .btn-primary{background:var(--gradient);color:white;box-shadow:0 4px 12px rgba(99,102,241,0.3);}
    .btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(99,102,241,0.4);}
    .btn-secondary{background:var(--bg-hover);color:var(--text-primary);border:1px solid var(--border);}
    .btn-secondary:hover{background:#334155;}
    .btn-danger{background:var(--danger);color:white;}
    .btn-danger:hover{background:#dc2626;}
    .btn-ghost{background:transparent;color:var(--text-secondary);border:1px solid var(--border);}
    .btn-ghost:hover{background:var(--bg-hover);color:var(--text-primary);}
    .btn-sm{padding:0.5rem 1rem;font-size:0.85rem;}
    .btn:active{transform:translateY(0);}
    .btn:disabled{opacity:0.5;cursor:not-allowed;transform:none;}

    .output-section{
      background:var(--bg-card);border-radius:16px;padding:2rem;
      border:1px solid var(--border);box-shadow:0 8px 32px var(--shadow);margin-bottom:1.5rem;
    }
    .output-header{
      display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;
      padding-bottom:1rem;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:0.75rem;
    }
    .output-header h2{font-size:1.35rem;color:var(--text-primary);}
    .chat-output{
      background:var(--bg-dark);border-radius:12px;padding:1.5rem;
      min-height:300px;max-height:600px;overflow-y:auto;border:1px solid var(--border);
      font-size:1rem;line-height:1.7;
    }
    .chat-message{
      margin-bottom:1rem;padding:1rem 1.25rem;border-radius:10px;background:var(--bg-hover);
      animation:fadeIn 0.35s ease;border-left:3px solid transparent;
    }
    .chat-message:nth-child(odd){border-left-color:var(--primary);}
    .chat-message:nth-child(even){border-left-color:var(--secondary);}
    @keyframes fadeIn{
      from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}
    }
    .message-author{font-weight:700;color:var(--primary-light);margin-bottom:0.35rem;font-size:1rem;}
    .message-content{color:var(--text-primary);}
    .message-content em{color:#c4b5fd;font-style:italic;}

    .empty-state{
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:1rem;color:var(--text-secondary);padding:3rem 1rem;text-align:center;
    }
    .empty-state .spinner-large{
      width:48px;height:48px;border:4px solid var(--border);
      border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite;
    }

    .loading{
      display:flex;align-items:center;gap:0.75rem;color:var(--text-secondary);font-size:1rem;
    }
    .spinner{
      width:20px;height:20px;border:3px solid var(--border);
      border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite;flex-shrink:0;
    }
    @keyframes spin{to{transform:rotate(360deg);}}

    .stats-bar{
      display:flex;justify-content:space-around;flex-wrap:wrap;gap:1rem;
      background:var(--bg-card);border-radius:12px;padding:1rem;
      margin-top:1rem;border:1px solid var(--border);
    }
    .stat-item{text-align:center;}
    .stat-value{font-size:1.4rem;font-weight:700;color:var(--primary-light);}
    .stat-label{font-size:0.75rem;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px;}

    .character-tags{display:flex;flex-wrap:wrap;gap:0.5rem;}
    .tag{
      background:rgba(99,102,241,0.15);color:var(--primary-light);
      padding:0.3rem 0.75rem;border-radius:20px;font-size:0.8rem;font-weight:600;
      border:1px solid rgba(99,102,241,0.25);
    }
    .tag.tone{background:rgba(245,158,11,0.15);color:var(--warning);border-color:rgba(245,158,11,0.25);}
    .tag.preset{background:rgba(16,185,129,0.15);color:var(--secondary);border-color:rgba(16,185,129,0.25);}

    .settings-toggle{
      background:none;border:none;color:var(--primary-light);cursor:pointer;font-size:0.95rem;
      font-weight:600;display:flex;align-items:center;gap:0.5rem;padding:0.5rem 0;margin-top:0.5rem;
    }
    .settings-toggle:hover{color:var(--primary);}
    .advanced-settings{display:none;margin-top:1rem;padding-top:1rem;border-top:1px solid var(--border);}
    .advanced-settings.show{display:block;animation:slideDown 0.3s ease;}
    @keyframes slideDown{from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:translateY(0);}}

    .settings-summary{
      background:rgba(99,102,241,0.06);border:1px dashed rgba(99,102,241,0.2);
      border-radius:10px;padding:1rem;margin-top:1rem;
    }
    .settings-summary .section-title{margin-bottom:0.5rem;}
    .summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:0.35rem 1rem;}
    .summary-item{font-size:0.85rem;color:var(--text-secondary);}
    .summary-item strong{color:var(--text-primary);font-weight:600;}

    .info-box{
      background:rgba(99,102,241,0.08);border-left:3px solid var(--primary);
      padding:0.75rem 1rem;margin:1rem 0;border-radius:0 8px 8px 0;
      font-size:0.85rem;color:var(--text-secondary);
    }

    .error-box{
      background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);
      border-radius:10px;padding:1.25rem;color:var(--danger);
    }

    .sub-controls{display:flex;gap:0.5rem;flex-wrap:wrap;align-items:flex-end;}
    .swap-btn{font-size:1.1rem;padding:0.65rem 0.75rem;}
    .preset-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:0.5rem;}
    .preset-chip{
      padding:0.5rem;border-radius:8px;font-size:0.85rem;font-weight:600;
      cursor:pointer;text-align:center;border:1px solid var(--border);background:var(--bg-dark);
      color:var(--text-secondary);transition:all 0.15s;
    }
    .preset-chip:hover{border-color:var(--primary);color:var(--primary-light);}
    .preset-chip.active{background:rgba(99,102,241,0.15);border-color:var(--primary);color:var(--primary-light);}

    .scene-divider{
      display:flex;align-items:center;gap:1rem;margin:1.5rem 0;color:var(--text-secondary);
      font-size:0.8rem;text-transform:uppercase;letter-spacing:1px;font-weight:600;
    }
    .scene-divider::before,.scene-divider::after{content:'';flex:1;height:1px;background:var(--border);}

    .toast{
      position:fixed;bottom:1.5rem;right:1.5rem;background:var(--bg-card);color:var(--text-primary);
      padding:0.75rem 1.25rem;border-radius:10px;border:1px solid var(--border);
      box-shadow:0 8px 24px var(--shadow);font-weight:600;z-index:100;
      animation:slideUp 0.3s ease;
    }
    @keyframes slideUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}

    /* scrollbar */
    .chat-output::-webkit-scrollbar{width:8px;}
    .chat-output::-webkit-scrollbar-track{background:var(--bg-dark);border-radius:4px;}
    .chat-output::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}

    @media(max-width:768px){
      body{padding:1rem 0.5rem;}
      h1.title{font-size:1.9rem;}
      .controls-grid{grid-template-columns:1fr;}
      .button-row{flex-direction:column;}
      .btn{width:100%;}
      .output-section{padding:1.25rem;}
      .output-header{flex-direction:column;align-items:flex-start;}
      .stats-bar{flex-direction:column;align-items:center;}
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="title">Random Character Chat</h1>

    <div class="controls-panel">
      <!-- Character Selection -->
      <div class="panel-section">
        <div class="section-title">Characters</div>
        <div class="controls-grid">
          <div class="control-group">
            <label for="char1Select">Character 1</label>
            <select id="char1Select"></select>
          </div>
          <div class="control-group" style="justify-content:flex-end;">
            <button class="btn btn-ghost btn-sm swap-btn" id="swapCharsBtn" title="Swap Characters">⇄</button>
          </div>
          <div class="control-group">
            <label for="char2Select">Character 2</label>
            <select id="char2Select"></select>
          </div>
        </div>
        <div class="sub-controls" style="margin-top:0.5rem;">
          <button class="btn btn-ghost btn-sm" id="randomCharsBtn">🎲 Randomize Characters</button>
          <button class="btn btn-ghost btn-sm" id="randomChar1Btn">Random Char 1</button>
          <button class="btn btn-ghost btn-sm" id="randomChar2Btn">Random Char 2</button>
        </div>
      </div>

      <!-- Presets & Tone & Length -->
      <div class="panel-section">
        <div class="section-title">Preset & Tone</div>

        <div class="controls-grid" style="margin-top:1rem;">
          <div class="control-group">
            <label for="toneSelect">Tone / Style</label>
            <select id="toneSelect"></select>
          </div>
          <div class="control-group">
            <label for="genreSelect">Genre</label>
            <select id="genreSelect"></select>
          </div>
          <div class="control-group">
            <label for="lengthSelect">Length</label>
            <select id="lengthSelect"></select>
          </div>
          <div class="control-group">
            <label for="messageCountInput">Approx. Messages</label>
            <input type="number" id="messageCountInput" min="2" max="30" value="8">
          </div>
          <div class="control-group">
            <label for="arousalSelect">Arousal / Intensity</label>
            <select id="arousalSelect"></select>
          </div>
        </div>
      </div>

      <!-- Extra Flavor -->
      <div class="panel-section">
        <div class="section-title">Extra Flavor</div>
        <div class="controls-grid">
          <div class="control-group">
            <label for="settingSelect">Setting (optional)</label>
            <select id="settingSelect">
              <option value="">None</option>
              <option value="public">Public / Risky</option>
              <option value="bedroom">Bedroom</option>
              <option value="dungeon">Dungeon</option>
              <option value="office">Office</option>
              <option value="shower">Shower</option>
              <option value="car">Car</option>
              <option value="kitchen">Kitchen</option>
            </select>
          </div>
          <div class="control-group">
            <label for="relationshipInput">Dynamic / Relationship (optional)</label>
            <input type="text" id="relationshipInput" placeholder="e.g. rivals, old friends, strangers...">
          </div>
        </div>
        <div class="checkbox-group" style="margin-top:0.5rem;">
          <input type="checkbox" id="emojiToggle" checked>
          <label for="emojiToggle">Allow characters to use emojis in chat 💬</label>
        </div>
      </div>

      <!-- Output Options -->
      <div class="panel-section">
        <div class="section-title">Output Options</div>
        <div class="controls-grid">
          <div class="control-group">
            <label for="customPrompt">Custom Prompt (overrides everything)</label>
            <textarea id="customPrompt" placeholder="Enter your own custom prompt here... Leave empty to use settings above."></textarea>
          </div>
        </div>
        <div class="checkbox-group">
          <input type="checkbox" id="includeActions" checked>
          <label for="includeActions">Include asterisk actions (*action*)</label>
        </div>
        <div class="checkbox-group">
          <input type="checkbox" id="keepOpen">
          <label for="keepOpen">Keep open-ended (don't wrap up the story)</label>
        </div>
        <div class="checkbox-group">
          <input type="checkbox" id="showStats">
          <label for="showStats">Show statistics bar</label>
        </div>
        <div class="checkbox-group">
          <input type="checkbox" id="storyMode">
          <label for="storyMode">Story Mode — generate 3 connected scenes 📖</label>
        </div>
      </div>

      <!-- Advanced Settings -->
      <button class="settings-toggle" id="toggleAdvancedBtn">▼ Advanced Settings</button>
      <div class="advanced-settings" id="advancedSettings">
        <div class="controls-grid">
          <div class="control-group">
            <label for="temperatureInput">Creativity (Temperature)</label>
            <input type="number" id="temperatureInput" min="0" max="2" step="0.1" value="0.85">
          </div>
          <div class="control-group">
            <label for="maxTokensInput">Max Tokens</label>
            <input type="number" id="maxTokensInput" min="200" max="8000" step="100" value="1200">
          </div>
          <div class="control-group">
            <label for="topPInput">Top P</label>
            <input type="number" id="topPInput" min="0" max="1" step="0.05" value="0.9">
          </div>
        </div>
        <div class="info-box">
          <strong>Tip:</strong> Higher temperature = more creative / random. Lower = more focused.
        </div>
      </div>

      <!-- Live Settings Summary -->
      <div class="settings-summary" id="settingsSummaryCtn">
        <div class="section-title">Current Settings Summary</div>
        <div class="summary-grid" id="summaryGrid"></div>
      </div>

      <!-- Main Actions -->
      <div class="button-row" style="margin-top:1.5rem;">
        <button class="btn btn-primary" id="generateBtn">🎲 Generate Chat</button>
        <button class="btn btn-secondary" id="newChatBtn">🔄 New Random Chat</button>
        <button class="btn btn-secondary" id="copyBtn">📋 Copy Output</button>
        <button class="btn btn-ghost" id="saveSettingsBtn">💾 Save</button>
        <button class="btn btn-ghost" id="loadSettingsBtn">📂 Load</button>
        <button class="btn btn-danger" id="clearBtn">🗑️ Clear</button>
      </div>
    </div>

    <div class="output-section">
      <div class="output-header">

        <div class="empty-state">
          <div class="spinner-large"></div>
          <span>Click <strong>“Generate Chat”</strong> to create a dialogue!</span>
        </div>

    </div>

    <div class="stats-bar" id="statsBarCtn" hidden>
      <div class="stat-item"><div class="stat-value" id="msgCountEl">0</div><div class="stat-label">Messages</div></div>
      <div class="stat-item"><div class="stat-value" id="wordCountEl">0</div><div class="stat-label">Words</div></div>
      <div class="stat-item"><div class="stat-value" id="charCountEl">0</div><div class="stat-label">Characters</div></div>
      <div class="stat-item"><div class="stat-value" id="genTimeEl">0s</div><div class="stat-label">Gen Time</div></div>
    </div>
  </div>

      dominant:"Write a roleplay where one partner firmly grips the other's throat while whispering filthy commands",
      sadistic:"Write a roleplay involving sharp nails dragging down bare skin until breath hitches with pain",
      sensual:"Write a roleplay where lips explore every inch of skin with agonizing slowness before finally giving relief",
      rough:"Write a roleplay where hips slam together desperately, fingers bruising flesh in their desperation",
      voyeuristic:"Write a roleplay where someone watches their partner touch themselves while maintaining eye contact",
      intimate:"Write a roleplay where bodies move together slowly, whispering sweet nothings between kisses",
      degrading:"Write a roleplay where one partner forces the other to beg prettily before granting any pleasure"
    };

    /* ================= Helpers ================= */
    function pickRandom(arr){return arr[Math.floor(Math.random()*arr.length)];}
    function pickWeightedRandom(arr,weights){
      // simple weighted random; if weights missing, uniform
      if(!weights||weights.length!==arr.length){
        return pickRandom(arr);
      }
      let total = weights.reduce((a,b)=>a+b,0);
      let r = Math.random()*total;
      for(let i=0;i<arr.length;i++){
        r -= weights[i];
        if(r<=0)return arr[i];
      }
      return arr[arr.length-1];
    }

    /* ================= DOM Refs ================= */
    const char1Select = document.getElementById('char1Select');
    const char2Select = document.getElementById('char2Select');
    const messageCountInput = document.getElementById('messageCountInput');
    const toneSelect = document.getElementById('toneSelect');
    const genreSelect = document.getElementById('genreSelect');
    const lengthSelect = document.getElementById('lengthSelect');
    const customPromptInput = document.getElementById('customPrompt');
    const includeActionsCheckbox = document.getElementById('includeActions');
    const keepOpenCheckbox = document.getElementById('keepOpen');
    const showStatsCheckbox = document.getElementById('showStats');
    const emojiToggle = document.getElementById('emojiToggle');
    const storyModeCheckbox = document.getElementById('storyMode');
    const settingSelect = document.getElementById('settingSelect');
    const arousalSelect = document.getElementById('arousalSelect');
    const relationshipInput = document.getElementById('relationshipInput');
    const toggleAdvancedBtn = document.getElementById('toggleAdvancedBtn');
    const advancedSettings = document.getElementById('advancedSettings');
    const temperatureInput = document.getElementById('temperatureInput');
    const maxTokensInput = document.getElementById('maxTokensInput');
    const topPInput = document.getElementById('topPInput');
    const generateBtn = document.getElementById('generateBtn');
    const newChatBtn = document.getElementById('newChatBtn');
    const copyBtn = document.getElementById('copyBtn');
    const clearBtn = document.getElementById('clearBtn');
    const saveSettingsBtn = document.getElementById('saveSettingsBtn');
    const loadSettingsBtn = document.getElementById('loadSettingsBtn');
    const outputCtn = document.getElementById('outputCtn');
    const charTagsCtn = document.getElementById('charTagsCtn');
    const statsBarCtn = document.getElementById('statsBarCtn');
    const msgCountEl = document.getElementById('msgCountEl');
    const wordCountEl = document.getElementById('wordCountEl');
    const charCountEl = document.getElementById('charCountEl');
    const genTimeEl = document.getElementById('genTimeEl');
    const summaryGrid = document.getElementById('summaryGrid');
    const presetGrid = document.getElementById('presetGrid');
    const swapCharsBtn = document.getElementById('swapCharsBtn');
    const randomCharsBtn = document.getElementById('randomCharsBtn');
    const randomChar1Btn = document.getElementById('randomChar1Btn');
    const randomChar2Btn = document.getElementById('randomChar2Btn');

    /* ================= Init Dropdowns ================= */
    function populateSelect(sel,opts){sel.innerHTML='';opts.forEach(o=>{let op=document.createElement('option');op.value=o.value;op.textContent=o.label;sel.appendChild(op);});}

    function initControls(){
      // Character selects
      [char1Select,char2Select].forEach(sel=>{
        sel.innerHTML='';
        characters.forEach(c=>{let o=document.createElement('option');o.value=c;o.textContent=c;sel.appendChild(o);});
      });
      populateSelect(toneSelect,toneOptions);
      populateSelect(genreSelect,genreOptions);
      populateSelect(lengthSelect,lengthOptions);
      populateSelect(arousalSelect,arousalOptions);
      // Presets
      presetGrid.innerHTML='';
      presets.forEach(p=>{
        let chip=document.createElement('div');
        chip.className='preset-chip'+(p.key==='none'?' active':'');
        chip.textContent=p.label;
        chip.dataset.preset=p.key;
        chip.onclick=()=>applyPreset(p.key);
        presetGrid.appendChild(chip);
      });
      randomizeCharacters();
      syncLengthFromCount();
      updateSummary();
    }

    /* ================= Character Logic ================= */
    function randomizeCharacters(onlyOne){
      if(onlyOne===1){
        let c=pickRandom(characters);char1Select.value=c;
      }else if(onlyOne===2){
        let c=pickRandom(characters);char2Select.value=c;
      }else{
        let c1=pickRandom(characters),c2=pickRandom(characters);
        while(c2===c1)c2=pickRandom(characters);
        char1Select.value=c1;char2Select.value=c2;
      }
      ensureDifferentChars();
    }

    function ensureDifferentChars(){
      if(char1Select.value===char2Select.value){
        let alt=pickRandom(characters);while(alt===char1Select.value)alt=pickRandom(characters);
        char2Select.value=alt;
      }
    }

    function swapCharacters(){
      let tmp=char1Select.value;char1Select.value=char2Select.value;char2Select.value=tmp;
    }

    /* ================= Presets ================= */
    let activePreset='none';
    function applyPreset(key){
      activePreset=key;
      document.querySelectorAll('.preset-chip').forEach(c=>c.classList.toggle('active',c.dataset.preset===key));
      if(key==='none')return;
      // legacy presets
      const map={
        chaotic:{tone:'silly',genre:'fantasy'},
        wholesome:{tone:'casual',genre:'slice-of-life'},
        dark:{tone:'mysterious',genre:'horror'},
        meme:{tone:'silly',genre:''},
        tense:{tone:'serious',genre:'noir'},
        flirty:{tone:'romantic',genre:''}
      };
      // nsfw presets
      const nsfwMap={
        spontaneous:{arousal:'rough',setting:'public'},
        romantic:{arousal:'intimate',setting:'bedroom'},
        bdsm:{arousal:'dominant',setting:'dungeon'},
        quickie:{arousal:'teasing',setting:''},
        punishment:{arousal:'sadistic',setting:'office'},
        temptation:{arousal:'voyeuristic',setting:''}
      };
      let cfg=map[key];
      if(cfg){
        if(cfg.tone)toneSelect.value=cfg.tone;
        if(cfg.genre!==undefined)genreSelect.value=cfg.genre;
      }else{
        cfg=nsfwMap[key];
        if(cfg){
          if(cfg.arousal)arousalSelect.value=cfg.arousal;
          if(cfg.setting!==undefined)settingSelect.value=cfg.setting;
        }
      }
      updateSummary();
    }

    /* ================= Length Sync ================= */
    function syncLengthFromCount(){
      let v=parseInt(messageCountInput.value)||8;
      if(v<=5)lengthSelect.value='short';
      else if(v<=12)lengthSelect.value='medium';
      else lengthSelect.value='long';
    }
    function syncCountFromLength(){
      let map={short:4,medium:8,long:16};messageCountInput.value=map[lengthSelect.value]||8;
    }

    /* ================= Prompt Builder (Perchance style) ================= */
    function buildConfig(){
      return {
        char1:char1Select.value,
        char2:char2Select.value,
        messageCount:parseInt(messageCountInput.value)||8,
        tone:toneSelect.value,
        genre:genreSelect.value,
        length:lengthSelect.value,
        customPrompt:customPromptInput.value.trim(),
        includeActions:includeActionsCheckbox.checked,
        keepOpen:keepOpenCheckbox.checked,
        emoji:emojiToggle.checked,
        storyMode:storyModeCheckbox.checked,
        setting:settingSelect.value,
        arousal:arousalSelect.value,
        relationship:relationshipInput.value.trim(),
        temperature:parseFloat(temperatureInput.value)||0.85,
        maxTokens:parseInt(maxTokensInput.value)||1200,
        topP:parseFloat(topPInput.value)||0.9,
      };
    }

    function buildPromptText(cfg){
      if(cfg.customPrompt)return cfg.customPrompt;

      let base = toneInstructions[cfg.tone]||toneInstructions.casual;
      base += ` between **${cfg.char1}** and **${cfg.char2}**.`;
      if(cfg.genre) base += ` Genre: ${cfg.genre}.`;
      if(cfg.setting) base += ` Setting: ${cfg.setting}.`;
      if(cfg.relationship) base += ` Relationship dynamic: ${cfg.relationship}.`;
      if(cfg.arousal && arousalInstructions[cfg.arousal]) base += ` ${arousalInstructions[cfg.arousal]}`;
      base += ` Produce about ${cfg.messageCount} messages total.`;
      if(cfg.includeActions) base += ` Use asterisks around actions in typical text roleplay style (e.g., *laughs*, *draws weapon*).`;
      if(cfg.keepOpen) base += ` This is only a segment of the chat; do not wrap up the conversation.`;
      if(cfg.emoji) base += ` Characters may naturally use emojis in their messages.`;
      return base;
    }

    function startWithChar(cfg){return `**${cfg.char1}**: `;}

    function updateSummary(){
      let cfg=buildConfig();
      let html='';
      let add=(l,v)=>html+=`<div class="summary-item"><strong>${l}:</strong> ${v||'—'}</div>`;
      add('Character 1',cfg.char1);
      add('Character 2',cfg.char2);
      add('Tone',toneOptions.find(t=>t.value===cfg.tone)?.label);
      if(cfg.arousal) add('Arousal',arousalOptions.find(a=>a.value===cfg.arousal)?.label);
      add('Genre',genreOptions.find(g=>g.value===cfg.genre)?.label||'None');
      add('Length',lengthOptions.find(l=>l.value===cfg.length)?.label);
      add('Messages',cfg.messageCount);
      if(cfg.setting) add('Setting',cfg.setting);
      if(cfg.relationship) add('Dynamic',cfg.relationship);
      if(cfg.customPrompt) add('Prompt','Custom');
      summaryGrid.innerHTML=html;
    }

    /* ================= Statistics ================= */
    function updateStats(text,genTimeSec){
      let words=text.trim().split(/\s+/).filter(x=>x.length>0).length;
      let chars=text.length;
      let msgs=(text.match(/\*\*[^{}]+\*\*:/g)||[]).length; // rough count by bold author prefix
      msgCountEl.textContent=msgs;
      wordCountEl.textContent=words;
      charCountEl.textContent=chars;
      genTimeEl.textContent=(genTimeSec||0).toFixed(1)+'s';
      statsBarCtn.hidden = !showStatsCheckbox.checked;
    }

    /* ================= Display ================= */
    function escapeHtml(str){
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function renderMessagesFragment(text){
      let lines=text.split('\n').filter(l=>l.trim());
      let messages=[];
      let currentAuthor=null,currentContent=[];
      lines.forEach(line=>{
        let m=line.match(/^\*\*([^{}*]+?)\*\*:\s*(.*)$/);
        if(!m) m=line.match(/^([A-Z][a-zA-Z0-9\s'—-]{1,30}):\s*(.*)$/);
        if(m){
          if(currentAuthor) messages.push({author:currentAuthor,content:currentContent.join(' ').trim()});
          currentAuthor=m[1].trim();
          currentContent=[m[2]];
        }else if(currentAuthor){
          currentContent.push(line.trim());
        }
      });
      if(currentAuthor) messages.push({author:currentAuthor,content:currentContent.join(' ').trim()});
      if(messages.length===0) return null;
      let frag=document.createDocumentFragment();
      messages.forEach(msg=>{
        let content=escapeHtml(msg.content).replace(/\*(.*?)\*/g,'<em>*$1*</em>'); // italic actions
        let el=document.createElement('div');
        el.className='chat-message';
        el.innerHTML=`<div class="message-author">${escapeHtml(msg.author)}</div><div class="message-content">${content}</div>`;
        frag.appendChild(el);
      });
      return frag;
    }

    function displayChat(rawText,char1,char2){
      let frag=renderMessagesFragment(rawText);
      outputCtn.innerHTML='';
      if(!frag){
        outputCtn.innerHTML=`<div class="chat-message"><div class="message-content">No parseable messages found. Raw response rendered below.</div></div><div class="chat-message"><div class="message-content" style="white-space:pre-wrap;color:#cbd5e1;">${escapeHtml(rawText)}</div></div>`;
      }else{
        outputCtn.appendChild(frag);
      }

      // Tags
      let msgCount = frag ? frag.childNodes.length : 0;
      charTagsCtn.innerHTML=`
        <span class="tag">${escapeHtml(char1)}</span>
        <span class="tag">${escapeHtml(char2)}</span>
        <span class="tag tone">${escapeHtml(toneOptions.find(t=>t.value===toneSelect.value)?.label||toneSelect.value)}</span>
        ${activePreset!=='none'?`<span class="tag preset">${escapeHtml(presets.find(p=>p.key===activePreset)?.label||activePreset)}</span>`:''}
        <span class="tag">${msgCount} msgs</span>`;
    }

    /* ================= Core Generation (Perchance style) ================= */
    async function generateChat(){
      let startTime=Date.now();
      let cfg=buildConfig();
      let promptText=buildPromptText(cfg);
      let start=startWithChar(cfg);

      generateBtn.disabled=true;
      generateBtn.innerHTML='<div class="spinner" style="width:16px;height:16px;border-width:2px;"></div> Generating...';
      outputCtn.innerHTML='<div class="loading"><div class="spinner"></div><span>Cooking up a conversation...</span></div>';
      charTagsCtn.innerHTML='';
      updateSummary();

      try{
        if(cfg.storyMode){
          // 3 connected scenes with live output per scene
          let sceneCount=3;
          outputCtn.innerHTML='';
          let runningSummary='';
          let allText='';

          for(let s=1;s<=sceneCount;s++){
            let scenePrompt=promptText+` This is Scene ${s} of ${sceneCount} in a connected story.`;
            if(runningSummary) scenePrompt+=` Story so far: ${runningSummary}`;
            if(s<sceneCount) scenePrompt+=` End this scene with a small cliffhanger or transition.`;
            else scenePrompt+=` This is the final scene; you may wrap up here.`;

            // scene divider
            let divider=document.createElement('div');
            divider.className='scene-divider';
            divider.textContent=`Scene ${s} / ${sceneCount}`;
            outputCtn.appendChild(divider);

            let liveEl=document.createElement('div');
            liveEl.style.cssText='white-space:pre-wrap;color:var(--text-primary);font-size:1rem;line-height:1.7;';
            outputCtn.appendChild(liveEl);

            let text=await generateText({
              instruction: scenePrompt,
              startWith: start,
              maxTokens: cfg.maxTokens,
              temperature: cfg.temperature,
              topP: cfg.topP,
              onChunk: (data)=>{
                liveEl.textContent+=data.textChunk;
                outputCtn.scrollTop=outputCtn.scrollHeight;
              }
            });

            // replace live text with formatted messages
            let frag=renderMessagesFragment(text);
            if(frag){
              outputCtn.insertBefore(frag,liveEl);
              outputCtn.removeChild(liveEl);
            }
            // if parsing fails, leave raw text in liveEl

            allText+='\n'+text;
            runningSummary=text.replace(/\n/g,' ').slice(0,300);
          }
          updateStats(allText,(Date.now()-startTime)/1000);

        } else {
          let liveEl=document.createElement('div');
          liveEl.style.cssText='white-space:pre-wrap;color:var(--text-primary);font-size:1rem;line-height:1.7;padding:1rem;';
          outputCtn.innerHTML='';
          outputCtn.appendChild(liveEl);

          let text=await generateText({
            instruction: promptText,
            startWith: start,
            maxTokens: cfg.maxTokens,
            temperature: cfg.temperature,
            topP: cfg.topP,
            onChunk: (data)=>{
              liveEl.textContent+=data.textChunk;
              outputCtn.scrollTop=outputCtn.scrollHeight;
            }
          });

          displayChat(text,cfg.char1,cfg.char2);
          updateStats(text,(Date.now()-startTime)/1000);
        }

      }catch(err){
        outputCtn.innerHTML=`<div class="error-box"><strong>❌ Error generating chat</strong><br>${escapeHtml(err.message||String(err))}<br><br><em>Try adjusting max tokens or check your connection.</em></div>`;
      }finally{
        generateBtn.disabled=false;
        generateBtn.innerHTML='🎲 Generate Chat';
      }
    }

    /* ================= Buttons ================= */
    function newRandomChat(){
      randomizeCharacters();
      // random tone
      toneSelect.value=pickRandom(toneOptions).value;
      // random length
      let lenObj=pickRandom(lengthOptions);
      lengthSelect.value=lenObj.value;
      syncCountFromLength();
      // clear custom prompt
      customPromptInput.value='';
      generateChat();
    }

    async function copyOutput(){
      try{
        let text=outputCtn.innerText;
        await navigator.clipboard.writeText(text);
        showToast('✅ Copied to clipboard!');
      }catch(e){
        showToast('❌ Copy failed');
      }
    }

    function clearOutput(){
      outputCtn.innerHTML=`<div class="empty-state"><div class="spinner-large"></div><span>Click <strong>“Generate Chat”</strong> to create a dialogue!</span></div>`;
      charTagsCtn.innerHTML='';
      msgCountEl.textContent='0';wordCountEl.textContent='0';charCountEl.textContent='0';genTimeEl.textContent='0s';
    }

    function toggleAdvanced(){
      advancedSettings.classList.toggle('show');
      let is=advancedSettings.classList.contains('show');
      toggleAdvancedBtn.innerHTML=is?'▲ Advanced Settings':'▼ Advanced Settings';
    }

    function showToast(msg){
      let t=document.createElement('div');
      t.className='toast';t.textContent=msg;
      document.body.appendChild(t);
      setTimeout(()=>t.remove(),2200);
    }

    /* ================= Save / Load ================= */
    function getSettingsJson(){
      let cfg=buildConfig();
      cfg.preset=activePreset;
      return JSON.stringify(cfg,null,2);
    }

    function saveSettings(){
      localStorage.randomChatSettingsV1=getSettingsJson();
      showToast('💾 Settings saved');
    }

    function loadSettings(){
      try{
        let raw=localStorage.randomChatSettingsV1;
        if(!raw){showToast('No saved settings found');return;}
        let s=JSON.parse(raw);
        if(s.char1)char1Select.value=s.char1;if(s.char2)char2Select.value=s.char2;
        if(s.messageCount)messageCountInput.value=s.messageCount;
        if(s.tone)toneSelect.value=s.tone;
        if(s.genre!==undefined)genreSelect.value=s.genre;
        if(s.length)lengthSelect.value=s.length;
        if(s.customPrompt!==undefined)customPromptInput.value=s.customPrompt;
        if(s.includeActions!==undefined)includeActionsCheckbox.checked=s.includeActions;
        if(s.keepOpen!==undefined)keepOpenCheckbox.checked=s.keepOpen;
        if(s.showStats!==undefined)showStatsCheckbox.checked=s.showStats;
        if(s.emoji!==undefined)emojiToggle.checked=s.emoji;
        if(s.storyMode!==undefined)storyModeCheckbox.checked=s.storyMode;
        if(s.setting!==undefined)settingSelect.value=s.setting;
        if(s.arousal!==undefined)arousalSelect.value=s.arousal;
        if(s.relationship!==undefined)relationshipInput.value=s.relationship;
        if(s.temperature!==undefined)temperatureInput.value=s.temperature;
        if(s.maxTokens!==undefined)maxTokensInput.value=s.maxTokens;
        if(s.topP!==undefined)topPInput.value=s.topP;
        if(s.preset){activePreset=s.preset;applyPreset(activePreset);}
        ensureDifferentChars();
        syncLengthFromCount();
        updateSummary();
        showToast('📂 Settings loaded');
      }catch(e){showToast('Load failed: '+e.message);}
    }

    /* ================= Events ================= */
    generateBtn.addEventListener('click',generateChat);
    newChatBtn.addEventListener('click',newRandomChat);
    copyBtn.addEventListener('click',copyOutput);
    clearBtn.addEventListener('click',clearOutput);
    toggleAdvancedBtn.addEventListener('click',toggleAdvanced);
    saveSettingsBtn.addEventListener('click',saveSettings);
    loadSettingsBtn.addEventListener('click',loadSettings);

    swapCharsBtn.addEventListener('click',swapCharacters);
    randomCharsBtn.addEventListener('click',()=>randomizeCharacters());
    randomChar1Btn.addEventListener('click',()=>randomizeCharacters(1));
    randomChar2Btn.addEventListener('click',()=>randomizeCharacters(2));

    [char1Select,char2Select,toneSelect,genreSelect,lengthSelect,includeActionsCheckbox,keepOpenCheckbox,emojiToggle,storyModeCheckbox,settingSelect,arousalSelect,relationshipInput].forEach(el=>{
      el.addEventListener('change',updateSummary);
    });
    messageCountInput.addEventListener('input',()=>{syncLengthFromCount();updateSummary();});
    customPromptInput.addEventListener('input',updateSummary);
    showStatsCheckbox.addEventListener('change',()=>{statsBarCtn.hidden=!showStatsCheckbox.checked;});

    lengthSelect.addEventListener('change',()=>{syncCountFromLength();updateSummary();});

    /* ================= Bootstrap ================= */
    initControls();
  </script>
