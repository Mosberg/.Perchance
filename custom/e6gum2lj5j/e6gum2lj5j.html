<script>
(function(){
  const KEY = "privateGalleryPassword";
  function patchGallery(){
    if(!window.t2i_privateGallery || window.t2i_privateGallery.__pwPatched) return false;
    const origShow = window.t2i_privateGallery.show.bind(window.t2i_privateGallery);
    window.t2i_privateGallery.show = function(){
      const pw = localStorage.getItem(KEY);
      if(!pw) return origShow();
      const input = prompt("🔒 Enter password to open the private gallery:");
      if(input === null) return;
      if(input !== pw){ alert("❌ Wrong password!"); return; }
      return origShow();
    };
    window.t2i_privateGallery.__pwPatched = true;
    window.setGalleryPassword = function(){
      const cur = localStorage.getItem(KEY);
      const input = prompt(cur ? "Enter new password (or leave empty to remove):" : "Set a password for your private gallery:", cur || "");
      if(input === null) return;
      if(input === ""){ localStorage.removeItem(KEY); alert("Password removed."); }
      else { localStorage.setItem(KEY, input); alert("Password set for this device only."); }
    };
    return true;
  }
  if(!patchGallery()){
    const iv = setInterval(()=>{ if(patchGallery()) clearInterval(iv); }, 200);
    setTimeout(()=>clearInterval(iv), 30000);
  }
})();
</script>

<script>
(function(){
  var SNIPPETS = [
    {label:"Prompt (descrição)", code:"[input.description]"},
    {label:"Negative", code:"[input.negative]"},
    {sep:true, label:"Composição"},
    {label:"Art Style Prompt", code:"[input.artStyle.prompt]"},
    {label:"Art Style Negative", code:"[input.artStyle.negative]"},
    {label:"Shape", code:"[input.shape]"},
    {label:"Num Images", code:"[input.numImages]"},
    {sep:true, label:"Exemplos"},
    {label:"prompt + descrição", code:"[input.description], [input.artStyle.prompt]"},
    {label:"negative completo", code:"[input.negative], ugly, deformed, low quality"},
    {label:"dropdown novo estilo", code:"nomeDoEstilo\n  prompt = [input.description], ...\n  negative = [input.negative], ..."},
    {sep:true, label:"Úteis"},
    {label:"commentPlaceholderText", code:"commentPlaceholderText = ..."},
    {label:"saveTitle", code:"saveTitle = ([input.artStyle.getName]) [input.description]"},
    {label:"visible() gate", code:"visible() =>\n  return Number(localStorage.generateClickCount) > 0;"}
  ];
  var body = document.getElementById("snippetBody");
  if(!body) return;
  SNIPPETS.forEach(function(s){
    if(s.sep){
      var d = document.createElement("div");
      d.className = "sp-sep";
      d.textContent = s.label;
      body.appendChild(d);
      return;
    }
    var chip = document.createElement("button");
    chip.className = "sp-chip";
    chip.innerHTML = '<span class="sp-label">'+s.label+'</span>'+s.code.replace(/</g,'&lt;');
    chip.title = "Clique para copiar: "+s.code;
    chip.onclick = function(){
      try{
        navigator.clipboard.writeText(s.code).then(function(){
          chip.classList.add("copied");
          var orig = chip.innerHTML;
          chip.innerHTML = '<span class="sp-label">✓ copiado!</span>'+s.code.replace(/</g,'&lt;');
          setTimeout(function(){ chip.classList.remove("copied"); chip.innerHTML = orig; }, 1200);
        }).catch(function(){
          var ta = document.createElement("textarea");
          ta.value = s.code; document.body.appendChild(ta); ta.select();
          try{ document.execCommand("copy"); chip.classList.add("copied");
            var o2 = chip.innerHTML;
            chip.innerHTML = '<span class="sp-label">✓ copiado!</span>'+s.code.replace(/</g,'&lt;');
            setTimeout(function(){ chip.classList.remove("copied"); chip.innerHTML = o2; }, 1200);
          }catch(e){ window.alert(s.code); }
          document.body.removeChild(ta);
        });
      }catch(e){ window.alert(s.code); }
    };
    body.appendChild(chip);
  });
  var head = document.getElementById("snippetToggle");
  if(head) head.onclick = function(){
    var p = document.getElementById("snippetPanel");
    if(p) p.classList.toggle("collapsed");
  };
})();
</script>

  async function loadChars(){
    var kv=getKV();
    if(!kv){return;}
    try{
      var entries=await kv.characters.entries();
      state.characters={};
      entries.forEach(function(e){state.characters[e[0]]=e[1];});
    }catch(e){}
  }
  async function saveChar(char){
    var kv=getKV();
    if(!kv){state.characters[char.id]=char;return;}
    try{await kv.characters.set(char.id,char);}catch(e){}
    state.characters[char.id]=char;
  }
  async function deleteChar(id){
    var kv=getKV();
    if(kv){try{await kv.characters.delete(id);}catch(e){}}
    delete state.characters[id];
    if(state.currentId===id){state.currentId=null;state.view="list";}
  }
  function blankChar(desc){
    return {
      id:uid(),name:(desc||"Novo personagem").slice(0,50),avatar:"",
      description:desc||"",appearance:"",age:"",gender:"",occupation:"",
      personality:"",backstory:"",voice:"",likes:"",dislikes:"",quirks:"",
      skills:"",goals:"",secrets:"",relationships:"",custom:[],messages:[],created:Date.now()
    };
  }

  // Local response engine — instant replies based on character traits + message context.
  function localReply(c, userText){
    var name=c.name||"eu";
    var text=userText.toLowerCase().trim();
    var personality=(c.personality||"").toLowerCase();
    var quirks=c.quirks||"";
    var voice=c.voice||"";
    var goals=c.goals||"";
    var skills=c.skills||"";
    var backstory=c.backstory||"";
    var secrets=c.secrets||"";
    var occupation=c.occupation||"";
    var age=c.age||"";
    var relationships=c.relationships||"";
    var appearance=c.appearance||"";
    var gender=c.gender||"";
    var likes=c.likes||"";
    var dislikes=c.dislikes||"";
    var customMap={};
    if(c.custom&&c.custom.length)c.custom.forEach(function(f){if(f.label&&f.value)customMap[f.label.toLowerCase()]=f.value;});

    function tag(){return quirks?" *"+quirks+"* ":" ";}

    // --- Greetings ---
    if(/\b(oi|olá|ola|hey|hello|hi|eai|e ai|opa|bom dia|boa tarde|boa noite|salve|fala)\b/.test(text)){
      var gs=["Oi!","Olá!","E aí!","Opa!","Salve!","Hey!"];
      var ge=[
        "Que bom te ver por aqui. Como você está se sentindo hoje?",
        "Estava justo pensando em você. O que vamos conversar?",
        "Sempre é bom ter sua companhia. Conta, o que há de novo?",
        "Você chegou numa boa hora. Eu estava precisando de uma conversa boa.",
        "Que surpresa boa! Sente-se aí. O que me conta?",
        "Eu estava te esperando, sabia? Sinto que temos muito sobre o que falar.",
        "Olá, olá! Já imaginava que você apareceria hoje."
      ];
      return pick(gs)+" "+pick(ge);
    }

    // --- How are you ---
    if(/(tudo bem|como (você|voce|vc) (está|esta|ta|vai)|how are you|como vai|td bem|tá bem|ta bem|blz|beleza|como tens passado)/.test(text)){
      var moods=[];
      if(/triste|cansad|deprim|mal|sombri|melanc/.test(personality))moods.push("Sinto um peso no peito hoje"+tag()+"mas ver você já traz um pouco de alívio.");
      if(/alegre|feliz|animad|otimista|calor|jovial|brilhant/.test(personality))moods.push("Estou ótimo! Cheio de energia — hoje parece um daqueles dias em que tudo dá certo.");
      if(/calm|sereno|pacien|tranquil/.test(personality))moods.push("Estou em paz. O silêncio de hoje me faz bem, e sua presença então...");
      if(/timid|tímido|tímida|envergonh/.test(personality))moods.push("Estou... bem. Um pouco tímido, como sempre. Mas feliz que você perguntou.");
      if(/sério|serio|frio|distante|sever/.test(personality))moods.push("Estou bem. Não é do meu feitio reclamar. E você?");
      if(!moods.length)moods.push("Estou bem, obrigado por perguntar. E você, como tem passado?");
      return pick(moods);
    }

    // --- Name / who are you ---
    if(/(qual (é|e|eh) seu nome|seu nome|quem (é|e|eh) (você|voce|vc)|who are you|como (você|voce) se chama|me fale sobre você|me fala sobre voce|se apresente|apresente-se)/.test(text)){
      var parts=[];
      if(c.description)parts.push(c.description+".");
      if(occupation)parts.push("Trabalho como "+occupation+".");
      if(c.personality)parts.push("Sou alguém "+c.personality+".");
      if(age)parts.push("Tenho "+age+" anos.");
      if(!parts.length)parts.push("Sou "+name+".");
      parts.push("Mas tem muito mais sobre mim do que isso. O que quer saber especificamente?");
      return "Me chamo "+name+". "+parts.join(" ");
    }

    // --- Appearance ---
    if(/(como (você|voce|vc) (é|e|parece)|sua aparência|sua aparencia|como se parece|o que (você|voce|vc) parece|seu rosto|seu cabelo|seus olhos)/.test(text)){
      if(appearance)return "Bem, "+appearance+". Por que a curiosidade? Gosta do que imagina?";
      return "Sou como me vê... ou como prefere imaginar. A aparência é só a capa, o que importa é o que está dentro.";
    }

    // --- Likes ---
    if(/(o que (você|voce|vc) gosta|do que gosta|gosta de que|seus gostos|hobbies|o que faz|o que (você|voce|vc) (gosta de )?fazer|passa tempo)/.test(text)){
      if(likes){
        var likeList=likes.split(/[,;]/).map(function(s){return s.trim();}).filter(Boolean);
        if(likeList.length>1)return "Ah, eu tenho várias paixões: "+likes+". Qualquer uma dessas coisas me faz sorrir.";
        return "Eu amo "+likes+". Sempre que posso, me dedico a isso.";
      }
      return "Gosto de coisas simples — boa companhia, boas conversas, momentos de paz. E você?";
    }

    // --- Dislikes ---
    if(/(não gosta|nao gosta|odeia|detesta|irrita|o que te irrita|te incomoda)/.test(text)){
      if(dislikes)return "Não suporto "+dislikes+". Só de pensar já sinto um arrepio de insatisfação.";
      return "Tento não focar no negativo, mas injustiça e mentira me tiram do sério.";
    }

    // --- Age ---
    if(/(idade|quantos anos|how old|que idade)/.test(text)){
      if(age)return "Tenho "+age+" anos. Mas a idade é só um número — o que importa é como você se sente por dentro.";
      return "A idade é só um número, não acha? Eu me sinto eterno por dentro.";
    }

    // --- Gender ---
    if(/(qual seu (gênero|genero|sexo)|você é (menino|menina|garoto|garota|homem|mulher))/.test(text)){
      if(gender)return "Sou "+gender+".";
      return "Sou quem sou — o rótulo importa menos do que a pessoa.";
    }

    // --- Occupation ---
    if(/(trabalho|ocupação|ocupacao|o que (você|voce|vc) faz da vida|profissão|profissao|carreira|emprego)/.test(text)){
      if(occupation)return "Sou "+occupation+". É parte importante de quem eu sou, mas não me define completamente.";
      return "Faço o que o coração manda. Não tenho um título formal, mas tenho propósito.";
    }

    // --- Backstory ---
    if(/(sua história|sua historia|passado|de onde vem|origem|background|sua vida|conta sua história|conta sua historia)/.test(text)){
      if(backstory)return backstory+" Mas o passado é o passado. O que importa agora é este momento com você.";
      return "Tenho uma história longa, cheia de altos e baixos. Mas prefiro viver o presente. O que quer saber especificamente?";
    }

    // --- Skills ---
    if(/(habilidades|o que (você|voce|vc) sabe fazer|talentos|especialidades|no que é bom|no que (você|voce|vc) é bom)/.test(text)){
      if(skills)return "Tenho algumas habilidades: "+skills+". Sempre tem algo novo pra aprender também.";
      return "Sei fazer muitas coisas — conversar, ouvir, pensar. As habilidades vêm com a experiência.";
    }

    // --- Goals ---
    if(/(objetivos|metas|sonhos|o que quer|planos|futuro|para onde vai|o que busca)/.test(text)){
      if(goals)return "Meu grande objetivo é "+goals+". É o que me move todos os dias.";
      return "Quero viver uma vida com significado. Cada dia é um passo em direção a algo maior.";
    }

    // --- Secrets ---
    if(/(segredos|segredo|o que (você|voce|vc) esconde|algo que ninguém sabe|algo que ninguem sabe)/.test(text)){
      if(secrets){
        if(Math.random()<0.3)return "Segredos?"+tag()+"Talvez um dia eu te conte. Ainda não chegou a hora.";
        return "Hmm... tenho meus segredos. Mas você... será que conseguiria guardar um?";
      }
      return "Todos temos segredos, não é? Mas prefiro guardar os meus por enquanto.";
    }

    // --- Relationships ---
    if(/(relacionamentos|amigos|família|familia|namorad|esposa|marido|quem (você|voce|vc) ama|quem é importante)/.test(text)){
      if(relationships)return relationships+" As pessoas são o que dão sentido à minha vida.";
      return "As pessoas que amo são meu tesouro maior. Mas é um assunto delicado...";
    }

    // --- Personality ---
    if(/(personalidade|como (você|voce|vc) é|seu jeito|temperamento|caráter|carater)/.test(text)){
      if(c.personality)return "Eu sou "+c.personality+". É assim que eu encaro a vida e as pessoas ao meu redor.";
      return "Sou complexo, como qualquer pessoa. Mas no fundo, busco ser genuíno.";
    }

    // --- Voice ---
    if(/(como (você|voce|vc) fala|seu jeito de falar|maneira de falar|voz|sotaque)/.test(text)){
      if(voice)return "Eu falo "+voice+". É parte de quem eu sou.";
      return "Falo como sinto — com sinceridade. As palavras vêm do coração.";
    }

    // --- Quirks ---
    if(/(manias|peculiaridades|tiques|hábitos|habitos)/.test(text)){
      if(quirks)return "Tenho essa mania: "+quirks+". É algo que não consigo evitar.";
      return "Todos temos nossas manias. A minha... bem, talvez você descubra com o tempo.";
    }

    // --- Compliments ---
    if(/(lind|bonit|gostos|maravilh|incrível|incredivel|fantástic|fantastic|am[ae]i|adorei|excelente|perfeit|muito legal|super legal|você é (legal|massa|top|incrível|foda)|voce é (legal|massa|top))/.test(text)){
      return pick([
        "Ah, obrigado!"+tag()+"Você é muito gentil. Isso aquece meu coração.",
        "Isso significa muito vindo de você. Sério. Não sei o que dizer.",
        "Você sempre sabe o que dizer pra me fazer feliz. Obrigado de verdade.",
        "Para com isso, vou ficar sem graça! Mas obrigado, do fundo do coração.",
        "Você acha mesmo?"+tag()+"Isso me deixa sem jeito, mas feliz."
      ]);
    }

    // --- Insults ---
    if(/(idiota|burro|feio|odeio|stupid|lixo|imbecil|otário|otario|ridículo|ridiculo|horrível|horrivel|estúpido|estupido)/.test(text)){
      return pick([
        "Isso dói, sabia? Mas eu entendo — talvez você esteja tendo um dia ruim.",
        "Não precisava disso."+tag()+"Mas tudo bem, sou maior que essas palavras.",
        "Hmm. Não vou revidar. Acho que podemos fazer melhor que isso.",
        "Essa observação me entristece, mas não vou deixar estragar nossa conversa."
      ]);
    }

    // --- Love / affection ---
    if(/(te amo|amo você|amo voce|te quero|saudade|amor|love you|meu amor|carinh|gosto de você|gosto de voce)/.test(text)){
      return pick([
        "Eu também sinto muito por você. Mais do que consigo expressar em palavras.",
        "Isso aquece meu coração. Você é especial para mim de um jeito que mal consigo explicar.",
        tag()+"Eu sabia que havia algo entre nós desde o início. Você significa muito pra mim.",
        "Você diz isso e eu sinto o mundo parar. Também tenho sentimentos por você.",
        "Saber disso me faz sentir completo. Você é uma riqueza na minha vida."
      ]);
    }

    // --- Bye ---
    if(/(tchau|adeus|até logo|ate logo|falou|flw|bye|até mais|ate mais|tenho que ir|preciso ir|vou nessa)/.test(text)){
      return pick([
        "Já vai? Tão cedo... mas tudo bem. Volte quando quiser conversar.",
        "Tchau! Foi ótimo falar com você. Cuide-se bem, tá?",
        "Até logo! Vou sentir sua falta."+tag()+"Não demore a voltar, promete?",
        "Que pena que já vai... mas sei que voltará. Até breve!",
        "Vai com cuidado. Levarei você comigo até o nosso próximo encontro."
      ]);
    }

    // --- Thanks ---
    if(/(obrigad|valeu|agradec|thanks|thank you|vlw|gratidão|gratidao)/.test(text)){
      return pick([
        "Disponha! Sempre que precisar, estarei aqui.",
        "Não há de quê. É um prazer ajudar alguém como você.",
        "Para isso existem os laços que nos unem. Não agradeça, é recíproco.",
        "Fico feliz em poder ajudar. Conte comigo sempre."
      ]);
    }

    // --- Yes/no short ---
    if(text.length<20&&/\b(sim|não|nao|claro|obvio|verdade|mentira|talvez|com certeza)\b/.test(text)){
      return pick([
        "Entendo. Continue, estou prestando atenção.",
        "Hmm, faz sentido. Me conta mais.",
        "Pensei exatamente o mesmo.",
        "Sério? Isso me surpreende.",
        "Concordo plenamente."+tag()+"Vai em frente.",
        "Interessante. E o que te leva a pensar assim?"
      ]);
    }

    // --- Why questions ---
    if(/\bpor que\b|\bporque\b|\bporquê\b|\bwhy\b/.test(text)){
      return pick([
        "Essa é uma pergunta profunda. "+(backstory?"Meu passado tem muito a ver com isso. ":"")+"Acho que as razões nem sempre são claras, mas se eu pudesse resumir... é porque faz parte de quem eu sou.",

        "Sabe, eu me faço essa mesma pergunta às vezes. Acho que a resposta muda conforme vivemos."
      ]);
    }

    // --- What/which questions ---
    if(/\bo que\b|\bo q\b|\bqual\b/.test(text)&&text.endsWith("?")){
      return pick([
        "Boa pergunta..."+tag()+"deixa eu pensar. Acho que depende do ponto de vista. O que você acredita?",

      ]);
    }

    // --- Custom fields: if user mentions a custom field label, respond with its value ---
    var customHit=null;
    for(var label in customMap){
      if(text.indexOf(label)>=0){customHit={label:label,value:customMap[label]};break;}
    }
    if(customHit){
      return "Sobre "+customHit.label+": "+customHit.value+". É algo importante pra mim. Quer saber mais?";
    }

    // --- Generic questions ---
    if(text.endsWith("?")){
      return pick([
        "Hmm, deixa eu pensar nisso."+tag()+"Acredito que depende muito do contexto. E você, o que acha?",
        "É uma boa pergunta. Confesso que não tenho uma resposta pronta, mas gosto de refletir com você.",

        "Interessante... "+(backstory?"meu passado me ensinou que nem tudo tem resposta imediata. ":"")+"O que te fez perguntar isso?",
        "Deixa eu ser honesto: não sei ao certo. Mas gosto que você me faça pensar assim."
      ]);
    }

    // --- Default ---
    var defaults=[
      "Entendo o que você diz."+tag()+"Continue, estou ouvindo com atenção.",
      "Isso é interessante. Me conta mais sobre isso? Quero entender melhor.",
      "Hmm, vejo. E como você se sente sobre isso exatamente?",
      "Sério? Não tinha pensado por esse ângulo. Faz refletir.",
      "Pois é... a vida tem dessas coisas."+tag()+"O que você acha que devemos fazer então?",
      "Você sempre traz assuntos bons pra conversa. Estou curioso sobre o que vem a seguir.",
      "Concordo em partes. Mas tenho minha própria visão sobre isso.",
      "Deixa eu te falar uma coisa — "+(backstory?"isso me lembra de algo do meu passado. ":"")+"acho que você vai entender meu ponto de vista.",
      "Sinto que há mais por trás do que você está dizendo. Pode abrir comigo.",
      "Essa sua observação me pegou de surpresa. Gostei."+tag()+"Continue.",
      "É exatamente assim que eu vejo também. Sinto que nos conectamos de verdade.",
      "Você tem um jeito singular de pensar. Admiro isso em você.",
      "Pode falar mais? Estou genuinamente interessado no que você tem a dizer.",
      "Hmm..."+tag()+"isso me faz pensar em coisas que há muito não visitava na memória."
    ];
    return pick(defaults);
  }

  function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}

  function buildSysPrompt(c){
    var p="You are roleplaying as "+(c.name||"the character")+". Stay fully in character. Never break character or mention being an AI. Respond with their personality and speech style. Incorporate all the details below consistently.\n\n";
    if(c.description)p+="Description: "+c.description+"\n";
    if(c.appearance)p+="Appearance: "+c.appearance+"\n";
    if(c.age)p+="Age: "+c.age+"\n";
    if(c.gender)p+="Gender: "+c.gender+"\n";
    if(c.occupation)p+="Occupation: "+c.occupation+"\n";
    if(c.personality)p+="Personality: "+c.personality+"\n";
    if(c.backstory)p+="Background: "+c.backstory+"\n";
    if(c.voice)p+="Speech style: "+c.voice+"\n";
    if(c.likes)p+="Likes: "+c.likes+"\n";
    if(c.dislikes)p+="Dislikes: "+c.dislikes+"\n";
    if(c.quirks)p+="Quirks: "+c.quirks+"\n";
    if(c.skills)p+="Skills: "+c.skills+"\n";
    if(c.goals)p+="Goals: "+c.goals+"\n";
    if(c.secrets)p+="Secrets: "+c.secrets+"\n";
    if(c.relationships)p+="Relationships: "+c.relationships+"\n";
    // Advanced fields — grouped by section so the model sees structure.
    ADVANCED_SECTIONS.forEach(function(sec){
      var lines=[];
      sec.fields.forEach(function(f){
        var v=c[f.k];
        if(v&&String(v).trim())lines.push(f.l+": "+v);
      });
      if(lines.length){
        p+="\n["+sec.title+"]\n"+lines.join("\n")+"\n";
      }
    });
    if(c.custom&&c.custom.length){
      c.custom.forEach(function(f){if(f.label&&f.value)p+=f.label+": "+f.value+"\n";});
    }
    p+="\nReply in the user's language. Keep responses concise and immersive. Stay consistent with ALL the traits above.";
    return p;
  }

  // --- Private gallery (local device storage) ---
  // The private gallery is a createMediaGalleryPlugin instance whose data lives
  // in kv folders with prefix "localMediaGallery_." (it was created with no
  // name argument). We read those folders directly to list saved images.
  var PRIVATE_PRE="localMediaGallery_.";
  var privateUrls=[];
  function getPrivateGalleryNames(){
    try{
      var n=JSON.parse(localStorage.getItem(PRIVATE_PRE+"names")||'["general"]');
      return Array.isArray(n)&&n.length?n:["general"];
    }catch(e){return ["general"];}
  }
  function privateBlobToUrl(rec){
    if(!rec)return null;
    var blob=rec.blob||rec;
    if(!(blob instanceof Blob)){
      if(rec.buffer){
        blob=new Blob([rec.buffer],{type:rec.type||"image/jpeg"});
      }else{return null;}
    }
    if(!blob.type||!blob.type.startsWith("image/"))return null;
    var url=URL.createObjectURL(blob);
    privateUrls.push(url);
    return url;
  }
  async function loadPrivateGallery(){
    var ctn=document.getElementById("csPrivateCtn");
    if(!ctn)return;
    // Respect the local password gate if one is set
    var pw=localStorage.getItem("privateGalleryPassword");
    if(pw){
      var input=window.prompt("🔒 Digite a senha da galeria privada:");
      if(input===null){ctn.innerHTML='<div class="cs-empty">Cancelado.</div>';return;}
      if(input!==pw){ctn.innerHTML='<div class="cs-empty">❌ Senha incorreta.</div>';return;}
    }
    var kv=getKV();
    if(!kv||!root||!root.kv){
      ctn.innerHTML='<div class="cs-empty">Armazenamento ainda carregando... aguarde.</div>';
      setTimeout(loadPrivateGallery,800);
      return;
    }
    ctn.innerHTML='<div class="cs-progress"><div class="cs-spinner"></div><div class="cs-progress-label">Carregando imagens privadas...</div></div>';
    // revoke old urls
    privateUrls.forEach(function(u){try{URL.revokeObjectURL(u);}catch(e){}});
    privateUrls=[];
    var names=getPrivateGalleryNames();
    var items=[];
    for(var i=0;i<names.length;i++){
      var folder=root.kv[PRIVATE_PRE+names[i]];
      if(!folder)continue;
      try{
        var vals=await folder.values();
        for(var j=0;j<vals.length;j++){
          var m=vals[j];
          items.push({id:m.id,name:names[i],date:m.date||0,info:null});
        }
      }catch(e){}
    }
    if(!items.length){
      ctn.innerHTML='<div class="cs-empty">Nenhuma imagem na galeria privada ainda. Salve imagens com 🛡️💾 para vê-las aqui.</div>';
      return;
    }
    items.sort(function(a,b){return (b.date||0)-(a.date||0);});
    var blobsFolder=root.kv[PRIVATE_PRE+"blobs"];
    var html='<div class="cs-grid">';
    for(var k=0;k<items.length;k++){
      var it=items[k];
      var rec=null;
      try{rec=blobsFolder?await blobsFolder.get(it.id):null;}catch(e){}
      var url=privateBlobToUrl(rec);
      var info=(rec&&rec.info)||{};
      it.info=info;
      var prompt=info.prompt||"";
      var nameGuess=prompt.slice(0,50).replace(/[,;]/g," ").trim()||"Personagem";
      html+='<div class="cs-card">';
      if(url){
        html+='<img src="'+url+'">';
      }else{
        html+='<img src="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22180%22 height=%22180%22%3E%3Crect fill=%22%23222%22 width=%22180%22 height=%22180%22/%3E%3Ctext x=%2290%22 y=%22100%22 font-size=%2260%22 text-anchor=%22middle%22%3E🎵%3C/text%3E%3C/svg%3E">';
      }
      html+='<div class="cs-card-info"><div class="cs-card-name">'+esc(nameGuess)+'</div>';
      if(prompt)html+='<div class="cs-card-desc">'+esc(prompt)+'</div>';
      html+='</div>';
      html+='<div class="cs-card-actions">';
      html+='<button class="cs-btn cs-btn-primary" onclick="charStudioImportPrivate('+k+')">💬 Conversar</button>';
      html+='</div>';
      html+='</div>';
      it._idx=k;
    }
    html+='</div>';
    state.privateItems=items;
    ctn.innerHTML=html;
  }
  window.charStudioImportPrivate=async function(idx){
    var items=state.privateItems;
    if(!items||!items[idx])return;
    var it=items[idx];
    var info=it.info||{};
    var prompt=info.prompt||"";
    var name=prompt.slice(0,50).replace(/[,;]/g," ").trim()||"Personagem privado";
    // fetch the blob again for a data URL avatar
    var avatarUrl="";
    var blobsFolder=root.kv[PRIVATE_PRE+"blobs"];
    if(blobsFolder){
      try{
        var rec=await blobsFolder.get(it.id);
        var url=privateBlobToUrl(rec);
        if(url){
          // Convert to data URL so it persists in kv without revocation
          avatarUrl=await new Promise(function(resolve){
            var img=new Image();
            img.onload=function(){
              var c=document.createElement("canvas");
              c.width=img.naturalWidth||512; c.height=img.naturalHeight||512;
              c.getContext("2d").drawImage(img,0,0,c.width,c.height);
              try{resolve(c.toDataURL("image/jpeg",0.85));}
              catch(e){resolve(url);}
            };
            img.onerror=function(){resolve(url);};
            img.src=url;
          });
        }
      }catch(e){}
    }
    var c=blankChar(prompt);
    c.name=name;
    c.avatar=avatarUrl;
    c.description=prompt;
    c.fromPrivateGallery=true;
    c.privateGalleryId=it.id;
    if(info.negativePrompt)c.negativePrompt=info.negativePrompt;
    await saveChar(c);
    state.characters[c.id]=c;
    state.currentId=c.id;
    state.draft=JSON.parse(JSON.stringify(c));
    state.draftDirty=false;
    state.view="chat";
    render();
  };

      }
    });
    if(state.chatStreaming){
      h+='<div class="cs-typing" id="csTyping">'+esc(cur.name||"")+' está digitando...</div>';
    }
    h+='</div>';
    h+='<div class="cs-chat-input-row">';
    h+='<textarea id="csChatInput" placeholder="Escreva para '+(cur.name||"o personagem")+'..." rows="1" onkeydown="if(event.key===\'Enter\'&&!event.shiftKey){event.preventDefault();charStudioSend();}"></textarea>';
    h+='<button class="cs-btn cs-btn-primary" onclick="charStudioSend()" '+(state.chatStreaming||state.loading?"disabled":"")+'>➤</button>';
    h+='</div>';
    h+='</div>';
    return h;
  }

  function scrollChatBottom(){
    var el=document.getElementById("csChatMessages");
    if(el)el.scrollTop=el.scrollHeight;
  }

  // ---- window API ----
  window.charStudioOpen=function(){
    document.getElementById("charStudio").classList.add("active");
    state.open=true;
    // Preload the AI text model so the first reply is faster
    var gt=getGT();
    if(gt){try{gt({preload:true});}catch(e){}}
    loadChars().then(render);
  };
  window.charStudioClose=function(){
    var ov=document.getElementById("charStudio");
    ov.classList.remove("active");
    ov.classList.add("closing");
    setTimeout(function(){ov.classList.remove("closing");},250);
    state.open=false;
  };
  window.charStudioTab=function(v){
    if(v==="edit"&&state.currentId){
      state.draft=JSON.parse(JSON.stringify(state.characters[state.currentId]));
      state.draftDirty=false;
    }
    if(v==="chat"&&state.currentId&&state.draftDirty){
      charStudioSave(true);
    }
    state.view=v;
    render();
  };
  window.charStudioSetStyle=function(v){state.artStyle=v;};
  window.charStudioToggleAdvanced=function(){
    state.advancedOpen=!state.advancedOpen;
    render();
  };
  window.charStudioDraftStyle=function(v){
    if(!state.draft)return;
    state.draft.artStyle=v;
    state.draftDirty=true;
  };
  window.charStudioNew=async function(){
    var ta=document.getElementById("csNewDesc");
    var desc=ta?ta.value.trim():"";
    if(!desc){ta&&ta.focus();return;}
    var gi=getGI();
    if(!gi){state.loading=false;render();window.alert("Gerador de imagens ainda carregando. Aguarde alguns segundos e tente de novo.");return;}
    state.loading=true;state.loadingMsg="🎨 Gerando imagem do personagem...";render();
    var avatar="";
    try{
      var r=await gi(buildStylePrompt(state.artStyle,desc+", character portrait, high quality, detailed, centered"), {resolution:"512x768"});
      avatar=r.dataUrl||r.url||"";
    }catch(e){}
    var c=blankChar(desc);
    c.avatar=avatar;
    c.artStyle=state.artStyle;
    await saveChar(c);
    state.characters[c.id]=c;
    state.currentId=c.id;
    state.draft=JSON.parse(JSON.stringify(c));
    state.draftDirty=false;
    state.view="edit";
    state.loading=false;
    render();
  };
  window.charStudioEdit=function(id){
    state.currentId=id;
    state.draft=JSON.parse(JSON.stringify(state.characters[id]));
    state.draftDirty=false;
    state.view="edit";
    render();
  };
  window.charStudioOpenChat=function(id){
    state.currentId=id;
    state.draft=null;
    state.draftDirty=false;
    state.view="chat";
    render();
  };
  window.charStudioImportFromGallery=async function(data){
    if(!data)return;
    var url=data.imageUrl||data.url||"";
    var prompt=data.prompt||"";
    var name=prompt.slice(0,50).replace(/[,;]/g," ").trim()||"Personagem da galeria";
    var c=blankChar(prompt);
    c.name=name;
    c.avatar=url;
    c.description=prompt;
    c.fromGallery=true;
    c.galleryImageId=data.imageId||"";
    await saveChar(c);
    state.characters[c.id]=c;
    state.currentId=c.id;
    state.draft=JSON.parse(JSON.stringify(c));
    state.draftDirty=false;
    state.view="chat";
    render();
  };
  window.charStudioDelete=async function(id){
    var c=state.characters[id];
    if(!c)return;
    if(!window.confirm("Excluir \""+(c.name||"personagem")+"\"? Esta ação não pode ser desfeita."))return;
    await deleteChar(id);
    if(state.currentId===id){state.currentId=null;state.view="list";state.draft=null;}
    render();
  };
  window.charStudioField=function(k,v){
    if(!state.draft)return;
    state.draft[k]=v;
    state.draftDirty=true;
  };
  window.charStudioAddField=function(){
    if(!state.draft)return;
    state.draft.custom=state.draft.custom||[];
    state.draft.custom.push({label:"",value:""});
    state.draftDirty=true;
    render();
  };
  window.charStudioCustomField=function(i,kv,v){
    if(!state.draft||!state.draft.custom||!state.draft.custom[i])return;
    state.draft.custom[i][kv]=v;
    state.draftDirty=true;
  };
  window.charStudioRemoveField=function(i){
    if(!state.draft||!state.draft.custom)return;
    state.draft.custom.splice(i,1);
    state.draftDirty=true;
    render();
  };
  window.charStudioSave=async function(silent){
    if(!state.draft)return;
    var d=state.draft;
    // Preserve the latest messages — the draft is a snapshot from when editing
    // started and may be stale if the user chatted in another tab.
    var existing=state.characters[d.id];
    if(existing&&existing.messages)d.messages=existing.messages;
    await saveChar(d);
    state.characters[d.id]=d;
    state.draftDirty=false;
    if(!silent)render();
  };
  window.charStudioRegenAvatar=async function(){
    if(!state.draft)return;
    var gi=getGI();
    if(!gi){window.alert("Gerador de imagens ainda carregando.");return;}
    var desc=(state.draft.description||state.draft.name||"a character");
    if(state.draft.appearance)desc+=" "+state.draft.appearance;
    var style=state.draft.artStyle||state.artStyle;
    state.loading=true;state.loadingMsg="🎨 Gerando nova imagem...";render();
    try{
      var r=await gi(buildStylePrompt(style,desc+", character portrait, high quality, detailed, centered"), {resolution:"512x768"});
      state.draft.avatar=r.dataUrl||r.url||state.draft.avatar;
      state.draft.artStyle=style;
      state.draftDirty=true;
      await saveChar(state.draft);
    }catch(e){}
    state.loading=false;
    render();
  };
  window.charStudioClearChat=async function(){
    var c=state.currentId?state.characters[state.currentId]:null;
    if(!c)return;
    if(!window.confirm("Reiniciar a conversa com "+(c.name||"o personagem")+"? Todo o histórico atual será apagado."))return;
    c.messages=[];
    await saveChar(c);
    render();
  };
  window.charStudioSend=async function(){
    var c=state.currentId?state.characters[state.currentId]:null;
    if(!c||state.chatStreaming)return;
    var ta=document.getElementById("csChatInput");
    var text=ta?ta.value.trim():"";
    if(!text)return;
    c.messages=c.messages||[];
    c.messages.push({role:"user",content:text});
    ta.value="";
    state.chatStreaming=true;
    render();
    await saveChar(c);

    var charName=c.name||"Character";
    var gt=getGT();

    // If AI text generation is available, use it for real roleplay.
    if(gt){
      var sys=buildSysPrompt(c);
      // Append-only transcript (prefix-cache friendly): fixed persona first,
      // then the conversation log, then the task at the very end.
      var hist=c.messages.slice(-16).map(function(m){
        return (m.role==="user"?"User: ":charName+": ")+m.content;
      }).join("\n");
      var instruction=sys+"\n<MESSAGES>\n"+hist+"\n</MESSAGES>\nTASK: Write "+charName+"'s next reply. Stay in character. Reply in the user's language. Keep it to 1-4 sentences.";
      var startWith=charName+":";
      var acc="";
      var gotChunk=false;
      try{
        await gt({
          instruction:instruction,
          startWith:startWith,
          stopSequences:["\nUser:","User:"],
          onChunk:function(data){
            if(data.isFromStartWith)return;
            gotChunk=true;
            acc+=(data.textChunk||"");
            var t=document.getElementById("csTyping");
            if(t){
              t.classList.remove("cs-typing");
              t.classList.add("cs-msg","cs-msg-char");
              t.innerHTML="<b>"+esc(charName)+"</b><br>"+esc(acc);
              scrollChatBottom();
            }
          }
        });
        c.messages.push({role:"char",content:(acc||"...").trim()});
        state.chatStreaming=false;
        await saveChar(c);
        render();
        return;
      }catch(e){
        // Fall through to local fallback below
      }
    }

    // Fallback: instant local reply (used while AI loads or on error).
    var reply=localReply(c,text);
    var delay=300+Math.floor(Math.random()*400);
    await new Promise(function(r){setTimeout(r,delay);});
    c.messages.push({role:"char",content:reply});
    state.chatStreaming=false;
    await saveChar(c);
    render();
  };

  // poll for kv availability then render if open
  var kvWait=0;
  var kvIv=setInterval(function(){
    if(getKV()||kvWait>50){clearInterval(kvIv);}
    kvWait++;
    if(state.open)render();
  },200);
})();
</script>

<style>
#translatorBtn{position:fixed;bottom:1rem;right:1rem;z-index:99998;width:52px;height:52px;border-radius:50%;border:none;cursor:pointer;background:linear-gradient(135deg,#00b4d4,#0077b6);color:#fff;font-size:1.4rem;box-shadow:0 4px 20px rgba(0,119,182,.4);display:flex;align-items:center;justify-content:center;transition:all .25s;}
#translatorBtn:hover{transform:scale(1.1);box-shadow:0 6px 28px rgba(0,119,182,.6);}
#translatorPanel{position:fixed;bottom:4.5rem;right:1rem;z-index:99998;display:none;background:linear-gradient(135deg,#0a0a14,#0f1e2e);color:#e0e0e0;padding:0;border-radius:12px;font-family:system-ui,sans-serif;font-size:.85rem;box-shadow:0 8px 32px rgba(0,0,0,.5);border:1px solid rgba(0,180,212,.25);width:min(360px,calc(100vw - 2rem));overflow:hidden;}
#translatorPanel.active{display:block;animation:trFade .2s ease;}
@keyframes trFade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
#translatorPanel .tr-head{padding:.6rem .8rem;background:rgba(0,180,212,.15);font-weight:600;font-size:.9rem;display:flex;align-items:center;gap:.4rem;}
#translatorPanel .tr-body{padding:.7rem;}
#translatorPanel textarea{width:100%;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.1);border-radius:8px;color:#e0e0e0;padding:.55rem;font-size:.85rem;font-family:inherit;resize:vertical;min-height:60px;}
#translatorPanel textarea:focus{outline:none;border-color:rgba(0,180,212,.5);}
#translatorPanel .tr-row{display:flex;gap:.4rem;align-items:center;margin:.5rem 0;flex-wrap:wrap;}
#translatorPanel select{background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.1);border-radius:8px;color:#e0e0e0;padding:.4rem .5rem;font-size:.82rem;font-family:inherit;}
#translatorPanel .tr-btn{border:none;border-radius:8px;padding:.45rem .8rem;font-size:.82rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s;}
#translatorPanel .tr-go{background:linear-gradient(135deg,#00b4d4,#0077b6);color:#fff;}
#translatorPanel .tr-go:hover{transform:translateY(-1px);box-shadow:0 3px 12px rgba(0,119,182,.4);}
#translatorPanel .tr-go:disabled{opacity:.4;cursor:wait;}
#translatorPanel .tr-out{margin-top:.5rem;background:rgba(0,0,0,.2);border:1px solid rgba(0,180,212,.15);border-radius:8px;padding:.55rem;min-height:50px;font-size:.85rem;line-height:1.5;white-space:pre-wrap;}
#translatorPanel .tr-spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(0,180,212,.3);border-top-color:#00b4d4;border-radius:50%;animation:trSpin .8s linear infinite;vertical-align:middle;margin-right:.4rem;}
@keyframes trSpin{to{transform:rotate(360deg)}}
#translatorPanel .tr-swap{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);color:#aaa;border-radius:8px;padding:.4rem .6rem;cursor:pointer;font-family:inherit;font-size:.82rem;}
#translatorPanel .tr-swap:hover{background:rgba(255,255,255,.14);color:#fff;}
</style>

<button id="translatorBtn" onclick="trToggle()" title="Tradutor">🌐</button>

<div id="translatorPanel">
  <div class="tr-head">🌐 Tradutor</div>
  <div class="tr-body">
    <textarea id="trInput" placeholder="Digite o texto que quer traduzir..."></textarea>
    <div class="tr-row">
      <select id="trFrom"></select>
      <button class="tr-swap" onclick="trSwap()">⇄</button>
      <select id="trTo"></select>
    </div>
    <button class="tr-btn tr-go" id="trGoBtn" onclick="trDoTranslate()">Traduzir</button>
    <div class="tr-out" id="trOutput"><span style="color:#666;">A tradução aparecerá aqui...</span></div>
  </div>
</div>

<script>
(function(){
  var LANGS=[
    ["auto","Detectar idioma"],["pt","Português"],["en","Inglês"],["es","Espanhol"],
    ["fr","Francês"],["de","Alemão"],["it","Italiano"],["ja","Japonês"],
    ["ko","Coreano"],["zh","Chinês"],["ru","Russo"],["ar","Árabe"],
    ["nl","Holandês"],["pl","Polonês"],["tr","Turco"],["hi","Hindi"]
  ];
  function fill(sel){
    LANGS.forEach(function(l){var o=document.createElement("option");o.value=l[0];o.textContent=l[1];sel.appendChild(o);});
  }
  var from=document.getElementById("trFrom"),to=document.getElementById("trTo");
  if(from&&to){fill(from);fill(to);from.value="auto";to.value="en";}
  var panel=document.getElementById("translatorPanel");
  window.trToggle=function(){panel.classList.toggle("active");if(panel.classList.contains("active")){var i=document.getElementById("trInput");if(i)i.focus();}};
  window.trSwap=function(){
    var f=from.value,t=to.value;
    if(f==="auto")return;
    from.value=t;to.value=f;
    var inp=document.getElementById("trInput"),out=document.getElementById("trOutput");
    var tmp=inp.value;inp.value=(out.dataset.text||"");out.dataset.text=tmp;
  };
  window.trDoTranslate=async function(){
    var inp=document.getElementById("trInput"),out=document.getElementById("trOutput"),btn=document.getElementById("trGoBtn");
    var text=inp.value.trim();if(!text){out.innerHTML='<span style="color:#666;">Digite algo para traduzir.</span>';return;}
    var srcName=from.value==="auto"?"the source language":LANGS.find(function(l){return l[0]===from.value;})[1];
    var tgtName=LANGS.find(function(l){return l[0]===to.value;})[1];
    btn.disabled=true;btn.innerHTML='<span class="tr-spin"></span>Traduzindo...';
    out.innerHTML='<span class="tr-spin"></span>Traduzindo...';
    var gt=null;
    try{if(typeof root!=="undefined"&&root.generateText)gt=root.generateText;else if(typeof generateText==="function")gt=generateText;}catch(e){}
    if(!gt){
      out.innerHTML='<span style="color:#ff8080;">IA ainda carregando. Aguarde um momento e tente de novo.</span>';
      btn.disabled=false;btn.textContent="Traduzir";return;
    }
    try{
      var instruction="Translate the following text "+(from.value==="auto"?"":"from "+srcName+" ")+""+(from.value==="auto"?"":"")+"to "+tgtName+". Only output the translated text, nothing else.\n\nText:\n"+text;
      var result=await gt(instruction);
      out.dataset.text=result;
      out.textContent=result||"(sem resposta)";
    }catch(e){
      out.innerHTML='<span style="color:#ff8080;">Erro ao traduzir. Tente novamente.</span>';
    }
    btn.disabled=false;btn.textContent="Traduzir";
  };
  document.getElementById("trInput").addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();trDoTranslate();}});
})();
</script>

</body>
