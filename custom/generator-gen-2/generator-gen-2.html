<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>generator-gen-2 — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<!--
Design: Meta-Generator Architect (Recursive & Evolving)
Implements the "Evolving Generator System 3.0" logic within a recursive visual tree.
Features:
- Recursive node creation (Meta-Generator capability).
- Persistent state per node (Name, Stage, XP, Traits, Plugins, Lineage).
- Evolution Engine (Stage up, XP gain).
- Mutation Engine (Branching paths, Glitches).
- Skill Trees (World, Character, Systems).
- Plugin Integration simulation.
- UI Panels with Status and Action controls.
-->
<div style="font-family:'Courier New',monospace; background:#0d0d0d; color:#0f0; min-height:100vh; margin:0; display:flex; flex-direction:column; overflow:hidden;">
  
  <!-- Control Panel -->
  <div style="padding:10px; border-bottom:1px solid #333; display:flex; gap:10px; align-items:center; background:#111; z-index:100;">
    <div style="font-weight:bold; font-size:1.2em;">META.GEN_CORE_V3</div>
    <button id="resetBtn" onclick="location.reload()" style="background:#300; color:#fff; border:1px solid #f00; padding:5px 10px; cursor:pointer;">System Reset</button>
    <div style="flex:1;"></div>
    <div id="statusEl" style="color:#888;">System Ready. Awaiting Initialization.</div>
  </div>

  <!-- Main Viewport -->
  <div id="viewportCtn" style="flex:1; overflow:auto; padding:20px; position:relative;">
    
    <!-- Root Generator Placeholder -->
    <div id="rootEl" style="display:flex; flex-direction:column; gap:10px; padding-left:10px; border-left:2px solid #333; transition:all 0.3s;">
      
      <!-- Initial Spawn Point -->
      <div id="primeCtn" style="margin-bottom:20px;">
        <button id="primeBtn" onclick="spawnRoot()" style="font-family:inherit; font-size:1.1em; padding:15px 30px; background:#000; color:#0f0; border:2px solid #0f0; cursor:pointer; text-transform:uppercase; box-shadow:0 0 10px #0f0; transition:0.2s;">
          &lt; INITIALIZE PRIME GENERATOR &gt;
        </button>
      </div>

    </div>
  </div>

  <!-- Global Loading Overlay -->
  <div id="loaderEl" hidden style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:999; display:flex; justify-content:center; align-items:center; flex-direction:column;">
    <div style="font-size:2em; margin-bottom:20px; animation:blink 1s infinite;">COMPILING...</div>
    <div style="width:300px; height:4px; background:#333;">
      <div id="progressBarEl" style="width:0%; height:100%; background:#0f0; transition:width 0.2s;"></div>
    </div>
  </div>

  <style>
    @keyframes blink { 50% { opacity:0.5; } }
    .node-box { background:#111; border:1px solid #333; padding:10px; margin:5px 0 5px 20px; position:relative; transition:0.3s; width:100%; box-sizing:border-box; max-width:800px; }
    .node-box:hover { border-color:#0f0; box-shadow:0 0 8px rgba(0,255,0,0.1); }
    
    /* Status Panel Styling */
    .status-panel { background:#050505; border:1px solid #222; padding:8px; margin-bottom:10px; font-size:0.85em; }
    .stat-row { display:flex; justify-content:space-between; border-bottom:1px solid #111; padding:2px 0; }
    .stat-label { color:#666; }
    .stat-val { color:#afa; font-weight:bold; }
    
    /* Controls Styling */
    .controls { display:flex; gap:5px; margin-bottom:10px; flex-wrap:wrap; }
    .btn-ctrl { flex:1; background:#002200; color:#0f0; border:1px solid #050; padding:8px; cursor:pointer; font-family:inherit; font-weight:bold; min-width:80px; transition:0.2s; }
    .btn-ctrl:hover { background:#004400; border-color:#0f0; box-shadow:0 0 5px #0f0; }
    .btn-ctrl:disabled { opacity:0.3; cursor:not-allowed; border-color:#333; color:#555; }
    .btn-ctrl.evolve { border-left:3px solid #0f0; }
    .btn-ctrl.mutate { border-left:3px solid #ff0; color:#ff0; background:#222200; }
    .btn-ctrl.output { border-left:3px solid #0ff; color:#0ff; background:#002222; }

    /* Log Styling */
    .node-log { background:#000; padding:8px; font-size:0.85em; color:#ccc; white-space:pre-wrap; border-left:2px solid #050; margin-top:5px; max-height:200px; overflow-y:auto; font-family:'Courier New',monospace; min-height:60px; }
    .highlight { color:#0f0; font-weight:bold; }
    .variable { color:#f0f; }
    .mutation { color:#ff0; }
    .plugin { color:#0ff; }

    .connector-line { position:absolute; left:-21px; top:0; bottom:0; width:1px; background:#333; }
    .child-ctn { margin-left:10px; padding-left:10px; border-left:1px dashed #222; }
  </style>

  <script type="module">
    // State & Helpers
    let statusEl = document.getElementById("statusEl");
    let rootEl = document.getElementById("rootEl");

    // Store state for every generated node
    let nodeStateMap = new Map();

    function setStatus(msg) { statusEl.textContent = msg; }
    
    // Helper: Generate ID [gen_[a-z]{5}]
    function genId() {
      const chars = 'abcdefghijklmnopqrstuvwxyz';
      let str = '';
      for(let i=0; i<5; i++) str += chars.charAt(Math.floor(Math.random() * chars.length));
      return `gen_${str}`;
    }

    function randomInt(min, max) { return Math.floor(Math.random() * (max - min + 1) + min); }
    function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    // Initialize Root Node (System 3.0: Root -> Initial Memory State)
    window.spawnRoot = async function() {
      let primeBtn = document.getElementById("primeBtn");
      primeBtn.hidden = true;
      
      // Create initial state
      let initialState = {
        name: genId(),
        stage: 1,
        xp: 0,
        traits: "none",
        plugins: "none",
        lineage: "origin",
        skill: null,
        skillTree: null
      };

      // Create node with state
      await createNode(rootEl, initialState, 0, true);
      setStatus("System Initialized.");
    };

    // Create a Generator Node DOM structure
    async function createNode(parent, state, currentDepth, isRoot = false) {
      let id = "node_" + Math.random().toString(36).substr(2, 9);
      
      // Save state
      nodeStateMap.set(id, state);

      let container = document.createElement("div");
      container.className = "node-box";
      container.id = id;
      container.dataset.depth = currentDepth;
      
      // Visual connector line
      let line = document.createElement("div");
      line.className = "connector-line";
      container.appendChild(line);

      // HTML Structure
      container.innerHTML = `
        <div class="status-panel" id="panel_${id}">
          <!-- Rendered by updateNodeUI -->
        </div>
        
        <div class="controls">
          <button class="btn-ctrl evolve" onclick="runAction('${id}', 'evolve')">EVOLVE</button>
          <button class="btn-ctrl mutate" onclick="runAction('${id}', 'mutate')">MUTATE</button>
          <button class="btn-ctrl output" onclick="runAction('${id}', 'output')">OUTPUT</button>
        </div>

        <div class="node-log" id="log_${id}">> Generator Initialized...\n> Awaiting command.</div>
        <div class="child-ctn" id="children_${id}"></div>
      `;

      // Append to parent
      let childrenCtn = parent.querySelector(".child-ctn");
      if (childrenCtn) {
        childrenCtn.appendChild(container);
      } else {
        parent.appendChild(container);
      }

      // Initial UI Render
      updateNodeUI(id);

      // Scroll to new node
      if (!isRoot) container.scrollIntoView({ behavior: "smooth", block: "center" });

      return id;
    }

    // Update the Status Panel based on current state
    function updateNodeUI(nodeId) {
      let state = nodeStateMap.get(nodeId);
      let panel = document.getElementById(`panel_${nodeId}`);
      if (!state || !panel) return;

      panel.innerHTML = `
        <div style="text-align:center; border-bottom:1px solid #333; margin-bottom:5px; color:#fff; font-weight:bold;">GENERATOR STATUS</div>
        <div class="stat-row"><span class="stat-label">Name:</span> <span class="stat-val">${state.name}</span></div>
        <div class="stat-row"><span class="stat-label">Stage:</span> <span class="stat-val">${state.stage} / 5</span></div>
        <div class="stat-row"><span class="stat-label">XP:</span> <span class="stat-val">${state.xp}</span></div>
        <div class="stat-row"><span class="stat-label">Traits:</span> <span class="stat-val" style="color:${state.traits === 'none' ? '#666' : '#ff0'}">${state.traits}</span></div>
        <div class="stat-row"><span class="stat-label">Plugins:</span> <span class="stat-val" style="color:${state.plugins === 'none' ? '#666' : '#0ff'}">${state.plugins}</span></div>
        <div class="stat-row"><span class="stat-label">Skill:</span> <span class="stat-val">${state.skill || 'None'}</span></div>
        <div class="stat-row"><span class="stat-label">Lineage:</span> <span class="stat-val" style="font-size:0.8em; max-width:150px; overflow:hidden; text-overflow:ellipsis;">${state.lineage}</span></div>
      `;
    }

    // Append text to log
    function appendLog(nodeId, text) {
      let logEl = document.getElementById(`log_${nodeId}`);
      if (logEl) {
        logEl.innerHTML += `\n${text}`;
        logEl.scrollTop = logEl.scrollHeight;
      }
    }

    // ==========================================
    // CORE LOGIC: ACTION ROUTER
    // ==========================================
    window.runAction = async function(nodeId, actionType) {
      let state = nodeStateMap.get(nodeId);
      let nodeEl = document.getElementById(nodeId);
      setStatus(`Executing ${actionType.toUpperCase()} on ${state.name}...`);

      // System 3.0 Logic

      if (actionType === 'evolve') {
        // 1. Check Cap
        if (state.stage >= 5) {
          appendLog(nodeId, `> ERROR: ${state.name} is at Max Stage (5). Cannot evolve further.`);
          setStatus("Action Failed: Max Level.");
          return;
        }

        // 2. Evolution Engine
        let nextStage = state.stage + 1;
        let xpGain = randomInt(5, 20);
        
        state.stage = nextStage;
        state.xp += xpGain;
        state.lineage += `,stage${state.stage}`;

        appendLog(nodeId, `> <span class="highlight">EVOLUTION COMPLETE!</span>`);
        appendLog(nodeId, `> Stage: ${nextStage} | XP Gained: +${xpGain} (Total: ${state.xp})`);

        // 3. Skill Tree Select
        await processSkillAcquisition(nodeId, state);
        updateNodeUI(nodeId);

      } else if (actionType === 'mutate') {
        // 1. Mutation Engine
        let mutations = [
          "branch:world_specialist", "branch:character_specialist", 
          "branch:systems_specialist", "boost:hyper_focus", "glitch:unstable_output"
        ];
        let mutType = pick(mutations);
        
        // Update Traits
        state.traits = state.traits === "none" ? mutType : `${state.traits},${mutType}`;
        state.lineage += `,mut_${mutType}`;

        appendLog(nodeId, `> <span class="mutation">MUTATION OCCURRED!</span>`);
        appendLog(nodeId, `> Type: ${mutType}`);
        appendLog(nodeId, `> Traits Updated: ${state.traits}`);

        // 2. Skill Acquisition (Mutations grant skills too)
        await processSkillAcquisition(nodeId, state);
        updateNodeUI(nodeId);

      } else if (actionType === 'output') {
        // Output Logic
        if (!state.skill) {
          appendLog(nodeId, `> ERROR: No skill equipped. Evolve or Mutate first.`);
          setStatus("Action Failed: No Skill.");
          return;
        }

        appendLog(nodeId, `> ${state.name} is generating output...`);
        
        // Simulate processing time
        await new Promise(r => setTimeout(r, 600));

        let outputText = generateContent(state);
        appendLog(nodeId, `> <span class="plugin">OUTPUT GENERATED:</span>`);
        appendLog(nodeId, `> "${outputText}"`);

        // META-GENERATOR FEATURE: If Role is "Meta-Generator" (implied by high traits or specific plugins), spawn a child
        if (state.plugins.includes("meta") || state.traits.includes("glitch")) {
           appendLog(nodeId, `> [META-EVENT] The generator instability creates a new child process...`);
           let childrenCtn = document.getElementById(`children_${nodeId}`);
           let currentDepth = parseInt(nodeEl.dataset.depth || 0);
           if (currentDepth < 20) {
              let childState = {
                name: genId(),
                stage: 1,
                xp: 0,
                traits: "inherited:" + state.traits,
                plugins: "none",
                lineage: state.lineage + ",spawn",
                skill: null,
                skillTree: null
              };
              await createNode(childrenCtn, childState, currentDepth + 1);
           }
        }
      }

      setStatus("Ready.");
    };

    // Helper: Skill Tree & Plugin Logic
    async function processSkillAcquisition(nodeId, state) {
      // 1. Pick Tree (Influenced by traits if present, otherwise random)
      let tree = "World";
      if (state.traits.includes("character")) tree = "Character";
      else if (state.traits.includes("systems")) tree = "Systems";
      else if (!state.skillTree) tree = pick(["World", "Character", "Systems"]); // Random if first time
      else tree = state.skillTree; // Stick to tree usually, or branch? Let's stick to tree for stability.

      state.skillTree = tree;

      // 2. Pick Skill from Tree
      let skills = {
        "World": ["world_seed", "biome_generator", "lore_weaver", "quest_hooker"],
        "Character": ["npc_builder", "personality_matrix", "dialogue_writer"],
        "Systems": ["logic_router", "item_forge", "description_enhancer", "tone_shifter"]
      };
      let newSkill = pick(skills[tree]);
      state.skill = newSkill;

      appendLog(nodeId, `> Skill Tree: [${tree}]`);
      appendLog(nodeId, `> Learned Skill: <span class="highlight">${newSkill}</span>`);

      // 3. Plugin Integration
      let pluginsPool = [
        "plugin:text_tools", "plugin:world_tools", 
        "plugin:character_tools", "plugin:logic_tools", "plugin:meta_core"
      ];
      let newPlugin = pick(pluginsPool);
      state.plugins = state.plugins === "none" ? newPlugin : `${state.plugins},${newPlugin}`;
      
      appendLog(nodeId, `> Installed: <span class="plugin">${newPlugin}</span>`);
    }

    // Helper: Content Generation Logic
    function generateContent(state) {
      // Templates based on skill
      let templates = [];
      
      if (state.skill === "biome_generator") {
        templates = [
          `A dense fog hangs over the ${pick(['swamp', 'tundra', 'ruin'])}. Visibility is near zero. (Climate: ${pick(['humid', 'freezing'])})`,
          `A region of crystalline forests where the trees sing in the wind. Flora includes ${pick(['glass-petals', 'iron-bark'])}.`
        ];
      } else if (state.skill === "npc_builder") {
        templates = [
          `Name: ${pick(['Kael', 'Vex', 'Moros'])}. Goal: To find the lost artifact. Flaw: Compulsive liar. Voice: Raspy, whispering.`,
          `A weary merchant with a hidden past. They carry a map marked with 'X' but refuse to sell it.`
        ];
      } else if (state.skill === "quest_hooker") {
        templates = [
          `The local well has run dry, but the water is being replaced by blood. Investigate the source upstream.`,
          `A noble has lost their favorite ring in a den of thieves. Retrieval offers a reward of 500 gold.`
        ];
      } else if (state.skill === "lore_weaver") {
        templates = [
          `Legend says the moon was once a prison for a god. When it shatters, the world will end.`,
          `The Great War was started not by kings, but by a insult traded between two chefs.`
        ];
      } else {
        // Fallback / Generic
        templates = [
          `Output generated via ${state.skill}. Content is stable. Format: Standard. Reference: ${state.lineage}`,
          `Data stream compiled. Variable: ${state.name}. Context: ${state.traits}.`
        ];
      }

      return pick(templates);
    }

  </script>
</div>
</body>
</html>
