<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ultimate Perchance Generator</title>
    <meta
      name="description"
      content="Generate HTML, Python, and Perchance code with live preview."
    />
    <meta name="theme-color" content="#1e1e2f" />
    <link
      rel="icon"
      href="https://mosberg.github.io/images/mosberg-avatar-ico.ico"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Fira+Code&display=swap"
    />
    <style>
      :root {
        --font: "Fira Code", monospace;
        --bg: #1e1e2f;
        --bg-alt: #2a2a3d;
        --text: #f0f0f0;
        --accent: #ffcc00;
      }

      body {
        font-family: var(--font);
        background: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 2rem;
      }

      header {
        text-align: center;
        margin-bottom: 2rem;
      }

      h1 {
        color: var(--accent);
        font-size: 2.5rem;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        margin-bottom: 1rem;
      }

      select,
      button {
        background: var(--bg-alt);
        color: var(--text);
        border: 2px solid var(--accent);
        padding: 0.5rem 1rem;
        border-radius: 8px;
        font-family: var(--font);
        cursor: pointer;
      }

      textarea {
        width: 100%;
        height: 150px;
        background: var(--bg-alt);
        color: var(--text);
        border: 2px solid var(--accent);
        border-radius: 8px;
        padding: 1rem;
        font-family: var(--font);
        resize: vertical;
        margin-bottom: 1rem;
      }

      .output {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2rem;
      }

      .panel {
        border: 2px solid var(--accent);
        border-radius: 8px;
        padding: 1rem;
      }

      .panel h2 {
        margin-top: 0;
        color: var(--accent);
      }

      iframe {
        width: 100%;
        height: 600px;
        border: none;
      }

      @media (max-width: 768px) {
        .output {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>🌌 Ultimate Generator 🌟</h1>
      <p>Generate HTML, Python, or Perchance with live preview</p>
    </header>

    <div class="controls">
      <select id="modeSelect">
        <option value="html" selected>🌐 HTML/CSS/JS</option>
        <option value="python">🐍 Python</option>
        <option value="perchanceHtml">🎲 Perchance HTML</option>
      </select>
      <button id="generateBtn">Generate</button>
      <button id="darkModeBtn">🌃</button>
    </div>

    <textarea
      id="instructionEl"
      placeholder="Write your instruction here..."
    ></textarea>
    <textarea
      id="responseEl"
      placeholder="Generated output will appear here..."
      readonly
    ></textarea>

    <div class="output">
      <div class="panel">
        <h2>Raw Output</h2>
        <div id="responseText"></div>
      </div>
      <div class="panel">
        <h2>Rendered Preview</h2>
        <div id="renderedOutput"></div>
      </div>
    </div>

    <script src="https://user.uploads.dev/file/f7b5afb4f2abdc3cd4b51ea56c548850.js" defer></script>
  </body>
</html>

</body>
</html>
