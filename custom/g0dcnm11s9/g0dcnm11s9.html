<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>g0dcnm11s9 — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<div id="appCtn" style="max-width:800px; margin:0 auto; padding:10px; text-align:left;">
  <h1 style="margin-top:0">🖥️ PC Dashboard</h1>

  <div id="settingsCtn" style="border:1px solid currentColor; padding:8px; margin-bottom:12px;">
    <strong>Settings</strong><br>
    <label>Theme <select id="themeSelectEl" onchange="saveSettings()"><option>light</option><option>dark</option><option>oled</option></select></label>
    <label>Font <select id="fontSizeSelectEl" onchange="saveSettings()"><option>14px</option><option>16px</option><option>18px</option></select></label>
    <label><input type="checkbox" id="compactInput" onchange="saveSettings()"> Compact</label>
  </div>

  <div id="diagCtn" style="border:1px solid currentColor; padding:8px; margin-bottom:12px;">
    <strong>Diagnostics</strong>
    <div>CPU: <span id="cpuEl">0</span>%</div>
    <div>GPU: <span id="gpuEl">0</span>%</div>
    <div>RAM: <span id="ramEl">0</span>%</div>
    <div>Temp: <span id="tempEl">0</span>°C</div>
    <button id="refreshDiagBtn" onclick="refreshDiag()">↻ Refresh</button>
  </div>

  <div id="cmdCtn" style="border:1px solid currentColor; padding:8px; margin-bottom:12px;">
    <strong>Commands</strong><br>
    <button id="diagAIBtn" onclick="runDiagAI()">/diag-ai</button>
    <button id="buildSuggestBtn" onclick="runBuildSuggest()">/build-suggest</button>
    <button id="recommendBtn" onclick="runRecommend()">/recommend-software</button>
    <button id="gpuPriceBtn" onclick="runGpuPrice()">/gpu-price</button>
    <button id="buildImageBtn" onclick="runBuildImage()">/build-image</button>
    <button id="smartDiagBtn" onclick="runSmartDiag()">/smart-diag</button>
    <div id="cmdOutputEl" style="margin-top:8px; white-space:pre-wrap; min-height:40px; border:1px dashed currentColor; padding:6px;"></div>
  </div>

  <div id="softwareCtn" style="border:1px solid currentColor; padding:8px;">
    <strong>Software Hub</strong>
    <div>🧰 <a href="https://ninite.com/" target="_blank">Essential Software</a></div>
    <div>💻 <a href="https://code.visualstudio.com/" target="_blank">Programming Tools</a></div>
    <div>🎮 <a href="https://store.steampowered.com/about/" target="_blank">Gaming Software</a></div>
    <div>📡 <a href="https://obsproject.com/" target="_blank">Streaming Tools</a></div>
  </div>

  <img id="buildImgEl" style="max-width:100%; margin-top:10px; display:block;" hidden>
</div>

<script type="module">
  let defaults = {theme:"light", fontSize:"16px", compact:false};

  function loadSettings() {
    try { return {...defaults, ...JSON.parse(localStorage.newComputer_settings || "{}")}; }
    catch(e) { return {...defaults}; }
  }

  let settings = loadSettings();

  function applySettings() {
    document.body.classList.remove("light","dark","oled");
    document.body.classList.add(settings.theme);
    document.body.style.fontSize = settings.fontSize;
    appCtn.classList.toggle("compact", settings.compact);
    themeSelectEl.value = settings.theme;
    fontSizeSelectEl.value = settings.fontSize;
    compactInput.checked = settings.compact;
  }

  window.saveSettings = function() {
    settings.theme = themeSelectEl.value;
    settings.fontSize = fontSizeSelectEl.value;
    settings.compact = compactInput.checked;
    localStorage.newComputer_settings = JSON.stringify(settings);
    localStorage.newComputer_theme = settings.theme;
    applySettings();
  };

  function rand(min,max) { return Math.floor(Math.random()*(max-min+1))+min; }

  window.refreshDiag = function() {
    cpuEl.textContent = rand(5,95);
    gpuEl.textContent = rand(5,95);
    ramEl.textContent = rand(20,80);
    tempEl.textContent = rand(35,80);
  };

  window.runDiagAI = function() {
    let p = "Analyze these PC diagnostics and give a helpful summary:\nCPU: "+cpuEl.textContent+"%\nGPU: "+gpuEl.textContent+"%\nRAM: "+ramEl.textContent+"%\nTemp: "+tempEl.textContent+"°C\nProvide optimization tips and potential issues.";
    cmdOutputEl.innerHTML = root.generateText(p);
    buildImgEl.hidden = true;
  };

  window.runBuildSuggest = function() {
    let b = prompt("Budget?","1500"), u = prompt("Use case?","gaming");
    let p = "Create a PC build for "+u+" with a budget of $"+b+".\nInclude:\n- CPU\n- GPU\n- RAM\n- Storage\n- PSU\n- Case\n- Estimated FPS\n- Upgrade path\n- Bottleneck analysis";
    cmdOutputEl.innerHTML = root.generateText(p);
    buildImgEl.hidden = true;
  };

  window.runRecommend = function() {
    let c = prompt("Category?","general");
    let p = "Recommend the best software for: "+c+".\nInclude:\n- 5 items\n- Why they are good\n- Download links";
    cmdOutputEl.innerHTML = root.generateText(p);
    buildImgEl.hidden = true;
  };

  window.runGpuPrice = async function() {
    let m = prompt("GPU model?","RTX 4070");
    cmdOutputEl.textContent = "Fetching...";
    try {
      let d = await root.superFetch("https://api.example.com/gpu?model="+encodeURIComponent(m)).then(r=>r.json());
      cmdOutputEl.textContent = d.price ? m+" → $"+d.price : "No price data found.";
    } catch(e) { cmdOutputEl.textContent = "No price data found."; }
    buildImgEl.hidden = true;
  };

  window.runBuildImage = async function() {
    let desc = prompt("Describe the build:","high-end gaming PC with RGB lighting");
    cmdOutputEl.textContent = "Generating image...";
    try {
      buildImgEl.src = await root.generateImage("A detailed render of "+desc+", ultra realistic, studio lighting");
      buildImgEl.hidden = false;
      cmdOutputEl.textContent = "Image generated.";
    } catch(e) { cmdOutputEl.textContent = "Image generation failed."; buildImgEl.hidden = true; }
  };

  window.runSmartDiag = async function() {
    cmdOutputEl.textContent = "Fetching system info...";
    try {
      let sys = await root.superFetch("http://localhost:8080/system-info").then(r=>r.json());
      let p = "Analyze this real system info:\n"+JSON.stringify(sys)+"\nProvide:\n- Summary\n- Issues\n- Fixes\n- Upgrade suggestions";
      cmdOutputEl.innerHTML = root.generateText(p);
    } catch(e) { cmdOutputEl.textContent = "Failed to fetch system info."; }
    buildImgEl.hidden = true;
  };

  applySettings();
  refreshDiag();
</script>

<style>
  body { text-align:left; }
  .light { background:#fff; color:#333; }
  .dark { background:#222; color:#eee; }
  .oled { background:#000; color:#0f0; }
  .compact > div { padding:4px !important; margin-bottom:6px !important; }
</style>
</body>
</html>
