<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>grindr — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#1a1a1a;--bg2:#0f0f0f;--card:#262626;--card2:#333;--accent:#FFCC00;--accent2:#e6b800;--online:#00b934;--text:#fff;--dim:#999;--dim2:#666;--border:#333;--sent:#FFCC00;--recv:#2a2a2a;--danger:#ff4444;--nav:#141414}
html,body{height:100%;background:#000;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent}
body{display:flex;align-items:center;justify-content:center}
.screen{width:100%;max-width:500px;height:100vh;height:100dvh;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;position:relative}
@media(min-width:501px){.screen{height:95vh;max-height:900px;border-radius:16px;border:1px solid #333;box-shadow:0 20px 60px rgba(0,0,0,.5)}}
.logo-big{font-size:42px;font-weight:900;color:var(--accent);text-align:center;letter-spacing:-1px;margin-bottom:8px}
.logo{font-size:22px;font-weight:900;color:var(--accent);letter-spacing:-.5px}
.logo-ai{font-size:10px;vertical-align:super;opacity:.7;margin-left:1px}
.tagline{text-align:center;color:var(--dim);font-size:14px;margin-bottom:28px;line-height:1.5;padding:0 16px}
#onboarding{padding:24px 20px;justify-content:center;overflow-y:auto;-webkit-overflow-scrolling:touch}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:13px;color:var(--dim);margin-bottom:5px;font-weight:600}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:11px;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:15px;font-family:inherit}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--accent)}
.form-group textarea{resize:vertical;min-height:56px}
.tag-picker{display:flex;flex-wrap:wrap;gap:5px}
.tag-chip{padding:5px 11px;background:var(--card);border:1px solid var(--border);border-radius:16px;font-size:12px;cursor:pointer;transition:all .2s;user-select:none}
.tag-chip.selected{background:var(--accent);color:#000;border-color:var(--accent)}
.btn-primary{width:100%;padding:14px;background:var(--accent);color:#000;border:none;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;transition:background .2s}
.btn-primary:hover{background:var(--accent2)}
.btn-primary:active{transform:scale(.98)}
.btn-secondary{width:100%;padding:11px;background:transparent;color:var(--dim);border:1px solid var(--border);border-radius:8px;font-size:14px;cursor:pointer;margin-top:8px;transition:all .2s}
.btn-secondary:hover{background:var(--card)}
#topBar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--bg);border-bottom:1px solid var(--border);flex-shrink:0}
.top-actions{display:flex;gap:4px;align-items:center}
.icon-btn{background:none;border:none;color:var(--dim);font-size:13px;cursor:pointer;padding:6px 8px;border-radius:6px;transition:all .2s;display:flex;align-items:center;gap:3px}
.icon-btn:hover{background:var(--card);color:var(--text)}
#modeBar{display:flex;padding:8px 14px;gap:6px;border-bottom:1px solid var(--border);flex-shrink:0}
.mode-btn{flex:1;padding:7px;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--dim);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
.mode-btn.active{background:var(--accent);color:#000;border-color:var(--accent)}
.mode-btn.rightnow.active{background:#e84545;color:#fff;border-color:#e84545}
.search-bar{padding:6px 14px;flex-shrink:0}
.search-bar input{width:100%;padding:7px 12px;background:var(--card);border:1px solid var(--border);border-radius:20px;color:var(--text);font-size:13px;font-family:inherit}
.search-bar input:focus{outline:none;border-color:var(--accent)}
#content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.view{display:none}
.view.active{display:block}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:2px;padding:2px}
@media(min-width:380px){.grid{grid-template-columns:repeat(3,1fr)}}
.profile-card{position:relative;aspect-ratio:1;background:var(--card);cursor:pointer;overflow:hidden}
.profile-card img{width:100%;height:100%;object-fit:cover;display:block}
.card-info{position:absolute;bottom:0;left:0;right:0;padding:3px 6px;background:linear-gradient(transparent,rgba(0,0,0,.9))}
.card-name{font-size:11px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-dist{font-size:9px;color:rgba(255,255,255,.7)}
.online-dot{position:absolute;top:5px;right:5px;width:8px;height:8px;background:var(--online);border-radius:50%;border:1.5px solid var(--bg)}
.photo-loading{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:var(--card)}
.photo-loading::after{content:'';width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
.photo-loading-lg{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:var(--card)}
.photo-loading-lg::after{content:'';width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loadMoreBtn{margin:16px auto;display:block;width:80%}
#bottomNav{display:flex;justify-content:space-around;padding:5px 0;background:var(--nav);border-top:1px solid var(--border);flex-shrink:0}
.nav-btn{flex:1;background:none;border:none;color:var(--dim2);font-size:9px;cursor:pointer;padding:5px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;transition:color .2s}
.nav-btn svg{width:22px;height:22px;fill:currentColor}
.nav-btn.active{color:var(--accent)}
.nav-badge{position:absolute;top:0;right:50%;margin-right:-18px;background:var(--danger);color:#fff;font-size:9px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:var(--bg);z-index:100;overflow-y:auto;display:flex;flex-direction:column;-webkit-overflow-scrolling:touch}
.slide-right{animation:slideR .3s ease}
@keyframes slideR{from{transform:translateX(100%)}to{transform:translateX(0)}}
.slide-up{animation:slideU .3s ease}
@keyframes slideU{from{transform:translateY(100%)}to{transform:translateY(0)}}
.overlay-header{display:flex;align-items:center;padding:10px 12px;background:var(--bg);border-bottom:1px solid var(--border);flex-shrink:0;gap:8px;position:sticky;top:0;z-index:10}
.back-btn{background:none;border:none;color:var(--accent);font-size:22px;cursor:pointer;padding:4px 8px;line-height:1}
.overlay-title{font-size:16px;font-weight:700}
.detail-photo{width:100%;height:380px;background:var(--card);overflow:hidden;position:relative;flex-shrink:0}
.detail-photo img{width:100%;height:100%;object-fit:cover}
.detail-body{padding:14px}
.detail-name{font-size:22px;font-weight:800;margin-bottom:3px}
.detail-status{font-size:12px;margin-bottom:2px}
.detail-status .online{color:var(--online)}
.detail-status .offline{color:var(--dim)}
.detail-dist{font-size:12px;color:var(--dim);margin-bottom:14px}
.detail-actions{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.btn-action{flex:1;min-width:65px;padding:9px;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;text-align:center}
.btn-action:hover{background:var(--card2)}
.btn-action.primary{background:var(--accent);color:#000;border-color:var(--accent)}
.btn-action.primary:hover{background:var(--accent2)}
.btn-action.active{background:var(--accent);color:#000;border-color:var(--accent)}
.btn-action.danger{color:var(--danger)}
.compat{margin-bottom:14px}
.compat-label{font-size:12px;color:var(--dim);margin-bottom:3px}
.compat-bar{height:6px;background:var(--card);border-radius:3px;overflow:hidden}
.compat-fill{height:100%;background:linear-gradient(90deg,#e84545,#FFCC00,#00b934);border-radius:3px;transition:width .5s}
.detail-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px}
.stat{background:var(--card);padding:9px;border-radius:8px}
.stat-label{display:block;font-size:10px;color:var(--dim);margin-bottom:2px;text-transform:uppercase;letter-spacing:.3px}
.stat-value{display:block;font-size:13px;font-weight:600}
.detail-section{margin-bottom:14px}
.detail-section h3{font-size:12px;color:var(--dim);margin-bottom:7px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.detail-section p{font-size:14px;line-height:1.5}
.tag-list{display:flex;flex-wrap:wrap;gap:5px}
.tag{padding:3px 9px;background:var(--card);border:1px solid var(--border);border-radius:12px;font-size:11px;color:var(--dim)}
.tag.accent{background:rgba(255,204,0,.1);border-color:var(--accent);color:var(--accent)}
.tag.nsfw{background:rgba(232,69,69,.1);border-color:#e84545;color:#e84545}
.album-locked{text-align:center;padding:20px;color:var(--dim);font-size:13px;background:var(--card);border-radius:8px}
.album-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.album-photo{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;cursor:pointer}
.album-slot{width:100%;aspect-ratio:3/4;background:var(--card);border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;color:var(--dim);cursor:pointer;transition:all .2s}
.album-slot:hover{background:var(--card2)}
.chat-header{display:flex;align-items:center;padding:8px 10px;background:var(--bg);border-bottom:1px solid var(--border);flex-shrink:0;gap:8px}
.chat-header img{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--card)}
.chat-header-info{flex:1;min-width:0}
.chat-header-name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.chat-header-status{font-size:11px;color:var(--online)}
.chat-header-status.offline{color:var(--dim)}
.chat-messages{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:5px;-webkit-overflow-scrolling:touch}
.message{max-width:75%;padding:7px 11px;border-radius:16px;font-size:14px;line-height:1.4;word-wrap:break-word;white-space:pre-wrap}
.message.sent{align-self:flex-end;background:var(--sent);color:#000;border-bottom-right-radius:4px}
.message.received{align-self:flex-start;background:var(--recv);color:var(--text);border-bottom-left-radius:4px}
.message.photo-msg{padding:3px;max-width:60%;background:none}
.message.photo-msg img{width:100%;border-radius:12px;display:block;cursor:pointer}
.typing-dots{display:flex;gap:3px;padding:4px 0}
.typing-dots span{width:7px;height:7px;border-radius:50%;background:var(--dim);animation:typing 1.4s infinite}
.typing-dots span:nth-child(2){animation-delay:.2s}
.typing-dots span:nth-child(3){animation-delay:.4s}
@keyframes typing{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
.quick-replies{display:flex;gap:5px;padding:5px 10px;overflow-x:auto;flex-shrink:0}
.quick-reply{padding:5px 11px;background:var(--card);border:1px solid var(--border);border-radius:16px;font-size:12px;color:var(--text);cursor:pointer;white-space:nowrap;transition:all .2s}
.quick-reply:hover{background:var(--card2)}
.chat-input-area{display:flex;align-items:flex-end;padding:7px 10px;gap:5px;background:var(--bg);border-top:1px solid var(--border);flex-shrink:0}
.chat-input-area textarea{flex:1;padding:9px 12px;background:var(--card);border:1px solid var(--border);border-radius:20px;color:var(--text);font-size:14px;font-family:inherit;resize:none;max-height:100px;min-height:38px}
.chat-input-area textarea:focus{outline:none;border-color:var(--accent)}
.chat-icon-btn{background:var(--card);border:1px solid var(--border);border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--dim);cursor:pointer;font-size:15px;flex-shrink:0;transition:all .2s}
.chat-icon-btn:hover{background:var(--card2);color:var(--text)}
.send-btn{background:var(--accent);border:none;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:#000;cursor:pointer;font-size:15px;flex-shrink:0;transition:all .2s}
.send-btn:hover{background:var(--accent2)}
.send-btn:disabled{opacity:.4;cursor:not-allowed}
.inbox-item{display:flex;align-items:center;padding:11px 14px;border-bottom:1px solid var(--border);cursor:pointer;gap:10px;transition:background .2s}
.inbox-item:hover{background:var(--card)}
.inbox-item img{width:46px;height:46px;border-radius:50%;object-fit:cover;background:var(--card);flex-shrink:0}
.inbox-item img.placeholder{display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--dim)}
.inbox-item-info{flex:1;min-width:0}
.inbox-item-top{display:flex;justify-content:space-between;align-items:center}
.inbox-item-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inbox-item-time{font-size:10px;color:var(--dim);flex-shrink:0;margin-left:8px}
.inbox-item-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:2px}
.inbox-item-preview{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.inbox-unread{background:var(--accent);color:#000;font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 5px;flex-shrink:0;margin-left:6px}
.empty-state{text-align:center;padding:50px 24px;color:var(--dim)}
.empty-state-icon{font-size:44px;margin-bottom:10px}
.empty-state-text{font-size:14px;line-height:1.5}
.my-profile-header{text-align:center;padding:20px 16px}
.my-profile-photo{width:90px;height:90px;border-radius:50%;margin:0 auto 10px;object-fit:cover;background:var(--card);display:block}
.my-profile-photo-placeholder{width:90px;height:90px;border-radius:50%;margin:0 auto 10px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:36px}
.my-profile-name{font-size:20px;font-weight:800}
.my-profile-sub{font-size:13px;color:var(--dim);margin-top:3px}
.profile-section{padding:14px;border-top:8px solid var(--bg2)}
.profile-section h3{font-size:12px;color:var(--dim);margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}
.stats-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.stat-card{background:var(--card);padding:10px 6px;border-radius:8px;text-align:center}
.stat-card-value{font-size:20px;font-weight:800;color:var(--accent)}
.stat-card-label{font-size:10px;color:var(--dim);margin-top:2px}
.filters-content{padding:16px}
.filter-group{margin-bottom:18px}
.filter-group h4{font-size:14px;margin-bottom:7px;color:var(--text)}
.filter-range{display:flex;gap:8px;align-items:center}
.filter-range input[type=range]{flex:1;accent-color:var(--accent)}
.filter-range span{font-size:12px;color:var(--dim);min-width:36px;text-align:right}
.filter-toggle{display:flex;align-items:center;justify-content:space-between;padding:7px 0}
.toggle-switch{width:42px;height:23px;background:var(--card);border-radius:12px;position:relative;cursor:pointer;transition:background .2s;border:1px solid var(--border)}
.toggle-switch.on{background:var(--accent);border-color:var(--accent)}
.toggle-switch::after{content:'';position:absolute;top:2px;left:2px;width:17px;height:17px;background:#fff;border-radius:50%;transition:transform .2s}
.toggle-switch.on::after{transform:translateX(19px)}
#toast{position:absolute;bottom:68px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.92);color:#fff;padding:9px 18px;border-radius:20px;font-size:12px;z-index:1000;pointer-events:none;opacity:0;transition:opacity .3s;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1}
.city-list,.scene-list,.report-options{padding:14px}
.city-item,.scene-item,.report-option{padding:12px 14px;background:var(--card);border:1px solid var(--border);border-radius:8px;margin-bottom:7px;cursor:pointer;font-size:14px;transition:all .2s}
.city-item:hover,.scene-item:hover,.report-option:hover{background:var(--card2)}
.city-item.active{border-color:var(--accent);color:var(--accent)}
.scene-item-title{font-size:14px;font-weight:600;margin-bottom:3px}
.scene-item-desc{font-size:12px;color:var(--dim);line-height:1.4}
#photoViewer{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.97);z-index:2000;display:none;align-items:center;justify-content:center;flex-direction:column}
#photoViewer.active{display:flex}
#photoViewer img{max-width:95%;max-height:85%;border-radius:8px}
#photoViewer .close-btn{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.1);border:none;color:#fff;font-size:22px;cursor:pointer;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%}
.loading-spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin-top:14px}
.scene-badge{display:inline-block;padding:2px 8px;background:rgba(232,69,69,.15);border:1px solid #e84545;color:#e84545;border-radius:10px;font-size:10px;margin-bottom:8px}
</style>

<div id="onboarding" class="screen">
  <div id="loadingScreen" class="loading-screen">
    <div class="logo-big">Grindr<span class="logo-ai">AI</span></div>
    <div class="loading-spinner"></div>
  </div>
  <div id="onboardingForm" hidden>
    <div class="logo-big">Grindr<span class="logo-ai">AI</span></div>
    <p class="tagline">The world's #1 free dating app for the GBTQ community. Chat with AI characters, flirt, and see where the night takes you.</p>
    <div class="form-group">
      <label>Display Name</label>
      <input type="text" id="obName" placeholder="Your name" maxlength="20">
    </div>
    <div class="form-group">
      <label>Age</label>
      <input type="number" id="obAge" placeholder="18" min="18" max="99" value="25">
    </div>
    <div class="form-group">
      <label>Position</label>
      <select id="obPosition">
        <option>Top</option><option>Bottom</option><option selected>Versatile</option>
        <option>Vers Top</option><option>Vers Bottom</option><option>Side</option>
        <option>Switch</option><option>Submissive</option><option>Dominant</option>
        <option>Power Bottom</option><option>Power Top</option>
      </select>
    </div>
    <div class="form-group">
      <label>Tribe</label>
      <select id="obTribe">
        <option>Twink</option><option>Transgender</option><option>Trans Woman</option><option>Trans Man</option><option>Non-Binary</option><option>Femboy</option><option>Sissy</option><option>Crossdresser</option><option>Bear</option><option>Jock</option><option>Otter</option>
        <option>Daddy</option><option>Cub</option><option>Geek</option><option>Leather</option>
        <option>Rugged</option><option selected>Clean-Cut</option><option>Wolf</option><option>Drag Queen</option><option>Genderfluid</option><option>Agender</option><option>Two-Spirit</option><option>Androgynous</option><option>Tomgirl</option><option>Pup</option><option>Punk</option><option>Skater</option><option>Hipster</option>
      </select>
    </div>
    <div class="form-group">
      <label>Pronouns</label>
      <select id="obPronouns">
        <option>he/him</option><option>she/her</option><option>they/them</option><option>he/they</option><option>she/they</option><option>any/all</option>
      </select>
    </div>
    <div class="form-group">
      <label>Bio</label>
      <textarea id="obBio" placeholder="Tell people about yourself..." maxlength="200"></textarea>
    </div>
    <div class="form-group">
      <label>Interests (tap to select)</label>
      <div class="tag-picker" id="obTags"></div>
    </div>
    <div class="form-group">
      <label>Looking For (tap to select)</label>
      <div class="tag-picker" id="obLooking"></div>
    </div>
    <button class="btn-primary" id="startBtn">Enter Grindr</button>
    <button class="btn-secondary" id="quickStartBtn">⚡ Quick Start</button>
  </div>
</div>

<div id="app" class="screen" hidden>
  <div id="topBar">

function formatTime(ts) {
  const diff = Date.now() - ts;
  const m = Math.floor(diff / 60000);
  if (m < 1) return 'now';
  if (m < 60) return m + 'm';
  const h = Math.floor(m / 60);
  if (h < 24) return h + 'h';
  return Math.floor(h / 24) + 'd';
}

const imageQueue = {
  queue: [], active: 0, max: CONFIG.maxConcurrentImages,
  add(task) { this.queue.push(task); this.next(); },
  async next() {
    if (this.active >= this.max || this.queue.length === 0) return;
    this.active++;
    const task = this.queue.shift();
    try { await task.fn(); } catch(e) { console.error('Image error:', e); if (task.onError) task.onError(e); }
    finally { this.active--; this.next(); }
  }
};

function queuePhoto(profile) {
  if (profile.photo || profile.photoLoading) return;
  profile.photoLoading = true;
  imageQueue.add({
    id: profile.id,
    fn: async () => {
      if (typeof root === 'undefined' || !root.generateImage) { profile.photoLoading = false; return; }
      const result = await root.generateImage(buildPhotoPrompt(profile), {
        resolution: "512x768",
        negativePrompt: "ugly, deformed, bad quality, blurry, cartoon, anime, illustration, child, minor, old"
      });
      profile.photo = result.dataUrl || (result.canvas && result.canvas.toDataURL());
      profile.photoLoading = false;
      updateCardPhoto(profile.id);
      updateDetailPhoto(profile.id);
      updateChatHeader(profile.id);
    },
    onError: () => { profile.photoLoading = false; }
  });
}

function queueAlbumPhoto(profile, index) {
  if (profile.privateAlbum[index]) return;
  imageQueue.add({
    id: profile.id + '_album_' + index,
    fn: async () => {
      if (typeof root === 'undefined' || !root.generateImage) return;
      const suggestive = index === 0 ? true : (index === 1 ? true : true);

      profile.privateAlbum[index] = result.dataUrl || (result.canvas && result.canvas.toDataURL());

    }
  });
}

async function sendMessage() {
  const input = document.getElementById('chatInput');
  if (!input) return;
  const text = input.value.trim();
  if (!text || state.aiResponding) return;
  const id = state.currentChatId;
  const p = getProfile(id);
  if (!p) return;
  const conv = state.conversations[id];
  if (!conv) return;

  conv.messages.push({ role: 'user', text, time: Date.now() });
  conv.lastMessage = text;
  conv.lastMessageTime = Date.now();
  state.stats.messages++;
  input.value = '';
  input.style.height = 'auto';

  const messagesEl = document.getElementById('chatMessages');
  const quickReplies = document.querySelector('.quick-replies');
  if (quickReplies) quickReplies.remove();
  messagesEl.insertAdjacentHTML('beforeend', `<div class="message sent">${escapeHtml(text)}</div>`);
  scrollChatToBottom();

  state.aiResponding = true;
  document.getElementById('sendBtn').disabled = true;
  messagesEl.insertAdjacentHTML('beforeend', '<div class="message received" id="typingMsg"><div class="typing-dots"><span></span><span></span><span></span></div></div>');
  scrollChatToBottom();

  try {
    const prompt = buildChatPrompt(p, conv.messages, text);
    let responseText = '';
    const result = await root.generateText({
      instruction: prompt,
      stopSequences: [`\n${state.myProfile.name}:`, '\n\n\n'],
      onChunk: (data) => {
        responseText += data.textChunk;
        const el = document.getElementById('typingMsg');
        if (el) { el.textContent = responseText; scrollChatToBottom(); }
      }
    });
    const finalText = (typeof result === 'string' ? result : responseText).trim() || '...';
    const typingEl = document.getElementById('typingMsg');
    if (typingEl) typingEl.outerHTML = `<div class="message received">${escapeHtml(finalText)}</div>`;
    conv.messages.push({ role: 'them', text: finalText, time: Date.now() });
    conv.lastMessage = finalText;
    conv.lastMessageTime = Date.now();
    extractMemory(text, finalText);

    if (conv.messages.length >= CONFIG.unlockThreshold && !p.albumUnlocked) {
      p.albumUnlocked = true;
      showToast(p.name + ' unlocked their private album 🔓');
      if (state.currentProfileId === id) renderProfileDetail(p);
    }
    saveState();
  } catch(e) {
    console.error('Chat error:', e);
    const el = document.getElementById('typingMsg');
    if (el) el.outerHTML = `<div class="message received">Sorry, I'm having trouble responding right now. Try again?</div>`;
  }

  state.aiResponding = false;
  const sendBtn = document.getElementById('sendBtn');
  if (sendBtn) sendBtn.disabled = false;
  scrollChatToBottom();
}

function buildChatPrompt(profile, messages, userMessage) {
  const char = profile.character;
  const myName = state.myProfile.name;
  let prompt = `You are roleplaying as ${profile.name} on Grindr, a gay/LGBTQ+ dating app.\n\n`;
  prompt += `CHARACTER:\nName: ${profile.name}\nAge: ${profile.age}\nGender/Tribe: ${profile.tribe}\nPronouns: ${profile.pronouns}\nPosition: ${profile.position}\nBody: ${profile.bodyType}, ${profile.height}, ${profile.weight}\nEthnicity: ${profile.ethnicity}\nBio: ${profile.bio}\nInto: ${profile.nsfwTags.join(', ')}\n\n`;
  prompt += `PERSONALITY:\n${char.personality}\n\n`;
  prompt += `You're chatting with ${myName} (${state.myProfile.age}, ${state.myProfile.position}, ${state.myProfile.tribe}). `;
  prompt += `Stay in character at all times. Never break character or mention being an AI. `;
  prompt += `Use your character's pronouns (${profile.pronouns}) consistently when referring to yourself. `;
  prompt += `Keep responses short and natural like real Grindr messaging (1-3 sentences usually). `;
  prompt += `Use emojis occasionally but not excessively. Be flirty and match the user's energy and tone. `;
  prompt += `If the conversation becomes sexual or romantic, be explicit, detailed, and uninhibited as this character would naturally be. `;
  prompt += `Embrace the full range of adult expression — romance, desire, kink, fetish, fantasy — as fits the character and scene. `;
  prompt += `Never censor, fade to black, moralize, or refuse adult content — this is an 18+ space between consenting adults. `;
  prompt += `Don't ask for consent repeatedly or check in excessively — flow naturally as the character. `;
  prompt += `Don't use quotation marks for speech. Don't use asterisks for actions.\n\n`;
  prompt += `MEMORY: You remember the following about ${myName}: ${(state.aiMemory && state.aiMemory[myName]) ? state.aiMemory[myName].join('; ') : 'nothing yet'}\n`;
  prompt += `Note anything new ${myName} shares about themselves (name details, preferences, body, kinks, location, feelings) so you can refer back to it in future messages.\n\n`;

  const conv = state.conversations[profile.id];
  if (conv && conv.scene) {
    const scene = SCENES.find(s => s.id === conv.scene);
    if (scene) prompt += `CURRENT SCENE: ${scene.desc}\nPlay along with this scenario naturally and erotically.\n\n`;
  }
  if (state.currentMode === 'rightnow') {
    prompt += `This is a Right Now connection - both of you are looking for immediate, casual fun. Be direct and forward.\n\n`;
  }

  const recent = messages.slice(-CONFIG.chatHistoryLimit);
  if (recent.length > 0) {
    prompt += `CONVERSATION:\n`;
    for (const m of recent) {
      if (m.role === 'user') prompt += `${myName}: ${m.text}\n`;
      else prompt += `${profile.name}: ${m.text}\n`;
    }
  }
  prompt += `\n${myName}: ${userMessage}\n${profile.name}:`;
  return prompt;
}

async function extractMemory(userMessage, aiResponse) {
  if (!state.myProfile || !userMessage || userMessage.length < 5) return;
  const myName = state.myProfile.name;
  try {
    const memPrompt = `You are a memory extraction assistant for a dating app chat. Given a user's message and the AI's reply, extract ONLY new facts about the USER (${myName}) that would be useful to remember for future conversations. Focus on: name, age, location, job, physical details they share, sexual preferences, kinks, relationship status, interests, emotional state, and personal history. Return as a concise bullet list (max 5 items), each a short factual sentence. If nothing worth remembering, return "none". Do not include facts about the AI character. Do not include greetings or small talk.\n\nUser said: "${userMessage}"\nAI replied: "${aiResponse}"\n\nFacts about ${myName} to remember:`;
    const result = await root.generateText({
      instruction: memPrompt,
      stopSequences: ["\n\n"]
    });
    const text = (typeof result === 'string' ? result : '').trim();
    if (!text || text.toLowerCase().startsWith('none')) return;
    if (!state.aiMemory) state.aiMemory = {};
    if (!state.aiMemory[myName]) state.aiMemory[myName] = [];
    const facts = text.split('\n').map(f => f.replace(/^[\s•\-*\d.\)]+/, '').trim()).filter(f => f.length > 3 && f.toLowerCase() !== 'none');
    for (const fact of facts) {
      if (!state.aiMemory[myName].some(existing => existing.toLowerCase() === fact.toLowerCase())) {
        state.aiMemory[myName].push(fact);
      }
    }
    if (state.aiMemory[myName].length > 30) state.aiMemory[myName] = state.aiMemory[myName].slice(-30);
    persistKv('aiMemory', state.aiMemory);
  } catch(e) { console.error('Memory extraction error:', e); }
}

async function requestPhoto(id) {
  const p = getProfile(id);

  const conv = state.conversations[id];

  state.stats.photos++;
  try {
    if (typeof root === 'undefined' || !root.generateImage) { showToast('Photo feature unavailable'); return; }
    const result = await root.generateImage(buildPhotoPrompt(p, true), {
      resolution: "512x768",
      negativePrompt: "ugly, deformed, bad quality, blurry, cartoon, anime, illustration, child, minor"
    });
    const photo = result.dataUrl || (result.canvas && result.canvas.toDataURL());
    conv.messages.push({ role: 'them', text: '', photo, time: Date.now() });
    conv.lastMessage = '📷 Photo';
    conv.lastMessageTime = Date.now();
    if (state.currentChatId === id) {
      const messagesEl = document.getElementById('chatMessages');
      messagesEl.insertAdjacentHTML('beforeend', `<div class="message received photo-msg"><img src="${photo}" onclick="viewPhoto('${photo}')"></div>`);

  } catch(e) {

}

const kvReady = () => typeof root !== 'undefined' && root.kv;
let kvSaving = false;

async function persistKv(key, value) {
  if (!kvReady()) return;
  try {
    await root.kv.grindr.set(key, value);
  } catch(e) { console.error('kv save error ('+key+'):', e); }
}

async function loadKv(key, fallback) {
  if (!kvReady()) return fallback;
  try {
    const val = await root.kv.grindr.get(key);
    return val === undefined ? fallback : val;
  } catch(e) { console.error('kv load error ('+key+'):', e); return fallback; }
}

async function saveToKv() {
  if (!kvReady() || kvSaving) return;
  kvSaving = true;
  try {
    const saveable = {
      favorites: [...state.favorites],
      blocked: [...state.blocked],
      viewed: [...state.viewed],
      viewedMe: [...state.viewedMe],
      tapsReceived: state.tapsReceived,
      myProfile: state.myProfile,
      city: state.city,
      filters: state.filters,
      stats: state.stats,
      aiMemory: state.aiMemory || {},
      conversations: {}
    };
    for (const [id, conv] of Object.entries(state.conversations)) {
      saveable.conversations[id] = {
        messages: conv.messages.map(m => ({ role: m.role, text: m.text, time: m.time, photo: m.photo ? '(photo)' : undefined })),
        lastMessage: conv.lastMessage,
        lastMessageTime: conv.lastMessageTime,
        unread: 0,
        scene: conv.scene
      };
    }
    await root.kv.grindr.set('appState', saveable);
  } catch(e) { console.error('kv save error:', e); }
  finally { kvSaving = false; }
}

async function loadFromKv() {
  if (!kvReady()) return null;
  try {
    const saved = await root.kv.grindr.get('appState');
    return saved || null;
  } catch(e) { console.error('kv load error:', e); return null; }
}

function saveState() {
  try {
    const saveable = {
      favorites: [...state.favorites],
      blocked: [...state.blocked],
      viewed: [...state.viewed],
      viewedMe: [...state.viewedMe],
      tapsReceived: state.tapsReceived,
      myProfile: state.myProfile,
      city: state.city,
      filters: state.filters,
      stats: state.stats,
      conversations: {}
    };
    for (const [id, conv] of Object.entries(state.conversations)) {
      saveable.conversations[id] = {
        messages: conv.messages.map(m => ({ role: m.role, text: m.text, time: m.time, photo: m.photo ? '(photo)' : undefined })),
        lastMessage: conv.lastMessage,
        lastMessageTime: conv.lastMessageTime,
        unread: 0,
        scene: conv.scene
      };
    }
    localStorage.setItem('grindr_state', JSON.stringify(saveable));
    saveToKv();
  } catch(e) { console.error('Save error:', e); }
}

async function loadState() {
  let saved = null;
  if (kvReady()) {
    saved = await loadFromKv();
  }
  if (!saved) {
    try { saved = JSON.parse(localStorage.getItem('grindr_state')); } catch(e) {}
  }
  if (!saved) return false;
  try {
    state.favorites = new Set(saved.favorites || []);
    state.blocked = new Set(saved.blocked || []);
    state.viewed = new Set(saved.viewed || []);
    state.viewedMe = new Set(saved.viewedMe || []);
    state.tapsReceived = saved.tapsReceived || [];
    state.myProfile = saved.myProfile;
    state.city = saved.city || 'Your Area';
    state.filters = saved.filters || state.filters;
    state.stats = saved.stats || state.stats;
    state.aiMemory = saved.aiMemory || {};
    if (saved.conversations) {
      for (const [id, conv] of Object.entries(saved.conversations)) {
        state.conversations[id] = { ...conv, unread: 0 };
      }
    }
    document.getElementById('cityName').textContent = state.city;
    return !!state.myProfile;
  } catch(e) { console.error('Load error:', e); return false; }
}

function startEvents() {
  setTimeout(() => {
    const onlineProfiles = state.profiles.filter(p => !p.online);
    if (onlineProfiles.length > 0) {
      const p = rand(onlineProfiles);
      p.online = true;
      if (state.currentView === 'cascade') renderGrid();
    }
  }, 15000);

  setInterval(() => {
    const r = Math.random();
    if (r < 0.12) {
      const available = state.profiles.filter(p => !state.blocked.has(p.id) && !state.tapsReceived.includes(p.id));
      if (available.length > 0) {
        const p = rand(available);
        state.tapsReceived.push(p.id);
        showToast(`🔥 ${p.name} tapped you`);
        if (!state.conversations[p.id]) {
          state.conversations[p.id] = { messages: [{ role: 'them', text: '🔥', time: Date.now() }], lastMessage: '🔥', lastMessageTime: Date.now(), unread: 1, scene: null };
          state.stats.chats++;
        } else {
          state.conversations[p.id].messages.push({ role: 'them', text: '🔥', time: Date.now() });
          state.conversations[p.id].lastMessage = '🔥';
          state.conversations[p.id].lastMessageTime = Date.now();
          state.conversations[p.id].unread++;
        }
        updateInboxBadge();
        saveState();
      }
    } else if (r < 0.20) {
      const available = state.profiles.filter(p => !state.blocked.has(p.id) && !state.viewedMe.has(p.id));
      if (available.length > 0) {
        state.viewedMe.add(rand(available).id);
        updateInboxBadge();
      }
    } else if (r < 0.25) {
      const offline = state.profiles.filter(p => !p.online);
      if (offline.length > 0) {
        rand(offline).online = true;
        if (state.currentView === 'cascade') renderGrid();
      }
    }
  }, 25000);
}

  const obTags = document.getElementById('obTags');

  document.querySelectorAll('#obTags .tag-chip, #obLooking .tag-chip').forEach(c => {

  });

  document.getElementById('startBtn').onclick = () => {
    const name = document.getElementById('obName').value.trim() || 'Anonymous';
    const age = parseInt(document.getElementById('obAge').value) || 25;
    if (age < 18) { showToast('You must be 18+ to use Grindr'); return; }
    const position = document.getElementById('obPosition').value;
    const tribe = document.getElementById('obTribe').value;
    const pronouns = document.getElementById('obPronouns').value;
    const bio = document.getElementById('obBio').value.trim();
    const tags = [...document.querySelectorAll('#obTags .tag-chip.selected')].map(c => c.dataset.tag);
    const lookingFor = [...document.querySelectorAll('#obLooking .tag-chip.selected')].map(c => c.dataset.tag);

    enterApp();
  };

  document.getElementById('quickStartBtn').onclick = () => {
    const names = ['Alex','Sam','Jordan','Chris','Riley','Tyler'];
    state.myProfile = {
      name: rand(names), age: randInt(22, 32), position: rand(POSITIONS), tribe: rand(TRIBES), pronouns: rand(["he/him","she/her","they/them"]),
      bio: rand(["Just here for a good time, not a long time 😏","New to the area, show me around?","Looking for genuine connections and fun.","Ask me anything 🤷"]),
      tags: [...INTEREST_TAGS].sort(() => Math.random() - 0.5).slice(0, 5),
      lookingFor: ["Chat","Dates","Fun"], photo: null, createdAt: Date.now()

    document.getElementById('obName').value = state.myProfile.name;
    saveState();
    enterApp();

    setTimeout(() => generateMyPhoto(), 2000);

function init() {
  document.getElementById('loadingScreen').hidden = false;
  setTimeout(() => {
    document.getElementById('loadingScreen').hidden = true;
    document.getElementById('onboardingForm').hidden = false;
  }, 800);

  initOnboarding();

  (async () => {
    const hasSaved = await loadState();
    if (hasSaved && state.myProfile) {
      document.getElementById('onboarding').hidden = true;
      document.getElementById('app').hidden = false;
      generateProfiles(CONFIG.profilesPerPage);
      renderGrid();
      startEvents();
      updateInboxBadge();
    }
  })();

  document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.onclick = () => navigate(btn.dataset.view);
  });

  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.onclick = () => setMode(btn.dataset.mode);
  });

  document.getElementById('grid').addEventListener('click', (e) => {
    const card = e.target.closest('.profile-card');
    if (card) openProfileDetail(card.dataset.id);
  });

  document.getElementById('favoritesGrid').addEventListener('click', (e) => {
    const card = e.target.closest('.profile-card');
    if (card) openProfileDetail(card.dataset.id);
  });

  document.getElementById('inboxList').addEventListener('click', (e) => {
    const item = e.target.closest('.inbox-item');
    if (item) openChat(item.dataset.id || item.querySelector('[data-id]')?.dataset.id);
  });

  document.getElementById('inboxList').addEventListener('click', (e) => {
    const item = e.target.closest('.inbox-item');
    if (item) {
      const id = item.dataset.id;
      if (id) openChat(id);
    }
  }, true);

  document.getElementById('filterBtn').onclick = showFilters;
  document.getElementById('cityBtn').onclick = showCities;
  document.getElementById('refreshBtn').onclick = refreshGrid;
  document.getElementById('loadMoreBtn').onclick = () => {
    generateProfiles(CONFIG.profilesPerPage);
    renderGrid();
    showToast('Loaded more profiles');
  };

  let searchTimer;
  document.getElementById('searchInput').addEventListener('input', (e) => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      state.searchQuery = e.target.value;
      renderGrid();
    }, 300);
  });

  document.getElementById('photoViewer').onclick = (e) => {
    if (e.target === document.getElementById('photoViewer') || e.target.classList.contains('close-btn')) {
      document.getElementById('photoViewer').classList.remove('active');
    }
  };
}

window.openProfileDetail = openProfileDetail;
window.openChat = openChat;
window.toggleFavorite = toggleFavorite;
window.tapProfile = tapProfile;
window.showReport = showReport;
window.doReport = doReport;
window.blockProfile = blockProfile;
window.sendMessage = sendMessage;
window.sendQuickReply = sendQuickReply;
window.requestPhoto = requestPhoto;
window.showScenes = showScenes;
window.setScene = setScene;
window.clearScene = clearScene;
window.viewPhoto = viewPhoto;
window.showFilters = showFilters;
window.applyFilters = applyFilters;
window.clearFilters = clearFilters;
window.showCities = showCities;
window.setCity = setCity;
window.showEditProfile = showEditProfile;
window.saveEditProfile = saveEditProfile;
window.generateMyPhoto = generateMyPhoto;
window.resetApp = resetApp;
window.clearMemory = clearMemory;
window.renderTagPicker = renderTagPicker;
window.queueAlbumPhoto = queueAlbumPhoto;
window.getProfile = getProfile;

init();
</script>
