// ---- note-name → frequency ----
const _NOTE_SEMI = { C:0, D:2, E:4, F:5, G:7, A:9, B:11 };
function noteFreq(name) {
  const m = String(name).match(/^([A-G])(#|b)?(-?\d)$/);
  if (!m) return 440;
  let semis = _NOTE_SEMI[m[1]];
  if (m[2] === "#") semis++; else if (m[2] === "b") semis--;
  const midi = semis + (parseInt(m[3], 10) + 1) * 12;
  return 440 * Math.pow(2, (midi - 69) / 12);
}
function resolveChord(c) {
  return { name: c.name, bass: noteFreq(c.bass), tones: c.tones.map(noteFreq) };
}

// ---- per-song timing (current song) ----
let curSong = SONGS[0];
let curProg = [];   // resolved chords
let curLead = [];
let BEAT, SIXTEENTH, SONG_LEN;
function applySong(song) {
  curSong = song;
  curProg = song.prog.map(resolveChord);
  curLead = (song.lead || []).map(noteFreq);
  BEAT = 60 / song.bpm;
  SIXTEENTH = BEAT / 4;
  SONG_LEN = song.bars * 4 * BEAT;
}
applySong(curSong);

  return groups;

// ---------------- Audio engine (synthesized groove) ----------------
let audioCtx = null, masterGain = null, compGain = null;
let userAudioEl = null, useUserAudio = false;
let clockOffset = 0; // performance.now baseline so songTime() starts at ~0
let schedTimer = null, schedStep = 0;

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.9;
  compGain = audioCtx.createGain();
  compGain.gain.value = 0.85;
  masterGain.connect(compGain).connect(audioCtx.destination);
}

function noiseBurst(time, dur, hp, vol) {
  const n = Math.floor(audioCtx.sampleRate * dur);
  const buf = audioCtx.createBuffer(1, n, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < n; i++) data[i] = (Math.random()*2-1) * (1 - i/n);
  const src = audioCtx.createBufferSource(); src.buffer = buf;
  const f = audioCtx.createBiquadFilter(); f.type = "highpass"; f.frequency.value = hp;
  const g = audioCtx.createGain(); g.gain.value = vol;
  src.connect(f).connect(g).connect(masterGain);
  src.start(time); src.stop(time + dur);
}

function tone(time, freq, dur, type, vol, attack, filterHz) {
  const o = audioCtx.createOscillator(); o.type = type; o.frequency.value = freq;
  const g = audioCtx.createGain();
  const f = audioCtx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = filterHz || 4000;
  g.gain.setValueAtTime(0, time);
  g.gain.linearRampToValueAtTime(vol, time + (attack||0.01));
  g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
  o.connect(g).connect(f).connect(masterGain);
  o.start(time); o.stop(time + dur + 0.05);
}

const SWING = 0.62; // 0.5 = straight, >0.5 = swung

// boss-fight sections (used by arrangement + chart density)
const SEC_INTRO=0, SEC_MAIN=1, SEC_INTENSIFY=2, SEC_CLIMAX=3, SEC_BREAKDOWN=4, SEC_FINAL=5, SEC_OUTRO=6;
function sectionFor(bar) {
  if (bar < 4) return SEC_INTRO;
  if (bar < 12) return SEC_MAIN;
  if (bar < 16) return SEC_INTENSIFY;
  if (bar < 24) return SEC_CLIMAX;
  if (bar < 28) return SEC_BREAKDOWN;
  if (bar < 36) return SEC_FINAL;
  return SEC_OUTRO;
}
// deterministic pseudo-random per step (so the arrangement is "non-repeating" but stable)
function stepRand(step, salt) {
  const x = Math.sin((step * 73.13 + salt * 131.7) * 0.012345) * 43758.5453;
  return x - Math.floor(x);
}

function scheduleStep(step, time) {
  const bar = Math.floor(step / 16);
  const inBar = step % 16;
  const chord = curProg[bar % curProg.length];
  const style = curSong.style;

  if (style === "jazz-chill") {
    jazzChillStep(step, bar, inBar, chord, time);
  } else if (style === "boss-fight") {
    bossStep(step, bar, inBar, chord, time);
  } else if (style === "heavenly") {
    heavenlyStep(step, bar, inBar, chord, time);
  } else if (style === "mech-jazz") {
    mechJazzStep(step, bar, inBar, chord, time);
  } else if (style === "harlem-boss") {
    harlemBossStep(step, bar, inBar, chord, time);
  } else if (style === "synthwave") {
    synthwaveStep(step, bar, inBar, chord, time);
  } else if (style === "vaporwave") {
    vaporwaveStep(step, bar, inBar, chord, time);
  } else if (style === "ethereal-dark") {
    etherealDarkStep(step, bar, inBar, chord, time);
  } else if (style === "oni-demon") {
    oniDemonStep(step, bar, inBar, chord, time);
  } else if (style === "samurai-duel") {
    samuraiDuelStep(step, bar, inBar, chord, time);
  } else {
    grooveStep(bar, inBar, chord, time);
  }
}

// chill jazz arrangement: brushed drums, walking bass, lush comping, sparse lead
function jazzChillStep(step, bar, inBar, chord, time) {
  const beat = inBar / 4;            // 0..3 (which beat)
  const sub = inBar % 4;             // 16th within the beat
  const swung = (sub === 2) ? (time + SIXTEENTH * (SWING - 0.5) * 2) : time;

  // --- brushed drums (soft, warm) ---
  // shaker on every 8th, gentle; accent the off-beats slightly
  if (sub === 0 || sub === 2) {
    const accent = sub === 2;
    noiseBurst(swung, 0.06, 6200, accent ? 0.10 : 0.055);
  }
  // soft kick on beats 1 & 3
  if (sub === 0 && (beat === 0 || beat === 2)) {
    tone(time, chord.bass * 0.5, BEAT * 0.5, "sine", 0.16, 0.006, 220);
  }
  // brushy snare/rim on beats 2 & 4
  if (sub === 0 && (beat === 1 || beat === 3)) {
    noiseBurst(time, 0.05, 2600, 0.06);
    tone(time, 180, 0.04, "triangle", 0.05, 0.002, 1200);
  }

  // --- walking bass: root, 5th, octave, approach-to-next-chord ---
  if (sub === 0) {
    let f;
    const next = curProg[(bar + 1) % curProg.length];
    if (beat === 0) f = chord.bass;
    else if (beat === 1) f = chord.bass * 1.5;            // fifth
    else if (beat === 2) f = chord.bass * 2;              // octave
    else f = next.bass * (Math.random() < 0.5 ? 0.94 : 1.06); // approach tone
    tone(time, f, BEAT * 0.9, "triangle", 0.20, 0.012, 680);
  }

  // --- lush comping: sustained chord stabs on the "and" of 2 and the "and" of 4 ---
  // (charleston rhythm — the heartbeat of jazz comping)
  if (inBar === 6 || inBar === 14) {
    const t0 = swung;
    for (const f of chord.tones) {
      tone(t0, f, BEAT * 1.1, "triangle", 0.055, 0.015, 1900);
    }
  }
  // soft sustained pad at top of bar for warmth (the 9th color comes from the voicings)
  if (inBar === 0) {
    for (const f of chord.tones) {
      tone(time, f, BEAT * 1.6, "sine", 0.035, 0.04, 2400);
    }
  }

  // --- sparse melodic lead (swung 8ths), only on even bars, leaves space ---
  if (bar % 2 === 0 && curLead.length) {
    // a simple call-and-response: phrase on beats 3-& of bars 0,2,4...
    if (inBar === 8 || inBar === 10 || inBar === 12) {
      const idx = (bar * 3 + (inBar === 8 ? 0 : inBar === 10 ? 1 : 2)) % curLead.length;
      const f = curLead[idx];
      tone(swung, f, BEAT * 0.85, "sine", 0.085, 0.02, 5200);
    }
  }
  // a longer resolution note every 4 bars on the "and of 4" leading into the next phrase
  if (bar % 4 === 3 && inBar === 14 && curLead.length) {
    tone(swung, curLead[0], BEAT * 1.4, "sine", 0.10, 0.03, 5200);
  }
}

// legacy groove (kept for songs that set style: "groove")
function grooveStep(bar, inBar, chord, time) {
  const accent = (inBar % 4 === 2);
  noiseBurst(time, 0.05, 7500, accent ? 0.18 : 0.07);
  if (inBar === 0) tone(time, chord.bass, BEAT*1.6, "triangle", 0.22, 0.01, 700);
  if (inBar === 8) tone(time, chord.bass*1.5, BEAT*1.2, "triangle", 0.18, 0.01, 700);
  if (inBar === 4 || inBar === 12) tone(time, chord.bass*2, BEAT*0.9, "sine", 0.12, 0.005, 600);
  if (inBar === 0 || inBar === 10) {
    for (const t of chord.tones) tone(time, t, BEAT*1.4, "triangle", 0.07, 0.02, 2200);
  }
  if (bar % 2 === 0 && (inBar === 6 || inBar === 14)) {
    const note = chord.tones[(bar) % chord.tones.length] * 2;
    tone(time, note, BEAT*0.9, "sine", 0.10, 0.02, 5000);
  }
}

// ---- BOSS FIGHT arrangement: dark, driving, non-repeating, sections build intensity ----
function bossStep(step, bar, inBar, chord, time) {
  const beat = Math.floor(inBar / 4);     // 0..3
  const sub = inBar % 4;                  // 0..3 (16th within beat)
  const sec = sectionFor(bar);
  const r1 = stepRand(step, 1), r2 = stepRand(step, 2), r3 = stepRand(step, 3);

  // ---------- DRUMS ----------
  if (sec === SEC_INTRO) {
    // ominous: heartbeat kick on beat 1, low drone, sparse tick
    if (sub === 0 && beat === 0) tone(time, chord.bass * 0.5, BEAT*0.7, "sine", 0.24, 0.006, 200);
    if (inBar === 0) for (const f of [chord.bass, chord.bass*1.5]) tone(time, f, BEAT*4, "sawtooth", 0.045, 0.06, 650);
    if (sub === 2) noiseBurst(time, 0.03, 8500, 0.03);
  } else if (sec === SEC_MAIN) {
    // 4-on-the-floor
    if (sub === 0) tone(time, chord.bass*0.5, BEAT*0.4, "sine", 0.20, 0.004, 220);
    if (sub === 0 && (beat === 1 || beat === 3)) { noiseBurst(time, 0.06, 2200, 0.13); tone(time, 180, 0.05, "triangle", 0.06, 0.002, 1200); }
    if (sub === 0 || sub === 2) noiseBurst(time, 0.04, 7000, sub === 2 ? 0.08 : 0.05);
    if (inBar === 0) noiseBurst(time, 0.5, 4000, 0.12); // crash
  } else if (sec === SEC_INTENSIFY) {
    // syncopated double-kick + 16th hats + snare-roll fills
    if (sub === 0 || (sub === 2 && r1 < 0.5)) tone(time, chord.bass*0.5, BEAT*0.3, "sine", 0.18, 0.003, 220);
    if (sub === 0 && (beat === 1 || beat === 3)) noiseBurst(time, 0.06, 2200, 0.14);
    noiseBurst(time, 0.035, 7500, sub === 0 ? 0.09 : 0.045);
    if (bar % 2 === 1 && inBar >= 12) noiseBurst(time, 0.03, 2500, 0.08);
  } else if (sec === SEC_CLIMAX) {
    // BLAST BEAT: 16th alternating kick/snare
    if (sub % 2 === 0) tone(time, chord.bass*0.5, BEAT*0.2, "sine", 0.16, 0.002, 240);
    else noiseBurst(time, 0.04, 2500, 0.10);
    noiseBurst(time, 0.03, 8000, 0.05);
    if (inBar === 0) noiseBurst(time, 0.6, 3500, 0.14);
  } else if (sec === SEC_BREAKDOWN) {
    // half-time: huge hits on 1, snare on 3, sparse & heavy
    if (sub === 0 && beat === 0) { tone(time, chord.bass*0.5, BEAT*1.2, "sine", 0.30, 0.005, 200); noiseBurst(time, 0.7, 3000, 0.16); }
    if (sub === 0 && beat === 2) noiseBurst(time, 0.08, 2200, 0.16);
  } else if (sec === SEC_FINAL) {
    // max: blast + 4-on-floor hybrid, fastest hats
    if (sub === 0) tone(time, chord.bass*0.5, BEAT*0.25, "sine", 0.20, 0.003, 240);
    if (sub % 2 === 1) noiseBurst(time, 0.035, 2500, 0.09);
    noiseBurst(time, 0.03, 8000, 0.06);
    if (inBar === 0) noiseBurst(time, 0.7, 3500, 0.15);
  } else if (sec === SEC_OUTRO) {
    // wind down: heartbeat + drone, fading
    if (sub === 0 && beat === 0) tone(time, chord.bass*0.5, BEAT*0.8, "sine", 0.22, 0.006, 200);
    if (inBar === 0) for (const f of [chord.bass, chord.bass*1.5]) tone(time, f, BEAT*4, "sawtooth", 0.04, 0.06, 600);
  }

  // ---------- BASS / PALM-MUTED CHUG ----------
  if (sec !== SEC_INTRO && sec !== SEC_BREAKDOWN && sec !== SEC_OUTRO) {
    // driving 8th chug
    if (sub === 0 || sub === 2) tone(time, chord.bass, BEAT*0.35, "sawtooth", 0.13, 0.003, 900);
    // 16th chug in intense sections (non-repeating via stepRand)
    if ((sec === SEC_INTENSIFY || sec === SEC_CLIMAX || sec === SEC_FINAL) && r2 < 0.7) {
      tone(time, chord.bass, BEAT*0.18, "sawtooth", 0.09, 0.002, 800);
    }
  }
  // chromatic walk into next chord (main section, "and of 4")
  if (sec === SEC_MAIN && inBar === 14) {
    tone(time, chord.bass * Math.pow(2, 1/12), BEAT*0.4, "sawtooth", 0.10, 0.003, 800);
  }

  // ---------- POWER-CHORD STABS ----------
  if ((sec === SEC_MAIN || sec === SEC_INTENSIFY) && (inBar === 0 || inBar === 8)) {
    for (const f of chord.tones) tone(time, f, BEAT*0.7, "sawtooth", 0.06, 0.004, 1800);
  }
  if (sec === SEC_BREAKDOWN && inBar === 0) {
    for (const f of chord.tones) tone(time, f, BEAT*1.8, "sawtooth", 0.085, 0.006, 1600);
  }
  if (sec === SEC_FINAL && inBar === 0) {
    for (const f of chord.tones) tone(time, f, BEAT*0.6, "sawtooth", 0.07, 0.003, 2000);
  }

  // ---------- SCREAMING LEAD ----------
  if (curLead.length && (sec === SEC_CLIMAX || sec === SEC_FINAL)) {
    // fast arpeggio run, occasional octave-up scream
    const f = curLead[step % curLead.length] * (r3 < 0.15 ? 2 : 1);
    tone(time, f, BEAT*0.2, "square", 0.075, 0.002, 6000);
  }
  // melodic lead phrases in main/intensify (sparser)
  if (curLead.length && (sec === SEC_MAIN || sec === SEC_INTENSIFY) && bar % 2 === 1) {
    if (inBar === 4 || inBar === 6 || inBar === 10 || inBar === 12) {
      const idx = (bar + inBar) % curLead.length;
      tone(time, curLead[idx], BEAT*0.6, "square", 0.08, 0.004, 5500);
    }
  }
}

// ==================== HEAVENLY CHOIR HYMN ====================
// Reverb bus (lazy-init, only for heavenly songs)
let heavenlyBus = null, reverbConv = null;
function initHeavenlyBus() {
  if (heavenlyBus) return;
  heavenlyBus = audioCtx.createGain();
  heavenlyBus.gain.value = 0.9;
  reverbConv = audioCtx.createConvolver();
  // generate impulse response (decaying noise — cathedral reverb)
  const irLen = audioCtx.sampleRate * 3.5;
  const ir = audioCtx.createBuffer(2, irLen, audioCtx.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const data = ir.getChannelData(ch);
    for (let i = 0; i < irLen; i++) {
      data[i] = (Math.random()*2 - 1) * Math.pow(1 - i/irLen, 2.5);
    }
  }
  reverbConv.buffer = ir;
  const wetGain = audioCtx.createGain(); wetGain.gain.value = 0.55;
  const dryGain = audioCtx.createGain(); dryGain.gain.value = 0.6;
  heavenlyBus.connect(dryGain).connect(masterGain);
  heavenlyBus.connect(reverbConv).connect(wetGain).connect(masterGain);
}

// choir pad: multiple detuned sine voices per chord tone, slow swell, lush
function choirPad(time, freqs, dur, vol) {
  const per = vol / Math.max(1, freqs.length);
  for (const f of freqs) {
    for (const detune of [-8, 0, 8]) {
      const o = audioCtx.createOscillator();
      o.type = "sine"; o.frequency.value = f; o.detune.value = detune;
      const g = audioCtx.createGain();
      const v = per / 3;
      g.gain.setValueAtTime(0, time);
      g.gain.linearRampToValueAtTime(v, time + 0.18);
      g.gain.linearRampToValueAtTime(v * 0.6, time + dur * 0.6);
      g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
      o.connect(g).connect(heavenlyBus);
      o.start(time); o.stop(time + dur + 0.1);
    }
  }
}

// angelic bell (sine + harmonic, bright attack, long shimmer)
function bell(time, freq, dur, vol) {
  const partials = [1, 2, 3.01, 4.2];
  const pvol = [1, 0.5, 0.25, 0.12];
  for (let i = 0; i < partials.length; i++) {
    const o = audioCtx.createOscillator();
    o.type = "sine"; o.frequency.value = freq * partials[i];
    const g = audioCtx.createGain();
    const v = vol * pvol[i];
    g.gain.setValueAtTime(0, time);
    g.gain.linearRampToValueAtTime(v, time + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
    o.connect(g).connect(heavenlyBus);
    o.start(time); o.stop(time + dur + 0.1);
  }
}

// angelic lead with vibrato
function angelLead(time, freq, dur, vol) {
  const o = audioCtx.createOscillator(); o.type = "sine"; o.frequency.value = freq;
  const lfo = audioCtx.createOscillator(); lfo.frequency.value = 5.5;
  const lfoG = audioCtx.createGain(); lfoG.gain.value = freq * 0.008;
  lfo.connect(lfoG).connect(o.frequency);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0, time);
  g.gain.linearRampToValueAtTime(vol, time + 0.06);
  g.gain.linearRampToValueAtTime(vol * 0.7, time + dur * 0.5);
  g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
  o.connect(g).connect(heavenlyBus);
  o.start(time); lfo.start(time);
  o.stop(time + dur + 0.1); lfo.stop(time + dur + 0.1);
}

// heavenly sections
const H_INTRO=0, H_VERSE=1, H_CHORUS=2, H_BRIDGE=3, H_FINAL=4, H_OUTRO=5;
function hSection(bar) {
  if (bar < 4) return H_INTRO;
  if (bar < 12) return H_VERSE;
  if (bar < 18) return H_CHORUS;
  if (bar < 24) return H_BRIDGE;
  if (bar < 32) return H_FINAL;
  return H_OUTRO;
}

function heavenlyStep(step, bar, inBar, chord, time) {
  initHeavenlyBus();
  const beat = Math.floor(inBar / 4);
  const sub = inBar % 4;
  const sec = hSection(bar);
  const r = stepRand(step, 7);

  // --- sustained choir pad: swells on bar starts, 2 bars long ---
  if (inBar === 0) {
    const padDur = BEAT * 8;
    const vol = sec === H_CHORUS || sec === H_FINAL ? 0.14 : 0.09;
    choirPad(time, chord.tones, padDur, vol);
  }

  // --- soft harp arpeggio: pluck chord tones in rolling patterns ---
  if (sec !== H_INTRO && sec !== H_OUTRO) {
    if (sub === 0 || sub === 2) {
      const idx = (beat * 2 + sub) % chord.tones.length;
      bell(time, chord.tones[idx] * 2, BEAT * 0.6, 0.05);
    }
    // rolling arpeggio in chorus/final
    if ((sec === H_CHORUS || sec === H_FINAL) && inBar % 2 === 1) {
      const idx = (step) % chord.tones.length;
      bell(time, chord.tones[idx] * 2, BEAT * 0.4, 0.04);
    }
  }

  // --- angelic lead melody (verse + chorus + final) ---
  if (curLead.length && (sec === H_VERSE || sec === H_CHORUS || sec === H_FINAL)) {
    // hymn-like melody: notes on beats 1, 2.5, 3, 4
    if (inBar === 0 || inBar === 10 || inBar === 12) {
      const idx = (bar * 2 + beat) % curLead.length;
      const dur = inBar === 0 ? BEAT * 1.5 : BEAT * 0.8;
      angelLead(time, curLead[idx], dur, 0.09);
    }
    // ascending run in chorus/final on beat 4
    if ((sec === H_CHORUS || sec === H_FINAL) && inBar === 14) {
      const base = curLead[bar % curLead.length];
      angelLead(time, base, BEAT * 0.3, 0.07);
      angelLead(time + SIXTEENTH, base * 1.122, BEAT * 0.3, 0.07);
      angelLead(time + SIXTEENTH*2, base * 1.26, BEAT * 0.5, 0.08);
    }
  }

  // --- celestial bells on downbeats (chorus/final) ---
  if ((sec === H_CHORUS || sec === H_FINAL) && inBar === 0) {
    bell(time, chord.tones[0] * 4, BEAT * 3, 0.06);
    bell(time + 0.02, chord.tones[2] * 4, BEAT * 2.5, 0.04);
  }

  // --- soft sub-bass drone ---
  if (inBar === 0 && (beat === 0)) {
    tone(time, chord.bass, BEAT * 4, "sine", 0.12, 0.04, 400);
  }

  // --- intro: just pad + occasional bell, very sparse ---
  if (sec === H_INTRO && inBar === 0 && bar % 2 === 0) {
    bell(time, chord.tones[2] * 2, BEAT * 4, 0.05);
  }
  // outro: fading pad only, last bell
  if (sec === H_OUTRO && bar === curSong.bars - 1 && inBar === 0) {
    bell(time, chord.tones[0] * 4, BEAT * 6, 0.07);
  }
}

// ==================== VOICE MEMO: hummed melody + jazz continuation ====================
// Sections: M_MAIN (0-19) plays the user's transcribed melody with warm cello lead.
//           M_JAZZ (20-39) transitions into a smooth jazz groove (ii-V-I in D).
const M_MAIN = 0, M_JAZZ = 1;
// ==================== BRASS MECHANISM: mechanical jiggy jazz w/ trombone section ====================
// Sections: MJ_INTRO, MJ_GROOVE, MJ_FULL, MJ_BREAK, MJ_SOLO, MJ_OUTRO
const MJ_INTRO=0, MJ_GROOVE=1, MJ_FULL=2, MJ_BREAK=3, MJ_SOLO=4, MJ_OUTRO=5;
function mjSection(bar) {
  if (bar < 4) return MJ_INTRO;
  if (bar < 12) return MJ_GROOVE;
  if (bar < 18) return MJ_FULL;
  if (bar < 22) return MJ_BREAK;
  if (bar < 30) return MJ_SOLO;
  return MJ_OUTRO;
}

// trombone synth: sawtooth with quick brass-ish attack + slight pitch glissando
function trombone(time, freq, dur, vol, glide) {
  const o = audioCtx.createOscillator();
  o.type = "sawtooth";
  o.frequency.setValueAtTime(freq * (1 - (glide || 0.04)), time);
  o.frequency.exponentialRampToValueAtTime(freq, time + 0.04);
  const f = audioCtx.createBiquadFilter();
  f.type = "lowpass"; f.frequency.value = 2000; f.Q.value = 1.5;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0, time);
  g.gain.linearRampToValueAtTime(vol, time + 0.025); // quick brass attack
  g.gain.linearRampToValueAtTime(vol * 0.75, time + dur * 0.4);
  g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
  o.connect(g).connect(f).connect(masterGain);
  o.start(time); o.stop(time + dur + 0.05);
}

// trombone section: 3-voice harmony (root, 3rd, 5th/7th)
function tromboneSection(time, freqs, dur, vol) {
  for (let i = 0; i < freqs.length && i < 3; i++) {
    trombone(time, freqs[i], dur, vol * (i === 0 ? 1 : 0.7));
  }
}

function mechJazzStep(step, bar, inBar, chord, time) {
  const sec = mjSection(bar);
  const beat = Math.floor(inBar / 4);
  const sub = inBar % 4;
  const r = stepRand(step, 11);

  // ---------- MECHANICAL DRUMS: tight, precise, driving ----------
  if (sec !== MJ_INTRO && sec !== MJ_OUTRO) {
    // kick: driving 8ths, mechanical
    if (sub === 0 || sub === 2) {
      tone(time, chord.bass * 0.5, BEAT * 0.25, "sine", 0.16, 0.002, 240);
    }
    // snare on 2 & 4 (backbeat), tight
    if (sub === 0 && (beat === 1 || beat === 3)) {
      noiseBurst(time, 0.04, 2200, 0.13);
      tone(time, 180, 0.03, "triangle", 0.05, 0.001, 1200);
    }
    // hats: 16th notes, mechanical precision
    noiseBurst(time, 0.025, 8000, sub === 0 ? 0.07 : sub === 2 ? 0.06 : 0.035);
    // extra 16th snare ghost notes for jiggy feel
    if (r < 0.15 && sub === 3) noiseBurst(time, 0.02, 3000, 0.04);
  }

  // ---------- WALKING BASS: fast mechanical 8th-note walk ----------
  if (sec !== MJ_INTRO && sec !== MJ_BREAK && sec !== MJ_OUTRO) {
    if (sub === 0 || sub === 2) {
      // walking pattern: root, 5th, octave, 3rd (then approach)
      let f;
      const next = curProg[(bar + 1) % curProg.length];
      if (beat === 0 && sub === 0) f = chord.bass;
      else if (beat === 0 && sub === 2) f = chord.bass * 1.5;
      else if (beat === 1 && sub === 0) f = chord.bass * 2;
      else if (beat === 1 && sub === 2) f = chord.tones[1];
      else if (beat === 2 && sub === 0) f = chord.bass * 1.5;
      else if (beat === 2 && sub === 2) f = chord.bass * 2;
      else if (beat === 3 && sub === 0) f = chord.tones[2] || chord.bass * 2;
      else f = next.bass * (r < 0.5 ? 0.97 : 1.03); // approach tone
      tone(time, f, BEAT * 0.35, "sawtooth", 0.12, 0.003, 700);
    }
  }

  // ---------- TROMBONE SECTION (the stars of the show) ----------
  // comping stabs on the "and" of 2 and "and" of 4 (jiggy off-beats)
  if (sec === MJ_GROOVE || sec === MJ_FULL || sec === MJ_SOLO) {
    if (inBar === 6 || inBar === 14) {
      tromboneSection(time, [chord.tones[0], chord.tones[1], chord.tones[2]], BEAT * 0.5, 0.12);
    }
    // big section hit on bar downbeat
    if (inBar === 0 && (sec === MJ_FULL || sec === MJ_SOLO)) {
      tromboneSection(time, chord.tones.slice(0, 3), BEAT * 1.2, 0.14);
    }
    // syncopated trombone jabs
    if ((inBar === 3 || inBar === 11) && sec === MJ_FULL) {
      trombone(time, chord.tones[0] * 2, BEAT * 0.3, 0.10);
      trombone(time + SIXTEENTH, chord.tones[2] * 2, BEAT * 0.3, 0.08);
    }
  }

  // ---------- TROMBONE SOLO (bop lines, jiggy) ----------
  if (sec === MJ_SOLO && curLead.length) {
    // fast bop-style 8th-note runs using the lead pool
    if (inBar % 2 === 0) {
      const idx = (step * 3 + bar) % curLead.length;
      trombone(time, curLead[idx], BEAT * 0.4, 0.11, 0.05);
    }
    if (inBar % 2 === 1 && r < 0.6) {
      const idx = (step * 5 + bar * 2) % curLead.length;
      trombone(time, curLead[idx], BEAT * 0.35, 0.10, 0.06);
    }
    // bluesy bends on beat 1
    if (inBar === 0 && bar % 2 === 1) {
      trombone(time, curLead[0], BEAT * 1.5, 0.13, 0.12);
    }
  }

  // ---------- TROMBONE MELODY in FULL section ----------
  if (sec === MJ_FULL && curLead.length) {
    if (inBar === 0 || inBar === 4 || inBar === 8 || inBar === 12) {
      const idx = (bar + Math.floor(inBar/4)) % curLead.length;
      trombone(time, curLead[idx], BEAT * 1.5, 0.12, 0.04);
    }
    if (inBar === 2 || inBar === 6 || inBar === 10 || inBar === 14) {
      const idx = (bar * 2 + 1) % curLead.length;
      trombone(time, curLead[idx], BEAT * 0.8, 0.10, 0.05);
    }
  }

  // ---------- INTRO: trombone fanfare ----------
  if (sec === MJ_INTRO) {
    if (inBar === 0 && bar < 3) {
      tromboneSection(time, chord.tones.slice(0, 3), BEAT * 3, 0.13);
    }
    if (bar === 3 && (inBar === 0 || inBar === 8)) {
      trombone(time, chord.tones[0] * 2, BEAT * 1.5, 0.12, 0.08);
      trombone(time + BEAT * 0.5, chord.tones[1] * 2, BEAT * 1, 0.10, 0.08);
    }
    // light hat tick
    if (sub === 0) noiseBurst(time, 0.02, 7000, 0.03);
  }

  // ---------- BREAK: sparse, just bass + rim ----------
  if (sec === MJ_BREAK) {
    if (sub === 0 && beat === 0) {
      tone(time, chord.bass * 0.5, BEAT * 0.5, "sine", 0.16, 0.004, 220);
      noiseBurst(time, 0.03, 2500, 0.06);
    }
    if (inBar === 8) {
      trombone(time, chord.tones[0], BEAT * 2, 0.10, 0.1);
    }
  }

  // ---------- OUTRO: trombone section hits, wind down ----------
  if (sec === MJ_OUTRO) {
    if (inBar === 0) {
      tromboneSection(time, chord.tones.slice(0, 3), BEAT * 3, 0.13);
      noiseBurst(time, 0.4, 3000, 0.08); // crash
    }
    if (bar === curSong.bars - 1 && inBar === 0) {
      tromboneSection(time, [chord.tones[0], chord.tones[1], chord.tones[2]], BEAT * 4, 0.15);
    }
  }
}

// ==================== HARLEM RECKONING: jazz boss fight ====================
// Same intensity architecture as Khazan's Wrath, but jazz instrumentation:
// trombone section, Hammond-style organ, walking bass, intense jazz drums.
// Dark minor ii-V-i harmony with Harlem soul/gospel tinge.
// Reuses boss-fight section structure (SEC_INTRO..SEC_OUTRO).
function hammondOrgan(time, freqs, dur, vol) {
  // Hammond: drawbar sine + 3rd harmonic + 2nd octave, slight percussion click
  const drawbars = [1, 2, 3, 4]; // fundamental, octave, 5th, 2nd octave
  const drawVol = [0.5, 0.3, 0.15, 0.1];
  for (const f of freqs) {
    for (let d = 0; d < drawbars.length; d++) {
      const o = audioCtx.createOscillator();
      o.type = "sine"; o.frequency.value = f * drawbars[d];
      const g = audioCtx.createGain();
      const v = vol * drawVol[d] / freqs.length;
      g.gain.setValueAtTime(0, time);
      g.gain.linearRampToValueAtTime(v, time + 0.02);
      g.gain.linearRampToValueAtTime(v * 0.6, time + dur * 0.5);
      g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
      o.connect(g).connect(masterGain);
      o.start(time); o.stop(time + dur + 0.05);
    }
  }
}

function harlemBossStep(step, bar, inBar, chord, time) {
  const sec = sectionFor(bar);
  const beat = Math.floor(inBar / 4);
  const sub = inBar % 4;
  const r1 = stepRand(step, 21), r2 = stepRand(step, 22), r3 = stepRand(step, 23);

  // ---------- INTENSE JAZZ DRUMS ----------
  if (sec === SEC_INTRO) {
    // ominous: heartbeat + ride cymbal ping
    if (sub === 0 && beat === 0) tone(time, chord.bass * 0.5, BEAT * 0.7, "sine", 0.22, 0.006, 200);
    if (inBar === 0) for (const f of [chord.bass, chord.bass * 1.5]) tone(time, f, BEAT * 4, "sawtooth", 0.04, 0.06, 600);
    if (sub === 0 || sub === 2) noiseBurst(time, 0.04, 9000, 0.04); // ride
  } else if (sec === SEC_MAIN) {
    // driving jazz swing-ish: kick on 1&3, snare on 2&4, ride pattern
    if (sub === 0 && (beat === 0 || beat === 2)) tone(time, chord.bass * 0.5, BEAT * 0.3, "sine", 0.18, 0.003, 230);
    if (sub === 0 && (beat === 1 || beat === 3)) { noiseBurst(time, 0.05, 2200, 0.13); tone(time, 180, 0.03, "triangle", 0.05, 0.001, 1200); }
    // ride: swung 8ths
    if (sub === 0 || sub === 2) {
      const swung = sub === 2 ? time + SIXTEENTH * 0.12 : time;
      noiseBurst(swung, 0.04, 8500, sub === 0 ? 0.07 : 0.05);
      tone(swung, 5200, 0.06, "sine", 0.03, 0.001, 9000); // bell ping
    }
    if (inBar === 0) noiseBurst(time, 0.5, 4000, 0.10); // crash
  } else if (sec === SEC_INTENSIFY) {
    // double-time ride, snare ghosts, pushing
    if (sub === 0) tone(time, chord.bass * 0.5, BEAT * 0.25, "sine", 0.16, 0.003, 230);
    if (sub === 0 && (beat === 1 || beat === 3)) noiseBurst(time, 0.05, 2200, 0.14);
    noiseBurst(time, 0.03, 8500, 0.05);
    if (r1 < 0.3) noiseBurst(time, 0.02, 2500, 0.05); // ghost snare
  } else if (sec === SEC_CLIMAX) {
    // full jazz fury: 16th-note ride, kick every beat, snare accents
    if (sub === 0) tone(time, chord.bass * 0.5, BEAT * 0.2, "sine", 0.18, 0.002, 240);
    if (sub % 2 === 1) noiseBurst(time, 0.03, 2200, 0.10); // snare
    noiseBurst(time, 0.025, 8500, 0.06); // ride 16ths
    if (inBar === 0) noiseBurst(time, 0.6, 3500, 0.13);
  } else if (sec === SEC_BREAKDOWN) {
    // half-time: huge hits, spacious
    if (sub === 0 && beat === 0) { tone(time, chord.bass * 0.5, BEAT * 1.2, "sine", 0.28, 0.005, 200); noiseBurst(time, 0.7, 3000, 0.15); }
    if (sub === 0 && beat === 2) noiseBurst(time, 0.06, 2200, 0.14);
    if (sub === 2) noiseBurst(time, 0.03, 8000, 0.04);
  } else if (sec === SEC_FINAL) {
    // max: everything at once
    if (sub === 0) tone(time, chord.bass * 0.5, BEAT * 0.2, "sine", 0.20, 0.003, 240);
    if (sub % 2 === 1) noiseBurst(time, 0.03, 2200, 0.10);
    noiseBurst(time, 0.025, 8500, 0.06);
    if (inBar === 0) noiseBurst(time, 0.7, 3500, 0.14);
  } else if (sec === SEC_OUTRO) {
    if (sub === 0 && beat === 0) tone(time, chord.bass * 0.5, BEAT * 0.8, "sine", 0.22, 0.006, 200);
    if (inBar === 0) for (const f of [chord.bass, chord.bass * 1.5]) tone(time, f, BEAT * 4, "sawtooth", 0.035, 0.06, 600);
    if (sub === 0) noiseBurst(time, 0.03, 8000, 0.03);
  }

  // ---------- WALKING BASS (jazz, not metal chug) ----------
  if (sec !== SEC_INTRO && sec !== SEC_BREAKDOWN && sec !== SEC_OUTRO) {
    if (sub === 0) {
      // 4 beats per bar: root, 3rd, 5th, approach
      let f;
      const next = curProg[(bar + 1) % curProg.length];
      if (beat === 0) f = chord.bass;
      else if (beat === 1) f = chord.tones[1];
      else if (beat === 2) f = chord.bass * 1.5;
      else f = next.bass * (r2 < 0.5 ? 0.97 : 1.03);
      tone(time, f, BEAT * 0.8, "sawtooth", 0.14, 0.005, 800);
    }
    // double-time walking in climax/final
    if ((sec === SEC_CLIMAX || sec === SEC_FINAL) && sub === 2) {
      const f = chord.tones[(beat + 1) % chord.tones.length];
      tone(time, f, BEAT * 0.35, "sawtooth", 0.10, 0.003, 700);
    }
  }

  // ---------- HAMMOND ORGAN (the Harlem soul/gospel tinge) ----------
  if (sec === SEC_MAIN || sec === SEC_INTENSIFY) {
    if (inBar === 0 || inBar === 8) {
      hammondOrgan(time, chord.tones.slice(0, 3), BEAT * 1.5, 0.09);
    }
  }
  if (sec === SEC_CLIMAX || sec === SEC_FINAL) {
    if (inBar === 0) hammondOrgan(time, chord.tones, BEAT * 2, 0.11);
    if (inBar === 8) hammondOrgan(time, chord.tones.slice(1, 4), BEAT * 1.5, 0.08);
  }
  if (sec === SEC_BREAKDOWN && inBar === 0) {
    hammondOrgan(time, chord.tones, BEAT * 3, 0.10);
  }

  // ---------- TROMBONE SECTION (dark, aggressive jazz) ----------
  if (sec === SEC_MAIN && (inBar === 0 || inBar === 6 || inBar === 14)) {
    const dur = inBar === 0 ? BEAT * 1.2 : BEAT * 0.5;
    tromboneSection(time, [chord.tones[0], chord.tones[1], chord.tones[2]], dur, 0.13);
  }
  if (sec === SEC_INTENSIFY && (inBar === 0 || inBar === 10)) {
    tromboneSection(time, chord.tones.slice(0, 3), BEAT * 0.8, 0.14);
    // syncopated jabs
    if (inBar === 10) {
      trombone(time + SIXTEENTH, chord.tones[2] * 2, BEAT * 0.3, 0.10, 0.06);
    }
  }
  if (sec === SEC_CLIMAX && inBar === 0) {
    tromboneSection(time, chord.tones.slice(0, 3), BEAT * 1.5, 0.15);
  }
  if (sec === SEC_FINAL && inBar === 0) {
    tromboneSection(time, chord.tones.slice(0, 3), BEAT * 1, 0.16);
  }
  if (sec === SEC_BREAKDOWN && inBar === 0) {
    trombone(time, chord.tones[0], BEAT * 2.5, 0.14, 0.12); // bluesy sustained bend
  }
  if (sec === SEC_OUTRO && inBar === 0) {
    tromboneSection(time, [chord.tones[0], chord.tones[1], chord.tones[2]], BEAT * 3, 0.14);
  }

  // ---------- BOP TROMBONE SOLO (climax/final) ----------
  if (curLead.length && (sec === SEC_CLIMAX || sec === SEC_FINAL)) {
    if (inBar % 2 === 0) {
      const idx = (step * 3 + bar * 2) % curLead.length;
      trombone(time, curLead[idx], BEAT * 0.35, 0.12, 0.06);
    }
    if (inBar % 2 === 1 && r3 < 0.65) {
      const idx = (step * 5 + bar) % curLead.length;
      trombone(time, curLead[idx], BEAT * 0.3, 0.10, 0.08);
    }
    // bluesy scream every 4 bars
    if (bar % 4 === 3 && inBar === 0) {
      trombone(time, curLead[curLead.length - 1], BEAT * 1.5, 0.14, 0.15);
    }
  }
  // melodic trombone phrases in main section
  if (curLead.length && sec === SEC_MAIN && bar % 2 === 1) {
    if (inBar === 4 || inBar === 8 || inBar === 12) {
      const idx = (bar + Math.floor(inBar / 4)) % curLead.length;
      trombone(time, curLead[idx], BEAT * 0.9, 0.11, 0.05);
    }
  }
}

// ==================== SYNTHWAVE: neon retro-futurism ====================
// Sections: SW_INTRO, SW_VERSE, SW_CHORUS, SW_BRIDGE, SW_FINAL, SW_OUTRO
const SW_INTRO=0, SW_VERSE=1, SW_CHORUS=2, SW_BRIDGE=3, SW_FINAL=4, SW_OUTRO=5;
function swSection(bar) {
  if (bar < 4) return SW_INTRO;
  if (bar < 12) return SW_VERSE;
  if (bar < 18) return SW_CHORUS;
  if (bar < 24) return SW_BRIDGE;
  if (bar < 30) return SW_FINAL;
  return SW_OUTRO;
}

// big detuned supersaw pad chord — the quintessential synthwave wall
function superSaw(time, freqs, dur, vol) {
  for (const f of freqs) {
    for (const detune of [-12, -6, 0, 6, 12]) {
      const o = audioCtx.createOscillator();
      o.type = "sawtooth"; o.frequency.value = f; o.detune.value = detune;
      const f1 = audioCtx.createBiquadFilter();
      f1.type = "lowpass"; f1.frequency.value = 2200; f1.Q.value = 0.8;
      const g = audioCtx.createGain();
      const v = vol / freqs.length / 5;
      g.gain.setValueAtTime(0, time);
      g.gain.linearRampToValueAtTime(v, time + 0.08);
      g.gain.linearRampToValueAtTime(v * 0.85, time + dur * 0.5);
      g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
      o.connect(g).connect(f1).connect(masterGain);
      o.start(time); o.stop(time + dur + 0.05);
    }
  }
}

// synthwave lead: square with vibrato + slight portamento glide in
function synthLead(time, freq, dur, vol) {
  const o = audioCtx.createOscillator(); o.type = "square";
  o.frequency.setValueAtTime(freq * 0.92, time);
  o.frequency.exponentialRampToValueAtTime(freq, time + 0.03);
  const lfo = audioCtx.createOscillator(); lfo.frequency.value = 6.0;
  const lfoG = audioCtx.createGain(); lfoG.gain.value = freq * 0.006;
  lfo.connect(lfoG).connect(o.frequency);
  const f = audioCtx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 4500; f.Q.value = 2;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0, time);
  g.gain.linearRampToValueAtTime(vol, time + 0.02);
  g.gain.linearRampToValueAtTime(vol * 0.6, time + dur * 0.6);
  g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
  o.connect(g).connect(f).connect(masterGain);
  o.start(time); lfo.start(time);
  o.stop(time + dur + 0.05); lfo.stop(time + dur + 0.05);
}

function synthwaveStep(step, bar, inBar, chord, time) {
  const sec = swSection(bar);
  const beat = Math.floor(inBar / 4);
  const sub = inBar % 4;
  const r = stepRand(step, 31);

  // ---------- DRUMS: 4-on-the-floor + gated snare ----------
  if (sec !== SW_INTRO && sec !== SW_OUTRO) {
    // kick on every beat
    if (sub === 0) tone(time, chord.bass * 0.5, BEAT * 0.32, "sine", 0.26, 0.003, 180);
    // gated snare on beats 2 & 4
    if (sub === 0 && (beat === 1 || beat === 3)) {
      noiseBurst(time, 0.16, 1900, 0.18);
      tone(time, 200, 0.08, "triangle", 0.06, 0.001, 1500);
    }
    // offbeat open hat
    if (sub === 2) noiseBurst(time, 0.05, 9000, 0.06);
    // closed hat 16ths
    if (sub === 1 || sub === 3) noiseBurst(time, 0.02, 9000, 0.025);
  } else {
    // intro/outro: sparse kick on 1
    if (sub === 0 && beat === 0) tone(time, chord.bass * 0.5, BEAT * 0.5, "sine", 0.22, 0.005, 180);
    if (sub === 2 && beat === 1) noiseBurst(time, 0.04, 9000, 0.04);
  }

  // ---------- DRIVING 16th BASS ARPEGGIO (the synthwave engine) ----------
  if (sec !== SW_INTRO && sec !== SW_OUTRO) {
    // 16th-note rolling arpeggio through chord tones
    const idx = (step) % chord.tones.length;
    let f = chord.tones[idx];
    // octave down for bass register on downbeats
    if (sub === 0 && beat === 0) f = chord.bass;
    tone(time, f, BEAT * 0.22, "sawtooth", 0.14, 0.002, 1200);
    // extra offbeat bass pulse
    if (sub === 2 && r < 0.6) {
      tone(time, chord.tones[(idx + 2) % chord.tones.length], BEAT * 0.18, "sawtooth", 0.09, 0.002, 1000);
    }
  }

  // ---------- SUPERSAW PAD: holds the chord, swells on bar 1 ----------
  if (inBar === 0) {
    const vol = (sec === SW_CHORUS || sec === SW_FINAL) ? 0.16 : 0.10;
    superSaw(time, chord.tones, BEAT * 4, vol);
  }
  // bridge: thicker pad, longer
  if (sec === SW_BRIDGE && inBar === 0) {
    superSaw(time, chord.tones, BEAT * 8, 0.14);
  }

  // ---------- SOARING LEAD ----------
  if (curLead.length && (sec === SW_CHORUS || sec === SW_FINAL)) {
    // 8th-note melodic phrases
    if (sub === 0 || sub === 2) {
      const idx = (step + bar) % curLead.length;
      const dur = sub === 0 ? BEAT * 0.7 : BEAT * 0.4;
      synthLead(time, curLead[idx], dur, 0.12);
    }
    // octave-up scream on bar downbeats in final
    if (sec === SW_FINAL && sub === 0 && beat === 0) {
      synthLead(time, curLead[bar % curLead.length] * 2, BEAT * 1.4, 0.13);
    }
  }
  // verse: sparser lead motifs
  if (curLead.length && sec === SW_VERSE && bar % 2 === 1) {
    if (inBar === 4 || inBar === 12) {
      const idx = (bar + Math.floor(inBar / 4)) % curLead.length;
      synthLead(time, curLead[idx], BEAT * 0.9, 0.10);
    }
  }

  // ---------- INTRO: pad swell + tom build ----------
  if (sec === SW_INTRO) {
    if (inBar === 0) superSaw(time, chord.tones, BEAT * 4, 0.10);
    if (bar >= 2 && sub === 0 && beat === 0) {
      tone(time, chord.bass * 0.5, BEAT * 0.4, "sine", 0.16, 0.004, 200);
      noiseBurst(time, 0.12, 1500, 0.08);
    }
  }
  // ---------- OUTRO: pad + final crash ----------
  if (sec === SW_OUTRO) {
    if (inBar === 0) {
      superSaw(time, chord.tones, BEAT * 4, 0.12);
      noiseBurst(time, 0.6, 3000, 0.10);
    }
    if (bar === curSong.bars - 1 && inBar === 0) {
      superSaw(time, chord.tones, BEAT * 6, 0.15);
      synthLead(time, curLead[0] * 2, BEAT * 4, 0.13);
    }
  }
}

// ==================== VAPORWAVE: slowed, dreamy, woozy ====================
// Sections: VW_INTRO, VW_MAIN, VW_DREAM, VW_BRIDGE, VW_OUTRO
const VW_INTRO=0, VW_MAIN=1, VW_DREAM=2, VW_BRIDGE=3, VW_OUTRO=4;
function vwSection(bar) {
  if (bar < 4) return VW_INTRO;
  if (bar < 14) return VW_MAIN;
  if (bar < 22) return VW_DREAM;
  if (bar < 30) return VW_BRIDGE;
  return VW_OUTRO;
}

// lush detuned pad with slow wow/flutter (vaporwave tape warble)
function lushPad(time, freqs, dur, vol) {
  for (const f of freqs) {
    for (const detune of [-7, 0, 7]) {
      const o = audioCtx.createOscillator();
      o.type = "sine"; o.frequency.value = f; o.detune.value = detune;
      // slow tape wow — pitch drifts
      const lfo = audioCtx.createOscillator(); lfo.frequency.value = 0.4;
      const lfoG = audioCtx.createGain(); lfoG.gain.value = f * 0.004;
      lfo.connect(lfoG).connect(o.frequency);
      const g = audioCtx.createGain();
      const v = vol / freqs.length / 3;
      g.gain.setValueAtTime(0, time);
      g.gain.linearRampToValueAtTime(v, time + 0.6);   // slow swell
      g.gain.linearRampToValueAtTime(v * 0.8, time + dur * 0.6);
      g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
      o.connect(g).connect(masterGain);
      o.start(time); lfo.start(time);
      o.stop(time + dur + 0.1); lfo.stop(time + dur + 0.1);
    }
  }
}

// soft mallet/bell tone, pitched-down feel
function mallet(time, freq, dur, vol) {
  const o = audioCtx.createOscillator(); o.type = "sine"; o.frequency.value = freq;
  const o2 = audioCtx.createOscillator(); o2.type = "sine"; o2.frequency.value = freq * 2.01;
  const g = audioCtx.createGain(); const g2 = audioCtx.createGain();
  g.gain.setValueAtTime(0, time);
  g.gain.linearRampToValueAtTime(vol, time + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
  g2.gain.setValueAtTime(0, time);
  g2.gain.linearRampToValueAtTime(vol * 0.3, time + 0.02);
  g2.gain.exponentialRampToValueAtTime(0.0001, time + dur * 0.7);
  o.connect(g).connect(masterGain); o2.connect(g2).connect(masterGain);
  o.start(time); o2.start(time); o.stop(time + dur + 0.05); o2.stop(time + dur + 0.05);
}

function vaporwaveStep(step, bar, inBar, chord, time) {
  initHeavenlyBus(); // reuse the reverb bus for dreamy space
  const sec = vwSection(bar);
  const beat = Math.floor(inBar / 4);
  const sub = inBar % 4;
  const r = stepRand(step, 41);

  // ---------- DRUMS: half-time, slowed boom-bap ----------
  if (sec !== VW_INTRO && sec !== VW_OUTRO) {
    // soft kick on 1 and the "and of 2"
    if (sub === 0 && beat === 0) tone(time, chord.bass * 0.5, BEAT * 0.6, "sine", 0.22, 0.01, 160);
    if (sub === 2 && beat === 1) tone(time, chord.bass * 0.5, BEAT * 0.4, "sine", 0.16, 0.008, 160);
    // snare on beat 3 (half-time backbeat)
    if (sub === 0 && beat === 2) {
      noiseBurst(time, 0.18, 1700, 0.13);
      tone(time, 180, 0.1, "triangle", 0.05, 0.002, 1200);
    }
    // sparse hats
    if (sub === 0 || sub === 2) noiseBurst(time, 0.04, 8000, sub === 0 ? 0.04 : 0.03);
  }

  // ---------- DEEP BASS: long sine notes, root on bar 1 ----------
  if (sec !== VW_INTRO) {
    if (inBar === 0) {
      tone(time, chord.bass, BEAT * 6, "sine", 0.18, 0.04, 300);
    }
    if (inBar === 8) {
      tone(time, chord.bass * 1.5, BEAT * 4, "sine", 0.12, 0.04, 300);
    }
  }

  // ---------- LUSH PAD: the heart of vaporwave ----------
  if (inBar === 0) {
    const vol = sec === VW_DREAM || sec === VW_BRIDGE ? 0.16 : 0.11;
    lushPad(time, chord.tones, BEAT * 8, vol);
  }
  // dream section: doubled pad
  if (sec === VW_DREAM && inBar === 8) {
    lushPad(time, chord.tones, BEAT * 6, 0.13);
  }

  // ---------- MELANCHOLIC LEAD: sparse mallet melody ----------
  if (curLead.length && sec !== VW_INTRO) {
    if (sec === VW_MAIN || sec === VW_BRIDGE) {
      if (inBar === 0 || inBar === 8) {
        const idx = (bar + inBar / 8) % curLead.length;
        mallet(time, curLead[idx], BEAT * 1.8, 0.10);
      }
      if (inBar === 4 || inBar === 12) {
        const idx = (bar * 2 + 1) % curLead.length;
        mallet(time, curLead[idx], BEAT * 1.2, 0.08);
      }
    }
    if (sec === VW_DREAM) {
      // floating arpeggios, slow
      if (inBar % 4 === 0) {
        const idx = (step / 4 | 0) % curLead.length;
        mallet(time, curLead[idx], BEAT * 2, 0.07);
      }
    }
  }

  // ---------- INTRO: just pad, very slow ----------
  if (sec === VW_INTRO && inBar === 0) {
    lushPad(time, chord.tones, BEAT * 8, 0.10);
    if (bar === 2) mallet(time, chord.tones[2] * 2, BEAT * 4, 0.06);
  }
  // ---------- OUTRO: pad fades, final bell ----------
  if (sec === VW_OUTRO) {
    if (inBar === 0) lushPad(time, chord.tones, BEAT * 8, 0.11);
    if (bar === curSong.bars - 1 && inBar === 0) {
      mallet(time, chord.tones[0] * 2, BEAT * 6, 0.10);
      mallet(time + 0.1, chord.tones[2] * 2, BEAT * 5, 0.07);
    }
  }
}

// ==================== DARK ETHEREAL: minor, ambient, weeping ====================
// Reuses heavenlyBus reverb. Sections: DE_INTRO, DE_VERSE, DE_CLIMAX, DE_RESOLVE, DE_OUTRO
const DE_INTRO=0, DE_VERSE=1, DE_CLIMAX=2, DE_RESOLVE=3, DE_OUTRO=4;
function deSection(bar) {
  if (bar < 4) return DE_INTRO;
  if (bar < 14) return DE_VERSE;
  if (bar < 20) return DE_CLIMAX;
  if (bar < 28) return DE_RESOLVE;
  return DE_OUTRO;
}

// dark choir pad: lower, detuned, with slow swell and dissonant shimmer
function darkChoir(time, freqs, dur, vol) {
  for (const f of freqs) {
    for (const detune of [-10, 0, 10]) {
      const o = audioCtx.createOscillator();
      o.type = "sine"; o.frequency.value = f; o.detune.value = detune;
      const g = audioCtx.createGain();
      const v = vol / freqs.length / 3;
      g.gain.setValueAtTime(0, time);
      g.gain.linearRampToValueAtTime(v, time + 0.4); // very slow swell
      g.gain.linearRampToValueAtTime(v * 0.7, time + dur * 0.7);
      g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
      o.connect(g).connect(heavenlyBus);
      o.start(time); o.stop(time + dur + 0.1);
    }
  }
}

// weeping cello-like lead: sawtooth with slow vibrato and portamento
function cello(time, freq, dur, vol) {
  const o = audioCtx.createOscillator(); o.type = "sawtooth";
  o.frequency.setValueAtTime(freq * 0.88, time);
  o.frequency.exponentialRampToValueAtTime(freq, time + 0.3); // slow slide in
  const lfo = audioCtx.createOscillator(); lfo.frequency.value = 4.2;
  const lfoG = audioCtx.createGain(); lfoG.gain.value = freq * 0.007;
  lfo.connect(lfoG).connect(o.frequency);
  const f = audioCtx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 1400; f.Q.value = 1.2;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0, time);
  g.gain.linearRampToValueAtTime(vol, time + 0.15);
  g.gain.linearRampToValueAtTime(vol * 0.7, time + dur * 0.6);
  g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
  o.connect(g).connect(f).connect(heavenlyBus);
  o.start(time); lfo.start(time);
  o.stop(time + dur + 0.1); lfo.stop(time + dur + 0.1);
}

function etherealDarkStep(step, bar, inBar, chord, time) {
  initHeavenlyBus();
  const sec = deSection(bar);
  const beat = Math.floor(inBar / 4);
  const sub = inBar % 4;
  const r = stepRand(step, 51);

  // ---------- NO DRUMS IN INTRO; sparse heartbeat elsewhere ----------
  if (sec === DE_INTRO) {
    if (inBar === 0 && beat === 0) tone(time, chord.bass, BEAT * 4, "sine", 0.10, 0.3, 300);
  } else if (sec !== DE_OUTRO) {
    // slow heartbeat kick on beat 1 of each bar
    if (sub === 0 && beat === 0) tone(time, chord.bass * 0.5, BEAT * 0.7, "sine", 0.16, 0.02, 180);
    // distant soft snare/rim on beat 3, very sparse
    if (sub === 0 && beat === 2 && r < 0.6) {
      noiseBurst(time, 0.06, 1400, 0.05);
    }
    // almost-silent hat tick
    if (sub === 0 && beat === 2) noiseBurst(time, 0.02, 6000, 0.02);
  }

  // ---------- SUB-BASS DRONE ----------
  if (inBar === 0) {
    tone(time, chord.bass, BEAT * 8, "sine", 0.12, 0.2, 350);
  }

  // ---------- DARK CHOIR PAD ----------
  if (inBar === 0) {
    const vol = sec === DE_CLIMAX ? 0.15 : 0.10;
    darkChoir(time, chord.tones, BEAT * 8, vol);
  }
  if (sec === DE_CLIMAX && inBar === 8) {
    darkChoir(time, chord.tones, BEAT * 6, 0.13);
  }

  // ---------- WEEPING CELLO LEAD ----------
  if (curLead.length && (sec === DE_VERSE || sec === DE_CLIMAX || sec === DE_RESOLVE)) {
    if (inBar === 0) {
      const idx = (bar * 2) % curLead.length;
      cello(time, curLead[idx], BEAT * 2.5, 0.12);
    }
    if (inBar === 8) {
      const idx = (bar * 2 + 1) % curLead.length;
      cello(time, curLead[idx], BEAT * 1.8, 0.10);
    }
    if (sec === DE_CLIMAX && (inBar === 4 || inBar === 12)) {
      const idx = (bar + Math.floor(inBar / 4)) % curLead.length;
      cello(time, curLead[idx], BEAT * 1.2, 0.11);
    }
  }

  // ---------- DISTANT BELLS (resolve section) ----------
  if (sec === DE_RESOLVE && (inBar === 0 || inBar === 8)) {
    bell(time, chord.tones[0] * 2, BEAT * 3, 0.06);
    bell(time + 0.05, chord.tones[2] * 2, BEAT * 2.5, 0.04);
  }

  // ---------- INTRO: just pad + drone, very sparse ----------
  if (sec === DE_INTRO && inBar === 0) {
    darkChoir(time, chord.tones, BEAT * 8, 0.09);
    if (bar === 2) bell(time, chord.tones[2] * 2, BEAT * 4, 0.05);
  }
  // ---------- OUTRO: final weeping note ----------
  if (sec === DE_OUTRO && inBar === 0) {
    darkChoir(time, chord.tones, BEAT * 8, 0.11);
  }
  if (sec === DE_OUTRO && bar === curSong.bars - 1 && inBar === 0) {
    cello(time, curLead[0], BEAT * 6, 0.14);
    bell(time, chord.tones[0] * 2, BEAT * 6, 0.08);
  }
}

// ==================== ONI DEMON: Japanese demonic boss fight ====================
// Sakupen-style: extremely fast, intense, glorious. Japanese tonality (Hirajoshi).
// Instrumentation: taiko drums, aggressive synth bass, shakuhachi (dark flute),
// koto (plucked strings), demonic pads, glorious triumphant lead.
// Reuses boss-fight section structure (SEC_INTRO..SEC_OUTRO).

// TAIKO: deep resonant impact drum — sine body + noise attack + pitch drop + overtone
function taiko(time, freq, vol, dur) {
  const d = dur || BEAT * 0.5;
  // body: deep sine with pitch drop (the characteristic taiko "DON")
  const o = audioCtx.createOscillator();
  o.type = "sine";
  o.frequency.setValueAtTime(freq * 1.3, time);
  o.frequency.exponentialRampToValueAtTime(freq, time + 0.04);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(vol, time);
  g.gain.exponentialRampToValueAtTime(0.0001, time + d);
  o.connect(g).connect(masterGain);
  o.start(time); o.stop(time + d + 0.05);
  // attack transient: noise burst
  noiseBurst(time, 0.015, 3000, vol * 0.4);
  // resonant overtone
  const o2 = audioCtx.createOscillator();
  o2.type = "triangle"; o2.frequency.value = freq * 2.1;
  const g2 = audioCtx.createGain();
  g2.gain.setValueAtTime(vol * 0.25, time);
  g2.gain.exponentialRampToValueAtTime(0.0001, time + d * 0.6);
  o2.connect(g2).connect(masterGain);
  o2.start(time); o2.stop(time + d * 0.6 + 0.05);
}

// SHAKUHACHI: dark, breathy Japanese flute — sine + noise, vibrato, portamento
function shakuhachi(time, freq, dur, vol) {
  const o = audioCtx.createOscillator(); o.type = "sine";
  o.frequency.setValueAtTime(freq * 0.85, time);
  o.frequency.exponentialRampToValueAtTime(freq, time + 0.12); // portamento in
  const lfo = audioCtx.createOscillator(); lfo.frequency.value = 5.2;
  const lfoG = audioCtx.createGain(); lfoG.gain.value = freq * 0.012;
  lfo.connect(lfoG).connect(o.frequency);
  const f = audioCtx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 2400; f.Q.value = 2;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0, time);
  g.gain.linearRampToValueAtTime(vol, time + 0.08);
  g.gain.linearRampToValueAtTime(vol * 0.7, time + dur * 0.5);
  g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
  o.connect(g).connect(f).connect(masterGain);
  o.start(time); lfo.start(time);
  o.stop(time + dur + 0.1); lfo.stop(time + dur + 0.1);
  // breathy noise layer
  noiseBurst(time, 0.4, 5000, vol * 0.08);
}

// KOTO: plucked Japanese zither — sharp attack, fast decay, bright
function koto(time, freq, dur, vol) {
  const o = audioCtx.createOscillator(); o.type = "triangle";
  o.frequency.value = freq;
  const o2 = audioCtx.createOscillator(); o2.type = "sawtooth";
  o2.frequency.value = freq * 2.01;
  const f = audioCtx.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = freq * 2; f.Q.value = 3;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(vol, time);
  g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
  const g2 = audioCtx.createGain();
  g2.gain.setValueAtTime(vol * 0.3, time);
  g2.gain.exponentialRampToValueAtTime(0.0001, time + dur * 0.6);
  o.connect(g).connect(f).connect(masterGain);
  o2.connect(g2).connect(f);
  o.start(time); o2.start(time);
  o.stop(time + dur + 0.05); o2.stop(time + dur + 0.05);
}

// GLORIOUS LEAD: triumphant but dark battle hymn — detuned saws, vibrato, bright
function gloriousLead(time, freq, dur, vol) {
  for (const detune of [-8, 0, 8]) {
    const o = audioCtx.createOscillator();
    o.type = "sawtooth"; o.frequency.value = freq; o.detune.value = detune;
    const lfo = audioCtx.createOscillator(); lfo.frequency.value = 5.5;
    const lfoG = audioCtx.createGain(); lfoG.gain.value = freq * 0.006;
    lfo.connect(lfoG).connect(o.frequency);
    const f = audioCtx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 5000; f.Q.value = 1.5;
    const g = audioCtx.createGain();
    const v = vol / 3;
    g.gain.setValueAtTime(0, time);
    g.gain.linearRampToValueAtTime(v, time + 0.03);
    g.gain.linearRampToValueAtTime(v * 0.7, time + dur * 0.6);
    g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
    o.connect(g).connect(f).connect(masterGain);
    o.start(time); lfo.start(time);
    o.stop(time + dur + 0.05); lfo.stop(time + dur + 0.05);
  }
}

// DEMONIC PAD: ominous detuned sawtooths with slow swell, lowpass
function demonicPad(time, freqs, dur, vol) {
  for (const f of freqs) {
    for (const detune of [-10, 0, 10]) {
      const o = audioCtx.createOscillator();
      o.type = "sawtooth"; o.frequency.value = f; o.detune.value = detune;
      const flt = audioCtx.createBiquadFilter();
      flt.type = "lowpass"; flt.frequency.value = 1200; flt.Q.value = 1;
      const g = audioCtx.createGain();
      const v = vol / freqs.length / 3;
      g.gain.setValueAtTime(0, time);
      g.gain.linearRampToValueAtTime(v, time + 0.4);
      g.gain.linearRampToValueAtTime(v * 0.8, time + dur * 0.6);
      g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
      o.connect(g).connect(flt).connect(masterGain);
      o.start(time); o.stop(time + dur + 0.1);
    }
  }
}

function oniDemonStep(step, bar, inBar, chord, time) {
  const sec = sectionFor(bar);
  const beat = Math.floor(inBar / 4);
  const sub = inBar % 4;
  const r1 = stepRand(step, 61), r2 = stepRand(step, 62), r3 = stepRand(step, 63);
  const taikoFreq = chord.bass * 0.5; // deep taiko tuning

  // ---------- TAIKO DRUMS (the demonic heartbeat) ----------
  if (sec === SEC_INTRO) {
    if (sub === 0 && beat === 0) taiko(time, taikoFreq, 0.28, BEAT * 1.5);
    if (inBar === 0) demonicPad(time, [chord.bass, chord.bass * 1.5], BEAT * 4, 0.06);
    if (sub === 2 && beat === 2) noiseBurst(time, 0.02, 9000, 0.03);
  } else if (sec === SEC_MAIN) {
    // driving taiko: DON on 1 & 3, higher rim on 2 & 4, 16th rolls
    if (sub === 0 && (beat === 0 || beat === 2)) taiko(time, taikoFreq, 0.24, BEAT * 0.6);
    if (sub === 0 && (beat === 1 || beat === 3)) {
      taiko(time, taikoFreq * 1.5, 0.12, BEAT * 0.3);
      noiseBurst(time, 0.04, 3000, 0.08);
    }
    if (sub === 2) taiko(time, taikoFreq * 1.2, 0.08, BEAT * 0.15);
    if (inBar === 0) noiseBurst(time, 0.5, 3500, 0.13);
  } else if (sec === SEC_INTENSIFY) {
    // double-time taiko: every 8th gets a hit, building tension
    if (sub === 0 || sub === 2) {
      const f = beat % 2 === 0 ? taikoFreq : taikoFreq * 1.3;
      taiko(time, f, sub === 0 ? 0.18 : 0.12, BEAT * 0.25);
    }
    if (bar % 2 === 1 && inBar >= 12) noiseBurst(time, 0.03, 2800, 0.07);
    noiseBurst(time, 0.02, 9500, sub === 0 ? 0.05 : 0.025);
  } else if (sec === SEC_CLIMAX) {
    // BLAST: 16th alternating taiko + snare — full demonic fury
    if (sub % 2 === 0) taiko(time, taikoFreq, 0.16, BEAT * 0.18);
    else { noiseBurst(time, 0.04, 2500, 0.10); taiko(time, taikoFreq * 1.5, 0.08, BEAT * 0.1); }
    noiseBurst(time, 0.025, 8000, 0.04);
    if (inBar === 0) noiseBurst(time, 0.6, 3000, 0.15);
  } else if (sec === SEC_BREAKDOWN) {
    // half-time: MASSIVE taiko hits on 1, spacious & heavy
    if (sub === 0 && beat === 0) {
      taiko(time, taikoFreq, 0.34, BEAT * 1.2);
      noiseBurst(time, 0.7, 2800, 0.16);
    }
    if (sub === 0 && beat === 2) {
      taiko(time, taikoFreq * 1.3, 0.16, BEAT * 0.4);
      noiseBurst(time, 0.08, 2500, 0.10);
    }
  } else if (sec === SEC_FINAL) {
    // GLORIOUS MAX: taiko + blast + triumphant crashes
    if (sub === 0) taiko(time, taikoFreq, 0.22, BEAT * 0.22);
    if (sub % 2 === 1) { noiseBurst(time, 0.035, 2500, 0.09); taiko(time, taikoFreq * 1.4, 0.08, BEAT * 0.1); }
    noiseBurst(time, 0.025, 8500, 0.05);
    if (inBar === 0) noiseBurst(time, 0.7, 3200, 0.16);
  } else if (sec === SEC_OUTRO) {
    if (sub === 0 && beat === 0) taiko(time, taikoFreq, 0.24, BEAT * 1.0);
    if (inBar === 0) demonicPad(time, [chord.bass, chord.bass * 1.5], BEAT * 4, 0.05);
  }

  // ---------- AGGRESSIVE SYNTH BASS (fast 16th chugs — sakupen intensity) ----------
  if (sec !== SEC_INTRO && sec !== SEC_BREAKDOWN && sec !== SEC_OUTRO) {
    if (sub === 0 || sub === 2) tone(time, chord.bass, BEAT * 0.2, "sawtooth", 0.15, 0.002, 1000);
    if ((sec === SEC_INTENSIFY || sec === SEC_CLIMAX || sec === SEC_FINAL) && r2 < 0.75) {
      tone(time, chord.bass, BEAT * 0.12, "sawtooth", 0.10, 0.001, 900);
    }
  }
  if (sec === SEC_MAIN && inBar === 14) {
    tone(time, chord.bass * Math.pow(2, 1/12), BEAT * 0.25, "sawtooth", 0.11, 0.002, 900);
  }

  // ---------- POWER-CHORD STABS (demonic) ----------
  if ((sec === SEC_MAIN || sec === SEC_INTENSIFY) && (inBar === 0 || inBar === 8)) {
    for (const f of chord.tones) tone(time, f, BEAT * 0.5, "sawtooth", 0.07, 0.003, 2000);
  }
  if (sec === SEC_BREAKDOWN && inBar === 0) {
    for (const f of chord.tones) tone(time, f, BEAT * 1.5, "sawtooth", 0.09, 0.005, 1800);
  }
  if (sec === SEC_FINAL && inBar === 0) {
    for (const f of chord.tones) tone(time, f, BEAT * 0.45, "sawtooth", 0.08, 0.002, 2200);
  }

  // ---------- DEMONIC PAD (ominous backdrop) ----------
  if (inBar === 0 && (sec === SEC_INTRO || sec === SEC_BREAKDOWN || sec === SEC_OUTRO)) {
    demonicPad(time, chord.tones, BEAT * 4, 0.08);
  }
  if (sec === SEC_CLIMAX && inBar === 0) {
    demonicPad(time, chord.tones, BEAT * 4, 0.07);
  }

  // ---------- SHAKUHACHI (dark demonic flute melody) ----------
  if (curLead.length && (sec === SEC_MAIN || sec === SEC_INTENSIFY)) {
    if (inBar === 0 || inBar === 8) {
      const idx = (bar * 2) % curLead.length;
      shakuhachi(time, curLead[idx], BEAT * 1.5, 0.12);
    }
    if (inBar === 4 || inBar === 12) {
      const idx = (bar * 2 + 1) % curLead.length;
      shakuhachi(time, curLead[idx], BEAT * 1.0, 0.10);
    }
  }
  if (curLead.length && sec === SEC_BREAKDOWN && inBar === 0) {
    shakuhachi(time, curLead[0], BEAT * 3, 0.14);
  }

  // ---------- KOTO (rapid plucked arpeggios) ----------
  if (curLead.length && (sec === SEC_INTENSIFY || sec === SEC_CLIMAX)) {
    if (inBar % 2 === 0) {
      const idx = (step * 2 + bar) % curLead.length;
      koto(time, curLead[idx], BEAT * 0.25, 0.09);
    }
    if (inBar % 2 === 1 && r3 < 0.6) {
      const idx = (step * 3 + bar) % curLead.length;
      koto(time, curLead[idx], BEAT * 0.2, 0.08);
    }
  }
  if (curLead.length && sec === SEC_MAIN && bar % 2 === 1) {
    if (inBar === 6 || inBar === 14) {
      const idx = (bar + Math.floor(inBar / 4)) % curLead.length;
      koto(time, curLead[idx], BEAT * 0.4, 0.08);
      koto(time + SIXTEENTH, curLead[(idx + 1) % curLead.length], BEAT * 0.3, 0.07);
    }
  }

  // ---------- GLORIOUS TRIUMPHANT LEAD (climax + final — the battle hymn) ----------
  if (curLead.length && (sec === SEC_CLIMAX || sec === SEC_FINAL)) {
    if (sub === 0 || sub === 2) {
      const idx = (step + bar * 2) % curLead.length;
      const dur = sub === 0 ? BEAT * 0.6 : BEAT * 0.35;
      gloriousLead(time, curLead[idx], dur, 0.13);
    }
    if (sec === SEC_FINAL && sub === 0 && beat === 0) {
      gloriousLead(time, curLead[bar % curLead.length] * 2, BEAT * 1.2, 0.14);
    }
    if (sec === SEC_CLIMAX && r3 < 0.4) {
      const idx = step % curLead.length;
      gloriousLead(time, curLead[idx] * (r3 < 0.15 ? 2 : 1), BEAT * 0.15, 0.09);
    }
  }

  // ---------- INTRO: shakuhachi + koto fanfare, ominous ----------
  if (sec === SEC_INTRO) {
    if (inBar === 0 && bar < 2) {
      shakuhachi(time, curLead[0] * 0.5, BEAT * 3, 0.10);
    }
    if (bar === 2 && inBar === 0) {
      koto(time, chord.tones[0] * 2, BEAT * 0.5, 0.08);
      koto(time + SIXTEENTH, chord.tones[1] * 2, BEAT * 0.4, 0.07);
      koto(time + SIXTEENTH * 2, chord.tones[2] * 2, BEAT * 0.6, 0.08);
    }
    if (bar === 3 && inBar === 0) {
      shakuhachi(time, curLead[2], BEAT * 2, 0.11);
    }
  }

  // ---------- OUTRO: final demonic sting ----------
  if (sec === SEC_OUTRO && bar === curSong.bars - 1 && inBar === 0) {
    taiko(time, taikoFreq, 0.36, BEAT * 3);
    for (const f of chord.tones) tone(time, f, BEAT * 3, "sawtooth", 0.10, 0.005, 2000);
    shakuhachi(time, curLead[curLead.length - 1], BEAT * 3, 0.15);
    noiseBurst(time, 0.8, 3000, 0.18);
  }
}

// ==================== SAMURAI DUEL: epic longer B-side ====================
// 7-section arc telling a samurai duel story:
//   DAWN → DUEL → PARRY → FLURRY → STANDOFF → STRIKE → AFTERMATH
// Adds SHINOBUE (bamboo flute) + NOHKAN (piercing high flute) to the
// oni instrumentation (taiko, shakuhachi, koto, demonic pad, glorious lead).

const SD_DAWN=0, SD_DUEL=1, SD_PARRY=2, SD_FLURRY=3, SD_STANDOFF=4, SD_STRIKE=5, SD_AFTERMATH=6;
function samuraiSection(bar) {
  if (bar < 8)  return SD_DAWN;       // dawn meditation (8 bars)
  if (bar < 16) return SD_DUEL;       // duel begins (8 bars)
  if (bar < 24) return SD_PARRY;      // parry exchange (8 bars)
  if (bar < 32) return SD_FLURRY;     // furious flurry (8 bars)
  if (bar < 40) return SD_STANDOFF;   // the standoff (8 bars)
  if (bar < 56) return SD_STRIKE;     // final strike (16 bars — longest, most intense)
  return SD_AFTERMATH;                // aftermath (8 bars)
}

// SHINOBUE: bright, breathy bamboo flute — triangle + noise, strong vibrato, agile
function shinobue(time, freq, dur, vol) {
  const o = audioCtx.createOscillator(); o.type = "triangle";
  o.frequency.setValueAtTime(freq * 0.9, time);
  o.frequency.exponentialRampToValueAtTime(freq, time + 0.06); // quick slide
  const lfo = audioCtx.createOscillator(); lfo.frequency.value = 6.5;
  const lfoG = audioCtx.createGain(); lfoG.gain.value = freq * 0.015;
  lfo.connect(lfoG).connect(o.frequency);
  const f = audioCtx.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = freq * 1.5; f.Q.value = 2;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0, time);
  g.gain.linearRampToValueAtTime(vol, time + 0.04);
  g.gain.linearRampToValueAtTime(vol * 0.75, time + dur * 0.5);
  g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
  o.connect(g).connect(f).connect(masterGain);
  o.start(time); lfo.start(time);
  o.stop(time + dur + 0.05); lfo.stop(time + dur + 0.05);
  // breath noise
  noiseBurst(time, dur * 0.5, 6000, vol * 0.06);
}

// NOHKAN: piercing, high, shrill Japanese flute — used for dramatic calls
function nohkan(time, freq, dur, vol) {
  const o = audioCtx.createOscillator(); o.type = "sawtooth";
  o.frequency.setValueAtTime(freq * 1.15, time);
  o.frequency.exponentialRampToValueAtTime(freq, time + 0.2); // dramatic downward wail
  const lfo = audioCtx.createOscillator(); lfo.frequency.value = 7.5;
  const lfoG = audioCtx.createGain(); lfoG.gain.value = freq * 0.02;
  lfo.connect(lfoG).connect(o.frequency);
  const f = audioCtx.createBiquadFilter(); f.type = "highpass"; f.frequency.value = 1500; f.Q.value = 1.5;
  const f2 = audioCtx.createBiquadFilter(); f2.type = "lowpass"; f2.frequency.value = 8000;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0, time);
  g.gain.linearRampToValueAtTime(vol, time + 0.08);
  g.gain.linearRampToValueAtTime(vol * 0.8, time + dur * 0.4);
  g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
  o.connect(g).connect(f).connect(f2).connect(masterGain);
  o.start(time); lfo.start(time);
  o.stop(time + dur + 0.05); lfo.stop(time + dur + 0.05);
  noiseBurst(time, 0.3, 7000, vol * 0.05);
}

// FUNK BASS: syncopated slap bass with filter envelope (auto-wah groove)
function funkBass(time, freq, dur, vol, slap) {
  const o = audioCtx.createOscillator(); o.type = "sawtooth"; o.frequency.value = freq;
  const f = audioCtx.createBiquadFilter(); f.type = "lowpass"; f.Q.value = 6;
  // filter envelope: open then close (the classic funk wah-bass)
  f.frequency.setValueAtTime(freq * 8, time);
  f.frequency.exponentialRampToValueAtTime(freq * 2, time + 0.08);
  f.frequency.exponentialRampToValueAtTime(freq * 1.2, time + dur);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0, time);
  g.gain.linearRampToValueAtTime(vol, time + 0.005);
  g.gain.linearRampToValueAtTime(vol * 0.6, time + dur * 0.5);
  g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
  o.connect(g).connect(f).connect(masterGain);
  o.start(time); o.stop(time + dur + 0.05);
  // slap: noise pluck on top for the percussive thumb-slap feel
  if (slap) noiseBurst(time, 0.02, 2500, vol * 0.3);
}

// BRASS STAB: funk horn section stab — detuned saws, short, punchy
function brassStab(time, freqs, dur, vol) {
  for (const f of freqs) {
    for (const detune of [-6, 0, 6]) {
      const o = audioCtx.createOscillator();
      o.type = "sawtooth"; o.frequency.value = f; o.detune.value = detune;
      const flt = audioCtx.createBiquadFilter();
      flt.type = "lowpass"; flt.frequency.value = 3500; flt.Q.value = 1;
      const g = audioCtx.createGain();
      const v = vol / freqs.length / 3;
      g.gain.setValueAtTime(0, time);
      g.gain.linearRampToValueAtTime(v, time + 0.008); // punchy attack
      g.gain.linearRampToValueAtTime(v * 0.4, time + dur * 0.3);
      g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
      o.connect(g).connect(flt).connect(masterGain);
      o.start(time); o.stop(time + dur + 0.05);
    }
  }
}

// WAH GUITAR: funk comping with auto-wah filter sweep
function wahGuitar(time, freq, dur, vol) {
  const o = audioCtx.createOscillator(); o.type = "sawtooth"; o.frequency.value = freq;
  const f = audioCtx.createBiquadFilter(); f.type = "bandpass"; f.Q.value = 4;
  // the wah: filter sweeps up then down
  f.frequency.setValueAtTime(freq * 1.5, time);
  f.frequency.linearRampToValueAtTime(freq * 4, time + 0.04);
  f.frequency.linearRampToValueAtTime(freq * 1.5, time + dur * 0.6);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0, time);
  g.gain.linearRampToValueAtTime(vol, time + 0.01);
  g.gain.linearRampToValueAtTime(vol * 0.5, time + dur * 0.4);
  g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
  o.connect(g).connect(f).connect(masterGain);
  o.start(time); o.stop(time + dur + 0.05);
}

function samuraiDuelStep(step, bar, inBar, chord, time) {
  const sec = samuraiSection(bar);
  const beat = Math.floor(inBar / 4);
  const sub = inBar % 4;
  const r1 = stepRand(step, 71), r2 = stepRand(step, 72), r3 = stepRand(step, 73);
  const taikoFreq = chord.bass * 0.5;
  const next = curProg[(bar + 1) % curProg.length];

  // ============ DAWN MEDITATION — sparse, low, atmospheric ============
  if (sec === SD_DAWN) {
    if (inBar === 0 && beat === 0) taiko(time, taikoFreq, 0.22, BEAT * 2);
    if (inBar === 8 && beat === 2) taiko(time, taikoFreq * 1.3, 0.10, BEAT * 0.6);
    // shakuhachi: slow, mournful phrases (low register, warm)
    if (curLead.length && inBar === 0) {
      const idx = (bar * 2) % curLead.length;
      shakuhachi(time, curLead[idx] * 0.5, BEAT * 4, 0.12);
    }
    if (curLead.length && inBar === 8) {
      const idx = (bar * 2 + 1) % curLead.length;
      shakuhachi(time, curLead[idx] * 0.5, BEAT * 3, 0.10);
    }
    // sparse koto plucks
    if (curLead.length && bar % 2 === 1 && (inBar === 4 || inBar === 12)) {
      koto(time, chord.tones[0] * 2, BEAT * 1.5, 0.06);
    }
    // soft drone pad
    if (inBar === 0) demonicPad(time, [chord.bass, chord.bass * 1.5], BEAT * 4, 0.05);
    // warm funk bass: slow root notes, groovy undercurrent
    if (inBar === 0) funkBass(time, chord.bass, BEAT * 2.5, 0.12, true);
    if (inBar === 8) funkBass(time, chord.bass * 1.5, BEAT * 1.5, 0.10, false);
  }

  // ============ DUEL BEGINS — tension rises, funk groove enters ============
  else if (sec === SD_DUEL) {
    // taiko: steady DON on 1 & 3, rim on 2 & 4
    if (sub === 0 && (beat === 0 || beat === 2)) taiko(time, taikoFreq, 0.22, BEAT * 0.6);
    if (sub === 0 && (beat === 1 || beat === 3)) {
      taiko(time, taikoFreq * 1.5, 0.12, BEAT * 0.3);
      noiseBurst(time, 0.04, 3000, 0.08);
    }
    if (sub === 2) noiseBurst(time, 0.02, 8000, 0.03);
    if (inBar === 0) noiseBurst(time, 0.5, 3500, 0.12);
    // FUNK BASS: syncopated 16th slap groove (the pizazz)
    if (inBar === 0)  funkBass(time, chord.bass, BEAT * 0.5, 0.14, true);
    if (inBar === 3)  funkBass(time, chord.bass * 1.5, BEAT * 0.25, 0.10, false);
    if (inBar === 6)  funkBass(time, chord.bass, BEAT * 0.3, 0.11, true);
    if (inBar === 8)  funkBass(time, chord.tones[1], BEAT * 0.4, 0.12, true);
    if (inBar === 11) funkBass(time, chord.bass * 1.5, BEAT * 0.2, 0.09, false);
    if (inBar === 14) funkBass(time, chord.bass, BEAT * 0.3, 0.11, true);
    // BRASS STABS on downbeats (funk horn section)
    if (inBar === 0) brassStab(time, chord.tones, BEAT * 0.4, 0.10);
    if (inBar === 8) brassStab(time, chord.tones, BEAT * 0.3, 0.08);
    // WAH GUITAR comping on offbeats
    if (inBar === 4 || inBar === 12) wahGuitar(time, chord.tones[1] * 2, BEAT * 0.3, 0.07);
    if (inBar === 7 || inBar === 15) wahGuitar(time, chord.tones[2] * 2, BEAT * 0.2, 0.06);
    // shinobue: melody (mid register, no octave-up)
    if (curLead.length && (inBar === 0 || inBar === 8)) {
      const idx = (bar * 2) % curLead.length;
      shinobue(time, curLead[idx] * 0.5, BEAT * 1.2, 0.10);
    }
    if (curLead.length && (inBar === 4 || inBar === 12)) {
      const idx = (bar * 2 + 1) % curLead.length;
      shinobue(time, curLead[idx] * 0.5, BEAT * 0.9, 0.08);
    }
    // koto flourishes
    if (curLead.length && bar % 2 === 1 && (inBar === 6 || inBar === 14)) {
      const idx = (bar + beat) % curLead.length;
      koto(time, curLead[idx], BEAT * 0.3, 0.08);
      koto(time + SIXTEENTH, curLead[(idx + 1) % curLead.length], BEAT * 0.25, 0.07);
    }
  }

  // ============ PARRY EXCHANGE — faster, funky call-and-response ============
  else if (sec === SD_PARRY) {
    // double-time taiko + 16th hats
    if (sub === 0 || sub === 2) {
      const f = beat % 2 === 0 ? taikoFreq : taikoFreq * 1.3;
      taiko(time, f, sub === 0 ? 0.18 : 0.12, BEAT * 0.22);
    }
    noiseBurst(time, 0.02, 8500, sub === 0 ? 0.06 : 0.03);
    // FUNK BASS: driving 16th syncopation
    if (inBar % 4 === 0) funkBass(time, chord.bass, BEAT * 0.2, 0.13, inBar === 0 || inBar === 8);
    if (inBar % 4 === 2) funkBass(time, chord.bass * 1.5, BEAT * 0.15, 0.10, false);
    if (inBar === 6 || inBar === 14) funkBass(time, chord.tones[1], BEAT * 0.2, 0.10, true);
    // BRASS STABS: punchy off-beat horn hits
    if (inBar === 0 || inBar === 8) brassStab(time, chord.tones, BEAT * 0.3, 0.11);
    if (inBar === 4 || inBar === 12) brassStab(time, [chord.tones[1], chord.tones[2]], BEAT * 0.25, 0.09);
    // WAH GUITAR: fast 16th comping (the funk chug)
    if (inBar % 2 === 0) wahGuitar(time, chord.tones[0] * 2, BEAT * 0.15, 0.06);
    if (inBar === 7 || inBar === 15) wahGuitar(time, chord.tones[2] * 2, BEAT * 0.3, 0.08);
    // SHINOBUE call and response (mid register, no squeaks)
    if (curLead.length && (inBar === 0 || inBar === 8)) {
      const idx = (bar * 2) % curLead.length;
      shinobue(time, curLead[idx] * 0.5, BEAT * 1.0, 0.11);
    }
    if (curLead.length && (inBar === 4 || inBar === 12)) {
      const idx = (bar * 2 + 1) % curLead.length;
      shinobue(time, curLead[idx] * 0.5, BEAT * 0.8, 0.09);
    }
    // rapid koto arpeggios
    if (curLead.length && inBar % 2 === 0) {
      const idx = (step * 2 + bar) % curLead.length;
      koto(time, curLead[idx], BEAT * 0.2, 0.08);
    }
    if (inBar === 0) noiseBurst(time, 0.4, 3000, 0.10);
  }

  // ============ FURIOUS FLURRY — funky chaos, max speed ============
  else if (sec === SD_FLURRY) {
    // BLAST taiko: 16th alternating
    if (sub % 2 === 0) taiko(time, taikoFreq, 0.16, BEAT * 0.18);
    else { noiseBurst(time, 0.035, 2500, 0.10); taiko(time, taikoFreq * 1.5, 0.08, BEAT * 0.1); }
    noiseBurst(time, 0.025, 8000, 0.05);
    // FUNK BASS: relentless slapped 16ths (full funk fury)
    if (sub === 0) funkBass(time, chord.bass, BEAT * 0.12, 0.14, true);
    if (sub === 2 && r2 < 0.7) funkBass(time, chord.bass * 1.5, BEAT * 0.08, 0.10, false);
    if (sub === 1 && r3 < 0.3) funkBass(time, chord.tones[1], BEAT * 0.06, 0.08, true);
    // BRASS STABS: frantic horn jabs
    if (inBar === 0 || inBar === 8) brassStab(time, chord.tones, BEAT * 0.25, 0.12);
    if (inBar === 4 || inBar === 12) brassStab(time, [chord.tones[0], chord.tones[2]], BEAT * 0.2, 0.10);
    // WAH GUITAR: wild comping
    if (inBar % 2 === 0) wahGuitar(time, chord.tones[(step) % 3] * 2, BEAT * 0.1, 0.07);
    // shinobue rapid trills (mid register)
    if (curLead.length && inBar % 2 === 1) {
      const idx = (step + bar) % curLead.length;
      shinobue(time, curLead[idx] * 0.5, BEAT * 0.25, 0.08);
    }
    // koto furiously fast
    if (curLead.length) {
      const idx = (step * 3 + bar) % curLead.length;
      koto(time, curLead[idx], BEAT * 0.15, 0.09);
    }
    // glorious lead stabs (mid, no octave screams)
    if (curLead.length && (inBar === 4 || inBar === 12)) {
      gloriousLead(time, curLead[bar % curLead.length], BEAT * 0.5, 0.10);
    }
    if (inBar === 0) { noiseBurst(time, 0.6, 3000, 0.14); demonicPad(time, chord.tones, BEAT * 4, 0.06); }
  }

  // ============ THE STANDOFF — stillness, half-time, funky tension ============
  else if (sec === SD_STANDOFF) {
    // half-time: massive taiko on 1 only, vast space
    if (sub === 0 && beat === 0) {
      taiko(time, taikoFreq, 0.30, BEAT * 1.5);
      noiseBurst(time, 0.6, 2800, 0.14);
    }
    if (sub === 0 && beat === 2) {
      taiko(time, taikoFreq * 1.3, 0.14, BEAT * 0.5);
    }
    if (sub === 2 && beat === 1) noiseBurst(time, 0.02, 7000, 0.025);
    // shakuhachi: long, suspended notes (the held breath before the strike)
    if (curLead.length && inBar === 0) {
      shakuhachi(time, curLead[0] * 0.5, BEAT * 4, 0.13);
    }
    if (curLead.length && inBar === 8) {
      shakuhachi(time, curLead[2 % curLead.length] * 0.5, BEAT * 3, 0.11);
    }
    // single koto pluck — like a drop of water
    if (curLead.length && inBar === 6) koto(time, chord.tones[0] * 2, BEAT * 2, 0.08);
    if (curLead.length && inBar === 14) koto(time, chord.tones[2] * 2, BEAT * 2, 0.07);
    // funky bass: sparse, ominous single notes (the tension groove)
    if (inBar === 0) funkBass(time, chord.bass, BEAT * 3, 0.14, true);
    if (inBar === 8) funkBass(time, chord.bass * 1.5, BEAT * 2, 0.10, false);
    // wah guitar: slow eerie comping
    if (inBar === 4) wahGuitar(time, chord.tones[1] * 2, BEAT * 2, 0.07);
    // demonic pad swell
    if (inBar === 0) demonicPad(time, chord.tones, BEAT * 4, 0.09);
    // a brass swell at the end of standoff (the signal to strike)
    if (bar === 39 && inBar === 14) {
      brassStab(time, chord.tones, BEAT * 2, 0.12);
      shakuhachi(time, curLead[0], BEAT * 1.5, 0.12);
    }
  }

  // ============ FINAL STRIKE — max intensity, funky glorious, longest ============
  else if (sec === SD_STRIKE) {
    // GLORIOUS MAX: taiko blast + 4-on-floor + crashes
    if (sub === 0) taiko(time, taikoFreq, 0.22, BEAT * 0.22);
    if (sub % 2 === 1) { noiseBurst(time, 0.035, 2500, 0.09); taiko(time, taikoFreq * 1.4, 0.08, BEAT * 0.1); }
    noiseBurst(time, 0.025, 8500, 0.05);
    if (inBar === 0) noiseBurst(time, 0.7, 3200, 0.16);
    // FUNK BASS: full-throttle syncopated slap (the driving groove)
    if (inBar === 0)  funkBass(time, chord.bass, BEAT * 0.4, 0.15, true);
    if (inBar === 3)  funkBass(time, chord.bass * 1.5, BEAT * 0.2, 0.11, false);
    if (inBar === 6)  funkBass(time, chord.bass, BEAT * 0.25, 0.12, true);
    if (inBar === 8)  funkBass(time, chord.tones[1], BEAT * 0.35, 0.13, true);
    if (inBar === 11) funkBass(time, chord.bass * 1.5, BEAT * 0.18, 0.10, false);
    if (inBar === 14) funkBass(time, chord.bass, BEAT * 0.25, 0.12, true);
    // BRASS STABS: triumphant horn section hits
    if (inBar === 0) brassStab(time, chord.tones, BEAT * 0.5, 0.12);
    if (inBar === 8) brassStab(time, chord.tones, BEAT * 0.4, 0.10);
    if (inBar === 4 || inBar === 12) brassStab(time, [chord.tones[1], chord.tones[2]], BEAT * 0.25, 0.08);
    // WAH GUITAR: driving comping
    if (inBar === 2 || inBar === 10) wahGuitar(time, chord.tones[0] * 2, BEAT * 0.25, 0.07);
    if (inBar === 6 || inBar === 14) wahGuitar(time, chord.tones[2] * 2, BEAT * 0.2, 0.06);
    // GLORIOUS LEAD — the triumphant battle hymn (mid register, no octave screams)
    if (curLead.length && (sub === 0 || sub === 2)) {
      const idx = (step + bar * 2) % curLead.length;
      const dur = sub === 0 ? BEAT * 0.6 : BEAT * 0.35;
      gloriousLead(time, curLead[idx] * 0.5, dur, 0.12);
    }
    if (curLead.length && sub === 0 && beat === 0 && bar % 4 === 0) {
      gloriousLead(time, curLead[bar % curLead.length], BEAT * 1.4, 0.13);
    }
    // SHINOBUE counter-melody (mid, heroic, no squeaks)
    if (curLead.length && (inBar === 0 || inBar === 8)) {
      const idx = (bar * 2 + 1) % curLead.length;
      shinobue(time, curLead[idx] * 0.5, BEAT * 1.5, 0.10);
    }
    // koto rapid arpeggios
    if (curLead.length && inBar % 2 === 0) {
      const idx = (step * 2 + bar) % curLead.length;
      koto(time, curLead[idx], BEAT * 0.2, 0.09);
    }
    // demonic pad backdrop
    if (inBar === 0 && bar % 4 === 0) demonicPad(time, chord.tones, BEAT * 4, 0.07);
  }

  // ============ AFTERMATH — resolving, funky, fading ============
  else if (sec === SD_AFTERMATH) {
    // single taiko on bar 1, fading
    if (inBar === 0 && beat === 0) taiko(time, taikoFreq, 0.20, BEAT * 1.5);
    if (inBar === 8 && beat === 2) taiko(time, taikoFreq * 1.3, 0.10, BEAT * 0.6);
    // shakuhachi: peaceful, resolving melody (warm, low)
    if (curLead.length && inBar === 0) {
      const idx = (bar * 2) % curLead.length;
      shakuhachi(time, curLead[idx] * 0.5, BEAT * 4, 0.11);
    }
    if (curLead.length && inBar === 8) {
      const idx = (bar * 2 + 1) % curLead.length;
      shakuhachi(time, curLead[idx] * 0.5, BEAT * 3, 0.09);
    }
    // koto: gentle plucks, resolving
    if (curLead.length && bar % 2 === 0 && (inBar === 4 || inBar === 12)) {
      koto(time, chord.tones[0] * 2, BEAT * 1.5, 0.06);
    }
    // funky bass: relaxed groove, resolving the duel
    if (inBar === 0) funkBass(time, chord.bass, BEAT * 2, 0.11, true);
    if (inBar === 8) funkBass(time, chord.bass * 1.5, BEAT * 1.5, 0.09, false);
    // wah guitar: gentle comping
    if (inBar === 4) wahGuitar(time, chord.tones[1] * 2, BEAT * 1.5, 0.06);
    // brass: soft resolving swell
    if (inBar === 0 && bar % 2 === 0) brassStab(time, chord.tones, BEAT * 2, 0.07);
    // glorious lead: final heroic phrase, fading (mid register)
    if (curLead.length && inBar === 0 && bar < curSong.bars - 2) {
      gloriousLead(time, curLead[0] * 0.5, BEAT * 3, 0.10);
    }
    // soft pad
    if (inBar === 0) demonicPad(time, chord.tones, BEAT * 4, 0.07);
    // final sting
    if (bar === curSong.bars - 1 && inBar === 0) {
      taiko(time, taikoFreq, 0.34, BEAT * 4);
      brassStab(time, chord.tones, BEAT * 4, 0.12);
      for (const f of chord.tones) tone(time, f, BEAT * 4, "sawtooth", 0.10, 0.005, 2000);
      shakuhachi(time, curLead[0], BEAT * 4, 0.15);
      noiseBurst(time, 0.8, 3000, 0.18);
    }
  }
}

function startSynthScheduler() {
  schedStep = 0;
  const totalSteps = curSong.bars * 16;
  const tick = () => {
    const st = songTime();
    while (schedStep < totalSteps) {
      const noteSongT = schedStep * SIXTEENTH;
      const audioT = audioCtx.currentTime + (noteSongT - st);
      if (audioT > audioCtx.currentTime + 0.13) break;
      if (audioT < audioCtx.currentTime - 0.05) { schedStep++; continue; }
      scheduleStep(schedStep, audioT);
      schedStep++;
    }
    if (schedStep < totalSteps) schedTimer = setTimeout(tick, 25);
  };
  tick();
}

// ---------------- Chart generation ----------------
let chart = [];
let curDiff = null;

function rand(a, b) { return a + Math.random()*(b-a); }
function pickLane(avoid, lanes) { let l; do { l = Math.floor(Math.random()*lanes); } while (l === avoid); return l; }

function buildChart(diff) {
  if (chartMode === "generated") return buildGeneratedChart(diff);
  if (curSong.chaos || curSong.bossChart) return buildBossChart(diff);
  if (curSong.heavenly) return buildHeavenlyChart(diff);
  // specific per-difficulty charts
  if (diff.gimmick === "none") return buildSmoothChart(diff);
  if (diff.gimmick === "syncopate") return buildSyncopateChart(diff);
