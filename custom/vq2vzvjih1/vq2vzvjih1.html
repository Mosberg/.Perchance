  if (diff.gimmick === "holds") return buildHoldsChart(diff);
  if (diff.gimmick === "mirror") return buildMirrorChart(diff);
  if (diff.gimmick === "chaos") return buildChaosChart(diff);
  const notes = [];
  const total = curSong.bars * 16;
  let lastLane = -1;
  const add = (step, lane, type, holdSteps) => {
    notes.push({ time: step*SIXTEENTH, lane, type, holdEnd: type==="hold" ? (step+holdSteps)*SIXTEENTH : null, hit:false, held:false, missed:false, decoy: type==="decoy" });
  };
  for (let s = 0; s < total; s++) {
    const inBar = s % 16;
    const bar = Math.floor(s/16);
    const half = s > total/2;
    if (diff.gimmick === "none") {
      if (inBar % 4 === 0 && Math.random() < 0.7) { lastLane = pickLane(lastLane, diff.lanes); add(s, lastLane, "tap"); }
      else if (inBar % 2 === 0 && Math.random() < 0.25) { lastLane = pickLane(lastLane, diff.lanes); add(s, lastLane, "tap"); }
    } else if (diff.gimmick === "syncopate") {
      if (inBar % 2 === 0 && Math.random() < 0.55) { lastLane = pickLane(lastLane, diff.lanes); add(s, lastLane, "tap"); }
      if ((inBar === 3 || inBar === 11) && Math.random() < 0.6) { lastLane = pickLane(lastLane, diff.lanes); add(s, lastLane, "tap"); }
      if (inBar % 4 === 2 && Math.random() < 0.4) { lastLane = pickLane(lastLane, diff.lanes); add(s, lastLane, "tap"); }
    } else if (diff.gimmick === "holds") {
      if (inBar % 2 === 0 && Math.random() < 0.5) {
        if (Math.random() < 0.22) { lastLane = pickLane(lastLane, diff.lanes); add(s, lastLane, "hold", 4 + Math.floor(Math.random()*6)); }
        else { lastLane = pickLane(lastLane, diff.lanes); add(s, lastLane, "tap"); }
      }
      if (inBar % 4 === 2 && Math.random() < 0.3) { lastLane = pickLane(lastLane, diff.lanes); add(s, lastLane, "tap"); }
    } else if (diff.gimmick === "mirror") {
      if (inBar % 2 === 0 && Math.random() < 0.55) { lastLane = pickLane(lastLane, diff.lanes); add(s, lastLane, "tap"); }
      if (inBar % 4 === 2 && Math.random() < 0.4) { lastLane = pickLane(lastLane, diff.lanes); add(s, lastLane, "tap"); }
      // chords (2-3 simultaneous)
      if (inBar === 0 && Math.random() < 0.7) {
        const used = new Set();
        const n = 2 + (Math.random()<0.4?1:0);
        while (used.size < n) used.add(Math.floor(Math.random()*diff.lanes));
        for (const l of used) if (l !== lastLane) add(s, l, "tap");
      }
    } else if (diff.gimmick === "chaos") {
      if (Math.random() < 0.45) { lastLane = pickLane(lastLane, diff.lanes); add(s, lastLane, Math.random()<0.15?"hold":(Math.random()<0.08?"decoy":"tap"), Math.random()<0.15? (3+Math.floor(Math.random()*5)):0); }
      if (inBar % 4 === 0 && Math.random() < 0.6) {
        const used = new Set([lastLane]); const n = 2 + (Math.random()<0.5?1:0);
        while (used.size < n) used.add(Math.floor(Math.random()*diff.lanes));
        for (const l of used) add(s, l, Math.random()<0.1?"decoy":"tap");
      }
    }
  }
  // sort by time
  notes.sort((a,b)=>a.time-b.time);
  return notes;
}

// ==================== SPECIFIC PER-DIFFICULTY CHARTS ====================
// Each difficulty has its own hand-crafted chart pattern — not random.
// Uses a seeded RNG so charts are deterministic and reproducible.

function seededRng(seed) {
  let s = seed | 0;
  return () => {
    s = (s * 1664525 + 1013904223) | 0;
    return ((s >>> 0) / 4294967296);
  };
}
function diffSeed(songIdx, diffId) {
  return (songIdx * 1000 + diffId * 137 + 42) | 0;
}
function pickLaneRng(rng, avoid, lanes) { let l; do { l = Math.floor(rng()*lanes); } while (l === avoid); return l; }

// --- Smooth (Easy): relaxed quarter-note taps, lots of breathing room ---
function buildSmoothChart(diff) {
  const notes = [];
  const total = curSong.bars * 16;
  const L = diff.lanes;
  let lastLane = -1;
  const rng = seededRng(diffSeed(selectedSongIdx, diff.id));
  const add = (step, lane, type) => {
    if (step >= total) return;
    notes.push({ time: step*SIXTEENTH, lane, type:type||"tap", holdEnd: null, hit:false, held:false, missed:false, decoy: false });
  };
  for (let bar = 0; bar < curSong.bars; bar++) {
    const base = bar * 16;
    // tap on beat 1 and 3 every bar
    lastLane = (lastLane + 1 + Math.floor(rng()*2)) % L;
    add(base, lastLane);
    lastLane = (lastLane + 1 + Math.floor(rng()*2)) % L;
    add(base + 8, lastLane);
    // occasional extra on beat 2 or 4
    if (rng() < 0.35) { lastLane = pickLaneRng(rng, lastLane, L); add(base + 4, lastLane); }
    if (rng() < 0.35) { lastLane = pickLaneRng(rng, lastLane, L); add(base + 12, lastLane); }
  }
  notes.sort((a,b)=>a.time-b.time);
  return notes;
}

// --- Syncopate (Normal): off-beat 8th notes, rhythmic variety ---
function buildSyncopateChart(diff) {
  const notes = [];
  const total = curSong.bars * 16;
  const L = diff.lanes;
  let lastLane = -1;
  const rng = seededRng(diffSeed(selectedSongIdx, diff.id));
  const add = (step, lane, type) => {
    if (step >= total) return;
    notes.push({ time: step*SIXTEENTH, lane, type:type||"tap", holdEnd: null, hit:false, held:false, missed:false, decoy: false });
  };
  for (let bar = 0; bar < curSong.bars; bar++) {
    const base = bar * 16;
    // steady 8th-note taps on off-beats
    for (let i = 0; i < 16; i += 2) {
      if (rng() < 0.55) {
        lastLane = (lastLane + 1 + Math.floor(rng()*2)) % L;
        add(base + i, lastLane);
      }
    }
    // syncopated hits on the "and" of beats
    if (rng() < 0.6) { lastLane = pickLaneRng(rng, lastLane, L); add(base + 3, lastLane); }
    if (rng() < 0.6) { lastLane = pickLaneRng(rng, lastLane, L); add(base + 11, lastLane); }
    // beat 4 downbeat
    lastLane = pickLaneRng(rng, lastLane, L);
    add(base + 12, lastLane);
  }
  notes.sort((a,b)=>a.time-b.time);
  return notes;
}

// --- Holds (Hard): mix of tap and sustain/hold notes ---
function buildHoldsChart(diff) {
  const notes = [];
  const total = curSong.bars * 16;
  const L = diff.lanes;
  let lastLane = -1;
  const rng = seededRng(diffSeed(selectedSongIdx, diff.id));
  const add = (step, lane, type, holdLen) => {
    if (step >= total) return;
    notes.push({ time: step*SIXTEENTH, lane, type, holdEnd: type==="hold" ? (step+holdLen)*SIXTEENTH : null, hit:false, held:false, missed:false, decoy: false });
  };
  for (let bar = 0; bar < curSong.bars; bar++) {
    const base = bar * 16;
    // hold on beat 1 every 2 bars
    if (bar % 2 === 0) {
      lastLane = pickLaneRng(rng, lastLane, L);
      add(base, lastLane, "hold", 6 + Math.floor(rng()*6));
    }
    // tap on beat 2
    lastLane = pickLaneRng(rng, lastLane, L);
    add(base + 4, lastLane);
    // hold or tap on beat 3
    if (rng() < 0.4) {
      lastLane = pickLaneRng(rng, lastLane, L);
      add(base + 8, lastLane, "hold", 4 + Math.floor(rng()*4));
    } else {
      lastLane = pickLaneRng(rng, lastLane, L);
      add(base + 8, lastLane);
    }
    // tap on beat 4
    lastLane = pickLaneRng(rng, lastLane, L);
    add(base + 12, lastLane);
    // occasional 16th between beats
    if (rng() < 0.3) { lastLane = pickLaneRng(rng, lastLane, L); add(base + 6, lastLane); }
    if (rng() < 0.3) { lastLane = pickLaneRng(rng, lastLane, L); add(base + 14, lastLane); }
  }
  notes.sort((a,b)=>a.time-b.time);
  return notes;
}

// --- Mirror (Expert): chords + mid-song lane mirror ---
function buildMirrorChart(diff) {
  const notes = [];
  const total = curSong.bars * 16;
  const L = diff.lanes;
  let lastLane = -1;
  const rng = seededRng(diffSeed(selectedSongIdx, diff.id));
  const add = (step, lane, type) => {
    if (step >= total) return;
    notes.push({ time: step*SIXTEENTH, lane, type:type||"tap", holdEnd: null, hit:false, held:false, missed:false, decoy: false });
  };
  for (let bar = 0; bar < curSong.bars; bar++) {
    const base = bar * 16;
    // chord on beat 1 (2-3 lanes)
    const used = new Set();
    const cn = 2 + (rng() < 0.4 ? 1 : 0);
    while (used.size < cn) used.add(Math.floor(rng()*L));
    for (const l of used) { add(base, l); lastLane = l; }
    // single taps on beats 2-4
    for (let i = 4; i < 16; i += 4) {
      lastLane = pickLaneRng(rng, lastLane, L);
      add(base + i, lastLane);
    }
    // off-beat taps
    if (rng() < 0.5) { lastLane = pickLaneRng(rng, lastLane, L); add(base + 6, lastLane); }
    if (rng() < 0.5) { lastLane = pickLaneRng(rng, lastLane, L); add(base + 10, lastLane); }
    if (rng() < 0.5) { lastLane = pickLaneRng(rng, lastLane, L); add(base + 14, lastLane); }
    // chord stab on beat 3 every 2 bars
    if (bar % 2 === 1) {
      const used2 = new Set();
      while (used2.size < 2) used2.add(Math.floor(rng()*L));
      for (const l of used2) if (l !== lastLane) add(base + 8, l);
    }
  }
  notes.sort((a,b)=>a.time-b.time);
  return notes;
}

// --- Chaos (Master): 6 lanes, decoys, holds, speed warps, dense ---
function buildChaosChart(diff) {
  const notes = [];
  const total = curSong.bars * 16;
  const L = diff.lanes;
  let lastLane = -1;
  const rng = seededRng(diffSeed(selectedSongIdx, diff.id));
  const add = (step, lane, type, holdLen) => {
    if (step >= total) return;
    notes.push({ time: step*SIXTEENTH, lane, type:type||"tap", holdEnd: type==="hold" ? (step+holdLen)*SIXTEENTH : null, hit:false, held:false, missed:false, decoy: type==="decoy" });
  };
  for (let bar = 0; bar < curSong.bars; bar++) {
    const base = bar * 16;
    // dense 8th streams
    for (let i = 0; i < 16; i += 2) {
      if (rng() < 0.65) {
        lastLane = (lastLane + 1 + Math.floor(rng()*2)) % L;
        const roll = rng();
        if (roll < 0.08) add(base + i, lastLane, "decoy");
        else if (roll < 0.18) add(base + i, lastLane, "hold", 3 + Math.floor(rng()*4));
        else add(base + i, lastLane, "tap");
      }
    }
    // 16th bursts
    if (rng() < 0.3) {
      for (let j = 0; j < 4; j++) {
        lastLane = (lastLane + 1) % L;
        add(base + Math.floor(rng()*16), lastLane);
      }
    }
    // chord walls
    if (rng() < 0.3) {
      const used = new Set();
      while (used.size < 3) used.add(Math.floor(rng()*L));
      for (const l of used) add(base + 8, l);
    }
  }
  // dedup
  const seen = new Set();
  const dedup = notes.filter(n => {
    const k = n.time.toFixed(4) + ":" + n.lane + ":" + n.type;
    if (seen.has(k)) return false;
    seen.add(k); return true;
  });
  dedup.sort((a,b)=>a.time-b.time);
  return dedup;
}

// ==================== GENERATED CHART MODE ====================
// Randomly generates a chart each play — no seed, different every time.
function buildGeneratedChart(diff) {
  const notes = [];
  const total = curSong.bars * 16;
  const L = diff.lanes;
  let lastLane = -1;
  const add = (step, lane, type, holdLen) => {
    if (step >= total) return;
    notes.push({ time: step*SIXTEENTH, lane, type:type||"tap", holdEnd: type==="hold" ? (step+holdLen)*SIXTEENTH : null, hit:false, held:false, missed:false, decoy: type==="decoy" });
  };
  // density scales with difficulty id
  const dens = 0.3 + diff.id * 0.07;
  for (let s = 0; s < total; s++) {
    const inBar = s % 16;
    if (Math.random() < dens) {
      lastLane = (lastLane + 1 + Math.floor(Math.random()*2)) % L;
      const roll = Math.random();
      if (diff.gimmick === "chaos" && roll < 0.06) add(s, lastLane, "decoy");
      else if (roll < 0.12) add(s, lastLane, "hold", 3 + Math.floor(Math.random()*6));
      else add(s, lastLane, "tap");
    }
    // occasional chords on harder diffs
    if (inBar === 0 && diff.id >= 3 && Math.random() < 0.3) {
      const used = new Set([lastLane]);
      while (used.size < 2) used.add(Math.floor(Math.random()*L));
      for (const l of used) add(s, l, "tap");
    }
  }
  // dedup
  const seen = new Set();
  const dedup = notes.filter(n => {
    const k = n.time.toFixed(4) + ":" + n.lane + ":" + n.type;
    if (seen.has(k)) return false;
    seen.add(k); return true;
  });
  dedup.sort((a,b)=>a.time-b.time);
  return dedup;
}

// ---- CRAZY 4-lane boss chart: streams, jacks, chords, bursts; gimmicks layer on ----
function buildBossChart(diff) {
  const notes = [];
  const total = curSong.bars * 16;
  const L = diff.lanes;
  let lastLane = -1;
  const add = (step, lane, type, holdSteps) => {
    if (step < 0 || step >= total) return;
    notes.push({ time: step*SIXTEENTH, lane, type, holdEnd: type==="hold" ? (step+holdSteps)*SIXTEENTH : null, hit:false, held:false, missed:false, decoy: type==="decoy" });
  };
  // base density grows with difficulty id; samurai B-side is extra dense (harder)
  const dens = (0.45 + diff.id * 0.05) * (curSong.style === "samurai-duel" ? 1.18 : 1.0);
  // section function: samurai-duel uses its own 7-section arc mapped to SEC_* intensities
  const secFn = curSong.style === "samurai-duel" ? (b) => {
    const s = samuraiSection(b);
    if (s === SD_DAWN) return SEC_INTRO;
    if (s === SD_DUEL) return SEC_MAIN;
    if (s === SD_PARRY) return SEC_INTENSIFY;
    if (s === SD_FLURRY) return SEC_CLIMAX;
    if (s === SD_STANDOFF) return SEC_BREAKDOWN;
    if (s === SD_STRIKE) return SEC_FINAL;
    return SEC_OUTRO;
  } : sectionFor;

  for (let s = 0; s < total; s++) {
    const inBar = s % 16;
    const bar = Math.floor(s / 16);
    const sec = secFn(bar);
    const R = Math.random;

    // steady 8th stream in everything but intro/outro
    if (sec !== SEC_INTRO && sec !== SEC_OUTRO && inBar % 2 === 0 && R() < dens) {
      lastLane = (lastLane + 1 + Math.floor(R()*2)) % L;
      add(s, lastLane, "tap");
    }
    // 16th bursts in intense sections
    if ((sec === SEC_INTENSIFY || sec === SEC_CLIMAX || sec === SEC_FINAL) && R() < dens * 0.55) {
      lastLane = pickLane( lastLane, L);
      add(s, lastLane, "tap");
    }
    // jacks (same-lane rapid fire) for tension in climax/final
    if ((sec === SEC_CLIMAX || sec === SEC_FINAL) && inBar % 4 === 2 && R() < 0.45) {
      add(s, lastLane, "tap");
      add(s + 1, lastLane, "tap");
    }
    // big chords on bar starts (2-3 notes)
    if (inBar === 0 && R() < (0.5 + diff.id*0.05)) {
      const used = new Set();
      const n = 2 + (R() < 0.3 && diff.id >= 3 ? 1 : 0);
      while (used.size < n) used.add(Math.floor(R()*L));
      for (const l of used) add(s, l, "tap");
      lastLane = [...used][used.size-1];
    }
    // mid-bar chord stab on beat 3 for harder diffs
    if (inBar === 8 && diff.id >= 3 && R() < 0.4) {
      const used = new Set();
      while (used.size < 2) used.add(Math.floor(R()*L));
      for (const l of used) if (l !== lastLane) add(s, l, "tap");
    }
    // breakdown: huge sparse hits — only a couple of notes per bar
    if (sec === SEC_BREAKDOWN) {
      if (inBar === 0 && R() < 0.8) { add(s, Math.floor(R()*L), "tap"); add(s, Math.floor(R()*L), "tap"); }
      if (inBar === 8 && R() < 0.5) add(s, pickLane( lastLane, L), "tap");
    }
    // intro: sparse ominous taps
    if (sec === SEC_INTRO && inBar === 0 && R() < 0.6) add(s, Math.floor(R()*L), "tap");

    // ---- gimmick layering (keeps each difficulty's identity) ----
    if (diff.gimmick === "holds" && inBar % 4 === 0 && R() < 0.20) {
      add(s, pickLane( lastLane, L), "hold", 4 + Math.floor(R()*6));
    }
    if (diff.gimmick === "chaos") {
      if (R() < 0.05) add(s, pickLane( lastLane, L), "decoy");
      if (R() < 0.07) add(s, pickLane( lastLane, L), "hold", 3 + Math.floor(R()*4));
    }
    // mirror difficulty: extra chord walls to make the mirror flip brutal
    if (diff.gimmick === "mirror" && inBar === 8 && R() < 0.5) {
      const used = new Set();
      while (used.size < 2) used.add(Math.floor(R()*L));
      for (const l of used) add(s, l, "tap");
    }
    if (diff.gimmick === "syncopate" && (inBar === 3 || inBar === 11 || inBar === 14) && R() < 0.5) {
      add(s, pickLane( lastLane, L), "tap");
    }
  }

  // de-dup exact (time,lane) overlaps from chord+stream collisions
  const seen = new Set();
  const dedup = notes.filter(n => {
    const k = n.time.toFixed(4) + ":" + n.lane + ":" + n.type;
    if (seen.has(k)) return false;
    seen.add(k); return true;
  });
  dedup.sort((a,b)=>a.time-b.time);
  return dedup;
}

// ---- HEAVENLY 2-lane chart: F and J only. Notes ORBIT, SPIRAL, and FAKE-OUT ----
// Special note types:
//   "orbit"  — note spirals inward in a circle as it approaches (corkscrew)
//   "fakeout"— note approaches, RETREATS, approaches again ("turns around at you")
//   "dive"   — note arcs in from the side
//   "tap"    — normal straight fall
//   "hold"   — sustain note (hold the key)
function buildHeavenlyChart(diff) {
  const notes = [];
  const total = curSong.bars * 16;
  const R = Math.random;
  let lastLane = 0;
  const add = (step, lane, type, holdSteps) => {
    if (step < 0 || step >= total) return;
    notes.push({
      time: step * SIXTEENTH, lane, type,
      holdEnd: type === "hold" ? (step + holdSteps) * SIXTEENTH : null,
      hit: false, held: false, missed: false, decoy: type === "decoy",
      orbitDir: R() < 0.5 ? 1 : -1,    // spiral direction
      orbitSpeed: 2.5 + R() * 3,       // rotations per second
      fakeCount: 1 + Math.floor(R() * 2), // how many times it turns around
      diveSide: R() < 0.5 ? -1 : 1,
    });
  };

  for (let s = 0; s < total; s++) {
    const inBar = s % 16;
    const bar = Math.floor(s / 16);
    const sec = hSection(bar);
    // base density scales gently with difficulty
    const dens = 0.35 + diff.id * 0.04;

    // alternating F/J on quarter notes (the backbone)
    if (sec !== H_INTRO && sec !== H_OUTRO && inBar % 4 === 0 && R() < dens + 0.3) {
      lastLane = 1 - lastLane; // always alternate
      // pick a special type based on section + difficulty
      let type = "tap";
      const roll = R();
      if (sec === H_CHORUS || sec === H_FINAL) {
        if (roll < 0.25) type = "orbit";
        else if (roll < 0.45) type = "fakeout";
        else if (roll < 0.55) type = "dive";
        else type = "tap";
      } else if (sec === H_BRIDGE) {
        if (roll < 0.35) type = "orbit";
        else if (roll < 0.55) type = "fakeout";
        else type = "tap";
      } else {
        if (roll < 0.12 + diff.id * 0.02) type = "orbit";
        else if (roll < 0.22 + diff.id * 0.02) type = "fakeout";
        else type = "tap";
      }
      add(s, lastLane, type);
    }

    // 8th-note alternation in chorus/final for intensity
    if ((sec === H_CHORUS || sec === H_FINAL) && inBar % 2 === 0 && inBar % 4 !== 0 && R() < dens * 0.7) {
      lastLane = 1 - lastLane;
      let type = "tap";
      if (R() < 0.2) type = "orbit";
      else if (R() < 0.35) type = "dive";
      add(s, lastLane, type);
    }

    // holds on downbeats in verse/bridge (sustained hymn notes)
    if ((sec === H_VERSE || sec === H_BRIDGE) && inBar === 0 && R() < 0.3 + diff.id * 0.05) {
      lastLane = 1 - lastLane;
      add(s, lastLane, "hold", 4 + Math.floor(R() * 8));
    }

    // rapid fakeout bursts in bridge (cruel but beautiful)
    if (sec === H_BRIDGE && inBar === 8 && R() < 0.4 + diff.id * 0.06) {
      add(s, 0, "fakeout");
      add(s + 2, 1, "fakeout");
      add(s + 4, 0, "fakeout");
      lastLane = 1;
    }

    // both lanes simultaneously (chord) on big downbeats in chorus/final
    if ((sec === H_CHORUS || sec === H_FINAL) && inBar === 0 && R() < 0.4 + diff.id * 0.05) {
      add(s, 0, R() < 0.3 ? "orbit" : "tap");
      add(s, 1, R() < 0.3 ? "dive" : "tap");
    }

    // intro: very sparse, single floating notes
    if (sec === H_INTRO && inBar === 0 && bar % 2 === 0 && R() < 0.7) {
      lastLane = 1 - lastLane;
      add(s, lastLane, R() < 0.5 ? "orbit" : "tap");
    }

    // gimmick layering from difficulty
    if (diff.gimmick === "chaos" && R() < 0.04) add(s, 1 - lastLane, "decoy");
    if (diff.gimmick === "mirror" && inBar === 8 && R() < 0.3) {
      add(s, 1 - lastLane, "fakeout");
    }
  }

  // de-dup
  const seen = new Set();
  const dedup = notes.filter(n => {
    const k = n.time.toFixed(4) + ":" + n.lane + ":" + n.type;
    if (seen.has(k)) return false;
    seen.add(k); return true;
  });
  dedup.sort((a, b) => a.time - b.time);
  return dedup;
}

// ---------------- Game state ----------------
let state = null;
const KEY_DOWN = {};

function startGame(diff) {
  applySong(SONGS[selectedSongIdx]);

  }

  if (audioCtx.state === "suspended") audioCtx.resume();

  effects = [];
  state = {
    score: 0, combo: 0, maxCombo: 0,
    perfect: 0, great: 0, good: 0, miss: 0, decoyHit: 0,
    notesHit: 0, totalNotes: chart.filter(n=>!n.decoy).length,
    startTime: 0, running: false, over: false,
    mirror: false, mirrorToggleAt: SONG_LEN/2,

  };

  const url = document.getElementById("audioUrlInput").value.trim();
  useUserAudio = false;
  if (url) {
    loadEl.style.display = "flex";
    userAudioEl = new Audio();
    userAudioEl.crossOrigin = "anonymous";
    userAudioEl.src = url;
    userAudioEl.loop = false;
    userAudioEl.load();
    userAudioEl.oncanplaythrough = () => { loadEl.style.display = "none"; launch(); };
    userAudioEl.onerror = () => { loadEl.style.display = "none"; alert("Couldn't load that audio URL — falling back to synth."); launch(); };
  } else {
    launch();
  }
}

function launch() {
  state.running = true;
  clockOffset = performance.now()/1000 + 0.8; // songTime starts at -0.8 (lead-in)
  if (useUserAudio) {
    userAudioEl.play();
    clockOffset = performance.now()/1000 + 0.3;
  } else {
    startSynthScheduler();
  }
  requestAnimationFrame(gameLoop);
}

// ---------------- Timing ----------------
function songTime() {
  return (performance.now()/1000 - clockOffset) + parseFloat(syncRange.value);
}

// ---------------- Input ----------------
function laneFromKey(key) {
  const k = key.toLowerCase();
  const idx = curDiff.keys.indexOf(k);
  if (idx < 0) return -1;
  return state.mirror ? (curDiff.lanes - 1 - idx) : idx;
}

window.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && state && state.running) { quitToMenu(); return; }
  if (!state || !state.running || state.over) return;
  const k = e.key.toLowerCase();
  if (curDiff.keys.indexOf(k) < 0) return;
  if (KEY_DOWN[k]) return;
  KEY_DOWN[k] = true;
  const lane = laneFromKey(k);
  pressLane(lane);
});
window.addEventListener("keyup", (e) => {
  const k = e.key.toLowerCase();
  KEY_DOWN[k] = false;
  if (!state || !state.running) return;
  if (curDiff.keys.indexOf(k) < 0) return;
  const lane = laneFromKey(k);
  releaseLane(lane);
});

function pressLane(lane) {
  const t = songTime();
  // find nearest unhit note in this lane within window
  let best = null, bestDt = 0.16;
  for (const n of chart) {
    if (n.lane !== lane || n.hit || n.missed) continue;
    if (n.decoy) {
      const dt = Math.abs(n.time - t);
      if (dt < 0.14) { // hit a decoy -> penalty
        n.hit = true; n.missed = true;
        state.decoyHit++; state.combo = 0;
        flashJudg("DECOY!", "#f55");
        spawnMissEffect(lane);
        return;
      }
      continue;
    }
    const dt = Math.abs(n.time - t);
    if (dt < bestDt) { bestDt = dt; best = n; }
  }
  if (!best) return;
  best.hit = true;
  let label, col, pts;
  if (bestDt < 0.045) { label="PERFECT"; col="#7af"; pts=300; state.perfect++; }
  else if (bestDt < 0.09) { label="GREAT"; col="#7e7"; pts=200; state.great++; }
  else if (bestDt < 0.14) { label="GOOD"; col="#fc6"; pts=100; state.good++; }
  else { label="GOOD"; col="#fc6"; pts=100; state.good++; }
  state.combo++; state.maxCombo = Math.max(state.maxCombo, state.combo);
  state.score += pts + Math.floor(state.combo/10)*10;
  state.notesHit++;
  flashJudg(label, col);
  spawnHitEffect(lane, label, col, best.type);
  if (best.type === "hold") {
    best.held = true;
    state.activeHolds[lane] = best;
  }
  best._flash = 0.3;
}

function releaseLane(lane) {
  const h = state.activeHolds[lane];
  if (h) {
    h.held = false;
    delete state.activeHolds[lane];
    const t = songTime();
    if (t < h.holdEnd - 0.08) { /* released early — keep combo, just stop earning */ }
  }
}

let judgTimer = 0;
function flashJudg(text, col) {
  judgEl.textContent = text;
  judgEl.style.color = col;
  judgEl.style.opacity = 1;
  judgTimer = 0.5;
}

// ---------------- Render / loop ----------------
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener("resize", resize);

function layout() {
  const W = window.innerWidth, H = window.innerHeight;
  const lanes = curDiff.lanes;
  const fieldW = Math.min(W * 0.7, lanes * 110);
  const laneW = fieldW / lanes;
  const x0 = (W - fieldW) / 2;
  const judgeY = H - 120;
  return { W, H, lanes, laneW, x0, judgeY, fieldW };
}

let lastFrame = 0;
function gameLoop(ts) {
  if (!state || !state.over) requestAnimationFrame(gameLoop);
  const dt = lastFrame ? Math.min(0.05, (ts - lastFrame)/1000) : 0.016;
  lastFrame = ts;
  const t = songTime();

  // mirror toggle (expert)
  if (curDiff.gimmick === "mirror" && !state.mirror && t > state.mirrorToggleAt) {
    state.mirror = true;
    flashJudg("MIRROR!", "#f7a");
  }

  // miss detection: notes that passed
  for (const n of chart) {
    if (!n.hit && !n.missed && !n.decoy && t > n.time + 0.16) {
      n.missed = true; state.miss++; state.combo = 0;
      flashJudg("MISS", "#f55");
      spawnMissEffect(n.lane);
    }
    if (n.decoy && !n.missed && t > n.time + 0.16) { n.missed = true; } // decoys expire harmlessly
  }
  // hold scoring
  for (const lane in state.activeHolds) {
    const h = state.activeHolds[lane];
    if (h && h.held && t <= h.holdEnd) {
      state.score += 6;
    } else if (h && t > h.holdEnd) {
      delete state.activeHolds[lane]; h.held = false;
    }
  }

  // progress / end
  progressEl.style.width = Math.min(100, (t / SONG_LEN)*100) + "%";
  if (t > SONG_LEN + 1.0) { endGame(); return; }

  render(t, dt);
  scoreEl.textContent = state.score.toLocaleString();
  comboEl.textContent = state.combo > 1 ? state.combo + "x COMBO" : "";

  if (judgTimer > 0) { judgTimer -= dt; if (judgTimer <= 0) judgEl.style.opacity = 0; }
}

// ==================== HIT EFFECTS (particles, rings, text pops) ====================
let effects = [];
function spawnHitEffect(lane, label, col, noteType) {
  const L = layout();
  const laneIdx = state.mirror ? (curDiff.lanes - 1 - lane) : lane;
  const cx = L.x0 + laneIdx * L.laneW + L.laneW / 2;
  const cy = L.judgeY;
  const isPerfect = label === "PERFECT";
  const isGreat = label === "GREAT";
  // expanding ring(s)
  const rings = isPerfect ? 3 : isGreat ? 2 : 1;
  for (let i = 0; i < rings; i++) {
    effects.push({ type: "ring", x: cx, y: cy, r: 10, maxR: 50 + i * 25 + (isPerfect ? 30 : 0), col, life: 0.5 + i * 0.1, age: 0, delay: i * 0.05 });
  }
  // particle burst
  const count = isPerfect ? 18 : isGreat ? 12 : 7;
  for (let i = 0; i < count; i++) {
    const ang = (Math.PI * 2 * i / count) + Math.random() * 0.3;
    const spd = (isPerfect ? 180 : isGreat ? 130 : 90) + Math.random() * 60;
    effects.push({
      type: "particle", x: cx, y: cy,
      vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd - 30,
      col, life: 0.5 + Math.random() * 0.3, age: 0,
      size: isPerfect ? 5 : isGreat ? 4 : 3,
    });
  }
  // sparkles for perfect
  if (isPerfect) {
    for (let i = 0; i < 8; i++) {
      effects.push({
        type: "sparkle", x: cx + (Math.random()-0.5)*40, y: cy + (Math.random()-0.5)*40,
        col: "#fff", life: 0.6, age: 0, size: 3 + Math.random()*3,
      });
    }
  }
  // judgment text pop at the lane
  effects.push({ type: "text", x: cx, y: cy - 30, text: label, col, life: 0.7, age: 0 });
  // screen flash for perfect
  if (isPerfect) effects.push({ type: "flash", col, life: 0.15, age: 0 });
}

function spawnMissEffect(lane) {
  const L = layout();
  const laneIdx = state.mirror ? (curDiff.lanes - 1 - lane) : lane;
  const cx = L.x0 + laneIdx * L.laneW + L.laneW / 2;
  const cy = L.judgeY;
  // red X mark
  effects.push({ type: "missX", x: cx, y: cy, life: 0.6, age: 0 });
  // dark particles falling
  for (let i = 0; i < 8; i++) {
    effects.push({
      type: "particle", x: cx, y: cy,
      vx: (Math.random()-0.5)*80, vy: 40 + Math.random()*60,
      col: "#f55", life: 0.4 + Math.random()*0.2, age: 0, size: 3,
    });
  }
  // red flash
  effects.push({ type: "flash", col: "#ff3344", life: 0.12, age: 0 });
}

function updateAndDrawEffects(dt) {
  const W = window.innerWidth, H = window.innerHeight;
  for (let i = effects.length - 1; i >= 0; i--) {
    const e = effects[i];
    e.age += dt;
    if (e.age >= e.life) { effects.splice(i, 1); continue; }
    const p = e.age / e.life; // 0..1 progress
    const alpha = 1 - p;

    if (e.type === "ring") {
      const r = e.r + (e.maxR - e.r) * p;
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = alpha * 0.7;
      ctx.strokeStyle = e.col;
      ctx.lineWidth = 3 * (1 - p * 0.5);
      ctx.beginPath(); ctx.arc(e.x, e.y, r, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    } else if (e.type === "particle") {
      e.x += e.vx * dt; e.y += e.vy * dt;
      e.vy += 200 * dt; // gravity
      e.vx *= 0.96;
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = alpha;
      ctx.fillStyle = e.col;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.size * (1 - p * 0.3), 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    } else if (e.type === "sparkle") {
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = alpha;
      ctx.fillStyle = e.col;
      const s = e.size * (1 + Math.sin(e.age * 20) * 0.3);
      // star shape
      ctx.translate(e.x, e.y); e.x += Math.sin(e.age*5)*0.5;
      ctx.beginPath();
      for (let k = 0; k < 4; k++) {
        const a = k * Math.PI / 2;
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(a)*s, Math.sin(a)*s);
      }
      ctx.lineWidth = 1.5; ctx.strokeStyle = e.col; ctx.stroke();
      ctx.restore();
    } else if (e.type === "text") {
      const yOff = -p * 40;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.font = "800 22px 'Orbitron', system-ui"; ctx.textAlign = "center";
      ctx.fillStyle = e.col;
      ctx.shadowColor = e.col; ctx.shadowBlur = 12;
      ctx.fillText(e.text, e.x, e.y + yOff);
      ctx.restore();
    } else if (e.type === "missX") {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = "#f55"; ctx.lineWidth = 4 * (1 - p * 0.3);
      ctx.shadowColor = "#f00"; ctx.shadowBlur = 10;
      const s = 18;
      ctx.beginPath();
      ctx.moveTo(e.x - s, e.y - s); ctx.lineTo(e.x + s, e.y + s);
      ctx.moveTo(e.x + s, e.y - s); ctx.lineTo(e.x - s, e.y + s);
      ctx.stroke();
      ctx.restore();
    } else if (e.type === "flash") {
      ctx.save();
      ctx.globalAlpha = alpha * 0.15;
      ctx.fillStyle = e.col;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }
  }
}

function render(t, dt) {
  const L = layout();
  const { W, H, lanes, laneW, x0, judgeY } = L;
  ctx.clearRect(0,0,W,H);

  const isHeavenly = !!curSong.heavenly;

  // bg gradient
  const bg = ctx.createLinearGradient(0,0,0,H);
  if (isHeavenly) {
    bg.addColorStop(0, "#0d0a1a"); bg.addColorStop(0.5, "#141028"); bg.addColorStop(1, "#1a1535");
    ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);
    // heavenly light rays from top
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (let i = 0; i < 7; i++) {
      const cx = W * (0.15 + i * 0.12);
      const grad = ctx.createLinearGradient(cx, 0, cx + Math.sin(t*0.3 + i)*60, H);
      grad.addColorStop(0, "rgba(180,160,255,0.06)");
      grad.addColorStop(1, "rgba(180,160,255,0)");
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(cx - 30, 0); ctx.lineTo(cx + 30, 0); ctx.lineTo(cx + 90 + Math.sin(t*0.3+i)*40, H); ctx.lineTo(cx - 90 + Math.sin(t*0.3+i)*40, H);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    // floating particles
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (let i = 0; i < 30; i++) {
      const px = (i * 137.5 + t * 20) % W;
      const py = (i * 89.3 + t * 15) % H;
      const sz = 1 + (i % 3);
      ctx.fillStyle = `rgba(200,190,255,${0.15 + 0.1*Math.sin(t + i)})`;
      ctx.beginPath(); ctx.arc(px, py, sz, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  } else {
    bg.addColorStop(0, "#0a0a16"); bg.addColorStop(1, "#15152a");
    ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);
  }

  // lanes
  for (let i = 0; i < lanes; i++) {
    const x = x0 + i*laneW;
    if (isHeavenly) {
      ctx.fillStyle = (i%2===0) ? "rgba(180,160,255,0.03)" : "rgba(200,180,255,0.05)";
    } else {
      ctx.fillStyle = (i%2===0) ? "rgba(255,255,255,0.025)" : "rgba(255,255,255,0.05)";
    }
    ctx.fillRect(x, 0, laneW, judgeY+10);
    ctx.strokeStyle = isHeavenly ? "rgba(180,160,255,0.08)" : "rgba(255,255,255,0.06)";
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x, judgeY+10); ctx.stroke();
  }
  // outer border
  ctx.strokeStyle = isHeavenly ? "rgba(180,160,255,0.15)" : "rgba(255,255,255,0.1)";
  ctx.lineWidth = 2;
  ctx.strokeRect(x0, 0, lanes*laneW, judgeY+10);

  // judge line
  if (isHeavenly) {
    const jg = ctx.createLinearGradient(x0, 0, x0 + lanes*laneW, 0);
    jg.addColorStop(0, "rgba(180,160,255,0)");
    jg.addColorStop(0.5, "rgba(220,200,255,0.4)");
    jg.addColorStop(1, "rgba(180,160,255,0)");
    ctx.fillStyle = jg;
  } else {
    ctx.fillStyle = "rgba(255,255,255,0.15)";
  }
  ctx.fillRect(x0, judgeY, lanes*laneW, 4);
  // key labels
  ctx.font = "700 16px 'Inter', system-ui"; ctx.textAlign = "center";
  for (let i = 0; i < lanes; i++) {
    const disp = state.mirror ? curDiff.keys[lanes-1-i] : curDiff.keys[i];
    ctx.fillStyle = KEY_DOWN[curDiff.keys[i]] ? curDiff.color : "rgba(255,255,255,0.4)";
    ctx.fillText(disp.toUpperCase(), x0 + i*laneW + laneW/2, judgeY + 30);
  }

  // scroll speed (chaos warps it)
  let speed = curDiff.speed;
  if (curDiff.gimmick === "chaos") speed *= (1 + 0.35*Math.sin(t*0.7) + 0.15*Math.sin(t*1.9));

  // notes
  for (const n of chart) {
    if (n.hit && n.type !== "hold") {
      // brief fade-out burst instead of vanishing instantly
      if (n._flash && n._flash > 0) {
        const dt = n.time - t;
        if (dt < -0.3) continue;
        const laneIdx = state.mirror ? (lanes-1-n.lane) : n.lane;
        const x = x0 + laneIdx*laneW + laneW*0.16;
        const w = laneW*0.68;
        const y = judgeY - dt * speed;
        const a = Math.max(0, n._flash / 0.3);
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        ctx.globalAlpha = a * 0.6;
        const col = isHeavenly ? "#c8b0ff" : curDiff.color;
        drawNote(x, y, w, col, a * 0.6, false);
        ctx.restore();
      }
      continue;
    }
    if (n.decoy && n.missed) continue;
    // missed notes pass through as gray ghosts below the judge line
    if (n.missed && n.type !== "hold") {
      const ndt = n.time - t;
      if (ndt > 2.5) continue;
      if (ndt < -0.8) continue; // fade out after passing through
      const laneIdx = state.mirror ? (lanes-1-n.lane) : n.lane;
      const x = x0 + laneIdx*laneW + laneW*0.16;
      const w = laneW*0.68;
      const y = judgeY - ndt * speed;
      const ghostAlpha = Math.max(0, 1 - Math.abs(ndt) / 0.8) * 0.4;
      ctx.save();
      ctx.globalCompositeOperation = "source-over";
      drawNote(x, y, w, "#666677", ghostAlpha, false);
      ctx.restore();
      continue;
    }
    const ndt = n.time - t;
    if (ndt < -0.3 && !(n.type==="hold" && n.held)) continue;
    if (ndt > 2.5) continue;

    // stealth: invisible until close
    let alpha = 1;
    if (curDiff.gimmick === "chaos" && !n.decoy) {
      alpha = ndt > 0.45 ? 0 : Math.min(1, (0.45 - ndt)/0.45 + 0.15);
      if (ndt < 0) alpha = 1;
    }

    // ---- compute note position (special paths for heavenly note types) ----
    let x, y;
    const laneIdx = state.mirror ? (lanes-1-n.lane) : n.lane;
    const laneCenter = x0 + laneIdx*laneW + laneW/2;
    const noteW = laneW*0.68;
    const baseY = judgeY - ndt * speed;

    if (isHeavenly && (n.type === "orbit" || n.type === "fakeout" || n.type === "dive")) {
      const pos = heavenlyNotePos(n, ndt, t, laneCenter, judgeY, speed, laneW);
      x = pos.x - noteW/2;
      y = pos.y;
      alpha *= pos.alpha;
    } else {
      x = x0 + laneIdx*laneW + laneW*0.16;
      y = baseY;
    }

    if (n.decoy) {
      drawNote(x, y, noteW, "#ff3344", 1, true);
      continue;
    }

    const col = isHeavenly ? "#c8b0ff" : (n.type === "hold" ? "#ffd166" : curDiff.color);
    if (n.type === "hold") {
      const endY = judgeY - (n.holdEnd - t) * speed;
      const top = Math.min(y, endY), hgt = Math.abs(endY - y);
      const holdCol = isHeavenly ? "#c8b0ff" : "#ffd166";
      ctx.globalAlpha = alpha * 0.7;
      const hgrad = ctx.createLinearGradient(x, top, x, top + hgt);
      hgrad.addColorStop(0, shadeColor(holdCol, 20));
      hgrad.addColorStop(0.5, holdCol);
      hgrad.addColorStop(1, shadeColor(holdCol, -25));
      ctx.fillStyle = hgrad;
      ctx.fillRect(x, top, noteW, Math.max(6, hgt));
      // hold note border
      ctx.strokeStyle = shadeColor(holdCol, -40);
      ctx.lineWidth = 1.5;
      ctx.strokeRect(x, top, noteW, Math.max(6, hgt));
      ctx.globalAlpha = 1;
    }

    // heavenly glow
    if (isHeavenly) {
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = alpha * 0.4;
      const glow = ctx.createRadialGradient(x + noteW/2, y + 9, 0, x + noteW/2, y + 9, 35);
      glow.addColorStop(0, "rgba(200,180,255,0.5)");
      glow.addColorStop(1, "rgba(200,180,255,0)");
      ctx.fillStyle = glow;
      ctx.fillRect(x - 30, y - 30, noteW + 60, 70);
      ctx.restore();
    }

    drawNote(x, y, noteW, col, alpha, false);
    if (n._flash) { n._flash -= dt; }
  }
  ctx.globalAlpha = 1;
  updateAndDrawEffects(dt);
}

// ---- compute positions for orbit/fakeout/dive notes ----
function heavenlyNotePos(n, dt, t, laneCenter, judgeY, speed, laneW) {
  // dt > 0: future (above judge line), dt = 0: at judge line, dt < 0: past
  const baseY = judgeY - dt * speed;
  let x = laneCenter, y = baseY, alpha = 1;

  if (n.type === "orbit") {
    // spiral inward: orbit radius shrinks as note approaches judge line
    const progress = Math.min(1, dt / 2.0); // 1 when far, 0 when close
    const radius = laneW * 0.45 * progress + 5;
    const angle = t * n.orbitSpeed * Math.PI * 2 * n.orbitDir + n.orbitDir * dt * 3;
    x = laneCenter + Math.cos(angle) * radius;
    y = baseY + Math.sin(angle) * radius * 0.3; // slight vertical wobble
    // fade in from far
    alpha = Math.min(1, (2.0 - dt) / 0.5);
    if (dt < 0) alpha = 1;
  } else if (n.type === "fakeout") {
    // "turns around at you multiple times": the note approaches, retreats, approaches again
    // visual dt oscillates: the note's apparent distance pulses
    const phase = Math.max(0, dt);
    const pulse = Math.sin(phase * n.fakeCount * Math.PI * 2.2);
    // when pulse > 0, note is farther (retreating); when < 0, closer (advancing)
    const visualDt = dt + pulse * 0.25;
    y = judgeY - visualDt * speed;
    x = laneCenter + Math.sin(phase * 2) * laneW * 0.08; // slight sway
    // flash when retreating (turning around)
    alpha = pulse > 0.3 ? 0.5 : 1;
    if (dt < 0) alpha = 1;
  } else if (n.type === "dive") {
    // arcs in from the side
    const progress = Math.min(1, dt / 1.8);
    const arc = Math.sin(progress * Math.PI); // 0 at start, 1 at mid, 0 at end
    x = laneCenter + n.diveSide * laneW * 1.5 * arc * progress;
    y = baseY;
    alpha = Math.min(1, (1.8 - dt) / 0.4);
    if (dt < 0) alpha = 1;
  }

  return { x, y, alpha };
}

function drawNote(x, y, w, col, alpha, isDecoy) {
  ctx.globalAlpha = alpha;
  const h = 20, r = 10;
  const grad = ctx.createLinearGradient(x, y, x, y + h);
  if (isDecoy) { grad.addColorStop(0, "#ff4455"); grad.addColorStop(1, "#cc1122"); }
  else { grad.addColorStop(0, col); grad.addColorStop(1, shadeColor(col, -30)); }
  ctx.fillStyle = grad;
  roundRect(x, y, w, h, r); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.45)";
  roundRect(x + 3, y + 2.5, w - 6, 6, 3); ctx.fill();
  ctx.fillStyle = "rgba(0,0,0,0.25)";
  roundRect(x + 2, y + h - 5, w - 4, 3, 2); ctx.fill();
  if (isDecoy) {
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x+6, y+3); ctx.lineTo(x+w-6, y+h-3);
    ctx.moveTo(x+w-6, y+3); ctx.lineTo(x+6, y+h-3);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}
function shadeColor(hex, amt) {
  let r, g, b;
  if (hex.startsWith("#")) {
    r = parseInt(hex.slice(1,3),16); g = parseInt(hex.slice(3,5),16); b = parseInt(hex.slice(5,7),16);
  } else return hex;
  r = Math.max(0, Math.min(255, r + amt));
  g = Math.max(0, Math.min(255, g + amt));
  b = Math.max(0, Math.min(255, b + amt));
  return `rgb(${r},${g},${b})`;
}
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

function quitToMenu() {
  state.over = true;
  if (schedTimer) { clearTimeout(schedTimer); schedTimer = null; }
  if (userAudioEl) { userAudioEl.pause(); }
  gameEl.hidden = true; resultsEl.hidden = true; menuEl.hidden = false;
}

// ---------------- End ----------------
function endGame() {
  state.over = true;
  if (schedTimer) { clearTimeout(schedTimer); schedTimer = null; }
  if (userAudioEl) { userAudioEl.pause(); }
  gameEl.hidden = true;
  resultsEl.hidden = false;
  const s = state;
  const acc = s.totalNotes ? (s.perfect*1 + s.great*0.65 + s.good*0.35) / s.totalNotes : 0;
  let grade = "D";
  if (acc > 0.95) grade="S"; else if (acc>0.88) grade="A"; else if (acc>0.75) grade="B"; else if (acc>0.6) grade="C";
  document.getElementById("resTitle").textContent = curSong.title + " · " + curDiff.name + " — Complete";
  document.getElementById("gradeEl").textContent = grade;
  document.getElementById("gradeEl").style.color = curDiff.color;
  document.getElementById("resScore").textContent = "Score: " + s.score.toLocaleString();
  document.getElementById("resAcc").textContent = "Accuracy: " + (acc*100).toFixed(1) + "%";
  document.getElementById("resMax").textContent = "Max Combo: " + s.maxCombo + "x";
  document.getElementById("resBreakdown").textContent =
    `Perfect ${s.perfect} · Great ${s.great} · Good ${s.good} · Miss ${s.miss}` + (s.decoyHit? ` · Decoys hit ${s.decoyHit}`:"");
}

resize();
</script>
