<style>

  :root {
    --bg-dark: #0d1117;
    --bg-mid: #161b22;
    --bg-panel: rgba(22, 27, 34, 0.92);
    --text-main: #e6edf3;
    --text-dim: #8b949e;
    --accent: #58a6ff;

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {

    overflow: hidden;
    font-family: 'Inter', sans-serif;
    color: var(--text-main);
    background: var(--bg-dark);

  #game-root {

    inset: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;

  /* ===== BACKGROUND ===== */
  #bg-layer {
    position: absolute;
    inset: 0;
    z-index: 0;
    transition: background 1.2s ease;
    background: linear-gradient(180deg, #1a1f2e 0%, #0d1117 100%);
  }
  #bg-layer::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 30%, rgba(88,166,255,0.06), transparent 70%);
    pointer-events: none;
  }

  /* ===== TITLE SCREEN ===== */

    position: absolute;
    inset: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, #1a1f2e 0%, #0d1117 60%, #0a0e14 100%);
    text-align: center;
    padding: 2rem;
    transition: opacity 0.8s ease;
  }
  #title-screen::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 20% 20%, rgba(255,126,182,0.08), transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(88,166,255,0.08), transparent 40%);
    pointer-events: none;
  }
  .title-main {
    font-family: 'Lora', serif;
    font-size: clamp(2.5rem, 7vw, 4.5rem);
    font-weight: 500;
    letter-spacing: -0.02em;
    color: var(--text-main);
    text-shadow: 0 2px 30px rgba(88,166,255,0.2);
    margin-bottom: 0.3rem;
    position: relative;
  }
  .title-sub {
    font-size: clamp(0.85rem, 2vw, 1.05rem);
    color: var(--text-dim);
    font-weight: 300;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 3rem;
    position: relative;
  }
  .title-btn {

    color: var(--text-main);
    padding: 0.85rem 2.5rem;
    font-size: 1rem;
    font-family: 'Inter', sans-serif;

  .title-btn:hover {

    right: 1rem;

    display: flex;
    flex-direction: column;

  .toast {
    background: rgba(22,27,34,0.95);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    padding: 0.6rem 1rem;
    border-radius: 8px;
    font-size: 0.82rem;
    color: var(--text-main);

    box-shadow: var(--shadow);

  .toast.info { border-left-color: var(--accent); }
  @keyframes toastIn { from { opacity:0; transform:translateX(30px); } }
  @keyframes toastOut { to { opacity:0; transform:translateX(30px); } }

  .overlay {

  .phone-panel { max-width: 400px; }
  .msg-list { display: flex; flex-direction: column; gap: 0.5rem; }

  .msg-thread-header { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.5rem; }
  .msg-thread-name { font-weight: 600; font-size: 0.88rem; }
  .msg-bubble {
    padding: 0.5rem 0.8rem;

    font-size: 0.82rem;
    margin: 0.2rem 0;
    max-width: 85%;
    line-height: 1.4;

  .msg-list-inner { display: flex; flex-direction: column; }

  /* ===== JOURNAL ===== */
  .journal-entry {
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem;
    margin-bottom: 0.7rem;
  }
  .journal-entry h4 { font-family: 'Lora', serif; font-size: 1rem; margin-bottom: 0.4rem; color: var(--accent-warm); }
  .journal-entry p { font-size: 0.85rem; line-height: 1.6; color: var(--text-dim); }
  .journal-entry .date { font-size: 0.7rem; color: var(--text-dim); opacity: 0.6; margin-bottom: 0.3rem; }
  .journal-locked {
    text-align: center;
    padding: 1.5rem;
    color: var(--text-dim);
    font-style: italic;
    font-size: 0.85rem;
  }

  /* ===== FADE ===== */
  #fade-overlay {
    position: absolute;
    inset: 0;
    z-index: 50;
    background: var(--bg-dark);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.5s ease;
  }
  #fade-overlay.active { opacity: 1; pointer-events: all; }

  /* ===== SCENE INDICATOR ===== */
  #scene-indicator {
    position: absolute;
    top: 1rem; left: 1rem;
    z-index: 6;
    font-size: 0.72rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    opacity: 0.6;
  }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 600px) {
    #top-bar { padding: 0.5rem 0.7rem; font-size: 0.75rem; }
    .top-info { gap: 0.4rem; }
    #dialogue-ctn { padding: 1rem; }
    #choices-ctn { padding: 0.5rem 1rem 1rem; }
    .choice-btn { padding: 0.65rem 0.9rem; font-size: 0.85rem; }
    #dialogue-text { font-size: 0.95rem; min-height: 60px; }
    .panel { max-width: 95vw; }
  }
</style>

    location: "Ashwood High School",
    relationships: {
      maya:   { friendship: 0, trust: 0, respect: 0, met: false },

      elena:  { friendship: 0, trust: 0, respect: 0, met: false },

      grace:  { friendship: 0, trust: 0, respect: 0, met: false },
      lawson: { friendship: 0, trust: 0, respect: 0, met: false },
      mom:    { friendship: 0, trust: 0, respect: 0, met: true },
    },
    grades: 75,
    reputation: 0,
    journal: [],
    flags: {},
    messages: { mom: true },
    endOfDayMsgsAdded: false,
  };
}

let state = createState();
let isTyping = false;
let typingTimer = null;
let currentTextIndex = 0;
let currentTextBlocks = [];
let awaitingClick = false;
let currentSceneData = null;

// ============================================================
//  ENGINE
// ============================================================

function $(id) { return document.getElementById(id); }

function init() {
  $('startBtn').addEventListener('click', () => { state = createState(); startGame(); });
  $('continueBtn').addEventListener('click', () => { loadGame(); startGame(); });
  $('phoneBtn').addEventListener('click', () => openOverlay('phoneOverlay', renderPhone));
  $('journalBtn').addEventListener('click', () => openOverlay('journalOverlay', renderJournal));
  $('statsBtn').addEventListener('click', () => openOverlay('statsOverlay', renderStats));
  $('saveBtn').addEventListener('click', () => openOverlay('saveOverlay', renderSaveMenu));
  $('menuBtn').addEventListener('click', () => openOverlay('menuOverlay', renderMenu));
  document.querySelectorAll('[data-close]').forEach(btn => {
    btn.addEventListener('click', () => $('' + btn.dataset.close).classList.remove('active'));
  });
  $('dialogue-text').addEventListener('click', () => { if (awaitingClick) advanceText(); });

  if (localStorage.getItem('atb_save')) {
    $('continueBtn').style.display = '';
  }

  // Add Mom's initial messages
  state.messages.mom = true;
}

function startGame() {
  $('title-screen').style.opacity = '0';
  setTimeout(() => {
    $('title-screen').style.display = 'none';
    $('top-bar').style.display = '';
    $('game-area').style.display = '';
  }, 800);
  loadScene(state.currentScene);
}

function loadScene(sceneId) {
  const scene = SCENES[sceneId];
  if (!scene) { console.error("Scene not found:", sceneId); return; }
  currentSceneData = scene;
  state.currentScene = sceneId;

  // Update chapter info
  if (scene.chapter) {
    state.chapter = scene.chapter;
    $('chapterBadge').textContent = `Chapter ${scene.chapter}: ${scene.chapterTitle || ""}`;
  }

  // Update location/time/day
  if (scene.location) { state.location = scene.location; $('locationInfo').textContent = scene.location; }
  if (scene.time) { state.time = scene.time; $('timeInfo').textContent = scene.time; }
  if (scene.day) { state.day = scene.day; $('dayInfo').textContent = `Day ${scene.day}`; }

  // Scene indicator
  $('scene-indicator').textContent = scene.location || '';

  // Background
  const bg = BG_GRADIENTS[scene.bg] || BG_GRADIENTS.default;
  $('bg-layer').style.background = bg;

  // Journal unlock
  if (scene.journal && !state.journal.includes(scene.journal.id)) {
    state.journal.push(scene.journal.id);
    showToast(`Journal entry unlocked: "${scene.journal.title}"`, "info");
  }

  // Process scene-level flags
  if (scene.flag) {
    Object.assign(state.flags, scene.flag);
    if (scene.flag.met_maya) state.relationships.maya.met = true;
    if (scene.flag.met_noah) state.relationships.noah.met = true;
    if (scene.flag.met_elena) state.relationships.elena.met = true;
    if (scene.flag.met_tyler) state.relationships.tyler.met = true;
    if (scene.flag.met_grace) state.relationships.grace.met = true;
    if (scene.flag.met_lawson) state.relationships.lawson.met = true;
  }

  // Process scene-level effects
  if (scene.effects) {
    for (let charId in scene.effects) {
      if (!state.relationships[charId]) state.relationships[charId] = { friendship: 0, trust: 0, respect: 0, met: false };
      const eff = scene.effects[charId];
      const ch = state.relationships[charId];
      if (eff.friendship) ch.friendship += eff.friendship;
      if (eff.trust) ch.trust += eff.trust;
      if (eff.respect) ch.respect += eff.respect;
      ch.met = true;
    }
  }

  // Clear choices during transition
  $('choices-ctn').innerHTML = '';

  // Fade transition
  $('fade-overlay').classList.add('active');
  setTimeout(() => {
    // Build text blocks
    let blocks = [];
    if (scene.speaker && scene.text) {
      blocks.push({ speaker: scene.speaker, text: Array.isArray(scene.text) ? scene.text : [scene.text] });
    }
    if (scene.speaker2 && scene.text2) {
      blocks.push({ speaker: scene.speaker2, text: Array.isArray(scene.text2) ? scene.text2 : [scene.text2] });
    }
    if (scene.speaker3 && scene.text3) {
      blocks.push({ speaker: scene.speaker3, text: Array.isArray(scene.text3) ? scene.text3 : [scene.text3] });
    }
    currentTextBlocks = blocks;
    currentTextIndex = 0;
    $('fade-overlay').classList.remove('active');
    renderCurrentBlock();
  }, 500);

  // Auto-save
  saveGame();
}

function renderCurrentBlock() {
  if (currentTextIndex >= currentTextBlocks.length) {
    // All blocks done, show choices or autoNext
    showChoices();
    return;
  }
  const block = currentTextBlocks[currentTextIndex];
  setSpeaker(block.speaker);

  // Type out the text paragraphs
  typeTextBlocks(block.text, 0);
}

function setSpeaker(speakerId) {
  const plate = $('speaker-plate');
  if (speakerId === "narrator") {
    plate.textContent = "";
    plate.style.opacity = '0';
    plate.style.background = 'transparent';
    plate.style.border = 'none';
  } else {
    const ch = CHARACTERS[speakerId];
    if (ch) {
      plate.textContent = ch.name;
      plate.style.opacity = '1';
      plate.style.color = ch.color;
      plate.style.background = hexToRgba(ch.color, 0.12);
      plate.style.borderColor = hexToRgba(ch.color, 0.3);
    }
  }
}

function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function typeTextBlocks(paragraphs, idx) {
  if (idx >= paragraphs.length) {
    // This block is done, wait for click to advance to next block
    if (currentTextIndex < currentTextBlocks.length - 1) {
      awaitingClick = true;
      $('dialogue-text').innerHTML += '<span class="continue-hint"> ▼</span>';
    } else {
      // Last block, show choices
      showChoices();
    }
    return;
  }
  const para = paragraphs[idx];
  if (para === "") {
    $('dialogue-text').innerHTML += "<br><br>";
    typeTextBlocks(paragraphs, idx + 1);
    return;
  }
  isTyping = true;
  let charIdx = 0;
  let baseHTML = idx === 0 ? "" : $('dialogue-text').innerHTML.replace(/<span class="continue-hint">.*?<\/span>/, '') + "<br><br>";
  $('dialogue-text').innerHTML = baseHTML;

  typingTimer = setInterval(() => {
    if (charIdx < para.length) {
      $('dialogue-text').innerHTML = baseHTML + para.substring(0, charIdx + 1);
      charIdx++;
    } else {
      clearInterval(typingTimer);
      isTyping = false;
      typeTextBlocks(paragraphs, idx + 1);
    }
  }, 22);
}

function skipTyping() {
  if (isTyping) {
    clearInterval(typingTimer);
    isTyping = false;
    const block = currentTextBlocks[currentTextIndex];
    const paras = block.text;
    let html = "";
    for (let i = 0; i < paras.length; i++) {
      if (i > 0) html += "<br><br>";
      html += paras[i];
    }
    $('dialogue-text').innerHTML = html;
    // Jump to end of block
    typeTextBlocks(paras, paras.length);
  }
}

function advanceText() {
  if (isTyping) { skipTyping(); return; }
  if (!awaitingClick) return;
  awaitingClick = false;
  currentTextIndex++;
  renderCurrentBlock();
}

$('dialogue-text') && $('dialogue-text').addEventListener('click', advanceText);

function showChoices() {
  const scene = currentSceneData;
  const ctn = $('choices-ctn');
  ctn.innerHTML = '';

  if (scene.isEnding) {
    ctn.innerHTML = '<button class="choice-btn" id="endRestartBtn" style="animation: choiceIn 0.4s ease forwards;">Return to Title</button>';
    setTimeout(() => {
      $('endRestartBtn').addEventListener('click', () => {
        saveGame();
        location.reload();
      });
    }, 50);
    return;
  }

  if (scene.autoNext) {
    ctn.innerHTML = '<button class="choice-btn" id="continueBtn2" style="animation: choiceIn 0.4s ease forwards;">Continue ▶</button>';
    setTimeout(() => {
      $('continueBtn2').addEventListener('click', () => {
        loadScene(scene.autoNext);
      });
    }, 50);
    return;
  }

  // Determine which choices to show based on conditions
  let choices = [];
  if (scene.choices && scene.choices.length) {
    choices = scene.choices.filter(c => !c.condition || checkCondition(c.condition));
  }
  // Conditional choice sets
  if (scene.choices_maya && checkCondition(scene.condition || { met_maya: true })) {
    choices = scene.choices_maya.filter(c => !c.condition || checkCondition(c.condition));
  }
  if (scene.choices_elena && checkCondition(scene.condition2 || {})) {
    choices = scene.choices_elena.filter(c => !c.condition || checkCondition(c.condition));
  }

  if (choices.length === 0 && scene.autoNext) {
    ctn.innerHTML = '<button class="choice-btn" id="continueBtn3" style="animation: choiceIn 0.4s ease forwards;">Continue ▶</button>';
    setTimeout(() => { $('continueBtn3').addEventListener('click', () => loadScene(scene.autoNext)); }, 50);
    return;
  }

  choices.forEach((choice, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.style.animationDelay = (i * 0.1) + 's';
    btn.innerHTML = choice.text + (choice.tag ? ` <span class="choice-tag">${choice.tag}</span>` : '');
    btn.addEventListener('click', () => makeChoice(choice));
    ctn.appendChild(btn);
  });
}

function checkCondition(cond) {
  if (!cond) return true;
  for (let key in cond) {
    const actual = state.flags[key];
    const expected = cond[key];
    if (expected === true && !actual) return false;
    if (expected === false && actual) return false;
    if (expected !== true && expected !== false && actual !== expected) return false;
  }
  return true;
}

function makeChoice(choice) {
  // Apply effects
  if (choice.effects) {
    for (let charId in choice.effects) {
      if (!state.relationships[charId]) state.relationships[charId] = { friendship: 0, trust: 0, respect: 0, met: false };
      const eff = choice.effects[charId];
      const ch = state.relationships[charId];
      let changes = [];
      if (eff.friendship) { ch.friendship += eff.friendship; changes.push(`Friendship ${eff.friendship > 0 ? '+' : ''}${eff.friendship}`); }
      if (eff.trust) { ch.trust += eff.trust; changes.push(`Trust ${eff.trust > 0 ? '+' : ''}${eff.trust}`); }
      if (eff.respect) { ch.respect += eff.respect; changes.push(`Respect ${eff.respect > 0 ? '+' : ''}${eff.respect}`); }
      ch.met = true;
      if (changes.length) {
        const charName = CHARACTERS[charId]?.name || charId;
        const sign = changes.some(c => c.includes('+')) ? 'positive' : 'negative';
        showToast(`${charName}: ${changes.join(', ')}`, sign);
      }
    }
  }

  // Apply flag
  if (choice.flag) {
    Object.assign(state.flags, choice.flag);
    // Mark characters as met
    if (choice.flag.met_maya) state.relationships.maya.met = true;
    if (choice.flag.met_noah) state.relationships.noah.met = true;
    if (choice.flag.met_elena) state.relationships.elena.met = true;
    if (choice.flag.met_tyler) state.relationships.tyler.met = true;
    if (choice.flag.met_grace) state.relationships.grace.met = true;
    if (choice.flag.met_lawson || choice.effects?.lawson) state.relationships.lawson.met = true;
  }

  // Apply effects from scene-level (for conditional scenes)
  if (currentSceneData.effects) {
    for (let charId in currentSceneData.effects) {
      if (!state.relationships[charId]) state.relationships[charId] = { friendship: 0, trust: 0, respect: 0, met: false };
      const eff = currentSceneData.effects[charId];
      const ch = state.relationships[charId];
      if (eff.friendship) ch.friendship += eff.friendship;
      if (eff.trust) ch.trust += eff.trust;
      if (eff.respect) ch.respect += eff.respect;
    }
  }

  // Add end-of-day messages when reaching the end of chapter
  if (choice.next === "ch1_end" && !state.endOfDayMsgsAdded) {
    state.endOfDayMsgsAdded = true;
    const msgs = getEndOfDayMessages(state);
    msgs.forEach(m => {
      const charInfo = m.thread === "unknown" ? { name: "Unknown", color: "#8b949e", initials: "?" } :
        m.thread === "maya" ? CHARACTERS.maya :
        m.thread === "grace" ? CHARACTERS.grace :
        m.thread === "elena" ? CHARACTERS.elena :
        m.thread === "noah" ? CHARACTERS.noah :
        m.thread === "tyler" ? CHARACTERS.tyler : { name: m.thread, color: "#8b949e", initials: "?" };
      MESSAGE_THREADS[m.thread] = { name: charInfo.name, color: charInfo.color, initials: charInfo.initials, messages: m.messages };
      state.messages[m.thread] = true;
    });
    updatePhoneBadge();
  }

  // Navigate
  if (choice.next) {
    loadScene(choice.next);
  }
}

// ============================================================
//  UI RENDERING
// ============================================================

function showToast(msg, type = "info") {
  const toast = document.createElement('div');
  toast.className = 'toast ' + type;
  toast.textContent = msg;
  $('toast-ctn').appendChild(toast);
  setTimeout(() => toast.remove(), 3200);
}

function openOverlay(id, renderFn) {
  document.querySelectorAll('.overlay').forEach(o => o.classList.remove('active'));
  $(id).classList.add('active');
  if (renderFn) renderFn();
}

function renderStats() {
  const body = $('statsBody');
  let html = '';

  // Meters
  html += '<div style="margin-bottom:1rem;">';
  html += `<div class="meter-row"><span>Grades</span><span class="meter-value">${state.grades}%</span></div>`;
  html += `<div class="meter-bar-track"><div class="meter-bar-fill" style="width:${state.grades}%; background:${state.grades >= 70 ? '#3fb950' : state.grades >= 50 ? '#d29922' : '#f85149'};"></div></div>`;
  html += `<div class="meter-row" style="margin-top:0.5rem;"><span>Reputation</span><span class="meter-value">${state.reputation >= 0 ? '+' : ''}${state.reputation}</span></div>`;
  html += `<div class="meter-bar-track"><div class="meter-bar-fill" style="width:${Math.min(100, 50 + state.reputation * 5)}%; background:#58a6ff;"></div></div>`;
  html += '</div>';

  // Relationships
  html += '<h3 style="font-size:0.8rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-dim); margin-bottom:0.5rem;">Relationships</h3>';

  const order = ['maya', 'noah', 'elena', 'tyler', 'grace', 'lawson', 'mom'];
  for (let id of order) {
    const ch = CHARACTERS[id];
    const rel = state.relationships[id];
    if (!rel || !rel.met) continue;
    const total = rel.friendship + rel.trust + rel.respect;
    html += `<div class="stat-row">
      <div class="stat-avatar" style="background:${hexToRgba(ch.color, 0.25)}; border:2px solid ${ch.color}; color:${ch.color};">${ch.initials}</div>
      <div class="stat-info">
        <div class="stat-name">${ch.name}</div>
        <div class="stat-role">${ch.role}</div>
        <div class="stat-bars">
          <div class="stat-bar-group"><div class="stat-bar-label">Friend</div><div class="stat-bar-track"><div class="stat-bar-fill bar-friend" style="width:${Math.min(100, Math.max(0, rel.friendship * 10))}%"></div></div></div>
          <div class="stat-bar-group"><div class="stat-bar-label">Trust</div><div class="stat-bar-track"><div class="stat-bar-fill bar-trust" style="width:${Math.min(100, Math.max(0, rel.trust * 10))}%"></div></div></div>
          <div class="stat-bar-group"><div class="stat-bar-label">Respect</div><div class="stat-bar-track"><div class="stat-bar-fill bar-respect" style="width:${Math.min(100, Math.max(0, rel.respect * 10))}%"></div></div></div>
        </div>
      </div>
    </div>`;
  }

  if (state.journal.length === 0 && !state.relationships.maya.met) {
    html += '<p style="color:var(--text-dim); font-size:0.85rem; text-align:center; padding:1rem;">You haven\'t met anyone yet.</p>';
  }

  body.innerHTML = html;
}

function renderPhone() {
  const body = $('phoneBody');
  let html = '<div class="msg-list">';

  const threads = Object.keys(state.messages).filter(k => state.messages[k] && MESSAGE_THREADS[k]);
  if (threads.length === 0) {
    html += '<p style="color:var(--text-dim); text-align:center; padding:2rem;">No messages yet.</p>';
  } else {
    for (let threadId of threads) {
      const thread = MESSAGE_THREADS[threadId];
      html += `<div class="msg-thread">
        <div class="msg-thread-header">
          <div class="stat-avatar" style="width:30px;height:30px;font-size:0.7rem;background:${hexToRgba(thread.color, 0.25)};border:2px solid ${thread.color};color:${thread.color};">${thread.initials}</div>
          <div class="msg-thread-name">${thread.name}</div>
        </div>
        <div class="msg-list-inner">`;
      for (let msg of thread.messages) {
        html += `<div class="msg-bubble ${msg.from}">${msg.text}${msg.time ? `<div style="font-size:0.65rem;opacity:0.5;margin-top:3px;">${msg.time}</div>` : ''}</div>`;
      }
      html += '</div></div>';
    }
  }
  html += '</div>';
  body.innerHTML = html;

  // Clear badge
  $('phoneBadge').style.display = 'none';
}

function updatePhoneBadge() {
  const newMsgs = Object.keys(state.messages).filter(k => state.messages[k]).length;
  if (newMsgs > 0) {
    $('phoneBadge').style.display = '';
    $('phoneBadge').textContent = newMsgs;
  }
}

function renderJournal() {
  const body = $('journalBody');
  let html = '';
  if (state.journal.length === 0) {
    html = '<div class="journal-locked">Your journal is empty.<br>Entries unlock as you experience the story.</div>';
  } else {
    for (let id of state.journal) {
      const entry = JOURNAL_POOL[id];
      if (!entry) continue;
      html += `<div class="journal-entry">
        <div class="date">${entry.date}</div>
        <h4>${entry.title}</h4>
        <p>${entry.body}</p>
      </div>`;
    }
  }
  body.innerHTML = html;
}

function renderSaveMenu() {
  const body = $('saveBody');
  const hasSave = localStorage.getItem('atb_save');
  body.innerHTML = `
    <button class="title-btn" id="saveGameBtn" style="width:100%;margin-bottom:0.5rem;">💾 Save Game</button>
    <button class="title-btn secondary" id="loadGameBtn" style="width:100%;margin-bottom:0.5rem;${hasSave ? '' : 'opacity:0.4;pointer-events:none;'}">📂 Load Game</button>
    <button class="title-btn secondary" id="deleteSaveBtn" style="width:100%;color:#f85149;border-color:rgba(248,81,73,0.3);${hasSave ? '' : 'opacity:0.4;pointer-events:none;'}">🗑 Delete Save</button>
    <p style="color:var(--text-dim);font-size:0.78rem;text-align:center;margin-top:1rem;">The game also auto-saves after every scene.</p>
  `;
  $('saveGameBtn').addEventListener('click', () => { saveGame(); showToast('Game saved!', 'positive'); });
  $('loadGameBtn').addEventListener('click', () => { loadGame(); showToast('Game loaded!', 'positive'); $('saveOverlay').classList.remove('active'); startGame(); });
  $('deleteSaveBtn').addEventListener('click', () => {
    localStorage.removeItem('atb_save');
    $('continueBtn').style.display = 'none';
    showToast('Save deleted.', 'info');
    renderSaveMenu();
  });
}

function renderMenu() {
  const body = $('menuBody');
  body.innerHTML = `
    <button class="title-btn" style="width:100%;margin-bottom:0.5rem;" onclick="location.reload()">🏠 Return to Title</button>
    <button class="title-btn secondary" style="width:100%;margin-bottom:0.5rem;" id="menuSaveBtn">💾 Save Game</button>
    <div style="margin-top:1rem; padding-top:1rem; border-top:1px solid var(--border); font-size:0.8rem; color:var(--text-dim); line-height:1.6;">
      <p style="font-weight:600; color:var(--text-main); margin-bottom:0.5rem;">After the Bell</p>
      <p>A narrative adventure about one unforgettable year of high school.</p>
      <p style="margin-top:0.5rem; opacity:0.6;">Every choice matters. Every relationship shapes your story.</p>
    </div>
  `;
  $('menuSaveBtn').addEventListener('click', () => { saveGame(); showToast('Game saved!', 'positive'); });
}

// ============================================================
//  SAVE / LOAD
// ============================================================

function saveGame() {
  try {
    localStorage.setItem('atb_save', JSON.stringify(state));
    localStorage.setItem('atb_save_time', new Date().toISOString());
    if (!$('continueBtn').style.display) $('continueBtn').style.display = '';
  } catch(e) { console.error('Save failed:', e); }
}

function loadGame() {
  try {
    const data = localStorage.getItem('atb_save');
    if (data) {
      state = Object.assign(createState(), JSON.parse(data));
      // Merge relationships to ensure all characters exist
      const base = createState().relationships;
      for (let k in base) {
        if (!state.relationships[k]) state.relationships[k] = base[k];
      }
    }
  } catch(e) { console.error('Load failed:', e); }
}

// Start
init();
</script>

</html>
