      :root {

        --text: #111;
        --accent: #0066ff;
        --danger: #cc0000;
        --shadow: rgba(0, 0, 0, 0.1);
        --muted: #777;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121212;
          --card: #1e1e1e;
          --text: #eaeaea;
          --accent: #4da3ff;
          --danger: #ff4d4d;
          --shadow: rgba(0, 0, 0, 0.6);
          --muted: #aaa;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 20px;
      }

      h1 {
        text-align: center;
        margin-bottom: 10px;
      }

      small {
        color: var(--muted);
      }

      #dashboard {
        background: var(--card);
        padding: 15px;
        border-radius: 10px;
        margin: 15px auto 20px;
        max-width: 1100px;
        box-shadow: 0 4px 10px var(--shadow);
      }

      #dashboard p {
        margin: 4px 0;
      }

      .progress {
        height: 10px;
        background: #ccc;
        border-radius: 5px;
        overflow: hidden;
        margin-top: 5px;
      }

      .progress-bar {
        height: 100%;
        background: var(--accent);
        width: 0%;
        transition: width 0.4s;
      }

      .controls {
        max-width: 1100px;
        margin: 0 auto 20px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .controls input,
      .controls select {
        padding: 10px;
        font-size: 15px;
        flex: 1;
        min-width: 150px;
      }

      #casinoList {
        max-width: 1100px;
        margin: 0 auto;
        text-align: center;
        align-items: center;
        align-content: center;
      }

      .casino {
        background: var(--card);
        padding: 12px 14px;
        border-radius: 10px;
        margin-bottom: 10px;
        display: grid;
        grid-template-columns: minmax(0, 1.6fr) auto auto;
        gap: 10px;
        text-align: center;
        align-items: center;
        align-content: center;
        justify-content: center;
        box-shadow: 0 4px 10px var(--shadow);
        transition: transform 0.15s;
        border-left: 6px solid var(--accent);
      }

      .casino:hover {
        transform: scale(1.01);
      }

      .casino.excluded {
        opacity: 0.55;
        filter: grayscale(35%);
      }

      .casino.excluded:hover {
        transform: none;
      }

      .casino.excluded .casino-main a {
        pointer-events: none;
        color: var(--muted);
      }

      .casino.excluded .disabled-control {
        cursor: not-allowed;
        opacity: 0.6;
      }

      .casino input:disabled {
        cursor: not-allowed;
        opacity: 0.65;
      }

      .casino-left {
        display: flex;
        gap: 10px;
        min-width: 0;
        text-align: center;
        align-items: center;
        align-content: center;
        justify-content: center;
      }

      .casino-logo {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: #444;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        flex-shrink: 0;
      }

      .casino-main {
        min-width: 0;
      }

      .casino-main a {
        font-weight: bold;
        color: var(--accent);
        text-decoration: none;
        display: inline-block;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .casino-main .domains {
        font-size: 12px;
        color: var(--muted);
        margin-top: 2px;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .casino-main .cats {
        font-size: 11px;
        margin-top: 2px;
        color: var(--muted);
      }

      .casino-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .favStar {
        cursor: pointer;
        font-size: 20px;
        user-select: none;
      }

      .favStar.fav {
        color: gold;
      }

      .limitInput {
        width: 110px;
        padding: 6px;
        font-size: 13px;
      }

      .warning {
        color: var(--danger);
        font-size: 11px;
        margin-top: 2px;
      }

      .limit-wrapper {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
      }

      #clearBtn {
        padding: 12px 20px;
        background: var(--danger);
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        margin: 20px auto 0;
        display: block;
        max-width: 1100px;
        width: 100%;
      }

      @media (max-width: 800px) {
        .casino {
          grid-template-columns: 1fr;
          align-items: flex-start;
        }
        .casino-actions {
          justify-content: flex-start;
        }
        .limit-wrapper {
          align-items: flex-start;
        }
      }

      let state = JSON.parse(localStorage.getItem("casinoState") || "{}");
      if (!state.cantUse) state.cantUse = {};
      if (!state.favorites) state.favorites = {};
      if (!state.used) state.used = {};
      if (!state.limits) state.limits = {};
      if (!state.lastResetDate) state.lastResetDate = null;

      function saveState() {
        localStorage.setItem("casinoState", JSON.stringify(state));
      }

      // ---------- HELPERS ----------
      function getMainUrl(c) {
        if (!c.domains || c.domains.length === 0) return null;
        let d = c.domains[0];
        if (!d.startsWith("http")) {
          d = "https://" + d.replace(/\/+$/, "");
        }
        return d;
      }

      function getInitials(name) {
        const parts = name.split(/\s+/).filter(Boolean);
        if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
        return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
      }

      // ---------- RENDER ----------
      function render() {
        const list = document.getElementById("casinoList");
        list.innerHTML = "";

        const search = document.getElementById("search").value.toLowerCase();
        const filter = document.getElementById("categoryFilter").value;
        const sort = document.getElementById("sort").value;

        let items = casinos.map((c, i) => ({ ...c, id: i }));

        if (search) {
          items = items.filter((c) => {
            const inName = c.name.toLowerCase().includes(search);
            const inDomains = (c.domains || []).some((d) =>
              d.toLowerCase().includes(search),
            );
            return inName || inDomains;
          });
        }

        if (filter !== "all") {
          items = items.filter((c) => (c.categories || []).includes(filter));
        }

        if (sort === "az") {
          items.sort((a, b) => a.name.localeCompare(b.name));
        } else if (sort === "za") {
          items.sort((a, b) => b.name.localeCompare(a.name));
        } else if (sort === "favorites") {
          items.sort((a, b) => {
            const fa = state.favorites[a.id] ? 1 : 0;
            const fb = state.favorites[b.id] ? 1 : 0;
            if (fb !== fa) return fb - fa;
            return a.name.localeCompare(b.name);
          });
        } else if (sort === "used") {
          items.sort((a, b) => {
            const ua = state.used[a.id] ? 1 : 0;
            const ub = state.used[b.id] ? 1 : 0;
            if (ub !== ua) return ub - ua;
            return a.name.localeCompare(b.name);
          });
        }

        items.forEach((casino) => {
          const div = document.createElement("div");
          div.className = "casino";
          if (casino.color) {
            div.style.borderLeftColor = casino.color;
          }

          const url = getMainUrl(casino);
          const cantUse = !!state.cantUse[casino.id];
          const isFav = !!state.favorites[casino.id];
          const usedToday = !!state.used[casino.id];
          const limitVal = state.limits[casino.id] || "";

          if (cantUse) {
            div.classList.add("excluded");
          }

          const domainsText =
            casino.domains && casino.domains.length
              ? casino.domains.join(", ")
              : "Ingen domæner registreret";

          const catsText = (casino.categories || []).join(" · ");

          div.innerHTML = `
            <div class="casino-left">
                <div class="casino-logo">${getInitials(casino.name)}</div>
                <div class="casino-main">
                  ${url ? `<a href="${url}" target="_blank" rel="noopener noreferrer">${casino.name}</a>` : `<span>${casino.name}</span>`}
                    <div class="domains">${domainsText}</div>
                    <div class="cats">${catsText}</div>
                </div>
            </div>
            <div class="casino-actions">
              <label style="font-size:12px;display:flex;align-items:center;gap:4px;">
                    <input type="checkbox" class="cantUse" data-id="${casino.id}" ${cantUse ? "checked" : ""}>
                    Udelukket for brug
                </label>
              <span class="favStar ${isFav ? "fav" : ""} ${cantUse ? "disabled-control" : ""}" data-id="${casino.id}" aria-disabled="${cantUse ? "true" : "false"}">
                    ${isFav ? "★" : "☆"}
                </span>
                <label style="font-size:12px;display:flex;align-items:center;gap:4px;">
                <input type="checkbox" class="usedToday" data-id="${casino.id}" ${usedToday ? "checked" : ""} ${cantUse ? "disabled" : ""}>
                    Brugt i dag
                </label>
            </div>
            <div class="limit-wrapper">
                <input type="number" min="0" class="limitInput" data-id="${casino.id}"
                   placeholder="Limit kr" value="${limitVal}" ${cantUse ? "disabled" : ""}>
                <div class="warning" id="warn_${casino.id}"></div>
            </div>
        `;

          list.appendChild(div);
        });

        attachEvents();
        updateDashboard();
      }

      // ---------- EVENTS ----------
      function attachEvents() {
        document.querySelectorAll(".cantUse").forEach((circle) => {
          const id = circle.dataset.id;
          circle.onclick = () => {
            state.cantUse[id] = !state.cantUse[id];
            if (state.cantUse[id]) {
              state.used[id] = false;
            }
            saveState();
            render();
          };
        });

        document.querySelectorAll(".favStar").forEach((star) => {
          const id = star.dataset.id;
          star.onclick = () => {
            if (state.cantUse[id]) return;
            state.favorites[id] = !state.favorites[id];
            saveState();
            render();
          };
        });

        document.querySelectorAll(".usedToday").forEach((cb) => {
          const id = cb.dataset.id;
          cb.onchange = () => {
            if (state.cantUse[id]) {
              state.used[id] = false;
              saveState();
              render();
              return;
            }
            state.used[id] = cb.checked;
            saveState();
            updateDashboard();
          };
        });

        document.querySelectorAll(".limitInput").forEach((inp) => {
          const id = inp.dataset.id;
          inp.oninput = () => {
            if (state.cantUse[id]) return;
            state.limits[id] = inp.value;
            saveState();
            updateDashboard();
          };
        });
      }

      // ---------- DASHBOARD ----------
      function updateDashboard() {
        const total = casinos.length;
        const used = Object.keys(state.used).filter(
          (k) => state.used[k] && !state.cantUse[k],
        ).length;
        const favCount = Object.keys(state.favorites).filter(
          (k) => state.favorites[k],
        ).length;

        const limits = Object.keys(state.limits).map(
          (k) => Number(state.limits[k]) || 0,
        );
        const totalLimit = limits.reduce((a, b) => a + b, 0);

        document.getElementById("totalCount").textContent = total;
        document.getElementById("usedCount").textContent = used;
        document.getElementById("favCount").textContent = favCount;
        document.getElementById("totalLimit").textContent = totalLimit;

        const bar = document.getElementById("limitBar");
        const pct = Math.min(100, (totalLimit / 50000) * 100); // 50.000 kr reference
        bar.style.width = pct + "%";

        casinos.forEach((c, i) => {
          const warn = document.getElementById("warn_" + i);
          if (!warn) return;
          const val = Number(state.limits[i] || 0);
          if (val > 5000) {
            warn.textContent = "⚠ Over 5.000 kr";
          } else if (val > 0 && val >= 4000) {
            warn.textContent = "⚠ Tæt på 5.000 kr";
          } else {
            warn.textContent = "";
          }
        });
      }

      // ---------- CLEAR USED TODAY ----------
      document.getElementById("clearBtn").onclick = () => {
        state.used = {};
        saveState();
        render();
      };

      // ---------- AUTO RESET VED MIDNAT ----------
      function checkMidnightReset() {
        const todayStr = new Date().toISOString().slice(0, 10);
        if (state.lastResetDate !== todayStr) {
          state.used = {};
          state.lastResetDate = todayStr;
          saveState();
          render();
        }
      }
      checkMidnightReset();
      setInterval(checkMidnightReset, 60 * 1000);

      // ---------- FILTER/SORT/SØG ----------
      document.getElementById("search").oninput = render;
      document.getElementById("categoryFilter").onchange = render;
      document.getElementById("sort").onchange = render;

      // ---------- INIT ----------
      render();
    </script>
  </body>
</html>
