<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>gds1 — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<div style="max-width:900px; margin:20px auto; text-align:left; font-family:sans-serif;">
  <h1 style="text-align:center; color:#478cbf; margin-bottom:5px;">🤖 AI GDScript Generator</h1>
  <p style="text-align:center; color:#666; margin-top:0; margin-bottom:20px;">Godot 4 code generator powered by AI</p>

  <label style="font-weight:bold; display:block; margin-bottom:5px;">Describe what you need:</label>
  <textarea id="promptInput" placeholder="e.g., A player controller with WASD movement and jump using CharacterBody3D..." style="width:100%; height:100px; box-sizing:border-box; padding:10px; border:1px solid #ccc; border-radius:6px; font-family:sans-serif; font-size:14px; resize:vertical;"></textarea>

  <div style="margin:8px 0 15px;">
    <span style="font-size:12px; color:#666; margin-right:5px;">Quick ideas:</span>
    <button onclick="promptInput.value='A 2D top-down player controller with smooth movement and dash using CharacterBody2D'" style="font-size:12px; padding:4px 8px; margin:2px; cursor:pointer; border:1px solid #ccc; border-radius:4px; background:#f8f9fa;">Top-down 2D</button>
    <button onclick="promptInput.value='A first-person camera controller with mouse look and WASD using CharacterBody3D'" style="font-size:12px; padding:4px 8px; margin:2px; cursor:pointer; border:1px solid #ccc; border-radius:4px; background:#f8f9fa;">FPS Controller</button>
    <button onclick="promptInput.value='An enemy AI that follows the player with NavigationAgent3D and attacks on contact'" style="font-size:12px; padding:4px 8px; margin:2px; cursor:pointer; border:1px solid #ccc; border-radius:4px; background:#f8f9fa;">Enemy AI</button>
    <button onclick="promptInput.value='A custom Resource class for an RPG item with exports and rarity enum'" style="font-size:12px; padding:4px 8px; margin:2px; cursor:pointer; border:1px solid #ccc; border-radius:4px; background:#f8f9fa;">RPG Item</button>
  </div>

  <div style="display:flex; align-items:center; gap:10px; margin-bottom:15px; flex-wrap:wrap;">
    <select id="nodeTypeSelect" style="padding:8px; border:1px solid #ccc; border-radius:6px; font-size:14px;">
      <option value="">Auto-detect node type</option>
      <option value="Node">Node</option>
      <option value="Node2D">Node2D</option>
      <option value="Node3D">Node3D</option>
      <option value="CharacterBody2D">CharacterBody2D</option>
      <option value="CharacterBody3D">CharacterBody3D</option>
      <option value="RigidBody2D">RigidBody2D</option>
      <option value="RigidBody3D">RigidBody3D</option>
      <option value="Area2D">Area2D</option>
      <option value="Area3D">Area3D</option>
      <option value="Control">Control</option>
      <option value="Resource">Resource</option>
    </select>
    <button id="generateBtn" onclick="generateCode()" style="padding:10px 24px; background-color:#478cbf; color:white; border:none; border-radius:6px; cursor:pointer; font-weight:bold; font-size:14px;">Generate Code</button>
    <button id="stopBtn" hidden onclick="if(currentGen) currentGen.stop()" style="padding:10px 24px; background-color:#cc4b4b; color:white; border:none; border-radius:6px; cursor:pointer; font-weight:bold; font-size:14px;">Stop</button>
    <span id="statusEl" hidden style="color:#478cbf; font-style:italic;">⏳ Generating...</span>
  </div>

  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;">
    <label style="font-weight:bold;">Generated GDScript:</label>
    <button id="copyBtn" hidden onclick="copyCode()" style="padding:6px 12px; border:1px solid #ccc; background:#f0f0f0; border-radius:4px; cursor:pointer; font-size:12px;">📋 Copy to Clipboard</button>
  </div>
  <textarea id="outputArea" placeholder="Your generated GDScript will appear here..." style="width:100%; height:450px; box-sizing:border-box; font-family:'Consolas','Monaco','Courier New',monospace; background:#1e1e1e; color:#d4d4d4; padding:15px; border:1px solid #333; border-radius:6px; resize:vertical; line-height:1.5; font-size:13px; white-space:pre; overflow:auto;"></textarea>
</div>

<script>
  let currentGen = null; // Holds the active generation promise so we can call .stop()

  function buildInstruction() {
    let prompt = promptInput.value.trim();
    let node = nodeTypeSelect.value;
    let parts = ["Generate GDScript code for Godot 4.x based on this request:", "", `Request: ${prompt}`];
    if (node) parts.push(`The script must extend ${node}.`);
    parts.push("");
    parts.push("Requirements:");
    parts.push("- Use Godot 4.x GDScript syntax (static typing, etc.).");
    parts.push("- Add concise comments explaining logic.");
    parts.push("- Output ONLY the raw script code with comments.");
    parts.push("- Do NOT wrap the code in markdown code blocks.");
    parts.push("- If the request is vague, provide a sensible, complete implementation.");
    parts.push("");
    parts.push("Generated GDScript:");
    return parts.join("\n");
  }

  async function generateCode() {
    if (!promptInput.value.trim()) {
      promptInput.focus();
      promptInput.style.borderColor = "#cc4b4b";
      setTimeout(() => promptInput.style.borderColor = "#ccc", 800);
      return;
    }

    generateBtn.disabled = true;
    generateBtn.textContent = "Generating...";
    stopBtn.hidden = false;
    statusEl.hidden = false;
    copyBtn.hidden = true;
    outputArea.value = "";

    try {
      currentGen = generateText(buildInstruction());
      let text = await currentGen; // Wait for the full response
      outputArea.value = text;
    } catch (err) {
      outputArea.value = "/* Error: " + (err.message || err) + " */";
    } finally {
      generateBtn.disabled = false;
      generateBtn.textContent = "Generate Code";
      stopBtn.hidden = true;
      statusEl.hidden = true;
      // Only show copy button if we got actual code, not an error
      if (outputArea.value && !outputArea.value.startsWith("/* Error:")) copyBtn.hidden = false;
      currentGen = null;
    }
  }

  function copyCode() {
    outputArea.select();
    document.execCommand("copy");
    let prev = copyBtn.textContent;
    copyBtn.textContent = "✅ Copied!";
    setTimeout(() => copyBtn.textContent = prev, 1500);
  }
</script>
</body>
</html>
