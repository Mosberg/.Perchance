arated list of skills that the player has>\n - Location: <player\'s current location>`;\n\nconsole.log("questionText:", questionText);\n\n  let response = await oc.getInstructCompletion({\n    instruction: `Your task is to keep track of the Player\'s inventory/skills/attributes/location/etc. based on the messages of the Player and the Game Master.\\n\\n${questionText}`,\n    startWith: `**Player Character Details:**\\n - Inventory:`,\n    stopSequences: ["\\n\\n"],\n  });\n  if(summarySystemMessage) {\n    summarySystemMessage.content = response.text;\n    // remove summary message from oc.thread.messages array:\n    oc.thread.messages = oc.thread.messages.filter(m => m !== summarySystemMessage);\n  } else {\n    summarySystemMessage = {author:"system", content:response.text, customData:{isSystemSummaryMessage:true}, expectsReply:false};\n  }\n  oc.thread.messages.push(summarySystemMessage);\n});',

  let currentCharacter = CHARACTERS[0];

  // DOM Elements
  const searchInput = searchInputEl;

  // Helper: Format Text (Simple Markdown)
  function formatText(text) {
    if (!text) return "";
    let html = text
      .replace(/</g, "&lt;") // Sanitize HTML
      .replace(/>/g, "&gt;")
      .replace(/\*\*(.*?)\*\*/g, "<b>$1</b>") // Bold
      .replace(
        /{{(char|user)}}/g,
        '<span class="highlight"><-<-<|OUTPUT_TEMPLATE_PLACEHOLDER|>->-></span>',
      ) // Highlight vars
      .replace(/\n/g, "<br>"); // Newlines
    return html;
  }

  // Helper: Show Toast
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.remove("hidden");
    setTimeout(() => toastEl.classList.add("hidden"), 3000);
  }

  // Render Character List
  function renderList(filter = "") {
    charListEl.innerHTML = "";
    const filtered = CHARACTERS.filter((c) =>
      c.name.toLowerCase().includes(filter.toLowerCase()),
    );

    filtered.forEach((char) => {
      const card = document.createElement("div");
      card.className = `char-card ${currentCharacter && currentCharacter.id === char.id ? "active" : ""}`;
      card.onclick = () => selectCharacter(char);

      // Avatar fallback
      const avatarUrl =
        char.avatar?.url || `https://picsum.photos/seed/${char.name}/100/100`;

      card.innerHTML = `
        <img src="${avatarUrl}" alt="${char.name}" class="char-thumb">
        <div class="char-info">
          <div class="char-name">${char.name}</div>
          <div class="char-desc-preview">${char.roleInstruction.split(".")[0].substring(0, 50)}...</div>
        </div>
      `;
      charListEl.appendChild(card);
    });
  }

  // Select Character
  function selectCharacter(char) {
    currentCharacter = char;
    renderList(searchInput.value);
    renderDetail();
  }

  // Render Detail View
  function renderDetail() {
    if (!currentCharacter) {
      charDetailEl.innerHTML =
        '<div class="empty-state">Select a character to view details</div>';
      return;
    }

    const char = currentCharacter;
    const avatarUrl =
      char.avatar?.url || `https://picsum.photos/seed/${char.name}/300/300`;
    const initialMessagesHtml = char.initialMessages
      .map((msg) => {
        const isAi = msg.author === "ai";
        const isUser = msg.author === "user";
        const isSystem = msg.author === "system";

        let className = "msg-other";
        let author =
          msg.name ||
          (isAi ? char.name : isUser ? USER_INFO.userName : "System");

        if (isUser) className = "msg-user";
        if (isSystem) className = "msg-system";

        return `
        <div class="chat-bubble ${className}">
          <div class="msg-author">${author}</div>
          <div class="msg-content">${formatText(msg.content)}</div>
        </div>
      `;
      })
      .join("");

    charDetailEl.innerHTML = `
      <div class="detail-header">
        <img src="${avatarUrl}" class="detail-avatar">
        <div class="detail-title">
          <h2>${char.name}</h2>
          <div class="detail-meta">
            <span>Model: ${char.modelName}</span> | 
            <span>Temp: ${char.temperature}</span>
          </div>
        </div>
      </div>

      <div class="detail-section">
        <h3>Role Instruction</h3>
        <div class="scrollable-text">${formatText(char.roleInstruction)}</div>
      </div>

      <div class="detail-section">
        <h3>Initial Messages / Examples</h3>
        <div class="chat-preview">
          ${initialMessagesHtml}
        </div>
      </div>

      <div class="detail-actions">
        <button class="btn btn-primary" onclick="runTestGeneration()">✨ Test AI Response</button>
        <button class="btn btn-secondary" onclick="openChatSimulator()">💬 Chat Simulator</button>
        <button class="btn btn-secondary" onclick="generateNewInitialMessage()">📝 Generate Initial Message</button>
      </div>
      
      <div id="genResultAreaEl" class="gen-result hidden"></div>
      
      <div id="chatSimulatorEl" class="chat-simulator hidden">
        <div class="chat-header">
          <span>Chat with ${char.name}</span>
          <button class="close-btn" onclick="closeChatSimulator()">×</button>
        </div>
        <div id="chatHistoryEl" class="chat-history">
          <div class="system-message">Starting chat with ${char.name}...</div>
        </div>
        <div class="chat-input-container">
          <input type="text" id="chatInputEl" placeholder="Type your message..." onkeypress="if(event.key==='Enter') sendMessage()">
          <button class="btn btn-primary" onclick="sendMessage()">Send</button>
        </div>
      </div>
      
      <div id="newMessageAreaEl" class="gen-result hidden"></div>
    `;
  }

  // Provide a fallback generateText for standalone demo
  if (!window.generateText) {
    window.generateText = async function ({ instruction, onChunk }) {
      // Simulate a streaming response with a fake message
      const charName = currentCharacter?.name || "Character";
      const fakeResponses = [
        `I'm ${charName}, your assistant.`,
        `My name is ${charName}. How can I help you today?`,
        `Hello, I'm ${charName}.`,
        `I'm here to assist you as ${charName}.`,
        `You can call me ${charName}.`,
        `Let's get started.`,
        `What would you like to do today?`,
        `I'm ready to help.`,
        `How can I assist you?`,
        `Ask me anything!`,
      ];
      let text =
        fakeResponses[Math.floor(Math.random() * fakeResponses.length)];
      // Simulate streaming by sending one word at a time
      let soFar = "";
      for (const word of text.split(" ")) {
        soFar += (soFar ? " " : "") + word;
        await new Promise((r) => setTimeout(r, 80));
        onChunk({ textChunk: soFar });
      }
    };
  }

  // Test Generation with Streaming
  async function runTestGeneration() {
    const btn = document.querySelector(".btn-primary");
    const resultArea = genResultAreaEl;

    btn.disabled = true;
    btn.textContent = "⏳ Generating...";
    resultArea.classList.remove("hidden");
    resultArea.innerHTML = '<div class="loader">Thinking...</div>';

    try {
      const char = currentCharacter;
      const instruction = `
        You are roleplaying as ${char.name}. Respond to the user's greeting.
        
        CHARACTER PROFILE:
        Name: ${char.name}
        ${char.roleInstruction.substring(0, 500)}...
        
        USER SAYS: "Hello, who are you?"
        
        Write a response in character, using the character's personality and speaking style. Keep it to 1-2 sentences.
      `;

      let responseText = "";

      await window.generateText({
        instruction: instruction,
        onChunk: (data) => {
          responseText = data.textChunk;
          resultArea.innerHTML = `
            <div class="gen-label">Sample Response:</div>
            <div class="chat-bubble msg-other">
               <div class="msg-author">${char.name}</div>
               <div class="msg-content">${formatText(responseText)}</div>
            </div>
          `;
        },
      });

      showToast("Generation complete!");
    } catch (e) {
      console.error(e);
      resultArea.innerHTML = `<div class="error">Error generating: ${e.message}</div>`;
      showToast("Error during generation");
    } finally {
      btn.disabled = false;
      btn.textContent = "✨ Test AI Response";
    }
  }

  // Chat Simulator
  let chatHistory = [];
  let isGenerating = false;

  function openChatSimulator() {
    chatSimulatorEl.classList.remove("hidden");
    chatHistory = [
      {
        author: "system",
        content: `Starting chat with ${currentCharacter.name}...`,
      },
    ];
    renderChatHistory();
    chatInputEl.focus();
  }

  function closeChatSimulator() {
    chatSimulatorEl.classList.add("hidden");
    chatHistory = [];
  }

  async function sendMessage() {
    const input = chatInputEl;
    const message = input.value.trim();

    if (!message || isGenerating) return;

    // Add user message
    chatHistory.push({ author: "user", content: message });
    input.value = "";
    renderChatHistory();

    isGenerating = true;
    chatInputEl.disabled = true;

    // Add placeholder for AI response
    const aiMessageIndex =
      chatHistory.push({ author: "ai", content: "..." }) - 1;
    renderChatHistory();

    try {
      const char = currentCharacter;
      const historyContext = chatHistory
        .slice(0, -1)
        .map((m) => {
          const name =
            m.author === "user"
              ? USER_INFO.userName
              : m.author === "ai"
                ? char.name
                : "System";
          return `${name}: ${m.content}`;
        })
        .join("\n");

      let aiResponse = "";

      await generateText({
        instruction: `
          You are roleplaying as ${char.name}. Continue the conversation naturally.
          
          CHARACTER PROFILE:
          Name: ${char.name}
          ${char.roleInstruction.substring(0, 800)}...
          
          CONVERSATION HISTORY:
          ${historyContext}
          
          ${USER_INFO.userName} just said: "${message}"
          
          Respond as ${char.name}, staying in character and using their personality and speaking style.
        `,
        onChunk: (data) => {
          aiResponse += data.textChunk;
          chatHistory[aiMessageIndex].content = aiResponse;
          renderChatHistory();
          scrollToBottom();
        },
      });
    } catch (e) {
      console.error(e);
      chatHistory[aiMessageIndex].content = `Error: ${e.message}`;
      renderChatHistory();
      showToast("Error generating response");
    } finally {
      isGenerating = false;
      chatInputEl.disabled = false;
      chatInputEl.focus();
      scrollToBottom();
    }
  }

  function renderChatHistory() {
    const container = chatHistoryEl;
    container.innerHTML = chatHistory
      .map((msg) => {
        if (msg.author === "system") {
          return `<div class="system-message">${formatText(msg.content)}</div>`;
        }

        const isUser = msg.author === "user";
        const className = isUser ? "msg-user" : "msg-other";
        const author = isUser ? USER_INFO.userName : currentCharacter.name;

        return `
        <div class="chat-bubble ${className}">
          <div class="msg-author">${author}</div>
          <div class="msg-content">${formatText(msg.content)}</div>
        </div>
      `;
      })
      .join("");
  }

  function scrollToBottom() {
    const container = chatHistoryEl;
    container.scrollTop = container.scrollHeight;
  }

  // Generate New Initial Message
  async function generateNewInitialMessage() {
    const btn = document.querySelectorAll(".btn-secondary")[1]; // The generate button
    const resultArea = newMessageAreaEl;

    btn.disabled = true;
    btn.textContent = "⏳ Generating...";
    resultArea.classList.remove("hidden");
    resultArea.innerHTML = '<div class="loader">Creating message...</div>';

    try {
      const char = currentCharacter;
      let generatedText = "";

      await window.generateText({
        instruction: `
          Create an engaging first message for a roleplay character.
          
          CHARACTER NAME: ${char.name}
          CHARACTER DESCRIPTION: ${char.roleInstruction.substring(0, 600)}...
          
          Write a natural, in-character opening message that ${char.name} would say to start a conversation. 
          It should be 1-2 sentences and reflect their personality.
          Do not include any greetings like "Hello" or "Hi" unless it fits the character.
        `,
        onChunk: (data) => {
          generatedText = data.textChunk;
          resultArea.innerHTML = `
            <div class="gen-label">Generated Initial Message:</div>
            <div class="chat-bubble msg-other">
               <div class="msg-author">${char.name}</div>
               <div class="msg-content">${formatText(generatedText)}</div>
            </div>
            <button class="btn btn-secondary" onclick="copyToClipboard(\`${generatedText.replace(/`/g, "\\`")}\`)" style="margin-top:0.5rem;">📋 Copy Message</button>
          `;
        },
      });

      showToast("Initial message generated!");
    } catch (e) {
      console.error(e);
      resultArea.innerHTML = `<div class="error">Error generating: ${e.message}</div>`;
      showToast("Error during generation");
    } finally {
      btn.disabled = false;
      btn.textContent = "📝 Generate Initial Message";
    }
  }

  function copyToClipboard(text) {
    navigator.clipboard
      .writeText(text)
      .then(() => {
        showToast("Copied to clipboard!");
      })
      .catch(() => {
        showToast("Failed to copy");
      });
  }

  // Initialize
  searchInput.addEventListener("input", (e) => renderList(e.target.value));
  renderList();
  renderDetail();
</script>

  .detail-title h2 {

  .detail-section {
    margin-bottom: 2rem;

    border-bottom: 1px solid var(--border);

  .scrollable-text {

    border: 1px solid var(--border);

  }

  .highlight {
    color: #ff9e80;
    font-weight: bold;
  }

  /* Chat Preview */
  .chat-preview {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    max-height: 400px;
    overflow-y: auto;
    padding-right: 0.5rem;
  }

  .chat-bubble {
    max-width: 85%;
    padding: 0.75rem 1rem;
    border-radius: 12px;

  .msg-other {
    background-color: var(--bg-card);

  .msg-user {
    background-color: #1565c0;

  .msg-system {
    background-color: rgba(255, 255, 255, 0.05);
    align-self: center;
    text-align: center;
    font-size: 0.85rem;
    color: var(--text-muted);
    width: 100%;
  }

  .msg-author {
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-bottom: 0.25rem;
    font-weight: bold;
  }

    color: rgba(255, 255, 255, 0.7);
  }

  /* Actions */
  .detail-actions {
    margin-top: 2rem;
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;

  .btn {
    padding: 0.75rem 1.5rem;

    cursor: pointer;

    transition: opacity 0.2s;

    opacity: 0.9;

  .btn:disabled {
    opacity: 0.5;

  .btn-primary {
    background-color: var(--accent);

  .btn-secondary {
    background-color: var(--bg-card);

  .gen-result {

  .gen-label {

    font-size: 0.85rem;
    margin-bottom: 0.5rem;

  /* Toast */
  #toastEl {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%);

    color: white;

  .loader {

    top: 0;
    right: 0;

    flex-direction: column;

    cursor: pointer;

    width: 30px;
    height: 30px;
    line-height: 30px;

    color: var(--text-main);

</style>
