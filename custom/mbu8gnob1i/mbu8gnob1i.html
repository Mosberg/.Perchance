<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>mbu8gnob1i — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<div id="gameContainerEl" style="width:100%; height:100vh; position:relative; background:#000;">
  <div id="loadingEl" style="position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); color:white; font-size:24px; z-index:10;">Loading 3D Pinball...</div>
  <div id="scoreEl" style="position:absolute; top:10px; right:10px; color:white; font-size:20px; z-index:5;">Score: 0</div>
  
  <script type="module">
    // Import required libraries
    import * as THREE from "https://esm.sh/three@0.177.0";
    const RAPIER = await import('https://esm.sh/@dimforge/rapier3d-compat@0.17.3');
    await RAPIER.init();

    // Game variables
    let scene, camera, renderer;
    let world;
    let ball, ballBody;
    let leftFlipper, rightFlipper;
    let leftFlipperBody, rightFlipperBody;
    let leftFlipperJoint, rightFlipperJoint;
    let score = 0;
    let gameRunning = false;
    
    // Initialize game
    async function init() {
      // Create scene
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x000033);
      
      // Create camera
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 8, 18);
      camera.lookAt(0, 0, 0);
      
      // Create renderer
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      gameContainerEl.appendChild(renderer.domElement);
      
      // Add lights
      const ambientLight = new THREE.AmbientLight(0x404040);
      scene.add(ambientLight);
      
      const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
      directionalLight.position.set(1, 1, 1);
      scene.add(directionalLight);
      
      // Initialize physics
      world = new RAPIER.World({ x: 0.0, y: -9.81, z: 0.0 });
      
      // Create pinball table
      createTable();
      
      // Create ball
      createBall();
      
      // Create flippers
      createFlippers();
      
      // Create bumpers
      createBumpers();
      
      // Add event listeners
      window.addEventListener('keydown', handleKeyDown);
      window.addEventListener('keyup', handleKeyUp);
      window.addEventListener('resize', onWindowResize);
      
      // Start game loop
      gameRunning = true;
      loadingEl.hidden = true;
      animate();
    }
    
    function createTable() {
      // Table geometry
      const tableGeometry = new THREE.BoxGeometry(12, 0.5, 20);
      const tableMaterial = new THREE.MeshPhongMaterial({ color: 0x006600 });
      const table = new THREE.Mesh(tableGeometry, tableMaterial);
      table.position.y = -0.25;
      scene.add(table);
      
      // Add static collider for table
      const tableColliderDesc = RAPIER.ColliderDesc.cuboid(6, 0.25, 10);
      world.createCollider(tableColliderDesc);
      
      // Create walls
      const wallMaterial = new THREE.MeshPhongMaterial({ color: 0x4444aa });
      
      // Left wall
      const leftWallGeometry = new THREE.BoxGeometry(0.5, 2, 20);
      const leftWall = new THREE.Mesh(leftWallGeometry, wallMaterial);
      leftWall.position.set(-6, 1, 0);
      scene.add(leftWall);
      const leftWallColliderDesc = RAPIER.ColliderDesc.cuboid(0.25, 1, 10);
      world.createCollider(leftWallColliderDesc.setTranslation(-6, 1, 0));
      
      // Right wall
      const rightWallGeometry = new THREE.BoxGeometry(0.5, 2, 20);
      const rightWall = new THREE.Mesh(rightWallGeometry, wallMaterial);
      rightWall.position.set(6, 1, 0);
      scene.add(rightWall);
      const rightWallColliderDesc = RAPIER.ColliderDesc.cuboid(0.25, 1, 10);
      world.createCollider(rightWallColliderDesc.setTranslation(6, 1, 0));
      
      // Back wall
      const backWallGeometry = new THREE.BoxGeometry(12, 2, 0.5);
      const backWall = new THREE.Mesh(backWallGeometry, wallMaterial);
      backWall.position.set(0, 1, -10);
      scene.add(backWall);
      const backWallColliderDesc = RAPIER.ColliderDesc.cuboid(6, 1, 0.25);
      world.createCollider(backWallColliderDesc.setTranslation(0, 1, -10));
      
      // Launch chute
      const chuteGeometry = new THREE.BoxGeometry(1, 0.5, 3);
      const chuteMaterial = new THREE.MeshPhongMaterial({ color: 0x666666 });
      const chute = new THREE.Mesh(chuteGeometry, chuteMaterial);
      chute.position.set(-4, 0.25, 8);
      scene.add(chute);
      const chuteColliderDesc = RAPIER.ColliderDesc.cuboid(0.5, 0.25, 1.5);
      world.createCollider(chuteColliderDesc.setTranslation(-4, 0.25, 8));
    }
    
    function createBall() {
      // Ball geometry
      const ballGeometry = new THREE.SphereGeometry(0.3, 32, 32);
      const ballMaterial = new THREE.MeshPhongMaterial({ color: 0xff0000 });
      ball = new THREE.Mesh(ballGeometry, ballMaterial);
      ball.position.set(-4, 1, 8);
      scene.add(ball);
      
      // Ball physics
      const ballBodyDesc = RAPIER.RigidBodyDesc.dynamic()
        .setTranslation(-4, 1, 8)
        .setLinvel(0, 0, -10); // Initial velocity
      ballBody = world.createRigidBody(ballBodyDesc);
      
      const ballColliderDesc = RAPIER.ColliderDesc.ball(0.3);
      world.createCollider(ballColliderDesc, ballBody);
    }
    
    function createFlippers() {
      // Flipper material
      const flipperMaterial = new THREE.MeshPhongMaterial({ color: 0xffaa00 });
      
      // Left flipper
      const leftFlipperGeometry = new THREE.BoxGeometry(2.5, 0.3, 0.8);
      leftFlipper = new THREE.Mesh(leftFlipperGeometry, flipperMaterial);
      leftFlipper.position.set(-3, 0.5, 6);
      scene.add(leftFlipper);
      
      // Left flipper physics
      const leftFlipperBodyDesc = RAPIER.RigidBodyDesc.dynamic()
        .setTranslation(-3, 0.5, 6)
        .setRotation(-Math.PI / 6); // Initial rotation
      leftFlipperBody = world.createRigidBody(leftFlipperBodyDesc);
      
      const leftFlipperColliderDesc = RAPIER.ColliderDesc.cuboid(1.25, 0.15, 0.4);
      world.createCollider(leftFlipperColliderDesc, leftFlipperBody);
      
      // Right flipper
      const rightFlipperGeometry = new THREE.BoxGeometry(2.5, 0.3, 0.8);
      rightFlipper = new THREE.Mesh(rightFlipperGeometry, flipperMaterial);
      rightFlipper.position.set(3, 0.5, 6);
      scene.add(rightFlipper);
      
      // Right flipper physics
      const rightFlipperBodyDesc = RAPIER.RigidBodyDesc.dynamic()
        .setTranslation(3, 0.5, 6)
        .setRotation(Math.PI / 6); // Initial rotation
      rightFlipperBody = world.createRigidBody(rightFlipperBodyDesc);
      
      const rightFlipperColliderDesc = RAPIER.ColliderDesc.cuboid(1.25, 0.15, 0.4);
      world.createCollider(rightFlipperColliderDesc, rightFlipperBody);
      
      // Create joints (revolute joints) for flippers
      const leftAnchor = { x: -4, y: 0.5, z: 6 };
      const rightAnchor = { x: 4, y: 0.5, z: 6 };
      
      leftFlipperJoint = world.createImpulseJoint(
        RAPIER.JointDesc.revolute(leftAnchor, { x: 0, y: 0, z: 0 })
          .setParent(leftFlipperBody)
          .setMotor(RAPIER.JointMotorParams.default().setMotorMaxForce(100)),
        leftFlipperBody,
        null
      );
      
      rightFlipperJoint = world.createImpulseJoint(
        RAPIER.JointDesc.revolute(rightAnchor, { x: 0, y: 0, z: 0 })
          .setParent(rightFlipperBody)
          .setMotor(RAPIER.JointMotorParams.default().setMotorMaxForce(100)),
        rightFlipperBody,
        null
      );
    }
    
    function createBumpers() {
      // Bumper material
      const bumperMaterial = new THREE.MeshPhongMaterial({ color: 0xaa00ff });
      
      // Create 3 bumpers
      const positions = [
        { x: -2, z: -2 },
        { x: 0, z: -4 },
        { x: 2, z: -2 }
      ];
      
      positions.forEach(pos => {
        // Bumper geometry
        const bumperGeometry = new THREE.CylinderGeometry(1, 1, 0.5, 32);
        const bumper = new THREE.Mesh(bumperGeometry, bumperMaterial);
        bumper.position.set(pos.x, 0.5, pos.z);
        scene.add(bumper);
        
        // Bumper physics
        const bumperColliderDesc = RAPIER.ColliderDesc.cylinder(0.25, 1)
          .setTranslation(pos.x, 0.5, pos.z);
        world.createCollider(bumperColliderDesc);
      });
    }
    
    function handleKeyDown(event) {
      if (!gameRunning) return;
      
      // Left flipper (A key)
      if (event.key === 'a' || event.key === 'A') {
        if (leftFlipperJoint) {
          leftFlipperJoint.configureMotorVelocity(10, 100);
        }
      }
      
      // Right flipper (D key)
      if (event.key === 'd' || event.key === 'D') {
        if (rightFlipperJoint) {
          rightFlipperJoint.configureMotorVelocity(-10, 100);
        }
      }
      
      // Launch ball (Space key)
      if (event.key === ' ') {
        ballBody.setLinvel({ x: 0, y: 5, z: -20 }, true);
      }
    }
    
    function handleKeyUp(event) {
      if (!gameRunning) return;
      
      // Left flipper release
      if (event.key === 'a' || event.key === 'A') {
        if (leftFlipperJoint) {
          leftFlipperJoint.configureMotorVelocity(-5, 100);
        }
      }
      
      // Right flipper release
      if (event.key === 'd' || event.key === 'D') {
        if (rightFlipperJoint) {
          rightFlipperJoint.configureMotorVelocity(5, 100);
        }
      }
    }
    
    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
    
    function animate() {
      if (!gameRunning) return;
      
      requestAnimationFrame(animate);
      
      // Step physics
      world.step();
      
      // Update ball position
      const ballPosition = ballBody.translation();
      ball.position.set(ballPosition.x, ballPosition.y, ballPosition.z);
      
      // Update flipper positions
      const leftFlipperPos = leftFlipperBody.translation();
      const leftFlipperRot = leftFlipperBody.rotation();
      leftFlipper.position.set(leftFlipperPos.x, leftFlipperPos.y, leftFlipperPos.z);
      leftFlipper.rotation.set(leftFlipperRot.x, leftFlipperRot.y, leftFlipperRot.z);
      
      const rightFlipperPos = rightFlipperBody.translation();
      const rightFlipperRot = rightFlipperBody.rotation();
      rightFlipper.position.set(rightFlipperPos.x, rightFlipperPos.y, rightFlipperPos.z);
      rightFlipper.rotation.set(rightFlipperRot.x, rightFlipperRot.y, rightFlipperRot.z);
      
      // Check if ball fell off the table
      if (ballPosition.y < -5) {
        // Reset ball
        ballBody.setTranslation({ x: -4, y: 1, z: 8 }, true);
        ballBody.setLinvel({ x: 0, y: 0, z: 0 }, true);
        ballBody.setAngvel({ x: 0, y: 0, z: 0 }, true);
        
        // Decrease score
        score = Math.max(0, score - 100);
        scoreEl.textContent = `Score: ${score}`;
      }
      
      // Update score based on ball velocity (simplified scoring)
      const ballVelocity = ballBody.linvel();
      const speed = Math.sqrt(ballVelocity.x**2 + ballVelocity.y**2 + ballVelocity.z**2);
      if (speed > 15) {
        score += 1;
        scoreEl.textContent = `Score: ${score}`;
      }
      
      renderer.render(scene, camera);
    }
    
    // Start the game
    init();
  </script>
</div>
</body>
</html>
