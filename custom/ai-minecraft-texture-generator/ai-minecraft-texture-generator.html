<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>ai-minecraft-texture-generator — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<div style="text-align:left; padding:20px;">
  <h1>AI Minecraft Texture Generator</h1>
  <p>Generating 16x16 pixel art textures according to your specifications:</p>
  
  <div style="display:grid; grid-template-columns: repeat(2, 1fr); gap:20px; margin:20px 0;">
    <!-- Fishing Rod Texture -->
    <div>
      <h3>custom_fishing_rod.png</h3>
      <canvas id="fishingRodCanvas" width="16" height="16" style="image-rendering: pixelated; image-rendering: -moz-crisp-edges; image-rendering: crisp-edges; border:1px solid #ccc;"></canvas>
    </div>
    
    <!-- Fishing Net Idle Texture -->
    <div>
      <h3>fishing_net.png (Idle)</h3>
      <canvas id="fishingNetIdleCanvas" width="16" height="16" style="image-rendering: pixelated; image-rendering: -moz-crisp-edges; image-rendering: crisp-edges; border:1px solid #ccc;"></canvas>
    </div>
    
    <!-- Fishing Net Swinging Texture -->
    <div>
      <h3>fishing_net_swinging.png</h3>
      <canvas id="fishingNetSwingingCanvas" width="16" height="16" style="image-rendering: pixelated; image-rendering: -moz-crisp-edges; image-rendering: crisp-edges; border:1px solid #ccc;"></canvas>
    </div>
    
    <!-- Fish Block Texture -->
    <div>
      <h3>fish_block.png</h3>
      <canvas id="fishBlockCanvas" width="16" height="16" style="image-rendering: pixelated; image-rendering: -moz-crisp-edges; image-rendering: crisp-edges; border:1px solid #ccc;"></canvas>
    </div>
  </div>
  
  <div style="margin-top:30px; padding:15px; background:#f5f5f5; border-radius:8px;">
    <h3>Texture Generation Status</h3>
    <div id="statusEl">Generating textures...</div>
    <button id="downloadBtn" style="margin-top:10px; display:none;">Download All (ZIP)</button>
  </div>
  
  <script>
    // Draw fishing rod texture
    function drawFishingRod() {
      const canvas = fishingRodCanvas;
      const ctx = canvas.getContext('2d');
      
      // Clear canvas
      ctx.clearRect(0, 0, 16, 16);
      
      // Pole: Diagonal line from (2,2) to (13,14)
      ctx.beginPath();
      ctx.moveTo(2, 2);
      ctx.lineTo(13, 14);
      ctx.strokeStyle = '#8B4513';
      ctx.lineWidth = 2;
      ctx.stroke();
      
      // Handle: (13,12)-(15,15)
      ctx.fillStyle = '#654321';
      ctx.fillRect(13, 12, 2, 3);
      
      // Reel: Circle at (11,10)-(13,12)
      ctx.fillStyle = '#C0C0C0';
      ctx.beginPath();
      ctx.arc(12, 11, 1, 0, Math.PI * 2);
      ctx.fill();
      
      // String: Thin line (14,3)-(15,1)
      ctx.beginPath();
      ctx.moveTo(14, 3);
      ctx.lineTo(15, 1);
      ctx.strokeStyle = '#4169E1';
      ctx.lineWidth = 1;
      ctx.stroke();
      
      // Hook: Small triangle (15,0)-(15,1)-(16,1) adjusted to fit canvas
      ctx.fillStyle = '#C0C0C0';
      ctx.beginPath();
      ctx.moveTo(15, 0);
      ctx.lineTo(15, 1);
      ctx.lineTo(14, 1);
      ctx.closePath();
      ctx.fill();
    }
    
    // Draw fishing net idle texture
    function drawFishingNetIdle() {
      const canvas = fishingNetIdleCanvas;
      const ctx = canvas.getContext('2d');
      
      // Clear canvas
      ctx.clearRect(0, 0, 16, 16);
      
      // Wooden frame: Rectangle (2,2)-(14,14)
      ctx.strokeStyle = '#8B4513';
      ctx.lineWidth = 1;
      ctx.strokeRect(2, 2, 12, 12);
      
      // Net mesh: Grid pattern 3x3 squares inside frame
      ctx.fillStyle = '#F4A460';
      ctx.beginPath();
      // Horizontal lines
      for (let y = 4; y < 14; y += 4) {
        for (let x = 4; x < 14; x += 2) {
          ctx.fillRect(x, y, 1, 1);
        }
      }
      // Vertical lines
      for (let x = 4; x < 14; x += 4) {
        for (let y = 4; y < 14; y += 2) {
          ctx.fillRect(x, y, 1, 1);
        }
      }
      ctx.fill();
      
      // Handles: (1,6)-(2,10) and (14,6)-(15,10)
      ctx.fillStyle = '#228B22';
      ctx.fillRect(1, 6, 1, 4);
      ctx.fillRect(14, 6, 1, 4);
    }
    
    // Draw fishing net swinging texture
    function drawFishingNetSwinging() {
      const canvas = fishingNetSwingingCanvas;
      const ctx = canvas.getContext('2d');
      
      // Clear canvas
      ctx.clearRect(0, 0, 16, 16);
      
      // Same frame as idle
      ctx.strokeStyle = '#8B4513';
      ctx.lineWidth = 1;
      ctx.strokeRect(2, 2, 12, 12);
      
      // Distorted net mesh (tilted 20° right)
      ctx.fillStyle = '#F4A460';
      ctx.beginPath();
      // Distorted mesh pattern
      for (let y = 4; y < 14; y += 4) {
        for (let x = 4; x < 14; x += 2) {
          ctx.fillRect(x + Math.floor((y-4)/4), y, 1, 1);
        }
      }
      for (let x = 4; x < 14; x += 4) {
        for (let y = 4; y < 14; y += 2) {
          ctx.fillRect(x + Math.floor((y-4)/2), y, 1, 1);
        }
      }
      ctx.fill();
      
      // Motion lines: 3 yellow streaks
      ctx.strokeStyle = '#D4AF37';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(8, 4);
      ctx.lineTo(12, 8);
      ctx.moveTo(9, 5);
      ctx.lineTo(13, 9);
      ctx.moveTo(10, 6);
      ctx.lineTo(14, 10);
      ctx.stroke();
      
      // Stretched handles
      ctx.fillStyle = '#228B22';
      ctx.fillRect(1, 5, 1, 5);
      ctx.fillRect(14, 5, 1, 5);
    }
    
    // Draw fish block texture
    function drawFishBlock() {
      const canvas = fishBlockCanvas;
      const ctx = canvas.getContext('2d');
      
      // Clear canvas
      ctx.clearRect(0, 0, 16, 16);
      
      // Water background: Gradient
      const gradient = ctx.createLinearGradient(0, 0, 15, 15);
      gradient.addColorStop(0, '#1E4D8B');
      gradient.addColorStop(1, '#4682B4');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 16, 16);
      
      // Fish body: Oval (3,6)-(13,10)
      ctx.fillStyle = '#FF6347';
      ctx.beginPath();
      ctx.ellipse(8, 8, 5, 2, 0, 0, Math.PI * 2);
      ctx.fill();
      
      // Fish tail: Triangle (13,7)-(15,9)-(13,11)
      ctx.fillStyle = '#E55A3D';
      ctx.beginPath();
      ctx.moveTo(13, 7);
      ctx.lineTo(15, 9);
      ctx.lineTo(13, 11);
      ctx.closePath();
      ctx.fill();
      
      // Eye: White circle with black pupil
      ctx.fillStyle = 'white';
      ctx.beginPath();
      ctx.arc(10, 7, 1, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.fillStyle = 'black';
      ctx.beginPath();
      ctx.arc(10, 7, 0.5, 0, Math.PI * 2);
      ctx.fill();
      
      // Scales: 4 green dots along body
      ctx.fillStyle = '#32CD32';
      ctx.fillRect(4, 7, 1, 1);
      ctx.fillRect(6, 8, 1, 1);
      ctx.fillRect(8, 7, 1, 1);
      ctx.fillRect(10, 8, 1, 1);
    }
    
    // Generate all textures
    function generateTextures() {
      drawFishingRod();
      drawFishingNetIdle();
      drawFishingNetSwinging();
      drawFishBlock();
      
      statusEl.textContent = "All textures generated successfully!";
      downloadBtn.style.display = "inline-block";
    }
    
    // Initialize textures when page loads
    window.onload = function() {
      generateTextures();
    };
    
    // Download functionality
    downloadBtn.onclick = function() {
      const zip = new JSZip();
      
      // Add each canvas as PNG to the zip
      zip.file("custom_fishing_rod.png", fishingRodCanvas.toDataURL("image/png").split(',')[1], {base64: true});
      zip.file("fishing_net.png", fishingNetIdleCanvas.toDataURL("image/png").split(',')[1], {base64: true});
      zip.file("fishing_net_swinging.png", fishingNetSwingingCanvas.toDataURL("image/png").split(',')[1], {base64: true});
      zip.file("fish_block.png", fishBlockCanvas.toDataURL("image/png").split(',')[1], {base64: true});
      
      // Generate and download ZIP
      zip.generateAsync({type:"blob"}).then(function(content) {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(content);
        a.download = "minecraft_textures.zip";
        a.click();
      });
    };
  </script>
  
  <!-- Include JSZip library for download functionality -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</div>
</body>
</html>
