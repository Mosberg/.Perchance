<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>upuxgebm9e — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<style>
  body { text-align: left; font-family: system-ui, -apple-system, sans-serif; background: #0f1020; color: #e8e8f0; margin: 0; padding: 0; }
  * { box-sizing: border-box; }
  .app { max-width: 1100px; margin: 0 auto; padding: 20px; }
  h1 { text-align: center; background: linear-gradient(90deg,#a78bfa,#60a5fa,#34d399); -webkit-background-clip: text; background-clip: text; color: transparent; margin: 10px 0 4px; font-size: 28px; }
  .subtitle { text-align: center; color: #9ca3af; font-size: 14px; margin-bottom: 18px; }
  .stepper { display: flex; gap: 8px; justify-content: center; margin-bottom: 18px; }
  .step { padding: 8px 16px; border-radius: 20px; background: #1e1f3a; color: #9ca3af; font-size: 13px; font-weight: 600; border: 1px solid #2a2b4a; }
  .step.active { background: linear-gradient(90deg,#7c3aed,#3b82f6); color: #fff; border-color: transparent; }
  .step.done { background: #14532d; color: #6ee7b7; border-color: #064e3b; }
  .panel { background: #181930; border: 1px solid #2a2b4a; border-radius: 14px; padding: 18px; margin-bottom: 16px; }
  .panel h2 { margin: 0 0 14px; font-size: 18px; color: #c4b5fd; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 12px; color: #9ca3af; font-weight: 600; }
  .field input, .field select, .field textarea { background: #0f1020; border: 1px solid #2a2b4a; color: #e8e8f0; border-radius: 8px; padding: 8px 10px; font-size: 14px; font-family: inherit; }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: #7c3aed; }
  .field textarea { resize: vertical; min-height: 60px; }
  .dice { cursor: pointer; font-size: 14px; color: #60a5fa; user-select: none; margin-left: 4px; }
  .dice:hover { color: #a78bfa; }
  .btn { background: linear-gradient(90deg,#7c3aed,#3b82f6); color: #fff; border: none; border-radius: 10px; padding: 10px 22px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .btn:hover { filter: brightness(1.15); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn.secondary { background: #2a2b4a; }
  .btn.secondary:hover { background: #3a3b5a; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
  .char-summary { background: #0f1020; border: 1px dashed #4a4b6a; border-radius: 10px; padding: 12px; font-size: 13px; color: #cbd5e1; margin-top: 14px; line-height: 1.5; }
  .char-summary strong { color: #a78bfa; }
  .stage-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 800px) { .stage-wrap { grid-template-columns: 1fr; } }
  .image-out { background: #0f1020; border: 1px solid #2a2b4a; border-radius: 12px; min-height: 320px; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
  .image-out img { width: 100%; height: auto; display: block; }
  .loading { color: #9ca3af; font-size: 14px; }
  .loading::after { content: ''; display: inline-block; width: 14px; height: 14px; border: 2px solid #4a4b6a; border-top-color: #a78bfa; border-radius: 50%; animation: spin 0.8s linear infinite; margin-left: 8px; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; margin-top: 14px; }
  .gallery img { width: 100%; border-radius: 8px; cursor: pointer; border: 1px solid #2a2b4a; }
  .gallery img:hover { border-color: #7c3aed; }
  .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.88); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; cursor: pointer; }
  .lightbox img { max-width: 90vw; max-height: 90vh; border-radius: 12px; box-shadow: 0 0 40px rgba(124,58,237,0.4); }
  .empty { color: #6b7280; font-size: 13px; text-align: center; padding: 30px; }
  .prompt-preview { background: #0a0b18; border-left: 3px solid #7c3aed; padding: 10px 12px; border-radius: 6px; font-size: 12px; color: #9ca3af; margin-top: 10px; font-family: monospace; line-height: 1.5; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #14532d; color: #6ee7b7; padding: 10px 18px; border-radius: 10px; font-size: 13px; font-weight: 600; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 50; }
  .toast.show { opacity: 1; }
  .char-list { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .char-chip { background: #1e1f3a; border: 1px solid #2a2b4a; border-radius: 16px; padding: 5px 12px; font-size: 12px; cursor: pointer; color: #cbd5e1; }
  .char-chip.active { background: linear-gradient(90deg,#7c3aed,#3b82f6); color: #fff; border-color: transparent; }
  .char-chip .x { margin-left: 6px; color: #ef4444; }
</style>

<h1>Gerador de Personagens Consistentes</h1>
<div class="subtitle">Crie um personagem e gere imagens dele em qualquer pose e cenário, mantendo a aparência consistente.</div>

<div class="stepper">
  <div class="step active" id="step1Indicator">1. Personagem</div>
  <div class="step" id="step2Indicator">2. Cena & Geração</div>
</div>

<div class="app">

  <!-- ============ STAGE 1: CHARACTER CREATION ============ -->
  <div id="stage1" class="panel">
    <h2>Criar Personagem</h2>

    <div class="char-list" id="charListEl"></div>

    <div class="grid">
      <div class="field">
        <label>Nome <span class="dice" onclick="randomizeField('charName', ['Aria','Kael','Lyra','Thorne','Mira','Dax','Sable','Rune','Vesna','Cael','Nyx','Orin'])">🎲</span></label>
        <input id="charName" placeholder="Ex: Aria">
      </div>
      <div class="field">
        <label>Estilo de arte</label>
        <select id="artStyle"></select>
      </div>
      <div class="field">
        <label>Gênero</label>
        <select id="gender"></select>
      </div>
      <div class="field">
        <label>Idade</label>
        <input id="age" type="number" value="25" min="1" max="500">
      </div>
      <div class="field">
        <label>Raça/Espécie</label>
        <input id="race" placeholder="Ex: humano, elfo, orc, ciborgue">
      </div>
      <div class="field">
        <label>Cor do cabelo</label>
        <select id="hairColor"></select>
      </div>
      <div class="field">
        <label>Estilo do cabelo</label>
        <select id="hairStyle"></select>
      </div>
      <div class="field">
        <label>Cor dos olhos</label>
        <select id="eyeColor"></select>
      </div>
      <div class="field">
        <label>Tom de pele</label>
        <select id="skinTone"></select>
      </div>
      <div class="field">
        <label>Tipo de corpo</label>
        <select id="bodyType"></select>
      </div>
      <div class="field">
        <label>Altura</label>
        <input id="height" placeholder="Ex: alto, baixo, médio">
      </div>
      <div class="field">
        <label>Formato do rosto</label>
        <input id="faceShape" placeholder="Ex: angular, redondo, oval">
      </div>
      <div class="field" style="grid-column: span 2;">
        <label>Roupa / Traje</label>
        <input id="clothing" placeholder="Ex: armadura de couro com capa verde">
      </div>
      <div class="field" style="grid-column: span 2;">
        <label>Acessórios</label>
        <input id="accessories" placeholder="Ex: colar de cristal, brincos de prata">
      </div>
      <div class="field">
        <label>Marca distintiva</label>
        <select id="distinctiveFeature"></select>
      </div>
      <div class="field">
        <label>Personalidade (expressão)</label>
        <input id="personality" placeholder="Ex: confiante, misteriosa">
      </div>
    </div>

    <div class="actions">
      <button class="btn" onclick="saveCharacter()">Salvar Personagem →</button>
      <button class="btn secondary" onclick="randomizeAll()">🎲 Aleatório</button>
      <button class="btn secondary" onclick="clearCharacter()">Limpar</button>
    </div>

    <div class="char-summary" id="charSummaryEl" hidden></div>
  </div>

  <!-- ============ STAGE 2: SCENE GENERATION ============ -->
  <div id="stage2" class="panel" hidden>
    <h2>Cena & Geração</h2>

    <div class="stage-wrap">
      <div>
        <div class="field" style="margin-bottom: 10px;">
          <label>Pose <span class="dice" onclick="randomizeDatalist('pose')">🎲</span> <span class="dice" onclick="translateField('pose')">🌐</span></label>
          <input id="pose" list="poseOptions" placeholder="Descreva a pose livremente ou escolha uma sugestão">
          <datalist id="poseOptions"></datalist>
        </div>
        <div class="field" style="margin-bottom: 10px;">
          <label>Cenário <span class="dice" onclick="randomizeSelect('scenario')">🎲</span> <span class="dice" onclick="translateField('scenario')">🌐</span></label>
          <textarea id="scenario" placeholder="Descreva o local..."></textarea>
        </div>
        <div class="grid" style="grid-template-columns: 1fr 1fr;">
          <div class="field">
            <label>Hora do dia <span class="dice" onclick="randomizeSelect('timeOfDay')">🎲</span></label>
            <select id="timeOfDay"></select>
          </div>
          <div class="field">
            <label>Clima/Mood <span class="dice" onclick="randomizeSelect('mood')">🎲</span></label>
            <select id="mood"></select>
          </div>
        </div>
        <div class="field" style="margin-top: 10px;">
          <label>Seed <span class="dice" onclick="randomizeSeed()">🎲</span> <span class="dice" onclick="resetSeed()">🔒</span></label>
          <input id="seedInput" type="number" placeholder="Número da seed">
        </div>
        <div class="field" style="margin-top: 10px;">
          <label>Detalhes extras (opcional) <span class="dice" onclick="translateField('extra')">🌐</span></label>
          <textarea id="extra" placeholder="Ex: segurando uma espada flamejante, vento no cabelo..."></textarea>
        </div>
        <div class="field" style="margin-top: 10px;">
          <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
            <input type="checkbox" id="optimizePose" checked style="width: auto;">
            <span>Otimizar prompt pela pose <span style="color:#6b7280; font-weight:400;">(IA remove detalhes invisíveis)</span></span>
          </label>
        </div>
        <div class="actions">
          <button class="btn" id="genBtn" onclick="generate()">✨ Gerar Imagem</button>
          <button class="btn secondary" onclick="randomScene()">🎲 Cena Aleatória</button>
          <button class="btn secondary" onclick="goStage1()">← Editar Personagem</button>
        </div>
        <div class="prompt-preview" id="promptPreviewEl" hidden></div>
      </div>

      <div>
        <div class="image-out" id="imageOutEl">
          <div class="empty" id="emptyStateEl">Sua imagem aparecerá aqui</div>
        </div>
      </div>
    </div>

    <h2 style="margin-top: 18px;">Galeria</h2>
    <div class="gallery" id="galleryEl">
      <div class="empty">Nenhuma imagem gerada ainda</div>
    </div>
  </div>

</div>

<div class="toast" id="toastEl"></div>

<script>
  // ====== carregar opções dos selects a partir das listas pjs ======
  function fillSelect(id, list) {
    const sel = document.getElementById(id);
    sel.innerHTML = "";
    for (let item of list.selectAll) {
      const opt = document.createElement("option");
      opt.value = opt.textContent = item.evaluateItem;
      sel.appendChild(opt);
    }
  }

  function fillDatalist(id, list) {
    const dl = document.getElementById(id);
    dl.innerHTML = "";
    for (let item of list.selectAll) {
      const opt = document.createElement("option");
      opt.value = item.evaluateItem;
      dl.appendChild(opt);
    }
  }

  function fillAll() {
    fillSelect("artStyle", root.artStyles);
    fillSelect("gender", root.genders);
    fillSelect("hairColor", root.hairColors);
    fillSelect("hairStyle", root.hairStyles);
    fillSelect("eyeColor", root.eyeColors);
    fillSelect("skinTone", root.skinTones);
    fillSelect("bodyType", root.bodyTypes);
    fillSelect("distinctiveFeature", root.distinctiveFeatures);
    fillDatalist("poseOptions", root.poses);
    fillSelect("timeOfDay", root.timesOfDay);
    fillSelect("mood", root.moods);
    // cenário é textarea — preencher com um aleatório inicial
    document.getElementById("scenario").value = root.scenarios.selectOne.evaluateItem;
    document.getElementById("pose").value = root.poses.selectOne.evaluateItem;
  }

  // ====== estado ======
  let characters = JSON.parse(localStorage.getItem("ccg_characters") || "[]");
  let activeCharId = null;
  let gallery = [];

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function readForm() {
    return {
      id: activeCharId || uid(),
      name: val("charName"),
      artStyle: val("artStyle"),
      gender: val("gender"),
      age: val("age"),
      race: val("race"),
      hairColor: val("hairColor"),
      hairStyle: val("hairStyle"),
      eyeColor: val("eyeColor"),
      skinTone: val("skinTone"),
      bodyType: val("bodyType"),
      height: val("height"),
      faceShape: val("faceShape"),
      clothing: val("clothing"),
      accessories: val("accessories"),
      distinctiveFeature: val("distinctiveFeature"),
      personality: val("personality")
    };
  }

  function val(id) { return document.getElementById(id).value.trim(); }

  function writeForm(char) {
    set("charName", char.name);
    set("artStyle", char.artStyle);
    set("gender", char.gender);
    set("age", char.age || 25);
    set("race", char.race);
    set("hairColor", char.hairColor);
    set("hairStyle", char.hairStyle);
    set("eyeColor", char.eyeColor);
    set("skinTone", char.skinTone);
    set("bodyType", char.bodyType);
    set("height", char.height);
    set("faceShape", char.faceShape);
    set("clothing", char.clothing);
    set("accessories", char.accessories);
    set("distinctiveFeature", char.distinctiveFeature);
    set("personality", char.personality);
  }
  function set(id, v) { if (v != null) document.getElementById(id).value = v; }

  function renderCharList() {
    const el = document.getElementById("charListEl");
    el.innerHTML = "";
    if (characters.length === 0) return;
    for (let c of characters) {
      const chip = document.createElement("div");
      chip.className = "char-chip" + (c.id === activeCharId ? " active" : "");
      chip.innerHTML = escapeHtml(c.name || "sem nome") + ` <span class="x" onclick="event.stopPropagation(); deleteChar('${c.id}')">×</span>`;
      chip.onclick = () => { activeCharId = c.id; writeForm(c); renderCharList(); updateSummary(); };
      el.appendChild(chip);
    }
  }

  function deleteChar(id) {
    characters = characters.filter(c => c.id !== id);
    if (activeCharId === id) activeCharId = null;
    localStorage.setItem("ccg_characters", JSON.stringify(characters));
    renderCharList();
    toast("Personagem removido");
  }

  function saveCharacter() {
    const char = readForm();
    if (!char.name) { toast("Dê um nome ao personagem"); return; }
    activeCharId = char.id;
    const idx = characters.findIndex(c => c.id === char.id);
    if (idx >= 0) characters[idx] = char; else characters.push(char);
    localStorage.setItem("ccg_characters", JSON.stringify(characters));
    renderCharList();
    updateSummary();
    goStage2();
    toast("Personagem salvo!");
  }

  function updateSummary() {
    const char = readForm();
    const el = document.getElementById("charSummaryEl");
    const prompt = root.buildCharacterPrompt(char);
    el.innerHTML = `<strong>Personagem:</strong> ${escapeHtml(char.name || "?")}<br><strong>Prompt de referência:</strong> ${escapeHtml(prompt)}<br><strong>Seed fixo:</strong> ${root.seedFromCharacter(char)}`;
    el.hidden = false;
  }

  // ====== stage navigation ======
  function goStage1() {
    document.getElementById("stage1").hidden = false;
    document.getElementById("stage2").hidden = true;
    document.getElementById("step1Indicator").classList.add("active");
    document.getElementById("step2Indicator").classList.remove("active");
  }
  function goStage2() {
    document.getElementById("stage1").hidden = true;
    document.getElementById("stage2").hidden = false;
    document.getElementById("step1Indicator").classList.remove("active");
    document.getElementById("step1Indicator").classList.add("done");
    document.getElementById("step2Indicator").classList.add("active");
    fillSeedFromCharacter();
  }

  // ====== randomize helpers ======
  function randomizeField(id, options) {
    document.getElementById(id).value = options[Math.floor(Math.random()*options.length)];
  }
  function randomizeSelect(id) {
    const sel = document.getElementById(id);
    sel.selectedIndex = Math.floor(Math.random()*sel.options.length);
  }
  function randomizeDatalist(id) {
    const list = root.poses;
    document.getElementById(id).value = list.selectOne.evaluateItem;
  }

  function fillSeedFromCharacter() {
    const char = characters.find(c => c.id === activeCharId) || readForm();
    document.getElementById("seedInput").value = root.seedFromCharacter(char);
  }

  function randomizeSeed() {
    document.getElementById("seedInput").value = Math.floor(Math.random() * 1000000);
  }

  function resetSeed() {
    fillSeedFromCharacter();
    toast("Seed resetada para o personagem");
  }

  async function translateField(id) {
    const el = document.getElementById(id);
    const text = el.value.trim();
    if (!text) { toast("Campo vazio"); return; }
    const original = el.value;
    el.disabled = true;
    const oldPlaceholder = el.placeholder;
    el.placeholder = "Traduzindo...";
    try {
      const translated = await root.translateToEnglish(text);
      el.value = translated;
      toast("Traduzido para inglês");
    } catch (e) {
      el.value = original;
      toast("Erro na tradução");
    } finally {
      el.disabled = false;
      el.placeholder = oldPlaceholder;
    }
  }
  function randomizeAll() {
    const opts = {
      charName: ["Aria","Kael","Lyra","Thorne","Mira","Dax","Sable","Rune","Vesna","Cael","Nyx","Orin"],
      race: ["human","elf","dwarf","half-elf","orc","tiefling","cyborg","vampire"]
    };
    randomizeField("charName", opts.charName);
    randomizeField("race", opts.race);
    randomizeSelect("artStyle");
    randomizeSelect("gender");
    randomizeSelect("hairColor");
    randomizeSelect("hairStyle");
    randomizeSelect("eyeColor");
    randomizeSelect("skinTone");
    randomizeSelect("bodyType");
    randomizeSelect("distinctiveFeature");
    document.getElementById("height").value = ["tall","average","short"][Math.floor(Math.random()*3)];
    document.getElementById("faceShape").value = ["angular","round","oval","square"][Math.floor(Math.random()*4)];
    document.getElementById("clothing").value = root.clothingStyles.selectOne.evaluateItem;
    document.getElementById("personality").value = ["confident","mysterious","cheerful","dark","brave","calm"][Math.floor(Math.random()*6)];
    updateSummary();
  }
  function randomScene() {
    randomizeDatalist("pose");
    document.getElementById("scenario").value = root.scenarios.selectOne.evaluateItem;
    randomizeSelect("timeOfDay");
    randomizeSelect("mood");
  }

  function clearCharacter() {
    activeCharId = null;
    document.querySelectorAll("#stage1 input, #stage1 textarea").forEach(e => { if (e.id !== "age") e.value = ""; });
    document.getElementById("age").value = 25;
    document.querySelectorAll("#stage1 select").forEach(s => s.selectedIndex = 0);
    document.getElementById("charSummaryEl").hidden = true;
    renderCharList();
  }

  // ====== geração de imagem ======
  async function generate() {
    const char = characters.find(c => c.id === activeCharId) || readForm();
    const scene = {
      pose: val("pose"),
      scenario: val("scenario"),
      timeOfDay: val("timeOfDay"),
      mood: val("mood"),
      extra: val("extra")
    };
    if (!char.name) { toast("Crie um personagem primeiro"); return; }

    const prompt = root.buildScenePrompt(char, scene);
    const seed = parseInt(document.getElementById("seedInput").value) || root.seedFromCharacter(char);

    const previewEl = document.getElementById("promptPreviewEl");
    const outEl = document.getElementById("imageOutEl");
    const btn = document.getElementById("genBtn");
    btn.disabled = true;

    let finalPrompt = prompt;
    const optimize = document.getElementById("optimizePose").checked;

    try {
      if (optimize) {
        previewEl.textContent = "PROMPT: " + prompt + "\nSEED: " + seed + "\nOtimizando pela pose...";
        previewEl.hidden = false;
        outEl.innerHTML = '<div class="loading">Analisando pose e otimizando prompt...</div>';
        finalPrompt = await root.optimizePromptByPose(prompt, scene.pose);
        let style = char.artStyle || "digital painting";
        if (!finalPrompt.toLowerCase().includes("style:")) {
          finalPrompt += ". Style: " + style + ", highly detailed, masterpiece, trending on artstation, sharp focus, professional illustration";
        }
      }

      previewEl.textContent = "PROMPT: " + finalPrompt + "\nSEED: " + seed;
      previewEl.hidden = false;

      outEl.innerHTML = '<div class="loading">Gerando imagem...</div>';

      const result = await root.generateImage({
        prompt: finalPrompt,
        negativePrompt: "blurry, low quality, deformed, extra limbs, bad anatomy, watermark, text",
        resolution: "768x768",
        seed: seed,
        guidanceScale: 8
      });
      const img = document.createElement("img");
      img.src = result.dataUrl;
      img.onclick = () => openLightbox(result.dataUrl);
      outEl.innerHTML = "";
      outEl.appendChild(img);

      gallery.unshift({ src: result.dataUrl, prompt: finalPrompt, seed, charName: char.name });
      renderGallery();
      toast("Imagem gerada!");
    } catch (e) {
      outEl.innerHTML = '<div class="empty">Erro: ' + escapeHtml(String(e)) + '</div>';
    } finally {
      btn.disabled = false;
    }
  }

  function renderGallery() {
    const el = document.getElementById("galleryEl");
    if (gallery.length === 0) { el.innerHTML = '<div class="empty">Nenhuma imagem gerada ainda</div>'; return; }
    el.innerHTML = "";
    for (let g of gallery) {
      const img = document.createElement("img");
      img.src = g.src;
      img.title = g.prompt.slice(0, 100) + "...";
      img.onclick = () => openLightbox(g.src);
      el.appendChild(img);
    }
  }

  function openLightbox(src) {
    const lb = document.createElement("div");
    lb.className = "lightbox";
    lb.innerHTML = '<img src="' + src + '">';
    lb.onclick = () => lb.remove();
    document.body.appendChild(lb);
  }

  // ====== utils ======
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  }
  let toastTimer;
  function toast(msg) {
    const el = document.getElementById("toastEl");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 2000);
  }

  window.randomizeField = randomizeField;
  window.randomizeSelect = randomizeSelect;
  window.randomizeDatalist = randomizeDatalist;
  window.translateField = translateField;
  window.randomizeSeed = randomizeSeed;
  window.resetSeed = resetSeed;
  window.randomizeAll = randomizeAll;
  window.randomScene = randomScene;
  window.saveCharacter = saveCharacter;
  window.clearCharacter = clearCharacter;
  window.generate = generate;
  window.goStage1 = goStage1;
  window.deleteChar = deleteChar;

  // init
  fillAll();
  if (characters.length > 0) {
    activeCharId = characters[0].id;
    writeForm(characters[0]);
    renderCharList();
    updateSummary();
  } else {
    renderCharList();
  }
</script>

</body>
</html>
