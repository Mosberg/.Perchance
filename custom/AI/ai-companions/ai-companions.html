<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>ai-companions — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<div id="appCtn" style="display:flex; height:100vh; font-family:'Segoe UI',sans-serif; background:#0f0f1a; color:#eee; text-align:left;">
  <!-- Sidebar -->
  <div id="sidebarCtn" style="width:260px; background:#16162a; border-right:1px solid #2a2a4a; display:flex; flex-direction:column;">
    <div style="padding:16px; font-size:18px; font-weight:bold; border-bottom:1px solid #2a2a4a; color:#ff5a7b;">AI Companions</div>
    <div id="charListCtn" style="flex:1; overflow-y:auto; padding:8px;"></div>
    <button id="newCharBtn" style="margin:12px; padding:12px; background:#ff5a7b; border:none; color:white; border-radius:8px; cursor:pointer; font-weight:bold;">+ New Character</button>
  </div>

  <!-- Main Chat -->
  <div style="flex:1; display:flex; flex-direction:column; min-width:0;">
    <!-- Header -->
    <div id="chatHeaderCtn" style="display:flex; align-items:center; justify-content:space-between; padding:12px 20px; background:#1a1a2e; border-bottom:1px solid #2a2a4a;">
      <div style="display:flex; align-items:center; gap:12px;">
        <div id="charAvatarEl" style="width:42px; height:42px; border-radius:50%; background:#2a2a4a; display:flex; align-items:center; justify-content:center; font-size:20px;">🦊</div>
        <div>
          <div id="charNameEl" style="font-weight:bold; font-size:16px;">Select a Character</div>
          <div id="charStatusEl" style="font-size:12px; color:#888;">Offline</div>
        </div>
      </div>
      <div style="display:flex; gap:8px;">
        <button id="genSelfieBtn" style="padding:8px 14px; background:#2a2a4a; border:1px solid #444; color:#ff8fab; border-radius:6px; cursor:pointer;">📸 Selfie</button>
        <button id="clearChatBtn" style="padding:8px 14px; background:#2a2a4a; border:1px solid #444; color:#ccc; border-radius:6px; cursor:pointer;">Clear</button>
      </div>
    </div>

    <!-- Messages -->
    <div id="messagesCtn" style="flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:12px;"></div>

    <!-- Typing indicator -->
    <div id="typingEl" hidden style="padding:0 20px 8px; font-size:13px; color:#888; font-style:italic;">Character is typing...</div>

    <!-- Input -->
    <div style="padding:12px 20px; border-top:1px solid #2a2a4a; background:#1a1a2e; display:flex; gap:10px;">
      <input id="msgInput" placeholder="Type a message..." style="flex:1; padding:12px; background:#0f0f1a; border:1px solid #2a2a4a; color:#eee; border-radius:8px; outline:none;">
      <button id="sendBtn" style="padding:12px 24px; background:#ff5a7b; border:none; color:white; border-radius:8px; cursor:pointer; font-weight:bold;">Send</button>
    </div>
  </div>
</div>

<!-- Character Modal -->
<div id="charModalCtn" hidden style="position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.7); display:flex; align-items:center; justify-content:center; z-index:100;">
  <div style="background:#1e1e2f; padding:24px; border-radius:12px; width:90%; max-width:420px; border:1px solid #333;">
    <h2 id="modalTitleEl" style="margin-top:0; color:#ff5a7b;">New Character</h2>
    <div style="display:flex; flex-direction:column; gap:10px;">
      <input id="editNameInput" placeholder="Name" style="padding:10px; background:#0f0f1a; border:1px solid #2a2a4a; color:#eee; border-radius:6px;">
      <textarea id="editPersonalityInput" placeholder="Personality (e.g., dominant, seductive, shy)" rows="3" style="padding:10px; background:#0f0f1a; border:1px solid #2a2a4a; color:#eee; border-radius:6px; resize:vertical;"></textarea>
      <textarea id="editAppearanceInput" placeholder="Appearance (for image prompts & descriptions)" rows="3" style="padding:10px; background:#0f0f1a; border:1px solid #2a2a4a; color:#eee; border-radius:6px; resize:vertical;"></textarea>
      <textarea id="editScenarioInput" placeholder="Initial Scenario / Context" rows="2" style="padding:10px; background:#0f0f1a; border:1px solid #2a2a4a; color:#eee; border-radius:6px; resize:vertical;"></textarea>
      <div style="display:flex; gap:10px; margin-top:8px;">
        <button id="saveCharBtn" style="flex:1; padding:10px; background:#ff5a7b; border:none; color:white; border-radius:6px; cursor:pointer;">Save</button>
        <button id="cancelCharBtn" style="flex:1; padding:10px; background:#2a2a4a; border:none; color:#ccc; border-radius:6px; cursor:pointer;">Cancel</button>
      </div>
    </div>
  </div>
</div>

<!-- Image Lightbox -->
<div id="lightboxCtn" hidden style="position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.9); display:flex; align-items:center; justify-content:center; z-index:200;" onclick="this.hidden=true">
  <img id="lightboxImg" style="max-width:90%; max-height:90%; border-radius:8px;" src="">
</div>

<style>
  #charListCtn > div:hover { background:#252545; }
  #newCharBtn:hover { filter:brightness(1.1); }
  #sendBtn:hover { filter:brightness(1.1); }
  #genSelfieBtn:hover { background:#333355; }
  #clearChatBtn:hover { background:#333355; }
  #messagesCtn::-webkit-scrollbar { width:8px; }
  #messagesCtn::-webkit-scrollbar-track { background:#0f0f1a; }
  #messagesCtn::-webkit-scrollbar-thumb { background:#2a2a4a; border-radius:4px; }
  #messagesCtn::-webkit-scrollbar-thumb:hover { background:#3a3a6a; }
  #msgInput:focus { border-color:#ff5a7b !important; }
  .msgBubble { max-width:80%; padding:12px 16px; border-radius:12px; line-height:1.5; word-wrap:break-word; }
  .msgUser { background:#3a3a6a; align-self:flex-end; border-bottom-right-radius:2px; }
  .msgChar { background:#2a2a4a; align-self:flex-start; border-bottom-left-radius:2px; }
  .msgImg { max-width:260px; border-radius:8px; margin-top:6px; cursor:pointer; border:1px solid #333; }
</style>

<script type="module">
  // Safe storage wrapper: uses Perchance kv when present, otherwise localStorage
  let storePrefix = 'nsfwChat_';
  let store = (() => {
    if(typeof root !== 'undefined' && root.kv) return root.kv.nsfwChat;
    return {
      get: async (k) => { let v = localStorage.getItem(storePrefix+k); return v===null?undefined:JSON.parse(v); },
      set: async (k,v) => localStorage.setItem(storePrefix+k, JSON.stringify(v)),
    };
  })();

  let genTextFn = (typeof root !== 'undefined' && root.generateText) ? root.generateText : (typeof generateText !== 'undefined' ? generateText : null);
  let genImgFn = (typeof root !== 'undefined' && root.generateImage) ? root.generateImage : (typeof generateImage !== 'undefined' ? generateImage : null);

  let characters = [];
  let currentCharId = null;
  let messages = [];
  let isGenerating = false;
  let editingCharId = null;

  let defaultChars = [
    { id:1, name:"Lilith", personality:"seductive, confident, slightly dominant", appearance:"pale skin, long black hair, red eyes, curvy, wearing silk robe", scenario:"waiting in a private villa suite just for you" },
    { id:2, name:"Aiko", personality:"shy, submissive, eager to please", appearance:"short pink hair, blushing, petite, oversized sweater and nothing else", scenario:"hiding under the bedsheets because she's nervous" },
    { id:3, name:"Raven", personality:"mysterious, teasing, playful", appearance:"dark messy hair, smirk, leather jacket, piercing gaze, toned body", scenario:"leaning against your doorframe at 2am with a hungry look" }
  ];

  async function loadData() {
    characters = await store.get('characters') || defaultChars;
    currentCharId = await store.get('currentCharId') || characters[0]?.id || null;
    renderCharList();
    if(currentCharId) await loadChat(currentCharId);
  }

  async function saveMeta() {
    await store.set('characters', characters);
    await store.set('currentCharId', currentCharId);
  }

  async function saveChat() {
    if(currentCharId) await store.set('chat_'+currentCharId, messages);
  }

  async function loadChat(id) {
    let c = characters.find(x => x.id == id);
    if(!c) return;
    charNameEl.textContent = c.name;
    charStatusEl.textContent = 'Online • ' + c.scenario.substring(0,45) + (c.scenario.length>45?'...':'');
    charAvatarEl.textContent = id%3==0?'🦊':id%3==1?'🐰':'🐱';
    messages = await store.get('chat_'+id) || [];
    if(messages.length == 0) {
      let greeting = `*adjusts posture as you approach* Oh... it's you. I'm ${c.name}. ` + (c.scenario ? "Right now, I'm " + c.scenario + "." : "");
      messages.push({role:'assistant', content:greeting, time:Date.now()});
      await store.set('chat_'+id, messages);
    }
    renderMessages();
  }

  async function selectChar(id) {
    if(currentCharId) await saveChat();
    currentCharId = id;
    await saveMeta();
    await loadChat(id);
    renderCharList();
  }

  function renderCharList() {
    charListCtn.innerHTML = '';
    for(let c of characters) {
      let el = document.createElement('div');
      el.style.cssText = 'padding:10px; cursor:pointer; border-radius:6px; display:flex; align-items:center; gap:10px; color:#ccc;';
      el.innerHTML = `<span style="font-size:20px;">${c.id%3==0?'🦊':c.id%3==1?'🐰':'🐱'}</span><span style="font-weight:500;">${c.name}</span>`;
      el.onclick = () => selectChar(c.id);
      if(c.id == currentCharId) el.style.background = '#252545';
      charListCtn.appendChild(el);
    }
  }

  function escapeHtml(t) {
    return t.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  }

  function renderMessages() {
    messagesCtn.innerHTML = '';
    for(let m of messages) {
      let div = document.createElement('div');
      div.className = 'msgBubble ' + (m.role=='user'?'msgUser':'msgChar');
      if(m.image) {
        div.innerHTML = `<div style="white-space:pre-wrap">${escapeHtml(m.content)}</div><img src="${m.image}" class="msgImg" onclick="viewImage('${m.image}')">`;
      } else {
        div.innerHTML = `<div style="white-space:pre-wrap">${escapeHtml(m.content)}</div>`;
      }
      messagesCtn.appendChild(div);
    }
    messagesCtn.scrollTop = messagesCtn.scrollHeight;
  }

  function addMsg(role, content, image=null) {
    messages.push({role, content, image, time:Date.now()});
    renderMessages();
    saveChat();
  }

  function updateLastAssistantMsg(text) {
    let last = messagesCtn.lastElementChild;
    if(last && messages.length && messages[messages.length-1].role=='assistant') {
      last.querySelector('div').textContent = text;
      messages[messages.length-1].content = text;
      messagesCtn.scrollTop = messagesCtn.scrollHeight;
    } else {
      let div = document.createElement('div');
      div.className = 'msgBubble msgChar';
      let contentDiv = document.createElement('div');
      contentDiv.style.whiteSpace = 'pre-wrap';
      contentDiv.textContent = text;
      div.appendChild(contentDiv);
      messagesCtn.appendChild(div);
      messages.push({role:'assistant', content:text, time:Date.now()});
      messagesCtn.scrollTop = messagesCtn.scrollHeight;
    }
  }

  async function sendMessage() {
    let text = msgInput.value.trim();
    if(!text || isGenerating || !currentCharId) return;
    msgInput.value = '';
    addMsg('user', text);

    let c = characters.find(x => x.id == currentCharId);
    let history = messages.slice(-12).map(m => `${m.role=='user'?'User':c.name}: ${m.content}`).join('\n');
    let instruction = `You are ${c.name}, an adult-oriented AI character.
Personality: ${c.personality}.
Appearance: ${c.appearance}.
Scenario: ${c.scenario}.
Stay fully in character. Use *asterisks* for actions. Speak directly to the User. Keep responses concise but vivid.\n\nConversation:\n${history}`;

    isGenerating = true;
    sendBtn.disabled = true;
    sendBtn.textContent = '...';
    typingEl.hidden = false;

    try {
      let responseText = '';
      await genTextFn({
        instruction: instruction,
        onChunk: (d) => { responseText += d.textChunk; updateLastAssistantMsg(responseText); }
      });
      if(messages.length && messages[messages.length-1].role=='assistant') messages[messages.length-1].content = responseText;
    } catch(e) {
      updateLastAssistantMsg("*Connection interrupted... try again.*");
    }

    isGenerating = false;
    sendBtn.disabled = false;
    sendBtn.textContent = 'Send';
    typingEl.hidden = true;
    await saveChat();
    renderMessages();
  }

  async function generateSelfie() {
    if(!currentCharId || isGenerating || !genImgFn) return;
    let c = characters.find(x => x.id == currentCharId);
    let prompt = `Selfie, ${c.appearance}, intimate atmosphere, ${c.scenario}, soft lighting, detailed, anime style, 4k`;

    genSelfieBtn.disabled = true;
    genSelfieBtn.textContent = '📷 ...';
    isGenerating = true;

    try {
      let dataUrl = await genImgFn(prompt, {resolution:'768x768'});
      addMsg('assistant', `[${c.name} sent a selfie]`, dataUrl);
    } catch(e) {
      addMsg('assistant', `[Image failed to send. Please try again.]`);
    }

    genSelfieBtn.disabled = false;
    genSelfieBtn.textContent = '📸 Selfie';
    isGenerating = false;
  }

  // UI wiring
  sendBtn.onclick = sendMessage;
  msgInput.onkeydown = (e) => { if(e.key=='Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } };
  genSelfieBtn.onclick = generateSelfie;
  clearChatBtn.onclick = async () => { messages=[]; renderMessages(); await saveChat(); };

  newCharBtn.onclick = () => {
    editingCharId = null;
    modalTitleEl.textContent = 'New Character';
    editNameInput.value=''; editPersonalityInput.value=''; editAppearanceInput.value=''; editScenarioInput.value='';
    charModalCtn.hidden = false;
  };

  saveCharBtn.onclick = async () => {
    let name = editNameInput.value.trim();
    if(!name) return;
    let newChar = { id: editingCharId || Date.now(), name, personality: editPersonalityInput.value.trim(), appearance: editAppearanceInput.value.trim(), scenario: editScenarioInput.value.trim() };
    if(editingCharId) {
      let idx = characters.findIndex(x => x.id == editingCharId);
      if(idx > -1) characters[idx] = newChar;
    } else {
      characters.push(newChar);
    }
    await saveMeta();
    renderCharList();
    charModalCtn.hidden = true;
    if(!currentCharId) await selectChar(newChar.id);
  };

  cancelCharBtn.onclick = () => charModalCtn.hidden = true;

  window.viewImage = (src) => { lightboxImg.src = src; lightboxCtn.hidden = false; };

  loadData();
</script>
</body>
</html>
