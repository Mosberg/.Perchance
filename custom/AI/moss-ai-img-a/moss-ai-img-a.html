<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>moss-ai-img-a — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<div id="appCtn" data-theme="dark">
<div style="display:flex; justify-content:space-between; align-items:center; padding:12px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--bg); z-index:10;">
  <h1 style="margin:0; font-size:1.3rem; color:var(--accent);">NSFW AI Generator</h1>
  <button onclick="toggleTheme()" title="Toggle dark/light theme" style="background:var(--card); color:var(--text); border:1px solid var(--border); padding:6px 12px; border-radius:6px; cursor:pointer;">Theme</button>
</div>

<div id="mainCtn" style="max-width:900px; margin:0 auto; padding:12px; display:flex; flex-direction:column; gap:12px;">

  <div style="background:var(--card); border:1px solid var(--border); border-radius:8px; overflow:hidden;">
    <div onclick="toggleSection('builder')" title="Click to collapse/expand" style="padding:12px; background:var(--bg2); cursor:pointer; display:flex; justify-content:space-between; font-weight:bold;">Prompt Builder <span id="builderChevronEl">▼</span></div>
    <div id="builderBody" style="padding:12px; display:flex; flex-direction:column; gap:8px;">
      <textarea id="promptInput" placeholder="Enter your prompt..." oninput="state.prompt=this.value; queueSave()" style="width:100%; min-height:80px; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:8px; resize:vertical; box-sizing:border-box;"></textarea>
      <textarea id="negativeInput" placeholder="Negative prompt (what to exclude)..." oninput="state.negative=this.value; queueSave()" style="width:100%; min-height:50px; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:8px; resize:vertical; box-sizing:border-box;"></textarea>
      <div style="display:flex; flex-wrap:wrap; gap:6px;">
        <button onclick="randomPrompt()" title="Generate a random weighted prompt">Random</button>
        <button onclick="applyRecipe('portrait')" title="Load portrait recipe">Portrait</button>
        <button onclick="applyRecipe('cinematic')" title="Load cinematic recipe">Cinematic</button>
        <button onclick="applyRecipe('macro')" title="Load macro recipe">Macro</button>
        <button onclick="applyRecipe('anime')" title="Load anime recipe">Anime</button>
        <button onclick="applyRecipe('product')" title="Load product recipe">Product</button>
        <button onclick="copyPrompt()" title="Copy current prompt to clipboard">Copy Prompt</button>
      </div>
    </div>
  </div>

  <div style="background:var(--card); border:1px solid var(--border); border-radius:8px; overflow:hidden;">
    <div onclick="toggleSection('enhancer')" title="Click to collapse/expand" style="padding:12px; background:var(--bg2); cursor:pointer; display:flex; justify-content:space-between; font-weight:bold;">Prompt Enhancer <span id="enhancerChevronEl">▼</span></div>
    <div id="enhancerBody" style="padding:12px; display:flex; flex-direction:column; gap:8px;">
      <div style="display:flex; flex-wrap:wrap; gap:8px;">
        <select id="enhanceModeSelect" onchange="state.enhanceMode=this.value; queueSave()" title="Enhancement style" style="flex:1; min-width:140px; background:var(--bg); color:var(--text); border:1px solid var(--border); padding:6px; border-radius:6px;">
          <option value="enhance">Enhance</option>
          <option value="rewrite">Rewrite</option>
          <option value="detail-boost">Detail Boost</option>
          <option value="cinematic">Cinematic</option>
          <option value="photographic">Photographic</option>
        </select>
        <select id="enhanceLengthSelect" onchange="state.enhanceLength=this.value; queueSave()" title="Output length" style="flex:1; min-width:140px; background:var(--bg); color:var(--text); border:1px solid var(--border); padding:6px; border-radius:6px;">
          <option value="short">Short</option>
          <option value="medium" selected>Medium</option>
          <option value="long">Long</option>
          <option value="ultra">Ultra</option>
        </select>
      </div>
      <div style="display:flex; gap:8px;">
        <button id="previewEnhanceBtn" onclick="previewEnhance()" title="Preview the enhancement" style="flex:1;">Preview</button>
        <button onclick="applyEnhance()" title="Apply enhanced prompt to main prompt" style="flex:1; background:var(--accent); color:#fff; border:none;">Apply</button>
      </div>
      <div id="enhancePreviewEl" style="white-space:pre-wrap; font-size:0.9rem; max-height:200px; overflow:auto; background:var(--bg); border:1px solid var(--border); padding:8px; border-radius:6px; display:none;"></div>
    </div>
  </div>

  <div style="background:var(--card); border:1px solid var(--border); border-radius:8px; overflow:hidden;">
    <div onclick="toggleSection('settings')" title="Click to collapse/expand" style="padding:12px; background:var(--bg2); cursor:pointer; display:flex; justify-content:space-between; font-weight:bold;">Generation Settings <span id="settingsChevronEl">▼</span></div>
    <div id="settingsBody" style="padding:12px; display:flex; flex-direction:column; gap:8px;">
      <div style="display:flex; flex-wrap:wrap; gap:8px;">
        <label style="flex:1; min-width:140px; font-size:0.85rem;">Model
          <select id="modelSelect" onchange="state.model=this.value; queueSave()" title="Model preset" style="width:100%; margin-top:4px; background:var(--bg); color:var(--text); border:1px solid var(--border); padding:6px; border-radius:6px;">
            <option>SDXL</option>
            <option>Flux</option>
            <option>SD1.5</option>
            <option>Anime</option>
          </select>
        </label>
        <label style="flex:1; min-width:140px; font-size:0.85rem;">Resolution
          <select id="resolutionSelect" onchange="state.resolution=this.value; queueSave()" title="Image resolution" style="width:100%; margin-top:4px; background:var(--bg); color:var(--text); border:1px solid var(--border); padding:6px; border-radius:6px;">
            <option>512x512</option>
            <option>512x768</option>
            <option>768x512</option>
            <option selected>768x768</option>
          </select>
        </label>
      </div>
      <div style="display:flex; flex-wrap:wrap; gap:8px; align-items:center;">
        <label style="flex:1; min-width:200px; font-size:0.85rem;">Steps <span id="stepsValEl">25</span>
          <input type="range" id="stepsInput" min="1" max="50" value="25" oninput="state.steps=parseInt(this.value); stepsValEl.textContent=this.value; queueSave()" title="Inference steps" style="width:100%; margin-top:4px;">
        </label>
        <label style="flex:1; min-width:200px; font-size:0.85rem;">CFG <span id="cfgValEl">7.5</span>
          <input type="range" id="cfgInput" min="1" max="20" step="0.5" value="7.5" oninput="state.cfg=parseFloat(this.value); cfgValEl.textContent=this.value; queueSave()" title="Classifier-free guidance scale" style="width:100%; margin-top:4px;">
        </label>
      </div>
      <div style="display:flex; flex-wrap:wrap; gap:8px;">
        <label style="flex:1; min-width:140px; font-size:0.85rem;">Sampler
          <select id="samplerSelect" onchange="state.sampler=this.value; queueSave()" title="Sampling algorithm" style="width:100%; margin-top:4px; background:var(--bg); color:var(--text); border:1px solid var(--border); padding:6px; border-radius:6px;">
            <option>Euler</option>
            <option>Euler a</option>
            <option>DPM++ 2M Karras</option>
            <option>DDIM</option>
            <option>UniPC</option>
          </select>
        </label>
        <label style="flex:1; min-width:140px; font-size:0.85rem;">Seed
          <div style="display:flex; gap:4px; margin-top:4px;">
            <input id="seedInput" value="-1" onchange="state.seed=this.value; queueSave()" title="-1 for random seed" style="flex:1; background:var(--bg); color:var(--text); border:1px solid var(--border); padding:6px; border-radius:6px;">
            <button onclick="randomSeed()" title="Randomize seed" style="background:var(--bg2); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:6px 10px; cursor:pointer;">🎲</button>
          </div>
        </label>
        <label style="flex:1; min-width:140px; font-size:0.85rem;">Batch
          <input type="number" id="batchInput" min="1" max="4" value="1" onchange="state.batch=parseInt(this.value)||1; queueSave()" title="Images to generate in sequence" style="width:100%; margin-top:4px; background:var(--bg); color:var(--text); border:1px solid var(--border); padding:6px; border-radius:6px;">
        </label>
      </div>
      <div style="display:flex; flex-wrap:wrap; gap:12px; font-size:0.85rem;">
        <label style="display:flex; align-items:center; gap:4px; cursor:pointer;" title="Attempt face correction"><input type="checkbox" id="faceFixInput" onchange="state.faceFix=this.checked; queueSave()"> Face Fix</label>
        <label style="display:flex; align-items:center; gap:4px; cursor:pointer;" title="Upscale output"><input type="checkbox" id="upscaleInput" onchange="state.upscale=this.checked; queueSave()"> Upscale</label>
        <label style="display:flex; align-items:center; gap:4px; cursor:pointer;" title="Enable safety filter"><input type="checkbox" id="safetyInput" onchange="state.safety=this.checked; queueSave()"> Safety Filter</label>
      </div>
    </div>
  </div>

  <div style="position:sticky; bottom:0; background:var(--bg); border-top:1px solid var(--border); padding:12px; margin:0 -12px; display:flex; gap:8px; align-items:center; z-index:20;">
    <button id="generateBtn" onclick="startGeneration()" title="Start image generation" style="flex:1; padding:14px; background:var(--accent); color:#fff; border:none; border-radius:8px; font-size:1rem; font-weight:bold; cursor:pointer;">Generate</button>
    <div id="statusEl" style="font-size:0.85rem; color:var(--text2); min-width:70px; text-align:right;"></div>
  </div>

  <div style="background:var(--card); border:1px solid var(--border); border-radius:8px; overflow:hidden;">
    <div style="padding:12px; background:var(--bg2); font-weight:bold;">Gallery (<span id="galleryCountEl">0</span>)</div>
    <div id="galleryGrid" style="padding:12px; display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:10px;"></div>
    <div id="sentinelEl" style="height:24px;"></div>
  </div>

</div>

<div id="modalCtn" hidden onclick="if(event.target===modalCtn) modalCtn.hidden=true" style="position:fixed; inset:0; background:rgba(0,0,0,0.85); display:flex; align-items:center; justify-content:center; z-index:50; padding:16px;">
  <div style="background:var(--card); border:1px solid var(--border); border-radius:12px; max-width:600px; width:100%; max-height:90vh; overflow:auto; padding:16px; display:flex; flex-direction:column; gap:10px;">
    <img id="modalImgEl" style="width:100%; border-radius:8px;">
    <pre id="modalMetaEl" style="background:var(--bg); border:1px solid var(--border); padding:10px; border-radius:6px; overflow:auto; font-size:0.8rem; white-space:pre-wrap;"></pre>
    <div style="display:flex; flex-wrap:wrap; gap:8px;">
      <button onclick="downloadCurrent()" title="Download image as PNG" style="flex:1; min-width:100px;">Download</button>
      <button onclick="copyCurrentPrompt()" title="Copy prompt to clipboard" style="flex:1; min-width:100px;">Copy Prompt</button>
      <button onclick="deleteCurrent()" title="Remove from gallery" style="flex:1; min-width:100px; background:#c0392b; color:#fff; border:none;">Delete</button>
      <button onclick="modalCtn.hidden=true" title="Close viewer" style="flex:1; min-width:100px;">Close</button>
    </div>
  </div>
</div>
</div>

<style>
  :root { --accent:#ff4757; --bg:#0f0f0f; --bg2:#1a1a1a; --card:#161616; --text:#eee; --text2:#aaa; --border:#333; }
  [data-theme="light"] { --accent:#e74c3c; --bg:#f2f2f2; --bg2:#e6e6e6; --card:#fff; --text:#111; --text2:#555; --border:#ccc; }
  body { text-align:left; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; margin:0; transition:background .2s,color .2s; }
  button { cursor:pointer; border:1px solid var(--border); background:var(--bg2); color:var(--text); padding:8px 12px; border-radius:6px; transition:filter .15s; font-family:inherit; }
  button:hover { filter:brightness(1.2); }
  #appCtn { min-height:100vh; }
  ::-webkit-scrollbar { width:8px; } ::-webkit-scrollbar-track { background:var(--bg); } ::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }
  @media (max-width:600px) { h1 { font-size:1.1rem !important; } #mainCtn { padding:8px !important; } }
</style>

<script>
  let state = { prompt:"", negative:"", enhanced:"", enhanceMode:"enhance", enhanceLength:"medium", model:"SDXL", resolution:"768x768", steps:25, cfg:7.5, sampler:"Euler", seed:"-1", batch:1, faceFix:false, upscale:false, safety:false, theme:"dark", gallery:[], loaded:false, currentId:null };
  let saveTimer;
  let galleryCursor = 0;
  let BATCH_SIZE = 12;

  let recipes = { portrait:{p:"close-up portrait, sharp focus, skin texture, soft studio lighting", n:"blurry, extra limbs, deformed"}, cinematic:{p:"cinematic shot, film grain, anamorphic lens flare, dramatic lighting", n:"cartoon, 3d render, illustration"}, macro:{p:"macro photography, extreme detail, shallow depth of field, bokeh", n:"noise, deformed, blurry"}, anime:{p:"masterpiece, best quality, anime style, detailed eyes, cel shaded", n:"lowres, bad anatomy, blurry, watermark"}, product:{p:"product photography, clean background, soft box lighting, 8k", n:"busy background, hands, people, blur"} };
  let dicts = { subject:[{v:"elegant vampire woman in a gothic castle interior",w:2},{v:"cyberpunk street mercenary standing under neon signs",w:3},{v:"mythical dryad emerging from an ancient glowing tree",w:2},{v:"post-apocalyptic warrior in a dust storm",w:2},{v:"sultry noir detective leaning against a foggy alley wall",w:2},{v:"alien landscape with towering bioluminescent flora",w:2},{v:"late-night intimate bedroom scene with warm lamp glow",w:2}], style:[{v:"digital painting",w:4},{v:"oil on canvas",w:2},{v:"octane render",w:3},{v:"watercolor on paper",w:2},{v:"charcoal sketch",w:1},{v:"photorealistic render",w:4}], lighting:[{v:"golden hour sunlight streaming through windows",w:3},{v:"neon rim lighting in magenta and cyan",w:2},{v:"softbox studio light with gradient falloff",w:3},{v:"moonlight casting long shadows across the floor",w:2},{v:"warm candlelight flicker",w:1}], camera:[{v:"85mm portrait lens",w:3},{v:"f/1.8 shallow depth of field",w:3},{v:"wide angle 24mm environmental shot",w:2},{v:"macro 100mm extreme detail",w:1},{v:"aerial drone establishing shot",w:1}], composition:[{v:"rule of thirds framing",w:3},{v:"symmetrical centered composition",w:2},{v:"extreme close-up on face",w:2},{v:"dynamic dutch angle",w:1},{v:"over-the-shoulder perspective",w:1}], mood:[{v:"mysterious and brooding",w:3},{v:"serene and ethereal",w:2},{v:"intense and dramatic",w:3},{v:"melancholic isolation",w:2},{v:"playful intimacy",w:2}] };

  function weightedPick(arr){ let t=0; for(let i=0;i<arr.length;i++) t+=arr[i].w; let r=Math.random()*t; for(let i=0;i<arr.length;i++){ r-=arr[i].w; if(r<=0) return arr[i].v; } return arr[0].v; }
  function randomPrompt(){ let p=[weightedPick(dicts.subject), weightedPick(dicts.style), weightedPick(dicts.lighting), weightedPick(dicts.camera), weightedPick(dicts.composition), weightedPick(dicts.mood)].join(", "); state.prompt=p; promptInput.value=p; queueSave(); }
  function applyRecipe(k){ state.prompt=recipes[k].p; state.negative=recipes[k].n; promptInput.value=state.prompt; negativeInput.value=state.negative; queueSave(); }
  async function copyPrompt(){ try{ await navigator.clipboard.writeText(state.prompt); }catch(e){} }
  function randomSeed(){ state.seed=String(Math.floor(Math.random()*999999)); seedInput.value=state.seed; queueSave(); }

  function toggleTheme(){ state.theme=state.theme==="dark"?"light":"dark"; appCtn.setAttribute("data-theme",state.theme); queueSave(); }
  function toggleSection(id){ let el=document.getElementById(id+"Body"); let arrow=document.getElementById(id+"ChevronEl"); let hidden=el.style.display==="none"; el.style.display=hidden?"block":"none"; arrow.textContent=hidden?"▼":"▶"; }

  function queueSave(){ clearTimeout(saveTimer); saveTimer=setTimeout(saveState,800); }
  async function saveState(){ await kv.nsfwGenState.set("ui", {prompt:state.prompt,negative:state.negative,enhanced:state.enhanced,enhanceMode:state.enhanceMode,enhanceLength:state.enhanceLength,model:state.model,resolution:state.resolution,steps:state.steps,cfg:state.cfg,sampler:state.sampler,seed:state.seed,batch:state.batch,faceFix:state.faceFix,upscale:state.upscale,safety:state.safety,theme:state.theme}); }
  async function loadState(){
    let s=await kv.nsfwGenState.get("ui");
    if(s){
      Object.assign(state,s);
      promptInput.value=state.prompt||""; negativeInput.value=state.negative||""; enhanceModeSelect.value=state.enhanceMode||"enhance"; enhanceLengthSelect.value=state.enhanceLength||"medium"; modelSelect.value=state.model||"SDXL"; resolutionSelect.value=state.resolution||"768x768"; stepsInput.value=state.steps||25; stepsValEl.textContent=stepsInput.value; cfgInput.value=state.cfg||7.5; cfgValEl.textContent=cfgInput.value; samplerSelect.value=state.sampler||"Euler"; seedInput.value=state.seed||"-1"; batchInput.value=state.batch||1; faceFixInput.checked=!!state.faceFix; upscaleInput.checked=!!state.upscale; safetyInput.checked=!!state.safety; appCtn.setAttribute("data-theme",state.theme);
      if(state.enhanced){ enhancePreviewEl.textContent=state.enhanced; enhancePreviewEl.style.display="block"; }
    }
    let entries=await kv.nsfwGenGallery.entries();
    state.gallery=entries.filter(function(e){ return e[0].startsWith("img_"); }).map(function(e){ return e[1]; }).sort(function(a,b){ return b.time-a.time; });
    galleryCountEl.textContent=state.gallery.length;
    galleryCursor=0; galleryGrid.innerHTML=""; renderBatch();
    state.loaded=true;
  }

  async function previewEnhance(){ if(!state.prompt.trim()) return; previewEnhanceBtn.disabled=true; previewEnhanceBtn.textContent="Enhancing..."; let modes={enhance:"Enhance this image prompt to be more vivid and descriptive while keeping the original intent.",rewrite:"Rewrite this image prompt in a professional, detailed style.","detail-boost":"Add extreme fine detail, texture descriptions, and material qualities to this prompt.",cinematic:"Convert this prompt into a cinematic movie still description with lighting and camera language.",photographic:"Optimize this prompt for photorealistic output with technical photography terms."}; let lens={short:120,medium:250,long:450,ultra:800}; let inst=`${modes[state.enhanceMode]}\nDesired length: ${state.enhanceLength}.\nPrompt: "${state.prompt}"\nRespond with only the enhanced prompt.`; try{ let txt=await generateText({instruction:inst,maxTokens:lens[state.enhanceLength]}); state.enhanced=txt; enhancePreviewEl.textContent=txt; enhancePreviewEl.style.display="block"; }catch(e){ enhancePreviewEl.textContent="Error: "+e.message; enhancePreviewEl.style.display="block"; } previewEnhanceBtn.disabled=false; previewEnhanceBtn.textContent="Preview"; }
  function applyEnhance(){ if(state.enhanced){ state.prompt=state.enhanced; promptInput.value=state.prompt; queueSave(); } }

  async function startGeneration(){ if(state.pending||!state.prompt.trim()) return; state.pending=true; generateBtn.disabled=true; generateBtn.textContent="Generating..."; statusEl.textContent="0 / "+state.batch; let done=0; let final=state.prompt; if(state.model==="Anime") final="anime style, "+final; else if(state.model==="SDXL"||state.model==="Flux") final="photorealistic, "+final; try{ for(let i=0;i<state.batch;i++){ let seed=state.seed==="-1"?Math.floor(Math.random()*999999):parseInt(state.seed)+i; let url=await generateImage(final,{resolution:state.resolution}); let item={id:Date.now()+i,url:url,prompt:final,negative:state.negative,model:state.model,resolution:state.resolution,steps:state.steps,cfg:state.cfg,sampler:state.sampler,seed:seed,time:Date.now()}; state.gallery.unshift(item); await kv.nsfwGenGallery.set("img_"+item.id,item); renderGalleryItem(item,true); galleryCountEl.textContent=state.gallery.length; done++; statusEl.textContent=done+" / "+state.batch; } await saveState(); }catch(e){ statusEl.textContent="Error"; } state.pending=false; generateBtn.disabled=false; generateBtn.textContent="Generate"; statusEl.textContent="Done"; }

  function renderGalleryItem(item,atStart){ let d=document.createElement("div"); d.style.cssText="background:var(--bg); border:1px solid var(--border); border-radius:8px; overflow:hidden; position:relative; cursor:pointer; aspect-ratio:1; display:flex; align-items:center; justify-content:center;"; d.innerHTML=`<img src="${item.url}" style="width:100%; height:100%; object-fit:cover; display:block;" loading="lazy" alt="">`; d.onclick=function(){ openMeta(item.id); }; if(atStart && galleryGrid.firstChild){ galleryGrid.insertBefore(d,galleryGrid.firstChild); }else{ galleryGrid.appendChild(d); } }
  function renderBatch(){ let end=Math.min(galleryCursor+BATCH_SIZE,state.gallery.length); for(;galleryCursor<end;galleryCursor++){ renderGalleryItem(state.gallery[galleryCursor]); } }
  function openMeta(id){ let item=null; for(let i=0;i<state.gallery.length;i++){ if(state.gallery[i].id===id){ item=state.gallery[i]; break; } } if(!item) return; state.currentId=id; modalImgEl.src=item.url; modalMetaEl.textContent="Prompt: "+item.prompt+"\nNegative: "+(item.negative||"none")+"\nModel: "+item.model+"\nResolution: "+item.resolution+"\nSteps: "+item.steps+" | CFG: "+item.cfg+" | Sampler: "+item.sampler+"\nSeed: "+item.seed+"\nTime: "+new Date(item.time).toLocaleString(); modalCtn.hidden=false; }
  function downloadCurrent(){ let item=null; for(let i=0;i<state.gallery.length;i++){ if(state.gallery[i].id===state.currentId){ item=state.gallery[i]; break; } } if(!item) return; let a=document.createElement("a"); a.href=item.url; a.download="gen_"+item.id+".png"; a.click(); }
  async function copyCurrentPrompt(){ let item=null; for(let i=0;i<state.gallery.length;i++){ if(state.gallery[i].id===state.currentId){ item=state.gallery[i]; break; } } if(!item) return; try{ await navigator.clipboard.writeText(item.prompt); }catch(e){} }
  async function deleteCurrent(){ let idx=-1; for(let i=0;i<state.gallery.length;i++){ if(state.gallery[i].id===state.currentId){ idx=i; break; } } if(idx===-1) return; let id=state.gallery[idx].id; state.gallery.splice(idx,1); await kv.nsfwGenGallery.delete("img_"+id); galleryCountEl.textContent=state.gallery.length; galleryGrid.innerHTML=""; galleryCursor=0; renderBatch(); modalCtn.hidden=true; }

  let observer=new IntersectionObserver(function(entries){ if(entries[0].isIntersecting && galleryCursor<state.gallery.length){ renderBatch(); } });
  observer.observe(sentinelEl);

  let params=new URLSearchParams(location.search);
  if(params.has("prompt")){ state.prompt=params.get("prompt"); }

  loadState();
</script>
</body>
</html>
