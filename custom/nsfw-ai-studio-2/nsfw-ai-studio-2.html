        enchantPromptBtn.textContent = "Enchant Prompt";
      }
    };
    
    // Copy text functionality
    copyTextBtn.onclick = async () => {
      if (!textOutputEl.innerHTML.trim()) {
        return alert("No text to copy!");
      }
      
      let success = await copyTextPlugin(textOutputEl.innerHTML);
      if (success) {
        alert("Text copied to clipboard!");
      } else {
        alert("Failed to copy text. Your browser may not support this feature.");
      }
    };

    // --- Image Upload Logic ---
    uploadBtn.onclick = async () => {
      let fileInput = imageUploadInput;
      if (!fileInput.files || !fileInput.files[0]) {
        return alert("Please select an image first.");
      }
      
      uploadBtn.disabled = true;
      uploadBtn.textContent = "Uploading...";
      uploadResultEl.textContent = "Uploading image...";
      
      try {
        let file = fileInput.files[0];
        let { url, size, error, deletionUrl } = await uploadPlugin(file);
        
        if (error) {
          uploadResultEl.textContent = `Upload failed: ${error}`;
        } else {
          uploadResultEl.innerHTML = `Image uploaded successfully!<br>
          URL: <a href="${url}" target="_blank" style="color:#4caf50;">${url}</a><br>
          Size: ${(size / 1024).toFixed(2)} KB<br>
          <button onclick="imageUploadInput.value=''; uploadResultEl.textContent='';" style="margin-top:10px; padding:5px 10px; background:#333; color:#fff; border:1px solid #555; border-radius:4px; cursor:pointer;">Clear</button>
          <button onclick="navigator.clipboard.writeText('${url}').then(()=>alert('URL copied!'))" style="margin-top:10px; margin-left:10px; padding:5px 10px; background:#333; color:#fff; border:1px solid #555; border-radius:4px; cursor:pointer;">Copy URL</button>`;
        }
      } catch (err) {
        console.error(err);
        uploadResultEl.textContent = "Upload failed. Please try again.";
      } finally {
        uploadBtn.disabled = false;
        uploadBtn.textContent = "Upload & Get URL";
      }
    };

    // --- Favorites / Storage Logic ---
    window.saveImage = async () => { // Expose to window for inline onclick
      let images = imgResultsContainer.querySelectorAll('img');
      if (images.length === 0) return;
      
      let currentFavorites = await kv.favorites.get("list") || [];
      
      images.forEach(img => {
        currentFavorites.push({
          url: img.src,
          prompt: imgPromptInput.value,
          date: Date.now()
        });
      });
      
      await kv.favorites.set("list", currentFavorites);
      alert("Images saved to favorites!");
      renderFavorites();
    };
    
    window.saveSpecificImage = async (url, prompt) => {
      let currentFavorites = await kv.favorites.get("list") || [];
      currentFavorites.push({
        url: url,
        prompt: prompt,
        date: Date.now()
      });
      await kv.favorites.set("list", currentFavorites);
      alert("Image saved to favorites!");
      renderFavorites();
    };

    async function renderFavorites() {
      let list = await kv.favorites.get("list");
      if(!list || list.length === 0) {
        favoritesSection.hidden = true;
        return;
      }
      favoritesSection.hidden = false;
      favoritesGrid.innerHTML = list.map((item, index) => `
        <div style="position:relative; group;">
          <img src="${item.url}" style="width:100%; height:100px; object-fit:cover; border-radius:4px; border:1px solid #444;">
          <button onclick="removeFavorite(${index})" style="position:absolute; top:2px; right:2px; background:red; color:white; border:none; border-radius:50%; width:20px; height:20px; font-size:12px; cursor:pointer;">×</button>
        </div>
      `).join('');
    }

    window.removeFavorite = async (index) => {
      let list = await kv.favorites.get("list") || [];
      list.splice(index, 1);
      await kv.favorites.set("list", list);
      renderFavorites();
    };

    // --- Initialization ---
    async function init() {
      // Load comments
      if (typeof commentsPlugin === 'function') {
        commentsCtn.innerHTML = commentsPlugin({ channel:"nsfw-gen", width:"100%", height:"300px" });
      } else {
        commentsCtn.innerHTML = '<p style="color:#666; font-style:italic;">Comments plugin not available in this environment.</p>';
      }
      
      // Load remembered preferences
      if (rememberPrefsCheck.checked) {
        try {
          let prefs = await rememberPlugin.get();
          if (prefs.imgCategory) explicitCategorySelect.value = prefs.imgCategory;
          if (prefs.anatomyLevel) anatomyDetailSelect.value = prefs.anatomyLevel;
          if (prefs.resolution) resolutionInput.value = prefs.resolution;
          if (prefs.imgCount) imgCountInput.value = prefs.imgCount;
          if (prefs.textCategory) textCategorySelect.value = prefs.textCategory;
          if (prefs.explicitLevel) explicitLevelInput.value = prefs.explicitLevel;
        } catch (err) {
          console.error("Failed to load preferences:", err);
        }
      }
      
      // Load last image if exists
      let last = await kv.history.get("lastImage");
      if(last) {
        imgPromptInput.value = last.prompt;
        if(last.category) explicitCategorySelect.value = last.category;
        if(last.anatomyLevel) anatomyDetailSelect.value = last.anatomyLevel;
        if(last.resolution) resolutionInput.value = last.resolution;
        if(last.count) imgCountInput.value = last.count;
      }
      
      // Load last text if exists
      let lastText = await kv.history.get("lastText");
      if(lastText) {
        charTopicInput.value = lastText.topic;
        if(lastText.category) textCategorySelect.value = lastText.category;
        if(lastText.explicitLevel) explicitLevelInput.value = lastText.explicitLevel;
        textOutputEl.innerHTML = lastText.content;
      }

      // Load favorites
      renderFavorites();
      
      // Auto-generate if option is checked
      if (autoGenerateCheck.checked) {
        randomPromptBtn.click();
      }
    }

    init();
  </script>
</div>
</body>
</html>
