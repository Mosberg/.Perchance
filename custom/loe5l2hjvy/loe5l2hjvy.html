<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>loe5l2hjvy — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<!-- 
AI Image Describer - Built with Vanilla JS/HTML/CSS
Features:
  [x] Image Generation (Generate Image button)
  [x] Image Upload (Support for describing own images)
  [x] AI Analysis (Detailed description, object recognition, prompt generation)
  [x] Streaming Text Responses
  [x] Responsive Layout
-->

<div id="appCtn" style="display:flex; flex-direction:column; align-items:center; min-height:100vh; background:#0f172a; color:#e2e8f0; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; padding:20px; box-sizing:border-box;">

  <!-- Header -->
  <header style="text-align:center; margin-bottom:30px; max-width:800px;">
    <h1 style="margin:0; font-size:2.5rem; background:linear-gradient(135deg, #60a5fa, #a78bfa); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">AI Image Describer</h1>
    <p style="margin:10px 0 0; color:#94a3b8;">Generate images or upload your own to get instant AI-powered visual insights, object recognition, and detailed prompts.</p>
  </header>

  <!-- Main Workspace -->
  <main style="display:flex; flex-wrap:wrap; gap:30px; width:100%; max-width:1200px; justify-content:center;">

    <!-- Left Column: Image Preview -->
    <div id="imagePanelEl" style="flex:1; min-width:300px; background:#1e293b; border-radius:16px; padding:20px; display:flex; flex-direction:column; align-items:center; justify-content:center; box-shadow:0 4px 20px rgba(0,0,0,0.3); position:relative;">
      
      <div id="placeholderEl" style="color:#475569; display:flex; flex-direction:column; align-items:center; gap:10px;">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
        <span>No image selected</span>
      </div>

      <img id="mainImageEl" hidden style="width:100%; height:auto; border-radius:8px; box-shadow:0 0 15px rgba(0,0,0,0.5); object-fit:contain; max-height:500px; background:black;" />

      <!-- Upload Overlay -->
      <div id="uploadOverlayEl" style="position:absolute; bottom:20px; display:flex; gap:10px;">
        <input type="file" id="fileInputEl" accept="image/*" hidden onchange="handleFileUpload(this)">
        <button onclick="fileInputEl.click()" style="background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); color:white; padding:8px 16px; border-radius:20px; cursor:pointer; font-size:0.9rem; transition:background 0.2s;">📂 Upload Image</button>
      </div>
      
      <!-- Loading Spinner for Image -->
      <div id="imgLoadingEl" hidden style="position:absolute; background:rgba(15,23,42,0.8); inset:0; display:flex; align-items:center; justify-content:center; border-radius:16px;">
        <div style="width:40px; height:40px; border:4px solid #334155; border-top-color:#60a5fa; border-radius:50%; animation:spin 1s linear infinite;"></div>
      </div>
    </div>

    <!-- Right Column: Controls & Analysis -->
    <div style="flex:1; min-width:300px; display:flex; flex-direction:column; gap:20px;">
      
      <!-- Input Controls -->
      <div style="background:#1e293b; padding:20px; border-radius:16px; box-shadow:0 4px 20px rgba(0,0,0,0.3);">
        <label style="display:block; font-size:0.9rem; color:#cbd5e1; margin-bottom:8px; font-weight:600;">Image Context / Prompt</label>
        <div style="display:flex; gap:10px; margin-bottom:15px;">
          <input id="contextInputEl" type="text" placeholder="e.g. A futuristic cyberpunk city at night..." style="flex:1; background:#0f172a; border:1px solid #334155; color:white; padding:10px 15px; border-radius:8px; outline:none; font-size:1rem;">
          <button id="generateImgBtn" onclick="generateImage()" style="background:#3b82f6; border:none; color:white; padding:10px 20px; border-radius:8px; cursor:pointer; font-weight:600; white-space:nowrap; transition:background 0.2s;">Generate</button>
        </div>
        
        <div style="display:flex; gap:10px;">
          <button id="analyzeBtn" onclick="analyzeImage()" disabled style="flex:1; background:#8b5cf6; border:none; color:white; padding:12px; border-radius:8px; cursor:pointer; font-weight:600; font-size:1rem; opacity:0.5; transition:opacity 0.2s;">
            ✨ Analyze Image
          </button>
        </div>
        <p id="hintEl" style="font-size:0.8rem; color:#64748b; margin-top:10px; text-align:center;">Generate an image or upload one to begin.</p>
      </div>

      <!-- Analysis Output -->
      <div id="outputPanelEl" style="background:#1e293b; padding:20px; border-radius:16px; box-shadow:0 4px 20px rgba(0,0,0,0.3); flex-grow:1; display:flex; flex-direction:column;">
        <h3 style="margin:0 0 15px; color:#e2e8f0; font-size:1.1rem; border-bottom:1px solid #334155; padding-bottom:10px;">AI Visual Analysis</h3>
        <div id="resultEl" style="flex:1; line-height:1.6; color:#cbd5e1; font-size:0.95rem; white-space:pre-wrap; overflow-y:auto; max-height:400px; padding-right:5px;">
          <span style="color:#64748b; font-style:italic;">The analysis will appear here...</span>
        </div>
      </div>

    </div>
  </main>
</div>

<style>
  @keyframes spin { to { transform: rotate(360deg); } }
  /* Custom Scrollbar for output */
  #resultEl::-webkit-scrollbar { width: 8px; }
  #resultEl::-webkit-scrollbar-track { background: #0f172a; }
  #resultEl::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  #resultEl::-webkit-scrollbar-thumb:hover { background: #475569; }
</style>

<script type="module">
  // State variables
  let currentContext = "";
  let isGenerating = false;

  // Helper to get elements by ID (camelCase)
  const get = (id) => document.getElementById(id);
  
  // --- Image Generation Logic ---
  window.generateImage = async function() {
    let prompt = contextInputEl.value.trim();
    if(!prompt) {
      hintEl.innerText = "⚠️ Please enter a prompt or context first.";
      return;
    }
    
    // UI Updates
    isGenerating = true;
    imgLoadingEl.hidden = false;
    placeholderEl.hidden = true;
    generateImgBtn.disabled = true;
    analyzeBtn.disabled = true;
    hintEl.innerText = "Generating image... this may take a moment.";
    currentContext = prompt;

    try {
      // Use global generateImage via root
      let dataUrl = await root.generateImage(prompt, {resolution:"768x768"});
      mainImageEl.src = dataUrl;
      mainImageEl.hidden = false;
      
      // Enable Analyze button
      analyzeBtn.disabled = false;
      analyzeBtn.style.opacity = "1";
      hintEl.innerText = "Image ready! Click 'Analyze Image' for details.";
    } catch(e) {
      hintEl.innerText = "Error generating image. Please try again.";
      console.error(e);
    } finally {
      imgLoadingEl.hidden = true;
      generateImgBtn.disabled = false;
      isGenerating = false;
    }
  };

  // --- File Upload Logic ---
  window.handleFileUpload = function(input) {
    if (input.files && input.files[0]) {
      let reader = new FileReader();
      reader.onload = function(e) {
        mainImageEl.src = e.target.result;
        mainImageEl.hidden = false;
        placeholderEl.hidden = true;
        
        // Enable analyze button if there is context
        if(contextInputEl.value.trim()) {
            analyzeBtn.disabled = false;
            analyzeBtn.style.opacity = "1";
            hintEl.innerText = "Image uploaded. Add context below if needed, then Analyze.";
        } else {
            hintEl.innerText = "Image uploaded. Please provide a brief description of the image in the text box above so the AI can analyze it.";
        }
      }
      reader.readAsDataURL(input.files[0]);
    }
  };

  // Listen for context input changes to enable/disable analyze button for uploads
  contextInputEl.addEventListener('input', () => {
    if(!mainImageEl.hidden && contextInputEl.value.trim() && !isGenerating) {
      analyzeBtn.disabled = false;
      analyzeBtn.style.opacity = "1";
    }
  });

  // --- Analysis Logic ---
  window.analyzeImage = async function() {
    let prompt = contextInputEl.value.trim();
    if(!prompt && !currentContext) {
      hintEl.innerText = "⚠️ Please provide a description of the image for the AI.";
      return;
    }
    
    // Use the prompt from input, or the stored context from generation
    let finalContext = prompt || currentContext;
    
    // UI Updates
    analyzeBtn.disabled = true;
    analyzeBtn.innerText = "Analyzing...";
    resultEl.innerHTML = "<span style='color:#60a5fa;'>Connecting to AI Visual Cortex...</span>";
    
    // Construct the instruction for the AI
    let instruction = `You are an expert AI Image Describer. Analyze the image based on this context: "${finalContext}". 
    Provide a detailed report with the following sections:
    1. **General Description**: A vivid summary of the scene.
    2. **Visual Elements**: Break down the key objects, their placement, colors, and lighting.
    3. **Atmosphere & Mood**: Describe the emotional tone and setting.
    4. **AI Art Prompt**: Create a highly detailed text-to-image prompt (Midjourney/Stable Diffusion style) based on this analysis.`;

    try {
      // Use root.generateText
      let textPromise = root.generateText(instruction);
      
      // Stream the output directly into the result element
      resultEl.innerHTML = textPromise;
      
      // Wait for completion to reset button
      await textPromise;
      
    } catch(e) {
      resultEl.innerText = "Error during analysis.";
      console.error(e);
    } finally {
      analyzeBtn.innerText = "✨ Analyze Image";
      analyzeBtn.disabled = false;
    }
  };
</script>
</body>
</html>
