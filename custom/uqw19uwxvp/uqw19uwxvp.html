<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">

<body>
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI JS HTML Generator</title>
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&f[]=cabinet-grotesk@500,700,800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --text-xs: 0.75rem;
      --text-sm: 0.875rem;
      --text-base: 1rem;
      --text-lg: 1.125rem;
      --text-xl: 1.25rem;
      --text-2xl: 1.5rem;
      --space-1: 0.25rem;
      --space-2: 0.5rem;
      --space-3: 0.75rem;
      --space-4: 1rem;
      --space-5: 1.25rem;
      --space-6: 1.5rem;
      --radius-sm: 0.375rem;
      --radius-md: 0.5rem;
      --radius-lg: 0.75rem;
      --radius-xl: 1rem;
      --color-bg: #121316;
      --color-surface: #191b20;
      --color-surface-2: #20232a;
      --color-border: #363b46;
      --color-text: #ece8dd;
      --color-text-muted: #b0aa9c;
      --color-primary: #6db6bd;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.22);
      --shadow-md: 0 12px 36px rgba(0, 0, 0, 0.28);
      --transition: 180ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    [data-theme="light"] {
      --color-bg: #f4f4f5;
      --color-surface: #ffffff;
      --color-surface-2: #e4e4e7;
      --color-border: #d4d4d8;
      --color-text: #18181b;
      --color-text-muted: #71717a;
      --color-primary: #0ea5e9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
    }

    body {
      font-family: 'Satoshi', sans-serif;
      font-size: var(--text-base);
      color: var(--color-text);
      background: var(--color-bg);
      line-height: 1.5;
      min-height: 100vh;
      text-align: left;
    }

    .app-shell {
      display: grid;
      grid-template-columns: minmax(20rem, 28rem) 1fr;
      min-height: 100vh;
    }

    .panel {
      padding: var(--space-6);
      border-right: 1px solid var(--color-border);
      background: var(--color-surface);
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
      margin-bottom: var(--space-6);
    }

    .brand__mark {
      width: 2.75rem;
      height: 2.75rem;
      border-radius: var(--radius-lg);
      display: grid;
      place-items: center;
      background: var(--color-primary);
      color: white;
      flex-shrink: 0;
    }

    .control-group {
      display: grid;
      gap: var(--space-4);
      margin-bottom: var(--space-5);
      padding: var(--space-4);
      background: var(--color-surface-2);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
    }

    .field {
      display: grid;
      gap: var(--space-2);
    }

    input, select, textarea {
      width: 100%;
      padding: 0.875rem 1rem;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background: var(--color-surface);
      color: inherit;
      font: inherit;
    }

    textarea {
      min-height: 8rem;
      resize: vertical;
    }

    .inline-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--space-3);
    }

    .btn {
      padding: 0.8rem 1rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      cursor: pointer;
      transition: var(--transition);
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn--primary {
      background: var(--color-primary);
      color: white;
      border-color: transparent;
    }

    .workspace {
      padding: var(--space-6);
      display: grid;
      gap: var(--space-6);
      align-content: start;
    }

    .preview-frame {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-xl);
      padding: var(--space-5);
      position: relative;
    }

    .tabs {
      display: flex;
      gap: var(--space-3);
    }

    .tab-active {
      border-color: var(--color-primary);
      color: var(--color-primary);
    }

    @media (max-width: 1100px) {
      .app-shell {
        grid-template-columns: 1fr;
      }
      
      .panel {
        position: static;
        height: auto;
        border-right: none;
        border-bottom: 1px solid var(--color-border);
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="panel">
      <div class="brand">
        <div style="display:flex;align-items:center;gap:1rem;min-width:0;">
          <div class="brand__mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 7.5h16"></path>
              <path d="M7 4v7"></path>
              <path d="M17 4v7"></path>
              <rect x="4" y="7" width="16" height="13" rx="3"></rect>
              <path d="M9 12h6"></path>
              <path d="M9 16h3"></path>
            </svg>
          </div>
          <div>
            <h1>AI JS HTML Generator</h1>
            <p style="color:var(--color-text-muted);font-size:var(--text-sm);margin-top:var(--space-1);">Config-driven UI engine with plugins, slots, state and export tools.</p>
          </div>
        </div>
        <button class="btn" id="themeToggleBtn" type="button" aria-label="Switch theme">☼</button>
      </div>

      <form id="generatorFormEl">
        <section class="control-group">
          <h2>Generator input</h2>
          <div class="field">
            <label for="promptInputEl">Describe the HTML you want</label>
            <textarea id="promptInputEl" name="prompt">Create a dashboard-style game UI with a header, stat cards, quest list, action buttons, themed panel styling and one conditional alert block.</textarea>
          </div>
          <div class="inline-grid">
            <div class="field">
              <label for="presetSelectEl">Preset</label>
              <select id="presetSelectEl" name="preset">
                <option value="dashboard">Game dashboard</option>
                <option value="cards">Card gallery</option>
                <option value="form">Advanced form</option>
                <option value="landing">Landing hero</option>
              </select>
            </div>
            <div class="field">
              <label for="themeSelectEl">Theme</label>
              <select id="themeSelectEl" name="theme">
                <option value="aurora">Aurora</option>
                <option value="obsidian">Obsidian</option>
                <option value="dawnforge">Dawnforge</option>
                <option value="terminal">Terminal</option>
              </select>
            </div>
          </div>
        </section>

        <button class="btn btn--primary" id="generateBtnEl" type="submit">Generate HTML</button>
      </form>

      <section class="control-group" style="margin-top:var(--space-5);">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-3);">
          <h2 style="font-size:var(--text-lg);">History</h2>
          <button class="btn" style="padding:0.4rem 0.6rem;font-size:var(--text-xs);" onclick="clearHistory()">Clear</button>
        </div>
        <div id="historyListEl" style="display:flex;flex-direction:column;gap:var(--space-2);max-height:10rem;overflow:auto;"></div>
      </section>
    </aside>

    <main class="workspace">
      <div class="tabs">
        <button class="btn tab-active" id="previewTabBtn" onclick="switchTab('preview')">Preview</button>
        <button class="btn" id="sourceTabBtn" onclick="switchTab('source')">Source</button>
        <button class="btn" id="communityTabBtn" onclick="switchTab('community')">Community</button>
      </div>

      <div id="previewTabCtn">
        <div class="preview-frame">
          <div id="loadingOverlayEl" hidden style="position:absolute;inset:0;display:grid;place-items:center;background:rgba(18,19,22,0.85);z-index:10;border-radius:inherit;">
            <span style="font-size:var(--text-xl);color:var(--color-text);">⏳ Generating...</span>
          </div>
          <iframe id="previewIframeEl" style="width:100%;height:38rem;border:none;"></iframe>
        </div>
        <div style="display:flex;gap:var(--space-3);margin-top:var(--space-4);">
          <button class="btn btn--primary" onclick="exportHtml()">Export HTML</button>
          <button class="btn" id="stopBtnEl" hidden onclick="if(window.currentGen) window.currentGen.stop()">Stop Generation</button>
        </div>
      </div>

      <div id="sourceTabCtn" hidden>
        <div class="preview-frame" style="height:38rem;overflow:auto;">
          <pre id="sourceCodeEl" style="margin:0;padding:var(--space-4);white-space:pre-wrap;word-break:break-all;font-size:var(--text-sm);font-family:monospace;color:var(--color-text-muted);"></pre>
        </div>
      </div>

      <div id="communityTabCtn" hidden>
        <div class="preview-frame" style="height:38rem;">
          <div id="commentsFrameEl" style="width:100%;height:100%;"></div>
        </div>
      </div>
    </main>
  </div>

  <script>
    // Safe storage wrapper: uses kv plugin if available, otherwise localStorage
    let store = {
      async getHistory() {
        if(typeof kv !== 'undefined') {
          return (await kv.htmlGen.get('history')) || [];
        }
        try { return JSON.parse(localStorage.htmlGenHistory || '[]'); } catch(e) { return []; }
      },
      async setHistory(arr) {
        if(typeof kv !== 'undefined') {
          await kv.htmlGen.set('history', arr);
        } else {
          localStorage.htmlGenHistory = JSON.stringify(arr);
        }
      },
      async clearHistory() {
        if(typeof kv !== 'undefined') {
          await kv.htmlGen.delete('history');
        } else {
          delete localStorage.htmlGenHistory;
        }
      }
    };

    function switchTab(name) {
      previewTabCtn.hidden = name !== 'preview';
      sourceTabCtn.hidden = name !== 'source';
      communityTabCtn.hidden = name !== 'community';
      previewTabBtn.classList.toggle('tab-active', name === 'preview');
      sourceTabBtn.classList.toggle('tab-active', name === 'source');
      communityTabBtn.classList.toggle('tab-active', name === 'community');
    }

    themeToggleBtn.onclick = () => {
      let cur = document.documentElement.getAttribute('data-theme');
      document.documentElement.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
    };

    function exportHtml() {
      let html = previewIframeEl.srcdoc;
      if(!html) return;
      let a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([html], {type:'text/html'}));
      a.download = 'generated.html';
      a.click();
    }

    async function loadHistory() {
      let arr = await store.getHistory();
      historyListEl.innerHTML = '';
      if(!arr.length) {
        historyListEl.innerHTML = '<p style="color:var(--color-text-muted);font-size:var(--text-sm);">No generations yet.</p>';
        return;
      }
      for(let item of arr) {
        let btn = document.createElement('button');
        btn.className = 'btn';
        btn.style.cssText = 'text-align:left;font-size:var(--text-sm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;';
        btn.title = item.prompt;
        let t = item.time ? new Date(item.time).toLocaleTimeString() : '';
        btn.textContent = (t ? t + ' — ' : '') + item.preset + ' / ' + item.theme + ' — ' + item.prompt.slice(0, 32);
        btn.onclick = () => {
          previewIframeEl.srcdoc = item.html;
          sourceCodeEl.textContent = item.html;
          promptInputEl.value = item.prompt;
          presetSelectEl.value = item.preset;
          themeSelectEl.value = item.theme;
          switchTab('preview');
        };
        historyListEl.appendChild(btn);
      }
    }

    async function clearHistory() {
      await store.clearHistory();
      await loadHistory();
    }

    generatorFormEl.onsubmit = async (e) => {
      e.preventDefault();
      let prompt = promptInputEl.value.trim();
      let preset = presetSelectEl.value;
      let theme = themeSelectEl.value;
      if(!prompt) return;
      if(typeof generateText !== 'function') {
        alert('The generateText plugin is not available.');
        return;
      }

      generateBtnEl.disabled = true;
      generateBtnEl.textContent = '⏳ Generating...';
      stopBtnEl.hidden = false;
      loadingOverlayEl.hidden = false;
      sourceCodeEl.textContent = '';

      let instruction = `You are an expert HTML/CSS/JS developer. Generate a complete, self-contained HTML document (with embedded CSS and optional vanilla JS) based on the following request. Do not use external stylesheets; include all styles in a <style> tag. Do not use external scripts unless absolutely necessary (use inline JS if needed). The design should be modern, responsive, and visually polished.\n\nUser request: ${prompt}\nPreset style: ${preset}\nTheme/concept: ${theme}\n\nReturn ONLY the raw HTML document. Start with <!DOCTYPE html>. Do not wrap the output in markdown code blocks.`;

      let p = generateText({instruction});
      window.currentGen = p;

      try {
        let html = await p;
        previewIframeEl.srcdoc = html;
        sourceCodeEl.textContent = html;

        let arr = await store.getHistory();
        arr.unshift({prompt, preset, theme, html, time: Date.now()});
        if(arr.length > 30) arr = arr.slice(0, 30);
        await store.setHistory(arr);
        await loadHistory();
      } catch(err) {
        sourceCodeEl.textContent = 'Generation was stopped or failed: ' + err;
      } finally {
        generateBtnEl.disabled = false;
        generateBtnEl.textContent = 'Generate HTML';
        stopBtnEl.hidden = true;
        loadingOverlayEl.hidden = true;
      }
    };

    // Load comments plugin if present, otherwise show a friendly message
    if(typeof commentsPlugin === 'function') {
      commentsFrameEl.innerHTML = commentsPlugin({channel:"ai-html-generator", width:"100%", height:"100%"});
    } else {
      commentsFrameEl.innerHTML = '<p style="color:var(--color-text-muted);padding:2rem;text-align:center;">Community comments plugin is not available.</p>';
    }

    switchTab('preview');
    loadHistory();
  </script>
</body>
</html>
</body>
</html>
