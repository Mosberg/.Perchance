<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>ai-notepad — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<div id="appCtn" style="display:grid; grid-template-rows:auto auto 1fr auto; height:100vh; font-family:monospace;">
  <!-- Menu Bar -->
  <div id="menuBarEl" style="background:#2d2d30; color:#ccc; padding:5px 10px; display:flex; gap:15px; align-items:center;">
    <span style="font-weight:bold;">AI Notepad++</span>
    <div style="display:flex; gap:10px;">
      <button onclick="toggleMenu('fileDropdown')" class="menu-btn" style="background:transparent; border:none; color:#ccc; cursor:pointer;">File</button>
      <button onclick="toggleMenu('editDropdown')" class="menu-btn" style="background:transparent; border:none; color:#ccc; cursor:pointer;">Edit</button>
      <button onclick="toggleMenu('viewDropdown')" class="menu-btn" style="background:transparent; border:none; color:#ccc; cursor:pointer;">View</button>
      <button onclick="toggleMenu('pluginsDropdown')" class="menu-btn" style="background:transparent; border:none; color:#ccc; cursor:pointer;">Plugins</button>
      <button onclick="toggleMenu('aiDropdown')" class="menu-btn" style="background:transparent; border:none; color:#ccc; cursor:pointer;">AI</button>
      <button onclick="toggleMenu('settingsDropdown')" class="menu-btn" style="background:transparent; border:none; color:#ccc; cursor:pointer;">Settings</button>
    </div>
  </div>

  <!-- Dropdown Menus -->
  <div id="fileDropdown" class="dropdown" style="display:none; position:absolute; background:#2d2d30; border:1px solid #3c3c3c; padding:5px 0; z-index:100;">
    <button onclick="newFile()" style="display:block; width:100%; background:transparent; border:none; color:#ccc; padding:5px 15px; text-align:left; cursor:pointer;">New</button>
    <button onclick="openFile()" style="display:block; width:100%; background:transparent; border:none; color:#ccc; padding:5px 15px; text-align:left; cursor:pointer;">Open</button>
    <button onclick="saveFile()" style="display:block; width:100%; background:transparent; border:none; color:#ccc; padding:5px 15px; text-align:left; cursor:pointer;">Save</button>
    <button onclick="saveFileAs()" style="display:block; width:100%; background:transparent; border:none; color:#ccc; padding:5px 15px; text-align:left; cursor:pointer;">Save As</button>
    <div style="height:1px; background:#3c3c3c; margin:5px 0;"></div>
    <button onclick="printFile()" style="display:block; width:100%; background:transparent; border:none; color:#ccc; padding:5px 15px; text-align:left; cursor:pointer;">Print</button>
  </div>
  
  <div id="editDropdown" class="dropdown" style="display:none; position:absolute; background:#2d2d30; border:1px solid #3c3c3c; padding:5px 0; z-index:100;">
    <button onclick="undoAction()" style="display:block; width:100%; background:transparent; border:none; color:#ccc; padding:5px 15px; text-align:left; cursor:pointer;">Undo</button>
    <button onclick="redoAction()" style="display:block; width:100%; background:transparent; border:none; color:#ccc; padding:5px 15px; text-align:left; cursor:pointer;">Redo</button>
    <div style="height:1px; background:#3c3c3c; margin:5px 0;"></div>
    <button onclick="cutText()" style="display:block; width:100%; background:transparent; border:none; color:#ccc; padding:5px 15px; text-align:left; cursor:pointer;">Cut</button>
    <button onclick="copyText()" style="display:block; width:100%; background:transparent; border:none; color:#ccc; padding:5px 15px; text-align:left; cursor:pointer;">Copy</button>
    <button onclick="pasteText()" style="display:block; width:100%; background:transparent; border:none; color:#ccc; padding:5px 15px; text-align:left; cursor:pointer;">Paste</button>
    <div style="height:1px; background:#3c3c3c; margin:5px 0;"></div>
    <button onclick="showFindReplace()" style="display:block; width:100%; background:transparent; border:none; color:#ccc; padding:5px 15px; text-align:left; cursor:pointer;">Find/Replace</button>
  </div>
  
  <div id="viewDropdown" class="dropdown" style="display:none; position:absolute; background:#2d2d30; border:1px solid #3c3c3c; padding:5px 0; z-index:100;">
    <button onclick="toggleLineNumbers()" style="display:block; width:100%; background:transparent; border:none; color:#ccc; padding:5px 15px; text-align:left; cursor:pointer;">Toggle Line Numbers</button>
    <button onclick="toggleWordWrap()" style="display:block; width:100%; background:transparent; border:none; color:#ccc; padding:5px 15px; text-align:left; cursor:pointer;">Toggle Word Wrap</button>
    <div style="height:1px; background:#3c3c3c; margin:5px 0;"></div>
    <button onclick="zoomIn()" style="display:block; width:100%; background:transparent; border:none; color:#ccc; padding:5px 15px; text-align:left; cursor:pointer;">Zoom In</button>
    <button onclick="zoomOut()" style="display:block; width:100%; background:transparent; border:none; color:#ccc; padding:5px 15px; text-align:left; cursor:pointer;">Zoom Out</button>
    <button onclick="zoomReset()" style="display:block; width:100%; background:transparent; border:none; color:#ccc; padding:5px 15px; text-align:left; cursor:pointer;">Reset Zoom</button>
  </div>

  <!-- Tab Bar -->
  <div id="tabBarEl" style="background:#1e1e1e; display:flex; gap:2px; padding:2px;">
    <button id="tab1Btn" class="tabBtn" onclick="switchTab(1)" style="background:#3c3c3c; color:white; border:none; padding:5px 15px; cursor:pointer;">new 1</button>
    <button onclick="addNewTab()" style="background:transparent; border:none; color:#ccc; cursor:pointer;">+</button>
  </div>

  <!-- Find/Replace Bar -->
  <div id="findReplaceBar" style="display:none; background:#3c3c3c; padding:5px; border-bottom:1px solid #2d2d30; gap:5px; align-items:center;">
    <input id="findInput" type="text" placeholder="Find" style="background:#1e1e1e; color:#d4d4d4; border:1px solid #555; padding:3px 5px; margin-right:5px;">
    <input id="replaceInput" type="text" placeholder="Replace" style="background:#1e1e1e; color:#d4d4d4; border:1px solid #555; padding:3px 5px; margin-right:5px;">
    <button onclick="findNext()" style="background:#007acc; color:white; border:none; padding:3px 8px; cursor:pointer; margin-right:5px;">Next</button>
    <button onclick="replace()" style="background:#0e639c; color:white; border:none; padding:3px 8px; cursor:pointer; margin-right:5px;">Replace</button>
    <button onclick="replaceAll()" style="background:#0e639c; color:white; border:none; padding:3px 8px; cursor:pointer; margin-right:5px;">All</button>
    <button onclick="closeFindReplace()" style="background:transparent; border:none; color:#ccc; cursor:pointer;">✕</button>
  </div>

  <!-- Main Content Area -->
  <div style="display:grid; grid-template-columns:1fr 300px; background:#252526;">
    <!-- Editor Area -->
    <div style="display:flex; flex-direction:column;">
      <div style="display:flex; gap:5px; padding:5px; background:#2d2d30; align-items:center;">
        <button onclick="saveFile()" title="Save">💾</button>
        <button onclick="openFile()" title="Open">📁</button>
        <button onclick="undoAction()" title="Undo">↶</button>
        <button onclick="redoAction()" title="Redo">↷</button>
        <select id="langSelectEl" onchange="changeLanguage()" style="background:#1e1e1e; color:white; border:1px solid #3c3c3c; padding:3px;">
          <option value="text">Plain Text</option>
          <option value="javascript">JavaScript</option>
          <option value="python">Python</option>
          <option value="html">HTML</option>
          <option value="css">CSS</option>
          <option value="json">JSON</option>
          <option value="xml">XML</option>
          <option value="java">Java</option>
          <option value="cpp">C++</option>
          <option value="csharp">C#</option>
          <option value="php">PHP</option>
          <option value="sql">SQL</option>
        </select>
        <button onclick="toggleLineNumbers()" title="Toggle Line Numbers">🔢</button>
        <button onclick="toggleWordWrap()" title="Toggle Word Wrap">↔️</button>
        <button onclick="runCode()" title="Run Code" style="margin-left:auto;">▶️</button>
      </div>
      
      <div style="display:flex; flex-grow:1; overflow:auto;">
        <div id="lineNumbersEl" style="background:#1e1e1e; color:#858585; padding:5px 10px; text-align:right; user-select:none; min-width:40px; overflow:hidden;">1</div>
        <textarea id="editorEl" style="flex-grow:1; background:#1e1e1e; color:#d4d4d4; border:none; padding:5px; resize:none; white-space:pre; overflow-wrap:normal;" oninput="updateContent()" onscroll="syncScroll()"></textarea>
      </div>
    </div>

    <!-- Plugin Panel -->
    <div id="pluginPanelEl" style="background:#1e1e1e; border-left:1px solid #3c3c3c; display:flex; flex-direction:column;">
      <div style="background:#2d2d30; color:#ccc; padding:5px; display:flex; justify-content:space-between;">
        <span>Plugins</span>
        <button onclick="togglePluginPanel()" style="background:transparent; border:none; color:#ccc; cursor:pointer;">✕</button>
      </div>
      <div id="pluginContentEl" style="padding:10px; overflow:auto;">
        <div style="margin-bottom:15px;">
          <h4 style="margin:0 0 5px;">AI Assistant</h4>
          <button onclick="aiCompleteCode()" style="background:#007acc; color:white; border:none; padding:5px 10px; cursor:pointer; margin-bottom:5px;">Complete Code</button>
          <button onclick="aiExplainCode()" style="background:#007acc; color:white; border:none; padding:5px 10px; cursor:pointer; margin-bottom:5px;">Explain Code</button>
          <button onclick="aiRefactorCode()" style="background:#007acc; color:white; border:none; padding:5px 10px; cursor:pointer; margin-bottom:5px;">Refactor Code</button>
          <button onclick="aiFixBugs()" style="background:#007acc; color:white; border:none; padding:5px 10px; cursor:pointer; margin-bottom:5px;">Fix Bugs</button>
          <button onclick="aiGenerateDocs()" style="background:#007acc; color:white; border:none; padding:5px 10px; cursor:pointer; margin-bottom:10px;">Generate Docs</button>
          <div id="aiResponseEl" style="background:#2d2d30; padding:8px; border-radius:3px; min-height:100px; white-space:pre-wrap; font-size:12px;"></div>
        </div>
        
        <div style="margin-bottom:15px;">
          <h4 style="margin:0 0 5px;">Tools</h4>
          <button onclick="formatJSON()" style="background:#0e639c; color:white; border:none; padding:5px 10px; cursor:pointer; margin-bottom:5px;">Format JSON</button>
          <button onclick="minifyJS()" style="background:#0e639c; color:white; border:none; padding:5px 10px; cursor:pointer; margin-bottom:5px;">Minify JS</button>
          <button onclick="minifyCSS()" style="background:#0e639c; color:white; border:none; padding:5px 10px; cursor:pointer; margin-bottom:5px;">Minify CSS</button>
          <button onclick="beautifyHTML()" style="background:#0e639c; color:white; border:none; padding:5px 10px; cursor:pointer; margin-bottom:5px;">Beautify HTML</button>
          <button onclick="encodeBase64()" style="background:#0e639c; color:white; border:none; padding:5px 10px; cursor:pointer; margin-bottom:5px;">Base64 Encode</button>
          <button onclick="decodeBase64()" style="background:#0e639c; color:white; border:none; padding:5px 10px; cursor:pointer; margin-bottom:10px;">Base64 Decode</button>
        </div>
        
        <div>
          <h4 style="margin:0 0 5px;">To-Do List</h4>
          <input id="todoInputEl" type="text" placeholder="New task..." style="width:100%; background:#2d2d30; color:white; border:1px solid #3c3c3c; padding:5px; margin-bottom:5px;">
          <button onclick="addTodo()" style="background:#007acc; color:white; border:none; padding:5px 10px; cursor:pointer; margin-bottom:10px;">Add</button>
          <div id="todoListEl" style="max-height:200px; overflow-y:auto;"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Status Bar -->
  <div id="statusBarEl" style="background:#007acc; color:white; padding:3px 10px; display:flex; justify-content:space-between; font-size:12px;">
    <div>
      <span id="cursorPosEl">Ln 1, Col 1</span>
      <span style="margin-left:15px;">Language: <span id="currentLangEl">text</span></span>
    </div>
    <div>
      <span id="fileStatusEl">Unsaved</span>
      <span style="margin-left:15px;">Characters: <span id="charCountEl">0</span></span>
    </div>
  </div>
</div>

<!-- Context Menu (hidden by default) -->
<div id="contextMenuEl" style="position:absolute; background:#2d2d30; border:1px solid #3c3c3c; padding:5px 0; display:none; z-index:1000;">
  <button onclick="cutText()" style="display:block; width:100%; background:transparent; border:none; color:#ccc; padding:5px 15px; text-align:left; cursor:pointer;">Cut</button>
  <button onclick="copyText()" style="display:block; width:100%; background:transparent; border:none; color:#ccc; padding:5px 15px; text-align:left; cursor:pointer;">Copy</button>
  <button onclick="pasteText()" style="display:block; width:100%; background:transparent; border:none; color:#ccc; padding:5px 15px; text-align:left; cursor:pointer;">Paste</button>
  <div style="height:1px; background:#3c3c3c; margin:5px 0;"></div>
  <button onclick="aiCompleteCodeAtCursor()" style="display:block; width:100%; background:transparent; border:none; color:#ccc; padding:5px 15px; text-align:left; cursor:pointer;">AI Complete</button>
</div>

<!-- Settings Modal (hidden by default) -->
<div id="settingsModalEl" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); display:none; justify-content:center; align-items:center; z-index:2000;">
  <div style="background:#252526; color:#ccc; width:500px; padding:20px; border-radius:5px;">
    <h3 style="margin-top:0;">Settings</h3>
    <div style="margin-bottom:15px;">
      <label>Theme:</label>
      <select id="themeSelectEl" style="background:#1e1e1e; color:white; border:1px solid #3c3c3c; padding:5px; margin-left:10px;">
        <option value="dark">Dark</option>
        <option value="light">Light</option>
        <option value="blue">Blue</option>
      </select>
    </div>
    <div style="margin-bottom:15px;">
      <label>Font Size:</label>
      <input id="fontSizeInputEl" type="number" min="8" max="24" value="14" style="background:#1e1e1e; color:white; border:1px solid #3c3c3c; padding:5px; margin-left:10px; width:50px;">
    </div>
    <div style="margin-bottom:15px;">
      <label>Tab Size:</label>
      <input id="tabSizeInputEl" type="number" min="2" max="8" value="2" style="background:#1e1e1e; color:white; border:1px solid #3c3c3c; padding:5px; margin-left:10px; width:50px;">
    </div>
    <div style="margin-bottom:15px;">
      <label>Auto Save:</label>
      <input id="autoSaveCheckEl" type="checkbox" style="margin-left:10px;">
    </div>
    <div style="margin-bottom:15px;">
      <label>Auto Save Interval (seconds):</label>
      <input id="autoSaveIntervalEl" type="number" min="5" max="300" value="30" style="background:#1e1e1e; color:white; border:1px solid #3c3c3c; padding:5px; margin-left:10px; width:50px;">
    </div>
    <div style="display:flex; justify-content:flex-end;">
      <button onclick="saveSettings()" style="background:#007acc; color:white; border:none; padding:8px 15px; cursor:pointer; margin-right:10px;">Save</button>
      <button onclick="closeSettings()" style="background:#666; color:white; border:none; padding:8px 15px; cursor:pointer;">Cancel</button>
    </div>
  </div>
</div>

<!-- Console Output (hidden by default) -->
<div id="consoleEl" style="position:fixed; bottom:20px; right:20px; width:400px; height:200px; background:#1e1e1e; border:1px solid #3c3c3c; color:#d4d4d4; padding:10px; overflow:auto; display:none; z-index:1500;">
  <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
    <span>Console Output</span>
    <button onclick="closeConsole()" style="background:transparent; border:none; color:#ccc; cursor:pointer;">✕</button>
  </div>
  <div id="consoleOutputEl" style="font-family:monospace; font-size:12px; white-space:pre-wrap;"></div>
</div>

<script type="module">
  // State management
  let currentTab = 1;
  let tabs = {
    1: { content: '', language: 'text', saved: false, name: 'new 1' }
  };
  let lineNumbers = true;
  let wordWrap = false;
  let history = { undo: [], redo: [] };
  let todos = [];
  let currentFontSize = 14;
  let autoSaveInterval = null;
  
  // Initialize
  window.onload = () => {
    loadSettings();
    updateContent();
    loadTodos();
    setupContextMenu();
    setupKeyboardShortcuts();
    setupAutoSave();
  };
  
  // Tab management
  function switchTab(tabId) {
    // Save current tab state
    tabs[currentTab].content = editorEl.value;
    
    // Switch to new tab
    currentTab = tabId;
    editorEl.value = tabs[tabId].content;
    langSelectEl.value = tabs[tabId].language;
    updateContent();
    updateTabButtons();
  }
  
  function addNewTab() {
    const newId = Math.max(...Object.keys(tabs).map(Number)) + 1;
    tabs[newId] = { content: '', language: 'text', saved: false, name: `new ${newId}` };
    
    // Add tab button
    const tabBtn = document.createElement('button');
    tabBtn.id = `tab${newId}Btn`;
    tabBtn.className = 'tabBtn';
    tabBtn.textContent = `new ${newId}`;
    tabBtn.onclick = () => switchTab(newId);
    tabBtn.style.cssText = 'background:#3c3c3c; color:white; border:none; padding:5px 15px; cursor:pointer;';
    
    tabBarEl.insertBefore(tabBtn, tabBarEl.lastElementChild);
    switchTab(newId);
  }
  
  function updateTabButtons() {
    document.querySelectorAll('.tabBtn').forEach(btn => {
      const tabId = parseInt(btn.id.replace('tab', '').replace('Btn', ''));
      btn.style.background = tabId === currentTab ? '#3c3c3c' : '#2d2d30';
    });
  }
  
  // Editor functions
  function updateContent() {
    // Update line numbers
    if (lineNumbers) {
      const lines = editorEl.value.split('\n').length;
      let lineNumbersHtml = '';
      for (let i = 1; i <= lines; i++) {
        lineNumbersHtml += i + '\n';
      }
      lineNumbersEl.textContent = lineNumbersHtml;
      lineNumbersEl.style.display = 'block';
    } else {
      lineNumbersEl.style.display = 'none';
    }
    
    // Update status bar
    const cursorPos = editorEl.selectionStart;
    const lines = editorEl.value.substring(0, cursorPos).split('\n');
    const line = lines.length;
    const col = lines[lines.length - 1].length + 1;
    cursorPosEl.textContent = `Ln ${line}, Col ${col}`;
    
    // Update character count
    charCountEl.textContent = editorEl.value.length;
    
    // Update language
    currentLangEl.textContent = langSelectEl.value;
    
    // Update save status
    fileStatusEl.textContent = tabs[currentTab].saved ? 'Saved' : 'Unsaved';
  }
  
  function syncScroll() {
    lineNumbersEl.scrollTop = editorEl.scrollTop;
  }
  
  function toggleLineNumbers() {
    lineNumbers = !lineNumbers;
    updateContent();
  }
  
  function toggleWordWrap() {
    wordWrap = !wordWrap;
    editorEl.style.whiteSpace = wordWrap ? 'pre-wrap' : 'pre';
    editorEl.style.overflowWrap = wordWrap ? 'break-word' : 'normal';
  }
  
  function changeLanguage() {
    tabs[currentTab].language = langSelectEl.value;
    updateContent();
  }
  
  // History management
  function addToHistory() {
    history.undo.push(editorEl.value);
    history.redo = [];
    if (history.undo.length > 50) history.undo.shift();
  }
  
  function undoAction() {
    if (history.undo.length > 1) {
      history.redo.push(history.undo.pop());
      editorEl.value = history.undo[history.undo.length - 1];
      updateContent();
    }
  }
  
  function redoAction() {
    if (history.redo.length > 0) {
      const nextState = history.redo.pop();
      history.undo.push(nextState);
      editorEl.value = nextState;
      updateContent();
    }
  }
  
  // File operations
  function newFile() {
    addNewTab();
    closeAllMenus();
  }
  
  function openFile() {
    const filename = prompt('Enter filename to load:');
    if (filename) {
      const content = localStorage.getItem('notepad_file_' + filename);
      if (content) {
        editorEl.value = content;
        tabs[currentTab].content = content;
        tabs[currentTab].name = filename;
        tabs[currentTab].saved = true;
        updateContent();
      } else {
        alert('File not found');
      }
    }
    closeAllMenus();
  }
  
  function saveFile() {
    const filename = tabs[currentTab].name.startsWith('new ') ? prompt('Enter filename:', tabs[currentTab].name) : tabs[currentTab].name;
    if (filename) {
      tabs[currentTab].name = filename;
      tabs[currentTab].saved = true;
      localStorage.setItem('notepad_file_' + filename, editorEl.value);
      updateContent();
    }
    closeAllMenus();
  }
  
  function saveFileAs() {
    const filename = prompt('Enter filename:', tabs[currentTab].name);
    if (filename) {
      tabs[currentTab].name = filename;
      tabs[currentTab].saved = true;
      localStorage.setItem('notepad_file_' + filename, editorEl.value);
      updateContent();
    }
    closeAllMenus();
  }
  
  function printFile() {
    window.print();
    closeAllMenus();
  }
  
  // Find and Replace
  function showFindReplace() {
    findReplaceBar.style.display = 'flex';
    findInput.focus();
    closeAllMenus();
  }
  
  function closeFindReplace() {
    findReplaceBar.style.display = 'none';
  }
  
  function findNext() {
    const searchTerm = findInput.value;
    if (!searchTerm) return;
    
    const text = editorEl.value;
    const index = text.indexOf(searchTerm, editorEl.selectionEnd);
    
    if (index !== -1) {
      editorEl.selectionStart = index;
      editorEl.selectionEnd = index + searchTerm.length;
      editorEl.focus();
    } else {
      // Wrap around
      const firstIndex = text.indexOf(searchTerm);
      if (firstIndex !== -1) {
        editorEl.selectionStart = firstIndex;
        editorEl.selectionEnd = firstIndex + searchTerm.length;
        editorEl.focus();
      }
    }
  }
  
  function replace() {
    const searchTerm = findInput.value;
    const replaceTerm = replaceInput.value;
    
    if (searchTerm && 
        editorEl.value.substring(editorEl.selectionStart, editorEl.selectionEnd) === searchTerm) {
      editorEl.value = editorEl.value.substring(0, editorEl.selectionStart) + 
                       replaceTerm + 
                       editorEl.value.substring(editorEl.selectionEnd);
      updateContent();
      findNext();
    }
  }
  
  function replaceAll() {
    const searchTerm = findInput.value;
    const replaceTerm = replaceInput.value;
    
    if (searchTerm) {
      editorEl.value = editorEl.value.split(searchTerm).join(replaceTerm);
      updateContent();
    }
  }
  
  // Zoom functions
  function zoomIn() {
    if (currentFontSize < 24) {
      currentFontSize += 2;
      applyFontSize();
    }
    closeAllMenus();
  }
  
  function zoomOut() {
    if (currentFontSize > 8) {
      currentFontSize -= 2;
      applyFontSize();
    }
    closeAllMenus();
  }
  
  function zoomReset() {
    currentFontSize = 14;
    applyFontSize();
    closeAllMenus();
  }
  
  function applyFontSize() {
    editorEl.style.fontSize = currentFontSize + 'px';
    lineNumbersEl.style.fontSize = currentFontSize + 'px';
  }
  
  // Run code (for JavaScript)
  function runCode() {
    if (langSelectEl.value !== 'javascript') {
      alert('Code execution only supported for JavaScript');
      return;
    }
    
    consoleEl.style.display = 'block';
    consoleOutputEl.textContent = '';
    
    try {
      // Capture console.log output
      const originalLog = console.log;
      console.log = (...args) => {
        consoleOutputEl.textContent += args.join(' ') + '\n';
        originalLog.apply(console, args);
      };
      
      // Execute the code
      eval(editorEl.value);
      
      // Restore console.log
      console.log = originalLog;
    } catch (error) {
      consoleOutputEl.textContent = 'Error: ' + error.message;
    }
  }
  
  function closeConsole() {
    consoleEl.style.display = 'none';
  }
  
  // AI Functions
  async function aiCompleteCode() {
    showAILoading();
    try {
      const prompt = `Complete the following ${langSelectEl.value} code:\n\n${editorEl.value}`;
      const completion = await root.generateText(prompt);
      aiResponseEl.textContent = completion;
    } catch (error) {
      aiResponseEl.textContent = 'Error: ' + error.message;
    }
  }
  
  async function aiExplainCode() {
    showAILoading();
    try {
      const prompt = `Explain what this ${langSelectEl.value} code does:\n\n${editorEl.value}`;
      const explanation = await root.generateText(prompt);
      aiResponseEl.textContent = explanation;
    } catch (error) {
      aiResponseEl.textContent = 'Error: ' + error.message;
    }
  }
  
  async function aiRefactorCode() {
    showAILoading();
    try {
      const prompt = `Refactor and optimize this ${langSelectEl.value} code to improve readability and performance:\n\n${editorEl.value}`;
      const refactored = await root.generateText(prompt);
      aiResponseEl.textContent = refactored;
    } catch (error) {
      aiResponseEl.textContent = 'Error: ' + error.message;
    }
  }
  
  async function aiFixBugs() {
    showAILoading();
    try {
      const prompt = `Identify and fix bugs in this ${langSelectEl.value} code:\n\n${editorEl.value}`;
      const fixed = await root.generateText(prompt);
      aiResponseEl.textContent = fixed;
    } catch (error) {
      aiResponseEl.textContent = 'Error: ' + error.message;
    }
  }
  
  async function aiGenerateDocs() {
    showAILoading();
    try {
      const prompt = `Generate documentation for this ${langSelectEl.value} code:\n\n${editorEl.value}`;
      const docs = await root.generateText(prompt);
      aiResponseEl.textContent = docs;
    } catch (error) {
      aiResponseEl.textContent = 'Error: ' + error.message;
    }
  }
  
  async function aiCompleteCodeAtCursor() {
    const cursorPos = editorEl.selectionStart;
    const beforeCursor = editorEl.value.substring(0, cursorPos);
    const afterCursor = editorEl.value.substring(cursorPos);
    
    showAILoading();
    try {
      const prompt = `Complete the following ${langSelectEl.value} code at the cursor position:\n\n${beforeCursor}[CURSOR]${afterCursor}`;
      const completion = await root.generateText(prompt);
      
      // Extract completion between [CURSOR] and the end
      const cursorPosInCompletion = completion.indexOf('[CURSOR]');
      if (cursorPosInCompletion !== -1) {
        const completedCode = completion.substring(cursorPosInCompletion + 8);
        editorEl.value = beforeCursor + completedCode + afterCursor;
        updateContent();
      } else {
        aiResponseEl.textContent = completion;
      }
    } catch (error) {
      aiResponseEl.textContent = 'Error: ' + error.message;
    }
  }
  
  function showAILoading() {
    aiResponseEl.textContent = 'Generating...';
  }
  
  // Tool functions
  function formatJSON() {
    try {
      const parsed = JSON.parse(editorEl.value);
      editorEl.value = JSON.stringify(parsed, null, 2);
      updateContent();
    } catch (e) {
      alert('Invalid JSON');
    }
  }
  
  function minifyJS() {
    try {
      // Simple minification (not perfect but works for demo)
      const minified = editorEl.value
        .replace(/\/\*[\s\S]*?\*\//g, '') // Remove comments
        .replace(/\s+/g, ' ') // Collapse whitespace
        .replace(/;\s*/g, ';') // Remove space after semicolons
        .replace(/\{\s*/g, '{') // Remove space before {
        .replace(/\s*\}/g, '}') // Remove space after }
        .replace(/\(\s*/g, '(') // Remove space after (
        .replace(/\s*\)/g, ')') // Remove space before )
        .trim();
      editorEl.value = minified;
      updateContent();
    } catch (e) {
      alert('Error minifying code');
    }
  }
  
  function minifyCSS() {
    try {
      const minified = editorEl.value
        .replace(/\/\*[\s\S]*?\*\//g, '') // Remove comments
        .replace(/\s+/g, ' ') // Collapse whitespace
        .replace(/\{\s*/g, '{') // Remove space before {
        .replace(/\s*\}/g, '}') // Remove space after }
        .replace(/;\s*/g, ';') // Remove space after semicolons
        .replace(/:\s*/g, ':') // Remove space after colons
        .replace(/,\s*/g, ',') // Remove space after commas
        .trim();
      editorEl.value = minified;
      updateContent();
    } catch (e) {
      alert('Error minifying CSS');
    }
  }
  
  function beautifyHTML() {
    try {
      // Simple HTML beautification
      let formatted = '';
      const reg = /(>)(<)(\/*)/g;
      editorEl.value = editorEl.value.replace(reg, '$1\r\n$2$3');
      
      let pad = 0;
      editorEl.value.split('\r\n').forEach((node) => {
        let indent = 0;
        if (node.match(/.+<\/\w[^>]*>$/)) {
          indent = 0;
        } else if (node.match(/^<\/\w/)) {
          if (pad !== 0) {
            pad -= 1;
          }
        } else if (node.match(/^<\w[^>]*[^\/]>.*$/)) {
          indent = 1;
        } else {
          indent = 0;
        }
        
        const padding = ''.repeat(pad);
        formatted += padding + node + '\r\n';
        pad += indent;
      });
      
      editorEl.value = formatted;
      updateContent();
    } catch (e) {
      alert('Error beautifying HTML');
    }
  }
  
  function encodeBase64() {
    editorEl.value = btoa(unescape(encodeURIComponent(editorEl.value)));
    updateContent();
  }
  
  function decodeBase64() {
    try {
      editorEl.value = decodeURIComponent(escape(atob(editorEl.value)));
      updateContent();
    } catch (e) {
      alert('Error decoding Base64');
    }
  }
  
  // Todo list
  function addTodo() {
    const task = todoInputEl.value.trim();
    if (task) {
      todos.push({ task, completed: false });
      todoInputEl.value = '';
      renderTodos();
      saveTodos();
    }
  }
  
  function toggleTodo(index) {
    todos[index].completed = !todos[index].completed;
    renderTodos();
    saveTodos();
  }
  
  function deleteTodo(index) {
    todos.splice(index, 1);
    renderTodos();
    saveTodos();
  }
  
  function renderTodos() {
    todoListEl.innerHTML = todos.map((todo, index) => `
      <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
        <div>
          <input type="checkbox" ${todo.completed ? 'checked' : ''} onchange="toggleTodo(${index})">
          <span style="${todo.completed ? 'text-decoration:line-through; color:gray;' : ''}">${todo.task}</span>
        </div>
        <button onclick="deleteTodo(${index})" style="background:transparent; border:none; color:#ccc; cursor:pointer;">✕</button>
      </div>
    `).join('');
  }
  
  function saveTodos() {
    localStorage.setItem('notepad_todos', JSON.stringify(todos));
  }
  
  function loadTodos() {
    const saved = localStorage.getItem('notepad_todos');
    if (saved) {
      todos = JSON.parse(saved);
      renderTodos();
    }
  }
  
  // Plugin panel
  function togglePluginPanel() {
    pluginPanelEl.style.display = pluginPanelEl.style.display === 'none' ? 'flex' : 'none';
  }
  
  // Menu system
  function toggleMenu(menuId) {
    // Close all other menus first
    document.querySelectorAll('.dropdown').forEach(menu => {
      if (menu.id !== menuId) {
        menu.style.display = 'none';
      }
    });
    
    // Toggle current menu
    const menu = document.getElementById(menuId);
    if (menu) {
      menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
    }
  }
  
  function closeAllMenus() {
    document.querySelectorAll('.dropdown').forEach(menu => {
      menu.style.display = 'none';
    });
  }
  
  // Context menu
  function setupContextMenu() {
    editorEl.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      contextMenuEl.style.display = 'block';
      contextMenuEl.style.left = `${e.pageX}px`;
      contextMenuEl.style.top = `${e.pageY}px`;
    });
    
    document.addEventListener('click', () => {
      contextMenuEl.style.display = 'none';
      closeAllMenus();
    });
  }
  
  function cutText() {
    document.execCommand('cut');
  }
  
  function copyText() {
    document.execCommand('copy');
  }
  
  function pasteText() {
    document.execCommand('paste');
  }
  
  // Keyboard shortcuts
  function setupKeyboardShortcuts() {
    document.addEventListener('keydown', (e) => {
      // Ctrl+F: Find
      if (e.ctrlKey && e.key === 'f') {
        e.preventDefault();
        showFindReplace();
      }
      
      // Ctrl+S: Save
      if (e.ctrlKey && e.key === 's') {
        e.preventDefault();
        saveFile();
      }
      
      // Ctrl+O: Open
      if (e.ctrlKey && e.key === 'o') {
        e.preventDefault();
        openFile();
      }
      
      // Ctrl+N: New
      if (e.ctrlKey && e.key === 'n') {
        e.preventDefault();
        newFile();
      }
      
      // Ctrl+Z: Undo
      if (e.ctrlKey && e.key === 'z') {
        e.preventDefault();
        undoAction();
      }
      
      // Ctrl+Y: Redo
      if (e.ctrlKey && e.key === 'y') {
        e.preventDefault();
        redoAction();
      }
    });
  }
  
  // Auto-save
  function setupAutoSave() {
    // Load auto-save setting
    const autoSaveEnabled = localStorage.getItem('notepad_autoSave') === 'true';
    const autoSaveIntervalSec = parseInt(localStorage.getItem('notepad_autoSaveInterval') || '30');
    
    if (autoSaveEnabled) {
      autoSaveInterval = setInterval(() => {
        if (!tabs[currentTab].saved) {
          saveFile();
        }
      }, autoSaveIntervalSec * 1000);
    }
  }
  
  // Settings
  function settingsMenuClick() {
    settingsModalEl.style.display = 'flex';
  }
  
  function closeSettings() {
    settingsModalEl.style.display = 'none';
  }
  
  function saveSettings() {
    // Apply theme
    const theme = themeSelectEl.value;
    if (theme === 'light') {
      document.body.style.background = '#f5f5f5';
      editorEl.style.background = '#ffffff';
      editorEl.style.color = '#000000';
    } else if (theme === 'blue') {
      document.body.style.background = '#002b36';
      editorEl.style.background = '#003f52';
      editorEl.style.color = '#839496';
    } else {
      document.body.style.background = '#1e1e1e';
      editorEl.style.background = '#1e1e1e';
      editorEl.style.color = '#d4d4d4';
    }
    
    // Apply font size
    const fontSize = fontSizeInputEl.value;
    currentFontSize = parseInt(fontSize);
    applyFontSize();
    
    // Apply tab size
    editorEl.style.tabSize = tabSizeInputEl.value;
    
    // Save settings
    localStorage.setItem('notepad_theme', theme);
    localStorage.setItem('notepad_fontSize', fontSize);
    localStorage.setItem('notepad_tabSize', tabSizeInputEl.value);
    localStorage.setItem('notepad_autoSave', autoSaveCheckEl.checked);
    localStorage.setItem('notepad_autoSaveInterval', autoSaveIntervalEl.value);
    
    // Restart auto-save if needed
    if (autoSaveInterval) {
      clearInterval(autoSaveInterval);
    }
    setupAutoSave();
    
    closeSettings();
  }
  
  function loadSettings() {
    // Load saved settings
    const savedTheme = localStorage.getItem('notepad_theme') || 'dark';
    const savedFontSize = localStorage.getItem('notepad_fontSize') || '14';
    const savedTabSize = localStorage.getItem('notepad_tabSize') || '2';
    const savedAutoSave = localStorage.getItem('notepad_autoSave') === 'true';
    const savedAutoSaveInterval = localStorage.getItem('notepad_autoSaveInterval') || '30';
    
    // Apply settings
    themeSelectEl.value = savedTheme;
    fontSizeInputEl.value = savedFontSize;
    tabSizeInputEl.value = savedTabSize;
    autoSaveCheckEl.checked = savedAutoSave;
    autoSaveIntervalEl.value = savedAutoSaveInterval;
    
    // Apply theme
    saveSettings();
  }
  
  // Menu functions
  function fileMenuClick() {
    toggleMenu('fileDropdown');
  }
  
  function editMenuClick() {
    toggleMenu('editDropdown');
  }
  
  function viewMenuClick() {
    toggleMenu('viewDropdown');
  }
  
  function pluginsMenuClick() {
    alert('Plugins Menu: Manage Plugins, Install New Plugin, Plugin Settings');
  }
  
  function aiMenuClick() {
    alert('AI Menu: AI Assistant, Code Completion, Code Explanation, Code Refactoring');
  }
</script>
