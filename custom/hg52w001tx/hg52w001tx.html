        <div class="tp-section">
          <div class="tp-subhead">Tools</div>

        let prof = profSkills.includes(s);

      }).join('');
      let savesHtml = Object.keys(ABILITY_FULL).map(ab => {
        let prof = getProficientSaves().includes(ab);
        let { label } = computeCheckModifier(ab, null);
        return `<div class="tp-row ${prof ? 'prof' : ''}"><span class="tp-name">${ABILITY_FULL[ab]} Save</span><span class="tp-mod">${label}</span></div>`;
      }).join('');
      let spellAb = SPELLCASTING_ABILITY[id.class];
      contentEl.innerHTML = `
        <div class="tp-section">
          <div class="tp-subhead">Skills <span class="tp-hint">(★ = proficient)</span></div>

        </div>
        <div class="tp-section">
          <div class="tp-subhead">Saving Throws</div>
          ${savesHtml}
        </div>
        ${spellAb ? `<div class="tp-section"><div class="tp-subhead">Spellcasting</div><div class="tp-text">Spellcasting ability: <b>${spellAb}</b>. Level 1 slots: 2 (tier 1).</div></div>` : `<div class="tp-section"><div class="tp-text">This class does not cast spells at level 1.</div></div>`}
        <div class="tp-section">
          <div class="tp-subhead">Class Features</div>
          <div class="tp-text">${(classData.features||[]).map(f => `<div>• ${escapeHtml(f)}</div>`).join('')}</div>
        </div>
      `;
    } else if (tool === 'items') {
      titleEl.textContent = 'Items & Equipment';
      let inventory = camp.inventory || [];
      let invHtml = inventory.length ? inventory.map((it, i) => `<div class="tp-row"><span class="tp-name">${escapeHtml(it.name||'Item')}${it.qty>1?' ×'+it.qty:''}</span><button class="tp-mini-btn" onclick="removeInventoryItem(${i})">×</button></div>`).join('') : '<div class="tp-text tp-empty">No custom items tracked yet.</div>';

        <div class="tp-section">
          <div class="tp-subhead">Starting Equipment</div>
          <div class="tp-text">${escapeHtml(classData.equip || 'Standard gear')}</div>

        <div class="tp-section">
          <div class="tp-subhead">Background Equipment</div>
          <div class="tp-text">${escapeHtml(bgData.equip || 'Standard gear')}</div>

        <div class="tp-section">
          <div class="tp-subhead">Skills</div>
          <div class="tp-check-grid">${skillsHtml}</div>

        <div class="tp-section">
          <div class="tp-subhead">Saving Throws</div>
          <div class="tp-check-grid">${savesHtml}</div>

    modal.hidden = false;
    setTimeout(() => modal.classList.add('open'), 10);
  }

  function closeToolPanel() {
    let modal = document.getElementById('toolPanelModal');
    modal.classList.remove('open');
    setTimeout(() => modal.hidden = true, 300);
  }

  function addInventoryItem() {
    let inp = document.getElementById('addItemInput');
    let v = inp.value.trim();
    if (!v) return;
    if (!app.campaign.inventory) app.campaign.inventory = [];
    app.campaign.inventory.push({ name: v, qty: 1 });
    saveCampaigns();
    openToolPanel('items');
  }
  function removeInventoryItem(i) {
    if (app.campaign.inventory) { app.campaign.inventory.splice(i, 1); saveCampaigns(); openToolPanel('items'); }
  }
  function addQuest() {
    let inp = document.getElementById('addQuestInput');
    let v = inp.value.trim();
    if (!v) return;
    if (!app.campaign.quests) app.campaign.quests = [];
    app.campaign.quests.push({ text: v, done: false });
    saveCampaigns();
    openToolPanel('journal');
  }
  function toggleQuest(i) {
    if (app.campaign.quests) { app.campaign.quests[i].done = !app.campaign.quests[i].done; saveCampaigns(); openToolPanel('journal'); }
  }
  function removeQuest(i) {
    if (app.campaign.quests) { app.campaign.quests.splice(i, 1); saveCampaigns(); openToolPanel('journal'); }
  }

  // Manual roll from the Skill Check tool panel
  function manualRoll(ability, skill) {
    let intent = (document.getElementById('manualCheckIntent')?.value || '').trim();
    let { mod, proficient, label } = computeCheckModifier(ability, skill);
    let roll = Math.floor(Math.random() * 20) + 1;
    let total = roll + mod;
    let abilityName = ABILITY_FULL[ability] || ability;
    let checkName = skill ? `${skill} (${abilityName})` : `${abilityName} Save`;
    closeToolPanel();
    // Post the manual roll into the adventure log so the DM can react
    let msg = intent
      ? `${checkName} for: ${intent} → d20 ${roll} ${mod>=0?'+':''}${mod} = ${total}.`
      : `${checkName} → d20 ${roll} ${mod>=0?'+':''}${mod} = ${total}.`;
    appendLog('player', msg);
    renderSceneLog();
    // Ask the DM to narrate the outcome of this manual roll
    continueScene(msg, { checkType: skill ? 'skill check' : 'saving throw', ability, skill, dc: null, reason: intent || 'Manual roll' }, { roll, mod, total, success: null, dc: null });
  }

  function editSetup(index) {
    app.currentCampaignIndex = index;
    app.campaign = JSON.parse(JSON.stringify(app.campaigns[index]));
    
    // Ensure portrait state structure exists (migration for old campaigns)
    if (!app.campaign.character.portraitSkipped) app.campaign.character.portraitSkipped = false;
    if (!app.campaign.character.portrait) app.campaign.character.portrait = null;
    
    app.currentStep = "1c";
    renderCurrentStep();
  }

  function finishSetup() {
    if (validateAndSaveCurrentStep()) {
      // Portrait Locking Rules: Lock portrait when Finish Setup is clicked
      if (app.campaign.character.portrait && !app.campaign.character.portrait.locked) {
        app.campaign.character.portrait.locked = true;
      }
      
      app.campaign.setupComplete = true;
      app.campaigns[app.currentCampaignIndex] = JSON.parse(JSON.stringify(app.campaign));
      saveCampaigns();
      app.currentStep = "vault";
      app.currentCampaignIndex = -1;
      renderCurrentStep();
    }
  }

  // ==========================================
  // MODAL FUNCTIONS
  // ==========================================
  
  function openCreateModal() {
    let modal = document.getElementById('createCampaignModal');
    let input = document.getElementById('campaignNameInput');
    input.value = '';
    modal.hidden = false;
    setTimeout(() => modal.classList.add('open'), 10);
    input.focus();
    validateCreateInput();
  }

  function closeCreateModal() {
    let modal = document.getElementById('createCampaignModal');
    modal.classList.remove('open');
    setTimeout(() => modal.hidden = true, 300);
  }

  function validateCreateInput() {
    let input = document.getElementById('campaignNameInput');
    document.getElementById('confirmCreateBtn').disabled = input.value.trim().length === 0;
  }
  
  document.getElementById('campaignNameInput').addEventListener('input', validateCreateInput);

  function openCustomRulesModal() {
    document.getElementById('customRuleInput').value = "";
    let modal = document.getElementById('customRulesModal');
    modal.hidden = false;
    setTimeout(() => modal.classList.add('open'), 10);
  }

  function closeCustomRulesModal() {
    let modal = document.getElementById('customRulesModal');
    modal.classList.remove('open');
    setTimeout(() => modal.hidden = true, 300);
  }

  function saveCustomRule() {
    let input = document.getElementById('customRuleInput');
    let rule = input.value.trim();
    if (rule) {
      if (!app.campaign.world.customRules) app.campaign.world.customRules = [];
      app.campaign.world.customRules.push(rule);
      saveCampaigns();
      showAutoSaveToast("Custom rule saved");
      renderCurrentStep();
    }
    closeCustomRulesModal();
  }

  function removeCustomRule(idx) {
    app.campaign.world.customRules.splice(idx, 1);
    saveCampaigns();
    renderCurrentStep();
  }

  function showInfoModal(type) {
    let modal = document.getElementById('infoModal');
    let title = document.getElementById('infoModalTitle');
    let content = document.getElementById('infoModalContent');
    
    let html = "";
    if (type === 'race') {
      title.textContent = "Race Information";
      html = "<p>Select a race to determine your size, speed, and innate abilities. Your choice influences your starting attributes and how NPCs perceive you.</p>";
    } else if (type === 'class') {
      title.textContent = "Class Information";
      html = "<p>Your class defines your adventuring profession. It grants you Hit Dice, proficiencies, and starting equipment. Be sure to read the Level 1 features carefully.</p>";
    } else if (type === 'background') {
      title.textContent = "Background Information";
      html = "<p>Your background represents your history before adventuring. It grants skill/tool proficiencies, languages, and a unique feature that aids roleplay.</p>";
    }
    
    content.innerHTML = html;
    modal.hidden = false;
    setTimeout(() => modal.classList.add('open'), 10);
  }

  function closeInfoModal() {
    let modal = document.getElementById('infoModal');
    modal.classList.remove('open');
    setTimeout(() => modal.hidden = true, 300);
  }

  // ==========================================
  // INITIALIZATION
  // ==========================================
  
  loadCampaigns();
  renderCurrentStep();
  
</script>
</body>
</html>
