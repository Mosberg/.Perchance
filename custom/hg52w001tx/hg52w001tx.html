<!DOCTYPE html>
<html lang="en">
<head>

  <title>hg52w001tx — Perchance</title>

<body>
<!-- Learn 'HTML' here:  https://www.khanacademy.org/computing/computer-programming/html/css-js-js    -->

<!-- Global CSS Variables for Dark Mode Foundation -->
<style>
  :root {
    /* 3. COLOR SYSTEM (VARIABLE-DRIVEN) */
    
    /* Base Surfaces */
    --ui-background: #0f1115; /* ui.background */
    --ui-surface-primary: #1a1d23; /* ui.surface.primary */
    --ui-surface-raised: #232834; /* ui.surface.raised */
    --ui-divider: #2e3442; /* ui.divider */
    
    /* Text Colors */
    --ui-text-primary: #f2f4f8; /* ui.text.primary */
    --ui-text-secondary: #aeb4c2; /* ui.text.secondary */
    --ui-text-muted: #7b8191; /* ui.text.muted */
    --ui-text-disabled: #555b6b; /* ui.text.disabled */
    
    /* Accent Colors */
    --ui-accent-primary: #5fa3d8; /* ui.accent.primary */
    --ui-accent-secondary: #3f7fb0; /* ui.accent.secondary */
    --ui-accent-success: #6fbf8f; /* ui.accent.success */
    --ui-accent-warning: #d1a545; /* ui.accent.warning */
    --ui-accent-danger: #c95c5c; /* ui.accentdanger */
    
    /* 5. TYPOGRAPHY SYSTEM */
    --font-family-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --ui-font-title: 28px; /* Slightly larger for the D&D Title */
    --ui-font-body: 15px;
    --ui-font-secondary: 13px;
    --ui-font-section: 13px; /* Added for "Your Campaigns" header */
    --ui-font-button: 15px;
    
    /* 7. CARD & CONTAINER RULES */
    --ui-card-radius: 12px; /* ui.card.radius */
    --ui-card-padding: 20px; /* ui.card.padding */
    
    /* 8. BUTTON SYSTEM */
    --ui-button-height: 48px; /* ui.button.height */
    --ui-button-radius: 10px; /* ui.button.radius */
    
    /* Custom Fonts for D&D Feel */
    --font-family-serif: "Cinzel", "Trajan Pro", "Times New Roman", serif;
  }
  
  /* Import Google Font 'Cinzel' for Fantasy Title */
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Inter:wght@400;500;600&display=swap');
  
  /* Base Reset */
  * {
    box-sizing: border-box;
  }
  
  html, body {
    margin: 0;
    padding: 0;
    background-color: var(--ui-background);
    color: var(--ui-text-primary);
    font-family: var(--font-family-sans);
    font-size: var(--ui-font-body);
    line-height: 1.5; /* 5. TYPOGRAPHY SYSTEM: Min 1.4, Max 1.6 */
    -webkit-font-smoothing: antialiased;
  }
  
  /* Main Container - Mobile First (2. RESPONSIVE LAYOUT RULES) */
  .app-container {
    max-width: 720px; /* Desktop: Max content width 720px */
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 0 16px 24px 16px;
    position: relative;
  }

  /* Top Header Area */
  .app-header {
    padding: 24px 0;
    text-align: center;
  }

  /* App Title: "Dungeons & Dragons" */
  .app-title {
    font-family: var(--font-family-serif);
    font-size: var(--ui-font-title);
    font-weight: 600;
    letter-spacing: 0.05em;
    color: var(--ui-text-primary);
    margin: 0;
    text-transform: uppercase;
  }
  
  .header-divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--ui-divider), transparent);
    margin: 16px 0 24px 0;
    opacity: 0.5;
  }
  
  /* 6. PANEL STRUCTURE STANDARD: 2. Section Header */
  .section-header {
    font-size: var(--ui-font-section);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ui-text-secondary);
    margin: 0 0 12px 0;
    text-align: left;
  }
  
  /* Campaign List Container */
  #campaignListCtn {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding-bottom: 80px;
  }
  
  /* Empty State */
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--ui-text-muted);
  }
  .empty-state h3 {
    margin: 0 0 8px 0;
    color: var(--ui-text-secondary);
    font-family: var(--font-family-serif);
  }
  .empty-state p {
    margin: 0;
    font-size: var(--ui-font-secondary);
  }

  /* Campaign Card Styling */
  .campaign-card {
    background-color: var(--ui-surface-raised);
    border-radius: var(--ui-card-radius);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  
  .card-top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  
  .campaign-name {
    font-size: 16px;
    font-weight: 600;
    color: var(--ui-text-primary);
  }
  
  .status-badge {
    font-size: 11px;
    font-weight: 700;
    padding: 4px 8px;
    border-radius: 8px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  
  .status-badge.active {
    background-color: var(--ui-accent-primary);
    color: white;
  }
  
  .status-badge.inactive {
    background-color: var(--ui-surface-primary);
    color: var(--ui-text-muted);
    border: 1px solid var(--ui-divider);
  }
  
  .campaign-meta {
    font-size: var(--ui-font-secondary);
    color: var(--ui-text-muted);
    line-height: 1.4;
  }
  
  .card-actions {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-top: 4px;
  }
  
  /* 8. BUTTON SYSTEM Modifications */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: var(--ui-button-height);
    width: 100%;
    padding: 0 12px;
    border-radius: var(--ui-button-radius);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid transparent;
    transition: background-color 0.2s ease, border-color 0.2s ease, opacity 0.2s ease;
    text-decoration: none;
    font-family: var(--font-family-sans);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  
  /* Primary Button (Enter World) */
  .btn-primary {
    background-color: var(--ui-accent-primary);
    color: white;
  }
  .btn-primary:hover {
    background-color: var(--ui-accent-secondary);
  }
  
  /* Secondary Button (Edit Setup) */
  .btn-secondary {
    background-color: transparent;
    border-color: var(--ui-divider);
    color: var(--ui-text-secondary);
  }
  .btn-secondary:hover {
    border-color: var(--ui-text-secondary);
    color: var(--ui-text-primary);
  }
  
  /* Destructive Button (Delete) */
  .btn-destructive {
    background-color: transparent;
    border-color: rgba(201, 92, 92, 0.3);
    color: var(--ui-accent-danger);
  }
  .btn-destructive:hover {
    background-color: rgba(201, 92, 92, 0.1);
  }
  
  /* Button Disabled State */
  .btn:disabled {
    background-color: var(--ui-surface-primary);
    border-color: transparent;
    color: var(--ui-text-disabled);
    cursor: not-allowed;
    opacity: 0.7;
  }

  /* Sticky Footer Button Area */
  .sticky-footer {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background-color: rgba(15, 17, 21, 0.9);
    backdrop-filter: blur(8px);
    padding: 16px;
    border-top: 1px solid var(--ui-divider);
    z-index: 10;
    display: flex;
    justify-content: center;
  }

  .footer-content {
    width: 100%;
    max-width: 720px;
  }

  .btn-large-create {
    height: 52px;
    font-size: 16px;
    background-color: var(--ui-accent-primary);
    color: white;
    border-radius: 12px;
  }
  .btn-large-create:hover {
    background-color: var(--ui-accent-secondary);
  }

  /* ---------------------------------------------------------
     WORLD CREATION (STEP 1C) & CHARACTER CREATION (STEP 1D) SHARED STYLES
     --------------------------------------------------------- */
  
  /* Screen Container */
  .screen-container {
    display: flex;
    flex-direction: column;
    gap: 24px;
    padding-bottom: 100px;
  }
  
  /* Screen Header */
  .screen-header {
    text-align: center;
    margin-bottom: 8px;
  }
  
  .screen-title {
    font-family: var(--font-family-serif);
    font-size: var(--ui-font-title);
    font-weight: 600;
    color: var(--ui-text-primary);
    margin: 0 0 8px 0;
    text-transform: uppercase;
  }
  
  .screen-subtext {
    font-size: var(--ui-font-secondary);
    color: var(--ui-text-muted);
    margin: 0;
  }

  /* Form Groups */
  .wc-form-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 20px;
  }
  
  .wc-label {
    font-size: var(--ui-font-secondary);
    font-weight: 600;
    color: var(--ui-text-secondary);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  
  .wc-input, .wc-select {
    width: 100%;
    background-color: var(--ui-background);
    border: 1px solid var(--ui-divider);
    border-radius: 8px;
    padding: 14px 16px;
    color: var(--ui-text-primary);
    font-size: var(--ui-font-body);
    font-family: var(--font-family-sans);
    outline: none;
    appearance: none;
    min-height: 48px;
  }
  
  .wc-input:focus, .wc-select:focus {
    border-color: var(--ui-accent-primary);
    box-shadow: 0 0 0 2px rgba(95, 163, 216, 0.2);
  }
  
  .wc-input.input-error {
    border-color: var(--ui-accent-danger);
  }
  
  .wc-helper-text {
    font-size: 12px;
    color: var(--ui-text-muted);
    margin: 0;
    line-height: 1.4;
  }

  /* Checkbox Rows */
  .wc-checkbox-row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--ui-divider);
    cursor: pointer;
  }
  
  .wc-checkbox-row:last-child {
    border-bottom: none;
  }
  
  .wc-checkbox-input {
    width: 20px;
    height: 20px;
    margin-top: 2px;
    accent-color: var(--ui-accent-primary);
    cursor: pointer;
    flex-shrink: 0;
  }
  
  .wc-checkbox-content {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  
  .wc-checkbox-label {
    font-size: var(--ui-font-body);
    font-weight: 500;
    color: var(--ui-text-primary);
  }
  
  .wc-checkbox-effect {
    font-size: 12px;
    color: var(--ui-text-muted);
  }

  /* Summary Section */
  .wc-summary-box {
    background-color: var(--ui-surface-primary);
    border: 1px solid var(--ui-divider);
    border-radius: var(--ui-card-radius);
    padding: 16px;
  }
  
  .wc-summary-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    font-size: var(--ui-font-secondary);
  }
  
  .wc-summary-row:last-child {
    border-bottom: none;
  }
  
  .wc-summary-key {
    color: var(--ui-text-muted);
  }
  
  .wc-summary-val {
    color: var(--ui-text-primary);
    font-weight: 600;
    text-align: right;
  }

  /* Footer Actions */
  .wc-footer-actions {
    display: flex;
    gap: 12px;
    width: 100%;
  }
  
  .btn-back {
    background-color: transparent;
    border-color: var(--ui-divider);
    color: var(--ui-text-secondary);
  }
  .btn-back:hover {
    border-color: var(--ui-text-secondary);
    color: var(--ui-text-primary);
  }

  /* ---------------------------------------------------------
     UI REFINEMENT STYLES (Step 1C & 1D)
     --------------------------------------------------------- */
  
  .thin-divider {
    height: 1px;
    background-color: var(--ui-divider);
    margin: 24px 0;
    opacity: 0.5;
  }

  .info-icon-btn {
    background: none;
    border: 1px solid var(--ui-divider);
    border-radius: 50%;
    width: 20px;
    height: 20px;
    color: var(--ui-text-secondary);
    font-size: 12px;
    font-family: serif;
    font-style: italic;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .info-icon-btn:hover {
    color: var(--ui-text-primary);
    border-color: var(--ui-text-secondary);
  }

  .details-panel {
    background-color: var(--ui-surface-primary);
    border: 1px solid var(--ui-divider);
    border-radius: 8px;
    padding: 16px;
    margin-top: 8px;
    font-size: var(--ui-font-secondary);
    color: var(--ui-text-secondary);
    animation: fadeIn 0.3s ease;
  }
  
  .details-panel h4 {
    margin: 0 0 8px 0;
    font-size: 15px;
    color: var(--ui-text-primary);
    font-family: var(--font-family-serif);
  }
  
  .details-list {
    margin: 8px 0;
    padding-left: 20px;
    color: var(--ui-text-muted);
  }
  
  .details-list li {
    margin-bottom: 4px;
  }

  .tag-chip {
    display: inline-block;
    background-color: var(--ui-surface-raised);
    border: 1px solid var(--ui-divider);
    border-radius: 4px;
    padding: 2px 6px;
    font-size: 11px;
    margin-right: 4px;
    margin-bottom: 4px;
    color: var(--ui-text-primary);
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-5px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ---------------------------------------------------------
     ABILITY SCORE INLINE STYLES (Step 1D)
     --------------------------------------------------------- */
    
  .ability-method-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }
  
  .ability-method-btn {
    background-color: var(--ui-surface-primary);
    border: 1px solid var(--ui-divider);
    padding: 16px;
    border-radius: 8px;
    text-align: left;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  
  .ability-method-btn:hover:not(:disabled) {
    border-color: var(--ui-accent-primary);
    background-color: rgba(95, 163, 216, 0.05);
  }
  
  .ability-method-btn:disabled {
    opacity: 0.6;
    cursor: default;
    background-color: var(--ui-background);
  }
  
  .am-title {
    font-weight: 600;
    color: var(--ui-text-primary);
    font-size: 14px;
  }
  
  .am-desc {
    font-size: 12px;
    color: var(--ui-text-muted);
    line-height: 1.3;
  }
  
  .ability-table-container {
    background-color: var(--ui-surface-primary);
    border: 1px solid var(--ui-divider);
    border-radius: 8px;
    overflow: hidden;
    margin-top: 12px;
  }
  
  .ability-table-row {
    display: flex;
    align-items: center;
    padding: 12px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    cursor: pointer;
    transition: background 0.2s;
  }
  
  .ability-table-row:hover {
    background-color: rgba(255,255,255,0.03);
  }
  
  .ability-table-row:last-child {
    border-bottom: none;
  }
  
  .at-label {
    width: 80px;
    font-weight: 700;
    font-size: 13px;
    color: var(--ui-text-secondary);
  }
  
  .at-score-area {
    flex: 1;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 12px;
  }
  
  .at-score {
    font-size: 20px;
    font-weight: 700;
    color: var(--ui-text-primary);
    width: 40px;
    text-align: center;
  }
  
  .at-mod {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background-color: var(--ui-background);
    border: 1px solid var(--ui-divider);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    color: var(--ui-text-muted);
  }
  
  .at-mod.pos { color: var(--ui-accent-success); border-color: rgba(111, 191, 143, 0.3); }
  .at-mod.neg { color: var(--ui-accent-danger); border-color: rgba(201, 92, 92, 0.3); }

  .at-breakdown {
    font-size: 11px;
    color: var(--ui-accent-secondary);
    text-align: right;
    width: 80px;
  }

  /* ---------------------------------------------------------
     CHARACTER PORTRAIT STYLES (Step 1D)
     --------------------------------------------------------- */
  .portrait-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    background-color: var(--ui-surface-primary);
    border: 1px solid var(--ui-divider);
    border-radius: var(--ui-card-radius);
    padding: 24px;
  }
  
  .portrait-frame {
    width: 140px;
    height: 140px;
    border-radius: 12px;
    overflow: hidden;
    background-color: var(--ui-background);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    position: relative;
  }
  
  .portrait-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: opacity 0.3s ease;
  }
  
  .portrait-placeholder {
    color: var(--ui-text-muted);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    width: 100%;
    text-align: center;
    padding: 10px;
  }
  
  .portrait-placeholder svg {
    width: 48px;
    height: 48px;
    margin-bottom: 8px;
    opacity: 0.5;
  }
  
  .portrait-placeholder span {
    font-size: 12px;
    line-height: 1.3;
  }

  .portrait-actions {
    display: flex;
    gap: 12px;
    width: 100%;
    justify-content: center;
  }

  /* ---------------------------------------------------------
     MODAL STYLES
     --------------------------------------------------------- */
  .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.7);
    z-index: 100;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  
  .modal-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }
  
  .modal-container {
    background-color: var(--ui-surface-primary);
    width: 100%;
    max-width: 720px;
    border-radius: 16px 16px 0 0;
    padding: 24px;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    max-height: 90vh;
    overflow-y: auto;
  }
  
  .modal-overlay.open .modal-container {
    transform: translateY(0);
  }
  
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  
  .modal-title {
    font-family: var(--font-family-serif);
    font-size: 20px;
    font-weight: 600;
    color: var(--ui-text-primary);
    margin: 0;
  }
  
  .modal-close-icon {
    background: none;
    border: none;
    color: var(--ui-text-secondary);
    font-size: 24px;
    cursor: pointer;
    padding: 4px;
  }
  
  .form-group {
    margin-bottom: 24px;
  }
  
  .form-label {
    display: block;
    font-size: var(--ui-font-secondary);
    font-weight: 500;
    color: var(--ui-text-secondary);
    margin-bottom: 8px;
  }
  
  .form-input, .form-textarea {
    width: 100%;
    background-color: var(--ui-background);
    border: 1px solid var(--ui-divider);
    border-radius: 8px;
    padding: 12px 16px;
    color: var(--ui-text-primary);
    font-size: var(--ui-font-body);
    font-family: var(--font-family-sans);
    outline: none;
  }

  .form-textarea {
    resize: vertical;
    min-height: 100px;
  }
  
  .form-input:focus, .form-textarea:focus {
    border-color: var(--ui-accent-primary);
  }
  
  .modal-actions {
    display: flex;
    gap: 12px;
    margin-top: 24px;
  }
  
  .info-content-area {
    font-size: var(--ui-font-body);
    color: var(--ui-text-secondary);
    line-height: 1.6;
    max-height: 50vh;
    overflow-y: auto;
  }
  .info-content-area h4 {
    color: var(--ui-text-primary);
    margin-top: 16px;
    margin-bottom: 8px;
    font-family: var(--font-family-serif);
  }
  .info-content-area ul {
    padding-left: 20px;
  }
  .info-content-area li {
    margin-bottom: 6px;
  }
  
  /* Ability Score Specific Modal Styles */
  .as-pool-container {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 16px 0;
    justify-content: center;
    background-color: var(--ui-background);

  // ==========================================

  function escapeHtml(text) {
    if (!text) return "";
    let map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
    return text.replace(/[&<>"']/g, function(m) { return map[m]; });
  }

  let toastTimeout;
  function showAutoSaveToast(message) {
    let toast = document.getElementById('autoSaveToast');
    toast.textContent = message;
    toast.classList.add('show');
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => { toast.classList.remove('show'); }, 2000);
  }

  function calculateModifier(score) {
    return Math.floor((score - 10) / 2);
  }

  function getModifierString(mod) {
    return mod >= 0 ? `+${mod}` : `${mod}`;
  }
  
  function getRacialModifiers(raceKey) {
    let mods = { STR: 0, DEX: 0, CON: 0, INT: 0, WIS: 0, CHA: 0 };
    let raceData = RACE_DATA[raceKey];
    if (!raceData || !raceData.bonuses) return mods;

    raceData.bonuses.forEach(b => {
      let val = parseInt(b.match(/\d+/)[0]) || 0;
      if (b.includes("All")) {
        Object.keys(mods).forEach(k => mods[k] += val);
      } else if (b.includes("Strength")) mods.STR += val;
      else if (b.includes("Dexterity")) mods.DEX += val;
      else if (b.includes("Constitution")) mods.CON += val;
      else if (b.includes("Intelligence")) mods.INT += val;
      else if (b.includes("Wisdom")) mods.WIS += val;
      else if (b.includes("Charisma")) mods.CHA += val;
    });
    return mods;
  }

  // STEP RENDERING FUNCTIONS
  // ==========================================
  
  function renderCurrentStep() {
    let container = document.getElementById('stepContainer');
    let footerContent = document.getElementById('footerContent');
    
    switch(app.currentStep) {
      case "vault":
        container.innerHTML = renderVaultStep();
        footerContent.innerHTML = `<button class="btn btn-large-create" onclick="openCreateModal()">Create New Campaign</button>`;
        break;
      case "1c":
        container.innerHTML = renderWorldCreationStep();
        footerContent.innerHTML = `
          <div class="wc-footer-actions">
            <button class="btn btn-back" onclick="goBack()">Back to Campaign Vault</button>
            <button id="wcContinueBtn" class="btn btn-primary" disabled onclick="goForward()">Continue to Character Creation</button>
          </div>
        `;
        attachWCListeners();
        break;
      case "1d":
        container.innerHTML = renderCharacterCreationStep();
        footerContent.innerHTML = `
          <div class="wc-footer-actions">
            <button class="btn btn-back" onclick="goBack()">Back to World Creation</button>
            <button id="ccFinishBtn" class="btn btn-primary" disabled onclick="finishSetup()">Finish Setup</button>
          </div>
        `;
        attachCCListeners();
        // Update summary from DOM after rendering (Issue D: Summary is derived, not cached)
        updateCCSummary();
        break;
      case "play":
        container.innerHTML = renderPlayStep();
        footerContent.innerHTML = `
          <div class="wc-footer-actions">
            <button class="btn btn-back" onclick="exitWorld()">Leave World</button>
          </div>
        `;
        // Enter to send (Shift+Enter for newline)
        let pi = document.getElementById('playerActionInput');
        if (pi) {
          pi.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
              e.preventDefault();
              submitPlayerAction();
            }
          });
          pi.focus();
        }
        // Kick off scene generation if we don't have one yet
        if (!app.campaign.sceneLog || app.campaign.sceneLog.length === 0) {
          if (!app.campaign.currentScene) {
            generateOpeningScene();
          } else {
            // We have a saved scene but no log (migration) — seed the log
            appendLog('dm', app.campaign.currentScene.text);
            renderSceneLog();
          }
        } else {
          renderSceneLog();
        }
        break;
    }
  }

  // --- VAULT STEP RENDERER ---
  
  function renderVaultStep() {
    let html = `<div class="section-header">Your Campaigns</div>`;
    
    if (app.campaigns.length === 0) {
      html += `
        <div class="empty-state">
          <h3>No campaigns yet.</h3>
          <p>Create a new campaign to begin your adventure.</p>
        </div>
      `;
    } else {
      app.campaigns.forEach((camp, index) => {
        let isActive = camp.status === 'ACTIVE';
        let statusClass = isActive ? 'active' : 'inactive';
        let statusText = isActive ? 'ACTIVE' : 'INACTIVE';
        let createdDate = new Date(camp.created).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
        let playedDate = camp.lastPlayed ? new Date(camp.lastPlayed).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }) : 'Never';
        let isSetupComplete = camp.setupComplete || false;
        
        // Campaign Vault Integration: Portrait Image
        let portraitHtml = '';
        if (camp.character && camp.character.portrait && camp.character.portrait.imageUrl) {
          portraitHtml = `
            <div class="vault-portrait">
              <img src="${camp.character.portrait.imageUrl}" alt="Character Portrait">
            </div>
          `;
        }
        
        html += `
          <div class="campaign-card">
            <div style="display:flex; gap:16px;">
              ${portraitHtml}
              <div style="flex:1; min-width:0;">
                <div class="card-top-row">
                  <span class="campaign-name" style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${escapeHtml(camp.name)}</span>
                  <span class="status-badge ${statusClass}">${statusText}</span>
                </div>
                <div class="campaign-meta">
                  Created: ${createdDate}<br>
                  Last Played: ${playedDate}
                </div>
                <div class="card-actions">
                  <button class="btn btn-primary" onclick="enterWorld(${index})" ${!isSetupComplete ? 'disabled' : ''}>Enter World</button>
                  <button class="btn btn-secondary" onclick="editSetup(${index})">Edit Setup</button>
                  <button class="btn btn-destructive" onclick="deleteCampaign(${index})">Delete</button>
                </div>
              </div>
            </div>
          </div>
        `;
      });
    }
    return `<div id="campaignListCtn">${html}</div>`;
  }

  function renderCCSummary(id, raceData, classData, bgData, abilitiesConfirmed) {
    // Use DOM values for race/class/background if available (Issue D)
    let domRaceEl = document.getElementById('ccRaceSelect');
    let domClassEl = document.getElementById('ccClassSelect');
    let domBgEl = document.getElementById('ccBackgroundSelect');
    
    let currentRaceKey = domRaceEl ? domRaceEl.value : (id.race || "");
    let currentClassKey = domClassEl ? domClassEl.value : (id.class || "");
    let currentBgKey = domBgEl ? domBgEl.value : (id.background || "");
    
    let currentRaceData = RACE_DATA[currentRaceKey] || raceData;
    let currentClassData = CLASS_DATA[currentClassKey] || classData;
    let currentBgData = BG_DATA[currentBgKey] || bgData;
    
    let html = `
      <div class="wc-summary-row"><span class="wc-summary-key">Name:</span><span class="wc-summary-val">${escapeHtml(id.name || '-')}</span></div>
      
      <div class="thin-divider" style="margin: 4px 0;"></div>
      
      <div class="wc-summary-row"><span class="wc-summary-key" style="color:var(--ui-accent-secondary)">Race:</span><span class="wc-summary-val">${escapeHtml(currentRaceKey || '-')}</span></div>
      <div style="font-size:11px; color:var(--ui-text-muted); padding: 4px 0 8px 0; line-height:1.4;">
        ${currentRaceData.desc ? escapeHtml(currentRaceData.desc) : ''}<br>
        <strong>Stats:</strong> ${currentRaceData.bonuses ? currentRaceData.bonuses.map(b=>`<span class="tag-chip" style="font-size:10px; padding:1px 4px;">${escapeHtml(b)}</span>`).join('') : ''}
      </div>

      <div class="thin-divider" style="margin: 4px 0;"></div>

      <div class="wc-summary-row"><span class="wc-summary-key" style="color:var(--ui-accent-secondary)">Class:</span><span class="wc-summary-val">${escapeHtml(currentClassKey || '-')}</span></div>
      <div style="font-size:11px; color:var(--ui-text-muted); padding: 4px 0 8px 0; line-height:1.4;">
        ${currentClassData.desc ? escapeHtml(currentClassData.desc) : ''}<br>
        <strong>Hit Die:</strong> ${currentClassData.hitDie || '-'} | <strong>Primary:</strong> ${currentClassData.primary || '-'}
      </div>

      <div class="thin-divider" style="margin: 4px 0;"></div>

      <div class="wc-summary-row"><span class="wc-summary-key" style="color:var(--ui-accent-secondary)">Background:</span><span class="wc-summary-val">${escapeHtml(currentBgKey || '-')}</span></div>
      <div style="font-size:11px; color:var(--ui-text-muted); padding: 4px 0 8px 0; line-height:1.4;">
        ${currentBgData.desc ? escapeHtml(currentBgData.desc) : ''}
      </div>
    `;
    
    // Append Ability Scores to summary if confirmed
    if (abilitiesConfirmed && app.campaign.character.abilityScores) {
      html += `<div class="thin-divider" style="margin: 4px 0;"></div>`;
      html += `<div class="wc-summary-row"><span class="wc-summary-key">Method:</span><span class="wc-summary-val">${app.campaign.character.abilityMethod}</span></div>`;
      
      let racialMods = getRacialModifiers(currentRaceKey);
      ['STR', 'DEX', 'CON', 'INT', 'WIS', 'CHA'].forEach(key => {
        let base = app.campaign.character.abilityScores[key];
        if (base !== null) {
          let final = base + racialMods[key];
          let mod = calculateModifier(final);
          html += `
            <div class="wc-summary-row" style="font-size:12px;">
              <span class="wc-summary-key">${key}</span>
              <span class="wc-summary-val">${final} (${getModifierString(mod)})</span>
            </div>
          `;
        }
      });
      
      // Spellcasting info
      if (SPELLCASTING_ABILITY[currentClassKey]) {
        html += `<div class="wc-summary-row"><span class="wc-summary-key" style="color:var(--ui-accent-primary)">Spellcasting:</span><span class="wc-summary-val">${SPELLCASTING_ABILITY[currentClassKey]}</span></div>`;
      }
    }
    
    return html;
  }

  async function handlePortraitAction(action) {
    if (action === 'generate' || action === 'regen') {
      // If regenerating, check confirmation
      if (action === 'regen') {
        if (!confirm("This will permanently replace your current portrait. Continue?")) return;
      }
      
      // Pull the freshest values from the DOM before generating
      autosaveCharacterIdentity();
      
      let id = app.campaign.character.identity || {};
      let name = id.name || "Adventurer";
      let race = id.race || "Human";
      let cls = id.class || "Fighter";
      let bg = id.background || "Soldier";
      let sex = id.sex || "";
      let gender = id.gender || "";
      let w = app.campaign.world || {};
      let tone = w.genre || "High Fantasy";
      let magic = w.magic_prevalence || "";
      let tech = w.tech_level || "";
      let ctx = w.starting_context || "";
      let constraints = (w.constraints && w.constraints.length) ? w.constraints.join(", ") : "";
      
      let promptParts = [
        "Dungeons & Dragons character portrait.",
        `Character named ${name}.`,
        `Race: ${race}.`,
        `Class: ${cls}.`,
        `Background: ${bg}.`,
      ];
      if (sex) promptParts.push(`Sex: ${sex}.`);
      if (gender) promptParts.push(`Gender: ${gender}.`);
      promptParts.push(`World tone: ${tone}.`);
      if (magic) promptParts.push(`Magic prevalence: ${magic}.`);
      if (tech) promptParts.push(`Technology level: ${tech}.`);
      if (ctx) promptParts.push(`Starting context: ${ctx}.`);
      if (constraints) promptParts.push(`World constraints: ${constraints}.`);
      promptParts.push("Cinematic lighting, fantasy art, digital painting, detailed, character sheet portrait style, head and shoulders, centered.");
      let prompt = promptParts.join(" ");
      
      // Show loading toast
      let toast = document.getElementById('autoSaveToast');
      let originalText = toast.textContent;
      toast.textContent = "Generating portrait...";
      toast.classList.add('show');
      
      try {
        if (typeof generateImage === 'function') {
          let dataUrl = await generateImage(prompt, {resolution: "512x768"});
          app.campaign.character.portrait = {
            imageUrl: dataUrl,
            prompt: prompt,
            generatedAt: Date.now(),
            locked: false
          };
          app.campaign.character.portraitSkipped = false;
          saveCampaigns();
          renderCurrentStep(); // Re-render to show image
          showAutoSaveToast("Portrait generated");
        } else {
          alert("Image generation not available in this environment.");
        }
      } catch (e) {
        console.error(e);
        alert("Failed to generate portrait.");
      }
      
    } else if (action === 'clear') {
      if (confirm("Clear your character's portrait?")) {
        app.campaign.character.portrait = null;
        app.campaign.character.portraitSkipped = false;
        saveCampaigns();
        renderCurrentStep();
      }
    } else if (action === 'skip') {
      app.campaign.character.portrait = null;
      app.campaign.character.portraitSkipped = true;
      saveCampaigns();
      renderCurrentStep();
    }
  }

  // ==========================================

  // Helper to reset temp ability state to clean slate
  function resetTempAbilityState() {
    app.tempAbilities.mode = null;
    app.tempAbilities.pointsRemaining = 27;
    app.tempAbilities.pool = [];
    app.tempAbilities.tokens = [];
    app.tempAbilities.originalRolls = null;
    app.tempAbilities.activeTokenId = null;
    // Reset assignments to null (Issue A: no default 8s)
    app.tempAbilities.assignments = { STR: null, DEX: null, CON: null, INT: null, WIS: null, CHA: null };
  }
  
  // Helper: Create Token Object
  function createToken(id, value) {
    return { id: id, value: value, assignedTo: null };
  }

  function openAbilityModal(method) {
    // Issue C: Hard reset on method change - clear temp state before opening
    resetTempAbilityState();
    
    // If opening to EDIT existing scores, load them into temp state
    if (app.campaign.character.abilityMethod && app.campaign.character.abilityScores && method === app.campaign.character.abilityMethod) {
      // Editing mode: Copy current saved state to temp
      // We need to reconstruct tokens from the saved values.
      // Since saved values are just numbers (after confirm), we assume unique values or just reconstruct standard/rolled logic.
      // Actually, if we are editing, we should ideally have the original tokens. 
      // For simplicity in this refactor: if editing Standard/Rolled, we rebuild the pool based on the *current assignments*.
      
      app.tempAbilities.mode = method;
      
      // Reconstruct tokens
      let values = Object.values(app.campaign.character.abilityScores); // These are numbers
      // We need IDs.
      if (method === 'standard') {
        // Standard array has specific values.
        // If editing, we assume the user used the standard array.
        // We'll create tokens for the standard set.
        let standardValues = [15, 14, 13, 12, 10, 8];
        app.tempAbilities.tokens = standardValues.map(v => createToken(`sa-${v}`, v));
      } else if (method === 'rolled') {
        // Reconstructing rolled tokens is tricky if we only have values.
        // We'll assign random IDs for the values found.
        app.tempAbilities.tokens = values.map(v => createToken(`roll-${Math.random().toString(36).substr(2,9)}`, v));
      }
      
      // Now, re-assign based on current assignments.
      // We have a problem: values can be duplicates (e.g. two 16s).
      // Without IDs, we can't know which 16 was which.
      // However, since we are refactoring to enforce tokens, this "Edit" flow for Rolled is fuzzy without ID storage.
      // Assumption: For this refactor, "Edit" will rebuild the pool from the *values* currently assigned.
      // Logic:
      // 1. Create tokens for all unique assigned values.
      // 2. Assign them to the abilities.
      // 3. Add remaining tokens (if any) to pool.
      
      // Better approach for "Edit":
      // Use the *method* logic to determine the pool, then try to match assignments?
      // No, that messes up user choices if they deviated (though Standard doesn't deviate).
      // Let's assume the saved `abilityMeta` (if exists) or just rebuild.
      
      // Specific Edit Logic for Standard:
      if (method === 'standard') {
        // Standard pool is fixed.
        app.tempAbilities.tokens = [15, 14, 13, 12, 10, 8].map((v, i) => createToken(`sa-${i}`, v));
        app.tempAbilities.pool = [...app.tempAbilities.tokens]; // Start with all in pool
        
        // Assign from saved data
        for (let ability in app.campaign.character.abilityScores) {
          let val = app.campaign.character.abilityScores[ability];
          // Find a token in pool with this value (and not assigned)
          let tokenIndex = app.tempAbilities.pool.findIndex(t => t.value === val);
          if (tokenIndex > -1) {
            let token = app.tempAbilities.pool[tokenIndex];
            app.tempAbilities.assignments[ability] = token.id;
            app.tempAbilities.pool.splice(tokenIndex, 1); // Remove from pool
          }
        }
      }
      // Specific Edit Logic for Rolled:
      // Since we don't have the original IDs, we create new tokens for the assigned values.
      if (method === 'rolled') {
        let rolledValues = Object.values(app.campaign.character.abilityScores);
        app.tempAbilities.tokens = rolledValues.map((v, i) => createToken(`roll-edit-${Date.now()}-${i}`, v));
        app.tempAbilities.pool = [...app.tempAbilities.tokens]; // All in pool initially
        
        // Assign them all back
        let i = 0;
        for (let ability in app.campaign.character.abilityScores) {
          let val = app.campaign.character.abilityScores[ability];
          // Find a token with this value
          let tokenIndex = app.tempAbilities.pool.findIndex(t => t.value === val);
          if (tokenIndex > -1) {
             let token = app.tempAbilities.pool[tokenIndex];
             app.tempAbilities.assignments[ability] = token.id;
             app.tempAbilities.pool.splice(tokenIndex, 1);
          }
        }
      }
      
      // Point Buy Edit (keep as is)
      if (method === 'pointBuy') {
         app.tempAbilities.assignments = { ...app.campaign.character.abilityScores };
         let costs = { 8:0, 9:1, 10:2, 11:3, 12:4, 13:5, 14:7, 15:9 };
         let spent = 0;
         for (let k in app.tempAbilities.assignments) {
           spent += (costs[app.tempAbilities.assignments[k]] || 0);
         }
         app.tempAbilities.pointsRemaining = 27 - spent;
      }

    } else {
      // New selection mode (including method change)
      app.tempAbilities.mode = method;
      
      if (method === 'pointBuy') {
        app.tempAbilities.assignments = { STR: 8, DEX: 8, CON: 8, INT: 8, WIS: 8, CHA: 8 };
      } else {
        // Standard and Rolled: null (empty, unassigned)
        app.tempAbilities.assignments = { STR: null, DEX: null, CON: null, INT: null, WIS: null, CHA: null };
      }
      
      app.tempAbilities.pointsRemaining = 27;
      
      if (method === 'standard') {
        // Standard Array: [15, 14, 13, 12, 10, 8] as tokens
        app.tempAbilities.tokens = [15, 14, 13, 12, 10, 8].map((v, i) => createToken(`sa-${i}`, v));
        app.tempAbilities.pool = [...app.tempAbilities.tokens];
      } else if (method === 'rolled') {
        app.tempAbilities.tokens = [];
        app.tempAbilities.pool = [];
      }
    }

    // Render Modal
    let modal = document.getElementById('abilityScoreModal');
    let content = document.getElementById('asModalContent');
    let title = document.getElementById('asModalTitle');
    let warning = document.getElementById('asModalWarning');
    
    warning.textContent = "";
    
    if (method === 'standard') {
      title.textContent = "Ability Scores — Standard Array";
      renderStandardArrayContent(content);
    } else if (method === 'pointBuy') {
      title.textContent = "Ability Scores — Point Buy";
      renderPointBuyContent(content);
    } else if (method === 'rolled') {
      title.textContent = "Ability Scores — Rolled";
      renderRolledContent(content);
    }
    
    modal.hidden = false;
    setTimeout(() => modal.classList.add('open'), 10);
    
    updateAbilityModalValidation();
  }
  
  function closeAbilityModal() {
    let modal = document.getElementById('abilityScoreModal');
    modal.classList.remove('open');
    setTimeout(() => {
      modal.hidden = true;
      // Clear temp state to prevent state leakage (Issue C)
      resetTempAbilityState();
    }, 300);
  }
  
  // --- Standard Array Modal Content (Token Logic) ---
  function renderStandardArrayContent(container) {
    let pool = app.tempAbilities.pool;
    let activeId = app.tempAbilities.activeTokenId;
    let abilities = ['STR', 'DEX', 'CON', 'INT', 'WIS', 'CHA'];
    let abilityNames = { STR: 'Strength', DEX: 'Dexterity', CON: 'Constitution', INT: 'Intelligence', WIS: 'Wisdom', CHA: 'Charisma' };
    
    let html = `<div class="form-label">Available Values (Tap to select)</div>`;
    html += `<div class="as-pool-container">`;
    
    if (pool.length > 0) {
      pool.forEach(token => {
        let isActive = token.id === activeId;
        let activeClass = isActive ? 'active' : '';
        html += `<div class="as-chip ${activeClass}" onclick="selectPoolToken('${token.id}')">${token.value}</div>`;
      });
    } else {
      html += `<span style="color:var(--ui-text-muted); font-size:13px;">All values assigned.</span>`;
    }
    
    html += `</div>`;
    html += `<div class="form-label">Assignments (Tap ability to place value)</div>`;
    
    abilities.forEach(key => {
      let tokenId = app.tempAbilities.assignments[key];
      let token = app.tempAbilities.tokens.find(t => t.id === tokenId);
      let valDisplay = token ? token.value : '—';
      let isAssigned = !!tokenId;
      
      html += `
        <div class="modal-stat-row" onclick="handleAbilityRowClick('${key}')">
          <span class="modal-stat-name">${abilityNames[key]}</span>
          <span class="modal-stat-val">${valDisplay}</span>
        </div>
      `;
    });
    
    container.innerHTML = html;
  }
  
  // --- Point Buy Modal Content ---
  function renderPointBuyContent(container) {
    let abilities = ['STR', 'DEX', 'CON', 'INT', 'WIS', 'CHA'];
    let abilityNames = { STR: 'Strength', DEX: 'Dexterity', CON: 'Constitution', INT: 'Intelligence', WIS: 'Wisdom', CHA: 'Charisma' };
    
    let html = `<div class="as-points-remaining">Points: <span>${app.tempAbilities.pointsRemaining}</span></div>`;
    
    html += `<div style="font-size:11px; color:var(--ui-text-muted); margin-bottom:12px; text-align:center;">Cost: 9(1), 10(2), 11(3), 12(4), 13(5), 14(7), 15(9). Max 15.</div>`;
    
    abilities.forEach(key => {
      let val = app.tempAbilities.assignments[key];
      let costs = { 8:0, 9:1, 10:2, 11:3, 12:4, 13:5, 14:7, 15:9, 16:99 };
      
      let canDec = val > 8;
      let canInc = val < 15 && app.tempAbilities.pointsRemaining >= (costs[val+1] - costs[val]);
      
      html += `
        <div class="modal-stat-row">
          <span class="modal-stat-name">${abilityNames[key]}</span>
          <div class="modal-stat-controls">
            <button class="modal-stat-btn" onclick="adjustPointBuy('${key}', -1)" ${!canDec ? 'disabled' : ''}>-</button>
            <span class="modal-stat-val">${val}</span>
            <button class="modal-stat-btn" onclick="adjustPointBuy('${key}', 1)" ${!canInc ? 'disabled' : ''}>+</button>
          </div>
        </div>
      `;
    });
    
    container.innerHTML = html;
  }
  
  function adjustPointBuy(key, delta) {
    let costs = { 8:0, 9:1, 10:2, 11:3, 12:4, 13:5, 14:7, 15:9 };
    let current = app.tempAbilities.assignments[key];
    let next = current + delta;
    
    let currentCost = costs[current] || 0;
    let nextCost = costs[next] || 0;
    let diff = nextCost - currentCost;
    
    if (delta > 0 && app.tempAbilities.pointsRemaining >= diff) {
      app.tempAbilities.assignments[key] = next;
      app.tempAbilities.pointsRemaining -= diff;
    } else if (delta < 0) {
      app.tempAbilities.assignments[key] = next;
      app.tempAbilities.pointsRemaining += Math.abs(diff);
    }
    
    renderPointBuyContent(document.getElementById('asModalContent'));
    updateAbilityModalValidation();
  }
  
  // --- Rolled Modal Content (Token Logic) ---
  function renderRolledContent(container) {
    let pool = app.tempAbilities.pool;
    let activeId = app.tempAbilities.activeTokenId;
    let abilities = ['STR', 'DEX', 'CON', 'INT', 'WIS', 'CHA'];
    let abilityNames = { STR: 'Strength', DEX: 'Dexterity', CON: 'Constitution', INT: 'Intelligence', WIS: 'Wisdom', CHA: 'Charisma' };
    
    let html = '';
    
    if (!app.tempAbilities.originalRolls) {
      html += `<button class="as-roll-btn" onclick="performRoll()">Roll Abilities</button>`;
      html += `<div style="text-align:center; color:var(--ui-text-muted); font-size:13px;">Roll 4d6 drop lowest for each score.</div>`;
    } else {
      html += `<div class="form-label">Rolled Values (Tap to select)</div>`;
      html += `<div class="as-pool-container">`;
      if (pool.length > 0) {
        pool.forEach(token => {
          let isActive = token.id === activeId;
          let activeClass = isActive ? 'active' : '';
          html += `<div class="as-chip ${activeClass}" onclick="selectPoolToken('${token.id}')">${token.value}</div>`;
        });
      } else {
        html += `<span style="color:var(--ui-text-muted); font-size:13px;">All values assigned.</span>`;
      }
      html += `</div>`;
    }
    
    html += `<div class="form-label">Assignments (Tap ability to place value)</div>`;
    
    abilities.forEach(key => {
      let tokenId = app.tempAbilities.assignments[key];
      let token = app.tempAbilities.tokens.find(t => t.id === tokenId);
      let valDisplay = token ? token.value : '—';
      let isAssigned = !!tokenId;
      
      html += `
        <div class="modal-stat-row" onclick="handleAbilityRowClick('${key}')">
          <span class="modal-stat-name">${abilityNames[key]}</span>
          <span class="modal-stat-val">${valDisplay}</span>
        </div>
      `;
    });
    
    container.innerHTML = html;
  }
  
  function performRoll() {
    let rolls = [];
    for (let i = 0; i < 6; i++) {
      let dices = [];
      for (let j = 0; j < 4; j++) dices.push(Math.floor(Math.random() * 6) + 1);
      dices.sort((a, b) => b - a);
      rolls.push(dices[0] + dices[1] + dices[2]);
    }
    
    // Create tokens
    app.tempAbilities.tokens = rolls.map((v, i) => createToken(`roll-${Date.now()}-${i}`, v));
    app.tempAbilities.pool = [...app.tempAbilities.tokens];
    app.tempAbilities.originalRolls = rolls;
    
    // Issue A: Reset assignments to null (empty, unassigned)
    app.tempAbilities.assignments = { STR: null, DEX: null, CON: null, INT: null, WIS: null, CHA: null };
    app.tempAbilities.activeTokenId = null;
    
    renderRolledContent(document.getElementById('asModalContent'));
    updateAbilityModalValidation();
  }
  
  // --- Shared Token Logic ---
  
  // 2️⃣ SELECT ONE VALUE AT A TIME
  function selectPoolToken(tokenId) {
    let currentActive = app.tempAbilities.activeTokenId;
    // If clicking already active, deselect it
    if (currentActive === tokenId) {
      app.tempAbilities.activeTokenId = null;
    } else {
      app.tempAbilities.activeTokenId = tokenId;
    }
    
    // Re-render pool to show active state
    if (app.tempAbilities.mode === 'standard') renderStandardArrayContent(document.getElementById('asModalContent'));
    else if (app.tempAbilities.mode === 'rolled') renderRolledContent(document.getElementById('asModalContent'));
  }

  // 4️⃣ REPLACING A VALUE & 5️⃣ REMOVING AN ASSIGNMENT
  function handleAbilityRowClick(abilityKey) {
    let activeId = app.tempAbilities.activeTokenId;
    let assignedId = app.tempAbilities.assignments[abilityKey];
    
    if (activeId) {
      // ASSIGNING (New Selection)
      // Check if replacing
      if (assignedId) {
        // Remove old token from assignments, add to pool
        let oldToken = app.tempAbilities.tokens.find(t => t.id === assignedId);
        if (oldToken) {
          app.tempAbilities.pool.push(oldToken);
        }
      }
      
      // Assign new token
      app.tempAbilities.assignments[abilityKey] = activeId;
      
      // Remove new token from pool
      let newIdx = app.tempAbilities.pool.findIndex(t => t.id === activeId);
      if (newIdx > -1) {
        app.tempAbilities.pool.splice(newIdx, 1);
      }
      
      // Clear active token
      app.tempAbilities.activeTokenId = null;
      
    } else {
      // REMOVING (No active selection, clicking assigned)
      if (assignedId) {
        let token = app.tempAbilities.tokens.find(t => t.id === assignedId);
        if (token) {
          app.tempAbilities.pool.push(token);
        }
        app.tempAbilities.assignments[abilityKey] = null;
      }
    }
    
    // Re-render
    if (app.tempAbilities.mode === 'standard') renderStandardArrayContent(document.getElementById('asModalContent'));
    else if (app.tempAbilities.mode === 'rolled') renderRolledContent(document.getElementById('asModalContent'));
    
    updateAbilityModalValidation();
  }
  
  function updateAbilityModalValidation() {
    let warning = document.getElementById('asModalWarning');
    let confirmBtn = document.getElementById('asConfirmBtn');
    let isValid = true;
    let msg = "";
    
    if (app.tempAbilities.mode === 'standard') {
      // 6️⃣ CONFIRM BUTTON CONDITIONS: Pool empty, every ability assigned
      if (app.tempAbilities.pool.length > 0) {
        isValid = false; msg = "Assign all values from the pool.";
      } else if (Object.values(app.tempAbilities.assignments).some(v => v === null)) {
        isValid = false; msg = "All abilities must be assigned.";
      }
    } else if (app.tempAbilities.mode === 'pointBuy') {
      if (app.tempAbilities.pointsRemaining > 0) {
        isValid = false; msg = `Spend all 27 points (Current: ${app.tempAbilities.pointsRemaining}).`;
      }
    } else if (app.tempAbilities.mode === 'rolled') {
      if (!app.tempAbilities.originalRolls) {
        // Haven't rolled yet
        isValid = false; msg = "Roll abilities first.";
      } else if (app.tempAbilities.pool.length > 0) {
        // Still have unassigned rolls
        isValid = false; msg = "Assign all rolled values.";
      } else if (Object.values(app.tempAbilities.assignments).some(v => v === null)) {
         isValid = false; msg = "All abilities must be assigned.";
      }
    }
    
    warning.textContent = msg;
    confirmBtn.disabled = !isValid;
  }
  
  function confirmAbilityScores() {
    // 8️⃣ CHARACTER SUMMARY SYNC (FINAL GUARANTEE)
    // Resolve assignments to values
    let finalScores = {};
    
    if (app.tempAbilities.mode === 'pointBuy') {
      // Point buy stores values directly in assignments
      finalScores = { ...app.tempAbilities.assignments };
    } else {
      // Standard and Rolled store Token IDs. Resolve to values.
      for (let ability in app.tempAbilities.assignments) {
        let tokenId = app.tempAbilities.assignments[ability];
        let token = app.tempAbilities.tokens.find(t => t.id === tokenId);
        finalScores[ability] = token ? token.value : 8; // Default 8 if missing (shouldn't happen)
      }
    }

    // Save
    app.campaign.character.abilityMethod = app.tempAbilities.mode;
    app.campaign.character.abilityScores = finalScores;
    
    if (app.tempAbilities.mode === 'rolled') {
      app.campaign.character.abilityMeta = {
        rolledValues: [...app.tempAbilities.originalRolls]
      };
    } else {
      app.campaign.character.abilityMeta = null;
    }
    
    closeAbilityModal();
    saveCampaigns();
    renderCurrentStep(); // Re-render to show inline table
    showAutoSaveToast("Ability Scores Saved");
  }
  
  function resetAbilityScores() {
    if (confirm("Reset Ability Scores? This will clear your current method and scores.")) {
      app.campaign.character.abilityMethod = null;
      app.campaign.character.abilityScores = null;
      app.campaign.character.abilityMeta = null;
      saveCampaigns();
      renderCurrentStep();
    }
  }
  
  // --- Inline Table Swap Logic ---
  let firstSwapKey = null;
  function handleAbilitySwap(key) {
    if (!app.campaign.character.abilityScores) return;
    
    if (!firstSwapKey) {
      firstSwapKey = key;
      showAutoSaveToast("Select another score to swap");
    } else {
      if (firstSwapKey !== key) {
        // Swap values
        let temp = app.campaign.character.abilityScores[firstSwapKey];
        app.campaign.character.abilityScores[firstSwapKey] = app.campaign.character.abilityScores[key];
        app.campaign.character.abilityScores[key] = temp;
        
        saveCampaigns();
        renderCurrentStep();
        showAutoSaveToast("Swapped");
      }
      firstSwapKey = null;
    }
  }

  // ==========================================
  // NAVIGATION & STATE MANAGEMENT
  // ==========================================
  
  function goToStep(stepId) {
    let currentIndex = STEP_ORDER.indexOf(app.currentStep);
    let newIndex = STEP_ORDER.indexOf(stepId);
    
    // Validate and save before moving forward
    if (newIndex > currentIndex) {
      if (!validateAndSaveCurrentStep()) return;
      lockCurrentStepData();
    }
    
    // If moving backward, invalidate downstream steps
    if (newIndex < currentIndex) {
      invalidateDownstreamSteps(stepId);
    }
    
    app.currentStep = stepId;
    renderCurrentStep();
  }

  function goForward() {
    let currentIndex = STEP_ORDER.indexOf(app.currentStep);
    if (currentIndex < STEP_ORDER.length - 1) {
      goToStep(STEP_ORDER[currentIndex + 1]);
    }
  }

  function goBack() {
    let currentIndex = STEP_ORDER.indexOf(app.currentStep);
    if (currentIndex > 0) {
      goToStep(STEP_ORDER[currentIndex - 1]);
    }
  }

  function validateAndSaveCurrentStep() {
    switch(app.currentStep) {
      case "1c":
        return validateAndSaveWorldCreation();
      case "1d":
        return validateAndSaveCharacterCreation();
      default:
        return true;
    }
  }

  function lockCurrentStepData() {
    // Data is already saved during validation
  }

  // ==========================================
  // RESET & INVALIDATION LOGIC (CRITICAL)
  // ==========================================
  
  function invalidateDownstreamSteps(fromStep) {
    if (fromStep === "1c") {
      // Reset 1D
      app.campaign.character = {
        identity: {},
        abilityMethod: null,
        abilityScores: null,
        abilityMeta: null,
        portraitSkipped: false, // Reset portrait state
        portrait: null
      };
    }
    // 1D is the last step now, so no further downstream invalidation needed.
  }

  function validateAndSaveWorldCreation() {
    let nameEl = document.getElementById('wcNameInput');
    let genreEl = document.getElementById('wcGenreSelect');
    let magicEl = document.getElementById('wcMagicSelect');
    let techEl = document.getElementById('wcTechSelect');
    let deathEl = document.getElementById('wcDeathSelect');
    let startEl = document.getElementById('wcStartSelect');
    
    let genreCustomEl = document.getElementById('wcGenreCustomInput');
    let magicCustomEl = document.getElementById('wcMagicCustomInput');
    let techCustomEl = document.getElementById('wcTechCustomInput');
    let deathCustomEl = document.getElementById('wcDeathCustomInput');
    let startCustomEl = document.getElementById('wcStartCustomInput');
    
    const isValidCustom = (select, custom) => {
      if (select.value === "Custom…") return custom.value.trim().length > 0;
      return select.value !== "" && select.value !== "Custom…";
    };
    
    let isValid = 
      nameEl.value.trim().length > 0 &&
      isValidCustom(genreEl, genreCustomEl) &&
      isValidCustom(magicEl, magicCustomEl) &&
      isValidCustom(techEl, techCustomEl) &&
      isValidCustom(deathEl, deathCustomEl) &&
      isValidCustom(startEl, startCustomEl);
    
    if (!isValid) {
      [nameEl, genreEl, magicEl, techEl, deathEl, startEl].forEach(el => el.classList.add('input-error'));
      return false;
    }
    
    const getVal = (select, custom) => select.value === "Custom…" ? custom.value.trim() : select.value;
    
    app.campaign.world = {
      name: nameEl.value.trim(),
      genre: getVal(genreEl, genreCustomEl),
      magic_prevalence: getVal(magicEl, magicCustomEl),
      tech_level: getVal(techEl, techCustomEl),
      death_rules: getVal(deathEl, deathCustomEl),
      starting_context: getVal(startEl, startCustomEl),
      constraints: [],
      customRules: app.campaign.world.customRules || []
    };
    
    let constraints = [];
    if (document.getElementById('cbGods').checked) constraints.push("Gods do not intervene directly");
    if (document.getElementById('cbScars').checked) constraints.push("Magic leaves physical consequences");
    if (document.getElementById('cbGray').checked) constraints.push("Factions are morally gray");
    if (document.getElementById('cbTravel').checked) constraints.push("No fast travel");
    if (document.getElementById('cbRes').checked) constraints.push("Limited resurrection");
    if (document.getElementById('cbLaw').checked) constraints.push("Law is harsh and enforced");
    app.campaign.world.constraints = constraints;
    
    saveCampaigns();
    showAutoSaveToast("World settings saved");
    return true;
  }

      name: name,
      created: Date.now(),

  function deleteCampaign(index) {
    if (confirm("Are you sure you want to delete this campaign? This cannot be undone.")) {
      app.campaigns.splice(index, 1);
      saveCampaigns();
      renderCurrentStep();
    }
  }

  function enterWorld(index) {
    let camp = app.campaigns[index];
    if (!camp.setupComplete) {
      alert("Please complete the setup first.");
      return;
    }
    // Before Enter World: Block progression unless...
    let hasPortrait = camp.character.portrait && camp.character.portrait.imageUrl;
    let isSkipped = camp.character.portraitSkipped;
    
    if (!hasPortrait && !isSkipped) {
      alert("Character must have a portrait or be skipped to enter the world.");
      return;
    }
    
    camp.lastPlayed = Date.now();
    camp.status = 'ACTIVE';
    saveCampaigns();
    
    // Load this campaign as the active one and switch to the play step
    app.currentCampaignIndex = index;
    app.campaign = JSON.parse(JSON.stringify(camp));
    // Clear any stale scene so a fresh one is generated on entry
    app.campaign.currentScene = null;
    app.currentStep = "play";
    renderCurrentStep();
  }

  function exitWorld() {
    // Persist the scene log and any in-progress scene back to the saved campaign
    if (app.currentCampaignIndex >= 0 && app.campaign) {
      let saved = app.campaigns[app.currentCampaignIndex];
      saved.currentScene = app.campaign.currentScene || null;
      saved.sceneLog = app.campaign.sceneLog || [];
      saved.status = 'INACTIVE';
      saveCampaigns();
    }
    app._actionPending = false;
    app._sceneGenerating = false;
    app.currentStep = "vault";
    app.currentCampaignIndex = -1;
    app.campaign = null;
    renderCurrentStep();
  }

  // --- PLAY STEP RENDERER ---
  function renderPlayStep() {
    let camp = app.campaign;
    if (!camp) return '';
    let id = camp.character.identity || {};
    let name = id.name || "Adventurer";
    let race = id.race || "Human";
    let cls = id.class || "Fighter";
    let bg = id.background || "Soldier";
    let world = camp.world || {};
    
    // Portrait
    let portraitHtml = '';
    let hasPortrait = camp.character.portrait && camp.character.portrait.imageUrl;
    if (hasPortrait) {
      portraitHtml = `<img class="portrait-img" src="${camp.character.portrait.imageUrl}" alt="${escapeHtml(name)}">`;
    } else {
      portraitHtml = `<div class="portrait-placeholder"><span>${escapeHtml(race)} ${escapeHtml(cls)}</span></div>`;
    }
    
    // Build scene transcript from the log
    let log = camp.sceneLog || [];
    let logHtml = '';
    if (log.length === 0) {
      let sceneText = camp.currentScene && camp.currentScene.text ? camp.currentScene.text : '';
      if (sceneText) {
        logHtml = `<div class="msg dm">${escapeHtml(sceneText)}</div>`;
      } else if (app._sceneGenerating) {
        logHtml = `<div class="msg dm scene-loading">Weaving the opening scene</div>`;
      } else {
        logHtml = `<div class="msg dm scene-loading">Preparing your adventure...</div>`;
      }
    } else {
      log.forEach(m => {
        let cls2 = m.role === 'player' ? 'player' : 'dm';
        let label = m.role === 'player' ? `${escapeHtml(name)}` : 'DM';
        logHtml += `<div class="msg ${cls2}"><span class="msg-label">${label}</span>${escapeHtml(m.text)}</div>`;
      });
    }
    
    return `
      <div class="play-screen">
        <div class="play-header">
          <h2 class="play-title">${escapeHtml(world.name || camp.name)}</h2>
          <p class="play-subtitle">${escapeHtml(world.genre || 'Fantasy')} · ${escapeHtml(world.starting_context || 'A new beginning')}</p>
        </div>
        <div class="char-sheet collapsed">
          <div class="portrait-frame">${portraitHtml}</div>
          <div class="char-sheet-info">
            <div class="cs-name">${escapeHtml(name)}</div>
            <div class="cs-row"><b>${escapeHtml(race)}</b> · <b>${escapeHtml(cls)}</b> · ${escapeHtml(bg)}</div>
          </div>
          <button class="cs-toggle" onclick="toggleCharSheet()">Details</button>
        </div>
        <div class="scene-box">
          <div class="scene-label">Adventure</div>
          <div id="sceneTextCtn">${logHtml}</div>
        </div>
        <div class="play-toolbar">
          <button class="tb-btn" onclick="openToolPanel('weapons')">Weapons</button>
          <button class="tb-btn" onclick="openToolPanel('skills')">Skills & Spells</button>
          <button class="tb-btn" onclick="openToolPanel('items')">Items & Equipment</button>
          <button class="tb-btn" onclick="openToolPanel('journal')">Journal</button>
          <button class="tb-btn" onclick="openToolPanel('skillcheck')">Skill Check</button>
        </div>
        <div class="player-input-area">
          <textarea id="playerActionInput" placeholder="What do you do? Describe your action..." rows="2"></textarea>
          <button id="sendActionBtn" class="btn btn-primary" onclick="submitPlayerAction()">Send</button>

  const RACE_SKILL_PROF = {
    'Elf': ['Perception'], 'Half-Orc': ['Intimidation'], 'Half-Elf': [], 'Human': [], 'Dwarf': [], 'Halfling': [], 'Gnome': [], 'Tiefling': [], 'Dragonborn': []
  };

  function getProficientSkills() {
    let camp = app.campaign;
    if (!camp) return [];
    let id = camp.character.identity || {};
    let prof = new Set();
    // Background skills
    let bgData = BG_DATA[id.background];
    if (bgData && bgData.skills) {
      bgData.skills.split(',').forEach(s => { let t = s.trim(); if (t && t !== 'None') prof.add(t); });
    }
    // Racial skill proficiencies
    (RACE_SKILL_PROF[id.race] || []).forEach(s => prof.add(s));
    return [...prof];
  }

  function getProficientSaves() {
    let camp = app.campaign;
    if (!camp) return [];
    let id = camp.character.identity || {};
    let classData = CLASS_DATA[id.class];
    if (!classData || !classData.saves) return [];
    let prof = new Set();
    classData.saves.split(',').forEach(s => {
      let t = s.trim();
      Object.keys(ABILITY_FULL).forEach(ab => { if (ABILITY_FULL[ab] === t) prof.add(ab); });
    });
    return [...prof];
  }

  function getAbilityMod(score) {
    return Math.floor((score - 10) / 2);
  }

  // returns {mod, proficient, label}
  function computeCheckModifier(ability, skill) {
    let camp = app.campaign;
    let scores = camp.character.abilityScores || {};
    let baseScore = scores[ability] != null ? scores[ability] : 10;
    let mod = getAbilityMod(baseScore);
    let proficient = false;
    let profBonus = 2; // level 1
    if (skill && SKILL_LIST[skill] === ability) {
      proficient = getProficientSkills().includes(skill);
    } else {
      // saving throw proficiency
      proficient = getProficientSaves().includes(ability);
    }
    if (proficient) mod += profBonus;
    return { mod, proficient, profBonus, label: (mod >= 0 ? '+' : '') + mod };
  }

  // ==========================================
  // PLAY STEP: SCENE / CONVERSATION LOGIC
  // ==========================================
  function getSceneLog() {
    if (!app.campaign.sceneLog) app.campaign.sceneLog = [];
    return app.campaign.sceneLog;
  }

  function appendLog(role, text) {
    getSceneLog().push({ role, text, ts: Date.now() });
    saveCampaigns();
  }

  function renderSceneLog() {
    let ctn = document.getElementById('sceneTextCtn');
    if (!ctn) return;
    let camp = app.campaign;
    let name = (camp.character.identity && camp.character.identity.name) || "Adventurer";
    let log = camp.sceneLog || [];
    let html = '';
    if (log.length === 0) {
      let sceneText = camp.currentScene && camp.currentScene.text ? camp.currentScene.text : '';
      html = sceneText ? `<div class="msg dm">${escapeHtml(sceneText)}</div>` : `<div class="msg dm scene-loading">Preparing your adventure...</div>`;
    } else {
      log.forEach(m => {
        let c = m.role === 'player' ? 'player' : 'dm';
        let label = m.role === 'player' ? escapeHtml(name) : 'DM';
        html += `<div class="msg ${c}"><span class="msg-label">${label}</span>${escapeHtml(m.text)}</div>`;
      });
    }
    ctn.innerHTML = html;
    ctn.scrollTop = ctn.scrollHeight;
  }

  // Build the DM system prompt (world + character context). Stable prefix for caching.
  function buildDmSystemPrompt() {
    let camp = app.campaign;
    let id = camp.character.identity || {};
    let world = camp.world || {};
    let scores = camp.character.abilityScores || {};
    let scoreLine = Object.keys(ABILITY_FULL).map(ab => `${ABILITY_FULL[ab]} ${scores[ab] != null ? scores[ab] : 10}`).join(', ');
    let profSkills = getProficientSkills().join(', ') || 'none';
    let profSaves = getProficientSaves().map(a => ABILITY_FULL[a]).join(', ') || 'none';
    let constraints = (world.constraints && world.constraints.length) ? world.constraints.join('; ') : '';
    let customRules = (world.customRules && world.customRules.length) ? world.customRules.join('; ') : '';
    let raceData = RACE_DATA[id.race] || {};
    let classData = CLASS_DATA[id.class] || {};
    let bgData = BG_DATA[id.background] || {};
    return [
      `You are the Dungeon Master running a tabletop RPG adventure for a single player.`,
      `WORLD: ${world.name || camp.name}. Genre: ${world.genre || 'High Fantasy'}. Magic: ${world.magic_prevalence || 'Standard'}. Tech: ${world.tech_level || 'Medieval'}. Death rules: ${world.death_rules || 'Standard'}. Starting context: ${world.starting_context || 'A tavern'}.`,
      constraints ? `World constraints: ${constraints}.` : '',
      customRules ? `Custom world rules: ${customRules}.` : '',
      `PLAYER CHARACTER: ${id.name || 'the hero'}, a ${id.race || 'Human'} ${id.class || 'Fighter'} (${id.background || 'Soldier'} background).`,
      `Ability scores: ${scoreLine}.`,
      `Race traits: ${(raceData.traits||[]).join(', ') || 'standard'}.`,
      `Class features: ${(classData.features||[]).join(', ') || 'standard'}. Hit die: ${classData.hitDie||'d8'}.`,
      `Background feature: ${bgData.feature || 'standard'}.`,
      `Proficient skills: ${profSkills}. Proficient saves: ${profSaves}.`,
      `DM RULES: Narrate in second person. Keep scenes vivid but concise (2-4 paragraphs per response). Never speak or decide for the player. When the player attempts an action with a risk of failure, a skill check or saving throw may be required — you will be asked separately whether one is needed. Do not roll for the player. End responses by inviting the player's next action.`
    ].filter(Boolean).join('\n');
  }

  // Build the conversation transcript text for the prompt (append-only tail).
  function buildTranscriptText() {
    let log = getSceneLog();
    return log.map(m => m.role === 'player' ? `Player: ${m.text}` : `DM: ${m.text}`).join('\n\n');
  }

  // Generate the opening scene via AI text
  async function generateOpeningScene() {
    if (app._sceneGenerating) return;
    if (typeof root.generateText !== 'function') {
      app.campaign.currentScene = { text: '(AI text generation is not available in this environment. Add the ai-text-plugin import to enable generated scenes.)', generatedAt: Date.now() };
      renderSceneLog();
      return;
    }
    app._sceneGenerating = true;
    app.campaign.currentScene = null;
    let ctn = document.getElementById('sceneTextCtn');
    if (ctn) ctn.innerHTML = `<div class="msg dm scene-loading">Weaving the opening scene</div>`;
    
    let streamed = '';
    try {
      let instruction = buildDmSystemPrompt() + '\n\n' +
        `There is no prior transcript yet. Write the evocative opening scene that drops the character into this world (3-5 paragraphs, second person). End with a clear hook or choice. No headings.`;
      await root.generateText({
        instruction,
        onChunk: (data) => {
          streamed += data.textChunk || '';
          let el = document.getElementById('sceneTextCtn');
          if (el) el.innerHTML = `<div class="msg dm"><span class="msg-label">DM</span>${escapeHtml(streamed)}</div>`;
          if (el) el.scrollTop = el.scrollHeight;
        }
      });
      if (!streamed.trim()) streamed = '(The scene came back empty. Send an action to continue.)';
      app.campaign.currentScene = { text: streamed.trim(), generatedAt: Date.now() };
      appendLog('dm', streamed.trim());
    } catch (e) {
      console.error(e);
      app.campaign.currentScene = { text: '(Failed to generate a scene. Send an action to try again.)', generatedAt: Date.now() };
      renderSceneLog();
    } finally {
      app._sceneGenerating = false;
    }
  }

  // ==========================================
  // PLAYER ACTION SUBMISSION + SKILL CHECK FLOW
  // ==========================================
  async function submitPlayerAction() {
    let input = document.getElementById('playerActionInput');
    if (!input) return;
    let text = input.value.trim();
    if (!text || app._actionPending) return;
    if (typeof root.generateText !== 'function') {
      alert('AI text generation is not available.');
      return;
    }
    app._actionPending = true;
    setActionBusy(true);
    input.value = '';

    // Record the player's action in the log immediately
    appendLog('player', text);

    try {
      // STEP 1: Ask the DM whether this action requires a check/save.
      let checkInfo = await detectNeededCheck(text);
      if (checkInfo && checkInfo.needsCheck) {
        // Show the roll popup; waits for the player to roll
        let rollResult = await promptSkillRoll(checkInfo);
        // STEP 2: Continue the scene with the roll result incorporated
        await continueScene(text, checkInfo, rollResult);
      } else {
        // No check needed — just continue the scene
        await continueScene(text, null, null);
      }
    } catch (e) {
      console.error(e);
      appendLog('dm', '(Something went wrong generating a response. Try rephrasing your action.)');
      renderSceneLog();
    } finally {
      app._actionPending = false;
      setActionBusy(false);
    }
  }

  function setActionBusy(busy) {
    let btn = document.getElementById('sendActionBtn');
    if (btn) { btn.disabled = busy; btn.textContent = busy ? '...' : 'Send'; }
    let input = document.getElementById('playerActionInput');
    if (input && !busy) input.focus();
  }

  // Ask the AI whether the player's action requires a skill check or saving throw.
  // Returns {needsCheck, checkType, ability, skill, dc, reason} or {needsCheck:false}
  async function detectNeededCheck(playerAction) {
    let system = buildDmSystemPrompt();
    let transcript = buildTranscriptText();
    let instruction = system + '\n\n' +
      `<TRANSCRIPT>\n${transcript}\n</TRANSCRIPT>\n\n` +
      `The player just declared this action: "${playerAction}".\n` +
      `Decide whether resolving this action requires a skill check or saving throw per D&D 5e rules. Respond with ONLY a JSON object on a single line, no prose, in this exact format:\n` +
      `{"needsCheck": true, "checkType": "skill check", "ability": "DEX", "skill": "Stealth", "dc": 12, "reason": "Sneaking past the guards unnoticed."}\n` +
      `checkType must be one of: "skill check", "saving throw", "none". If "none", set needsCheck false and omit other fields. Use ability short codes STR/DEX/CON/INT/WIS/CHA. Pick a reasonable DC (5-25). Keep reason under 20 words explaining the intent.`;
    try {
      let result = await root.generateText({
        instruction,
        stopSequences: ['\n']
      });
      let raw = (result && result.text ? result.text : String(result)).trim();
      // extract first JSON object
      let m = raw.match(/\{[\s\S]*\}/);
      if (!m) return { needsCheck: false };
      let info = JSON.parse(m[0]);
      if (!info || info.checkType === 'none' || info.needsCheck === false) return { needsCheck: false };
      info.needsCheck = true;
      return info;
    } catch (e) {
      console.error('check detection failed', e);
      return { needsCheck: false };
    }
  }

  // Show a modal requiring the player to roll before the scene continues.
  // Returns a promise resolving to {roll, mod, total, success, dc}.
  function promptSkillRoll(info) {
    return new Promise((resolve) => {
      let ability = info.ability || 'DEX';
      let skill = info.skill || '';
      let dc = info.dc || 10;
      let checkType = info.checkType || 'skill check';
      let { mod, proficient, label } = computeCheckModifier(ability, skill);
      let title = checkType === 'saving throw' ? 'Saving Throw Required' : 'Skill Check Required';
      let abilityName = ABILITY_FULL[ability] || ability;
      let modLine = `Base ${abilityName} modifier: ${mod >= 0 ? '+' : ''}${mod}` + (proficient ? ` (+2 proficiency)` : '');
      
      let modal = document.getElementById('skillCheckModal');
      let titleEl = document.getElementById('skillCheckTitle');
      let bodyEl = document.getElementById('skillCheckBody');
      titleEl.textContent = title;
      bodyEl.innerHTML = `
        <div class="sc-info">
          <div class="sc-row"><b>${checkType === 'saving throw' ? abilityName + ' Save' : (skill || abilityName) + ' Check'}</b></div>
          <div class="sc-row sc-reason">${escapeHtml(info.reason || 'The DM requires a roll.')}</div>
          <div class="sc-row">DC: <b>${dc}</b></div>
          <div class="sc-row sc-mod">${modLine}</div>
        </div>
        <div class="sc-roll-area" id="scRollArea">
          <button class="btn btn-primary sc-roll-btn" id="scRollBtn" onclick="rollSkillCheck()">Roll d20</button>
        </div>
      `;
      modal.hidden = false;
      setTimeout(() => modal.classList.add('open'), 10);

      // Store resolver for the roll handler
      app._skillRollResolver = (result) => {
        modal.classList.remove('open');
        setTimeout(() => { modal.hidden = true; }, 300);
        app._skillRollResolver = null;
        resolve(result);
      };
      // stash params for the roll handler
      app._skillRollParams = { ability, skill, dc, mod, proficient };
    });
  }

  function rollSkillCheck() {
    let p = app._skillRollParams;
    if (!p) return;
    let roll = Math.floor(Math.random() * 20) + 1;
    let total = roll + p.mod;
    let success = total >= p.dc;
    let area = document.getElementById('scRollArea');
    if (area) {
      area.innerHTML = `
        <div class="sc-result ${success ? 'pass' : 'fail'}">
          <div class="sc-die">d20: ${roll} ${p.mod >= 0 ? '+' : ''}${p.mod} = <b>${total}</b></div>
          <div class="sc-outcome">${success ? 'SUCCESS' : 'FAILURE'} (DC ${p.dc})</div>
        </div>
        <button class="btn btn-primary" onclick="confirmSkillRoll()">Continue</button>
      `;
    }
    app._skillRollResult = { roll, mod: p.mod, total, success, dc: p.dc };
  }

  function confirmSkillRoll() {
    if (app._skillRollResolver) app._skillRollResolver(app._skillRollResult);
  }

  // Continue the scene. If checkInfo + rollResult are present, the DM narrates the outcome
  // using the actual roll; otherwise just narrates the result of the player's action.
  async function continueScene(playerAction, checkInfo, rollResult) {
    let system = buildDmSystemPrompt();
    let transcript = buildTranscriptText();
    let task;
    if (checkInfo && rollResult) {
      let outcome = rollResult.success ? 'succeeded' : 'failed';
      let abilityName = ABILITY_FULL[checkInfo.ability] || checkInfo.ability;
      let checkName = checkInfo.checkType === 'saving throw' ? abilityName + ' save' : (checkInfo.skill || abilityName) + ' check';
      task = `The player attempted: "${playerAction}".\nA ${checkName} was required (DC ${checkInfo.dc}). The player rolled a total of ${rollResult.total} (d20=${rollResult.roll}, modifier ${rollResult.mod >= 0 ? '+' : ''}${rollResult.mod}) and ${outcome}. Narrate the outcome of this action based on the ${outcome} roll, then advance the scene and invite the next action. Do not re-describe the roll mechanics to the player; weave the outcome into the narrative.`;
    } else {
      task = `The player attempts: "${playerAction}". Narrate the outcome and advance the scene. If the action is trivially successful or a guaranteed failure, just describe the result. Otherwise narrate what happens and invite the next action. Do not speak for the player beyond this action.`;
    }
    let instruction = system + '\n\n<TRANSCRIPT>\n' + transcript + '\n</TRANSCRIPT>\n\n' + task;

    let streamed = '';
    let ctn = document.getElementById('sceneTextCtn');
    // append an empty DM message we will stream into
    let msgDiv = document.createElement('div');
    msgDiv.className = 'msg dm';
    msgDiv.innerHTML = `<span class="msg-label">DM</span><span class="msg-streaming scene-loading"></span>`;
    if (ctn) { ctn.appendChild(msgDiv); ctn.scrollTop = ctn.scrollHeight; }
    let streamTarget = msgDiv.querySelector('.msg-streaming');

    try {
      await root.generateText({
        instruction,
        onChunk: (data) => {
          streamed += data.textChunk || '';
          if (streamTarget) {
            streamTarget.classList.remove('scene-loading');
            streamTarget.textContent = streamed;
          }
          if (ctn) ctn.scrollTop = ctn.scrollHeight;
        }
      });
      if (!streamed.trim()) streamed = '(The DM has nothing to say. Try another action.)';
      appendLog('dm', streamed.trim());
    } catch (e) {
      console.error(e);
      appendLog('dm', '(Failed to generate a response. Try again.)');
      renderSceneLog();
    }
  }

    if (tool === 'weapons') {
      titleEl.textContent = 'Weapons & Equipment';
      contentEl.innerHTML = `
        <div class="tp-section">
          <div class="tp-subhead">Armor Proficiencies</div>
          <div class="tp-text">${escapeHtml(classData.armor || 'None')}</div>
        </div>
        <div class="tp-section">
          <div class="tp-subhead">Weapon Proficiencies</div>
          <div class="tp-text">${escapeHtml(classData.weapons || 'None')}</div>
        </div>
        <div class="tp-section">
          <div class="tp-subhead">Starting Equipment</div>
