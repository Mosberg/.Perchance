        <script>
            // Declarative Perchance Native Plugin Bridge Registry
            const pluginRegistry = {
                ai: ["ai", "pluginAi"],
                textToImage: ["image", "textToImage", "pluginTextToImage"],
            }

            // Capture initial references before any overrides happen
            const initialAi = window.ai || globalThis.ai || globalThis.pluginAi
            const initialImage = window.image || globalThis.image || globalThis.textToImage || globalThis.pluginTextToImage

            Object.entries(pluginRegistry).forEach(([source, targets]) => {
                if (source in globalThis) {
                    targets.forEach((target) => {
                        window[target] = globalThis[source]
                    })
                }
            })

            // Sandbox Environment Sanity Sweep Simulation & Dynamic Interception Layer
            const getRealAi = () => {
                if (typeof initialAi === "function" && initialAi !== wrappedAi) return initialAi
                if (window.root?.ai && typeof window.root.ai === "function") return window.root.ai
                const candidates = [globalThis.ai, globalThis.pluginAi, window.ai, window.pluginAi]
                return candidates.find((c) => typeof c === "function" && c !== wrappedAi) || null
            }

            const wrappedAi = function (prompt, options) {
                const realAi = getRealAi()
                if (realAi) {
                    console.log("[ImageGlitch Bridge] Routing to real Platform AI...")
                    return realAi(prompt, options)
                }
                
                console.warn("[ImageGlitch Bridge] Platform AI namespace not found. Falling back to mock simulation layer...")
                return new Promise((resolve) => {
                    setTimeout(() => {
                        const isJson = options && options.startWith === "{"
                        let simulatedPrompt = "A beautiful cat in a sunbeam, digital art."
                        let simulatedNegative = "blurry, low quality, noise"
                        let simulatedThought = "Refining prompt with standard dimensions."

                        if (prompt.includes("scribe")) {
                            simulatedPrompt = "A breathtaking cinematic digital artwork, volumetric fog, neon glow, masterpiece, highly detailed."
                            simulatedThought = "Enhancement Scribe: Selected cinematic lighting, volumetric fog, and neon glow dimensions to enhance depth."
                            simulatedNegative = "blurry, low quality, deformed, pixelated"
                        } else if (prompt.includes("chaos")) {
                            simulatedPrompt = "A chaotic dreamscape, surreal pixel sorting, deep focus, neon palette, analog film style, glitched mutations."
                            simulatedThought = "Chaos Goblin: Hijacked subject into a chaotic dreamscape with pixel sorting mutation."
                            simulatedNegative = "clean, sharp photo, realistic rendering"
                        } else if (prompt.includes("transfigure")) {
                            simulatedPrompt = "Transfigured version of the image with elements mutated into a digital glitch."
                            simulatedThought = "Transfiguration Alchemist: Swapped target style with digital glitch, preserving base composition."
                            simulatedNegative = "unaltered scene, static style"
                        }

                        if (isJson) {
                            const jsonContent = JSON.stringify({
                                _thought_process: simulatedThought,
                                prompt: simulatedPrompt,
                                negativePrompt: simulatedNegative
                            }, null, 2)
                            
                            // Perchance String object simulation
                            const resultStr = "{" + jsonContent.substring(1)
                            const resultObj = Object.assign(new String(resultStr), {
                                text: resultStr,
                                generatedText: jsonContent.substring(1)
                            })
                            resolve(resultObj)
                        } else {
                            const simulatedText = `Prompt: ${simulatedPrompt}`
                            const resultObj = Object.assign(new String(simulatedText), {
                                text: simulatedText,
                                generatedText: simulatedText
                            })
                            resolve(resultObj)
                        }
                    }, 1000)
                })
            }

            const getRealImage = () => {
                if (typeof initialImage === "function" && initialImage !== wrappedImage) return initialImage
                if (window.root?.textToImage && typeof window.root.textToImage === "function") return window.root.textToImage
                if (window.root?.image && typeof window.root.image === "function") return window.root.image
                const candidates = [
                    globalThis.image, globalThis.textToImage, globalThis.pluginTextToImage,
                    window.image, window.textToImage, window.pluginTextToImage
                ]
                return candidates.find((c) => typeof c === "function" && c !== wrappedImage) || null
            }

            const wrappedImage = function (options) {
                const realImage = getRealImage()
                if (realImage) {
                    console.log("[ImageGlitch] Routing to real Platform Image generation...")
                    return realImage(options)
                }

                console.warn("[ImageGlitch] Platform Image generation namespace not found. Falling back to mock simulation layer...")
                setTimeout(() => {
                    const canvas = document.createElement("canvas")
                    const [w, h] = (options.resolution || "768x768").split("x").map(Number)
                    canvas.width = w || 768
                    canvas.height = h || 768
                    const ctx = canvas.getContext("2d")
                    
                    const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height)
                    gradient.addColorStop(0, "#0f172a")
                    gradient.addColorStop(0.5, "#312e81")
                    gradient.addColorStop(1, "#581c87")
                    ctx.fillStyle = gradient
                    ctx.fillRect(0, 0, canvas.width, canvas.height)

                    ctx.strokeStyle = "rgba(99, 102, 241, 0.2)"
                    ctx.lineWidth = 2
                    for (let i = 0; i < canvas.width; i += 40) {
                        ctx.beginPath()
                        ctx.moveTo(i, 0)
                        ctx.lineTo(i, canvas.height)
                        ctx.stroke()
                    }
                    for (let j = 0; j < canvas.height; j += 40) {
                        ctx.beginPath()
                        ctx.moveTo(0, j)
                        ctx.lineTo(canvas.width, j)
                        ctx.stroke()
                    }

                    ctx.fillStyle = "rgba(236, 72, 153, 0.4)"
                    ctx.fillRect(canvas.width * 0.15, canvas.height * 0.35, canvas.width * 0.4, canvas.height * 0.05)
                    ctx.fillStyle = "rgba(6, 182, 212, 0.4)"
                    ctx.fillRect(canvas.width * 0.5, canvas.height * 0.55, canvas.width * 0.35, canvas.height * 0.07)

                    ctx.strokeStyle = "rgba(255, 255, 255, 0.3)"
                    ctx.strokeRect(10, 10, canvas.width - 20, canvas.height - 20)

                    ctx.fillStyle = "#ffffff"
                    ctx.font = "bold 20px monospace"
                    ctx.fillText("IMAGEGLITCH SIMULATED GENERATION", 30, 50)
                    
                    ctx.fillStyle = "#cbd5e1"
                    ctx.font = "14px monospace"
                    ctx.fillText(`Seed: ${options.seed}`, 30, 90)
                    ctx.fillText(`Resolution: ${options.resolution}`, 30, 115)
                    ctx.fillText(`Creativity: ${options.guidanceScale}`, 30, 140)
                    
                    ctx.fillStyle = "#38bdf8"
                    ctx.font = "italic 16px monospace"
                    const promptText = "Prompt: " + (options.prompt || "")
                    const words = promptText.split(" ")
                    let line = ""
                    let y = 180
                    const maxWidth = canvas.width - 60
                    const lineHeight = 22
                    
                    for (let n = 0; n < words.length; n++) {
                        const testLine = line + words[n] + " "
                        const metrics = ctx.measureText(testLine)
                        const testWidth = metrics.width
                        if (testWidth > maxWidth && n > 0) {
                            ctx.fillText(line, 30, y)
                            line = words[n] + " "
                            y += lineHeight
                        } else {
                            line = testLine
                        }
                    }
                    ctx.fillText(line, 30, y)

                    if (typeof options.onFinish === "function") {
                        options.onFinish({ canvas: canvas })
                    }
                }, 800)
            }

            // Bind wrappers to all registered bridge namespaces
            window.ai = wrappedAi
            window.pluginAi = wrappedAi
            window.image = wrappedImage
            window.textToImage = wrappedImage
            window.pluginTextToImage = wrappedImage
        </script>
    </body>
