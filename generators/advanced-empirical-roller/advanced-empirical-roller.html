<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>advanced-empirical-roller — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<style>
  /* Dark Mode Foundation */
  body {
    margin: 0;
    padding: 0;
    background-color: #121212;
    color: #ffffff;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  .roller-container {
    background-color: #1e1e24;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 30px;
    width: 90%;
    max-width: 500px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    text-align: center;
  }

  .header {
    font-size: 1.2rem;
    color: #a0a0a0;
    margin-bottom: 25px;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 600;
  }

  /* Input Controls */
  .controls {
    display: flex;
    justify-content: center;
    gap: 30px;
    margin-bottom: 25px;
  }

  .control-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .control-group label {
    font-size: 0.85rem;
    color: #a0a0a0;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .control-group input {
    background: #0d0d0f;
    border: 1px solid #444;
    color: #fff;
    padding: 10px;
    border-radius: 6px;
    width: 80px;
    text-align: center;
    font-size: 1.3rem;
    font-weight: bold;
    transition: border 0.2s ease;
  }

  .control-group input:focus {
    outline: none;
    border-color: #f39c12;
  }

  /* Output Display Area */
  .display-box {
    background-color: #0d0d0f;
    border-radius: 8px;
    border: 1px inset #2a2a2a;
    padding: 20px;
    margin-bottom: 25px;
  }

  .die-label {
    font-size: 1rem;
    color: #666;
    margin-bottom: 5px;
  }

  .result {
    font-size: 4.5rem;
    font-weight: bold;
    color: #f39c12;
    text-shadow: 0 0 15px rgba(243, 156, 18, 0.4);
    line-height: 1;
  }

  /* Dice Button Grid */
  .dice-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    justify-content: center;
  }

  .dice-btn {
    background: #2a2c33;
    color: #fff;
    border: 1px solid #444;
    border-radius: 8px;
    padding: 15px 20px;
    font-size: 1.2rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
    flex: 1 1 calc(33% - 15px);
    min-width: 80px;
  }

  .dice-btn:hover {
    background: #363942;
    border-color: #f39c12;
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(243, 156, 18, 0.2);
  }

  .dice-btn:active {
    transform: translateY(1px);
    box-shadow: 0 2px 5px rgba(243, 156, 18, 0.1);
  }
  
  /* History Log */
  .history-box {
    margin-top: 30px;
    background-color: #121215;
    border: 1px solid #2a2a2a;
    border-radius: 8px;
    padding: 15px;
    text-align: left;
    max-height: 160px;
    overflow-y: auto;
  }
  
  .history-title {
    font-size: 0.85rem;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 15px;
    border-bottom: 1px solid #2a2a2a;
    padding-bottom: 5px;
  }

  /* Custom scrollbar for history */
  .history-box::-webkit-scrollbar { width: 8px; }
  .history-box::-webkit-scrollbar-track { background: #121215; }
  .history-box::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
  .history-box::-webkit-scrollbar-thumb:hover { background: #555; }
</style>

<div class="roller-container">
  <div class="header">Advanced Empirical Roller</div>
  
  <div class="controls">
    <div class="control-group">
      <label># of Dice</label>
      <input type="number" value="1" min="1" oninput="window.numDice = this.value">
    </div>
    <div class="control-group">
      <label>Modifier</label>
      <input type="number" value="0" oninput="window.modifier = this.value">
    </div>
  </div>

  <div class="display-box">
    <div class="die-label">Result</div>
    <div class="result">[lastResult == 0 ? "-" : lastResult]</div>
  </div>

  <div class="dice-grid">
    <button class="dice-btn" onclick="doRoll('d4'); update()">D4</button>
    <button class="dice-btn" onclick="doRoll('d6'); update()">D6</button>
    <button class="dice-btn" onclick="doRoll('d8'); update()">D8</button>
    <button class="dice-btn" onclick="doRoll('d10'); update()">D10</button>
    <button class="dice-btn" onclick="doRoll('d12'); update()">D12</button>
    <button class="dice-btn" onclick="doRoll('d20'); update()">D20</button>
    <button class="dice-btn" onclick="doRoll('d100'); update()" style="flex-basis: 100%;">D100</button>
  </div>
  
  <div class="history-box">
    <div class="history-title">Roll History</div>
    <div id="historyContent">[displayHistory]</div>
  </div>
</div>
</body>
</html>
