<body>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0612; color:#fff; font-family:'Trebuchet MS',sans-serif; overflow:hidden; }
  body { text-align:center; }
  #wrap { position:relative; width:100vw; height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  #hud {
    position:absolute; top:0; left:0; right:0; display:flex; justify-content:space-between; align-items:center;
    padding:8px 16px; box-sizing:border-box; z-index:5; pointer-events:none;
    font-size:18px; font-weight:bold; text-shadow:0 2px 6px #000;
  }
  #hud .left, #hud .right { display:flex; gap:18px; align-items:center; }
  .pill { background:rgba(0,0,0,.45); border:1px solid rgba(255,215,80,.4); border-radius:20px; padding:4px 14px; }
  #cashPill { color:#ffd84d; }
  #livesPill { color:#ff6fae; }
  #levelPill { color:#9be7ff; }
  #comboPill { color:#fff; opacity:.85; }
  canvas { display:block; background:linear-gradient(#1a0d2e 0%, #2d0f3a 60%, #4a1240 100%); image-rendering:pixelated; box-shadow:0 0 60px rgba(255,80,160,.25) inset; }
  #titleScreen, #gameOverScreen, #levelScreen {
    position:absolute; inset:0; z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at center, rgba(60,10,50,.6), rgba(0,0,0,.85));
    gap:14px; padding:20px; box-sizing:border-box;
  }
  .bigTitle { font-size:clamp(40px,10vw,90px); font-weight:900; letter-spacing:2px;
    background:linear-gradient(90deg,#ffd84d,#ff6fae,#9be7ff,#ffd84d);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 30px rgba(255,111,174,.5); margin:0;
    animation:shimmer 3s linear infinite; background-size:200% auto;
  }
  @keyframes shimmer { to { background-position:200% center; } }
  .subBy { font-size:16px; letter-spacing:6px; color:#ffd84d; opacity:.9; margin:-8px 0 8px; }
  .blurb { max-width:460px; color:#ddd; font-size:15px; line-height:1.5; }
  .startBtn {
    font-size:22px; font-weight:bold; padding:14px 40px; border:none; cursor:pointer; border-radius:40px;
    background:linear-gradient(135deg,#ff3d8a,#ffd84d); color:#3a0a2a;
    box-shadow:0 6px 0 #7a1a4a, 0 10px 30px rgba(255,60,140,.5);
    transition:transform .08s, box-shadow .08s;
  }
  .startBtn:active { transform:translateY(4px); box-shadow:0 2px 0 #7a1a4a, 0 4px 15px rgba(255,60,140,.5); }
  .controls { display:flex; gap:18px; flex-wrap:wrap; justify-content:center; margin-top:10px; font-size:13px; color:#bbb; }
  .controls kbd { background:#222; border:1px solid #555; border-radius:5px; padding:2px 8px; font-family:monospace; color:#ffd84d; }
  .hidden { display:none !important; }
  #msgBig { font-size:clamp(34px,8vw,64px); font-weight:900; margin:0;
    background:linear-gradient(90deg,#ffd84d,#ff6fae); -webkit-background-clip:text; background-clip:text; color:transparent; }
  #msgSub { color:#ccc; font-size:16px; }
  #danceTag { position:absolute; bottom:8px; left:0; right:0; text-align:center; color:rgba(255,216,77,.6); font-size:13px; letter-spacing:2px; z-index:4; pointer-events:none; }
</style>

<div id="wrap">
  <div id="hud" class="hidden">
    <div class="left">
      <span class="pill" id="cashPill">$0</span>
      <span class="pill" id="comboPill">x1</span>
    </div>
    <div class="right">
      <span class="pill" id="levelPill">Stage 1</span>
      <span class="pill" id="livesPill">Hearts 3</span>
    </div>
  </div>
  <div id="danceTag" class="hidden"></div>
  <canvas id="game"></canvas>

  <div id="titleScreen">
    <h1 class="bigTitle">CashBunny</h1>
    <div class="subBy">— A 4BDN GAME —</div>
    <div class="blurb">Strut the stage, snatch the flying cash, and don't miss a beat. Hit the pole for a spin-boost and chain combos for fat stacks!</div>
    <button class="startBtn" id="startBtn">START SHOW</button>
    <div class="controls">
      <span><kbd>A</kbd>/<kbd>D</kbd> or <kbd>←</kbd>/<kbd>→</kbd> Move</span>
      <span><kbd>Space</kbd> / <kbd>W</kbd> / <kbd>↑</kbd> Jump (double!)</span>
      <span><kbd>P</kbd> Pause</span>
    </div>
  </div>

  <div id="levelScreen" class="hidden">
    <div id="msgBig"></div>
    <div id="msgSub"></div>
    <button class="startBtn" id="nextBtn">NEXT STAGE</button>
  </div>

  <div id="gameOverScreen" class="hidden">
    <div id="msgBig">SHOW'S OVER</div>
    <div id="msgSub"></div>
    <button class="startBtn" id="retryBtn">ENCORE</button>
  </div>
</div>

<script type="module">
const CFG = {
  gravity: root.gameConfig.gravity,
  jumpPower: root.gameConfig.jumpPower,
  moveSpeed: root.gameConfig.moveSpeed,
  airControl: root.gameConfig.airControl,
  startLives: root.gameConfig.startLives,
  cashPerLevel: root.gameConfig.cashPerLevel,
  title: root.gameConfig.title,
  author: root.gameConfig.author,
};
const TIPS = root.tip.selectAll.map(t => t.evaluateItem);
const DANCE = root.danceMove.selectAll.map(t => t.evaluateItem);

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');
const cashPill = document.getElementById('cashPill');
const comboPill = document.getElementById('comboPill');
const livesPill = document.getElementById('livesPill');
const levelPill = document.getElementById('levelPill');
const danceTag = document.getElementById('danceTag');
const titleScreen = document.getElementById('titleScreen');
const levelScreen = document.getElementById('levelScreen');
const gameOverScreen = document.getElementById('gameOverScreen');
const msgBig = document.getElementById('msgBig');
const msgSub = document.getElementById('msgSub');

let W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);
function resize() {
  W = window.innerWidth; H = window.innerHeight;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  canvas.width = W * DPR; canvas.height = H * DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize); resize();

// ---------- Input ----------
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.code === 'KeyP' && state === 'play') togglePause();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
// touch: left half = move, right half = jump
let touchLeft = false, touchRight = false;
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.clientX < W/2) touchLeft = true; else touchRight = true;
  }
}, {passive:false});
canvas.addEventListener('touchend', e => {
  e.preventDefault();
  let l=false,r=false;
  for (const t of e.touches) { if (t.clientX < W/2) l=true; else r=true; }
  touchLeft=l; touchRight=r;
}, {passive:false});

function leftDown() { return keys['ArrowLeft']||keys['KeyA']||touchLeft; }
function rightDown() { return keys['ArrowRight']||keys['KeyD']||(touchLeft && false); }
// simpler: separate left/right via touch position needs both; use two-thirds split
function moveDir() {
  let d = 0;
  if (keys['ArrowLeft']||keys['KeyA']) d -= 1;
  if (keys['ArrowRight']||keys['KeyD']) d += 1;
  if (touchLeft) d -= 1;
  if (touchRight) d += 1;
  return Math.max(-1, Math.min(1, d));
}
function jumpPressed() { return keys['Space']||keys['ArrowUp']||keys['KeyW']||touchRight; }

// ---------- Game state ----------
let state = 'title'; // title, play, pause, level, gameover
let player, platforms, cash, poles, particles, floats;
let cameraX, level, lives, cashTotal, cashThisLevel, combo, comboTimer, neededCash;
let lastTime = 0;
let bgStars = [];
let danceTagTimer = 0;

function rand(a,b){ return a + Math.random()*(b-a); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function initStars() {
  bgStars = [];
  for (let i=0;i<80;i++) bgStars.push({x:rand(0,W*2), y:rand(0,H), r:rand(0.5,2), s:rand(0.1,0.5), tw:rand(0,Math.PI*2)});
}

function startGame() {
  level = 1; lives = CFG.startLives; cashTotal = 0;
  titleScreen.classList.add('hidden');
  gameOverScreen.classList.add('hidden');
  levelScreen.classList.add('hidden');
  hud.classList.remove('hidden');
  danceTag.classList.remove('hidden');
  initStars();
  loadLevel();
  state = 'play';
  lastTime = performance.now();
  requestAnimationFrame(loop);
}

function loadLevel() {
  neededCash = CFG.cashPerLevel + (level-1)*3;
  cashThisLevel = 0; combo = 1; comboTimer = 0;
  platforms = []; cash = []; poles = []; particles = []; floats = [];

  // ground + procedural platforms scrolling right
  const groundY = H - 60;
  let x = 0;
  const totalLen = W * (3 + level*0.5);
  // base ground with gaps
  while (x < totalLen) {
    const segLen = rand(180, 360);
    platforms.push({x, y: groundY, w: segLen, h: 60, type:'ground'});
    x += segLen + rand(70, 130); // gap
  }
  // floating platforms
  const platCount = 8 + level*2;
  for (let i=0;i<platCount;i++) {
    const px = rand(60, totalLen-120);
    const py = rand(H*0.25, groundY-70);
    const pw = rand(80, 160);
    platforms.push({x:px, y:py, w:pw, h:18, type:'float'});
  }
  // poles (boost) — vertical poles that give a spin boost on touch
  const poleCount = 2 + Math.floor(level/2);
  for (let i=0;i<poleCount;i++) {
    const px = rand(120, totalLen-120);
    poles.push({x:px, y:groundY-180, w:8, h:180, used:false, spin:0});
  }
  // cash scattered
  const cashCount = neededCash + 6;
  for (let i=0;i<cashCount;i++) {
    const golden = Math.random() < 0.12;
    let cx, cy, tries=0, ok=false;
    while (tries++ < 40) {
      cx = rand(40, totalLen-40);
      cy = rand(H*0.2, groundY-30);
      ok = platforms.some(p => cx>p.x+10 && cx<p.x+p.w-10 && cy>p.y-60 && cy<p.y-10) || true;
      break;
    }
    cash.push({x:cx, y:cy, r: golden?14:11, golden, bob:rand(0,Math.PI*2), taken:false});
  }
  // player
  player = { x: 60, y: groundY-60, w: 30, h: 54, vx:0, vy:0, onGround:false, jumps:0, facing:1, anim:0, spinBoost:0, spin:0, invuln:0 };
  cameraX = 0;
  showDanceTag(pick(DANCE) + "!");
}

function showDanceTag(txt) {
  danceTag.textContent = txt;
  danceTagTimer = 2.2;
}

function spawnParticle(x,y,opts={}) {
  particles.push({x,y, vx:rand(-2,2), vy:rand(-4,-1), life:rand(0.4,0.9), age:0, ...opts});
}
function spawnFloat(x,y,text,color) {
  floats.push({x,y,text,color,life:1.0});
}

// ---------- Loop ----------
function loop(now) {
  if (state !== 'play') return;
  const dt = Math.min(0.033, (now - lastTime)/1000);
  lastTime = now;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

function togglePause() {
  if (state === 'play') { state='pause'; }
  else if (state === 'pause') { state='play'; lastTime=performance.now(); requestAnimationFrame(loop); }
}

function update(dt) {
  // input
  const dir = moveDir();
  const accel = player.onGround ? 1 : CFG.airControl;
  player.vx += dir * CFG.moveSpeed * 0.4 * accel;
  player.vx = Math.max(-CFG.moveSpeed, Math.min(CFG.moveSpeed, player.vx));
  if (dir === 0) player.vx *= player.onGround ? 0.75 : 0.95;
  if (dir !== 0) player.facing = dir;

  // jump (double jump)
  if (jumpPressed() && player.jumps < 2) {
    player.vy = -CFG.jumpPower * (player.jumps===0?1:0.85);
    player.jumps++;
    player.onGround = false;
    if (player.jumps === 2) {
      // spin flip particle
      for (let i=0;i<8;i++) spawnParticle(player.x+player.w/2, player.y+player.h/2, {color:'#ffd84d', r:rand(2,4)});
    }
  }
  // variable jump height
  if (!jumpPressed() && player.vy < -4) player.vy *= 0.85;

  // gravity
  player.vy += CFG.gravity;
  if (player.vy > 16) player.vy = 16;

  // spin boost decay
  if (player.spinBoost > 0) { player.spinBoost -= dt; player.spin += dt*18; }
  else player.spin *= 0.9;

  if (player.invuln > 0) player.invuln -= dt;

  // horizontal move + collide
  player.x += player.vx;
  for (const p of platforms) {
    if (rectsOverlap(player, p)) {
      if (player.vx > 0) player.x = p.x - player.w;
      else if (player.vx < 0) player.x = p.x + p.w;
      player.vx = 0;
    }
  }
  // vertical move + collide
  player.y += player.vy;
  player.onGround = false;
  for (const p of platforms) {
    if (rectsOverlap(player, p)) {
      if (player.vy > 0) { player.y = p.y - player.h; player.vy = 0; player.onGround = true; player.jumps = 0; }
      else if (player.vy < 0) { player.y = p.y + p.h; player.vy = 0; }
    }
  }

  // world bounds (left wall)
  if (player.x < 0) { player.x = 0; player.vx = 0; }

  // fall off bottom = lose life
  if (player.y > H + 80) {
    loseLife();
    return;
  }

  // cash pickup
  for (const c of cash) {
    if (c.taken) continue;
    c.bob += dt*3;
    const cx = c.x, cy = c.y + Math.sin(c.bob)*4;
    if (Math.abs((player.x+player.w/2)-cx) < c.r+12 && Math.abs((player.y+player.h/2)-cy) < c.r+18) {
      c.taken = true;
      const value = c.golden ? 5 : 1;
      comboTimer = 2.0; combo = Math.min(combo+1, 10);
      const total = value * combo;
      cashTotal += total; cashThisLevel += value;
      spawnFloat(cx, cy, '+$'+total, c.golden?'#ffd84d':'#9bff9b');
      for (let i=0;i<(c.golden?14:7);i++) spawnParticle(cx, cy, {color:c.golden?'#ffd84d':'#7CFC00', r:rand(2,5)});
      if (cashThisLevel >= neededCash) {
        completeLevel();
        return;
      }
    }
  }

  // poles
  for (const pl of poles) {
    pl.spin += dt * (pl.used?6:2);
    if (!pl.used && rectsOverlap(player, {x:pl.x-6,y:pl.y,w:pl.w+12,h:pl.h})) {
      pl.used = true;
      player.spinBoost = 0.8;
      player.vy = -CFG.jumpPower*1.3;
      player.jumps = 1;
      showDanceTag(pick(DANCE) + "! POLE BOOST!");
      for (let i=0;i<20;i++) spawnParticle(pl.x, pl.y+rand(0,pl.h), {color:'#ff6fae', r:rand(2,5)});
      spawnFloat(pl.x, pl.y-10, 'SPIN!', '#ff6fae');
    }
  }

  // combo timer
  if (comboTimer > 0) { comboTimer -= dt; if (comboTimer <= 0) combo = 1; }

  // particles
  for (const p of particles) { p.age += dt; p.x += p.vx; p.y += p.vy; p.vy += 0.2; }
  particles = particles.filter(p => p.age < p.life);
  for (const f of floats) { f.y -= 30*dt; f.life -= dt; }
  floats = floats.filter(f => f.life > 0);

  // camera follows player
  const targetCam = player.x - W*0.35;
  cameraX += (targetCam - cameraX) * 0.1;
  if (cameraX < 0) cameraX = 0;

  // dance tag fade
  if (danceTagTimer > 0) { danceTagTimer -= dt; if (danceTagTimer <= 0) danceTag.textContent=''; }

  // anim
  player.anim += dt * (Math.abs(player.vx)*0.5 + 2);

  // bg stars twinkle
  for (const s of bgStars) { s.tw += dt*2; s.x -= s.s; if (s.x < cameraX*0.3) s.x += W*2; }

  updateHUD();
}

function rectsOverlap(a,b) {
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}

function loseLife() {
  lives--;
  combo = 1;
  for (let i=0;i<25;i++) spawnParticle(player.x, player.y, {color:'#ff3d8a', r:rand(2,5)});
  if (lives <= 0) {
    gameOver();
  } else {
    // respawn at nearest platform behind
    let best = platforms[0];
    for (const p of platforms) if (p.x < player.x && p.x > best.x) best = p;
    player.x = best.x + 20; player.y = best.y - player.h - 10;
    player.vx = 0; player.vy = 0; player.invuln = 1.5; player.jumps = 0;
    showDanceTag("OOF! Keep going!");
  }
}

function completeLevel() {
  state = 'level';
  msgBig.textContent = 'STAGE ' + level + ' CLEARED!';
  msgSub.textContent = 'Cash this stage: +$' + (cashThisLevel*1) + '   Total: $' + cashTotal + '   Lives: ' + lives;
  levelScreen.classList.remove('hidden');
}

function nextLevel() {
  level++;
  loadLevel();
  state = 'play'; lastTime = performance.now();
  levelScreen.classList.add('hidden');
  requestAnimationFrame(loop);
}

function gameOver() {
  state = 'gameover';
  msgBig.textContent = "SHOW'S OVER";
  msgSub.textContent = 'Final cash: $' + cashTotal + '   Stages cleared: ' + (level-1);
  gameOverScreen.classList.remove('hidden');
  hud.classList.add('hidden');
  danceTag.classList.add('hidden');
}

function updateHUD() {
  cashPill.textContent = '$' + cashTotal;
  comboPill.textContent = 'x' + combo;
  livesPill.textContent = 'Hearts ' + lives;
  levelPill.textContent = 'Stage ' + level;
}

// ---------- Render ----------
function render() {
  ctx.clearRect(0,0,W,H);
  // bg stars (parallax)
  for (const s of bgStars) {
    const sx = s.x - cameraX*0.3;
    const a = 0.4 + Math.sin(s.tw)*0.3;
    ctx.fillStyle = 'rgba(255,255,200,'+a.toFixed(2)+')';
    ctx.beginPath(); ctx.arc(sx, s.y, s.r, 0, Math.PI*2); ctx.fill();
  }
  // distant stage lights
  for (let i=0;i<6;i++) {
    const lx = (i*W/4 - cameraX*0.15) % (W*1.5);
    const grad = ctx.createLinearGradient(lx, 0, lx, H);
    grad.addColorStop(0, 'rgba(255,80,160,0.12)');
    grad.addColorStop(1, 'rgba(255,80,160,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(lx, 0); ctx.lineTo(lx+120, 0); ctx.lineTo(lx+60, H); ctx.closePath(); ctx.fill();
  }

  ctx.save();
  ctx.translate(-cameraX, 0);

  // platforms
  for (const p of platforms) {
    if (p.x+p.w < cameraX-50 || p.x > cameraX+W+50) continue;
    if (p.type === 'ground') {
      const grad = ctx.createLinearGradient(0,p.y,0,p.y+p.h);
      grad.addColorStop(0,'#5a1a4a'); grad.addColorStop(1,'#2a0a22');
      ctx.fillStyle = grad;
      roundRect(p.x,p.y,p.w,p.h,8); ctx.fill();
      // neon top edge
      ctx.fillStyle = '#ff6fae';
      ctx.fillRect(p.x, p.y, p.w, 3);
      // sparkle dots
      ctx.fillStyle = 'rgba(255,216,77,.3)';
      for (let i=0;i<p.w;i+=30) ctx.fillRect(p.x+i+10, p.y+8, 2, 2);
    } else {
      const grad = ctx.createLinearGradient(0,p.y,0,p.y+p.h);
      grad.addColorStop(0,'#7a2a5a'); grad.addColorStop(1,'#3a0a30');
      ctx.fillStyle = grad;
      roundRect(p.x,p.y,p.w,p.h,6); ctx.fill();
      ctx.fillStyle = '#ffd84d';
      ctx.fillRect(p.x, p.y, p.w, 2);
    }
  }

  // poles
  for (const pl of poles) {
    if (pl.x < cameraX-50 || pl.x > cameraX+W+50) continue;
    ctx.save();
    ctx.translate(pl.x+pl.w/2, pl.y+pl.h/2);
    ctx.rotate(Math.sin(pl.spin)*0.05);
    const grad = ctx.createLinearGradient(0,-pl.h/2,0,pl.h/2);
    grad.addColorStop(0,'#ddd'); grad.addColorStop(0.5,'#fff'); grad.addColorStop(1,'#999');
    ctx.fillStyle = grad;
    roundRect(-pl.w/2,-pl.h/2,pl.w,pl.h,4); ctx.fill();
    // glow if unused
    if (!pl.used) {
      ctx.shadowBlur = 20; ctx.shadowColor = '#ff6fae';
      ctx.fillStyle = 'rgba(255,111,174,0.5)';
      roundRect(-pl.w/2,-pl.h/2,pl.w,pl.h,4); ctx.fill();
      ctx.shadowBlur = 0;
    }
    ctx.restore();
  }

  // cash
  for (const c of cash) {
    if (c.taken) continue;
    if (c.x < cameraX-30 || c.x > cameraX+W+30) continue;
    const cy = c.y + Math.sin(c.bob)*4;
    ctx.save();
    ctx.translate(c.x, cy);
    ctx.rotate(Math.sin(c.bob*0.7)*0.3);
    if (c.golden) { ctx.shadowBlur=18; ctx.shadowColor='#ffd84d'; }
    // dollar bill
    ctx.fillStyle = c.golden ? '#ffd84d' : '#7CFC00';
    roundRect(-c.r, -c.r*0.6, c.r*2, c.r*1.2, 2); ctx.fill();
    ctx.fillStyle = c.golden ? '#a06a00' : '#1a5a1a';
    ctx.font = 'bold '+(c.r*1.1)+'px monospace';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('$', 0, 1);
    ctx.restore();
  }

  // particles
  for (const p of particles) {
    const a = 1 - p.age/p.life;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color || '#fff';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r||3, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // player — the CashBunny
  drawPlayer();

  // floats
  for (const f of floats) {
    ctx.globalAlpha = Math.min(1, f.life*2);
    ctx.fillStyle = f.color;
    ctx.font = 'bold 18px Trebuchet MS';
    ctx.textAlign='center';
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;

  ctx.restore();

  // pause overlay
  if (state === 'pause') {
    ctx.fillStyle = 'rgba(0,0,0,.6)';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle = '#ffd84d'; ctx.font='bold 48px Trebuchet MS'; ctx.textAlign='center';
    ctx.fillText('PAUSED', W/2, H/2);
    ctx.fillStyle='#ccc'; ctx.font='16px Trebuchet MS';
    ctx.fillText('Press P to resume', W/2, H/2+30);
  }
}

function drawPlayer() {
  const blink = player.invuln > 0 && Math.floor(player.invuln*10)%2===0;
  if (blink) { ctx.globalAlpha = 0.4; }
  ctx.save();
  const cx = player.x + player.w/2;
  const cy = player.y + player.h/2;
  ctx.translate(cx, cy);
  if (player.spinBoost > 0) ctx.rotate(player.spin);
  else if (player.onGround) ctx.scale(player.facing, 1);
  else { ctx.scale(player.facing, 1); ctx.rotate(Math.max(-0.4, Math.min(0.4, player.vy*0.03))); }

  const w = player.w, h = player.h;
  // legs (running anim)
  const legSwing = player.onGround ? Math.sin(player.anim)*5 : 0;
  ctx.strokeStyle = '#3a0a2a'; ctx.lineWidth = 6; ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(-4, h/2-6); ctx.lineTo(-6+legSwing, h/2+8);
  ctx.moveTo(4, h/2-6); ctx.lineTo(6-legSwing, h/2+8);
  ctx.stroke();
  // heels
  ctx.fillStyle = '#ff3d8a';
  ctx.fillRect(-10+legSwing, h/2+5, 5, 4);
  ctx.fillRect(4-legSwing, h/2+5, 5, 4);

  // body — sparkly leotard
  const bodyGrad = ctx.createLinearGradient(0,-h/4,0,h/2);
  bodyGrad.addColorStop(0,'#ff6fae'); bodyGrad.addColorStop(1,'#c01a6a');
  ctx.fillStyle = bodyGrad;
  roundRect(-w/2+4, -h/4, w-8, h*0.6, 8); ctx.fill();
  // sparkle
  ctx.fillStyle = '#ffd84d';
  for (let i=0;i<4;i++) {
    const sx = -w/2+8 + (i*7);
    ctx.fillRect(sx, -h/4+4 + Math.sin(player.anim+i)*3, 2, 2);
  }

  // arms
  ctx.strokeStyle = '#f8c8a0'; ctx.lineWidth=5;
  ctx.beginPath();
  ctx.moveTo(-w/2+6, -h/8); ctx.lineTo(-w/2-2, h/8 + (player.onGround?Math.sin(player.anim)*4:0));
  ctx.moveTo(w/2-6, -h/8); ctx.lineTo(w/2+2, h/8 - (player.onGround?Math.sin(player.anim)*4:0));
  ctx.stroke();

  // head
  ctx.fillStyle = '#f8c8a0';
  ctx.beginPath(); ctx.arc(0, -h/2+6, 11, 0, Math.PI*2); ctx.fill();
  // hair (long, flowing)
  ctx.fillStyle = '#8b3a1a';
  ctx.beginPath();
  ctx.moveTo(-11, -h/2+2);
  ctx.quadraticCurveTo(-16, -h/2+14, -10, h/4);
  ctx.quadraticCurveTo(-6, h/8, -2, -h/2+2);
  ctx.fill();
  // bunny ears headband
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.ellipse(-5, -h/2-4, 3, 8, -0.3, 0, Math.PI*2); ctx.fill();
  ctx.beginPath();
  ctx.ellipse(5, -h/2-4, 3, 8, 0.3, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ff6fae';
  ctx.fillRect(-7, -h/2+1, 14, 2);
  // face
  ctx.fillStyle = '#3a0a2a';
  ctx.beginPath(); ctx.arc(-3, -h/2+6, 1.5, 0, Math.PI*2); ctx.arc(3, -h/2+6, 1.5, 0, Math.PI*2); ctx.fill();
  // lips
  ctx.fillStyle = '#ff1a5a';
  ctx.fillRect(-2, -h/2+10, 4, 1.5);

  ctx.restore();
  ctx.globalAlpha = 1;
}

function roundRect(x,y,w,h,r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

// ---------- Buttons ----------
document.getElementById('startBtn').onclick = startGame;
document.getElementById('retryBtn').onclick = startGame;
document.getElementById('nextBtn').onclick = nextLevel;

// title screen idle animation: draw bg stars
initStars();
function titleIdle() {
  if (state !== 'title') return;
  ctx.clearRect(0,0,W,H);
  for (const s of bgStars) { s.tw += 0.05; s.x -= s.s*0.5; if (s.x<0) s.x=W; }
  for (const s of bgStars) {
    const a = 0.4 + Math.sin(s.tw)*0.3;
    ctx.fillStyle = 'rgba(255,255,200,'+a.toFixed(2)+')';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
  }
  requestAnimationFrame(titleIdle);
}
titleIdle();
window.__game = { startGame };
</script>
