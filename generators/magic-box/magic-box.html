<script>
  // ================================================================
  // USER CONFIGURATION - Change this to match your gallery element ID
  // ================================================================
  const GALLERY_ID = "images2kCtn"; // galleryEl Change this to match your image gallery element ID (usually a div)
  
  // ================================================================
  // Main editor state
  // ================================================================
  const editorState = {
    images: [],
    currentImageIndex: -1,
    originalImageData: null,
    history: [], // Array to store filter states history
    historyIndex: -1, // Current position in the history
    splitImages: [] // Array to store split images
  };
  
  // Variables for resolution selection
  let selectionBox = null;
  let isDragging = false;
  let dragOffsetX = 0;
  let dragOffsetY = 0;
  
  // WebGL context for GPU-accelerated filters
  let gl = null;
  let gpuCanvas = null;
  
  // Initialize the editor
  function initImageEditor() {
    setupGalleryObserver();
    initWebGL();
  }
  
  // Initialize WebGL for GPU-intensive filters
  function initWebGL() {
    gpuCanvas = document.createElement('canvas');
    gl = gpuCanvas.getContext('webgl') || gpuCanvas.getContext('experimental-webgl');
    
    if (!gl) {
      console.warn('WebGL not supported. GPU-intensive filters will fall back to slower CPU methods.');
    }
  }
  
  // Function to trigger the file input click
  function uploadImage() {
    imageUploadInput.click();
  }
  
  // Function to handle the selected image file
  function handleImageUpload(event) {
    const file = event.target.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.crossOrigin = "Anonymous";
      img.onload = function() {
        // Add the uploaded image to the editor
        editorState.images.push({
          image: img,
          filters: {
            blur: 0,
            brightness: 100,
            contrast: 100,
            saturation: 100,
            hue: 0,
            grayscale: 0,
            sepia: 0,
            invert: 0,
            opacity: 100,
            threshold: 0,
            temperature: 0,
            vignette: 0
          },
          transformed: false
        });
        
        // Create a thumbnail for the image
        createThumbnail(img, editorState.images.length - 1);
        
        // Select the uploaded image
        selectImage(editorState.images.length - 1);
        
        // Show the editor interface
        editorInterfaceEl.hidden = false;
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
    
    // Reset the file input so the same file can be selected again
    event.target.value = "";
  }
  
  // Watch for images being added to the gallery
  function setupGalleryObserver() {
    const galleryElement = document.getElementById(GALLERY_ID);
    
    if (galleryElement) {
      // Process any existing images
      processExistingImages(galleryElement);
      
      // Set up observer for new images
      const observer = new MutationObserver((mutations) => {
        mutations.forEach((mutation) => {
          if (mutation.type === 'childList' && mutation.addedNodes.length > 0) {
            mutation.addedNodes.forEach((node) => {
              if (node.tagName === 'IMG') {
                addImageToEditor(node);
                addClickHandlerToGalleryImage(node);
              } else if (node.querySelectorAll) {
                const images = node.querySelectorAll('img');
                images.forEach(img => {
                  addImageToEditor(img);
                  addClickHandlerToGalleryImage(img);
                });
              }
            });
          }
        });
      });
      
      observer.observe(galleryElement, { childList: true, subtree: true });
    } else {
      // If gallery doesn't exist yet, retry after a delay
      console.log(`Gallery element with ID "${GALLERY_ID}" not found. Retrying in 1 second...`);
      setTimeout(setupGalleryObserver, 1000);
    }
  }
  
  // Add click handler to original gallery image
  function addClickHandlerToGalleryImage(img) {
    img.addEventListener('click', () => {
      const src = img.src;
      const index = editorState.images.findIndex(item => item.image.src === src);
      if (index !== -1) {
        selectImage(index);
        editorInterfaceEl.hidden = false;
        editorInterfaceEl.scrollIntoView({ behavior: 'smooth' });
      }
    });
    img.style.cursor = 'pointer';
  }
  
  // Process existing images in the gallery
  function processExistingImages(galleryElement) {
    const images = galleryElement.querySelectorAll('img');
    if (images.length > 0) {
      images.forEach(img => {
        addImageToEditor(img);
        addClickHandlerToGalleryImage(img);
      });
    }
  }
  
  // Add an image to the editor
  function addImageToEditor(imgElement) {
    const img = new Image();
    img.crossOrigin = "Anonymous";
    img.src = imgElement.src;
    
    img.onload = function() {
      editorState.images.push({
        image: img,
        filters: {
          blur: 0,
          brightness: 100,
          contrast: 100,
          saturation: 100,
          hue: 0,
          grayscale: 0,
          sepia: 0,
          invert: 0,
          opacity: 100,
          threshold: 0,
          temperature: 0,
          vignette: 0
        },
        transformed: false
      });
      
      createThumbnail(img, editorState.images.length - 1);
      
      if (editorState.images.length === 1) {
        selectImage(0);
        editorInterfaceEl.hidden = false;
      }
    };
    
    img.onerror = function() {
      console.error("Failed to load image:", imgElement.src);
    };
  }
  
  // Create a thumbnail in the editor gallery
  function createThumbnail(img, index) {
    const thumbnail = document.createElement('div');
    thumbnail.className = 'editor-thumbnail';
    thumbnail.innerHTML = `
      <img src="${img.src}" alt="Image ${index + 1}">
      <button class="remove-image-btn" onclick="removeImage(${index}); event.stopPropagation();">✕</button>
    `;
    thumbnail.dataset.index = index;
    
    thumbnail.addEventListener('click', () => {
      selectImage(index);
    });
    
    editorGalleryEl.appendChild(thumbnail);
  }
  
  // Remove an image from the editor
  function removeImage(index) {
    // Remove the image from the editorState
    editorState.images.splice(index, 1);
    
    // Clear the editor gallery and recreate thumbnails
    editorGalleryEl.innerHTML = '';
    editorState.images.forEach((img, i) => {
      createThumbnail(img.image, i);
    });
    
    // If there are no images left, hide the editor interface
    if (editorState.images.length === 0) {
      editorInterfaceEl.hidden = true;
      editorState.currentImageIndex = -1;
      return;
    }
    
    // If the removed image was the current one, select another one
    if (index === editorState.currentImageIndex || editorState.currentImageIndex >= editorState.images.length) {
      selectImage(0);
    } else if (index < editorState.currentImageIndex) {
      // If we removed an image before the current one, adjust the index
      editorState.currentImageIndex--;
      selectImage(editorState.currentImageIndex);
    }
  }
  
  // Delete all thumbnails from the editor gallery
  function deleteAllThumbnails() {
    editorState.images = [];
    editorGalleryEl.innerHTML = '';
    editorState.currentImageIndex = -1;
    editorInterfaceEl.hidden = true;
  }
  
  // Select an image for editing
  function selectImage(index) {
    editorState.currentImageIndex = index;
    
    const thumbnails = document.querySelectorAll('.editor-thumbnail');
    thumbnails.forEach(thumb => {
      thumb.classList.remove('selected');
      if (parseInt(thumb.dataset.index) === index) {
        thumb.classList.add('selected');
      }
    });
    
    loadImageToCanvas(editorState.images[index].image);
    
    // Initialize history with the original image
    editorState.history = [];
    editorState.historyIndex = -1;
    
    const canvas = editorCanvasEl;
    const ctx = canvas.getContext('2d');
    addToHistory(ctx.getImageData(0, 0, canvas.width, canvas.height));
    
    // Remove any existing selection box when switching images
    if (selectionBox) {
      selectionBox.remove();
      selectionBox = null;
      if (resolutionSelect) {
        resolutionSelect.value = "";
      }
    }
  }
  
  // Load an image to the canvas
  function loadImageToCanvas(img) {
    const canvas = editorCanvasEl;
    
    canvas.width = img.width;
    canvas.height = img.height;
    
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    
    editorState.originalImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  }
  
  // Add the current filter state to history
  function addToHistory(imageData) {
    // If we're not at the end of the history, remove the future states
    if (editorState.historyIndex < editorState.history.length - 1) {
      editorState.history = editorState.history.slice(0, editorState.historyIndex + 1);
    }
    
    // Add the new state to history
    editorState.history.push(imageData);
    
    // Limit history to 10 items
    if (editorState.history.length > 10) {
      editorState.history.shift();
      editorState.historyIndex = editorState.history.length - 1;
    } else {
      editorState.historyIndex = editorState.history.length - 1;
    }
  }
  
  // Undo the last filter operation
  function undoFilter() {
    if (editorState.currentImageIndex === -1 || editorState.historyIndex <= 0) return;
    
    editorState.historyIndex--;
    
    const canvas = editorCanvasEl;
    const ctx = canvas.getContext('2d');
    
    // Restore the previous state
    ctx.putImageData(editorState.history[editorState.historyIndex], 0, 0);
  }
  
  // Redo a previously undone filter operation
  function redoFilter() {
    if (editorState.currentImageIndex === -1 || editorState.historyIndex >= editorState.history.length - 1) return;
    
    editorState.historyIndex++;
    
    const canvas = editorCanvasEl;
    const ctx = canvas.getContext('2d');
    
    // Apply the next state
    ctx.putImageData(editorState.history[editorState.historyIndex], 0, 0);
  }
  
  // Reset the current image
  function resetImage() {
    if (editorState.currentImageIndex === -1) return;
    
    editorState.images[editorState.currentImageIndex].filters = {
      blur: 0,
      brightness: 100,
      contrast: 100,
      saturation: 100,
      hue: 0,
      grayscale: 0,
      sepia: 0,
      invert: 0,
      opacity: 100,
      threshold: 0,
      temperature: 0,
      vignette: 0
    };
    
    loadImageToCanvas(editorState.images[editorState.currentImageIndex].image);
    
    // Reset history
    editorState.history = [];
    editorState.historyIndex = -1;
    
    const canvas = editorCanvasEl;
    const ctx = canvas.getContext('2d');
    addToHistory(ctx.getImageData(0, 0, canvas.width, canvas.height));
    
    // Remove any existing selection box when resetting image
    if (selectionBox) {
      selectionBox.remove();
      selectionBox = null;
      resolutionSelect.value = "";
    }
  }
  
  // Prompt for filter value and apply it
  function promptAndApplyFilter(filterType) {
    if (editorState.currentImageIndex === -1) return;
    
    let value, min, max, defaultVal;
    const currentFilters = editorState.images[editorState.currentImageIndex].filters;
    
    switch(filterType) {
      case 'brightness':
        min = 50; max = 150; defaultVal = currentFilters.brightness;
        break;
      case 'contrast':
        min = 50; max = 150; defaultVal = currentFilters.contrast;
        break;
      case 'saturation':
        min = 0; max = 200; defaultVal = currentFilters.saturation;
        break;
      case 'hue':
        min = 0; max = 360; defaultVal = currentFilters.hue;
        break;
      case 'opacity':
        min = 0; max = 100; defaultVal = currentFilters.opacity;
        break;
      case 'threshold':
        min = 0; max = 255; defaultVal = currentFilters.threshold;
        break;
      case 'temperature':
        min = -100; max = 100; defaultVal = currentFilters.temperature;
        break;
    }
    
    value = prompt(`Enter ${filterType} value (${min}-${max}):`, defaultVal);
    if (value !== null) {
      const numValue = parseInt(value, 10);
      if (!isNaN(numValue) && numValue >= min && numValue <= max) {
        applyFilter(filterType, numValue);
      } else {
        alert(`Please enter a valid value between ${min} and ${max}.`);
      }
    }
  }
  
  // Apply a filter based on type and value
  function applyFilter(filterType, value) {
    if (editorState.currentImageIndex === -1) return;
    
    const canvas = editorCanvasEl;
    const ctx = canvas.getContext('2d');
    
    // Update the filter value
    editorState.images[editorState.currentImageIndex].filters[filterType] = value;
    
    // Apply all active filters
    const filters = editorState.images[editorState.currentImageIndex].filters;
    
    // Apply CSS filters first
    const filterString = `
      blur(${filters.blur}px)
      brightness(${filters.brightness}%)
      contrast(${filters.contrast}%)
      saturate(${filters.saturation}%)
      hue-rotate(${filters.hue}deg)
      grayscale(${filters.grayscale}%)
      sepia(${filters.sepia}%)
      invert(${filters.invert}%)
      opacity(${filters.opacity}%)
    `;
    
    // Create a temporary canvas for applying filters
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = canvas.width;
    tempCanvas.height = canvas.height;
    const tempCtx = tempCanvas.getContext('2d');
    
    // Draw the original image to the temp canvas
    tempCtx.putImageData(editorState.originalImageData, 0, 0);
    
    // Apply CSS filters
    ctx.filter = filterString;
    ctx.drawImage(tempCanvas, 0, 0);
    ctx.filter = 'none';
    
    // Apply non-CSS filters manually
    if (filters.threshold > 0) {
      applyThresholdFilter(ctx, canvas.width, canvas.height, filters.threshold);
    }
    
    if (filters.temperature !== 0) {
      applyTemperatureFilter(ctx, canvas.width, canvas.height, filters.temperature);
    }
    
    if (filters.vignette > 0) {
      applyVignetteFilter(ctx, canvas.width, canvas.height, filters.vignette);
    }
    
    // Add the state to history after applying the filter
    addToHistory(ctx.getImageData(0, 0, canvas.width, canvas.height));
  }
  
  // Apply threshold filter
  function applyThresholdFilter(ctx, width, height, threshold) {
    const imageData = ctx.getImageData(0, 0, width, height);
    const data = imageData.data;
    
    for (let i = 0; i < data.length; i += 4) {
      const r = data[i];
      const g = data[i + 1];
      const b = data[i + 2];
      const v = (0.2126 * r + 0.7152 * g + 0.0722 * b >= threshold) ? 255 : 0;
      
      data[i] = data[i + 1] = data[i + 2] = v;
    }
    
    ctx.putImageData(imageData, 0, 0);
  }
  
  // Apply temperature filter (warm/cool)
  function applyTemperatureFilter(ctx, width, height, temperature) {
    const imageData = ctx.getImageData(0, 0, width, height);
    const data = imageData.data;
    const factor = temperature / 100;
    
    for (let i = 0; i < data.length; i += 4) {
      // Add red and reduce blue for warm, or vice versa for cool
      if (factor > 0) {
        data[i] = Math.min(255, data[i] + factor * 50);
        data[i + 2] = Math.max(0, data[i + 2] - factor * 30);
      } else {
        data[i] = Math.max(0, data[i] + factor * 30);
        data[i + 2] = Math.min(255, data[i + 2] - factor * 50);
      }
    }
    
    ctx.putImageData(imageData, 0, 0);
  }
  
  // Apply vignette filter
  function applyVignetteFilter(ctx, width, height, intensity) {
    const centerX = width / 2;
    const centerY = height / 2;
    const radius = Math.min(width, height) * 0.5;
    
    const imageData = ctx.getImageData(0, 0, width, height);
    const data = imageData.data;
    
    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) {
        const index = (y * width + x) * 4;
        
        const dx = (x - centerX) / radius;
        const dy = (y - centerY) / radius;
        const distance = Math.sqrt(dx * dx + dy * dy);
        
        const factor = Math.max(0, 1 - Math.pow(distance, 1.5) * (intensity / 100));
        
        data[index] *= factor;
        data[index + 1] *= factor;
        data[index + 2] *= factor;
      }
    }
    
    ctx.putImageData(imageData, 0, 0);
  }
  
  // Apply blur filter
  function applyBlur(radius) {
    applyFilter('blur', radius);
  }
  
  // Apply grayscale
  function applyGrayscale() {
    const currentValue = editorState.images[editorState.currentImageIndex].filters.grayscale;
    applyFilter('grayscale', currentValue === 0 ? 100 : 0);
  }
  
  // Apply sepia
  function applySepia() {
    const currentValue = editorState.images[editorState.currentImageIndex].filters.sepia;
    applyFilter('sepia', currentValue === 0 ? 100 : 0);
  }
  
  // Apply invert
  function applyInvert() {
    const currentValue = editorState.images[editorState.currentImageIndex].filters.invert;
    applyFilter('invert', currentValue === 0 ? 100 : 0);
  }
  
  // Apply vignette
  function applyVignette() {
    const currentValue = editorState.images[editorState.currentImageIndex].filters.vignette;
    editorState.images[editorState.currentImageIndex].filters.vignette = currentValue === 0 ? 50 : 0;
    applyFilter('vignette', editorState.images[editorState.currentImageIndex].filters.vignette);
  }
  
  // Apply posterize (reduce number of colors)
  function applyPosterize() {
    if (editorState.currentImageIndex === -1) return;
    
    const canvas = editorCanvasEl;
    const ctx = canvas.getContext('2d');
    
    // Get current image data before applying the filter
    const currentImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    
    // Get current image data instead of original
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = imageData.data;
    
    // Set the number of levels
    const levels = 5;
    const step = 255 / (levels - 1);
    
    for (let i = 0; i < data.length; i += 4) {
      data[i] = Math.round(data[i] / step) * step;
      data[i + 1] = Math.round(data[i + 1] / step) * step;
      data[i + 2] = Math.round(data[i + 2] / step) * step;
    }
    
    ctx.putImageData(imageData, 0, 0);
    
    // Add to history
    addToHistory(ctx.getImageData(0, 0, canvas.width, canvas.height));
  }
  
  // Apply noise reduction
  function applyNoiseReduction() {
    if (editorState.currentImageIndex === -1) return;
    
    const canvas = editorCanvasEl;
    const ctx = canvas.getContext('2d');
    
    // Get current image data before applying the filter
    const currentImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    
    // Get current image data instead of original
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const width = canvas.width;
    const height = canvas.height;
    
    // Apply median filter (simple noise reduction)
    const result = applyMedianFilter(imageData, width, height, 1);
    
    // Put the result back on the canvas
    ctx.putImageData(result, 0, 0);
    
    // Add to history
    addToHistory(ctx.getImageData(0, 0, canvas.width, canvas.height));
  }
  
  // Apply a median filter for noise reduction
  function applyMedianFilter(imageData, width, height, radius) {
    const data = imageData.data;
    const result = new ImageData(width, height);
    const resultData = result.data;
    
    // For each pixel (skipping the edges)
    for (let y = radius; y < height - radius; y++) {
      for (let x = radius; x < width - radius; x++) {
        const index = (y * width + x) * 4;
        
        // For each color channel (R, G, B)
        for (let c = 0; c < 3; c++) {
          const values = [];
          
          // Gather neighboring pixels
          for (let ky = -radius; ky <= radius; ky++) {
            for (let kx = -radius; kx <= radius; kx++) {
              const idx = ((y + ky) * width + (x + kx)) * 4 + c;
              values.push(data[idx]);
            }
          }
          
          // Sort and find median
          values.sort((a, b) => a - b);
          const median = values[Math.floor(values.length / 2)];
          
          // Set the result
          resultData[index + c] = median;
        }
        
        // Alpha channel
        resultData[index + 3] = data[index + 3];
      }
    }
    
    // Handle edges by copying from original
    for (let y = 0; y < height; y++) {

  function applyEdgeDetection() {

    // Define edge detection kernel (Sobel operator)
    const kernelX = [
      -1, 0, 1,
      -2, 0, 2,
      -1, 0, 1
    ];
    
    const kernelY = [
      -1, -2, -1,

    ];
    
    // Apply the convolution
    const result = applyEdgeConvolution(imageData, kernelX, kernelY);

  // Apply edge convolution
  function applyEdgeConvolution(imageData, kernelX, kernelY) {
    const width = imageData.width;
    const height = imageData.height;
    const data = imageData.data;
    const result = new ImageData(width, height);
    const resultData = result.data;
    
    // For each pixel (skipping the edges)
    for (let y = 1; y < height - 1; y++) {
      for (let x = 1; x < width - 1; x++) {
        const index = (y * width + x) * 4;
        
        // Convert to grayscale first
        let gray = 0.3 * data[index] + 0.59 * data[index + 1] + 0.11 * data[index + 2];
        data[index] = data[index + 1] = data[index + 2] = gray;
        
        // Calculate gradient in X and Y directions
        let gradientX = 0;
        let gradientY = 0;
        
        for (let ky = -1; ky <= 1; ky++) {
          for (let kx = -1; kx <= 1; kx++) {
            const idx = ((y + ky) * width + (x + kx)) * 4;
            const kernelIdxX = (ky + 1) * 3 + (kx + 1);
            const kernelIdxY = (ky + 1) * 3 + (kx + 1);
            
            gradientX += data[idx] * kernelX[kernelIdxX];
            gradientY += data[idx] * kernelY[kernelIdxY];
          }
        }
        
        // Calculate the magnitude of the gradient
        const magnitude = Math.min(255, Math.sqrt(gradientX * gradientX + gradientY * gradientY));
        
        // Set the result
        resultData[index] = magnitude;
        resultData[index + 1] = magnitude;
        resultData[index + 2] = magnitude;
        resultData[index + 3] = 255;
      }
    }
    
    return result;
  }

  // Apply a convolution kernel to image data with optional offset
  function applyConvolution(imageData, kernel, divisor, offset = 0) {
    const width = imageData.width;
    const height = imageData.height;
    const data = imageData.data;
    const result = new ImageData(width, height);
    const resultData = result.data;
    
    // For each pixel (skipping the edges)
    for (let y = 1; y < height - 1; y++) {
      for (let x = 1; x < width - 1; x++) {
        const index = (y * width + x) * 4;
        
        // For each color channel (R, G, B)
        for (let c = 0; c < 3; c++) {
          let sum = 0;
          
          // Apply kernel
          for (let ky = -1; ky <= 1; ky++) {
            for (let kx = -1; kx <= 1; kx++) {
              const idx = ((y + ky) * width + (x + kx)) * 4 + c;
              const kernelValue = kernel[(ky + 1) * 3 + (kx + 1)];
              sum += data[idx] * kernelValue;
            }
          }
          
          // Set the result with optional offset
          resultData[index + c] = Math.min(255, Math.max(0, sum / divisor + offset));
        }
        
        // Alpha channel
        resultData[index + 3] = data[index + 3];
      }
    }
    
    // Handle edges by copying from original
    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) {
        if (y === 0 || y === height - 1 || x === 0 || x === width - 1) {
          const index = (y * width + x) * 4;
          resultData[index] = data[index];
          resultData[index + 1] = data[index + 1];
          resultData[index + 2] = data[index + 2];
          resultData[index + 3] = data[index + 3];
        }
      }
    }
    
    return result;
  }

  // CPU implementation of unsharp mask
  function unsharpMaskCPU(original, blurred, amount) {
    const width = original.width;
    const height = original.height;
    const origData = original.data;
    const blurData = blurred.data;
    const result = new ImageData(width, height);
    const resultData = result.data;
    
    for (let i = 0; i < origData.length; i += 4) {
      for (let c = 0; c < 3; c++) {
        // Subtract blurred image from original and add back to original
        const diff = origData[i + c] - blurData[i + c];
        resultData[i + c] = Math.min(255, Math.max(0, origData[i + c] + diff * amount));
      }
      resultData[i + 3] = origData[i + 3]; // Copy alpha
    }
    
    return result;
  }
  
  // WebGL implementation of Gaussian Blur
  function applyGaussianBlur(imageData, width, height, radius) {
    // This would be a WebGL implementation using shaders
    // For now, we'll use a CPU version as placeholder
    
    const canvas = editorCanvasEl;
    const ctx = canvas.getContext('2d');
    
    // Create a kernel for gaussian blur
    const sigma = radius / 3;
    const size = radius * 2 + 1;
    const kernel = [];
    let sum = 0;
    
    // Generate 1D gaussian kernel
    for (let i = 0; i < size; i++) {
      const x = i - radius;
      const g = Math.exp(-(x * x) / (2 * sigma * sigma));
      kernel.push(g);
      sum += g;
    }
    
    // Normalize kernel
    for (let i = 0; i < size; i++) {
      kernel[i] /= sum;
    }
    
    // Apply horizontal blur
    const tempData = new ImageData(width, height);
    const data = imageData.data;
    const tempDataArr = tempData.data;
    
    // Horizontal pass
    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) {
        const i = (y * width + x) * 4;
        let r = 0, g = 0, b = 0;
        
        for (let k = -radius; k <= radius; k++) {
          const xk = Math.min(width - 1, Math.max(0, x + k));
          const ik = (y * width + xk) * 4;
          const kw = kernel[k + radius];
          
          r += data[ik] * kw;
          g += data[ik + 1] * kw;
          b += data[ik + 2] * kw;
        }
        
        tempDataArr[i] = r;
        tempDataArr[i + 1] = g;
        tempDataArr[i + 2] = b;
        tempDataArr[i + 3] = data[i + 3];
      }
    }
    
    // Vertical pass
    const result = new ImageData(width, height);
    const resultDataArr = result.data;
    
    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) {
        const i = (y * width + x) * 4;
        let r = 0, g = 0, b = 0;
        
        for (let k = -radius; k <= radius; k++) {
          const yk = Math.min(height - 1, Math.max(0, y + k));
          const ik = (yk * width + x) * 4;
          const kw = kernel[k + radius];
          
          r += tempDataArr[ik] * kw;
          g += tempDataArr[ik + 1] * kw;
          b += tempDataArr[ik + 2] * kw;
        }
        
        resultDataArr[i] = r;
        resultDataArr[i + 1] = g;
        resultDataArr[i + 2] = b;
        resultDataArr[i + 3] = data[i + 3];
      }
    }
    
    ctx.putImageData(result, 0, 0);
  }

  // Apply oil painting effect (GPU-intensive)

        const redBucket = new Array(intensityLevels).fill(0);
        const greenBucket = new Array(intensityLevels).fill(0);
        const blueBucket = new Array(intensityLevels).fill(0);
        
        // Scan neighboring pixels

        }
        
        // Set the pixel color to the average color at that intensity
        if (maxIntensity > 0) {
          result.data[index] = Math.round(redBucket[maxIndex] / maxIntensity);
          result.data[index + 1] = Math.round(greenBucket[maxIndex] / maxIntensity);
          result.data[index + 2] = Math.round(blueBucket[maxIndex] / maxIntensity);
          result.data[index + 3] = imageData.data[index + 3];
        } else {
          result.data[index] = imageData.data[index];
          result.data[index + 1] = imageData.data[index + 1];
          result.data[index + 2] = imageData.data[index + 2];
          result.data[index + 3] = imageData.data[index + 3];
        }
      }
    }
    
    ctx.putImageData(result, 0, 0);
  }
  
  // Apply watercolor effect (GPU-intensive)
  function applyWatercolor(imageData, width, height, strength = 50) {
    const canvas = editorCanvasEl;
    const ctx = canvas.getContext('2d');
    
    // Create a temporary canvas
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = width;
    tempCanvas.height = height;
    const tempCtx = tempCanvas.getContext('2d');
    
    // Draw the current image
    tempCtx.putImageData(imageData, 0, 0);
    
    // Map strength to effect parameters
    const blurAmount = 0.5 + (strength / 100) * 3; // 0.5-3.5px
    const contrastAmount = 100 + (strength / 2); // 100-150%
    const saturationAmount = 100 + (strength / 3); // 100-133%
    
    // Step 1: Apply a subtle blur to simulate water spreading
    tempCtx.filter = `blur(${blurAmount}px)`;
    tempCtx.drawImage(tempCanvas, 0, 0);
    tempCtx.filter = 'none';
    
    // Step 2: Get blurred image data
    let processedData = tempCtx.getImageData(0, 0, width, height);
    
    // Step 3: Reduce color depth for watercolor look (posterize)
    const levels = 3 + Math.floor(strength / 25); // 3-7 levels based on strength
    const step = 255 / (levels - 1);
    
    for (let i = 0; i < processedData.data.length; i += 4) {
      processedData.data[i] = Math.round(processedData.data[i] / step) * step;
      processedData.data[i + 1] = Math.round(processedData.data[i + 1] / step) * step;
      processedData.data[i + 2] = Math.round(processedData.data[i + 2] / step) * step;
    }
    
    tempCtx.putImageData(processedData, 0, 0);
    
    // Step 4: Enhance edges slightly to create that watercolor paper edge effect
    tempCtx.filter = `contrast(${contrastAmount}%) saturate(${saturationAmount}%)`;
    tempCtx.drawImage(tempCanvas, 0, 0);
    tempCtx.filter = 'none';
    
    // Step 5: Apply very subtle noise texture to simulate paper
    processedData = tempCtx.getImageData(0, 0, width, height);
    for (let i = 0; i < processedData.data.length; i += 4) {
      const noise = (Math.random() - 0.5) * (strength / 10); // Adjust noise based on strength
      processedData.data[i] = Math.min(255, Math.max(0, processedData.data[i] + noise));
      processedData.data[i + 1] = Math.min(255, Math.max(0, processedData.data[i + 1] + noise));
      processedData.data[i + 2] = Math.min(255, Math.max(0, processedData.data[i + 2] + noise));
    }
    
    // Step 6: Final output
    ctx.putImageData(processedData, 0, 0);
  }
  
  // Watercolor fallback for CPU
  function applyWatercolorFallback(imageData, strength = 50) {
    const width = imageData.width;
    const height = imageData.height;
    const result = new ImageData(width, height);
    
    // Apply a simple posterize effect to reduce colors
    const levels = 3 + Math.floor(strength / 25); // 3-7 levels based on strength
    const step = 255 / (levels - 1);
    
    for (let i = 0; i < imageData.data.length; i += 4) {
      // Posterize
      result.data[i] = Math.round(imageData.data[i] / step) * step;
      result.data[i + 1] = Math.round(imageData.data[i + 1] / step) * step;
      result.data[i + 2] = Math.round(imageData.data[i + 2] / step) * step;

      result.data[i + 1] = Math.min(255, Math.max(0, result.data[i + 1] + noise));

  // Apply motion blur (GPU-intensive)
  function applyMotionBlur(imageData, width, height, strength = 50) {
    const canvas = editorCanvasEl;
    const ctx = canvas.getContext('2d');
    
    // Get the angle for motion blur
    const angle = prompt("Enter angle for motion blur (0-360):", "45");
    if (!angle) return;
    
    const angleValue = parseInt(angle);
    if (isNaN(angleValue) || angleValue < 0 || angleValue > 360) {
      alert("Please enter a valid angle between 0 and 360");
      return;
    }
    
    // Convert angle to radians
    const radians = angleValue * Math.PI / 180;
    
    // Calculate direction vector
    const dirX = Math.cos(radians);
    const dirY = Math.sin(radians);
    
    // Apply motion blur - use strength to determine blur amount
    const blurStrength = Math.max(5, Math.floor(strength / 5)); // Maps 1-100 to ~5-20
    const result = new ImageData(width, height);
    
    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) {
        const index = (y * width + x) * 4;
        
        let r = 0, g = 0, b = 0, a = 0, count = 0;
        
        // Sample along the direction vector
        for (let i = -blurStrength; i <= blurStrength; i++) {
          const sampleX = Math.round(x + dirX * i);
          const sampleY = Math.round(y + dirY * i);
          
          // Skip if outside image bounds
          if (sampleX < 0 || sampleX >= width || sampleY < 0 || sampleY >= height) {
            continue;
          }
          
          const sampleIndex = (sampleY * width + sampleX) * 4;
          r += imageData.data[sampleIndex];
          g += imageData.data[sampleIndex + 1];
          b += imageData.data[sampleIndex + 2];
          a += imageData.data[sampleIndex + 3];
          count++;
        }
        
        // Average the samples
        result.data[index] = r / count;
        result.data[index + 1] = g / count;
        result.data[index + 2] = b / count;
        result.data[index + 3] = a / count;
      }
    }
    
    ctx.putImageData(result, 0, 0);
  }
  
  // Apply bloom/glow effect (GPU-intensive)
  function applyBloom(imageData, width, height, strength = 50) {
    const canvas = editorCanvasEl;
    const ctx = canvas.getContext('2d');
    
    // Create a temporary canvas
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = width;
    tempCanvas.height = height;
    const tempCtx = tempCanvas.getContext('2d');
    
    // Draw the current image
    tempCtx.putImageData(imageData, 0, 0);
    
    // Map strength (1-100) to parameters
    // Lower threshold means more pixels will be considered "bright"
    const threshold = 255 - (strength * 1.5); // Maps 1-100 to ~255-105
    const blurAmount = 5 + (strength / 10); // Maps 1-100 to 5-15px
    const blendIntensity = strength / 100; // Maps 1-100 to 0.01-1.0
    
    // Step 1: Extract highlights
    const highlightCanvas = document.createElement('canvas');
    highlightCanvas.width = width;
    highlightCanvas.height = height;
    const highlightCtx = highlightCanvas.getContext('2d');
    highlightCtx.drawImage(tempCanvas, 0, 0);
    
    const highlightData = highlightCtx.getImageData(0, 0, width, height);
    
    for (let i = 0; i < highlightData.data.length; i += 4) {
      const r = highlightData.data[i];
      const g = highlightData.data[i + 1];
      const b = highlightData.data[i + 2];
      
      // Keep only bright pixels
      if (r + g + b < threshold * 3) {
        highlightData.data[i] = 0;
        highlightData.data[i + 1] = 0;
        highlightData.data[i + 2] = 0;
        highlightData.data[i + 3] = 0; // Make non-bright areas transparent
      }
    }
    
    highlightCtx.putImageData(highlightData, 0, 0);
    
    // Step 2: Blur the highlights
    highlightCtx.filter = `blur(${blurAmount}px)`;
    highlightCtx.drawImage(highlightCanvas, 0, 0);
    highlightCtx.filter = 'none';
    
    // Step 3: Blend the blurred highlights with the current image
    ctx.drawImage(tempCanvas, 0, 0); // Draw original first
    ctx.globalCompositeOperation = 'screen'; // Screen blend mode works well for bloom
    ctx.globalAlpha = blendIntensity;
    ctx.drawImage(highlightCanvas, 0, 0);
    
    // Reset composite operation
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1.0;
  }
  
  // Bloom fallback for CPU
  function applyBloomFallback(imageData, strength = 50) {
    const width = imageData.width;
    const height = imageData.height;
    const result = new ImageData(width, height);
    
    // Copy original image
    for (let i = 0; i < imageData.data.length; i++) {
      result.data[i] = imageData.data[i];
    }
    
    // Map strength (1-100) to parameters
    const threshold = 255 - (strength * 1.5); // Maps 1-100 to ~255-105
    const bloomStrength = strength / 200; // Maps 1-100 to 0.005-0.5
    
    // Apply a simple bloom effect
    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) {
        const index = (y * width + x) * 4;
        
        // Check if this is a bright pixel
        const r = imageData.data[index];
        const g = imageData.data[index + 1];
        const b = imageData.data[index + 2];
        
        if (r + g + b > threshold * 3) {
          // For bright pixels, spread their brightness to nearby pixels
          const radius = Math.max(1, Math.floor(strength / 20)); // Maps 1-100 to ~1-5
          
          for (let ny = Math.max(0, y - radius); ny <= Math.min(height - 1, y + radius); ny++) {
            for (let nx = Math.max(0, x - radius); nx <= Math.min(width - 1, x + radius); nx++) {
              if (nx === x && ny === y) continue; // Skip the central pixel
              
              const distance = Math.sqrt((nx - x) * (nx - x) + (ny - y) * (ny - y));
              if (distance > radius) continue;
              
              const falloff = 1 - (distance / radius);
              const targetIdx = (ny * width + nx) * 4;
              
              // Add bloom with falloff
              result.data[targetIdx] = Math.min(255, result.data[targetIdx] + r * falloff * bloomStrength);
              result.data[targetIdx + 1] = Math.min(255, result.data[targetIdx + 1] + g * falloff * bloomStrength);
              result.data[targetIdx + 2] = Math.min(255, result.data[targetIdx + 2] + b * falloff * bloomStrength);
            }
          }
        }
      }
    }
    
    return result;
  }
  
  // Apply bokeh depth of field effect (GPU-intensive)
  function applyBokeh(imageData, width, height, strength = 50) {

  // Apply bokeh at a specific focus point
  function applyBokehAtPoint(imageData, width, height, focusX, focusY, strength = 50) {
    const canvas = editorCanvasEl;
    const ctx = canvas.getContext('2d');
    
    // Create a depth map (distance from focus point)
    const depthMap = new Float32Array(width * height);
    const maxDistance = Math.sqrt(width * width + height * height);
    
    // Map strength to bokeh parameters
    const falloffFactor = 0.2 + (strength / 100) * 0.5; // Maps 1-100 to 0.2-0.7
    
    // Create a more distinct falloff from the center
    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) {
        const distance = Math.sqrt((x - focusX) * (x - focusX) + (y - focusY) * (y - focusY));
        // Use a steeper curve for depth - this will make the center sharper and transition to blur more quickly
        depthMap[y * width + x] = Math.min(1, Math.pow(distance / (maxDistance * falloffFactor), 1.5));
      }
    }
    
    // Create multiple blur levels - more levels for higher strength
    const blurLevels = 3 + Math.floor(strength / 25); // Maps 1-100 to 3-7
    const blurredImages = [];
    
    // Create a tempCanvas for the sharp (non-blurred) image
    const sharpCanvas = document.createElement('canvas');
    sharpCanvas.width = width;
    sharpCanvas.height = height;
    const sharpCtx = sharpCanvas.getContext('2d');
    sharpCtx.putImageData(imageData, 0, 0);
    
    // Even sharpen the center area slightly
    const sharpenKernel = [
      0, -0.2, 0,
      -0.2, 1.8, -0.2,
      0, -0.2, 0
    ];
    const sharpenedImage = applyConvolution(imageData, sharpenKernel, 1);
    
    // Add the sharpened image as the first "blur level" (actually sharp)
    blurredImages.push(sharpenedImage);
    
    for (let i = 0; i < blurLevels; i++) {
      // Exponential increase in blur radius for more dramatic effect
      const blurRadius = Math.pow(2, i) * 2;
      
      // Create a temporary canvas
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = width;
      tempCanvas.height = height;
      const tempCtx = tempCanvas.getContext('2d');
      
      // Draw the current image
      tempCtx.putImageData(imageData, 0, 0);
      
      // Apply blur
      tempCtx.filter = `blur(${blurRadius}px)`;
      tempCtx.drawImage(tempCanvas, 0, 0);
      tempCtx.filter = 'none';
      
      // Get the blurred image
      blurredImages.push(tempCtx.getImageData(0, 0, width, height));
    }
    
    // Compose final image based on depth map
    const result = new ImageData(width, height);
    
    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) {
        const index = (y * width + x) * 4;
        const depth = depthMap[y * width + x];
        
        // Select blur level based on depth
        const blurLevel = Math.min(blurLevels - 1, Math.floor(depth * blurLevels));
        const nextBlurLevel = Math.min(blurLevels - 1, blurLevel + 1);
        const blendFactor = (depth * blurLevels) - blurLevel;
        
        // Linear interpolation between blur levels
        for (let c = 0; c < 4; c++) {
          const c1 = blurredImages[blurLevel].data[index + c];
          const c2 = blurredImages[nextBlurLevel].data[index + c];
          result.data[index + c] = c1 * (1 - blendFactor) + c2 * blendFactor;
        }
      }
    }
    
    ctx.putImageData(result, 0, 0);
    
    // Add to history
    addToHistory(ctx.getImageData(0, 0, canvas.width, canvas.height));
  }
  
  // Rotate the image
  function rotateImage(angle) {
    if (editorState.currentImageIndex === -1) return;
    
    const canvas = editorCanvasEl;
    const ctx = canvas.getContext('2d');
    
    // Get current image data before applying transformation
    const currentImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    
    const currentImg = editorState.images[editorState.currentImageIndex].image;
    
    // Create a temporary canvas
    const tempCanvas = document.createElement('canvas');
    const tempCtx = tempCanvas.getContext('2d');
    
    // Set size based on rotation
    if (Math.abs(angle) === 90 || Math.abs(angle) === 270) {
      tempCanvas.width = canvas.height;
      tempCanvas.height = canvas.width;
    } else {
      tempCanvas.width = canvas.width;
      tempCanvas.height = canvas.height;
    }
    
    // Translate and rotate
    tempCtx.translate(tempCanvas.width / 2, tempCanvas.height / 2);
    tempCtx.rotate(angle * Math.PI / 180);
    tempCtx.drawImage(currentImg, -currentImg.width / 2, -currentImg.height / 2);
    
    // Update main canvas
    canvas.width = tempCanvas.width;
    canvas.height = tempCanvas.height;
    ctx.drawImage(tempCanvas, 0, 0);
    
    // Update original image data
    editorState.originalImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    
    // Create new image with rotated data
    const rotatedImg = new Image();
    rotatedImg.src = canvas.toDataURL('image/png');
    
    // Replace current image in array
    rotatedImg.onload = function() {
      editorState.images[editorState.currentImageIndex].image = rotatedImg;
      
      // Add to history
      addToHistory(ctx.getImageData(0, 0, canvas.width, canvas.height));
    };
    
    // Remove any existing selection box when rotating
    if (selectionBox) {
      selectionBox.remove();
      selectionBox = null;
      resolutionSelect.value = "";
    }
  }
  
  // Flip the image
  function flipImage(direction) {
    if (editorState.currentImageIndex === -1) return;
    
    const canvas = editorCanvasEl;
    const ctx = canvas.getContext('2d');
    
    // Get current image data before applying transformation
    const currentImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    
    // Create a temporary canvas
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = canvas.width;
    tempCanvas.height = canvas.height;
    const tempCtx = tempCanvas.getContext('2d');
    
    // Copy current canvas to temp canvas
    tempCtx.drawImage(canvas, 0, 0);
    
    // Clear main canvas
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Flip the image
    if (direction === 'horizontal') {
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);
    } else if (direction === 'vertical') {
      ctx.translate(0, canvas.height);
      ctx.scale(1, -1);
    }
    
    // Draw flipped image
    ctx.drawImage(tempCanvas, 0, 0);
    
    // Reset transform
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    
    // Update original image data
    editorState.originalImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    
    // Create new image from the canvas
    const flippedImg = new Image();
    flippedImg.src = canvas.toDataURL('image/png');
    
    // Replace current image in state
    flippedImg.onload = function() {
      editorState.images[editorState.currentImageIndex].image = flippedImg;
      
      // Add to history
      addToHistory(ctx.getImageData(0, 0, canvas.width, canvas.height));
    };
    
    // Remove any existing selection box when flipping
    if (selectionBox) {
      selectionBox.remove();
      selectionBox = null;
      resolutionSelect.value = "";
    }
  }

  // Create or update the selection box based on chosen resolution
  function updateResolutionBox() {
    const resolutionValue = resolutionSelect.value;
    
    // Remove existing selection box if any
    if (selectionBox) {
      selectionBox.remove();
      selectionBox = null;
    }
    
    if (!resolutionValue || editorState.currentImageIndex === -1) return;
    
    // Parse the resolution
    const [width, height] = resolutionValue.split('x').map(Number);
    
    // Create a new selection box
    selectionBox = document.createElement('div');
    selectionBox.className = 'selection-box';
    
    // Get the canvas and its container
    const canvas = editorCanvasEl;
    const previewContainer = document.getElementById('editorPreview');
    
    // Scale the box proportionally if it's larger than the canvas
    const scale = Math.min(1, Math.min(canvas.width / width, canvas.height / height));
    
    const scaledWidth = width * scale;
    const scaledHeight = height * scale;
    
    // Position the box centered on the canvas
    selectionBox.style.width = `${scaledWidth}px`;
    selectionBox.style.height = `${scaledHeight}px`;
    selectionBox.style.left = `${(canvas.width - scaledWidth) / 2}px`;
    selectionBox.style.top = `${(canvas.height - scaledHeight) / 2}px`;
    
    // Store original resolution for later use
    selectionBox.dataset.originalWidth = width;
    selectionBox.dataset.originalHeight = height;
    
    // Add event listeners for dragging
    selectionBox.addEventListener('mousedown', startDrag);
    
    // Add the box to the editor preview
    previewContainer.appendChild(selectionBox);
  }
  
  // Start dragging the selection box
  function startDrag(e) {
    if (!selectionBox) return;
    
    isDragging = true;
    
    // Calculate the offset of the mouse click relative to the box
    const rect = selectionBox.getBoundingClientRect();
    dragOffsetX = e.clientX - rect.left;
    dragOffsetY = e.clientY - rect.top;
    
    // Add event listeners for dragging
    document.addEventListener('mousemove', dragBox);
    document.addEventListener('mouseup', stopDrag);
    
    e.preventDefault();
  }
  
  // Drag the selection box
  function dragBox(e) {
    if (!isDragging || !selectionBox) return;
    
    const canvas = editorCanvasEl;
    const previewContainer = document.getElementById('editorPreview');
    const containerRect = previewContainer.getBoundingClientRect();
    
    // Calculate new position relative to the container
    let newLeft = e.clientX - containerRect.left - dragOffsetX;
    let newTop = e.clientY - containerRect.top - dragOffsetY;
    
    // Get the box dimensions
    const boxWidth = parseFloat(selectionBox.style.width);
    const boxHeight = parseFloat(selectionBox.style.height);
    
    // Keep the box within the canvas bounds
    newLeft = Math.max(0, Math.min(canvas.width - boxWidth, newLeft));
    newTop = Math.max(0, Math.min(canvas.height - boxHeight, newTop));
    
    // Update position
    selectionBox.style.left = `${newLeft}px`;
    selectionBox.style.top = `${newTop}px`;
  }
  
  // Stop dragging
  function stopDrag() {
    isDragging = false;
    document.removeEventListener('mousemove', dragBox);
    document.removeEventListener('mouseup', stopDrag);
  }
  
  // Cut the image to the selection
  function cutImageToSelection() {
    if (!selectionBox || editorState.currentImageIndex === -1) return;
    
    const canvas = editorCanvasEl;
    const ctx = canvas.getContext('2d');
    
    // Get current image data before cutting
    const currentImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    
    // Get the selection box position and size
    const boxLeft = parseFloat(selectionBox.style.left);
    const boxTop = parseFloat(selectionBox.style.top);
    const boxWidth = parseFloat(selectionBox.style.width);
    const boxHeight = parseFloat(selectionBox.style.height);
    
    // Get the original resolution
    const originalWidth = parseInt(selectionBox.dataset.originalWidth);
    const originalHeight = parseInt(selectionBox.dataset.originalHeight);
    
    // Create a temporary canvas to hold the selected area
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = originalWidth;
    tempCanvas.height = originalHeight;
    const tempCtx = tempCanvas.getContext('2d');
    
    // Draw the selected portion of the image onto the temp canvas, scaling it to the target resolution
    tempCtx.drawImage(
      canvas,
      boxLeft, boxTop, boxWidth, boxHeight,
      0, 0, originalWidth, originalHeight
    );
    
    // Resize the main canvas to the target resolution
    canvas.width = originalWidth;
    canvas.height = originalHeight;
    
    // Draw the cropped image back to the main canvas
    ctx.drawImage(tempCanvas, 0, 0);
    
    // Update the original image data
    editorState.originalImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    
    // Create a new image from the canvas
    const newImg = new Image();
    newImg.src = canvas.toDataURL('image/png');
    
    // Replace the current image in the state
    newImg.onload = function() {
      editorState.images[editorState.currentImageIndex].image = newImg;
      
      // Add to history
      addToHistory(ctx.getImageData(0, 0, canvas.width, canvas.height));
      
      // Remove the selection box
      selectionBox.remove();
      selectionBox = null;
      resolutionSelect.value = "";
    };
  }
  
  // Initialize the editor
  initImageEditor();
</script>

    const galleryEl = document.getElementById(GALLERY_CONTAINER_ID);
    if (galleryEl) {
      observer.observe(galleryEl, { childList: true, subtree: true });
    }
  });
</script>

<!-- Slideshow Button -->


<!-- Slideshow Container (hidden by default) -->
<div id="slideshowContainerEl" hidden style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.9); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center;">
  
  <!-- Close Button -->
  <div style="position: absolute; top: 10px; right: 10px;">
    <button id="closeSlideBtn" onclick="closeSlideshow()" style="font-size: 24px; background: none; border: none; color: white; cursor: pointer;">×</button>
  </div>
  
  <!-- Image Container -->
  <div id="slideshowImageCtn" style="flex: 1; display: flex; align-items: center; justify-content: center; width: 100%; height: 80%; position: relative;">
    <img id="currentSlideImg" style="max-width: none; max-height: none; object-fit: contain; transition: opacity 0.3s;" onload="this.style.opacity=1" />
    <div id="loadingIndicatorEl" hidden style="position: absolute; color: white;">Loading...</div>
  </div>
  
  <!-- Navigation Indicators -->
  <div id="slideIndicatorEl" style="margin-top: 10px; color: white;">Slide 1 of 1</div>
  
  <!-- Controls -->
  <div style="padding: 20px; width: 80%; display: flex; flex-direction: column; align-items: center;">
    <div style="display: flex; gap: 10px; margin-bottom: 15px;">
      <button id="prevSlideBtn" onclick="prevSlide()">Previous</button>
      <button id="playPauseBtn" onclick="togglePlayPause()">Pause</button>
      <button id="nextSlideBtn" onclick="nextSlide()">Next</button>
    </div>
    
    <div style="width: 100%; display: flex; align-items: center; gap: 10px;">
      <span style="color: white;">Speed:</span>
      <input type="range" id="speedSlider" min="50" max="10000" step="50" value="3000" style="flex: 1; width: 100%;" 
             oninput="updateSpeed(this.value)" />
      <span id="speedValueEl" style="color: white; min-width: 60px; text-align: right;">2000ms</span>
    </div>
  </div>
</div>

<!-- Slideshow Script -->
<script>
  // ======================================================
  // GALLERY CONFIGURATION - REPLACE WITH YOUR GALLERY NAMES
  // ======================================================
  // Add your gallery area name(s) in this array - can add multiple names if needed
  const GALLERY_NAMES = ["galleryCtn"]; // EDIT THIS LINE WITH YOUR GALLERY NAME(S)
  // ======================================================
  
  // Slideshow state
  let slideshow = {
    images: [],
    currentIndex: 0,
    intervalId: null,
    speed: 2000,
    isPlaying: true,
    preloadedImages: {},
    touchStartX: 0,
    touchEndX: 0,
    clickToCloseHandler: null // Store the reference to the click handler
  };
  
  // Find all images in the specified galleries
  function collectGalleryImages() {
    slideshow.images = [];
    slideshow.preloadedImages = {};
    
    // Loop through each gallery name
    GALLERY_NAMES.forEach(galleryName => {
      // Try to find gallery by ID, class, or data attribute
      const galleryElements = document.querySelectorAll(
        `[id="${galleryName}"], [class*="${galleryName}"], [data-gallery="${galleryName}"]`
      );
      
      galleryElements.forEach(gallery => {
        // Find all images within this gallery
        const images = gallery.querySelectorAll('img');
        
        // Add each image source to our collection
        images.forEach(img => {
          // Skip SVGs, blank images, and duplicates
          if (img.src && 
              !slideshow.images.includes(img.src) && 
              !img.src.includes('data:image/svg+xml') && 
              img.src !== 'about:blank') {
            slideshow.images.push(img.src);
          }
        });
      });
    });
    
    return slideshow.images.length > 0;
  }
  
  // Preload an image
  function preloadImage(src) {
    return new Promise((resolve, reject) => {
      if (slideshow.preloadedImages[src]) {
        resolve(slideshow.preloadedImages[src]);
        return;
      }
      
      const img = new Image();
      img.onload = () => {
        slideshow.preloadedImages[src] = img;
        resolve(img);
      };
      img.onerror = () => {
        reject(new Error(`Failed to load image: ${src}`));
      };
      img.src = src;
    });
  }
  
  // Preload next few images
  async function preloadNextImages() {
    const totalImages = slideshow.images.length;
    if (totalImages <= 1) return;
    
    for (let i = 1; i <= 3; i++) { // Preload next 3 images
      const nextIndex = (slideshow.currentIndex + i) % totalImages;
      try {
        await preloadImage(slideshow.images[nextIndex]);
      } catch (error) {
        console.error(error);
      }
    }
  }
  
  // Open the slideshow
  function openSlideshow() {
    // Collect images from galleries
    if (!collectGalleryImages()) {
      alert(`No images found in galleries: ${GALLERY_NAMES.join(', ')}`);
      return;
    }
    
    // Show the slideshow container
    slideshowContainerEl.hidden = false;
    
    // Reset and start slideshow
    slideshow.currentIndex = 0;
    showCurrentSlide();
    startSlideTimer();
    
    // Add event listeners
    document.addEventListener('keydown', handleKeyboardNavigation);
    setupTouchEvents();
    setupClickToClose();
    
    // Start preloading next images
    preloadNextImages();
  }
  
  // Setup touch events for mobile
  function setupTouchEvents() {
    slideshowImageCtn.addEventListener('touchstart', handleTouchStart, false);
    slideshowImageCtn.addEventListener('touchend', handleTouchEnd, false);
  }
  
  // Handle touch start
  function handleTouchStart(e) {
    slideshow.touchStartX = e.changedTouches[0].screenX;
  }
  
  // Handle touch end
  function handleTouchEnd(e) {
    slideshow.touchEndX = e.changedTouches[0].screenX;
    handleSwipe();
  }
  
  // Process swipe
  function handleSwipe() {
    const SWIPE_THRESHOLD = 50;
    const swipeDistance = slideshow.touchEndX - slideshow.touchStartX;
    
    if (swipeDistance < -SWIPE_THRESHOLD) {
      // Swipe left, show next slide
      nextSlide();
    } else if (swipeDistance > SWIPE_THRESHOLD) {
      // Swipe right, show previous slide
      prevSlide();
    }
  }
  
  // Setup click to close functionality
  function setupClickToClose() {
    // Store the handler function reference so we can remove it later
    slideshow.clickToCloseHandler = function(e) {
      // Don't close if clicking on controls or buttons
      if (!e.target.closest('button') && !e.target.closest('input')) {
        closeSlideshow();
      }
    };
    
    // Add click event to the slideshow container to close when clicking/tapping anywhere
    slideshowContainerEl.addEventListener('click', slideshow.clickToCloseHandler);
  }
  
  // Close the slideshow
  function closeSlideshow() {
    slideshowContainerEl.hidden = true;
    stopSlideTimer();
    
    // Remove event listeners
    document.removeEventListener('keydown', handleKeyboardNavigation);
    slideshowImageCtn.removeEventListener('touchstart', handleTouchStart);
    slideshowImageCtn.removeEventListener('touchend', handleTouchEnd);
    
    // Remove click-to-close handler if it exists
    if (slideshow.clickToCloseHandler) {
      slideshowContainerEl.removeEventListener('click', slideshow.clickToCloseHandler);
      slideshow.clickToCloseHandler = null;
    }
  }
  
  // Handle keyboard navigation
  function handleKeyboardNavigation(e) {
    switch (e.key) {
      case 'Escape':
        closeSlideshow();
        break;
      case 'ArrowRight':
        nextSlide();
        break;
      case 'ArrowLeft':
        prevSlide();
        break;
      case ' ': // Space bar
        togglePlayPause();
        e.preventDefault();
        break;
    }
  }
  
  // Show the current slide
  async function showCurrentSlide() {
    if (slideshow.images.length === 0) return;
    
    // Show loading indicator
    loadingIndicatorEl.hidden = false;
    currentSlideImg.style.opacity = 0.2;
    
    try {
      // Try to use preloaded image or load it now
      await preloadImage(slideshow.images[slideshow.currentIndex]);
      
      // Update the image source
      currentSlideImg.src = slideshow.images[slideshow.currentIndex];
      
      // Ensure image is shown at actual dimensions
      currentSlideImg.style.maxWidth = 'none';
      currentSlideImg.style.maxHeight = 'none';
      
      // Update slide indicator
      slideIndicatorEl.textContent = `Slide ${slideshow.currentIndex + 1} of ${slideshow.images.length}`;
      
      // Hide loading indicator
      loadingIndicatorEl.hidden = true;
      currentSlideImg.style.opacity = 1;
      
      // Preload next images
      preloadNextImages();
    } catch (error) {
      console.error('Error loading image:', error);
      loadingIndicatorEl.textContent = 'Error loading image';
    }
  }
  
  // Go to the next slide
  function nextSlide() {
    slideshow.currentIndex = (slideshow.currentIndex + 1) % slideshow.images.length;
    showCurrentSlide();
    
    // Restart the timer if playing
    if (slideshow.isPlaying) {
      startSlideTimer();
    }
  }
  
  // Go to the previous slide
  function prevSlide() {
    slideshow.currentIndex = (slideshow.currentIndex - 1 + slideshow.images.length) % slideshow.images.length;
    showCurrentSlide();
    
    // Restart the timer if playing
    if (slideshow.isPlaying) {
      startSlideTimer();
    }
  }
  
  // Toggle play/pause
  function togglePlayPause() {
    slideshow.isPlaying = !slideshow.isPlaying;
    
    if (slideshow.isPlaying) {
      playPauseBtn.textContent = "Pause";
      startSlideTimer();
    } else {
      playPauseBtn.textContent = "Play";
      stopSlideTimer();
    }
  }
  
  // Start the slide timer
  function startSlideTimer() {
    // Clear any existing timer
    stopSlideTimer();
    
    // Start a new timer
    slideshow.intervalId = setInterval(nextSlide, slideshow.speed);
  }
  
  // Stop the slide timer
  function stopSlideTimer() {
    if (slideshow.intervalId) {
      clearInterval(slideshow.intervalId);
      slideshow.intervalId = null;
    }
  }
  
  // Update slideshow speed
  function updateSpeed(value) {
    slideshow.speed = parseInt(value);
    speedValueEl.textContent = `${slideshow.speed}ms`;
    
    // Restart timer if playing
    if (slideshow.isPlaying) {
      startSlideTimer();
    }
  }
  
  // Initialize slider value when page loads
  document.addEventListener('DOMContentLoaded', function() {
    speedSlider.value = slideshow.speed;
    speedValueEl.textContent = `${slideshow.speed}ms`;
  });
</script>
