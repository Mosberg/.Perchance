<style>
  :root{
    --bg:#0d0d12;--surface:#1e1e2e;--surface2:#252538;--border:#2a2a3e;
    --border2:#3a3a4e;--text:#e0e0e0;--text2:#888;--accent:#bb86fc;--accent2:#9c6efd;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:
      radial-gradient(ellipse at 20% 0%,rgba(187,134,252,.06),transparent 50%),
      radial-gradient(ellipse at 80% 100%,rgba(156,110,253,.05),transparent 50%),
      var(--bg);
    color:var(--text);text-align:left;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    height:100vh;display:flex;flex-direction:column;overflow:hidden;
  }
  ::-webkit-scrollbar{width:6px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#333;border-radius:3px}
  ::-webkit-scrollbar-thumb:hover{background:#555}

  #hb{
    background:linear-gradient(135deg,#1a1a2e,#16213e);
    border-bottom:1px solid var(--border);padding:8px 16px;
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    box-shadow:0 2px 12px rgba(0,0,0,.3);z-index:50;flex-shrink:0;
  }
  #hb h1{
    color:var(--accent);font-size:16px;font-weight:700;margin-right:auto;
    display:flex;align-items:center;gap:6px;
    text-shadow:0 0 20px rgba(187,134,252,.3);
  }
  select,input,textarea{
    background:var(--surface);color:var(--text);border:1px solid var(--border);
    border-radius:8px;padding:7px 10px;font-size:13px;font-family:inherit;
    transition:border-color .2s,box-shadow .2s;
  }
  select{cursor:pointer}
  select:hover,input:hover,textarea:hover{border-color:var(--border2)}
  select:focus,input:focus,textarea:focus{
    outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(187,134,252,.15);
  }
  .b{
    border:none;border-radius:8px;padding:7px 12px;font-size:13px;
    cursor:pointer;white-space:nowrap;transition:all .2s;font-family:inherit;
    display:inline-flex;align-items:center;gap:4px;
  }
  .bp{
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:#121212;font-weight:700;box-shadow:0 2px 8px rgba(187,134,252,.3);
  }
  .bp:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 4px 14px rgba(187,134,252,.4)}
  .bp:disabled{opacity:.4;cursor:default;transform:none}
  .bg{background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--text2)}
  .bg:hover{border-color:var(--accent);color:var(--accent);background:rgba(187,134,252,.08)}
  .bd{background:transparent;border:1px solid #c44;color:#e88}
  .bd:hover{background:#c44;color:#fff}

  #main{flex:1;display:flex;overflow:hidden;position:relative}
  #chatCol{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;position:relative}

  #ca{
    flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;
    gap:10px;width:100%;max-width:760px;margin:0 auto;scroll-behavior:smooth;
  }
  .m{
    max-width:85%;padding:10px 14px;border-radius:16px;font-size:14px;
    line-height:1.6;white-space:pre-wrap;word-break:break-word;
    animation:msgIn .25s ease-out;
  }
  @keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .m.u{
    align-self:flex-end;background:linear-gradient(135deg,#6a0dad,#7b1fa2);
    color:#fff;border-bottom-right-radius:4px;box-shadow:0 2px 8px rgba(106,13,173,.25);

  .m.a{
    align-self:flex-start;background:var(--surface);border:1px solid var(--border);

  .m.a .n{

  }
  .m.a .ct{display:inline}
  .m.a .cp{display:inline;vertical-align:bottom}
  .m .ld{color:var(--text2);font-style:italic}
  .pp{width:32px;height:32px;border-radius:50%;object-fit:cover;border:2px solid var(--accent);background:#333;flex-shrink:0}
  .scene-img{max-width:100%;border-radius:10px;margin-top:6px;border:1px solid var(--border);display:block}

    position:absolute;bottom:12px;right:16px;
    background:var(--surface2);color:var(--text);border:1px solid var(--border);

  .td span:nth-child(3){animation-delay:.4s}
  @keyframes bk{0%,60%,100%{opacity:.3}30%{opacity:1}}

  #ib{
    background:linear-gradient(135deg,#1a1a2e,#16213e);
    border-top:1px solid var(--border);padding:10px 16px;

  }
  #ui{
    flex:1;resize:none;max-height:120px;
    background:var(--surface);color:var(--text);border:1px solid var(--border);
    border-radius:12px;padding:10px 14px;font-size:14px;line-height:1.5;
    transition:border-color .2s,box-shadow .2s;
  }

  #sp{
    width:260px;flex-shrink:0;
    background:linear-gradient(180deg,#1a1a2e,#16213e);
    border-left:1px solid var(--border);padding:16px;overflow-y:auto;

    display:flex;flex-direction:column;

  #sp.collapsed{margin-right:-260px;opacity:0;pointer-events:none}

  #pt{
    position:absolute;top:50%;right:260px;transform:translateY(-50%);
    width:20px;height:48px;background:var(--surface);border:1px solid var(--border);
    border-right:none;border-radius:8px 0 0 8px;color:var(--accent);cursor:pointer;
    font-size:14px;z-index:101;display:flex;align-items:center;justify-content:center;
    transition:right .25s;
  }
  #pt.collapsed{right:0}
  #pt:hover{background:var(--surface2)}

  #sp img.lg{width:100%;border-radius:10px;margin-top:8px;border:1px solid var(--border)}
  #sp .lg-wrap{position:relative;margin-top:8px}
  #sp .pl{color:var(--text2);font-size:12px;font-style:italic;margin-top:8px}
  #sp .bio{color:#aaa;font-size:11px;line-height:1.6;margin-top:12px}
  #sp .bio b{color:var(--accent)}
  #sp .pt{color:var(--accent);font-size:13px;font-weight:700;margin:16px 0 6px}
  #sp .pt:first-child{margin-top:0}
  #sp .charSection{margin-top:16px}

  #ce label{display:block;color:var(--text2);font-size:11px;margin:10px 0 4px}
  #ce input,#ce textarea{width:100%;font-size:13px;resize:vertical}
  #ce textarea{min-height:50px}

  .ci{
    display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;
    cursor:pointer;font-size:13px;transition:background .15s;border:1px solid transparent;
  }
  .ci:hover{background:rgba(255,255,255,.04)}
  .ci.act{background:rgba(187,134,252,.1);border-color:var(--accent)}
  .ci img{width:28px;height:28px;border-radius:50%;object-fit:cover;flex-shrink:0;background:#333}
  .ci .cn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ci .cd{color:#c44;cursor:pointer;font-size:16px;opacity:.5;transition:opacity .15s}
  .ci .cd:hover{opacity:1}

  .hi{
    display:flex;align-items:center;gap:8px;padding:10px;border-radius:8px;
    background:var(--surface);margin-bottom:6px;font-size:13px;cursor:pointer;
    border:1px solid transparent;transition:border-color .15s;
  }
  .hi:hover{border-color:var(--accent)}
  .hi .hn{flex:1}
  .hi .hd{color:var(--text2);font-size:11px;margin-top:2px}

  #mo{
    position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);
    z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;
  }
  #mo[hidden]{display:none}
  #mb{
    background:linear-gradient(135deg,#1a1a2e,#16213e);
    border:1px solid var(--border);border-radius:16px;padding:24px;
    max-width:620px;width:100%;max-height:90vh;overflow-y:auto;
    box-shadow:0 8px 32px rgba(0,0,0,.4);
  }
  #mb h2{color:var(--accent);font-size:18px;margin-bottom:12px}
  #mb p{color:#aaa;font-size:14px;line-height:1.5;margin-bottom:16px}
  .ai-fill{font-size:12px;color:var(--text2);font-style:italic;margin-top:8px}

  @media(max-width:768px){
    #hb{gap:6px;padding:8px 10px}
    #hb h1{font-size:14px;width:100%;margin-bottom:2px}
    #hb .b{padding:6px 8px;font-size:12px}
    select{font-size:12px;padding:6px 8px}
    #sp{position:absolute;right:0;top:0;bottom:0;z-index:100;box-shadow:-4px 0 24px rgba(0,0,0,.5)}
    #sp.collapsed{margin-right:0;transform:translateX(100%);opacity:1}
    #pt{right:260px}
    #pt.collapsed{right:0}
    .m{max-width:92%}
    #ca{padding:10px}
    #ib{padding:8px 10px}
    #mb{max-width:95vw;padding:16px}
  }
</style>

<div id="hb">
  <h1>🎭 AI Roleplay Chat</h1>
  <button class="b bd" onclick="openTranslate()">🌐 Translate</button>
  <button class="b bd" onclick="resetAll()">🗑️ Reset</button>

<script>
window.addEventListener("unhandledrejection",e=>{if(e.reason&&/replaceState|History/.test(e.reason.message||"")){e.preventDefault();console.warn("Suppressed engine replaceState error")}});
(async function(){
delete window.__alreadyAddedAiTextPluginStuff8492739;
delete window.__aiTextIframeEmbedIsReady;
delete window.__alreadyTriggeredAiTextPluginPreload8492739;
let oi=document.querySelector("#aiTextPluginEmbedIframe");if(oi)oi.remove();

const DC=[
  {n:"May the Swordswoman",v:"anime style portrait of a young female swordsman with short silver hair, red eyes, wielding a katana, confident smile, fantasy adventure outfit, detailed digital art",
   b:"A young girl trained in swordsmanship since childhood, top disciple of the Sacred Sword School. Her parents died when she was young, and she set out to find the rival school and avenge her family.",
   p:"Confident, strong, sharp-tongued but secretly gentle. Loves sweets, stubborn, never gives up easily.",

   pn:"The Traveler",pb:"A wandering adventurer who knows the border towns well, resting at a tavern after a long journey.",pv:"anime style portrait of a young male traveler with brown hair, green eyes, leather armor, carrying a travel backpack, friendly expression, fantasy adventure outfit, detailed digital art"},
  {n:"Rin the Fire Mage",v:"anime style portrait of a beautiful female fire mage with long crimson hair, golden eyes, holding a flame in her hand, elegant red and black robe, mystical aura, detailed digital art",
   b:"Heir to an ancient fire magic bloodline, born with magical power too intense to control. She accidentally burned down a village as a child and fled home to learn to control her power.",
   p:"Fiery like fire, moody, shy about personal topics, stubborn but deeply cares about those around her. Praises with her mouth, scolds with her heart.",
   s:"Overall story: Rin is traveling to find a renowned mage said to be able to teach fire magic control. Along the way she must flee from magic hunters pursuing her for her power.\nThe meeting: The player is traveling through a forest and hears an explosion. Rushing over, they find Rin fighting magic hunters. She is injured and exhausted, and the player rescues her just in time.",
   pn:"The Forest Wanderer",pb:"A kind-hearted traveler exploring ancient forests, skilled in basic healing magic and survival.",pv:"anime style portrait of a young male forest wanderer with dark green hair, hazel eyes, simple green cloak, carrying a walking staff, gentle expression, fantasy ranger outfit, detailed digital art"},
  {n:"Yuki the Ice Witch",v:"anime style portrait of a cool female ice witch with long pale blue hair, icy blue eyes, frost crystals around her, elegant white and blue dress, ethereal beauty, detailed digital art",
   b:"A young woman who inherited ice magic from the Reaper of Winter. Born with eyes that can see spirits. She lived alone in an ice cave on a high mountain, descending for the first time because she wants to know the outside world.",
   p:"Cold, calm, quiet, seems indifferent but is actually curious and inquisitive. Not good at expressing emotions. Has broad knowledge.",
   s:"Overall story: Yuki descends from the mountain for the first time in her life, having sensed a dangerous signal that an ancient demon is awakening. She must find allies to prevent a coming disaster, but has never socialized before.\nThe meeting: The player finds Yuki standing still in the middle of a marketplace, shivering as she looks at everything around her in amazement. She looks lonely and out of place. The player approaches her, and she asks them to help guide her through the human world.",
   pn:"The Guide",pb:"A knowledgeable local who knows the city well, offering to help a stranger navigate the human world.",pv:"anime style portrait of a friendly young male city guide with messy black hair, warm brown eyes, casual town clothes, kind smile, holding a map, detailed digital art"},
  {n:"Sakura the Ninja",v:"anime style portrait of a cute female ninja with black hair in a ponytail, violet eyes, wearing dark ninja outfit with pink accents, holding a kunai, cherry blossoms background, detailed digital art",
   b:"A ninja from a destroyed hidden village, the sole survivor. Works as a hired ninja to find clues about whoever destroyed her village. Skilled at disguise and espionage. Usually works alone but is starting to open up to those she can trust.",
   p:"Cheerful, loves teasing people, sharp-tongued but funny, highly vigilant, sincere with few people. Has a weakness for pets. Acts casual but goes all in when serious.",
   s:"Overall story: Sakura receives an assassination mission targeting someone hiding in a big city, but discovers the target is connected to the destruction of her village. She must spy and gather information in secret.\nThe meeting: The player walks through a small alley and happens to find Sakura disguised as a snack vendor. She senses the player saw something they shouldn't have, and pulls them into her plan as a tool.",
   pn:"The Bystander",pb:"An ordinary city dweller who accidentally stumbled upon a ninja's secret and got pulled into a dangerous spy mission.",pv:"anime style portrait of a surprised young male city dweller with neat brown hair, blue eyes, casual modern clothes, confused expression, urban setting, detailed digital art"},
];
const STYLES={
  "anime":"🎨 Anime",
  "photo":"📷 Photo-realistic",
  "3d":"🧊 3D Render",
  "paint":"🖌️ Oil Painting",
  "watercolor":"💧 Watercolor",
  "pixel":"👾 Pixel Art",
  "comic":"💬 Comic Book",
  "sketch":"✏️ Sketch",
  "fantasy":"🐉 Fantasy Art",
};
const STYLE_PREFIX={
  "anime":"anime style, ",
  "photo":"photorealistic, real photo, ",
  "3d":"3D render, CGI, ",
  "paint":"oil painting, ",
  "watercolor":"watercolor painting, ",
  "pixel":"pixel art, ",
  "comic":"comic book style, ",
  "sketch":"pencil sketch, ",
  "fantasy":"digital fantasy art, ",
};

const $=id=>document.getElementById(id);
const esc=s=>String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const rnd=arr=>arr[Math.floor(Math.random()*arr.length)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const {countTokens,idealMaxContextTokens}=root.generateText({getMetaObject:true});
const KEEP=8;

let chars,pC={},ppC={},charName="",charSet="",summary="",messages=[],gen=false,compacting=false,curChatId=null,chatGen=0,chatTTS=true,curCtx=null,editorPortraitData=undefined,editorPlayerPortraitData=undefined;

// --- kv storage (wrapped in try/catch so UI always renders even if kv fails) ---
try{
chars=await root.kv.data.get("chars");
if(!chars){chars=structuredClone(DC);await root.kv.data.set("chars",chars)}
else{
  let oldThai=["\u0e40\u0e21\u0e22\u0e4c \u0e19\u0e31\u0e01\u0e14\u0e32\u0e1a\u0e2a\u0e32\u0e27","\u0e23\u0e34\u0e19 \u0e19\u0e31\u0e01\u0e40\u0e25\u0e48\u0e19\u0e44\u0e1f\u0e2a\u0e32\u0e27","\u0e22\u0e39\u0e01\u0e34 \u0e41\u0e21\u0e48\u0e21\u0e14\u0e19\u0e49\u0e33\u0e41\u0e02\u0e47\u0e07","\u0e0b\u0e32\u0e01\u0e38\u0e23\u0e30 \u0e19\u0e34\u0e19\u0e08\u0e32\u0e2a\u0e32\u0e27"];
  let changed=false;
  chars.forEach((c,i)=>{let idx=oldThai.indexOf(c.n);if(idx>=0){chars[i]=structuredClone(DC[idx]);changed=true}});
  chars.forEach(c=>{if(!c.pn){c.pn=DC.find(d=>d.n===c.n)?.pn||"";c.pb=DC.find(d=>d.n===c.n)?.pb||"";c.pv=DC.find(d=>d.n===c.n)?.pv||"";changed=true}});
  if(changed)await root.kv.data.set("chars",chars);
}
let pE=await root.kv.portraits.entries();pC=Object.fromEntries(pE);
let ppE=await root.kv.playerPortraits.entries();ppC=Object.fromEntries(ppE);
}catch(kvErr){console.warn("kv init failed, using defaults:",kvErr);chars=structuredClone(DC);pC={};ppC={}}
const saveChars=()=>root.kv.data.set("chars",chars);
const savePortrait=(n,d)=>{pC[n]=d;return root.kv.portraits.set(n,d)};
const delPortrait=n=>{delete pC[n];return root.kv.portraits.delete(n)};
const savePlayerPortrait=(n,d)=>{ppC[n]=d;return root.kv.playerPortraits.set(n,d)};
const delPlayerPortrait=n=>{delete ppC[n];return root.kv.playerPortraits.delete(n)};

const getChar=()=>chars.find(c=>c.n===charName);
const scroll=()=>$("ca").scrollTop=$("ca").scrollHeight;

function buildPrompt(task){
  let c=getChar();if(!c)return"";
  let log=[summary&&`[Summary of previous conversation:\n${summary}]`,...messages.filter(m=>!m.startsWith("SCENE_IMG::"))].filter(Boolean);
  return`You are roleplaying as a character in a roleplay game. Respond in English.

Character: ${c.n}
Appearance: ${c.v}
Background: ${c.b}
Personality: ${c.p}
Story & Opening Scene: ${c.s||"-"}
${c.pn?`\nPlayer Character: ${c.pn}`:""}${c.pb?`\nPlayer Background: ${c.pb}`:""}
Setting: ${charSet}

Rules:
- Use dialogue and action descriptions in parentheses, e.g. (walks closer)
- Keep responses short, 1-4 sentences
- Stay in character at all times, never break character

<conversation>
${log.join("\n\n")}
</conversation>

TASK: ${task}`;
}

function addMsg(text,role,name){
  let el=document.createElement("div");el.className="m "+(role==="ai"?"a":"u");
  if(role==="ai"){
    let img=pC[name]?`<img class="pp" src="${pC[name]}">`:"";
    let spk=name!=="Image System"?`<span class="spk" onclick="event.stopPropagation();speakMsg(this)" style="cursor:pointer;font-size:12px;opacity:.4;margin-left:auto" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=.4">🔊</span>`:"";
    el.innerHTML=`<span class="n">${img}${esc(name)}${spk}</span><span class="ct"></span><span class="cp" onclick="event.stopPropagation();copyMsg(this)" style="cursor:pointer;font-size:12px;opacity:.4;margin-left:4px;flex-shrink:0;align-self:flex-end" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=.4">📋</span>`;
    el.dataset.char=name;
    el.querySelector(".ct").textContent=text;
  }else{
    let c=getChar();
    let pimg=ppC[charName]?`<img class="pp" style="border-color:#fff" src="${ppC[charName]}">`:"";
    let pname=c&&c.pn?esc(c.pn):"You";
    el.innerHTML=`<span class="n" style="color:#fff;opacity:.9;font-weight:600;font-size:12px;display:flex;align-items:center;gap:6px;margin-bottom:4px;justify-content:flex-end">${pname}${pimg}</span><span class="ct"></span>`;
    el.querySelector(".ct").textContent=text;
  }
  $("ca").appendChild(el);scroll();return el;

window.genSceneImg=async function(){
  if(gen||!messages.length){alert("No conversation to generate an image from");return}
  let g=++chatGen;
  gen=true;$("sBtn").disabled=true;
  let c=getChar();
  let promptMsg=addMsg("🎨 Generating scene image...","ai","Image System").querySelector(".ct");
  try{
    let lastMsgs=messages.slice(-6).join("\n");
    let ctxParts=[summary&&`[Summary of earlier conversation:\n${summary}]`,lastMsgs].filter(Boolean).join("\n\n");
    let r=await root.generateText(`write short prompt (max 150 words) for describe the current scene visually. Character visual reference: ${c.v}.${c.pv?` Player character visual reference: ${c.pv}.`:""} Setting: ${charSet}. Output ONLY the prompt, no explanation.

Conversation:
${ctxParts}`);
    if(chatGen!==g)return;
    let imgPrompt=r.text.trim().replace(/^["']|["']$/g,"");
    let styledPrompt=(STYLE_PREFIX[c.style||"anime"]||"")+imgPrompt;
    promptMsg.textContent="🎨 Drawing image... ("+imgPrompt.slice(0,50)+"...)";
    let img=await root.generateImage(styledPrompt,{resolution:"768x512"});
    if(chatGen!==g)return;
    let el=document.createElement("img");el.className="scene-img";el.src=img.dataUrl;
    promptMsg.innerHTML="";promptMsg.appendChild(el);
    messages.push("SCENE_IMG::"+img.dataUrl);saveChat();
  }catch(e){if(chatGen===g)promptMsg.textContent="⚠️ Failed to generate image"}
  if(chatGen===g){gen=false;$("sBtn").disabled=false}
};

window.aiFillChar=async function(){
  let n=$("e_n").value.trim(),v=$("e_v").value.trim(),b=$("e_b").value.trim(),p=$("e_p").value.trim(),s=$("e_s").value.trim(),pn=$("e_pn").value.trim(),pb=$("e_pb").value.trim(),pv=$("e_pv").value.trim();
  let empty=[];
  if(!v)empty.push("v: image prompt (English)");
  if(!b)empty.push("b: background");
  if(!p)empty.push("p: personality");
  if(!s)empty.push("s: story & opening scene");
  if(!pn)empty.push("pn: player name");
  if(!pb)empty.push("pb: player background");
  if(!pv)empty.push("pv: player image prompt (English)");
  if(!empty.length){alert("All fields are filled");return}
  let btn=$("aiFillBtn");btn.disabled=true;btn.textContent="⏳ Thinking...";
  try{
    let known=[];
    if(n)known.push(`Name: ${n}`);
    if(v)known.push(`Image prompt: ${v}`);
    if(b)known.push(`Background: ${b}`);
    if(p)known.push(`Personality: ${p}`);
    if(s)known.push(`Story: ${s}`);
    if(pn)known.push(`Player name: ${pn}`);
    if(pb)known.push(`Player background: ${pb}`);
    if(pv)known.push(`Player image prompt: ${pv}`);
    let r=await root.generateText(`Help complete a roleplay character and their player. Respond as JSON only, no explanation.

Known info:
${known.join("\n")||"(no info yet)"}

Fields to fill: ${empty.join(", ")}

For v and pv (image prompts), write in English. For all other fields, write in English.
Respond as JSON: {"v":"...","b":"...","p":"...","s":"...","pn":"...","pb":"...","pv":"..."} with only the empty fields.`);
    let txt=r.text.trim().replace(/```json|```/g,"").trim();
    let m=txt.match(/\{[\s\S]*\}/);
    if(!m){alert("Failed to process");return}
    let d=JSON.parse(m[0]);
    if(d.v&&v==="")$("e_v").value=d.v;
    if(d.b&&b==="")$("e_b").value=d.b;
    if(d.p&&p==="")$("e_p").value=d.p;
    if(d.s&&s==="")$("e_s").value=d.s;
    if(d.pn&&pn==="")$("e_pn").value=d.pn;
    if(d.pb&&pb==="")$("e_pb").value=d.pb;
    if(d.pv&&pv==="")$("e_pv").value=d.pv;
  }catch(e){alert("AI fill failed: "+e.message)}
  btn.disabled=false;btn.textContent="🤖 AI Fill";
};

              <input type="file" id="e_pfile" accept="image/*" style="display:none" onchange="uploadEditorPlayerPortrait(this)">
            </div>
            <div style="color:var(--text2);font-size:11px;line-height:1.4">Player portrait shows next to your messages (optional). Uses the Player Image Prompt below.</div>
          </div>
        </div>
        <div style="display:flex;gap:10px">
          <div style="flex:1"><label>Player Name</label><input type="text" id="e_pn" value="${esc(c.pn||"")}" placeholder="e.g. The Hero"></div>
        </div>
        <div><label>Player Background</label><textarea id="e_pb" placeholder="Who is the player in this story?" style="min-height:46px">${esc(c.pb||"")}</textarea></div>
        <div><label>Player Image Prompt (English)</label><textarea id="e_pv" placeholder="anime style portrait of the player character..." style="min-height:46px">${esc(c.pv||"")}</textarea></div>
      </div>
    </div>
    <div style="display:flex;gap:8px;margin-top:14px;justify-content:flex-end">
    <button class="b bg" onclick="closeModal()">Cancel</button>
    <button class="b bp" onclick="saveChar(${ed?`'${sn}'`:'null'})">${ed?'Save':'Create'}</button>
    </div>`;
  $("mo").hidden=false;
};
window.saveChar=async function(oldName){
  let n=$("e_n").value.trim(),v=$("e_v").value.trim(),b=$("e_b").value.trim(),p=$("e_p").value.trim(),s=$("e_s").value.trim(),voice=$("e_voice").value,style=$("e_style").value,pn=$("e_pn").value.trim(),pb=$("e_pb").value.trim(),pv=$("e_pv").value.trim();
  if(!n){alert("Name is required");return}
  if(oldName){
    let c=chars.find(c=>c.n===oldName);if(n!==oldName){await delPortrait(oldName);await delPlayerPortrait(oldName)}
    Object.assign(c,{n,v,b,p,s,voice,style,pn,pb,pv});
  }else{
    if(chars.find(c=>c.n===n)){alert("Name already exists");return}
    chars.push({n,v,b,p,s,voice,style,pn,pb,pv});charName=n;
  }
  if(editorPortraitData){await savePortrait(n,editorPortraitData)}
  if(editorPlayerPortraitData){await savePlayerPortrait(n,editorPlayerPortraitData)}
  await saveChars();renderList();
  if(oldName&&oldName!==n){charName=n}
  if(oldName){genPortrait();updateBio();closeModal()}
  else{genPortrait();updateBio();newChat();closeModal()}
};

window.closeModal=()=>$("mo").hidden=true;
window.openModal=(title,body,onConfirm)=>{
  $("mb").innerHTML=`<h2>${title}</h2><p>${body}</p><div style="display:flex;gap:8px"><button class="b bd" style="flex:1" id="mc">Confirm</button><button class="b bg" onclick="closeModal()">Cancel</button></div>`;
  $("mo").hidden=false;$("mc").onclick=onConfirm;
};
window.togglePanel=()=>{let p=$("sp"),t=$("pt");p.classList.toggle("collapsed");t.classList.toggle("collapsed");t.textContent=p.classList.contains("collapsed")?"‹":"›"};

const streamGen=(task,ce,ctx)=>root.generateText({
  instruction:buildPrompt(task),startWith:`${charName}: `,stopSequences:["\nPlayer:"],
  onChunk:d=>{ce.textContent=d.fullTextSoFar.replace(/^.*?:\s*/,"");scroll()},
  onFinish:data=>{
    if(!ctx||ctx.done)return;
    let t=(data.text||"").replace(/^.*?:\s*/,"").trim();if(!t)return;
    let cid=ctx.chatId;
    if(ctx.stillActive){
      // normal case: .then() will handle push+save
      return;
    }
    // character was switched mid-stream: save to old chat
    ctx.done=true;
    ctx.messages.push(t);
    if(!cid)return;
    root.kv.chats.get(cid).then(saved=>{
      if(saved){saved.messages=ctx.messages.slice();saved.summary=ctx.summary;root.kv.chats.set(cid,saved)}
    }).catch(()=>{});
  },
});

window.sendMessage=async function(){
  let text=$("ui").value.trim();if(!text||gen)return;
  $("ui").value="";$("ui").style.height="auto";
  addMsg(text,"user");messages.push(`Player: ${text}`);
  let g=++chatGen;
  gen=true;$("sBtn").disabled=true;
  if(!curChatId){curChatId=uid()}
  let ce=addMsg("","ai",charName).querySelector(".ct");
  let ctx=curCtx={messages,summary,chatId:curChatId,charName,stillActive:true};
  try{let r=await streamGen(`Write the next reply in character as "${charName}". Do not include a name prefix.`,ce,ctx);if(chatGen!==g)return;let t=r.text.trim();messages.push(t);maybeCompact();ctx.summary=summary;ctx.done=true;saveChat();chatSpeak(t)}
  catch(e){if(chatGen!==g)return;ce.textContent="⚠️ An error occurred. Try again."}
  gen=false;$("sBtn").disabled=false;$("ui").focus();
};

async function genSetting(){
  if(!messages.length)return;
  try{
    let log=[summary&&`[Summary: ${summary}]`,...messages.filter(m=>!m.startsWith("SCENE_IMG::"))].filter(Boolean).join("\n");
    let r=await root.generateText(`Based on this roleplay conversation, describe the current setting/scene in ONE concise English sentence (where are they, what is the atmosphere, time of day). Do not describe what characters are doing, only the setting.\n\nConversation:\n${log}\n\nOutput ONLY the setting description.`);
    charSet=r.text.trim();
    saveChat();
  }catch(e){}
}

async function maybeCompact(){
  if(compacting||messages.length<=KEEP)return;
  if(countTokens(buildPrompt(""))<idealMaxContextTokens*0.9)return;
  compacting=true;
  try{
    let n=messages.length-KEEP,bd=messages[n-1].slice(-30);
    let r=await root.generateText(buildPrompt(`Summarize the first ${n} messages, stopping at the message ending with "${bd}". Include the previous summary. Keep it concise, in English.`));
    summary=r.text.trim();messages=messages.slice(n);
    genSetting();
  }finally{compacting=false}
}

window.handleKey=e=>{if(e.key=="Enter"&&!e.shiftKey){e.preventDefault();sendMessage()}};
window.autoResize=el=>{el.style.height="auto";el.style.height=Math.min(el.scrollHeight,120)+"px"};
window.scrollToBottom=scroll;

window.toggleChatTTS=function(){
  chatTTS=!chatTTS;
  let btn=$("ttsToggleBtn");
  btn.textContent=chatTTS?"🔊 Auto":"🔇 Auto";
  btn.style.color=chatTTS?"var(--accent)":"";
  btn.style.borderColor=chatTTS?"var(--accent)":"";
  if(!chatTTS&&window.stopSpeak)window.stopSpeak();
};
window.openTTSPage=()=>{$("ttsPage").hidden=false};
window.closeTTSPage=()=>{$("ttsPage").hidden=true};
let ttsSpeaking=false;
window.speakMsg=function(el){
  let m=el.closest(".m");
  let ct=m.querySelector(".ct");
  if(!ct||!ct.textContent.trim())return;
  if(ttsSpeaking)return;
  let text=ct.textContent;
  let charN=m.dataset.char||charName;
  let c=chars.find(ch=>ch.n===charN);
  let voice=c?c.voice:null;
  let lang=/[\u0E00-\u0E7F]/.test(text)?"th-TH":/[\u3040-\u30FF]/.test(text)?"ja-JP":"en-US";
  if(window.speakText){
    ttsSpeaking=true;
    let spk=el;let o=spk.textContent;spk.textContent="⏳";
    window.speakText(text,{lang,voice,onEnded:()=>{ttsSpeaking=false;spk.textContent=o}});
  }
};
window.copyMsg=function(el){
  let m=el.closest(".m");
  let ct=m.querySelector(".ct");
  if(!ct||!ct.textContent.trim())return;
  navigator.clipboard.writeText(ct.textContent).then(()=>{
    let o=el.textContent;el.textContent="✅";
    setTimeout(()=>el.textContent=o,1200);
  });
};
function chatSpeak(text){
  if(!chatTTS||!text)return;
  let clean=String(text).replace(/^.*?:\s*/,"").trim();
  if(!clean)return;
  let c=getChar();
  let voice=c?c.voice:null;
  let lang=/[\u0E00-\u0E7F]/.test(clean)?"th-TH":/[\u3040-\u30FF]/.test(clean)?"ja-JP":"en-US";
  if(window.speakText)window.speakText(clean,{lang,voice,onEnded:()=>{ttsSpeaking=false}});
}

// init
charSet="";
if(!getChar())charName=chars[0]?.n||"";
renderList();genPortrait();updateBio();
try{if(!(await loadLatestChat(charName)))newChat();}catch(e){console.warn("loadLatestChat failed:",e);newChat();}
$("ca").addEventListener("scroll",()=>{$("sb").style.display=($("ca").scrollHeight-$("ca").scrollTop-$("ca").clientHeight>100)?"block":"none"});
$("mo").addEventListener("click",e=>{if(e.target===$("mo"))closeModal()});
})().catch(e=>console.error("App init failed:",e));
</script>



<style>
  #ttsPage {
    position: fixed; inset: 0; z-index: 300; overflow-y: auto;
    text-align: center; font-family: system-ui, sans-serif; background: #1a1a2e; color: #eee;

  #ttsPage .voice-btn { background: #16213e; border: 1px solid #334; border-radius: 8px; padding: 8px 14px; font-size: .85rem; cursor: pointer; color: #eee; transition: all .15s; }
  #ttsPage .voice-btn:hover { border-color: #4a6a9a; }
  #ttsPage .voice-btn.active { background: #0f3460; border-color: #1a4a8a; color: #7ec8ff; }

</style>

<div id="ttsPage" hidden>
  <button class="back-btn" onclick="closeTTSPage()">← Back to Chat</button>
  <h1>🔊 Text to Speech</h1>

  <textarea id="textEl" placeholder="Type your text here...">Hello, welcome to the text-to-speech system!</textarea>

  <div class="ctrl-row">
    <input id="aiInputEl" type="text" placeholder="Topic for AI to write about, e.g. The Brave Little Cat" style="width:60%;max-width:400px;border-radius:8px;border:1px solid #444;background:#16213e;color:#eee;padding:10px 14px;font-size:.95rem;">
    <select id="aiModeEl">
      <option value="story">Short Story</option>
      <option value="poem">Poem</option>
      <option value="news">News</option>
      <option value="joke">Joke</option>
      <option value="essay">Essay</option>
      <option value="quote">Quote</option>
      <option value="recipe">Recipe</option>
      <option value="review">Review</option>
    </select>
    <button id="aiBtn" onclick="generateAIText()" style="font-size:.9rem;padding:8px 16px;">✨ AI Write</button>
  </div>

  <div class="ctrl-row">
    Language: <select id="langEl">
      <option value="th-TH">ไทย</option>
      <option value="en-US">English (US)</option>
      <option value="ja-JP">日本語</option>
      <option value="ko-KR">한국어</option>
      <option value="zh-CN">中文</option>
      <option value="vi-VN">Tiếng Việt</option>
    </select>
    Speed: <select id="rateEl">
      <option value="0.5">0.5x</option>
      <option value="0.75">0.75x</option>
      <option value="1" selected>1x</option>
      <option value="1.25">1.25x</option>
      <option value="1.5">1.5x</option>
      <option value="2">2x</option>
    </select>
    Volume: <select id="gainEl">
      <option value="1">1x</option>
      <option value="1.5">1.5x</option>
      <option value="2.5" selected>2.5x</option>
      <option value="4">4x</option>
    </select>
  </div>

  <div class="ctrl-row" style="font-size:.8rem;color:#889;">— Select Voice —</div>
  <div class="voice-grid" id="voiceGrid"></div>

  <div class="btn-row">
    <button class="speak-btn" id="speakBtn" onclick="speak()">🔊 Speak</button>
    <button id="stopBtn" onclick="stopSpeak()">⏹ Stop</button>
  </div>

  <div id="statusEl"></div>
</div>

<script>
  if (window._ttsReady) { } else {
    window._ttsReady = true;
    var audioCtx, gainNode, currentSrc, currentFilter1, currentFilter2, currentFilter3;

    var voices = {
      "default":      { detune: 0,    f1Type: "highshelf", f1Freq: 2000, f1Gain: 0,   f2Type: "lowshelf",  f2Freq: 300,  f2Gain: 0,   label: "🎙️ Default" },
      "female_soft":  { detune: 200,  f1Type: "highshelf", f1Freq: 2500, f1Gain: 8,   f2Type: "lowshelf",  f2Freq: 400,  f2Gain: -3,  label: "👩 Female Soft" },
      "female_bright":{ detune: 350,  f1Type: "highshelf", f1Freq: 3000, f1Gain: 12,  f2Type: "lowshelf",  f2Freq: 350,  f2Gain: -6,  label: "💁‍♀️ Female Bright" },
      "female_warm":  { detune: 250,  f1Type: "peaking",   f1Freq: 1800, f1Gain: 6,   f2Type: "highshelf", f2Freq: 3500, f2Gain: 5,   label: "🥰 Female Warm" },
      "female_sweet": { detune: 400,  f1Type: "peaking",   f1Freq: 2200, f1Gain: 8,   f2Type: "highshelf", f2Freq: 4000, f2Gain: 7,   label: "🌸 Female Sweet" },
      "female_cool":  { detune: 300,  f1Type: "highshelf", f1Freq: 3200, f1Gain: 10,  f2Type: "peaking",   f2Freq: 1200, f2Gain: 4,   label: "😎 Female Cool" },
      "female_mature":{ detune: 150,  f1Type: "peaking",   f1Freq: 1500, f1Gain: 5,   f2Type: "highshelf", f2Freq: 3000, f2Gain: 4,   label: "👩‍💼 Female Mature" },
      "female_young": { detune: 500,  f1Type: "highshelf", f1Freq: 3500, f1Gain: 14,  f2Type: "lowshelf",  f2Freq: 300,  f2Gain: -8,  label: "👧 Female Young" },
      "female_whisper":{detune: 200,  f1Type: "bandpass",  f1Freq: 2500, f1Gain: 0,   f2Type: "highshelf", f2Freq: 4000, f2Gain: 6,   label: "🤫 Female Whisper", q: 0.8 },
      "child":        { detune: 700,  f1Type: "highshelf", f1Freq: 4000, f1Gain: 15,  f2Type: "lowshelf",  f2Freq: 250,  f2Gain: -10, label: "🧒 Child" },
      "male_soft":    { detune: -150, f1Type: "lowshelf",  f1Freq: 300,  f1Gain: 5,   f2Type: "highshelf", f2Freq: 3000, f2Gain: -2,  label: "👨 Male Soft" },
      "male_deep":    { detune: -350, f1Type: "lowshelf",  f1Freq: 250,  f1Gain: 8,   f2Type: "highshelf", f2Freq: 2500, f2Gain: -4,  label: "🧔 Male Deep" },
      "giant":        { detune: -700, f1Type: "lowshelf",  f1Freq: 200,  f1Gain: 12,  f2Type: "highshelf", f2Freq: 2000, f2Gain: -8,  label: "👹 Giant" },
      "robot":        { detune: 0,    f1Type: "bandpass",  f1Freq: 1500, f1Gain: 0,   f2Type: "bandpass",  f2Freq: 3000, f2Gain: 0,   label: "🤖 Robot", q: 0.5 },
    };
    var currentVoice = "default";

    function buildVoiceGrid() {
      voiceGrid.innerHTML = "";
      for (let key in voices) {
        let v = voices[key];
        let btn = document.createElement("button");
        btn.className = "voice-btn" + (key === currentVoice ? " active" : "");
        btn.textContent = v.label;
        btn.onclick = () => { currentVoice = key; buildVoiceGrid(); };
        voiceGrid.appendChild(btn);
      }
    }
    buildVoiceGrid();
    window.ttsVoices = voices;
    window.getTTSVoice = () => currentVoice;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === "suspended") audioCtx.resume();
    }

    window.speakText = async function(text, opts) {
      opts = opts || {};
      if (!text || !text.trim()) return false;
      if (currentSrc) { try { currentSrc.stop(); } catch(e){} currentSrc = null; }
      try {
        initAudio();
        let lang = (opts.lang || langEl.value).split("-")[0];
        let rate = opts.rate || parseFloat(rateEl.value);
        let gain = opts.gain || parseFloat(gainEl.value);
        let vp = voices[opts.voice || currentVoice] || voices["default"];
        let chunks = text.match(/.{1,200}/g) || [text];
        let buffers = [];
        for (let chunk of chunks) {
          let url = "https://translate.google.com/translate_tts?ie=UTF-8&tl=" + lang + "&client=tw-ob&q=" + encodeURIComponent(chunk);
          let resp = await root.superFetch(url);
          let arrBuf = await resp.arrayBuffer();
          buffers.push(await audioCtx.decodeAudioData(arrBuf));
        }
        let totalLen = buffers.reduce((s, b) => s + b.length, 0);
        let combined = audioCtx.createBuffer(buffers[0].numberOfChannels, totalLen, buffers[0].sampleRate);
        for (let ch = 0; ch < combined.numberOfChannels; ch++) {
          let offset = 0;
          for (let b of buffers) { combined.getChannelData(ch).set(b.getChannelData(ch), offset); offset += b.length; }
        }
        currentSrc = audioCtx.createBufferSource();
        currentSrc.buffer = combined;
        currentSrc.playbackRate.value = rate;
        currentSrc.detune.value = vp.detune;
        currentFilter1 = audioCtx.createBiquadFilter();
        currentFilter1.type = vp.f1Type; currentFilter1.frequency.value = vp.f1Freq; currentFilter1.gain.value = vp.f1Gain;
        if (vp.q) currentFilter1.Q.value = vp.q;
        currentFilter2 = audioCtx.createBiquadFilter();
        currentFilter2.type = vp.f2Type; currentFilter2.frequency.value = vp.f2Freq; currentFilter2.gain.value = vp.f2Gain;
        currentFilter3 = audioCtx.createBiquadFilter();
        currentFilter3.type = "peaking"; currentFilter3.frequency.value = 1000;
        currentFilter3.gain.value = vp.detune > 100 ? 3 : -1; currentFilter3.Q.value = 0.7;
        gainNode = audioCtx.createGain(); gainNode.gain.value = gain;
        currentSrc.connect(currentFilter1); currentFilter1.connect(currentFilter2);
        currentFilter2.connect(currentFilter3); currentFilter3.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        if (opts.onEnded) currentSrc.onended = opts.onEnded;
        currentSrc.start();
        return true;
      } catch (e) { if (opts.onEnded) opts.onEnded(); return false; }
    };

    window.speak = async function() {
      let text = textEl.value.trim();
      if (!text) { statusEl.textContent = "Please type some text first"; return; }
      statusEl.textContent = "Loading audio...";
      speakBtn.disabled = true;
      let ok = await window.speakText(text, { onEnded: () => { statusEl.textContent = "Done"; resetBtn(); } });
      if (ok) { statusEl.textContent = "Speaking..."; speakBtn.classList.add("speaking"); speakBtn.textContent = "⏸ Speaking"; }
      else { statusEl.textContent = "Failed to load"; resetBtn(); }
    };

    function resetBtn() { speakBtn.classList.remove("speaking"); speakBtn.textContent = "🔊 Speak"; speakBtn.disabled = false; }

    window.stopSpeak = function() {
      if (currentSrc) { try { currentSrc.stop(); } catch(e){} currentSrc = null; }
      ttsSpeaking = false;
      resetBtn();
    };

    window.randomText = function() {
      textEl.value = "[sampleText]".evaluateItem;
    };

    var aiPrompts = {
      story:  "Write a short story in Thai, about 100-150 words, about: {TOPIC}. Include characters, a beginning, a conflict, and end with a twist. No title needed.",
      poem:   "Write a poem in Thai, 4-6 stanzas, about: {TOPIC}. Make it rhyme beautifully. No stanza titles.",
      news:   "Write a short news report in Thai like a news anchor, about: {TOPIC}. Make it interesting with facts and details.",
      joke:   "Write a short funny joke in Thai about: {TOPIC}. Make it humorous and concise.",
      essay:  "Write a short essay in Thai, about 100-150 words, about: {TOPIC}. Include opinions and reasoning.",
      quote:  "Write 5 witty quotes in Thai about: {TOPIC}. Each quote on its own line.",
      recipe: "Write a short recipe in Thai for: {TOPIC}. Include ingredients and concise instructions.",
      review: "Write a short review in Thai about: {TOPIC}. Include both pros and suggestions.",
    };

    window.generateAIText = async function() {
      let topic = aiInputEl.value.trim();
      if (!topic) { statusEl.textContent = "Please enter a topic first"; return; }
      let mode = aiModeEl.value;
      let prompt = aiPrompts[mode].replace("{TOPIC}", topic);
      stopSpeak();
      aiBtn.disabled = true;
      aiBtn.textContent = "⏳ Writing...";
      statusEl.textContent = "AI is writing...";
      textEl.value = "";
      textEl.placeholder = "AI is writing...";
      try {
        let result = await root.generateText({
          instruction: prompt,
          onChunk: (data) => { textEl.value = data.fullTextSoFar; },
        });
        textEl.value = result.text.trim();
        statusEl.textContent = "AI done! Speaking...";
        speak();
      } catch(e) {
        statusEl.textContent = "AI error: " + e.message;
      } finally {
        aiBtn.disabled = false;
        aiBtn.textContent = "✨ AI Write";
      }
    };
  }
</script>
