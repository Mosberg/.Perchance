<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>polypersona — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<!-- =================================================== -->
<!-- 1. STYLES — IDENTITÉ "GRIMOIRE / CATALOGUE"         -->
<!-- =================================================== -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    --ink-900: #15131c;
    --ink-800: #1e1c28;
    --ink-700: #2a2735;
    --ink-600: #3c3849;
    --parchment: #efe9dc;
    --dust: #948da3;
    --brass: #c99a5c;
    --brass-dim: #a37f4b;
    --danger: #c9605c;
    --bg-modal: rgba(21, 19, 28, 0.88);

    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'Public Sans', system-ui, -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', 'Courier New', monospace;
  }

  /* Thème clair "parchemin" — ne réécrit que les couleurs, tout le reste suit */
  [data-theme="light"] {
    --ink-900: #f3ecda;
    --ink-800: #ebe0c4;
    --ink-700: #d8c9a0;
    --ink-600: #c3b189;
    --parchment: #2b2418;
    --dust: #7a6c4f;
    --brass: #a8763a;
    --brass-dim: #8a5f2c;
    --danger: #a8433f;
    --bg-modal: rgba(58, 47, 26, 0.35);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body, html {
    margin: 0; padding: 0; height: 100%; width: 100%;
    font-family: var(--font-body);
    background-color: var(--ink-900); color: var(--parchment);
    overflow: hidden;
    transition: background-color 0.3s ease, color 0.3s ease;
  }

  *:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  .app-container {
    display: flex; height: 100vh; width: 100vw; position: relative;
    opacity: 0; animation: app-in 0.5s ease forwards;
  }
  @keyframes app-in { to { opacity: 1; } }

  /* Fond sombre translucide pour le menu mobile */
  .sidebar-overlay {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(3px);
    z-index: 999; display: none; opacity: 0; transition: opacity 0.3s ease;
  }
  .sidebar-overlay.open { display: block; opacity: 1; }

  /* Barre latérale & Catalogue */
  .sidebar {
    width: 310px; background: var(--ink-800); border-right: 1px solid var(--ink-700);
    display: flex; flex-direction: column; padding: 18px 16px; gap: 14px;
    z-index: 1000; transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.3s ease, border-color 0.3s ease;
  }

  .sidebar-title { display: flex; justify-content: space-between; align-items: center; }
  .sidebar-title h3 {
    margin: 0; color: var(--dust); font-family: var(--font-mono);
    font-size: 0.7rem; letter-spacing: 0.14em; text-transform: uppercase;
  }

  /* Switch de thème clair / sombre */
  .theme-toggle {
    background: var(--ink-900); border: 1px solid var(--ink-700); color: var(--dust);
    width: 30px; height: 28px; border-radius: 6px; cursor: pointer; font-size: 0.8rem;
    display: flex; align-items: center; justify-content: center; transition: all 0.2s; flex-shrink: 0;
  }
  .theme-toggle:hover { border-color: var(--brass); color: var(--parchment); }

  /* Switch de langue */
  .lang-switch {
    display: flex; align-items: center; background: var(--ink-900);
    border-radius: 6px; border: 1px solid var(--ink-700); overflow: hidden;
  }
  .lang-btn {
    background: transparent; color: var(--dust); border: none; padding: 4px 8px;
    font-size: 0.65rem; font-family: var(--font-mono); font-weight: bold; cursor: pointer; transition: 0.2s;
  }
  .lang-btn.active { background: var(--brass); color: var(--ink-900); }

  .btn-create {
    background: var(--brass); color: var(--ink-900); border: none;
    padding: 7px 11px; border-radius: 6px; font-size: 0.75rem; font-weight: 700;
    font-family: var(--font-mono); letter-spacing: 0.02em; cursor: pointer; transition: opacity 0.2s;
  }
  .btn-create:hover { opacity: 0.85; }

  /* Barre de recherche */
  .search-box input {
    width: 100%; background: var(--ink-900); border: 1px solid var(--ink-700);
    color: var(--parchment); padding: 9px 12px; border-radius: 6px; font-size: 0.85rem;
    font-family: var(--font-body); outline: none; transition: border-color 0.2s;
  }
  .search-box input:focus { border-color: var(--brass); }
  .search-box input::placeholder { color: var(--dust); }

  /* Pills catégorie */
  .category-pills { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; flex-shrink: 0; }
  .category-pills::-webkit-scrollbar { height: 3px; }
  .category-pills::-webkit-scrollbar-thumb { background: var(--ink-600); }

  .pill {
    background: transparent; border: 1px solid var(--ink-600);
    padding: 6px 11px; border-radius: 20px; font-size: 0.68rem; cursor: pointer;
    white-space: nowrap; transition: 0.2s; color: var(--dust);
    font-family: var(--font-mono); letter-spacing: 0.04em; text-transform: uppercase;
    display: flex; align-items: center; gap: 6px;
  }
  .pill-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--cat, var(--brass)); flex-shrink: 0; }
  .pill:hover { border-color: var(--cat, var(--brass)); color: var(--parchment); }
  .pill.active { background: var(--cat-soft, rgba(201,154,92,0.16)); border-color: var(--cat, var(--brass)); color: var(--parchment); }

  .char-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .char-list::-webkit-scrollbar { width: 4px; }
  .char-list::-webkit-scrollbar-thumb { background: var(--ink-600); border-radius: 2px; }

  /* Fiches personnage */
  .character-card {
    display: flex; align-items: center; gap: 10px; padding: 10px 8px 10px 12px; border-radius: 6px;
    background: var(--ink-900); border: 1px solid transparent;
    border-left: 3px solid var(--cat, var(--ink-600));
    cursor: pointer; transition: all 0.2s;
  }
  .character-card:hover { background: var(--ink-700); }
  .character-card.active { background: var(--cat-soft, rgba(201,154,92,0.14)); border-color: var(--cat, var(--brass)); border-left-width: 3px; }

  .char-name { font-family: var(--font-display); font-weight: 600; font-size: 0.95rem; color: var(--parchment); white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
  .char-desc { font-family: var(--font-body); font-size: 0.72rem; color: var(--dust); white-space: nowrap; text-overflow: ellipsis; overflow: hidden; margin-top: 2px; }

  /* Étoile favoris */
  .fav-btn {
    background: transparent; border: none; color: var(--ink-600); cursor: pointer;
    font-size: 1.05rem; padding: 4px; flex-shrink: 0; line-height: 1; transition: color 0.2s, transform 0.15s;
  }
  .fav-btn:hover { color: var(--brass); transform: scale(1.15); }
  .fav-btn.active { color: var(--brass); }

  .avatar {
    width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: var(--ink-700);
    border: 2px solid var(--cat, var(--brass)); flex-shrink: 0;
  }

  /* Skeleton loader */
  .avatar-skeleton {
    background: linear-gradient(90deg, var(--ink-700) 25%, var(--ink-600) 37%, var(--ink-700) 63%) !important;
    background-size: 400% 100%;
    animation: skeleton-loading 1.4s ease infinite;
  }
  @keyframes skeleton-loading { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }

  .btn-import {
    width: 100%; padding: 8px; background: transparent; border: 1px dashed var(--ink-600);
    color: var(--dust); border-radius: 6px; cursor: pointer; font-size: 0.75rem;
    font-family: var(--font-mono); letter-spacing: 0.02em; transition: all 0.2s;
  }
  .btn-import:hover { border-color: var(--brass); color: var(--parchment); background: rgba(201,154,92,0.05); }

  /* Bouton de réinitialisation */
  .btn-danger {
    padding: 8px 10px; background: transparent; border: 1px dashed var(--ink-600);
    color: var(--dust); border-radius: 6px; cursor: pointer; font-size: 0.9rem;
    display: flex; align-items: center; justify-content: center; transition: all 0.2s; flex-shrink: 0;
  }
  .btn-danger:hover { border-color: var(--danger); color: var(--danger); background: rgba(201,96,92,0.08); }

  /* Zone de Chat Principale */
  .main-chat { flex: 1; display: flex; flex-direction: column; height: 100%; position: relative; min-width: 0; }

  .chat-header {
    height: 62px; border-bottom: 1px solid var(--ink-700); display: flex; position: relative;
    align-items: center; justify-content: space-between; padding: 0 22px;
    background: rgba(21, 19, 28, 0.9); backdrop-filter: blur(8px); flex-shrink: 0;
    transition: background-color 0.3s ease, border-color 0.3s ease;
  }
  [data-theme="light"] .chat-header { background: rgba(243, 236, 218, 0.9); }
  .chat-header::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
    background: var(--cat, var(--brass)); transition: background 0.3s;
  }

  .menu-btn { display: none; }

  #header-char-name { font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; }
  #header-char-category { font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.05em; }

  .header-btn {
    background: transparent; border: 1px solid var(--ink-600);
    color: var(--parchment); padding: 7px 13px; border-radius: 6px; cursor: pointer;
    font-size: 0.82rem; font-family: var(--font-body); display: flex; align-items: center; gap: 6px; transition: all 0.2s;
  }
  .header-btn:hover { border-color: var(--brass); background: rgba(201,154,92,0.08); }

  .icon-btn {
    background: transparent; border: none; color: var(--dust);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    padding: 8px; border-radius: 8px; transition: all 0.2s;
  }
  .icon-btn:hover { color: var(--parchment); background: rgba(255,255,255,0.05); }

  /* Statut en ligne */
  .status-dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: #7fbf8f; margin-left: 7px; flex-shrink: 0; transition: background 0.3s;
  }
  .status-dot.thinking { background: var(--brass); animation: pulse-dot 1s infinite; }
  @keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

  .messages-list {
    flex: 1; overflow-y: auto; padding: 22px 20px; display: flex; flex-direction: column; gap: 18px;
    background-image: repeating-linear-gradient(180deg, transparent, transparent 39px, rgba(239,233,220,0.015) 40px);
  }
  [data-theme="light"] .messages-list { background-image: repeating-linear-gradient(180deg, transparent, transparent 39px, rgba(43,36,24,0.025) 40px); }
  .messages-list::-webkit-scrollbar { width: 6px; }
  .messages-list::-webkit-scrollbar-thumb { background: var(--ink-600); border-radius: 3px; }
  .messages-list::-webkit-scrollbar-thumb:hover { background: var(--brass-dim); }

  /* Messages */
  .message-row { display: flex; gap: 10px; max-width: 82%; animation: msg-fade-in 0.25s ease; }
  .message-row.user { align-self: flex-end; flex-direction: row-reverse; }
  @keyframes msg-fade-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .bubble-wrap { display: flex; flex-direction: column; min-width: 0; width: 100%; }
  .message-row.user .bubble-wrap { align-items: flex-end; }
  .message-row.ai .bubble-wrap { align-items: flex-start; }

  .msg-author {
    font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.09em; text-transform: uppercase;
    color: var(--cat-text, var(--cat, var(--brass))); margin-bottom: 5px; margin-left: 2px;
  }

  .bubble {
    padding: 13px 16px; line-height: 1.55; font-size: 0.95rem;
    word-break: break-word; width: 100%; border-radius: 4px;
  }
  .bubble-user {
    background: var(--ink-800); border: 1px solid var(--ink-700); border-right: 3px solid var(--brass);
    color: var(--parchment); text-align: right;
  }
  .bubble-ai {
    background: var(--ink-800); border: 1px solid var(--ink-700); border-left: 3px solid var(--cat, var(--brass));
  }

  /* Indicateur de frappe */
  .typing-bubble { display: flex; align-items: center; gap: 4px; width: auto !important; padding: 15px 18px; }
  .typing-dot {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: var(--cat-text, var(--cat, var(--brass))); animation: typing-bounce 1.4s infinite ease-in-out;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typing-bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-5px); opacity: 1; }
  }

  /* Actions sur les messages */
  .msg-actions { display: flex; gap: 4px; margin-top: 5px; opacity: 0.5; transition: opacity 0.2s; }
  .message-row:hover .msg-actions { opacity: 1; }
  .message-row.user .msg-actions { justify-content: flex-end; }
  .msg-action-btn {
    background: transparent; border: none; color: var(--dust); cursor: pointer;
    font-size: 0.68rem; padding: 3px 7px; border-radius: 5px; display: flex; align-items: center; gap: 3px;
    font-family: var(--font-mono);
  }
  .msg-action-btn:hover { background: rgba(255,255,255,0.07); color: var(--parchment); }

  /* Barre de saisie */
  .input-container { padding: 14px 18px; border-top: 1px solid var(--ink-700); background: var(--ink-900); flex-shrink: 0; transition: background-color 0.3s ease, border-color 0.3s ease; }
  .input-box {
    display: flex; gap: 8px; background: var(--ink-800); border: 1px solid var(--ink-700);
    border-radius: 10px; padding: 6px 6px 6px 16px; align-items: flex-end; transition: border-color 0.2s;
  }
  .input-box:focus-within { border-color: var(--brass); }
  .input-box textarea {
    flex: 1; background: transparent; border: none; color: var(--parchment); resize: none;
    min-height: 24px; max-height: 120px; outline: none; font-family: var(--font-body); font-size: 0.95rem; line-height: 24px;
    overflow-y: auto; padding: 7px 0;
  }
  .input-box textarea::placeholder { color: var(--dust); }
  .send-btn {
    background: var(--brass); color: var(--ink-900); border: none; height: 36px; padding: 0 16px;
    border-radius: 7px; font-weight: bold; cursor: pointer; transition: opacity 0.2s; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .send-btn:hover { opacity: 0.85; }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Fenêtre Modale */
  .modal-overlay {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: var(--bg-modal); backdrop-filter: blur(4px);
    display: none; align-items: center; justify-content: center; z-index: 2000; padding: 16px;
  }
  .modal-content {
    background: var(--ink-800); border: 1px solid var(--ink-600);
    padding: 22px; border-radius: 10px; width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto;
    display: flex; flex-direction: column; gap: 13px; box-shadow: 0 24px 40px -8px rgba(0,0,0,0.6);
  }
  .modal-content h3 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 1.3rem; }
  .modal-content label {
    font-size: 0.68rem; color: var(--brass); font-weight: 600; text-transform: uppercase;
    font-family: var(--font-mono); letter-spacing: 0.08em;
  }
  .modal-content input, .modal-content textarea, .modal-content select {
    background: var(--ink-900); border: 1px solid var(--ink-700);
    color: var(--parchment); padding: 10px; border-radius: 6px; font-family: var(--font-body); outline: none; font-size: 0.95rem;
    transition: border-color 0.2s;
  }
  .modal-content input:focus, .modal-content textarea:focus, .modal-content select:focus { border-color: var(--brass); }
  
  .modal-content a { color: var(--brass); text-decoration: none; transition: opacity 0.2s; font-weight: 600; }
  .modal-content a:hover { opacity: 0.8; text-decoration: underline; }

  .modal-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 8px; }
  .btn-secondary {
    background: transparent; border: 1px solid var(--ink-600); color: var(--parchment);
    padding: 10px 18px; border-radius: 6px; cursor: pointer; font-family: var(--font-body); transition: border-color 0.2s;
  }
  .btn-secondary:hover { border-color: var(--dust); }
  .btn-primary {
    background: var(--brass); border: none; color: var(--ink-900); padding: 10px 18px;
    border-radius: 6px; font-weight: 700; cursor: pointer; font-family: var(--font-body); transition: opacity 0.2s;
  }
  .btn-primary:hover { opacity: 0.85; }

  /* Galerie photo */
  #gallery-grid img { transition: transform 0.15s; border: 1px solid var(--ink-700); }
  #gallery-grid img:hover { transform: scale(1.03); }

  /* Widget Discussion (plugin de commentaires) — force le contenu à occuper toute la popup,
     même si le plugin fixe sa propre largeur en style inline (priorité plus forte que le CSS normal) */
  #comments-body {
    flex: 1; min-height: 0; overflow-y: auto;
    display: flex; flex-direction: column;
  }
  #comments-body * {
    max-width: none !important;
    box-sizing: border-box;
  }
  #comments-body > * {
    width: 100% !important;
    flex: 1;
  }
  #comments-body iframe {
    width: 100% !important; height: 100% !important; min-height: 400px;
    border: none; display: block;
  }

  /* Liste des sessions de conversation */
  .session-item {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 10px 12px; border-radius: 6px; background: var(--ink-900); border: 1px solid var(--ink-700);
    cursor: pointer; transition: all 0.2s;
  }
  .session-item:hover { border-color: var(--brass); }
  .session-item.active { border-color: var(--brass); background: rgba(201,154,92,0.1); }
  .session-item-name { font-family: var(--font-display); font-weight: 600; font-size: 0.9rem; }
  .session-item-meta { font-family: var(--font-mono); font-size: 0.68rem; color: var(--dust); margin-top: 2px; }
  .session-item-actions { display: flex; gap: 2px; flex-shrink: 0; }
  .session-action-btn {
    background: transparent; border: none; color: var(--dust); cursor: pointer;
    padding: 5px 7px; border-radius: 5px; font-size: 0.82rem; transition: all 0.2s;
  }
  .session-action-btn:hover { background: rgba(255,255,255,0.07); color: var(--parchment); }

  /* Adaptation Smartphone */
  @media (max-width: 768px) {
    .sidebar {
      position: fixed; top: 0; bottom: 0; left: -100%;
      width: 85vw; max-width: 310px;
      box-shadow: 10px 0 25px rgba(0,0,0,0.6);
    }
    .sidebar.open { left: 0; }
    .menu-btn { display: flex; }
    .chat-header { padding: 0 12px; }
    .messages-list { padding: 16px 12px; }
    .message-row { max-width: 88%; }
    .input-box textarea { font-size: 16px; }
    .header-btn span { display: none; }
    .header-btn { padding: 8px; }
    .modal-content { padding: 16px; max-height: 85vh; }
    .modal-content div[style*="grid-template-columns"] { grid-template-columns: 1fr !important; }
    .msg-actions { opacity: 0.8; }
  }
</style>

<!-- =================================================== -->
<!-- 2. STRUCTURE INTERFACE (HTML)                       -->
<!-- =================================================== -->
<div class="app-container">

  <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>

  <!-- BARRE LATÉRALE : CATALOGUE -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-title">
      <h3 id="ui-catalog">Catalogue</h3>
      <div style="display:flex; align-items:center; gap:8px;">
        <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">🌙</button>
        <div class="lang-switch">
          <button id="lang-btn-fr" class="lang-btn" onclick="setLanguage('fr')">FR</button>
          <button id="lang-btn-en" class="lang-btn" onclick="setLanguage('en')">EN</button>
        </div>
        <button class="btn-create" id="ui-create" onclick="openNewCharModal()">+ Créer</button>
      </div>
    </div>

    <div class="search-box">
      <input type="text" id="char-search" placeholder="Rechercher un personnage…" oninput="searchCharacters(this.value)" />
    </div>

    <div class="category-pills" id="category-filters"></div>

    <div class="char-list" id="character-list"></div>

    <!-- Zone d'import/export/réinitialisation -->
    <div style="margin-top:auto; display:flex; flex-direction:column; gap:6px;">
      <div style="display:grid; grid-template-columns: 1fr 1fr auto; gap:6px;">
        <button class="btn-import" id="ui-export" onclick="exportAllData()">💾 Exporter</button>
        <button class="btn-import" id="ui-restore" onclick="document.getElementById('restore-file-input').click()">📂 Restaurer</button>
        <button class="btn-danger" id="ui-reset" onclick="confirmResetAll()" title="Tout réinitialiser">🗑️</button>
      </div>
      <input type="file" id="import-file-input" accept=".json,.txt" style="display:none;" />

  function ensureCharSessions(charId) {
    if (!chatSessions[charId] || !chatSessions[charId].sessions || chatSessions[charId].sessions.length === 0) {
      const newSession = { id: 'sess_' + Date.now(), name: null, messages: [], createdAt: Date.now() };
      chatSessions[charId] = { activeId: newSession.id, sessions: [newSession] };
    }
    return chatSessions[charId];
  }

  function getActiveSession(char) {
    const data = ensureCharSessions(char.id);
    let session = data.sessions.find(s => s.id === data.activeId);
    if (!session) { session = data.sessions[0]; data.activeId = session.id; }
    return session;
  }

    return getActiveSession(char).messages;

    const result = {};
    for (const charId in parsed) {
      const value = parsed[charId];

        const session = { id: 'sess_' + charId + '_legacy', name: null, messages: value, createdAt: Date.now() };

  function renderSessionsList(char, data) {
    const list = document.getElementById('sessions-list');
    const d = UI_DICT[appLang];
    const sorted = [...data.sessions].sort((a, b) => b.createdAt - a.createdAt);
    list.innerHTML = sorted.map(s => {
      const isActive = s.id === data.activeId;
      const originalIndex = data.sessions.indexOf(s);
      const label = s.name || `${d.sessionDefaultName} ${originalIndex + 1}`;
      const dateStr = new Date(s.createdAt).toLocaleDateString(appLang === 'fr' ? 'fr-FR' : 'en-US', { day: '2-digit', month: 'short', year: 'numeric' });
      const msgInfo = s.messages.length ? `${s.messages.length} ${d.sessionMsgCount}` : d.sessionEmpty;
      return `
        <div class="session-item ${isActive ? 'active' : ''}" onclick="switchSession('${char.id}','${s.id}')">
          <div style="overflow:hidden; flex:1; min-width:0;">
            <div class="session-item-name">${label}</div>
            <div class="session-item-meta">${dateStr} · ${msgInfo}</div>
          </div>
          <div class="session-item-actions">
            <button class="session-action-btn" onclick="renameSession('${char.id}','${s.id}', event)" title="${d.sessionRename}">✏️</button>
            ${data.sessions.length > 1 ? `<button class="session-action-btn" onclick="deleteSession('${char.id}','${s.id}', event)" title="${d.sessionDelete}">🗑️</button>` : ''}
          </div>
        </div>`;
    }).join('');
  }

  function createNewSession() {
    const char = characters.find(c => c.id === activeCharId);
    const data = ensureCharSessions(char.id);
    const newSession = { id: 'sess_' + Date.now(), name: null, messages: [], createdAt: Date.now() };
    data.sessions.push(newSession);
    data.activeId = newSession.id;
    saveHistories();
    loadChatHistory(char);
    renderSessionsList(char, data);
  }
  window.createNewSession = createNewSession;

  function switchSession(charId, sessionId) {
    const char = characters.find(c => c.id === charId);
    const data = ensureCharSessions(charId);
    data.activeId = sessionId;
    saveHistories();
    loadChatHistory(char);
    renderSessionsList(char, data);
    closeSessions();
  }
  window.switchSession = switchSession;

  function renameSession(charId, sessionId, event) {
    if (event) event.stopPropagation();
    const data = ensureCharSessions(charId);
    const session = data.sessions.find(s => s.id === sessionId);
    if (!session) return;
    const d = UI_DICT[appLang];
    const newName = prompt(d.sessionRenamePrompt, session.name || '');
    if (newName === null) return;
    session.name = newName.trim() || null;
    saveHistories();
    const char = characters.find(c => c.id === charId);
    renderSessionsList(char, data);
  }
  window.renameSession = renameSession;

  function deleteSession(charId, sessionId, event) {
    if (event) event.stopPropagation();
    const data = ensureCharSessions(charId);
    if (data.sessions.length <= 1) return; // toujours garder au moins une session
    const d = UI_DICT[appLang];
    if (!confirm(d.sessionDeleteConfirm)) return;
    data.sessions = data.sessions.filter(s => s.id !== sessionId);
    if (data.activeId === sessionId) data.activeId = data.sessions[0].id;
    saveHistories();
    const char = characters.find(c => c.id === charId);
    loadChatHistory(char);
    renderSessionsList(char, data);
  }
  window.deleteSession = deleteSession;

  function saveHistories() {
    try {
      const toSave = {};
      for (const charId in chatSessions) {
        const data = chatSessions[charId];
        toSave[charId] = {
          activeId: data.activeId,
          sessions: data.sessions.map(s => ({
            id: s.id,
            name: s.name,
            createdAt: s.createdAt,
            messages: s.messages.map(m => ({ role: m.role, text: m.text, type: m.type, image: m.image || null }))
          }))
        };
      }
      localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
    } catch (e) { console.warn("Erreur sauvegarde historique :", e); }
  }

  // CORRECTION 1 : Suppression du filtre .filter(c => c.id.startsWith('char_'))
  function saveCustomCharacters() {
    try {
      const customChars = characters
        .map(c => ({
          id: c.id, name: c.name, user: c.user, category: c.category,
          desc: c.desc, avatarPrompt: c.avatarPrompt,
          avatarUrl: c.avatarUrl || "", prompt: c.prompt
        }));
      localStorage.setItem(CHAR_STORAGE_KEY, JSON.stringify(customChars));
    } catch (e) { console.warn("Erreur sauvegarde personnages :", e); }
  }

  function rebuildGalleries() {
    characters.forEach(char => {
      char.gallery = [];
      const data = chatSessions[char.id];
      if (data && data.sessions) {
        data.sessions.forEach(s => {
          s.messages.forEach(msg => {
            if (msg.image && !char.gallery.includes(msg.image)) char.gallery.push(msg.image);
          });
        });
      }
    });
  }

  // CORRECTION 2 : Mise à jour des personnages par défaut existants au chargement
  function loadFromStorage() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        const parsed = JSON.parse(saved);
        chatSessions = migrateToSessions(parsed);
      }
    } catch (e) {}

    try {
      const savedChars = localStorage.getItem(CHAR_STORAGE_KEY);
      if (savedChars) {
        const customChars = JSON.parse(savedChars);
        customChars.forEach(c => {
          const existingIndex = characters.findIndex(ch => ch.id === c.id);
          if (existingIndex !== -1) {
            characters[existingIndex] = { ...characters[existingIndex], ...c };
          } else {
            characters.push({ ...c, avatarUrl: c.avatarUrl || "", gallery: [] });
          }
        });
      }
    } catch (e) {}

    rebuildGalleries();

    try {
      const avatarCache = JSON.parse(localStorage.getItem(AVATAR_CACHE_KEY) || '{}');
      characters.forEach(c => {
        if (!c.avatarUrl && avatarCache[c.id]) c.avatarUrl = avatarCache[c.id];
      });
    } catch (e) {}

    try {
      const favIds = JSON.parse(localStorage.getItem(FAV_STORAGE_KEY) || '[]');
      characters.forEach(c => { c.favorite = favIds.includes(c.id); });
    } catch (e) {}
  }

  // CORRECTION 3 : Exportation de tous les personnages (y compris ceux par défaut)
  function exportAllData() {
    try {
      const customChars = characters.map(c => ({
          id: c.id, name: c.name, user: c.user, category: c.category,
          desc: c.desc, avatarPrompt: c.avatarPrompt, avatarUrl: c.avatarUrl || "", prompt: c.prompt
        }));
      const fullBackup = { meta: { app: "Grimoire AI Chat", version: "1.2", date: new Date().toISOString() }, customCharacters: customChars, chatSessions: chatSessions };
      const dataStr = JSON.stringify(fullBackup, null, 2);
      const blob = new Blob([dataStr], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const downloadLink = document.createElement('a');
      downloadLink.href = url;
      downloadLink.download = `grimoire-sauvegarde-${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(downloadLink); downloadLink.click(); document.body.removeChild(downloadLink); URL.revokeObjectURL(url);
    } catch (e) { alert("⚠️ Impossible d'exporter la sauvegarde."); }
  }
  window.exportAllData = exportAllData;

  function importAllData(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const backup = JSON.parse(e.target.result);
        if (!backup || (!backup.chatSessions && !backup.chatHistories && !backup.customCharacters)) throw new Error("Invalide");
        if (backup.chatSessions) chatSessions = backup.chatSessions;
        else if (backup.chatHistories) chatSessions = migrateToSessions(backup.chatHistories);
        if (backup.customCharacters) {
          backup.customCharacters.forEach(importedChar => {
            const existingIndex = characters.findIndex(c => c.id === importedChar.id);
            if (existingIndex !== -1) characters[existingIndex] = { ...importedChar, gallery: [], favorite: characters[existingIndex].favorite };
            else characters.push({ ...importedChar, gallery: [] });
          });
        }
        saveHistories(); saveCustomCharacters();
        rebuildGalleries();
        setLanguage(appLang);
      } catch (err) { alert("⚠️ Fichier de sauvegarde invalide."); }
      finally { event.target.value = ''; }
    };
    reader.readAsText(file);
  }
  window.importAllData = importAllData;

  function openSidebar() { document.getElementById('sidebar').classList.add('open'); document.getElementById('sidebar-overlay').classList.add('open'); }
  window.openSidebar = openSidebar;
  function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('sidebar-overlay').classList.remove('open'); }
  window.closeSidebar = closeSidebar;

  function renderCategoryPills() {
    const container = document.getElementById('category-filters');
    const cats = ['Tous', 'Favoris', ...Object.keys(CATEGORY_COLORS)];
    container.innerHTML = cats.map(cat => {
      const color = (cat === 'Tous' || cat === 'Favoris') ? '#c99a5c' : getCategoryColor(cat);
      const soft = hexToRgba(color, 0.16);
      const isActive = cat === currentFilter ? 'active' : '';
      const displayText = CAT_I18N[appLang][cat] || cat;
      const icon = cat === 'Favoris' ? '★' : '';
      return `<span class="pill ${isActive}" style="--cat:${color}; --cat-soft:${soft}" onclick="filterCharacters('${cat}', this)">${icon ? `<span style="font-size:0.7rem;">${icon}</span>` : '<span class="pill-dot"></span>'}${displayText}</span>`;
    }).join('');
  }

  function getFilteredCharacters() {
    return characters
      .filter(c => {
        const matchCategory = currentFilter === "Tous" ? true : currentFilter === "Favoris" ? !!c.favorite : c.category === currentFilter;
        const matchSearch = !currentSearch || c.name.toLowerCase().includes(currentSearch) || c.desc.toLowerCase().includes(currentSearch);
        return matchCategory && matchSearch;
      })
      .sort((a, b) => (b.favorite === true ? 1 : 0) - (a.favorite === true ? 1 : 0));
  }

  function renderCharacterList() {
    const listContainer = document.getElementById('character-list');
    listContainer.innerHTML = '';
    const filtered = getFilteredCharacters();
    if (filtered.length === 0) {
      listContainer.innerHTML = `<p style="color:var(--dust); font-size:0.85rem; text-align:center; margin-top:20px;">Vide / Empty</p>`;
      return;
    }
    const d = UI_DICT[appLang];
    filtered.forEach(char => {
      const catColor = getCategoryColor(char.category);
      const card = document.createElement('div');
      card.className = `character-card ${char.id === activeCharId ? 'active' : ''}`;
      card.style.setProperty('--cat', catColor);
      card.style.setProperty('--cat-soft', hexToRgba(catColor, 0.16));
      card.onclick = () => selectCharacter(char.id);
      const avatarSrc = char.avatarUrl || PLACEHOLDER_AVATAR;
      const skeletonClass = (!char.avatarUrl && char.avatarPrompt) ? 'avatar-skeleton' : '';
      const favTitle = char.favorite ? d.favRemove : d.favAdd;
      card.innerHTML = `
        <img class="avatar ${skeletonClass}" id="avatar-${char.id}" style="--cat:${catColor}" src="${avatarSrc}" />
        <div style="overflow:hidden; flex:1; min-width:0;">
          <div class="char-name">${char.name}</div><div class="char-desc">${char.desc}</div>
        </div>
        <button class="fav-btn ${char.favorite ? 'active' : ''}" onclick="toggleFavorite('${char.id}', event)" title="${favTitle}">${char.favorite ? '★' : '☆'}</button>
      `;
      listContainer.appendChild(card);
      if (!char.avatarUrl && char.avatarPrompt && typeof textToImagePlugin === 'function') generateCharAvatar(char);
    });
  }
  window.renderCharacterList = renderCharacterList;

  async function generateCharAvatar(char) {
    if (char._avatarGenerating) return; // déjà en cours pour ce personnage, on ne relance pas
    char._avatarGenerating = true;
    try {
      let result = await textToImagePlugin(char.avatarPrompt);
      char.avatarUrl = result.dataUrl || result;
      saveAvatarCache();
      let imgEl = document.getElementById(`avatar-${char.id}`);
      if (imgEl) { imgEl.src = char.avatarUrl; imgEl.classList.remove('avatar-skeleton'); }
      if (char.id === activeCharId) loadChatHistory(char);
    } catch (e) {
      const imgEl = document.getElementById(`avatar-${char.id}`);
      if (imgEl) imgEl.classList.remove('avatar-skeleton');
    } finally {
      char._avatarGenerating = false;
    }
  }

  function saveAvatarCache() {
    try {
      const cache = {};
      characters.forEach(c => {
        if (c.avatarUrl && c.avatarUrl.startsWith('data:image')) cache[c.id] = c.avatarUrl;
      });
      localStorage.setItem(AVATAR_CACHE_KEY, JSON.stringify(cache));
    } catch (e) { console.warn("Erreur sauvegarde cache avatars :", e); }
  }

  function loadChatHistory(char) {
    const chatContainer = document.getElementById('chat-history');

      const greeting = `${UI_DICT[appLang].greeting} **${char.name}** (${char.desc}).`;
      messages.push({ role: char.name, text: greeting, type: 'ai' });

    messages.forEach((msg, idx) => {

      appendMessageToUI(msg, idx, char, isLast);

  function saveCharacter() {
    const name = document.getElementById('cfg-char-name').value.trim() || "Nouveau";
    const user = document.getElementById('cfg-user-name').value.trim() || "User";
    const category = document.getElementById('cfg-category').value;
    const desc = document.getElementById('cfg-short-desc').value.trim();
    const avatarPrompt = document.getElementById('cfg-avatar-prompt').value.trim();
    const prompt = document.getElementById('cfg-definition').value;
    const urlInput = document.getElementById('cfg-avatar-url').value.trim();

    let finalAvatarUrl = urlInput;
    if (urlInput === "" && !isCreatingNew) {
      const oldChar = characters.find(c => c.id === activeCharId);
      if (oldChar && oldChar.avatarPrompt === avatarPrompt && oldChar.avatarUrl && oldChar.avatarUrl.startsWith('data:image')) {
        finalAvatarUrl = oldChar.avatarUrl;
      }
    }

    if (isCreatingNew) {
      const newId = "char_" + Date.now();
      characters.push({ id: newId, name, user, category, desc, avatarPrompt, avatarUrl: finalAvatarUrl, gallery: [], favorite: false, prompt });
      saveCustomCharacters(); closeEditModal(); selectCharacter(newId);
    } else {
      const char = characters.find(c => c.id === activeCharId);
      char.name = name; char.user = user; char.category = category; char.desc = desc; char.avatarPrompt = avatarPrompt; char.avatarUrl = finalAvatarUrl; char.prompt = prompt;
      saveCustomCharacters(); closeEditModal(); selectCharacter(char.id);
    }
  }
  window.saveCharacter = saveCharacter;

  function openComments() { document.getElementById('comments-modal').style.display = 'flex'; }
  window.openComments = openComments;

  function closeComments() { document.getElementById('comments-modal').style.display = 'none'; }
  window.closeComments = closeComments;

  function updateStatusDot(thinking) {
    const dot = document.getElementById('status-dot');
    if (dot) dot.classList.toggle('thinking', thinking);
  }

  async function sendMessage() {
    if (isGenerating) return;
    const inputField = document.getElementById('user-input');
    const userText = inputField.value.trim();
    if (!userText) return;

    const char = characters.find(c => c.id === activeCharId);
    const messages = getActiveMessages(char);
    messages.push({ role: char.user, text: userText, type: 'user' });
    inputField.value = ''; inputField.style.height = 'auto';
    saveHistories(); loadChatHistory(char);
    await generateAIResponse(char);
  }
  window.sendMessage = sendMessage;

  async function generateAIResponse(char) {
    const chatContainer = document.getElementById('chat-history');
    const catColor = getCategoryColor(char.category);
    const catTextColor = getCategoryTextColor(char.category);
    isGenerating = true; updateStatusDot(true); document.getElementById('send-btn').disabled = true;

    const aiMsgDiv = document.createElement('div');
    aiMsgDiv.className = 'message-row ai';
    aiMsgDiv.innerHTML = `
      <img class="avatar" style="--cat:${catColor}" src="${char.avatarUrl || PLACEHOLDER_AVATAR}" alt="IA" />
      <div class="bubble-wrap">
        <span class="msg-author" style="--cat:${catColor}; --cat-text:${catTextColor}">${char.name}</span>
        <div class="bubble bubble-ai typing-bubble" style="--cat:${catColor}; --cat-text:${catTextColor}">
          <span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>
        </div>
      </div>
    `;
    chatContainer.appendChild(aiMsgDiv);
    smoothScrollToBottom(chatContainer);

    const messages = getActiveMessages(char);

    try {
      let systemPrompt = char.prompt.replace(/\{\{char\}\}/g, char.name).replace(/\{\{user\}\}/g, char.user);
      let historyText = messages.map(m => `${m.role}: ${m.text}`).join("\n");
      
      let langRule = UI_DICT[appLang].langRule;
      let roleplayRule = UI_DICT[appLang].roleplayRule.replace(/\{\{user\}\}/g, char.user);
      let histLabel = UI_DICT[appLang].historyContext;
      
      let finalPrompt = `${systemPrompt}\n\n${roleplayRule}\n\n${langRule}\n\n${histLabel}\n${historyText}\n${char.name}:`;

      let response = await aiTextPlugin(finalPrompt);
      response = response.replace(new RegExp(`^${char.name}:\\s*`, 'i'), '').trim();

      let imagePromptToGenerate = null;
      const imgRegex = /\(\(IMAGE:\s*((?:.|\r|\n)*?)\)\)/i;
      const match = response.match(imgRegex);

      if (match) {
        imagePromptToGenerate = match[1].trim();
        response = response.replace(imgRegex, '').trim();
      }

      const bubbleEl = aiMsgDiv.querySelector('.bubble');
      let content = response;
      if (typeof DOMPurify !== 'undefined' && typeof marked !== 'undefined') {
        content = DOMPurify.sanitize(marked.parse(response));
      }
      bubbleEl.classList.remove('typing-bubble');
      bubbleEl.innerHTML = content;

      const newMsg = { role: char.name, text: response, type: 'ai' };

      if (imagePromptToGenerate && typeof textToImagePlugin === 'function') {
        const imgPlaceholder = document.createElement('div');
        imgPlaceholder.className = 'avatar-skeleton';
        imgPlaceholder.style.marginTop = "12px"; imgPlaceholder.style.height = "220px"; imgPlaceholder.style.borderRadius = "6px";
        bubbleEl.appendChild(imgPlaceholder);
        smoothScrollToBottom(chatContainer);

        try {
          let imgResult = await textToImagePlugin(imagePromptToGenerate);
          let imgUrl = imgResult.dataUrl || imgResult;
          imgPlaceholder.outerHTML = `<img src="${imgUrl}" alt="Photo IA" style="width:100%; border-radius:6px; display:block; margin-top:8px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); cursor:pointer;" onclick="window.open(this.src)" />`;
          newMsg.image = imgUrl;
          if (!char.gallery) char.gallery = [];
          char.gallery.push(imgUrl);
          smoothScrollToBottom(chatContainer);
        } catch (err) { imgPlaceholder.outerHTML = "⚠️"; }
      }

      messages.push(newMsg);
      saveHistories(); loadChatHistory(char);
    } catch (err) {
      const bubbleEl = aiMsgDiv.querySelector('.bubble');
      if (bubbleEl) { bubbleEl.classList.remove('typing-bubble'); bubbleEl.innerText = "(Erreur IA)"; }
    } finally {
      isGenerating = false; updateStatusDot(false); document.getElementById('send-btn').disabled = false;
    }
  }

  function copyMessage(btn) {
    const text = decodeURIComponent(btn.getAttribute('data-text'));
    navigator.clipboard.writeText(text).then(() => {
      const original = btn.innerHTML; btn.innerHTML = '✅'; setTimeout(() => { btn.innerHTML = original; }, 1200);
    }).catch(() => {});
  }
  window.copyMessage = copyMessage;

  function deleteMessage(charId, idx) {
    const char = characters.find(c => c.id === charId);
    if (!char) return;
    const messages = getActiveMessages(char);
    messages.splice(idx, 1);
    saveHistories(); loadChatHistory(char);
  }
  window.deleteMessage = deleteMessage;

  function editMessage(charId, idx) {
    const char = characters.find(c => c.id === charId);
    if (!char) return;
    const messages = getActiveMessages(char);
    const msg = messages[idx]; if (!msg) return;
    const inputField = document.getElementById('user-input'); inputField.value = msg.text;
    messages.splice(idx);
    saveHistories(); loadChatHistory(char);
    inputField.style.height = 'auto'; inputField.style.height = Math.min(inputField.scrollHeight, 120) + 'px'; inputField.focus();
  }
  window.editMessage = editMessage;

  async function regenerateMessage(charId, idx) {
    if (isGenerating) return;
    const char = characters.find(c => c.id === charId);
    if (!char) return;
    const messages = getActiveMessages(char);
    messages.splice(idx);
    saveHistories(); loadChatHistory(char);
    await generateAIResponse(char);
  }
  window.regenerateMessage = regenerateMessage;

  function appendMessageToUI(msg, index, char, isLast) {
    const chatContainer = document.getElementById('chat-history');
    const msgDiv = document.createElement('div'); msgDiv.className = `message-row ${msg.type}`;
    let cleanText = msg.text.replace(/\(\(IMAGE:\s*((?:.|\r|\n)*?)\)\)/i, '').trim();
    let content = cleanText;
    if (typeof DOMPurify !== 'undefined' && typeof marked !== 'undefined') content = DOMPurify.sanitize(marked.parse(cleanText));
    let imageHtml = msg.image ? `<img src="${msg.image}" alt="Photo IA" style="width:100%; border-radius:6px; display:block; margin-top:8px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); cursor:pointer;" onclick="window.open(this.src)"/>` : '';

    let actionsHtml = msg.type === 'user' 
      ? `<div class="msg-actions"><button class="msg-action-btn" onclick="editMessage('${char.id}', ${index})">✏️</button><button class="msg-action-btn" onclick="deleteMessage('${char.id}', ${index})">🗑️</button></div>`
      : `<div class="msg-actions"><button class="msg-action-btn" onclick="copyMessage(this)" data-text="${encodeURIComponent(cleanText)}">📋</button>${isLast ? `<button class="msg-action-btn" onclick="regenerateMessage('${char.id}', ${index})">↻</button>` : ''}<button class="msg-action-btn" onclick="deleteMessage('${char.id}', ${index})">🗑️</button></div>`;

    if (msg.type === 'user') {
      msgDiv.innerHTML = `<div class="bubble-wrap"><div class="bubble bubble-user">${content}</div>${actionsHtml}</div>`;
    } else {
      const catColor = getCategoryColor(char.category);
      const catTextColor = getCategoryTextColor(char.category);
      const avatarSrc = char.avatarUrl || PLACEHOLDER_AVATAR;
      msgDiv.innerHTML = `<img class="avatar" style="--cat:${catColor}" src="${avatarSrc}" /><div class="bubble-wrap"><span class="msg-author" style="--cat:${catColor}; --cat-text:${catTextColor}">${char.name}</span><div class="bubble bubble-ai" style="--cat:${catColor}; --cat-text:${catTextColor}">${content}${imageHtml}</div>${actionsHtml}</div>`;
    }
    chatContainer.appendChild(msgDiv);
  }

  function toggleFullscreen() { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
  window.toggleFullscreen = toggleFullscreen;
</script>
</body>
