    "YuGiOh Art": `yugioh-inspired card art for {prompt}, art in the style of genzoman, in the style of Akina Fujiwara, in the style of rossdraws, monster art, close up, painterly details, breathtaking art, centered, masterpiece, amazing composition. Overall, it's an absolute world-class masterpiece Yu-Gi-Oh-inspired artwork. It's an aesthetically pleasing Yu-Gi-Oh inspired artwork with impeccable attention to detail and impressive composition.`,
    "Traditional Japanese": `{prompt}, in ukiyo-e art style, traditional japanese masterpiece`,
    "Nihonga Painting": `japanese nihonga painting about {prompt}, Nihonga, ancient japanese painting, intricate, detailed`,
    "Claymation": `{prompt}, claymation, incredible claymation style, stop-motion clay, clay texture, beautiful handcrafted look`,
    "Cartoon": `{prompt}, cartoon-style art, superb linework, nice colors and composition, bold linework, masterpiece, cute art in the style of Dana Terrace, in the style of Rebecca Sugar, in the style of ry-spirit, amazing and wholesome cartoon-style art, cute art style`,
    "Cursed Photo": `cursed photo of {prompt}, creepy and cursed, absolutely cursed photo, unsettling photo, cursed image, bad photo, weird photo, very strange, color photo, creepy photo, nightmare fuel`
  }

  const wait = ms => new Promise(resolve => setTimeout(resolve, ms))

  function getTotal() {
    return +countSelect.value
  }

  function setStatus(status, hint = DEFAULT_HINT) {
    statusText.textContent = status
    hintText.textContent = hint
  }

  function setBusy(isBusy) {
    ;[generateBtn, clearBtn, promptInput, resolutionSelect, countSelect, artStyleSelect].forEach(el => {
      el.disabled = isBusy
    })
    generateBtn.textContent = isBusy ? "Generating..." : "✨ Generate"
    hintText.textContent = isBusy ? BUSY_HINT : DEFAULT_HINT
  }

  function showError(message) {
    errorBox.hidden = false
    errorBox.textContent = message
  }

  function hideError() {
    errorBox.hidden = true
    errorBox.textContent = ""
  }

  function showTranslatedPrompt(text) {
    translatedPromptBox.hidden = false
    translatedPromptText.textContent = text || ""
  }

  function hideTranslatedPrompt() {
    translatedPromptBox.hidden = true
    translatedPromptText.textContent = ""
  }

  function scrollToResults() {
    requestAnimationFrame(() => {
      resultsSection.scrollIntoView({
        behavior: "smooth",
        block: "start"
      })
    })
  }

  function makePlaceholder(res, text, bg, fg) {
    return `https://placehold.co/${res}/${bg}/${fg}?text=${encodeURIComponent(text)}`
  }

  function placeholder(res, text = "Generating...") {
    return makePlaceholder(res, text, "202123", "7d8188")
  }

  function failPlaceholder(res, text = "Failed") {
    return makePlaceholder(res, text, "2b1d1f", "cb8188")
  }

  function sanitizeFileName(text) {
    const cleaned = (text || "image")
      .replace(/[<>:"/\\|?*\x00-\x1F]/g, "")
      .replace(/\s+/g, "-")
      .trim()
      .slice(0, 60)
    return cleaned || "image"
  }

  function getExtensionFromDataUrl(dataUrl) {
    const match = /^data:image\/([a-zA-Z0-9+]+);base64,/.exec(dataUrl || "")
    const ext = match ? match[1].toLowerCase() : "png"
    if (ext === "jpeg") return "jpg"
    if (ext === "svg+xml") return "svg"
    return ext
  }

  function makeDownloadName(prompt, index, dataUrl) {
    const ext = getExtensionFromDataUrl(dataUrl)
    const base = sanitizeFileName(prompt)
    return `${base || "image"}-${index + 1}.${ext}`
  }

  function makeCard(index, res) {
    return `<div class="imageCard">
      <div class="imageWrap">
        <img class="resultImg" alt="Generated image ${index + 1}" src="${placeholder(res)}">
      </div>
      <div class="cardMeta">
        <div class="cardTitle">Result ${index + 1}</div>
        <div class="statusWrap">
          <div class="cardSub">Waiting...</div>
          <a class="downloadBtn" href="#" download title="Download image" aria-label="Download image" hidden>⭳</a>
        </div>
      </div>
    </div>`
  }

  function buildGallery(res, total) {
    gallery.innerHTML = Array.from({ length: total }, (_, i) => makeCard(i, res)).join("")
    return [...gallery.querySelectorAll(".imageCard")].map((card, index) => ({
      index,
      img: card.querySelector(".resultImg"),
      sub: card.querySelector(".cardSub"),
      downloadBtn: card.querySelector(".downloadBtn")
    }))
  }

  function clearAll() {
    promptInput.value = ""
    countSelect.value = "3"
    resolutionSelect.value = "512x768"
    artStyleSelect.value = "__none"
    gallery.innerHTML = ""
    hideTranslatedPrompt()
    hideError()
    setStatus("Ready")
    promptInput.focus()
  }

  function escapeHtml(text) {
    return String(text)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
  }

  function populateArtStyles() {
    const styleNames = Object.keys(STYLE_TEMPLATES).sort((a, b) => a.localeCompare(b))
    const options = [`<option value="__none">No style</option>`]
    for (const styleName of styleNames) {
      options.push(`<option value="${escapeHtml(styleName)}">${escapeHtml(styleName)}</option>`)
    }
    artStyleSelect.innerHTML = options.join("")
    artStyleSelect.value = "__none"
  }

  function getSelectedArtStyleName() {
    const styleName = artStyleSelect.value.trim()
    if (!styleName || styleName === "__none") return ""
    return styleName
  }

  function buildFinalPrompt(translatedPrompt) {
    const styleName = getSelectedArtStyleName()
    const template = STYLE_TEMPLATES[styleName]
    if (!template) return translatedPrompt

    const promptActual = translatedPrompt.replace(/\b(realistic)\b/gi, "actual")

    return template
      .replace(/{promptActual}/g, promptActual)
      .replace(/{prompt}/g, translatedPrompt)
  }

  async function translatePromptToEnglish(prompt) {
    const instruction = `Translate the following image-generation prompt to English. Preserve the original meaning, subject details, style keywords, artist/style references, composition, camera terms, quality terms, and special formatting. If the prompt is already in English, keep it in English. Return only the translated prompt, with no explanations.\n\n${prompt}`
    const translated = await translateText(instruction)
    const clean = String(translated || "").trim()
    if (!clean) throw new Error("Failed to translate the prompt.")
    return clean
  }

  async function uploadImage(image, prompt) {
    const response = await fetch(UPLOAD_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ image, prompt })
    })
    const json = await response.json()
    if (!response.ok || !json.ok) throw new Error(json.error || "Upload failed")
    return json
  }

  async function generateAndUpload(finalPrompt, resolution) {
    const dataUrl = await generateImage({
      prompt: finalPrompt,
      resolution
    })
    await uploadImage(dataUrl, finalPrompt)
    return { dataUrl, finalPrompt }
  }

  async function generateWithRetry(finalPrompt, resolution) {
    let lastError
    for (let attempt = 0; attempt <= MAX_RETRIES; attempt++) {
      try {
        return await generateAndUpload(finalPrompt, resolution)
      } catch (error) {
        lastError = error
        console.error("Attempt failed:", attempt + 1, error)
        if (attempt < MAX_RETRIES) await wait(800)
      }
    }
    throw lastError
  }

  async function processOne(finalPrompt, resolution, item, counters, total) {
    item.sub.textContent = "Generating..."
    item.downloadBtn.hidden = true
    item.downloadBtn.removeAttribute("href")
    item.downloadBtn.removeAttribute("download")

    try {
      const result = await generateWithRetry(finalPrompt, resolution)
      item.img.src = result.dataUrl
      item.sub.textContent = "Done"
      item.downloadBtn.href = result.dataUrl
      item.downloadBtn.download = makeDownloadName(finalPrompt, item.index, result.dataUrl)
      item.downloadBtn.hidden = false
      counters.done++
    } catch (error) {
      console.error(error)
      item.img.src = failPlaceholder(resolution)
      item.sub.textContent = "Failed"
      item.downloadBtn.hidden = true
      counters.failed++
    }

    counters.finished++
    statusText.textContent = `Generating ${counters.finished}/${total}`
  }

  async function runPool(tasks, limit) {
    let next = 0

    async function worker() {
      while (next < tasks.length) {
        const taskIndex = next
        next++
        await tasks[taskIndex]()
      }
    }

    const workerCount = Math.min(limit, tasks.length)
    await Promise.all(Array.from({ length: workerCount }, () => worker()))
  }

  async function generate() {
    const prompt = promptInput.value.trim()
    const resolution = resolutionSelect.value
    const total = getTotal()

    if (!prompt) {
      showError("Please enter a description for the image.")
      promptInput.focus()
      return
    }

    hideError()
    setBusy(true)

    const items = buildGallery(resolution, total)
    showTranslatedPrompt("Translating to English...")
    scrollToResults()

    const counters = { finished: 0, done: 0, failed: 0 }

    try {
      setStatus("Translating...", "Preparing prompt in English")
      const translatedPrompt = await translatePromptToEnglish(prompt)
      const finalPrompt = buildFinalPrompt(translatedPrompt)
      showTranslatedPrompt(finalPrompt)

      setStatus(`Generating 0/${total}`, BUSY_HINT)
      const tasks = items.map(item => () => processOne(finalPrompt, resolution, item, counters, total))
      await runPool(tasks, MAX_PARALLEL)

      if (counters.done && !counters.failed) {
        setStatus("Done", `${counters.done} image${counters.done > 1 ? "s" : ""} generated`)
      } else if (counters.done) {
        setStatus("Completed with errors", `${counters.done} done, ${counters.failed} failed`)
      } else {
        setStatus("Error", "All generations failed")
        showError("Failed to generate the images. Please try again.")
      }
    } catch (error) {
      console.error(error)
      setStatus("Error", "Unable to process the prompt")
      showError(error.message || "Failed to translate the prompt.")
    } finally {
      setBusy(false)
    }
  }

  generateBtn.addEventListener("click", generate)
  clearBtn.addEventListener("click", clearAll)

  promptInput.addEventListener("keydown", e => {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter" && !generateBtn.disabled) {
      generate()
    }
  })

  populateArtStyles()
</script>
