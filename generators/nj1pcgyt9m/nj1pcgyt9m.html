  // Mulberry32 - a simple fast seeded PRNG
  function mulberry32(a) {
    return function() {
      var t = a += 0x6D2B79F5;
      t = Math.imul(t ^ t >>> 15, t | 1);
      t ^= t + Math.imul(t ^ t >>> 7, t | 61);
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    }
  }

  // String hash function to seed the PRNG
  function cyrb128(str) {
      let h1 = 1779033703, h2 = 3144134277,
          h3 = 1013904242, h4 = 2773480762;
      for (let i = 0, k; i < str.length; i++) {
          k = str.charCodeAt(i);
          h1 = h2 ^ Math.imul(h1 ^ k, 597399067);
          h2 = h3 ^ Math.imul(h2 ^ k, 2869860233);
          h3 = h4 ^ Math.imul(h3 ^ k, 951274213);
          h4 = h1 ^ Math.imul(h4 ^ k, 2716044179);
      }
      h1 = Math.imul(h3 ^ (h1 >>> 18), 597399067);
      h2 = Math.imul(h4 ^ (h2 >>> 22), 2869860233);
      h3 = Math.imul(h1 ^ (h3 >>> 17), 951274213);
      h4 = Math.imul(h2 ^ (h4 >>> 19), 2716044179);
      return (h1^h2^h3^h4) >>> 0;
  }

    return text.split('').map(char => cyrillicMap[char] || char).join('');

  // Detect duplicate titles and attach a random letter prefix to repeats.
  // First occurrence is left intact; subsequent occurrences get a random
  // Latin or Cyrillic letter prepended. Cyrillic prefixes are flagged for bold display.
  function processDuplicateTitles(titles) {
    let seen = {};
    let result = [];
    for (let title of titles) {
      let trimmed = title.trim();
      if (seen[trimmed]) {
        let useCyr = Math.random() < 0.5;
        let letter;
        if (useCyr) {
          letter = String.fromCodePoint(0x0410 + Math.floor(Math.random() * 32));
        } else {
          letter = String.fromCodePoint(0x0041 + Math.floor(Math.random() * 26));
        }
        result.push({text: trimmed, prefix: letter, prefixIsCyrillic: useCyr});
        seen[trimmed]++;
      } else {
        seen[trimmed] = 1;
        result.push({text: trimmed, prefix: "", prefixIsCyrillic: false});
      }
    }
    return result;
  }
  
  // Returns an HTML string for display (Cyrillic prefixes wrapped in <b>)
  function getTitleDisplay(titleObj) {
    if (typeof titleObj === 'string') {
      return useCyrillic ? toCyrillic(titleObj) : titleObj;
    }
    let prefix = titleObj.prefix || "";
    let text = titleObj.text;
    if (useCyrillic) {
      prefix = toCyrillic(prefix);
      text = toCyrillic(text);
    }
    if (prefix && titleObj.prefixIsCyrillic) {
      return `<span style="color:red">${prefix}</span>${text}`;
    }
    return prefix + text;
  }

  const REPLACEMENT_BASE = REPLACEMENT_WORDS_RAW.filter(w => w && !w.startsWith("-") && !w.startsWith(" "));
  const REPLACEMENT_SUFFIX = REPLACEMENT_WORDS_RAW.filter(w => w && (w.startsWith("-") || w.startsWith(" ")));
  const HAS_EMPTY_REPLACEMENT = REPLACEMENT_WORDS_RAW.includes("");

  function getReplacementWord() {
    let roll = Math.random();
    if (roll < 0.08 && HAS_EMPTY_REPLACEMENT) {
      return "";
    } else if (roll < 0.35 && REPLACEMENT_SUFFIX.length > 0) {
      let base = REPLACEMENT_BASE[Math.floor(Math.random() * REPLACEMENT_BASE.length)];
      let suffix = REPLACEMENT_SUFFIX[Math.floor(Math.random() * REPLACEMENT_SUFFIX.length)];
      return base + suffix;
    } else {
      return REPLACEMENT_BASE[Math.floor(Math.random() * REPLACEMENT_BASE.length)];
    }
  }

  // Check if any starting letter exceeds 20% of titles.
  // If so, replace the first word in 10-75% (randomized) of those titles.
  function checkAndReplaceOverrepresentedLetters(titles) {
    let n = titles.length;
    if (n < 5) return { replaced: 0, letters: [] };

    let letterCounts = {};
    let letterIndices = {};
    for (let i = 0; i < titles.length; i++) {
      let firstChar = titles[i].text.trim()[0];
      if (!firstChar) continue;
      let letter = firstChar.toUpperCase();
      if (!letterCounts[letter]) {
        letterCounts[letter] = 0;
        letterIndices[letter] = [];
      }
      letterCounts[letter]++;
      letterIndices[letter].push(i);
    }

    let threshold = n * 0.20;
    let totalReplaced = 0;
    let affectedLetters = [];

    for (let letter in letterCounts) {
      if (letterCounts[letter] > threshold) {
        affectedLetters.push(letter);
        let indices = letterIndices[letter];
        let pct = 0.10 + Math.random() * 0.65;
        let numToReplace = Math.max(1, Math.round(indices.length * pct));

        let shuffled = [...indices];
        for (let i = shuffled.length - 1; i > 0; i--) {
          let j = Math.floor(Math.random() * (i + 1));
          [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        let toReplace = shuffled.slice(0, numToReplace);

        for (let idx of toReplace) {
          let words = titles[idx].text.split(/\s+/);
          let replacement = getReplacementWord();
          if (replacement === "") {
            words.shift();
            let newText = words.join(" ").trim();
            titles[idx].text = newText || titles[idx].text;
          } else {
            words[0] = replacement;
            titles[idx].text = words.join(" ");
          }
          totalReplaced++;
        }
      }
    }
    return { replaced: totalReplaced, letters: affectedLetters };
  }

  // Full pipeline: letter overrepresentation check first, then duplicate processing
  function processList(rawTitles) {
    // 1. Convert raw titles to objects so the letter check can mutate .text
    let titles = rawTitles.map(t => ({text: t.trim(), prefix: "", prefixIsCyrillic: false}));
    // 2. Letter overrepresentation check FIRST
    lastReplacementInfo = checkAndReplaceOverrepresentedLetters(titles);
    // 3. THEN duplicate processing on the (possibly modified) text
    return processDuplicateTitles(titles.map(t => t.text));
  }

  function getRawTitlesFromList(list) {
    if (list.rawTitles) return list.rawTitles;
    return list.titles.map(t => typeof t === 'string' ? t : t.text);
  }

  function applySumOrder(key) {

    if(useSumAbove) {

      charsEl.style.order = 0;
      sumEl.style.order = 0;
      if(btn) btn.style.order = 0;
    }
  }
  
  function applyActiveListProcessing() {
    let raw = activeTitleListRaw;
    if (keepIntactToggle.checked) {
      activeTitleList = raw.map(t => t.trim());
      lastReplacementInfo = { replaced: 0, letters: [] };
      dupNoticeEl.innerHTML = "List kept intact — no duplicate prefixes or letter replacements applied.";
      dupNoticeEl.style.color = "#ff9800";
    } else {
      activeTitleList = processList(raw);
      let dupCount = raw.length - new Set(raw.map(t => t.trim())).size;
      let noticeParts = [];
      if(lastReplacementInfo.replaced > 0) {
        noticeParts.push(`Letter(s) [${lastReplacementInfo.letters.join(", ")}] appeared in >20% of titles — replaced first word in ${lastReplacementInfo.replaced} title(s).`);
      }
      if(dupCount > 0) {
        noticeParts.push(`Detected ${dupCount} duplicate(s) — random letter prefixes added to repeats (Cyrillic shown in red).`);
      }
      dupNoticeEl.innerHTML = noticeParts.join(" ");
      dupNoticeEl.style.color = "#ff9800";
    }
  }

  // Title List Management Functions
  function saveTitleList() {
    let name = listNameInput.value.trim();
    let rawTitles = titleListInput.value.trim().split('\n').filter(t => t.trim() !== '');
    
    if(!name) {
      alert("Please enter a list name");
      return;
    }
    if(rawTitles.length === 0) {
      alert("Please enter at least one title");
      return;
    }
    
    activeTitleListRaw = rawTitles;
    applyActiveListProcessing();
    
    localStorage.titleLists = localStorage.titleLists || "{}";
    let lists = JSON.parse(localStorage.titleLists);
    
    if(editingKey) {
      lists[editingKey] = { name: name, rawTitles: rawTitles };
      editingKey = null;
      saveListBtn.textContent = "Save List";
      saveListBtn.style.background = "#28a745";
      saveListBtn.style.color = "white";
      titleListInput.value = "";
      listNameInput.value = "";
    } else {
      let key = "titleList_" + Date.now();
      lists[key] = { name: name, rawTitles: rawTitles };
      titleListInput.value = "";
      listNameInput.value = "";
    }
    
    updateActiveListDisplay(name);
    localStorage.titleLists = JSON.stringify(lists);
    renderSavedLists();
  }
  
  function loadTitleList(key) {
    localStorage.titleLists = localStorage.titleLists || "{}";
    let lists = JSON.parse(localStorage.titleLists);
    
    if(lists[key]) {
      let raw = getRawTitlesFromList(lists[key]);
      activeTitleListRaw = raw;
      applyActiveListProcessing();
      
      updateActiveListDisplay(lists[key].name);
      renderSavedLists();
    }
  }
  
  function editTitleList(key) {
    localStorage.titleLists = localStorage.titleLists || "{}";
    let lists = JSON.parse(localStorage.titleLists);
    
    if(lists[key]) {
      let list = lists[key];
      listNameInput.value = list.name;
      titleListInput.value = getRawTitlesFromList(list).join('\n');
      
      editingKey = key;
      
      // Change button appearance to indicate edit mode
      saveListBtn.textContent = "Update List";
      saveListBtn.style.background = "#ffc107"; // Warning yellow
      saveListBtn.style.color = "#000";
    }
  }
  
  function deleteTitleList(key) {
    localStorage.titleLists = localStorage.titleLists || "{}";
    let lists = JSON.parse(localStorage.titleLists);
    
    if(lists[key]) {
      let raw = getRawTitlesFromList(lists[key]);
      let wasActive = JSON.stringify(raw) === JSON.stringify(activeTitleListRaw);
      delete lists[key];
      localStorage.titleLists = JSON.stringify(lists);
      
      if(wasActive) {
        activeTitleListRaw = ["Alpha","Beta","Gamma","Delta","Epsilon","Zeta","Eta","Theta","Iota","Kappa","Lambda","Mu","Nu","Xi","Omicron","Pi","Rho","Sigma","Tau","Upsilon","Phi","Chi","Psi","Omega"];
        activeTitleList = processList(activeTitleListRaw);
        updateActiveListDisplay("Default");
      }
      
      // If we deleted the list currently being edited, reset the form
      if(editingKey === key) {
        editingKey = null;
        titleListInput.value = "";
        listNameInput.value = "";
        saveListBtn.textContent = "Save List";
        saveListBtn.style.background = "#28a745";
        saveListBtn.style.color = "white";
      }
      
      renderSavedLists();
    }
  }
  
  function renderSavedLists() {
    localStorage.titleLists = localStorage.titleLists || "{}";
    let lists = JSON.parse(localStorage.titleLists);
    let html = "";
    
    for(let key in lists) {
      let list = lists[key];
      let raw = getRawTitlesFromList(list);
      let isActive = JSON.stringify(raw) === JSON.stringify(activeTitleListRaw);
      let isEditing = key === editingKey;
      let count = raw.length;
      
      html += `
        <div style="display:flex; align-items:center; gap:10px; padding:8px; background:${isActive ? '#1a3d1a' : '#222'}; border-radius:4px; border:1px solid ${isActive ? '#28a745' : '#333'};">

          <button onclick="loadTitleList('${key}')" style="padding:4px 8px; cursor:pointer; background:#007acc; color:white; border:none; border-radius:3px; font-size:12px;">Load</button>
          <button onclick="editTitleList('${key}')" style="padding:4px 8px; cursor:pointer; background:${isEditing ? '#e0a800' : '#ffc107'}; color:black; border:none; border-radius:3px; font-size:12px;">Edit</button>

    }
    
    savedListsCtn.innerHTML = html;

  function initGame(mode) {
    // Only initialize RNG once (preserves seed sequence across games)
    if (!rng) {
        let seed = seedInput.value.trim() || "default";
        let seedNum = cyrb128(seed);
        rng = mulberry32(seedNum);
    }
    
    currentMode = mode;
    round = 0;
    playerFails = 0;
    aiFails = 0;
    gameOver = false;

    setupCtn.hidden = true;
    gameCtn.hidden = false;
    nextRound();
  }

  function nextRound() {
    round++;
    gameActive = true;
    nextBtn.hidden = true;
    msgEl.textContent = "";
    msgEl.style.color = "#eee";
    
    // Reset UI styles - red for top pair, blue for bottom pair
    ['A','B'].forEach(k => {
      let card = document.getElementById('card'+k);
      card.style.borderColor = "#d32f2f";
      card.style.background = "#222";
      card.style.boxShadow = "none";
      document.getElementById('sum'+k).textContent = "";
      document.getElementById('aiBadge'+k).style.display = 'none';
    });
    ['C','D'].forEach(k => {
      let card = document.getElementById('card'+k);
      card.style.borderColor = "#007acc";
      card.style.background = "#222";
      card.style.boxShadow = "none";
      document.getElementById('sum'+k).textContent = "";
      document.getElementById('aiBadge'+k).style.display = 'none';
    });
    // Clear copy glow from all copyable elements
    ['A','B','C','D'].forEach(k => {
      ['title','chars','sum'].forEach(p => {
        document.getElementById(p+k).style.boxShadow = "";
      });
    });
    winner1El.textContent = "";
    winner2El.textContent = "";

    // Update HUD
    updateHUD();

    // Generate 4 sets of 5 random unicode characters
    currentSets = {
      A: generateSet(),
      B: generateSet(),
      C: generateSet(),
      D: generateSet()
    };

    // Render characters
    renderSet('A');
    renderSet('B');
    renderSet('C');
    renderSet('D');
  }

  function updateHUD() {
      if(currentMode === '0') {
          hudCtn.innerHTML = `<span style="color:#8bc34a">Mode 0: Zen</span>`;
      } else if(currentMode === 'A') {
          hudCtn.innerHTML = `<span>Mode A: Endurance</span> <span style="color:#0f0">Round: ${round}/10</span> <span style="color:${playerFails > 0 ? '#f55' : '#eee'}">Fails: ${playerFails}/3</span>`;
      } else {
          hudCtn.innerHTML = `<span>Mode B: Vs AI</span> <span style="color:#eee">You: ${playerFails}/3</span> <span style="color:#0af">AI: ${aiFails}/3</span>`;
      }
  }

  function generateSet() {
    let chars = [];
    let sum = 0;
    for(let i=0; i<5; i++) {
      let code = 0;
      // Mix of ranges for visual variety (Symbols, Pictographs, General BMP)
      let rangeRoll = rng();
      if(rangeRoll < 0.33) code = Math.floor(rng() * (0x27BF - 0x2600) + 0x2600); // Symbols
      else if(rangeRoll < 0.66) code = Math.floor(rng() * (0x1F5FF - 0x1F300) + 0x1F300); // Pictographs (Emojis)
      else code = Math.floor(rng() * (0xFFFF - 0x0020) + 0x0020); // General BMP

      chars.push(String.fromCodePoint(code));
      sum += code;
    }
    // Pick a random title from the active list
    let title = activeTitleList[Math.floor(rng() * activeTitleList.length)];
    return { chars, sum, title };
  }

  function renderSet(key) {
    let el = document.getElementById('chars'+key);
    let titleEl = document.getElementById('title'+key);
    el.textContent = currentSets[key].chars.join(' ');
    
    let displayTitle = getTitleDisplay(currentSets[key].title);
    
    let shortcuts = { 'A': '[Q]', 'B': '[E]', 'C': '[A]', 'D': '[D]' };
    titleEl.innerHTML = `${shortcuts[key]} ${displayTitle}`;
    
    applySumOrder(key);
  }

  function vote(choice) {
    if(!gameActive) return;
    gameActive = false; // Prevent double voting

    // 1. Reveal sums for all sets
    ['A','B','C','D'].forEach(k => {
      document.getElementById('sum'+k).textContent = currentSets[k].sum.toString(16).toUpperCase();
    });

    // 2. Determine Pair Winners (for display purposes)
    let w1 = currentSets.A.sum >= currentSets.B.sum ? 'A' : 'B';
    let w2 = currentSets.C.sum >= currentSets.D.sum ? 'C' : 'D';
    
    let w1Title = getTitleDisplay(currentSets[w1].title);
    let w2Title = getTitleDisplay(currentSets[w2].title);
    
    winner1El.innerHTML = `Winner: ${w1Title}`;
    winner2El.innerHTML = `Winner: ${w2Title}`;
    highlightWinner(w1);
    highlightWinner(w2);

    // 3. Determine Player Result
    // Failing means selecting the lowest amount in a pair
    let isPair1 = (choice === 'A' || choice === 'B');
    let pair = isPair1 ? ['A', 'B'] : ['C', 'D'];
    let val1 = currentSets[pair[0]].sum;
    let val2 = currentSets[pair[1]].sum;
    let choiceVal = currentSets[choice].sum;
    
    let playerFailedThisRound = false;
    // If values are equal, neither is strictly lowest. Only fail if strictly less than the other.
    if (choiceVal < Math.max(val1, val2)) {
        playerFailedThisRound = true;
        if(currentMode !== '0') playerFails++; // Zen mode doesn't count mistakes
    }

    // Visual feedback for user's choice
    let choiceCard = document.getElementById('card'+choice);
    if(playerFailedThisRound) {
        if(currentMode === '0') {
            // Zen mode: red for loss
            choiceCard.style.borderColor = "#f55";
            choiceCard.style.boxShadow = "0 0 12px 3px #f55";
        } else {
            choiceCard.style.borderColor = "#f55"; // Red for fail
            choiceCard.style.boxShadow = "0 0 10px #f55";
        }
    } else {
        if(currentMode === '0') {
            // Zen mode: blue for win
            choiceCard.style.borderColor = "#2196f3";
            choiceCard.style.boxShadow = "0 0 12px 3px #2196f3";
        } else {
            choiceCard.style.borderColor = "cyan"; // Cyan for safe
        }
    }

    let resultMsg = "";
    let resultColor = "";

    if (playerFailedThisRound) {
        resultMsg = currentMode === '0' ? "Lost — you picked the lowest." : "Fail! You picked the lowest in the pair.";
        resultColor = "#f55";
    } else {
        resultMsg = currentMode === '0' ? "Won — you avoided the lowest!" : "Safe! You avoided the lowest value.";
        resultColor = currentMode === '0' ? "#2196f3" : "#0f0";
    }

    // 4. AI Logic (Mode B)
    let aiChoice = '';
    if(currentMode === 'B') {
        // AI picks a random option A, B, C, or D
        let options = ['A', 'B', 'C', 'D'];
        aiChoice = options[Math.floor(rng() * options.length)];
        
        // Show AI pick
        document.getElementById('aiBadge'+aiChoice).style.display = 'block';
        let aiCard = document.getElementById('card'+aiChoice);
        aiCard.style.borderColor = "purple";

        // Check AI Result
        let aiIsPair1 = (aiChoice === 'A' || aiChoice === 'B');
        let aiPair = aiIsPair1 ? ['A', 'B'] : ['C', 'D'];
        let aiVal1 = currentSets[aiPair[0]].sum;
        let aiVal2 = currentSets[aiPair[1]].sum;
        let aiChoiceVal = currentSets[aiChoice].sum;
        
        let aiChoiceTitle = getTitleDisplay(currentSets[aiChoice].title);

        if (aiChoiceVal < Math.max(aiVal1, aiVal2)) {
            aiFails++;
            resultMsg += ` | AI picked lowest (${aiChoiceTitle}).`;
        } else {
            resultMsg += ` | AI Safe (${aiChoiceTitle}).`;
        }
    }

    msgEl.innerHTML = resultMsg;
    msgEl.style.color = resultColor;

    updateHUD();
    checkGameState();
  }

  function checkGameState() {
      let isGameOver = false;
      let winState = ""; // "WIN", "LOSE", "DRAW"

      if(currentMode === '0') {
          // Zen mode: endless, no win/loss state
          nextBtn.hidden = false;
          nextBtn.textContent = "Next";
          nextBtn.onclick = nextRound;
          return;
      }

      if(currentMode === 'A') {
          if(playerFails >= 3) {
              isGameOver = true;
              winState = "LOSE";
          } else if(round >= 10) {
              isGameOver = true;
              winState = "WIN";
          }
      } else if(currentMode === 'B') {
          if(playerFails >= 3 && aiFails >= 3) {
              isGameOver = true;
              winState = "DRAW";
          } else if(playerFails >= 3) {
              isGameOver = true;
              winState = "LOSE";
          } else if(aiFails >= 3) {
              isGameOver = true;
              winState = "WIN";
          }
      }

      if(isGameOver) {
          gameOver = true;
          nextBtn.hidden = false;
          if(winState === "WIN") {
              msgEl.textContent = "VICTORY! You won the game.";
              msgEl.style.color = "gold";
          } else if (winState === "LOSE") {
              msgEl.textContent = "DEFEAT. You accumulated too many failures.";
              msgEl.style.color = "#f55";
          } else {
              msgEl.textContent = "DRAW! Both failed simultaneously.";
              msgEl.style.color = "#aaa";
          }
          nextBtn.textContent = "Next Game";
          // Loop back to start with same seed/mode instead of going to setup screen
          nextBtn.onclick = () => initGame(currentMode); 
      } else {
          nextBtn.hidden = false;
          nextBtn.textContent = "Next Round";
          nextBtn.onclick = nextRound;
      }
  }

  function handleNext() {
      // This wrapper exists because onclick changes dynamically between nextRound and reset
  }

  function highlightWinner(key) {
    let card = document.getElementById('card'+key);
    // We only highlight the border if the user didn't already color it (User priority)
    // Or just add a distinct inner style, but sticking to simple style properties:
    if(card.style.borderColor !== "cyan" && card.style.borderColor !== "rgb(255, 85, 85)" && card.style.borderColor !== "purple" && card.style.borderColor !== "rgb(33, 150, 243)") {
        card.style.borderColor = "gold";
        card.style.background = "#332a00";
    }
  }

  // Copy functionality helpers
  async function performCopy(el, text) {
    try {
      await navigator.clipboard.writeText(text);
      let oldText = el.textContent;
      let oldColor = el.style.color;
      el.textContent = "Copied!";
      el.style.color = "#fff";
      el.style.boxShadow = "0 0 12px 3px gold";
      setTimeout(() => {
        el.textContent = oldText;
        el.style.color = oldColor;
      }, 800);
    } catch (err) {
      console.error("Copy failed", err);
      el.textContent = "Error";
    }
  }

  function copyChars(key) {
    let text = currentSets[key].chars.join('');
    let el = document.getElementById('chars'+key);
    performCopy(el, text);
  }

  function copySum(key) {
    let text = currentSets[key].sum.toString(16).toUpperCase();
    let el = document.getElementById('sum'+key);
    performCopy(el, text);
  }

  function copyTitle(key) {
    let textToCopy = getTitlePlain(currentSets[key].title);
    let el = document.getElementById('title'+key);
    performCopy(el, textToCopy);
  }

  // Keyboard event listeners
  window.addEventListener('keydown', (e) => {
    let key = e.key.toLowerCase();
    
    // Bind Space key to Next Round / Next Game
    if(e.code === 'Space' || key === ' ') {
      if(!nextBtn.hidden) {
        nextBtn.click();
      }
      return;
    }

    if(!gameActive) return;
    if(key === 'q') vote('A');
    if(key === 'e') vote('B');
    if(key === 'a') vote('C');
    if(key === 'd') vote('D');
  });
  
  // Initialize default title list
  let defaultRawTitles = ["Alpha","Beta","Gamma","Delta","Epsilon","Zeta","Eta","Theta","Iota","Kappa","Lambda","Mu","Nu","Xi","Omicron","Pi","Rho","Sigma","Tau","Upsilon","Phi","Chi","Psi","Omega"];
  activeTitleListRaw = defaultRawTitles;
  activeTitleList = processList(defaultRawTitles);

  // Initialize saved lists display on page load
  renderSavedLists();

</script>
</body>
