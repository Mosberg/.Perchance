  html += '<h1>Public Comment Plugin <span class="badge">P.C.P v1.1</span></h1>';

  html += '<h2>Quick Start</h2>';
  html += '<div class="step"><strong>Step 1:</strong> In your generator&#39;s <code>main.pjs</code>, add this import line at the top:</div>';

  html += '<h2>How It Works</h2>';
  html += '<p>The plugin uses <strong>PerDB</strong> &#8212; a lightweight JSON document database &#8212; to sync comments across all users viewing the same channel. Each channel gets its own collection (<code>pcp_c_&lt;channel&gt;</code>), and the plugin polls PerDB every 5 seconds for new, edited, or deleted messages. User settings (ID, preferences, muted users, etc.) are stored in <code>localStorage</code> and optionally synced to PerDB.</p>';

  html += '<h2>PerDB Configuration</h2>';
  html += '<p>The plugin comes with a shared PerDB API key pre-configured (<code>pk_live_hzqj5cw9g47</code>), so it works out of the box with no setup. For isolated data or high-traffic generators, use your own PerDB API key:</p>';
  html += '<div class="code-block">// Option 1: Pass your key via the options object\n' + String.fromCharCode(91) + 'PCP(' + String.fromCharCode(123) + '\n  channel: "my-chat",\n  perdbApiKey: "pk_live_your_api_key"\n' + String.fromCharCode(125) + ')' + String.fromCharCode(93) + '\n\n// Option 2: Override the default key in main.pjs\n// (edit the $output defaults in public-comment-plugin\'s main.pjs)\n// perdbApiKey: "pk_live_your_api_key"</div>';

  html += '</table>';

  html += '<p>If you want to interact with PerDB directly in your generator code, the SDK is simple:</p>';
  html += '<div class="code-block">const db = new PerDB("pk_live_your_api_key");\n\n// Write data (creates collection if it doesn\'t exist)\nawait db.add("characters", {\n  name: "Sir Lancelot",\n  class: "Paladin",\n  level: 5\n});\n\n// Read data (most recent first, default limit 50, max 200)\nconst scores = await db.get("scores", 10);\nscores.forEach(s => console.log(s.name + ": " + s.points));\n\n// Update a document\nawait db.update("characters", docId, { level: 6 });\n\n// Delete a document\nawait db.delete("characters", docId);</div>';

  html += '<h2>FAQ</h2>';
  html += '<h3>Is P.C.P free to use?</h3>';
  html += '<p>Yes! P.C.P is completely free. The shared PerDB backend is provided at no cost. For high-traffic generators or isolated data, use your own PerDB API key (see <a href="#" style="color:#5271ff">PerDB Configuration</a> above).</p>';
  html += '<h3>Are comments moderated?</h3>';

  html += '<h3>Can I customize the appearance?</h3>';

  html += '<h3>How do I change my User ID?</h3>';

  html += '<h3>What does the theme toggle do?</h3>';
