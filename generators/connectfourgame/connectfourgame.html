function handleOnlineMessage(msg){
  if(msg.type==='authResult'){
    handleAuthResult(msg);
    return;
  }
  if(msg.type==='onlineCount'){
    updateOnlineCount(msg.count);
    return;
  }
  if(msg.type==='statsUpdate'){
    accountStats=msg.stats;
    if(msg.elo!==undefined)accountElo=msg.elo;
    if(msg.level!==undefined)accountLevel=msg.level;
    if(msg.xp!==undefined)accountXp=msg.xp;
    if(msg.xpMax!==undefined)accountXpMax=msg.xpMax;
    if(msg.items!==undefined)accountItems=msg.items;
    if(msg.beatenImpossible!==undefined)accountBeatenImpossible=msg.beatenImpossible;
    if(msg.tags!==undefined)accountTags=msg.tags;
    if(accountLevel>prevAccountLevel){
      showLevelUp(accountLevel);
      prevAccountLevel=accountLevel;
    }
    updateAccountDisplay();
    return;
  }
  if(msg.type==='eloChange'){
    showEloChange(msg.delta);
    return;
  }
  if(msg.type==='levelUp'){
    showLevelUp(msg.level);
    return;
  }
  if(msg.type==='achievement'){
    if(msg.tag==='impossible'){
      appendChatSys('🏆 Achievement unlocked: IMPOSSIBLE chat tag!');
    }
    return;
  }
  if(msg.type==='chatSys'){
    appendChatSys(msg.text);
    return;
  }
  if(msg.type==='buyResult'){
    handleBuyResult(msg);
    return;
  }
  if(msg.type==='leaderboard'){
    renderLeaderboard(msg.entries||[]);
    return;
  }
  if(msg.type==='roleUpdate'){
    accountRole=msg.role||'none';
    updateAccountDisplay();
    return;
  }
  if(msg.type==='banned'){
    showBanScreen(msg);
    return;
  }
  if(msg.type==='kicked'){
    showKickNotice();
    return;
  }
  if(msg.type==='muted'){
    showMuteNotice(msg);
    return;
  }
  if(msg.type==='unmuted'){
    appendChatSys('You have been unmuted.');
    return;
  }
  if(msg.type==='banNotice'){
    showBanNotice(msg.message);
    return;
  }
  if(msg.type==='chatHistory'){
    renderChatHistory(msg.messages||[]);
    return;
  }
  if(msg.type==='chat'){
    appendChatMsg(msg);
    return;
  }
  if(msg.type==='chatMuted'){
    appendChatSys(msg.message);
    return;
  }
  if(msg.type==='adminAccounts'){
    renderAdminPanel(msg);
    return;
  }
  if(msg.type==='adminResult'){
    if(!msg.success){
      alert(msg.error||'Admin action failed');
    }else{
      if(onlineSocket&&onlineSocket.readyState===1){
        onlineSocket.send(JSON.stringify({type:'adminGetAccounts'}));
      }
    }
    return;
  }
  if(msg.type==='helloAck'){
    onlineConnected=true;
    if(msg.onlineCount!==undefined)updateOnlineCount(msg.onlineCount);
    if(onlineState==='reconnecting'){
      onlineState='idle';
      enterOnlineLobby();
    }else{
      updateConnIndicator('connected','Connected — click Find Match');
    }
    return;
  }
  if(msg.type==='rejoined'){
    onlineConnected=true;
    onlineState='playing';
    updateConnIndicator('connected','In game');
    restoreOnlineBoard(msg);
    return;
  }
  if(msg.type==='matched'){
    onlineColor=msg.color;
    onlineState='playing';
    showMatchIntro(msg.profile, msg.opponentProfile);
    return;
  }
  if(msg.type==='matchEnded'){
    enterOnlineLobby();
    appendChatSys('You ended the match.');
    return;
  }
  if(msg.type==='matchEndedByOpponent'){
    gameOver=true;
    onlineState='idle';
    document.getElementById('board').classList.add('disabled');
    hideHoverPiece();
    const overlay=document.getElementById('overlay');
    const title=document.getElementById('overlayTitle');
    const msgEl=document.getElementById('overlayMsg');
    const icon=document.getElementById('overlayIcon');
    const btn=document.getElementById('overlayBtn');
    const btn2=document.getElementById('overlayBtn2');
    icon.textContent='🏳️';
    title.textContent='Match Ended';
    title.className='draw-text';
    msgEl.textContent='Your opponent ended the match.';
    btn.textContent='Find New Match';
    btn2.hidden=true;
    overlay.classList.add('show');
    return;
  }
  if(msg.type==='queueUpdate'){
    updateConnIndicator('connected','Searching for opponent... ('+msg.count+' in queue)');
    return;
  }
  if(msg.type==='cancelled'){
    onlineState='idle';
    document.getElementById('findMatchBtn').hidden=false;
    document.getElementById('cancelMatchBtn').hidden=true;
    updateConnIndicator('connected','Connected — click Find Match');
    return;
  }
  if(msg.type==='move'){
    handleOnlineMove(msg);
    return;
  }
  if(msg.type==='opponentDisconnected'){
    document.getElementById('statusBar').innerHTML='<span class="spinner"></span> Opponent reconnecting...';
    document.getElementById('board').classList.add('disabled');
    return;
  }
  if(msg.type==='opponentRejoined'){
    updateStatus();
    if(currentPlayer===onlineColor&&!gameOver){
      document.getElementById('board').classList.remove('disabled');
    }
    return;
  }
  if(msg.type==='opponentLeft'){
    if(!gameOver){
      gameOver=true;
      onlineState='idle';
      document.getElementById('board').classList.add('disabled');
      hideHoverPiece();
      const overlay=document.getElementById('overlay');
      const title=document.getElementById('overlayTitle');
      const msgEl=document.getElementById('overlayMsg');
      const icon=document.getElementById('overlayIcon');
      const btn=document.getElementById('overlayBtn');
      const btn2=document.getElementById('overlayBtn2');
      icon.textContent='\u{1F613}';
      title.textContent='Opponent Left';
      title.className='draw-text';
      msgEl.textContent='Your opponent left the game.';
      btn.textContent='Find New Match';
      btn2.hidden=true;
      overlay.classList.add('show');
    }
    return;
  }
  if(msg.type==='rematchOffer'){
    rematchRequested=true;
    if(gameOver){
      document.getElementById('overlayMsg').textContent='Opponent wants a rematch!';
    }
    return;
  }
  if(msg.type==='rematchStart'){
    onlineColor=msg.color;
    startOnlineGame();
    return;
  }
}

function handleOnlineMove(data){
  let{col,row,player,winner}=data;
  placePiece(col,row,player);
  updateEvalBar();
  if(winner!==0){
    setTimeout(()=>endGame(winner>0?winner:0),600);
    return;
  }
  currentPlayer=3-player;
  updateBoardTurn();
  updateStatus();
  if(currentPlayer===onlineColor){
    document.getElementById('board').classList.remove('disabled');
  }
}

function restoreOnlineBoard(data){
  onlineColor=data.color;
  gameBoard=new Int8Array(data.board);
  currentPlayer=data.turn;
  gameOver=false;
  isThinking=false;
  rematchRequested=false;
  rematchSent=false;
  const obtn=document.getElementById('overlayBtn');
  obtn.disabled=false;
  obtn.textContent='Request Rematch';
  document.querySelectorAll('.cell').forEach(cell=>cell.innerHTML='');
  for(let c=0;c<7;c++){
    for(let r=0;r<6;r++){
      let p=gameBoard[c*6+r];
      if(p){
        let cell=document.querySelector('.cell[data-col="'+c+'"][data-row="'+r+'"]');
        let piece=document.createElement('div');
        piece.className='piece '+(p===1?'red':'yellow');
        piece.style.animation='none';
        cell.appendChild(piece);
      }
    }
  }
  document.getElementById('onlineLobby').hidden=true;
  document.querySelector('.scoreCard.red .label').textContent=onlineColor===1?'You':'Opponent';
  document.querySelector('.scoreCard.yellow .label').textContent=onlineColor===2?'You':'Opponent';
  document.getElementById('overlay').classList.remove('show');
  updateBoardTurn();
  updateEvalBar();
  if(data.opponentConnected===false&&currentPlayer!==onlineColor){
    document.getElementById('statusBar').innerHTML='<span class="spinner"></span> Opponent reconnecting...';
    document.getElementById('board').classList.add('disabled');
  }else{
    updateStatus();
    if(currentPlayer===onlineColor&&!gameOver){
      document.getElementById('board').classList.remove('disabled');
    }else{
      document.getElementById('board').classList.add('disabled');
    }
  }
}

function showMatchIntro(myProfile, oppProfile){
  const intro=document.getElementById('matchIntroOverlay');
  const myCard=document.getElementById('matchIntroMe');
  const oppCard=document.getElementById('matchIntroOpp');
  const vsEl=document.getElementById('matchIntroVS');
  myCard.innerHTML=renderIntroCard(myProfile,true);
  oppCard.innerHTML=renderIntroCard(oppProfile,false);
  intro.classList.add('show');
  myCard.classList.remove('introSlideLeft');
  oppCard.classList.remove('introSlideRight');
  vsEl.classList.remove('introZoom');
  void intro.offsetWidth;
  myCard.classList.add('introSlideLeft');
  oppCard.classList.add('introSlideRight');
  setTimeout(()=>vsEl.classList.add('introZoom'),700);
  document.getElementById('matchIntroSkipBtn').textContent='Skip';
  setTimeout(()=>{
    if(intro.classList.contains('show')){
      vsEl.textContent='FIGHT!';
      vsEl.classList.add('fightText');
    }
  },1400);
  setTimeout(()=>{
    if(intro.classList.contains('show')) closeMatchIntro();
  },3600);
}

function closeMatchIntro(){
  const intro=document.getElementById('matchIntroOverlay');
  intro.classList.remove('show');
  const vsEl=document.getElementById('matchIntroVS');
  vsEl.textContent='VS';
  vsEl.classList.remove('fightText');
  startOnlineGame();
}

function renderIntroCard(profile,isMe){
  if(!profile) return '<div class="introCardTitle">Unknown</div>';
  let tagsHtml='';
  for(let t of (profile.tags||[])){ tagsHtml+='<span class="chatTag '+t+'">'+escapeHtml(chatTagLabel(t))+'</span>'; }
  const colorClass=isMe?(onlineColor===1?'red':'yellow'):(onlineColor===1?'yellow':'red');
  const colorLabel=isMe?'YOU':(onlineColor===1?'YELLOW':'RED');
  return '<div class="introColorDot '+colorClass+'"></div>'+
    '<div class="introCardTitle">'+escapeHtml(profile.username)+'</div>'+
    '<div class="introTags">'+tagsHtml+'</div>'+
    '<div class="introLevel">Level '+fmtNum(profile.level)+'</div>'+
    '<div class="introElo">'+fmtNum(profile.elo)+' ELO</div>'+
    '<div class="introStats"><span class="introWin">W:'+fmtNum(profile.wins)+'</span> <span class="introLoss">L:'+fmtNum(profile.losses)+'</span> <span class="introDraw">D:'+fmtNum(profile.draws)+'</span></div>'+
    '<div class="introSide">'+colorLabel+'</div>';
}

function endMatch(){
  if(onlineSocket&&onlineSocket.readyState===1){
    onlineSocket.send(JSON.stringify({type:'endMatch'}));
  }
}

function startOnlineGame(){
  gameBoard=new Int8Array(SIZE);
  currentPlayer=1;
  gameOver=false;
  isThinking=false;
  rematchRequested=false;
  rematchSent=false;
  const obtn=document.getElementById('overlayBtn');
  obtn.disabled=false;
  obtn.textContent='Request Rematch';
  document.querySelectorAll('.cell').forEach(cell=>cell.innerHTML='');
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('searchInfo').textContent='';
  document.getElementById('onlineLobby').hidden=true;
  document.getElementById('endMatchBtn').hidden=false;
  document.querySelector('.scoreCard.red .label').textContent=onlineColor===1?'You':'Opponent';
  document.querySelector('.scoreCard.yellow .label').textContent=onlineColor===2?'You':'Opponent';
  updateBoardTurn();
  updateEvalBar();
  updateStatus();
  if(currentPlayer===onlineColor){
    document.getElementById('board').classList.remove('disabled');
  }else{
    document.getElementById('board').classList.add('disabled');
  }
}

function enterOnlineLobby(){
  onlineState='idle';
  document.getElementById('onlineLobby').hidden=false;
  document.getElementById('findMatchBtn').hidden=false;
  document.getElementById('cancelMatchBtn').hidden=true;
  document.getElementById('endMatchBtn').hidden=true;
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('board').classList.add('disabled');
  if(onlineConnected){
    updateConnIndicator('connected','Connected — click Find Match');
  }
}

function findMatch(){
  if(!accountUsername){showAuthOverlay('login');return;}
  if(!onlineSocket||onlineSocket.readyState!==1)return;
  onlineState='searching';
  document.getElementById('findMatchBtn').hidden=true;
  document.getElementById('cancelMatchBtn').hidden=false;
  updateConnIndicator('connected','Searching for opponent...');
  onlineSocket.send(JSON.stringify({type:'findMatch'}));
}

function cancelMatch(){
  if(!onlineSocket||onlineSocket.readyState!==1)return;
  onlineSocket.send(JSON.stringify({type:'cancelMatch'}));
}

function leaveOnlineGame(){
  if(onlineSocket&&onlineSocket.readyState===1){
    onlineSocket.send(JSON.stringify({type:'leaveGame'}));
  }
  enterOnlineLobby();
}

function requestRematch(){
  if(!onlineSocket||onlineSocket.readyState!==1)return;
  if(rematchSent)return;
  rematchSent=true;
  document.getElementById('overlayBtn').textContent='Waiting for opponent...';
  document.getElementById('overlayBtn').disabled=true;
  onlineSocket.send(JSON.stringify({type:'rematch'}));
}

function init(){
  buildBoard();
  loadScores();
  updateScoreboard();
  setupWorker();
  setupEvalWorker();
  setDifficulty('medium');
  document.getElementById('newGameBtn').addEventListener('click',newGame);
  document.getElementById('resetScoreBtn').addEventListener('click',()=>{
    scores={red:0,yellow:0,draws:0};
    saveScores();
    updateScoreboard();
  });
  document.getElementById('overlayBtn').addEventListener('click',()=>{
    if(document.getElementById('overlayBtn').textContent==='Reconnect'){
      gameOver=false;
      document.getElementById('overlay').classList.remove('show');
      connectOnline();
      return;
    }
    if(gameMode==='online'){
      if(onlineState==='idle'||document.getElementById('overlayBtn').textContent==='Find New Match'){
        leaveOnlineGame();
      }else{
        requestRematch();
      }
    }else{
      newGame();
    }
  });
  document.querySelectorAll('.diffBtn').forEach(btn=>{
    btn.addEventListener('click',()=>setDifficulty(btn.dataset.diff));
  });
  document.querySelectorAll('.modeBtn').forEach(btn=>{
    btn.addEventListener('click',()=>setMode(btn.dataset.mode));
  });
  document.getElementById('findMatchBtn').addEventListener('click',findMatch);
  document.getElementById('cancelMatchBtn').addEventListener('click',cancelMatch);
  document.getElementById('endMatchBtn').addEventListener('click',endMatch);
  document.getElementById('matchIntroSkipBtn').addEventListener('click',closeMatchIntro);
  document.getElementById('overlayBtn2').addEventListener('click',()=>{
    if(gameMode==='online'){
      leaveOnlineGame();
    }
  });
  document.getElementById('loginBtn').addEventListener('click',()=>showAuthOverlay('login'));
  document.getElementById('registerBtn').addEventListener('click',()=>showAuthOverlay('register'));
  document.getElementById('authSubmitBtn').addEventListener('click',submitAuth);
  document.getElementById('authToggle').addEventListener('click',()=>{
    showAuthOverlay(authMode==='login'?'register':'login');
  });
  document.getElementById('authPassInput').addEventListener('keydown',(e)=>{
    if(e.key==='Enter')submitAuth();
  });
  document.getElementById('authUserInput').addEventListener('keydown',(e)=>{
    if(e.key==='Enter')document.getElementById('authPassInput').focus();
  });
  document.getElementById('logoutBtn').addEventListener('click',logout);
  document.getElementById('adminPanelBtn').addEventListener('click',openAdminPanel);
  document.getElementById('adminCloseBtn').addEventListener('click',()=>{
    document.getElementById('adminOverlay').classList.remove('show');
  });
  document.getElementById('adminCmdRunBtn').addEventListener('click',()=>{
    runAdminCommand(document.getElementById('adminCmdInput').value);
    document.getElementById('adminCmdInput').value='';
  });
  document.getElementById('adminCmdInput').addEventListener('keydown',(e)=>{
    if(e.key==='Enter'){
      runAdminCommand(document.getElementById('adminCmdInput').value);
      document.getElementById('adminCmdInput').value='';
    }
  });
  document.getElementById('chatToggleBtn').addEventListener('click',()=>{
    document.getElementById('chatPanel').classList.toggle('show');
  });
  document.getElementById('chatCloseBtn').addEventListener('click',()=>{
    document.getElementById('chatPanel').classList.remove('show');
  });
  document.getElementById('chatSendBtn').addEventListener('click',sendChat);
  document.getElementById('chatInput').addEventListener('keydown',(e)=>{
    if(e.key==='Enter')sendChat();
  });
  document.getElementById('shopBtn').addEventListener('click',openShop);
  document.getElementById('shopCloseBtn').addEventListener('click',()=>document.getElementById('shopOverlay').classList.remove('show'));
  document.getElementById('leaderboardBtn').addEventListener('click',openLeaderboard);
  document.getElementById('lbCloseBtn').addEventListener('click',()=>document.getElementById('leaderboardOverlay').classList.remove('show'));
  try{localStorage.removeItem('c4_banned');}catch(e){}
  let ownerParam='';
  try{ownerParam=new URLSearchParams(location.search).get('owner')||'';}catch(e){}
  if(ownerParam){
    try{localStorage.setItem('c4_owner_token',ownerParam);}catch(e){}
    try{history.replaceState(null,'',location.pathname);}catch(e){}
  }
  let savedToken='';
  try{savedToken=localStorage.getItem('c4_owner_token')||'';}catch(e){}
  let savedPass='';
  try{savedPass=localStorage.getItem('c4_acct_pass')||'';}catch(e){}
  if(savedToken||(accountUsername&&savedPass)){
    if(savedToken){accountUsername='MrHighExplosionYT';}
    ensureServerConnection();
  }else{
    showAuthOverlay('login');
  }
  updateAccountDisplay();
}

init();
})();
</script>
