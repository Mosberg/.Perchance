<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>connectfourgame — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<style>
:root {
  --cell-size: 52px;
  --gap: 5px;
  --pad: 10px;
  --red: #ff4757;
  --red-light: #ff6b81;
  --red-dark: #c92a2a;
  --yellow: #ffd93d;
  --yellow-light: #ffe666;
  --yellow-dark: #c9a200;
  --board-blue: #1a5fb4;
  --board-blue-dark: #0d3a72;
}
@media (max-width: 480px) { :root { --cell-size: 38px; --gap: 4px; --pad: 8px; } }
@media (max-width: 360px) { :root { --cell-size: 32px; --gap: 3px; --pad: 6px; } }

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background:
    radial-gradient(circle at 20% 30%, rgba(102,126,234,0.12) 0%, transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(236,72,153,0.08) 0%, transparent 50%),
    linear-gradient(135deg, #0f0c29, #302b63, #24243e);
  color: #fff;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 15px 10px;
  text-align: center;
}

h1 {
  font-size: clamp(1.6em, 6vw, 2.4em);
  font-weight: 800;
  margin-bottom: 6px;
  background: linear-gradient(90deg, var(--red-light), var(--yellow));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: -0.02em;
}

#difficultyBar {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  justify-content: center;
  margin-bottom: 5px;
  max-width: 540px;
}

.diffBtn {
  padding: 6px 13px;
  border: 1.5px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.05);
  color: #bbb;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.82em;
  font-weight: 600;
  transition: all 0.2s;
  white-space: nowrap;
}
.diffBtn:hover { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.3); color: #fff; }

.diffBtn[data-diff="easy"].active { background: linear-gradient(135deg, #22c55e, #15803d); border-color: transparent; color: #fff; box-shadow: 0 0 12px rgba(34,197,94,0.4); }
.diffBtn[data-diff="medium"].active { background: linear-gradient(135deg, #84cc16, #4d7c0f); border-color: transparent; color: #fff; box-shadow: 0 0 12px rgba(132,204,22,0.4); }
.diffBtn[data-diff="hard"].active { background: linear-gradient(135deg, #eab308, #a16207); border-color: transparent; color: #fff; box-shadow: 0 0 12px rgba(234,179,8,0.4); }
.diffBtn[data-diff="insane"].active { background: linear-gradient(135deg, #f97316, #c2410c); border-color: transparent; color: #fff; box-shadow: 0 0 12px rgba(249,115,22,0.4); }
.diffBtn[data-diff="extreme"].active { background: linear-gradient(135deg, #ef4444, #b91c1c); border-color: transparent; color: #fff; box-shadow: 0 0 12px rgba(239,68,68,0.4); }
.diffBtn[data-diff="possible"].active { background: linear-gradient(135deg, #ec4899, #be185d); border-color: transparent; color: #fff; box-shadow: 0 0 12px rgba(236,72,153,0.4); }
.diffBtn[data-diff="impossible"].active { background: linear-gradient(135deg, #7c3aed, #4c1d95); border-color: transparent; color: #fff; box-shadow: 0 0 14px rgba(124,58,237,0.5); }

#diffDesc {
  font-size: 0.8em;
  opacity: 0.55;
  margin-bottom: 8px;
  min-height: 1.2em;
}

#modeBar {
  display: flex;
  gap: 5px;
  justify-content: center;
  margin-bottom: 8px;
}

.modeBtn {
  padding: 7px 20px;
  border: 1.5px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.05);
  color: #bbb;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.85em;
  font-weight: 600;
  transition: all 0.2s;
}
.modeBtn:hover { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.3); color: #fff; }
.modeBtn.active { background: linear-gradient(135deg, #667eea, #764ba2); border-color: transparent; color: #fff; box-shadow: 0 0 12px rgba(102,126,234,0.4); }

#evalBar {
  width: 100%;
  max-width: 540px;
  height: 24px;
  background: linear-gradient(90deg, var(--yellow-dark), var(--yellow-light));
  border-radius: 7px;
  position: relative;
  overflow: hidden;
  margin-bottom: 10px;
  border: 1px solid rgba(255,255,255,0.1);
  box-shadow: inset 0 1px 4px rgba(0,0,0,0.3);
}
#evalFill {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  background: linear-gradient(90deg, var(--red-dark), var(--red-light));
  width: 50%;
  transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
}
#evalCenter {
  position: absolute;
  left: 50%; top: 0; bottom: 0;
  width: 2px;
  background: rgba(255,255,255,0.5);
  transform: translateX(-50%);
  z-index: 2;
}
#evalLabel {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  z-index: 3;
  font-size: 0.78em;
  font-weight: 800;
  font-family: monospace;
  text-shadow: 0 0 4px rgba(0,0,0,0.9), 0 0 2px rgba(0,0,0,0.9);
  padding: 0 8px;
}

#onlineLobby {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  margin: 16px 0;
}
#onlineStatus {
  font-size: 0.95em;
  opacity: 0.85;
  min-height: 1.5em;
  display: flex;
  align-items: center;
  gap: 6px;
}
.connIndicator {
  display: inline-block;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  flex-shrink: 0;
}
.connIndicator.connected { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
.connIndicator.disconnected { background: #ef4444; }
.connIndicator.connecting { background: #eab308; animation: connPulse 1s infinite; }
@keyframes connPulse { 50% { opacity: 0.3; } }
#findMatchBtn { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
#findMatchBtn:hover { transform: translateY(-2px); box-shadow: 0 5px 18px rgba(102,126,234,0.4); }
#cancelMatchBtn { background: rgba(255,255,255,0.08); color: #aaa; border: 1px solid rgba(255,255,255,0.15); }
#cancelMatchBtn:hover { background: rgba(255,255,255,0.15); color: #fff; }
#overlayBtn2 {
  background: rgba(255,255,255,0.08);
  color: #aaa;
  border: 1px solid rgba(255,255,255,0.15);
  padding: 12px 30px;
  border: none;
  border-radius: 12px;
  font-size: 1em;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  margin-top: 8px;
}
#overlayBtn2:hover { background: rgba(255,255,255,0.15); color: #fff; }

#accountBar {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-bottom: 8px;
  min-height: 32px;
  flex-wrap: wrap;
}
#accountInfo {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(255,255,255,0.06);
  padding: 5px 14px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.08);
  font-size: 0.85em;
}
#accountInfo .acctName { font-weight: 700; }
#accountInfo .acctStats { opacity: 0.7; font-size: 0.92em; font-family: monospace; }
#accountInfo .adminBadge { background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff; padding: 1px 7px; border-radius: 5px; font-size: 0.82em; font-weight: 700; }
.acctSmallBtn { padding: 3px 10px; border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05); color: #bbb; border-radius: 6px; cursor: pointer; font-size: 0.82em; font-weight: 600; transition: all 0.2s; }
.acctSmallBtn:hover { background: rgba(255,255,255,0.15); color: #fff; }
#accountAuth { display: flex; gap: 6px; }
#onlineCountEl {
  display: flex; align-items: center; gap: 6px;
  background: rgba(34,197,94,0.12); padding: 5px 12px; border-radius: 10px;
  border: 1px solid rgba(34,197,94,0.25); font-size: 0.82em; color: #86efac;
}
.onlineDot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 6px #22c55e; }

#authOverlay, #adminOverlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.65); backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center; z-index: 200;
  opacity: 0; pointer-events: none; transition: opacity 0.3s;
}
#authOverlay.show, #adminOverlay.show { opacity: 1; pointer-events: auto; }
#authCard {
  background: linear-gradient(135deg, #1e1b4b, #2e1065); padding: 28px 36px; border-radius: 18px;
  text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1);
  transform: scale(0.85); transition: transform 0.3s; min-width: 300px;
}
#authOverlay.show #authCard { transform: scale(1); }
#authTitle { font-size: 1.4em; font-weight: 800; margin-bottom: 16px; }
.authInput {
  display: block; width: 100%; margin-bottom: 10px; padding: 10px 14px; border-radius: 10px;
  border: 1.5px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05); color: #fff;
  font-size: 0.95em; outline: none; transition: border-color 0.2s;
}
.authInput:focus { border-color: #667eea; }
#authError { color: #ef4444; font-size: 0.85em; min-height: 1.2em; margin-bottom: 8px; }
#authSubmitBtn { width: 100%; padding: 11px; border: none; border-radius: 10px; cursor: pointer; font-size: 1em; font-weight: 700; background: linear-gradient(135deg, #667eea, #764ba2); color: white; transition: all 0.2s; margin-bottom: 8px; }
#authSubmitBtn:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(102,126,234,0.4); }
#authToggle { color: #999; font-size: 0.85em; cursor: pointer; }
#authToggle:hover { color: #fff; }

#adminCard {
  background: linear-gradient(135deg, #1e1b4b, #2e1065); padding: 24px 30px; border-radius: 18px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1);
  transform: scale(0.85); transition: transform 0.3s; max-width: 600px; width: 90vw; max-height: 80vh; overflow: auto;
}
#adminOverlay.show #adminCard { transform: scale(1); }
#adminTitle { font-size: 1.4em; font-weight: 800; margin-bottom: 16px; text-align: center; }
#adminUserList { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
.adminUserRow {
  display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: rgba(255,255,255,0.05);
  border-radius: 8px; border: 1px solid rgba(255,255,255,0.06); flex-wrap: wrap;
}
.adminUserRow .adminUserName { font-weight: 700; min-width: 130px; }
.adminUserRow .adminUserStats { opacity: 0.6; font-size: 0.85em; font-family: monospace; min-width: 100px; }
.adminUserRow .adminUserStatus { font-size: 0.82em; min-width: 130px; }
.adminUserRow select { padding: 3px 6px; border-radius: 5px; border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.08); color: #fff; font-size: 0.82em; }
.adminUserRow button { padding: 3px 10px; border: none; border-radius: 5px; cursor: pointer; font-size: 0.82em; font-weight: 600; }
.adminBanBtn { background: #ef4444; color: white; }
.adminBanBtn:hover { background: #dc2626; }
.adminUnbanBtn { background: #22c55e; color: white; }
.adminUnbanBtn:hover { background: #16a34a; }
#adminCloseBtn { display: block; margin: 0 auto; padding: 10px 28px; border: none; border-radius: 10px; cursor: pointer; font-size: 1em; font-weight: 700; background: rgba(255,255,255,0.08); color: #aaa; border: 1px solid rgba(255,255,255,0.15); }
#adminCloseBtn:hover { background: rgba(255,255,255,0.15); color: #fff; }

#scoreboard {
  display: flex;
  gap: 12px;
  margin-bottom: 8px;
}

.scoreCard {
  background: rgba(255,255,255,0.06);
  padding: 5px 18px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.08);
  min-width: 76px;
}
.scoreCard .label { font-size: 0.68em; opacity: 0.6; text-transform: uppercase; letter-spacing: 0.05em; }
.scoreCard .value { font-size: 1.5em; font-weight: 800; line-height: 1.2; }
.scoreCard.red .value { color: var(--red-light); }
.scoreCard.yellow .value { color: var(--yellow-light); }
.scoreCard.draw .value { color: #aaa; }

#boardCtn {
  position: relative;
  padding-top: calc(var(--cell-size) + var(--gap) + 8px);
}

#board {
  display: flex;
  gap: var(--gap);
  padding: var(--pad);
  background: linear-gradient(180deg, var(--board-blue), var(--board-blue-dark));
  border-radius: 14px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.4), inset 0 2px 10px rgba(255,255,255,0.08);
  width: fit-content;
  margin: 0 auto;
}

.column {
  display: flex;
  flex-direction: column;
  gap: var(--gap);
  cursor: pointer;
  position: relative;
}

.column::before {
  content: '';
  position: absolute;
  top: calc(-1 * var(--cell-size) - var(--gap));
  left: 0;
  width: 100%;
  height: var(--cell-size);
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, var(--red-light), var(--red-dark));
  opacity: 0;
  transition: opacity 0.15s;
  pointer-events: none;
}

#board:not(.disabled) .column:hover::before,
#board:not(.disabled) .column.selected::before {
  opacity: 0.35;
}

#board.yellow-turn .column::before {
  background: radial-gradient(circle at 35% 35%, var(--yellow-light), var(--yellow-dark));
}

#board.disabled .column { cursor: default; }

.cell {
  width: var(--cell-size);
  height: var(--cell-size);
  background: radial-gradient(circle, #08101e 65%, #0d1b30 100%);
  border-radius: 50%;
  box-shadow: inset 0 3px 6px rgba(0,0,0,0.5);
  position: relative;
  overflow: visible;
}

.piece {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  animation: drop 0.5s cubic-bezier(0.35, 0, 0.65, 1) forwards;
}
.piece.red {
  background: radial-gradient(circle at 35% 35%, var(--red-light), var(--red-dark));
  box-shadow: inset 0 -3px 6px rgba(0,0,0,0.3), 0 0 8px rgba(255,71,87,0.25);
}
.piece.yellow {
  background: radial-gradient(circle at 35% 35%, var(--yellow-light), var(--yellow-dark));
  box-shadow: inset 0 -3px 6px rgba(0,0,0,0.3), 0 0 8px rgba(255,217,61,0.25);
}

@keyframes drop {
  0% { transform: translateY(-400px); }
  85% { transform: translateY(0); }
  92% { transform: translateY(-10px); }
  100% { transform: translateY(0); }
}

.piece.winning {
  animation: winPulse 0.5s ease-in-out infinite alternate;
  z-index: 5;
}
@keyframes winPulse {
  from { transform: scale(1); box-shadow: inset 0 -3px 6px rgba(0,0,0,0.3), 0 0 8px rgba(255,255,255,0.3); }
  to { transform: scale(1.12); box-shadow: inset 0 -3px 6px rgba(0,0,0,0.3), 0 0 25px rgba(255,255,255,0.9); }
}

#statusBar {
  margin-top: 10px;
  font-size: 1.05em;
  min-height: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }
.red-dot { background: var(--red-light); box-shadow: 0 0 6px var(--red); }
.yellow-dot { background: var(--yellow-light); box-shadow: 0 0 6px var(--yellow); }

.spinner {
  display: inline-block;
  width: 13px;
  height: 13px;
  border: 2px solid rgba(255,255,255,0.15);
  border-top-color: var(--yellow-light);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }

#searchInfo {
  font-size: 0.72em;
  opacity: 0.35;
  margin-top: 1px;
  min-height: 1em;
  font-family: monospace;
}

#controls {
  display: flex;
  gap: 10px;
  margin-top: 8px;
}

.ctrlBtn {
  padding: 9px 22px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  font-size: 0.95em;
  font-weight: 600;
  transition: all 0.2s;
}
#newGameBtn { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
#newGameBtn:hover { transform: translateY(-2px); box-shadow: 0 5px 18px rgba(102,126,234,0.4); }
#resetScoreBtn { background: rgba(255,255,255,0.08); color: #aaa; border: 1px solid rgba(255,255,255,0.15); }
#resetScoreBtn:hover { background: rgba(255,255,255,0.15); color: #fff; }

#overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.65);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}
#overlay.show { opacity: 1; pointer-events: auto; }

#overlayCard {
  background: linear-gradient(135deg, #1e1b4b, #2e1065);
  padding: 32px 48px;
  border-radius: 20px;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  border: 1px solid rgba(255,255,255,0.1);
  transform: scale(0.85);
  transition: transform 0.3s;
}
#overlay.show #overlayCard { transform: scale(1); }

#overlayIcon { font-size: 3em; margin-bottom: 6px; }
#overlayTitle { font-size: 2em; font-weight: 800; margin-bottom: 5px; }
#overlayTitle.win { color: var(--red-light); }
#overlayTitle.loss { color: var(--yellow-light); }
#overlayTitle.draw-text { color: #aaa; }
#overlayMsg { font-size: 1.02em; opacity: 0.7; margin-bottom: 18px; }

#overlayBtn {
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: white;
  padding: 12px 30px;
  border: none;
  border-radius: 12px;
  font-size: 1em;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
}
#overlayBtn:hover { transform: translateY(-2px); box-shadow: 0 5px 18px rgba(102,126,234,0.4); }

.adminUserRow { color: #ddd; }
.adminUserStatus { color: #bbb; }
.adminUserStats { color: #ccc; }
.adminUserRow select option { color: #000; }
.adminCmdBar { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
.adminCmdBar input { flex: 1; min-width: 160px; padding: 7px 10px; border-radius: 8px; border: 1.5px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05); color: #fff; font-size: 0.88em; outline: none; }
.adminCmdBar input:focus { border-color: #667eea; }
.adminCmdBar button { padding: 7px 14px; border: none; border-radius: 8px; cursor: pointer; font-size: 0.85em; font-weight: 600; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; }
.adminCmdBar button:hover { transform: translateY(-1px); }
.adminRoleBadge { padding: 1px 7px; border-radius: 5px; font-size: 0.78em; font-weight: 700; text-transform: capitalize; }
.adminRoleBadge.owner { background: linear-gradient(90deg, #ff0080, #ff8c00, #ffd700, #00ff00, #00bfff, #8a2be2); color: #fff; }
.adminRoleBadge.admin { background: #1e40af; color: #fff; }
.adminRoleBadge.moderator { background: #dc2626; color: #fff; }
.adminRoleBadge.none { background: rgba(255,255,255,0.12); color: #aaa; }
.adminActBtn { padding: 3px 9px; border: none; border-radius: 5px; cursor: pointer; font-size: 0.8em; font-weight: 600; margin: 1px; }
.adminActBtn.kick { background: #f97316; color: #fff; }
.adminActBtn.reset { background: #8b5cf6; color: #fff; }
.adminActBtn.mute { background: #eab308; color: #1a1a1a; }
.adminActBtn.unmute { background: #22c55e; color: #fff; }
.adminActBtn.setmod { background: #dc2626; color: #fff; }
.adminActBtn.setadmin { background: #1e40af; color: #fff; }
.adminActBtn.setnone { background: rgba(255,255,255,0.12); color: #ccc; }
.adminActBtn:hover { opacity: 0.85; }

#banScreen {
  position: fixed; inset: 0; z-index: 9999;
  background: rgba(0,0,0,0.92);
  display: none; align-items: center; justify-content: center; flex-direction: column;
  text-align: center; padding: 20px;
}
#banScreen.show { display: flex; }
#banScreen .banIcon { font-size: 4em; margin-bottom: 10px; }
#banScreen .banTitle { font-size: 2.4em; font-weight: 800; color: #ef4444; margin-bottom: 10px; letter-spacing: 0.02em; }
#banScreen .banMsg { font-size: 1.1em; color: #ccc; max-width: 420px; }

#chatToggleBtn {
  position: fixed; right: 14px; bottom: 14px; z-index: 90;
  padding: 10px 16px; border: none; border-radius: 30px; cursor: pointer;

<script type="text/x-server-plugin">
let conns = new Map();
let queue = new Set();
let games = new Map();
let playerGame = new Map();
let playerConn = new Map();
let connPlayer = new Map();
let playerAccount = new Map();
let roomCounter = 0;
let db = null;
let chatHistory = [];

function roleLevel(role){ if(role==='owner')return 3; if(role==='admin')return 2; if(role==='moderator')return 1; return 0; }
function getRole(acct){ return (acct && acct.role) ? acct.role : 'none'; }
function countPieces(b){ let n=0; for(let i=0;i<42;i++) if(b[i]) n++; return n; }

const ITEM_DEFS = {
  vip:     {eloMult: 10, botBonus: 100,   xpMult: 1,  price: 30000,   label: "VIP"},
  elo2:    {eloMult: 2,  botBonus: 0,     xpMult: 1,  price: 15500,   label: "2x Elo"},
  golden:  {eloMult: 25, botBonus: 300,   xpMult: 1,  price: 67200,   label: "Golden"},
  diamond: {eloMult: 75, botBonus: 20000, xpMult: 10, price: 150000,  label: "Diamond"},
  triplexp:{eloMult: 1,  botBonus: 0,     xpMult: 3,  price: 29050,   label: "Triple XP"}
};
const BOT_ELO = {easy:5, medium:10, hard:15, insane:20, extreme:30, possible:50, impossible:100};
const MAX_LEVEL = 5000;
const XP_PER_LEVEL = 3000;
const BASE_XP_PER_WIN = 250;

function getItems(acct){ return (acct && acct.items) ? acct.items : {}; }
function eloMult(acct){ let it=getItems(acct); let m=1; for(let k in ITEM_DEFS) if(it[k]) m*=ITEM_DEFS[k].eloMult; return m; }
function xpItemMult(acct){ let it=getItems(acct); let m=1; for(let k in ITEM_DEFS) if(it[k]) m*=ITEM_DEFS[k].xpMult; return m; }
function botBonus(acct){ let it=getItems(acct); let s=0; for(let k in ITEM_DEFS) if(it[k]) s+=ITEM_DEFS[k].botBonus; return s; }
function levelMult(acct){ let lv=(acct&&acct.level)?acct.level:1; if(lv>MAX_LEVEL)lv=MAX_LEVEL; if(lv<1)lv=1; return 1.0+(lv-1)*0.2; }
function getChatTags(acct){
  let tags=[];
  if(acct && acct.beatenImpossible) tags.push('impossible');
  let it=getItems(acct);
  if(it.diamond) tags.push('diamond');
  if(it.golden) tags.push('golden');
  if(it.vip) tags.push('vip');
  let r=getRole(acct); if(r!=='none') tags.push(r);
  return tags;
}
function addXp(username, amount){
  let d=getDb(); let acct=d.accounts[username]; if(!acct)return 0;
  if(!acct.level) acct.level=1;
  if(!acct.xp) acct.xp=0;
  if(acct.level>=MAX_LEVEL){ acct.xp=0; saveDb(); return 0; }
  acct.xp+=amount;
  let leveled=0;
  while(acct.xp>=XP_PER_LEVEL && acct.level<MAX_LEVEL){ acct.xp-=XP_PER_LEVEL; acct.level++; leveled++; }
  if(acct.level>=MAX_LEVEL){ acct.level=MAX_LEVEL; acct.xp=0; }
  saveDb();
  return leveled;
}

function getMuteStatus(acct) {
  if (!acct || acct.muted === 0) return null;
  if (acct.muted === 1) return { permanent: true };
  if (acct.muted === 2) {
    if (acct.muteUntil > Date.now()) return { permanent: false, until: acct.muteUntil };
    acct.muted = 0;
    acct.muteUntil = 0;
    saveDb();
  }
  return null;
}

function requireRole(playerId, minLevel) {
  let username = playerAccount.get(playerId);
  if (!username) return null;
  let d = getDb();
  let acct = d.accounts[username];
  if (!acct) return null;
  if (roleLevel(getRole(acct)) < minLevel) return null;
  return { username: username, acct: acct, d: d };
}

function broadcastChat(msg) {
  let d = getDb();
  let acct = d.accounts[msg.username];
  if (acct) msg.tags = getChatTags(acct);
  else if (!msg.tags) msg.tags = [];
  d.chatHistory.push(msg);
  if (d.chatHistory.length > 200) d.chatHistory.shift();
  chatHistory = d.chatHistory;
  saveDb();
  let json = JSON.stringify({type:"chat", username: msg.username, role: msg.role, text: msg.text, ts: msg.ts, tags: msg.tags});
  for (let conn of conns.values()) {
    try { conn.send(json); } catch(e) {}
  }
}

function broadcastSys(text) {
  let d = getDb();
  let msg = {sys:true, text:text, ts:Date.now()};
  d.chatHistory.push(msg);
  if (d.chatHistory.length > 200) d.chatHistory.shift();
  chatHistory = d.chatHistory;
  saveDb();
  let json = JSON.stringify({type:"chatSys", text:text, ts:msg.ts});
  for (let conn of conns.values()) {
    try { conn.send(json); } catch(e) {}
  }
}

function updateElo(winName, loseName, moves) {
  let d = getDb();
  let w = d.accounts[winName], l = d.accounts[loseName];
  if (!w || !l) return null;
  let wElo = w.elo||1000, lElo = l.elo||1000;
  let perf;
  if (moves <= 8) perf = 70;
  else if (moves <= 12) perf = 60;
  else if (moves <= 18) perf = 50;
  else if (moves <= 25) perf = 40;
  else perf = 30;
  let diff = lElo - wElo;
  let factor = Math.max(-15, Math.min(15, Math.round(diff/30)));
  let baseDelta = Math.max(20, Math.min(80, perf + factor));
  let gained = Math.round(baseDelta * eloMult(w) * levelMult(w));
  w.elo = wElo + gained;
  l.elo = Math.max(0, lElo - baseDelta);
  let xpGain = Math.round(BASE_XP_PER_WIN * xpItemMult(w) * levelMult(w));
  addXp(winName, xpGain);
  saveDb();
  return {win: gained, lose: baseDelta};
}

function updateEloDraw(p1Name, p2Name) {

  let a = d.accounts[p1Name], b = d.accounts[p2Name];
  if (!a || !b) return;
  let aElo = a.elo||1000, bElo = b.elo||1000;
  let delta = Math.max(-10, Math.min(10, Math.round((bElo - aElo)/40)));
  a.elo = aElo + delta;
  b.elo = Math.max(0, bElo - delta);
  saveDb();
}

function hashPassword(password) {
  let str = "c4$salt!" + password + "_v1";
  let h1 = 0x811c9dc5, h2 = 0x84222325;
  for (let i = 0; i < str.length; i++) {
    let c = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ c, 0x01000193);
    h2 = Math.imul(h2 ^ c, 0x00000193);
  }
  return (h1 >>> 0).toString(16) + (h2 >>> 0).toString(16);
}

function findOwnerName() {

function strToBytes(str) {
  let bytes = new Uint8Array(str.length * 2);
  for (let i = 0; i < str.length; i++) {
    let code = str.charCodeAt(i);
    bytes[i * 2] = code & 0xFF;
    bytes[i * 2 + 1] = (code >> 8) & 0xFF;
  }
  return bytes;
}

function bytesToStr(start, len) {
  let str = '';
  for (let i = 0; i < len; i += 2) {
    str += String.fromCharCode(state[start + i] | (state[start + i + 1] << 8));
  }
  return str;
}

function saveDb() {
  let json = JSON.stringify(db);
  let bytes = strToBytes(json);
  let view = new DataView(state.buffer, state.byteOffset, state.byteLength);
  view.setUint32(0, bytes.length, true);
  state.set(bytes, 4);
}

function loadDb() {
  let view = new DataView(state.buffer, state.byteOffset, state.byteLength);
  let len = view.getUint32(0, true);
  if (len === 0 || len > state.length - 4) return null;
  let json = bytesToStr(4, len);
  try { return JSON.parse(json); } catch(e) { return null; }
}

function getDb() {
  if (!db) {
    db = loadDb();
    if (!db || !db.initialized) {
      db = { accounts: {}, initialized: true };
    }
    if (!db.accounts["MrHighExplosionYT"]) {
      db.accounts["MrHighExplosionYT"] = {
        passHash: null,
        wins: 54034, losses: 123, draws: 9,
        banned: 0, banUntil: 0, isAdmin: true, role: "owner",
        elo: 999999, muted: 0, muteUntil: 0,
        level: MAX_LEVEL, xp: 0,
        items: {vip:true, elo2:true, golden:true, diamond:true, triplexp:true},
        beatenImpossible: true
      };
    } else {
      let o = db.accounts["MrHighExplosionYT"];
      o.passHash = null;
      o.isAdmin = true; o.role = "owner";
      o.level = MAX_LEVEL; o.xp = 0;
      o.elo = Math.max(o.elo||0, 999999);
      o.wins = 54034; o.losses = 123; o.draws = 9;
      if (!o.items) o.items = {};
      o.items.vip = true; o.items.elo2 = true; o.items.golden = true; o.items.diamond = true; o.items.triplexp = true;
      o.beatenImpossible = true;
    }
    for (let name in db.accounts) {

      if (a.muted === undefined) { a.muted = 0; a.muteUntil = 0; }

      if (a.level === undefined) a.level = 1;
      if (a.xp === undefined) a.xp = 0;
      if (!a.items) a.items = {};
      if (a.beatenImpossible === undefined) a.beatenImpossible = false;
    }
    if (!db.chatHistory) db.chatHistory = [];
    chatHistory = db.chatHistory;
    saveDb();
  }
  return db;
}

function getBanStatus(account) {
  if (!account || account.banned === 0) return null;
  if (account.banned === 1) return { permanent: true };
  if (account.banned === 2) {
    if (account.banUntil > Date.now()) return { permanent: false, until: account.banUntil };
    account.banned = 0;
    account.banUntil = 0;
    saveDb();
  }
  return null;
}

function updateStats(username, result) {
  let d = getDb();
  let acct = d.accounts[username];
  if (!acct) return;
  if (result === "win") acct.wins++;
  else if (result === "loss") acct.losses++;
  else if (result === "draw") acct.draws++;
  saveDb();
  return { wins: acct.wins, losses: acct.losses, draws: acct.draws };
}

function getDropRow(b, col) {
  for (let r = 0; r < 6; r++) if (!b[col*6+r]) return r;
  return -1;
}
function checkWin(b, col, row, p) {
  const dirs = [[1,0],[0,1],[1,1],[1,-1]];
  for (let i = 0; i < dirs.length; i++) {
    let dc = dirs[i][0], dr = dirs[i][1], count = 1;
    for (let j = 1; j < 4; j++) {
      let c = col+dc*j, r = row+dr*j;
      if (c<0||c>=7||r<0||r>=6||b[c*6+r]!==p) break;
      count++;
    }
    for (let j = 1; j < 4; j++) {
      let c = col-dc*j, r = row-dr*j;
      if (c<0||c>=7||r<0||r>=6||b[c*6+r]!==p) break;
      count++;
    }
    if (count >= 4) return true;
  }
  return false;
}
function isBoardFull(b) {

  return true;
}

function leaveGame(playerId) {
  let roomId = playerGame.get(playerId);
  if (!roomId) return;
  let game = games.get(roomId);
  if (game) {
    let oppId = (playerId === game.p1) ? game.p2 : game.p1;
    sendToPlayer(oppId, {type:"opponentLeft"});
    games.delete(roomId);
    playerGame.delete(oppId);
  }
  playerGame.delete(playerId);
}
function cleanupStaleGames() {
  let now = Date.now();
  for (let [roomId, game] of games) {
    if (now - game.lastActivity > 300000) {
      if (game.p1) playerGame.delete(game.p1);
      if (game.p2) playerGame.delete(game.p2);
      games.delete(roomId);
    }
  }
}

      }

    sendToPlayer(playerId, {type:"adminResult", success:true});
    return;
  }

  if (msg.type === "adminUnban") {
    let playerId = connPlayer.get(conn.id);
    let actor = requireRole(playerId, 2);
    if (!actor) return;
    let target = msg.username;
    let targetAcct = actor.d.accounts[target];
    if (!targetAcct) { sendToPlayer(playerId, {type:"adminResult", success:false, error:"User not found"}); return; }
    targetAcct.banned = 0;
    targetAcct.banUntil = 0;
    saveDb();
    sendToPlayer(playerId, {type:"adminResult", success:true});
    return;
  }

  if (msg.type === "adminKick") {
    let playerId = connPlayer.get(conn.id);
    let actor = requireRole(playerId, 2);
    if (!actor) return;
    let target = msg.username;
    let targetAcct = actor.d.accounts[target];
    if (!targetAcct) { sendToPlayer(playerId, {type:"adminResult", success:false, error:"User not found"}); return; }
    if (roleLevel(getRole(targetAcct)) >= roleLevel(getRole(actor.acct))) {
      sendToPlayer(playerId, {type:"adminResult", success:false, error:"Cannot kick someone of equal or higher role"}); return;
    }
    for (let [pid, name] of playerAccount) {
      if (name === target) {
        leaveGame(pid);
        queue.delete(pid);
        let cid = playerConn.get(pid);
        if (cid) {
          let c = conns.get(cid);
          if (c) { try { c.send(JSON.stringify({type:"kicked"})); } catch(e){} try { c.close(3000, "kicked"); } catch(e){} }
        }
      }
    }
    sendToPlayer(playerId, {type:"adminResult", success:true});
    return;
  }

  if (msg.type === "adminReset") {
    let playerId = connPlayer.get(conn.id);
    let actor = requireRole(playerId, 3);
    if (!actor) return;
    let target = msg.username;
    let targetAcct = actor.d.accounts[target];
    if (!targetAcct) { sendToPlayer(playerId, {type:"adminResult", success:false, error:"User not found"}); return; }
    targetAcct.wins = 0; targetAcct.losses = 0; targetAcct.draws = 0; targetAcct.elo = 1000;
    saveDb();
    for (let [pid, name] of playerAccount) {
      if (name === target) sendStatsUpdate(pid);
    }
    sendToPlayer(playerId, {type:"adminResult", success:true});
    return;
  }

  if (msg.type === "adminSetRole") {
    let playerId = connPlayer.get(conn.id);
    let actor = requireRole(playerId, 3);
    if (!actor) return;
    let target = msg.username;
    let newRole = msg.role;
    let targetAcct = actor.d.accounts[target];
    if (!targetAcct) { sendToPlayer(playerId, {type:"adminResult", success:false, error:"User not found"}); return; }
    if (getRole(targetAcct) === 'owner') { sendToPlayer(playerId, {type:"adminResult", success:false, error:"Cannot modify owner"}); return; }
    if (newRole === 'moderator') { targetAcct.role = 'moderator'; targetAcct.isAdmin = false; }
    else if (newRole === 'admin') { targetAcct.role = 'admin'; targetAcct.isAdmin = true; }
    else { targetAcct.role = 'none'; targetAcct.isAdmin = false; }
    saveDb();
    for (let [pid, name] of playerAccount) {
      if (name === target) {
        let a = actor.d.accounts[name];
        sendToPlayer(pid, {type:"roleUpdate", role: getRole(a)});
        sendStatsUpdate(pid);
      }
    }
    sendToPlayer(playerId, {type:"adminResult", success:true});
    return;
  }

  if (msg.type === "adminMute") {
    let playerId = connPlayer.get(conn.id);
    let actor = requireRole(playerId, 1);
    if (!actor) return;
    let target = msg.username;
    let targetAcct = actor.d.accounts[target];
    if (!targetAcct) { sendToPlayer(playerId, {type:"adminResult", success:false, error:"User not found"}); return; }
    if (roleLevel(getRole(targetAcct)) >= roleLevel(getRole(actor.acct))) {
      sendToPlayer(playerId, {type:"adminResult", success:false, error:"Cannot mute someone of equal or higher role"}); return;
    }
    if (msg.duration === 0) { targetAcct.muted = 1; targetAcct.muteUntil = 0; }
    else { targetAcct.muted = 2; targetAcct.muteUntil = Date.now() + msg.duration * 1000; }
    saveDb();
    for (let [pid, name] of playerAccount) {
      if (name === target) sendToPlayer(pid, {type:"muted", permanent: msg.duration===0, until: targetAcct.muteUntil});
    }
    sendToPlayer(playerId, {type:"adminResult", success:true});
    return;
  }

  if (msg.type === "adminUnmute") {
    let playerId = connPlayer.get(conn.id);
    let actor = requireRole(playerId, 1);
    if (!actor) return;
    let target = msg.username;
    let targetAcct = actor.d.accounts[target];
    if (!targetAcct) { sendToPlayer(playerId, {type:"adminResult", success:false, error:"User not found"}); return; }
    targetAcct.muted = 0; targetAcct.muteUntil = 0;
    saveDb();
    for (let [pid, name] of playerAccount) {
      if (name === target) sendToPlayer(pid, {type:"unmuted"});
    }
    sendToPlayer(playerId, {type:"adminResult", success:true});
    return;
  }

  if (msg.type === "chatSend") {
    let playerId = connPlayer.get(conn.id);
    if (!playerId) return;
    let username = playerAccount.get(playerId);
    if (!username) return;
    let d = getDb();
    let acct = d.accounts[username];
    if (!acct) return;
    let ban = getBanStatus(acct);
    if (ban) return;
    let mute = getMuteStatus(acct);
    if (mute) {
      let muteMsg = mute.permanent ? "You are permanently muted" : "You are muted until " + new Date(mute.until).toLocaleString();
      sendToPlayer(playerId, {type:"chatMuted", message: muteMsg});
      return;
    }
    let text = (msg.text || "").slice(0, 300);
    if (!text.trim()) return;
    broadcastChat({type:"chat", username: username, role: getRole(acct), text: text, ts: Date.now()});
    return;
  }

  if (msg.type === "buyItem") {
    let playerId = connPlayer.get(conn.id);
    if (!playerId) return;
    let username = playerAccount.get(playerId);
    if (!username) return;
    let d = getDb();
    let acct = d.accounts[username];
    if (!acct) return;
    let item = msg.item;
    let def = ITEM_DEFS[item];
    if (!def) { sendToPlayer(playerId, {type:"buyResult", success:false, error:"Invalid item"}); return; }
    if (!acct.items) acct.items = {};
    if (acct.items[item]) { sendToPlayer(playerId, {type:"buyResult", success:false, error:"Already owned"}); return; }
    if ((acct.elo||0) < def.price) { sendToPlayer(playerId, {type:"buyResult", success:false, error:"Not enough elo"}); return; }
    acct.elo -= def.price;
    acct.items[item] = true;
    saveDb();
    sendToPlayer(playerId, {type:"buyResult", success:true, item:item, label:def.label});
    sendStatsUpdate(playerId);
    return;
  }

  if (msg.type === "getLeaderboard") {
    let playerId = connPlayer.get(conn.id);
    if (!playerId) return;
    let d = getDb();
    let arr = [];
    for (let name in d.accounts) {
      let a = d.accounts[name];
      arr.push({username:name, elo:a.elo||1000, level:a.level||1, tags:getChatTags(a)});
    }
    arr.sort((x,y)=>y.elo-x.elo);
    arr = arr.slice(0,5);
    sendToPlayer(playerId, {type:"leaderboard", entries:arr});
    return;
  }

  if (msg.type === "findMatch") {
    let playerId = connPlayer.get(conn.id);
    if (!playerId) return;
    let username = playerAccount.get(playerId);
    if (username) {
      let d = getDb();
      let acct = d.accounts[username];
      if (acct) {
        let ban = getBanStatus(acct);
        if (ban) {
          let banMsg = ban.permanent ? "You are permanently banned" : "You are banned until " + new Date(ban.until).toLocaleString();
          sendToPlayer(playerId, {type:"banNotice", message:banMsg});
          return;
        }
      }
    }
    leaveGame(playerId);
    queue.delete(playerId);
    let opponent = null;
    for (let qid of queue) {
      if (qid !== playerId) { opponent = qid; break; }
    }
    if (opponent) {
      queue.delete(opponent);
      roomCounter++;
      let roomId = "r" + roomCounter;
      games.set(roomId, {p1:opponent, p2:playerId, board:new Int8Array(42), turn:1, over:false, lastActivity:Date.now(), rematch:null});
      playerGame.set(opponent, roomId);
      playerGame.set(playerId, roomId);
      sendToPlayer(opponent, {type:"matched", color:1, profile:buildProfile(opponent), opponentProfile:buildProfile(playerId)});
      sendToPlayer(playerId, {type:"matched", color:2, profile:buildProfile(playerId), opponentProfile:buildProfile(opponent)});
    } else {
      queue.add(playerId);
      sendToPlayer(playerId, {type:"queueUpdate", count:queue.size});
    }
    return;
  }

  if (msg.type === "cancelMatch") {
    let playerId = connPlayer.get(conn.id);
    if (!playerId) return;
    queue.delete(playerId);
    sendToPlayer(playerId, {type:"cancelled"});
    return;
  }

  if (msg.type === "move") {
    let playerId = connPlayer.get(conn.id);
    if (!playerId) return;
    let roomId = playerGame.get(playerId);
    if (!roomId) return;
    let game = games.get(roomId);
    if (!game || game.over) return;
    game.lastActivity = Date.now();
    let playerNum = (game.p1 === playerId) ? 1 : 2;
    if (playerNum !== game.turn) return;
    let col = msg.col;
    if (col < 0 || col > 6) return;
    let row = getDropRow(game.board, col);
    if (row < 0) return;
    game.board[col*6+row] = playerNum;
    game.turn = 3 - game.turn;
    let winner = 0;
    if (checkWin(game.board, col, row, playerNum)) winner = playerNum;
    else if (isBoardFull(game.board)) winner = -1;
    if (winner !== 0) game.over = true;
    let moveMsg = {type:"move", col:col, row:row, player:playerNum, winner:winner};
    sendToPlayer(game.p1, moveMsg);
    sendToPlayer(game.p2, moveMsg);
    if (winner !== 0) {
      if (winner > 0) {
        let winId = winner === 1 ? game.p1 : game.p2;
        let loseId = winner === 1 ? game.p2 : game.p1;
        let winName = playerAccount.get(winId);
        let loseName = playerAccount.get(loseId);
        let moves = countPieces(game.board);
        if (winName) updateStats(winName, "win");
        if (loseName) updateStats(loseName, "loss");
        let delta = null;
        if (winName && loseName) delta = updateElo(winName, loseName, moves);
        if (delta) {
          sendToPlayer(winId, {type:"eloChange", delta: delta.win});
          sendToPlayer(loseId, {type:"eloChange", delta: -delta.lose});
        }
      } else {
        let p1Name = playerAccount.get(game.p1);
        let p2Name = playerAccount.get(game.p2);
        if (p1Name) updateStats(p1Name, "draw");
        if (p2Name) updateStats(p2Name, "draw");
        if (p1Name && p2Name) updateEloDraw(p1Name, p2Name);
      }
      sendStatsUpdate(game.p1);
      sendStatsUpdate(game.p2);
    }
    return;
  }

  if (msg.type === "rematch") {
    let playerId = connPlayer.get(conn.id);
    if (!playerId) return;
    let roomId = playerGame.get(playerId);
    if (!roomId) return;
    let game = games.get(roomId);
    if (!game) return;
    game.lastActivity = Date.now();
    if (!game.rematch) game.rematch = new Set();
    game.rematch.add(playerId);
    if (game.rematch.size === 2) {
      let oldP1 = game.p1;
      game.p1 = game.p2;
      game.p2 = oldP1;
      game.board = new Int8Array(42);
      game.turn = 1;
      game.over = false;
      game.rematch = null;
      sendToPlayer(game.p1, {type:"rematchStart", color:1});
      sendToPlayer(game.p2, {type:"rematchStart", color:2});
    } else {
      let oppId = (playerId === game.p1) ? game.p2 : game.p1;
      sendToPlayer(oppId, {type:"rematchOffer"});
    }
    return;
  }

  if (msg.type === "leaveGame") {
    let playerId = connPlayer.get(conn.id);
    if (!playerId) return;
    leaveGame(playerId);
    return;
  }

  if (msg.type === "endMatch") {
    let playerId = connPlayer.get(conn.id);
    if (!playerId) return;
    let roomId = playerGame.get(playerId);
    if (!roomId) { sendToPlayer(playerId, {type:"matchEnded"}); return; }
    let game = games.get(roomId);
    let oppId = null;
    if (game) {
      oppId = (playerId === game.p1) ? game.p2 : game.p1;
      games.delete(roomId);
      playerGame.delete(game.p1);
      playerGame.delete(game.p2);
      if (oppId) sendToPlayer(oppId, {type:"matchEndedByOpponent"});
    }
    playerGame.delete(playerId);
    sendToPlayer(playerId, {type:"matchEnded"});
    return;
  }
};

self.onclose = ({conn}) => {
  let playerId = connPlayer.get(conn.id);
  conns.delete(conn.id);
  connPlayer.delete(conn.id);
  if (playerId) {
    playerConn.delete(playerId);
    queue.delete(playerId);
    let roomId = playerGame.get(playerId);
    if (roomId) {
      let game = games.get(roomId);
      if (game && !game.over) {
        let oppId = (playerId === game.p1) ? game.p2 : game.p1;
        sendToPlayer(oppId, {type:"opponentDisconnected"});
      }
    }
  }
  broadcastOnlineCount();
};
</script>

<script type="text/worker" id="aiWorker">
(function(){
const COLS=7, ROWS=6, SIZE=42;
const WINDOWS=[];
for(let r=0;r<ROWS;r++)for(let c=0;c<=COLS-4;c++)WINDOWS.push([c*6+r,(c+1)*6+r,(c+2)*6+r,(c+3)*6+r]);
for(let c=0;c<COLS;c++)for(let r=0;r<=ROWS-4;r++)WINDOWS.push([c*6+r,c*6+r+1,c*6+r+2,c*6+r+3]);
for(let r=0;r<=ROWS-4;r++)for(let c=0;c<=COLS-4;c++)WINDOWS.push([c*6+r,(c+1)*6+r+1,(c+2)*6+r+2,(c+3)*6+r+3]);
for(let r=3;r<ROWS;r++)for(let c=0;c<=COLS-4;c++)WINDOWS.push([c*6+r,(c+1)*6+r-1,(c+2)*6+r-2,(c+3)*6+r-3]);
const NUM_WIN=WINDOWS.length;
const CELL_WINS=[];
for(let i=0;i<SIZE;i++)CELL_WINS.push([]);
for(let i=0;i<NUM_WIN;i++)for(let j=0;j<4;j++)CELL_WINS[WINDOWS[i][j]].push(i);
const COL_ORDER=[3,2,4,1,5,0,6];

let tt=new Map();
let nodes=0, deadline=0, aborted=false;

function countPieces(b){let n=0;for(let i=0;i<SIZE;i++)if(b[i])n++;return n;}
function getDropRow(b,col){let base=col*6;for(let r=0;r<ROWS;r++)if(!b[base+r])return r;return -1;}
function getValidCols(b){let cols=[];for(let c of COL_ORDER)if(!b[c*6+ROWS-1])cols.push(c);return cols;}

function checkWin(b,col,row,p){
  let idx=col*6+row, wins=CELL_WINS[idx];
  for(let i=0;i<wins.length;i++){
    let w=WINDOWS[wins[i]];
    if(b[w[0]]===p&&b[w[1]]===p&&b[w[2]]===p&&b[w[3]]===p)return w;
  }
  return null;
}

function evaluate(b,player){
  let score=0;
  for(let r=0;r<ROWS;r++){let v=b[18+r];if(v===1)score+=4;else if(v===2)score-=4;}
  for(let i=0;i<NUM_WIN;i++){
    let w=WINDOWS[i],p1=0,p2=0;
    for(let j=0;j<4;j++){let v=b[w[j]];if(v===1)p1++;else if(v===2)p2++;}
    if(p1>0&&p2>0)continue;
    if(p1===4)score+=100000;else if(p1===3)score+=100;else if(p1===2)score+=10;
    else if(p2===4)score-=100000;else if(p2===3)score-=120;else if(p2===2)score-=10;
  }
  return player===1?score:-score;
}

function ttKey(b,player){
  let h=(player*1000003)|0;
  for(let i=0;i<SIZE;i++)h=(Math.imul(h,33)+b[i]*7+i)|0;
  return h;
}

function negamax(b,player,depth,alpha,beta,moves,lastCol,lastRow){
  nodes++;
  if((nodes&8191)===0&&Date.now()>deadline){aborted=true;return 0;}
  if(lastCol>=0&&checkWin(b,lastCol,lastRow,3-player))return -100000-depth;
  if(moves>=42)return 0;
  let validCols=getValidCols(b);
  for(let col of validCols){
    let row=getDropRow(b,col);
    b[col*6+row]=player;
    let win=checkWin(b,col,row,player);
    b[col*6+row]=0;
    if(win)return 100000+depth;
  }
  let threats=[];
  for(let col of validCols){
    let row=getDropRow(b,col);
    b[col*6+row]=3-player;
    let win=checkWin(b,col,row,3-player);
    b[col*6+row]=0;
    if(win)threats.push(col);
  }
  if(threats.length>=2)return -100000-depth;
  if(threats.length===1)validCols=threats;
  if(depth<=0)return evaluate(b,player);
  let key=ttKey(b,player);
  let entry=tt.get(key);
  let ttBestCol=-1;
  if(entry){
    if(entry.depth>=depth){
      if(entry.flag===0)return entry.score;
      if(entry.flag===1&&entry.score<=alpha)return entry.score;
      if(entry.flag===2&&entry.score>=beta)return entry.score;
    }
    ttBestCol=entry.bestCol;
  }
  let orderedCols=ttBestCol>=0?[ttBestCol,...validCols.filter(c=>c!==ttBestCol)]:validCols;
  let bestScore=-Infinity, alphaOrig=alpha, bestCol=orderedCols[0];
  for(let col of orderedCols){
    let row=getDropRow(b,col);
    b[col*6+row]=player;
    let score=-negamax(b,3-player,depth-1,-beta,-alpha,moves+1,col,row);
    b[col*6+row]=0;
    if(aborted)return 0;
    if(score>bestScore){bestScore=score;bestCol=col;}
    if(bestScore>alpha)alpha=bestScore;
    if(alpha>=beta)break;
  }
  let flag=bestScore<=alphaOrig?2:(bestScore>=beta?1:0);
  if(tt.size>1000000)tt.clear();
  tt.set(key,{depth,score:bestScore,flag,bestCol});
  return bestScore;
}

function findBestMove(b,player,maxDepth,useTimeLimit,maxTime){
  nodes=0; aborted=false;
  deadline=useTimeLimit?Date.now()+maxTime:Infinity;
  let movesPlayed=countPieces(b);
  let validCols=getValidCols(b);
  for(let col of validCols){
    let row=getDropRow(b,col);
    b[col*6+row]=player;
    let win=checkWin(b,col,row,player);
    b[col*6+row]=0;
    if(win)return{col,score:100000,depth:0,nodes};
  }
  for(let col of validCols){
    let row=getDropRow(b,col);
    b[col*6+row]=3-player;
    let win=checkWin(b,col,row,3-player);
    b[col*6+row]=0;
    if(win)return{col,score:0,depth:0,nodes};
  }
  let bestCol=validCols[0], bestScore=-Infinity, bestDepth=0;
  if(useTimeLimit){
    let maxD=42-movesPlayed;
    for(let d=1;d<=maxD;d++){
      let iterBestCol=validCols[0], iterBestScore=-Infinity;
      let alpha=-Infinity, beta=Infinity;
      let orderedCols=[bestCol,...validCols.filter(c=>c!==bestCol)];
      for(let col of orderedCols){
        let row=getDropRow(b,col);
        b[col*6+row]=player;
        let score=-negamax(b,3-player,d-1,-beta,-alpha,movesPlayed+1,col,row);
        b[col*6+row]=0;
        if(aborted)break;
        if(score>iterBestScore){iterBestScore=score;iterBestCol=col;}
        if(iterBestScore>alpha)alpha=iterBestScore;
      }
      if(!aborted){
        bestCol=iterBestCol; bestScore=iterBestScore; bestDepth=d;
        if(bestScore>=100000||bestScore<=-100000)break;
      } else break;
    }
  } else {
    bestDepth=maxDepth;
    let alpha=-Infinity, beta=Infinity;
    for(let col of validCols){
      let row=getDropRow(b,col);
      b[col*6+row]=player;
      let score=-negamax(b,3-player,maxDepth-1,-beta,-alpha,movesPlayed+1,col,row);
      b[col*6+row]=0;
      if(score>bestScore){bestScore=score;bestCol=col;}
      if(bestScore>alpha)alpha=bestScore;
    }
  }
  return{col:bestCol,score:bestScore,depth:bestDepth,nodes};
}

function getMove(boardArr,player,difficulty,blunderRate){
  let b=new Int8Array(boardArr);
  let movesPlayed=countPieces(b);
  blunderRate=blunderRate||0;
  if(blunderRate>0&&Math.random()<blunderRate){
    let valid=getValidCols(b);
    if(valid.length>0)return{col:valid[Math.floor(Math.random()*valid.length)]};
  }
  if(movesPlayed<=1){let cr=getDropRow(b,3);if(cr>=0)return{col:3};}
  switch(difficulty){
    case 'easy':{
      let valid=getValidCols(b);
      if(Math.random()<0.25){
        for(let col of valid){
          let row=getDropRow(b,col);
          b[col*6+row]=player;
          if(checkWin(b,col,row,player)){b[col*6+row]=0;return{col};}
          b[col*6+row]=0;
        }
      }
      if(Math.random()<0.15){
        for(let col of valid){
          let row=getDropRow(b,col);
          b[col*6+row]=3-player;
          if(checkWin(b,col,row,3-player)){b[col*6+row]=0;return{col};}
          b[col*6+row]=0;
        }
      }
      let weights=valid.map(c=>c===3?4:(c===2||c===4)?3:(c===1||c===5)?2:1);
      let total=weights.reduce((a,w)=>a+w,0);
      let r=Math.random()*total;
      for(let i=0;i<valid.length;i++){r-=weights[i];if(r<=0)return{col:valid[i]};}
      return{col:valid[0]};
    }
    case 'medium': return findBestMove(b,player,3,false,0);
    case 'hard': return findBestMove(b,player,5,false,0);
    case 'insane': return findBestMove(b,player,7,false,0);
    case 'extreme': return findBestMove(b,player,0,true,2000);
    case 'possible':{
      if(Math.random()<0.01){
        let valid=getValidCols(b);
        for(let col of valid){
          let row=getDropRow(b,col);
          b[col*6+row]=3-player;
          if(checkWin(b,col,row,3-player)){b[col*6+row]=0;return{col};}
          b[col*6+row]=0;
        }
        let nonCenter=valid.filter(c=>c!==3);
        if(nonCenter.length>0)return{col:nonCenter[Math.floor(Math.random()*nonCenter.length)]};
        return{col:valid[0]};
      }
      return findBestMove(b,player,0,true,3000);
    }
    case 'impossible': return findBestMove(b,player,0,true,5000);
    default: return findBestMove(b,player,5,false,0);
  }
}

self.onmessage=function(e){
  if(e.data.type==='eval'){
    try{
      let b=new Int8Array(e.data.board);
      let result=findBestMove(b,e.data.player,0,true,e.data.maxTime||5000);
      self.postMessage({type:'eval',score:result.score,depth:result.depth,nodes:result.nodes,evalId:e.data.evalId});
    }catch(err){
      self.postMessage({type:'eval',error:err.message,evalId:e.data.evalId});
    }
    return;
  }
  let{board,player,difficulty,moveId,blunderRate}=e.data;
  try{
    let result=getMove(board,player,difficulty,blunderRate);
    result.moveId=moveId;
    self.postMessage(result);
  }catch(err){
    self.postMessage({error:err.message,moveId});
  }
};
})();
</script>

<script>
(function(){
const COLS=7, ROWS=6, SIZE=42;

const DIFF_INFO={
  easy:{name:'Easy',desc:'Plays mostly randomly with occasional awareness'},
  medium:{name:'Medium',desc:'Thinks 3 moves ahead'},
  hard:{name:'Hard',desc:'Thinks 5 moves ahead — strategic play'},
  insane:{name:'Insane',desc:'Thinks 7 moves ahead — very tough'},
  extreme:{name:'Extreme',desc:'Deep iterative search — extremely challenging'},
  possible:{name:'Possible',desc:'Nearly perfect — you have a ~1% chance to win'},
  impossible:{name:'Impossible',desc:'Deepest search — practically unbeatable'}
};

let gameBoard=new Int8Array(SIZE);
let currentPlayer=1;
let gameOver=false;
let isThinking=false;
let currentDifficulty='medium';
let gameMode='ai';
let onlineSocket=null;
let onlineConnected=false;
let onlineState='idle';
let onlineColor=1;
let rematchRequested=false;
let rematchSent=false;
let accountUsername='';
let accountIsAdmin=false;
let accountRole='none';
let accountElo=1000;
let accountStats={wins:0,losses:0,draws:0};
let accountLevel=1;
let accountXp=0;
let accountXpMax=3000;
let accountItems={};
let accountBeatenImpossible=false;
let accountTags=[];
let signedIn=false;
let prevAccountLevel=1;

function getBlunderRate(diff){
  if(accountItems.diamond){
    if(diff==='impossible')return 1.0;
    return 0.8;
  }
  if(accountItems.golden && diff!=='impossible')return 0.5;
  return 0;
}

const SHOP_ITEMS=[
  {key:'vip',label:'VIP',price:30000,desc:'10x elo multiplier · +100 elo per bot win · VIP chat tag'},
  {key:'elo2',label:'2x Elo',price:15500,desc:'2x elo multiplier (stacks with all items)'},
  {key:'golden',label:'Golden',price:67200,desc:'25x elo · +300 elo per bot win · 50% bot blunder (except Impossible) · Golden chat tag'},
  {key:'diamond',label:'Diamond',price:150000,desc:'75x elo · +20,000 elo per bot win · 10x XP · 125% bot blunder (incl. Impossible) · Diamond chat tag'},
  {key:'triplexp',label:'Triple XP',price:29050,desc:'3x XP multiplier to level up faster'}
];
let authMode='login';
let actorLevel=0;
let banActive=false;
try{
  accountUsername=localStorage.getItem('c4_acct_user')||'';
}catch(e){}
let onlinePlayerId='';
try{onlinePlayerId=localStorage.getItem('c4_player_id')||'';}catch(e){}
if(!onlinePlayerId){
  onlinePlayerId='p_'+Math.random().toString(36).substr(2,12)+Date.now().toString(36);
  try{localStorage.setItem('c4_player_id',onlinePlayerId);}catch(e){}
}
let scores={red:0,yellow:0,draws:0};
let moveId=0;
let aiWorker=null;
let evalWorker=null;
let evalBusy=false;
let evalPendingPlayer=1;
let evalBoardKey='';
let evalId=0;
let selectedCol=3;

function getDropRow(board,col){
  for(let r=0;r<ROWS;r++)if(!board[col*6+r])return r;
  return -1;
}

function checkWin(board,col,row,player){
  const dirs=[[1,0],[0,1],[1,1],[1,-1]];
  for(let [dc,dr] of dirs){
    let count=1;
    for(let i=1;i<4;i++){
      let c=col+dc*i, r=row+dr*i;
      if(c<0||c>=7||r<0||r>=6)break;
      if(board[c*6+r]!==player)break;
      count++;
    }
    for(let i=1;i<4;i++){
      let c=col-dc*i, r=row-dr*i;
      if(c<0||c>=7||r<0||r>=6)break;
      if(board[c*6+r]!==player)break;
      count++;
    }
    if(count>=4)return true;
  }
  return false;
}

function findWinCells(board,player){
  const dirs=[[1,0],[0,1],[1,1],[1,-1]];
  for(let c=0;c<7;c++){
    for(let r=0;r<6;r++){
      if(board[c*6+r]!==player)continue;
      for(let [dc,dr] of dirs){
        let cells=[[c,r]];
        for(let i=1;i<4;i++){
          let nc=c+dc*i, nr=r+dr*i;
          if(nc<0||nc>=7||nr<0||nr>=6)break;
          if(board[nc*6+nr]!==player)break;
          cells.push([nc,nr]);
        }
        if(cells.length>=4)return cells;
      }
    }
  }
  return null;
}

const EVAL_WINDOWS=[];
for(let r=0;r<ROWS;r++)for(let c=0;c<=COLS-4;c++)EVAL_WINDOWS.push([c*6+r,(c+1)*6+r,(c+2)*6+r,(c+3)*6+r]);
for(let c=0;c<COLS;c++)for(let r=0;r<=ROWS-4;r++)EVAL_WINDOWS.push([c*6+r,c*6+r+1,c*6+r+2,c*6+r+3]);
for(let r=0;r<=ROWS-4;r++)for(let c=0;c<=COLS-4;c++)EVAL_WINDOWS.push([c*6+r,(c+1)*6+r+1,(c+2)*6+r+2,(c+3)*6+r+3]);
for(let r=3;r<ROWS;r++)for(let c=0;c<=COLS-4;c++)EVAL_WINDOWS.push([c*6+r,(c+1)*6+r-1,(c+2)*6+r-2,(c+3)*6+r-3]);

function evaluatePosition(board){
  let score=0;
  for(let r=0;r<ROWS;r++){let v=board[18+r];if(v===1)score+=4;else if(v===2)score-=4;}
  for(let w of EVAL_WINDOWS){
    let p1=0,p2=0;
    for(let i=0;i<4;i++){let v=board[w[i]];if(v===1)p1++;else if(v===2)p2++;}
    if(p1>0&&p2>0)continue;
    if(p1===4)score+=100000;else if(p1===3)score+=100;else if(p1===2)score+=10;
    else if(p2===4)score-=100000;else if(p2===3)score-=120;else if(p2===2)score-=10;
  }
  return score;
}

function updateEvalBar(){
  const fillEl=document.getElementById('evalFill');
  if(!fillEl)return;
  let staticScore=evaluatePosition(gameBoard);
  displayEvalScore(staticScore);
  requestDeepEval();
}

function boardKeyFn(board){
  let s='';
  for(let i=0;i<SIZE;i++)s+=board[i];
  return s;
}

function requestDeepEval(){
  if(!evalWorker||evalBusy||gameOver)return;
  let key=boardKeyFn(gameBoard);
  if(key===evalBoardKey)return;
  evalBusy=true;
  evalPendingPlayer=currentPlayer;
  evalBoardKey=key;
  evalWorker.postMessage({type:'eval',board:Array.from(gameBoard),player:currentPlayer,maxTime:5000,evalId:++evalId});
}

function displayEvalScore(score){
  const fillEl=document.getElementById('evalFill');
  const labelEl=document.getElementById('evalLabel');
  if(!fillEl)return;
  let pct;
  if(score>=100000)pct=100;
  else if(score<=-100000)pct=0;
  else pct=50+50*score/(Math.abs(score)+200);
  fillEl.style.width=pct+'%';
  let display;
  if(score>=100000)display='W';
  else if(score<=-100000)display='L';
  else display=(score>0?'+':'')+score;
  labelEl.textContent=display;
  if(score>=0){labelEl.style.left='0';labelEl.style.right='auto';labelEl.style.color='#fff';}
  else{labelEl.style.right='0';labelEl.style.left='auto';labelEl.style.color='#1a1a1a';}
}

function handleEvalResult(data){
  evalBusy=false;
  if(data.error)return;
  let currentKey=boardKeyFn(gameBoard);
  if(currentKey===evalBoardKey){
    let score=data.score;
    if(evalPendingPlayer===2)score=-score;
    displayEvalScore(score);
  }else{
    requestDeepEval();
  }
}

function updateBoardTurn(){
  document.getElementById('board').classList.toggle('yellow-turn',currentPlayer===2);
}

function isBoardFull(board){
  for(let i=0;i<SIZE;i++)if(!board[i])return false;
  return true;
}

function buildBoard(){
  const board=document.getElementById('board');
  board.innerHTML='';
  for(let c=0;c<7;c++){
    const col=document.createElement('div');
    col.className='column';
    col.dataset.col=c;
    for(let r=5;r>=0;r--){
      const cell=document.createElement('div');
      cell.className='cell';
      cell.dataset.col=c;
      cell.dataset.row=r;
      col.appendChild(cell);
    }
    col.addEventListener('click',()=>handleColumnClick(c));
    col.addEventListener('mouseenter',()=>handleColumnHover(c));
    col.addEventListener('mouseleave',()=>handleColumnLeave());
    board.appendChild(col);
  }
}

function placePiece(col,row,player){
  const cell=document.querySelector('.cell[data-col="'+col+'"][data-row="'+row+'"]');
  const piece=document.createElement('div');
  piece.className='piece '+(player===1?'red':'yellow');
  piece.style.animationDuration=(0.35+(5-row)*0.04)+'s';
  cell.appendChild(piece);
  gameBoard[col*6+row]=player;
}

function handleColumnClick(col){
  if(gameOver||isThinking)return;
  if(gameMode==='ai'&&currentPlayer!==1)return;
  if(gameMode==='online'){
    if(currentPlayer!==onlineColor)return;
    if(!onlineSocket||onlineSocket.readyState!==1)return;
    onlineSocket.send(JSON.stringify({type:'move',col:col}));
    document.getElementById('board').classList.add('disabled');
    return;
  }
  let row=getDropRow(gameBoard,col);
  if(row<0)return;
  let player=currentPlayer;
  placePiece(col,row,player);
  hideHoverPiece();
  updateEvalBar();
  if(checkWin(gameBoard,col,row,player)){setTimeout(()=>endGame(player),600);return;}
  if(isBoardFull(gameBoard)){setTimeout(()=>endGame(0),600);return;}
  if(gameMode==='2p'){
    currentPlayer=3-currentPlayer;
    updateBoardTurn();
    updateStatus();
  }else{
    currentPlayer=2;
    updateStatus();
    document.getElementById('board').classList.add('disabled');
    setTimeout(()=>requestBotMove(),600);
  }
}

function handleColumnHover(col){
  if(gameOver||isThinking)return;
  if(gameMode==='ai'&&currentPlayer!==1)return;
  if(gameMode==='online'&&currentPlayer!==onlineColor)return;
  if(getDropRow(gameBoard,col)<0)return;
  document.querySelectorAll('.column').forEach(c=>c.classList.remove('selected'));
  document.querySelector('.column[data-col="'+col+'"]').classList.add('selected');
  selectedCol=col;
}

function handleColumnLeave(){
  document.querySelectorAll('.column.selected').forEach(c=>c.classList.remove('selected'));
}

function hideHoverPiece(){
  document.querySelectorAll('.column.selected').forEach(c=>c.classList.remove('selected'));
}

function requestBotMove(){
  if(gameOver)return;
  isThinking=true;
  updateStatus();
  moveId++;
  if(aiWorker){
    aiWorker.postMessage({
      board:Array.from(gameBoard),
      player:2,
      difficulty:currentDifficulty,
      moveId:moveId,
      blunderRate:getBlunderRate(currentDifficulty)
    });
  } else {
    setTimeout(()=>{
      let valid=[];
      for(let c=0;c<7;c++)if(getDropRow(gameBoard,c)>=0)valid.push(c);
      handleBotMove({col:valid[Math.floor(Math.random()*valid.length)],moveId:moveId,depth:0,nodes:0});
    },500);
  }
}

function handleBotMove(data){
  if(data.moveId!==moveId||gameOver){
    isThinking=false;
    updateStatus();
    return;
  }
  if(data.error){
    console.error('AI error:',data.error);
    isThinking=false;
    let valid=[];
    for(let c=0;c<7;c++)if(getDropRow(gameBoard,c)>=0)valid.push(c);
    if(valid.length===0)return;
    data.col=valid[Math.floor(Math.random()*valid.length)];
  }
  isThinking=false;
  let col=data.col;
  if(col===undefined||col===null||col<0||col>6){
    let valid=[];
    for(let c=0;c<7;c++)if(getDropRow(gameBoard,c)>=0)valid.push(c);
    if(valid.length===0)return;
    col=valid[Math.floor(Math.random()*valid.length)];
  }
  let row=getDropRow(gameBoard,col);
  if(row<0)return;
  placePiece(col,row,2);
  updateEvalBar();
  if(data.depth){
    document.getElementById('searchInfo').textContent='Depth '+data.depth+' · '+data.nodes.toLocaleString()+' nodes';
  }
  if(checkWin(gameBoard,col,row,2)){setTimeout(()=>endGame(2),600);return;}
  if(isBoardFull(gameBoard)){setTimeout(()=>endGame(0),600);return;}
  currentPlayer=1;
  updateBoardTurn();
  updateStatus();
  document.getElementById('board').classList.remove('disabled');
}

function endGame(winner){
  gameOver=true;
  isThinking=false;
  document.getElementById('board').classList.add('disabled');
  hideHoverPiece();
  updateEvalBar();
  if(winner>0){
    let cells=findWinCells(gameBoard,winner);
    if(cells){
      for(let [c,r] of cells){
        let cell=document.querySelector('.cell[data-col="'+c+'"][data-row="'+r+'"]');
        let piece=cell.querySelector('.piece');
        if(piece)piece.classList.add('winning');
      }
    }
  }
  if(winner===1)scores.red++;
  else if(winner===2)scores.yellow++;
  else scores.draws++;
  saveScores();
  updateScoreboard();
  updateStatus();
  reportGameResult(winner);
  setTimeout(()=>showOverlay(winner),1200);
}

function showOverlay(winner){
  const overlay=document.getElementById('overlay');
  const title=document.getElementById('overlayTitle');
  const msg=document.getElementById('overlayMsg');
  const icon=document.getElementById('overlayIcon');
  const btn=document.getElementById('overlayBtn');
  const btn2=document.getElementById('overlayBtn2');
  if(gameMode==='online'){
    btn2.hidden=false;
    btn.textContent='Request Rematch';
    rematchRequested=false;
    rematchSent=false;
    if(winner===onlineColor){
      icon.textContent='\u{1F389}';
      title.textContent='You Win!';
      title.className='win';
      msg.textContent='You beat your opponent!';
    }else if(winner===0||winner===-1){
      icon.textContent='\u{1F91D}';
      title.textContent='Draw!';
      title.className='draw-text';
      msg.textContent='A hard-fought draw!';
    }else{
      icon.textContent='\u{1F614}';
      title.textContent='Opponent Wins';
      title.className='loss';
      msg.textContent='Better luck next time!';
    }
    overlay.classList.add('show');
    return;
  }
  btn2.hidden=true;
  btn.textContent='Play Again';
  if(gameMode==='2p'){
    if(winner===1){
      icon.textContent='\u{1F389}';
      title.textContent='Player 1 Wins!';
      title.className='win';
      msg.textContent='Red takes the victory!';
    }else if(winner===2){
      icon.textContent='\u{1F389}';
      title.textContent='Player 2 Wins!';
      title.className='loss';
      msg.textContent='Yellow takes the victory!';
    }else{
      icon.textContent='\u{1F91D}';
      title.textContent='Draw!';
      title.className='draw-text';
      msg.textContent='A hard-fought draw!';
    }
    overlay.classList.add('show');
    return;
  }
  const diffName=DIFF_INFO[currentDifficulty].name;
  if(winner===1){
    icon.textContent='\u{1F389}';
    title.textContent='You Win!';
    title.className='win';
    msg.textContent='You beat the '+diffName+' bot!';
  } else if(winner===2){
    icon.textContent='\u{1F614}';
    title.textContent='Bot Wins';
    title.className='loss';
    msg.textContent='The '+diffName+' bot wins. Try again?';
  } else {
    icon.textContent='\u{1F91D}';
    title.textContent='Draw!';
    title.className='draw-text';
    msg.textContent='A draw against the '+diffName+' bot.';
  }
  overlay.classList.add('show');
}

function newGame(){
  gameBoard=new Int8Array(SIZE);
  currentPlayer=1;
  gameOver=false;
  isThinking=false;
  moveId++;
  document.querySelectorAll('.cell').forEach(cell=>cell.innerHTML='');
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('searchInfo').textContent='';
  updateBoardTurn();
  updateEvalBar();
  updateStatus();
  if(signedIn)document.getElementById('board').classList.remove('disabled');
  else document.getElementById('board').classList.add('disabled');
}

function setDifficulty(diff){
  currentDifficulty=diff;
  document.querySelectorAll('.diffBtn').forEach(btn=>{
    btn.classList.toggle('active',btn.dataset.diff===diff);
  });
  document.getElementById('diffDesc').textContent=DIFF_INFO[diff].desc;
  newGame();
}

function setMode(mode){
  gameMode=mode;
  document.querySelectorAll('.modeBtn').forEach(btn=>{
    btn.classList.toggle('active',btn.dataset.mode===mode);
  });
  let isAI=mode==='ai';
  let isOnline=mode==='online';
  document.getElementById('difficultyBar').style.display=isAI?'':'none';
  document.getElementById('diffDesc').style.display=isAI?'':'none';
  document.getElementById('onlineLobby').hidden=!isOnline;
  document.getElementById('newGameBtn').hidden=isOnline;
  document.getElementById('endMatchBtn').hidden=true;
  if(isOnline){
    if(!accountUsername){
      showAuthOverlay('login');
    }
    document.querySelector('.scoreCard.red .label').textContent='Red';
    document.querySelector('.scoreCard.yellow .label').textContent='Yellow';
    if(!onlineSocket){
      connectOnline();
    }else if(onlineConnected){
      onlineSocket.send(JSON.stringify({type:'hello',playerId:onlinePlayerId}));
    }
    enterOnlineLobby();
  }else{
    document.querySelector('.scoreCard.red .label').textContent=mode==='ai'?'You':'Player 1';
    document.querySelector('.scoreCard.yellow .label').textContent=mode==='ai'?'Bot':'Player 2';
  }
  newGame();
}

function updateStatus(){
  const status=document.getElementById('statusBar');
  if(gameOver){status.innerHTML='';return;}
  if(gameMode==='online'){
    if(currentPlayer===onlineColor){
      status.innerHTML='<span class="dot '+(onlineColor===1?'red-dot':'yellow-dot')+'"></span> Your turn';
    }else{
      status.innerHTML='<span class="dot '+(onlineColor===1?'yellow-dot':'red-dot')+'"></span> Opponent\'s turn <span class="spinner"></span>';
    }
    return;
  }
  if(gameMode==='2p'){
    const cls=currentPlayer===1?'red-dot':'yellow-dot';
    const name=currentPlayer===1?'Player 1':'Player 2';
    status.innerHTML='<span class="dot '+cls+'"></span> '+name+"'s turn";
    return;
  }
  if(currentPlayer===1){
    status.innerHTML='<span class="dot red-dot"></span> Your turn';
  } else if(isThinking){
    status.innerHTML='<span class="dot yellow-dot"></span> Bot is thinking <span class="spinner"></span>';
  } else {
    status.innerHTML='<span class="dot yellow-dot"></span> Bot\'s turn';
  }
}

function updateScoreboard(){
  document.getElementById('redScore').textContent=scores.red;
  document.getElementById('drawScore').textContent=scores.draws;
  document.getElementById('yellowScore').textContent=scores.yellow;
}

function saveScores(){
  try{localStorage.setItem('c4_scores_v2',JSON.stringify(scores));}catch(e){}
}

function loadScores(){
  try{
    let saved=localStorage.getItem('c4_scores_v2');
    if(saved)scores=JSON.parse(saved);
  }catch(e){}
}

function setupWorker(){
  try{
    const workerSrc=document.getElementById('aiWorker').textContent;
    const blob=new Blob([workerSrc],{type:'application/javascript'});
    aiWorker=new Worker(URL.createObjectURL(blob));
    aiWorker.onmessage=(e)=>handleBotMove(e.data);
    aiWorker.onerror=(e)=>{
      console.error('Worker error:',e);
      aiWorker=null;
    };
  }catch(e){
    console.error('Worker setup failed:',e);
    aiWorker=null;
  }
}

function setupEvalWorker(){
  try{
    const workerSrc=document.getElementById('aiWorker').textContent;
    const blob=new Blob([workerSrc],{type:'application/javascript'});
    evalWorker=new Worker(URL.createObjectURL(blob));
    evalWorker.onmessage=(e)=>{
      if(e.data&&e.data.type==='eval')handleEvalResult(e.data);
    };
    evalWorker.onerror=(e)=>{
      console.error('Eval worker error:',e);
      evalWorker=null;
    };
  }catch(e){
    console.error('Eval worker setup failed:',e);
    evalWorker=null;
  }
}

function ensureServerConnection(){
  if(!onlineSocket&&gameMode!=='online'){
    connectOnline();
  }
}

function handleAuthResult(msg){
  const errEl=document.getElementById('authError');
  if(msg.banned){
    showBanScreen({permanent:msg.permanent,until:msg.until||0});
    document.getElementById('authOverlay').classList.remove('show');
    return;
  }
  if(msg.success){
    accountUsername=msg.username;
    signedIn=true;
    accountIsAdmin=msg.isAdmin;
    accountRole=msg.role||'none';
    accountElo=msg.elo||1000;
    accountStats=msg.stats||{wins:0,losses:0,draws:0};
    accountLevel=msg.level||1;
    accountXp=msg.xp||0;
    accountXpMax=msg.xpMax||3000;
    accountItems=msg.items||{};
    accountBeatenImpossible=!!msg.beatenImpossible;
    accountTags=msg.tags||[];
    prevAccountLevel=accountLevel;
    try{
      localStorage.setItem('c4_acct_user',accountUsername);
      if(msg.tokenLogin){
        let savedToken='';
        try{savedToken=localStorage.getItem('c4_owner_token')||'';}catch(e){}
        if(!savedToken){
          let t=new URLSearchParams(location.search).get('owner')||'';
          if(t){try{localStorage.setItem('c4_owner_token',t);}catch(e){}}
        }
        try{localStorage.removeItem('c4_acct_pass');}catch(e){}
      }else{
        let passInput=document.getElementById('authPassInput');
        if(passInput.value)localStorage.setItem('c4_acct_pass',passInput.value);
      }
    }catch(e){}
    clearBanScreen();
    updateAccountDisplay();
    document.getElementById('authOverlay').classList.remove('show');
    document.getElementById('authPassInput').value='';
    if(gameMode!=='online')newGame();
  }else{
    errEl.textContent=msg.error||'Authentication failed';
    try{localStorage.removeItem('c4_acct_pass');}catch(e){}
    document.getElementById('authOverlay').classList.add('show');
  }
}

function updateAccountDisplay(){
  const infoEl=document.getElementById('accountInfo');
  const authEl=document.getElementById('accountAuth');
  if(signedIn&&accountUsername){
    infoEl.hidden=false;
    authEl.hidden=true;
    document.getElementById('acctNameEl').textContent=accountUsername;
    document.getElementById('acctStatsEl').textContent='W:'+fmtNum(accountStats.wins)+' L:'+fmtNum(accountStats.losses)+' D:'+fmtNum(accountStats.draws)+' ELO:'+fmtNum(accountElo)+' Lv'+fmtNum(accountLevel);
    const roleBadge=document.getElementById('acctRoleBadge');
    roleBadge.textContent=accountRole==='none'?'':accountRole;
    roleBadge.className='';
    if(accountRole!=='none')roleBadge.classList.add('adminRoleBadge',accountRole);
    roleBadge.hidden=accountRole==='none';
    const hasPanel=roleLevelClient(accountRole)>=1;
    const panelBtn=document.getElementById('adminPanelBtn');
    panelBtn.hidden=!hasPanel;
    if(accountRole==='owner')panelBtn.textContent='Owner Panel';
    else if(accountRole==='admin')panelBtn.textContent='Admin Panel';

  }else{

    authEl.hidden=false;

}

function roleLevelClient(role){ if(role==='owner')return 3; if(role==='admin')return 2; if(role==='moderator')return 1; return 0; }

function fmtNum(n){
  n=Math.round(n||0);
  if(n>=950000){let v=n/1000000;return(v>=10?Math.round(v):v.toFixed(1).replace(/\.0$/,''))+'M';}
  if(n>=1000){let v=n/1000;return(v>=10?Math.round(v):v.toFixed(1).replace(/\.0$/,''))+'k';}
  return String(n);
}

  for(let t of tags){ tagHtml+='<span class="chatTag '+t+'">'+escapeHtml(chatTagLabel(t))+'</span>'; }

      }

      if(a.mutePermanent){statusText='Perm Muted';statusColor='#eab308';}
      else{
        let remaining=Math.max(0,a.muteUntil-Date.now());
        let mins=Math.floor(remaining/60000);

      '<span class="adminUserStats">W:'+a.wins+' L:'+a.losses+' D:'+a.draws+' ELO:'+(a.elo||1000)+'</span>'+
      '<span class="adminUserStatus" style="color:'+statusColor+'">'+statusText+'</span>';
    const targetLevel=roleLevelClient(a.role||'none');
    const canTouch=targetLevel<myLevel;
    if(canTouch){

      actions.style.gap='3px';

          actions.appendChild(sel);

        }
      }
      if(myLevel>=1){
        if(a.muted){
          actions.appendChild(makeActBtn('Unmute','unmute',()=>sendAdmin('adminUnmute',{username:a.username})));
        }else{
          const msel=document.createElement('select');
          msel.innerHTML='<option value="600">10m</option><option value="3600">1h</option><option value="86400">1d</option><option value="0">Perm</option>';
          msel.style.cssText='padding:3px 5px;border-radius:5px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.08);color:#fff;font-size:0.8em;';
          actions.appendChild(msel);

function runAdminCommand(input){
  let parts=input.trim().split(/\s+/);
  if(parts.length<2)return;
  let cmd=parts[0].toLowerCase();
  let user=parts.slice(1).join(' ');
  let name=user.replace(/^@/,'');
  switch(cmd){
    case '/bban': sendAdmin('adminBan',{username:name,duration:0}); break;
    case '/kick': sendAdmin('adminKick',{username:name}); break;
    case '/reset': sendAdmin('adminReset',{username:name}); break;
    case '/mod': sendAdmin('adminSetRole',{username:name,role:'moderator'}); break;
    case '/unmod': sendAdmin('adminSetRole',{username:name,role:'none'}); break;
    case '/admin': sendAdmin('adminSetRole',{username:name,role:'admin'}); break;
    case '/unadmin': sendAdmin('adminSetRole',{username:name,role:'none'}); break;
    case '/mute': sendAdmin('adminMute',{username:name,duration:3600}); break;
    case '/unmute': sendAdmin('adminUnmute',{username:name}); break;
    default: alert('Unknown command: '+cmd);
  }
}

function escapeHtml(str){
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

  else if(gameMode==='ai')result=winner===1?'win':'loss';

function connectOnline(){
  if(onlineSocket){
    try{onlineSocket.close();}catch(e){}
    onlineSocket=null;
  }
  onlineConnected=false;
  updateConnIndicator('connecting','Connecting to server...');
  try{
    onlineSocket=root.createServerSocket();
  }catch(e){
    onlineSocket=null;
    updateConnIndicator('disconnected','Failed to connect');
    if(gameMode==='online')setTimeout(connectOnline,3000);
    return;
  }
  onlineSocket.addEventListener('open',()=>{
    onlineSocket.send(JSON.stringify({type:'hello',playerId:onlinePlayerId}));
    if(accountUsername){
      let savedToken='';
      try{savedToken=localStorage.getItem('c4_owner_token')||'';}catch(e){}
      if(savedToken){
        onlineSocket.send(JSON.stringify({type:'tokenLogin',token:savedToken}));
      }else{
        let savedPass='';
        try{savedPass=localStorage.getItem('c4_acct_pass')||'';}catch(e){}
        if(savedPass){
          onlineSocket.send(JSON.stringify({type:'login',username:accountUsername,password:savedPass}));
        }
      }
    }
  });
  onlineSocket.addEventListener('message',(e)=>{
    let msg;
    try{msg=JSON.parse(e.data);}catch(err){return;}
    handleOnlineMessage(msg);
  });
  onlineSocket.addEventListener('close',(e)=>{
    onlineConnected=false;
    onlineSocket=null;
    if(banActive){
      updateConnIndicator('disconnected','Banned');
      return;
    }
    if(gameMode!=='online'){
      updateConnIndicator('disconnected','Disconnected');
      return;
    }
    if(onlineState==='playing'){
      onlineState='reconnecting';
      updateConnIndicator('connecting','Connection lost — reconnecting...');
      document.getElementById('board').classList.add('disabled');
      document.getElementById('statusBar').innerHTML='<span class="spinner"></span> Reconnecting...';
      document.getElementById('overlay').classList.remove('show');
    }else{
      updateConnIndicator('connecting','Reconnecting...');
    }
    setTimeout(()=>{if(gameMode==='online')connectOnline();},2000+Math.random()*2000);
  });
}
