<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0a0a12; color: #e0e0e0; font-family: 'Segoe UI', system-ui, sans-serif; text-align: left; min-height: 100vh; }
  #creationScreen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 20px; padding: 20px; }

  .card { background: #1a1a2e; border: 1px solid #2a2a4e; border-radius: 12px; padding: 16px; margin-bottom: 12px; transition: border-color .2s; }
  .card:hover { border-color: #6c63ff55; }

  .empty-state { text-align: center; padding: 40px 20px; color: #555; }

  #modal { position: fixed; inset: 0; background: #000a; display: flex; align-items: center; justify-content: center; z-index: 200; padding: 20px; }
  #modalContent { background: #1a1a2e; border: 1px solid #333; border-radius: 14px; padding: 24px; max-width: 700px; width: 100%; max-height: 85vh; overflow-y: auto; }
  .modal-close { float: right; cursor: pointer; font-size: 1.3em; color: #888; }
  .modal-close:hover { color: #fff; }
  .modal-title { font-size: 1.5em; font-weight: bold; margin-bottom: 8px; }

  #notifications { position: fixed; bottom: 20px; right: 20px; z-index: 300; display: flex; flex-direction: column; gap: 8px; }
  .notif { background: #1a1a3e; border-left: 4px solid #6c63ff; padding: 12px 16px; border-radius: 8px; color: #ddd; font-size: 0.9em; max-width: 320px; animation: slideIn .3s; box-shadow: 0 4px 20px #0008; }
  .notif.success { border-left-color: #2ecc71; }
  .notif.warn { border-left-color: #f39c12; }
  .notif.error { border-left-color: #e74c3c; }
  @keyframes slideIn { from { transform: translateX(400px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

  .loading-spinner { display: inline-block; width: 18px; height: 18px; border: 3px solid #333; border-top-color: #6c63ff; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .pitch-loading { text-align: center; padding: 30px; color: #888; }
  .pitch-loading .loading-spinner { width: 32px; height: 32px; border-width: 4px; }

  .create-form { display: flex; flex-direction: column; gap: 12px; max-width: 600px; }
  .form-group { display: flex; flex-direction: column; gap: 4px; }
  .form-group label { font-size: 0.85em; color: #888; }
  .form-group input, .form-group textarea, .form-group select { background: #12121f; border: 1px solid #2a2a4e; color: #fff; padding: 8px 12px; border-radius: 8px; font-size: 0.95em; outline: none; font-family: inherit; }
  .form-group input:focus, .form-group textarea:focus { border-color: #6c63ff; }
  .form-group textarea { min-height: 80px; resize: vertical; }

  .toggle { display: flex; align-items: center; gap: 8px; }
  .toggle input { width: 20px; height: 20px; accent-color: #6c63ff; }

  .upgrade-card { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #12121f; border-radius: 8px; margin-bottom: 8px; }
  .upgrade-info h4 { font-size: 0.95em; }
  .upgrade-info p { font-size: 0.8em; color: #888; }

  .script-box { background: #0a0a12; border: 1px solid #2a2a4e; border-radius: 8px; padding: 16px; white-space: pre-wrap; font-family: 'Courier New', monospace; font-size: 0.85em; line-height: 1.6; color: #ccc; max-height: 400px; overflow-y: auto; }

  .reaction-box { background: #12121f; border-left: 4px solid #6c63ff; border-radius: 8px; padding: 14px; margin-top: 8px; font-style: italic; color: #bbb; line-height: 1.5; }

  .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin: 12px 0; }
  .stat-box { background: #12121f; border-radius: 8px; padding: 12px; text-align: center; }
  .stat-box .num { font-size: 1.4em; font-weight: bold; }
  .stat-box .lbl { font-size: 0.75em; color: #888; text-transform: uppercase; }

  .episode-progress-text { font-size: 0.8em; color: #888; margin-top: 4px; }
  .production-log { font-size: 0.78em; color: #667; margin-top: 6px; max-height: 60px; overflow-y: auto; }
  .production-log div { margin-bottom: 2px; }

  @media (max-width: 600px) {
    #topBar { gap: 10px; padding: 8px 12px; }

    .tab-content { padding: 12px; }
    .show-grid { grid-template-columns: 1fr; }
  }
</style>

<div id="creationScreen">
  <h1>🎬 Animation Studio Tycoon</h1>
  <p>Build your animation empire. Accept show pitches from AI creators, produce episodes, release teasers, grow your audience, and decide which shows thrive or get canceled.</p>
  <input class="studio-input" id="studioNameInput" placeholder="Enter your studio name..." value="" maxlength="30">
  <label class="checkbox-row"><input type="checkbox" id="sandboxCheck"> Sandbox Mode — unlimited money, do anything</label>
  <button class="btn" id="startBtn" style="font-size:1.1em; padding:12px 32px;">Start Your Studio</button>
</div>

<div id="gameScreen" hidden>
  <div id="topBar">
    <div class="stat-chip"><span class="stat-label">Studio</span><span class="stat-value" id="studioNameDisplay" style="color:#6c63ff"></span></div>
    <div class="stat-chip"><span class="stat-label">Money</span><span class="stat-value stat-money" id="moneyDisplay">$0</span></div>
    <div class="stat-chip"><span class="stat-label">Fans</span><span class="stat-value stat-fans" id="fansDisplay">0</span></div>
    <div class="stat-chip"><span class="stat-label">Reputation</span><span class="stat-value stat-rep" id="repDisplay">0</span></div>

    <div class="spacer"></div>

      <button class="btn btn-sm btn-gray" id="pauseBtn">⏸ Pause</button>

  <div id="modalContent"></div>

<script type="module">
// ============ CONFIG ============
const CONFIG = {
  startingMoney: 150000,
  episodeProductionDays: 3,
  teaserCost: 1000,
  merchCost: 10000,
  upgradeBaseCost: 20000,
  baseViewsPerEp: 2000,
  revenuePerView: 0.12,
  fanGrowthRate: 0.006,
  epProductionCost: 3000,
  tickSpeeds: [0, 3000, 1500, 500],
};

// ============ VARIETY DATA ============
const GENRES = ["surreal comedy","action-adventure","hard sci-fi","high fantasy","slice-of-life","noir mystery","horror-comedy","musical drama","superhero deconstruction","post-apocalyptic","absurdist","coming-of-age drama","political thriller","workplace sitcom","magical girl","mecha","sports underdog","cozy fantasy","cyberpunk","dark comedy","educational adventure","supernatural mystery","romantic comedy","space western","steampunk adventure","urban fantasy","psychological thriller","improv comedy","mockumentary","fairy tale retelling"];
const TONES = ["heartwarming","bitingly satirical","absurd and chaotic","dark but hopeful","wholesome","melancholic and poetic","manic and hyperactive","dry and deadpan","surreal and dreamlike","gritty and intense","whimsical","nihilistic but funny","earnest and sincere","campy and theatrical","anxious and neurotic","chill and contemplative"];
const SETTINGS = ["a magical floating city","a mundane suburban neighborhood","a deep space station orbiting a dying star","a post-apocalyptic wasteland overtaken by plants","an underwater civilization of fish-people","a world inside a computer simulation","a Victorian-era steampunk metropolis","a sprawling modern megacity","a tiny isolated village in the mountains","a dimension where emotions are physical beings","a school for supernatural kids","a world where music literally is magic","a harsh desert planet with hidden oases","a giant shopping mall that's also a city-state","an archipelago of floating sky islands","a haunted Victorian hotel that never lets guests leave","a time-traveling steam train that picks up lost souls","a world where everyone is born with a monster companion","a city built on the back of a colossal sleeping creature","a dimension of living dreams and nightmares","a kingdom of sentient food beings","an office building that extends upward into infinity","a portal town between all dimensions","a world where shadows have their own secret society","a planet where gravity randomly shifts direction","a realm of sentient robots after humanity vanished","a tropical island chain guarded by ancient sea gods"," a library that contains every book ever unwritten","a carnival that travels between dimensions","a world where people age backwards on weekends"];
const TWISTS = ["but everyone is secretly a robot and doesn't know it","but time loops every single Tuesday","but the main character can hear the narrator","but emotions manifest as actual weather","but the world is slowly forgetting how to speak","but every lie told becomes physically real","but the moon is actually an egg about to hatch","but memories can be traded as currency","but the entire world is a reality TV show","but everyone shares one collective dream each night","but colors are sounds and sounds are colors","but the dead can be called back for exactly 60 seconds","but all technology runs on puns","but the ground is alive and has strong opinions","but luck is a tangible resource you can mine from the earth","but the main character is the only one who knows it's fiction","but shadows can detach and live their own lives","but the world resets if anyone says a specific forgotten word","but every door leads somewhere different each time you open it","but people's reflections show who they truly are inside","but the stars are actually eyes watching everyone","but music is forbidden and exists only in the underground","but everyone has a limited number of words left to speak","but the ocean is made of memories","but gravity is determined by how honest you are"];
const AUDIENCES = ["kids 6-11","teens 13-17","young adults 18-35","all ages","adults 18+","families"];
const PRODUCTION_PHASES = ["Storyboarding","Voice recording","Rough animation","Color design","Background painting","Compositing","Sound design","Final edit","Music scoring"];

// ============ GAME STATE ============
let game = null;
let gameInterval = null;
let currentTab = 'pitches';
let pendingPitchCount = 0;

function newGame(studioName, sandbox) {
  return {
    studio: { name: studioName, money: sandbox ? Infinity : CONFIG.startingMoney, fans: 0, reputation: 0, day: 1, sandbox: !!sandbox },
    pitches: [],
    shows: [],
    speed: 1,
    paused: false,
    upgrades: { equipment: 0, marketing: 0, studio: 0 },
    nextShowId: 1,
    log: [],
  };
}

// ============ SAVE/LOAD ============
function save() {
  try {
    const data = JSON.stringify(game, (k, v) => v === Infinity ? "__Inf__" : v);
    localStorage.setItem('animStudioSave', data);
  } catch(e) {}
}
function load() {
  try {
    const raw = localStorage.getItem('animStudioSave');
    if (!raw) return null;
    const data = JSON.parse(raw, (k, v) => v === "__Inf__" ? Infinity : v);
    return data;
  } catch(e) { return null; }
}

// ============ UTILS ============
const uid = () => 's' + (game ? game.nextShowId++ : Date.now());
function fmtMoney(n) { if (n === Infinity) return '∞'; if (n >= 1e6) return '$' + (n/1e6).toFixed(1) + 'M'; if (n >= 1e3) return '$' + (n/1e3).toFixed(1) + 'k'; return '$' + Math.floor(n).toLocaleString(); }
function fmtNum(n) { if (n >= 1e6) return (n/1e6).toFixed(1) + 'M'; if (n >= 1e3) return (n/1e3).toFixed(1) + 'k'; return Math.floor(n).toLocaleString(); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function randInt(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function notify(msg, type = '') {
  const el = document.createElement('div');
  el.className = 'notif ' + type;
  el.textContent = msg;
  document.getElementById('notifications').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 300); }, 4000);
}

function getProductionDays() {
  return Math.max(1, CONFIG.episodeProductionDays - game.upgrades.equipment);
}
function getUpgradeCost(type) {
  const lvl = game.upgrades[type];
  return CONFIG.upgradeBaseCost * Math.pow(2, lvl);
}

// ============ PITCH GENERATION ============
async function generatePitch() {
  const genre = pick(GENRES);
  const tone = pick(TONES);
  const setting = pick(SETTINGS);
  const twist = pick(TWISTS);
  const audience = pick(AUDIENCES);
  const includeScript = Math.random() < 0.55;

  const prompt = `You are a creative TV writer pitching an ORIGINAL animated show to an animation studio. Create a completely unique show pitch. Be wildly creative — avoid generic tropes, avoid anything similar to existing famous shows.

Show parameters (use these as inspiration, combine them creatively):
- Genre: ${genre}
- Tone: ${tone}
- Setting: ${setting}, ${twist}
- Target audience: ${audience}

The creator name should be a fictional but realistic-sounding person name. Vary the name style — some quirky, some international, some plain.

Create 4-5 distinct main characters. Make episode ideas specific and fun, tied to the show's unique concept. ${includeScript ? 'Include a brief pilot script excerpt (about 8-15 lines mixing dialogue and action directions).' : 'Do NOT include a pilot script.'}

Respond with ONLY a valid JSON object, no markdown, no explanation, in EXACTLY this format:
{"title":"Show Title","creator":"Creator Name","genre":"${genre}","tone":"${tone}","premise":"2-3 sentence premise","targetAudience":"${audience}","world":"2-3 sentences about the world","characters":[{"name":"Name","description":"Physical description","personality":"Personality and backstory"}],"episodeIdeas":[{"title":"Episode Title","premise":"What happens in this episode"}],"pilotScript":${includeScript ? '"Brief script excerpt here"' : 'null'}}

Return ONLY the JSON object. No other text.`;

  try {
    const result = await root.generateText({ instruction: prompt });
    const text = typeof result === 'string' ? result : (result.text || result);
    return parsePitch(text);
  } catch(e) {
    console.error('Pitch generation failed:', e);
    notify('Pitch generation failed. Try again.', 'error');
    return null;
  }
}

function parsePitch(text) {
  try {
    const m = text.match(/\{[\s\S]*\}/);
    if (m) {
      const obj = JSON.parse(m[0]);
      if (obj.title && obj.premise) return obj;
    }
  } catch(e) {}
  // Fallback: minimal pitch from raw text
  return {
    title: 'Untitled Pitch',
    creator: 'Unknown Creator',
    genre: 'Unknown',
    tone: '',
    premise: text.substring(0, 300),
    targetAudience: 'All ages',
    world: '',
    characters: [],
    episodeIdeas: [],
    pilotScript: null,
  };
}

async function generatePitches(count = 3) {
  pendingPitchCount = count;
  renderPitches();
  for (let i = 0; i < count; i++) {
    const pitch = await generatePitch();
    if (pitch) {
      pitch.id = 'p' + Date.now() + '_' + i;
      pitch.userCreated = false;
      game.pitches.push(pitch);
      save();
    }
    pendingPitchCount--;
    renderPitches();
  }
}

// ============ PITCH ACTIONS ============
window.acceptPitch = function(id) {
  const pitch = game.pitches.find(p => p.id === id);
  if (!pitch) return;
  showModal(`
    <span class="modal-close" onclick="window.closeModal()">✕</span>
    <div class="modal-title">Greenlight: ${escapeHtml(pitch.title)}</div>
    <p style="color:#888;margin-bottom:12px;">Creator: ${escapeHtml(pitch.creator)} · ${escapeHtml(pitch.genre)}</p>
    <div class="form-group">
      <label>How many episodes for Season 1? (6–26)</label>
      <input type="number" id="epCountInput" value="10" min="6" max="26" style="background:#12121f;border:1px solid #2a2a4e;color:#fff;padding:8px 12px;border-radius:8px;font-size:1.1em;width:100px;">
    </div>
    <p style="color:#888;font-size:0.85em;margin:8px 0;">Production cost: ${fmtMoney(CONFIG.epProductionCost)} per episode</p>
    <button class="btn btn-green" onclick="window.confirmAccept('${id}')">Start Production</button>
  `);
};

window.confirmAccept = function(id) {
  const pitch = game.pitches.find(p => p.id === id);
  if (!pitch) return;
  let epCount = parseInt(document.getElementById('epCountInput').value) || 10;
  epCount = clamp(epCount, 6, 26);
  const cost = CONFIG.epProductionCost * epCount;
  if (!game.studio.sandbox && game.studio.money < cost) {
    notify(`Not enough money! Need ${fmtMoney(cost)}.`, 'error');
    return;
  }
  if (!game.studio.sandbox) game.studio.money -= cost;
  game.pitches = game.pitches.filter(p => p.id !== id);
  const show = {
    id: uid(),
    title: pitch.title,
    creator: pitch.creator,
    genre: pitch.genre,
    tone: pitch.tone || '',
    premise: pitch.premise,
    targetAudience: pitch.targetAudience || 'All ages',
    world: pitch.world || '',
    characters: pitch.characters || [],
    episodeIdeas: pitch.episodeIdeas || [],
    pilotScript: pitch.pilotScript || null,
    status: 'in_production',
    season: 1,
    episodesOrdered: epCount,
    currentEpisode: 1,
    episodeProgress: 0,
    episodesProduced: [],
    views: 0,
    totalRevenue: 0,
    rating: 0,
    fans: 0,
    hype: 0,
    teasersReleased: 0,
    hasMerch: false,
    userCreated: pitch.userCreated || false,
    acceptedDay: game.studio.day,
    releasedDay: null,
    productionLog: [`Day ${game.studio.day}: Production begins on "${pitch.title}" Season 1`],
    publicReaction: null,
  };
  game.shows.push(show);
  notify(`🎬 "${pitch.title}" greenlit! ${epCount} episodes ordered.`, 'success');
  closeModal();
  save();
  renderAll();
};

window.rejectPitch = function(id) {

// ============ PRODUCTION ============
function completeEpisode(show) {
  const epNum = show.currentEpisode;
  const epIdea = show.episodeIdeas[(epNum - 1) % (show.episodeIdeas.length || 1)] || { title: `Episode ${epNum}`, premise: '' };
  const ep = { number: epNum, title: epIdea.title || `Episode ${epNum}`, premise: epIdea.premise || '', views: 0, revenue: 0 };
  show.episodesProduced.push(ep);
  show.productionLog.push(`Day ${game.studio.day}: ✅ Episode ${epNum} "${ep.title}" completed!`);

  if (show.currentEpisode === 1) {
    show.status = 'on_air';
    show.releasedDay = game.studio.day;
    show.rating = clamp(randInt(3, 8) + Math.floor(game.studio.reputation * 0.1) + Math.min(show.teasersReleased, 3), 1, 10);
    show.productionLog.push(`Day ${game.studio.day}: 📺 "${show.title}" is now ON AIR! Rating: ${show.rating}/10`);
    notify(`📺 "${show.title}" is now on air! Rating: ${show.rating}/10`, 'success');
  } else {
    notify(`🎬 "${show.title}" Ep ${epNum} "${ep.title}" completed!`, 'success');
  }

  show.currentEpisode++;
  show.episodeProgress = 0;

  if (show.currentEpisode > show.episodesOrdered) {
    show.productionLog.push(`Day ${game.studio.day}: 🎉 Season ${show.season} complete! All ${show.episodesOrdered} episodes produced.`);
    if (show.season === 1) {
      notify(`🎉 "${show.title}" Season 1 fully produced!`, 'success');
    }
  }
}

function generateRevenue(show) {
  if (show.status !== 'on_air' || show.episodesProduced.length === 0) return;
  const epCount = show.episodesProduced.length;
  const baseViews = CONFIG.baseViewsPerEp * epCount;
  const fanBonus = show.fans * 0.4 * epCount;
  const hypeBonus = show.hype * 50 * epCount;
  const teaserBonus = show.teasersReleased * 800 * epCount;
  const ratingMult = show.rating / 5;
  const randomness = 0.7 + Math.random() * 0.6;
  const dailyViews = Math.floor((baseViews + fanBonus + hypeBonus + teaserBonus) * ratingMult * randomness);
  const dailyRevenue = Math.floor(dailyViews * CONFIG.revenuePerView);
  const dailyFanGrowth = Math.floor(dailyViews * CONFIG.fanGrowthRate * ratingMult);
  const merchRevenue = show.hasMerch ? Math.floor((2000 + show.fans * 0.2) * epCount * 0.5) : 0;
  const merchFans = show.hasMerch ? Math.floor(dailyViews * 0.002) : 0;

  show.views += dailyViews;
  show.totalRevenue += dailyRevenue + merchRevenue;
  show.fans += dailyFanGrowth + merchFans;
  if (!game.studio.sandbox) game.studio.money += dailyRevenue + merchRevenue;
  game.studio.fans += dailyFanGrowth + merchFans;
  if (show.rating >= 7 && Math.random() < 0.1) {
    game.studio.reputation = Math.min(100, game.studio.reputation + 1);
  }

  // Hype decay
  show.hype = Math.max(0, show.hype - 3);
}

// ============ TICK ============
function tick() {
  game.studio.day++;

  // Production progress
  for (let show of game.shows) {
    if ((show.status === 'in_production' || show.status === 'on_air') && show.currentEpisode <= show.episodesOrdered) {
      const days = getProductionDays();
      show.episodeProgress += 100 / days;
      if (Math.random() < 0.3) {
        const phase = PRODUCTION_PHASES[Math.floor(show.episodeProgress / (100 / days / PRODUCTION_PHASES.length))] || 'Finalizing';
        show.productionLog.push(`Day ${game.studio.day}: ${phase} — Ep ${show.currentEpisode}`);
        if (show.productionLog.length > 20) show.productionLog.shift();
      }
      if (show.episodeProgress >= 100) {
        completeEpisode(show);
      }
    }
  }

  // Revenue & fans
  for (let show of game.shows) {
    generateRevenue(show);
  }

  // Random events
  if (Math.random() < 0.04) randomEvent();

  save();
  renderAll();
}

function randomEvent() {
  const onAirShows = game.shows.filter(s => s.status === 'on_air');
  if (onAirShows.length === 0) return;
  const show = pick(onAirShows);
  const events = [
    () => { show.hype += 30; notify(`🔥 "${show.title}" is trending on social media! +30 hype`, 'success'); },
    () => { const v = randInt(50000, 200000); show.views += v; const r = Math.floor(v * CONFIG.revenuePerView); if(!game.studio.sandbox) game.studio.money += r; notify(`📈 "${show.title}" went viral! +${fmtNum(v)} views, +${fmtMoney(r)}`, 'success'); },
    () => { game.studio.reputation = Math.min(100, game.studio.reputation + 3); notify(`🏆 "${show.title}" won an animation award! +3 reputation`, 'success'); },
    () => { const f = randInt(500, 3000); show.fans += f; game.studio.fans += f; notify(`💬 A famous influencer praised "${show.title}"! +${fmtNum(f)} fans`, 'success'); },
    () => { show.hype = Math.max(0, show.hype - 15); notify(`⚠️ A competitor show is drawing attention away from "${show.title}". -15 hype`, 'warn'); },
    () => { if (show.rating > 1) { show.rating -= 1; notify(`📉 Critics panned the latest episode of "${show.title}". Rating dropped to ${show.rating}.`, 'warn'); } },
    () => { const f = randInt(200, 1000); show.fans += f; game.studio.fans += f; notify(`🎤 "${show.title}" got featured at a comic convention! +${fmtNum(f)} fans`, 'success'); },
  ];
  pick(events)();
}

window.submitUserPitch = function() {
  const title = document.getElementById('userTitle').value.trim();
  const creator = document.getElementById('userCreator').value.trim() || 'You';
  const genre = document.getElementById('userGenre').value;
  const premise = document.getElementById('userPremise').value.trim();
  const world = document.getElementById('userWorld').value.trim();
  const charText = document.getElementById('userChars').value.trim();
  const epText = document.getElementById('userEps').value.trim();
  const script = document.getElementById('userScript').value.trim();

  if (!title || !premise) { notify('Title and premise are required!', 'error'); return; }

  let characters = [];
  if (charText) {
    characters = charText.split('\n').filter(l => l.trim()).map(line => {
      const parts = line.split(' - ');
      return { name: parts[0]?.trim() || 'Character', description: parts[1]?.trim() || '', personality: parts[2]?.trim() || '' };
    });
  }
  let episodeIdeas = [];
  if (epText) {
    episodeIdeas = epText.split('\n').filter(l => l.trim()).map((line, i) => {
      const parts = line.split(' - ');
      return { title: parts[0]?.trim() || `Episode ${i+1}`, premise: parts[1]?.trim() || '' };
    });
  }

  const pitch = {
    id: 'p' + Date.now(),
    title, creator, genre, tone: '',
    premise, targetAudience: 'All ages',
    world,
    characters,
    episodeIdeas,
    pilotScript: script || null,
    userCreated: true,
  };
  game.pitches.push(pitch);
  notify(`✏️ Your pitch "${title}" added to the deck!`, 'success');
  // Clear form
  ['userTitle','userCreator','userPremise','userWorld','userChars','userEps','userScript'].forEach(id => document.getElementById(id).value = '');
  save();
  showTab('pitches');
  renderPitches();
};

  const totalEps = show.episodesOrdered;
  const done = show.episodesProduced.length;
  const progress = show.currentEpisode <= totalEps ? Math.min(100, show.episodeProgress) : 100;
  const phaseIdx = Math.floor(progress / (100 / PRODUCTION_PHASES.length));
  const phase = show.currentEpisode <= totalEps ? (PRODUCTION_PHASES[phaseIdx] || 'Finalizing') : 'Complete';
  const logHtml = show.productionLog.slice(-5).reverse().map(l => `<div>${escapeHtml(l)}</div>`).join('');
  return `
    <div class="card">
      <div class="card-title">${escapeHtml(show.title)}</div>
      <div class="card-creator">By ${escapeHtml(show.creator)} · Season ${show.season}</div>
      <div class="card-meta"><span class="badge badge-genre">${escapeHtml(show.genre)}</span><span class="badge">Ep ${done}/${totalEps}</span></div>
      <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
      <div class="episode-progress-text">Episode ${show.currentEpisode <= totalEps ? show.currentEpisode : totalEps} of ${totalEps} — ${phase} (${Math.floor(progress)}%)</div>
      <div class="show-stats">
        <span class="show-stat">Episodes: <span>${done}/${totalEps}</span></span>
        ${show.teasersReleased > 0 ? `<span class="show-stat">Teasers: <span>${show.teasersReleased}</span></span>` : ''}
        ${show.hype > 0 ? `<span class="show-stat">Hype: <span>${show.hype}</span></span>` : ''}
      </div>
      <div class="card-actions">
        <button class="btn btn-blue btn-sm" onclick="window.releaseTeaser('${show.id}')">🎭 Release Teaser (${game.studio.sandbox?'Free':fmtMoney(CONFIG.teaserCost)})</button>
        <button class="btn btn-gray btn-sm" onclick="window.viewShowDetails('${show.id}')">📖 Details</button>
      </div>
      <div class="production-log">${logHtml}</div>
    </div>
  `;
}

function renderOnAirTab() {
  const c = document.getElementById('tabContent');
  const shows = game.shows.filter(s => s.status === 'on_air' || s.status === 'canceled');
  let html = `<div class="section-title">📺 On Air & Released</div>`;
  if (shows.length === 0) {
    html += `<div class="empty-state"><p>No shows on air yet. Produce some episodes from accepted pitches!</p></div>`;
  } else {
    html += `<div class="show-grid">${shows.map(show => renderOnAirCard(show)).join('')}</div>`;
  }
  c.innerHTML = html;
}

function renderOnAirCard(show) {
  const canceled = show.status === 'canceled';
  const allDone = show.currentEpisode > show.episodesOrdered;
  const canRenew = !canceled && allDone;
  return `
    <div class="card" ${canceled ? 'style="opacity:0.6;"' : ''}>
      <div class="card-title">${escapeHtml(show.title)} ${canceled ? '🚫' : ''}</div>
      <div class="card-creator">By ${escapeHtml(show.creator)} · Season ${show.season} · ${show.episodesProduced.length}/${show.episodesOrdered} eps</div>
      <div class="card-meta">
        <span class="badge badge-genre">${escapeHtml(show.genre)}</span>
        ${show.rating > 0 ? `<span class="badge">⭐ ${show.rating}/10</span>` : ''}
        ${show.hasMerch ? '<span class="badge">🧸 Merch</span>' : ''}
        ${allDone && !canceled ? '<span class="badge" style="background:#2ecc7133;color:#2ecc71aa;">Season Complete</span>' : ''}
      </div>
      <div class="show-stats">
        <span class="show-stat">Views: <span>${fmtNum(show.views)}</span></span>
        <span class="show-stat">Revenue: <span>${fmtMoney(show.totalRevenue)}</span></span>
        <span class="show-stat">Fans: <span>${fmtNum(show.fans)}</span></span>
        ${show.hype > 0 ? `<span class="show-stat">Hype: <span>${show.hype}</span></span>` : ''}
      </div>
      ${!allDone && !canceled ? `<div class="progress-bar"><div class="progress-fill" style="width:${Math.min(100, show.episodeProgress)}%"></div></div><div class="episode-progress-text">Producing Ep ${show.currentEpisode}/${show.episodesOrdered}</div>` : ''}
      <div class="card-actions">
        ${!canceled ? `<button class="btn btn-blue btn-sm" onclick="window.releaseTeaser('${show.id}')">🎭 Teaser (${game.studio.sandbox?'Free':fmtMoney(CONFIG.teaserCost)})</button>` : ''}
        ${!canceled && !show.hasMerch ? `<button class="btn btn-purple btn-sm" onclick="window.investMerch('${show.id}')">🧸 Merch (${game.studio.sandbox?'Free':fmtMoney(CONFIG.merchCost)})</button>` : ''}
        ${canRenew ? `<button class="btn btn-green btn-sm" onclick="window.renewShow('${show.id}')">📋 Renew</button>` : ''}
        ${!canceled ? `<button class="btn btn-red btn-sm" onclick="window.cancelShow('${show.id}')">✕ Cancel</button>` : ''}
        <button class="btn btn-gray btn-sm" onclick="window.viewShowDetails('${show.id}')">📖 Details</button>
      </div>
    </div>
  `;
}

function renderShowDetailHTML(show) {
  const chars = (show.characters || []).map(c => `<div class="char-item"><div class="char-name">${escapeHtml(c.name)}</div><div class="char-desc">${escapeHtml(c.description)}</div><div class="char-desc" style="margin-top:4px;color:#9b9bff;">${escapeHtml(c.personality)}</div></div>`).join('');
  const eps = show.episodesProduced.map(e => `<div class="ep-item"><span class="ep-title">S${show.season}E${e.number}: "${escapeHtml(e.title)}"</span> — ${escapeHtml(e.premise)}</div>`).join('');
  const epIdeas = (show.episodeIdeas || []).map((e, i) => `<div class="ep-item"><span class="ep-title">${i+1}. "${escapeHtml(e.title)}"</span> — ${escapeHtml(e.premise)}</div>`).join('');
  const logHtml = show.productionLog.slice(-15).reverse().map(l => `<div>${escapeHtml(l)}</div>`).join('');
  return `
    <span class="modal-close" onclick="window.closeModal()">✕</span>
    <div class="modal-title">${escapeHtml(show.title)}</div>
    <div class="card-creator">By ${escapeHtml(show.creator)} · Season ${show.season} · ${show.status}</div>
    <div class="stat-grid">
      <div class="stat-box"><div class="num" style="color:#f39c12">${show.rating || '—'}/10</div><div class="lbl">Rating</div></div>
      <div class="stat-box"><div class="num" style="color:#3498db">${fmtNum(show.views)}</div><div class="lbl">Views</div></div>
      <div class="stat-box"><div class="num" style="color:#2ecc71">${fmtMoney(show.totalRevenue)}</div><div class="lbl">Revenue</div></div>
      <div class="stat-box"><div class="num" style="color:#9b59b6">${fmtNum(show.fans)}</div><div class="lbl">Fans</div></div>
    </div>
    <p style="color:#bbb;line-height:1.5;margin:10px 0;">${escapeHtml(show.premise)}</p>
    ${show.world ? `<p style="color:#999;font-size:0.9em;margin-bottom:10px;"><b>World:</b> ${escapeHtml(show.world)}</p>` : ''}
    ${chars ? `<h4 style="margin:10px 0 6px;">Characters</h4><div class="char-list">${chars}</div>` : ''}
    ${eps ? `<h4 style="margin:10px 0 6px;">Produced Episodes</h4><div class="episode-list">${eps}</div>` : ''}
    ${epIdeas && !eps ? `<h4 style="margin:10px 0 6px;">Episode Ideas</h4><div class="episode-list">${epIdeas}</div>` : ''}
    <h4 style="margin:14px 0 6px;">Pilot Script</h4>
    <div id="scriptArea">${show.pilotScript ? `<div class="script-box">${escapeHtml(show.pilotScript)}</div>` : `<button class="btn btn-purple btn-sm" onclick="window.generateScript('${show.id}')">Generate Pilot Script</button>`}</div>
    <h4 style="margin:14px 0 6px;">Public Reaction</h4>
    <div id="reactionArea">${show.publicReaction ? `<div class="reaction-box">${escapeHtml(show.publicReaction)}</div>` : `<button class="btn btn-blue btn-sm" onclick="window.getAIReaction('${show.id}')">Get Public Reactions</button>`}</div>
    <h4 style="margin:14px 0 6px;">Production Log</h4>
    <div class="production-log" style="max-height:120px;">${logHtml}</div>
  `;
}

function renderCreateTab() {
  const c = document.getElementById('tabContent');
  c.innerHTML = `
    <div class="section-title">✏️ Create Your Own Pitch</div>
    <div class="card">
      <div class="create-form">
        <div class="form-group">
          <label>Show Title *</label>
          <input id="userTitle" placeholder="The Amazing Adventures of...">
        </div>
        <div class="form-group">
          <label>Creator Name</label>
          <input id="userCreator" placeholder="Your name or a pen name">
        </div>
        <div class="form-group">
          <label>Genre</label>
          <select id="userGenre">${GENRES.map(g => `<option value="${g}">${g}</option>`).join('')}</select>
        </div>
        <div class="form-group">
          <label>Premise *</label>
          <textarea id="userPremise" placeholder="Describe what the show is about in 2-3 sentences..."></textarea>
        </div>

          <label>World / Setting</label>
          <textarea id="userWorld" placeholder="Describe the world or setting of the show..."></textarea>
        </div>
        <div class="form-group">
          <label>Characters (one per line: Name - Description - Personality)</label>
          <textarea id="userChars" placeholder="Max Powers - Spiky-haired teen - Brave, impulsive, loves snacks&#10;Luna Frost - Tall woman with ice hair - Cool, calculated, secretly caring"></textarea>
        </div>
        <div class="form-group">
          <label>Episode Ideas (one per line: Title - Premise)</label>
          <textarea id="userEps" placeholder="The Beginning - Max discovers his powers for the first time&#10;Ice Breaker - Luna and Max must work together despite their differences"></textarea>
        </div>
        <div class="form-group">
          <label>Pilot Script (optional)</label>
          <textarea id="userScript" placeholder="Write your pilot script here..." style="min-height:120px;"></textarea>
        </div>
        <button class="btn btn-green" onclick="window.submitUserPitch()">Submit Pitch to Deck</button>
      </div>
    </div>
  `;
}

function renderStudioTab() {
  const c = document.getElementById('tabContent');
  const totalShows = game.shows.length;
  const onAir = game.shows.filter(s => s.status === 'on_air').length;
  const canceled = game.shows.filter(s => s.status === 'canceled').length;
  const totalRevenue = game.shows.reduce((a, s) => a + s.totalRevenue, 0);
  c.innerHTML = `
    <div class="section-title">🏢 ${escapeHtml(game.studio.name)}</div>
    <div class="stat-grid">
      <div class="stat-box"><div class="num" style="color:#6c63ff">${totalShows}</div><div class="lbl">Total Shows</div></div>
      <div class="stat-box"><div class="num" style="color:#2ecc71">${onAir}</div><div class="lbl">On Air</div></div>
      <div class="stat-box"><div class="num" style="color:#e74c3c">${canceled}</div><div class="lbl">Canceled</div></div>
      <div class="stat-box"><div class="num" style="color:#f39c12">${game.studio.reputation}</div><div class="lbl">Reputation</div></div>
      <div class="stat-box"><div class="num" style="color:#3498db">${fmtNum(game.studio.fans)}</div><div class="lbl">Total Fans</div></div>
      <div class="stat-box"><div class="num" style="color:#2ecc71">${fmtMoney(totalRevenue)}</div><div class="lbl">Total Revenue</div></div>
    </div>
    <h3 style="margin:16px 0 8px;color:#ccc;">Studio Upgrades</h3>
    <div class="upgrade-card">
      <div class="upgrade-info"><h4>🎨 Animation Equipment (Lv ${game.upgrades.equipment})</h4><p>Faster episode production (1 day faster per level)</p></div>
      <button class="btn btn-purple btn-sm" onclick="window.buyUpgrade('equipment')">${game.studio.sandbox?'Free':fmtMoney(getUpgradeCost('equipment'))}</button>
    </div>
    <div class="upgrade-card">
      <div class="upgrade-info"><h4>📢 Marketing Team (Lv ${game.upgrades.marketing})</h4><p>Boosts fan growth from all shows</p></div>
      <button class="btn btn-purple btn-sm" onclick="window.buyUpgrade('marketing')">${game.studio.sandbox?'Free':fmtMoney(getUpgradeCost('marketing'))}</button>
    </div>
    <div class="upgrade-card">
      <div class="upgrade-info"><h4>🏢 Studio Expansion (Lv ${game.upgrades.studio})</h4><p>Increases reputation faster</p></div>
      <button class="btn btn-purple btn-sm" onclick="window.buyUpgrade('studio')">${game.studio.sandbox?'Free':fmtMoney(getUpgradeCost('studio'))}</button>
    </div>
    <h3 style="margin:20px 0 8px;color:#ccc;">Settings</h3>
    <div class="card">
      <p style="color:#888;font-size:0.9em;margin-bottom:10px;">Sandbox Mode: <b style="color:${game.studio.sandbox?'#2ecc71':'#e74c3c'}">${game.studio.sandbox?'ON':'OFF'}</b></p>
      <button class="btn btn-red btn-sm" onclick="window.resetGame()">Reset Game (delete save)</button>
    </div>
  `;
}

window.resetGame = function() {
  if (confirm('Delete your save and start over? This cannot be undone.')) {
    localStorage.removeItem('animStudioSave');
    location.reload();
  }
};

function renderAll() {
  renderTopBar();
  if (currentTab === 'pitches') renderPitches();
  else if (currentTab === 'production') renderProductionTab();
  else if (currentTab === 'onair') renderOnAirTab();
  else if (currentTab === 'create') renderCreateTab();
  else if (currentTab === 'studio') renderStudioTab();
}

function showTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  renderAll();
}
window.showTab = showTab;

// ============ MODAL ============
function showModal(html) {
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modal').hidden = false;
}
function closeModal() {
  document.getElementById('modal').hidden = true;
}
window.closeModal = closeModal;

// ============ GAME LOOP ============
function startGameLoop() {
  if (gameInterval) clearInterval(gameInterval);
  const speed = CONFIG.tickSpeeds[game.speed];
  if (speed > 0 && !game.paused) {
    gameInterval = setInterval(tick, speed);
  }
}

function updateLoop() {
  if (gameInterval) clearInterval(gameInterval);
  gameInterval = null;
  if (!game.paused && game.speed > 0) {
    gameInterval = setInterval(tick, CONFIG.tickSpeeds[game.speed]);
  }
}

// ============ INIT ============
function startStudio() {
  const name = document.getElementById('studioNameInput').value.trim() || 'My Studio';
  const sandbox = document.getElementById('sandboxCheck').checked;
  game = newGame(name, sandbox);
  document.getElementById('creationScreen').hidden = true;
  document.getElementById('gameScreen').hidden = false;
  save();
  renderAll();
  updateLoop();
  generatePitches(3);
}

function init() {
  const saved = load();
  if (saved && saved.studio && saved.studio.name) {
    game = saved;
    document.getElementById('creationScreen').hidden = true;
    document.getElementById('gameScreen').hidden = false;
    renderAll();
    updateLoop();
    if (game.pitches.length === 0) generatePitches(3);
  }

  document.getElementById('startBtn').addEventListener('click', startStudio);
  document.getElementById('studioNameInput').addEventListener('keydown', e => { if (e.key === 'Enter') startStudio(); });
  document.querySelectorAll('.tab-btn').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));
  document.getElementById('pauseBtn').addEventListener('click', () => {
    game.paused = !game.paused;
    updateLoop();
    renderTopBar();
    save();
  });
  document.getElementById('speedBtn').addEventListener('click', () => {
    game.speed = (game.speed + 1) % CONFIG.tickSpeeds.length;
    if (game.speed === 0) { game.paused = true; } else { game.paused = false; }
    updateLoop();
    renderTopBar();
    save();
  });
}

init();
</script>
