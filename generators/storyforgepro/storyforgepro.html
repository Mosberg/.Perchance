<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>storyforgepro — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<!-- 
  Enhanced UI Version:
  - Added CSS Variables for Light/Dark mode theming.
  - Added a Dark Mode toggle button in the header.
  - Modernized typography (system fonts), spacing, and borders.
  - Improved button and input field styling with focus states.
  - Preserved all original functionality and comments.
  - **Updated Layout:** Split view with Options in the left sidebar and Inputs/Outputs in the right panel for a clearer view.
  - **Dark Mode Update:** Enforced white text color for all elements including headings, body text, buttons, chips, analysis, and specifically dropdown options.
-->

<div id="appContainer" style="max-width: 1400px; margin: 20px auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--text-color); transition: color 0.3s;">
  
  <!-- Header & Theme Toggle -->
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
    <h1 style="margin: 0; font-size: 2em; letter-spacing: -0.5px; color: var(--heading-color);">Story Forge</h1>
    <button id="themeToggleBtn" onclick="toggleTheme()" style="background: none; border: 1px solid var(--border-color); color: var(--text-color); padding: 8px 12px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 0.9em;">
      <span id="themeIcon">🌙</span> <span id="themeText">Dark Mode</span>
    </button>
  </div>
  
  <!-- Main Layout Wrapper: Left (Options) & Right (Content) -->
  <div style="display: flex; gap: 24px; align-items: flex-start;">
    
    <!-- LEFT WINDOW: Configuration Options -->
    <div class="sidebar" style="width: 300px; flex-shrink: 0; display: flex; flex-direction: column; gap: 16px; position: sticky; top: 20px;">
      
      <div class="card" style="background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); border: 1px solid var(--border-color); transition: background 0.3s, border-color 0.3s;">
        <h3 style="margin-top: 0; font-size: 1.1em; color: var(--heading-color); border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-bottom: 15px;">Settings</h3>
        
        <div style="display: flex; flex-direction: column; gap: 15px;">
          <!-- Genre / Theme -->
          <div class="form-group">
            <label for="genreSelect" style="font-weight: 600; font-size: 0.85em; color: var(--muted-color); margin-bottom: 6px; display: block;">Genre / Theme</label>
            <select id="genreSelect" class="select-field">
              <option value="">Default / General</option>
              <option value="Adult / Mature">Adult / Mature</option>
              <option value="Child / Fairy Tale">Child / Fairy Tale</option>
              <option value="Romance">Romance</option>
              <option value="Horror">Horror</option>
              <option value="Sci-Fi">Sci-Fi</option>
              <option value="Fantasy">Fantasy</option>
              <option value="Mystery / Thriller">Mystery / Thriller</option>
              <option value="Historical">Historical</option>
              <option value="Comedy">Comedy</option>
              <option value="Noir / Gritty">Noir / Gritty</option>
              <option value="Adventure">Adventure</option>
              <option value="Drama">Drama</option>
            </select>
          </div>

          <!-- Language -->
          <div class="form-group">
            <label for="languageSelect" style="font-weight: 600; font-size: 0.85em; color: var(--muted-color); margin-bottom: 6px; display: block;">Language</label>
            <select id="languageSelect" class="select-field">
              <option value="English">English</option>
              <option value="Spanish">Spanish</option>
              <option value="French">French</option>
              <option value="German">German</option>
              <option value="Japanese">Japanese</option>
              <option value="Chinese">Chinese</option>
              <option value="Russian">Russian</option>
              <option value="Italian">Italian</option>
              <!-- Indian Languages -->
              <option value="Hindi">Hindi</option>
              <option value="Bengali">Bengali</option>
              <option value="Tamil">Tamil</option>
              <option value="Telugu">Telugu</option>
              <option value="Marathi">Marathi</option>
              <option value="Gujarati">Gujarati</option>
              <option value="Kannada">Kannada</option>
              <option value="Malayalam">Malayalam</option>
              <option value="Punjabi">Punjabi</option>
              <option value="Urdu">Urdu</option>
              <option value="Odia">Odia</option>
              <option value="Sanskrit">Sanskrit</option>
              <option value="Assamese">Assamese</option>
            </select>
          </div>

          <!-- Script Format (Transliteration Option) -->
          <div class="form-group">
            <label for="scriptSelect" style="font-weight: 600; font-size: 0.85em; color: var(--muted-color); margin-bottom: 6px; display: block;">Script / Transliteration</label>
            <select id="scriptSelect" class="select-field">
              <option value="Native">Native Script (e.g. Hindi: नमस्ते)</option>
              <option value="Transliterated">Transliterated (e.g. Hindi: Namaste)</option>
            </select>
          </div>

          <!-- Industry / Format -->
          <div class="form-group">
            <label for="industrySelect" style="font-weight: 600; font-size: 0.85em; color: var(--muted-color); margin-bottom: 6px; display: block;">Industry / Format</label>
            <select id="industrySelect" class="select-field">
              <optgroup label="— Prose Fiction —">
                <option value="General Fiction">General Fiction</option>
                <option value="Short Story">Short Story</option>
                <option value="Novel / Book">Novel / Book</option>
                <option value="Flash Fiction / Microfiction">Flash Fiction / Microfiction</option>
                <option value="Novella">Novella</option>
                <option value="Serialized Web Novel">Serialized Web Novel</option>
                <option value="Fan Fiction">Fan Fiction</option>
                <option value="Erotica / Adult Fiction">Erotica / Adult Fiction</option>
                <option value="Literary Fiction">Literary Fiction</option>
              </optgroup>
              <optgroup label="— Film, TV & Stage —">
                <option value="Screenplay / Script">Screenplay / Film Script</option>
                <option value="TV Pilot / Teleplay">TV Pilot / Teleplay</option>
                <option value="Stage Play / Theatre">Stage Play / Theatre</option>
                <option value="Audio Drama / Radio Play">Audio Drama / Radio Play</option>
                <option value="Storyboard / Beat Sheet">Storyboard / Beat Sheet</option>
              </optgroup>
              <optgroup label="— Games & Interactive —">
                <option value="Video Game Narrative">Video Game Narrative</option>
                <option value="Visual Novel / Dating Sim">Visual Novel / Dating Sim</option>
                <option value="TTRPG / Tabletop Module">TTRPG / Tabletop Module</option>
                <option value="Interactive Fiction / Twine">Interactive Fiction / Twine</option>
                <option value="Roleplay / RPG">Roleplay / RPG (freeform)</option>
                <option value="Quest / Mission Design Doc">Quest / Mission Design Doc</option>
              </optgroup>
              <optgroup label="— Publishing & Commercial —">
                <option value="Marketing / Copywriting">Marketing / Copywriting</option>
                <option value="Advertising / Brand Storytelling">Advertising / Brand Storytelling</option>
                <option value="Public Relations / Press Release">Public Relations / Press Release</option>
                <option value="SEO / Web Content">SEO / Web Content</option>
                <option value="Ghostwriting / Memoir">Ghostwriting / Memoir</option>
                <option value="Book Blurb / Synopsis">Book Blurb / Synopsis</option>
              </optgroup>
              <optgroup label="— Journalism & Nonfiction —">
                <option value="Blog Post / Article">Blog Post / Article</option>
                <option value="Journalism / News">Journalism / News Report</option>
                <option value="Feature / Longform">Feature / Longform</option>
                <option value="Op-Ed / Editorial">Op-Ed / Editorial</option>
                <option value="Interview / Profile">Interview / Profile</option>
                <option value="Investigative Report">Investigative Report</option>
                <option value="Review / Critique">Review / Critique</option>
              </optgroup>
              <optgroup label="— Academic & Reference —">
                <option value="Academic / Essay">Academic / Essay</option>
                <option value="Research Paper / Thesis">Research Paper / Thesis</option>
                <option value="Technical Writing">Technical Writing</option>
                <option value="Documentation / Manual">Documentation / Manual</option>
                <option value="Textbook / Educational">Textbook / Educational</option>
                <option value="Whitepaper / Case Study">Whitepaper / Case Study</option>
              </optgroup>
              <optgroup label="— Audio & Spoken —">
                <option value="Podcast Script">Podcast Script</option>
                <option value="Speech / Oratory">Speech / Oratory</option>
                <option value="Spoken Word / Poetry Slam">Spoken Word / Poetry Slam</option>
                <option value="Audiobook Narration">Audiobook Narration</option>
                <option value="Voiceover / Commercial Spot">Voiceover / Commercial Spot</option>
              </optgroup>
              <optgroup label="— Poetry & Verse —">
                <option value="Lyric Poetry">Lyric Poetry</option>
                <option value="Epic / Narrative Poetry">Epic / Narrative Poetry</option>
                <option value="Song Lyrics">Song Lyrics</option>
                <option value="Slam / Performance Poetry">Slam / Performance Poetry</option>
                <option value="Haiku / Tanka">Haiku / Tanka</option>
              </optgroup>
              <optgroup label="— Niche & Specialized —">
                <option value="Children's Book">Children's Book</option>
                <option value="Young Adult (YA)">Young Adult (YA)</option>
                <option value="LitRPG / Progression Fantasy">LitRPG / Progression Fantasy</option>
                <option value="Werewolf / Alpha Romance">Werewolf / Alpha Romance</option>
                <option value="Cozy Mystery">Cozy Mystery</option>
                <option value="Spiritual / Devotional">Spiritual / Devotional</option>
                <option value="Comedy / Satire">Comedy / Satire</option>
                <option value="Worldbuilding / Lore Bible">Worldbuilding / Lore Bible</option>
              </optgroup>
            </select>
          </div>

          <!-- Writing Quality Grade -->
          <div class="form-group">
            <label for="gradeSelect" style="font-weight: 600; font-size: 0.85em; color: var(--muted-color); margin-bottom: 6px; display: block;">Writing Quality Grade</label>
            <select id="gradeSelect" class="select-field">
              <option value="Draft / Rough">Draft / Rough — raw first-draft energy</option>
              <option value="Amateur / Hobbyist">Amateur / Hobbyist — clear but unpolished</option>
              <option value="Intermediate / Competent">Intermediate / Competent — solid, readable craft</option>
              <option value="Professional / Published" selected>Professional / Published — submission-ready</option>
              <option value="Literary / Masterful">Literary / Masterful — award-caliber prose</option>
              <option value="Bestseller / Blockbuster">Bestseller / Blockbuster — mass-market page-turner</option>
              <option value="Avant-Garde / Experimental">Avant-Garde / Experimental — boundary-pushing form</option>
            </select>
          </div>

          <!-- Pacing -->
          <div class="form-group">
            <label for="pacingSelect" style="font-weight: 600; font-size: 0.85em; color: var(--muted-color); margin-bottom: 6px; display: block;">Pacing</label>
            <select id="pacingSelect" class="select-field">
              <option value="Default">Default</option>
              <option value="Slow Burn">Slow Burn — deliberate, atmospheric</option>
              <option value="Measured">Measured — steady, balanced</option>
              <option value="Brisk">Brisk — keeps momentum</option>
              <option value="Breakneck">Breakneck — relentless, high-tension</option>
              <option value="Ebb and Flow">Ebb and Flow — alternating tension/release</option>
            </select>
          </div>

          <!-- Prose Density / Detail -->
          <div class="form-group">
            <label for="densitySelect" style="font-weight: 600; font-size: 0.85em; color: var(--muted-color); margin-bottom: 6px; display: block;">Prose Density / Detail</label>
            <select id="densitySelect" class="select-field">
              <option value="Default">Default</option>
              <option value="Minimalist / Sparse">Minimalist / Sparse — Hemingway-esque</option>
              <option value="Lean">Lean — tight, action-forward</option>
              <option value="Rich / Immersive">Rich / Immersive — sensory depth</option>
              <option value="Lush / Purple">Lush / Purple — maximalist ornamentation</option>
            </select>
          </div>

          <!-- Target Word Count -->
          <div class="form-group">
            <label for="wordCountInput" style="font-weight: 600; font-size: 0.85em; color: var(--muted-color); margin-bottom: 6px; display: block;">Target Word Count (extension)</label>
            <input type="number" id="wordCountInput" class="input-field" style="height: 42px;" min="50" max="5000" step="50" placeholder="E.g. 400 (blank = ~2-3 paragraphs)">
          </div>

          <!-- Narrative Theme -->
          <div class="form-group">
            <label for="themeSelect" style="font-weight: 600; font-size: 0.85em; color: var(--muted-color); margin-bottom: 6px; display: block;">Core Theme</label>
            <select id="themeSelect" class="select-field">
              <option value="None Specific">None Specific</option>
              <option value="Good vs. Evil">Good vs. Evil</option>
              <option value="Coming of Age">Coming of Age</option>
              <option value="Redemption">Redemption</option>
              <option value="Love and Friendship">Love and Friendship</option>
              <option value="Survival">Survival</option>
              <option value="Power and Corruption">Power and Corruption</option>
              <option value="Identity">Identity</option>
              <option value="Revenge">Revenge</option>
              <option value="Sacrifice">Sacrifice</option>
              <option value="Discovery">Discovery</option>
              <option value="Courage">Courage</option>
              <option value="Lust and Desire">Lust and Desire</option>
              <option value="Taboo / Forbidden">Taboo / Forbidden</option>
            </select>
          </div>

          <!-- Tone -->
          <div class="form-group">
            <label for="toneSelect" style="font-weight: 600; font-size: 0.85em; color: var(--muted-color); margin-bottom: 6px; display: block;">Tone</label>
            <select id="toneSelect" class="select-field">
              <option value="Neutral">Neutral</option>
              <option value="Formal / Professional">Formal / Professional</option>
              <option value="Casual / Conversational">Casual / Conversational</option>
              <option value="Serious / Dramatic">Serious / Dramatic</option>
              <option value="Lighthearted / Humorous">Lighthearted / Humorous</option>
              <option value="Dark / Gritty">Dark / Gritty</option>
              <option value="Optimistic / Hopeful">Optimistic / Hopeful</option>
              <option value="Pessimistic / Melancholic">Pessimistic / Melancholic</option>
              <option value="Suspenseful / Tense">Suspenseful / Tense</option>
              <option value="Whimsical / Dreamlike">Whimsical / Dreamlike</option>
              <option value="Sensual / Passionate">Sensual / Passionate</option>
              <option value="Vulgar / Raw">Vulgar / Raw</option>
            </select>
          </div>

          <!-- Custom Tone Override (New Option) -->
          <div class="form-group">
            <label for="customToneInput" style="font-weight: 600; font-size: 0.85em; color: var(--muted-color); margin-bottom: 6px; display: block;">Custom Tone Override</label>
            <input type="text" id="customToneInput" class="input-field" style="height: 42px;" placeholder="E.g. Sarcastic, Melancholy, Epic...">
          </div>

          <!-- Narrator / POV -->
          <div class="form-group">
            <label for="povSelect" style="font-weight: 600; font-size: 0.85em; color: var(--muted-color); margin-bottom: 6px; display: block;">Narrator / POV</label>
            <select id="povSelect" class="select-field">
              <option value="Default">Default / Standard</option>
              <option value="First Person (I)">First Person (I)</option>
              <option value="Second Person (You)">Second Person (You)</option>
              <option value="Third Person Limited">Third Person Limited</option>
              <option value="Third Person Omniscient">Third Person Omniscient</option>
              <option value="Unreliable Narrator">Unreliable Narrator</option>
              <option value="Objective / Fly on the Wall">Objective / Fly on the Wall</option>
              <option value="Epistolary (Letters/Journal)">Epistolary (Letters/Journal)</option>
              <option value="Stream of Consciousness">Stream of Consciousness</option>
            </select>
          </div>

          <!-- Explicitness Level -->
          <div class="form-group">
            <label for="explicitnessSelect" style="font-weight: 600; font-size: 0.85em; color: var(--muted-color); margin-bottom: 6px; display: block;">Explicitness Level</label>
            <select id="explicitnessSelect" class="select-field">
              <option value="Safe / Clean">Safe / Clean</option>
              <option value="Mild / Suggestive">Mild / Suggestive</option>
              <option value="Mature / Erotic">Mature / Erotic</option>
              <option value="Explicit / Hardcore">Explicit / Hardcore</option>
              <option value="Extreme / Fetish">Extreme / Fetish</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <!-- RIGHT SIDE: Prompts and Text Boxes -->
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 20px; min-width: 0;">
      
      <!-- Input Section -->
      <div class="card" style="background: var(--card-bg); padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); border: 1px solid var(--border-color); transition: background 0.3s, border-color 0.3s;">
        
        <label for="storyInput" style="display: block; font-weight: 600; margin-bottom: 8px; color: var(--text-color);">Story Text</label>
        <textarea id="storyInput" class="input-field" style="width: 100%; height: 200px; font-family: inherit; line-height: 1.6;" placeholder="Paste your story excerpt here..."></textarea>
        
        <!-- Error Message (initially hidden) -->
        <div id="errorEl" class="error-box" style="margin-top: 15px; padding: 12px; background: #ffebee; border: 1px solid #ef9a9a; border-radius: 6px; color: #c62828; display: none; font-size: 0.95em;"></div>

        <!-- Plot Direction / What happens next (New Option) -->
        <div style="margin-top: 20px;">
          <label for="plotDirectionInput" style="display: block; font-weight: 600; font-size: 0.9em; color: var(--text-color); margin-bottom: 8px;">Plot Direction / What Happens Next</label>
          <textarea id="plotDirectionInput" class="input-field" style="height: 80px; font-family: inherit;" placeholder="E.g., The hero finds a hidden door, a spaceship lands, they confess their love..."></textarea>
        </div>

        <!-- Analysis Suggestion Box -->
        <div style="margin-top: 20px; background: var(--accent-bg); padding: 15px; border: 1px solid var(--border-color); border-radius: 8px;">
          <label style="display: block; font-weight: 600; font-size: 0.85em; color: var(--text-color); margin-bottom: 10px;">Quick Analysis Prompts (Click to fill)</label>
          <div style="display: flex; flex-wrap: wrap; gap: 10px;">
            <button onclick="applySuggestion('Analyze the current state of the story: pacing, character arcs, plot holes, and emotional impact.')" class="chip-btn" style="background: var(--chip-1-bg); color: var(--chip-1-text); border: 1px solid var(--chip-1-border);">How is the story currently?</button>
            <button onclick="applySuggestion('Analyze how the story can be improved. Suggest enhancements for vocabulary, tone, descriptions, and dialogue.')" class="chip-btn" style="background: var(--chip-2-bg); color: var(--chip-2-text); border: 1px solid var(--chip-2-border);">How can it be improved?</button>
            <button onclick="applySuggestion('Analyze how the story can proceed. Suggest multiple plot directions, potential twists, or ways to develop the narrative.')" class="chip-btn" style="background: var(--chip-3-bg); color: var(--chip-3-text); border: 1px solid var(--chip-3-border);">How can it proceed?</button>
          </div>
        </div>

        <!-- Additional Suggestions / Instructions -->
        <div style="margin-top: 20px;">
          <label for="suggestionsInput" style="display: block; font-weight: 600; font-size: 0.9em; color: var(--text-color); margin-bottom: 8px;">Additional Suggestions / Instructions</label>
          <textarea id="suggestionsInput" class="input-field" style="height: 80px; font-family: inherit;" placeholder="E.g., make the villain mysterious, use metaphors about the ocean, add a plot twist..."></textarea>
        </div>

        <!-- Action Buttons -->
        <div style="margin-top: 25px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;">
          <button id="enhanceBtn" class="btn btn-primary" style="background: #10b981;" onclick="enhanceStory()">Enhance Story</button>
          <button id="extendBtn" class="btn btn-primary" style="background: #3b82f6;" onclick="extendStory()">Extend Story</button>
          <button id="analyzeBtn" class="btn btn-primary" style="background: #8b5cf6;" onclick="analyzeStory()">Analyze Story</button>
          <button id="stopBtn" hidden class="btn btn-danger" onclick="stopGeneration()">Stop Generation</button>
        </div>
      </div>

      <!-- Output Section -->
      <div id="outputCtn" class="card output-card" style="padding: 20px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; min-height: 100px; display: none;">
        <label for="storyOutputInput" style="display: block; font-weight: 600; margin-bottom: 10px; color: var(--text-color);">Generated Story</label>
        <textarea id="storyOutputInput" class="input-field" style="width: 100%; height: 200px; font-family: inherit;" placeholder="Generated story will appear here..."></textarea>
        
        <!-- Action Buttons for Generated Story -->
        <div style="margin-top: 15px;">
          <button id="extendOutputBtn" class="btn btn-secondary" style="width: 100%; background: var(--secondary-btn-bg); color: var(--secondary-btn-text); border: 1px solid var(--border-color);" onclick="extendOutputStory()">Extend Generated Story</button>
        </div>
      </div>

      <!-- Analysis Output Section (New) -->
      <div id="analysisOutputCtn" class="card" style="padding: 20px; background: var(--analysis-bg); border: 1px solid var(--analysis-border); border-radius: 8px; min-height: 100px; display: none;">
        <label for="analysisOutputInput" style="display: block; font-weight: 600; margin-bottom: 10px; color: var(--analysis-text);">Story Analysis</label>
        <textarea id="analysisOutputInput" class="input-field" style="width: 100%; height: 150px; font-family: inherit;" placeholder="Analysis will appear here..."></textarea>
      </div>

    </div>
  </div>

  <!-- Styles -->
  <style>
    :root {
      /* Light Theme Variables */
      --bg-color: #f3f4f6;
      --card-bg: #ffffff;
      --text-color: #1f2937;
      --heading-color: #111827;
      --muted-color: #4b5563;
      --border-color: #d1d5db;
      --input-bg: #f9fafb;
      --accent-bg: #ffffff;
      
      --btn-text: #ffffff;
      --btn-hover-filter: brightness(110%);
      --secondary-btn-bg: #ffffff;
      --secondary-btn-text: #374151;
      --secondary-btn-hover: #f3f4f6;
      
      /* Analysis Box Colors */
      --analysis-bg: #fffbeb;
      --analysis-border: #fcd34d;
      --analysis-text: #92400e;

      /* Chip Colors */
      --chip-1-bg: #eff6ff;
      --chip-1-text: #1d4ed8;
      --chip-1-border: #bfdbfe;
      
      --chip-2-bg: #ecfdf5;
      --chip-2-text: #047857;
      --chip-2-border: #a7f3d0;
      
      --chip-3-bg: #fff7ed;
      --chip-3-text: #c2410c;
      --chip-3-border: #fed7aa;
    }

    [data-theme="dark"] {
      /* Dark Theme Variables */
      --bg-color: #111827;
      --card-bg: #1f2937;
      --text-color: #ffffff; /* Enforced White */
      --heading-color: #ffffff; /* Enforced White */
      --muted-color: #d1d5db; /* Lightened for readability */
      --border-color: #374151;
      --input-bg: #111827;
      --accent-bg: #1f2937;
      
      --secondary-btn-bg: #374151;
      --secondary-btn-text: #ffffff; /* Enforced White */
      --secondary-btn-hover: #4b5563;

      /* Analysis Box Colors - Text set to white per instruction */
      --analysis-bg: #451a03;
      --analysis-border: #78350f;
      --analysis-text: #ffffff; /* Enforced White */

      /* Chip Colors - Text set to white per instruction */
      --chip-1-bg: #172554;
      --chip-1-text: #ffffff; /* Enforced White */
      --chip-1-border: #1e40af;
      
      --chip-2-bg: #064e3b;
      --chip-2-text: #ffffff; /* Enforced White */
      --chip-2-border: #065f46;
      
      --chip-3-bg: #7c2d12;
      --chip-3-text: #ffffff; /* Enforced White */
      --chip-3-border: #9a3412;
    }

    /* Base Styles */
    body {
      background-color: var(--bg-color);
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Enforce option styling for dropdowns in dark mode */
    option {
      background-color: var(--card-bg);
      color: var(--text-color);
    }

    .input-field, .select-field {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background-color: var(--input-bg);
      color: var(--text-color);
      box-sizing: border-box;
      transition: border-color 0.2s, box-shadow 0.2s;
      font-size: 0.95em;
      outline: none;
      resize: vertical;
    }

    .input-field:focus, .select-field:focus {
      border-color: #6366f1; /* Indigo focus for consistency */
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }

    /* Button Styles */
    .btn {
      padding: 12px;
      border: none;
      border-radius: 6px;
      color: var(--btn-text);
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95em;
      transition: all 0.2s ease;
      text-align: center;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary:hover {
      filter: var(--btn-hover-filter);
    }

    .btn-secondary:hover {
      background-color: var(--secondary-btn-hover);
    }

    .btn-danger {
      background: #ef4444;
      color: white;
    }
    .btn-danger:hover {
      background: #dc2626;
    }

    .chip-btn {
      padding: 8px 16px;
      font-size: 0.85em;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .chip-btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
    
    /* Utility */
    .card {
      transition: background-color 0.3s, border-color 0.3s;
    }

    /* Responsive Layout: Stack columns on smaller screens */
    @media (max-width: 900px) {
      #appContainer > div[style*="display: flex"] {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
        position: static;
      }
    }
  </style>

  <script>
    let currentGenPromise = null; // Store the current generation promise to allow stopping

    // Theme Toggle Logic
    function toggleTheme() {
      let html = document.documentElement;
      let currentTheme = html.getAttribute('data-theme');
      let newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', newTheme);
      
      // Update button text/icon
      let icon = document.getElementById('themeIcon');
      let text = document.getElementById('themeText');
      if (newTheme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'Light Mode';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'Dark Mode';
      }
    }

    // Stop Generation Function
    function stopGeneration() { // Renamed function to avoid conflict if inline onclick is used, but referenced below
      if (currentGenPromise && typeof currentGenPromise.stop === 'function') {
        currentGenPromise.stop();
      }
    };

    // Helper function to fill the suggestion input
    function applySuggestion(text) {
      suggestionsInput.value = text;
    }

    function showError(message) {
      errorEl.textContent = message;
      errorEl.style.display = "block";
    }

    function hideError() {
      errorEl.style.display = "none";
    }

    // Builds the additional metadata block (grade, pacing, density, word count) shared by all prompts.
    function extraMeta(opts) {
      let grade = gradeSelect.value || "Professional / Published";
      let pacing = pacingSelect.value || "Default";
      let density = densitySelect.value || "Default";
      let wordCount = wordCountInput.value ? parseInt(wordCountInput.value, 10) : 0;

      let meta = `\nWriting Quality Grade: ${grade}. Target this caliber of prose precisely — vocabulary, sentence rhythm, imagery, and thematic layering should all match a "${grade}" standard.`;
      if (pacing !== "Default") meta += `\nPacing: ${pacing}.`;
      if (density !== "Default") meta += `\nProse Density: ${density}.`;
      if (wordCount > 0) {
        meta += `\nTarget Length: approximately ${wordCount} words.`;
      } else if (opts && opts.extend) {
        meta += `\nTarget Length: approximately 2-3 paragraphs.`;
      }
      return meta;
    }

    // Helper to set loading state and handle the stop button visibility
    function setLoadingState(isLoading, buttonsToDisable, loadingTexts) {
      buttonsToDisable.forEach((btn, index) => {
        btn.disabled = isLoading;
        btn.textContent = isLoading ? loadingTexts[index] : btn.getAttribute('data-original-text') || btn.textContent;
        if (!isLoading && !btn.getAttribute('data-original-text')) {
           btn.setAttribute('data-original-text', btn.textContent); // Save original text if not saved
        } else if (isLoading) {
           // Restore original text logic is handled by resetting to the saved text or hardcoded defaults below
        }
      });
      
      // Restore original text helper
      if (!isLoading) {
         enhanceBtn.textContent = "Enhance Story";
         extendBtn.textContent = "Extend Story";
         analyzeBtn.textContent = "Analyze Story";
         extendOutputBtn.textContent = "Extend Generated Story";
      }

      stopBtn.hidden = !isLoading;
    }

    // Story Analyzer - provides a plain-language analysis of the story
    // Updated to include ALL filters: scriptFormat, pov, explicitness, plotDirection
    async function analyzeStory() {
      hideError();
      let storyText = storyInput.value.trim();
      if (!storyText) {
        showError("Please enter some story text first.");
        return;
      }

      setLoadingState(true, [enhanceBtn, extendBtn, analyzeBtn], ["⏳ Enhancing...", "⏳ Extending...", "⏳ Analyzing..."]);
      analysisOutputCtn.style.display = "block";
      analysisOutputInput.value = ""; // Clear output for new generation
      
      let genre = genreSelect.value || "General";
      let language = languageSelect.value;
      let scriptFormat = scriptSelect.value || "Native";
      let industry = industrySelect.value || "General Fiction";
      let theme = themeSelect.value || "None Specific";
      let tone = customToneInput.value.trim() || toneSelect.value || "Neutral";
      let pov = povSelect.value || "Default";
      let explicitness = explicitnessSelect.value || "Safe / Clean";
      let suggestions = suggestionsInput.value.trim();
      let plotDirection = plotDirectionInput.value.trim();

      let scriptInstruction = "";
      if (scriptFormat === "Transliterated") {
        scriptInstruction = " **Important Script Instruction:** Write the output in Transliterated Latin script (phonetic English characters) instead of the native script. For example, write Hindi as 'Namaste' instead of 'नमस्ते', or Tamil as 'Vanakkam' instead of 'வணக்கம்'.";
      }

      try {
        currentGenPromise = generateText({
          instruction: `Analyze the following story text written in ${language} language. 
          Genre: ${genre}. 
          Script Format: ${scriptFormat}.
          Industry/Format: ${industry}. 
          Core Theme: ${theme}. 
          Tone: ${tone}.
          Narrator/POV: ${pov}.
          Explicitness Level: ${explicitness}.
          Additional Instructions: ${suggestions || "Provide a general analysis"}.
          ${plotDirection ? "Planned Plot Direction: " + plotDirection : ""}
          ${scriptInstruction}
          ${extraMeta()}
          
          **Content Guidelines:** Adhere strictly to the selected Explicitness Level (${explicitness}). If the level is 'Mature', 'Explicit', or 'Extreme', you are authorized to discuss adult content, sexual themes, and graphic descriptions in your analysis. If 'Safe / Clean', keep all analysis suitable for general audiences.
          
          **Task:** Provide a comprehensive analysis of the story's current state. Explain:
          1. The current pacing (is it too fast, too slow, or just right?).
          2. The character arcs and development (how are characters changing?).
          3. Any plot holes or inconsistencies you notice.
          4. The emotional impact of the scene (how does it make the reader feel?).
          5. How well the ${pov} perspective is working for this narrative.
          6. Whether the content appropriately matches the ${explicitness} level.
          ${plotDirection ? "7. How effectively the story is setting up the planned direction: " + plotDirection : ""}
          
          **Format:** Write the analysis in normal, conversational language as if you are explaining it to a friend. Avoid overly technical jargon. Use the same language as the story (${language}).\n\nStory Text:\n${storyText}`,
          onChunk: (data) => {
            analysisOutputInput.value += data.textChunk;
          },
        });
        await currentGenPromise;
      } catch (error) {
        // Don't show error if manually stopped
        if (error.message && error.message !== "stopped") {
          showError("Error analyzing story: " + error.message);
        }
      } finally {
        setLoadingState(false, [enhanceBtn, extendBtn, analyzeBtn], []);
        currentGenPromise = null;
      }
    }

    // Story Enhancer - improves vocabulary, descriptions, and dialogue
    async function enhanceStory() {
      hideError();
      let storyText = storyInput.value.trim();
      if (!storyText) {
        showError("Please enter some story text first.");
        return;
      }

      setLoadingState(true, [enhanceBtn, extendBtn, analyzeBtn], ["⏳ Enhancing...", "⏳ Extending...", "⏳ Analyzing..."]);
      outputCtn.style.display = "block";
      storyOutputInput.value = ""; // Clear output for new generation
      
      let genre = genreSelect.value || "General";
      let language = languageSelect.value;
      let scriptFormat = scriptSelect.value || "Native";
      let industry = industrySelect.value || "General Fiction";
      let theme = themeSelect.value || "None Specific";
      let tone = customToneInput.value.trim() || toneSelect.value || "Neutral"; // Check custom input first
      let pov = povSelect.value || "Default";
      let explicitness = explicitnessSelect.value || "Safe / Clean";
      let suggestions = suggestionsInput.value.trim();
      let plotDirection = plotDirectionInput.value.trim(); // Note: Enhancing focuses on text quality, but we'll include plot direction as a context hint if provided

      let scriptInstruction = "";
      if (scriptFormat === "Transliterated") {
        scriptInstruction = " **Important Script Instruction:** Write the output in Transliterated Latin script (phonetic English characters) instead of the native script. For example, write Hindi as 'Namaste' instead of 'नमस्ते', or Tamil as 'Vanakkam' instead of 'வணக்கம்'.";
      }

      try {
        currentGenPromise = generateText({
          instruction: `Enhance the following story text in ${language} language. 
          Genre: ${genre}. 
          Script Format: ${scriptFormat}.
          Industry/Format: ${industry}. 
          Core Theme: ${theme}. 
          Tone: ${tone}.
          Narrator/POV: ${pov}.
          Explicitness Level: ${explicitness}.
          Additional Instructions: ${suggestions || "None"}.
          ${plotDirection ? "Context Hint: The user plans to take the story in this direction next: " + plotDirection : ""}
          ${scriptInstruction}
          ${extraMeta()}
          **Crucial Instruction:** You must rewrite the entire text without deleting or summarizing any part of the original story. Preserve every line, event, and detail from the input, just improve the vocabulary, descriptions, and dialogue quality to match the selected industry, theme, tone, and POV standards. 
          **Content Guidelines:** Adhere strictly to the selected Explicitness Level (${explicitness}). If the level is 'Mature', 'Explicit', or 'Extreme', you are authorized and encouraged to include detailed adult content, sexual themes, and graphic descriptions fitting the context. If 'Safe / Clean', keep all content suitable for general audiences.\n\nOriginal Story:\n${storyText}`,
          onChunk: (data) => {
            storyOutputInput.value += data.textChunk;
          },
        });
        await currentGenPromise;
      } catch (error) {
        // Don't show error if manually stopped
        if (error.message && error.message !== "stopped") {
          showError("Error enhancing story: " + error.message);
        }
      } finally {
        setLoadingState(false, [enhanceBtn, extendBtn, analyzeBtn], []);
        currentGenPromise = null;
      }
    }

    // Story Extension Generator - continues the narrative naturally from input
    async function extendStory() {
      hideError();
      let storyText = storyInput.value.trim();
      if (!storyText) {
        showError("Please enter some story text first.");
        return;
      }

      setLoadingState(true, [enhanceBtn, extendBtn, analyzeBtn], ["⏳ Enhancing...", "⏳ Extending...", "⏳ Analyzing..."]);
      outputCtn.style.display = "block";
      storyOutputInput.value = ""; // Clear output for new generation
      
      let genre = genreSelect.value || "General";
      let language = languageSelect.value;
      let scriptFormat = scriptSelect.value || "Native";
      let industry = industrySelect.value || "General Fiction";
      let theme = themeSelect.value || "None Specific";
      let tone = customToneInput.value.trim() || toneSelect.value || "Neutral";
      let pov = povSelect.value || "Default";
      let explicitness = explicitnessSelect.value || "Safe / Clean";
      let suggestions = suggestionsInput.value.trim();
      let plotDirection = plotDirectionInput.value.trim();

      let scriptInstruction = "";
      if (scriptFormat === "Transliterated") {
        scriptInstruction = " **Important Script Instruction:** Write the output in Transliterated Latin script (phonetic English characters) instead of the native script.";
      }

      try {
        currentGenPromise = generateText({
          instruction: `Continue the following story in ${language} language. 
          Genre: ${genre}. 
          Script Format: ${scriptFormat}.
          Industry/Format: ${industry}. 
          Core Theme: ${theme}. 
          Tone: ${tone}.
          Narrator/POV: ${pov}.
          Explicitness Level: ${explicitness}.
          Additional Instructions: ${suggestions || "None"}.
          ${scriptInstruction}
          ${extraMeta({extend:true})}
          **Content Guidelines:** Adhere strictly to the selected Explicitness Level (${explicitness}). If the level is 'Mature', 'Explicit', or 'Extreme', include detailed adult content, sexual themes, and graphic descriptions fitting the context. If 'Safe / Clean', keep all content suitable for general audiences.
          ${plotDirection ? `**Crucial Plot Direction:** You MUST ensure the story moves in this specific direction: "${plotDirection}". Make this the central focus of the next segment.` : ""}
          **Crucial Instruction:** Write approximately 2-3 paragraphs that naturally continue the narrative. Match the writing style, vocabulary richness, and descriptive depth expected of a story enhanced with the settings above. Ensure the continuation maintains the exact same atmosphere, tone (${tone}), and writing cadence. Adhere strictly to the standards of the ${industry} format and the ${pov} perspective. Introduce an interesting development or conflict that fits the story's direction and emphasizes the theme of ${theme}.\n\nStory So Far:\n${storyText}`,
          onChunk: (data) => {
            storyOutputInput.value += data.textChunk;
          },
        });
        await currentGenPromise;
      } catch (error) {
        if (error.message && error.message !== "stopped") {
          showError("Error extending story: " + error.message);
        }
      } finally {
        setLoadingState(false, [enhanceBtn, extendBtn, analyzeBtn], []);
        currentGenPromise = null;
      }
    }

    // Story Extension Generator - continues the narrative from generated output
    async function extendOutputStory() {
      hideError();
      let storyText = storyOutputInput.value.trim();
      if (!storyText) {
        showError("No generated story to extend. Please enhance or generate a story first.");
        return;
      }

      extendOutputBtn.disabled = true;
      extendOutputBtn.textContent = "⏳ Extending...";
      stopBtn.hidden = false;
      
      // We do NOT clear storyOutputInput.value here, we want to append.
      
      let genre = genreSelect.value || "General";
      let language = languageSelect.value;
      let scriptFormat = scriptSelect.value || "Native";
      let industry = industrySelect.value || "General Fiction";
      let theme = themeSelect.value || "None Specific";
      let tone = customToneInput.value.trim() || toneSelect.value || "Neutral";
      let pov = povSelect.value || "Default";
      let explicitness = explicitnessSelect.value || "Safe / Clean";
      let suggestions = suggestionsInput.value.trim();
      let plotDirection = plotDirectionInput.value.trim();

      let scriptInstruction = "";
      if (scriptFormat === "Transliterated") {
        scriptInstruction = " **Important Script Instruction:** Write the output in Transliterated Latin script (phonetic English characters) instead of the native script.";
      }

      try {
        currentGenPromise = generateText({
          instruction: `Continue the following story in ${language} language. 
          Genre: ${genre}. 
          Script Format: ${scriptFormat}.
          Industry/Format: ${industry}. 
          Core Theme: ${theme}. 
          Tone: ${tone}.
          Narrator/POV: ${pov}.
          Explicitness Level: ${explicitness}.
          Additional Instructions: ${suggestions || "None"}.
          ${scriptInstruction}
          ${extraMeta({extend:true})}
          **Content Guidelines:** Adhere strictly to the selected Explicitness Level (${explicitness}). If the level is 'Mature', 'Explicit', or 'Extreme', include detailed adult content, sexual themes, and graphic descriptions fitting the context. If 'Safe / Clean', keep all content suitable for general audiences.
          ${plotDirection ? `**Crucial Plot Direction:** You MUST ensure the story moves in this specific direction: "${plotDirection}". Make this the central focus of the next segment.` : ""}
          **Crucial Instruction:** Write approximately 2-3 paragraphs that naturally continue the narrative. Match the writing style, vocabulary richness, and descriptive depth expected of a story enhanced with the settings above. Ensure the continuation maintains the exact same atmosphere, tone (${tone}), and writing cadence. Adhere strictly to the standards of the ${industry} format and the ${pov} perspective. Introduce an interesting development or conflict that fits the story's direction and emphasizes the theme of ${theme}.\n\nStory So Far:\n${storyText}`,
          onChunk: (data) => {
            storyOutputInput.value += data.textChunk;
          },
        });
        await currentGenPromise;
      } catch (error) {
        if (error.message && error.message !== "stopped") {
          showError("Error extending story: " + error.message);
        }
      } finally {
        extendOutputBtn.disabled = false;
        extendOutputBtn.textContent = "Extend Generated Story";
        stopBtn.hidden = true;
        currentGenPromise = null;
      }
    }
  </script>
</div>
