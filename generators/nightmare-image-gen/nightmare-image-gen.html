<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>nightmare-image-gen — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<div id="app">
  <section class="hero">
    <div class="title-block">
      <div class="eyebrow">AI Image Generator</div>
      <h1>Nightmarish Image Generator</h1>
      <p>Describe anything. The generator will automatically twist your prompt into a darker, more surreal nightmare version.</p>
    </div>

    <div class="panel">
      <label class="field">
        <span>Prompt</span>
        <textarea id="promptInput" placeholder="Describe what you want to see..."></textarea>
      </label>

      <div class="grid">
        <label class="field">
          <span>Format</span>
          <select id="formatSelect" onchange="setImageFormat()">
            <option value="square512">Square 512x512</option>
            <option value="square768" selected>Square HD 768x768</option>
            <option value="portrait">Portrait 512x768</option>
            <option value="landscape">Landscape 768x512</option>
          </select>
        </label>

        <label class="field">
          <span>Images</span>
          <select id="countSelect" onchange="setImageCount()">
            <option value="1" selected>1 Image</option>
            <option value="2">2 Images</option>
            <option value="4">4 Images</option>
          </select>
        </label>
      </div>

      <button class="generate-btn" onclick="generateNightmare()">Generate</button>
    </div>
  </section>

  <section id="result" class="result">
    [output]
  </section>

  <section class="public-gallery-section">
    <button class="gallery-toggle" type="button" onclick="togglePublicGallery()">
      <span class="gallery-toggle-main">
        <span class="gallery-toggle-title" id="galleryToggleTitle">Public Gallery</span>
        <span class="gallery-toggle-subtitle" id="galleryToggleSubtitle">Show recent images shared from this generator</span>
      </span>

      <span class="gallery-toggle-icon" id="galleryToggleIcon">+</span>
    </button>

    <div id="publicGalleryPanel" class="public-gallery-panel" aria-hidden="true">
      <div class="public-gallery-header">
        <div class="public-gallery-title-block">
          <div class="public-gallery-eyebrow">Community Feed</div>
          <h2>Shared Nightmares</h2>
        </div>
      </div>

      <div class="public-gallery-frame-wrap">
        <iframe
          id="publicGalleryFrame"
          class="public-gallery-frame"
          title="Nightmarish Image Generator Public Gallery"
          loading="lazy"
          referrerpolicy="no-referrer"
        ></iframe>
      </div>
    </div>
  </section>
</div>

<script>
  const PUBLIC_GALLERY_CHANNEL = "nightmare-image-gen";

  function setImageFormat() {
    imageFormat = document.getElementById("formatSelect").value;
  }

  function setImageCount() {
    imageCount = Number(document.getElementById("countSelect").value);
  }

  function generateNightmare() {
    const promptInput = document.getElementById("promptInput");
    const prompt = promptInput.value.trim();

    if (!prompt) {
      promptInput.focus();
      return;
    }

    userPrompt = prompt;
    hasGenerated = "generated";
    setImageFormat();
    setImageCount();
    update();
  }

  function buildPublicGalleryUrl() {
    const params = new URLSearchParams({
      channel: PUBLIC_GALLERY_CHANNEL,
      subChannel: "public",
      sort: "recent",
      contentFilter: "g"
    });

    return "https://image-generation.perchance.org/gallery?" + params.toString();
  }

  function loadPublicGalleryFrame() {
    const frame = document.getElementById("publicGalleryFrame");

    if (!frame) return;

    const galleryUrl = buildPublicGalleryUrl();

    if (frame.getAttribute("src") !== galleryUrl) {
      frame.setAttribute("src", galleryUrl);
    }
  }

  function togglePublicGallery() {
    const panel = document.getElementById("publicGalleryPanel");
    const icon = document.getElementById("galleryToggleIcon");
    const title = document.getElementById("galleryToggleTitle");
    const subtitle = document.getElementById("galleryToggleSubtitle");

    if (!panel) return;

    const willOpen = !panel.classList.contains("open");

    panel.classList.toggle("open", willOpen);
    panel.setAttribute("aria-hidden", willOpen ? "false" : "true");

    if (icon) icon.textContent = willOpen ? "−" : "+";
    if (title) title.textContent = willOpen ? "Hide Public Gallery" : "Public Gallery";
    if (subtitle) subtitle.textContent = willOpen ? "Click again to collapse the recent community feed" : "Show recent images shared from this generator";

    if (willOpen) {
      loadPublicGalleryFrame();

      setTimeout(() => {
        panel.scrollIntoView({
          behavior: "smooth",
          block: "start"
        });
      }, 80);
    }
  }

  setImageFormat();
  setImageCount();
</script>

<style>
  :root {
    --bg: #0b0f14;
    --panel: #11161d;
    --panel-2: #171d25;
    --border: #2b3442;
    --text: #e7edf5;
    --muted: #9aa7b6;
    --accent: #b91c1c;
    --accent-2: #ef4444;
    --shadow: 0 20px 60px rgba(0,0,0,.35);
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background:
      radial-gradient(circle at top left, rgba(185,28,28,.22), transparent 34rem),
      radial-gradient(circle at bottom right, rgba(59,7,100,.22), transparent 32rem),
      var(--bg);
    color: var(--text);
    font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  #app {
    width: min(1100px, calc(100% - 32px));
    margin: 0 auto;
    padding: 32px 0 56px;
  }

  .hero {
    display: grid;
    grid-template-columns: 1fr 420px;
    gap: 24px;
    align-items: start;
  }

  .title-block {
    min-height: 330px;
    padding: 34px;
    border: 1px solid var(--border);
    border-radius: 24px;
    background:
      linear-gradient(135deg, rgba(17,22,29,.92), rgba(23,29,37,.72)),
      radial-gradient(circle at 20% 20%, rgba(239,68,68,.2), transparent 22rem);
    box-shadow: var(--shadow);
  }

  .eyebrow {
    margin-bottom: 12px;
    color: var(--accent-2);
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .18em;
    text-transform: uppercase;
  }

  h1 {
    margin: 0;
    max-width: 720px;
    font-size: clamp(38px, 6vw, 76px);
    line-height: .92;
    letter-spacing: -0.06em;
  }

  p {
    max-width: 680px;
    margin: 22px 0 0;
    color: var(--muted);
    font-size: 16px;
    line-height: 1.7;
  }

  .panel {
    padding: 18px;
    border: 1px solid var(--border);
    border-radius: 24px;
    background: rgba(17,22,29,.92);
    box-shadow: var(--shadow);
    backdrop-filter: blur(10px);
  }

  .field {
    display: grid;
    gap: 8px;
  }

  .field span {
    color: var(--muted);
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .08em;
    text-transform: uppercase;
  }

  textarea,
  select {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--panel-2);
    color: var(--text);
    outline: none;
    font: inherit;
  }

  textarea {
    min-height: 150px;
    resize: vertical;
    padding: 14px;
    line-height: 1.5;
  }

  select {
    height: 46px;
    padding: 0 12px;
    cursor: pointer;
  }

  textarea:focus,
  select:focus {
    border-color: rgba(239,68,68,.7);
    box-shadow: 0 0 0 4px rgba(239,68,68,.12);
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
    margin-top: 14px;
  }

  .generate-btn {
    width: 100%;
    height: 50px;
    margin-top: 16px;
    border: 0;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: white;
    font-weight: 900;
    letter-spacing: .08em;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 12px 28px rgba(185,28,28,.35);
  }

  .generate-btn:hover {
    filter: brightness(1.08);
    transform: translateY(-1px);
  }

  .result {
    width: 100%;
    margin-top: 24px;
    padding: 18px;
    border: 1px solid var(--border);
    border-radius: 24px;
    background: rgba(17,22,29,.72);
    box-shadow: var(--shadow);
    min-height: 260px;
    overflow: hidden;
  }

  .empty-state {
    display: grid;
    place-items: center;
    min-height: 220px;
    color: var(--muted);
    text-align: center;
    font-size: 15px;
    border: 1px dashed var(--border);
    border-radius: 18px;
    background: rgba(23,29,37,.45);
  }

  .image-grid {
    width: 100%;
    display: grid;
    gap: 18px;
    align-items: start;
    justify-items: center;
  }

  .image-grid.count-1 {
    grid-template-columns: minmax(0, 1fr);
  }

  .image-grid.count-2,
  .image-grid.count-4 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .image-card {
    width: 100%;
    min-width: 0;
    overflow: hidden;
    border-radius: 18px;
    background: rgba(11,15,20,.65);
    border: 1px solid var(--border);
    padding: 8px;
  }

  .image-grid.count-1 .image-card {
    max-width: 720px;
  }

  .image-grid.count-2 .image-card,
  .image-grid.count-4 .image-card {
    max-width: 520px;
  }

  .image-grid.format-portrait .image-card {
    max-width: 380px;
  }

  .image-grid.format-landscape.count-1 .image-card {
    max-width: 760px;
  }

  .image-grid.format-landscape.count-2 .image-card,
  .image-grid.format-landscape.count-4 .image-card {
    max-width: 520px;
  }

  .image-card,
  .image-card * {
    box-sizing: border-box !important;
  }

  .image-card img,
  .image-card canvas,
  .image-card video {
    display: block !important;
    width: 100% !important;
    height: auto !important;
    max-width: 100% !important;
    object-fit: contain !important;
    border-radius: 14px;
    margin: 0 auto !important;
  }

  .image-card [style] {
    max-width: 100% !important;
  }

  .public-gallery-section {
    margin-top: 24px;
  }

  .gallery-toggle {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    padding: 18px 20px;
    border: 1px solid rgba(239,68,68,.32);
    border-radius: 22px;
    background:
      linear-gradient(135deg, rgba(185,28,28,.18), rgba(17,22,29,.94)),
      radial-gradient(circle at top left, rgba(239,68,68,.2), transparent 24rem);
    color: var(--text);
    cursor: pointer;
    box-shadow: var(--shadow);
    text-align: left;
  }

  .gallery-toggle:hover {
    border-color: rgba(239,68,68,.62);
    filter: brightness(1.06);
  }

  .gallery-toggle-main {
    display: grid;
    gap: 4px;
    text-align: left;
  }

  .gallery-toggle-title {
    font-size: 15px;
    font-weight: 900;
    letter-spacing: .14em;
    text-transform: uppercase;
  }

  .gallery-toggle-subtitle {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.4;
  }

  .gallery-toggle-icon {
    width: 38px;
    height: 38px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
    border-radius: 999px;
    background: rgba(239,68,68,.16);
    border: 1px solid rgba(239,68,68,.38);
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 24px;
    font-weight: 700;
    line-height: 0;
    padding-bottom: 2px;
  }

  .public-gallery-panel {
    display: none;
    margin-top: 16px;
    padding: 18px;
    border: 1px solid var(--border);
    border-radius: 24px;
    background:
      linear-gradient(135deg, rgba(17,22,29,.92), rgba(11,15,20,.92)),
      radial-gradient(circle at bottom right, rgba(185,28,28,.12), transparent 26rem);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .public-gallery-panel.open {
    display: block;
    animation: galleryReveal .22s ease-out;
  }

  @keyframes galleryReveal {
    from {
      opacity: 0;
      transform: translateY(8px);
    }

    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .public-gallery-header {
    width: 100%;
    margin-bottom: 16px;
    text-align: left;
  }

  .public-gallery-title-block {
    width: 100%;
    min-width: 0;
    display: grid;
    justify-items: start;
    align-items: start;
    text-align: left;
  }

  .public-gallery-eyebrow {
    width: 100%;
    margin: 0 0 6px 0;
    padding: 0;
    color: var(--accent-2);
    font-size: 11px;
    font-weight: 900;
    letter-spacing: .18em;
    line-height: 1;
    text-align: left;
    text-transform: uppercase;
  }

  .public-gallery-header h2 {
    width: 100%;
    margin: 0;
    padding: 0;
    text-align: left;
    font-size: clamp(24px, 4vw, 42px);
    line-height: 1;
    letter-spacing: -0.04em;
  }

  .public-gallery-frame-wrap {
    overflow: hidden;
    border: 1px solid var(--border);
    border-radius: 18px;
    background: #0b0f14;
  }

  .public-gallery-frame {
    display: block;
    width: 100%;
    height: min(78vh, 780px);
    min-height: 520px;
    border: 0;
    background: #0b0f14;
  }

  @media (max-width: 900px) {
    .hero {
      grid-template-columns: 1fr;
    }

    .title-block {
      min-height: auto;
    }
  }

  @media (max-width: 700px) {
    .image-grid.count-1,
    .image-grid.count-2,
    .image-grid.count-4 {
      grid-template-columns: 1fr;
    }

    .image-grid.count-1 .image-card,
    .image-grid.count-2 .image-card,
    .image-grid.count-4 .image-card,
    .image-grid.format-portrait .image-card,
    .image-grid.format-landscape.count-1 .image-card,
    .image-grid.format-landscape.count-2 .image-card,
    .image-grid.format-landscape.count-4 .image-card {
      max-width: 100%;
    }

    .gallery-toggle {
      align-items: flex-start;
      padding: 16px;
    }

    .public-gallery-header {
      text-align: left;
    }

    .public-gallery-title-block,
    .public-gallery-eyebrow,
    .public-gallery-header h2 {
      text-align: left;
      justify-items: start;
    }

    .public-gallery-frame {
      min-height: 480px;
      height: 72vh;
    }
  }
</style>
</body>
</html>
