<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>j8mw1atzmm — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<style>
  :root { --bg:#0f1419; --card:#1a2332; --txt:#e7eef5; --user:#3b82f6; --ai:#2a3a4f; --bd:#2d3e54; --muted:#7a8a9e; }
  * { box-sizing:border-box; }
  body { font-family:system-ui,sans-serif; background:var(--bg); color:var(--txt); margin:0; display:flex; justify-content:center; }
  .ctn { width:100%; max-width:1400px; margin:0 auto; background:var(--card); display:flex; flex-direction:column; height:100dvh; }
  header { padding:12px 14px; border-bottom:1px solid var(--bd); display:flex; align-items:center; gap:8px; }
  header h1 { margin:0; font-size:1rem; font-weight:600; flex:1; }
  select, button, input { font:inherit; color:inherit; }
  select { padding:7px 8px; border-radius:8px; border:1px solid var(--bd); background:var(--bg); }
  .clr { background:#ef4444; border:none; border-radius:8px; padding:7px 10px; cursor:pointer; }
  .view { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:8px; }
  .box { display:none; flex-direction:column; gap:8px; }
  .box.active { display:flex; }
  .msg { max-width:70%; padding:10px 15px; border-radius:16px; font-size:1rem; line-height:1.5; white-space:pre-wrap; word-break:break-word; }
  .msg.user { background:var(--user); align-self:flex-end; border-bottom-right-radius:4px; }
  .msg.ai { background:var(--ai); align-self:flex-start; border-bottom-left-radius:4px; }
  .msg img { max-width:100%; border-radius:8px; margin-top:6px; display:block; }
  .regen { display:block; margin-top:6px; padding:5px 10px; font-size:.8rem; background:var(--bg); border:1px solid var(--bd); border-radius:6px; cursor:pointer; color:var(--muted); }
  .regen:hover { color:var(--txt); border-color:var(--user); }
  .img-actions { display:flex; gap:6px; margin-top:6px; }
  .img-actions button { flex:1; padding:5px 10px; font-size:.8rem; background:var(--bg); border:1px solid var(--bd); border-radius:6px; cursor:pointer; color:var(--muted); }
  .img-actions button:hover { color:var(--txt); border-color:var(--user); }
  .prompt-edit { width:100%; margin-top:6px; padding:8px; font-size:.82rem; font-family:inherit; background:var(--bg); color:var(--txt); border:1px solid var(--user); border-radius:6px; resize:vertical; min-height:60px; }
  .prompt-edit-actions { display:flex; gap:6px; margin-top:4px; }
  .mood-badge { float:right; margin-left:6px; font-size:1.1rem; opacity:.85; }
  .empty { color:var(--muted); text-align:center; margin:auto; font-size:.9rem; padding:20px; font-style:italic; }
  .ctrl { padding:10px; border-top:1px solid var(--bd); display:flex; gap:6px; align-items:center; }
  .ctrl input { flex:1; padding:10px 12px; border-radius:10px; border:1px solid var(--bd); background:var(--bg); }
  .ctrl button { padding:10px 12px; border-radius:10px; border:none; cursor:pointer; }
  #sendBtn { background:var(--user); }
  .cam { background:var(--bg); border:1px solid var(--bd); }
  .dot { display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--muted); margin:0 2px; animation:b .8s infinite; }
  .dot:nth-child(2){animation-delay:.2s} .dot:nth-child(3){animation-delay:.4s}
  @keyframes b { 0%,60%,100%{opacity:.3} 30%{opacity:1} }
</style>

<div class="ctn">
  <header>
    <select id="charSelect" onchange="switchChar()"></select>
    <h1>💬</h1>
    <button class="clr" onclick="clearChat()">🗑️</button>
  </header>
  <div class="view" id="v"></div>
  <div class="ctrl">
    <button class="cam" onclick="shot()">📸</button>
    <input id="i" placeholder="พิมพ์ข้อความ..." autocomplete="off">
    <button id="sendBtn" onclick="send()">➤</button>
  </div>
</div>

<script>
(async () => {
  const IMG_OPT = { resolution:"768x512", negativePrompt:"low quality, worst quality, bad anatomy, bad hands, text, watermark, blurry, deformed, extra limbs, missing fingers, lowres, ugly, distorted face" };
  const MOOD_LIST = ["neutral","happy","sad","angry","shy","excited"];
  const MOOD_EMOJI = { neutral:"😐", happy:"😊", sad:"😢", angry:"😠", shy:"😳", excited:"🤩" };
  const CHARS = {
    mika:    { name:"Mika",    prompt:"mika (blue archive), pink hair, golden eyes",     user:"a 40-year-old man with aging skin", base:"You meet Mika in church." },
    shiroko: { name:"Shiroko", prompt:"shiroko (blue archive), grey hair, blue eyes, wolf ears", user:"a 40-year-old man with aging skin", base:"You meet Shiroko on the street." }
  };
  let cur = "mika", db, hist = {}, chatBusy = false, imgBusy = false;
  Object.keys(CHARS).forEach(k => hist[k] = CHARS[k].base);
  const $ = id => document.getElementById(id);
  const ai = (...a) => root.ai(...a), img = (...a) => root.image(...a);

  Object.keys(CHARS).forEach(k => $("charSelect").add(new Option(CHARS[k].name, k)));

  const req = indexedDB.open("ChatDB", 1);
  req.onupgradeneeded = e => e.target.result.createObjectStore("chats", {keyPath:"id"});
  req.onsuccess = e => { db = e.target.result; init(); };

  function init() {
    Object.keys(CHARS).forEach(k => {
      let b = document.createElement("div"); b.id = "b-"+k; b.className = "box";
      b.innerHTML = `<div class="empty">${CHARS[k].base}</div>`;
      $("v").appendChild(b);
      load(k);
    });
    $("b-"+cur).classList.add("active");
  }

  function load(k) {
    return new Promise(res => {
      let tx = db.transaction("chats","readonly").objectStore("chats").get(k);
      tx.onsuccess = e => { let r = e.target.result; if (r) { hist[k] = r.history; $("b-"+k).innerHTML = r.html || ""; } res(); };
      tx.onerror = () => res();
    });
  }

  function save(k) {
    let r = db.transaction("chats","readwrite").objectStore("chats").put({id:k, history:hist[k], html:$("b-"+k).innerHTML});
    r.onerror = () => console.error("save failed:", k);
  }

  async function switchChar() {
    if (chatBusy) return;
    $("b-"+cur).classList.remove("active");
    cur = $("charSelect").value;
    $("b-"+cur).classList.add("active");
    await load(cur);
    scroll();
  }

  function clearChat() {
    if (!confirm("ลบแชทของ "+CHARS[cur].name+"?")) return;
    hist[cur] = CHARS[cur].base;
    $("b-"+cur).innerHTML = `<div class="empty">${CHARS[cur].base}</div>`;
    db.transaction("chats","readwrite").objectStore("chats").delete(cur);
  }

  const atBottom = () => { let v=$("v"); return v.scrollHeight - v.scrollTop - v.clientHeight < 80; };
  const scroll = () => { $("v").scrollTop = $("v").scrollHeight; };

  function bubble(box, txt, type) {
    let d = document.createElement("div"); d.className = "msg "+type; d.textContent = txt;
    box.appendChild(d); if (atBottom()) scroll(); return d;
  }
  function loading(box) {
    let d = document.createElement("div"); d.className = "msg ai";
    d.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
    box.appendChild(d); scroll(); return d;
  }

  async function send() {
    if (chatBusy) return;
    let val = $("i").value.trim(); if (!val) return;
    $("i").value = ""; chatBusy = true; $("sendBtn").style.opacity = .5;
    let box = $("b-"+cur);
    bubble(box, val, "user");
    hist[cur] += "\nuser: " + val;
    generateImg(box);
    let ab = loading(box), txt = "";
    try {
      await ai({
        instruction: `You are ${CHARS[cur].name}. The user is ${CHARS[cur].user}. Reply in character, short and natural.\nHistory:\n${hist[cur]}\n\nRespond in EXACTLY this format:\n<reply>your chat reply</reply>\n<mood>a single digit 0-5 where 0=neutral 1=happy 2=sad 3=angry 4=shy 5=excited</mood>`,
        onChunk: d => { txt += d.textChunk; ab.textContent = txt; if (atBottom()) scroll(); },
        onFinish: d => {
          txt = d.trim();
          let rm = txt.match(/<reply>([\s\S]*?)<\/reply>/i);
          let mm = txt.match(/<mood>([\s\S]*?)<\/mood>/i);
          txt = rm ? rm[1].trim() : txt;
          let num = mm ? parseInt(mm[1].trim()) : 0;
          if (isNaN(num) || num < 0 || num > 5) num = 0;
          let mood = MOOD_LIST[num];
          ab.textContent = txt;
          ab.dataset.mood = mood;
          let badge = document.createElement("span");
          badge.className = "mood-badge mood-" + mood;
          badge.textContent = MOOD_EMOJI[mood];
          ab.appendChild(badge);
          hist[cur] += "\n" + CHARS[cur].name + ": " + txt + " [" + mood + "]";
        }
      });
      hist[cur] = hist[cur].split("\n").slice(-20).join("\n");
      save(cur);
    } catch(e) { ab.textContent = "⚠️ ผิดพลาด"; }
    chatBusy = false; $("sendBtn").style.opacity = 1;
  }

  async function drawImg(box, prompt, ab) {
    ab.textContent = "🎨 วาดรูป...";
    let res = await img(prompt, IMG_OPT);
    let blob = await (await fetch(res.dataUrl)).blob();
    let r = await root.uploadPlugin(blob, {expires: Date.now()+1000*60*60*24*30});
    if (r.error) throw r.error;
    ab.innerHTML = "";
    let im = document.createElement("img"); im.src = r.url; ab.appendChild(im);
    let acts = document.createElement("div"); acts.className = "img-actions";
    let rb = document.createElement("button"); rb.textContent = "🔄 รีเจน"; rb.className = "regen-btn";
    let eb = document.createElement("button"); eb.textContent = "✏️ แก้ prompt"; eb.className = "edit-btn";
    acts.appendChild(rb); acts.appendChild(eb);
    ab.dataset.prompt = btoa(unescape(encodeURIComponent(prompt)));
    ab.appendChild(acts);
    save(cur);
  }

  async function generateImg(box) {
    if (imgBusy) return; imgBusy = true;
    let ab = loading(box);
    try {
      ab.textContent = "✍️ เขียน prompt...";
      let p = await ai(`Chat history:\n${hist[cur]}\nCharacter appearance: ${CHARS[cur].prompt}\nUser: ${CHARS[cur].user}\n\nWrite a vivid image prompt for the current scene. Include character full appearance, mood, setting, action. 300 char max, comma-separated tags, no symbols, no commentary.`);
      await drawImg(box, p.trim(), ab);
    } catch(e) { ab.textContent = "⚠️ วาดไม่สำเร็จ"; }
    if (atBottom()) scroll();
    imgBusy = false;
  }

  async function shot() {
    generateImg($("b-"+cur));
  }

  $("v").addEventListener("click", async e => {
    let btn = e.target.closest("button"); if (!btn) return;
    if (imgBusy) return;
    let msg = btn.closest(".msg"); if (!msg?.dataset.prompt) return;
    let box = $("b-"+cur);
    let prompt = decodeURIComponent(escape(atob(msg.dataset.prompt)));

    if (btn.classList.contains("regen-btn")) {
      imgBusy = true; btn.style.opacity = .5;
      try { await drawImg(box, prompt, msg); }
      catch { msg.textContent = "⚠️ วาดไม่สำเร็จ"; }
      if (atBottom()) scroll();
      imgBusy = false;
    } else if (btn.classList.contains("edit-btn")) {
      let ta = document.createElement("textarea"); ta.className = "prompt-edit"; ta.value = prompt;
      let ac = document.createElement("div"); ac.className = "prompt-edit-actions";
      let ok = document.createElement("button"); ok.textContent = "✅ วาดใหม่"; ok.className = "edit-ok";
      let cancel = document.createElement("button"); cancel.textContent = "❌ ยกเลิก"; cancel.className = "edit-cancel";
      ac.appendChild(ok); ac.appendChild(cancel);
      msg.querySelector(".img-actions").after(ta); ta.after(ac);
      ta.focus();
    } else if (btn.classList.contains("edit-ok")) {
      let ta = msg.querySelector(".prompt-edit");
      let newPrompt = ta.value.trim();
      if (!newPrompt) return;
      imgBusy = true; btn.style.opacity = .5;
      try { await drawImg(box, newPrompt, msg); }
      catch { msg.textContent = "⚠️ วาดไม่สำเร็จ"; }
      if (atBottom()) scroll();
      imgBusy = false;
    } else if (btn.classList.contains("edit-cancel")) {
      msg.querySelector(".prompt-edit")?.remove();
      msg.querySelector(".prompt-edit-actions")?.remove();
    }
  });

  $("i").addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing) send(); });

  window.switchChar = switchChar; window.clearChat = clearChat; window.send = send; window.shot = shot;
})();
</script>

</body>
</html>
