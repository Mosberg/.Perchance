<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>multi-gallery-viewer — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<div>
  <button id="mgvReopenBtn" style="position: fixed; top: 24px; left: 24px; z-index: 1; padding: 10px 18px; border-radius: 6px; background: #1a1a1a; color: #e0e0e0; border: 1px solid rgba(255,255,255,0.2); font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 14px; cursor: pointer;">
    Open Gallery Viewer
  </button>
  <script>
    // Create a single shared viewer instance and open it immediately
    // Reused by the reopen button so closing/reopening doesn't spawn a second viewer
    let viewer = MultiGalleryViewer();
    viewer.show();
    document.getElementById('mgvReopenBtn').addEventListener('click', () => viewer.show());
  </script>
</div>
</body>
</html>
