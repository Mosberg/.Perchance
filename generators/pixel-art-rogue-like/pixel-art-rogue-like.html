// ===========================
// CONFIG DAS ONDAS — edite aqui para customizar cada onda
// Tipos: "shooter" (atira), "tough" (atirador forte), "cubum" (quica/dasa), "spreader" (tiro espalhado)
// ===========================
const WAVE_CONFIG = [
  { shooter: 4, tough: 0, cubum: 0, spreader: 0, snake: 0 },
  { shooter: 4, tough: 1, cubum: 0, spreader: 1, snake: 0 },
  { shooter: 5, tough: 1, cubum: 1, spreader: 1, snake: 1 },
  { shooter: 5, tough: 2, cubum: 1, spreader: 1, snake: 1 },
  { shooter: 6, tough: 2, cubum: 2, spreader: 2, snake: 2 },
];

function getWaveConfig(n) {
  if (n <= WAVE_CONFIG.length) return WAVE_CONFIG[n - 1];
  // fórmula automática para ondas além do config
  return {
    shooter: 4 + Math.floor(n * 1.2),
    tough: Math.floor(n / 2),
    cubum: Math.floor(n / 3),
    spreader: Math.floor(n / 2),
    snake: Math.floor(n / 2),
  };
}

function startWave(n) {
  const cfg = getWaveConfig(n);
  monstersToSpawn = cfg.shooter || 0;
  toughsToSpawn = cfg.tough || 0;
  cubumsToSpawn = cfg.cubum || 0;
  spreadersToSpawn = cfg.spreader || 0;
  snakesToSpawn = cfg.snake || 0;
  spawnTimer = 20;
  waveBreakTimer = 0;
}

    hp: 5,
    maxHp: 5,
    segCount: 4,
    segments: [],

    m.segments.push({ x: m.x - (i + 1) * SNAKE_SEG_DIST, y: m.y, angle: ang });

}

// --- upgrades (roguelike) ---
const UPGRADES = [
  { name: "Dano +1", desc: "Pistola: tiro causa mais dano", weight: 10, gunOnly: true, apply: () => { player.damage += 1; } },
  { name: "Cadência +", desc: "Atira mais rápido", weight: 10, apply: () => { player.fireRate = Math.max(3, player.fireRate - 2); player.laserFireRate = Math.max(8, player.laserFireRate - 3); } },

  { name: "Arma Laser", desc: "Troca para um raio laser poderoso (recarga lenta)", weight: 5, gunOnly: true, apply: () => { player.weapon = "laser"; } },
  { name: "Arma Pistola", desc: "Volta para a pistola padrão", weight: 5, laserOnly: true, apply: () => { player.weapon = "gun"; } },
  { name: "Laser Mais Largo", desc: "Laser: aumenta a largura do raio", weight: 9, laserOnly: true, apply: () => { player.laserWidth += 6; } },
  { name: "Recarga Rápida", desc: "Laser: diminui o tempo de recarga", weight: 9, laserOnly: true, apply: () => { player.laserFireRate = Math.max(8, player.laserFireRate - 4); } },
  { name: "Dano Laser +", desc: "Laser: aumenta o dano", weight: 8, laserOnly: true, apply: () => { player.laserDamage += 1; } },
];

let upgradeChoices = [];
let upgradeHover = -1;
const takenOnce = new Set();

function rollUpgrades() {
  const pool = UPGRADES.filter(u => {
    if (u.once && takenOnce.has(u)) return false;
    if (u.gunOnly && player.weapon === "laser") return false;
    if (u.laserOnly && player.weapon === "gun") return false;
    return true;
  }).map(u => ({ ...u }));
  upgradeChoices = [];
  for (let i = 0; i < 3 && pool.length; i++) {
    const totalW = pool.reduce((s, u) => s + u.weight, 0);
    let r = Math.random() * totalW;
    let idx = 0;
    for (let j = 0; j < pool.length; j++) {
      r -= pool[j].weight;
      if (r <= 0) { idx = j; break; }
    }
    upgradeChoices.push(pool.splice(idx, 1)[0]);
  }
}

// --- input ---
const keys = {};
window.addEventListener("keydown", (e) => {
  keys[e.code] = true;
  if (["ArrowLeft", "ArrowRight", "ArrowUp", "Space"].includes(e.code)) e.preventDefault();
  if (e.code === "ArrowUp" || e.code === "Space") {
    if (player.onGround && state === GameState.PLAYING) {
      player.vy = -JUMP_FORCE;
      player.onGround = false;
    }
  }
  if (e.code === "KeyR" && state === GameState.GAMEOVER) restart();
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

let mouseX = 0, mouseY = 0;
canvas.addEventListener("mousemove", (e) => {
  const rect = canvas.getBoundingClientRect();
  mouseX = (e.clientX - rect.left) * (canvas.width / rect.width);
  mouseY = (e.clientY - rect.top) * (canvas.height / rect.height);
});
canvas.addEventListener("mousedown", (e) => {
  const rect = canvas.getBoundingClientRect();
  mouseX = (e.clientX - rect.left) * (canvas.width / rect.width);
  mouseY = (e.clientY - rect.top) * (canvas.height / rect.height);
  if (state === GameState.PLAYING) {
    if (player.shootCooldown <= 0) shoot();
  } else if (state === GameState.UPGRADE) {
    const cards = upgradeCardRects();
    for (let i = 0; i < cards.length; i++) {
      const c = cards[i];
      if (mouseX >= c.x && mouseX <= c.x + c.w && mouseY >= c.y && mouseY <= c.y + c.h) {
        upgradeChoices[i].apply();
        if (upgradeChoices[i].once) takenOnce.add(UPGRADES.find(u => u.name === upgradeChoices[i].name));
        state = GameState.PLAYING;
        wave++;
        startWave(wave);
        return;
      }
    }
  } else if (state === GameState.GAMEOVER) {
    restart();
  }
});

function pointToSegmentDist(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const len2 = dx*dx + dy*dy;
  if (len2 === 0) return Math.hypot(px - x1, py - y1);
  let t = ((px - x1) * dx + (py - y1) * dy) / len2;
  t = Math.max(0, Math.min(1, t));
  const cx = x1 + t * dx, cy = y1 + t * dy;
  return Math.hypot(px - cx, py - cy);
}

let laserBeam = null;

function shoot() {
  if (player.weapon === "laser") { shootLaser(); return; }
  const cx = player.x + player.w / 2;
  const cy = player.y + player.h / 2;
  const dx = mouseX - cx;
  const dy = mouseY - cy;
  const dist = Math.hypot(dx, dy) || 1;
  const baseAng = Math.atan2(dy, dx);
  const spread = 0.18;
  const n = player.multishot;
  const start = -(n - 1) / 2;
  for (let i = 0; i < n; i++) {
    const ang = baseAng + (start + i) * spread;
    playerBullets.push({
      x: cx, y: cy,
      vx: Math.cos(ang) * player.bulletSpeed,
      vy: Math.sin(ang) * player.bulletSpeed,
      r: player.bulletRadius,
      damage: player.damage,
      homing: player.homing,
    });
  }
  player.shootCooldown = player.fireRate;
  if (dx < 0) player.facing = -1;
  else if (dx > 0) player.facing = 1;
}

function shootLaser() {
  const cx = player.x + player.w / 2;
  const cy = player.y + player.h / 2;
  const dx = mouseX - cx, dy = mouseY - cy;
  const dist = Math.hypot(dx, dy) || 1;
  const dirX = dx / dist, dirY = dy / dist;
  const reach = Math.max(canvas.width, canvas.height) * 2;
  const ex = cx + dirX * reach;
  const ey = cy + dirY * reach;
  laserBeam = { x1: cx, y1: cy, x2: ex, y2: ey, life: 10, maxLife: 10, width: player.laserWidth };
  const halfW = player.laserWidth / 2;
  for (let j = monsters.length - 1; j >= 0; j--) {
    const m = monsters[j];
    const mcx = m.x + m.w / 2, mcy = m.y + m.h / 2;
    const mr = Math.max(m.w, m.h) / 2;
    if (m.type === "snake") {
      if (pointToSegmentDist(mcx, mcy, cx, cy, ex, ey) < halfW + mr) {
        m.hp -= player.laserDamage;
        spawnParticles(mcx, mcy, "#2ecc71", 6);
        if (m.hp <= 0) {
          spawnParticles(mcx, mcy, "#2ecc71", 24);
          score += 50;
          monsters.splice(j, 1);
        }
        continue;
      }
      for (let k = m.segments.length - 1; k >= 0; k--) {
        const s = m.segments[k];
        if (pointToSegmentDist(s.x, s.y, cx, cy, ex, ey) < halfW + SNAKE_BODY_SIZE / 2) {
          m.segCount = Math.max(0, m.segCount - 1);
          spawnParticles(s.x, s.y, "#2ecc71", 6);
        }
      }
      continue;
    }
    if (pointToSegmentDist(mcx, mcy, cx, cy, ex, ey) < halfW + mr) {
      m.hp -= player.laserDamage;
      spawnParticles(mcx, mcy, "#00e5ff", 6);
      if (m.hp <= 0) {
        spawnParticles(mcx, mcy, "#00e5ff", 14);
        score += m.type === "cubum" ? 25 : (m.type === "spreader" ? 20 : (m.tough ? 30 : 10));
        monsters.splice(j, 1);
      }
    }
  }
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    if (pointToSegmentDist(b.x, b.y, cx, cy, ex, ey) < halfW + b.r) {
      spawnParticles(b.x, b.y, "#00e5ff", 4);
      bullets.splice(i, 1);
    }
  }
  player.shootCooldown = player.laserFireRate;
  if (dx < 0) player.facing = -1;
  else if (dx > 0) player.facing = 1;
}

function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = 1 + Math.random() * 3;
    particles.push({
      x, y,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd,
      life: 20 + Math.random() * 15,
      maxLife: 35,
      color,
      r: 2 + Math.random() * 2,
    });
  }
}

function restart() {
  wave = 1; score = 0;
  monsters.length = 0; bullets.length = 0; playerBullets.length = 0; particles.length = 0; laserBeam = null;
  player.maxHp = 5; player.hp = 5;
  player.moveSpeed = 3; player.fireRate = 12; player.damage = 1;
  player.bulletSpeed = 8; player.bulletRadius = 4; player.multishot = 1; player.homing = 0;
  player.shield = 0; player.shieldHp = 0; player.shieldMaxHp = 0; player.shieldRegenChance = 0; player.shieldRegenTimer = 0;
  player.weapon = "gun"; player.laserWidth = 10; player.laserDamage = 3; player.laserFireRate = 28;
  laserBeam = null;
  resetPlayer();
  takenOnce.clear();
  startWave(wave);
  state = GameState.PLAYING;
}

function update() {
  if (state !== GameState.PLAYING) return;

  // input
  let moving = false;
  if (keys["ArrowLeft"] || keys["KeyA"]) {
    player.vx = -player.moveSpeed; player.facing = -1; moving = true;
  } else if (keys["ArrowRight"] || keys["KeyD"]) {
    player.vx = player.moveSpeed; player.facing = 1; moving = true;
  } else {
    player.vx = 0;
  }

  player.vy += GRAVITY;
  player.x += player.vx;
  player.y += player.vy;

  const gy = ground.y - player.h;
  if (player.y >= gy) { player.y = gy; player.vy = 0; player.onGround = true; }

  if (player.x < 0) player.x = 0;
  if (player.x + player.w > canvas.width) player.x = canvas.width - player.w;

  if (moving && player.onGround) {
    player.frameTimer++;
    if (player.frameTimer >= 8) { player.frameTimer = 0; player.frame = (player.frame + 1) % FRAME_COUNT; }
  } else { player.frame = 0; player.frameTimer = 0; }

  // spawn monsters during wave
  if (monstersToSpawn > 0 || cubumsToSpawn > 0 || spreadersToSpawn > 0 || toughsToSpawn > 0 || snakesToSpawn > 0) {
    spawnTimer--;
    if (spawnTimer <= 0) {
      const r = Math.random();
      if (toughsToSpawn > 0 && r < 0.2) {
        spawnMonster(true); toughsToSpawn--;
      } else if (spreadersToSpawn > 0 && r < 0.4) {
        spawnSpreader(); spreadersToSpawn--;
      } else if (cubumsToSpawn > 0 && r < 0.6) {
        spawnCubum(); cubumsToSpawn--;
      } else if (snakesToSpawn > 0 && r < 0.75) {
        spawnSnake(); snakesToSpawn--;
      } else if (monstersToSpawn > 0) {
        spawnMonster(); monstersToSpawn--;
      } else {
        if (toughsToSpawn > 0) { spawnMonster(true); toughsToSpawn--; }
        else if (spreadersToSpawn > 0) { spawnSpreader(); spreadersToSpawn--; }
        else if (cubumsToSpawn > 0) { spawnCubum(); cubumsToSpawn--; }
        else if (snakesToSpawn > 0) { spawnSnake(); snakesToSpawn--; }
      }
      spawnTimer = 8 + Math.random() * 12;
    }
  } else if (monsters.length === 0) {
    if (waveBreakTimer === 0) waveBreakTimer = 90;
    waveBreakTimer--;
    if (waveBreakTimer <= 0) {
      rollUpgrades();
      state = GameState.UPGRADE;
    }
  }

  // monster update
  for (let i = monsters.length - 1; i >= 0; i--) {
    const m = monsters[i];
    if (m.type === "shooter") {
      updateShooter(m);
    } else if (m.type === "cubum") {
      updateCubum(m);
    } else if (m.type === "spreader") {
      updateSpreader(m);
    } else if (m.type === "snake") {
      updateSnake(m);
    }
  }

  // enemy bullets
  if (player.invuln > 0) player.invuln--;
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx; b.y += b.vy;
    if (b.y > canvas.height || b.x < 0 || b.x > canvas.width || b.y < 0) { bullets.splice(i, 1); continue; }
    // collision with player bullets
    let destroyed = false;
    for (let j = playerBullets.length - 1; j >= 0; j--) {
      const pb = playerBullets[j];
      if (Math.hypot(b.x - pb.x, b.y - pb.y) < b.r + pb.r) {
        spawnParticles(b.x, b.y, "#e67e22", 4);
        playerBullets.splice(j, 1);
        destroyed = true;
        break;
      }
    }
    if (destroyed) { bullets.splice(i, 1); continue; }
    const cx = player.x + player.w / 2, cy = player.y + player.h / 2;
    // shield collision
    const shieldR = player.w * 0.85;
    if (player.shield && player.shieldHp > 0 && Math.hypot(b.x - cx, b.y - cy) < shieldR + b.r) {
      player.shieldHp--;
      spawnParticles(b.x, b.y, "#3498db", 6);
      bullets.splice(i, 1);
      if (player.shieldHp <= 0) {
        player.shield = 0;
        spawnParticles(cx, cy, "#3498db", 16);
        player.shieldRegenTimer = 180;
      }
      continue;
    }
    if (player.invuln <= 0 && Math.hypot(b.x - cx, b.y - cy) < player.w / 2 + b.r) {
      player.hp--;
      player.invuln = 60;
      spawnParticles(b.x, b.y, "#c0392b", 6);
      bullets.splice(i, 1);
      if (player.hp <= 0) { state = GameState.GAMEOVER; }
    }
  }

  // player bullets
  for (let i = playerBullets.length - 1; i >= 0; i--) {
    const b = playerBullets[i];
    if (b.homing > 0 && monsters.length > 0) {
      let best = null, bestD = Infinity;
      for (const m of monsters) {
        const d = Math.hypot((m.x + m.w / 2) - b.x, (m.y + m.h / 2) - b.y);
        if (d < bestD) { bestD = d; best = m; }
      }
      if (best) {
        const tx = (best.x + best.w / 2) - b.x;
        const ty = (best.y + best.h / 2) - b.y;
        const td = Math.hypot(tx, ty) || 1;
        const steer = b.homing;
        b.vx += (tx / td) * steer;
        b.vy += (ty / td) * steer;
        const spd = Math.hypot(b.vx, b.vy) || 1;
        const maxSpd = player.bulletSpeed;
        if (spd > maxSpd) { b.vx = (b.vx / spd) * maxSpd; b.vy = (b.vy / spd) * maxSpd; }
      }
    }
    b.x += b.vx; b.y += b.vy;
    if (b.y > canvas.height || b.x < 0 || b.x > canvas.width || b.y < 0) { playerBullets.splice(i, 1); continue; }
    for (let j = monsters.length - 1; j >= 0; j--) {
      const m = monsters[j];
      if (m.type === "snake") {
        if (b.x > m.x && b.x < m.x + m.w && b.y > m.y && b.y < m.y + m.h) {
          m.hp -= b.damage;
          spawnParticles(b.x, b.y, "#2ecc71", 4);
          playerBullets.splice(i, 1);
          if (m.hp <= 0) {
            spawnParticles(m.x + m.w / 2, m.y + m.h / 2, "#2ecc71", 24);
            score += 50;
            monsters.splice(j, 1);
          }
          break;
        }
        let hit = false;
        for (let k = 0; k < m.segments.length; k++) {
          const s = m.segments[k];
          if (Math.hypot(b.x - s.x, b.y - s.y) < SNAKE_BODY_SIZE / 2) {
            m.segCount = Math.max(0, m.segCount - 1);
            spawnParticles(s.x, s.y, "#2ecc71", 8);
            hit = true;
            break;
          }
        }
        if (hit) { playerBullets.splice(i, 1); break; }
        continue;
      }
      if (b.x > m.x && b.x < m.x + m.w && b.y > m.y && b.y < m.y + m.h) {
        m.hp -= b.damage;
        spawnParticles(b.x, b.y, "#f1c40f", 4);
        playerBullets.splice(i, 1);
        if (m.hp <= 0) {
          spawnParticles(m.x + m.w / 2, m.y + m.h / 2, m.type === "cubum" ? "#7f8c8d" : "#8e44ad", 12);
          score += m.type === "cubum" ? 25 : (m.type === "spreader" ? 20 : (m.tough ? 30 : 10));
          monsters.splice(j, 1);
        }
        break;
      }
    }
  }

  // particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vx *= 0.92; p.vy *= 0.92;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }

  if (laserBeam) { laserBeam.life--; if (laserBeam.life <= 0) laserBeam = null; }

  if (player.shootCooldown > 0) player.shootCooldown--;

  // shield auto-regen
  if (!player.shield && player.shieldRegenChance > 0) {
    if (player.shieldRegenTimer > 0) {
      player.shieldRegenTimer--;
    } else if (Math.random() < player.shieldRegenChance * 0.01) {
      player.shield = 1;
      player.shieldHp = player.shieldMaxHp;
      spawnParticles(player.x + player.w / 2, player.y + player.h / 2, "#3498db", 12);
    }
  }
}

function updateSnake(m) {
  const spd = Math.hypot(m.vx, m.vy) || 1;
  m.vx = (m.vx / spd) * m.speed;
  m.vy = (m.vy / spd) * m.speed;
  m.x += m.vx;
  m.y += m.vy;

  const maxX = canvas.width - m.w;
  const maxY = canvas.height - ground.h - m.h;
  if (m.x <= 0) { m.x = 0; m.vx = Math.abs(m.vx); }
  if (m.x >= maxX) { m.x = maxX; m.vx = -Math.abs(m.vx); }
  if (m.y <= 0) { m.y = 0; m.vy = Math.abs(m.vy); }
  if (m.y >= maxY) { m.y = maxY; m.vy = -Math.abs(m.vy); }

  m.angle = Math.atan2(m.vy, m.vx);
  m.headAngle = m.angle;

  if (!m.trail) m.trail = [];
  m.trail.unshift({ x: m.x + m.w / 2, y: m.y + m.h / 2, angle: m.angle });
  if (m.trail.length > 500) m.trail.length = 500;

  m.segments = [];
  let acc = 0;
  let segIdx = 1;
  for (let t = 1; t < m.trail.length && segIdx <= m.segCount; t++) {
    const a = m.trail[t - 1], b = m.trail[t];
    const d = Math.hypot(b.x - a.x, b.y - a.y);
    while (acc + d >= SNAKE_SEG_DIST * segIdx && segIdx <= m.segCount) {
      const want = SNAKE_SEG_DIST * segIdx;
      const f = (want - acc) / (d || 1);
      m.segments.push({
        x: a.x + (b.x - a.x) * f,
        y: a.y + (b.y - a.y) * f,
        angle: b.angle,
      });
      segIdx++;
    }
    acc += d;
  }
  while (m.segments.length < m.segCount) {
    const last = m.trail[m.trail.length - 1] || { x: m.x, y: m.y, angle: m.angle };
    m.segments.push({ x: last.x, y: last.y, angle: last.angle });
  }
  while (m.segments.length > m.segCount) m.segments.pop();

  if (m.hitCooldown > 0) m.hitCooldown--;
  const pcx = player.x + player.w / 2, pcy = player.y + player.h / 2;
  const hcx = m.x + m.w / 2, hcy = m.y + m.h / 2;
  if (player.shield && player.shieldHp > 0 && Math.hypot(hcx - pcx, hcy - pcy) < player.w * 0.85 + m.w / 2) {
    player.shield = 0; player.shieldHp = 0;
    spawnParticles(pcx, pcy, "#3498db", 20);
    player.shieldRegenTimer = 180;
  }
  if (m.hitCooldown <= 0) {
    let hit = Math.hypot(hcx - pcx, hcy - pcy) < (m.w + player.w) / 2;
    if (!hit) {
      for (const s of m.segments) {
        if (Math.hypot(s.x - pcx, s.y - pcy) < (SNAKE_BODY_SIZE + player.w) / 2) { hit = true; break; }
      }
    }
    if (hit) {
      m.segCount++;
      m.hitCooldown = 50;
      if (player.invuln <= 0) {
        player.hp--;
        player.invuln = 60;
        spawnParticles(pcx, pcy, "#c0392b", 8);
        if (player.hp <= 0) state = GameState.GAMEOVER;
      }
    }
  }
}

function updateShooter(m) {
  m.wobble += 0.04;
  m.x = m.baseX + Math.sin(m.wobble) * 40;
  m.y += Math.sin(m.wobble * 0.7) * 0.4;
  m.shootTimer--;
  if (m.shootTimer <= 0) {
    m.shootTimer = 70 + Math.random() * 80;
    const dx = (player.x + player.w / 2) - (m.x + m.w / 2);
    const dy = (player.y + player.h / 2) - (m.y + m.h / 2);
    const dist = Math.hypot(dx, dy) || 1;
    bullets.push({
      x: m.x + m.w / 2, y: m.y + m.h / 2,
      vx: (dx / dist) * m.shootSpeed,
      vy: (dy / dist) * m.shootSpeed,
      r: 5,
    });
  }
}

function updateSpreader(m) {
  m.wobble += 0.04;
  m.x = m.baseX + Math.sin(m.wobble) * 40;
  m.y += Math.sin(m.wobble * 0.7) * 0.4;

  // frame animation after shooting
  if (m.postShootTimer > 0) {
    m.postShootTimer--;
    if (m.postShootTimer <= 0) {
      m.frame = 0;
    }
  }

  m.shootTimer--;
  if (m.shootTimer <= 0) {
    m.shootTimer = 140 + Math.random() * 100;
    m.frame = 1;
    m.postShootTimer = 25;
    const dx = (player.x + player.w / 2) - (m.x + m.w / 2);
    const dy = (player.y + player.h / 2) - (m.y + m.h / 2);
    const baseAng = Math.atan2(dy, dx);
    const numShots = 5;
    const spread = 0.5;
    for (let i = 0; i < numShots; i++) {
      const ang = baseAng + (i - (numShots - 1) / 2) * spread;
      bullets.push({
        x: m.x + m.w / 2, y: m.y + m.h / 2,
        vx: Math.cos(ang) * m.shootSpeed,
        vy: Math.sin(ang) * m.shootSpeed,
        r: 5,
      });
    }
  }
}

function updateCubum(m) {
  const gy = ground.y - m.h;

  if (m.cubumState === "falling") {
    m.vy += GRAVITY;
    m.y += m.vy;
    if (m.y >= gy) {
      m.y = gy;
      m.vy = -m.vy * 0.55;
      m.bounceCount++;
      spawnParticles(m.x + m.w / 2, m.y + m.h, "#aaa", 5);
      if (Math.abs(m.vy) < 2 || m.bounceCount > 4) {
        m.vy = 0;
        m.y = gy;
        m.cubumState = "settling";
        m.waitTimer = 20;
      }
    }
  } else if (m.cubumState === "settling") {
    m.waitTimer--;
    if (m.waitTimer <= 0) {
      m.cubumState = "to_edge";
      m.dashDir = m.x < canvas.width / 2 ? -1 : 1;
    }
  } else if (m.cubumState === "to_edge") {
    m.x += m.dashDir * 1.5;
    if (m.x <= 0) { m.x = 0; m.dashDir = 1; m.cubumState = "waiting_edge"; m.waitTimer = 40; }
    else if (m.x + m.w >= canvas.width) { m.x = canvas.width - m.w; m.dashDir = -1; m.cubumState = "waiting_edge"; m.waitTimer = 40; }
  } else if (m.cubumState === "waiting_edge") {
    m.waitTimer--;
    if (m.waitTimer <= 0) {
      m.cubumState = "dashing";
    }
  } else if (m.cubumState === "dashing") {
    m.x += m.dashDir * m.dashSpeed;
    if (m.x <= 0) { m.x = 0; m.dashDir = 1; m.cubumState = "waiting_edge"; m.waitTimer = 40; }
    else if (m.x + m.w >= canvas.width) { m.x = canvas.width - m.w; m.dashDir = -1; m.cubumState = "waiting_edge"; m.waitTimer = 40; }
  }

  // animation (2 fps)
  m.frameTimer++;
  if (m.frameTimer >= CUBUM_ANIM_SPEED) {
    m.frameTimer = 0;
    m.frame = (m.frame + 1) % CUBUM_FRAME_COUNT;
  }

  // body collision with player
  const pcx = player.x + player.w / 2, pcy = player.y + player.h / 2;
  const mcx = m.x + m.w / 2, mcy = m.y + m.h / 2;
  // shield breaks instantly on cubum contact
  if (player.shield && player.shieldHp > 0 && Math.hypot(pcx - mcx, pcy - mcy) < player.w * 0.85 + m.w / 2) {
    player.shield = 0; player.shieldHp = 0;
    spawnParticles(pcx, pcy, "#3498db", 20);
    player.shieldRegenTimer = 180;
  }
  if (player.invuln <= 0 && Math.abs(pcx - mcx) < (player.w + m.w) / 2 && Math.abs(pcy - mcy) < (player.h + m.h) / 2) {
    player.hp--;
    player.invuln = 60;
    spawnParticles(pcx, pcy, "#c0392b", 8);
    player.vx = m.dashDir * 6;
    player.vy = -5;
    player.onGround = false;
    if (player.hp <= 0) { state = GameState.GAMEOVER; }
  }
}

function upgradeCardRects() {
  const cw = 200, ch = 240;
  const gap = 24;
  const totalW = upgradeChoices.length * cw + (upgradeChoices.length - 1) * gap;
  const sx = (canvas.width - totalW) / 2;
  const sy = (canvas.height - ch) / 2;
  return upgradeChoices.map((_, i) => ({ x: sx + i * (cw + gap), y: sy, w: cw, h: ch }));
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // background (darkened tile covering whole canvas)
  if (bgPattern) {
    ctx.fillStyle = bgPattern;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  } else {
    ctx.fillStyle = "#1a1a1a";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  // ground
  ground.y = canvas.height - ground.h;
  if (groundPattern) {
    ctx.fillStyle = groundPattern;
    ctx.fillRect(0, ground.y, canvas.width, ground.h);
  } else {
    ctx.fillStyle = "#4a7a3a";
    ctx.fillRect(0, ground.y, canvas.width, ground.h);
  }
  ctx.fillStyle = "rgba(0,0,0,0.35)";
  ctx.fillRect(0, ground.y, canvas.width, 6);

  // player
  ctx.save();
  const px = player.x + player.w / 2, py = player.y + player.h / 2;
  ctx.translate(px, py);
  ctx.scale(player.facing, 1);
  ctx.translate(-player.w / 2, -player.h / 2);
  if (player.invuln > 0 && Math.floor(player.invuln / 5) % 2 === 0) ctx.globalAlpha = 0.4;
  if (img.complete && img.naturalWidth) {
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(img, player.frame * FRAME_W, 0, FRAME_W, FRAME_H, 0, 0, player.w, player.h);
  } else {
    ctx.fillStyle = "#e74c3c";
    ctx.fillRect(0, 0, player.w, player.h);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // monsters
  for (const m of monsters) {
    if (m.type === "snake") {
      // draw body segments (tail to head)
      const hcx = m.x + m.w / 2, hcy = m.y + m.h / 2;
      let prevX = hcx, prevY = hcy;
      for (let k = 0; k < m.segments.length; k++) {
        const s = m.segments[k];
        ctx.save();
        ctx.translate(s.x, s.y);
        ctx.rotate(s.angle);
        if (snakeBodyImg.complete && snakeBodyImg.naturalWidth) {
          ctx.imageSmoothingEnabled = false;
          ctx.drawImage(snakeBodyImg, -SNAKE_BODY_SIZE/2, -SNAKE_BODY_SIZE/2, SNAKE_BODY_SIZE, SNAKE_BODY_SIZE);
        } else {
          ctx.fillStyle = "#2ecc71";
          ctx.fillRect(-SNAKE_BODY_SIZE/2, -SNAKE_BODY_SIZE/2, SNAKE_BODY_SIZE, SNAKE_BODY_SIZE);
        }
        ctx.restore();
        prevX = s.x; prevY = s.y;
      }
      // draw head (sprite points right, so rotate by headAngle)
      ctx.save();
      ctx.translate(hcx, hcy);
      ctx.rotate(m.headAngle);
      if (snakeHeadImg.complete && snakeHeadImg.naturalWidth) {
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(snakeHeadImg, -m.w/2, -m.h/2, m.w, m.h);
      } else {
        ctx.fillStyle = "#27ae60";
        ctx.fillRect(-m.w/2, -m.h/2, m.w, m.h);
      }
      ctx.restore();
      continue;
    }
    if (m.type === "cubum") {
      if (cubumImg.complete && cubumImg.naturalWidth) {
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(cubumImg, m.frame * CUBUM_FRAME_W, 0, CUBUM_FRAME_W, CUBUM_FRAME_H, m.x, m.y, m.w, m.h);
      } else {
        ctx.fillStyle = "#7f8c8d";
        ctx.fillRect(m.x, m.y, m.w, m.h);
      }
    } else {
      // rotate shooter/spreader sprite so its bottom points toward the player
      const mcx = m.x + m.w / 2, mcy = m.y + m.h / 2;
      const pcx = player.x + player.w / 2, pcy = player.y + player.h / 2;
      const ang = Math.atan2(pcy - mcy, pcx - mcx);
      ctx.save();
      ctx.translate(mcx, mcy);
      ctx.rotate(ang - Math.PI / 2);
      ctx.translate(-m.w / 2, -m.h / 2);
      const srcImg = m.type === "spreader" ? spreaderImg : monsterImg;
      if (srcImg.complete && srcImg.naturalWidth) {
        ctx.imageSmoothingEnabled = false;
        if (m.type === "spreader") {
          ctx.drawImage(srcImg, m.frame * SPREADER_FRAME_W, 0, SPREADER_FRAME_W, SPREADER_FRAME_H, 0, 0, m.w, m.h);
        } else {
          ctx.drawImage(srcImg, 0, 0, m.w, m.h);
        }
      } else {
        ctx.fillStyle = m.tough ? "#6c3483" : "#8e44ad";
        ctx.fillRect(0, 0, m.w, m.h);
      }
      ctx.restore();
    }
    // hp bar above
    if (m.type !== "snake" || m.hp < m.maxHp) {
      const bw = m.w, bh = 4;
      ctx.fillStyle = "rgba(0,0,0,0.6)";
      ctx.fillRect(m.x, m.y - 8, bw, bh);
      ctx.fillStyle = "#e74c3c";
      ctx.fillRect(m.x, m.y - 8, bw * (m.hp / m.maxHp), bh);
    }
  }

  // laser beam
  if (laserBeam) {
    const a = laserBeam.life / laserBeam.maxLife;
    ctx.strokeStyle = `rgba(0, 229, 255, ${0.3 * a})`;
    ctx.lineWidth = laserBeam.width * 2;
    ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(laserBeam.x1, laserBeam.y1); ctx.lineTo(laserBeam.x2, laserBeam.y2); ctx.stroke();
    ctx.strokeStyle = `rgba(0, 229, 255, ${a})`;
    ctx.lineWidth = laserBeam.width;
    ctx.beginPath(); ctx.moveTo(laserBeam.x1, laserBeam.y1); ctx.lineTo(laserBeam.x2, laserBeam.y2); ctx.stroke();
    ctx.strokeStyle = `rgba(255, 255, 255, ${a})`;
    ctx.lineWidth = Math.max(2, laserBeam.width / 3);
    ctx.beginPath(); ctx.moveTo(laserBeam.x1, laserBeam.y1); ctx.lineTo(laserBeam.x2, laserBeam.y2); ctx.stroke();
    ctx.lineCap = "butt";
  }

  // bullets
  ctx.fillStyle = "#c0392b";
  for (const b of bullets) { ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill(); }
  for (const b of playerBullets) {
    ctx.fillStyle = b.homing > 0 ? "#e67e22" : "#f1c40f";
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
  }

  // shield
  if (player.shield && player.shieldHp > 0) {
    const sx = player.x + player.w / 2, sy = player.y + player.h / 2;
    const sr = player.w * 0.85;
    ctx.strokeStyle = `rgba(52, 152, 219, ${0.4 + 0.3 * (player.shieldHp / player.shieldMaxHp)})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(sx, sy, sr, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = `rgba(52, 152, 219, ${0.1 + 0.08 * (player.shieldHp / player.shieldMaxHp)})`;
    ctx.fill();
  }

  // particles
  for (const p of particles) {
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // HUD
  drawHUD();

  if (state === GameState.UPGRADE) drawUpgradeScreen();
  if (state === GameState.GAMEOVER) drawGameOver();
}

function drawHUD() {
  // HP bar
  const barW = 160, barH = 18, barX = 16, barY = 16;
  ctx.fillStyle = "rgba(0,0,0,0.5)";
  ctx.fillRect(barX - 2, barY - 2, barW + 4, barH + 4);
  ctx.fillStyle = "#444";
  ctx.fillRect(barX, barY, barW, barH);
  ctx.fillStyle = player.hp > 2 ? "#e74c3c" : "#c0392b";
  ctx.fillRect(barX, barY, barW * (player.hp / player.maxHp), barH);
  ctx.fillStyle = "#fff";
  ctx.font = "bold 13px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText(`HP ${player.hp}/${player.maxHp}`, barX + barW / 2, barY + 13);

  // Wave & Score
  ctx.textAlign = "right";
  ctx.font = "bold 18px sans-serif";
  ctx.fillStyle = "#fff";
  ctx.fillText(`Onda ${wave}`, canvas.width - 16, 28);
  ctx.font = "bold 15px sans-serif";
  ctx.fillStyle = "#f1c40f";
  ctx.fillText(`Pontos ${score}`, canvas.width - 16, 50);

  // monsters left
  if (state === GameState.PLAYING) {
    ctx.textAlign = "right";
    ctx.font = "12px sans-serif";
    ctx.fillStyle = "#bbb";
    const left = monsters.length + monstersToSpawn + cubumsToSpawn + spreadersToSpawn + toughsToSpawn + snakesToSpawn;
    ctx.fillText(`Inimigos: ${left}`, canvas.width - 16, 68);
  }
}

function drawUpgradeScreen() {
  ctx.fillStyle = "rgba(0,0,0,0.7)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#f1c40f";
  ctx.font = "bold 28px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText(`Onda ${wave} concluída!`, canvas.width / 2, 80);
  ctx.fillStyle = "#fff";
  ctx.font = "16px sans-serif";
  ctx.fillText("Escolha uma melhoria:", canvas.width / 2, 110);

  const cards = upgradeCardRects();
  upgradeHover = -1;
  for (let i = 0; i < cards.length; i++) {
    const c = cards[i];
    const hover = mouseX >= c.x && mouseX <= c.x + c.w && mouseY >= c.y && mouseY <= c.y + c.h;
    if (hover) upgradeHover = i;
    ctx.fillStyle = hover ? "#3a3a5a" : "#2a2a3a";
    ctx.fillRect(c.x, c.y, c.w, c.h);
    ctx.strokeStyle = hover ? "#f1c40f" : "#555";
    ctx.lineWidth = hover ? 3 : 2;
    ctx.strokeRect(c.x, c.y, c.w, c.h);

    ctx.fillStyle = "#f1c40f";
    ctx.font = "bold 18px sans-serif";
    ctx.textAlign = "center";
    wrapText(upgradeChoices[i].name, c.x + c.w / 2, c.y + 50, c.w - 20, 22);
    ctx.fillStyle = "#ccc";
    ctx.font = "14px sans-serif";
    wrapText(upgradeChoices[i].desc, c.x + c.w / 2, c.y + 110, c.w - 24, 18);
  }
}

function wrapText(text, x, y, maxW, lineH) {
  const words = text.split(" ");
  let line = "";
  let yy = y;
  for (const w of words) {
    const test = line ? line + " " + w : w;
    if (ctx.measureText(test).width > maxW) {
      ctx.fillText(line, x, yy);
      line = w;
      yy += lineH;
    } else line = test;
  }
  if (line) ctx.fillText(line, x, yy);
}

function drawGameOver() {
  ctx.fillStyle = "rgba(0,0,0,0.8)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#e74c3c";
  ctx.font = "bold 42px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("VOCÊ MORREU", canvas.width / 2, canvas.height / 2 - 50);
  ctx.fillStyle = "#fff";
  ctx.font = "20px sans-serif";
  ctx.fillText(`Onda alcançada: ${wave}`, canvas.width / 2, canvas.height / 2);
  ctx.fillStyle = "#f1c40f";
  ctx.fillText(`Pontos: ${score}`, canvas.width / 2, canvas.height / 2 + 30);
  ctx.fillStyle = "#aaa";
  ctx.font = "16px sans-serif";
  ctx.fillText("Clique ou aperte R para reiniciar", canvas.width / 2, canvas.height / 2 + 80);
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// init
startWave(wave);
loop();
</script>

    text-align: center;
  }
