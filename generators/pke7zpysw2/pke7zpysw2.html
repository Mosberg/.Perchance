<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>pke7zpysw2 — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>






















<div style="display:flex; flex-direction:column; align-items:center; gap:10px; padding-top:50px; font-family:sans-serif;"> 
    <input id="inputEl" type="text" placeholder="type here..." style="padding:0px; font-size:18px;"> 
    <button id="flipBtn" onclick="flipText()" style="padding:0px 15px; cursor:pointer; font-size:18px;">flip! :D</button> 
    <button id="copyBtn" onclick="copyToClipboard()" style="padding:0px 5px; cursor:pointer; font-size:18px; transition: background 0.2s;">copy text</button>
    <div id="outputEl" style="font-size:18px; border:1px solid #ccc; padding:0px; width:500px; min-height:100px; background:#f9f9f9;"></div>

</div>

<script>
    // lookup table
    const flipMap = {
        ".": ".", "!": "!", "?": "؟", ",": ",", "a": "-", "b": "d", "c": "ɔ", "d": "b", "e": "ɘ", "f": "-", "g": "𝼁", "h": "-", "i": "i", "j": "-", "k": "𝼃", "l": "l", "m": "m", "n": "n", "o": "o", "p": "q", "q": "p", "r": "-", "s": "ƨ", "t": "-", "u": "ม", "v": "v", "w": "w", "x": "x", "y": "-", "z": "-", "&": "⅋", "1": "𐑛", "2": "↊", "3": "Ɛ", "4": "߈", "5": "ꯂ", "6": "9", "7": "ㄥ", "8": "8", "9": "6", "0": "0", "A": "A", "B": "ꓭ", "C": "Ɔ", "D": "ꓷ", "E": "Ǝ", "F": "ꟻ", "G": "⅁", "H": "H", "I": "I", "J": "ᒐ", "K": "ꓘ", "L": "⅃", "M": "M", "N": "N", "O": "O", "P": "ꟼ", "Q": "Ó", "R": "ꓤ", "S": "S", "T": "Ʇ", "U": "Ո", "V": "Ʌ", "W": "𐊰", "X": "X", "Y": "⅄", "Z": "Z", "'": ",", '"': "„", ";": "⸵", "(": ")", ")": "(", "[": "]", "]": "[", "{": "}", "}": "{", "<": ">", ">": "<", "_": "‾", "$": "$", "=": "=", "+": "+", "-": "-", "/": "/", "\\": "\\", "|": "|", "`": "‵", "~": "~", "@": "@", "#": "#", "%": "%", "^": "⌄", "*": "⁎" 
    };

    function flipText() { 
  let txt = inputEl.value; 
  
  // 1. Use Intl.Segmenter or standard map loops instead of split to protect multi-character diacritics
  let chars = [];
  for (let i = 0; i < txt.length; i++) {
    // If a character is followed by a combining diacritic marker, pull them together
    if (txt[i+1] && txt[i+1].match(/[\u0300-\u036f]/)) {
      chars.push(txt[i] + txt[i+1]);
      i++;
    } else {
      chars.push(txt[i]);
    }
  }
  
  // 2. Reverse array sequence order safely and reconstruct the text string
  let res = chars.reverse().map(char => flipMap[char] || char).join(''); 
  outputEl.textContent = res; 
} 

function copyToClipboard() {
  const textToCopy = outputEl.textContent;
  if (!textToCopy) return;

  navigator.clipboard.writeText(textToCopy).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = '✓ copied!';
    
    setTimeout(() => {
      btn.textContent = 'copy text';
    }, 2000);
  }).catch(err => {
    console.error('Failed to copy text: ', err);
  });
}
</script>

 




















</body>
</html>
