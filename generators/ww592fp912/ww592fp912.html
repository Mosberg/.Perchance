<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>ww592fp912 — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<h1>[pageTitle]</h1>
<p style="opacity:0.5; margin-bottom:1.7em;">[pageSubtitle]</p>

<main>
	<section>
		<p style="font-size:[fontSize]%; color:[fontColor]; margin:0; text-align:[textAlignment]">[output.selectMany(numberOfItems).joinItems(itemSeparator)]</p>
		<div style="margin-top:1em;">
			<button onclick="update()">[buttonText]</button>
			<input type="number" placeholder="how many?" oninput="numberOfItems = Number(this.value); if(this.value === '0' || this.value === '' || isNaN(numberOfItems)) { numberOfItems = 1; }" style="text-align:center; width: 7em;" />
		</div>
	</section>
	<section style="text-align:left; padding: 0.75em 1.5em;">
		["&lt;p>"+pageDescription.joinItems("&lt;/p>&lt;p>")+"&lt;/p>"] <!-- this is just some magic to format the lines into paragraphs -->
	</section>
	<p style="text-align:center; font-size:200%; opacity:0.2; margin-top:0.5em;"><span>⚄&#xFE0E;</span></p>
	<br>
</main>


<style>
	main {
		max-width:750px;
		margin:0 auto;
	}
	section {
		background:#fff;
		padding:1em;
		border-radius:3px;
		box-shadow: 0 0.5px 0 0 #ffffff inset, 0 1px 2px 0 #B3B3B3;
		margin-top:1em;
	}
	body {
		background-color:#f6f6f6;	
	}
</style>
</body>
</html>
