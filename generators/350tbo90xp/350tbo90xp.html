<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>350tbo90xp — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<style>
  :root {
    --bg: #0f1729;
    --bg2: #1a2440;
    --card: #1e2a4a;
    --accent: #4f9cf9;
    --accent2: #7c5cff;
    --text: #e8edf7;
    --muted: #8c9bc4;
    --good: #2ecc71;
    --border: #2a3658;
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body {
    background: linear-gradient(135deg, var(--bg) 0%, var(--bg2) 100%);
    color: var(--text);
    font-family: "Segoe UI", "Tahoma", "Cairo", sans-serif;
    margin: 0; padding: 0; min-height: 100vh;
    text-align: center;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 24px 16px 60px; }

  header h1 {
    font-size: 2rem; margin: 0 0 4px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  header p { color: var(--muted); margin: 0 0 24px; font-size: 0.92rem; }

  .dir-bar {
    display: flex; justify-content: center; gap: 8px; flex-wrap: wrap;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 6px; margin-bottom: 18px;
  }
  .dir-btn {
    background: transparent; border: none; color: var(--muted);
    padding: 8px 14px; border-radius: 8px; cursor: pointer;
    font-size: 0.92rem; font-weight: 600; transition: all 0.2s;
    font-family: inherit;
  }
  .dir-btn:hover { color: var(--text); background: rgba(255,255,255,0.04); }
  .dir-btn.active {
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    color: white; box-shadow: 0 4px 12px rgba(79,156,249,0.3);
  }

  .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 640px) { .panels { grid-template-columns: 1fr; } }

  .panel {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 14px; text-align: right;
    display: flex; flex-direction: column; min-height: 220px;
  }
  .panel-label {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 0.78rem; color: var(--muted); margin-bottom: 8px;
    font-weight: 600;
  }
  .panel textarea {
    flex: 1; width: 100%; background: transparent; border: none;
    color: var(--text); font-family: inherit; font-size: 1.05rem;
    resize: none; outline: none; line-height: 1.7; direction: rtl;
    min-height: 160px;
  }
  .panel.en textarea { direction: ltr; text-align: left; }
  .panel.en { text-align: left; }
  .out-box {
    flex: 1; min-height: 160px; font-size: 1.05rem; line-height: 1.7;
    direction: rtl; white-space: pre-wrap; overflow-wrap: break-word;
    color: var(--text);
  }
  .out-box.en { direction: ltr; text-align: left; }
  .out-box.placeholder { color: var(--muted); font-style: italic; }

  .actions { margin-top: 18px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
  .btn {
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    color: white; border: none; padding: 12px 28px; border-radius: 10px;
    cursor: pointer; font-size: 1rem; font-weight: 700; font-family: inherit;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 4px 16px rgba(79,156,249,0.35);
  }
  .btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 22px rgba(79,156,249,0.5); }
  .btn:disabled { opacity: 0.55; cursor: wait; }
  .btn.ghost {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    box-shadow: none; padding: 10px 18px; font-weight: 600;
  }
  .btn.ghost:hover { color: var(--text); border-color: var(--accent); }

  .loading {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,0.3); border-top-color: white;
    border-radius: 50%; animation: spin 0.7s linear infinite;
    vertical-align: middle; margin-left: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--good); color: white; padding: 10px 20px;
    border-radius: 10px; font-size: 0.9rem; font-weight: 600;
    opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 100;
  }
  .toast.show { opacity: 1; }

  .history { margin-top: 28px; text-align: right; }
  .history h3 {
    color: var(--muted); font-size: 0.95rem; margin: 0 0 10px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .hist-item {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; margin-bottom: 8px;
    cursor: pointer; transition: border-color 0.2s;
  }
  .hist-item:hover { border-color: var(--accent); }
  .hist-src { font-size: 0.82rem; color: var(--muted); margin-bottom: 4px; }
  .hist-dst { font-size: 0.95rem; color: var(--text); }
  .hist-empty { color: var(--muted); font-size: 0.85rem; font-style: italic; text-align: center; padding: 14px; }

  .char-count { font-size: 0.72rem; color: var(--muted); }
</style>

<header>
  <div class="wrap">
    <h1>محرك الترجمة الدقيق</h1>
    <p>ترجمة دقيقة بين الإنجليزية والعربية — مع كشف تلقائي للاتجاه</p>

    <div class="dir-bar">
      <button class="dir-btn" data-dir="auto" id="dirAutoBtn">🔁 تلقائي</button>
      <button class="dir-btn" data-dir="en-ar" id="dirEnArBtn">EN ← AR</button>
      <button class="dir-btn" data-dir="ar-en" id="dirArEnBtn">AR ← EN</button>
    </div>

    <div class="panels">
      <div class="panel en">
        <div class="panel-label">
          <span>Input</span>
          <span class="char-count" id="countEl">0</span>
        </div>
        <textarea id="inputEl" placeholder="اكتب أو الصق النص هنا... Type or paste text here..."></textarea>
      </div>
      <div class="panel">
        <div class="panel-label">
          <span>الترجمة</span>
          <button class="dir-btn" id="copyBtn" style="font-size:0.72rem; padding:4px 10px;">نسخ</button>
        </div>
        <div class="out-box placeholder" id="outputEl">ستظهر الترجمة هنا...</div>
      </div>
    </div>

    <div class="actions">
      <button class="btn" id="translateBtn">ترجم</button>
      <button class="btn ghost" id="clearBtn">مسح</button>
      <button class="btn ghost" id="swapBtn">↔ تبديل</button>
    </div>

    <div class="history">
      <h3>
        <span>آخر الترجمات</span>
        <button class="dir-btn" id="clearHistBtn" style="font-size:0.72rem; padding:4px 10px;">مسح الكل</button>
      </h3>
      <div id="histEl"></div>
    </div>
  </div>
</header>

<div class="toast" id="toastEl"></div>

<script>
(function() {
  if (window.__trInited) return;
  window.__trInited = true;

  let currentDir = localStorage.getItem("tr_dir") || "auto";
  let history = JSON.parse(localStorage.getItem("tr_hist") || "[]");
  let translating = false;

  function $(id){ return document.getElementById(id); }

  function setDir(d) {
    currentDir = d;
    localStorage.setItem("tr_dir", d);
    document.querySelectorAll(".dir-btn[data-dir]").forEach(b => {
      b.classList.toggle("active", b.dataset.dir === d);
    });
  }

  function applyDirUI() {
    document.querySelectorAll(".dir-btn[data-dir]").forEach(b => {
      b.classList.toggle("active", b.dataset.dir === currentDir);
    });
  }

  function showToast(msg) {
    let t = $("toastEl");
    if (!t) return;
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 1600);
  }

  function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}

  function renderHistory() {
    let histEl = $("histEl");
    if (!histEl) return;
    if (!history.length) {
      histEl.innerHTML = '<div class="hist-empty">لا توجد ترجمات بعد</div>';
      return;
    }
    histEl.innerHTML = history.slice(0, 12).map((h, i) =>
      `<div class="hist-item" data-i="${i}">
        <div class="hist-src">${escapeHtml(h.src).slice(0, 120)}${h.src.length>120?"…":""}</div>
        <div class="hist-dst">${escapeHtml(h.dst).slice(0, 160)}${h.dst.length>160?"…":""}</div>
      </div>`
    ).join("");
  }

  async function doTranslate() {
    let inputEl = $("inputEl");
    let outputEl = $("outputEl");
    let translateBtn = $("translateBtn");
    if (!inputEl || !outputEl || !translateBtn) return;
    let text = inputEl.value.trim();
    if (!text || translating) return;
    translating = true;
    translateBtn.disabled = true;
    translateBtn.innerHTML = 'جارٍ الترجمة<span class="loading"></span>';
    outputEl.classList.remove("placeholder", "en");
    outputEl.textContent = "";
    outputEl.dir = "rtl";

    let dir = root.pickDirection(currentDir, text);
    let instruction = root.translationInstruction(dir, text);
    let isEnOut = dir === "ar-en";

    try {
      let result = await root.generateText({
        instruction: instruction,
        startWith: "",
        onChunk: (data) => {
          let out = $("outputEl");
          if (!out) return;
          out.textContent = data.fullTextSoFar;
          out.dir = isEnOut ? "ltr" : "rtl";
          out.classList.toggle("en", isEnOut);
        }
      });
      let out = result.text.trim();
      let outEl = $("outputEl");
      if (outEl) {
        outEl.textContent = out;
        outEl.dir = isEnOut ? "ltr" : "rtl";
        outEl.classList.toggle("en", isEnOut);
      }
      history.unshift({ src: text, dst: out, dirOut: isEnOut ? "en" : "ar", t: Date.now() });
      history = history.slice(0, 50);
      localStorage.setItem("tr_hist", JSON.stringify(history));
      renderHistory();
    } catch (e) {
      let outEl = $("outputEl");
      if (outEl) {
        outEl.textContent = "حدث خطأ أثناء الترجمة: " + (e.message || e);
        outEl.style.color = "#ff6b6b";
      }
    } finally {
      translating = false;
      let btn = $("translateBtn");
      if (btn) { btn.disabled = false; btn.textContent = "ترجم"; }
      let outEl = $("outputEl");
      if (outEl) outEl.style.color = "";
    }
  }

  // ---- Event delegation (works even if perchance re-renders the DOM) ----
  document.addEventListener("click", async (e) => {
    let el = e.target.closest("[data-dir]");
    if (el) { setDir(el.dataset.dir); return; }

    if (e.target.id === "translateBtn") { await doTranslate(); return; }

    if (e.target.id === "copyBtn") {
      let out = $("outputEl");
      if (!out || out.classList.contains("placeholder") || !out.textContent) return;
      try { await navigator.clipboard.writeText(out.textContent); showToast("تم النسخ ✓"); }
      catch { showToast("تعذّر النسخ"); }
      return;
    }

    if (e.target.id === "clearBtn") {
      let inp = $("inputEl"), out = $("outputEl"), cnt = $("countEl");
      if (inp) inp.value = "";
      if (out) { out.textContent = "ستظهر الترجمة هنا..."; out.classList.add("placeholder"); out.classList.remove("en"); }
      if (cnt) cnt.textContent = "0";
      return;
    }

    if (e.target.id === "swapBtn") {
      let inp = $("inputEl"), out = $("outputEl"), cnt = $("countEl");
      if (!inp || !out) return;
      let outText = out.classList.contains("placeholder") ? "" : out.textContent;
      if (!outText) return;
      inp.value = outText;
      if (cnt) cnt.textContent = outText.length;
      out.textContent = "ستظهر الترجمة هنا...";
      out.classList.add("placeholder");
      out.classList.remove("en");
      let l = root.detectLang(outText);
      if (l === "ar") setDir("ar-en");
      else if (l === "en") setDir("en-ar");
      return;
    }

    if (e.target.id === "clearHistBtn") {
      history = [];
      localStorage.removeItem("tr_hist");
      renderHistory();
      showToast("تم مسح السجل");
      return;
    }

    let histItem = e.target.closest(".hist-item");
    if (histItem) {
      let h = history[parseInt(histItem.dataset.i)];
      if (!h) return;
      let inp = $("inputEl"), out = $("outputEl"), cnt = $("countEl");
      if (inp) inp.value = h.src;
      if (out) {
        out.textContent = h.dst;
        out.classList.remove("placeholder");
        out.dir = h.dirOut === "en" ? "ltr" : "rtl";
        out.classList.toggle("en", h.dirOut === "en");
      }
      if (cnt) cnt.textContent = h.src.length;
      return;
    }
  });

  document.addEventListener("input", (e) => {
    if (e.target.id === "inputEl") {
      let cnt = $("countEl");
      if (cnt) cnt.textContent = e.target.value.length;
    }
  });

  document.addEventListener("keydown", (e) => {
    if (e.target.id === "inputEl" && e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      doTranslate();
    }
  });

  // ---- Initialize UI once DOM is ready; re-apply if perchance re-renders ----
  function initUI() {
    applyDirUI();
    renderHistory();
    let cnt = $("countEl");
    let inp = $("inputEl");
    if (cnt && inp) cnt.textContent = inp.value.length;
  }

  // perchance may render asynchronously; poll briefly to catch re-renders.
  // (No MutationObserver — it loops because initUI mutates the DOM.)
  initUI();
  let tries = 0;
  let iv = setInterval(() => {
    initUI();
    if (++tries > 10) clearInterval(iv);
  }, 300);
})();
</script>
</script>

</body>
</html>
