let dragEl = null, startX = 0, startY = 0;
function startDrag(e) {
    if (!document.body.classList.contains('edit-mode')) return;
    dragEl = e.target.closest('.group'); if (!dragEl) return;
    const rect = dragEl.getBoundingClientRect();
    startX = e.clientX - rect.left; startY = e.clientY - rect.top;
    Object.assign(dragEl.style, { width: rect.width + 'px', height: rect.height + 'px', position: 'fixed', left: rect.left + 'px', top: rect.top + 'px' });
    dragEl.classList.add('dragging');
    const placeholder = document.createElement('div'); placeholder.id = 'drag-placeholder';
    Object.assign(placeholder.style, { width: rect.width + 'px', height: rect.height + 'px' });
    dragEl.after(placeholder); dragEl.setPointerCapture(e.pointerId);
    
    dragEl.onpointermove = (moveEvent) => {
        if (!dragEl) return;
        dragEl.style.left = (moveEvent.clientX - startX) + 'px'; dragEl.style.top = (moveEvent.clientY - startY) + 'px';
        const targetGroup = document.elementFromPoint(moveEvent.clientX, moveEvent.clientY)?.closest('.group');
        if (targetGroup && targetGroup !== dragEl && targetGroup.id !== 'drag-placeholder') {
            const children = [...box.querySelectorAll('.group, #drag-placeholder')];
            children.indexOf(placeholder) < children.indexOf(targetGroup) ? targetGroup.after(placeholder) : targetGroup.before(placeholder);
        }
    };
    dragEl.onpointerup = (upEvent) => {
        if (dragEl) {
            dragEl.releasePointerCapture(upEvent.pointerId);
            const placeholder = document.getElementById('drag-placeholder');
            if (placeholder) { placeholder.after(dragEl); placeholder.remove(); }
            Object.assign(dragEl.style, { position: '', width: '', height: '', left: '', top: '' });
            dragEl.classList.remove('dragging'); dragEl.onpointermove = dragEl.onpointerup = dragEl = null;
            sync();
        }
    };
}

        <button onclick="this.parentElement.parentElement.remove()">🗑 Delete</button>
        <p class="full-dl"></p>
      </div>`;
      
    s.prepend(card);

    pic.then((res)=>{
      const url = res.dataUrl;
      const mk = (label, fn) => { const b=document.createElement('button'); b.textContent=label; b.onclick=fn; return b; };
      card.querySelector('.full-dl').append(
        mk('⛶ Full', ()=>showFull(url)),
        mk('⬇ Download', ()=>dlImg(url,'vivid.png'))
      );
    });
  };
  window.showFull = (url) => {
    const ov = document.getElementById('fsOverlay');
    ov.innerHTML = `<img src="${url}">`;
    ov.hidden = false;
  };
  window.dlImg = (url, name='image.png') => {
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
  };
  
</script>

<button class="sidebar-btn" onclick="toggleSidebar(this)">☰</button>
<div class="sidebar">
  <div class="sidebar-content"><br>
    <a href="https://perchance.org/vivid-roleplay-chat" target="_blank">Vivid Roleplay Chat</a>

    <label>Ratio</label>
    <select onchange="d.resolution = this.value">
      <option value="512x768">2:3</option>
      <option value="768x512">3:2</option>
      <option value="512x512">1:1(s)</option>
      <option value="768x768">1:1(L)</option>
    </select>
    
    <label>Negative prompt</label>
    <textarea id="np">low quality, worst quality, bad anatomy, bad hands, text, watermark, blurry, deformed, extra limbs, missing fingers, cropped, lowres, ugly, out of frame, distorted face</textarea>
    
    <label>Guidance Scale (<span id="v">7</span>)</label>
    <input type="range" min="1" max="30" value="7" oninput="d.guidanceScale = this.value; v.textContent = this.value">    
  </div>
</div>

  .sidebar-content span { color: #00d4ff; font-weight: bold; }
  .sidebar-content input[type="text"], .sidebar-content select { height: 40px; border-radius: 8px; border: 1px solid #1a365d; padding: 10px; background: rgba(13, 27, 42, 0.8); color: #e2e8f0; outline: none; transition: 0.2s; }
  .sidebar-content input[type="text"]:focus, .sidebar-content select:focus { border-color: #00d4ff; box-shadow: 0 0 8px rgba(0, 212, 255, 0.3); }
  .sidebar-content input[type="range"] { accent-color: #00d4ff; background: #1a365d; height: 6px; border-radius: 3px; }
  .sidebar-btn { position: fixed; left: calc(var(--w) + 15px); top: 15px; transition: 0.2s; cursor: pointer; z-index: 1001; height: 38px; width: 38px; border-radius: 8px; border: 1px solid #3b2d54; background: linear-gradient(135deg, #1f1437, #0f0a1c); color: #d6bcfa; font-size: 16px; box-shadow: 0 0 10px rgba(157, 66, 248, 0.2); }
  .sidebar-btn:hover { border-color: #9f42f8; color: #fff; box-shadow: 0 0 15px rgba(157, 66, 248, 0.5); }
  #np{background: black;height: 160px; border-radius: 8px;}
</style>
<script>
  function toggleSidebar(btn) { 
    const open = document.body.style.getPropertyValue('--w') === '250px'; 
    document.body.style.setProperty('--w', open ? '0px' : '250px');
    btn.innerText = open ? '☰' : '✕';
  }
</script>
