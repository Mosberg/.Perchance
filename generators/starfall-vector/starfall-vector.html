  // Update bomb counter display
  function updateBombCounter() {
    bombCounterEl.textContent = `BOMBS: ${weapons.bomb.count}`;
  }
  
  // Game loop
  let lastTime = 0;
  let nextEnemySpawnTime = 0; // Track when to spawn next enemy group
  let lastEnemyFireTime = 0;  // Global cap: minimum gap between enemy shots
  
  function gameLoop(timestamp) {
    if (!gameRunning) return;
    
    const deltaTime = timestamp - lastTime;
    lastTime = timestamp;
    
    // Update procedural systems
    stageBuilder.update(deltaTime);
    adaptationAI.update(deltaTime, false, false);
    
    // Update biome
    updateBiome();
    
    // Apply screen shake (decays each frame)
    ctx.save();
    if (screenShake > 0.1) {
      ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
      screenShake *= 0.85;
    } else {
      screenShake = 0;
    }
    
    // Draw background
    currentBiome.background();
    
    // Draw background stars (first layer)
    for (let i = backgroundStars.length - 1; i >= 0; i--) {
      let star = backgroundStars[i];
      star.update();
      
      // Remove if off-screen
      if (star.x < -star.size) {
        backgroundStars.splice(i, 1);
        continue;
      }
      
      star.draw();
    }
    
    // Update and draw hazards
    for (let i = hazards.length - 1; i >= 0; i--) {
      let hazard = hazards[i];
      hazard.update();
      
      if (!hazard.active) {
        hazards.splice(i, 1);
        continue;
      }
      
      hazard.draw();
      
      // Check collision with player
      if (player.invuln <= 0 && hazard.checkCollision(player)) {
        hitPlayer();
      }
    }
    
    // Spawn enemies continuously at quick intervals
    if (timestamp >= nextEnemySpawnTime) {
      spawnEnemyGroup();
      // Set next spawn time to 2-5 seconds from now
      nextEnemySpawnTime = timestamp + 2000 + Math.random() * 3000;
    }
    
    // Spawn hazards and bosses from segments (but not regular enemies)
    const currentSegment = stageBuilder.getCurrentSegment();
    if (currentSegment) {
      const segment = currentSegment.segment;
      
      // Only spawn hazards and bosses from segments (not regular enemies)
      for (const hazard of segment.hazardZones) {
        if (Math.abs(currentSegment.relativePosition - hazard.x) < 5 && Math.random() < 0.01) {
          if (hazard.type === 'laserWall') {
            hazards.push(new LaserWall(hazard.x, hazard.width, hazard.gapY, hazard.gapHeight));
          } else if (hazard.type === 'asteroid') {
            hazards.push(new Asteroid(hazard.x, hazard.y, hazard.size));
          }
        }
      }
    }
    
    // Additionally, spawn star particles at random intervals throughout the stage
    if (Math.random() < 0.02) { // Increased from 0.005 to 0.02 (4x more frequent)
      backgroundStars.push(new StarEnemy());
    }
    
    // Update and draw enemies
    for (let i = particles.length - 1; i >= 0; i--) {
      let enemy = particles[i];
      enemy.update();
      
      // Remove if off-screen
      if (enemy.x < -enemy.size) {
        particles.splice(i, 1);
        continue;
      }
      
      // Draw enemy
      enemy.draw();
      
      // Check if enemy should shoot (global cap prevents whole groups firing at once)
      let globalEnemyFireCap = lastEnemyFireTime + 350;
      if (timestamp >= globalEnemyFireCap && enemy.shouldShoot(timestamp)) {
        let bullet = enemy.createBullet();
        enemyProjectiles.push(bullet);
        lastEnemyFireTime = timestamp;
      }
      
      // Check collision with player
      if (player.invuln <= 0 && checkCollision(player, enemy)) {
        hitPlayer();
      }
      
      // Check collision with projectiles
      for (let j = projectiles.length - 1; j >= 0; j--) {
        let projectile = projectiles[j];
        
        // Skip if projectile is an explosion (AltBomb)
        if (projectile.exploded !== undefined && projectile.exploded) continue;
        // Lasers and OvalBullets handle their own collision in their update() — skip to avoid double hits
        if (projectile instanceof Laser) continue;
        if (projectile instanceof OvalBullet) continue;
        
        if (checkProjectileCollision(projectile, enemy)) {
          particles.splice(i, 1);
          
          // Play enemy explosion sound
          enemyExplosionSound.currentTime = 0;
          enemyExplosionSound.play().catch(e => console.log("Enemy explosion sound failed:", e));
          
          // Remove projectile if it's not a laser (lasers persist)
          if (!(projectile instanceof Laser)) {
            projectiles.splice(j, 1);
          }
          
          score += 10;
          scoreEl.textContent = `SCORE: ${score}`;
          
          // Track hits for AI adaptation
          adaptationAI.update(0, false, true);
          
          // Screen shake & feedback
          shake(4);
          floatingTexts.push(new FloatingText(enemy.x, enemy.y, '+10', '#ff0'));
          
          // Create explosion particles (richer bursts)
          for (let k = 0; k < 8; k++) {
            explosions.push(new ExplosionParticle(enemy.x, enemy.y));
          }
          
          // Small chance to spawn powerup from defeated enemy
          if (Math.random() < 0.05 * adaptationAI.adaptationFactors.powerUpDropRate) {
            powerUps.push(new PowerUp());
          }
          
          break;
        }
      }
    }
    
    // Update and draw enemy projectiles
    for (let i = enemyProjectiles.length - 1; i >= 0; i--) {
      let bullet = enemyProjectiles[i];
      bullet.update();
      
      // Remove if off-screen
      if (bullet.isOffScreen()) {
        enemyProjectiles.splice(i, 1);
        continue;
      }
      
      bullet.draw();
      
      // Check collision with player
      if (player.invuln <= 0 && checkEnemyBulletCollision(player, bullet)) {
        hitPlayer();
      }
    }
    
    // Update and draw projectiles
    for (let i = projectiles.length - 1; i >= 0; i--) {
      let projectile = projectiles[i];
      
      if (!projectile.update()) {
        projectiles.splice(i, 1);
        continue;
      }
      
      projectile.draw();
      
      // Remove projectiles that are off-screen
      if (projectile.x > canvas.width || projectile.x < 0 || 
          projectile.y > canvas.height || projectile.y < 0) {
        if (!(projectile instanceof Laser)) {
          projectiles.splice(i, 1);
        }
      }
    }
    
    // Update and draw power-ups
    for (let i = powerUps.length - 1; i >= 0; i--) {
      let powerUp = powerUps[i];
      powerUp.update();
      
      // Remove if off-screen
      if (powerUp.x < -powerUp.size) {
        powerUps.splice(i, 1);
        continue;
      }
      
      powerUp.draw();
      
      // Check collision with player - use center of ship for accurate collision
      if (checkPowerUpCollision(player, powerUp)) {
        powerUps.splice(i, 1);
        applyPowerUp(powerUp.type);
      }
    }
    
    // Update and draw explosion particles
    for (let i = explosions.length - 1; i >= 0; i--) {
      let explosion = explosions[i];
      
      if (!explosion.update()) {
        explosions.splice(i, 1);
        continue;
      }
      
      explosion.draw();
    }
    
    // Handle player input (with banking tilt)
    player.targetTilt = 0;
    if (keys['ArrowUp'] || keys['KeyW']) { player.y -= player.speed; player.targetTilt = -0.25; }
    if (keys['ArrowDown'] || keys['KeyS']) { player.y += player.speed; player.targetTilt = 0.25; }
    if (keys['ArrowLeft'] || keys['KeyA']) player.x -= player.speed;
    if (keys['ArrowRight'] || keys['KeyD']) player.x += player.speed;
    
    // Keep player on screen
    player.x = Math.max(player.width/2, Math.min(canvas.width - player.width/2, player.x));
    player.y = Math.max(player.height/2, Math.min(canvas.height - player.height/2, player.y));
    
    // Auto-fire with space bar (with cooldown)
    if (keys['Space'] && timestamp - lastFireTime > fireCooldown) {
      fireWeapon();
      lastFireTime = timestamp;
    }
    
    // Drone auto-fire (missiles only) - balanced: cooldown & salvo size scale with level
    // Lv1: 1 missile / 1.8s, Lv2: 1 missile / 1.3s, Lv3: 2 missiles / 1.6s (staggered)
    let droneCd = weapons.drone.missileLevel >= 3 ? 1600
                : weapons.drone.missileLevel === 2 ? 1300
                : 1800;
    if (weapons.drone.layer > 0 && weapons.drone.missileLevel > 0 &&
        timestamp - lastDroneFireTime > droneCd) {
      // Count currently live missiles to cap concurrency (prevents missile spam)
      let liveMissiles = projectiles.filter(p => p instanceof Missile).length;
      const maxConcurrent = 2 + weapons.drone.missileLevel; // Lv1=3, Lv2=4, Lv3=5
      if (liveMissiles < maxConcurrent && particles.length > 0) {
        // Salvo size: Lv1 & Lv2 fire 1, Lv3 fires 2 (staggered via slight offset)
        let salvo = weapons.drone.missileLevel >= 3 ? 2 : 1;
        // Sort enemies by distance and assign each missile a DISTINCT nearest target
        let sorted = [...particles].sort((a, b) =>
          Math.hypot(a.x - player.x, a.y - player.y) - Math.hypot(b.x - player.x, b.y - player.y));
        let assigned = new Set();
        for (let i = 0; i < salvo && i < sorted.length; i++) {
          // pick the next-nearest unassigned target
          let tgt = null;
          for (let e of sorted) {
            if (!assigned.has(e)) { tgt = e; assigned.add(e); break; }
          }
          if (!tgt) break;
          let droneY = i % 2 === 0 ? player.y - 15 : player.y + 15;
          let droneX = i % 2 === 0 ? player.x - 20 : player.x - 20;
          projectiles.push(new Missile(droneX, droneY, tgt));
        }
      }
      lastDroneFireTime = timestamp;
    }
    
    // Draw player
    player.draw();
    
    // Update and draw floating texts (score popups)
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
      let ft = floatingTexts[i];
      if (!ft.update()) { floatingTexts.splice(i, 1); continue; }
      ft.draw();
    }
    
    // End screen-shake transform
    ctx.restore();
    
    // Update weapon display - show current weapon, shield, and drone status
    let w = weapons[currentWeapon];
    let weaponText = `WEAPON: ${w.name} Lv${w.layer !== undefined ? w.layer : (w.count !== undefined ? w.count : 0)}`;
    if (weapons.drone.layer > 0) {
      weaponText += ` | Drone Lv${weapons.drone.layer}`;
    }
    weaponEl.textContent = weaponText;
    updateShieldDisplay();
    
    requestAnimationFrame(gameLoop);
  }
  
  // Spawn enemy group continuously
  function spawnEnemyGroup() {
    // Get current biome
    const currentBiomeName = stageBuilder.currentBiome;
    
    // Define enemy types for each biome
    const biomeEnemyTypes = {
      space: ['rtype_fighter', 'space_asteroid', 'space_alien_ship', 'space_snake', 'space_comet', 'space_drone'],
      mecha: ['rtype_fighter', 'mecha_gear', 'mecha_drone', 'mecha_spider', 'mecha_turret'],
      bio: ['bio_cell', 'bio_spore', 'bio_tentacle', 'bio_mutant', 'bio_parasite', 'bio_virus'],
      astral: ['rtype_fighter', 'astral_crystal', 'astral_wisp', 'astral_phantom'],
      cyber: ['rtype_fighter', 'cyber_drone', 'cyber_sentinel', 'cyber_virus']
    };
    
    // Get enemy types for current biome
    const enemyTypes = biomeEnemyTypes[currentBiomeName] || biomeEnemyTypes.space;
    
    // Randomly select an enemy type
    const enemyType = enemyTypes[Math.floor(Math.random() * enemyTypes.length)];
    
    // Get enemy class
    const EnemyClass = getEnemyClassByType(enemyType);
    if (!EnemyClass) return;
    
    // Spawn random number of enemies (3-10 per group)
    const groupSize = 3 + Math.floor(Math.random() * 8);
    
    // R-Type fighter formations fly in coordinated sine/dive waves
    if (enemyType === 'rtype_fighter') {
      const formationPatterns = ['sine', 'sine', 'dive', 'circle', 'zigzag'];
      const pattern = formationPatterns[Math.floor(Math.random() * formationPatterns.length)];
      const baseY = 80 + Math.random() * (canvas.height - 160);
      const direction = Math.random() < 0.5 ? 1 : -1; // wave up or down
      for (let i = 0; i < groupSize; i++) {
        const enemy = new EnemyClass({ pattern });
        enemy.x = canvas.width + i * 70 + Math.random() * 30;
        enemy.baseY = baseY;
        enemy.y = baseY;
        // stagger phase so the formation ripples like a snake
        enemy.phase = i * 0.6;
        enemy.amplitude = (50 + Math.random() * 30) * direction;
        enemy.circleAngle = i * 0.5;
        particles.push(enemy);
      }
      return;
    }
    
    for (let i = 0; i < groupSize; i++) {
      const enemy = new EnemyClass();
      
      // Position enemies at right side of screen with some spread
      enemy.x = canvas.width + Math.random() * 100;
      
      // Ensure enemies spawn within screen bounds vertically
      enemy.y = enemy.size + Math.random() * (canvas.height - enemy.size * 2);
      enemy.baseY = enemy.y; // keep baseY in sync for patterned movement
      
      // Star enemies go to background array, others to particles array
      if (EnemyClass === StarEnemy) {
        backgroundStars.push(enemy);
      } else {
        particles.push(enemy);
      }
    }
  }
  
  // Helper function to get enemy class by type
  function getEnemyClassByType(type) {
    switch (type) {
      // Space enemies
      case 'star': return StarEnemy;
      case 'rtype_fighter': return RTypeFighterEnemy;
      case 'space_asteroid': return SpaceAsteroidEnemy;
      case 'space_alien_ship': return SpaceAlienShipEnemy;
      case 'space_snake': return SpaceSnakeEnemy;
      case 'space_comet': return SpaceCometEnemy;
      case 'space_drone': return SpaceDroneEnemy;
      
      // Mecha enemies
      case 'mecha_gear':
      case 'mecha_drone':
      case 'mecha_spider':
      case 'mecha_turret': return MechaEnemy;
      
      // Bio enemies
      case 'bio_cell': return BioEnemy;
      case 'bio_spore': return BioSporeEnemy;
      case 'bio_tentacle': return BioTentacleEnemy;
      case 'bio_mutant': return BioMutantEnemy;
      case 'bio_parasite': return BioParasiteEnemy;
      case 'bio_virus': return BioVirusEnemy;
      
      // Astral enemies
      case 'astral_crystal':
      case 'astral_wisp':
      case 'astral_phantom': return AstralEnemy;
      
      // Cyber enemies
      case 'cyber_drone':
      case 'cyber_sentinel':
      case 'cyber_virus': return CyberEnemy;
      
      default: return StarEnemy;
    }
  }
  
  // Collision detection functions
  function checkCollision(player, enemy) {
    let dx = player.x - enemy.x;
    let dy = player.y - enemy.y;
    let distance = Math.sqrt(dx * dx + dy * dy);
    return distance < enemy.size + Math.max(player.width, player.height) / 2;
  }
  
  function checkProjectileCollision(projectile, enemy) {
    // For laser, check if enemy is within beam path
    if (projectile instanceof Laser) {
      return enemy.x >= projectile.startX && 
             enemy.x <= projectile.endX && 
             Math.abs(enemy.y - projectile.y) <= enemy.size + projectile.height/2;
    }
    
    // For other projectiles, use distance-based collision
    let dx = projectile.x - enemy.x;
    let dy = projectile.y - enemy.y;
    let distance = Math.sqrt(dx * dx + dy * dy);
    return distance < enemy.size + Math.max(projectile.width || projectile.radius, projectile.height || projectile.radius) / 2;
  }
  
  function checkPowerUpCollision(player, powerUp) {
    // Use center of ship for accurate collision detection
    let playerCenterX = player.x + player.width/2;
    let playerCenterY = player.y;
    
    let dx = playerCenterX - powerUp.x;
    let dy = playerCenterY - powerUp.y;
    let distance = Math.sqrt(dx * dx + dy * dy);
    return distance < powerUp.size + Math.max(player.width, player.height) / 2;
  }
  
  function checkEnemyBulletCollision(player, bullet) {
    let dx = player.x - bullet.x;
    let dy = player.y - bullet.y;
    let distance = Math.sqrt(dx * dx + dy * dy);
    return distance < bullet.size + Math.max(player.width, player.height) / 2;
  }
  
  // Apply power-up effect
  function applyPowerUp(type) {
    // Shield is independent - doesn't revert other weapons
    if (type === 'shield') {
      weapons.shield.level = Math.min(3, weapons.shield.level + 1);
      updateShieldDisplay();
      floatingTexts.push(new FloatingText(player.x + player.width/2, player.y - 30,
        `SHIELD Lv${weapons.shield.level}!`, '#3ff'));
      return;
    }
    
    // Bomb is independent
    if (type === 'bomb') {
      weapons.bomb.count = Math.min(3, weapons.bomb.count + 1);
      updateBombCounter();
      return;
    }
    
    // Drone is independent (secondary weapon)
    if (type === 'drone') {
      weapons.drone.layer = Math.min(3, weapons.drone.layer + 1);
      weapons.drone.missileLevel = Math.min(3, weapons.drone.missileLevel + 1);
      return;
    }
    
    // Standard weapons: collecting one reverts ALL other standard weapons to level 0/1
    if (standardWeapons.includes(type)) {
      for (let w of standardWeapons) {
        if (w !== type) {
          weapons[w].layer = (w === 'bullet') ? 1 : 0; // bullet starts at 1, others at 0
        }
      }
      // Upgrade the collected weapon (bullet starts at 1, so cap differs)
      let maxLevel = 5;
      if (weapons[type].layer === 0) weapons[type].layer = 1; // first pickup activates
      else weapons[type].layer = Math.min(maxLevel, weapons[type].layer + 1);
      currentWeapon = type;
      const wpnColors = { bullet: '#0ff', laser: '#f0f', helix: '#0fa', oval: '#fa0', curve: '#f8f' };
      floatingTexts.push(new FloatingText(player.x + player.width/2, player.y - 30,
        `${weapons[type].name} Lv${weapons[type].layer}!`, wpnColors[type] || '#ff0'));
    }
  }
  
  // Handle player hit - shield absorbs damage, otherwise game over
  function hitPlayer() {
    if (player.invuln > 0) return;
    if (weapons.shield.level > 0) {
      weapons.shield.level--;
      updateShieldDisplay();
      player.invuln = 60; // brief invulnerability after shield absorbs a hit
      shake(10);
      floatingTexts.push(new FloatingText(player.x + player.width/2, player.y - 20,
        weapons.shield.level > 0 ? `SHIELD! (${weapons.shield.level} left)` : 'SHIELD BROKEN!', '#3ff'));
      // Shield break burst
      for (let i = 0; i < 12; i++) {
        explosions.push(new ExplosionParticle(player.x + player.width/2, player.y));
      }
    } else {
      gameOver();
    }
  }
  
  // Game over
  function gameOver() {
    gameRunning = false;
    gameOverEl.innerHTML = "GAME OVER<br><span style='font-size:20px;'>Press SPACE to restart</span>";
    gameOverEl.hidden = false;
    adaptationAI.playerStats.deaths++;
    shake(20);
    // Big explosion at player position
    for (let i = 0; i < 30; i++) {
      explosions.push(new ExplosionParticle(player.x + player.width/2, player.y));
    }
    floatingTexts.push(new FloatingText(player.x + player.width/2, player.y, 'GAME OVER', '#f33'));
    
    // Pause all music when game is over
    spaceMusic.pause();
    mechaMusic.pause();
    bioMusic.pause();
    astralMusic.pause();
    cyberMusic.pause();
  }
  
  // Reset game
  function resetGame() {
    gameRunning = true;
    gameOverEl.hidden = true; // Hide the start screen
    score = 0;
    scoreEl.textContent = `SCORE: ${score}`;
    
    // Reset player position
    player.x = 100;
    player.y = canvas.height / 2;
    player.tilt = 0;
    player.targetTilt = 0;
    player.invuln = 90; // brief spawn protection
    
    // Clear game objects
    particles = [];
    projectiles = [];
    powerUps = [];
    explosions = [];
    hazards = [];
    backgroundStars = [];
    enemyProjectiles = []; // Reset enemy projectiles array
    floatingTexts = []; // Reset score popups
    screenShake = 0;
    
    // Reset weapons
    weapons = {
      bullet: { layer: 1, name: "Bullet" },
      laser:  { layer: 0, name: "Laser" },
      helix:  { layer: 0, name: "Helix" },
      oval:   { layer: 0, name: "Oval" },
      curve:  { layer: 0, name: "Curve" },
      bomb:   { count: 0, name: "Bomb" },
      drone:  { layer: 0, name: "Drone", missileLevel: 0 },
      shield: { level: 0, name: "Shield" }
    };
    currentWeapon = 'bullet';
    updateBombCounter();
    updateShieldDisplay();
    
    // Reset fire times
    lastFireTime = 0;
    lastDroneFireTime = 0;
    
    // Reset procedural systems
    stageBuilder.stagePosition = 0;
    stageBuilder.currentBiome = 'space';
    stageBuilder.biomeProgress = 0;
    stageBuilder.generateStageSequence();
    
    // Mark all enemy groups as spawned to prevent segment-based spawning
    for (let segment of stageBuilder.currentStage) {
      if (segment.enemyGroups) {
        for (let group of segment.enemyGroups) {
          group.spawned = true;
        }
      }
    }
    
    // Reset AI
    adaptationAI.reset();
    
    // Reset biome
    currentBiomeIndex = 0;
    currentBiome = biomes[currentBiomeIndex];
    biomeEl.textContent = `BIOME: ${currentBiome.name}`;
    
    // Reset audioStarted flag
    audioStarted = false;
    
    // Reset enemy spawn timer - ensure same spawn rate on restart
    nextEnemySpawnTime = performance.now() + 2000 + Math.random() * 3000;
    
    // Start game loop
    lastTime = performance.now();
    requestAnimationFrame(gameLoop);
  }
  
  // Game will start when space is pressed (handled in keydown event)
</script>
</body>
