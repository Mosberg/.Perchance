<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>beaver58 — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<style>
  body { text-align: center; font-family: 'Trebuchet MS', sans-serif; background: #1a1a2e; color: #eee; margin: 0; padding: 20px; }
  h1 { color: #ffcc00; margin-bottom: 4px; }
  .subtitle { color: #888; margin-bottom: 18px; font-size: 14px; }
  #genBtn {
    background: #ffcc00; color: #1a1a2e; border: none; padding: 12px 28px;
    font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-bottom: 24px;
    transition: transform 0.1s, background 0.2s;
  }
  #genBtn:hover { background: #ffd633; }
  #genBtn:active { transform: scale(0.97); }
  #listCtn {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px; max-width: 1100px; margin: 0 auto; text-align: left;
  }
  .tower-card {
    background: #16213e; border: 2px solid #0f3460; border-radius: 10px;
    padding: 14px 16px; font-size: 15px; line-height: 1.4;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3); transition: border-color 0.2s, transform 0.1s;
  }
  .tower-card:hover { border-color: #ffcc00; transform: translateY(-2px); }
  .tower-num { color: #ffcc00; font-weight: bold; margin-right: 6px; }
</style>

<h1>🏗️ JToH Tower Name Generator</h1>
<div class="subtitle">From "Tower of A June Date" to "Obelisk of Oops, Failed That"</div>
<button id="genBtn">🎲 Generate 50 Tower Names</button>
<div id="listCtn"></div>

<script>
  function render() {
    let names = root.generateNames(50);
    let html = names.map((n, i) =>
      `<div class="tower-card"><span class="tower-num">${i + 1}.</span> ${n}</div>`
    ).join("");
    listCtn.innerHTML = html;
  }
  genBtn.addEventListener("click", render);
  render();
</script>

</body>
</html>
