<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%235b21b6%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22bold%22%3EP%3C/text%3E%3C/svg%3E">
  <title>ou4us4kmvo — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<div id="app">
  <div id="bg-container"></div>

  <!-- STAGE 1: PARTICIPANT EDITOR -->
  <div id="editor-stage" class="stage-editor">
    <h2 class="setup-title">⚙️ Settings</h2>
    
    <div class="input-block">
      <label>🎵 Song Title:</label>
      <input type="text" id="song-title-input" placeholder="e.g., Day6 – Shoot Me" />
    </div>
    
    <div class="input-block database-block">
      <h3>💾 Save / Load JSON</h3>
      <div class="save-action-row">
        <input type="text" id="group-save-name" placeholder="File name (optional)" />
        <button onclick="exportJSON()" class="action-btn-accent">💾 Save Members as JSON</button>
      </div>
      <div class="dropdown-row">
        <input type="file" id="json-load-file" accept=".json,application/json" style="display:none;" onchange="importJSON(event)" />
        <div class="group-buttons-stack">
          <button onclick="document.getElementById('json-load-file').click()" class="action-btn-primary">📂 Load JSON (Replace)</button>
          <button onclick="document.getElementById('json-merge-file').click()" class="action-btn-merge">🔀 Load JSON (Merge)</button>
          <input type="file" id="json-merge-file" accept=".json,application/json" style="display:none;" onchange="mergeJSON(event)" />
        </div>
      </div>
    </div>
    
    <div class="input-block formulation">
      <h3>➕ Add Member</h3>
      <input type="text" id="member-name" placeholder="Idol Name" />
      <input type="text" id="member-position" placeholder="Position (e.g., Main Vocalist)" />
      
      <div class="editor-row-fields">
        <div>
          <label>🎨 Color:</label>
          <input type="color" id="member-color" value="#ff007f" />
        </div>
        <div>
          <label>📸 Photo File:</label>
          <input type="file" id="member-photo" accept="image/*" onchange="preCachePhoto(this)" />
        </div>
      </div>
      <button onclick="addMember()" class="action-btn-success">➕ Add Member</button>
    </div>
    
    <div id="modifier-panel" class="input-block modifier-block hidden">
      <h3>✏️ Edit Member Properties</h3>
      <input type="hidden" id="edit-member-id" />
      <input type="text" id="edit-member-name" placeholder="Update Name" />
      <input type="text" id="edit-member-position" placeholder="Update Position" />
      <div class="editor-row-fields">
        <div>
          <label>New Color:</label>
          <input type="color" id="edit-member-color" />
        </div>
        <div>
          <label>New Photo File:</label>
          <input type="file" id="edit-member-photo" accept="image/*" onchange="preCacheEditPhoto(this)" />
        </div>
      </div>
      <div class="group-buttons-stack" style="margin-top:10px;">
        <button onclick="saveMemberEdits()" class="action-btn-primary">⚡ Save Changes</button>
        <button onclick="cancelMemberEdits()" style="background:#444!important;color:#fff!important;">Cancel</button>
      </div>
    </div>

    <div class="roster-header-row">
      <h3>📋 Current Roster:</h3>
      <button onclick="clearAll()" class="clear-all-btn">🗑️ Clear All</button>
    </div>
    <div id="editor-roster" class="roster-list"></div>

    <button onclick="start()" class="start-master-btn">🚀 Start Distribution</button>
  </div>
  
  <!-- STAGE 2: LIVE SIMULATION -->
  <div id="distribution-stage" class="stage-live hidden">
    <div class="video-container-9-16">
      <button id="floating-show-menu-btn" class="floating-toggle-btn hidden" onclick="toggleMenuVisibility()">☰ Show Menu</button>
      <h1 id="display-song-title">LINE DISTRIBUTION</h1>
      <div class="fairness-panel">Status: <span id="fairness-status" class="status-fair">FAIR</span></div>
      
      <!-- РЕЖИМ 1: ВЕРТИКАЛЬНЫЙ -->
      <div id="dist-workspace" class="lines-vertical-stack"></div>
      
      <!-- РЕЖИМ 2: КОМПАКТНЫЙ -->
      <div id="table-workspace" class="table-mode hidden"></div>
      
      <div id="collapsible-bottom-menu" class="bottom-menu-slider-wrapper">
        <div class="slider-viewport">
          <div class="slider-track" id="slider-track">
            
            <div class="control-slide slide-active">
              <div class="slider-wrapper">
                <label for="size-slider">🔍 Scale:</label>
                <input type="range" id="size-slider" min="0.6" max="1.4" step="0.05" value="1" oninput="scale(this.value)" />
                <button class="hide-menu-util-btn" onclick="setSlide(1)">🎤 Go to Pad ➔</button>
              </div>
              <div class="buttons-grid row-upper-controls">
                <button id="btn-toggle-mode" onclick="toggleDisplayMode()">LINE DISTRIBUTION STYLES: 1</button>
                <label for="bg-file-live" class="live-bg-label">🎬 Add Video/Photo</label>
                <input type="file" id="bg-file-live" accept="image/*,video/*" style="display:none;" onchange="handleBg(this)" />
                <button id="btn-togglemute" class="hidden" onclick="toggleMute()">🔇 Sound: OFF</button>
              </div>
              <div class="buttons-grid">
                <button onclick="resetAll()">🔄 Reset</button>
                <button onclick="edit()">✏️ Edit</button>
                <button onclick="exitAll()" class="danger-exit">⛔ Exit All</button>
              </div>
              <div class="pagination-indicator-dots"><span class="dot active"></span><span class="dot"></span></div>
            </div>

            <div class="control-slide">
              <div class="vocal-panel-header">
                <button class="nav-back-arrow-btn" onclick="setSlide(0)">⬅ Back</button>
                🎙️ VOCAL / LINES PANEL
              </div>
              <div id="vocal-grid-workspace" class="vocal-buttons-grid-layout"></div>
              <div class="pagination-indicator-dots"><span class="dot"></span><span class="dot active"></span></div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<style>
:root { --dark-overlay: rgba(10, 10, 12, 0.65); }
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; -webkit-tap-highlight-color: transparent; }
body { background-color: #08080a; color: #fff; overflow-x: hidden; }
#bg-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -2; pointer-events: none; }
#bg-container img, #bg-container video { width: 100%; height: 100%; object-fit: cover; }
.hidden { display: none !important; }
.stage-editor { max-width: 500px; margin: 20px auto; background: rgba(20, 20, 25, 0.95); padding: 20px; border-radius: 16px; border: 1px solid #333; }
.setup-title { text-align: center; margin-bottom: 15px; color: #ff007f; }
.input-block { background: #1a1a24; padding: 12px; border-radius: 10px; margin-bottom: 12px; }
.modifier-block { border: 2px solid #3498db !important; background: #1e1e2f !important; }
.input-block label { display: block; margin-bottom: 6px; font-size: 13px; color: #aaa; }
.input-block input[type="text"], .save-action-row input[type="text"] { width: 100%; padding: 10px; background: #0b0b11; border: 1px solid #444; color: #fff; border-radius: 6px; margin-bottom: 8px; }
.save-action-row { display: flex; flex-direction: column; gap: 8px; }
.dropdown-row { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
.group-buttons-stack { display: flex; flex-direction: column; gap: 8px; width: 100%; margin-top: 4px; }
.stage-editor button { width: 100%; font-size: 14px; border-radius: 8px; font-weight: 700; padding: 12px; border: none; cursor: pointer; transition: transform 0.1s; text-align: center; display: block; }
.action-btn-accent { background: #3498db !important; color: #fff !important; }
.action-btn-primary { background: #2ecc71 !important; color: #fff !important; }
.action-btn-merge { background: #e67e22 !important; color: #fff !important; }
.action-btn-success { background: #00b894 !important; color: #fff !important; margin-top: 10px; }
.database-block h3 { font-size: 14px; margin-bottom: 8px; color: #ff007f; }
select { width: 100%; padding: 10px; background: #0b0b11; border: 1px solid #444; color: #fff; border-radius: 6px; font-size: 14px; height: 42px; }
.editor-row-fields { display: flex; gap: 20px; margin-top: 10px; align-items: center; flex-wrap: wrap; }
input[type="color"] { border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; background: none; }
.start-master-btn { background: #6c5ce7 !important; color: white !important; width: 100%; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 8px; margin-top: 15px; }
.roster-header-row { display: flex; justify-content: space-between; align-items: center; margin: 15px 0 6px 0; }
.clear-all-btn { background: #d63031 !important; color: #fff !important; font-size: 11px !important; padding: 6px 12px !important; border-radius: 6px; font-weight: bold; border: none; width: auto !important; display: inline-block !important; }
.roster-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.editor-card { display: flex; align-items: center; justify-content: space-between; background: #242432; padding: 8px 12px; border-radius: 8px; flex-wrap: wrap; gap: 5px; }
.editor-card img { width: 35px; height: 35px; object-fit: cover; border-radius: 50%; }
.card-control-utility-grid { display: flex; gap: 6px; }
.btn-card-utility { background: #3498db !important; color: white !important; padding: 6px 12px !important; border-radius: 4px; font-size: 12px; width: auto !important; }
.btn-kill { background: #d63031 !important; color: white !important; padding: 6px 12px !important; border-radius: 4px; font-size: 12px; width: auto !important; }

/* LIVE STAGE */
.stage-live { display: flex; justify-content: center; align-items: center; min-height: 100vh; width: 100vw; }
.video-container-9-16 { width: 100%; max-width: 430px; height: 92vh; background: var(--dark-overlay); border-radius: 24px; border: 2px solid rgba(255, 255, 255, 0.1); box-shadow: 0 20px 50px rgba(0,0,0,0.8); backdrop-filter: blur(10px); padding: 20px 15px; display: flex; flex-direction: column; position: relative; overflow: hidden; }

#display-song-title { text-align: center; font-size: 18px; font-weight: 800; letter-spacing: 1px; margin-bottom: 6px; text-transform: uppercase; color: #fff; text-shadow: 0 0 12px rgba(255, 255, 255, 0.5) !important; }
.fairness-panel { text-align: center; font-size: 12px; font-weight: 700; text-transform: uppercase; margin-bottom: 12px; color: #aaa; }
.fairness-panel span { padding: 2px 8px; border-radius: 4px; font-weight: 900; text-transform: uppercase; }
.status-fair { color: #2ed573 !important; text-shadow: 0 0 8px rgba(46, 213, 115, 0.6) !important; }
.status-normal { color: #ffa502 !important; text-shadow: 0 0 8px rgba(255, 165, 2, 0.6) !important; }
.status-unfair { color: #ff4757 !important; text-shadow: 0 0 8px rgba(255, 71, 87, 0.6) !important; }

/* ===== РЕЖИМ 1: ВЕРТИКАЛЬНЫЙ ===== */
.lines-vertical-stack { flex-grow: 1; position: relative; overflow-y: auto; padding: 10px; --global-ui-scale: 1; }
.lines-vertical-stack .singer-row { position: absolute !important; left: 10px !important; display: flex !important; align-items: center !important; gap: 12px !important; width: calc(100% - 20px) !important; height: calc(52px * var(--global-ui-scale)) !important; transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.5s ease; user-select: none; -webkit-user-select: none; will-change: transform; }

.lines-vertical-stack .singer-interactive-zone { flex-grow: 1; cursor: pointer; min-width: 0; display: flex !important; flex-direction: column !important; justify-content: center !important; height: 100% !important; }
.lines-vertical-stack .singer-info { display: flex !important; justify-content: space-between !important; align-items: center !important; font-weight: 600 !important; margin-bottom: 4px !important; color: #ffffff !important; font-size: calc(13px * var(--global-ui-scale)) !important; transition: color 0.15s ease; }
.lines-vertical-stack .name-wrapper { display: flex !important; align-items: center !important; gap: 8px !important; min-width: 0; color: inherit !important; }
.lines-vertical-stack .name-wrapper span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: inherit !important; font-weight: 700; transition: color 0.15s ease; }
.lines-vertical-stack .idol-position-label { font-weight: 500 !important; font-style: italic !important; color: inherit !important; opacity: 0.85 !important; display: inline-block !important; transition: opacity 0.6s ease, transform 0.6s ease; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: calc(10px * var(--global-ui-scale)) !important; }
.lines-vertical-stack .idol-position-label.fade-out { opacity: 0 !important; transform: translateY(-3px); pointer-events: none; }

.lines-vertical-stack .bar-track { width: 100%; background: none !important; border-radius: 3px; overflow: hidden; height: calc(6px * var(--global-ui-scale)) !important; }
.lines-vertical-stack .bar-fill { height: 100%; width: 0%; border-radius: 3px; background-color: #ffffff; transition: width 0.3s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.15s ease, box-shadow 0.15s ease; }

@property --pie-percent { syntax: '<percentage>'; inherits: false; initial-value: 0%; }
.photo-frame { position: relative; width: calc(44px * var(--global-ui-scale)); height: calc(44px * var(--global-ui-scale)); cursor: pointer; flex-shrink: 0; border-radius: 50%; padding: 3px; background: conic-gradient(var(--pie-color, #ffffff) var(--pie-percent, 0%), rgba(255,255,255,0.12) var(--pie-percent, 0%)); transition: --pie-percent 0.4s cubic-bezier(0.22, 1, 0.36, 1), transform 0.5s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.5s ease; background-color: #14141c !important; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.photo-frame img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; background: #111; pointer-events: none; display: block; min-width: 100%; min-height: 100%; }

.lines-vertical-stack .singer-row.singing { color: var(--singing-color) !important; }
.lines-vertical-stack .singer-row.singing .singer-info { color: var(--singing-color) !important; }
.lines-vertical-stack .singer-row.singing .bar-fill { background-color: var(--singing-color) !important; background: var(--singing-color) !important; box-shadow: 0 0 10px var(--singing-color) !important; }
.lines-vertical-stack .singer-row.singing .photo-frame { transform: scale(1.08); box-shadow: 0 0 12px var(--singing-color) !important; }
.lines-vertical-stack .singer-row.disabled { opacity: 0.12; }

/* ===== РЕЖИМ 2: КОМПАКТНЫЙ ===== */
.table-mode { flex-grow: 1; overflow-y: auto; padding: 4px 6px; position: relative; --global-ui-scale: 1; }
#table-body { display: flex; flex-direction: column; position: relative; height: auto; }
.table-row { 
  display: flex; align-items: center; gap: 8px; padding: 4px 8px; 
  background: rgba(255,255,255,0.03); border-radius: 4px; 
  transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1), background 0.4s ease, opacity 0.4s ease;
  cursor: pointer; position: absolute; left: 0; right: 0; 
  height: calc(30px * var(--global-ui-scale)); 
  will-change: transform;
}
.table-row .t-number { 
  font-size: calc(10px * var(--global-ui-scale)); 
  font-weight: 700; 
  width: calc(20px * var(--global-ui-scale)); 
  flex-shrink: 0; 
  z-index: 1; 
  color: var(--row-color) !important;
  transition: color 0.15s ease;
}
.table-row .t-name { 
  flex: 1; 
  font-weight: 600; 
  font-size: calc(12px * var(--global-ui-scale)); 
  z-index: 1; 
  white-space: nowrap; 
  overflow: hidden; 
  text-overflow: ellipsis; 
  color: var(--row-color) !important;
  transition: color 0.15s ease;
}
.table-row .t-time { 
  font-weight: 700; 
  font-size: calc(12px * var(--global-ui-scale)); 
  font-variant-numeric: tabular-nums; 
  z-index: 1; 
  flex-shrink: 0; 
  color: var(--row-color) !important;
  transition: color 0.15s ease;
}
.table-row .t-bar-track { 
  position: absolute; 
  left: 0; 
  top: 0; 
  height: 100%; 
  width: 100%; 
  border-radius: 4px; 
  overflow: hidden; 
  background: rgba(255,255,255,0.04); 
}
.table-row .t-bar-fill { 
  height: 100%; 
  width: 0%; 
  border-radius: 4px; 
  background-color: var(--row-color, #666); 
  opacity: 0.15; 
  transition: width 0.3s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.4s ease, box-shadow 0.4s ease; 
}
.table-row.singing .t-bar-fill { 
  opacity: 0.35; 
  box-shadow: 0 0 15px var(--row-color); 
}
/* При пении — всё становится БЕЛЫМ */
.table-row.singing .t-number { 
  color: #ffffff !important; 
}
.table-row.singing .t-name { 
  color: #ffffff !important; 
}
.table-row.singing .t-time { 
  color: #ffffff !important; 
}
.table-row.disabled { 
  opacity: 0.2; 
}

/* ===== ВОКАЛЬНАЯ ПАНЕЛЬ - АВТОМАТИЧЕСКАЯ АДАПТАЦИЯ ===== */
.vocal-buttons-grid-layout { 
  display: grid; 
  grid-template-columns: repeat(auto-fill, minmax(55px, 1fr));
  gap: 4px; 
  overflow-y: auto; 
  max-height: 115px; 
  padding: 4px 2px 8px 2px; 
  align-content: start;
}
.vocal-tap-block { 
  background: #14141c; 
  border: 1px solid #2e2e3e; 
  border-radius: 4px; 
  height: 32px; 
  display: flex; 
  flex-direction: column; 
  justify-content: center; 
  align-items: center; 
  position: relative; 
  cursor: pointer; 
  font-weight: bold; 
  overflow: hidden; 
  transition: transform 0.15s ease, border-color 0.3s ease, background 0.3s ease, box-shadow 0.3s ease; 
  min-width: 0;
}
.vocal-tap-block:active { transform: scale(0.92); }
.vocal-tap-block .v-name { 
  font-size: 9px; 
  color: #fff; 
  max-width: 95%; 
  text-overflow: ellipsis; 
  white-space: nowrap; 
  overflow: hidden; 
  line-height: 1.1; 
  transition: color 0.3s ease; 
}
.vocal-tap-block .v-num { 
  position: absolute; 
  top: 1px; 
  right: 2px; 
  font-size: 6px; 
  background: rgba(255,255,255,0.1); 
  padding: 0px 2px; 
  border-radius: 2px; 
  color: #666; 
}
.vocal-buttons-grid-layout.super-compact .vocal-tap-block { 
  height: 24px !important; 
  border-radius: 3px; 
}
.vocal-buttons-grid-layout.super-compact .vocal-tap-block .v-name { 
  font-size: 7px !important; 
}
.vocal-buttons-grid-layout.super-compact .vocal-tap-block .v-num { 
  display: none; 
}
.vocal-tap-block.singing { 
  border-color: var(--v-color) !important; 
  background: rgba(255,255,255,0.06); 
  box-shadow: inset 0 0 8px var(--v-color); 
}
.vocal-tap-block.singing .v-name { 
  color: var(--v-color); 
}
.vocal-tap-block.disabled { 
  opacity: 0.15; 
}

/* ===== МЕНЮ ===== */
.bottom-menu-slider-wrapper { position: relative; margin-top: 15px; background: rgba(0,0,0,0.4); border-radius: 16px; border: 1px solid rgba(255,255,255,0.08); overflow: hidden; height: 160px; }
.slider-viewport { width: 100%; height: 100%; overflow: hidden; position: relative; }
.slider-track { display: flex; width: 200%; height: 100%; transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1); transform: translateX(0%); }
.control-slide { width: 50%; height: 100%; padding: 12px; display: flex; flex-direction: column; justify-content: center; gap: 8px; flex-shrink: 0; position: relative; }
.slider-wrapper { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: #ccc; font-weight: bold; }
.slider-wrapper input[type="range"] { flex: 1; margin: 0 10px; accent-color: #6c5ce7; }
.hide-menu-util-btn { background: #6c5ce7; color: #fff; border: none; border-radius: 4px; padding: 4px 10px; font-size: 11px; font-weight: bold; cursor: pointer; transition: transform 0.2s ease; }
.hide-menu-util-btn:active { transform: scale(0.95); }
.floating-toggle-btn { position: absolute; bottom: 15px; right: 15px; background: #6c5ce7; color: #fff; font-size: 12px; font-weight: bold; border: none; border-radius: 20px; padding: 8px 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 99; cursor: pointer; transition: transform 0.2s ease; }
.floating-toggle-btn:active { transform: scale(0.95); }
.buttons-grid { display: flex; gap: 6px; width: 100%; flex-wrap: wrap; }
.buttons-grid button, .buttons-grid .live-bg-label { flex: 1; padding: 9px 2px; background: rgba(255, 255, 255, 0.1); color: white; border-radius: 8px; font-size: 12px; font-weight: 600; border: none; cursor: pointer; text-align: center; display: inline-block; width: 100% !important; min-width: 60px; transition: transform 0.15s ease, background 0.3s ease; }
.buttons-grid button:active, .buttons-grid .live-bg-label:active { transform: scale(0.95); }
.buttons-grid button.danger-exit { background: rgba(214, 48, 49, 0.3); color: #ff7675; }
.row-upper-controls button { background: #222; border: 1px solid #444; }
.row-upper-controls button.active { background: rgba(255,255,255,0.15); border-color: #fff; }
.row-upper-controls .live-bg-label { background: #6c5ce7; }
.pagination-indicator-dots { display: flex; justify-content: center; gap: 5px; margin-top: 2px; position: absolute; bottom: 4px; left: 0; width: 100%; }
.pagination-indicator-dots .dot { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,0.2); transition: all 0.3s ease; }
.pagination-indicator-dots .dot.active { background: #6c5ce7; width: 14px; border-radius: 3px; }
.vocal-panel-header { display: flex; justify-content: center; align-items: center; position: relative; font-size: 11px; font-weight: bold; color: #aaa; margin-bottom: 2px; text-transform: uppercase; width: 100%; }
.nav-back-arrow-btn { position: absolute; left: -2px; top: -2px; background: rgba(255, 255, 255, 0.12); border: none; color: #fff; padding: 3px 10px; border-radius: 4px; font-size: 10px; font-weight: bold; cursor: pointer; transition: transform 0.2s ease, background 0.3s ease; }
.nav-back-arrow-btn:active { transform: scale(0.95); background: rgba(255,255,255,0.2); }
</style>

<script>
// ===== LINE DISTRIBUTION ENGINE =====
members = [];
autoSort = true;
timerInterval = null;
rafId = null;
lastUpdateTime = Date.now();
uiScaleFactor = 1.0;
defaultImg = "";
displayMode = 'vertical';

currentlySelectedBase64PhotoCache = defaultImg;
currentlySelectedBase64EditPhotoCache = defaultImg;

// ===== UTILITY =====
function calculateFairness() { 
  const act = members; 
  const el = document.getElementById('fairness-status'); 
  if (!el) return; 
  const tot = act.reduce(function(s, x) { return s + x.seconds; }, 0); 
  if (!tot || act.length <= 1) { 
    el.textContent = "FAIR"; 
    el.className = "status-fair"; 
    return; 
  } 
  const mean = tot / act.length; 
  let v = 0; 
  act.forEach(function(x) { v += Math.pow(x.seconds - mean, 2); }); 
  const sd = Math.sqrt(v / act.length); 
  const cv = sd / mean; 
  if (cv < 0.25) { 
    el.textContent = "FAIR"; 
    el.className = "status-fair"; 
  } else if (cv < 0.6) { 
    el.textContent = "NORMAL"; 
    el.className = "status-normal"; 
  } else { 
    el.textContent = "UNFAIR"; 
    el.className = "status-unfair"; 
  } 
}

// ===== PHOTO CACHE =====
function preCachePhoto(input) {
  if (!input || !input.files || input.files.length === 0) return;
  const reader = new FileReader();
  reader.onload = function(e) { currentlySelectedBase64PhotoCache = e.target.result; };
  reader.readAsDataURL(input.files[0]);
}

function preCacheEditPhoto(input) {
  if (!input || !input.files || input.files.length === 0) return;
  const reader = new FileReader();
  reader.onload = function(e) { currentlySelectedBase64EditPhotoCache = e.target.result; };
  reader.readAsDataURL(input.files[0]);
}

// ===== MEMBER MANAGEMENT =====
function addMember() {
  const nameIn = document.getElementById('member-name'); 
  const posIn = document.getElementById('member-position');
  const colIn = document.getElementById('member-color'); 
  if (!nameIn || !nameIn.value.trim()) return;
  members.push({ 
    id: 'm_' + Date.now() + Math.random().toString(36).substring(2,6), 
    name: nameIn.value.trim(), 
    position: posIn ? posIn.value.trim() : "", 
    color: colIn.value, 
    photo: currentlySelectedBase64PhotoCache, 
    seconds: 0, 
    isSinging: false, 
    isDisabled: false, 
    visualIndex: 0, 
    singingTimer: 0, 
    positionHidden: false 
  });
  renderEditorRoster();
  if (nameIn) nameIn.value = ''; 
  if (posIn) posIn.value = ''; 
  const photoIn = document.getElementById('member-photo');
  if (photoIn) photoIn.value = '';
  currentlySelectedBase64PhotoCache = defaultImg;
}

function killMember(id) { 
  members = members.filter(function(m) { return m.id !== id; }); 
  renderEditorRoster(); 
}

function clearAll() { 
  if (confirm("Clear roster?")) { 
    members = []; 
    renderEditorRoster(); 
  } 
}

function initiateEditMember(id) {
  const m = members.find(function(x) { return x.id === id; }); 
  if (!m) return;
  document.getElementById('edit-member-id').value = m.id; 
  document.getElementById('edit-member-name').value = m.name; 
  document.getElementById('edit-member-position').value = m.position; 
  document.getElementById('edit-member-color').value = m.color; 
  document.getElementById('edit-member-photo').value = '';
  currentlySelectedBase64EditPhotoCache = m.photo;
  document.getElementById('modifier-panel').classList.remove('hidden');
}

function saveMemberEdits() {
  const id = document.getElementById('edit-member-id').value; 
  const m = members.find(function(x) { return x.id === id; }); 
  if (!m) return;
  m.name = document.getElementById('edit-member-name').value.trim() || m.name; 
  m.position = document.getElementById('edit-member-position').value.trim(); 
  m.color = document.getElementById('edit-member-color').value; 
  m.photo = currentlySelectedBase64EditPhotoCache;
  renderEditorRoster(); 
  cancelMemberEdits();
}

function cancelMemberEdits() { 
  document.getElementById('modifier-panel').classList.add('hidden'); 
}

// ===== SAVE / LOAD GROUPS =====
function exportJSON() {
  if (members.length === 0) return alert("No members to save!");
  const nameIn = document.getElementById('group-save-name');
  const data = {
    app: "kpop-line-distribution",
    exportedAt: new Date().toISOString(),
    members: members.map(function(m) {
      return { name: m.name, position: m.position, color: m.color, photo: m.photo };
    })
  };
  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const base = (nameIn && nameIn.value.trim()) ? nameIn.value.trim() : 'kpop-members';
  const safe = base.replace(/[^a-z0-9_-]/gi, '_');
  a.download = safe + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  if (nameIn) nameIn.value = '';
}

function _parseJSONFile(file, cb) {
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      const arr = Array.isArray(data) ? data : data.members;
      if (!Array.isArray(arr)) { alert("Invalid JSON: no members found!"); return; }
      cb(arr);
    } catch(err) {
      alert("Failed to parse JSON file: " + err.message);
    }
  };
  reader.readAsText(file);
}

function _makeMember(m, idx, startIdx) {
  return {
    id: 'm_' + Date.now() + '_' + Math.random().toString(36).substring(2,6) + '_' + idx,
    name: m.name || "Unknown",
    position: m.position || "",
    color: m.color || "#ff007f",
    photo: m.photo || defaultImg,
    seconds: 0,
    isSinging: false,
    isDisabled: false,
    visualIndex: (startIdx || 0) + idx,
    singingTimer: 0,
    positionHidden: false
  };
}

function importJSON(event) {
  const input = event.target;
  if (!input || !input.files || input.files.length === 0) return;
  const file = input.files[0];
  _parseJSONFile(file, function(arr) {
    members = arr.map(function(m, idx) { return _makeMember(m, idx, 0); });
    renderEditorRoster();
    input.value = '';
    alert("Loaded " + members.length + " members!");
  });
}

function mergeJSON(event) {
  const input = event.target;
  if (!input || !input.files || input.files.length === 0) return;
  const file = input.files[0];
  _parseJSONFile(file, function(arr) {
    const startIdx = members.length;
    arr.forEach(function(m, idx) { members.push(_makeMember(m, idx, startIdx)); });
    renderEditorRoster();
    input.value = '';
    alert("Merged " + arr.length + " members! Total: " + members.length);
  });
}

// ===== RENDER EDITOR =====
function renderEditorRoster() {
  const container = document.getElementById('editor-roster'); 
  if (!container) return; 
  container.innerHTML = '';
  members.forEach(function(m) {
    const card = document.createElement('div'); 
    card.className = 'editor-card';
    const fallbackImg = m.photo || 'data:image/svg+xml;utf8,<svg xmlns="http://w3.org" width="100" height="100"><circle cx="50" cy="50" r="50" fill="%23333"/></svg>';
    card.innerHTML = '<div style="display:flex;align-items:center;gap:10px;"><img src="' + fallbackImg + '"><div><span style="color:' + m.color + ';font-weight:bold;">' + m.name + '</span>' + (m.position ? '<br><small style="color:#aaa">' + m.position + '</small>' : '') + '</div></div><div class="card-control-utility-grid"><button onclick="initiateEditMember(\'' + m.id + '\')" class="btn-card-utility">Edit</button><button onclick="killMember(\'' + m.id + '\')" class="btn-kill">Kill</button></div>';
    container.appendChild(card);
  });
}

// ===== SCALE =====
function scale(val) { 
  uiScaleFactor = parseFloat(val); 
  const stack = document.getElementById('dist-workspace'); 
  if (stack) stack.style.setProperty('--global-ui-scale', uiScaleFactor); 
  const table = document.getElementById('table-workspace');
  if (table) table.style.setProperty('--global-ui-scale', uiScaleFactor);
  sortVisuals(); 
  if (displayMode === 'table') renderTableMode();
}

// ===== BACKGROUND =====
function handleBg(input) { 
  if (!input || !input.files || input.files.length === 0) return;
  const file = input.files[0]; 
  const container = document.getElementById('bg-container'); 
  if (!container) return;
  const muteBtn = document.getElementById('btn-togglemute'); 
  container.innerHTML = '';
  const localBlobUrl = URL.createObjectURL(file);
  if (file.type.startsWith('video/')) {
    const video = document.createElement('video'); 
    video.id = "bg-video-element"; 
    video.src = localBlobUrl; 
    video.autoplay = true; 
    video.loop = true; 
    video.muted = true; 
    video.setAttribute('playsinline', 'true'); 
    video.setAttribute('webkit-playsinline', 'true'); 
    container.appendChild(video);
    video.play().then(function() { 
      if(muteBtn) { 
        muteBtn.classList.remove('hidden'); 
        muteBtn.textContent = "🔇 Sound: OFF"; 
        muteBtn.style.background = "rgba(255,255,255,0.1)"; 
      } 
    }).catch(function(err){ console.log(err); });
  } else { 
    if(muteBtn) muteBtn.classList.add('hidden'); 
    const img = document.createElement('img'); 
    img.src = localBlobUrl; 
    container.appendChild(img); 
  }
}

function toggleMute() {
  const video = document.getElementById('bg-video-element'); 
  const muteBtn = document.getElementById('btn-togglemute'); 
  if (!video || !muteBtn) return;
  if (video.muted) { 
    video.muted = false; 
    muteBtn.textContent = "🔊 Sound: ON"; 
    muteBtn.style.background = "#2ecc71"; 
  } else { 
    video.muted = true; 
    muteBtn.textContent = "🔇 Sound: OFF"; 
    muteBtn.style.background = "rgba(255,255,255,0.1)"; 
  }
}

// ===== ПЕРЕКЛЮЧЕНИЕ РЕЖИМОВ =====
function toggleDisplayMode() {
  const btn = document.getElementById('btn-toggle-mode');
  const vertical = document.getElementById('dist-workspace');
  const table = document.getElementById('table-workspace');
  
  if (displayMode === 'vertical') {
    displayMode = 'table';
    vertical.classList.add('hidden');
    table.classList.remove('hidden');
    btn.textContent = 'LINE DISTRIBUTION STYLES: 2';
    renderTableMode();
  } else {
    displayMode = 'vertical';
    table.classList.add('hidden');
    vertical.classList.remove('hidden');
    btn.textContent = 'LINE DISTRIBUTION STYLES: 1';
    renderDistributionWorkspace();
    sortVisuals();
  }
}

// ===== РЕНДЕР КОМПАКТНОГО РЕЖИМА =====
function renderTableMode() {
  const container = document.getElementById('table-workspace');
  if (!container) return;
  
  container.style.setProperty('--global-ui-scale', uiScaleFactor);
  
  let body = document.getElementById('table-body');
  if (!body) {
    container.innerHTML = '<div id="table-body"></div>';
    body = document.getElementById('table-body');
  }
  
  const sorted = [...members].sort(function(a, b) { return b.seconds - a.seconds; });
  const maxSeconds = Math.max(...members.map(function(x) { return x.seconds; }), 1);
  
  const existingIds = sorted.map(function(m) { return m.id; });
  const rows = body.querySelectorAll('.table-row');
  rows.forEach(function(row) {
    const id = row.id.replace('trow-', '');
    if (!existingIds.includes(id)) {
      row.remove();
    }
  });
  
  sorted.forEach(function(m, idx) {
    let row = document.getElementById('trow-' + m.id);
    if (!row) {
      row = document.createElement('div');
      row.id = 'trow-' + m.id;
      row.className = 'table-row';
      row.innerHTML = 
        '<div class="t-bar-track"><div class="t-bar-fill"></div></div>' +
        '<span class="t-number"></span>' +
        '<span class="t-name"></span>' +
        '<span class="t-time"></span>';
      row.addEventListener('click', function() {
        sing(m.id);
      });
      body.appendChild(row);
    }
    
    row.className = 'table-row';
    if (m.isSinging) row.classList.add('singing');
    if (m.isDisabled) row.classList.add('disabled');
    row.style.setProperty('--row-color', m.color);
    row.style.transform = 'translateY(' + (idx * 32 * uiScaleFactor) + 'px)';
    
    const percent = maxSeconds > 0 ? ((m.seconds / maxSeconds) * 100) : 0;
    row.querySelector('.t-bar-fill').style.width = percent + '%';
    row.querySelector('.t-number').textContent = idx + 1;
    row.querySelector('.t-name').textContent = m.name;
    row.querySelector('.t-time').textContent = m.seconds.toFixed(1) + 's';
  });
}

// ===== START =====
function start() { 
  if (members.length === 0) return alert("Add members first!"); 
  const sTitle = document.getElementById('song-title-input'); 
  document.getElementById('display-song-title').textContent = sTitle ? (sTitle.value.trim() || "LINE DISTRIBUTION") : "LINE DISTRIBUTION"; 
  document.getElementById('editor-stage').className = 'stage-editor hidden'; 
  document.getElementById('distribution-stage').className = 'stage-live'; 
  resetData(); 
  
  if (members.length > 12) {
    displayMode = 'table';
    document.getElementById('dist-workspace').classList.add('hidden');
    document.getElementById('table-workspace').classList.remove('hidden');
    document.getElementById('btn-toggle-mode').textContent = 'LINE DISTRIBUTION STYLES: 2';
  } else {
    document.getElementById('btn-toggle-mode').textContent = 'LINE DISTRIBUTION STYLES: 1';
  }
  
  renderDistributionWorkspace(); 
  renderVocalGridButtonsDeck(); 
  if (displayMode === 'table') renderTableMode();
  startTicker(); 
}

function startTicker() { 
  if (timerInterval) clearInterval(timerInterval); 
  if (rafId) cancelAnimationFrame(rafId);
  lastUpdateTime = Date.now(); 
  
  function tick() {
    const now = Date.now(); 
    const delta = (now - lastUpdateTime) / 1000; 
    lastUpdateTime = now; 
    let updated = false; 
    members.forEach(function(m) { 
      if (m.isSinging && !m.isDisabled) { 
        m.seconds += delta; 
        if (!m.positionHidden) { 
          m.singingTimer += delta; 
          if (m.singingTimer >= 10) { 
            m.positionHidden = true; 
            const lbl = document.getElementById('pos-' + m.id); 
            if (lbl) lbl.classList.add('fade-out'); 
          } 
        } 
        updated = true; 
      } 
    }); 
    if (updated) { 
      updateBarsAndTimers(); 
      calculateFairness(); 
      if (displayMode === 'table') renderTableMode();
    }
    rafId = requestAnimationFrame(tick);
  }
  rafId = requestAnimationFrame(tick);
}

// ===== RENDER VOCAL GRID =====
function renderVocalGridButtonsDeck() {
  const grid = document.getElementById('vocal-grid-workspace'); 
  if (!grid) return; 
  grid.innerHTML = '';
  
  const count = members.length;
  grid.className = 'vocal-buttons-grid-layout';
  
  if (count >= 25) {
    grid.classList.add('super-compact');
    grid.style.gridTemplateColumns = 'repeat(auto-fill, minmax(40px, 1fr))';
  } else if (count >= 18) {
    grid.style.gridTemplateColumns = 'repeat(auto-fill, minmax(45px, 1fr))';
  } else if (count >= 12) {
    grid.style.gridTemplateColumns = 'repeat(auto-fill, minmax(50px, 1fr))';
  } else if (count >= 8) {
    grid.style.gridTemplateColumns = 'repeat(auto-fill, minmax(55px, 1fr))';
  } else {
    grid.style.gridTemplateColumns = 'repeat(auto-fill, minmax(60px, 1fr))';
  }
  
  members.forEach(function(m, idx) {
    const block = document.createElement('div'); 
    block.id = 'vblk-' + m.id; 
    block.className = 'vocal-tap-block'; 
    block.style.setProperty('--v-color', m.color); 
    block.innerHTML = '<span class="v-num">' + (idx + 1) + '</span><span class="v-name">' + m.name + '</span>'; 
    if (m.isDisabled) block.classList.add('disabled');
    const triggerSing = function(e) { 
      e.preventDefault(); 
      sing(m.id); 
    };
    block.addEventListener('touchstart', triggerSing, { passive: false }); 
    block.addEventListener('mousedown', function(e) { 
      if (!('ontouchstart' in window)) triggerSing(e); 
    });
    grid.appendChild(block);
  });
}

function renderDistributionWorkspace() {
  const container = document.getElementById('dist-workspace'); 
  if (!container) return; 
  container.innerHTML = '';
  members.forEach(function(m) {
    const row = document.createElement('div'); 
    row.id = 'row-' + m.id; 
    row.className = m.isSinging ? 'singer-row singing' : 'singer-row'; 
    row.style.setProperty('--singing-color', m.color); 
    if(m.isDisabled) row.classList.add('disabled');
    const photoHtml = m.photo ? '<img src="' + m.photo + '">' : '';
    row.innerHTML = '<div id="frame-' + m.id + '" onclick="toggleDisable(\'' + m.id + '\')" class="photo-frame">' + photoHtml + '</div><div id="zone-' + m.id + '" class="singer-interactive-zone"><div class="singer-info"><div class="name-wrapper"><span>' + m.name + '</span>' + (m.position ? '<span id="pos-' + m.id + '" class="idol-position-label">' + m.position + '</span>' : '') + '</div><span id="time-' + m.id + '">0.0s</span></div><div class="bar-track"><div id="bar-' + m.id + '" class="bar-fill"></div></div></div>';
    container.appendChild(row);
    const fNode = row.querySelector('.photo-frame'); 
    if(fNode) fNode.style.setProperty('--pie-color', m.isSinging ? m.color : '#ffffff');
    const zone = row.querySelector('.singer-interactive-zone');
    const toggle = function(e) { 
      e.preventDefault(); 
      sing(m.id); 
    };
    zone.addEventListener('touchstart', toggle, { passive: false }); 
    zone.addEventListener('mousedown', function(e) { 
      if (!('ontouchstart' in window)) toggle(e); 
    });
  });
  updateBarsAndTimers();
}

function sing(id) { 
  const m = members.find(function(x) { return x.id === id; }); 
  if (!m || m.isDisabled) return; 
  m.isSinging = !m.isSinging; 
  updateRowTransform(m); 
  const blk = document.getElementById('vblk-' + id); 
  if (!blk) return; 
  if (m.isSinging) blk.classList.add('singing'); 
  else blk.classList.remove('singing'); 
  sortVisuals(); 
  if (displayMode === 'table') {
    renderTableMode();
  } else {
    const f = document.getElementById('frame-' + id);
    if (f) {
      f.style.setProperty('--pie-color', m.isSinging ? m.color : '#ffffff');
    }
  }
}

function updateRowTransform(m) { 
  const r = document.getElementById('row-' + m.id); 
  const f = document.getElementById('frame-' + m.id); 
  if (r && f) { 
    if (m.isSinging) { 
      r.classList.add('singing'); 
      f.style.setProperty('--pie-color', m.color); 
    } else { 
      r.classList.remove('singing'); 
      f.style.setProperty('--pie-color', '#ffffff'); 
    } 
  } 
}

function toggleDisable(id) { 
  const m = members.find(function(x) { return x.id === id; }); 
  if (!m) return; 
  m.isDisabled = !m.isDisabled; 
  m.isSinging = false; 
  const r = document.getElementById('row-' + id); 
  updateRowTransform(m); 
  if (m.isDisabled) r.classList.add('disabled'); 
  else r.classList.remove('disabled'); 
  const blk = document.getElementById('vblk-' + id); 
  if (blk) { 
    blk.classList.remove('singing'); 
    if (m.isDisabled) blk.classList.add('disabled'); 
    else blk.classList.remove('disabled'); 
  } 
  updateBarsAndTimers(); 
  calculateFairness(); 
  sortVisuals(); 
  if (displayMode === 'table') renderTableMode();
}

function updateBarsAndTimers() { 
  if (!members.length) return; 
  const max = Math.max(...members.map(function(x) { return x.seconds; }), 1); 
  members.forEach(function(m) { 
    const b = document.getElementById('bar-' + m.id); 
    const t = document.getElementById('time-' + m.id); 
    const f = document.getElementById('frame-' + m.id); 
    if (b && t && f) { 
      t.textContent = m.seconds.toFixed(1) + 's'; 
      const p = (m.seconds / max) * 100; 
      b.style.width = p + '%'; 
      f.style.setProperty('--pie-percent', p + '%'); 
      f.style.setProperty('--pie-color', m.isSinging ? m.color : '#ffffff'); 
    } 
  }); 
  sortVisuals(); 
  if (displayMode === 'table') renderTableMode();
}

function sortVisuals() { 
  const sorted = [...members].sort(function(a, b) { return b.seconds - a.seconds; }); 
  sorted.forEach(function(m, i) { 
    const row = document.getElementById('row-' + m.id); 
    if (row) { 
      row.style.transform = 'translateY(' + (i * 64 * uiScaleFactor) + 'px)'; 
    } 
  }); 
}

function resetData() { 
  members.forEach(function(m) { 
    m.seconds = 0; 
    m.isSinging = false; 
    m.isDisabled = false; 
    m.singingTimer = 0; 
    m.positionHidden = false; 
  }); 
}

function resetAll() { 
  resetData(); 
  renderDistributionWorkspace(); 
  renderVocalGridButtonsDeck(); 
  const v = document.getElementById('bg-video-element'); 
  if (v) { 
    v.currentTime = 0; 
    v.play().catch(function(e) {}); 
  } 
  if (displayMode === 'table') renderTableMode();
  sortVisuals();
}

function edit() { 
  if (timerInterval) clearInterval(timerInterval); 
  if (rafId) cancelAnimationFrame(rafId);
  document.getElementById('distribution-stage').className = 'stage-live hidden'; 
  document.getElementById('editor-stage').className = 'stage-editor'; 
  setTimeout(function() { 
    renderEditorRoster(); 
  }, 50); 
}

function exitAll() { 
  if (timerInterval) clearInterval(timerInterval); 
  if (rafId) cancelAnimationFrame(rafId);
  members = []; 
  const sTitle = document.getElementById('song-title-input'); 
  if (sTitle) sTitle.value = ''; 
  const roster = document.getElementById('editor-roster'); 
  if (roster) roster.innerHTML = ''; 
  const bg = document.getElementById('bg-container'); 
  if (bg) bg.innerHTML = ''; 
  edit(); 
}

function toggleMenuVisibility() { 
  const m = document.getElementById('collapsible-bottom-menu'); 
  const f = document.getElementById('floating-show-menu-btn'); 
  if (!m || !f) return; 
  if (m.classList.contains('hidden')) { 
    m.classList.remove('hidden'); 
    f.classList.add('hidden'); 
  } else { 
    m.classList.add('hidden'); 
    f.classList.remove('hidden'); 
  } 
}

function setSlide(idx) { 
  const t = document.getElementById('slider-track'); 
  if (t) t.style.transform = idx === 1 ? 'translateX(-50%)' : 'translateX(0%)'; 
}

// ===== INIT =====
renderEditorRoster();
</script>
</body>
</html>
