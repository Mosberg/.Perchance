  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>multi-gallery — Perchance</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <select id="generatorSelect" class="control"></select>
    <button id="openGeneratorButton" class="open-button" type="button" aria-label="Open selected generator in new tab" title="Open selected generator in new tab">
      <svg class="open-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M14 3h7v7h-2V6.41l-9.29 9.3-1.42-1.42 9.3-9.29H14V3Z"></path>
        <path d="M5 5h6v2H7v10h10v-4h2v6H5V5Z"></path>
      </svg>
    </button>
  </div>

  <div class="gallery-shell">
    <iframe
      id="galleryFrame"
      class="gallery-frame"
      src=""
      loading="lazy"
      referrerpolicy="no-referrer"
      allow="clipboard-write; fullscreen"
    ></iframe>
  </div>
</div>

<style>
  :root {
    --bg: #0b0f14;
    --panel: #11161d;
    --panel-2: #171d25;
    --border: #2b3442;
    --text: #e7edf5;
    --muted: #9aa4b2;
    --accent: #1d9bf0;
    --shadow: 0 10px 30px rgba(0,0,0,.25);
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
    width: 100%;
    min-height: 100vh;
  }

  #app {
    width: 100%;
    min-height: 100vh;
    background: var(--bg);
  }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 30;
    width: 100%;
    padding: 14px;
    display: flex;
    gap: 10px;
    align-items: center;
    background: linear-gradient(to bottom, rgba(11,15,20,.98), rgba(11,15,20,.92));
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    box-shadow: var(--shadow);
  }

  .control {
    flex: 1;
    min-width: 0;
    height: 48px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    padding: 0 14px;
    font-size: 16px;
    outline: none;
  }

  .control:focus {
    border-color: var(--accent);
  }

  .open-button {
    width: 48px;
    height: 48px;
    flex: 0 0 48px;
    display: grid;
    place-items: center;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--muted);
    cursor: pointer;
    outline: none;
  }

  .open-button:hover {
    color: var(--text);
    border-color: var(--accent);
  }

  .open-button:focus {
    border-color: var(--accent);
  }

  .open-icon {
    width: 23px;
    height: 23px;
    fill: currentColor;
  }

  .gallery-shell {
    width: 100%;
    height: calc(100vh - 77px);
    background: var(--panel);
  }

  .gallery-frame {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
    background: var(--panel);
  }

  @media (max-width: 640px) {
    .topbar {
      padding: 10px;
      gap: 8px;
    }

    .open-button {
      width: 48px;
      height: 48px;
      flex-basis: 48px;
    }

    .gallery-shell {
      height: calc(100vh - 69px);
    }
  }
</style>

<script>
  const PAGE_TITLE = "Multi Generator Gallery"
  const GALLERY_BASE = "https://image-generation.perchance.org/gallery"
  const GENERATOR_BASE = "https://perchance.org"
  const DEFAULT_SUBCHANNEL = "public"
  const DEFAULT_SORT = "recent"
  const GENERATORS = getGalleryGenerators()

  const els = {}

  function escapeHtml(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;")
  }

  function getGeneratorValue(generator) {
    if (typeof generator === "string") return generator
    return generator.value
  }

  function getGeneratorLabel(generator) {
    if (typeof generator === "string") return generator
    return generator.label || generator.value
  }

  function buildGalleryUrl(generator) {
    const params = new URLSearchParams({
      sort: DEFAULT_SORT,
      timeRange: "all-time",
      hideIfScoreIsBelow: "-999999",
      contentFilter: "none",
      subChannel: DEFAULT_SUBCHANNEL,
      channel: generator
    })

    return `${GALLERY_BASE}?${params.toString()}`
  }

  function buildGeneratorUrl(generator) {
    return `${GENERATOR_BASE}/${encodeURIComponent(generator)}`
  }

  function renderGeneratorOptions() {
    els.generatorSelect.innerHTML = GENERATORS.map(generator => {
      const value = getGeneratorValue(generator)
      const label = getGeneratorLabel(generator)

      return `<option value="${escapeHtml(value)}">${escapeHtml(label)}</option>`
    }).join("")
  }

  function loadSelectedGenerator() {
    const selectedGenerator = els.generatorSelect.value
    els.galleryFrame.src = buildGalleryUrl(selectedGenerator)
  }

  function openSelectedGenerator() {
    const selectedGenerator = els.generatorSelect.value
    window.open(buildGeneratorUrl(selectedGenerator), "_blank", "noopener,noreferrer")
  }

  function setupEvents() {
    els.generatorSelect.addEventListener("change", loadSelectedGenerator)
    els.openGeneratorButton.addEventListener("click", openSelectedGenerator)
  }

  function init() {
    document.title = PAGE_TITLE

    els.generatorSelect = document.getElementById("generatorSelect")
    els.galleryFrame = document.getElementById("galleryFrame")
    els.openGeneratorButton = document.getElementById("openGeneratorButton")

    renderGeneratorOptions()
    setupEvents()
    loadSelectedGenerator()
  }
